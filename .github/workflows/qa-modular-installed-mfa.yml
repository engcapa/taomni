name: QA Installed Linux MFA Upgrade

on:
  workflow_call:
    inputs:
      head: {type: string, required: true}
      package_run: {type: string, required: true}
      package_source: {type: string, required: true}
      package_version: {type: string, required: true}
      first_release: {type: boolean, default: false}
      first_release_version: {type: string, default: ''}
      verify_relocation: {type: boolean, default: false}
      verify_rdp_perf: {type: boolean, default: false}
      signed_run: {type: string, default: ''}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: {required: true}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: {required: false}

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUNBUFFERED: '1'

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.source.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - name: Select the candidate deb from its real release build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          PACKAGE_SOURCE: ${{ inputs.package_source }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          mkdir -p installed-mfa-input
          [[ "$PACKAGE_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > installed-mfa-input/producer.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN/artifacts?per_page=100" > installed-mfa-input/artifacts.json
          python .agents/skills/qa-ui-auto/scripts/modular_bundle_inventory.py validate-source \
            --run installed-mfa-input/producer.json --artifacts installed-mfa-input/artifacts.json \
            --repository "$GITHUB_REPOSITORY" --run-id "$PACKAGE_RUN" --source "$PACKAGE_SOURCE" \
            --version "$PACKAGE_VERSION" --target linux-x86_64 \
            --out installed-mfa-input/bundle-source.json --github-output "$GITHUB_OUTPUT"
      - name: Verify the source of an existing signed MFA artifact
        if: inputs.signed_run != '' && !inputs.first_release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN: ${{ inputs.signed_run }}
        run: |
          [[ "$SIGNED_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN" > installed-mfa-input/signed-producer.json
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg run "$SIGNED_RUN" '
            (.id | tostring) == $run and .status == "completed" and .conclusion == "success" and
            .event == "workflow_dispatch" and .path == ".github/workflows/qa-modular-upgrade.yml" and
            .repository.full_name == $repo and .head_repository.full_name == $repo
          ' installed-mfa-input/signed-producer.json
      - uses: actions/upload-artifact@v4
        with:
          name: installed-mfa-input-${{ github.run_id }}
          path: installed-mfa-input/
          if-no-files-found: error

  signed-mfa:
    needs: package
    if: inputs.signed_run == '' && !inputs.first_release
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ inputs.package_source }}
      module: mfa
      native_builds: '{"include":[{"platform_key":"linux","arch":"X64","capabilities":["signed-mfa"]}]}'
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  upgrade:
    needs: [package, signed-mfa]
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.signed-mfa.result == 'success' || needs.signed-mfa.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FIRST_RELEASE: ${{ inputs.first_release }}
      QA_FIRST_UPGRADE_VERSION: ${{ inputs.first_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare the native X11 adapter
        env:
          QA_OPERATION: run
          QA_LINUX_PROFILE: ubuntu-24.04-xvfb
          QA_CAPABILITIES: display,x11
        run: |
          python -m pip install -r .agents/skills/qa-ui-auto/requirements-ci.txt psutil==7.2.2
          bash .agents/skills/qa-ui-auto/scripts/ci_linux_setup.sh
          cargo install tauri-driver --version 2.0.4 --locked
      - uses: actions/download-artifact@v4
        with:
          name: installed-mfa-input-${{ github.run_id }}
          path: installed-mfa-input
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate-input
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.first_release }}
        with:
          name: qa-modular-package-linux-x86_64-${{ inputs.signed_run || github.run_id }}
          path: signed-input
          run-id: ${{ inputs.signed_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: inputs.first_release
        with:
          ref: ${{ inputs.package_source }}
          path: first-release-input/source
          sparse-checkout: src-tauri/plugins
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.first_release
        with:
          name: modular-candidate-roster-${{ inputs.package_run }}
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: first-release-input/catalog
      - uses: actions/download-artifact@v4
        if: inputs.first_release
        with:
          pattern: module-signed-*-linux-x86_64-${{ inputs.package_run }}
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: first-release-input/packages
          merge-multiple: false
      - name: Stage the pinned legacy deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$FIRST_RELEASE" == true ]]; then
            args+=(--first-upgrade)
          fi
          python -m qa_ui_auto.legacy_release legacy-input "${args[@]}"
      - name: Build the standalone release RDP probe
        if: inputs.verify_rdp_perf
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev libclang-dev python3-tk
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --package taomni-rdp-probe
          mkdir -p installed-mfa-evidence/rdp-probe
          git rev-parse HEAD > installed-mfa-evidence/rdp-probe/source-sha.txt
          sha256sum src-tauri/target/release/rdp-probe > installed-mfa-evidence/rdp-probe/sha256.txt
      - name: Exercise apt replacement, signed module migration and rollback
        env:
          VERIFY_RELOCATION: ${{ inputs.verify_relocation }}
          VERIFY_RDP_PERF: ${{ inputs.verify_rdp_perf }}
        run: |
          extra=(--signed signed-input)
          if [[ "$FIRST_RELEASE" == true ]]; then
            python -m unittest test_module_first_release test_installed_first_release test_installed_mail_upgrade
            extra=(--first-release first-release-input)
          fi
          python -m unittest test_installed_mfa_crash test_installed_mfa_mode_lease
          if [[ "$VERIFY_RDP_PERF" == true ]]; then
            python -m unittest test_installed_rdp_baseline
            extra+=(--rdp-probe src-tauri/target/release/rdp-probe)
          fi
          if [[ "$VERIFY_RELOCATION" == true ]]; then
            python -m unittest test_installed_mfa_profile test_installed_linux_formats
            sudo apt-get install -y --no-install-recommends libfuse2t64 rpm
            extra+=(--verify-relocation)
          fi
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp -noreset' \
            python .agents/skills/qa-ui-auto/scripts/installed_mfa_upgrade.py \
            --identity installed-mfa-input/bundle-source.json --legacy legacy-input \
            --candidate candidate-input \
            --evidence installed-mfa-evidence --work installed-mfa-work "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-linux-mfa-upgrade-${{ github.run_id }}
          path: |
            installed-mfa-input/
            installed-mfa-evidence/
          if-no-files-found: error
          retention-days: 14

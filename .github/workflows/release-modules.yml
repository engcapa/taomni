name: Release Module Catalog

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag for the module-only release
        required: true
        type: string
      module:
        description: Stable module slug to release
        required: true
        type: string
      head:
        description: Commit or ref containing the module change
        required: false
        default: ''
        type: string
      macos_runner:
        description: Hosted macOS builder for both Darwin targets
        required: false
        default: macos-15
        type: choice
        options: [macos-15, macos-15-intel, macos-latest]
  workflow_call:
    inputs:
      tag:
        description: GitHub Release tag for the module-only release
        required: true
        type: string
      module:
        description: Stable module slug to release
        required: true
        type: string
      head:
        description: Commit or ref containing the module change
        required: false
        default: ''
        type: string
      macos_runner:
        description: Hosted macOS builder for both Darwin targets
        required: false
        default: macos-15
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: module-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate module source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      slug: ${{ steps.source.outputs.slug }}
      package: ${{ steps.source.outputs.package }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.source.outputs.matrix }}
      macos_runner: ${{ steps.source.outputs.macos_runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect the stable module manifest and build targets
        id: source
        env:
          MODULE_SLUG: ${{ inputs.module }}
          RELEASE_TAG: ${{ inputs.tag }}
          MACOS_RUNNER: ${{ inputs.macos_runner || 'macos-15' }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess

          slug = os.environ['MODULE_SLUG'].strip()
          tag = os.environ['RELEASE_TAG'].strip()
          if not re.fullmatch(r'[a-z0-9](?:[a-z0-9-]*[a-z0-9])?', slug):
              raise SystemExit('module must be a lowercase module slug')
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)*', tag):
              raise SystemExit('tag must be a semantic version prefixed with v')
          manifest_path = pathlib.Path('src-tauri/plugins') / slug / 'module.json'
          if not manifest_path.is_file():
              raise SystemExit(f'module manifest is missing: {manifest_path}')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('id') != f'taomni-plugin-{slug}':
              raise SystemExit('module id must match the selected slug')
          if manifest.get('status') != 'stable':
              raise SystemExit('only stable modules can enter a production catalog')
          if not manifest.get('description', '').strip():
              raise SystemExit('stable modules require a store description')
          cargo = manifest_path.parent / 'Cargo.toml'
          if not cargo.is_file():
              raise SystemExit('module-only release requires a native Cargo package')
          package = None
          for line in cargo.read_text(encoding='utf-8').splitlines():
              if line.startswith('name = '):
                  package = json.loads(line.split('=', 1)[1].strip())
                  break
          if not package:
              raise SystemExit('module Cargo.toml has no package name')
          targets = [
              {'os': 'ubuntu-24.04', 'target': 'x86_64-unknown-linux-gnu', 'platform': 'linux-x86_64'},
              {'os': 'windows-latest', 'target': 'x86_64-pc-windows-msvc', 'platform': 'windows-x86_64'},
              {'os': os.environ['MACOS_RUNNER'], 'target': 'aarch64-apple-darwin', 'platform': 'darwin-aarch64'},
              {'os': os.environ['MACOS_RUNNER'], 'target': 'x86_64-apple-darwin', 'platform': 'darwin-x86_64'},
          ]
          declared = set(manifest.get('platforms', []))
          if {target['platform'] for target in targets} - declared:
              raise SystemExit('manifest must declare every production release target')
          output = os.environ['GITHUB_OUTPUT']
          with open(output, 'a', encoding='utf-8') as stream:
              stream.write(f"sha={subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}\n")
              stream.write(f'slug={slug}\npackage={package}\nversion={manifest["version"]}\n')
              stream.write('matrix=' + json.dumps({'include': targets}, separators=(',', ':')) + '\n')
              stream.write(f"macos_runner={os.environ['MACOS_RUNNER']}\n")
          PY

  build:
    name: Build unsigned ${{ needs.source.outputs.slug }} (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: module-release-${{ needs.source.outputs.slug }}-${{ matrix.target }}
      - name: Build the module host without signing credentials
        run: cargo build --manifest-path src-tauri/Cargo.toml -p '${{ needs.source.outputs.package }}' --release --target '${{ matrix.target }}' --locked
      - name: Stage the exact package payload
        env:
          MODULE_TARGET: ${{ matrix.target }}
          MODULE_PLATFORM: ${{ matrix.platform }}
          MODULE_SLUG: ${{ needs.source.outputs.slug }}
          MODULE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          slug = os.environ['MODULE_SLUG']
          source = pathlib.Path('src-tauri/plugins') / slug
          manifest = json.loads((source / 'module.json').read_text(encoding='utf-8'))
          host = manifest.get('entry', {}).get('host')
          if host and os.environ['MODULE_PLATFORM'].startswith('windows') and not host.endswith('.exe'):
              host += '.exe'
              manifest['entry']['host'] = host
          payload = pathlib.Path('unsigned-module')
          payload.mkdir()
          (payload / 'module.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          if host:
              binary = pathlib.Path('src-tauri/target') / os.environ['MODULE_TARGET'] / 'release' / host
              shutil.copyfile(binary, payload / host)
          frontend = manifest.get('entry', {}).get('frontend')
          if frontend:
              source_frontend = source / pathlib.Path(frontend).parent
              shutil.copytree(source_frontend, payload / source_frontend.relative_to(source))
          pathlib.Path('candidate-source.json').write_text(json.dumps({
              'sourceSha': os.environ['MODULE_SOURCE_SHA'],
              'platform': os.environ['MODULE_PLATFORM'],
              'module': slug,
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: module-unsigned-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            unsigned-module/
            candidate-source.json
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign ${{ needs.source.outputs.slug }} (${{ matrix.platform }})
    needs: [source, build]
    if: github.event_name != 'pull_request' && github.repository == 'engcapa/taomni'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout trusted signing tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the trusted packager
        run: |
          cargo test --manifest-path scripts/plugin-package/Cargo.toml --lib --locked
          cargo build --manifest-path scripts/plugin-package/Cargo.toml --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: module-unsigned-${{ matrix.platform }}-${{ github.run_id }}
          path: candidate
      - name: Check candidate identity against the trusted manifest
        env:
          MODULE_PLATFORM: ${{ matrix.platform }}
          MODULE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
          MODULE_SLUG: ${{ needs.source.outputs.slug }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('candidate')
          observed = json.loads((root / 'candidate-source.json').read_text(encoding='utf-8'))
          expected_observed = {'sourceSha': os.environ['MODULE_SOURCE_SHA'], 'platform': os.environ['MODULE_PLATFORM'], 'module': os.environ['MODULE_SLUG']}
          if observed != expected_observed:
              raise SystemExit('candidate source identity does not match the selected commit')
          trusted = json.loads((pathlib.Path('src-tauri/plugins') / os.environ['MODULE_SLUG'] / 'module.json').read_text(encoding='utf-8'))
          candidate = json.loads((root / 'unsigned-module/module.json').read_text(encoding='utf-8'))
          if trusted != {**candidate, 'entry': {**candidate.get('entry', {}), 'host': trusted.get('entry', {}).get('host')}}:
              raise SystemExit('candidate module metadata differs from trusted source')
          if candidate.get('status') != 'stable' or candidate.get('id') != f"taomni-plugin-{os.environ['MODULE_SLUG']}":
              raise SystemExit('candidate is not a stable official module')
          if any(path.is_symlink() for path in root.rglob('*')):
              raise SystemExit('candidate payload contains a symlink')
          PY
      - name: Sign and verify the immutable package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MODULE_PLATFORM: ${{ matrix.platform }}
          MODULE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          scripts/plugin-package/target/release/taomni-plugin-package \
            --payload candidate/unsigned-module --platform "$MODULE_PLATFORM" \
            --output signed-module --source-sha "$MODULE_SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: module-signed-${{ matrix.platform }}-${{ github.run_id }}
          path: signed-module/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish module catalog and packages
    needs: [source, sign]
    if: needs.source.result == 'success' && needs.sign.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      MODULE_SLUG: ${{ needs.source.outputs.slug }}
      MODULE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release and catalog contracts
        run: |
          node --test scripts/fetch-published-module-assets.test.mjs scripts/compose-modules-manifest.test.mjs scripts/stage-published-module-catalog.test.mjs scripts/release-modules-workflow.test.mjs
          cargo test --manifest-path scripts/plugin-package/Cargo.toml --lib --locked
          cargo build --manifest-path scripts/plugin-package/Cargo.toml --release --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: module-signed-*-${{ github.run_id }}
          path: signed-artifacts
          merge-multiple: false
      - name: Stage the signed public catalog baseline
        run: |
          set -euo pipefail
          node scripts/stage-published-module-catalog.mjs current-catalog
          scripts/plugin-package/target/release/taomni-plugin-package --verify-catalog current-catalog
          node scripts/fetch-published-module-assets.mjs current-catalog current-catalog
      - name: Compose, merge and sign the next catalog
        env:
          MODULES_PUBLISHED_CATALOG: current-catalog/modules.json
          MODULE_SEQUENCE: ${{ github.run_number }}
          MODULES_REQUIRE_SIGNATURE: '0'
        run: |
          set -euo pipefail
          export MODULE_UPDATED_AT="$(git show -s --format=%cI "$MODULE_SOURCE_SHA")"
          mkdir -p changed-modules
          find signed-artifacts -type f -name '*.taomni-plugin' -exec cp {} changed-modules/ \;
          find signed-artifacts -type f -name '*.taomni-plugin.minisig' -exec cp {} changed-modules/ \;
          test "$(find changed-modules -type f -name '*.taomni-plugin' | wc -l)" = 4
          node scripts/compose-modules-manifest.mjs changed-modules changed-catalog
          scripts/plugin-package/target/release/taomni-plugin-package \
            --prepare-catalog-update current-catalog changed-catalog next-catalog > new-assets.json
          scripts/plugin-package/target/release/taomni-plugin-package --sign-catalog next-catalog
          scripts/plugin-package/target/release/taomni-plugin-package --verify-catalog next-catalog
          git rev-parse HEAD > module-release-evidence-source-sha.txt
          cp next-catalog/modules.json module-release-evidence-modules.json
          cp new-assets.json module-release-evidence-assets.json
      - name: Create or reuse the draft module release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Taomni modules $TAG" --generate-notes --target "$MODULE_SOURCE_SHA"
          fi
      - name: Upload changed packages before the signed catalog
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          for name in json.loads(open('new-assets.json', encoding='utf-8').read()):
              subprocess.run(['gh', 'release', 'upload', os.environ['TAG'], f'next-catalog/{name}', '--clobber'], check=True)
          PY
          gh release upload "$TAG" next-catalog/modules.json.minisig --clobber
          gh release upload "$TAG" next-catalog/modules.json --clobber
      - name: Publish the draft after all module assets are present
        run: gh release edit "$TAG" --draft=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-release-evidence-${{ github.run_id }}
          path: |
            module-release-evidence-source-sha.txt
            module-release-evidence-modules.json
            module-release-evidence-assets.json
            new-assets.json
            next-catalog/modules.json
            next-catalog/modules.json.minisig
          if-no-files-found: error
          retention-days: 30

name: QA Modular G1-G11 Release Gates

on:
  workflow_dispatch:
    inputs:
      head:
        description: Commit or ref to test
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      head:
        description: Commit or ref to test
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: modular-gates-${{ github.ref }}-${{ inputs.head }}
  cancel-in-progress: true

jobs:
  g8-g9-contracts:
    name: G8/G9 package and core-only contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: .agents/skills/qa-ui-auto/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Record gate identity
        run: |
          mkdir -p modular-gates-evidence/G8-G9
          git rev-parse HEAD | tee modular-gates-evidence/G8-G9/source-sha.txt
          rustc --version | tee modular-gates-evidence/G8-G9/rustc-version.txt
          node --version | tee modular-gates-evidence/G8-G9/node-version.txt
      - name: Verify package, catalog and release contracts
        run: |
          set -o pipefail
          cargo test --manifest-path scripts/plugin-package/Cargo.toml --lib --locked 2>&1 | tee modular-gates-evidence/G8-G9/package-tool.log
          node --test scripts/compose-modules-manifest.test.mjs scripts/stage-published-module-catalog.test.mjs scripts/release-workflow.test.mjs 2>&1 | tee modular-gates-evidence/G8-G9/catalog-tool.log
      - name: Verify static boundaries and core-only build
        run: |
          set -o pipefail
          pnpm check:refactor 2>&1 | tee modular-gates-evidence/G8-G9/refactor.log
          cargo check --manifest-path src-tauri/Cargo.toml --lib --no-default-features --locked 2>&1 | tee modular-gates-evidence/G8-G9/core-only-check.log
          cargo tree --manifest-path src-tauri/Cargo.toml --no-default-features --locked --edges normal > modular-gates-evidence/G8-G9/core-only-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-gates-G8-G9
          path: modular-gates-evidence/G8-G9
          if-no-files-found: error

  g10-protocol:
    name: G10 protocol, timeout and cancellation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: modular-gates-g10-${{ runner.os }}-${{ runner.arch }}
      - name: Record gate identity
        run: |
          mkdir -p modular-gates-evidence/G10
          git rev-parse HEAD | tee modular-gates-evidence/G10/source-sha.txt
          rustc --version | tee modular-gates-evidence/G10/rustc-version.txt
      - name: Run wire and real host cancellation contracts
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-plugin-api --locked 2>&1 | tee modular-gates-evidence/G10/api.log
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-plugin-services --lib --locked 2>&1 | tee modular-gates-evidence/G10/services.log
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-host-gates --test lifecycle --locked -- --ignored --test-threads=1 --nocapture 2>&1 | tee modular-gates-evidence/G10/lifecycle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-gates-G10-${{ matrix.os }}
          path: modular-gates-evidence/G10
          if-no-files-found: error

  g6-g7-g11-host:
    name: G6/G7/G11 host lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: modular-gates-host-${{ runner.os }}-${{ runner.arch }}
      - name: Build official host fixtures
        run: cargo build --manifest-path src-tauri/Cargo.toml -p taomni-hello-plugin -p taomni-plugin-mfa --bins --locked
      - name: Record gate identity
        run: |
          mkdir -p modular-gates-evidence/G6-G7-G11
          git rev-parse HEAD | tee modular-gates-evidence/G6-G7-G11/source-sha.txt
          rustc --version | tee modular-gates-evidence/G6-G7-G11/rustc-version.txt
      - name: Run real process lifecycle and profile ownership gates
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-host-gates --test lifecycle --locked -- --ignored --test-threads=1 --nocapture 2>&1 | tee modular-gates-evidence/G6-G7-G11/lifecycle.log
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-host-gates --test profile --locked -- --ignored --test-threads=1 --nocapture 2>&1 | tee modular-gates-evidence/G6-G7-G11/profile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-gates-G6-G7-G11-${{ matrix.os }}
          path: modular-gates-evidence/G6-G7-G11
          if-no-files-found: error

  g1-g3-system-trust:
    name: G1/G3 system trust
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            gate: G1
            command: python scripts/run-module-system-execution-gates.py --evidence modular-gates-evidence/G1
          - os: windows-latest
            gate: G3
            command: python scripts/run-module-windows-execution-gates.py --evidence modular-gates-evidence/G3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: .agents/skills/qa-ui-auto/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build host fixtures without release secrets
        run: cargo build --manifest-path src-tauri/Cargo.toml -p taomni-hello-plugin -p taomni-plugin-mfa --bins --locked
      - name: Run system trust gate
        run: |
          mkdir -p modular-gates-evidence/${{ matrix.gate }}
          git rev-parse HEAD > modular-gates-evidence/${{ matrix.gate }}/source-sha.txt
          ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-gates-${{ matrix.gate }}-${{ matrix.os }}
          path: modular-gates-evidence/${{ matrix.gate }}
          if-no-files-found: error

  g4-g5-capture-execution:
    name: G4/G5 Linux execution and frame transport
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: .agents/skills/qa-ui-auto/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev libclang-dev xvfb xauth
      - name: Build hosts and record identity
        run: |
          mkdir -p modular-gates-evidence/G4-G5
          git rev-parse HEAD | tee modular-gates-evidence/G4-G5/source-sha.txt
          cargo build --manifest-path src-tauri/Cargo.toml -p taomni-hello-plugin -p taomni-plugin-mfa --bins --locked
      - name: Run noexec and frame contracts
        run: |
          set -o pipefail
          python scripts/run-module-execution-gates.py --evidence modular-gates-evidence/G4-G5
          cargo test --release --manifest-path src-tauri/Cargo.toml -p taomni-plugin-stream --locked --lib frame_transport::compare_in_process_and_host -- --ignored --exact --nocapture 2>&1 | tee modular-gates-evidence/G4-G5/frame.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-gates-G4-G5
          path: modular-gates-evidence/G4-G5
          if-no-files-found: error

  g2-capture-permissions:
    name: G2 capture and permission ownership (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Record identity and run capture ownership contracts
        run: |
          set -o pipefail
          mkdir -p modular-gates-evidence/G2
          git rev-parse HEAD > modular-gates-evidence/G2/source-sha.txt
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-plugin-sdk --lib capture_native_tests --locked -- --ignored --test-threads=1 --nocapture 2>&1 | tee modular-gates-evidence/G2/sdk-capture.log
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-host-gates --test capture_still --locked -- --ignored --test-threads=1 --nocapture 2>&1 | tee modular-gates-evidence/G2/core-capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-gates-G2-${{ matrix.os }}
          path: modular-gates-evidence/G2
          if-no-files-found: error

  gate-summary:
    name: G1-G11 release gate summary
    if: ${{ always() }}
    needs: [g8-g9-contracts, g10-protocol, g6-g7-g11-host, g1-g3-system-trust, g4-g5-capture-execution, g2-capture-permissions]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'G1-G11 release gates are not closed: {failed}')
          print('G1-G11 gate jobs passed for the selected source.')
          PY

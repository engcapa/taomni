name: QA Modular G1-G11

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch with the modular product and its QA workflows
        type: string
        required: true
      head:
        description: Expected full source SHA (empty pins the current branch tip)
        type: string
      suite:
        description: Checks to dispatch
        type: choice
        options: [all, system, protocol, host, signed, desktop, core, release]
        default: all
      macos_runner:
        description: macOS runner for desktop QA
        type: choice
        options: [macos-15, macos-15-intel, macos-26]
        default: macos-15
      package_run:
        description: Matching artifact-only Release Bundle run ID (required for release suite)
        type: string
      package_version:
        description: Version in that run's installers
        type: string
      package_targets:
        description: Release package targets to verify (all or comma-separated)
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  dispatch:
    name: Dispatch modular QA and retain run links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      head: ${{ steps.dispatch.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/modular_gate_runs.py
            .github/scripts/test_modular_gate_runs.py
          sparse-checkout-cone-mode: false
      - name: Check dispatch and target selections
        run: python -m unittest discover -s .github/scripts -p test_modular_gate_runs.py
      - name: Resolve source and dispatch the existing QA workflows
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          EXPECTED_HEAD: ${{ inputs.head }}
          VERIFICATION_SUITE: ${{ inputs.suite }}
          MACOS_RUNNER: ${{ inputs.macos_runner }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          PACKAGE_TARGETS: ${{ inputs.package_targets }}
        run: python .github/scripts/modular_gate_runs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-gate-runs
          path: modular-gate-runs.json
          if-no-files-found: warn
          retention-days: 30

  core-inventory:
    name: G9 core build inventory and G11 entrypoint inventory
    needs: dispatch
    if: ${{ inputs.suite == 'all' || inputs.suite == 'core' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.dispatch.outputs.head }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Record the release dependency graph and native entrypoints
        shell: bash
        run: |
          mkdir -p gate-inventory
          git rev-parse HEAD > gate-inventory/source-sha.txt
          rustc --version > gate-inventory/rustc-version.txt
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            cargo tree --manifest-path src-tauri/Cargo.toml --locked -p taomni --edges normal,build --prefix none \
              --target "$target" > "gate-inventory/cargo-tree-$target.txt"
          done
          git ls-files src-tauri/resources > gate-inventory/resource-sources.txt
          git ls-files src-tauri/tauri.conf.json 'src-tauri/tauri.*.conf.json' > gate-inventory/bundle-configs.txt
          git grep -n -E -- '"--(headless|vnc-special-key-hook|sockscap-redirector-bridge)"' \
            -- src-tauri/src src-tauri/plugins > gate-inventory/entrypoints.txt || test "$?" -eq 1
      - name: Check that the default core dependency graph excludes remote desktop and Screenshot modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          for target in ("x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc",
                         "aarch64-apple-darwin", "x86_64-apple-darwin"):
              tree = Path(f"gate-inventory/cargo-tree-{target}.txt").read_text()
              packages = {line.split()[0] for line in tree.splitlines() if line.strip()}
              assert {"taomni-vnc-api", "taomni-rdp-client-api"} <= packages, f"{target}: missing shared client types"
              assert not packages.intersection({
                  "taomni-vnc-engine", "taomni-vnc-key-protocol", "taomni-vnc-key-helper",
                  "taomni-plugin-vnc-client", "taomni-rdp-client-engine", "taomni-plugin-rdp-client",
              }), f"{target}: the core still depends on a remote desktop client implementation"
              assert "taomni-plugin-vnc-server" not in packages, f"{target}: the core depends on the VNC daemon host"
              assert not packages.intersection({"taomni-plugin-servers", "taomni-local-servers-engine"}), f"{target}: the core depends on the Local servers engine"
              assert not packages.intersection({
                  "taomni-plugin-ai-voice-local", "taomni-local-voice-engine",
                  "whisper-rs", "whisper-rs-sys", "sherpa-onnx", "sherpa-onnx-sys", "llama-cpp-2",
              }), f"{target}: the core depends on local voice or model inference"
              assert not packages.intersection({
                  "taomni-plugin-rdp-server", "taomni-rdp-server-engine", "ironrdp-server",
              }), f"{target}: the core depends on the RDP Server engine"
              assert "taomni-screenshot-api" in packages, f"{target}: missing shared screenshot contract"
              assert not packages.intersection({
                  "taomni-plugin-screenshot", "taomni-screenshot-ocr", "taomni-screenshot-recording",
              }), f"{target}: the core still depends on a screenshot module engine"
          resources = json.loads(Path("src-tauri/tauri.windows.conf.json").read_text())["bundle"]["resources"]
          assert all("resources/vnc/" not in entry for entry in resources), "Core declares VNC module resources"
          PY
      - name: Build the release frontend and record actual chunk hashes
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm run build --manifest
          cp dist/.vite/manifest.json gate-inventory/vite-manifest.json
          find dist -type f -print0 | sort -z | xargs -0 -r sha256sum > gate-inventory/dist-sha256.txt
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('gate-inventory/vite-manifest.json', 'utf8'));
          assert(!existsSync('dist/screenshot-ocr'), 'Core contains module OCR language and worker assets');
          assert(!Object.keys(manifest).some((path) => path.includes('plugins/screenshot/renderer/')), 'Core contains the Screenshot OCR renderer');
          for (const path of Object.keys(manifest)) {
            assert(!/plugins\/(vnc|rdp)-client\/renderer\//.test(path), `Bundled remote desktop frontend ${path}`);
          }
          for (const [source, asset] of Object.entries(manifest)) {
            assert(!source.includes('plugins/sockscap/renderer/'), `Bundled SocksCap renderer ${source}`);
            if (!/\.(js|css)$/.test(asset.file)) continue;
            const bytes = readFileSync(`dist/${asset.file}`, 'utf8');
            assert(!bytes.includes('taomni.sockscap.macosSetupGuide.v1') && !bytes.includes('.sockscap-panel'),
              `Bundled SocksCap panel or stylesheet in ${asset.file}`);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-core-build-inventory
          path: gate-inventory/
          if-no-files-found: error
          retention-days: 30

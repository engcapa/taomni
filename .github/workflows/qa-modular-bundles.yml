name: QA Modular Release Bundle Samples

on:
  workflow_call:
    inputs:
      head:
        type: string
        required: true
      package_run:
        type: string
        required: true
      package_source:
        type: string
        required: true
      package_version:
        type: string
        required: true
      package_targets:
        type: string
        required: false
        default: all
      upgrade_desktop:
        type: boolean
        default: false
      macos_hardened_mfa:
        type: boolean
        default: false
      macos_arm_runner:
        type: string
        default: macos-15
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: {required: false}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: {required: false}
      APPLE_CERTIFICATE: {required: false}
      APPLE_CERTIFICATE_PASSWORD: {required: false}
      APPLE_SIGNING_IDENTITY: {required: false}

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      mfa_builds: ${{ steps.targets.outputs.mfa_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select only supported completed package targets
        id: targets
        env:
          SAMPLE_TARGETS: ${{ inputs.package_targets }}
          SAMPLE_UPGRADE_DESKTOP: ${{ inputs.upgrade_desktop }}
          SAMPLE_MACOS_HARDENED_MFA: ${{ inputs.macos_hardened_mfa }}
          SAMPLE_MACOS_ARM_RUNNER: ${{ inputs.macos_arm_runner }}
        run: |
          args=()
          if [[ "$SAMPLE_MACOS_HARDENED_MFA" == true ]] &&
             [[ "$SAMPLE_UPGRADE_DESKTOP" != true || ! "$SAMPLE_TARGETS" =~ ^darwin-(aarch64|x86_64)$ ]]; then
            echo 'Select one macOS target and installed desktop verification for the hardened host check.' >&2
            exit 1
          fi
          if [[ "$SAMPLE_UPGRADE_DESKTOP" == true ]]; then
            args+=(--upgrade-desktop)
          fi
          python .agents/skills/qa-ui-auto/scripts/modular_bundle_inventory.py plan-targets \
            --targets "$SAMPLE_TARGETS" --macos-arm-runner "$SAMPLE_MACOS_ARM_RUNNER" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

  signed-mfa:
    if: inputs.upgrade_desktop
    needs: plan
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ inputs.package_source }}
      module: mfa
      artifact_key: installed-desktop-${{ github.run_id }}
      macos_runner: ${{ inputs.macos_arm_runner }}
      native_builds: ${{ needs.plan.outputs.mfa_builds }}
      native_macos_signing: ${{ inputs.macos_hardened_mfa }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

  bundle-samples:
    needs: [plan, signed-mfa]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (!inputs.upgrade_desktop || needs.signed-mfa.result == 'success') }}
    name: Real release bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: .agents/skills/qa-ui-auto/scripts
      SAMPLE_RUN: ${{ inputs.package_run }}
      SAMPLE_SOURCE: ${{ inputs.package_source }}
      SAMPLE_VERSION: ${{ inputs.package_version }}
      SAMPLE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned QA fixture dependencies
        run: python -m pip install -r .agents/skills/qa-ui-auto/requirements-ci.txt
      - name: Pure package evidence contracts
        run: python -m unittest test_modular_bundle_inventory test_installed_desktop_upgrade
      - name: Install the process observer for installed-app recovery
        if: inputs.upgrade_desktop
        run: python -m pip install psutil==7.2.2
      - name: Bind the selected package to its exact release producer
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import subprocess

          run_id = os.environ['SAMPLE_RUN']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('package_run must be a positive integer')
          root = Path('bundle-evidence')
          root.mkdir()
          repo = os.environ['GITHUB_REPOSITORY']
          for name, endpoint in [
              ('producer-run.json', f'repos/{repo}/actions/runs/{run_id}'),
              ('producer-artifacts.json', f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'),
          ]:
              with (root / name).open('wb') as stream:
                  subprocess.run(['gh', 'api', endpoint], stdout=stream, check=True)
          PY
          python .agents/skills/qa-ui-auto/scripts/modular_bundle_inventory.py validate-source \
            --run bundle-evidence/producer-run.json --artifacts bundle-evidence/producer-artifacts.json \
            --repository "$GITHUB_REPOSITORY" --run-id "$SAMPLE_RUN" --source "$SAMPLE_SOURCE" \
            --version "$SAMPLE_VERSION" --target "$SAMPLE_TARGET" \
            --out bundle-evidence/bundle-source.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: package-input
          merge-multiple: true
      - name: Record actual package sizes and SHA-256 values
        run: |
          git rev-parse HEAD > bundle-evidence/tooling-source-sha.txt
          python --version > bundle-evidence/python-version.txt
          python - <<'PY'
          import json, os
          from pathlib import Path

          fields = {
              'runId': 'GITHUB_RUN_ID', 'runAttempt': 'GITHUB_RUN_ATTEMPT',
              'os': 'RUNNER_OS', 'architecture': 'RUNNER_ARCH',
              'image': 'ImageOS', 'imageVersion': 'ImageVersion',
          }
          runner = {key: os.environ.get(name) for key, name in fields.items()}
          Path('bundle-evidence/runner.json').write_text(json.dumps(runner, indent=2) + '\n', encoding='utf-8')
          PY
          python .agents/skills/qa-ui-auto/scripts/modular_bundle_inventory.py inventory \
            --directory package-input --identity bundle-evidence/bundle-source.json \
            --out bundle-evidence --tooling-source "$(git rev-parse HEAD)"
      - name: Inspect actual Debian and RPM package metadata
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python .agents/skills/qa-ui-auto/scripts/modular_bundle_inventory.py inventory \
            --directory package-input --identity bundle-evidence/bundle-source.json \
            --out bundle-evidence --tooling-source "$(git rev-parse HEAD)" --linux-metadata
      - name: Inspect the actual MSI payload and Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.agents/skills/qa-ui-auto/scripts/modular_bundle_windows.ps1 -Directory package-input -OutputDirectory bundle-evidence -Version $env:SAMPLE_VERSION
      - name: Inspect the real DMG, updater app, signatures and quarantine assessment
        if: runner.os == 'macOS'
        env:
          MACOS_STATIC_KRB5: ${{ inputs.macos_hardened_mfa }}
        run: |
          sw_vers > bundle-evidence/macos-version.txt
          uname -m > bundle-evidence/runner-architecture.txt
          python .agents/skills/qa-ui-auto/scripts/modular_bundle_macos.py \
            --directory package-input --identity bundle-evidence/bundle-source.json --out bundle-evidence
      - name: Require complete raw payload samples
        run: |
          python .agents/skills/qa-ui-auto/scripts/modular_bundle_inventory.py validate-payload \
            --target "$SAMPLE_TARGET" --directory bundle-evidence
      - name: Fetch the platform's pinned legacy installer
        if: inputs.upgrade_desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m qa_ui_auto.legacy_release legacy-input
      - uses: actions/download-artifact@v4
        if: inputs.upgrade_desktop
        with:
          name: qa-modular-package-${{ matrix.target }}-installed-desktop-${{ github.run_id }}
          path: signed-mfa-input
      - name: Replace the installed application, reopen its profile and roll back
        if: inputs.upgrade_desktop
        env:
          SAMPLE_MACOS_HARDENED_MFA: ${{ inputs.macos_hardened_mfa }}
          MACOS_SIGNING_CERT_SHA1: ${{ vars.MACOS_SIGNING_CERT_SHA1 }}
        run: |
          args=()
          if [[ "$SAMPLE_MACOS_HARDENED_MFA" == true ]]; then
            args+=(--macos-hardened-mfa)
          fi
          python .agents/skills/qa-ui-auto/scripts/installed_desktop_upgrade.py \
            --identity bundle-evidence/bundle-source.json --legacy legacy-input \
            --candidate package-input --signed signed-mfa-input \
            --work installed-upgrade-work --evidence bundle-evidence "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-bundle-${{ matrix.target }}-${{ inputs.package_run }}
          path: bundle-evidence
          if-no-files-found: error

name: Windows No-Bundle Binary

# Manual-only build of the standalone Windows executable (no installer /
# bundle), for hand testing. Builds the production identifier in release
# profile via `pnpm tauri build --no-bundle` and uploads taomni.exe as a
# workflow artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-no-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-no-bundle:
    name: Windows no-bundle (taomni.exe)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Ensure Strawberry Perl (OpenSSL build)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --yes --no-progress }
          & $perl -MIPC::Cmd -e 'print "Perl ready"'
          if ($LASTEXITCODE -ne 0) { throw 'Complete Perl unavailable' }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
          'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH

      - name: Fetch WinDivert redistributable (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/resources/sockscap/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path (Join-Path $dest "WinDivert.dll")) {
            Write-Host "WinDivert already present in $dest, skipping download."
            exit 0
          }
          $version = "2.2.2"
          $zip = Join-Path $env:RUNNER_TEMP "WinDivert-$version-A.zip"
          $extract = Join-Path $env:RUNNER_TEMP "WinDivert-extract"
          $urls = @(
            "https://reqrypt.org/download/WinDivert-$version-A.zip",
            "https://github.com/basil00/WinDivert/releases/download/v$version/WinDivert-$version-A.zip"
          )
          $ok = $false
          foreach ($url in $urls) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Write-Host "Downloading $url (attempt $i)..."
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
                $ok = $true; break
              } catch {
                Write-Warning "Download failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 5
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Unable to download WinDivert $version from any mirror." }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $x64 = Join-Path $extract "WinDivert-$version-A\x64"
          Copy-Item -Force (Join-Path $x64 "WinDivert.dll") $dest
          Copy-Item -Force (Join-Path $x64 "WinDivert64.sys") $dest

      - name: Stage Windows SocksCap helper (release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh scripts/stage-sockscap-windows.ps1 -Configuration release
          pwsh scripts/stage-sockscap-windows.ps1 --check

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone binary (no bundle, release)
        run: pnpm tauri build --no-bundle

      - name: Collect standalone binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/taomni.exe'
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          New-Item -ItemType Directory -Force -Path 'no-bundle' | Out-Null
          Copy-Item $exe 'no-bundle/taomni.exe'
          # Resources (SocksCap helper / WinDivert / xray) sit next to the exe
          # in the release dir; include them when present so features that
          # need them work from the same folder.
          $res = 'src-tauri/target/release/resources'
          if (Test-Path $res) { Copy-Item -Recurse $res 'no-bundle/resources' }
          Get-FileHash 'no-bundle/taomni.exe' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  taomni.exe" } |
            Set-Content 'no-bundle/SHA256.txt' -Encoding ascii
          Get-ChildItem -Recurse 'no-bundle' | Select-Object FullName, Length

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: taomni-windows-no-bundle-${{ github.sha }}
          path: no-bundle/
          if-no-files-found: error
          retention-days: 14

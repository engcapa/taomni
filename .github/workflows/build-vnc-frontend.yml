name: Build an official module frontend

on:
  workflow_call:
    inputs:
      source:
        type: string
        required: true
      artifact:
        type: string
        required: true
      module:
        type: string
        default: vnc-client

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.module == 'taoffice-visio' && 30 || 10 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match the selected frontend inputs to the trusted workflow revision
        env:
          MODULE_SOURCE: ${{ inputs.source }}
          MODULE_SLUG: ${{ inputs.module }}
        run: |
          case "$MODULE_SLUG" in
            vnc-client) dependencies=(src/lib/vnc src/lib/vncOptions.ts src/lib/terminal/keyboardGuards.ts) ;;
            rdp-client) dependencies=(src/lib/rdpViewerHost.ts src/lib/rdpViewerContract.ts) ;;
            mail) dependencies=(src/lib/mail src/lib/mailHtml ':(glob)src/lib/mail*.ts') ;;
            mfa) dependencies=(src/lib/mfa) ;;
            screenshot) dependencies=(vite-plugins/screenshotOcr.ts scripts/stage-vnc-frontend.py) ;;
            sockscap) dependencies=(src/lib/sockscap src/lib/sockscap.ts src/lib/sessionPaths.ts src/lib/sockscapPreflight.ts) ;;
            rdp-server|vnc-server|servers) dependencies=(vite-plugins/serverSettings.ts src/lib/servers) ;;
            taoffice-pdf|taoffice-excel) dependencies=() ;;
            taoffice-image) dependencies=(src-tauri/plugins/taoffice-image/heif-wasm scripts/rust-wasm-notices.py) ;;
            taoffice-visio) dependencies=(src-tauri/plugins/taoffice-visio/wasm src-tauri/crates/taomni-plugin-api/frontend/documentDraft.js) ;;
            taoffice-video) dependencies=(src-tauri/plugins/taoffice-video/frontend) ;;
            taoffice-word)
              dependencies=(src-tauri/crates/taomni-plugin-api/frontend/documentDraft.js scripts/rust-wasm-notices.py
                src-tauri/plugins/taoffice-word/legacy-doc-wasm)
              ;;
            taoffice-project|taoffice-ppt) dependencies=(src-tauri/crates/taomni-plugin-api/frontend/documentDraft.js) ;;
            *) echo 'Unknown module frontend' >&2; exit 1 ;;
          esac
          case "$MODULE_SLUG" in
            mail|mfa|rdp-client|sockscap|vnc-client|taoffice-video|taoffice-ppt|taoffice-visio|taoffice-image|taoffice-word) dependencies+=(src-tauri/crates/taomni-plugin-api/frontend/ui) ;;
          esac
          case "$MODULE_SLUG" in
            mail|mfa|sockscap|vnc-client) dependencies+=(src/styles/ui-foundations.css src/styles/ui-typography.css src/styles/modal.css) ;;
          esac
          git diff --quiet HEAD "${MODULE_SOURCE}^{commit}" -- \
            package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc patches \
            "src-tauri/plugins/$MODULE_SLUG/renderer" "src-tauri/plugins/$MODULE_SLUG/vite.config.ts" \
            "${dependencies[@]}" || {
              echo 'The selected frontend inputs differ from the trusted workflow revision.' >&2
              exit 1
            }
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the pinned Word DOC WebAssembly converter
        if: inputs.module == 'taoffice-word'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-docs
          archive=wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          gh release download 0.2.130 --repo wasm-bindgen/wasm-bindgen --pattern "$archive" --dir "$RUNNER_TEMP"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/${archive%.tar.gz}:$PATH"
          bash src-tauri/plugins/taoffice-word/legacy-doc-wasm/build.sh
      - name: Build the pinned HEIF WebAssembly decoder
        if: inputs.module == 'taoffice-image'
        run: |
          rustup target add wasm32-unknown-unknown
          rustup component add rust-docs
          bash src-tauri/plugins/taoffice-image/heif-wasm/build.sh
      - name: Build the pinned libvisio WebAssembly decoder
        if: inputs.module == 'taoffice-visio'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y cmake ninja-build pkg-config gperf icu-devtools
          sdk="$RUNNER_TEMP/taoffice-emsdk"
          git clone --depth 1 --branch 4.0.23 https://github.com/emscripten-core/emsdk.git "$sdk"
          "$sdk/emsdk" install 4.0.23
          "$sdk/emsdk" activate 4.0.23
          source "$sdk/emsdk_env.sh"
          bash src-tauri/plugins/taoffice-visio/wasm/build.sh
      - name: Build the frontend and bind its bytes to the selected source
        env:
          MODULE_SOURCE: ${{ inputs.source }}
          MODULE_SLUG: ${{ inputs.module }}
          FRONTEND_TOOLING: ${{ github.workflow_sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build --config "src-tauri/plugins/$MODULE_SLUG/vite.config.ts"
          python scripts/stage-vnc-frontend.py "src-tauri/plugins/$MODULE_SLUG/dist/frontend" \
            --receipt "$MODULE_SOURCE" "$FRONTEND_TOOLING" "$MODULE_SLUG"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: src-tauri/plugins/${{ inputs.module }}/dist/frontend/
          if-no-files-found: error
          retention-days: 14

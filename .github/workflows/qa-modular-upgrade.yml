name: Compare three signed ARM64 cores on macOS 26
on:
  workflow_dispatch:
    inputs:
      experiment_run:
        type: string
        description: Successful ARM64-only artifact build of the experiment
        required: true
      experiment_source:
        type: string
        description: Exact product SHA of the experimental core
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    uses: ./.github/workflows/qa-modular-bundles.yml
    with:
      head: ${{ github.sha }}
      package_run: '45556290903'
      package_source: 5e53df106549b9fa8a49e435120fc820c8e608ca
      package_version: 0.6.0
      package_targets: darwin-aarch64
      upgrade_desktop: true
      first_release: true
      macos_arm_runner: macos-26
      experiment_run: ${{ inputs.experiment_run }}
      experiment_source: ${{ inputs.experiment_source }}

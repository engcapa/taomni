name: QA macOS Redirector Ticket
on:
  workflow_dispatch:
    inputs:
      head:
        description: Source SHA for the Redirector verification script
        type: string
        required: true

permissions:
  contents: read

jobs:
  redirector-ticket:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - name: Stage and verify the actual Redirector ticket
        shell: bash
        run: |
          mkdir -p ticket-evidence
          git rev-parse HEAD > ticket-evidence/source-sha.txt
          sw_vers > ticket-evidence/macos.txt
          bash scripts/stage-mitmproxy-redirector-macos.sh --stage 2>&1 | tee ticket-evidence/stage.log
          bash scripts/stage-mitmproxy-redirector-macos.sh --check 2>&1 | tee ticket-evidence/check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-redirector-ticket
          path: ticket-evidence/
          if-no-files-found: error

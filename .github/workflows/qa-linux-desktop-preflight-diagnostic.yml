name: QA Linux desktop preflight diagnostic
on:
  push:
    branches: [fix/qa-linux-desktop-preflight-verify-20261010]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUNBUFFERED: '1'
jobs:
  desktop:
    name: ${{ matrix.profile }} preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: ubuntu-22.04-vnc, runner: ubuntu-22.04}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1 numpy==2.4.4 Pillow==12.1.1
      - name: Provision real native desktop dependencies
        env:
          QA_LINUX_PROFILE: ${{ matrix.profile }}
          QA_CAPABILITIES: display,dual-display,audio,ime,rdp,release
        run: bash .agents/skills/qa-ui-auto/scripts/ci_linux_setup.sh
      - name: Desktop and consent regression contracts
        run: python -m unittest test_ci_desktop test_wayland_tools test_multi_display test_ci_portal_application
      - name: Verify owned native desktop and actual portal consent
        env:
          QA_PROFILE: ${{ matrix.profile }}
        run: >-
          dbus-run-session -- python .agents/skills/qa-ui-auto/scripts/ci_desktop_preflight.py
          --profile "$QA_PROFILE" --capabilities '["display","dual-display","audio","ime","rdp","release"]'
          --report 'qa-ui-auto-report/${{ matrix.profile }}/desktop-preflight'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-preflight-${{ matrix.profile }}
          path: qa-ui-auto-report

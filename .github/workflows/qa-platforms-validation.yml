name: QA platforms branch validation
on:
  push:
    branches: [feat/qa-ui-auto-platforms]
    paths: [.github/workflows/qa-platforms-validation.yml]
permissions:
  contents: read
  issues: write
jobs:
  browser_all:
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: all
      modes: browser
  native_fixes:
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: selected
      platforms: linux,macos
      modes: native
      case_ids: TC-IDE-CW-EXECUTION-01-maven-run-build-tests-native,TC-IDE-D1-02-find-search-masks-module-native

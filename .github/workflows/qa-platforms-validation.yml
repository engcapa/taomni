name: QA platforms branch validation
on:
  push:
    branches: [feat/qa-ui-auto-platforms]
    paths: [.github/workflows/qa-platforms-validation.yml]
permissions:
  contents: read
  issues: write
jobs:
  # Focused rerun after SSH readiness waits for cwd integration to settle,
  # covering renderer input delivery and the WebView2 native adapter.
  windows_browser:
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: selected
      platforms: windows
      modes: browser
      case_ids: TC-004,TC-006,TC-007,TC-012,TC-021,TC-022,TC-024,TC-auto-F-Servers-1-servers-dialog
  windows_native:
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: selected
      platforms: windows
      modes: native
      case_ids: TC-006,TC-012

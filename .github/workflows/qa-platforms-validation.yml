name: QA platforms branch validation
on:
  push:
    branches: [feat/qa-ui-auto-platforms]
    paths: [.github/workflows/qa-platforms-validation.yml]
permissions:
  contents: read
jobs:
  smoke:
    # Temporary branch-only trigger for hosted validation (service authentication fixes).
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: smoke
  services:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: .agents/skills/qa-ui-auto/scripts
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .agents/skills/qa-ui-auto/requirements-ci.txt
      - run: python .agents/skills/qa-ui-auto/scripts/ci_services.py install
      - run: python .agents/skills/qa-ui-auto/scripts/ci_services.py probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-probe-${{ matrix.os }}
          path: qa-ui-auto-report/service-probe
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: .agents/skills/qa-ui-auto/scripts
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml jsonschema
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: python .agents/skills/qa-ui-auto/scripts/ci_toolchains.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-probe-${{ matrix.os }}
          path: |
            qa-ui-auto-report/java-probe/readiness.json
            qa-ui-auto-report/java-probe/warmup.json
            qa-ui-auto-report/java-probe/jdtls-stderr.log

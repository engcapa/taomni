name: QA platforms branch validation
on:
  push:
    branches: [feat/qa-ui-auto-platforms]
    paths: [.github/workflows/qa-platforms-validation.yml]
permissions:
  contents: read
  issues: write
jobs:
  windows_core:
    # Temporary validation: capture app startup independently of EdgeDriver.
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: smoke
      platforms: windows
      modes: native

name: QA platforms branch validation
on:
  push:
    branches: [feat/qa-ui-auto-platforms]
    paths: [.github/workflows/qa-platforms-validation.yml]
permissions:
  contents: read
  issues: write
jobs:
  windows_core:
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: smoke
      platforms: windows
      modes: native
  java_runtimes:
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: selected
      platforms: linux,macos
      modes: native
      case_ids: TC-IDE-C2-01,TC-IDE-AUDIT-008-intention-quickfix-apply-undo-native,TC-IDE-C2-04-java25-completion-lsp-reuse-performance-native,TC-IDE-DEBUG-01-java25-breakpoint-native,TC-IDE-D1-02-find-search-masks-module-native

name: QA platforms branch validation
on:
  push:
    branches: [feat/qa-ui-auto-platforms]
    paths: [.github/workflows/qa-platforms-validation.yml]
permissions:
  contents: read
  issues: write
jobs:
  windows_core:
    # Temporary validation: align EdgeDriver and app WebView profile.
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: smoke
      platforms: windows
      modes: native
  browser_fixes:
    uses: ./.github/workflows/qa-ui-auto-platforms.yml
    with:
      scope: selected
      modes: browser
      case_ids: TC-010,TC-012,TC-IDE-CW-SHELL-01-editor-shell-actions-browser,TC-auto-F-DB-1-query-tab-rename,TC-auto-F-DB-1-sql-session-scaffold

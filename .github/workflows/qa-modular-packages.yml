name: QA Official Modular Packages

on:
  workflow_dispatch:
    inputs:
      head:
        description: Repository commit/ref to package (QA artifacts only)
        type: string
        default: ''
      module:
        description: Official QA module
        type: choice
        options: [hello-plugin, mfa]
        default: hello-plugin
  workflow_call:
    inputs:
      head: {type: string, default: ''}
      artifact_key: {type: string, default: ''}
      module: {type: string, default: hello-plugin}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: {required: true}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: {required: false}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  QA_MODULE: ${{ inputs.module || 'hello-plugin' }}

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      host_package: ${{ steps.source.outputs.host_package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        name: Require a commit reachable from a repository-owned branch
        run: |
          case "$QA_MODULE" in
            hello-plugin) echo 'host_package=taomni-hello-plugin' >> "$GITHUB_OUTPUT" ;;
            mfa) echo 'host_package=taomni-plugin-mfa' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unknown official QA module.' >&2; exit 1 ;;
          esac
          test -n "$(git for-each-ref --format='%(refname)' --contains HEAD refs/remotes/origin/)" || {
            echo 'Refusing to sign a head outside repository-owned branches.' >&2
            exit 1
          }
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build unsigned ${{ inputs.module || 'hello-plugin' }} (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x86_64}
          - {os: macos-latest, target: aarch64-apple-darwin, platform: darwin-aarch64}
          - {os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x86_64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: modular-official-${{ inputs.module || 'hello-plugin' }}-${{ matrix.target }}
      # Candidate code, Cargo build scripts and host binaries never share a
      # runner/job with signing secrets. Nothing from this job is executed by
      # the signing job; it receives only an inert payload directory.
      - name: Build candidate without signing credentials
        env:
          MODULE_PACKAGE: ${{ needs.source.outputs.host_package }}
        run: cargo build --manifest-path src-tauri/Cargo.toml -p "$MODULE_PACKAGE" --bin "$MODULE_PACKAGE" --release --target '${{ matrix.target }}' --locked
      - name: Stage the platform payload
        env:
          MODULE_TARGET: ${{ matrix.target }}
          MODULE_PLATFORM: ${{ matrix.platform }}
          MODULE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, shutil
          source = pathlib.Path('src-tauri/plugins') / os.environ['QA_MODULE']
          output = pathlib.Path('unsigned-module')
          output.mkdir()
          manifest = json.loads((source / 'module.json').read_text(encoding='utf-8'))
          host = manifest['entry']['host'] + ('.exe' if os.environ['MODULE_PLATFORM'].startswith('windows') else '')
          manifest['entry']['host'] = host
          (output / 'module.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          shutil.copyfile(pathlib.Path('src-tauri/target') / os.environ['MODULE_TARGET'] / 'release' / host, output / host)
          if manifest['entry'].get('frontend'):
              shutil.copytree(source / 'frontend', output / 'frontend')
          pathlib.Path('candidate-source.json').write_text(json.dumps({'sourceSha': os.environ['MODULE_SOURCE_SHA'], 'platform': os.environ['MODULE_PLATFORM'], 'module': os.environ['QA_MODULE']}), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-module-${{ matrix.platform }}-${{ inputs.artifact_key || github.run_id }}
          path: |
            unsigned-module/
            candidate-source.json
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign official ${{ inputs.module || 'hello-plugin' }} (${{ matrix.platform }})
    needs: [source, build]
    # Fork pull requests cannot request a production signature. A manual or
    # reusable invocation runs the workflow revision trusted by its operator.
    if: github.event_name != 'pull_request' && github.repository == 'engcapa/taomni'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, windows-x86_64, darwin-aarch64, darwin-x86_64]
    steps:
      - name: Checkout the trusted workflow tooling, not the candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Never restore compiled signer/dependency executables from a cache that
      # an unsigned candidate job could populate. This graph is small enough
      # to compile from the trusted, locked source on each fresh signing runner.
      - name: Compile trusted signer without private-key environment
        run: |
          cargo test --manifest-path scripts/plugin-package/Cargo.toml --lib --locked
          cargo build --manifest-path scripts/plugin-package/Cargo.toml --release --locked
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-module-${{ matrix.platform }}-${{ inputs.artifact_key || github.run_id }}
          path: candidate
      - name: Restrict QA signing to the official manifest and selected source
        env:
          MODULE_PLATFORM: ${{ matrix.platform }}
          MODULE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('candidate')
          module = os.environ['QA_MODULE']
          assert module in {'hello-plugin', 'mfa'}, 'Unknown official QA module'
          observed = json.loads((root / 'candidate-source.json').read_text(encoding='utf-8'))
          assert observed == {'sourceSha': os.environ['MODULE_SOURCE_SHA'], 'platform': os.environ['MODULE_PLATFORM'], 'module': module}
          trusted_source = pathlib.Path('src-tauri/plugins') / module
          expected = json.loads((trusted_source / 'module.json').read_text(encoding='utf-8'))
          if os.environ['MODULE_PLATFORM'].startswith('windows'):
              expected['entry']['host'] += '.exe'
          actual = json.loads((root / 'unsigned-module/module.json').read_text(encoding='utf-8'))
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert actual == expected, 'Candidate metadata differs from the trusted official contract'
          assert actual['id'] == 'taomni-plugin-' + module and actual['version'] == '0.1.0'
          allowed = {'module.json', expected['entry']['host']}
          frontend = expected['entry'].get('frontend')
          if frontend:
              assert (trusted_source / frontend).is_file()
              for source in (trusted_source / 'frontend').rglob('*'):
                  assert not source.is_symlink()
                  if source.is_file():
                      relative = source.relative_to(trusted_source).as_posix()
                      allowed.add(relative)
                      assert (root / 'unsigned-module' / relative).read_bytes() == source.read_bytes(), 'Candidate changed official frontend without a trusted revision'
          files = {p.relative_to(root / 'unsigned-module').as_posix() for p in (root / 'unsigned-module').rglob('*') if p.is_file()}
          assert files == allowed, 'Unexpected files in official QA payload'
          assert not any(p.is_symlink() for p in root.rglob('*'))
          PY
      - name: Sign and independently verify against the production pinned public key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MODULE_PLATFORM: ${{ matrix.platform }}
          MODULE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: >-
          scripts/plugin-package/target/release/taomni-plugin-package
          --payload candidate/unsigned-module --platform "$MODULE_PLATFORM"
          --output signed-module --source-sha "$MODULE_SOURCE_SHA"
          --qa-catalog true
      - uses: actions/upload-artifact@v4
        with:
          name: qa-modular-package-${{ matrix.platform }}-${{ inputs.artifact_key || github.run_id }}
          path: signed-module/
          if-no-files-found: error
          retention-days: 14

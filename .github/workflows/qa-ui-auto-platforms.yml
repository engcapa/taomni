name: QA UI Auto Platforms

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope
        type: choice
        options: [smoke, all, impacted, selected]
        default: smoke
      head:
        description: Commit/ref to test (empty = workflow ref)
        type: string
      base:
        description: Explicit base commit/ref for impacted scope
        type: string
      platforms:
        description: Comma-separated linux,windows,macos
        type: string
        default: linux,windows,macos
      modes:
        description: Comma-separated browser,native
        type: string
        default: browser,native
      linux_profiles:
        description: 'Linux native profiles (CSV): ubuntu-24.04-xvfb,ubuntu-22.04-x11,ubuntu-22.04-vnc,ubuntu-26.04-wayland'
        type: string
        default: ubuntu-24.04-xvfb
      native_release:
        description: Use release QA builds for selected native cases (reuse full-run caches)
        type: boolean
        default: false
      case_ids:
        description: Exact case IDs (selected, or additions to impacted)
        type: string
      features:
        description: Feature IDs (union with case IDs/tags)
        type: string
      tags:
        description: Tags (union)
        type: string
      publish_issues:
        description: Update deduplicated failure issues
        type: boolean
        default: false
  workflow_call:
    inputs:
      scope: {type: string, default: smoke}
      head: {type: string, default: ''}
      base: {type: string, default: ''}
      platforms: {type: string, default: 'linux,windows,macos'}
      modes: {type: string, default: 'browser,native'}
      linux_profiles: {type: string, default: 'ubuntu-24.04-xvfb'}
      native_release: {type: boolean, default: false}
      case_ids: {type: string, default: ''}
      features: {type: string, default: ''}
      tags: {type: string, default: ''}
      publish_issues: {type: boolean, default: false}
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'vite-plugins/**'
      - 'qa-ui-auto-tests/**'
      - '.agents/skills/qa-ui-auto/**'
      - '.github/workflows/qa-ui-auto-platforms.yml'
      - '.github/actions/qa-runtime/**'
      - 'docs-feature/code-workspace-idea-parity/**'
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  DEV_PROXY_ALLOW_PRIVATE: '1'

defaults:
  run:
    shell: bash

jobs:
  development-case-contract:
    name: Development case contract
    if: github.event_name == 'pull_request' && inputs.scope == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1
      - name: Check changed code has a QA case path
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python .agents/skills/qa-ui-auto/scripts/qa_ui_auto/dev_contract.py --base "$QA_BASE" --head "$QA_HEAD"

  plan:
    if: github.event_name != 'pull_request' || inputs.scope != ''
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_cases: ${{ steps.plan.outputs.has_cases }}
      head: ${{ steps.plan.outputs.head }}
      artifact_key: ${{ steps.invocation.outputs.key }}
    steps:
      - name: Allocate invocation identity
        id: invocation
        run: python3 -c 'import os, uuid; open(os.environ["GITHUB_OUTPUT"], "a").write("key=" + uuid.uuid4().hex + "\n")'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1 numpy==2.4.4 Pillow==12.1.1
      - name: Validate QA tools
        run: python -m unittest test_ci_selection test_ci_report test_ci_execute test_ci_desktop test_navigation test_ci_provenance test_ci_services test_vnc_required test_dev_contract test_rdp_encoder_tools test_native_fixture_cleanup test_tauri_webdriver.NativeSessionTransportTest test_tauri_webdriver.NativeSessionFillTest test_host_clipboard test_verification_workflow test_native_isolation.NativeIsolationTest test_updater_fixture test_mouse_steps test_native_assertions test_window_drag test_element_geometry test_screenshot_scenarios test_color_input test_drag_path test_screenshot_mask test_stage_screenshot_artifacts test_setup_screenshot_ocr
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Updater packaging unit contracts
        run: node --test scripts/compose-updater-manifest.test.mjs
      - name: Catalog contract gate
        run: python -m qa_ui_auto.audit --gate
      - name: Plan exact cases and dependencies
        id: plan
        env:
          QA_SCOPE: ${{ github.event_name == 'schedule' && 'all' || inputs.scope || 'smoke' }}
          QA_BASE: ${{ inputs.base }}
          QA_PLATFORMS: ${{ inputs.platforms }}
          QA_MODES: ${{ inputs.modes }}
          QA_LINUX_PROFILES: ${{ inputs.linux_profiles }}
          QA_NATIVE_RELEASE: ${{ inputs.native_release }}
          QA_CASE_IDS: ${{ inputs.case_ids }}
          QA_FEATURES: ${{ inputs.features }}
          QA_TAGS: ${{ inputs.tags }}
        run: python -m qa_ui_auto.ci plan
      - uses: actions/upload-artifact@v4
        with:
          name: qa-selection-${{ steps.invocation.outputs.key }}
          path: qa-ui-auto-report/selection.json
          if-no-files-found: error

  execute:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.outputs.has_cases == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      # The QA app inherits tauri-driver's startup environment. Fixture setup
      # happens later, so enable reference-client diagnostics before the driver.
      TAOMNI_QA_RDP_TRACE: ${{ contains(matrix.capabilities, 'xrdp') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qa-selection-${{ needs.plan.outputs.artifact_key }}
          path: qa-ui-auto-report
      - uses: ./.github/actions/qa-runtime
        with:
          mode: ${{ matrix.mode }}
      - name: Updater unit contracts
        if: contains(matrix.capabilities, 'updater')
        run: pnpm test src/lib/updateService.test.ts src/stores/updateStore.test.ts src/components/UpdateDialog.test.tsx
      - name: Linux native and service dependencies
        if: runner.os == 'Linux' && matrix.mode == 'native'
        # Wayland provisioning installs the GNOME/portal stack on a fresh
        # runner. Azure mirrors can take more than twenty minutes for this
        # dependency set; keep setup bounded while allowing a cold install to
        # finish before the native case timeout starts.
        timeout-minutes: 35
        env:
          QA_LINUX_PROFILE: ${{ matrix.linux_profile }}
          QA_CAPABILITIES: ${{ join(matrix.capabilities, ',') }}
        run: bash .agents/skills/qa-ui-auto/scripts/ci_linux_setup.sh
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.mode == 'native'
      - uses: arduino/setup-protoc@v3
        if: matrix.mode == 'native'
        with:
          repo-token: ${{ github.token }}
      - uses: swatinem/rust-cache@v2
        if: matrix.mode == 'native'
        with:
          workspaces: src-tauri -> target/qa-ui-auto
          shared-key: qa-platforms-${{ matrix.cache_key }}
          # Keep the shared dependency/tool cache independent of the QA app.
          # rust-cache ignores `key` when `shared-key` is also supplied.
          cache-targets: false
          cache-on-failure: true
      - name: Native QA workspace cache
        if: matrix.mode == 'native'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/qa-ui-auto
          # A new revision saves its workspace crates instead of hitting an
          # immutable dependency cache. Separate debug/release workloads so
          # a quick debug run cannot prevent saving the RDP release build.
          key: qa-native-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ contains(matrix.capabilities, 'release') && 'release' || 'debug' }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-${{ needs.plan.outputs.head }}
          restore-keys: |
            qa-native-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ contains(matrix.capabilities, 'release') && 'release' || 'debug' }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
            qa-native-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ contains(matrix.capabilities, 'release') && 'release' || 'debug' }}-
      - name: Windows build tools and WebView2 driver
        if: runner.os == 'Windows' && matrix.mode == 'native'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --yes --no-progress }
          & $perl -MIPC::Cmd -e 'print "Perl ready"'
          if ($LASTEXITCODE -ne 0) { throw 'Complete Perl unavailable' }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
          'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
          $runtimeRoot = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          $runtime = Get-ChildItem -LiteralPath $runtimeRoot -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 runtime unavailable' }
          $zip = Join-Path $env:RUNNER_TEMP 'qa-edgedriver.zip'
          $driver = Join-Path $env:RUNNER_TEMP 'qa-edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $driver -Force
          $driver >> $env:GITHUB_PATH
          if ('${{ contains(matrix.capabilities, 'mstsc') }}' -eq 'true') {
            $dumpZip = Join-Path $env:RUNNER_TEMP 'qa-procdump.zip'
            $dumpTools = Join-Path $env:RUNNER_TEMP 'qa-procdump'
            Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $dumpZip
            Expand-Archive -LiteralPath $dumpZip -DestinationPath $dumpTools -Force
            "QA_MSTSC_PROCDUMP=$(Join-Path $dumpTools 'procdump64.exe')" >> $env:GITHUB_ENV
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (-not (Test-Path -LiteralPath $cdb)) {
              # Microsoft's signed SDK bootstrapper, debugger feature only.
              $sdkSetup = Join-Path $env:RUNNER_TEMP 'qa-debugger-setup.exe'
              Invoke-WebRequest 'https://download.microsoft.com/download/f4b30f2a-4fc3-430e-9b03-c842b5f5f9f1/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $sdkSetup
              if ((Get-FileHash -LiteralPath $sdkSetup -Algorithm SHA256).Hash -ne '6FA0FA27DB77A909F5ECB35183CB26A969A6775936780936FE239E4F9C66B458') { throw 'Unexpected debugger bootstrapper' }
              $install = Start-Process -FilePath $sdkSetup -ArgumentList '/quiet /norestart /features OptionId.WindowsDesktopDebuggers' -Wait -PassThru -WindowStyle Hidden
              if ($install.ExitCode -notin @(0,3010)) { throw "Debugger setup failed: $($install.ExitCode)" }
            }
            if (-not (Test-Path -LiteralPath $cdb)) { throw 'mstsc dump debugger unavailable' }
            "QA_MSTSC_CDB=$cdb" >> $env:GITHUB_ENV
            $gflags = Join-Path (Split-Path -Parent $cdb) 'gflags.exe'
            if (-not (Test-Path -LiteralPath $gflags)) { throw 'mstsc heap verifier unavailable' }
            "QA_MSTSC_GFLAGS=$gflags" >> $env:GITHUB_ENV
          }
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Tesseract installation failed' }
          'C:\Program Files\Tesseract-OCR' >> $env:GITHUB_PATH
      # Hosted audio cases need a loopback device. BlackHole has no controller
      # app or microphone consent sheet to cover capture fixtures on macOS.
      - name: Windows virtual audio output
        if: runner.os == 'Windows' && contains(matrix.capabilities, 'audio')
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: macOS virtual audio output
        if: runner.os == 'macOS' && contains(matrix.capabilities, 'audio')
        run: |
          brew install --cask blackhole-2ch
          sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod
          python - <<'PYTHON'
          import time
          from qa_ui_auto.fixtures.rdp_audio_required import _CoreAudio
          deadline = time.monotonic() + 30
          while True:
              audio = _CoreAudio()
              outputs = [audio.name(device) for device in audio.devices() if audio.has_output(device)]
              if any('BlackHole' in name for name in outputs):
                  print('HAL outputs:', outputs)
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('BlackHole HAL output unavailable')
              time.sleep(0.5)
          PYTHON
      - name: macOS build dependencies
        if: runner.os == 'macOS' && matrix.mode == 'native'
        run: |
          brew install krb5 tesseract
          echo "SHELL=/bin/zsh" >> "$GITHUB_ENV"
          echo "LIBGSSAPI_IMPL=mit" >> "$GITHUB_ENV"
          echo "LIBGSSAPI_PREFIX=$(brew --prefix krb5)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix krb5)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Verify OCR executable and pinned English/Chinese data
        if: matrix.mode == 'native'
        run: python .agents/skills/qa-ui-auto/scripts/setup_screenshot_ocr.py
      - name: Native adapter
        if: matrix.mode == 'native' && runner.os != 'macOS'
        run: cargo install tauri-driver --locked
      - name: Java 25 project runtime
        uses: actions/setup-java@v4
        if: contains(matrix.capabilities, 'java25')
        with:
          distribution: temurin
          java-version: '25'
      - name: Retain Java 25 runtime
        if: contains(matrix.capabilities, 'java25')
        run: echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: contains(matrix.capabilities, 'java')
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: contains(matrix.capabilities, 'java')
        with:
          gradle-version: '9.1.0'
      - name: Prepare local service packages
        if: contains(matrix.capabilities, 'ssh') || contains(matrix.capabilities, 'mysql') || contains(matrix.capabilities, 'vnc') || contains(matrix.capabilities, 'xrdp')
        env:
          QA_CAPABILITIES: ${{ toJSON(matrix.capabilities) }}
        run: python .agents/skills/qa-ui-auto/scripts/ci_services.py install
      - name: Windows mstsc startup diagnostic
        if: runner.os == 'Windows' && matrix.mode == 'native' && contains(matrix.capabilities, 'mstsc')
        run: >-
          python -m qa_ui_auto.rdp_helpers.mstsc
          --preflight 'qa-ui-auto-report/${{ matrix.id }}/mstsc-startup'
      - name: Retain the mstsc startup diagnostic before compiling
        if: always() && runner.os == 'Windows' && matrix.mode == 'native' && contains(matrix.capabilities, 'mstsc')
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-mstsc-startup-${{ needs.plan.outputs.artifact_key }}
          path: qa-ui-auto-report/${{ matrix.id }}/mstsc-startup/
          if-no-files-found: error
          retention-days: 14
      - name: RDP unit contracts on the native platform
        # The IronRDP unit contracts are platform-independent. Run the
        # expensive release test matrix once on the Linux representative;
        # Windows/macOS still execute their real release native RDP cases and
        # startup diagnostics below. This removes a 30–50 minute duplicate
        # Rust test build from each non-Linux native job without changing any
        # release app build or product evidence.
        if: matrix.rdp_unit_contracts
        env:
          CARGO_TARGET_DIR: target/qa-ui-auto
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'
          CARGO_PROFILE_RELEASE_INCREMENTAL: 'true'
        run: |
          mkdir -p 'qa-ui-auto-report/${{ matrix.id }}'
          (
            set -e
            pnpm build
            if [[ "$RUNNER_OS" == "macOS" ]]; then bash scripts/bundle-krb5-macos.sh stage; fi
            cd src-tauri
            cargo test --locked --release -p ironrdp-acceptor -p ironrdp-bulk -p ironrdp-server -p ironrdp-session --lib
            cargo test --locked --release -p ironrdp-server --lib profile_photo_encoder_costs -- --ignored --nocapture
            # The substring filter includes both rdp::* and servers::rdp::*.
            # One invocation covers all contracts without repeated root links.
            cargo test --locked --release --lib rdp::
            cargo test --locked --release --bin rdp-probe
          ) 2>&1 | tee 'qa-ui-auto-report/${{ matrix.id }}/rdp-unit.log'
      - name: Run selected cases (Linux Xvfb desktop)
        if: runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_wrapper == 'xvfb'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp'
          python .agents/skills/qa-ui-auto/scripts/ci_execute.py
          --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY"
          --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Run selected cases (Linux VNC or GNOME Wayland desktop)
        if: runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_wrapper == 'dbus'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          dbus-run-session --
          python .agents/skills/qa-ui-auto/scripts/ci_execute.py
          --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY"
          --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Run selected cases
        if: runner.os != 'Linux' || matrix.mode != 'native'
        env:
          QA_ENTRY: ${{ matrix.id }}
          # Temporary opt-in for the selected macOS pin-close crash investigation.
          TAOMNI_QA_MACOS_LLDB: ${{ runner.os == 'macOS' && matrix.mode == 'native' && inputs.scope == 'selected' && '1' || '0' }}
        run: >-
          python .agents/skills/qa-ui-auto/scripts/ci_execute.py
          --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY"
          --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Stage screenshot outputs under the report root
        if: always()
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          python .agents/skills/qa-ui-auto/scripts/stage_screenshot_artifacts.py
          --source "$RUNNER_TEMP/taomni-qa-artifacts"
          --report "qa-ui-auto-report/$QA_ENTRY"
          --macos-crash-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-${{ matrix.id }}-${{ needs.plan.outputs.artifact_key }}
          path: |
            qa-ui-auto-report/${{ matrix.id }}/
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appdata/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appconfig/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appcache/**
            !qa-ui-auto-report/${{ matrix.id }}/**/_workdirs/**
          if-no-files-found: warn
          retention-days: 14

  summarize:
    name: qa-ui-auto-platforms-result
    if: always() && needs.plan.result != 'skipped'
    needs: [plan, execute]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          pattern: qa-*-${{ needs.plan.outputs.artifact_key }}
          path: qa-downloads
      - name: Collect reports without altering runner receipts
        if: needs.plan.result == 'success'
        run: python .agents/skills/qa-ui-auto/scripts/ci_collect.py qa-downloads qa-ui-auto-report
      - name: Verify results
        if: needs.plan.result == 'success'
        run: python -m qa_ui_auto.ci report --selection qa-ui-auto-report/selection.json --reports qa-ui-auto-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-summary-${{ needs.plan.outputs.artifact_key }}
          path: |
            qa-ui-auto-report/ci-summary.json
            qa-ui-auto-report/summary.md
            qa-ui-auto-report/selection.json
          if-no-files-found: warn

  publish-issues:
    if: >-
      always() && needs.plan.result == 'success' && (inputs.publish_issues ||
      (github.event_name == 'schedule' && vars.QA_UI_AUTO_PUBLISH_ISSUES == 'true')) &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    needs: [plan, summarize]
    runs-on: ubuntu-24.04
    concurrency:
      group: qa-ui-auto-issue-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      # No checkout or execution of the tested source in this privileged job.
      - uses: actions/download-artifact@v4
        with:
          name: qa-summary-${{ needs.plan.outputs.artifact_key }}
          path: qa-summary
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const summary = JSON.parse(fs.readFileSync('qa-summary/ci-summary.json', 'utf8'));
            if (String(summary.run_id) !== String(context.runId)) throw new Error('Wrong run artifact');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const groups = new Map();
            for (const failure of summary.failures || []) {
              const key = `${failure.entry}/${failure.case}`;
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push(String(failure.message).slice(0, 2500));
            }
            for (const [key, messages] of [...groups].slice(0, 50)) {
              const fingerprint = crypto.createHash('sha256').update(key).digest('hex').slice(0, 24);
              const marker = `<!-- qa-ui-auto:${fingerprint} -->`;
              const title = `[QA UI Auto] ${key}`.slice(0, 200);
              const safeMessages = messages.map(m => m.replace(/@/g, '@\u200b').replace(/`/g, "'")).join('\n\n');
              const body = `${marker}\n\n${key.replace(/@/g, '@\u200b')} failed.\n\n` +
                `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
                `Tested commit: ${summary.head}\n\n\`\`\`text\n${safeMessages}\n\`\`\`\n\n` +
                'See the run summary and artifacts for original receipts, screenshots and setup logs. This QA workflow is independent of PR/release gates.';
              const existing = issues.find(i => !i.pull_request && (i.body || '').includes(marker));
              if (existing) await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              else await github.rest.issues.create({owner, repo, title, body});
            }

  # collector makes failures and completed cases observable without waiting for
  # every platform to finish.
  live-shard-collector:
    name: download completed QA shards
    needs: plan
    if: always() && needs.plan.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      QA_REPOSITORY: ${{ github.repository }}
      QA_RUN_ID: ${{ github.run_id }}
      QA_ARTIFACT_KEY: ${{ needs.plan.outputs.artifact_key }}
      QA_HEAD: ${{ needs.plan.outputs.head }}
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - name: Poll and download completed shard artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest test_ci_live_monitor
          mkdir -p live-shards
          python .agents/skills/qa-ui-auto/scripts/ci_live_shards.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-live-shards-${{ needs.plan.outputs.artifact_key }}
          path: live-shards/
          if-no-files-found: warn
          retention-days: 14

  # The native packaging hook bundles the frontend on each OS. Check its TS
  # and source contracts once, including focused runs that omit Vitest.
  selected-build-checks:
    name: Selected native frontend build checks
    needs: plan
    if: >-
      inputs.scope == 'selected' && needs.plan.outputs.has_native == 'true' &&
      github.event_name != 'pull_request' && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/qa-runtime
        with:
          mode: contracts
      - run: pnpm exec tsc -b && pnpm check:refactor

  frontend-contracts:
    name: Frontend contracts (shard ${{ matrix.shard }}/4)
    needs: plan
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.scope != 'selected'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/qa-runtime
        with:
          mode: contracts
      - name: Reject increased UI debt against the pull request base
        if: matrix.shard == 1 && github.event_name == 'pull_request'
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$QA_BASE"
          node scripts/ui-standard-lint.mjs --base "$QA_BASE"
      - name: Frontend refactor and QA script unit contracts
        if: matrix.shard == 1
        run: |
          set -o pipefail
          mkdir -p qa-build-output
          {
            python -m unittest test_browser_vault_first_run test_tao_provider_observation test_tao_messages_fixture test_tao_real_scenarios test_tao_real_documents test_tao_handoff_persistence test_markdown_docx_quality test_markdown_testing_quality test_export_quality_native
            node --test .agents/skills/qa-ui-auto/scripts/test_native_paced_input.mjs .agents/skills/qa-ui-auto/scripts/test_native_pointer_activation.mjs
            python -m unittest test_ci_ssh_features test_ci_x11_session test_ci_build_pipeline test_native_windows_integrity test_native_frame_errors test_native_pointer test_native_element_query test_ci_file_manager test_native_application_restart test_native_application_shutdown test_native_window_close_x11 test_native_external_browser test_native_authorization_route test_backup_cloud test_ci_selection test_terminal_rendering_probe qa_ui_auto.test_mobile_native test_native_drag test_tauri_webdriver.NativeSessionFillTest qa_ui_auto.test_mobile_case_readiness qa_ui_auto.test_mobile_openssh_readiness
            pnpm exec tsc -b
            pnpm check:refactor
            node --test scripts/ui-standard-lint.test.mjs scripts/terminal-webgl-backport.test.mjs
          } 2>&1 | tee qa-build-output/frontend-unit-contracts.log
      - name: Frontend Vitest unit regressions
        run: |
          set -o pipefail
          mkdir -p qa-build-output
          pnpm exec vitest run --shard=${{ matrix.shard }}/4 2>&1 | tee -a qa-build-output/frontend-unit-contracts.log
      - name: Retain frontend contract logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-contracts-shard-${{ matrix.shard }}-${{ needs.plan.outputs.artifact_key }}
          path: qa-build-output/frontend-unit-contracts.log
          if-no-files-found: warn
          retention-days: 14

  summarize:
    name: qa-ui-auto-platforms-result
    if: always() && needs.plan.result != 'skipped'
    needs: [plan, tool-contracts, sftp-contracts, selected-build-checks, frontend-contracts, signed-modular-packages, signed-mfa-linux, signed-mfa-windows, signed-mfa-macos, signed-vnc-linux, signed-vnc-windows, signed-vnc-macos, signed-rdp-linux, signed-rdp-windows, signed-rdp-macos, signed-mail, signed-screenshot, signed-vnc-server, signed-servers, signed-voice, signed-sockscap, signed-taoffice-video, signed-taoffice-pdf, signed-taoffice-excel, signed-taoffice-word, signed-taoffice-project, signed-taoffice-ppt, signed-taoffice-visio, signed-rdp-server-linux, signed-rdp-server-windows, signed-rdp-server-macos, taoffice-visio-browser-frontend, execute-browser, execute-macos-browser, build-linux, build-windows, build-macos, execute-linux-native, execute-windows-native, execute-macos-native, native-contracts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .agents/skills/qa-ui-auto/requirements-ci.txt
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1
      - uses: ./.github/actions/qa-download-artifact
        if: needs.plan.result == 'success'
        with:
          pattern: qa-*-${{ needs.plan.outputs.artifact_key }}
          path: qa-downloads
      - name: Collect reports without altering runner receipts
        if: needs.plan.result == 'success'
        run: python .agents/skills/qa-ui-auto/scripts/ci_collect.py qa-downloads qa-ui-auto-report
      - name: Verify results
        if: needs.plan.result == 'success'
        run: python -m qa_ui_auto.ci report --selection qa-ui-auto-report/selection.json --reports qa-ui-auto-report
      - name: Include supporting job results
        if: always() && needs.plan.result == 'success'
        env:
          QA_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, sys
          jobs = {name: job['result'] for name, job in json.loads(os.environ['QA_JOB_RESULTS']).items()}
          failures = [name for name, result in jobs.items() if result not in ('success', 'skipped')]
          path = pathlib.Path('qa-ui-auto-report/ci-summary.json')
          if path.exists():
              result = json.loads(path.read_text())
              result['job_results'] = jobs
              if failures:
                  result['passed'] = False
                  result['report_ok'] = False
                  for name in failures:
                      message = f'Workflow job failed: {name}'
                      result['infrastructure_errors'].append({'entry': name, 'message': message})
                      result['failures'].append({'entry': name, 'group_id': name, 'case': 'infrastructure', 'message': message})
              path.write_text(json.dumps(result, indent=2) + '\n')
          text = '\nSupporting jobs: ' + ', '.join(f'{name}={status}' for name, status in jobs.items()) + '\n'
          for target in ('qa-ui-auto-report/summary.md', os.environ['GITHUB_STEP_SUMMARY']):
              with open(target, 'a') as stream:
                  stream.write(text)
          sys.exit(bool(failures))
          PYTHON
      - name: Require all planned cases to pass
        if: needs.plan.result == 'success'
        run: python -c "import json, sys; result = json.load(open('qa-ui-auto-report/ci-summary.json')); sys.exit(0 if result['passed'] else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-summary-${{ needs.plan.outputs.artifact_key }}
          path: |
            qa-ui-auto-report/ci-summary.json
            qa-ui-auto-report/summary.md
            qa-ui-auto-report/selection.json
          if-no-files-found: warn

  publish-issues:
    if: >-
      always() && needs.plan.result == 'success' && (inputs.publish_issues ||
      (github.event_name == 'schedule' && vars.QA_UI_AUTO_PUBLISH_ISSUES == 'true')) &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    needs: [plan, summarize]
    runs-on: ubuntu-24.04
    concurrency:
      group: qa-ui-auto-issue-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      # No checkout or execution of the tested source in this privileged job.
      - uses: actions/download-artifact@v4
        with:
          name: qa-summary-${{ needs.plan.outputs.artifact_key }}
          path: qa-summary
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const summary = JSON.parse(fs.readFileSync('qa-summary/ci-summary.json', 'utf8'));
            if (String(summary.run_id) !== String(context.runId)) throw new Error('Wrong run artifact');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const groups = new Map();
            for (const failure of summary.failures || []) {
              const key = `${failure.group_id || failure.entry}/${failure.case}`;
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push(String(failure.message).slice(0, 2500));
            }
            for (const [key, messages] of [...groups].slice(0, 50)) {
              const fingerprint = crypto.createHash('sha256').update(key).digest('hex').slice(0, 24);
              const marker = `<!-- qa-ui-auto:${fingerprint} -->`;
              const title = `[QA UI Auto] ${key}`.slice(0, 200);
              const safeMessages = messages.map(m => m.replace(/@/g, '@\u200b').replace(/`/g, "'")).join('\n\n');
              const body = `${marker}\n\n${key.replace(/@/g, '@\u200b')} failed.\n\n` +
                `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
                `Tested commit: ${summary.head}\n\n\`\`\`text\n${safeMessages}\n\`\`\`\n\n` +
                'See the run summary and artifacts for original receipts, screenshots and setup logs. This QA workflow is independent of PR/release gates.';
              const existing = issues.find(i => !i.pull_request && (i.body || '').includes(marker));
              if (existing) await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              else await github.rest.issues.create({owner, repo, title, body});
            }

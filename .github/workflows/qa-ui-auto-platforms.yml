name: QA UI Auto Platforms

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope
        type: choice
        options: [smoke, all, impacted, selected]
        default: smoke
      head:
        description: Commit/ref to test (empty = workflow ref)
        type: string
      base:
        description: Explicit base commit/ref for impacted scope
        type: string
      platforms:
        description: Comma-separated linux,windows,macos
        type: string
        default: linux,windows,macos
      modes:
        description: Comma-separated browser,native
        type: string
        default: browser,native
      linux_profiles:
        description: 'Linux native profiles (CSV): ubuntu-24.04-xvfb,ubuntu-22.04-x11,ubuntu-22.04-vnc,ubuntu-26.04-wayland'
        type: string
        default: ubuntu-24.04-xvfb
      shards:
        description: 'Shards per platform/mode/profile: auto or 1-8 (selected also fans out)'
        type: string
        default: auto
      browser_workers:
        description: Workers within independent browser shards (1-4)
        type: number
        default: 2
      native_release:
        description: Use release QA builds for selected native cases (reuse full-run caches)
        type: boolean
        default: false
      run_rdp_unit_contracts:
        description: Run RDP Rust unit contracts (disable only when reusing matching prior unit evidence)
        type: boolean
        default: true
      case_ids:
        description: Exact case IDs (selected, or additions to impacted)
        type: string
      features:
        description: Feature IDs (union with case IDs/tags)
        type: string
      tags:
        description: Tags (union)
        type: string
      publish_issues:
        description: Update deduplicated failure issues
        type: boolean
        default: false
  workflow_call:
    inputs:
      scope: {type: string, default: smoke}
      head: {type: string, default: ''}
      base: {type: string, default: ''}
      platforms: {type: string, default: 'linux,windows,macos'}
      modes: {type: string, default: 'browser,native'}
      linux_profiles: {type: string, default: 'ubuntu-24.04-xvfb'}
      shards: {type: string, default: auto}
      browser_workers: {type: number, default: 2}
      native_release: {type: boolean, default: false}
      run_rdp_unit_contracts: {type: boolean, default: true}
      case_ids: {type: string, default: ''}
      features: {type: string, default: ''}
      tags: {type: string, default: ''}
      publish_issues: {type: boolean, default: false}
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/src/**'
      - 'vite-plugins/**'
      - 'qa-ui-auto-tests/**'
      - '.agents/skills/qa-ui-auto/**'
      - '.github/workflows/qa-ui-auto-platforms.yml'
      - '.github/workflows/qa-ui-auto-entry.yml'
      - '.github/actions/qa-runtime/**'
      - 'docs-feature/code-workspace-idea-parity/**'
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read

env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  DEV_PROXY_ALLOW_PRIVATE: '1'

defaults:
  run:
    shell: bash

jobs:
  development-case-contract:
    name: Development case contract
    if: github.event_name == 'pull_request' && inputs.scope == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1
      - name: Check changed code has a QA case path
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python .agents/skills/qa-ui-auto/scripts/qa_ui_auto/dev_contract.py --base "$QA_BASE" --head "$QA_HEAD"

  tool-contracts:
    if: (github.event_name != 'pull_request' || inputs.scope != '') && inputs.scope != 'selected'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1 numpy==2.4.4 Pillow==12.1.1
      - name: Validate QA tools
        if: inputs.scope != 'selected'
        run: python -m unittest test_credential_store test_ci_sharding test_ci_build_pipeline test_ci_native_artifact test_ci_selection test_ci_report test_ci_execute test_ci_desktop test_navigation test_ci_provenance test_ci_services test_vnc_required test_dev_contract test_rdp_encoder_tools test_mstsc_process test_native_fixture_cleanup test_native_webdriver_transport test_tauri_webdriver.NativeSessionTransportTest test_tauri_webdriver.NativeSessionFillTest test_tauri_webdriver.MacosDebuggerProcessTest test_host_clipboard test_verification_workflow test_native_isolation.NativeIsolationTest test_updater_fixture test_mouse_steps test_native_assertions test_window_drag test_element_geometry test_screenshot_scenarios test_color_input test_drag_path test_screenshot_mask test_stage_screenshot_artifacts test_setup_screenshot_ocr
      - name: Native pointer readiness contracts
        if: inputs.scope != 'selected'
        run: python -m unittest test_native_pointer
      - name: Linux package setup contracts
        run: python -m unittest test_ci_linux_setup test_ci_setup_protoc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Updater packaging unit contracts
        if: inputs.scope != 'selected'
        run: node --test scripts/compose-updater-manifest.test.mjs .agents/skills/qa-ui-auto/scripts/test_ci_macos_consent.cjs
      - name: Wayland automation contracts
        if: inputs.scope != 'selected'
        run: python -m unittest test_wayland_tools test_multi_display test_ci_wayland_startup

  plan:
    if: github.event_name != 'pull_request' || inputs.scope != ''
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      linux_native_matrix: ${{ steps.plan.outputs.linux_native_matrix }}
      linux_build_matrix: ${{ steps.plan.outputs.linux_build_matrix }}
      has_linux_native: ${{ steps.plan.outputs.has_linux_native }}
      windows_native_matrix: ${{ steps.plan.outputs.windows_native_matrix }}
      windows_build_matrix: ${{ steps.plan.outputs.windows_build_matrix }}
      has_windows_native: ${{ steps.plan.outputs.has_windows_native }}
      macos_native_matrix: ${{ steps.plan.outputs.macos_native_matrix }}
      macos_build_matrix: ${{ steps.plan.outputs.macos_build_matrix }}
      has_macos_native: ${{ steps.plan.outputs.has_macos_native }}
      contracts_matrix: ${{ steps.plan.outputs.contracts_matrix }}
      has_contracts: ${{ steps.plan.outputs.has_contracts }}
      has_cases: ${{ steps.plan.outputs.has_cases }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      has_browser: ${{ steps.plan.outputs.has_browser }}
      has_native: ${{ steps.plan.outputs.has_native }}
      head: ${{ steps.plan.outputs.head }}
      artifact_key: ${{ steps.invocation.outputs.key }}
    steps:
      - name: Allocate invocation identity
        id: invocation
        run: python3 -c 'import os, uuid; open(os.environ["GITHUB_OUTPUT"], "a").write("key=" + uuid.uuid4().hex + "\n")'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1 numpy==2.4.4 Pillow==12.1.1
      - name: Catalog contract gate
        run: python -m qa_ui_auto.audit --gate
      - name: Plan exact cases and dependencies
        id: plan
        env:
          QA_SCOPE: ${{ github.event_name == 'schedule' && 'all' || inputs.scope || 'smoke' }}
          QA_BASE: ${{ inputs.base }}
          QA_PLATFORMS: ${{ inputs.platforms }}
          QA_MODES: ${{ inputs.modes }}
          QA_LINUX_PROFILES: ${{ inputs.linux_profiles }}
          QA_NATIVE_RELEASE: ${{ inputs.native_release }}
          QA_SHARDS: ${{ inputs.shards }}
          QA_BROWSER_WORKERS: ${{ inputs.browser_workers }}
          QA_CASE_IDS: ${{ inputs.case_ids }}
          QA_FEATURES: ${{ inputs.features }}
          QA_TAGS: ${{ inputs.tags }}
        run: python -m qa_ui_auto.ci plan
      - uses: actions/upload-artifact@v4
        with:
          name: qa-selection-${{ steps.invocation.outputs.key }}
          path: qa-ui-auto-report/selection.json
          if-no-files-found: error

  execute-browser:
    needs: plan
    if: needs.plan.outputs.has_browser == 'true'
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.browser_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: run
      run_rdp_unit_contracts: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.run_rdp_unit_contracts }}

  build-linux:
    needs: plan
    if: needs.plan.outputs.has_linux_native == 'true'
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.linux_build_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: build

  execute-linux-native:
    needs: [plan, build-linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-linux.result == 'success' && needs.plan.outputs.has_linux_native == 'true' }}
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.linux_native_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: run

  build-windows:
    needs: plan
    if: needs.plan.outputs.has_windows_native == 'true'
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.windows_build_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: build

  execute-windows-native:
    needs: [plan, build-windows]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-windows.result == 'success' && needs.plan.outputs.has_windows_native == 'true' }}
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.windows_native_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: run

  build-macos:
    needs: plan
    if: needs.plan.outputs.has_macos_native == 'true'
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.macos_build_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: build

  execute-macos-native:
    needs: [plan, build-macos]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build-macos.result == 'success' && needs.plan.outputs.has_macos_native == 'true' }}
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.macos_native_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: run

  native-contracts:
    needs: plan
    if: needs.plan.outputs.has_contracts == 'true'
    uses: ./.github/workflows/qa-ui-auto-entry.yml
    with:
      matrix: ${{ needs.plan.outputs.contracts_matrix }}
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      operation: contracts
      run_rdp_unit_contracts: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.run_rdp_unit_contracts }}

  summarize:
    name: qa-ui-auto-platforms-result
    if: always() && needs.plan.result != 'skipped'
    needs: [plan, tool-contracts, execute-browser, build-linux, build-windows, build-macos, execute-linux-native, execute-windows-native, execute-macos-native, native-contracts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1
      - uses: actions/download-artifact@v4
        if: needs.plan.result == 'success'
        with:
          pattern: qa-*-${{ needs.plan.outputs.artifact_key }}
          path: qa-downloads
      - name: Collect reports without altering runner receipts
        if: needs.plan.result == 'success'
        run: python .agents/skills/qa-ui-auto/scripts/ci_collect.py qa-downloads qa-ui-auto-report
      - name: Verify results
        if: needs.plan.result == 'success'
        run: python -m qa_ui_auto.ci report --selection qa-ui-auto-report/selection.json --reports qa-ui-auto-report
      - name: Include supporting job results
        if: always() && needs.plan.result == 'success'
        env:
          QA_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib, sys
          jobs = {name: job['result'] for name, job in json.loads(os.environ['QA_JOB_RESULTS']).items()}
          failures = [name for name, result in jobs.items() if result not in ('success', 'skipped')]
          path = pathlib.Path('qa-ui-auto-report/ci-summary.json')
          if path.exists():
              result = json.loads(path.read_text())
              result['job_results'] = jobs
              if failures:
                  result['passed'] = False
                  result['report_ok'] = False
                  for name in failures:
                      message = f'Workflow job failed: {name}'
                      result['infrastructure_errors'].append({'entry': name, 'message': message})
                      result['failures'].append({'entry': name, 'group_id': name, 'case': 'infrastructure', 'message': message})
              path.write_text(json.dumps(result, indent=2) + '\n')
          text = '\nSupporting jobs: ' + ', '.join(f'{name}={status}' for name, status in jobs.items()) + '\n'
          for target in ('qa-ui-auto-report/summary.md', os.environ['GITHUB_STEP_SUMMARY']):
              with open(target, 'a') as stream:
                  stream.write(text)
          sys.exit(bool(failures))
          PYTHON
      - name: Require selected cases to pass
        if: needs.plan.result == 'success' && inputs.scope == 'selected'
        run: python -c "import json, sys; result = json.load(open('qa-ui-auto-report/ci-summary.json')); sys.exit(0 if result['passed'] else 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-summary-${{ needs.plan.outputs.artifact_key }}
          path: |
            qa-ui-auto-report/ci-summary.json
            qa-ui-auto-report/summary.md
            qa-ui-auto-report/selection.json
          if-no-files-found: warn

  publish-issues:
    if: >-
      always() && needs.plan.result == 'success' && (inputs.publish_issues ||
      (github.event_name == 'schedule' && vars.QA_UI_AUTO_PUBLISH_ISSUES == 'true')) &&
      github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    needs: [plan, summarize]
    runs-on: ubuntu-24.04
    concurrency:
      group: qa-ui-auto-issue-publisher
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      # No checkout or execution of the tested source in this privileged job.
      - uses: actions/download-artifact@v4
        with:
          name: qa-summary-${{ needs.plan.outputs.artifact_key }}
          path: qa-summary
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const summary = JSON.parse(fs.readFileSync('qa-summary/ci-summary.json', 'utf8'));
            if (String(summary.run_id) !== String(context.runId)) throw new Error('Wrong run artifact');
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const groups = new Map();
            for (const failure of summary.failures || []) {
              const key = `${failure.group_id || failure.entry}/${failure.case}`;
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push(String(failure.message).slice(0, 2500));
            }
            for (const [key, messages] of [...groups].slice(0, 50)) {
              const fingerprint = crypto.createHash('sha256').update(key).digest('hex').slice(0, 24);
              const marker = `<!-- qa-ui-auto:${fingerprint} -->`;
              const title = `[QA UI Auto] ${key}`.slice(0, 200);
              const safeMessages = messages.map(m => m.replace(/@/g, '@\u200b').replace(/`/g, "'")).join('\n\n');
              const body = `${marker}\n\n${key.replace(/@/g, '@\u200b')} failed.\n\n` +
                `Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}\n\n` +
                `Tested commit: ${summary.head}\n\n\`\`\`text\n${safeMessages}\n\`\`\`\n\n` +
                'See the run summary and artifacts for original receipts, screenshots and setup logs. This QA workflow is independent of PR/release gates.';
              const existing = issues.find(i => !i.pull_request && (i.body || '').includes(marker));
              if (existing) await github.rest.issues.update({owner, repo, issue_number: existing.number, body});
              else await github.rest.issues.create({owner, repo, title, body});
            }

name: QA UI Auto Platforms
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  system-index:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Provision and independently query Windows Search
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./.github/index-probe/prepare.ps1
          $value = Get-Content probe-results/control.json -Raw | ConvertFrom-Json
          Add-Content $env:GITHUB_ENV "TAOMNI_FILE_SEARCH_INDEXED_CONTROL=$($value.path)"
      - name: Independently query Spotlight
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p probe-results
          /usr/bin/mdfind -0 'kMDItemFSName == "Calculator.app"' > probe-results/spotlight-control.nul
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = '/System/Applications/Calculator.app'
          assert path.encode() in Path('probe-results/spotlight-control.nul').read_bytes().split(bytes([0]))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'TAOMNI_FILE_SEARCH_INDEXED_CONTROL={path}\n')
          PY
      - name: Run real system index through production search engine
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p taomni-file-search 2>&1 | tee probe-results/units.log
          cargo test --locked --manifest-path src-tauri/Cargo.toml -p taomni-file-search indexed_system_control -- --ignored --nocapture 2>&1 | tee probe-results/production-index.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-index-${{ runner.os }}
          path: probe-results
          retention-days: 14
          if-no-files-found: warn

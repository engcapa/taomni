name: QA UI Auto Platforms

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Test scope
        type: choice
        options: [smoke, all, impacted, selected]
        default: smoke
      head:
        description: Commit/ref to test (empty = workflow ref)
        type: string
      base:
        description: Explicit base commit/ref for impacted scope
        type: string
      platforms:
        description: Comma-separated linux,windows,macos
        type: string
        default: linux,windows,macos
      modes:
        description: Comma-separated browser,native
        type: string
        default: browser,native
      linux_profiles:
        description: 'Linux native profiles (CSV): ubuntu-24.04-xvfb,ubuntu-22.04-x11,ubuntu-22.04-vnc,ubuntu-26.04-wayland'
        type: string
        default: ubuntu-24.04-xvfb
      macos_runner:
        description: Hosted macOS image (Intel or macOS 26 can recover unavailable macOS 15 ARM64 capacity)
        type: choice
        options: [macos-15, macos-15-intel, macos-26]
        default: macos-15
      shards:
        description: 'Shards per platform/mode/profile: auto or 1-8 (selected also fans out)'
        type: string
        default: auto
      browser_workers:
        description: Workers within independent browser shards (1-4)
        type: number
        default: 2
      first_release_run:
        description: Release Bundle run supplying the frozen business roster for TC-MODULES-040 or the full native crash profile
        type: string
        default: ''
      module_profile:
        description: Installation state for a selected crash-regression run
        type: choice
        options: [default, core-only, full]
        default: default
      native_release:
        description: Use release QA builds for selected native cases (reuse full-run caches)
        type: boolean
        default: false
      modular_rdp_p95:
        description: Apply the modular release allowance to RDP latency p95
        type: boolean
        default: false
      workspace_stage_trace:
        description: Diagnostic workspace task/layout tracing (exclude from performance acceptance)
        type: boolean
        default: false
      run_rdp_unit_contracts:
        description: Run RDP Rust unit contracts (disable only when reusing matching prior unit evidence)
        type: boolean
        default: true
      case_ids:
        description: Exact case IDs (selected, or additions to impacted)
        type: string
      features:
        description: Feature IDs (union with case IDs/tags)
        type: string
      tags:
        description: Tags (union)
        type: string
      publish_issues:
        description: Update deduplicated failure issues
        type: boolean
        default: false
      nightly_policy:
        description: Apply the nightly coverage policy to this manual dispatch
        type: boolean
        default: false
      night_label:
        description: Night label YYYY-MM-DD for manual nightly-policy simulation (empty = now)
        type: string
      nightly_sample_percent:
        description: Native shared-case sample percent per rotation window (1-100; empty = 20)
        type: string
      vendor_cache:
        description: Vendored Cargo dependency cache experiment, enabled by default (true/false)
        type: string
        default: 'true'
      trusted_cache:
        description: Reuse Cargo dependency archives from the trusted default branch (true/false)
        type: string
        default: 'true'
  workflow_call:
    inputs:
      scope: {type: string, default: smoke}
      head: {type: string, default: ''}
      base: {type: string, default: ''}
      platforms: {type: string, default: 'linux,windows,macos'}
      modes: {type: string, default: 'browser,native'}
      linux_profiles: {type: string, default: 'ubuntu-24.04-xvfb'}
      macos_runner: {type: string, default: macos-15}
      shards: {type: string, default: auto}
      browser_workers: {type: number, default: 2}
      first_release_run: {type: string, default: ''}
      module_profile: {type: string, default: default}
      native_release: {type: boolean, default: false}
      modular_rdp_p95: {type: boolean, default: false}
      workspace_stage_trace: {type: boolean, default: false}
      run_rdp_unit_contracts: {type: boolean, default: true}
      case_ids: {type: string, default: ''}
      features: {type: string, default: ''}
      tags: {type: string, default: ''}
      publish_issues: {type: boolean, default: false}
      nightly_policy: {type: boolean, default: false}
      night_label: {type: string, default: ''}
      nightly_sample_percent: {type: string, default: ''}
      vendor_cache: {type: string, default: 'true'}
      trusted_cache: {type: string, default: 'true'}
  pull_request:
    paths:
      - 'src/**'
      - 'mobile-web/**'
      - 'src-tauri/build.rs'
      - 'src-tauri/src/**'
      - 'src-tauri/crates/**'
      - 'src-tauri/plugins/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'vite.config.ts'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/tauri*.conf.json'
      - 'src-tauri/capabilities/**'
      - 'src-tauri/resources/**'
      - 'public/**'
      - 'index.html'
      - 'tsconfig*.json'
      - 'vite-plugins/**'
      - 'qa-ui-auto-tests/**'
      - '.agents/skills/qa-ui-auto/**'
      - '.github/workflows/qa-ui-auto-platforms.yml'
      - '.github/workflows/qa-ui-auto-entry.yml'
      - '.github/actions/qa-branch-artifact/**'
      - '.github/actions/qa-runtime/**'
      - 'docs-feature/code-workspace-idea-parity/**'
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  DEV_PROXY_ALLOW_PRIVATE: '1'

defaults:
  run:
    shell: bash

jobs:
  sftp-contracts:
    name: SFTP navigation and window contracts
    if: >-
      inputs.scope == 'all' || contains(inputs.case_ids, 'TC-SFTP-') ||
      contains(inputs.case_ids, 'TC-043') || contains(inputs.case_ids, 'TC-145') ||
      contains(inputs.case_ids, 'TC-IDE-PARITY-027-02')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/qa-runtime
        with:
          mode: contracts
      - name: QA case and control catalog
        run: python -m unittest test_control_coverage_window test_window_context && python -m qa_ui_auto.audit --gate
      - name: TypeScript and source boundaries
        run: pnpm exec tsc -b && pnpm check:refactor
      - name: SFTP lifecycle, navigation and floating controls
        run: >-
          pnpm exec vitest run --maxWorkers=2
          src/components/filebrowser/SftpFloatingButton.test.tsx
          src/components/filebrowser/SftpDetachedWindow.test.tsx
          src/components/filebrowser/browser/useFileBrowserConnection.test.tsx
          src/layouts/main/reattachSftp.test.ts
          src/layouts/MainLayout.test.tsx
          src/stores/sftpStore.test.ts
          src/lib/detachedSession.test.ts

  development-case-contract:
    name: Development case contract
    if: github.event_name == 'pull_request' && inputs.scope == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1
      - name: Check changed code has a QA case path
        env:
          QA_BASE: ${{ github.event.pull_request.base.sha }}
          QA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python .agents/skills/qa-ui-auto/scripts/qa_ui_auto/dev_contract.py --base "$QA_BASE" --head "$QA_HEAD"

  tool-contracts:
    if: (github.event_name != 'pull_request' || inputs.scope != '') && inputs.scope != 'selected'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .agents/skills/qa-ui-auto/requirements-ci.txt
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1 numpy==2.4.4 Pillow==12.1.1
      - name: Validate QA tools
        if: inputs.scope != 'selected'
        run: python -m unittest test_native_application_restart test_native_restore_relaunch test_native_application_shutdown test_native_process_group test_native_driver_lifecycle test_native_windows_integrity test_session_config test_credential_store test_credential_store_readiness test_ci_sharding test_ci_build_pipeline test_ci_native_artifact test_ci_selection test_ci_report test_ci_execute test_ci_desktop test_navigation test_ci_provenance test_ci_services test_ci_tcp_throttle test_ci_mysql test_ci_clickhouse test_ci_maven_warmup test_java_real_project test_vnc_required test_dev_contract test_rdp_encoder_tools test_mstsc_process test_native_fixture_cleanup test_native_webdriver_transport test_tauri_webdriver.NativeSessionTransportTest test_tauri_webdriver.NativeSessionFillTest test_tauri_webdriver.MacosDebuggerProcessTest test_host_clipboard test_folder_dialog test_folder_dialog_wayland test_folder_dialog_macos test_verification_workflow test_native_isolation.NativeIsolationTest test_native_reset_boundaries test_native_window_focus test_window_context test_updater_fixture test_native_app_menu test_mouse_steps test_native_assertions test_window_drag test_element_geometry test_screenshot_scenarios test_color_input test_drag_path test_screenshot_mask test_stage_screenshot_artifacts test_setup_screenshot_ocr
      - name: Native pointer and SSH desktop fixture contracts
        if: inputs.scope != 'selected'
        run: python -m unittest test_native_pointer test_native_element_query test_ci_file_manager test_ci_x11_session test_ci_ssh_features test_runtime_errors test_native_resize_observer test_native_console test_terminal_burst_probe test_ci_windows_ssh_shell test_ci_windows_posix_ssh test_native_drag test_backup_cloud test_backup_journal test_browser_evidence test_keyboard_steps
      - name: Language startup process and observation contracts
        if: inputs.scope != 'selected'
        run: python -m unittest test_language_startup_observer test_sdk_startup_probe test_workspace_slow_sdk test_sdk_editor_input test_sdk_action_trace test_file_open_probe test_workspace_stage_trace test_project_tree_reveal test_browser_tracing test_workspace_tab_reveal test_native_contenteditable test_native_paced_input test_rdp_deferred_clipboard
      - name: Linux package setup contracts
        run: python -m unittest test_ci_linux_setup test_ci_setup_protoc test_ci_cargo_artifact
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: macOS folder chooser automation contracts
        if: inputs.scope != 'selected'
        run: python -m unittest test_folder_dialog_macos
      - name: Updater packaging unit contracts
        if: inputs.scope != 'selected'
        run: node --test scripts/compose-updater-manifest.test.mjs .agents/skills/qa-ui-auto/scripts/test_ci_macos_consent.cjs
      - name: Browser and native language startup observer contracts
        if: inputs.scope != 'selected'
        run: node --test .agents/skills/qa-ui-auto/scripts/test_language_startup_observer.mjs .agents/skills/qa-ui-auto/scripts/test_native_language_startup_observer.mjs .agents/skills/qa-ui-auto/scripts/test_sdk_action_trace.mjs .agents/skills/qa-ui-auto/scripts/test_file_open_probe.mjs .agents/skills/qa-ui-auto/scripts/test_native_paced_input.mjs .agents/skills/qa-ui-auto/scripts/test_native_pointer_activation.mjs
      - name: Wayland automation contracts
        if: inputs.scope != 'selected'
        run: python -m unittest test_wayland_tools test_multi_display test_ci_wayland_startup test_ci_wayland_capture test_screenshot_flash_sampler

  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      linux_native_matrix: ${{ steps.plan.outputs.linux_native_matrix }}
      linux_build_matrix: ${{ steps.plan.outputs.linux_build_matrix }}
      has_linux_native: ${{ steps.plan.outputs.has_linux_native }}
      windows_native_matrix: ${{ steps.plan.outputs.windows_native_matrix }}
      windows_build_matrix: ${{ steps.plan.outputs.windows_build_matrix }}
      has_windows_native: ${{ steps.plan.outputs.has_windows_native }}
      macos_native_matrix: ${{ steps.plan.outputs.macos_native_matrix }}
      macos_build_matrix: ${{ steps.plan.outputs.macos_build_matrix }}
      has_macos_native: ${{ steps.plan.outputs.has_macos_native }}
      contracts_matrix: ${{ steps.plan.outputs.contracts_matrix }}
      has_contracts: ${{ steps.plan.outputs.has_contracts }}
      has_cases: ${{ steps.plan.outputs.has_cases }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      macos_browser_matrix: ${{ steps.plan.outputs.macos_browser_matrix }}
      has_macos_browser: ${{ steps.plan.outputs.has_macos_browser }}
      native_matrix: ${{ steps.plan.outputs.native_matrix }}
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      has_browser: ${{ steps.plan.outputs.has_browser }}
      has_native: ${{ steps.plan.outputs.has_native }}
      head: ${{ steps.plan.outputs.head }}
      artifact_key: ${{ steps.invocation.outputs.key }}
    steps:
      - name: Allocate invocation identity
        id: invocation
        run: python3 -c 'import os, uuid; open(os.environ["GITHUB_OUTPUT"], "a").write("key=" + uuid.uuid4().hex + "\n")'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head || github.sha }}
          fetch-depth: ${{ inputs.scope == 'impacted' && 0 || 1 }}
          persist-credentials: false
      # Scheduled runs share the account's Free-plan concurrency (20 jobs, 5
      # macOS) with other QA runs. Wait for earlier same-workflow runs so the
      # slow native tail does not compete for macOS slots; fail open on timeout.
      - name: Wait for earlier QA platform runs
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          QA_GATE_WORKFLOW: qa-ui-auto-platforms.yml
          QA_GATE_MAX_WAIT_SECONDS: '1200'
        run: python .github/scripts/qa_capacity_gate.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .agents/skills/qa-ui-auto/requirements-ci.txt
      - run: python -m pip install pyyaml==6.0.2 jsonschema==4.25.1 numpy==2.4.4 Pillow==12.1.1
      - name: Mandatory crash regression selection and result contracts
        run: python -m unittest test_crash_regressions test_ui_contract_gen test_ui_contrast
      - name: Hosted platform selection and dependency recovery contracts
        run: python -m unittest test_ci_selection.MacosRunnerSelectionTests test_ci_linux_apt
      - name: Source paste and restore observation contracts
        run: python -m unittest test_fill_paste test_keyboard_steps test_native_contenteditable test_native_webdriver_transport test_native_restore_relaunch test_module_restore_observation test_module_restore_retained_observation
      - name: Official module artifact, trust boundary and lifecycle case contracts
        run: python -m unittest test_module_signed_archive test_module_mail_observation test_module_package_signing test_module_package_runner test_module_first_release test_module_signed_observation test_module_business_lifecycle_observation test_module_execution test_module_download_observation test_module_marketplace_observation test_module_upgrade_observation test_legacy_release test_module_network_gate test_module_offline_archive test_module_backup_observation qa_ui_auto.test_core_profile_state
      - name: Cold-start fixture filesystem contracts
        run: python -m unittest test_workspace_ignored_ancestor test_workspace_home_documents
      - name: Catalog contract gate
        run: python -m qa_ui_auto.audit --gate
      - name: Plan exact cases and dependencies
        id: plan
        env:
          QA_SCOPE: ${{ inputs.scope || github.event_name == 'pull_request' && 'selected' || github.event_name == 'schedule' && 'all' || 'smoke' }}
          QA_BASE: ${{ inputs.base }}
          QA_PLATFORMS: ${{ inputs.platforms }}
          QA_MODES: ${{ inputs.modes }}
          QA_LINUX_PROFILES: ${{ inputs.linux_profiles }}
          QA_MACOS_RUNNER: ${{ inputs.macos_runner }}
          QA_NATIVE_RELEASE: ${{ inputs.native_release }}
          QA_MODULAR_RDP_P95: ${{ inputs.modular_rdp_p95 }}
          QA_SHARDS: ${{ inputs.shards }}
          QA_BROWSER_WORKERS: ${{ inputs.browser_workers }}
          QA_CASE_IDS: ${{ inputs.case_ids }}
          QA_FIRST_RELEASE_RUN: ${{ inputs.first_release_run }}
          QA_MODULE_PROFILE: ${{ inputs.module_profile }}
          QA_FEATURES: ${{ inputs.features }}
          QA_NIGHTLY_POLICY: ${{ (github.event_name == 'schedule' || inputs.nightly_policy) && 'true' || 'false' }}
          QA_NIGHT_LABEL: ${{ inputs.night_label }}
          QA_NIGHTLY_SAMPLE_PERCENT: ${{ inputs.nightly_sample_percent }}
          # New feature PRs and focused runs always include the packaged crash
          # suite, even when their feature selectors differ.
          QA_TAGS: ${{ inputs.scope == '' && github.event_name == 'pull_request' && 'crash-regression,ui-contract' || (inputs.scope == 'selected' || inputs.scope == 'impacted') && format('{0},crash-regression,ui-contract', inputs.tags) || inputs.tags }}
        run: python -m qa_ui_auto.ci plan
      - uses: actions/upload-artifact@v4
        with:
          name: qa-selection-${{ steps.invocation.outputs.key }}
          path: qa-ui-auto-report/selection.json
          if-no-files-found: error

  signed-modular-packages:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.native_matrix, 'signed-module')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      artifact_key: ${{ needs.plan.outputs.artifact_key }}
      macos_runner: ${{ inputs.macos_runner || 'macos-15' }}
      native_builds: ${{ needs.plan.outputs.build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-mfa-linux:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.linux_native_matrix, 'signed-mfa')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: mfa
      artifact_key: ${{ format('{0}-mfa', needs.plan.outputs.artifact_key) }}
      native_builds: ${{ needs.plan.outputs.linux_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-mfa-windows:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.windows_native_matrix, 'signed-mfa')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: mfa
      artifact_key: ${{ format('{0}-mfa', needs.plan.outputs.artifact_key) }}
      native_builds: ${{ needs.plan.outputs.windows_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-mfa-macos:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.macos_native_matrix, 'signed-mfa')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: mfa
      artifact_key: ${{ format('{0}-mfa', needs.plan.outputs.artifact_key) }}
      macos_runner: ${{ inputs.macos_runner || 'macos-15' }}
      native_builds: ${{ needs.plan.outputs.macos_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-vnc-linux:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.linux_native_matrix, 'signed-vnc')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: vnc-client
      artifact_key: ${{ format('{0}-vnc', needs.plan.outputs.artifact_key) }}
      native_builds: ${{ needs.plan.outputs.linux_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-vnc-windows:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.windows_native_matrix, 'signed-vnc')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: vnc-client
      artifact_key: ${{ format('{0}-vnc', needs.plan.outputs.artifact_key) }}
      native_builds: ${{ needs.plan.outputs.windows_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-vnc-macos:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.macos_native_matrix, 'signed-vnc')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: vnc-client
      artifact_key: ${{ format('{0}-vnc', needs.plan.outputs.artifact_key) }}
      macos_runner: ${{ inputs.macos_runner || 'macos-15' }}
      native_builds: ${{ needs.plan.outputs.macos_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-rdp-linux:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.linux_native_matrix, 'signed-rdp')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: rdp-client
      artifact_key: ${{ format('{0}-rdp', needs.plan.outputs.artifact_key) }}
      native_builds: ${{ needs.plan.outputs.linux_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-rdp-windows:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.windows_native_matrix, 'signed-rdp')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: rdp-client
      artifact_key: ${{ format('{0}-rdp', needs.plan.outputs.artifact_key) }}
      native_builds: ${{ needs.plan.outputs.windows_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-rdp-macos:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.macos_native_matrix, 'signed-rdp')
    uses: ./.github/workflows/qa-modular-packages.yml
    with:
      head: ${{ needs.plan.outputs.head }}
      module: rdp-client
      artifact_key: ${{ format('{0}-rdp', needs.plan.outputs.artifact_key) }}
      macos_runner: ${{ inputs.macos_runner || 'macos-15' }}
      native_builds: ${{ needs.plan.outputs.macos_build_matrix }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  signed-mail:
    needs: plan
    if: github.event_name != 'pull_request' && contains(needs.plan.outputs.native_matrix, 'signed-mail')

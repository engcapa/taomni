name: Release Bundle

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag, for example v0.1.0. Empty builds workflow artifacts only."
        required: false
        type: string
      platforms:
        description: "Artifact-only platform selection. Tagged releases require all."
        required: true
        default: all
        type: choice
        options: [all, macos]
      macos_arch:
        description: "Artifact-only macOS architecture selection. Tagged releases require both."
        required: true
        default: both
        type: choice
        options: [both, x86_64, aarch64]
      test_version:
        description: "Optional SemVer override for artifact-only upgrade tests; package.json is unchanged."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate build selection
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      test_version: ${{ steps.plan.outputs.test_version }}
      build_desktop: ${{ steps.plan.outputs.build_desktop }}
      macos_aarch64: ${{ steps.plan.outputs.macos_aarch64 }}
      macos_x86_64: ${{ steps.plan.outputs.macos_x86_64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build selection contracts
        run: node --test scripts/resolve-release-build.test.mjs scripts/release-workflow.test.mjs
      - name: Resolve build selection and version
        id: plan
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_MACOS_ARCH: ${{ inputs.macos_arch }}
          RELEASE_TEST_VERSION: ${{ inputs.test_version }}
        run: node scripts/resolve-release-build.mjs

  # ---------------------------------------------------------------------------
  # Linux / Windows matrix build
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    if: needs.plan.outputs.build_desktop == 'true'
    name: Bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Stay on 22.04 so the Linux bundle keeps glibc 2.35 and runs on
          # Ubuntu 22.04 / Debian bookworm-class distros. Stock jammy PipeWire
          # (~0.3.48) headers are too old for libspa 0.9 (missing
          # spa_video_info_raw.flags); we install a newer PipeWire from source
          # for build only (see "Install PipeWire 1.x for libspa" step).
          - platform: ubuntu-22.04
            args: "--features native-av"
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # Base bundle deps + LanChat native A/V (native-av feature): nasm builds
          # openh264's x86 asm, libasound2-dev is cpal's ALSA backend, libv4l-dev
          # is nokhwa's camera backend. X11 screen capture uses libxcb (already
          # present on the runner).
          # meson/ninja/libclang: used to build a newer PipeWire for libspa 0.9.
          # libpipewire-0.3-dev: stock jammy headers (too old alone); kept so
          # related packages are present; overlaid by the next step.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libkrb5-dev \
            nasm \
            libasound2-dev \
            libv4l-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libdbus-1-dev \
            libudev-dev \
            meson \
            ninja-build \
            pkg-config

      # xcap → pipewire → libspa 0.9.x expects spa_video_info_raw.flags and
      # modifier:u64. Ubuntu 22.04's PipeWire ~0.3.48 headers lack those fields.
      # Build PipeWire 1.0.x from source (against jammy's glibc 2.35) and install
      # to /usr/local so the release binary stays runnable on 22.04+.
      - name: Install PipeWire 1.x for libspa (Ubuntu 22.04)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          PW_VER=1.0.9
          workdir="${RUNNER_TEMP:-/tmp}/pipewire-src"
          rm -rf "$workdir"
          mkdir -p "$workdir"
          # GitHub mirror of the freedsktop tag (stable for CI downloads).
          curl -fsSL "https://github.com/PipeWire/pipewire/archive/refs/tags/${PW_VER}.tar.gz" \
            | tar -xz -C "$workdir" --strip-components=1
          cd "$workdir"
          meson setup build \
            --prefix=/usr/local \
            --buildtype=release \
            -Ddocs=disabled \
            -Dman=disabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dinstalled_tests=disabled \
            -Dsession-managers=[] \
            -Dsystemd=disabled \
            -Dselinux=disabled \
            -Dpipewire-alsa=disabled \
            -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled \
            -Djack=disabled \
            -Dbluez5=disabled \
            -Dffmpeg=disabled \
            -Dlibcamera=disabled \
            -Droc=disabled \
            -Dlv2=disabled \
            -Dsdl2=disabled \
            -Dsndfile=disabled \
            -Dlibpulse=disabled \
            -Davahi=disabled \
            -Decho-cancel-webrtc=disabled \
            -Dgstreamer=disabled \
            -Dreadline=disabled \
            -Draop=disabled \
            -Dgsettings=disabled \
            -Dlibcanberra=disabled \
            -Dflatpak=disabled \
            -Drlimits-install=false
          meson compile -C build
          sudo meson install -C build
          sudo ldconfig
          # Prefer /usr/local headers and libs over stock jammy packages.
          {
            echo "PKG_CONFIG_PATH=/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            echo "LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:/usr/local/lib:${LIBRARY_PATH:-}"
            echo "LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:/usr/local/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "libpipewire version: $(pkg-config --modversion libpipewire-0.3)"
          pkg-config --cflags --libs libpipewire-0.3
          # Sanity-check headers include the fields libspa 0.9 needs.
          grep -q 'uint32_t flags' /usr/local/include/spa-0.2/spa/param/video/raw.h
          grep -q 'uint64_t modifier' /usr/local/include/spa-0.2/spa/param/video/raw.h

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Linux SocksCap transparent-capture backend
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib sockscap::capture::linux
          bash scripts/stage-sockscap-linux.sh --check
          # Stage xray-core (MPL-2.0) into resources so the Linux bundle can serve
          # core-backed upstreams (ss/trojan/vmess/vless/wireguard).
          pwsh scripts/fetch-xray.ps1 -Platform linux
          cargo test --manifest-path src-tauri/Cargo.toml --lib sockscap::core

      - name: Fetch WinDivert redistributable (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/resources/sockscap/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path (Join-Path $dest "WinDivert.dll")) {
            Write-Host "WinDivert already present in $dest, skipping download."
            exit 0
          }
          # WinDivert redistributable (LGPLv3/GPLv2) — loaded dynamically by the
          # elevated helper only. reqrypt.org is canonical; GitHub release is a mirror.
          $version = "2.2.2"
          $zip = Join-Path $env:RUNNER_TEMP "WinDivert-$version-A.zip"
          $extract = Join-Path $env:RUNNER_TEMP "WinDivert-extract"
          $urls = @(
            "https://reqrypt.org/download/WinDivert-$version-A.zip",
            "https://github.com/basil00/WinDivert/releases/download/v$version/WinDivert-$version-A.zip"
          )
          $ok = $false
          foreach ($url in $urls) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Write-Host "Downloading $url (attempt $i)..."
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
                $ok = $true; break
              } catch {
                Write-Warning "Download failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 5
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Unable to download WinDivert $version from any mirror." }
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $x64 = Join-Path $extract "WinDivert-$version-A\x64"
          Copy-Item -Force (Join-Path $x64 "WinDivert.dll") $dest
          Copy-Item -Force (Join-Path $x64 "WinDivert64.sys") $dest
          Write-Host "WinDivert $version staged into ${dest}:"
          Get-ChildItem $dest | Select-Object Name, Length

      - name: Verify Windows SocksCap helper and preflight
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Make each native command's non-zero exit fatal so a failing test can't be
          # masked by a later command's exit code (default pwsh only checks the last).
          $PSNativeCommandUseErrorActionPreference = $true
          pwsh scripts/stage-sockscap-windows.ps1
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- sockscap::policy sockscap::config sockscap::core
          pwsh scripts/stage-sockscap-windows.ps1 --check

      - name: Check updater signing configuration
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ runner.os }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TEST_VERSION: ${{ needs.plan.outputs.test_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/configure-release-signing.mjs

      # Build only. Release assets are published by the finalizer after every
      # platform and signature gate passes.
      - name: Build desktop bundles
        id: tauri_build
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} --config '${{ env.TAURI_RELEASE_CONFIG }}'

      - name: Collect workflow artifacts
        shell: bash
        env:
          TAURI_ACTION_ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
          TAURI_ACTION_ARTIFACT_OUT_DIR: tauri-artifacts/${{ matrix.platform }}
        run: node scripts/collect-tauri-action-artifacts.mjs

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taomni-${{ needs.plan.outputs.version }}-${{ matrix.platform }}
          path: tauri-artifacts/${{ matrix.platform }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS – single arm64 runner, cross-compiles both architectures
  # ---------------------------------------------------------------------------
  build-macos:
    needs: plan
    name: Bundle (macOS)
    # Pin the major runner image instead of following the moving `macos-latest`
    # label. GitHub's macos-15 standard image is arm64 (Apple Silicon).
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # -----------------------------------------------------------------------
      # Install MIT Kerberos for both architectures.
      #
      # macOS ships Apple's GSS.framework (a Heimdal fork) whose public headers
      # do NOT declare the IOV functions (gss_wrap_iov, gss_unwrap_iov,
      # gss_wrap_iov_length) that libgssapi 0.11 unconditionally imports.
      # Using MIT Kerberos (which fully supports IOV) fixes the build.
      #
      # arm64 : native Homebrew at /opt/homebrew
      # x86_64: Homebrew bottle unpacked under /usr/local
      # -----------------------------------------------------------------------
      - name: Install MIT Kerberos (arm64 – native)
        run: brew install krb5

      - name: Install MIT Kerberos (x86_64 – Rosetta 2)
        if: needs.plan.outputs.macos_x86_64 == 'true'
        run: bash scripts/install-krb5-macos-x86_64.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Keep Redirector v0.12.11 as an opaque, upstream-signed universal app
      # archive. Taomni never rebuilds or re-signs its nested System Extension.
      - name: Stage and verify signed Mitmproxy Redirector v0.12.11
        run: bash scripts/stage-mitmproxy-redirector-macos.sh --stage

      - name: Verify macOS Redirector protocol and recovery gates
        env:
          LIBGSSAPI_IMPL: mit
          LIBGSSAPI_PREFIX: /opt/homebrew/opt/krb5
          PKG_CONFIG_PATH: /opt/homebrew/opt/krb5/lib/pkgconfig
        run: |
          set -euo pipefail
          # cargo test invokes Taomni's build.rs directly, before Tauri gets a
          # chance to run beforeBuildCommand. Stage the configured frameworks
          # first so tauri-build can resolve bundle.macOS.frameworks.
          bash scripts/bundle-krb5-macos.sh stage
          cargo test --manifest-path src-tauri/Cargo.toml --lib sockscap::redirector -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --lib sockscap::recovery -- --test-threads=1

      - name: Release signing unit contracts
        run: node --test scripts/configure-release-signing.test.mjs scripts/verify-macos-release-bundle.test.mjs

      # Reuse one .p12 and pin its fingerprint for both architectures and every
      # upgrade. Import it into a temporary keychain before Tauri signs/bundles;
      # never re-sign the app after the updater archive/.sig have been created.
      # Apple notarization is optional and independent from fixed signing.
      # See docs-issue/macos-screenshot-permission-and-signing.md for self-signing.
      - name: Configure fixed macOS certificate and updater signing
        shell: bash
        env:
          RELEASE_PLATFORM: macOS
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TEST_VERSION: ${{ needs.plan.outputs.test_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_SIGNING_CERT_SHA1: ${{ vars.MACOS_SIGNING_CERT_SHA1 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/configure-release-signing.mjs

      # ---------- aarch64-apple-darwin (native) ----------
      - name: Stage and verify xray-core (aarch64)
        if: needs.plan.outputs.macos_aarch64 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pwsh scripts/fetch-xray.ps1 -Platform macos-arm64 -Force
          test "$(lipo -archs src-tauri/resources/sockscap/macos/xray)" = "arm64"

      - name: Build macOS bundle (aarch64)
        if: needs.plan.outputs.macos_aarch64 == 'true'
        id: tauri_macos_aarch64
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Point libgssapi-sys at Homebrew MIT Kerberos (arm64)
          LIBGSSAPI_IMPL: mit
          LIBGSSAPI_PREFIX: /opt/homebrew/opt/krb5
          PKG_CONFIG_PATH: /opt/homebrew/opt/krb5/lib/pkgconfig
        with:
          args: --target aarch64-apple-darwin --config '${{ env.TAURI_RELEASE_CONFIG }}'

      - name: Verify fixed signature and updater app (aarch64)
        if: needs.plan.outputs.macos_aarch64 == 'true'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/verify-macos-release-bundle.sh aarch64-apple-darwin arm64

      - name: Collect workflow artifacts (aarch64)
        if: needs.plan.outputs.macos_aarch64 == 'true'
        shell: bash
        env:
          TAURI_ACTION_ARTIFACT_PATHS: ${{ steps.tauri_macos_aarch64.outputs.artifactPaths }}
          TAURI_ACTION_ARTIFACT_OUT_DIR: tauri-artifacts/macos-aarch64
        run: node scripts/collect-tauri-action-artifacts.mjs

      - name: Upload workflow artifacts (aarch64)
        if: needs.plan.outputs.macos_aarch64 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taomni-${{ needs.plan.outputs.version }}-macos-aarch64
          path: tauri-artifacts/macos-aarch64
          if-no-files-found: error

      # ---------- x86_64-apple-darwin (cross-compile) ----------
      - name: Stage and verify xray-core (x86_64)
        if: needs.plan.outputs.macos_x86_64 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pwsh scripts/fetch-xray.ps1 -Platform macos -Force
          test "$(lipo -archs src-tauri/resources/sockscap/macos/xray)" = "x86_64"

      - name: Build macOS bundle (x86_64)
        if: needs.plan.outputs.macos_x86_64 == 'true'
        id: tauri_macos_x86_64
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Point libgssapi-sys at x86_64 MIT Kerberos under /usr/local
          LIBGSSAPI_IMPL: mit
          LIBGSSAPI_PREFIX: /usr/local/opt/krb5
          PKG_CONFIG_PATH: /usr/local/opt/krb5/lib/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
        with:
          args: --target x86_64-apple-darwin --config '${{ env.TAURI_RELEASE_CONFIG }}'

      - name: Verify fixed signature and updater app (x86_64)
        if: needs.plan.outputs.macos_x86_64 == 'true'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/verify-macos-release-bundle.sh x86_64-apple-darwin x86_64

      - name: Collect workflow artifacts (x86_64)
        if: needs.plan.outputs.macos_x86_64 == 'true'
        shell: bash
        env:
          TAURI_ACTION_ARTIFACT_PATHS: ${{ steps.tauri_macos_x86_64.outputs.artifactPaths }}
          TAURI_ACTION_ARTIFACT_OUT_DIR: tauri-artifacts/macos-x86_64
        run: node scripts/collect-tauri-action-artifacts.mjs

      - name: Upload workflow artifacts (x86_64)
        if: needs.plan.outputs.macos_x86_64 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taomni-${{ needs.plan.outputs.version }}-macos-x86_64
          path: tauri-artifacts/macos-x86_64
          if-no-files-found: error

      # Preserve the signed output for diagnosis when the gate fails. These are
      # Actions artifacts only; a failed builder cannot enter release publishing.
      - name: Preserve macOS bundle verification evidence
        if: failure() && (steps.tauri_macos_aarch64.outcome == 'success' || steps.tauri_macos_x86_64.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-diagnostics-${{ github.run_id }}
          path: |
            src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/*-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: warn
          retention-days: 7

      - name: Clean temporary macOS signing keychain
        if: always() && env.MACOS_SIGNING_WORK_DIR != ''
        timeout-minutes: 3
        run: node scripts/configure-release-signing.mjs --cleanup-macos

  # ---------------------------------------------------------------------------
  # Compose a single, complete latest.json for tauri-plugin-updater.
  #
  # Builders only upload workflow artifacts. After both jobs pass, validate all
  # updater signatures and stage installers before creating/updating a release.
  # Qualify same-named macOS archives by architecture without changing signed
  # bytes. Upload latest.json last so every referenced asset is already present.
  # ---------------------------------------------------------------------------
  finalize-updater-manifest:
    name: Publish verified bundles and latest.json
    needs: [plan, build, build-macos]
    runs-on: ubuntu-22.04
    if: needs.plan.outputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Updater manifest unit contracts
        run: node --test scripts/compose-updater-manifest.test.mjs scripts/verify-updater-signatures.test.mjs scripts/release-workflow.test.mjs
      - name: Download workflow artifacts
        if: needs.plan.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify and publish release assets
        if: needs.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compose-updater-manifest.mjs artifacts updater-assets
          node scripts/verify-updater-signatures.mjs updater-assets

          # No release mutation until every platform/signature gate has passed.
          # Preserve an existing release's title/body; create one for tag pushes
          # and manual dispatches that do not already have a release. Keep new
          # releases draft until all assets and latest.json have been uploaded.
          if publish_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            # A draft left by an interrupted earlier run is published only
            # after this run uploads the complete verified asset set.
            test "$publish_draft" = true || test "$publish_draft" = false
          else
            release_args=(--draft --title "Taomni $TAG" --generate-notes --target "$GITHUB_SHA")
            if [[ "$TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$TAG" "${release_args[@]}"
            publish_draft=true
          fi
          RELEASE_NOTES="$(gh release view "$TAG" --json body --jq '.body // ""')"
          export RELEASE_NOTES
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'updater-assets/latest.json';
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          if (process.env.RELEASE_NOTES) manifest.notes = process.env.RELEASE_NOTES;
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          # Validate and stage all platforms before uploading anything. macOS
          # bundles have arch-qualified names and retain their signed bytes.
          while IFS= read -r asset; do
            gh release upload "$TAG" "$asset" --clobber
          done < <(find updater-assets -maxdepth 1 -type f ! -name latest.json | sort)

          # Publish the complete manifest only after every referenced asset exists.
          gh release upload "$TAG" updater-assets/latest.json --clobber
          if [ "$publish_draft" = true ]; then
            gh release edit "$TAG" --draft=false
          fi

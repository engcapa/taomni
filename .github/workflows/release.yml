name: Release Bundle

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag, for example v0.1.0. Empty builds workflow artifacts only."
        required: false
        type: string
      platforms:
        description: "Artifact-only platform selection. Tagged releases require all."
        required: true
        default: all
        type: choice
        options: [all, macos, windows]
      macos_arch:
        description: "Artifact-only macOS architecture selection. Tagged releases require both."
        required: true
        default: both
        type: choice
        options: [both, x86_64, aarch64]
      macos_runner:
        description: "Apple Silicon runner for artifact-only macOS builds."
        default: macos-15
        type: choice
        options: [macos-15, macos-26]
      macos_static_krb5:
        description: "Build the ARM64 QA artifact with static Kerberos and hardened runtime."
        type: boolean
        default: false
      test_version:
        description: "Optional SemVer override for artifact-only upgrade tests; package.json is unchanged."
        required: false
        type: string
      modules:
        description: Comma-separated module slugs to build with the core
        required: false
        type: string
      candidate_run:
        description: Verified artifact-only Release Bundle run to publish with the tag
        required: false
        type: string
      module_rehearsal_baseline_run:
        description: "Artifact-only Release Bundle run ID for read-only single-module catalog rehearsal (never builds core or publishes)."
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Validate build selection
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      test_version: ${{ steps.plan.outputs.test_version }}
      build_desktop: ${{ steps.plan.outputs.build_desktop }}
      desktop_platforms: ${{ steps.plan.outputs.desktop_platforms }}
      macos_architectures: ${{ steps.plan.outputs.macos_architectures }}
      macos_runner: ${{ steps.plan.outputs.macos_runner }}
      modules: ${{ steps.plan.outputs.modules }}
      candidate_run: ${{ steps.plan.outputs.candidate_run }}
      rehearse_first_upgrade: ${{ steps.plan.outputs.rehearse_first_upgrade }}
      module_rehearsal_baseline_run: ${{ steps.plan.outputs.module_rehearsal_baseline_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build selection contracts
        run: |
          node --test scripts/resolve-release-build.test.mjs scripts/release-workflow.test.mjs scripts/verify-release-candidate.test.mjs scripts/install-linux-release-deps.test.mjs scripts/sherpa-onnx-cache.test.mjs
          python -m unittest discover -s scripts -p test_linux_module_abi.py
      - name: Resolve build selection and version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_MACOS_ARCH: ${{ inputs.macos_arch }}
          INPUT_MACOS_STATIC_KRB5: ${{ inputs.macos_static_krb5 }}
          INPUT_MACOS_RUNNER: ${{ inputs.macos_runner }}
          RELEASE_TEST_VERSION: ${{ inputs.test_version }}
          INPUT_RELEASE_MODULES: ${{ inputs.modules }}
          INPUT_CANDIDATE_RUN: ${{ inputs.candidate_run }}
          INPUT_MODULE_REHEARSAL_BASELINE_RUN: ${{ inputs.module_rehearsal_baseline_run }}
        run: node scripts/resolve-release-build.mjs

  # ---------------------------------------------------------------------------
  # Linux / Windows matrix build
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    if: needs.plan.outputs.build_desktop == 'true' && needs.plan.outputs.candidate_run == ''
    name: Bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.desktop_platforms) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Scope Windows native dependencies to the runner image
        if: runner.os == 'Windows'
        id: windows-cache-scope
        shell: pwsh
        run: |
          $scope = if ($env:ImageVersion) {
            "windows-image-$env:ImageVersion"
          } else {
            "windows-run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          }
          "key=$scope" >> $env:GITHUB_OUTPUT

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ steps.windows-cache-scope.outputs.key }}

      - name: Install Linux bundle dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 20
        run: bash scripts/install-linux-release-deps.sh

      # xcap → pipewire → libspa 0.9.x expects spa_video_info_raw.flags and
      # modifier:u64. Ubuntu 22.04's PipeWire ~0.3.48 headers lack those fields.
      # Build PipeWire 1.0.x from source (against jammy's glibc 2.35) and install
      # to /usr/local so the release binary stays runnable on 22.04+.
      - name: Install PipeWire 1.x for libspa (Ubuntu 22.04)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/install-release-pipewire.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Linux SocksCap transparent-capture backend
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib sockscap::capture::linux
          bash scripts/stage-sockscap-linux.sh --check

      - name: Check updater signing configuration
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ runner.os }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TEST_VERSION: ${{ needs.plan.outputs.test_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/configure-release-signing.mjs

      # Build only. Release assets are published by the finalizer after every
      # platform and signature gate passes.
      - name: Remove previous voice build outputs from the core package input
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $runtime = @("sherpa-onnx-c-api.dll", "sherpa-onnx-cxx-api.dll", "onnxruntime.dll", "onnxruntime_providers_shared.dll")
          foreach ($name in $runtime) {
            $path = Join-Path "src-tauri/target/release" $name
            if (Test-Path -LiteralPath $path -PathType Leaf) { Remove-Item -LiteralPath $path }
          }

      - name: Build desktop bundles
        id: tauri_build
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config '${{ env.TAURI_RELEASE_CONFIG }}'

      - name: Verify Linux core installer contents
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/verify-linux-release-bundle.sh

      - name: Verify Windows installer runtimes
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          TAOMNI_REQUIRE_NSIS_TESTS: '1'
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node --test scripts/windows-runtime-bundle.test.mjs
          pwsh -File scripts/verify-windows-release-bundle.ps1
      - name: Exercise the updated GUI in the Windows desktop environment
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -eo pipefail
          cargo test --locked --release --manifest-path src-tauri/Cargo.toml --bin taomni -- --ignored --exact windows_update_relaunch::tests::desktop_environment_after_update --nocapture | tee windows-update-relaunch.log
          grep -F "1 passed; 0 failed" windows-update-relaunch.log

      - name: Collect workflow artifacts
        shell: bash
        env:
          TAURI_ACTION_ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}
          TAURI_ACTION_ARTIFACT_OUT_DIR: tauri-artifacts/${{ matrix.platform }}
        run: node scripts/collect-tauri-action-artifacts.mjs

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taomni-${{ needs.plan.outputs.version }}-${{ matrix.platform }}
          path: tauri-artifacts/${{ matrix.platform }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS – each target gets its own ARM64 runner, keychain and Kerberos build.
  # tauri.conf.json sets minimumSystemVersion to 10.15 for Whisper's C++17
  # std::filesystem. Tauri forwards it as MACOSX_DEPLOYMENT_TARGET to both builds.
  # ---------------------------------------------------------------------------
  build-macos:
    needs: plan
    if: needs.plan.outputs.macos_architectures != '[]' && needs.plan.outputs.candidate_run == ''
    name: Bundle (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.macos_architectures) }}
    runs-on: ${{ needs.plan.outputs.macos_runner }}
    env:
      # Direct cargo tests run before Tauri exports minimumSystemVersion.
      # Keep native C/C++ dependencies on the same floor as the app bundle.
      MACOSX_DEPLOYMENT_TARGET: "10.15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          key: macos-${{ matrix.arch }}-${{ matrix.arch == 'aarch64' && inputs.macos_static_krb5 && 'static' || 'shared' }}

      # -----------------------------------------------------------------------
      # Install MIT Kerberos for both architectures.
      #
      # macOS ships Apple's GSS.framework (a Heimdal fork) whose public headers
      # do NOT declare the IOV functions (gss_wrap_iov, gss_unwrap_iov,
      # gss_wrap_iov_length) that libgssapi 0.11 unconditionally imports.
      # Using MIT Kerberos (which fully supports IOV) fixes the build.
      #
      # arm64 : native Homebrew at /opt/homebrew
      # x86_64: Homebrew bottle unpacked under /usr/local
      # -----------------------------------------------------------------------
      - name: Install MIT Kerberos (arm64 – native)
        run: brew install krb5

      - name: Install MIT Kerberos (x86_64 – Rosetta 2)
        if: matrix.arch == 'x86_64'
        run: bash scripts/install-krb5-macos-x86_64.sh

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify macOS Redirector protocol and recovery gates
        env:
          LIBGSSAPI_IMPL: mit
          LIBGSSAPI_PREFIX: /opt/homebrew/opt/krb5
          PKG_CONFIG_PATH: /opt/homebrew/opt/krb5/lib/pkgconfig
        run: |
          set -euo pipefail
          # cargo test invokes Taomni's build.rs directly, before Tauri gets a
          # chance to run beforeBuildCommand. Stage the configured frameworks
          # first so tauri-build can resolve bundle.macOS.frameworks.
          bash scripts/bundle-krb5-macos.sh stage
          cargo test --manifest-path src-tauri/Cargo.toml --lib sockscap::redirector -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml -p taomni-sockscap-api --locked --lib recovery::tests -- --test-threads=1

      - name: Build static MIT Kerberos for the ARM64 signing comparison
        if: matrix.arch == 'aarch64' && inputs.macos_static_krb5
        id: static-krb5
        run: |
          set -euo pipefail
          brew list --versions openssl@3 >/dev/null || brew install openssl@3
          bash scripts/build-macos-static-krb5.sh "$RUNNER_TEMP/taomni-static-krb5"
          echo 'MIT_KRB5_GSSAPI_STATIC=1' >> "$GITHUB_ENV"
          echo "prefix=$RUNNER_TEMP/taomni-static-krb5" >> "$GITHUB_OUTPUT"

      - name: Release signing unit contracts
        run: node --test scripts/configure-release-signing.test.mjs scripts/verify-macos-release-bundle.test.mjs scripts/macos-runtime-paths.test.mjs

      # Reuse one .p12 and pin its fingerprint for both architectures and every
      # upgrade. Import it into a temporary keychain before Tauri signs/bundles;
      # never re-sign the app after the updater archive/.sig have been created.
      # Apple notarization is optional and independent from fixed signing.
      # See docs-issue/macos-screenshot-permission-and-signing.md for self-signing.
      - name: Configure fixed macOS certificate and updater signing
        shell: bash
        env:
          RELEASE_PLATFORM: macOS
          MACOS_STATIC_KRB5: ${{ matrix.arch == 'aarch64' && inputs.macos_static_krb5 }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_TEST_VERSION: ${{ needs.plan.outputs.test_version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MACOS_SIGNING_CERT_SHA1: ${{ vars.MACOS_SIGNING_CERT_SHA1 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/configure-release-signing.mjs

      - name: Select target Kerberos libraries
        env:
          STATIC_PREFIX: ${{ steps.static-krb5.outputs.prefix }}
          SHARED_PREFIX: ${{ matrix.arch == 'aarch64' && '/opt/homebrew/opt/krb5' || '/usr/local/opt/krb5' }}
        run: |
          prefix="${STATIC_PREFIX:-$SHARED_PREFIX}"
          echo "LIBGSSAPI_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build macOS bundle
        id: tauri_macos
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBGSSAPI_IMPL: mit
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.arch == 'x86_64' && '1' || '0' }}
        with:
          args: --target ${{ matrix.arch }}-apple-darwin --config '${{ env.TAURI_RELEASE_CONFIG }}'

      - name: Verify fixed signature and updater app
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ matrix.arch }}-apple-darwin
          EXPECTED_ARCH: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}
        run: bash scripts/verify-macos-release-bundle.sh "$TARGET" "$EXPECTED_ARCH"

      - name: Collect workflow artifacts
        env:
          TAURI_ACTION_ARTIFACT_PATHS: ${{ steps.tauri_macos.outputs.artifactPaths }}
          TAURI_ACTION_ARTIFACT_OUT_DIR: tauri-artifacts/macos-${{ matrix.arch }}
          BUNDLE_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/collect-tauri-action-artifacts.mjs
          node scripts/verify-release-candidate.mjs record-macos "$TAURI_ACTION_ARTIFACT_OUT_DIR"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taomni-${{ needs.plan.outputs.version }}-macos-${{ matrix.arch }}
          path: tauri-artifacts/macos-${{ matrix.arch }}
          if-no-files-found: error

      # Preserve the signed output for diagnosis when the gate fails. These are
      # Actions artifacts only; a failed builder cannot enter release publishing.
      - name: Preserve macOS bundle verification evidence
        if: failure() && steps.tauri_macos.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-diagnostics-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            src-tauri/target/*-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/*-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: warn
          retention-days: 7

      - name: Clean temporary macOS signing keychain
        if: always() && env.MACOS_SIGNING_WORK_DIR != ''
        timeout-minutes: 3
        run: node scripts/configure-release-signing.mjs --cleanup-macos

  package-modules:
    needs: plan
    if: needs.plan.outputs.modules != '[]' && needs.plan.outputs.candidate_run == '' && needs.plan.outputs.module_rehearsal_baseline_run == ''
    strategy:
      fail-fast: false
      # Queue all selected modules so their target jobs can use available runners.
      matrix:
        module: ${{ fromJSON(needs.plan.outputs.modules) }}
    uses: ./.github/workflows/release-modules.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      module: ${{ matrix.module }}
      head: ${{ github.sha }}
      macos_runner: ${{ needs.plan.outputs.macos_runner }}
      package_only: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

  verify-candidate-roster:
    name: Verify first-upgrade catalog and signed business packages
    needs: [plan, package-modules]
    if: needs.plan.outputs.rehearse_first_upgrade == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the catalog signer
        run: |
          cargo test --manifest-path scripts/plugin-package/Cargo.toml --lib --locked
          cargo build --manifest-path scripts/plugin-package/Cargo.toml --bin taomni-plugin-package --release --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: module-signed-*-${{ github.run_id }}
          path: signed-module-artifacts
          merge-multiple: false
      - name: Verify every package and sign the loopback install feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export MODULE_UPDATED_AT
          MODULE_UPDATED_AT="$(git show -s --format=%cI HEAD)"
          scripts/plugin-package/target/release/taomni-plugin-package --qa-first-release-roster signed-module-artifacts candidate-roster
      - uses: actions/upload-artifact@v4
        with:
          name: modular-candidate-roster-${{ github.run_id }}
          path: candidate-roster
          if-no-files-found: error

  rehearse-module-release:
    needs: plan
    if: needs.plan.outputs.module_rehearsal_baseline_run != ''
    uses: ./.github/workflows/release-modules.yml
    with:
      tag: v${{ needs.plan.outputs.test_version || '0.6.0' }}-${{ fromJSON(needs.plan.outputs.modules)[0] }}.rehearsal
      module: ${{ fromJSON(needs.plan.outputs.modules)[0] }}
      head: ${{ github.sha }}
      macos_runner: ${{ needs.plan.outputs.macos_runner }}
      package_only: false
      rehearsal_baseline_run: ${{ needs.plan.outputs.module_rehearsal_baseline_run }}
      baseline_tag: v${{ needs.plan.outputs.test_version || '0.6.0' }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

  verify-candidate-updater:
    name: Verify four-target candidate updater
    needs: [plan, build, build-macos]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.tag == '' && inputs.platforms == 'all' && inputs.macos_arch == 'both' && needs.plan.outputs.module_rehearsal_baseline_run == ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/stage-core-updater
        with:
          version: ${{ needs.plan.outputs.version }}
      - name: Record candidate inputs and installer digests
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MODULE_SELECTION: ${{ needs.plan.outputs.modules }}
        run: |
          mkdir candidate-updater
          cp updater-assets/latest.json candidate-updater/
          (cd updater-assets && sha256sum -- *) > candidate-updater/SHA256SUMS
          node scripts/verify-release-candidate.mjs record-updater candidate-updater
      - uses: actions/upload-artifact@v4
        with:
          name: modular-candidate-updater-${{ github.run_id }}
          path: candidate-updater
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Compose a single, complete latest.json for tauri-plugin-updater.
  #
  # Builders only upload workflow artifacts. After both jobs pass, validate all
  # updater signatures and stage installers before creating/updating a release.
  # Qualify same-named macOS archives by architecture without changing signed
  # bytes. Upload latest.json last so every referenced asset is already present.
  # ---------------------------------------------------------------------------
  finalize-updater-manifest:
    name: Publish verified bundles and latest.json
    needs: [plan, build, build-macos, package-modules]
    runs-on: ubuntu-22.04
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tag != '' &&
          (needs.plan.outputs.candidate_run != '' ||
           (needs.build.result == 'success' && needs.build-macos.result == 'success' &&
            (needs.package-modules.result == 'success' ||
             (needs.plan.outputs.modules == '[]' && needs.package-modules.result == 'skipped')))) }}
    permissions:
      actions: read
      contents: write
    concurrency:
      group: taomni-release-catalog-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Updater and plugin manifest unit contracts
        run: node --test scripts/compose-updater-manifest.test.mjs scripts/compose-modules-manifest.test.mjs scripts/verify-updater-signatures.test.mjs scripts/stage-published-module-catalog.test.mjs scripts/release-workflow.test.mjs
      - name: Select the verified candidate artifacts
        if: needs.plan.outputs.candidate_run != ''
        id: candidate
        env:
          CANDIDATE_RUN: ${{ needs.plan.outputs.candidate_run }}
          GH_TOKEN: ${{ github.token }}
          MODULE_SELECTION: ${{ needs.plan.outputs.modules }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > release-candidate/producer.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/artifacts?per_page=100" > release-candidate/artifacts.json
          git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" > release-candidate/tag-refs.txt
          node scripts/verify-release-candidate.mjs select release-candidate
      - uses: ./.github/actions/stage-core-updater
        with:
          version: ${{ needs.plan.outputs.version }}
          candidate_run: ${{ needs.plan.outputs.candidate_run }}
          core_artifacts: ${{ steps.candidate.outputs.core_artifacts }}
      - name: Download signed module packages
        if: needs.plan.outputs.modules != '[]' && needs.plan.outputs.candidate_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: module-signed-*-${{ github.run_id }}
          path: signed-module-artifacts
          merge-multiple: false
      - name: Download the candidate updater receipt
        if: needs.plan.outputs.candidate_run != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.updater_artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.candidate_run }}
          path: release-candidate/updater
      - name: Download the candidate's signed module packages
        if: needs.plan.outputs.candidate_run != '' && needs.plan.outputs.modules != '[]'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.candidate.outputs.module_artifacts }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.candidate_run }}
          path: signed-module-artifacts
          merge-multiple: false
      - name: Verify the reused installer and signed module bytes
        if: needs.plan.outputs.candidate_run != ''
        env:
          MACOS_SIGNING_CERT_SHA1: ${{ vars.MACOS_SIGNING_CERT_SHA1 }}
        run: node scripts/verify-release-candidate.mjs verify release-candidate
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.candidate_run != ''
        with:
          name: verified-release-candidate-${{ github.run_id }}
          path: |
            release-candidate/verified-assets.json
            release-candidate/updater/receipt.json
          if-no-files-found: error

      - name: Assemble or carry forward the signed module catalog
        id: module-catalog
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          MODULE_SELECTION: ${{ needs.plan.outputs.modules }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-published-module-catalog.mjs carried-module-catalog --allow-missing >> "$GITHUB_OUTPUT"
          if [[ "$MODULE_SELECTION" != '[]' ]]; then
            export MODULE_UPDATED_AT="$(git show -s --format=%cI HEAD)"
            if [[ -d carried-module-catalog ]]; then
              export MODULES_PUBLISHED_CATALOG=carried-module-catalog/modules.json
              node scripts/compose-modules-manifest.mjs signed-module-artifacts changed-module-catalog --delta
            else
              node scripts/compose-modules-manifest.mjs signed-module-artifacts module-assets --first-release
            fi
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [[ ! -d carried-module-catalog ]]; then
            echo 'The first modular release requires signed module packages.' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.module-catalog.outputs.present == 'true' || steps.module-catalog.outputs.source_tag != ''
      - name: Build the catalog signer before providing the signing key
        if: steps.module-catalog.outputs.present == 'true' || steps.module-catalog.outputs.source_tag != ''
        run: |
          cargo test --manifest-path scripts/plugin-package/Cargo.toml --lib --locked
          cargo build --manifest-path scripts/plugin-package/Cargo.toml --bin taomni-plugin-package --release --locked
      - name: Combine changed module packages with the verified catalog
        if: steps.module-catalog.outputs.present == 'true' && steps.module-catalog.outputs.source_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          scripts/plugin-package/target/release/taomni-plugin-package --verify-catalog-signature carried-module-catalog
          node scripts/fetch-published-module-assets.mjs carried-module-catalog carried-module-catalog
          scripts/plugin-package/target/release/taomni-plugin-package \
            --prepare-catalog-update carried-module-catalog changed-module-catalog module-assets > module-uploads.json
          cp changed-module-catalog/SHA256SUMS module-assets/SHA256SUMS
      - name: Verify the first-upgrade roster before signing
        if: steps.module-catalog.outputs.present == 'true'
        shell: bash
        run: |
          previous=()
          if [[ -d carried-module-catalog ]]; then
            previous+=(carried-module-catalog)
          fi
          scripts/plugin-package/target/release/taomni-plugin-package --verify-release-roster module-assets "${previous[@]}"
      - name: Sign the verified complete module catalog
        if: steps.module-catalog.outputs.present == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/plugin-package/target/release/taomni-plugin-package --sign-catalog module-assets

      - name: Verify and publish release assets
        if: needs.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          MODULE_CATALOG_SOURCE_TAG: ${{ steps.module-catalog.outputs.source_tag }}
          CANDIDATE_RUN: ${{ needs.plan.outputs.candidate_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -d module-assets ]; then
            scripts/plugin-package/target/release/taomni-plugin-package --verify-catalog module-assets
            (cd module-assets && sha256sum --check --strict SHA256SUMS)
          elif [ -d carried-module-catalog ]; then
            scripts/plugin-package/target/release/taomni-plugin-package --verify-catalog-signature carried-module-catalog
          fi

          # No release mutation until every platform/signature gate has passed.
          # Preserve an existing release's title/body; create one for tag pushes
          # and manual dispatches that do not already have a release. Keep new
          # releases draft until all assets and latest.json have been uploaded.
          if publish_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            # A draft left by an interrupted earlier run is published only
            # after this run uploads the complete verified asset set.
            test "$publish_draft" = true || test "$publish_draft" = false
            if [[ -d module-assets && "$publish_draft" != true ]]; then
              echo 'Joint core and module assets must use a draft release.' >&2
              exit 1
            fi
          else
            release_args=(--draft --title "Taomni $TAG" --generate-notes --target "$GITHUB_SHA")
            if [[ "$TAG" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$TAG" "${release_args[@]}"
            publish_draft=true
          fi
          RELEASE_NOTES="$(gh release view "$TAG" --json body --jq '.body // ""')"
          export RELEASE_NOTES
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { appendModuleReleaseNotes } from './scripts/compose-modules-manifest.mjs';
          const path = 'updater-assets/latest.json';
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          const catalogPath = ['module-assets/modules.json', 'carried-module-catalog/modules.json'].find(existsSync);
          const catalog = catalogPath ? JSON.parse(readFileSync(catalogPath, 'utf8')) : null;
          const original = process.env.RELEASE_NOTES || '';
          const notes = appendModuleReleaseNotes(original, catalog);
          if (notes) manifest.notes = notes;
          if (notes !== original) writeFileSync('module-release-notes.md', notes + '\n');
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          # Validate and stage all platforms before uploading anything. macOS
          # bundles have arch-qualified names and retain their signed bytes.
          while IFS= read -r asset; do
            gh release upload "$TAG" "$asset" --clobber
          done < <(find updater-assets -maxdepth 1 -type f ! -name latest.json | sort)

          if [ -d module-assets ]; then
            # Publish packages and detached signatures first. The signed
            # catalogue is uploaded last so clients never observe references
            # to assets that are not present yet.
            if [[ -f module-uploads.json ]]; then
              module_uploads="$(node -e 'for (const name of require("./module-uploads.json")) console.log("module-assets/" + name)')"
            else
              module_uploads="$(find module-assets -maxdepth 1 -type f \( -name '*.taomni-plugin' -o -name '*.taomni-plugin.minisig' \) | sort)"
            fi
            while IFS= read -r asset; do
              gh release upload "$TAG" "$asset" --clobber
            done <<< "$module_uploads"
            gh release upload "$TAG" module-assets/SHA256SUMS --clobber
            gh release upload "$TAG" module-assets/modules.json.minisig --clobber
            gh release upload "$TAG" module-assets/modules.json --clobber
          elif [[ -d carried-module-catalog && "$MODULE_CATALOG_SOURCE_TAG" != "$TAG" ]]; then
            gh release upload "$TAG" carried-module-catalog/modules.json.minisig --clobber
            gh release upload "$TAG" carried-module-catalog/modules.json --clobber
          fi

          # Publish the complete manifest only after every referenced asset exists.
          gh release upload "$TAG" updater-assets/latest.json --clobber
          if [[ -f module-release-notes.md ]]; then
            gh release edit "$TAG" --notes-file module-release-notes.md
          fi
          if [ "$publish_draft" = true ]; then
            draft_args=(--draft=false)
            if [[ -n "${CANDIDATE_RUN:-}" ]]; then
              draft_args+=(--target "$GITHUB_SHA")
            fi
            gh release edit "$TAG" "${draft_args[@]}"
          fi

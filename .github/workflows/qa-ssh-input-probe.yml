name: Windows SSH input protocol diagnostic

on:
  push:
    branches: ['qa/ssh-input-probe/*']

permissions:
  contents: read

env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  QA_CAPABILITIES: '["ssh"]'

defaults:
  run:
    shell: bash

jobs:
  protocol:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [console, current-sshd]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 jsonschema==4.25.1 paramiko==3.5.1 pyte==0.8.2
      - run: python -m unittest test_ci_ssh_input_probe test_ci_windows_ssh_shell
      - run: python .agents/skills/qa-ui-auto/scripts/ci_services.py install
      - name: Prepare a fixed current OpenSSH server as a diagnostic control
        if: matrix.shell == 'current-sshd'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'OpenSSH-10.4.0.0p1-Win64.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ssh-probe-openssh-10.4'
          Invoke-WebRequest 'https://github.com/PowerShell/Win32-OpenSSH/releases/download/10.4.0.0p1-Preview/OpenSSH-Win64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b67ff8becd203502190ec42ac7787c24c2cd3325ed7700485fe7a1c83d2a7957') { throw 'OpenSSH SHA256 mismatch' }
          Expand-Archive $archive -DestinationPath $destination
          "QA_SSH_PROBE_SERVER=$destination/OpenSSH-Win64/sshd.exe" >> $env:GITHUB_ENV
      - if: matrix.shell == 'console'
        run: python .agents/skills/qa-ui-auto/scripts/ci_ssh_input_probe.py --shell ${{ matrix.shell }} --out qa-ui-auto-report/ssh-input-probe
      - if: matrix.shell == 'current-sshd'
        run: python .agents/skills/qa-ui-auto/scripts/ci_ssh_input_probe.py --sshd-executable "$QA_SSH_PROBE_SERVER" --out qa-ui-auto-report/ssh-input-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssh-input-probe-${{ matrix.shell }}-${{ github.run_id }}
          path: qa-ui-auto-report/ssh-input-probe/
          if-no-files-found: error
          retention-days: 14

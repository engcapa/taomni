          path: qa-ui-auto-report/official-voice-input
      - name: Download this invocation's signed TaOffice Media module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-video')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-video
          path: qa-ui-auto-report/official-taoffice-video-input
      - name: Download this invocation's signed TaOffice PDF module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-pdf')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-pdf
          path: qa-ui-auto-report/official-taoffice-pdf-input
      - name: Download this invocation's signed TaOffice Excel module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-excel')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-excel
          path: qa-ui-auto-report/official-taoffice-excel-input
      - name: Download this invocation's signed TaOffice Word module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-word')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-word
          path: qa-ui-auto-report/official-taoffice-word-input
      - name: Download this invocation's signed TaOffice Project module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-project')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-project
          path: qa-ui-auto-report/official-taoffice-project-input
      - name: Download this invocation's signed TaOffice PowerPoint module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-ppt')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-ppt
          path: qa-ui-auto-report/official-taoffice-ppt-input
      - name: Download this invocation's signed TaOffice Visio module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-visio')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-visio
          path: qa-ui-auto-report/official-taoffice-visio-input
      - name: Download this invocation's signed TaOffice Image module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-taoffice-image')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-taoffice-image
          path: qa-ui-auto-report/official-taoffice-image-input
      - name: Download this invocation's signed SocksCap module
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-sockscap')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-modular-package-${{ steps.module_platform.outputs.platform }}-${{ inputs.artifact_key }}-sockscap
          path: qa-ui-auto-report/official-sockscap-input
      - name: Prepare pinned model and public speech fixture
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-local-voice')
        run: python scripts/voice-fixture.py --root "$QA_LOCAL_VOICE_AUDIO_ROOT"
      - name: Stage the pinned public legacy installers for this shard
        if: inputs.operation == 'run' && matrix.mode == 'native' && (contains(matrix.capabilities, 'legacy-installer') || contains(matrix.capabilities, 'first-upgrade-installer'))
        env:
          GH_TOKEN: ${{ github.token }}
          EARLIER_MONOLITH: ${{ contains(matrix.capabilities, 'legacy-installer') }}
          FIRST_UPGRADE_MONOLITH: ${{ contains(matrix.capabilities, 'first-upgrade-installer') }}
        run: |
          if [[ "$EARLIER_MONOLITH" == true ]]; then
            python -m qa_ui_auto.legacy_release qa-ui-auto-report/legacy-installer-input
          fi
          if [[ "$FIRST_UPGRADE_MONOLITH" == true ]]; then
            python -m qa_ui_auto.legacy_release qa-ui-auto-report/legacy-installer-input --first-upgrade
          fi
          python -c 'import os; from pathlib import Path; Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8").write("QA_LEGACY_INSTALLER_DIR=" + str(Path("qa-ui-auto-report/legacy-installer-input").resolve()) + "\n")'
      - name: Download this invocation's verified native runtime
        if: inputs.operation == 'run' && matrix.mode == 'native'
        uses: ./.github/actions/qa-download-artifact
        with:
          name: runtime-${{ matrix.build_id }}-${{ inputs.artifact_key }}
          path: qa-ui-auto-report/native-runtime
      - name: Build the TaOffice PDF module for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-pdf')
        run: pnpm exec vite build --config src-tauri/plugins/taoffice-pdf/vite.config.ts

      - name: Build the TaOffice Excel module for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-excel')
        run: pnpm exec vite build --config src-tauri/plugins/taoffice-excel/vite.config.ts
      - name: Build the TaOffice Word module for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-word')
        run: pnpm exec vite build --config src-tauri/plugins/taoffice-word/vite.config.ts
      - name: Build the TaOffice Project module for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-project')
        run: pnpm exec vite build --config src-tauri/plugins/taoffice-project/vite.config.ts
      - name: Build the TaOffice PowerPoint module for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-ppt')
        run: pnpm exec vite build --config src-tauri/plugins/taoffice-ppt/vite.config.ts
      - name: Download the selected TaOffice Visio frontend for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-visio')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: taoffice-visio-browser-${{ inputs.artifact_key }}
          path: src-tauri/plugins/taoffice-visio/dist/frontend
      - name: Download the selected TaOffice Image frontend for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-image')
        uses: ./.github/actions/qa-download-artifact
        with:
          name: taoffice-image-browser-${{ inputs.artifact_key }}
          path: src-tauri/plugins/taoffice-image/dist/frontend
      - name: Build the TaOffice Media module for browser preview
        if: inputs.operation == 'run' && matrix.mode == 'browser' && contains(matrix.capabilities, 'taoffice-video')
        run: pnpm exec vite build --config src-tauri/plugins/taoffice-video/vite.config.ts
      - name: Run selected cases (Linux Xvfb desktop)
        if: (runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_wrapper == 'xvfb') && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
          QA_DUAL_DISPLAY: ${{ contains(matrix.capabilities, 'dual-display') }}
        run: |
          screen=1920x1080x24
          if [[ "$QA_DUAL_DISPLAY" == true ]]; then screen=3840x1440x24; fi
          # Preserve the owned display between xdpyinfo and the window manager.
          # A last-client reset can briefly reject Openbox's initial connection.
          dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -nolisten tcp -noreset" \
            python .agents/skills/qa-ui-auto/scripts/ci_execute.py \
            --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY" \
            --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Run selected cases (Linux VNC or GNOME Wayland desktop)
        if: (runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_wrapper == 'dbus') && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          dbus-run-session --
          python .agents/skills/qa-ui-auto/scripts/ci_execute.py
          --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY"
          --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Run selected cases
        if: (runner.os != 'Linux' || matrix.mode != 'native') && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          python .agents/skills/qa-ui-auto/scripts/ci_execute.py
          --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY"
          --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Stage screenshot outputs under the report root
        if: (always()) && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          python .agents/skills/qa-ui-auto/scripts/stage_screenshot_artifacts.py
          --source "$RUNNER_TEMP/taomni-qa-artifacts"
          --report "qa-ui-auto-report/$QA_ENTRY"
          --macos-crash-reports
      - uses: actions/upload-artifact@v4
        if: (always()) && inputs.operation == 'run'
        with:
          name: qa-${{ matrix.id }}-${{ inputs.artifact_key }}
          # Receipts include hidden fixture metadata and provider logs.
          include-hidden-files: true
          # Keep every file bound by the runner receipt, including the updater's
          # signed bundles and disposable install. Omitting fixture payloads
          # here makes the published receipt impossible to verify in full.
          path: |
            qa-ui-auto-report/${{ matrix.id }}/
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appdata/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appconfig/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appcache/**
            !qa-ui-auto-report/${{ matrix.id }}/**/_workdirs/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain compact native diagnostics
        uses: actions/upload-artifact@v4
        if: (always() && matrix.mode == 'native') && inputs.operation == 'run'
        with:
          # Keep this outside the aggregate's qa-* pattern: these are copies
          # for diagnosis, not a second set of execution receipts.
          name: diagnostics-${{ matrix.id }}-${{ inputs.artifact_key }}
          include-hidden-files: true
          path: |
            qa-ui-auto-report/${{ matrix.id }}/**/*.json
            qa-ui-auto-report/${{ matrix.id }}/**/*.jsonl
            qa-ui-auto-report/${{ matrix.id }}/**/*.log
            qa-ui-auto-report/${{ matrix.id }}/**/*.html
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appdata/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appconfig/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appcache/**
            !qa-ui-auto-report/${{ matrix.id }}/**/_workdirs/**
            !qa-ui-auto-report/${{ matrix.id }}/**/_updater-assets/**
            !qa-ui-auto-report/${{ matrix.id }}/**/TC-UPDATE-MACOS-*/artifacts/**
            !qa-ui-auto-report/${{ matrix.id }}/**/TC-UPDATE-MACOS-*/staged/*.app.tar.gz
            !qa-ui-auto-report/${{ matrix.id }}/**/TC-UPDATE-MACOS-*/Disposable.app/**
          if-no-files-found: warn
          retention-days: 14

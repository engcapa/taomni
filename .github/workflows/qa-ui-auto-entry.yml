name: QA platform entry
on:
  workflow_call:
    inputs:
      matrix: {type: string, required: true}
      head: {type: string, required: true}
      artifact_key: {type: string, required: true}
      first_release_run: {type: string, default: ''}
      operation: {type: string, default: run}
      max_parallel: {type: number, default: 8}
      run_rdp_unit_contracts: {type: boolean, default: true}
      workspace_stage_trace: {type: boolean, default: false}
      vendor_cache: {type: string, default: 'true'}
      trusted_cache: {type: string, default: 'true'}
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  DEV_PROXY_ALLOW_PRIVATE: '1'
defaults:
  run:
    shell: bash
jobs:
  entry:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      TAOMNI_QA_RDP_TRACE: ${{ contains(matrix.capabilities, 'xrdp') && '1' || '0' }}
      QA_NATIVE_ARTIFACT: ${{ inputs.operation == 'run' && matrix.mode == 'native' && 'qa-ui-auto-report/native-runtime/runtime.tar.gz' || '' }}
      QA_WORKSPACE_STAGE_TRACE: ${{ inputs.workspace_stage_trace && '1' || '0' }}
      QA_BRANCH_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && github.workflow_ref == format('{0}/.github/workflows/qa-ui-auto-platforms.yml@{1}', github.repository, github.ref) && inputs.head == github.sha }}
      QA_CARGO_PROFILE: ${{ matrix.profile }}
      QA_CARGO_RUNNER: ${{ matrix.runner }}
      QA_CARGO_ARCHIVE: qa-build-output/cargo-dependencies
      QA_VENDOR_CACHE: ${{ (inputs.operation == 'build' || inputs.operation == 'contracts') && inputs.vendor_cache != 'false' && '1' || '' }}
      QA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Maven Central rate-limits shared runner egress (HTTP 429). Give every
      # Maven JVM transporter-level retries; fixture builds add outer backoff.
      MAVEN_OPTS: ${{ contains(matrix.capabilities, 'java') && '-Dmaven.wagon.http.retryHandler.count=5 -Daether.connector.http.retryHandler.count=5' || '' }}
      QA_TRUSTED_CACHE: ${{ inputs.trusted_cache != 'false' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - name: Configure Windows Defender exclusions for CI workspace
        if: runner.os == 'Windows' && !contains(matrix.capabilities, 'signed-taoffice-video')
        shell: pwsh
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            (Join-Path $env:USERPROFILE '.cargo'),
            (Join-Path $env:LOCALAPPDATA 'pnpm')
          )
          foreach ($p in $paths) {
            if ($p) { Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue }
          }
      - uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-selection-${{ inputs.artifact_key }}
          path: qa-ui-auto-report
      - uses: ./.github/actions/qa-runtime
        with:
          mode: ${{ matrix.mode }}
          install_node_deps: ${{ (inputs.operation != 'run' && !(runner.os == 'Windows' && inputs.operation == 'contracts')) || matrix.mode != 'native' || contains(matrix.capabilities, 'updater') || contains(matrix.capabilities, 'mobile') }}
      - name: Scope Windows native caches to the runner image
        id: windows-cache-scope
        if: runner.os == 'Windows' && matrix.mode == 'native' && inputs.operation != 'run'
        env:
          QA_CACHE_PLATFORM: ${{ matrix.cache_key }}
        run: |
          python - <<'PY'
          import os
          image = os.environ.get("ImageVersion")
          scope = f"image-{image}" if image else f"run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"platform={os.environ['QA_CACHE_PLATFORM']}-{scope}\n")
          PY
      - name: Native QA reusable runtime key
        id: reusable-key
        if: matrix.mode == 'native' && inputs.operation == 'build'
        env:
          QA_PLATFORM_KEY: ${{ steps.windows-cache-scope.outputs.platform || matrix.platform_key }}
          QA_ARCH: ${{ matrix.arch }}
          QA_RUNNER: ${{ matrix.runner }}
          QA_PROFILE: ${{ matrix.profile }}
          QA_BUILD_CAPABILITIES: ${{ toJSON(matrix.capabilities) }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          from native_build import module_build_options, reusable_cache_key
          key = reusable_cache_key(
              platform_key=os.environ["QA_PLATFORM_KEY"],
              arch=os.environ["QA_ARCH"],
              runner=os.environ["QA_RUNNER"],
              profile=os.environ["QA_PROFILE"],
              **module_build_options(json.loads(os.environ["QA_BUILD_CAPABILITIES"])),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"key={key}\n")
          PYTHON
      - name: Find a retained runtime on the dispatch branch
        id: branch-runtime
        if: inputs.operation == 'build' && env.QA_BRANCH_ARTIFACTS == 'true'
        uses: ./.github/actions/qa-branch-artifact
        with:
          name: qa-branch-${{ steps.reusable-key.outputs.key }}
      - name: Retrieve the branch runtime
        id: branch-runtime-download
        if: steps.branch-runtime.outputs.run-id != ''
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@v4
        with:
          name: qa-branch-${{ steps.reusable-key.outputs.key }}
          path: qa-build-output/prior-runtime
          run-id: ${{ steps.branch-runtime.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Native QA reusable runtime cache
        id: reusable-runtime-cache
        if: matrix.mode == 'native' && inputs.operation == 'build' && steps.branch-runtime-download.outcome != 'success'
        uses: actions/cache/restore@v4
        with:
          path: qa-build-output/reusable-runtime
          key: ${{ steps.reusable-key.outputs.key }}
      - name: Select the retained native runtime
        id: reusable-runtime
        if: inputs.operation == 'build'
        env:
          QA_BRANCH_RUNTIME_DOWNLOADED: ${{ steps.branch-runtime-download.outcome == 'success' }}
        run: |
          if [[ "$QA_BRANCH_RUNTIME_DOWNLOADED" == 'true' ]]; then
            mkdir -p qa-build-output/reusable-runtime
            mv qa-build-output/prior-runtime/reusable.tar.gz qa-build-output/reusable-runtime/
          fi
          if [[ -f qa-build-output/reusable-runtime/reusable.tar.gz ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Native runtime cache miss
        if: inputs.operation == 'build' && steps.reusable-runtime.outputs.available != 'true'
        run: echo 'No reusable runtime for this source and recipe.'
      - name: Mobile Chromium cache
        id: mobile-chromium-cache
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'mobile')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qa-mobile-browsers
          key: qa-mobile-chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.agents/skills/qa-ui-auto/requirements-ci.txt') }}
      - name: Chromium for mobile against the real native service
        if: inputs.operation == 'run' && matrix.mode == 'native' && contains(matrix.capabilities, 'mobile')
        timeout-minutes: 15
        shell: bash
        env:
          QA_LINUX_PROFILE: ${{ matrix.linux_profile }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-mobile-browsers
          MOBILE_CHROMIUM_CACHE_HIT: ${{ steps.mobile-chromium-cache.outputs.cache-hit }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            source .agents/skills/qa-ui-auto/scripts/ci_linux_apt.sh
            prepare_apt_mirrors "${QA_LINUX_PROFILE:-ubuntu-24.04-xvfb}"
            configure_playwright_platform "${QA_LINUX_PROFILE:-ubuntu-24.04-xvfb}"
          fi
          if [[ "${MOBILE_CHROMIUM_CACHE_HIT:-}" == "true" ]]; then
            if [[ "$RUNNER_OS" == Linux ]]; then
              python -m playwright install-deps chromium
            fi
          else
            python -m playwright install --with-deps chromium
          fi
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"

      - name: Shared VNC fixture ownership contracts
        if: matrix.mode == 'browser' && contains(matrix.capabilities, 'vnc') && inputs.operation == 'run'
        run: python -m unittest -v test_browser_case
      - name: Updater unit contracts
        if: (contains(matrix.capabilities, 'updater')) && inputs.operation == 'run'
        run: pnpm test src/lib/updateService.test.ts src/stores/updateStore.test.ts src/components/UpdateDialog.test.tsx
      - name: Rust source formatting contract
        if: runner.os == 'Linux' && inputs.operation == 'build'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          manifest = Path("src-tauri/Cargo.toml").resolve()
          manifest_args = ["--manifest-path", str(manifest)]
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", *manifest_args, "--no-deps", "--format-version", "1"]
          ))
          # The vendored workspace crates keep their upstream formatting.
          packages = [
              f"--package={package['name']}"
              for package in metadata["packages"]
              if package["id"] in metadata["workspace_members"]
              and Path(package["manifest_path"]).relative_to(manifest.parent).parts[0] != "vendor"
          ]
          subprocess.run(["cargo", "fmt", *manifest_args, *packages, "--", "--check"], check=True)
          PY
      - name: Ubuntu 22.04 PipeWire build cache
        if: runner.os == 'Linux' && matrix.mode == 'native' && startsWith(matrix.linux_profile, 'ubuntu-22.04') && (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true')
        uses: actions/cache@v4
        with:
          path: ~/.cache/taomni-qa/pipewire
          key: qa-pipewire-1.0.9-${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-${{ hashFiles('.agents/skills/qa-ui-auto/scripts/ci_linux_setup.sh') }}
      - name: Linux native and service dependencies
        if: runner.os == 'Linux' && matrix.mode == 'native' && (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true')
        # Wayland provisioning installs the GNOME/portal stack on a fresh
        # runner. Azure mirrors can take more than twenty minutes for this
        # dependency set; keep setup bounded while allowing a cold install to
        # finish before the native case timeout starts.
        timeout-minutes: 35
        env:
          QA_OPERATION: ${{ inputs.operation }}
          QA_LINUX_PROFILE: ${{ matrix.linux_profile }}
          QA_CAPABILITIES: ${{ join(matrix.capabilities, ',') }}
        run: bash .agents/skills/qa-ui-auto/scripts/ci_linux_setup.sh
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.mode == 'native' && inputs.operation != 'run' && (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true')
      - name: Queued WebView evaluation unit regressions
        if: runner.os == 'macOS' && inputs.operation == 'build'
        run: |
          mkdir -p qa-build-output
          set -o pipefail
          rustc --edition 2021 --test src-tauri/vendor/wry/src/wkwebview/pending_scripts.rs --deny warnings -o "$RUNNER_TEMP/wry-pending-scripts-tests"
          "$RUNNER_TEMP/wry-pending-scripts-tests" 2>&1 | tee qa-build-output/wry-pending-scripts-tests.log
      - name: Install verified fixed protoc
        if: (matrix.mode == 'native') && inputs.operation != 'run' && !(runner.os == 'Windows' && inputs.operation == 'contracts') && (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true')
        run: python .agents/skills/qa-ui-auto/scripts/ci_setup_protoc.py
      - name: Configure Linux fast linker (lld)
        if: runner.os == 'Linux' && matrix.mode == 'native' && inputs.operation != 'run' && (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true')
        run: |
          if ! command -v ld.lld >/dev/null 2>&1; then
            source .agents/skills/qa-ui-auto/scripts/ci_linux_apt.sh
            install_packages lld
          fi
          ld.lld --version
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
      - name: Cargo dependency archive key
        id: branch-cargo-key
        if: >-
          matrix.mode == 'native' &&
          ((inputs.operation == 'build' && steps.reusable-runtime.outputs.available != 'true') ||
          (inputs.operation == 'contracts' && runner.os == 'Linux'))
        run: python .agents/skills/qa-ui-auto/scripts/ci_cargo_artifact.py key
      - name: Find retained Cargo dependencies on the dispatch branch
        id: branch-cargo
        if: steps.branch-cargo-key.outputs.name != '' && env.QA_BRANCH_ARTIFACTS == 'true'
        uses: ./.github/actions/qa-branch-artifact
        with:
          name: ${{ steps.branch-cargo-key.outputs.name }}
      - name: Retrieve the branch Cargo dependencies
        id: branch-cargo-download
        if: steps.branch-cargo.outputs.run-id != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.branch-cargo-key.outputs.name }}
          path: ${{ env.QA_CARGO_ARCHIVE }}
          run-id: ${{ steps.branch-cargo.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Find trusted Cargo dependencies on the default branch
        id: trusted-cargo
        if: >-
          env.QA_TRUSTED_CACHE == 'true' && steps.branch-cargo-key.outputs.name != '' &&
          steps.branch-cargo.outputs.run-id == ''
        uses: ./.github/actions/qa-branch-artifact
        with:
          name: ${{ steps.branch-cargo-key.outputs.name }}
          trusted: 'true'
          default-branch: ${{ env.QA_DEFAULT_BRANCH }}
          events: schedule,workflow_dispatch,push
      - name: Retrieve the trusted Cargo dependencies
        id: trusted-cargo-download
        if: steps.trusted-cargo.outputs.run-id != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.branch-cargo-key.outputs.name }}
          path: ${{ env.QA_CARGO_ARCHIVE }}
          run-id: ${{ steps.trusted-cargo.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Restore Cargo dependencies
        id: branch-cargo-restore
        if: steps.branch-cargo-download.outcome == 'success' || steps.trusted-cargo-download.outcome == 'success'
        run: python .agents/skills/qa-ui-auto/scripts/ci_cargo_artifact.py restore
      - uses: swatinem/rust-cache@v2
        id: rust-cache
        if: >-
          matrix.mode == 'native' && inputs.operation != 'run' &&
          (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true') &&
          steps.branch-cargo-restore.outcome != 'success'
        with:
          workspaces: src-tauri -> target/qa-ui-auto
          shared-key: qa-platforms-${{ steps.windows-cache-scope.outputs.platform || matrix.cache_key }}-${{ matrix.profile }}${{ runner.os == 'Windows' && inputs.operation == 'contracts' && '-sockscap' || '' }}
          # Branch dispatches retain a separate dependency archive. Keep
          # restoring shared Actions caches on a miss without duplicating writes.
          cache-targets: true
          cache-workspace-crates: false
          # An interrupted build must not reserve the immutable dependency key.
          cache-on-failure: false
          save-if: ${{ !(runner.os == 'Linux' && inputs.operation == 'contracts') && steps.branch-cargo-restore.outcome != 'success' }}
      - name: Rust dependency cache miss
        if: >-
          inputs.operation == 'build' && steps.reusable-runtime.outputs.available != 'true' &&
          steps.branch-cargo-restore.outcome != 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        run: echo 'No exact Cargo dependency cache for this build.'
      - name: Sherpa-ONNX prebuilt cache
        id: sherpa-cache
        if: >-
          matrix.mode == 'native' && inputs.operation != 'run' &&
          !(runner.os == 'Windows' && inputs.operation == 'contracts') &&
          (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true') &&
          steps.branch-cargo-restore.outputs.sherpa-hit != 'true'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/qa-ui-auto/sherpa-onnx-prebuilt
          key: qa-sherpa-onnx-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Ensure Sherpa-ONNX build state and runtime DLLs
        if: (matrix.mode == 'native') && inputs.operation != 'run' && !(runner.os == 'Windows' && inputs.operation == 'contracts') && (inputs.operation != 'build' || steps.reusable-runtime.outputs.available != 'true')
        env:
          CARGO_TARGET_DIR: src-tauri/target/qa-ui-auto
          SHERPA_CACHE_HIT: ${{ steps.branch-cargo-restore.outputs.sherpa-hit == 'true' || steps.sherpa-cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          if [[ "${SHERPA_CACHE_HIT:-}" == "true" ]]; then
            # Prebuilt archives/libs were restored over rust-cache's pruned empty dirs.
            # Clean only sherpa-onnx-sys fingerprints so Cargo re-runs its build script
            # offline to copy runtime DLLs beside the executable and re-emit link dirs.
            for profile in dev release; do
              cargo clean --manifest-path src-tauri/Cargo.toml --package sherpa-onnx-sys --profile "$profile"
            done
          else
            # Remove any empty pruned directories left by rust-cache and reset
            # sherpa-onnx-sys so upstream extraction runs cleanly.
            node scripts/refresh-sherpa-onnx-cache.mjs
          fi
      # Exercise a real Secret Service in the disposable D-Bus session.
      - name: Linux backup credential service
        if: (runner.os == 'Linux' && matrix.mode == 'native' && contains(matrix.capabilities, 'secret-service')) && inputs.operation == 'run'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools libglib2.0-bin
      - name: Install the VNC Server case's X11 daemon
        if: runner.os == 'Linux' && matrix.mode == 'native' && contains(matrix.capabilities, 'signed-local-vnc') && inputs.operation == 'run'
        run: sudo apt-get update && sudo apt-get install -y x11vnc
      - name: Normalize vendored Cargo source mtimes
        if: env.QA_VENDOR_CACHE == '1' && (inputs.operation == 'build' || inputs.operation == 'contracts')
        run: python .agents/skills/qa-ui-auto/scripts/ci_cargo_artifact.py normalize
      - name: Windows build tools (Perl)
        if: runner.os == 'Windows' && matrix.mode == 'native' && inputs.operation == 'build' && steps.reusable-runtime.outputs.available != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --yes --no-progress }
          & $perl -MIPC::Cmd -e 'print "Perl ready"'
          if ($LASTEXITCODE -ne 0) { throw 'Complete Perl unavailable' }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
          'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
      - name: Windows native runtime tools
        if: runner.os == 'Windows' && matrix.mode == 'native' && inputs.operation == 'run'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          $runtime = Get-ChildItem -LiteralPath $runtimeRoot -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 runtime unavailable' }
          $zip = Join-Path $env:RUNNER_TEMP 'qa-edgedriver.zip'
          $driver = Join-Path $env:RUNNER_TEMP 'qa-edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $driver -Force
          $driver >> $env:GITHUB_PATH
          if ('${{ contains(matrix.capabilities, 'mstsc') }}' -eq 'true') {
            $dumpZip = Join-Path $env:RUNNER_TEMP 'qa-procdump.zip'
            $dumpTools = Join-Path $env:RUNNER_TEMP 'qa-procdump'
            Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $dumpZip
            Expand-Archive -LiteralPath $dumpZip -DestinationPath $dumpTools -Force
            "QA_MSTSC_PROCDUMP=$(Join-Path $dumpTools 'procdump64.exe')" >> $env:GITHUB_ENV
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (-not (Test-Path -LiteralPath $cdb)) {
              # Microsoft's signed SDK bootstrapper, debugger feature only.
              $sdkSetup = Join-Path $env:RUNNER_TEMP 'qa-debugger-setup.exe'
              Invoke-WebRequest 'https://download.microsoft.com/download/f4b30f2a-4fc3-430e-9b03-c842b5f5f9f1/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $sdkSetup
              if ((Get-FileHash -LiteralPath $sdkSetup -Algorithm SHA256).Hash -ne '6FA0FA27DB77A909F5ECB35183CB26A969A6775936780936FE239E4F9C66B458') { throw 'Unexpected debugger bootstrapper' }
              $install = Start-Process -FilePath $sdkSetup -ArgumentList '/quiet /norestart /features OptionId.WindowsDesktopDebuggers' -Wait -PassThru -WindowStyle Hidden
              if ($install.ExitCode -notin @(0,3010)) { throw "Debugger setup failed: $($install.ExitCode)" }
            }
            if (-not (Test-Path -LiteralPath $cdb)) { throw 'mstsc dump debugger unavailable' }
            "QA_MSTSC_CDB=$cdb" >> $env:GITHUB_ENV
            $gflags = Join-Path (Split-Path -Parent $cdb) 'gflags.exe'
            if (-not (Test-Path -LiteralPath $gflags)) { throw 'mstsc heap verifier unavailable' }
            "QA_MSTSC_GFLAGS=$gflags" >> $env:GITHUB_ENV
          }
          # Pin the same upstream installer distributed by Chocolatey. The
          # community feed can return 503 while the release asset is available.
          $tesseractDir = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          $tesseract = Join-Path $tesseractDir 'tesseract.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'qa-tesseract-setup.exe'
          $download = @{
            Uri = 'https://github.com/tesseract-ocr/tesseract/releases/download/5.5.3/tesseract-ocr-w64-setup-5.5.3.20260724.exe'
            OutFile = $installer
            MaximumRetryCount = 3
            RetryIntervalSec = 15
          }
          Invoke-WebRequest @download
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'BEE9E3434BD94FD65387D9BE28CD467A41F61B1275383B55B0F59A1331270AE4') {
            throw 'Unexpected Tesseract installer checksum'
          }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $tesseract -PathType Leaf)) {
            throw "Tesseract installation failed (exit $($install.ExitCode); executable: $tesseract)"
          }
          $tesseractDir >> $env:GITHUB_PATH
      # Hosted audio cases need a loopback device. BlackHole has no controller
      # app or microphone consent sheet to cover capture fixtures on macOS.
      - name: Windows virtual audio output
        if: (runner.os == 'Windows' && contains(matrix.capabilities, 'audio')) && inputs.operation == 'run'
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: macOS virtual audio output
        if: (runner.os == 'macOS' && contains(matrix.capabilities, 'audio')) && inputs.operation == 'run'
        run: |
          brew install --cask blackhole-2ch
          sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod
          python - <<'PYTHON'
          import time
          from qa_ui_auto.fixtures.rdp_audio_required import _CoreAudio
          deadline = time.monotonic() + 30
          while True:
              audio = _CoreAudio()
              outputs = [audio.name(device) for device in audio.devices() if audio.has_output(device)]
              if any('BlackHole' in name for name in outputs):
                  print('HAL outputs:', outputs)
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('BlackHole HAL output unavailable')
              time.sleep(0.5)
          PYTHON
      - name: macOS build dependencies (krb5)

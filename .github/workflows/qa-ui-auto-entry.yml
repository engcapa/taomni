name: QA platform entry
on:
  workflow_call:
    inputs:
      matrix: {type: string, required: true}
      head: {type: string, required: true}
      artifact_key: {type: string, required: true}
      operation: {type: string, default: run}
      max_parallel: {type: number, default: 8}
      run_rdp_unit_contracts: {type: boolean, default: true}
permissions:
  contents: read
env:
  PYTHONPATH: .agents/skills/qa-ui-auto/scripts
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  DEV_PROXY_ALLOW_PRIVATE: '1'
defaults:
  run:
    shell: bash
jobs:
  entry:
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      TAOMNI_QA_RDP_TRACE: ${{ contains(matrix.capabilities, 'xrdp') && '1' || '0' }}
      QA_NATIVE_ARTIFACT: ${{ inputs.operation == 'run' && matrix.mode == 'native' && 'qa-ui-auto-report/native-runtime/runtime.tar.gz' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/qa-download-artifact
        with:
          name: qa-selection-${{ inputs.artifact_key }}
          path: qa-ui-auto-report
      - uses: ./.github/actions/qa-runtime
        with:
          mode: ${{ matrix.mode }}
      - name: Shared VNC fixture ownership contracts
        if: matrix.mode == 'browser' && contains(matrix.capabilities, 'vnc') && inputs.operation == 'run'
        run: python -m unittest -v test_browser_case
      - name: Updater unit contracts
        if: (contains(matrix.capabilities, 'updater')) && inputs.operation == 'run'
        run: pnpm test src/lib/updateService.test.ts src/stores/updateStore.test.ts src/components/UpdateDialog.test.tsx
      - name: Ubuntu 22.04 PipeWire build cache
        if: runner.os == 'Linux' && matrix.mode == 'native' && startsWith(matrix.linux_profile, 'ubuntu-22.04')
        uses: actions/cache@v4
        with:
          path: ~/.cache/taomni-qa/pipewire
          key: qa-pipewire-1.0.9-${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-${{ hashFiles('.agents/skills/qa-ui-auto/scripts/ci_linux_setup.sh') }}
      - name: Linux native and service dependencies
        if: runner.os == 'Linux' && matrix.mode == 'native'
        # Wayland provisioning installs the GNOME/portal stack on a fresh
        # runner. Azure mirrors can take more than twenty minutes for this
        # dependency set; keep setup bounded while allowing a cold install to
        # finish before the native case timeout starts.
        timeout-minutes: 35
        env:
          QA_OPERATION: ${{ inputs.operation }}
          QA_LINUX_PROFILE: ${{ matrix.linux_profile }}
          QA_CAPABILITIES: ${{ join(matrix.capabilities, ',') }}
        run: bash .agents/skills/qa-ui-auto/scripts/ci_linux_setup.sh
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.mode == 'native'
      - name: Install verified fixed protoc
        if: (matrix.mode == 'native') && inputs.operation != 'run'
        run: python .agents/skills/qa-ui-auto/scripts/ci_setup_protoc.py
      - uses: swatinem/rust-cache@v2
        if: (matrix.mode == 'native') && inputs.operation != 'run'
        with:
          workspaces: src-tauri -> target/qa-ui-auto
          shared-key: qa-platforms-${{ matrix.cache_key }}
          # Keep the shared dependency/tool cache independent of the QA app.
          # rust-cache ignores `key` when `shared-key` is also supplied.
          cache-targets: false
          cache-on-failure: true
      # Exercise a real Secret Service in the disposable D-Bus session.
      - name: Linux backup credential service
        if: (runner.os == 'Linux' && matrix.mode == 'native' && contains(matrix.capabilities, 'secret-service')) && inputs.operation == 'run'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools libglib2.0-bin
      - name: Windows build tools and WebView2 driver
        if: runner.os == 'Windows' && matrix.mode == 'native'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) { choco install strawberryperl --yes --no-progress }
          & $perl -MIPC::Cmd -e 'print "Perl ready"'
          if ($LASTEXITCODE -ne 0) { throw 'Complete Perl unavailable' }
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
          'C:\Strawberry\perl\bin' >> $env:GITHUB_PATH
          $runtimeRoot = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          $runtime = Get-ChildItem -LiteralPath $runtimeRoot -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 runtime unavailable' }
          $zip = Join-Path $env:RUNNER_TEMP 'qa-edgedriver.zip'
          $driver = Join-Path $env:RUNNER_TEMP 'qa-edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $driver -Force
          $driver >> $env:GITHUB_PATH
          if ('${{ contains(matrix.capabilities, 'mstsc') }}' -eq 'true') {
            $dumpZip = Join-Path $env:RUNNER_TEMP 'qa-procdump.zip'
            $dumpTools = Join-Path $env:RUNNER_TEMP 'qa-procdump'
            Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $dumpZip
            Expand-Archive -LiteralPath $dumpZip -DestinationPath $dumpTools -Force
            "QA_MSTSC_PROCDUMP=$(Join-Path $dumpTools 'procdump64.exe')" >> $env:GITHUB_ENV
            $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
            if (-not (Test-Path -LiteralPath $cdb)) {
              # Microsoft's signed SDK bootstrapper, debugger feature only.
              $sdkSetup = Join-Path $env:RUNNER_TEMP 'qa-debugger-setup.exe'
              Invoke-WebRequest 'https://download.microsoft.com/download/f4b30f2a-4fc3-430e-9b03-c842b5f5f9f1/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $sdkSetup
              if ((Get-FileHash -LiteralPath $sdkSetup -Algorithm SHA256).Hash -ne '6FA0FA27DB77A909F5ECB35183CB26A969A6775936780936FE239E4F9C66B458') { throw 'Unexpected debugger bootstrapper' }
              $install = Start-Process -FilePath $sdkSetup -ArgumentList '/quiet /norestart /features OptionId.WindowsDesktopDebuggers' -Wait -PassThru -WindowStyle Hidden
              if ($install.ExitCode -notin @(0,3010)) { throw "Debugger setup failed: $($install.ExitCode)" }
            }
            if (-not (Test-Path -LiteralPath $cdb)) { throw 'mstsc dump debugger unavailable' }
            "QA_MSTSC_CDB=$cdb" >> $env:GITHUB_ENV
            $gflags = Join-Path (Split-Path -Parent $cdb) 'gflags.exe'
            if (-not (Test-Path -LiteralPath $gflags)) { throw 'mstsc heap verifier unavailable' }
            "QA_MSTSC_GFLAGS=$gflags" >> $env:GITHUB_ENV
          }
          $tesseract = Join-Path $env:ProgramFiles 'Tesseract-OCR\tesseract.exe'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install tesseract --yes --no-progress
            $installExit = $LASTEXITCODE
            if ($installExit -eq 0 -and (Test-Path -LiteralPath $tesseract)) { break }
            if ($attempt -eq 3) {
              throw "Tesseract installation failed after $attempt attempts (exit $installExit; executable: $tesseract)"
            }
            Write-Warning "Tesseract is unavailable after install attempt $attempt (exit $installExit); retrying in 15 seconds"
            Start-Sleep -Seconds 15
          }
          'C:\Program Files\Tesseract-OCR' >> $env:GITHUB_PATH
      # Hosted audio cases need a loopback device. BlackHole has no controller
      # app or microphone consent sheet to cover capture fixtures on macOS.
      - name: Windows virtual audio output
        if: (runner.os == 'Windows' && contains(matrix.capabilities, 'audio')) && inputs.operation == 'run'
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1.0.4
      - name: macOS virtual audio output
        if: (runner.os == 'macOS' && contains(matrix.capabilities, 'audio')) && inputs.operation == 'run'
        run: |
          brew install --cask blackhole-2ch
          sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod
          python - <<'PYTHON'
          import time
          from qa_ui_auto.fixtures.rdp_audio_required import _CoreAudio
          deadline = time.monotonic() + 30
          while True:
              audio = _CoreAudio()
              outputs = [audio.name(device) for device in audio.devices() if audio.has_output(device)]
              if any('BlackHole' in name for name in outputs):
                  print('HAL outputs:', outputs)
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit('BlackHole HAL output unavailable')
              time.sleep(0.5)
          PYTHON
      - name: macOS build dependencies
        if: runner.os == 'macOS' && matrix.mode == 'native'
        run: |
          brew install krb5 tesseract
          echo "SHELL=/bin/zsh" >> "$GITHUB_ENV"
          echo "LIBGSSAPI_IMPL=mit" >> "$GITHUB_ENV"
          echo "LIBGSSAPI_PREFIX=$(brew --prefix krb5)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix krb5)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Verify OCR executable and pinned English/Chinese data
        if: (matrix.mode == 'native') && inputs.operation == 'run'
        run: python .agents/skills/qa-ui-auto/scripts/setup_screenshot_ocr.py
      - name: Native adapter cache
        if: (matrix.mode == 'native' && runner.os != 'macOS') && inputs.operation == 'run'
        uses: actions/cache@v4
        with:
          path: ~/.cache/taomni-qa/adapter
          key: qa-tauri-driver-2.0.4-${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}
      - name: Native adapter
        if: (matrix.mode == 'native' && runner.os != 'macOS') && inputs.operation == 'run'
        run: |
          adapter="$HOME/.cache/taomni-qa/adapter"
          if ! "$adapter/bin/tauri-driver" --help; then
            cargo install tauri-driver --version 2.0.4 --locked --root "$adapter"
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            cygpath -w "$adapter/bin" >> "$GITHUB_PATH"
          else
            echo "$adapter/bin" >> "$GITHUB_PATH"
          fi
      - name: Verify native adapter is available to Python
        if: (matrix.mode == 'native' && runner.os != 'macOS') && inputs.operation == 'run'
        run: python -c "import shutil, subprocess; driver = shutil.which('tauri-driver'); assert driver, 'tauri-driver missing from native PATH'; subprocess.run([driver, '--help'], check=True)"
      - name: Java 25 project runtime
        uses: actions/setup-java@v4
        if: (contains(matrix.capabilities, 'java25')) && inputs.operation == 'run'
        with:
          distribution: temurin
          java-version: '25'
      - name: Retain Java 25 runtime
        if: (contains(matrix.capabilities, 'java25')) && inputs.operation == 'run'
        run: echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: (contains(matrix.capabilities, 'java')) && inputs.operation == 'run'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: (contains(matrix.capabilities, 'java')) && inputs.operation == 'run'
        with:
          gradle-version: '9.1.0'
      - name: Prepare local service packages
        # The installer owns capability selection, including a POSIX-only SSH
        # shard. Keep this entry free of a second, drifting service allowlist.
        if: inputs.operation == 'run'
        env:
          QA_CAPABILITIES: ${{ toJSON(matrix.capabilities) }}
        run: python .agents/skills/qa-ui-auto/scripts/ci_services.py install
      - name: Windows mstsc startup diagnostic
        if: (runner.os == 'Windows' && matrix.mode == 'native' && contains(matrix.capabilities, 'mstsc')) && inputs.operation == 'run'
        run: >-
          python -m qa_ui_auto.rdp_helpers.mstsc
          --preflight 'qa-ui-auto-report/${{ matrix.id }}/mstsc-startup'
      - name: Retain the mstsc startup diagnostic before compiling
        if: (always() && runner.os == 'Windows' && matrix.mode == 'native' && contains(matrix.capabilities, 'mstsc')) && inputs.operation == 'run'
        uses: actions/upload-artifact@v4
        with:
          name: mstsc-startup-${{ matrix.id }}-${{ inputs.artifact_key }}
          path: qa-ui-auto-report/${{ matrix.id }}/mstsc-startup/
          if-no-files-found: error
          retention-days: 14
      - name: Native QA build input identity
        id: native-cache-key
        if: (matrix.mode == 'native') && inputs.operation != 'run'
        env:
          QA_RELEASE: ${{ contains(matrix.capabilities, 'release') }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os
          from native_build import build_inputs
          inputs = build_inputs(release=os.environ["QA_RELEASE"] == "true")
          key = hashlib.sha256(json.dumps(inputs, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"key={key}\n")
          PYTHON
      - name: Native QA workspace cache
        if: (matrix.mode == 'native') && inputs.operation == 'build'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/qa-ui-auto
          # Test/runner-only revisions share the same verified app build.
          # New source, recipe, toolchain or build environment gets a new key.
          # Restore prefixes retain useful crates from older build inputs.
          key: qa-native-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ contains(matrix.capabilities, 'release') && 'release' || 'debug' }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-inputs-${{ steps.native-cache-key.outputs.key }}
          restore-keys: |
            qa-native-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ contains(matrix.capabilities, 'release') && 'release' || 'debug' }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}-
            qa-native-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ contains(matrix.capabilities, 'release') && 'release' || 'debug' }}-
      - name: Native Rust contracts cache
        if: inputs.operation == 'contracts'
        uses: actions/cache@v4
        with:
          path: src-tauri/target/qa-ui-auto
          # Contract targets have different build inputs from the QA app. Keep
          # their completed cache independently, with the app cache as a seed.
          key: qa-contracts-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-${{ steps.native-cache-key.outputs.key }}-${{ hashFiles('.agents/skills/qa-ui-auto/scripts/ci_rust_contracts.sh') }}
          restore-keys: |
            qa-contracts-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-
            qa-native-v1-${{ matrix.cache_key }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-
      - name: Wayland cold-cache application metadata contracts
        if: (runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_profile == 'ubuntu-26.04-wayland') && inputs.operation == 'run'
        run: python -m unittest test_ci_portal_application
      - name: Verify owned Wayland desktop before expensive native checks
        if: (runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_profile == 'ubuntu-26.04-wayland') && inputs.operation == 'run'
        env:
          QA_CAPABILITIES: ${{ toJSON(matrix.capabilities) }}
        run: >-
          dbus-run-session -- python .agents/skills/qa-ui-auto/scripts/ci_desktop_preflight.py
          --profile ubuntu-26.04-wayland --capabilities "$QA_CAPABILITIES"
          --report 'qa-ui-auto-report/${{ matrix.id }}/desktop-preflight'
      - name: Verify owned X11 or VNC dual-output desktop before compilation
        if: (runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_profile != 'ubuntu-26.04-wayland' && contains(matrix.capabilities, 'dual-display')) && inputs.operation == 'run'
        env:
          QA_CAPABILITIES: ${{ toJSON(matrix.capabilities) }}
        run: >-
          dbus-run-session --
          python .agents/skills/qa-ui-auto/scripts/ci_desktop_preflight.py
          --profile '${{ matrix.linux_profile }}' --capabilities "$QA_CAPABILITIES"
          --report 'qa-ui-auto-report/${{ matrix.id }}/desktop-preflight'
      - name: Native Rust contracts
        if: inputs.operation == 'contracts'
        env:
          CARGO_TARGET_DIR: target/qa-ui-auto
          QA_RELEASE: ${{ matrix.profile == 'release' }}
          QA_RDP_CONTRACTS: ${{ matrix.rdp_unit_contracts && inputs.run_rdp_unit_contracts }}
          QA_DUAL_CONTRACTS: ${{ contains(matrix.capabilities, 'dual-display') }}
        run: |
          mkdir -p qa-contract-output
          bash .agents/skills/qa-ui-auto/scripts/ci_rust_contracts.sh 2>&1 | tee qa-contract-output/contracts.log
      - name: Retain native contract diagnostics
        if: always() && inputs.operation == 'contracts'
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ matrix.id }}-${{ inputs.artifact_key }}
          path: qa-contract-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Windows native session cleanup contracts
        if: runner.os == 'Windows' && inputs.operation == 'build'
        run: |
          mkdir -p qa-build-output
          python -m unittest test_native_webdriver_transport test_native_fixture_cleanup 2>&1 | tee qa-build-output/session-cleanup-contracts.log
      - name: Build and export the verified native runtime
        if: inputs.operation == 'build'
        env:
          QA_BUILD_ID: ${{ matrix.id }}
        run: |
          mkdir -p qa-build-output
          python .agents/skills/qa-ui-auto/scripts/ci_native_artifact.py \
            --selection qa-ui-auto-report/selection.json --build "$QA_BUILD_ID" \
            --archive qa-build-output/runtime.tar.gz 2>&1 | tee qa-build-output/build.log
      - name: Windows atomic file replacement contracts
        if: runner.os == 'Windows' && inputs.operation == 'build'
        run: |
          rustc --edition=2024 --test src-tauri/src/atomic_replace.rs -o qa-build-output/backup-atomic-tests.exe
          qa-build-output/backup-atomic-tests.exe --test-threads=1 2>&1 | tee qa-build-output/backup-atomic-contracts.log
      - name: Windows backup journal reader contracts
        if: runner.os == 'Windows' && inputs.operation == 'build' && contains(matrix.capabilities, 'secret-service')
        run: |
          python -m unittest -v test_backup_journal test_backup_journal_windows 2>&1 | tee qa-build-output/backup-reader-contracts.log
      - name: Windows file observation contracts
        if: runner.os == 'Windows' && inputs.operation == 'build'
        run: python -m unittest -v test_host_file_observation 2>&1 | tee qa-build-output/file-observation-contracts.log
      - name: Windows capture helper contracts
        if: runner.os == 'Windows' && inputs.operation == 'build'
        env:
          QA_RELEASE: ${{ contains(matrix.capabilities, 'release') }}
        run: |
          python - <<'PYTHON' 2>&1 | tee qa-build-output/capture-contracts.log
          import os, subprocess
          from native_build import ROOT, configured_environment
          env = configured_environment()
          env['CARGO_TARGET_DIR'] = str(ROOT / 'src-tauri' / 'target' / 'qa-ui-auto')
          command = ['cargo', 'test', '--locked', '--manifest-path', 'src-tauri/Cargo.toml', '--bin', 'sockscap-helper']
          if os.environ['QA_RELEASE'] == 'true':
              env['CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS'] = 'true'
              command.append('--release')
          subprocess.run(command, cwd=ROOT, env=env, check=True)
          PYTHON
      - name: Upload native runtime once per build
        if: inputs.operation == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.id }}-${{ inputs.artifact_key }}
          path: qa-build-output/runtime.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Retain native build diagnostics
        if: always() && inputs.operation == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.id }}-${{ inputs.artifact_key }}
          path: |
            qa-build-output/build.log
            qa-build-output/capture-contracts.log
            qa-build-output/session-cleanup-contracts.log
            qa-build-output/backup-atomic-contracts.log
            qa-build-output/backup-reader-contracts.log
            qa-build-output/file-observation-contracts.log
            qa-ui-auto-report/${{ matrix.id }}/
          retention-days: 14
      - name: Download this invocation's verified native runtime
        if: inputs.operation == 'run' && matrix.mode == 'native'
        uses: ./.github/actions/qa-download-artifact
        with:
          name: runtime-${{ matrix.build_id }}-${{ inputs.artifact_key }}
          path: qa-ui-auto-report/native-runtime
      - name: Run selected cases (Linux Xvfb desktop)
        if: (runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_wrapper == 'xvfb') && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
          QA_DUAL_DISPLAY: ${{ contains(matrix.capabilities, 'dual-display') }}
        run: |
          screen=1920x1080x24
          if [[ "$QA_DUAL_DISPLAY" == true ]]; then screen=3840x1440x24; fi
          # Preserve the owned display between xdpyinfo and the window manager.
          # A last-client reset can briefly reject Openbox's initial connection.
          dbus-run-session -- xvfb-run -a -s "-screen 0 $screen -nolisten tcp -noreset" \
            python .agents/skills/qa-ui-auto/scripts/ci_execute.py \
            --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY" \
            --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Run selected cases (Linux VNC or GNOME Wayland desktop)
        if: (runner.os == 'Linux' && matrix.mode == 'native' && matrix.linux_wrapper == 'dbus') && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          dbus-run-session --
          python .agents/skills/qa-ui-auto/scripts/ci_execute.py
          --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY"
          --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Run selected cases
        if: (runner.os != 'Linux' || matrix.mode != 'native') && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          python .agents/skills/qa-ui-auto/scripts/ci_execute.py
          --selection qa-ui-auto-report/selection.json --entry "$QA_ENTRY"
          --report "qa-ui-auto-report/$QA_ENTRY"
      - name: Stage screenshot outputs under the report root
        if: (always()) && inputs.operation == 'run'
        env:
          QA_ENTRY: ${{ matrix.id }}
        run: >-
          python .agents/skills/qa-ui-auto/scripts/stage_screenshot_artifacts.py
          --source "$RUNNER_TEMP/taomni-qa-artifacts"
          --report "qa-ui-auto-report/$QA_ENTRY"
          --macos-crash-reports
      - uses: actions/upload-artifact@v4
        if: (always()) && inputs.operation == 'run'
        with:
          name: qa-${{ matrix.id }}-${{ inputs.artifact_key }}
          # Receipts include hidden fixture metadata and provider logs.
          include-hidden-files: true
          # Authentic updater bundles and disposable installs are fixture data.
          # Keep staged manifests/signatures and host verification evidence.
          path: |
            qa-ui-auto-report/${{ matrix.id }}/
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appdata/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appconfig/**
            !qa-ui-auto-report/${{ matrix.id }}/**/native-appcache/**
            !qa-ui-auto-report/${{ matrix.id }}/**/_workdirs/**
            !qa-ui-auto-report/${{ matrix.id }}/**/_updater-assets/**
            !qa-ui-auto-report/${{ matrix.id }}/**/TC-UPDATE-MACOS-*/artifacts/**
            !qa-ui-auto-report/${{ matrix.id }}/**/TC-UPDATE-MACOS-*/staged/*.app.tar.gz
            !qa-ui-auto-report/${{ matrix.id }}/**/TC-UPDATE-MACOS-*/Disposable.app/**
          if-no-files-found: warn
          retention-days: 14
      - name: Retain compact native diagnostics
        uses: actions/upload-artifact@v4
        if: (always() && matrix.mode == 'native') && inputs.operation == 'run'
        with:
          # Keep this outside the aggregate's qa-* pattern: these are copies
          # for diagnosis, not a second set of execution receipts.
          name: diagnostics-${{ matrix.id }}-${{ inputs.artifact_key }}
          include-hidden-files: true
          path: |
            qa-ui-auto-report/${{ matrix.id }}/**/*.json

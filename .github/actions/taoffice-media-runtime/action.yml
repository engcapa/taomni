name: Build the TaOffice Media runtime
description: Prepare the pinned shared FFmpeg libraries and export FFMPEG_DIR for Cargo.
inputs:
  platform:
    description: Module platform from the signing matrix
    required: true
runs:
  using: composite
  steps:
    - name: Install Linux build and relocation dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y nasm patchelf libclang-dev autoconf automake libtool pkg-config ninja-build
    - name: Build the pinned shared FFmpeg libraries
      shell: bash
      env:
        MODULE_PLATFORM: ${{ inputs.platform }}
      run: python src-tauri/plugins/taoffice-video/packaging/prepare.py "$MODULE_PLATFORM"

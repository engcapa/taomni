<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taomni 文件打开 / 预览 / 编辑 — 高保真原型 v1</title>
<style>
:root{
  --bg:#f8fafc;--panel:#f1f5f9;--chrome:#e8eef5;--chrome-b:#cbd5e1;--card:#fff;--card-b:#e2e8f0;
  --accent:#1e40af;--accent-s:#3b82f6;--sel:#dbeafe;--sel-b:#93c5fd;--hover:rgba(15,23,42,.06);--hover2:rgba(15,23,42,.11);
  --text:#0f172a;--muted:#64748b;--subtle:#94a3b8;--divider:#e2e8f0;--ok:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --folder:#f5b83d;--input:#fff;--input-b:#cbd5e1;--code-bg:#f1f5f9;--check1:#fff;--check2:#e5e7eb;
  --k1:#9333ea;--k2:#0369a1;--k3:#15803d;--k4:#b45309;--shadow:0 16px 40px -8px rgba(15,23,42,.25);
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html.dark{
  --bg:#1e1f22;--panel:#23252a;--chrome:#16171a;--chrome-b:#2e3138;--card:#26282e;--card-b:#35383f;
  --accent:#6aa6f8;--accent-s:#8bbcff;--sel:#25354d;--sel-b:#4d7ec4;--hover:rgba(255,255,255,.06);--hover2:rgba(255,255,255,.12);
  --text:#e6eaf0;--muted:#9ca3ad;--subtle:#6e7582;--divider:#2e3138;--ok:#34d399;--warn:#fbbf24;--danger:#f87171;
  --folder:#e8b04a;--input:#1b1c20;--input-b:#3a3e46;--code-bg:#1a1b1f;--check1:#2b2d33;--check2:#3a3d44;
  --k1:#c792ea;--k2:#7dcfff;--k3:#9ece6a;--k4:#e0af68;--shadow:0 20px 48px -10px rgba(0,0,0,.7),0 4px 16px -2px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-size:12.5px;line-height:1.4;color:var(--text);background:#0b1020;height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}
button,input,select{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;white-space:nowrap}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--chrome-b);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.sp{flex:1}.mono{font-family:var(--mono)}.mut{color:var(--muted)}

/* prototype controller (not product) */
#proto{background:#0b1020;color:#cbd5e1;padding:7px 14px;display:flex;flex-wrap:wrap;gap:5px 14px;align-items:center;border-bottom:1px solid #1e293b;font-size:12px}
#proto b{color:#fff}#proto .grp{display:flex;align-items:center;gap:4px}#proto .lbl{color:#64748b;margin-right:2px}
#proto button{padding:3px 9px;border-radius:5px;border:1px solid #334155;color:#cbd5e1}
#proto button.on{background:#2563eb;border-color:#2563eb;color:#fff}#proto button:hover:not(.on){background:#1e293b}
#hint{background:#111a33;color:#93c5fd;padding:6px 14px;font-size:12px;border-bottom:1px solid #1e293b;min-height:28px}
#stage{flex:1;min-height:0;padding:12px;display:flex;justify-content:center}
#app{width:100%;max-width:1480px;height:100%;border-radius:10px;overflow:hidden;background:var(--chrome);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #1e293b;position:relative}

/* shell */
#titlebar{height:30px;background:var(--chrome);border-bottom:1px solid var(--chrome-b);display:flex;align-items:center;padding:0 10px;gap:8px;color:var(--muted);font-size:11.5px;flex:none}
#titlebar .dots{display:flex;gap:6px}#titlebar .dots i{width:10px;height:10px;border-radius:50%;background:var(--chrome-b)}
#shell{flex:1;min-height:0;display:flex}
#rail{width:46px;background:var(--chrome);border-right:1px solid var(--chrome-b);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;flex:none}
.rbtn{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted)}.rbtn:hover{background:var(--hover)}.rbtn.on{background:var(--sel);color:var(--accent)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#tabs{height:34px;background:var(--chrome);display:flex;align-items:flex-end;padding:0 6px;gap:2px;border-bottom:1px solid var(--chrome-b);flex:none;overflow:hidden}
.tab{height:29px;max-width:220px;padding:0 8px 0 10px;border-radius:7px 7px 0 0;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;position:relative}
.tab:hover{background:var(--hover)}.tab.on{background:var(--bg);color:var(--text);box-shadow:inset 0 2px 0 var(--accent-s)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab .dirty{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.tab .x{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:.55}.tab .x:hover{background:var(--hover2);opacity:1}
#content{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
#status{height:22px;background:var(--chrome);border-top:1px solid var(--chrome-b);display:flex;align-items:center;padding:0 10px;gap:14px;color:var(--muted);font-size:11px;flex:none}
.ibtn{width:26px;height:26px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ibtn:hover{background:var(--hover);color:var(--text)}.ibtn.on{background:var(--sel);color:var(--accent)}.ibtn:disabled{opacity:.35}
.cbtn{flex:none;height:26px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;color:var(--text);font-size:12px}
.cbtn:hover{background:var(--hover)}.cbtn.on{background:var(--sel);color:var(--accent)}.cbtn.pri{background:var(--accent-s);color:#fff}.cbtn.pri:hover{filter:brightness(1.08)}
.cbtn.outline{border:1px solid var(--input-b)}
.vsep{width:1px;height:18px;background:var(--divider);margin:0 5px;flex:none}
.seg{display:inline-flex;background:var(--hover);border-radius:6px;padding:2px;gap:2px}
.seg button{padding:2px 9px;border-radius:4px;font-size:11.5px;color:var(--muted)}.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bar{display:flex;align-items:center;gap:2px;padding:4px 10px;border-bottom:1px solid var(--divider);flex:none;background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--sel);color:var(--accent);font-weight:600}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.banner{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;border-bottom:1px solid var(--divider);flex:none}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--bg));color:var(--text)}.banner.info{background:var(--sel);color:var(--accent)}
.toast{position:absolute;right:16px;bottom:34px;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--shadow);border-radius:9px;padding:9px 12px;display:flex;gap:9px;align-items:center;z-index:30;font-size:12px;max-width:380px;animation:pop .25s ease}
@keyframes pop{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
.menu{position:absolute;background:var(--card);border:1px solid var(--card-b);border-radius:9px;box-shadow:var(--shadow);padding:4px;min-width:210px;z-index:40;font-size:12px}
.mi{display:flex;align-items:center;gap:9px;height:28px;padding:0 9px;border-radius:5px;color:var(--text);width:100%;text-align:left}
.mi:hover{background:var(--hover)}.mi .k{margin-left:auto;color:var(--muted);font-size:11px;padding-left:18px}.mi.def{font-weight:700}.mi.sub::after{content:"›";margin-left:auto;color:var(--muted)}
.msep{height:1px;background:var(--divider);margin:4px 2px}.mhd{font-size:10.5px;color:var(--muted);padding:5px 9px 2px;font-weight:700}
.modal-bg{position:absolute;inset:0;background:rgba(2,6,23,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--card);border:1px solid var(--card-b);border-radius:12px;box-shadow:var(--shadow);width:560px;max-width:92%;max-height:92%;overflow:auto}
.modal h3{font-size:14px;padding:14px 18px 6px}.modal .mb{padding:6px 18px 14px}.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:10px 18px 14px;border-top:1px solid var(--divider)}
.fld{display:flex;align-items:center;gap:10px;margin:8px 0}.fld>label{width:110px;color:var(--muted);flex:none}
.sel,.inp{height:28px;border:1px solid var(--input-b);background:var(--input);border-radius:6px;padding:0 8px;min-width:140px}
.dim{opacity:.55}

/* file icons / tokens */
.fi{width:18px;height:18px;flex:none}
.tk-k{color:var(--k1)}.tk-s{color:var(--k3)}.tk-n{color:var(--k4)}.tk-c{color:var(--subtle);font-style:italic}.tk-f{color:var(--k2)}

/* ============ Explorer ============ */
.ex{flex:1;min-height:0;display:flex;flex-direction:column}
.ex-top{display:flex;align-items:center;gap:6px;padding:7px 10px 4px}
.addr{flex:1;height:30px;border:1px solid var(--input-b);background:var(--input);border-radius:7px;display:flex;align-items:center;padding:0 6px;gap:2px;color:var(--text)}
.crumb{padding:0 6px;height:22px;border-radius:4px;display:inline-flex;align-items:center}.crumb:hover{background:var(--hover2)}
.ex-body{flex:1;min-height:0;display:flex}.nav{width:190px;border-right:1px solid var(--divider);background:var(--panel);padding:4px;flex:none;overflow:auto}
.nav .sec{font-size:10.5px;color:var(--muted);font-weight:700;padding:8px 6px 3px}.nrow{display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;border-radius:5px}.nrow:hover{background:var(--hover)}.nrow.on{background:var(--sel)}
.files{flex:1;min-width:0;display:flex;flex-direction:column}
.fhead{display:flex;height:26px;border-bottom:1px solid var(--divider);color:var(--muted);font-size:11.5px;align-items:center}
.fhead>div,.frow>div{padding:0 8px}
.frow{display:flex;align-items:center;height:28px;border-radius:5px;margin:0 4px}.frow:hover{background:var(--hover)}.frow.sel{background:var(--sel)}
.c-name{display:flex;align-items:center;gap:8px;flex:1;min-width:120px;overflow:hidden;white-space:nowrap}.c-mod{width:130px;color:var(--muted)}.c-type{width:100px;color:var(--muted)}.c-size{width:72px;color:var(--muted);text-align:right}
.pv{width:320px;border-left:1px solid var(--divider);background:var(--panel);display:flex;flex-direction:column;flex:none;min-height:0}
.pv-h{padding:10px 12px 8px;border-bottom:1px solid var(--divider);display:flex;gap:9px;align-items:center}
.pv-h .nm{font-weight:600;word-break:break-all}.pv-h .sub{color:var(--muted);font-size:11px}
.pv-act{display:flex;gap:6px;padding:8px 12px;align-items:center;border-bottom:1px solid var(--divider);flex-wrap:wrap}
.pv-body{flex:1;min-height:0;overflow:auto;padding:12px}
.pv-meta{padding:8px 12px 10px;border-top:1px solid var(--divider);display:grid;grid-template-columns:70px 1fr;gap:3px 8px;font-size:11.5px}.pv-meta dt{color:var(--muted)}
.pv-img{border-radius:6px;overflow:hidden;border:1px solid var(--divider);background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/14px 14px}
.pv-img svg,.pv-img img{display:block;width:100%;height:auto}
.pv-code{font-family:var(--mono);font-size:11px;line-height:1.55;background:var(--code-bg);border:1px solid var(--divider);border-radius:6px;padding:6px 0;overflow:auto;white-space:pre}
.pv-code div{display:flex}.pv-code .ln{width:30px;text-align:right;padding-right:8px;color:var(--subtle);flex:none}
.pv-trunc{font-size:11px;color:var(--muted);margin-top:6px}
.csv{border-collapse:collapse;font-size:11px;width:100%}.csv th,.csv td{border:1px solid var(--divider);padding:3px 6px;text-align:left}.csv th{background:var(--hover);font-weight:600}
.web-thumb{border:1px solid var(--divider);border-radius:6px;overflow:hidden;background:#fff;color:#0f172a;position:relative}
.web-thumb .badge{position:absolute;top:6px;right:6px}

/* ============ Viewer shared ============ */
.vwr{flex:1;min-height:0;display:flex;flex-direction:column}
.vwr-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/18px 18px}
.vwr-stage.dark{background:#111}.vwr-stage.light{background:#fff}
.vwr-side{width:250px;border-left:1px solid var(--divider);background:var(--panel);padding:10px 12px;overflow:auto;flex:none}
.vwr-side h4{font-size:10.5px;color:var(--muted);letter-spacing:.05em;margin:10px 0 5px}.vwr-side h4:first-child{margin-top:0}
.vwr-side dl{display:grid;grid-template-columns:72px 1fr;gap:3px 6px;font-size:11.5px}.vwr-side dt{color:var(--muted)}
.film{height:74px;border-top:1px solid var(--divider);background:var(--panel);display:flex;gap:6px;padding:6px 10px;overflow:auto;flex:none}
.film .th{width:84px;flex:none;border-radius:5px;overflow:hidden;border:2px solid transparent;position:relative}.film .th.on{border-color:var(--accent-s)}.film .th svg{display:block;width:100%;height:100%}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:54px;border-radius:8px;background:rgba(15,23,42,.45);color:#fff;display:flex;align-items:center;justify-content:center}
.hud{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.72);color:#fff;border-radius:8px;padding:4px 10px;font-size:11.5px}

/* ============ Editors ============ */
.ed{flex:1;min-height:0;display:flex;overflow:hidden}
.code{font-family:var(--mono);font-size:12.5px;line-height:1.65;flex:1;min-width:0;overflow:auto;padding:8px 0;background:var(--bg);user-select:text}
.code .l{display:flex}.code .l.cur{background:var(--hover)}.code .ln{width:52px;text-align:right;padding-right:14px;color:var(--subtle);flex:none}
.code .tx{white-space:pre}.caret{display:inline-block;width:1.5px;height:1.15em;background:var(--accent-s);vertical-align:text-bottom;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.find{position:absolute;top:8px;right:18px;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--shadow);border-radius:8px;padding:5px 7px;display:flex;align-items:center;gap:6px;z-index:5}
.find input{width:150px;height:24px;border:1px solid var(--input-b);background:var(--input);border-radius:5px;padding:0 6px}
mark.hl{background:color-mix(in srgb,var(--warn) 45%,transparent);color:inherit;border-radius:2px}

/* ============ Markdown live ============ */
.md-wrap{flex:1;min-height:0;display:flex}
.olp{width:210px;border-right:1px solid var(--divider);background:var(--panel);overflow:auto;padding:8px 6px;flex:none}
.olp .ot{font-size:10.5px;color:var(--muted);font-weight:700;padding:2px 6px 6px;display:flex;gap:6px}
.orow{padding:3px 8px;border-radius:5px;color:var(--text);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orow:hover{background:var(--hover)}.orow.on{background:var(--sel);color:var(--accent);font-weight:600}
.md-scroll{flex:1;min-width:0;overflow:auto;position:relative;background:var(--bg);user-select:text}
.doc{max-width:800px;margin:0 auto;padding:30px 44px 120px;font-size:15px;line-height:1.75;color:var(--text);position:relative}
.doc .src{color:var(--subtle);font-family:var(--mono);font-weight:400;font-size:.8em}
.doc h1{font-size:2em;line-height:1.3;margin:.2em 0 .6em;font-weight:700;padding-bottom:.25em;border-bottom:1px solid var(--divider)}
.doc h2{font-size:1.5em;margin:1.3em 0 .5em;font-weight:700}.doc h3{font-size:1.2em;margin:1.1em 0 .4em;font-weight:700}
.doc p{margin:.6em 0}.doc code.i{font-family:var(--mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--divider);border-radius:4px;padding:1px 5px}
.doc blockquote{border-left:4px solid var(--sel-b);margin:.8em 0;padding:.1em 1em;color:var(--muted);background:var(--hover);border-radius:0 6px 6px 0}
.doc ul,.doc ol{margin:.5em 0 .5em 1.5em}.doc li{margin:.15em 0}.doc li.task{list-style:none;margin-left:-1.3em;display:flex;gap:8px;align-items:baseline}
.cb{width:15px;height:15px;border:1.5px solid var(--muted);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;transform:translateY(2px)}.cb.on{background:var(--accent-s);border-color:var(--accent-s);color:#fff}.cb svg{width:11px;height:11px;stroke-width:3}
.doc a{color:var(--accent-s);text-decoration:underline}
.doc .cur-line{background:color-mix(in srgb,var(--accent-s) 7%,transparent);border-radius:6px;margin:0 -10px;padding:0 10px;box-shadow:inset 3px 0 0 var(--accent-s)}
.doc .caret{height:1em}
.cblk{background:var(--code-bg);border:1px solid var(--divider);border-radius:8px;margin:.8em 0;font-family:var(--mono);font-size:12.5px;line-height:1.6;position:relative}
.cblk .lang{position:absolute;top:6px;right:10px;font-size:10.5px;color:var(--muted);font-family:var(--sans)}.cblk pre{padding:10px 14px;overflow:auto}
.tbl-wrap{position:relative;margin:.9em 0}.tbl-wrap table{border-collapse:collapse;width:100%;font-size:14px}
.tbl-wrap th,.tbl-wrap td{border:1px solid var(--chrome-b);padding:6px 12px;text-align:left}.tbl-wrap th{background:var(--hover);font-weight:600}
.tbl-wrap td.act,.tbl-wrap th.act{background:color-mix(in srgb,var(--accent-s) 12%,transparent);box-shadow:inset 0 0 0 2px var(--accent-s)}
.tbl-tools{position:absolute;top:-34px;left:0;background:var(--card);border:1px solid var(--card-b);box-shadow:var(--shadow);border-radius:8px;padding:3px;display:flex;gap:1px;z-index:6}
.tbl-grip{position:absolute;left:-20px;top:0;bottom:0;width:14px;display:flex;flex-direction:column;justify-content:center;color:var(--subtle)}
.img-fig{margin:.9em 0;position:relative;display:inline-block;max-width:100%}.img-fig .frame{border:1px solid var(--divider);border-radius:8px;overflow:hidden;display:block}
.img-fig.sel .frame{outline:2px solid var(--accent-s)}.img-fig .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.img-tools{position:absolute;top:8px;left:8px;background:rgba(15,23,42,.78);color:#fff;border-radius:7px;padding:3px;display:flex;gap:1px}
.img-tools button{color:#fff;font-size:11px;padding:2px 7px;border-radius:5px}.img-tools button:hover{background:rgba(255,255,255,.18)}
.fmt{display:flex;align-items:center;gap:1px;flex-wrap:nowrap}
.mermaid-box{border:1px solid var(--divider);border-radius:8px;margin:.9em 0;padding:12px;text-align:center;background:var(--code-bg)}
.split-pane{flex:1;min-width:0;min-height:0;overflow:auto;position:relative}.split-pane+.split-pane{border-left:1px solid var(--divider)}
.hr{border:0;border-top:2px solid var(--divider);margin:1.4em 0}
.focus-dim .doc>*:not(.cur-line){opacity:.35}

/* ============ HTML browser ============ */
.br-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--divider);flex:none}
.br-addr{flex:1;height:30px;border:1px solid var(--input-b);background:var(--input);border-radius:15px;display:flex;align-items:center;gap:7px;padding:0 12px;min-width:0}
.br-addr .u{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.br-stage{flex:1;min-height:0;background:#d7dde6;display:flex;justify-content:center;overflow:auto;padding:0;position:relative}
html.dark .br-stage{background:#101113}
.page{background:#fff;color:#0f172a;width:100%;min-height:100%;font-family:system-ui,"Segoe UI","PingFang SC",sans-serif;box-shadow:0 0 0 1px rgba(0,0,0,.08);user-select:text;position:relative}
.page.m{width:390px;margin:14px 0;min-height:auto;border-radius:18px}.page.t{width:768px;margin:14px 0;border-radius:10px}
.devtools{height:150px;border-top:1px solid var(--divider);background:var(--bg);display:flex;flex-direction:column;flex:none}
.devtools .dh{display:flex;gap:12px;padding:0 10px;height:26px;align-items:center;border-bottom:1px solid var(--divider);font-size:11.5px;color:var(--muted)}
.devtools .dh .on{color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent-s);height:100%;display:flex;align-items:center}

 const T=(on,ico,name,extra='')=>`<div class="tab ${on?'on':''}">${ico}<span class="tt">${name}</span>${extra}<span class="x">${ic('x')}</span></div>`;
 const folder=`<svg class="i" style="color:var(--folder);fill:var(--folder);stroke:none" viewBox="0 0 24 24"><path d="${P.folder}"/></svg>`;
 const t=[T(S.sc==='explorer'||S.sc==='entries'||S.sc==='settings',folder,'docs-notes')];
 const m={image:['logo.svg / 图片',fileSvg('a.svg','fi')],text:['notes.txt',fileSvg('a.txt','fi')],md:['architecture.md',fileSvg('a.md','fi')],html:['report.html',fileSvg('a.html','fi')]};
 for(const k of ['image','text','md','html']){const dirty=(k==='text'&&S.txtDirty)||(k==='md'&&(S.mdPasted.img||S.mdPasted.tbl));
  t.push(T(S.sc===k,m[k][1],m[k][0],dirty?'<span class="dirty"></span>':''));}
 $('#tabs').innerHTML=t.join('');
}

function preview(f){
 const meta=(rows)=>`<dl class="pv-meta">${rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')}</dl>`;
 const head=`<div class="pv-h">${f.dir?folderSvg('fi" style="width:28px;height:28px'):fileSvg(f.n,'fi" style="width:28px;height:28px')}<div><div class="nm">${f.n}</div><div class="sub">${f.t} · ${f.s||'—'}</div></div></div>`;
 const actions=(kind)=>{
  const taomni=kind!=='meta'&&kind!=='big'?`<button class="cbtn pri" data-act="open">${ic('openx')}用 Taomni 打开</button>`:'';
  const edit=['md','txt','json','csv','html','svg'].includes(kind)?`<button class="cbtn outline" data-act="open">${ic('edit')}编辑</button>`:'';
  return `<div class="pv-act">${taomni}${edit}<button class="cbtn outline" data-act="menu">打开方式 ${ic('down')}</button><button class="cbtn" data-act="sys" title="系统默认应用">${ic('monitor')}系统应用</button></div>`;};
 let body='',rows=[],k=f.pv;
 if(f.dir) return head+`<div class="pv-body"><div class="mut">8 个项目 · 2.1 MB</div></div>`;
 if(k==='md'){body=`<div style="font-size:12px;line-height:1.55" >${mdPreviewHtml}</div>`;rows=[['修改日期',f.m],['字数','1,248'],['编码','UTF-8']]}
 else if(k==='svg'){body=`<div class="pv-img" style="background:var(--card)">${logoSvg}</div><div class="pv-trunc">已移除脚本与外部资源（安全渲染）</div>`;rows=[['尺寸','200 × 200'],['修改日期',f.m]]}
 else if(k==='img'){body=`<div class="pv-img">${landscape(640,400,'p')}</div>`;rows=[['尺寸',f.n.startsWith('photo')?'4032 × 3024':'1920 × 1200'],['格式',f.t],['修改日期',f.m]]}
 else if(k==='html'){body=`<div class="web-thumb">${htmlPageMini()}<span class="chip warn badge">${ic('shield')}沙盒预览</span></div><div class="pv-trunc">脚本在隔离沙盒中运行 · 网络已阻止</div>`;rows=[['标题','2026 Q4 数据报告'],['修改日期',f.m]]}
 else if(k==='txt'){body=`<div class="pv-code">${txtLines.map((l,i)=>`<div><span class="ln">${i+1}</span><span>${l||' '}</span></div>`).join('')}</div>`;rows=[['行数','11'],['编码','UTF-8'],['修改日期',f.m]]}
 else if(k==='json'){body=`<div class="pv-code">${jsonLines.map((l,i)=>`<div><span class="ln">${i+1}</span><span>${l}</span></div>`).join('')}</div>`;rows=[['行数','8'],['修改日期',f.m]]}
 else if(k==='csv'){body=`<table class="csv">${csvRows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('')}</table><div class="pv-trunc">显示前 100 行</div>`;rows=[['行 × 列','1,240 × 3'],['修改日期',f.m]]}
 else if(k==='big'){body=`<div class="banner warn" style="border-radius:6px;border:1px solid var(--divider)">${ic('info')}文件 18.3 MB，超过 256 KB 预览上限，仅显示开头：</div><div class="pv-code" style="margin-top:8px"><div><span class="ln">1</span><span>2026-11-13 09:00:01 INFO  boot ok</span></div><div><span class="ln">2</span><span>2026-11-13 09:00:02 INFO  vault unlocked</span></div></div><div class="pv-trunc">用 Taomni 打开将以只读分块方式查看</div>`;rows=[['修改日期',f.m]]}
 else{body=`<div style="text-align:center;padding:24px 0 8px">${fileSvg(f.n,'fi" style="width:64px;height:64px')}<div class="mut" style="margin-top:8px">此类型暂不支持内置预览</div></div>`;rows=[['修改日期',f.m]]}
 return head+actions(k==='big'?'txt':k)+`<div class="pv-body">${body}</div>`+meta(rows);
}

function openWithMenu(f,pos){
 const ed=['md','txt','json','csv','html','svg'].includes(f.pv);const k=f.pv;

 return `<div class="menu" style="${pos}"><div class="mhd">打开方式</div>

}

function toast(t,ms=2600){S.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},ms)}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-file],[data-cell],[data-entry],[data-thumb],[data-img-fig],.menu,.tab');if(!t&&!S.menu&&!S.entryPop)return;
 const d=t?.dataset||{};let changed=true;
 if(d.sc){S.sc=d.sc;S.menu=null;S.modal=null;S.exportDlg=false}
 else if(d.decMd){S.md=d.decMd;if(d.decMd==='split')S.mdMode='split'}
 else if(d.decHtml){S.html=d.decHtml}
 else if(d.decDbl){S.dbl=d.decDbl}
 else if(d.theme){S.theme=d.theme}
 else if(d.file){S.sel=d.file;S.menu=null}
 else if(d.act==='menu'){S.menu=S.menu==='open'?null:'open'}
 else if(d.act==='open'){S.menu=null;const f=FILES.find(x=>x.n===S.sel);S.sc=f.pv==='md'?'md':f.pv==='html'?'html':(f.pv==='img'||f.pv==='svg')?'image':'text';if(f.pv==='img')S.imgIdx=f.n.startsWith('photo')?2:1;if(f.pv==='svg')S.imgIdx=0}
 else if(d.act==='ws'){S.menu=null;toast('已在 Code Workspace 中打开 '+S.sel)}
 else if(d.act==='sys'){S.menu=null;toast('已交给系统默认应用：'+S.sel)}
 else if(d.img){S.imgIdx=(S.imgIdx+ +d.img+IMGS.length)%IMGS.length}
 else if(d.thumb){S.imgIdx=+d.thumb}
 else if(d.bg){S.imgBg=d.bg}
 else if(d.svg){S.svgMode=d.svg}
 else if(d.zoom){const z=['25%','50%','适应','100%','200%','400%'];let i=z.indexOf(S.imgZoom);if(d.zoom==='in')i=Math.min(i+1,5);else if(d.zoom==='out')i=Math.max(i-1,0);else i=d.zoom==='fit'?2:3;S.imgZoom=z[i]}
 else if(d.act==='find'){S.txtFind=!S.txtFind}
 else if(d.act==='save'){S.txtDirty=false;toast('已保存 notes.txt')}
 else if(d.act==='ext'){S.txtExt=true}
 else if(d.act==='reload'&&S.sc==='text'){S.txtExt=false;S.txtDirty=false;toast('已重新加载')}
 else if(d.act==='keep'){S.txtExt=false}
 else if(d.mm){S.mdMode=d.mm}
 else if(d.act==='focus'){S.mdFocus=!S.mdFocus}
 else if(d.act==='export'){S.menu=S.menu==='export'?null:'export'}
 else if(d.act==='exp'){S.menu=null;S.exportDlg=true}
 else if(d.act==='exp-go'){S.exportDlg=false;toast('已导出 architecture.pdf（6 页） · 在 Explorer 中显示')}
 else if(d.act==='close'){S.exportDlg=false}
 else if(d.act==='pimg'){S.mdPasted.img=true;S.imgSel=true;S.toast='已粘贴图片 → 保存为 assets/image-20261113-142530.png（相对链接）&nbsp;<u>撤销</u>';render();setTimeout(()=>{S.toast=null;render()},3200);return}
 else if(d.act==='ptbl'){S.modal='paste-tbl'}
 else if(d.act==='ptbl-go'){S.modal=null;S.mdPasted.tbl=true;S.tblAct=[4,1]}
 else if(d.act==='ptbl-text'){S.modal=null}
 else if(d.cell){S.tblAct=d.cell.split(',').map(Number);S.mdCur=undefined}
 else if(d.imgFig!==undefined){S.imgSel=!S.imgSel}
 else if(d.dev){S.htmlDev=d.dev}
 else if(d.hv){S.htmlView=d.hv}
 else if(d.act==='dev'){S.htmlDevtools=!S.htmlDevtools}
 else if(d.act==='net'){S.htmlNet=true;toast('已允许本标签的网络请求')}
 else if(d.act==='reload'){toast('已刷新（保留滚动位置）')}
 else if(d.dbl){S.dbl=d.dbl}
 else if(d.entry){S.entryPop=S.entryPop===d.entry?null:d.entry}
 else if(d.open){const m={t:['已在主界面标签打开 screenshot-01.png','图片查看器 · 来源：终端 cwd'],w:['已在工作区标签打开 architecture.md','Markdown 实时渲染 · 与主界面同一组件'],w2:['已在工作区标签打开 architecture.md','Markdown 实时渲染'],'w-ws':['已在 Code Workspace 打开','源码编辑器'],g:['已打开预览 screenshot-01.png','只读预览，不改动工作区'],m:['已打开 design.png（只读副本）','附件临时目录，另存后可编辑'],a:['已在主界面标签打开 report.html','HTML 沙盒预览'],s:['已下载并打开 index.html（只读）','远程文件：只读副本'],'t-ws':['已在 Code Workspace 打开','源码编辑器'],'a-ws':['已在 Code Workspace 打开','源码编辑器'],'s-ws':['已在 Code Workspace 打开','源码编辑器'],'g-diff':['打开 diff','沿用现有 Git diff']};S.entryRes=m[d.open]||['已打开',''];S.entryPop=null;render();clearTimeout(S.rt);S.rt=setTimeout(()=>{S.entryRes=null;render()},3000);return}
 else{ if(S.menu||S.entryPop){if(!e.target.closest('.menu')){S.menu=null;S.entryPop=null}else changed=false}else changed=false}
 if(changed)render();
});
document.addEventListener('dblclick',e=>{const r=e.target.closest('[data-file]');if(r&&S.sc==='explorer'){S.sel=r.dataset.file;if(S.dbl==='taomni'){const f=FILES.find(x=>x.n===S.sel);if(f.pv==='meta'||f.dir){toast(f.dir?'进入文件夹':'此类型交给系统应用打开');return}document.querySelector('[data-act=open]').click()}else toast('已交给系统默认应用：'+S.sel)}});
document.addEventListener('keydown',e=>{if(S.sc==='text'&&!e.ctrlKey&&!e.metaKey&&e.key.length===1&&document.activeElement===document.body){S.txtDirty=true;render()}});
const qp=new URLSearchParams(location.search);
for(const k of ['sc','theme']) if(qp.get(k)) S[k]=qp.get(k);
if(qp.get('md'))S.md=qp.get('md');if(qp.get('html'))S.html=qp.get('html');if(qp.get('menu'))S.menu=qp.get('menu');
if(qp.get('sel'))S.sel=qp.get('sel');if(qp.get('pimg')){S.mdPasted.img=true}if(qp.get('ptbl')){S.mdPasted.tbl=true;S.tblAct=[4,1]}
if(qp.get('mm'))S.mdMode=qp.get('mm');if(qp.get('dev'))S.htmlDevtools=true;if(qp.get('ext'))S.txtExt=true;if(qp.get('find'))S.txtFind=true;
if(qp.get('pop'))S.entryPop=qp.get('pop');if(qp.get('svg'))S.svgMode=qp.get('svg');if(qp.get('idx'))S.imgIdx=+qp.get('idx');
if(qp.get('imgsel'))S.imgSel=true;if(qp.get('exp'))S.exportDlg=true;if(qp.get('dirty')){S.txtDirty=true}
S.mdCur=1;render();
</script>

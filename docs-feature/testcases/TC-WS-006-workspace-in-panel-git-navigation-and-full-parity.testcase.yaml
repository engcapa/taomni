id: TC-WS-006
title: Workspace removes redundant Git buttons and navigates to the in-workspace Git
  Panel with full main parity
description: 'Verifies DEC-04 / AC-06: redundant [File|Git] toggle row (1) and top-right
  Git button (3) are removed; Git Panel opens inside the workspace via rail icon,
  sidebar bottom bar, editor button, or Git tab with all 6 tabs (Changes, Log, Branches,
  Tags, Stash, Settings).'
covers:
- F25.1
tags:
- p0
- git
- workspace-redesign
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar-rail"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-sidebar-git-bar"]'
- assert_count:
    selector: '[data-testid="workspace-legacy-file-git-row"]'
    equal: 0
- assert_count:
    selector: '[data-testid="control-bar-legacy-git-button"]'
    equal: 0
- click: '[data-testid="workspace-sidebar-git-bar"]'
- wait_for: '[data-testid="workspace-git-panel"]'
- assert_visible: '[data-testid="git-subtab-changes"]'
- assert_visible: '[data-testid="git-subtab-log"]'
- assert_visible: '[data-testid="git-subtab-branches"]'
- assert_visible: '[data-testid="git-subtab-tags"]'
- assert_visible: '[data-testid="git-subtab-stash"]'
- assert_visible: '[data-testid="git-subtab-settings"]'
- screenshot: ws-006-in-workspace-git-panel.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 工作区已移除冗余 Git 切换行与右上角 Git 按钮，点击左栏底部 Git 状态条在工作区主面板打开内置 Git Panel，且完整包含
      Changes/Log/Branches/Tags/Stash/Settings 六大子标签页。
    actions:
    - 1
    - 3
    - 7
    checkpoints:
    - step: 4
      expectation: 左栏底部 Git 状态条可见
    - step: 5
      expectation: 左栏无冗余 [文件管理|Git] 切换行
    - step: 6
      expectation: 顶栏右上角无冗余 Git 按钮
    - step: 8
      expectation: 点击 Git 状态条激活工作区内置 Git Panel
    - step: 9
      expectation: Changes 标签可见
    - step: 10
      expectation: Log 标签可见
    - step: 11
      expectation: Branches 标签可见
    - step: 12
      expectation: Tags 标签可见
    - step: 13
      expectation: Stash 标签可见
    - step: 14
      expectation: Settings 标签可见
    results:
    - 5
    - 6
    - 8
    - 14
  visual:
  - check: 工作区内置 Git 面板顶栏、冲突横幅、提交区与並排 Diff 区域排版整洁。
    method: manual
    reason: 通过截图人工复核布局。
  native:
  - check: 在桌面端验证工作区内置 Git Panel 导航。
    method: automated
    reason: 按实际执行模式验证。

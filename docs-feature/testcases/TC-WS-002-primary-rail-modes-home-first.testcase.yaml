id: TC-WS-002
title: Left primary rail places Home first alongside Workspaces, Sessions, Agents,
  and Tools
description: 'Verifies DEC-02 / AC-02: Home is moved from the top bar to #1 in the
  left primary rail above Workspaces, Sessions, Agents, and Tools, and renders WelcomePanel
  capabilities.'
covers:
- F1.2
- F1.6
tags:
- smoke
- p0
- sidebar
- workspace-redesign
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar-rail"]'
- assert_visible: '[data-testid="nav-mode-home"]'
- assert_visible: '[data-testid="nav-mode-workspaces"]'
- assert_visible: '[data-testid="side-tab-sessions"]'
- assert_visible: '[data-testid="nav-mode-agents"]'
- assert_visible: '[data-testid="side-tab-tools"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) +
      '"nav-mode-home"]').getBoundingClientRect().bottom <= document.querySelector('[data-testid'
      + String.fromCharCode(61) + '"nav-mode-workspaces"]').getBoundingClientRect().top
      + 4
    expect_truthy: true
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: '[data-testid="welcome-open-local-terminal"]'
- screenshot: ws-002-primary-rail-home-first.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 左侧主导航条顶部包含 Home、Workspaces、Sessions、Agents、Tools 五个一级入口，Home 位于 Workspaces
      正上方第 1 位，点击 Home 展示完整 WelcomePanel。
    actions:
    - 1
    - 9
    checkpoints:
    - step: 2
      expectation: 左侧主导航条可见
    - step: 3
      expectation: Home 按钮可见
    - step: 4
      expectation: Workspaces 按钮可见
    - step: 5
      expectation: Sessions 按钮可见
    - step: 6
      expectation: Agents 按钮可见
    - step: 7
      expectation: Tools 按钮可见
    - step: 8
      expectation: Home 几何位置位于 Workspaces 上方第 1 位
    - step: 10
      expectation: 点击 Home 显示 welcome-panel
    - step: 11
      expectation: Welcome 本地终端启动按钮保持可用
    results:
    - 8
    - 10
    - 11
  visual:
  - check: 左侧主导航条顶部 5 个模式按钮垂直对齐、间距均匀，Home 位于第 1 个。
    method: manual
    reason: 截图用于确认视觉层次与激活高亮。
  native:
  - check: 在桌面 WebView 中验证一级模式切换响应。
    method: automated
    reason: 按实际执行模式验证。

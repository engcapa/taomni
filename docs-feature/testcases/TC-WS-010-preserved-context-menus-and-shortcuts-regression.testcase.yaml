id: TC-WS-010
title: All main branch right-click context menus and import/export submenus remain
  100% intact
description: 'Verifies AC-10 mandate: main menu (import/export JSON, MobaXterm, CSV,
  OpenSSH), left rail Show Tool Window Names context menu, SessionTree context menu,
  and TabBar right-click context menu are 100% preserved.'
covers:
- F1.2
- F1.4
- F1.8
- F25.5
tags:
- p0
- regression
- context-menu
- workspace-redesign
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="control-bar"]'
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu-item-new-local-terminal"]'
- assert_visible: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="context-menu-item-view"]'
- assert_visible: '[data-testid="context-menu-item-tools"]'
- press: Escape
- right_click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- press: Escape
- right_click: '[data-testid="session-tree"]'
- wait_for: '[data-testid="context-menu"]'
- press: Escape
- assert_not_visible: '[data-testid="context-menu"]'
- screenshot: ws-010-preserved-context-menus.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 应用主菜单、左侧导航条右键菜单、会话树右键菜单均 100% 保留且正常弹出。
    actions:
    - 1
    - 3
    - 9
    - 10
    - 12
    - 13
    - 15
    checkpoints:
    - step: 4
      expectation: 主菜单弹出
    - step: 5
      expectation: 新建本地终端菜单项可见
    - step: 6
      expectation: Sessions 子菜单入口可见
    - step: 7
      expectation: View 子菜单入口可见
    - step: 8
      expectation: Tools 子菜单入口可见
    - step: 11
      expectation: 左侧导航条右键 Show Tool Window Names 菜单可见
    - step: 14
      expectation: SessionTree 右键上下文菜单可见
    - step: 16
      expectation: 按 Esc 关闭右键上下文菜单
    results:
    - 8
    - 11
    - 14
    - 16
  visual:
  - check: 右键菜单无裁切或层级被遮挡。
    method: manual
    reason: 结合截图确认菜单弹出位置。
  native:
  - check: 在桌面 WebView 中验证右键菜单弹出。
    method: automated
    reason: 按实际执行模式验证。

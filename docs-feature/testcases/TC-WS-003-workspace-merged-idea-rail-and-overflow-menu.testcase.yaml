id: TC-WS-003
title: Workspaces mode merges IDEA tool window buttons into the primary left rail
  and preserves the More menu
description: 'Verifies DEC-02 / AC-03: switching to Workspaces renders Project, Sessions,
  Git, Structure, and the More (...) overflow menu directly inside the primary left
  rail without a duplicate second vertical stripe.'
covers:
- F1.2
- F25.5
tags:
- p0
- code-workspace
- sidebar
- workspace-redesign
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar-rail"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_visible: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- assert_visible: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-sessions"]'
- assert_visible: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-git"]'
- assert_visible: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-structure"]'
- assert_visible: '[data-testid="sidebar-rail"] [data-testid="code-workspace-bottom-tab-overflow"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="sidebar-rail"] [data-testid="code-workspace-bottom-tab-overflow"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- press: Escape
- click: '[data-testid="side-tab-sessions"]'
- assert_count:
    selector: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
    equal: 0
- screenshot: ws-003-merged-idea-rail.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 切换到 Workspaces 模式时，Project/Sessions/Git/Structure/⋯ 直接融合在窗口主左侧导航条中，工作区内无第二条竖向工具条，⋯
      菜单完整保留，切回 Sessions 模式时上下文工具按钮自动隐藏。
    actions:
    - 1
    - 3
    - 11
    - 14
    - 15
    checkpoints:
    - step: 4
      expectation: 主左侧导航条挂载工作区工具窗口容器
    - step: 5
      expectation: Project 工具按钮可见
    - step: 6
      expectation: Sessions 工具按钮可见
    - step: 7
      expectation: Git 工具按钮可见
    - step: 8
      expectation: Structure 工具按钮可见
    - step: 9
      expectation: ⋯ 溢出菜单按钮可见
    - step: 10
      expectation: 工作区内部不再出现第二条并列左工具条
    - step: 12
      expectation: 点击 ⋯ 弹出上下文菜单
    - step: 13
      expectation: 菜单保留 Show Tool Window Names 等完整项
    - step: 16
      expectation: 切回 Sessions 模式时工作区专属工具按钮隐藏
    results:
    - 10
    - 13
    - 16
  visual:
  - check: 窗口左侧仅有一条主导航条，无双左栏并列现象。
    method: manual
    reason: 通过截图确认单轨融合视觉效果。
  native:
  - check: 在桌面端验证工具条融合与菜单交互。
    method: automated
    reason: 按实际执行模式验证。

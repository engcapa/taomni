id: TC-WS-009
title: Sessions mode uses single compact header while preserving 100% of SessionTree
  and OpenTabsMenu filters
description: 'Verifies DEC-05 / AC-09: Sessions mode eliminates redundant quick-link
  and secondary bars while preserving SessionTree toolbar/search/filters and top-right
  Tab Details (Ctrl+Shift+H) + OpenTabsMenu (⋯) directory filtering.'
covers:
- F1.4
- F1.5
- F-Sidebar-1
tags:
- p0
- sessions
- tabs
- workspace-redesign
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_visible: '[data-testid="session-new"]'
- assert_visible: '[data-testid="session-edit"]'
- assert_visible: '[data-testid="session-duplicate"]'
- assert_visible: '[data-testid="session-delete"]'
- assert_visible: '[data-testid="session-search"]'
- assert_visible: '[data-testid="tab-details-hover"]'
- click: '[data-testid="tab-more"]'
- wait_for: '[data-testid="open-tabs-menu"]'
- assert_visible: '[data-testid="open-tabs-search"]'
- press: Escape
- assert_not_visible: '[data-testid="open-tabs-menu"]'
- screenshot: ws-009-sessions-compact-header-and-filters.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Sessions 模式左栏完整保留 SessionTree 及工具栏按钮/搜索框，顶栏完整保留标签详情预览按钮与 OpenTabsMenu
      过滤搜索菜单。
    actions:
    - 1
    - 3
    - 11
    - 14
    checkpoints:
    - step: 4
      expectation: SessionTree 可见
    - step: 5
      expectation: 新建会话按钮可见
    - step: 6
      expectation: 编辑会话按钮可见
    - step: 7
      expectation: 复制会话按钮可见
    - step: 8
      expectation: 删除会话按钮可见
    - step: 9
      expectation: 会话搜索框可见
    - step: 10
      expectation: 标签详情预览按钮可见
    - step: 12
      expectation: 点击 ⋯ 展开已打开标签过滤菜单
    - step: 13
      expectation: 标签过滤搜索框可见
    - step: 15
      expectation: 按 Esc 关闭已打开标签过滤菜单
    results:
    - 9
    - 10
    - 13
    - 15
  visual:
  - check: Sessions 模式仅有一行 33px 顶栏，垂直空间最大化。
    method: manual
    reason: 结合截图确认垂直高度占用。
  native:
  - check: 在桌面端验证 Sessions 过滤与菜单。
    method: automated
    reason: 按实际执行模式验证。

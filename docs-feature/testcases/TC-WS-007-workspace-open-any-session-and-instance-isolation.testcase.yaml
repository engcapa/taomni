id: TC-WS-007
title: Workspace opens any global session via picker or Sessions tool window and isolates
  runtime instances from Sessions mode
description: 'Verifies DEC-04 / AC-07: users can open any session (not only linked
  ones) inside a Workspace, and closing or opening a session tab inside Workspaces
  does not affect the session tabs in Sessions mode.'
covers:
- F1.5
- F2.4
tags:
- p0
- sessions
- workspace-redesign
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar-rail"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-any-session-trigger"]'
- click: '[data-testid="workspace-open-any-session-trigger"]'
- wait_for: '[data-testid="workspace-session-picker-modal"]'
- click: '[data-testid="workspace-session-picker-local-terminal"]'
- wait_for: '[data-testid="workspace-isolated-terminal-pane"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 0
- screenshot: ws-007-workspace-isolated-session.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 工作区内可通过 + 菜单与任意会话选择器打开终端/会话，且该实例与 Sessions 全局模式的会话实例完全隔离。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
    checkpoints:
    - step: 4
      expectation: 工作区标签栏 + 按钮可见
    - step: 6
      expectation: 打开任意会话菜单项可见
    - step: 8
      expectation: 打开全局任意会话选择器弹窗
    - step: 10
      expectation: 在工作区内打开独立终端实例
    - step: 12
      expectation: 切换到 Sessions 模式
    - step: 13
      expectation: Sessions 模式下并未混入工作区内部打开的终端实例
    results:
    - 10
    - 13
  visual:
  - check: 会话选择器弹窗与工作区内嵌会话标签页无样式溢出。
    method: manual
    reason: 结合截图检查。
  native:
  - check: 在桌面端验证工作区与全局会话实例隔离。
    method: automated
    reason: 按实际执行模式验证。

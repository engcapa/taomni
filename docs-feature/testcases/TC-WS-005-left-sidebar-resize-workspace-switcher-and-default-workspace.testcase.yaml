id: TC-WS-005
title: Left sidebar resizes smoothly and Workspace Switcher in left sidebar guarantees
  an undeletable Default Workspace
description: 'Verifies DEC-04 / AC-05: left sidebar is resizable, Workspace Switcher
  sits at the top of the Workspace left sidebar, and Default Workspace exists automatically
  when no custom workspace has been created.'
covers:
- F1.2
- F25.1
tags:
- p0
- workspace-redesign
- persistence
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar-rail"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-switcher"]'
- assert_text:
    selector: '[data-testid="workspace-switcher"]'
    contains: Default Workspace
- assert_visible: '[data-testid="main-sidebar-resize-handle"]'
- click: '[data-testid="workspace-switcher"]'
- wait_for: '[data-testid="workspace-switcher-menu"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-menu"]'
    contains: Default Workspace
- press: Escape
- assert_not_visible: '[data-testid="workspace-switcher-menu"]'
- screenshot: ws-005-workspace-switcher-default.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 工作区切换器位于工作区左栏顶部，未创建自定义工作区时默认展示 Default Workspace，且左栏拖拽分隔条可用。
    actions:
    - 1
    - 3
    - 7
    - 10
    checkpoints:
    - step: 4
      expectation: 工作区左栏顶部渲染 workspace-switcher
    - step: 5
      expectation: 默认激活 Default Workspace
    - step: 6
      expectation: 左栏拖拽调宽手柄可见
    - step: 8
      expectation: 点击切换器展开工作区菜单
    - step: 9
      expectation: 菜单包含 Default Workspace 保底项
    - step: 11
      expectation: 按 Esc 关闭工作区切换菜单
    results:
    - 5
    - 6
    - 9
    - 11
  visual:
  - check: 工作区切换器位于左栏第一行，紧凑清晰，不在主窗口顶栏占用额外空间。
    method: manual
    reason: 结合截图确认左栏头部排版。
  native:
  - check: 在桌面端验证工作区切换器与默认工作区初始化。
    method: automated
    reason: 按实际执行模式验证。

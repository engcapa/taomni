<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taomni · Workspace Shell 2.0 原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#11151a; --chrome:#171c22; --chrome2:#1d242c; --panel:#202832;
      --panel2:#27323d; --surface:#151b21; --line:#303b47; --soft:#26313b;
      --text:#edf2f7; --muted:#9aa9b8; --faint:#687888; --accent:#68d391;
      --blue:#57a6ff; --warn:#f6c85f; --danger:#f2767c; --shadow:0 22px 70px #0008;
      --rail:52px; --nav:248px; --host:330px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--text)}
    body{overflow:hidden;font-size:13px} button,input{font:inherit} button{color:inherit;border:0}
    button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .app{width:100vw;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
    .titlebar{height:42px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--chrome);border-bottom:1px solid var(--line);user-select:none}
    .brand{display:flex;align-items:center;gap:7px;min-width:105px;padding:0 4px;font-weight:700}
    .mark,.home-mark{display:grid;place-items:center;color:#08120d;font-weight:900;background:linear-gradient(135deg,var(--blue),var(--accent))}
    .mark{width:24px;height:24px;border-radius:7px}.home-mark{width:46px;height:46px;border-radius:12px;font-size:21px}
    .top,.icon{min-height:28px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
    .top:hover,.icon:hover,.rail-btn:hover,.nav-item:hover,.tab:hover,.host-tab:hover,.tao-tab:hover{color:var(--text);background:var(--panel2)}
    .top.active,.icon.active{color:var(--accent);background:#68d3911f}.key{color:var(--faint);font-size:11px}
    .lane{display:inline-flex;align-items:center;gap:6px;padding-left:10px;border-left:1px solid var(--line);color:var(--muted)} .lane b{color:var(--text)}
    .tabs{min-width:0;flex:1;display:flex;align-items:stretch;gap:3px;overflow:hidden}
    .tab{min-width:102px;max-width:186px;display:inline-flex;align-items:center;gap:7px;padding:0 9px;border-radius:7px 7px 0 0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
    .tab.active{background:var(--surface);color:var(--text);border-bottom-color:var(--accent)} .tab-icon{width:18px;text-align:center;font-size:15px}
    .tab-copy{min-width:0;display:flex;flex-direction:column;line-height:1.15}.tab-title,.tab-meta{overflow:hidden;text-overflow:ellipsis}
    .tab-meta{color:var(--faint);font-size:10px}.badge{margin-left:auto;min-width:16px;height:16px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;background:#f2767c2e;color:#ffabb0;font-size:10px}
    .window{display:flex;align-items:center;gap:2px;padding-left:6px;border-left:1px solid var(--line)} .system{width:32px;border-radius:0}.close:hover{background:var(--danger);color:#241014}
    .body{min-height:0;flex:1;display:flex;position:relative}.rail{width:var(--rail);flex:0 0 var(--rail);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 6px;background:var(--chrome);border-right:1px solid var(--line)}
    .rail-spacer{flex:1}.rail-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:8px;color:var(--muted);background:transparent;cursor:pointer;font-size:17px}
    .rail-btn.active{color:var(--accent);background:#68d3911f}.rail-btn.active:before{content:"";position:absolute;left:-6px;width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent)}
    .rail-badge{position:absolute;right:1px;top:0;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center;border-radius:99px;color:#11151a;background:var(--warn);font-size:9px;font-weight:800}
    .navigator{width:var(--nav);flex:0 0 var(--nav);min-width:0;display:flex;flex-direction:column;background:var(--chrome2);border-right:1px solid var(--line)}
    .nav-head{height:44px;display:flex;align-items:center;gap:8px;padding:0 13px;border-bottom:1px solid var(--line)} .nav-head b{flex:1;font-size:12px}
    .nav-list{padding:10px 8px;overflow:auto}.nav-section{margin:0 7px 7px;color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .nav-item{width:100%;display:flex;align-items:center;gap:8px;min-height:32px;padding:0 9px;border-radius:6px;color:var(--muted);background:transparent;cursor:pointer;text-align:left}
    .nav-item.selected{color:var(--text);background:#57a6ff1f}.nav-icon{width:18px;text-align:center}.nav-count{margin-left:auto;color:var(--faint);font-size:11px}
    .divider{height:1px;background:var(--line);margin:12px 7px}.tree{min-height:30px;display:flex;align-items:center;gap:8px;padding:0 7px;border-radius:5px;color:var(--muted)}.tree.indent{padding-left:22px}.tree.selected{background:var(--panel2);color:var(--text)}
    .workspace{min-width:0;flex:1;display:flex;flex-direction:column;background:var(--surface)}.surface-head{height:44px;display:flex;align-items:center;gap:10px;padding:0 15px;border-bottom:1px solid var(--line);background:#171c22b8}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #68d3911a}.surface-title{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}.surface-title b,.surface-title small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.surface-title small{color:var(--muted)}
    .surface{min-height:0;flex:1;position:relative;overflow:hidden}.code,.terminal,.mail,.home{width:100%;height:100%;overflow:auto}.code{display:grid;grid-template-columns:54px minmax(0,1fr) 190px;background:#111820;color:#d9e2ea;font:12px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lines{padding:20px 11px;text-align:right;color:#546475;border-right:1px solid #26323e;user-select:none}.source{padding:20px;white-space:pre;overflow:auto}.kw{color:#c792ea}.fn{color:#82aaff}.str{color:#c3e88d}.cm{color:#718096}.type{color:#ffcb6b}.minimap{margin:16px 12px;border-left:1px solid #26323e;opacity:.58;background:repeating-linear-gradient(to bottom,#263b4b 0 2px,transparent 2px 6px)}
    .terminal{padding:20px;background:#0d1217;color:#cbd5e1;font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.prompt{color:var(--accent)}.term-muted{color:#718096}.cursor{display:inline-block;width:7px;height:15px;vertical-align:-3px;background:var(--accent);animation:blink 1.1s steps(2,start) infinite}@keyframes blink{50%{opacity:0}}
    .mail{display:grid;grid-template-columns:180px 300px minmax(0,1fr);background:#1a222b}.mail-pane{min-width:0;border-right:1px solid var(--line)}.mail-title{height:40px;padding:12px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}.mail-row{min-height:43px;padding:8px 12px;border-bottom:1px solid var(--soft);cursor:pointer}.mail-row:hover,.mail-row.active{background:#57a6ff1f}.mail-row b,.mail-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mail-row small{margin-top:3px;color:var(--muted)}.reader{padding:24px 30px;max-width:760px}.reader h2{margin:0 0 8px;font-size:19px}.reader p{color:#c1ccd7;line-height:1.65}
    .home{padding:25px 30px 40px;background:radial-gradient(circle at 75% 5%,#57a6ff14,transparent 36%),var(--surface)}.hero{display:flex;gap:14px;align-items:center;margin-bottom:22px}.hero h1{margin:0;font-size:22px}.hero p{margin:4px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:960px}.action{min-height:126px;padding:15px;text-align:left;border:1px solid var(--line);border-radius:10px;background:#202832c7;cursor:pointer}.action:hover{border-color:var(--blue);background:var(--panel2)}.action .big{font-size:21px}.action b{display:block;margin-top:16px}.action small{display:block;margin-top:5px;color:var(--muted);line-height:1.4}.recent-head{display:flex;align-items:center;max-width:960px;margin:26px 0 9px}.recent-head b{flex:1}.recent-head span{color:var(--muted);font-size:11px}.recent-list{max-width:960px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.recent-row{min-height:54px;display:flex;align-items:center;gap:11px;width:100%;padding:8px 13px;border-bottom:1px solid var(--soft);cursor:pointer;text-align:left;background:transparent}.recent-row:last-child{border-bottom:0}.recent-row:hover{background:var(--panel2)}.recent-type{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;background:#57a6ff1f;color:var(--blue)}.recent-copy{min-width:0;flex:1}.recent-copy b,.recent-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent-copy small{margin-top:3px;color:var(--muted)}.recent-time{color:var(--faint);font-size:11px}
    .host,.tao{min-width:0;display:flex;flex-direction:column;background:var(--chrome2);border-left:1px solid var(--line)}.host{width:var(--host);flex:0 0 var(--host)}.host.hidden,.tao.hidden{display:none}.host-head,.tao-head{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid var(--line)}.host-head b,.tao-head b{flex:1}.owner{max-width:90px;padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:10px}
    .host-tabs,.tao-tabs{display:flex;border-bottom:1px solid var(--line)}.host-tab,.tao-tab{flex:1;height:32px;border-bottom:2px solid transparent;color:var(--muted);background:transparent;cursor:pointer;font-size:11px}.host-tab.active,.tao-tab.active{color:var(--accent);border-bottom-color:var(--accent)}.host-body,.tao-body{min-height:0;flex:1;overflow:auto;padding:13px}.host-body h3{margin:3px 0 10px;font-size:12px}.host-body p,.tao-body p{color:var(--muted);font-size:11px;line-height:1.5}.progress{height:5px;border-radius:99px;background:#10161d;overflow:hidden}.progress span{display:block;width:68%;height:100%;background:var(--accent)}
    .tao{width:360px;flex:0 0 360px;box-shadow:-18px 0 40px #0003}.tao-head{padding:0 12px}.tao-body{padding:14px}.chat{max-width:88%;padding:9px 11px;margin-bottom:10px;border-radius:9px;background:var(--panel);color:#dce5ed;font-size:12px;line-height:1.5}.chat.user{margin-left:auto;background:#57a6ff2e}.chat-input{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line)}.chat-input input{min-width:0;flex:1;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}.note{padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.note b{display:block;font-size:12px}.note small{display:block;margin-top:4px;color:var(--muted);line-height:1.45}.alert{display:flex;gap:9px;padding:10px 8px;border-bottom:1px solid var(--soft);cursor:pointer}.alert:hover{background:var(--panel2)}.alert-icon{width:24px;text-align:center}.alert-copy{min-width:0;flex:1}.alert-copy b,.alert-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alert-copy small{margin-top:3px;color:var(--muted)}
    .overview{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:78px 28px 28px;background:#05080cad;backdrop-filter:blur(6px)}.overview[hidden]{display:none}.overview-box{width:min(980px,100%);max-height:calc(100vh - 108px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:13px;background:var(--chrome);box-shadow:var(--shadow);overflow:hidden}.overview-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}.overview-head h2{flex:1;margin:0;font-size:15px}.overview-head input{width:250px;height:31px;padding:0 9px;border:1px solid var(--line);border-radius:6px;color:var(--text);background:var(--surface)}.filters{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--soft);overflow-x:auto}.filter{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:transparent;cursor:pointer;font-size:11px;white-space:nowrap}.filter.active,.filter:hover{color:var(--accent);border-color:#68d39173;background:#68d3911a}.grid{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:14px}.preview{min-height:142px;padding:12px;display:flex;flex-direction:column;gap:9px;text-align:left;border:1px solid var(--line);border-radius:9px;background:#1a222b;cursor:pointer}.preview:hover,.preview.active{border-color:var(--blue);background:#57a6ff1a}.preview.active{box-shadow:inset 3px 0 var(--accent)}.preview-top{display:flex;align-items:center;gap:8px}.preview-top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-icon{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;background:#57a6ff24;color:var(--blue)}.preview-status{color:var(--accent);font-size:10px}.preview-meta{color:var(--muted);font-size:11px}.snippet{min-height:34px;padding:7px 8px;border-radius:6px;color:#afbdca;background:#11171e;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}.toast{position:fixed;right:20px;bottom:18px;z-index:40;padding:9px 12px;border:1px solid var(--line);border-radius:7px;color:var(--text);background:var(--panel);box-shadow:var(--shadow);opacity:0;transform:translateY(7px);pointer-events:none;transition:.18s ease}.toast.show{opacity:1;transform:translateY(0)}.legend{position:fixed;left:16px;bottom:14px;z-index:2;padding:6px 9px;border:1px solid var(--line);border-radius:6px;color:var(--faint);background:#11151ae6;font-size:10px}
    @media(max-width:1199px){:root{--nav:216px;--host:300px}.top.labelled .label{display:none}.brand{min-width:76px}}
    @media(max-width:959px){:root{--nav:0px;--host:min(360px,86vw)}.navigator{display:none}.lane{display:none}.host,.tao{position:absolute;z-index:8;top:0;right:0;bottom:0;box-shadow:-22px 0 60px #0006}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
    @media(max-width:719px){.brand{min-width:auto}.brand>span:last-child{display:none}.tab:not(.active){display:none}.system{width:28px}.home{padding:20px 16px}.cards{grid-template-columns:1fr}.action{min-height:92px}.action b{margin-top:8px}.overview{padding:55px 10px 10px}.overview-head{flex-wrap:wrap}.overview-head input{width:100%;order:3}.rail{width:46px;flex-basis:46px}.rail-btn{width:34px;height:34px}}
  </style>
</head>
<body>
<div class="app">
  <header class="titlebar" aria-label="Taomni 工作台标题栏">
    <div class="brand"><span class="mark">T</span><span>taomni</span></div>
    <button class="top labelled" id="navToggle" title="显示或隐藏导航">☰ <span class="label">导航</span></button>
    <button class="top labelled" id="quick" title="快速切换 Ctrl/Cmd+K">⌕ <span class="label">快速切换</span> <span class="key">Ctrl K</span></button>
    <div class="lane">当前工作面 <b id="laneName">Build</b>⌄</div>
    <nav class="tabs" id="tabs" aria-label="当前工作面标签"></nav>
    <div class="window">
      <button class="top labelled" id="panelToggle" title="打开当前上下文面板">◧ <span class="label">面板</span></button>
      <button class="top labelled" id="taoToggle" title="打开 Tao Hub">✦ <span class="label">Tao</span></button>
      <button class="top labelled" id="overviewToggle" title="所有标签 Ctrl/Cmd+Tab">▦ <span class="label">所有标签</span> <span class="key" id="count">8</span></button>
      <button class="top" id="more" title="更多">•••</button><button class="top system" title="最小化">−</button><button class="top system" title="最大化">□</button><button class="top system close" title="关闭">×</button>
    </div>
  </header>
  <div class="body">
    <aside class="rail" aria-label="全局导航">
      <button class="rail-btn active" data-nav="home" title="Home">⌂</button><button class="rail-btn" data-nav="sessions" title="Sessions">◉</button><button class="rail-btn" data-nav="workspaces" title="Workspaces">◇</button><button class="rail-btn" data-nav="tao" title="Tao Hub">✦<span class="rail-badge">4</span></button><div class="rail-spacer"></div><button class="rail-btn" data-nav="settings" title="Settings">⚙</button>
    </aside>
    <aside class="navigator" id="navigator" aria-label="上下文导航"><div class="nav-head"><b id="navTitle">Workspaces</b><button class="icon" id="navCollapse" title="收起导航">‹</button></div><div class="nav-list" id="navList"></div></aside>
    <main class="workspace" aria-label="主工作面"><div class="surface-head"><span class="dot"></span><div class="surface-title"><b id="surfaceName">taomni · Code Workspace</b><small id="surfaceMeta">Build / main · src/layouts/MainLayout.tsx</small></div><button class="top" id="surfaceMore">更多⌄</button></div><div class="surface" id="surface"></div></main>
    <aside class="host" id="host" aria-label="上下文工具面板"><div class="host-head"><b id="hostTitle">Git</b><span class="owner" id="owner">taomni</span><button class="icon" id="hostPin" title="固定面板">⌑</button><button class="icon" id="hostClose" title="隐藏面板">×</button></div><div class="host-tabs" role="tablist"><button class="host-tab active" data-host="git">Git</button><button class="host-tab" data-host="files">Files</button><button class="host-tab" data-host="activity">Activity</button></div><div class="host-body" id="hostBody"></div></aside>
    <aside class="tao hidden" id="tao" aria-label="Tao Hub"><div class="tao-head"><span style="color:var(--accent)">✦</span><b>Tao Hub</b><span class="key">绑定：Code</span><button class="icon" id="taoClose" title="隐藏 Tao">×</button></div><div class="tao-tabs" role="tablist"><button class="tao-tab active" data-tao="chat">Chat</button><button class="tao-tab" data-tao="notes">Notes</button><button class="tao-tab" data-tao="notifications">通知 <span>4</span></button></div><div class="tao-body" id="taoBody"></div><div class="chat-input" id="chatInput"><input aria-label="向 Tao 提问" placeholder="询问当前工作面…"><button class="top active">发送</button></div></aside>
  </div>
</div>
<div class="overview" id="overview" hidden><section class="overview-box" role="dialog" aria-modal="true" aria-labelledby="overviewTitle"><div class="overview-head"><h2 id="overviewTitle">所有标签 · 预览</h2><input id="search" type="search" placeholder="搜索名称、主机、路径或类型" aria-label="搜索标签"></div><div class="filters" id="filters"></div><div class="grid" id="grid"></div></section></div>
<div class="toast" id="toast" role="status"></div><div class="legend">原型 v1 · 推荐方案：统一工作台壳层 / Context Host / Tao Hub</div>
<script>
(() => {
  const tabs = [
    {id:'home',lane:'home',icon:'⌂',title:'Home',meta:'欢迎与最近',status:'ready',preview:'新建连接 · 打开工作区 · 恢复上次工作',snippet:'从确定的入口开始今天的工作。'},
    {id:'terminal',lane:'connect',icon:'▣',title:'prod-api',meta:'SSH · 10.0.2.14',status:'ready',preview:'root@prod-api · /srv/api',snippet:'$ tail -f logs/app.log\\nINFO health check ok'},
    {id:'workspace',lane:'build',icon:'◇',title:'taomni',meta:'Code · main',status:'ready',preview:'src/layouts/MainLayout.tsx · 3 个修改',snippet:'export function MainLayout() {\\n  return <WorkspaceShell />'},
    {id:'git',lane:'build',icon:'⎇',title:'Git · taomni',meta:'main · 3 changes',status:'attention',preview:'Changes · History · Branches',snippet:'M src/layouts/MainLayout.tsx\\nM src/components/tabbar/TabBar.tsx'},
    {id:'mail',lane:'communicate',icon:'✉',title:'Inbox',meta:'2 个未读',status:'unread',preview:'产品反馈与部署通知',snippet:'Re: Workspace shell review\\nFrom: design@taomni.local'},
    {id:'terminal-2',lane:'connect',icon:'▣',title:'staging',meta:'SSH · 10.0.3.8',status:'busy',preview:'deploy@staging · /opt/release',snippet:'$ ./deploy.sh\\nUploading 68%…'},
    {id:'db',lane:'build',icon:'▤',title:'PostgreSQL · analytics',meta:'Database · connected',status:'ready',preview:'Query 12 · public.events',snippet:'select count(*) from events'},
    {id:'sftp',lane:'connect',icon:'□',title:'Files · prod-api',meta:'SFTP · /var/backups',status:'ready',preview:'Files · Transfers',snippet:'/var/backups\\n2026-10-03-release.tar.gz'}
  ];
  const laneNames = {home:'Home',connect:'Connect',build:'Build',communicate:'Communicate',utility:'Utility'};
  const lanes = [['all','全部'],['home','Home'],['connect','Connect'],['build','Build'],['communicate','Communicate'],['utility','Utility']];
  let activeId='workspace', activeNav='workspaces', activeLane='build', overviewLane='all', hostOpen=true, taoOpen=false, hostTab='git', taoTab='chat', overviewOpen=false;
  const $ = id => document.getElementById(id), esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const current = () => tabs.find(t => t.id === activeId) || tabs[0];
  function toast(message){ const el=$('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove('show'),1700); }
  function select(id){ if(!tabs.some(t=>t.id===id))return; activeId=id; activeNav=id==='home'?'home':(id==='workspace'||id==='git'||id==='db'?'workspaces':'sessions'); if(id==='home'||id==='mail')hostOpen=false; render(); toast('已切换到 '+tabs.find(t=>t.id===id).title); }
  function openTao(){taoOpen=true;hostOpen=false;activeNav='tao';renderNav();renderTao();}
  function renderTabs(){ const tab=current(); activeLane=tab.lane; $('laneName').textContent=laneNames[activeLane]; $('count').textContent=tabs.length; $('tabs').innerHTML=tabs.filter(t=>t.lane===activeLane||t.id==='home').map(t=>'<button class="tab '+(t.id===activeId?'active':'')+'" data-id="'+esc(t.id)+'" title="'+esc(t.title)+' · '+esc(t.meta)+'"><span class="tab-icon">'+esc(t.icon)+'</span><span class="tab-copy"><span class="tab-title">'+esc(t.title)+'</span><span class="tab-meta">'+esc(t.meta)+'</span></span>'+(t.status==='unread'?'<span class="badge">2</span>':'')+'</button>').join(''); document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>select(b.dataset.id)); }
  function renderNav(){ const titles={home:'Home',sessions:'Sessions',workspaces:'Workspaces',tao:'Tao',settings:'Settings'}; $('navTitle').textContent=titles[activeNav]; const html={
    home:'<div class="nav-section">开始</div><button class="nav-item selected" data-go="home"><span class="nav-icon">⌂</span>Home</button><button class="nav-item" data-go="new"><span class="nav-icon">＋</span>新建连接</button><div class="divider"></div><div class="nav-section">最近</div><button class="nav-item" data-go="workspace"><span class="nav-icon">◇</span>taomni<span class="nav-count">刚刚</span></button><button class="nav-item" data-go="terminal"><span class="nav-icon">▣</span>prod-api<span class="nav-count">2m</span></button>',
    sessions:'<div class="nav-section">Saved sessions</div><button class="nav-item selected" data-go="terminal"><span class="nav-icon">▣</span>prod-api<span class="nav-count">SSH</span></button><button class="nav-item" data-go="terminal-2"><span class="nav-icon">▣</span>staging<span class="nav-count">SSH</span></button><button class="nav-item" data-go="sftp"><span class="nav-icon">□</span>prod-api files<span class="nav-count">SFTP</span></button><div class="divider"></div><button class="nav-item" data-go="new"><span class="nav-icon">＋</span>新建会话</button>',
    workspaces:'<div class="nav-section">Recent workspaces</div><button class="nav-item selected" data-go="workspace"><span class="nav-icon">◇</span>taomni<span class="nav-count">main</span></button><button class="nav-item" data-go="db"><span class="nav-icon">▤</span>analytics<span class="nav-count">DB</span></button><div class="divider"></div><div class="nav-section">Current workspace</div><div class="tree selected">▾　src</div><div class="tree indent">◇　layouts</div><div class="tree indent selected">◈　MainLayout.tsx</div><div class="tree indent">◈　TabBar.tsx</div><div class="tree">▸　components</div>',
    tao:'<div class="nav-section">Tao Hub</div><button class="nav-item selected" data-go="tao"><span class="nav-icon">✦</span>打开 Tao Hub<span class="nav-count">4</span></button><div class="divider"></div><div class="nav-section">快捷入口</div><button class="nav-item" data-tao-go="chat">▣　Chat</button><button class="nav-item" data-tao-go="notes">✎　Notes</button><button class="nav-item" data-tao-go="notifications">●　通知<span class="nav-count">4</span></button>',
    settings:'<div class="nav-section">Preferences</div><button class="nav-item selected">⚙　外观与布局</button><button class="nav-item">⌘　快捷键</button><button class="nav-item">◇　AI 与 Tao</button>'
  }[activeNav]; $('navList').innerHTML=html; document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='new'?toast('打开“新建连接”'):b.dataset.go==='tao'?openTao():select(b.dataset.go)); document.querySelectorAll('[data-tao-go]').forEach(b=>b.onclick=()=>{openTao();taoTab=b.dataset.taoGo;renderTao();}); }
  function renderSurface(){ const t=current(), home=t.id==='home'; $('surfaceName').textContent=home?'Home · Taomni':t.title; $('surfaceMeta').textContent=home?'清晰入口 · 最近工作 · 恢复上次工作':laneNames[t.lane]+' / '+t.meta+' · '+t.preview; $('surface').innerHTML=home?homeHtml():surfaceHtml(t); document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>select(b.dataset.open)); }
  function homeHtml(){ return '<section class="home"><div class="hero"><div class="home-mark">T</div><div><h1>欢迎回来</h1><p>从一个明确的入口开始，不需要先寻找工具。</p></div></div><div class="cards"><button class="action" data-open="terminal"><span class="big">＋</span><b>新建连接</b><small>SSH、RDP、VNC、SFTP 和数据库</small></button><button class="action" data-open="workspace"><span class="big">◇</span><b>打开工作区</b><small>恢复项目树、文件和 Git 上下文</small></button><button class="action" data-open="terminal-2"><span class="big">▣</span><b>启动本地终端</b><small>使用默认 Shell，立即开始工作</small></button></div><div class="recent-head"><b>最近工作</b><span>可搜索名称、类型、主机和路径</span></div><div class="recent-list"><button class="recent-row" data-open="workspace"><span class="recent-type">◇</span><span class="recent-copy"><b>taomni · Code Workspace</b><small>main · src/layouts/MainLayout.tsx · 3 个修改</small></span><span class="recent-time">刚刚</span></button><button class="recent-row" data-open="terminal"><span class="recent-type">▣</span><span class="recent-copy"><b>prod-api</b><small>SSH · /srv/api · 最后连接 2 分钟前</small></span><span class="recent-time">2m</span></button><button class="recent-row" data-open="mail"><span class="recent-type">✉</span><span class="recent-copy"><b>Inbox</b><small>2 个未读 · 产品反馈与部署通知</small></span><span class="recent-time">12m</span></button></div></section>'; }
  function surfaceHtml(t){ if(t.id==='mail')return '<section class="mail"><div class="mail-pane"><div class="mail-title">账户 · Inbox</div><div class="mail-row active"><b>Inbox</b><small>2 未读</small></div><div class="mail-row"><b>Starred</b><small>5</small></div><div class="mail-row"><b>Sent</b></div><div class="mail-row"><b>Archive</b></div></div><div class="mail-pane"><div class="mail-title">最近邮件</div><div class="mail-row active"><b>Workspace shell review</b><small>design@taomni.local · 10:42</small></div><div class="mail-row"><b>部署已完成</b><small>ci@taomni.local · 09:18</small></div><div class="mail-row"><b>本周项目同步</b><small>team@taomni.local · 昨天</small></div></div><div><div class="reader"><h2>Workspace shell review</h2><small class="key">design@taomni.local · 2026-10-03 10:42</small><p>新的工作区外壳会把主工作面、上下文面板和 Tao Hub 分开。查看代码时可以打开 Git，连接服务器时可以打开 SFTP，而 Chat、Notes 和通知仍保持跨上下文可达。</p><p>请从标题栏的“所有标签”打开预览总览，体验按工作意图查找标签。</p></div></div></section>'; if(t.id==='terminal'||t.id==='terminal-2')return '<section class="terminal"><div class="term-muted">Taomni Terminal · '+esc(t.meta)+'</div><br><div><span class="prompt">➜</span> <b>'+esc(t.title)+'</b> <span class="term-muted">~/deploy</span></div><div>$ git status --short</div><div class="term-muted"> M src/layouts/MainLayout.tsx</div><div>$ ./deploy.sh</div><div>Uploading assets… <span style="color:var(--warn)">68%</span></div><br><div><span class="prompt">➜</span> <span class="cursor"></span></div></section>'; return '<section class="code"><div class="lines">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10<br>11<br>12</div><div class="source"><span class="kw">export function</span> <span class="fn">MainLayout</span>() {<br>  <span class="kw">const</span> shell = <span class="fn">useWorkspaceShell</span>();<br>  <span class="kw">return</span> (<br>    &lt;<span class="type">WorkspaceShell</span><br>      activeLane={shell.activeLane}<br>      activeTab={shell.activeTab}<br>      contextPanel={shell.contextPanel}<br>      taoHub={shell.taoHub}<br>    /&gt;<br>  );<br>}<br><br><span class="cm">// 面板和业务内容保持独立生命周期</span></div><div class="minimap"></div></section>'; }
  function renderHost(){ $('host').classList.toggle('hidden',!hostOpen); const bodies={git:'<h3>Git · taomni</h3><div class="tree selected">●　Changes <span class="nav-count">3</span></div><div class="tree">◇　History</div><div class="tree">⎇　Branches</div><div class="divider"></div><div class="tree">M　MainLayout.tsx</div><div class="tree">M　TabBar.tsx</div><div class="tree">A　WorkspaceShell.tsx</div><p>Git 作为当前 Code Workspace 的上下文面板打开。选择“弹出”才会生成独立窗口。</p>',files:'<h3>Files · prod-api</h3><div class="tree selected">▾　/var/backups</div><div class="tree indent">□　2026-10-03-release.tar.gz</div><div class="tree indent">□　database.sql.gz</div><div class="divider"></div><h3>Transfers</h3><div class="tree">↑　release.tar.gz <span class="nav-count">68%</span></div><div class="progress"><span></span></div><p>Files 与 Transfers 共用当前连接上下文，切换标签不会中断传输。</p>',activity:'<h3>当前活动</h3><div class="alert"><div class="alert-icon">↑</div><div class="alert-copy"><b>release.tar.gz 上传中</b><small>prod-api · 68%</small></div></div><div class="alert"><div class="alert-icon">●</div><div class="alert-copy"><b>3 个文件待提交</b><small>taomni · main</small></div></div><p>低频活动在这里查看；需要跨工作面聚合时会同步到 Tao Notifications。</p>'}; $('hostBody').innerHTML=bodies[hostTab]; $('hostTitle').textContent=hostTab==='git'?'Git':hostTab==='files'?'Files':'Activity'; $('owner').textContent=hostTab==='files'?'prod-api':'taomni'; document.querySelectorAll('[data-host]').forEach(b=>b.classList.toggle('active',b.dataset.host===hostTab)); }
  function renderTao(){ $('tao').classList.toggle('hidden',!taoOpen); $('chatInput').style.display=taoTab==='chat'&&taoOpen?'flex':'none'; const bodies={chat:'<div class="chat">我看到你正在查看 <b>taomni</b> 的 Code Workspace。Git 面板已绑定到当前工作区。</div><div class="chat user">帮我总结这 3 个修改。</div><div class="chat">可以。我会读取当前 Changes 面板，并把结果留在当前上下文中。完成后会出现在 Tao 的通知里。</div>',notes:'<div class="note"><b>Workspace Shell 评审</b><small>确认 Tao 是否只承载 Chat、Notes、Notifications；SFTP/Git 是否留在上下文面板。</small></div><div class="note"><b>周五发布</b><small>提醒：检查 staging 上传状态和邮件通知。</small></div><button class="top active" style="width:100%">＋ 新建便签</button>',notifications:'<div class="alert"><div class="alert-icon" style="color:var(--accent)">✓</div><div class="alert-copy"><b>AI 总结已完成</b><small>跳转到 taomni · 1 分钟前</small></div></div><div class="alert"><div class="alert-icon" style="color:var(--warn)">↑</div><div class="alert-copy"><b>release.tar.gz 上传中</b><small>跳转到 Files · 68%</small></div></div><div class="alert"><div class="alert-icon" style="color:#ffabb0">✉</div><div class="alert-copy"><b>Inbox 有 2 个未读</b><small>跳转到 Mail · 12 分钟前</small></div></div><p>通知只负责聚合和跳转；业务内容仍在对应主工作面中打开。</p>'}; $('taoBody').innerHTML=bodies[taoTab]; document.querySelectorAll('[data-tao]').forEach(b=>b.classList.toggle('active',b.dataset.tao===taoTab)); }
  function renderOverview(){ $('overview').hidden=!overviewOpen; if(!overviewOpen)return; const q=$('search').value.trim().toLowerCase(); const list=tabs.filter(t=>(overviewLane==='all'||t.lane===overviewLane||t.id==='home')&&(!q||[t.title,t.meta,t.preview,t.lane].join(' ').toLowerCase().includes(q))); $('filters').innerHTML=lanes.map(x=>'<button class="filter '+(overviewLane===x[0]?'active':'')+'" data-lane="'+x[0]+'">'+x[1]+'</button>').join(''); $('grid').innerHTML=list.length?list.map(t=>'<button class="preview '+(t.id===activeId?'active':'')+'" data-preview="'+esc(t.id)+'"><div class="preview-top"><span class="preview-icon">'+esc(t.icon)+'</span><b>'+esc(t.title)+'</b><span class="preview-status">'+(t.status==='busy'?'处理中':t.status==='unread'?'未读':t.status==='attention'?'有修改':'就绪')+'</span></div><div class="preview-meta">'+laneNames[t.lane]+' · '+esc(t.meta)+'</div><div class="snippet">'+esc(t.snippet).replace(/\\n/g,'<br>')+'</div><span class="key">点击切换 · 可继续扩展关闭/固定/移动</span></button>').join(''):'<div class="key" style="grid-column:1/-1;padding:25px;text-align:center">没有匹配的标签。清除筛选或回到 Home。</div>'; document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>{overviewLane=b.dataset.lane;renderOverview()}); document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{select(b.dataset.preview);overviewOpen=false;renderOverview()}); }
  function render(){renderTabs();renderNav();renderSurface();renderHost();renderTao();}
  $('navToggle').onclick=()=>{ $('navigator').style.display=$('navigator').style.display==='none'?'':'none'; }; $('navCollapse').onclick=()=>{$('navigator').style.display='none'};
  $('quick').onclick=()=>{overviewLane='all';overviewOpen=true;renderOverview();setTimeout(()=>$('search').focus(),0)}; $('overviewToggle').onclick=()=>{overviewLane='all';overviewOpen=!overviewOpen;renderOverview();if(overviewOpen)setTimeout(()=>$('search').focus(),0)};
  $('panelToggle').onclick=()=>{hostOpen=!hostOpen;taoOpen=false;renderHost();renderTao()}; $('taoToggle').onclick=()=>taoOpen?(taoOpen=false,renderTao()):openTao(); $('hostClose').onclick=()=>{hostOpen=false;renderHost()}; $('hostPin').onclick=()=>toast('面板已固定在当前工作区'); $('taoClose').onclick=()=>{taoOpen=false;renderTao()}; $('surfaceMore').onclick=()=>toast('这里放当前工作面的低频操作'); $('more').onclick=()=>toast('全局低频操作：主题、语言、更新和导入导出');
  document.querySelectorAll('[data-host]').forEach(b=>b.onclick=()=>{hostTab=b.dataset.host;renderHost()}); document.querySelectorAll('[data-tao]').forEach(b=>b.onclick=()=>{taoTab=b.dataset.tao;openTao();renderTao()}); document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{activeNav=b.dataset.nav;if(activeNav==='tao')openTao();else{if(activeNav==='home')select('home');renderNav()}});
  $('search').oninput=renderOverview; $('overview').onclick=e=>{if(e.target===$('overview')){overviewOpen=false;renderOverview()}}; window.onkeydown=e=>{const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();overviewLane='all';overviewOpen=true;renderOverview();setTimeout(()=>$('search').focus(),0)}if(mod&&e.key==='Tab'){e.preventDefault();const i=tabs.findIndex(t=>t.id===activeId),n=tabs[(i+(e.shiftKey?-1:1)+tabs.length)%tabs.length];select(n.id)}if(e.key==='Escape'&&overviewOpen){overviewOpen=false;renderOverview()}};
  render(); renderOverview();
})();
</script>

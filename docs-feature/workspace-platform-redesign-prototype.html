<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taomni — UI & Interaction Redesign Prototype v5 (Zero Extra Top Bar, Home #1 in Rail, Ultra-Clean Workspace & Session Tabs)</title>
  <style>
    /* ============================================================================
       1. TAOMNI THEME TOKENS (from src/styles/theme.css)
       ============================================================================ */
    :root {
      --taomni-bg: #f8fafc;
      --taomni-panel-bg: #f1f5f9;
      --taomni-chrome-bg: #e8eef5;
      --taomni-chrome-border: #cbd5e1;
      --taomni-card-bg: #ffffff;
      --taomni-card-border: #e2e8f0;
      --taomni-accent: #1e40af;
      --taomni-accent-soft: #3b82f6;
      --taomni-selected: #dbeafe;
      --taomni-selected-border: #93c5fd;
      --taomni-hover: rgba(15, 23, 42, 0.06);
      --taomni-hover-strong: rgba(15, 23, 42, 0.11);
      --taomni-text: #0f172a;
      --taomni-text-muted: #64748b;
      --taomni-text-subtle: #94a3b8;
      --taomni-term-bg: #0f172a;
      --taomni-term-fg: #e2e8f0;
      --taomni-code-bg: #ffffff;
      --taomni-code-gutter: #f8fafc;
      --taomni-code-active-line: #eff6ff;
      --taomni-success: #10b981;
      --taomni-warning: #f59e0b;
      --taomni-danger: #ef4444;
      --taomni-purple: #7c3aed;
      --taomni-shadow-lg: 0 16px 40px -8px rgba(15, 23, 42, 0.22), 0 4px 12px -2px rgba(15, 23, 42, 0.1);
      --taomni-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html.dark {
      --taomni-bg: #1e1f22;
      --taomni-panel-bg: #23252a;
      --taomni-chrome-bg: #16171a;
      --taomni-chrome-border: #2e3138;
      --taomni-card-bg: #26282e;
      --taomni-card-border: #35383f;
      --taomni-accent: #6aa6f8;
      --taomni-accent-soft: #8bbcff;
      --taomni-selected: #25354d;
      --taomni-selected-border: #4d7ec4;
      --taomni-hover: rgba(255, 255, 255, 0.06);
      --taomni-hover-strong: rgba(255, 255, 255, 0.12);
      --taomni-text: #e6eaf0;
      --taomni-text-muted: #9ca3ad;
      --taomni-text-subtle: #6e7582;
      --taomni-term-bg: #141518;
      --taomni-term-fg: #e5e9f0;
      --taomni-code-bg: #1e1f22;
      --taomni-code-gutter: #212328;
      --taomni-code-active-line: #262930;
      --taomni-success: #34d399;
      --taomni-warning: #fbbf24;
      --taomni-danger: #f87171;
      --taomni-purple: #a78bfa;
      --taomni-shadow-lg: 0 20px 48px -10px rgba(0, 0, 0, 0.7), 0 4px 16px -2px rgba(0, 0, 0, 0.5);
      --taomni-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: var(--font-sans);
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--taomni-text);
      background: var(--taomni-chrome-bg);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }
    button { cursor: pointer; white-space: nowrap; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }

    /* ============================================================================
       2. WORKBENCH SHELL (NO Extra Top Titlebar Row! Full-Height Rail + Shared Main Toolbar)
       ============================================================================ */
    .workbench {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 4px 6px 4px 0;
      background: var(--taomni-chrome-bg);
      position: relative;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--taomni-text-muted);
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .icon-btn.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      border: 1px solid var(--taomni-selected-border);
    }
    .icon-btn svg { width: 14px; height: 14px; stroke-width: 1.9; }

    .kbd-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--taomni-chrome-bg);
      border: 1px solid var(--taomni-chrome-border);
      color: var(--taomni-text-muted);
    }

    .badge-count {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 0 5px;
      height: 15px;
      line-height: 15px;
      border-radius: 99px;
      background: var(--taomni-selected);
      color: var(--taomni-accent);
    }

    /* Left Primary Rail (42px): Menu at top, then 1. Home, 2. Workspaces, 3. Sessions, 4. Agents, 5. Tools */
    .primary-rail {
      width: 42px;
      min-width: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0 4px 0;
      background: var(--taomni-chrome-bg);
      z-index: 20;
    }
    .rail-group { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
    .rail-divider { width: 20px; height: 1px; background: var(--taomni-chrome-border); margin: 2px 0; }
    .rail-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--taomni-text-muted);
      position: relative;
      transition: background 0.12s, color 0.12s;
    }
    .rail-btn:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .rail-btn.active { background: var(--taomni-selected); color: var(--taomni-accent); }
    .rail-btn.active::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--taomni-accent);
    }
    .rail-btn svg { width: 16px; height: 16px; stroke-width: 1.85; }
    .rail-badge {
      position: absolute;
      top: 1px;
      right: 1px;
      min-width: 13px;
      height: 13px;
      padding: 0 3px;
      border-radius: 99px;
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--taomni-accent);
      color: #fff;
    }
    html.dark .rail-badge { color: #0f172a; }

    /* Resizable Left Navigator Panel */
    .tw-stripe { width: 30px; min-width: 30px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px 0; background: var(--taomni-chrome-bg); border-right: 1px solid var(--taomni-chrome-border); }
    .tw-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .tw-btn { width: 24px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--taomni-text-muted); position: relative; }
    .tw-btn:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .tw-btn.active { background: var(--taomni-selected); color: var(--taomni-accent); }
    .tw-btn .tw-dot { position: absolute; top: 1px; right: 0; min-width: 11px; height: 11px; border-radius: 99px; font-size: 8px; font-weight: 700; background: var(--taomni-accent); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); }
    .nav-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .mfa-float { position: fixed; left: 50px; bottom: 30px; width: 280px; z-index: 150; background: var(--taomni-panel-bg); border: 1px solid var(--taomni-selected-border); border-radius: 10px; box-shadow: var(--taomni-shadow-lg); display: none; flex-direction: column; overflow: hidden; }
    .mfa-float.open { display: flex; }
    .mfa-head { height: 30px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; background: var(--taomni-chrome-bg); border-bottom: 1px solid var(--taomni-chrome-border); cursor: move; font-weight: 700; font-size: 12px; }
    .navigator-panel {
      flex-direction: row !important;
      width: 260px;
      min-width: 185px;
      max-width: 500px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .navigator-panel.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .resize-handle-x {
      width: 6px;
      flex-shrink: 0;
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
    }
    .resize-handle-x::after {
      content: "";
      width: 2px;
      height: 30px;
      border-radius: 2px;
      background: var(--taomni-chrome-border);
      transition: background 0.12s, height 0.12s;
    }
    .resize-handle-x:hover::after,
    .resize-handle-x.dragging::after {
      height: 100%;
      background: var(--taomni-accent);
    }
    .resize-handle-x.hidden { display: none; }

    .resize-handle-y {
      height: 5px;
      flex-shrink: 0;
      cursor: ns-resize;
      background: var(--taomni-panel-bg);
      border-top: 1px solid var(--taomni-chrome-border);
    }
    .resize-handle-y:hover { background: var(--taomni-accent); }

    /* ============================================================================
       3. LEFT SIDEBAR: CLEAN WORKSPACE SWITCHER (Row 1 Deleted!) & SESSION TREE
       ============================================================================ */
    .ws-sidebar-switcher {
      padding: 6px 8px;
      border-bottom: 1px solid var(--taomni-chrome-border);
      background: var(--taomni-card-bg);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .ws-selector-btn {
      width: 100%;
      height: 27px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 12px;
    }
    .ws-selector-btn:hover { border-color: var(--taomni-selected-border); }

    .nav-action-toolbar {
      height: 28px;
      min-height: 28px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 2px;
      border-bottom: 1px solid var(--taomni-chrome-border);
    }
    .toolbar-v-divider {
      width: 1px;
      height: 14px;
      background: var(--taomni-chrome-border);
      margin: 0 3px;
      flex-shrink: 0;
    }
    .nav-inline-search {
      flex: 1;
      min-width: 60px;
      height: 21px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      display: flex;
      align-items: center;
    }
    .nav-inline-search input { width: 100%; font-size: 11.5px; color: var(--taomni-text); }

    .nav-filter-pills {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 6px;
      border-bottom: 1px solid var(--taomni-chrome-border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .nav-filter-pills.hidden { display: none; }
    .filter-chip {
      font-size: 11px;
      padding: 1.5px 6px;
      border-radius: 5px;
      color: var(--taomni-text-muted);
      border: 1px solid transparent;
    }
    .filter-chip:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .filter-chip.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      border-color: var(--taomni-selected-border);
      font-weight: 600;
    }

    .nav-tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 4px 4px 10px 4px;
    }

    .tree-row {
      height: 24px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 6px;
      cursor: pointer;
      color: var(--taomni-text);
      font-size: 12px;
      margin-top: 1px;
    }
    .tree-row:hover { background: var(--taomni-hover); }
    .tree-row.selected {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      font-weight: 500;
    }
    .tree-row-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }
    .tree-chevron {
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--taomni-text-muted);
      font-size: 10px;
      flex-shrink: 0;
    }
    .tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-meta { font-family: var(--font-mono); font-size: 10px; color: var(--taomni-text-muted); flex-shrink: 0; }
    .tree-hover-btns { display: none; align-items: center; gap: 2px; }
    .tree-row:hover .tree-hover-btns { display: inline-flex; }
    .tree-row:hover .tree-meta { display: none; }

    .proto-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      padding: 0 4px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .proto-ssh { background: rgba(16, 185, 129, 0.15); color: var(--taomni-success); }
    .proto-sftp { background: rgba(59, 130, 246, 0.15); color: var(--taomni-accent-soft); }
    .proto-db { background: rgba(245, 158, 11, 0.15); color: var(--taomni-warning); }
    .proto-code { background: rgba(139, 92, 246, 0.16); color: var(--taomni-purple); }
    .proto-git { background: rgba(249, 115, 22, 0.16); color: #fb923c; }
    .proto-rdp { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
    .proto-mail { background: rgba(99, 102, 241, 0.16); color: #818cf8; }

    /* ============================================================================
       4. CENTER MAIN PANEL: SHARED 33PX TOOLBAR (Hosts Left/Right Collapse + Tabs + Actions)
       ============================================================================ */
    .center-stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .main-canvas-frame {
      flex: 1;
      min-height: 0;
      background: var(--taomni-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--taomni-shadow-sm);
    }

    /* The ONE and ONLY top bar in the main panel (33px, matching main's 32px ControlBar!) */
    .canvas-header-bar {
      height: 33px;
      min-height: 33px;
      background: var(--taomni-panel-bg);
      border-bottom: 1px solid var(--taomni-chrome-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px;
      gap: 4px;
      overflow: hidden;
    }

    .tabs-scroll-strip {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-end;
      height: 100%;
      gap: 2px;
      overflow-x: auto;
      padding-top: 4px;
    }
    .tabs-scroll-strip::-webkit-scrollbar { height: 0; }

    .ws-tab {
      height: 28px;
      max-width: 185px;
      min-width: 92px;
      padding: 0 8px;
      border-radius: 6px 6px 0 0;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      font-size: 12px;
      color: var(--taomni-text-muted);
      border: 1px solid transparent;
      border-bottom: none;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .ws-tab:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .ws-tab.active {
      background: var(--taomni-bg);
      color: var(--taomni-text);
      font-weight: 600;
      border-color: var(--taomni-chrome-border);
      margin-bottom: -1px;
      padding-bottom: 1px;
    }
    .ws-tab.active::after {
      content: "";
      position: absolute;
      top: 0;
      left: 6px;
      right: 6px;
      height: 2px;
      border-radius: 2px;
      background: var(--taomni-accent);
    }

    .canvas-right-controls {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      padding-left: 5px;
      border-left: 1px solid var(--taomni-chrome-border);
    }

    .split-preset-group {
      display: inline-flex;
      align-items: center;
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      border-radius: 5px;
      padding: 1px;
      gap: 1px;
    }
    .split-btn {
      height: 21px;
      padding: 0 5px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--taomni-text-muted);
    }
    .split-btn:hover { color: var(--taomni-text); background: var(--taomni-hover); }
    .split-btn.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      font-weight: 600;
    }

    .surface-viewport {
      flex: 1;
      min-height: 0;
      display: grid;
      gap: 1px;
      background: var(--taomni-chrome-border);
      overflow: hidden;
    }
    .surface-viewport.layout-single { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .surface-viewport.layout-split-right { grid-template-columns: 1.15fr 0.85fr; grid-template-rows: 1fr; }
    .surface-viewport.layout-grid-2x2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .pane-cell {
      background: var(--taomni-bg);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .ws-bottom-dock {
      height: 165px;
      min-height: 80px;
      max-height: 400px;
      background: var(--taomni-panel-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .ws-bottom-header {
      height: 27px;
      min-height: 27px;
      padding: 0 8px;
      border-bottom: 1px solid var(--taomni-chrome-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .dock-tool-btn {
      height: 21px;
      padding: 0 7px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--taomni-text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .dock-tool-btn:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .dock-tool-btn.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      font-weight: 600;
    }

    .right-context-dock {
      width: 300px;
      min-width: 220px;
      max-width: 480px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 9px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .right-context-dock.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    .home-launch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(225px, 1fr));
      gap: 11px;
    }
    .home-card {
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      border-radius: 9px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: border-color 0.12s;
    }
    .home-card:hover { border-color: var(--taomni-selected-border); }

    /* Context Menu, OpenTabsMenu Popup, Overview & Modals */
    .context-menu-popup {
      position: fixed;
      z-index: 200;
      min-width: 240px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 8px;
      padding: 4px;
      box-shadow: var(--taomni-shadow-lg);
      display: none;
      flex-direction: column;
      gap: 1px;
    }
    .context-menu-popup.open { display: flex; }
    .ctx-item {
      height: 26px;
      padding: 0 9px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--taomni-text);
      cursor: pointer;
    }
    .ctx-item:hover { background: var(--taomni-selected); color: var(--taomni-accent); }
    .ctx-item.danger { color: var(--taomni-danger); }
    .ctx-sep { height: 1px; background: var(--taomni-chrome-border); margin: 3px 4px; }

    .tab-overview-backdrop {
      position: fixed;

    function getActiveWorkspace() {
      if (STATE.onlyDefaultWorkspaceMode) return STATE.workspaces['ws-default'];
      return STATE.workspaces[STATE.activeWorkspaceId] || STATE.workspaces['ws-default'];
    }

    function findSessionById(id, nodes = STATE.sessionTree) {
      for (const n of nodes) {
        if (n.id === id) return n;
        if (n.children) {
          const found = findSessionById(id, n.children);
          if (found) return found;
        }
      }
      return null;
    }

    function getActiveTab() {
      if (STATE.mode === 'sessions') {
        const sw = STATE.sessionWorkbench;
        return sw.openTabs.find(t => t.id === sw.activeTabId) || sw.openTabs[0];
      }
      const ws = getActiveWorkspace();
      return ws.openTabs.find(t => t.id === ws.activeTabId) || ws.openTabs[0];
    }

    function protoBadgeHtml(proto) {
      const map = {
        ssh: ['SSH', 'proto-ssh'],
        sftp: ['SFTP', 'proto-sftp'],
        db: ['DB', 'proto-db'],
        code: ['FILE', 'proto-code'],
        git: ['GIT', 'proto-git'],
        rdp: ['RDP', 'proto-rdp'],
        mail: ['MAIL', 'proto-mail']
      };
      const [label, cls] = map[proto] || ['TAB', 'proto-code'];
      return `<span class="proto-badge ${cls}">${label}</span>`;
    }

    function sessionMatchesFilter(node) {
      if (node.type === 'folder') {
        return (node.children || []).some(c => sessionMatchesFilter(c));
      }
      const f = STATE.sessionFilterProto;
      if (f === 'favorites' && !node.favorite) return false;
      if (f === 'ssh' && node.proto !== 'ssh') return false;
      if (f === 'sftp' && node.proto !== 'sftp') return false;
      if (f === 'db' && node.proto !== 'db') return false;
      if (f === 'rdp' && node.proto !== 'rdp') return false;
      if (f === 'other' && ['ssh', 'sftp', 'db', 'rdp'].includes(node.proto)) return false;
      if (STATE.sessionSearchQuery) {
        const q = STATE.sessionSearchQuery.toLowerCase();
        if (!node.name.toLowerCase().includes(q) && !(node.host || '').toLowerCase().includes(q)) return false;
      }
      return true;
    }

    function renderSessionDirectoryTree(nodes, depth) {
      return nodes.filter(sessionMatchesFilter).map(node => {
        const padLeft = 6 + depth * 13;
        if (node.type === 'folder') {
          const expanded = STATE.sessionTreeFoldersExpanded[node.id] !== false;
          return `
            <div>
              <div class="tree-row" style="padding-left:${padLeft}px;"
                   onclick="STATE.sessionTreeFoldersExpanded['${node.id}']=!${expanded};renderLeftNavigator();"
                   oncontextmenu="openSessionContextMenu(event, '${node.id}', true)">
                <div class="tree-row-left">
                  <span class="tree-chevron">${expanded ? '▾' : '▸'}</span>
                  <span style="color:var(--taomni-warning);">📁</span>
                  <span class="tree-label" style="font-weight:600;">${node.name}</span>
                </div>
                <span class="tree-meta">${node.count || ''}</span>
              </div>
              ${expanded && node.children ? renderSessionDirectoryTree(node.children, depth + 1) : ''}
            </div>
          `;
        }
        const selected = STATE.selectedSessionNodeId === node.id;
        return `
          <div class="tree-row ${selected ? 'selected' : ''}" style="padding-left:${padLeft}px;"
               onclick="openSessionInSessionsWorkbench('${node.id}')"
               oncontextmenu="openSessionContextMenu(event, '${node.id}', false)">

              <span class="tree-chevron">${node.favorite ? '★' : ''}</span>

    function activateTab(tabId) {
      const ws = getActiveWorkspace();
      ws.activeTabId = tabId;
      renderAll();
    }

    function closeTab(tabId) {
      const ws = getActiveWorkspace();
      if (ws.openTabs.length <= 1) return;
      ws.openTabs = ws.openTabs.filter(t => t.id !== tabId);
      if (ws.activeTabId === tabId) ws.activeTabId = ws.openTabs[0].id;
      renderAll();
    }

    function openLinkedSessionInWorkspace(sessionId) {
      const s = findSessionById(sessionId);
      if (!s) return;
      const ws = getActiveWorkspace();
      const wsTabId = 'ws-inst-' + s.id;
      let tab = ws.openTabs.find(t => t.id === wsTabId);
      if (!tab) {
        tab = { id: wsTabId, title: `${s.name} (工作区实例)`, proto: s.proto, host: s.host, user: s.user, latency: '8ms', summary: `工作区独立会话实例: ${s.name}` };
        ws.openTabs.push(tab);
      }
      ws.activeTabId = wsTabId;
      renderAll();
    }

    function openSessionInSessionsWorkbench(sessionId) {
      STATE.selectedSessionNodeId = sessionId;
      const s = findSessionById(sessionId);
      if (!s || s.type === 'folder') return;
      const sw = STATE.sessionWorkbench;
      let tab = sw.openTabs.find(t => t.id === s.id);
      if (!tab) {
        tab = { id: s.id, title: s.name, proto: s.proto, group: s.group || '未分组', host: s.host, user: s.user, latency: '9ms', companionSftp: s.proto === 'ssh' };
        sw.openTabs.push(tab);
      }
      sw.activeTabId = tab.id;
      renderAll();
    }

      STATE.sessionWorkbench.activeTabId = tabId;
      STATE.selectedSessionNodeId = tabId;
      renderAll();

      if (sw.openTabs.length <= 1) return;

      if (sw.activeTabId === tabId) sw.activeTabId = sw.openTabs[0].id;
      renderAll();

    function renderWsSessionsLens(ws, toolbarEl, treeEl, footerEl) {
      const q = STATE.wsSessionQuery.toLowerCase();
      toolbarEl.innerHTML = `
        <button class="icon-btn" style="width:22px;height:22px;" title="新建会话配置" onclick="openNewSessionModal()">+</button>
        <button class="icon-btn" style="width:22px;height:22px;" title="在工作区打开本地终端" onclick="openWsLocalTerminal()">⌨️</button>

      const match = s => !q || s.name.toLowerCase().includes(q) || (s.host || '').toLowerCase().includes(q);
      const row = (s, pad) => {
        const linked = ws.linkedSessionIds.includes(s.id);
        const open = ws.openTabs.some(t => t.id === 'ws-inst-' + s.id);
        return `<div class="tree-row ${ws.activeTabId === 'ws-inst-' + s.id ? 'selected' : ''}" style="padding-left:${pad}px;" onclick="openLinkedSessionInWorkspace('${s.id}')" oncontextmenu="openWsSessionContextMenu(event,'${s.id}')">
          <div class="tree-row-left">${protoBadgeHtml(s.proto)}<span class="tree-label">${s.name}</span></div>
          <span class="tree-meta" style="${open ? 'color:var(--taomni-success);' : ''}">${open ? '● 已连' : s.host}</span>
          <div class="tree-hover-btns"><button class="icon-btn" style="width:18px;height:18px;" title="${linked ? '取消关联' : '关联到工作区'}" onclick="event.stopPropagation();toggleLinkSession('${s.id}')">${linked ? '★' : '☆'}</button></div>
        </div>`;
      };
      const tree = (nodes, d) => nodes.map(n => {
        if (n.type === 'session') return match(n) ? row(n, 6 + d * 13) : '';
        const inner = tree(n.children || [], d + 1);
        if (!inner) return '';
        return `<div><div class="tree-row" style="padding-left:${6 + d * 13}px;cursor:default;"><div class="tree-row-left"><span class="tree-chevron">▾</span><span style="color:var(--taomni-warning);">📁</span><span class="tree-label" style="font-weight:600;">${n.name}</span></div></div>${inner}</div>`;
      }).join('');
      const linked = ws.linkedSessionIds.map(id => findSessionById(id)).filter(Boolean).filter(match);
      treeEl.innerHTML = `
        <div style="padding:3px 6px;font-size:10.5px;font-weight:700;color:var(--taomni-text-muted);">★ 本工作区常用 (${linked.length})</div>
        ${linked.map(s => row(s, 10)).join('') || '<div class="muted" style="padding:2px 14px;font-size:11px;">暂无，悬停会话点 ☆ 即可关联</div>'}
        <div style="margin-top:8px;padding:6px 6px 3px;border-top:1px solid var(--taomni-chrome-border);font-size:10.5px;font-weight:700;color:var(--taomni-text-muted);">全部会话 (点击即在本工作区打开独立实例)</div>
        ${tree(STATE.sessionTree, 0)}`;
      footerEl.innerHTML = `<span>共 ${flatSessions().length} 个会话</span><span class="mono">右键: 关联 / 连接</span>`;
    }

        <div style="padding:4px 8px;font-size:10.5px;font-weight:700;color:var(--taomni-text-muted);">打开会话 (任意会话，不限关联)</div>
        ${fav.map(s => `<div class="ctx-item" onclick="openLinkedSessionInWorkspace('${s.id}')"><span>${s.proto.toUpperCase()} · ${s.name}</span></div>`).join('')}
        <div class="ctx-item" onclick="openSessionPicker()"><span>🔎 浏览 / 搜索全部会话...</span><span class="kbd-badge">Ctrl+Alt+O</span></div>
        <div class="ctx-item" onclick="openNewSessionModal()"><span>+ 新建会话配置...</span></div>`);
    }

    function openSessionPicker(q = '') {
      const list = flatSessions().filter(s => !q || s.name.toLowerCase().includes(q.toLowerCase()) || (s.host || '').includes(q));
      document.getElementById('modal-content').innerHTML = `
        <div style="padding:10px 12px;border-bottom:1px solid var(--taomni-chrome-border);display:flex;gap:8px;align-items:center;">
          <input id="sp-q" autofocus placeholder="搜索会话名称 / 主机 / 协议 (SSH / DB / SFTP / RDP / Mail)..." value="${q}" oninput="openSessionPicker(this.value)" style="flex:1;height:28px;padding:0 10px;border-radius:6px;background:var(--taomni-card-bg);border:1px solid var(--taomni-card-border);" />
          <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="max-height:360px;overflow-y:auto;padding:6px;">
          ${list.map(s => `<div class="ctx-item" style="height:30px;" onclick="closeModal();openLinkedSessionInWorkspace('${s.id}')"><span style="display:flex;gap:8px;align-items:center;">${protoBadgeHtml(s.proto)}<strong>${s.name}</strong><span class="muted mono" style="font-size:10.5px;">${s.host}</span></span><span class="muted" style="font-size:10.5px;">${(s.group || '').split('/').pop()}</span></div>`).join('') || '<div class="muted" style="padding:12px;">无匹配会话</div>'}
        </div>
        <div class="muted" style="padding:6px 12px;border-top:1px solid var(--taomni-chrome-border);font-size:11px;">点击即在当前工作区打开独立会话实例 · 在左侧 Sessions 面板可 ★ 关联为常用</div>`;
      document.getElementById('modal-backdrop').classList.add('open');
      setTimeout(() => { const i = document.getElementById('sp-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 0);
    }

    function findNodeById(id, nodes) {
      for (const n of nodes) { if (n.id === id) return n; if (n.children) { const f = findNodeById(id, n.children); if (f) return f; } }
      return null;
    }

    function openAddNodeModal(kind, parentId) {
      const ws = getActiveWorkspace();
      const parent = parentId ? findNodeById(parentId, ws.fileTree) : ws.fileTree[0];
      const titles = { file: '📄 新建文件', folder: '📁 新建目录', root: '📂 添加目录到工作区' };
      document.getElementById('modal-content').innerHTML = `
        <div style="padding:12px 14px;border-bottom:1px solid var(--taomni-chrome-border);display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:700;">${titles[kind]}</span><button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="padding:14px;display:flex;flex-direction:column;gap:10px;">
          ${kind !== 'root' ? `<div class="muted">位置: <span class="mono">${parent ? parent.name : ws.rootPath}</span></div>` : '<div class="muted">将已有本地目录作为额外根目录加入当前工作区 (多根工作区)；也可直接拖拽目录到左侧文件树。</div>'}
          <input id="node-name" placeholder="${kind === 'file' ? '文件名，如 utils.ts' : kind === 'folder' ? '目录名，如 components' : '本地目录路径，如 ~/code/infra-deploy'}" style="height:30px;padding:0 10px;border-radius:6px;background:var(--taomni-card-bg);border:1px solid var(--taomni-card-border);" onkeydown="if(event.key==='Enter')addFileNode('${kind}','${parent ? parent.id : ''}')" />
          <div style="display:flex;justify-content:flex-end;gap:8px;"><button class="pill-btn" onclick="closeModal()">取消</button><button class="pill-btn primary" onclick="addFileNode('${kind}','${parent ? parent.id : ''}')">${kind === 'root' ? '添加' : '创建'}</button></div>
        </div>`;
      document.getElementById('modal-backdrop').classList.add('open');
      setTimeout(() => document.getElementById('node-name').focus(), 0);
    }

    function addFileNode(kind, parentId) {
      const ws = getActiveWorkspace();
      const name = (document.getElementById('node-name').value || '').trim();
      if (!name) { showToast('请输入名称'); return; }
      const id = 'n-' + (++STATE.nodeSeq);
      if (kind === 'root') {
        ws.fileTree.push({ id, name, type: 'folder', children: [] });
        ws.foldersExpanded[id] = true;
      } else {
        const parent = findNodeById(parentId, ws.fileTree) || ws.fileTree[0];
        parent.children = parent.children || [];
        ws.foldersExpanded[parent.id] = true;
        if (kind === 'folder') {
          parent.children.push({ id, name, type: 'folder', children: [] });
          ws.foldersExpanded[id] = true;
        } else {
          const tabId = 'tab-' + id;
          parent.children.push({ id, name, type: 'file', tabId, git: 'A' });
          ws.openTabs.push({ id: tabId, title: name, proto: 'code', dirty: true, path: parent.name + '/' + name, summary: '// ' + name });
          ws.activeTabId = tabId;
        }
      }
      STATE.wsLens = 'project';
      closeModal(); renderAll();
      showToast(kind === 'root' ? '已添加目录到工作区' : '已创建 ' + name);
    }

    function collapseWsFolders() {
      const ws = getActiveWorkspace();
      Object.keys(ws.foldersExpanded).forEach(k => ws.foldersExpanded[k] = false);
      renderLeftNavigator();
    }

    function openScreenshotMenu(e) {
      e.stopPropagation();
      const r = e.currentTarget.getBoundingClientRect();
      showContextMenuAt(r.right + 4, r.top - 40, `
        <div class="ctx-item" onclick="showToast('📷 区域截图已启动')"><span>▭ 区域截图</span><span class="kbd-badge">Ctrl+Alt+A</span></div>
        <div class="ctx-item" onclick="showToast('📷 窗口截图')"><span>🪟 窗口截图</span></div>
        <div class="ctx-item" onclick="showToast('📷 全屏截图')"><span>🖥️ 全屏截图</span></div>
        <div class="ctx-item" onclick="showToast('⏱ 3 秒后截图')"><span>⏱ 延时截图 (3s / 5s)</span></div>
        <div class="ctx-item" onclick="showToast('已打开 Pin Board')"><span>📌 贴图板</span></div>`);
    }

    function openLanguageMenu(e) {
      e.stopPropagation();
      const r = e.currentTarget.getBoundingClientRect();
      showContextMenuAt(r.right + 4, r.top - 30, `
        <div class="ctx-item" onclick="STATE.lang='zh';showToast('界面语言: 简体中文')"><span>${STATE.lang === 'zh' ? '✓ ' : ''}简体中文</span></div>
        <div class="ctx-item" onclick="STATE.lang='en';showToast('UI language: English')"><span>${STATE.lang === 'en' ? '✓ ' : ''}English</span></div>`);
    }

    function openMfaFloat() {
      const el = document.getElementById('mfa-float');
      if (el.classList.contains('open')) { el.classList.remove('open'); return; }
      el.classList.add('open');
      renderMfaFloat();
      if (!window.__mfaTimer) window.__mfaTimer = setInterval(() => { if (el.classList.contains('open')) renderMfaFloat(); }, 1000);
    }

    function renderMfaFloat() {
      const el = document.getElementById('mfa-float');
      const sec = 30 - (Math.floor(Date.now() / 1000) % 30);
      const code = n => String((Math.floor(Date.now() / 30000) * 7919 + n * 104729) % 1000000).padStart(6, '0');
      const accts = [['GitHub', 'zhyhang'], ['prod-gateway-01', 'ubuntu'], ['AWS Console', 'ops@taomni']];
      el.innerHTML = `
        <div class="mfa-head"><span>🔐 MFA 验证器</span><button class="icon-btn" style="width:20px;height:20px;" onclick="openMfaFloat()">✕</button></div>
        <div style="padding:8px;display:flex;flex-direction:column;gap:6px;">
          ${accts.map((a, i) => `<div style="padding:7px 9px;border-radius:7px;background:var(--taomni-card-bg);border:1px solid var(--taomni-card-border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="showToast('已复制验证码 ${code(i + 1)}')">
            <div><div style="font-weight:600;font-size:11.5px;">${a[0]}</div><div class="muted" style="font-size:10.5px;">${a[1]}</div></div>
            <div style="text-align:right;"><div class="mono" style="font-size:16px;font-weight:700;letter-spacing:1px;color:var(--taomni-accent);">${code(i + 1).slice(0, 3)} ${code(i + 1).slice(3)}</div><div class="muted mono" style="font-size:10px;">${sec}s</div></div></div>`).join('')}
          <div class="muted" style="font-size:10.5px;">点击卡片复制 · 窗口可拖动，不占用主界面</div>
        </div>`;
      const head = el.querySelector('.mfa-head'); let d = null;
      head.onmousedown = ev => { d = { x: ev.clientX - el.offsetLeft, y: ev.clientY - el.offsetTop }; window.__mfaDrag = d; };
    }
    window.addEventListener('mousemove', ev => { const el = document.getElementById('mfa-float'); const d = window.__mfaDrag; if (d) { el.style.left = (ev.clientX - d.x) + 'px'; el.style.top = (ev.clientY - d.y) + 'px'; el.style.right = 'auto'; el.style.bottom = 'auto'; } });
    window.addEventListener('mouseup', () => { window.__mfaDrag = null; });

    // Draggable Left & Right Sidebar Resizers
    (function initResizers() {
      const leftResizer = document.getElementById('left-resizer');
      const rightResizer = document.getElementById('right-resizer');
      let dragging = null;

      leftResizer.addEventListener('mousedown', () => { dragging = 'left'; leftResizer.classList.add('dragging'); });
      leftResizer.addEventListener('dblclick', () => { STATE.leftNavWidth = 260; renderAll(); });

      rightResizer.addEventListener('mousedown', () => { dragging = 'right'; rightResizer.classList.add('dragging'); });
      rightResizer.addEventListener('dblclick', () => { STATE.rightDockWidth = 300; renderAll(); });

      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        if (dragging === 'left') {
          STATE.leftNavWidth = Math.max(185, Math.min(500, e.clientX - 42));
          renderAll();
        } else if (dragging === 'right') {
          STATE.rightDockWidth = Math.max(220, Math.min(480, window.innerWidth - e.clientX - 6));
          renderAll();
        }
      });

      window.addEventListener('mouseup', () => {
        if (dragging) {
          leftResizer.classList.remove('dragging');
          rightResizer.classList.remove('dragging');
          dragging = null;
        }
      });

      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCommandPalette(); }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'e') { e.preventDefault(); toggleTabOverview(); }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'g') { e.preventDefault(); openWorkspaceGitSurface(); }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'h') {
          e.preventDefault();
          STATE.sessionWorkbench.detailsHoverActive = !STATE.sessionWorkbench.detailsHoverActive;
          renderCenterCanvas();
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleLeftNav(); }
        if (e.key === 'Escape') { closeModal(); document.getElementById('tab-overview').classList.remove('open'); }
      });
    })();

    renderAll();
  </script>
</body>
</html>

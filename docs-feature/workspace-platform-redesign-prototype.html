<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taomni — Workspace Tree, Session Tree, Code/Git Parity & One-System Agent Prototype v2</title>
  <style>
    /* ============================================================================
       1. TAOMNI THEME TOKENS (Aligned with src/styles/theme.css)
       ============================================================================ */
    :root {
      --taomni-bg: #f8fafc;
      --taomni-panel-bg: #f1f5f9;
      --taomni-chrome-bg: #e8eef5;
      --taomni-chrome-border: #cbd5e1;
      --taomni-card-bg: #ffffff;
      --taomni-card-border: #e2e8f0;
      --taomni-accent: #1e40af;
      --taomni-accent-soft: #3b82f6;
      --taomni-selected: #dbeafe;
      --taomni-selected-border: #93c5fd;
      --taomni-hover: rgba(15, 23, 42, 0.06);
      --taomni-hover-strong: rgba(15, 23, 42, 0.11);
      --taomni-text: #0f172a;
      --taomni-text-muted: #64748b;
      --taomni-text-subtle: #94a3b8;
      --taomni-border: #cbd5e1;
      --taomni-term-bg: #0f172a;
      --taomni-term-fg: #e2e8f0;
      --taomni-code-bg: #ffffff;
      --taomni-code-gutter: #f8fafc;
      --taomni-code-active-line: #eff6ff;
      --taomni-tao-ribbon-bg: #dff7f3;
      --taomni-tao-ribbon-text: #0f5f63;
      --taomni-success: #10b981;
      --taomni-warning: #f59e0b;
      --taomni-danger: #ef4444;
      --taomni-purple: #7c3aed;
      --taomni-shadow-lg: 0 16px 40px -8px rgba(15, 23, 42, 0.22), 0 4px 12px -2px rgba(15, 23, 42, 0.1);
      --taomni-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    html.dark {
      --taomni-bg: #1e1f22;
      --taomni-panel-bg: #23252a;
      --taomni-chrome-bg: #16171a;
      --taomni-chrome-border: #2e3138;
      --taomni-card-bg: #26282e;
      --taomni-card-border: #35383f;
      --taomni-accent: #6aa6f8;
      --taomni-accent-soft: #8bbcff;
      --taomni-selected: #25354d;
      --taomni-selected-border: #4d7ec4;
      --taomni-hover: rgba(255, 255, 255, 0.06);
      --taomni-hover-strong: rgba(255, 255, 255, 0.12);
      --taomni-text: #e6eaf0;
      --taomni-text-muted: #9ca3ad;
      --taomni-text-subtle: #6e7582;
      --taomni-border: #303238;
      --taomni-term-bg: #141518;
      --taomni-term-fg: #e5e9f0;
      --taomni-code-bg: #1e1f22;
      --taomni-code-gutter: #212328;
      --taomni-code-active-line: #262930;
      --taomni-tao-ribbon-bg: #1f3338;
      --taomni-tao-ribbon-text: #c8f0ea;
      --taomni-success: #34d399;
      --taomni-warning: #fbbf24;
      --taomni-danger: #f87171;
      --taomni-purple: #a78bfa;
      --taomni-shadow-lg: 0 20px 48px -10px rgba(0, 0, 0, 0.7), 0 4px 16px -2px rgba(0, 0, 0, 0.5);
      --taomni-shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: var(--font-sans);
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--taomni-text);
      background: var(--taomni-chrome-bg);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
      outline: none;
    }
    button { cursor: pointer; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }

    /* ============================================================================
       2. THREE-TRACK TOP TITLEBAR
       ============================================================================ */
    .titlebar {
      height: 36px;
      min-height: 36px;
      background: var(--taomni-chrome-bg);
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(260px, 440px) minmax(280px, 1fr);
      align-items: center;
      padding: 0 8px;
      gap: 8px;
      border-bottom: 1px solid var(--taomni-chrome-border);
      z-index: 40;
    }
    .titlebar-left, .titlebar-right { display: flex; align-items: center; gap: 4px; }
    .titlebar-right { justify-content: flex-end; }
    .titlebar-center { display: flex; align-items: center; justify-content: center; }

    .icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--taomni-text-muted);
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .icon-btn:hover:not(:disabled) { background: var(--taomni-hover); color: var(--taomni-text); }
    .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .icon-btn.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      border: 1px solid var(--taomni-selected-border);
    }
    .icon-btn svg { width: 14px; height: 14px; stroke-width: 1.9; }

    .home-pill {
      height: 26px;
      padding: 0 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      font-size: 12px;
      color: var(--taomni-text-muted);
      border: 1px solid transparent;
    }
    .home-pill:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .home-pill.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      border-color: var(--taomni-selected-border);
    }

    .ws-switcher-pill {
      height: 26px;
      padding: 0 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      font-size: 12px;
      font-weight: 600;
      color: var(--taomni-text);
    }
    .ws-switcher-pill:hover { border-color: var(--taomni-selected-border); }
    .ws-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--taomni-accent); }
    .ws-env-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--taomni-hover-strong);
      color: var(--taomni-text-muted);
      font-family: var(--font-mono);
    }

    .command-bar-trigger {
      width: 100%;
      max-width: 410px;
      height: 26px;
      border-radius: 6px;
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px;
      color: var(--taomni-text-muted);
      font-size: 12px;
    }
    .command-bar-trigger:hover { border-color: var(--taomni-selected-border); color: var(--taomni-text); }
    .kbd-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--taomni-chrome-bg);
      border: 1px solid var(--taomni-chrome-border);
      color: var(--taomni-text-muted);
    }

    .status-capsule {
      height: 25px;
      padding: 0 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 500;
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      color: var(--taomni-text);
    }
    .status-capsule:hover { border-color: var(--taomni-selected-border); }
    .status-capsule.agent-active {
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.08);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--taomni-success);
      animation: pulseGlow 1.8s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.25); }
    }
    .badge-count {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 0 5px;
      height: 16px;
      line-height: 16px;
      border-radius: 99px;
      background: var(--taomni-selected);
      color: var(--taomni-accent);
    }

    /* ============================================================================
       3. WORKBENCH SHELL + DRAGGABLE RESIZE HANDLES (Left Sidebar, Right Dock, Bottom Dock)
       ============================================================================ */
    .workbench {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 0 6px 6px 0;
      background: var(--taomni-chrome-bg);
      position: relative;
    }

    .primary-rail {
      width: 44px;
      min-width: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0 4px 0;
      background: var(--taomni-chrome-bg);
      z-index: 20;
    }
    .rail-group { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
    .rail-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--taomni-text-muted);
      position: relative;
    }
    .rail-btn:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .rail-btn.active { background: var(--taomni-selected); color: var(--taomni-accent); }
    .rail-btn.active::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--taomni-accent);
    }
    .rail-btn svg { width: 17px; height: 17px; stroke-width: 1.85; }
    .rail-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 99px;
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--taomni-accent);
      color: #fff;
    }
    html.dark .rail-badge { color: #0f172a; }

    /* Resizable Left Navigator Panel */
    .navigator-panel {
      width: 288px;
      min-width: 200px;
      max-width: 540px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .navigator-panel.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* ZCode-style Vertical Resize Handle (Left & Right panels) */
    .resize-handle-x {
      width: 7px;
      flex-shrink: 0;
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 25;
    }
    .resize-handle-x::after {
      content: "";
      width: 2px;
      height: 36px;
      border-radius: 2px;
      background: var(--taomni-chrome-border);
      transition: background 0.12s, height 0.12s;
    }
    .resize-handle-x:hover::after,
    .resize-handle-x.dragging::after {
      height: 100%;
      background: var(--taomni-accent);
    }
    .resize-handle-x.hidden { display: none; }

    /* Horizontal Resize Handle (Bottom Tool Window Dock) */
    .resize-handle-y {
      height: 6px;
      flex-shrink: 0;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--taomni-panel-bg);
      border-top: 1px solid var(--taomni-chrome-border);
    }
    .resize-handle-y::after {
      content: "";
      width: 42px;
      height: 2px;
      border-radius: 2px;
      background: var(--taomni-chrome-border);
      transition: background 0.12s, width 0.12s;
    }
    .resize-handle-y:hover::after,
    .resize-handle-y.dragging::after {
      width: 100%;
      background: var(--taomni-accent);
    }

    /* ============================================================================
       4. LEFT NAVIGATOR: TOOLBAR, FILTER PILLS & HIERARCHICAL TREE NODES
       ============================================================================ */
    .nav-header {
      height: 32px;
      min-height: 32px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--taomni-chrome-border);
      font-size: 11px;
      font-weight: 700;
      color: var(--taomni-text-muted);
      letter-spacing: 0.02em;
    }

    /* Preserved SessionTree / WorkspaceTree Action Toolbar (matches Sidebar.tsx lines 191-213) */
    .nav-action-toolbar {
      height: 30px;
      min-height: 30px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      gap: 2px;
      border-bottom: 1px solid var(--taomni-chrome-border);
      background: var(--taomni-card-bg);
    }
    .toolbar-v-divider {
      width: 1px;
      height: 15px;
      background: var(--taomni-chrome-border);
      margin: 0 3px;
      flex-shrink: 0;
    }
    .nav-inline-search {
      flex: 1;
      min-width: 70px;
      height: 22px;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-card-border);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-inline-search input {
      width: 100%;
      font-size: 11.5px;
      color: var(--taomni-text);
    }

    .nav-filter-pills {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 5px 6px;
      border-bottom: 1px solid var(--taomni-chrome-border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .filter-chip {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 5px;
      color: var(--taomni-text-muted);
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .filter-chip:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .filter-chip.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      border-color: var(--taomni-selected-border);
      font-weight: 600;
    }

    .nav-tree-container {
      flex: 1;
      overflow-y: auto;
      padding: 4px 5px 12px 5px;
    }

    /* Multi-level Tree Rows with Indent Guides */
    .tree-row {
      height: 26px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-right: 6px;
      cursor: pointer;
      color: var(--taomni-text);
      font-size: 12px;
      position: relative;
      margin-top: 1px;
    }
    .tree-row:hover { background: var(--taomni-hover); }
    .tree-row.selected {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      font-weight: 500;
    }
    .tree-row-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }
    .tree-chevron {
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--taomni-text-muted);
      font-size: 10px;
      flex-shrink: 0;
    }
    .tree-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tree-row-right {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .tree-hover-btns { display: none; align-items: center; gap: 2px; }
    .tree-row:hover .tree-hover-btns { display: inline-flex; }
    .tree-row:hover .tree-badge-meta { display: none; }
    .tree-badge-meta {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--taomni-hover);
      color: var(--taomni-text-muted);
    }

    .proto-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .proto-ssh { background: rgba(16, 185, 129, 0.16); color: var(--taomni-success); }
    .proto-sftp { background: rgba(59, 130, 246, 0.16); color: var(--taomni-accent-soft); }
    .proto-db { background: rgba(245, 158, 11, 0.16); color: var(--taomni-warning); }
    .proto-code { background: rgba(139, 92, 246, 0.18); color: var(--taomni-purple); }
    .proto-git { background: rgba(249, 115, 22, 0.18); color: #fb923c; }
    .proto-rdp { background: rgba(236, 72, 153, 0.16); color: #f472b6; }
    .proto-agent { background: rgba(20, 184, 166, 0.18); color: #2dd4bf; }
    .proto-mail { background: rgba(99, 102, 241, 0.18); color: #818cf8; }

    /* ============================================================================
       5. CENTER STAGE: FUSED TABS, CODE WORKSPACE SHELL, GIT MANAGER & SPLIT GRID
       ============================================================================ */
    .center-stage {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .main-canvas-frame {
      flex: 1;
      min-height: 0;
      background: var(--taomni-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--taomni-shadow-sm);
    }
    .workspace-tab-header {
      height: 35px;
      min-height: 35px;
      background: var(--taomni-panel-bg);
      border-bottom: 1px solid var(--taomni-chrome-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      gap: 6px;
    }
    .tab-lens-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-right: 6px;
      border-right: 1px solid var(--taomni-chrome-border);
      flex-shrink: 0;
    }
    .tab-lens-btn {
      height: 23px;
      padding: 0 6px;
      border-radius: 5px;
      font-size: 11px;
      color: var(--taomni-text-muted);
    }
    .tab-lens-btn:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .tab-lens-btn.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      font-weight: 600;
    }
    .tabs-scroll-strip {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: flex-end;
      height: 100%;
      gap: 2px;
      overflow-x: auto;
      padding-top: 4px;
    }
    .tabs-scroll-strip::-webkit-scrollbar { height: 0; }
    .ws-tab {
      height: 30px;
      max-width: 195px;
      min-width: 110px;
      padding: 0 9px;
      border-radius: 7px 7px 0 0;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      font-size: 12px;
      color: var(--taomni-text-muted);
      border: 1px solid transparent;
      border-bottom: none;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .ws-tab:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .ws-tab.active {
      background: var(--taomni-bg);
      color: var(--taomni-text);
      font-weight: 600;
      border-color: var(--taomni-chrome-border);
      margin-bottom: -1px;
      padding-bottom: 1px;
    }
    .ws-tab.active::after {
      content: "";
      position: absolute;
      top: 0;
      left: 8px;
      right: 8px;
      height: 2px;
      border-radius: 2px;
      background: var(--taomni-accent);
    }

    .split-preset-group {
      display: inline-flex;
      align-items: center;
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      border-radius: 6px;
      padding: 1px;
      gap: 1px;
    }
    .split-btn {
      height: 22px;
      padding: 0 6px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--taomni-text-muted);
    }
    .split-btn:hover { color: var(--taomni-text); background: var(--taomni-hover); }
    .split-btn.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      font-weight: 600;
    }

    .surface-viewport {
      flex: 1;
      min-height: 0;
      display: grid;
      gap: 1px;
      background: var(--taomni-chrome-border);
      overflow: hidden;
    }
    .surface-viewport.layout-single { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .surface-viewport.layout-split-right { grid-template-columns: 1.2fr 0.8fr; grid-template-rows: 1fr; }
    .surface-viewport.layout-ide-triple { grid-template-columns: 1.2fr 0.8fr; grid-template-rows: 1.25fr 0.75fr; }
    .surface-viewport.layout-grid-2x2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .pane-cell {
      background: var(--taomni-bg);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    /* Code Workspace Inner Toolbar & Bottom Dock (100% Parity with WorkspaceToolbar.tsx & BottomDock.tsx) */
    .code-ws-toolbar {
      height: 34px;
      min-height: 34px;
      padding: 0 10px;
      background: var(--taomni-code-gutter);
      border-bottom: 1px solid var(--taomni-chrome-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
    }
    .code-editor-subtabs {
      height: 29px;
      min-height: 29px;
      background: var(--taomni-panel-bg);
      border-bottom: 1px solid var(--taomni-chrome-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
    }
    .code-file-tab {
      height: 25px;
      padding: 0 9px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--taomni-text-muted);
    }
    .code-file-tab.active {
      background: var(--taomni-bg);
      color: var(--taomni-text);
      font-weight: 600;
      border: 1px solid var(--taomni-chrome-border);
    }
    .code-bottom-dock {
      height: 210px;
      min-height: 90px;
      max-height: 460px;
      background: var(--taomni-panel-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .code-dock-stripe {
      height: 29px;
      min-height: 29px;
      padding: 0 6px;
      border-bottom: 1px solid var(--taomni-chrome-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      overflow-x: auto;
    }
    .dock-tool-btn {
      height: 22px;
      padding: 0 7px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--taomni-text-muted);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .dock-tool-btn:hover { background: var(--taomni-hover); color: var(--taomni-text); }
    .dock-tool-btn.active {
      background: var(--taomni-selected);
      color: var(--taomni-accent);
      font-weight: 600;
    }

    /* Resizable Right Context Dock */
    .right-context-dock {
      width: 340px;
      min-width: 240px;
      max-width: 560px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }
    .right-context-dock.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-width: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================================================
       6. CONTEXT MENU, TAB OVERVIEW & MODALS
       ============================================================================ */
    .context-menu-popup {
      position: fixed;
      z-index: 200;
      min-width: 230px;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 8px;
      padding: 4px;
      box-shadow: var(--taomni-shadow-lg);
      display: none;
      flex-direction: column;
      gap: 1px;
    }
    .context-menu-popup.open { display: flex; }
    .ctx-item {
      height: 26px;
      padding: 0 9px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--taomni-text);
      cursor: pointer;
    }
    .ctx-item:hover { background: var(--taomni-selected); color: var(--taomni-accent); }
    .ctx-item.danger { color: var(--taomni-danger); }
    .ctx-sep { height: 1px; background: var(--taomni-chrome-border); margin: 3px 4px; }

    .tab-overview-backdrop {
      position: fixed;
      inset: 36px 0 24px 0;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(10px);
      z-index: 80;
      display: none;
      flex-direction: column;
      padding: 18px 24px;
      overflow-y: auto;
    }
    .tab-overview-backdrop.open { display: flex; }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .preview-card {
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.12s;
    }
    .preview-card:hover { transform: translateY(-2px); border-color: var(--taomni-accent); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      z-index: 120;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 64px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      width: 640px;
      max-width: 92vw;
      background: var(--taomni-panel-bg);
      border: 1px solid var(--taomni-chrome-border);
      border-radius: 12px;
      box-shadow: var(--taomni-shadow-lg);
      overflow: hidden;
    }

    .statusbar {
      height: 24px;
      min-height: 24px;
      background: var(--taomni-chrome-bg);
      border-top: 1px solid var(--taomni-chrome-border);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--taomni-text-muted);
    }

    .mono { font-family: var(--font-mono); }
    .muted { color: var(--taomni-text-muted); }
    .pill-btn {
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--taomni-card-bg);
      border: 1px solid var(--taomni-card-border);
      color: var(--taomni-text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pill-btn:hover { border-color: var(--taomni-selected-border); background: var(--taomni-hover); }
    .pill-btn.primary { background: var(--taomni-accent); border-color: var(--taomni-accent); color: #fff; }
    html.dark .pill-btn.primary { color: #0f172a; }
  </style>
</head>

    // ==========================================================================
    // 6. DRAGGABLE RESIZE HANDLES (Left Sidebar, Right Dock & Code Bottom Dock)
    // ==========================================================================
    function initResizeHandles() {
      const leftHandle = document.getElementById("left-resize-handle");
      leftHandle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        leftHandle.classList.add("dragging");
        const startX = e.clientX;
        const startW = STATE.leftWidth;
        const onMove = (ev) => {
          STATE.leftWidth = Math.max(200, Math.min(540, Math.round(startW + (ev.clientX - startX))));
          document.getElementById("navigator-panel").style.width = STATE.leftWidth + "px";
          document.getElementById("nav-width-readout").textContent = STATE.leftWidth + "px";
          document.getElementById("status-left-width").textContent = STATE.leftWidth + "px";
        };
        const onUp = () => {
          leftHandle.classList.remove("dragging");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      });
      leftHandle.addEventListener("dblclick", () => {
        STATE.leftWidth = 288;
        renderNavigator();
        showToast("左边栏宽度已重置为默认 288px");
      });

      const rightHandle = document.getElementById("right-resize-handle");
      rightHandle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        rightHandle.classList.add("dragging");
        const startX = e.clientX;
        const startW = STATE.rightWidth;
        const onMove = (ev) => {
          STATE.rightWidth = Math.max(240, Math.min(560, Math.round(startW - (ev.clientX - startX))));
          document.getElementById("right-context-dock").style.width = STATE.rightWidth + "px";
        };
        const onUp = () => {
          rightHandle.classList.remove("dragging");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      });
      rightHandle.addEventListener("dblclick", () => {
        STATE.rightWidth = 340;
        renderRightDock();
        showToast("右侧伴随坞宽度已重置为 340px");
      });
    }

    function initBottomDockResize() {
      const h = document.getElementById("code-bottom-resize-handle");
      if (!h) return;
      h.onpointerdown = (e) => {
        e.preventDefault();
        h.classList.add("dragging");
        const startY = e.clientY;
        const startH = STATE.codeBottomDockHeight;
        const onMove = (ev) => {
          STATE.codeBottomDockHeight = Math.max(95, Math.min(440, Math.round(startH - (ev.clientY - startY))));
          const dock = document.getElementById("code-bottom-dock");
          if (dock) dock.style.height = STATE.codeBottomDockHeight + "px";
        };
        const onUp = () => {
          h.classList.remove("dragging");
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
        };
        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      };
    }

                <span class="mono muted" style="font-size:11px;">${s.groupPath} · ${s.host}</span>
              </div>
            `).join("")}
          </div>
        `;
      } else {
        card.innerHTML = `
          <div style="padding:12px 16px;border-bottom:1px solid var(--taomni-chrome-border);display:flex;justify-content:space-between;align-items:center;">
            <strong>⚡ 全局命令与搜索中心 (Ctrl+K)</strong>
            <button class="pill-btn" onclick="closeModal()">关闭</button>
          </div>
          <div style="padding:12px 16px;">
            <div class="tree-row" onclick="closeModal();toggleZeroCustomWorkspacesMode();"><span>🏠 切换验证『仅默认工作区 (Default Workspace)』兜底模式</span></div>
            <div class="tree-row" onclick="closeModal();activateOrOpenTab('tab-code-main');"><span>💻 打开工作区 Code IDE (含 13 个底部工具窗)</span></div>
            <div class="tree-row" onclick="closeModal();activateOrOpenTab('tab-git-main');"><span>🌿 打开工作区 Git 多仓管理器 (WorkspaceGitManager)</span></div>
          </div>
        `;
      }
      modal.classList.add("open");
    };

    window.closeModal = function() {
      document.getElementById("modal-backdrop").classList.remove("open");
    };

    // Global Listeners
    window.addEventListener("click", closeContextMenu);
    document.getElementById("btn-toggle-nav").onclick = () => { STATE.navCollapsed = !STATE.navCollapsed; renderAll(); };
    document.getElementById("btn-home-welcome").onclick = () => { STATE.showingWelcome = !STATE.showingWelcome; renderAll(); };
    document.getElementById("btn-ws-switcher").onclick = () => {
      const list = getVisibleWorkspaces();
      const idx = list.findIndex(w => w.id === getActiveWorkspace().id);
      STATE.activeWorkspaceId = list[(idx + 1) % list.length].id;
      renderAll();
    };
    document.getElementById("btn-open-command").onclick = () => openModal("command");
    document.getElementById("btn-agent-fleet-top").onclick = () => { STATE.activeRail = "agents"; activateOrOpenTab("tab-agent-orchestrator"); };
    document.getElementById("btn-tab-overview-top").onclick = () => { STATE.tabOverviewOpen = !STATE.tabOverviewOpen; renderTabOverview(); };
    document.getElementById("btn-tab-overview-bar").onclick = () => { STATE.tabOverviewOpen = !STATE.tabOverviewOpen; renderTabOverview(); };
    document.getElementById("btn-close-overview").onclick = () => { STATE.tabOverviewOpen = false; renderTabOverview(); };
    document.getElementById("btn-quick-screenshot").onclick = () => openGlobalToolModal("Screenshot");
    document.getElementById("btn-quick-mfa").onclick = () => openGlobalToolModal("MFA Authenticator");
    document.getElementById("btn-toggle-right-dock").onclick = () => { STATE.rightDockCollapsed = !STATE.rightDockCollapsed; renderAll(); };
    document.getElementById("btn-close-right-dock").onclick = () => { STATE.rightDockCollapsed = true; renderAll(); };
    document.getElementById("btn-theme-toggle").onclick = () => {
      STATE.theme = STATE.theme === "dark" ? "light" : "dark";
      document.documentElement.classList.toggle("dark", STATE.theme === "dark");
    };
    document.querySelectorAll(".rail-btn[data-rail]").forEach(btn => {
      btn.onclick = () => {
        if (STATE.activeRail === btn.dataset.rail && !STATE.navCollapsed) STATE.navCollapsed = true;
        else { STATE.activeRail = btn.dataset.rail; STATE.navCollapsed = false; }
        renderAll();
      };
    });
    document.querySelectorAll(".tab-lens-btn[data-lens]").forEach(btn => {
      btn.onclick = () => { STATE.activeTabLens = btn.dataset.lens; renderTopAndTabs(); };
    });
    document.querySelectorAll(".split-btn[data-layout]").forEach(btn => {
      btn.onclick = () => setSplitLayout(btn.dataset.layout);
    });
    document.querySelectorAll("[data-dock]").forEach(btn => {
      btn.onclick = () => openRightDockTab(btn.dataset.dock);
    });

    initResizeHandles();
    renderAll();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taomni File Explorer — 高保真原型 v1</title>
<style>
:root{
  --bg:#f8fafc;--panel:#f1f5f9;--chrome:#e8eef5;--chrome-b:#cbd5e1;--card:#fff;--card-b:#e2e8f0;
  --accent:#1e40af;--accent-s:#3b82f6;--sel:#dbeafe;--sel-b:#93c5fd;--hover:rgba(15,23,42,.06);--hover2:rgba(15,23,42,.11);
  --text:#0f172a;--muted:#64748b;--subtle:#94a3b8;--divider:#e2e8f0;--term:#0f172a;--term-fg:#e2e8f0;
  --ok:#10b981;--warn:#f59e0b;--danger:#ef4444;--folder:#f5b83d;--input:#fff;--input-b:#cbd5e1;
  --shadow:0 16px 40px -8px rgba(15,23,42,.25),0 4px 12px -2px rgba(15,23,42,.1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html.dark{
  --bg:#1e1f22;--panel:#23252a;--chrome:#16171a;--chrome-b:#2e3138;--card:#26282e;--card-b:#35383f;
  --accent:#6aa6f8;--accent-s:#8bbcff;--sel:#25354d;--sel-b:#4d7ec4;--hover:rgba(255,255,255,.06);--hover2:rgba(255,255,255,.12);
  --text:#e6eaf0;--muted:#9ca3ad;--subtle:#6e7582;--divider:#2e3138;--term:#141518;--term-fg:#e5e9f0;
  --ok:#34d399;--warn:#fbbf24;--danger:#f87171;--folder:#e8b04a;--input:#1b1c20;--input-b:#3a3e46;
  --shadow:0 20px 48px -10px rgba(0,0,0,.7),0 4px 16px -2px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-size:12.5px;line-height:1.4;color:var(--text);background:#0b1020;height:100vh;overflow:hidden;display:flex;flex-direction:column;user-select:none}
button,input,select{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;white-space:nowrap}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--chrome-b);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ---------- prototype controller bar (not part of the product) ---------- */
#proto{background:#0b1020;color:#cbd5e1;padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border-bottom:1px solid #1e293b;font-size:12px}
#proto b{color:#fff;font-weight:600}
#proto .grp{display:flex;align-items:center;gap:4px}
#proto .lbl{color:#64748b;margin-right:2px}
#proto button{padding:3px 9px;border-radius:5px;border:1px solid #334155;color:#cbd5e1}
#proto button.on{background:#2563eb;border-color:#2563eb;color:#fff}
#proto button:hover:not(.on){background:#1e293b}
#hint{background:#111a33;color:#93c5fd;padding:6px 14px;font-size:12px;border-bottom:1px solid #1e293b;min-height:28px}
#stage{flex:1;min-height:0;padding:12px;display:flex;justify-content:center}
#app{width:100%;max-width:1480px;height:100%;border-radius:10px;overflow:hidden;background:var(--chrome);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #1e293b;position:relative}

/* ---------- app shell ---------- */
#titlebar{height:30px;background:var(--chrome);border-bottom:1px solid var(--chrome-b);display:flex;align-items:center;padding:0 10px;gap:8px;color:var(--muted);font-size:11.5px;flex:none}
#titlebar .dots{display:flex;gap:6px}#titlebar .dots i{width:10px;height:10px;border-radius:50%;background:var(--chrome-b)}
#shell{flex:1;min-height:0;display:flex}
#rail{width:46px;background:var(--chrome);border-right:1px solid var(--chrome-b);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;flex:none}
.rbtn{width:36px;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.rbtn:hover{background:var(--hover)}.rbtn.on{background:var(--sel);color:var(--accent)}
.rbtn .new{position:absolute;top:2px;right:1px;width:7px;height:7px;border-radius:50%;background:var(--accent-s);border:1.5px solid var(--chrome)}
.rsep{width:24px;height:1px;background:var(--chrome-b);margin:5px 0}
#side{width:236px;background:var(--panel);border-right:1px solid var(--chrome-b);display:flex;flex-direction:column;flex:none;min-height:0}
#side .hd{height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--divider);flex:none}
#side .hd .sp{flex:1}
.ibtn{width:24px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ibtn:hover:not(:disabled){background:var(--hover);color:var(--text)}.ibtn.on{background:var(--sel);color:var(--accent)}.ibtn:disabled{opacity:.35;cursor:default}
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#tabs{height:34px;background:var(--chrome);display:flex;align-items:flex-end;padding:0 6px;gap:2px;border-bottom:1px solid var(--chrome-b);flex:none;overflow:hidden}
.tab{height:29px;max-width:210px;padding:0 8px 0 10px;border-radius:7px 7px 0 0;display:flex;align-items:center;gap:6px;color:var(--muted);background:transparent;position:relative;font-size:12px}
.tab:hover{background:var(--hover)}.tab.on{background:var(--bg);color:var(--text);box-shadow:inset 0 2px 0 var(--accent-s)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:.55}.tab .x:hover{background:var(--hover2);opacity:1}
.tab.explorer svg.k{color:var(--folder);fill:var(--folder);stroke:none}
.tab.fresh{animation:pop .5s ease}@keyframes pop{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
#content{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column}.pane.on{display:flex}
#status{height:22px;background:var(--chrome);border-top:1px solid var(--chrome-b);display:flex;align-items:center;padding:0 10px;gap:14px;color:var(--muted);font-size:11px;flex:none}

/* ---------- side panels ---------- */
.list{overflow:auto;flex:1;min-height:0;padding:4px}
.row{display:flex;align-items:center;gap:6px;height:24px;padding:0 6px;border-radius:5px;color:var(--text);cursor:default;white-space:nowrap}
.row:hover{background:var(--hover)}.row.on{background:var(--sel)}
.row .tw{width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.row .tw svg{width:11px;height:11px;transition:transform .12s}.row.open>.tw svg{transform:rotate(90deg)}
.row .lbl2{overflow:hidden;text-overflow:ellipsis}
.badge{font-size:9.5px;font-weight:700;padding:0 5px;border-radius:8px;background:var(--sel);color:var(--accent);margin-left:auto}
.gitbar{height:28px;border-top:1px solid var(--divider);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;color:var(--muted);background:var(--card);flex:none}
.seg{display:inline-flex;background:var(--hover);border-radius:6px;padding:2px;gap:2px}
.seg button{padding:2px 9px;border-radius:4px;font-size:11px;color:var(--muted)}.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.callout{margin:8px;padding:8px 10px;border:1px dashed var(--sel-b);border-radius:7px;background:var(--sel);color:var(--accent);font-size:11px;line-height:1.5}

/* ---------- terminal ---------- */
.term{background:var(--term);color:var(--term-fg);font-family:var(--mono);font-size:12.5px;flex:1;padding:12px 16px;overflow:auto;line-height:1.55;user-select:text}
.term .p{color:#34d399}.term .d{color:#60a5fa}.term .m{color:#94a3b8}
.term input{font-family:var(--mono);font-size:12.5px;color:var(--term-fg);width:60%}
.termbar{height:26px;background:var(--chrome);border-bottom:1px solid var(--chrome-b);display:flex;align-items:center;padding:0 10px;gap:10px;font-size:11px;color:var(--muted);flex:none}

/* ---------- code editor mock ---------- */
.code{font-family:var(--mono);font-size:12.5px;padding:10px 0;overflow:auto;flex:1;background:var(--bg);user-select:text}
.code div{display:flex;line-height:1.65}.code .ln{width:44px;text-align:right;padding-right:14px;color:var(--subtle);flex:none}

/* ================= EXPLORER ================= */
.ex{display:flex;flex-direction:column;flex:1;min-height:0;background:var(--bg);position:relative}
.ex-top{display:flex;align-items:center;gap:6px;padding:7px 10px 4px;flex:none}
.nbtn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.nbtn:hover:not(:disabled){background:var(--hover)}.nbtn:disabled{opacity:.3;cursor:default}
.addr{flex:1;min-width:0;height:30px;border:1px solid var(--input-b);background:var(--input);border-radius:7px;display:flex;align-items:center;padding:0 4px;overflow:hidden;cursor:text}
.addr:focus-within{border-color:var(--accent-s);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-s) 25%,transparent)}
.addr .crumbs{display:flex;align-items:center;min-width:0;overflow:hidden;flex:1;height:100%}
.crumb{padding:0 6px;height:22px;border-radius:4px;display:inline-flex;align-items:center;color:var(--text);flex:none}
.crumb:hover{background:var(--hover2)}
.crumb.last{font-weight:600}
.csep{color:var(--subtle);width:10px;display:flex;justify-content:center;flex:none}.csep svg{width:10px;height:10px}
.addr input{flex:1;height:100%;padding:0 8px;font-size:12.5px;display:none}
.addr.edit input{display:block}.addr.edit .crumbs{display:none}
.srch{width:210px;height:30px;border:1px solid var(--input-b);background:var(--input);border-radius:7px;display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted)}
.srch:focus-within{border-color:var(--accent-s)}.srch input{flex:1;min-width:0;color:var(--text)}
.ex-cmd{display:flex;align-items:center;gap:2px;padding:2px 10px 5px;border-bottom:1px solid var(--divider);flex:none}
.cbtn{height:28px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;color:var(--text);font-size:12px}
.cbtn:hover:not(:disabled){background:var(--hover)}.cbtn:disabled{opacity:.35;cursor:default}
.cbtn.on{background:var(--sel);color:var(--accent)}
.cbtn.icon{width:28px;padding:0;justify-content:center}
.cbtn .car{width:9px;height:9px;opacity:.6}
.cbtn.pri svg{color:var(--accent)}
.vsep{width:1px;height:18px;background:var(--divider);margin:0 5px}
.sp{flex:1}
.ex-body{flex:1;min-height:0;display:flex}
.ex-main{flex:1;min-width:0;min-height:0;display:flex}
.ex-main.bottom{flex-direction:column}
.nav{width:210px;border-right:1px solid var(--divider);overflow:auto;padding:4px;flex:none;background:var(--panel)}
.nav .sec{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;padding:8px 6px 3px;display:flex;align-items:center;gap:4px}
.split{width:4px;cursor:col-resize;flex:none;margin-left:-2px;z-index:2;position:relative}.split:hover{background:var(--accent-s);opacity:.5}
.files{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.fhead{display:flex;align-items:center;height:26px;border-bottom:1px solid var(--divider);color:var(--muted);font-size:11.5px;flex:none;padding-right:8px}
.fhead>div{padding:0 8px;height:100%;display:flex;align-items:center;gap:4px;border-right:1px solid transparent;cursor:default}
.fhead>div:hover{background:var(--hover);border-right-color:var(--divider)}
.fhead .on{color:var(--accent);font-weight:600}
.fbody{flex:1;overflow:auto;min-height:0;position:relative}
.frow{display:flex;align-items:center;height:28px;border-radius:5px;margin:0 4px;position:relative}
.frow:hover{background:var(--hover)}.frow.sel{background:var(--sel)}.frow.sel:hover{background:var(--sel)}
.frow.cut{opacity:.45}.frow.focus{outline:1px solid var(--sel-b);outline-offset:-1px}
.frow>div{padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
.c-mod{width:140px;flex:none;color:var(--muted)}.c-type{width:96px;flex:none;color:var(--muted)}.c-size{width:80px;flex:none;color:var(--muted);text-align:right}
.fhead .c-size{justify-content:flex-end}
.c-name input{background:var(--input);border:1px solid var(--accent-s);border-radius:4px;padding:1px 4px;width:100%;height:22px}
.fbody.icons{display:flex;flex-wrap:wrap;align-content:flex-start;padding:8px;gap:4px}
.tile{width:92px;padding:8px 4px 6px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;position:relative}
.tile:hover{background:var(--hover)}.tile.sel{background:var(--sel)}.tile.cut{opacity:.45}
.tile .nm{font-size:11.5px;line-height:1.25;max-height:30px;overflow:hidden;word-break:break-all}
.tile svg.fi{width:40px;height:40px}
svg.fi.sm{width:18px;height:18px;flex:none}
.fbody.compact .frow{height:24px}.fbody.compact .c-mod,.fbody.compact .c-type,.fbody.compact .c-size{display:none}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.drop-hint{position:absolute;inset:6px;border:2px dashed var(--accent-s);border-radius:8px;background:color-mix(in srgb,var(--accent-s) 8%,transparent);display:none;align-items:center;justify-content:center;color:var(--accent);font-weight:600;pointer-events:none}
.ex-status{height:24px;border-top:1px solid var(--divider);display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--muted);font-size:11.5px;flex:none;background:var(--panel)}

/* preview pane */
.pv{width:300px;border-left:1px solid var(--divider);display:flex;flex-direction:column;flex:none;background:var(--panel);min-width:0}
.ex-main.bottom .pv{width:auto;height:190px;border-left:0;border-top:1px solid var(--divider)}
.pv-hd{height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;border-bottom:1px solid var(--divider);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;flex:none}
.pv-body{flex:1;overflow:auto;padding:12px;min-height:0}
.ex-main.bottom .pv-body{display:flex;gap:14px}
.pv-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 12px;text-align:center}
.ex-main.bottom .pv-hero{flex-direction:row;padding:0;text-align:left;flex:none;width:260px}
.pv-hero svg.fi{width:54px;height:54px}
.pv-name{font-weight:600;font-size:13px;word-break:break-all}
.pv-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px;margin:6px 0 10px}
.pv-meta span:nth-child(odd){color:var(--muted)}
.pv-text{font-family:var(--mono);font-size:11px;line-height:1.55;background:var(--card);border:1px solid var(--card-b);border-radius:7px;padding:8px 0;overflow:auto;max-height:100%;user-select:text}
.pv-text div{display:flex;white-space:pre}.pv-text .ln{width:30px;text-align:right;padding-right:8px;color:var(--subtle);flex:none}
.pv-text.wrap div{white-space:pre-wrap}
.tk-k{color:#c026d3}.tk-s{color:#16a34a}.tk-c{color:var(--subtle);font-style:italic}.tk-n{color:#d97706}
html.dark .tk-k{color:#d19cf0}html.dark .tk-s{color:#8fd694}
.pv-img{border-radius:7px;border:1px solid var(--card-b);overflow:hidden;background:repeating-conic-gradient(var(--divider) 0 25%,transparent 0 50%) 50%/14px 14px}
.pv-img svg{display:block;width:100%;height:auto}
.pv-md{font-size:12px;line-height:1.6}.pv-md h1{font-size:15px;margin-bottom:6px}.pv-md h2{font-size:13px;margin:8px 0 3px}.pv-md code{font-family:var(--mono);background:var(--hover);padding:0 4px;border-radius:3px;font-size:11px}.pv-md li{margin-left:16px}
.pv-none{color:var(--muted);text-align:center;padding:26px 8px;font-size:12px}
.pv-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pbtn{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--input-b);background:var(--card);font-size:11.5px;display:inline-flex;align-items:center;gap:5px}.pbtn:hover{background:var(--hover)}
.pbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff}html.dark .pbtn.pri{color:#0b1020}

/* menus, popovers, dialogs, toasts */
.menu{position:fixed;z-index:200;min-width:236px;background:var(--card);border:1px solid var(--card-b);border-radius:9px;box-shadow:var(--shadow);padding:5px;font-size:12.5px}
.mi{height:28px;border-radius:5px;display:flex;align-items:center;gap:9px;padding:0 9px;color:var(--text)}
.mi:hover:not(.dis){background:var(--sel)}.mi.dis{opacity:.4}.mi.danger{color:var(--danger)}
.mi svg.i{color:var(--muted)}.mi.danger svg.i{color:var(--danger)}
.mi .k{margin-left:auto;color:var(--muted);font-size:11px;padding-left:18px}
.mi .chk{width:15px;color:var(--accent);flex:none}
.msep{height:1px;background:var(--divider);margin:4px 2px}
.mi.hl{background:color-mix(in srgb,var(--accent-s) 14%,transparent)}
.mhd{font-size:10.5px;color:var(--muted);padding:5px 9px 2px;font-weight:700}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 9px}
.dlg-back{position:absolute;inset:0;background:rgba(2,6,23,.45);z-index:150;display:flex;align-items:center;justify-content:center}
.dlg{width:420px;background:var(--card);border:1px solid var(--card-b);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px}
.dlg h3{font-size:14px;margin-bottom:8px}.dlg p{color:var(--muted);line-height:1.6;margin-bottom:6px}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dbtn{height:30px;padding:0 14px;border-radius:7px;border:1px solid var(--input-b);background:var(--card)}.dbtn:hover{background:var(--hover)}
.dbtn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:#0f172a;color:#f8fafc;padding:8px 14px;border-radius:9px;z-index:300;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);font-size:12px;max-width:80%;animation:pop .25s ease}
html.dark .toast{background:#e6eaf0;color:#0f172a}
.toast button{color:#93c5fd;font-weight:600}html.dark .toast button{color:#1d4ed8}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--card-b);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
</style>
</head>
<body>

<div id="proto">
  <b>Taomni · File Explorer 高保真原型 v1</b>
  <div class="grp"><span class="lbl">场景</span>
    <button data-sc="explorer" class="on">① Explorer 标签</button>
    <button data-sc="workspace">② 工作区入口</button>
    <button data-sc="terminal">③ 终端入口</button>
  </div>
  <div class="grp" id="gA"><span class="lbl">DEC-01 工作区入口</span>
    <button data-var="A" class="on">A 工具栏图标→标签（推荐）</button>
    <button data-var="B">B 侧栏内切换 树/浏览</button>
  </div>
  <div class="grp"><span class="lbl">DEC-02 预览默认</span>
    <button data-pv="on" class="on">开</button><button data-pv="off">关</button>
  </div>
  <div class="grp"><span class="lbl">DEC-03 删除</span>
    <button data-del="trash" class="on">回收站+撤销（推荐）</button><button data-del="perm">确认后永久删除</button>
  </div>
  <div class="grp"><span class="lbl">主题</span><button data-theme="light" class="on">浅</button><button data-theme="dark">深</button></div>
</div>
<div id="hint"></div>
<div id="stage"><div id="app">
  <div id="titlebar"><div class="dots"><i></i><i></i><i></i></div><span>Taomni</span><span style="margin-left:auto" id="tbinfo"></span></div>
  <div id="shell">
    <div id="rail"></div>
    <div id="side"></div>
    <div id="main"><div id="tabs"></div><div id="content"></div></div>
  </div>
  <div id="status"><span id="st1"></span><span id="st2" style="margin-left:auto"></span></div>
</div></div>

<script>

      else if(['png','jpg','svg'].includes(e)){const h=(n.name.length*37)%360;body+=`<div class="pv-img"><svg viewBox="0 0 320 200"><defs><linearGradient id="g${h}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},75%,62%)"/><stop offset="1" stop-color="hsl(${(h+70)%360},70%,42%)"/></linearGradient></defs><rect width="320" height="200" fill="url(#g${h})"/><circle cx="${90+h%120}" cy="70" r="34" fill="rgba(255,255,255,.35)"/><path d="M0 160 Q80 110 150 150 T320 130 V200 H0z" fill="rgba(0,0,0,.28)"/></svg></div><div style="color:var(--muted);font-size:10.5px;margin-top:6px">${e==='svg'?'矢量图 · 320×200':'1920×1200 · '+e.toUpperCase()} · 缩略图仅为示意</div>`}
      else if(n.type==='dir')body+=`<div class="pv-text" style="padding:6px 0">${kids(n.path,false).slice(0,8).map(k=>`<div style="padding:1px 10px;gap:6px;align-items:center">${iconFor(k,'fi sm').replace('class="i','style="width:13px;height:13px" class="i')}<span>${k.name}</span></div>`).join('')||'<div style="padding:4px 10px;color:var(--muted)">（空）</div>'}</div>`;
      else body+=`<div class="pv-none">${n.size>262144&&['txt','md','ts','tsx','rs','json','toml'].includes(e)?'文件超过预览上限（'+pr.limit+'）':'此类型暂无内容预览'}<br><span style="font-size:11px">可用系统默认应用打开</span></div>`;
      body+=`<div class="pv-actions"><button class="pbtn pri" data-pa="open">${n.type==='dir'?'打开':'打开'}</button><button class="pbtn" data-pa="sys">系统应用</button><button class="pbtn" data-pa="path">复制路径</button></div>`}
    pv.innerHTML=`<div class="pv-hd"><span>预览</span><span class="sp" style="flex:1"></span><button class="ibtn" data-pa="cfg" title="预览选项">${ic('gear')}</button><button class="ibtn" data-pa="close" title="关闭预览 (Alt+P)">${ic('x')}</button></div><div class="pv-body">${body}</div>`;
    pv.querySelectorAll('[data-pa]').forEach(b=>b.onclick=e=>{const a=b.dataset.pa,n=s[0];
      if(a==='close')this.togglePv();else if(a==='open'&&n)this.open(n);else if(a==='sys')toast('已交给系统默认应用');else if(a==='path'&&n)toast('已复制路径：'+n.path);
      else if(a==='cfg'){const R=b.getBoundingClientRect();menu(R.left-170,R.bottom+4,[{hd:'预览窗格位置'},{label:'右侧',chk:pr.pvPos==='right',fn:()=>{pr.pvPos='right';this.paint()}},{label:'底部',chk:pr.pvPos==='bottom',fn:()=>{pr.pvPos='bottom';this.paint()}},'-',{hd:'文本预览'},{label:'自动换行',chk:pr.wrap,fn:()=>{pr.wrap=!pr.wrap;this.paintPv()}},{label:'大小上限：256 KB',chk:pr.limit==='256 KB',fn:()=>{pr.limit='256 KB';this.paintPv()}},{label:'大小上限：1 MB',chk:pr.limit==='1 MB',fn:()=>{pr.limit='1 MB';this.paintPv()}},'-',{label:'设置会保存，并应用到所有 Explorer 标签',dis:true}])}});
  }
  refreshAll(){S.tabs.filter(t=>t.type==='explorer').forEach(t=>{if(!FS[t.path])t.path=HOME;t.sel=t.sel.filter(p=>FS[p]);t._ex&&t._ex.paint()})}
}
function md(s){return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>')}
function fmtNow(){return '2026-11-13 10:3'+(S.seq%10)}
function link(p){const par=p.slice(0,p.lastIndexOf('/'))||'/';FS[par].children.push(p)}
function cloneNode(from,to,name){const n=FS[from];add(to,n.type,n.size,fmtNow(),n.content,n.hidden);FS[to].name=name;link(to);if(n.type==='dir')n.children.slice().forEach(c=>cloneNode(c,to+'/'+FS[c].name,FS[c].name))}
function removeNode(p){const n=FS[p];if(!n)return;n.children.slice().forEach(removeNode);const par=p.slice(0,p.lastIndexOf('/'))||'/';if(FS[par])FS[par].children=FS[par].children.filter(c=>c!==p);delete FS[p]}
function renameNode(p,np,name){const n=FS[p];const snap=snapshot(p);removeNode(p);const re=(s,root,nroot)=>{s.path=s.path.replace(root,nroot)};restoreAs(snap,p,np,name)}
function snapshot(p){const n=FS[p];return {n:{...n,children:[]},kids:n.children.map(snapshot),parent:p.slice(0,p.lastIndexOf('/'))||'/'}}
function restore(s){FS[s.n.path]={...s.n,children:[]};FS[s.parent].children.push(s.n.path);s.kids.forEach(restore)}
function restoreAs(s,oldRoot,newRoot,name){const np=s.n.path===oldRoot?newRoot:newRoot+s.n.path.slice(oldRoot.length);FS[np]={...s.n,path:np,name:s.n.path===oldRoot?name:s.n.name,children:[]};const par=np.slice(0,np.lastIndexOf('/'))||'/';FS[par].children.push(np);s.kids.forEach(k=>restoreAs(k,oldRoot,newRoot,name))}

/* =============== prototype controls =============== */
const HINTS={
 explorer:'① 在主界面 工具 ▸ 文件资源管理器 打开 Explorer 标签。试试：点击左树/面包屑导航、Ctrl/Shift 多选、F2 重命名、Del 删除（带撤销）、Ctrl+C/X/V、右键菜单、拖放到文件夹、Alt+P 预览窗格、顶部“预览 ⚙”切换位置。工具栏 ⧉ = 在新标签中打开当前目录。',
 workspace:'② 工作区模式：A 方案左侧竖栏的 Explorer 图标（带蓝点）= 在标签页打开；点两次观察“同目录只保留一个标签”。在 Project 树里右键文件夹 → 在 Explorer 中打开 / 新标签。切到 B 方案对比“侧栏内 树/浏览 切换”。',
 terminal:'③ 在“本地终端”标签中任意位置右键 → “在 Explorer 中打开当前目录”。再来一次会定位到已有标签；选“在新的 Explorer 标签中打开”则再开一个。可先输入 cd .. 或 cd src 改变目录后再试。'
};
function setScenario(sc){S.sc=sc;S.tabs=[];S.active=null;S.seq=0;S.clip=null;S.treeOpen={};
  $('#hint').textContent=HINTS[sc];$('#gA').style.display=sc==='workspace'?'flex':'none';
  if(sc==='explorer'){S.mode='main';openTab({id:nid(),type:'terminal',cwd:HOME});const e=openTab({id:nid(),type:'explorer',path:WSROOT,hist:[WSROOT],hi:0,sel:[WSROOT+'/package.json'],filter:'',pv:S.pvDefault});S.active=e.id}
  else if(sc==='workspace'){S.mode='ws';S.ws={lens:'project',bMode:'tree',bPath:WSROOT};S.treeOpen={[WSROOT+'/src']:true,[WSROOT+'/src/components']:true};seedTabs()}
  else{S.mode='main';const t=openTab({id:nid(),type:'terminal',cwd:WSROOT});S.active=t.id}
  document.querySelectorAll('[data-sc]').forEach(b=>b.classList.toggle('on',b.dataset.sc===sc));render()}
document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>setScenario(b.dataset.sc));
document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{S.variant=b.dataset.var;document.querySelectorAll('[data-var]').forEach(x=>x.classList.toggle('on',x===b));if(S.sc==='workspace')S.ws.bMode='tree';render()});
document.querySelectorAll('[data-pv]').forEach(b=>b.onclick=()=>{S.pvDefault=b.dataset.pv==='on';document.querySelectorAll('[data-pv]').forEach(x=>x.classList.toggle('on',x===b));S.tabs.filter(t=>t.type==='explorer').forEach(t=>{t.pv=S.pvDefault;t._ex&&t._ex.paint()});toast('新开的 Explorer 标签预览窗格默认'+(S.pvDefault?'开启':'关闭'))});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.del=b.dataset.del;document.querySelectorAll('[data-del]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('on',x===b));render();S.tabs.forEach(t=>{t._ex&&t._ex.paint()})});
const qs=new URLSearchParams(location.search);
if(qs.get('theme')==='dark')document.querySelector('[data-theme=dark]').click();
if(qs.get('var')==='B')document.querySelector('[data-var=B]').click();
if(qs.get('pv')==='off')document.querySelector('[data-pv=off]').click();
setScenario(qs.get('sc')||'explorer');
if(qs.get('open'))openExplorer(qs.get('open'));
if(qs.get('menu')==='term'){const t=S.tabs.find(x=>x.type==='terminal');setTimeout(()=>termMenu(520,260,t),80)}
if(qs.get('menu')==='file'){setTimeout(()=>{const t=S.tabs.find(x=>x.type==='explorer');const row=t._ex.root.querySelector('.frow[data-p$="src"]');if(row){const r=row.getBoundingClientRect();t._ex.t.sel=[row.dataset.p];t._ex.paintFiles();t._ex.ctxItem({clientX:r.left+120,clientY:r.top+10},FS[row.dataset.p])}},120)}
if(qs.get('bmode')==='browse'){S.ws.bMode='browse';render()}
</script>

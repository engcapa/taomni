<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8" />

<title>Taomni Notepad — 高保真交互原型 v3（每个文件一个应用标签；设计对象，非产品实现）</title>
<style>

}
html.dark{
  --bg:#1e1f22;--panel:#23252a;--chrome:#16171a;--chrome-b:#2e3138;--card:#26282e;--card-b:#35383f;
  --accent:#6aa6f8;--accent-s:#8bbcff;--sel:#25354d;--sel-b:#4d7ec4;--hover:rgba(255,255,255,.06);--hover2:rgba(255,255,255,.12);
  --text:#e6eaf0;--muted:#9ca3ad;--subtle:#6e7582;--divider:#2e3138;--ok:#34d399;--warn:#fbbf24;--danger:#f87171;
  --input:#1b1c20;--input-b:#3a3e46;--code-bg:#1a1b1f;--shadow:0 20px 48px -10px rgba(0,0,0,.7);
  --m0:#6b5a12;--m1:#1f5a3a;--m2:#1f4a7a;--m3:#6a2850;--m4:#4a3a8a;--m5:#7a4a1a;--fa:#5a4f10;--fc:#c2570c;--curline:rgba(139,188,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);font-size:12.5px;line-height:1.4;color:var(--text);background:#0b1020;height:100vh;overflow:hidden;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;white-space:nowrap}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--chrome-b);border-radius:5px}::-webkit-scrollbar-track{background:transparent}
.sp{flex:1}.mut{color:var(--muted)}.mono{font-family:var(--mono)}
#proto{background:#0b1020;color:#cbd5e1;padding:6px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;border-bottom:1px solid #1e293b;font-size:12px}

#stage{flex:1;min-height:0;padding:10px;display:flex;justify-content:center}

#titlebar .dots{display:flex;gap:6px}#titlebar .dots i{width:10px;height:10px;border-radius:50%;background:var(--chrome-b)}
#shell{flex:1;min-height:0;display:flex}
#rail{width:44px;background:var(--chrome);border-right:1px solid var(--chrome-b);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;flex:none}

#colmain{flex:1;min-width:0;display:flex;flex-direction:column}
#apptabs{height:32px;background:var(--chrome);display:flex;align-items:flex-end;padding:0 6px;gap:2px;border-bottom:1px solid var(--chrome-b);flex:none}

.ibtn{width:27px;height:27px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}.ibtn:hover{background:var(--hover);color:var(--text)}.ibtn.on{background:var(--sel);color:var(--accent)}.ibtn.rec{color:var(--danger)}

#workrow{flex:1;min-height:0;display:flex}
#center{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#panes{flex:1;min-height:0;display:flex;position:relative}
#panes.v{flex-direction:row}#panes.h{flex-direction:column}
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}

.tabs{display:flex;align-items:flex-end;gap:1px;background:var(--chrome);border-bottom:1px solid var(--chrome-b);padding:3px 4px 0;overflow-x:auto;flex:none;min-height:30px}
.tab{height:26px;max-width:190px;padding:0 6px 0 9px;border-radius:6px 6px 0 0;display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;flex:none;position:relative}
.tab:hover{background:var(--hover)}.tab.on{background:var(--bg);color:var(--text);box-shadow:inset 0 2px 0 var(--accent-s)}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tab .dirty{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.tab .x{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:.55}.tab .x:hover{background:var(--hover2);opacity:1}
.tab.pinned{background:color-mix(in srgb,var(--accent-s) 10%,transparent)}.tab.pinned .x{display:none}.tab svg.i{width:12px;height:12px}
.tab.ro .tt::after{content:" 🔒";font-size:10px}.tab.dragover{box-shadow:inset 2px 0 0 var(--accent-s)}
.atab{max-width:200px;padding:0 6px 0 10px;position:relative;flex:none}.atab:hover{background:var(--hover)}.atab.on:hover{background:var(--bg)}
.atab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.atab .dirty{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.atab .x{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:.55}.atab .x:hover{background:var(--hover2);opacity:1}
.atab.pinned{background:color-mix(in srgb,var(--accent-s) 10%,transparent)}.atab.pinned .x{display:none}.atab svg.i{width:12px;height:12px}
.atab.ro .tt::after{content:" 🔒";font-size:10px}.atab.dragover{box-shadow:inset 2px 0 0 var(--accent-s)}.atab.st{cursor:default}
.pane.focus{box-shadow:inset 0 2px 0 var(--accent-s)}
.opt{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--divider);border-radius:8px;margin:5px 0;cursor:pointer}.opt:hover{background:var(--hover)}.opt.dis{opacity:.55;cursor:not-allowed}.opt.dis:hover{background:none}.opt b{display:block}
.banners{flex:none}.banner{display:flex;align-items:center;gap:8px;padding:5px 12px;font-size:12px;border-bottom:1px solid var(--divider)}
.banner.warn{background:color-mix(in srgb,var(--warn) 15%,var(--bg))}.banner.info{background:var(--sel);color:var(--accent)}.banner.err{background:color-mix(in srgb,var(--danger) 13%,var(--bg))}
.cbtn{flex:none;height:24px;padding:0 9px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--input-b)}
.cbtn:hover{background:var(--hover)}.cbtn.pri{background:var(--accent-s);border-color:var(--accent-s);color:#fff}.cbtn.pri:hover{filter:brightness(1.08)}.cbtn.dng{background:var(--danger);border-color:var(--danger);color:#fff}.cbtn.on{background:var(--sel);color:var(--accent)}
.ed{flex:1;min-height:0;position:relative;display:flex}
.sc{flex:1;min-width:0;overflow:auto;position:relative;background:var(--code-bg)}
.inner{position:relative;min-height:100%;width:max-content;min-width:100%;padding-bottom:40px}
.wrapon .inner{width:100%}
.bd{font-family:var(--mono);font-size:var(--fs);line-height:var(--lh);tab-size:4}
.row{display:flex;min-height:var(--lh)}
.row.cur{background:var(--curline)}.row.bm{background:color-mix(in srgb,var(--accent-s) 12%,transparent)}
.gt{width:var(--gw);flex:none;display:flex;align-items:flex-start;justify-content:flex-end;position:sticky;left:0;background:var(--panel);color:var(--subtle);border-right:1px solid var(--divider);user-select:none;z-index:2;font-size:calc(var(--fs) - 1px);padding-right:6px;gap:3px}
.nonum .no{display:none}
.gt .cg{width:3px;align-self:stretch;flex:none}.gt .cg.c1{background:var(--warn)}.gt .cg.c2{background:var(--ok)}
.hidechg .cg{background:none!important}
.gt .bk{width:10px;height:var(--lh);flex:none;cursor:pointer;position:relative}.row.bm .gt .bk::after{content:"";position:absolute;left:1px;top:calc(var(--lh)/2 - 4px);width:8px;height:8px;border-radius:50%;background:var(--accent-s)}
.gt .no{margin-left:auto;cursor:default}
.tx{flex:1;white-space:pre;padding:0 8px}
.wrapon .tx{white-space:pre-wrap;word-break:break-all}
.ed textarea{position:absolute;top:0;bottom:0;left:var(--gw);right:0;width:calc(100% - var(--gw));padding:0 8px;font-family:var(--mono);font-size:var(--fs);line-height:var(--lh);tab-size:4;color:transparent;caret-color:var(--text);background:transparent;resize:none;overflow:hidden;white-space:pre;z-index:1;border:0}
.wrapon .ed textarea{white-space:pre-wrap;word-break:break-all}
.ed textarea::selection{background:color-mix(in srgb,var(--accent-s) 38%,transparent)}
.mk0{background:var(--m0)}.mk1{background:var(--m1)}.mk2{background:var(--m2)}.mk3{background:var(--m3)}.mk4{background:var(--m4)}.mk5{background:var(--m5)}
.fa{background:var(--fa);border-radius:2px}.fc{background:var(--fc);color:#000;border-radius:2px}.lk{text-decoration:underline;color:var(--accent-s)}
.sy{color:var(--subtle)}.eol{display:inline-block;width:0;overflow:visible;white-space:nowrap;color:var(--subtle);font-size:.78em;font-family:var(--sans);padding-left:4px}
i.ig{display:inline-block;width:0;height:1em;position:relative}i.ig::before{content:"";position:absolute;left:0;top:-5px;height:var(--lh);border-left:1px dotted var(--subtle)}
.rl{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed color-mix(in srgb,var(--danger) 45%,transparent);pointer-events:none;z-index:0}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);z-index:5}
.empty h3{font-size:15px}.empty .rc{width:420px;max-height:200px;overflow:auto;border:1px solid var(--divider);border-radius:8px;background:var(--card)}
.rcitem{display:flex;padding:6px 10px;gap:8px;cursor:pointer}.rcitem:hover{background:var(--hover)}
#mini{width:132px;flex:none;position:relative;background:var(--code-bg);overflow:hidden;cursor:pointer;border-left:1px solid var(--divider)}
#status{height:22px;background:var(--chrome);border-top:1px solid var(--chrome-b);display:flex;align-items:center;padding:0 6px;gap:2px;color:var(--muted);font-size:11px;flex:none;white-space:nowrap;overflow:hidden}
#status .it{padding:1px 8px;border-radius:4px}#status button.it:hover{background:var(--hover2);color:var(--text)}#status .bar{width:1px;height:12px;background:var(--divider);margin:0 2px}
.chip{display:inline-flex;align-items:center;font-size:10.5px;padding:0 7px;border-radius:9px;background:var(--sel);color:var(--accent);font-weight:600;margin-left:4px}
.chip.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}.chip.rec{background:var(--danger);color:#fff}
#dockR{width:272px;flex:none;border-left:1px solid var(--chrome-b);display:none;flex-direction:column;background:var(--panel);overflow:hidden}
#dockB{height:210px;flex:none;border-top:1px solid var(--chrome-b);display:none;flex-direction:column;background:var(--panel)}
.dp{display:flex;flex-direction:column;min-height:0;flex:1;border-bottom:1px solid var(--divider);background:var(--panel)}
.dp>.hd{display:flex;align-items:center;gap:6px;padding:4px 8px;font-weight:700;font-size:11.5px;border-bottom:1px solid var(--divider);flex:none}
.dp>.bdy{flex:1;overflow:auto;min-height:0;font-size:12px}
.float{position:absolute;width:340px;height:300px;z-index:35;border:1px solid var(--card-b);border-radius:9px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;background:var(--panel)}
.float>.dp>.hd{cursor:move}
.rrow{padding:2px 10px;cursor:pointer;font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rrow:hover{background:var(--hover)}.rrow.f{font-family:var(--sans);font-weight:700;background:var(--hover);cursor:default}
.rrow b{background:var(--fa);font-weight:400}
table.t{border-collapse:collapse;width:100%}table.t td,table.t th{padding:3px 8px;border-bottom:1px solid var(--divider);text-align:left;font-size:12px}table.t th{background:var(--hover);position:sticky;top:0;font-weight:600}table.t tr.sl{background:var(--sel)}table.t tbody tr:hover{background:var(--hover)}
.menu{position:fixed;background:var(--card);border:1px solid var(--card-b);border-radius:9px;box-shadow:var(--shadow);padding:4px;min-width:230px;z-index:80;font-size:12px;max-height:80vh;overflow:auto}

.msep{height:1px;background:var(--divider);margin:4px 2px}

.fld{display:flex;align-items:center;gap:10px;margin:7px 0}.fld>label{width:96px;color:var(--muted);flex:none}

.note{font-size:11.5px;color:var(--muted);margin:4px 0}.warnbox{background:color-mix(in srgb,var(--warn) 16%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);padding:7px 10px;border-radius:7px;margin:7px 0;font-size:12px}

.btns{display:flex;flex-wrap:wrap;gap:5px}

<body>
<div id="proto">

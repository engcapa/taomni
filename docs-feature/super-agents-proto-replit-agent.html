<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taomni — Super Agents 高保真原型 (replit-agent)</title>
<style>
/* =====================================================================
   1. Taomni 主题令牌（取自 src/styles/theme.css 与 workspace 原型）
   ===================================================================== */
:root {
  --taomni-bg:#f8fafc; --taomni-panel-bg:#f8fafc; --taomni-chrome-bg:#f1f5f9; --taomni-chrome-border:#cbd5e1;
  --taomni-card-bg:#ffffff; --taomni-card-border:#e2e8f0; --taomni-accent:#1e40af; --taomni-accent-soft:#3b82f6;
  --taomni-selected:#dbeafe; --taomni-selected-border:#93c5fd; --taomni-hover:rgba(15,23,42,.06); --taomni-hover-strong:rgba(15,23,42,.11);
  --taomni-text:#0f172a; --taomni-text-muted:#64748b; --taomni-text-subtle:#94a3b8;
  --taomni-term-bg:#0f172a; --taomni-term-fg:#e2e8f0; --taomni-code-bg:#fbfdff; --taomni-code-gutter:#f4f7fb; --taomni-code-active-line:#eff6ff;
  --taomni-input-bg:#ffffff; --taomni-input-border:#cbd5e1;
  --taomni-success:#059669; --taomni-warning:#d97706; --taomni-danger:#dc2626; --taomni-purple:#7c3aed;
  --taomni-success-bg:rgba(16,185,129,.12); --taomni-warning-bg:rgba(245,158,11,.14); --taomni-danger-bg:rgba(239,68,68,.12); --taomni-info-bg:rgba(59,130,246,.12);
  --add-bg:rgba(16,185,129,.14); --del-bg:rgba(239,68,68,.12);
  --syn-kw:#9a3412; --syn-str:#047857; --syn-cm:#64748b; --syn-num:#6d28d9; --syn-fn:#0369a1;
  --taomni-shadow-lg:0 16px 40px -8px rgba(15,23,42,.22),0 4px 12px -2px rgba(15,23,42,.1); --taomni-shadow-sm:0 1px 3px rgba(15,23,42,.06);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
html.dark {
  --taomni-bg:#1e1f22; --taomni-panel-bg:#23252a; --taomni-chrome-bg:#16171a; --taomni-chrome-border:#2e3138;
  --taomni-card-bg:#26282e; --taomni-card-border:#35383f; --taomni-accent:#6aa6f8; --taomni-accent-soft:#8bbcff;
  --taomni-selected:#25354d; --taomni-selected-border:#4d7ec4; --taomni-hover:rgba(255,255,255,.06); --taomni-hover-strong:rgba(255,255,255,.12);
  --taomni-text:#e6eaf0; --taomni-text-muted:#9ca3ad; --taomni-text-subtle:#6e7582;
  --taomni-term-bg:#141518; --taomni-term-fg:#e5e9f0; --taomni-code-bg:#1e1f22; --taomni-code-gutter:#212328; --taomni-code-active-line:#262930;
  --taomni-input-bg:#1b1c20; --taomni-input-border:#3a3d45;
  --taomni-success:#34d399; --taomni-warning:#fbbf24; --taomni-danger:#f87171; --taomni-purple:#a78bfa;
  --add-bg:rgba(52,211,153,.13); --del-bg:rgba(248,113,113,.13);
  --syn-kw:#fdba74; --syn-str:#86efac; --syn-cm:#7b8494; --syn-num:#c4b5fd; --syn-fn:#7dd3fc;
  --taomni-shadow-lg:0 20px 48px -10px rgba(0,0,0,.7),0 4px 16px -2px rgba(0,0,0,.5); --taomni-shadow-sm:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:12.5px;line-height:1.5;color:var(--taomni-text);background:var(--taomni-chrome-bg);overflow:hidden;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--taomni-accent-soft);outline-offset:1px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.28);border-radius:99px}::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.5)}
[hidden]{display:none!important}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.sm{width:12px;height:12px}.ic.lg{width:18px;height:18px}
.muted{color:var(--taomni-text-muted)}.subtle{color:var(--taomni-text-subtle)}.mono{font-family:var(--font-mono)}.tiny{font-size:11px}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px}.col{display:flex;flex-direction:column}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* =====================================================================
   2. 外壳：主导航条 + 任务侧栏 + 主区 + 按需右栏
   ===================================================================== */
.workbench{flex:1;min-height:0;display:flex;padding:4px 6px 0 0;gap:0}
.rail{width:42px;min-width:42px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 0 6px}
.rail-group{display:flex;flex-direction:column;align-items:center;gap:4px}
.rail-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--taomni-text-muted);position:relative}
.rail-btn:hover{background:var(--taomni-hover);color:var(--taomni-text)}
.rail-btn.active{background:var(--taomni-selected);color:var(--taomni-accent)}
.rail-btn.active::before{content:"";position:absolute;left:-5px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--taomni-accent)}
.rail-badge{position:absolute;top:1px;right:1px;min-width:13px;height:13px;padding:0 3px;border-radius:99px;font:700 9px var(--font-mono);display:flex;align-items:center;justify-content:center;background:var(--taomni-warning);color:#1b1305}
.rail-div{width:20px;height:1px;background:var(--taomni-chrome-border);margin:2px 0}
.panel{background:var(--taomni-panel-bg);border:1px solid var(--taomni-chrome-border);border-radius:9px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.sidebar{width:252px;min-width:220px;margin-right:6px;flex-shrink:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.side-right{width:392px;min-width:340px;margin-left:6px;flex-shrink:0}
.side-right.wide{width:560px}
.btn{height:26px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--taomni-card-border);background:var(--taomni-card-bg);color:var(--taomni-text);font-weight:500}
.btn:hover{background:var(--taomni-hover-strong)}
.btn.sm{height:22px;padding:0 8px;font-size:11.5px}
.btn.primary{background:var(--taomni-accent);border-color:var(--taomni-accent);color:#fff}
html.dark .btn.primary{color:#0f172a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--taomni-text-muted)}
.btn.ghost:hover{background:var(--taomni-hover);color:var(--taomni-text)}
.btn.danger{color:var(--taomni-danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--taomni-text-muted);flex-shrink:0}
.icon-btn:hover{background:var(--taomni-hover);color:var(--taomni-text)}
.icon-btn.active{background:var(--taomni-selected);color:var(--taomni-accent)}
.kbd{font:10px var(--font-mono);padding:1px 5px;border-radius:4px;background:var(--taomni-chrome-bg);border:1px solid var(--taomni-chrome-border);color:var(--taomni-text-muted)}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:99px;font-size:11px;border:1px solid var(--taomni-card-border);background:var(--taomni-chrome-bg);color:var(--taomni-text-muted)}
.chip.ok{background:var(--taomni-success-bg);color:var(--taomni-success);border-color:transparent}
.chip.warn{background:var(--taomni-warning-bg);color:var(--taomni-warning);border-color:transparent}
.chip.bad{background:var(--taomni-danger-bg);color:var(--taomni-danger);border-color:transparent}
.chip.info{background:var(--taomni-info-bg);color:var(--taomni-accent);border-color:transparent}
.chip.purple{background:rgba(124,58,237,.14);color:var(--taomni-purple);border-color:transparent}
button.chip{cursor:pointer}button.chip:hover{filter:brightness(1.12)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--taomni-text-subtle);flex-shrink:0}
.dot.run{background:var(--taomni-accent-soft);animation:pulse 1.6s infinite}
.dot.need{background:var(--taomni-warning)}.dot.ok{background:var(--taomni-success)}.dot.bad{background:var(--taomni-danger)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(106,166,248,.55)}50%{box-shadow:0 0 0 4px rgba(106,166,248,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

/* ---- 侧栏 ---- */
.sb-head{padding:10px 10px 6px;display:flex;flex-direction:column;gap:8px}
.sb-title{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px}
.new-btn{width:100%;justify-content:center;height:30px;font-weight:600}
.search{display:flex;align-items:center;gap:6px;padding:0 8px;height:26px;border-radius:6px;background:var(--taomni-input-bg);border:1px solid var(--taomni-input-border);color:var(--taomni-text-muted)}
.search input{flex:1;min-width:0;color:var(--taomni-text)}
.sb-scroll{flex:1;overflow:auto;padding:2px 6px 8px}
.sb-label{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--taomni-text-subtle);font-weight:700}
.inbox-item{display:flex;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;background:var(--taomni-warning-bg);margin-bottom:4px}
.inbox-item:hover{border-color:var(--taomni-warning)}
.inbox-item b{font-weight:600;font-size:12px}
.m-item{display:flex;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.m-item:hover{background:var(--taomni-hover)}
.m-item.active{background:var(--taomni-selected);border-color:var(--taomni-selected-border)}
.m-item .dot{margin-top:5px}
.m-item .t{font-weight:600;font-size:12.5px}
.m-item .s{font-size:11px;color:var(--taomni-text-muted)}
.sb-foot{border-top:1px solid var(--taomni-chrome-border);padding:6px;display:flex;align-items:center;gap:4px}
.sb-foot .btn{flex:1;justify-content:flex-start}

/* ---- 主区头 ---- */
.m-head{padding:8px 14px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--taomni-chrome-border);background:var(--taomni-panel-bg)}
.m-title-row{display:flex;align-items:center;gap:8px}
.m-title{font-size:14px;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--taomni-card-border);border-radius:7px;overflow:hidden;background:var(--taomni-chrome-bg)}
.seg button{height:24px;padding:0 10px;color:var(--taomni-text-muted);display:inline-flex;align-items:center;gap:5px;font-weight:500}
.seg button.on{background:var(--taomni-selected);color:var(--taomni-accent)}
.seg button:hover:not(.on){background:var(--taomni-hover)}
.stepper{display:flex;align-items:center;gap:0;padding-bottom:9px;overflow:auto}
.step{display:flex;align-items:center;gap:6px;color:var(--taomni-text-subtle);font-size:11.5px;white-space:nowrap}
.step .n{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--taomni-chrome-border);display:flex;align-items:center;justify-content:center;font:700 10px var(--font-mono)}
.step.done{color:var(--taomni-text-muted)}.step.done .n{background:var(--taomni-success);border-color:var(--taomni-success);color:#fff}
html.dark .step.done .n{color:#06281c}
.step.cur{color:var(--taomni-text);font-weight:600}.step.cur .n{border-color:var(--taomni-accent-soft);color:var(--taomni-accent);background:var(--taomni-selected)}
.step-line{width:22px;height:1.5px;background:var(--taomni-chrome-border);margin:0 8px;flex-shrink:0}
.step-line.done{background:var(--taomni-success)}
.status-strip{display:flex;white-space:nowrap;overflow:hidden;align-items:center;gap:10px;padding:6px 14px;font-size:11.5px;color:var(--taomni-text-muted);border-bottom:1px solid var(--taomni-chrome-border);background:var(--taomni-chrome-bg)}
.status-strip b{color:var(--taomni-text);font-weight:600}
.bar{height:5px;border-radius:99px;background:var(--taomni-chrome-border);overflow:hidden;width:96px}
.bar>i{display:block;height:100%;background:var(--taomni-accent-soft);border-radius:99px}
.bar.warn>i{background:var(--taomni-warning)}.bar.bad>i{background:var(--taomni-danger)}.bar.ok>i{background:var(--taomni-success)}

/* ---- 信息流 ---- */
.feed-wrap{flex:1;min-height:0;overflow:auto;padding:14px 0 6px}
.feed{max-width:820px;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;gap:12px}
.feed-tools{display:flex;align-items:center;justify-content:space-between;max-width:820px;margin:0 auto 10px;padding:0 18px}
.msg-user{align-self:flex-end;max-width:84%;background:var(--taomni-selected);border:1px solid var(--taomni-selected-border);border-radius:12px 12px 3px 12px;padding:9px 12px}
.msg-user .who{font-size:10.5px;color:var(--taomni-text-muted);margin-bottom:2px}
.msg-router{display:flex;gap:8px;align-items:flex-start}
.avatar{width:22px;height:22px;border-radius:7px;background:var(--taomni-chrome-bg);border:1px solid var(--taomni-card-border);display:flex;align-items:center;justify-content:center;color:var(--taomni-accent);flex-shrink:0}
.card{border:1px solid var(--taomni-card-border);background:var(--taomni-card-bg);border-radius:10px;padding:10px 12px;box-shadow:var(--taomni-shadow-sm)}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-head b{font-size:13px}
.card ul{margin:4px 0 0 16px;display:flex;flex-direction:column;gap:2px}
.card.report{border-left:3px solid var(--taomni-accent-soft)}
.card.warn{border-left:3px solid var(--taomni-warning)}
.card.decision{border:1px solid var(--taomni-warning);background:linear-gradient(0deg,var(--taomni-warning-bg),var(--taomni-warning-bg)),var(--taomni-card-bg)}
.card.decision.resolved{border-color:var(--taomni-card-border);background:var(--taomni-card-bg)}
.card.result{border:1px solid var(--taomni-success);background:linear-gradient(0deg,var(--taomni-success-bg),var(--taomni-success-bg)),var(--taomni-card-bg)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{text-align:left;white-space:normal;border:1px solid var(--taomni-card-border);background:var(--taomni-card-bg);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;gap:2px}
.opt:hover{border-color:var(--taomni-accent-soft);background:var(--taomni-selected)}
.opt.rec{border-color:var(--taomni-accent-soft)}
.opt .l{display:flex;align-items:center;gap:6px;font-weight:600}
.opt .d{color:var(--taomni-text-muted);font-size:11.5px}
.opt .i{color:var(--taomni-text-subtle);font-size:11px}
.opt.chosen{border-color:var(--taomni-success);background:var(--taomni-success-bg)}
.dec-foot{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--taomni-text-muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px}
.kv span:nth-child(odd){color:var(--taomni-text-muted)}
.evid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.quiet-pill{align-self:stretch;display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px dashed var(--taomni-chrome-border);border-radius:8px;color:var(--taomni-text-subtle);font-size:11.5px;justify-content:flex-start}
.quiet-pill:hover{color:var(--taomni-text);background:var(--taomni-hover)}
.timeline{border-left:1px solid var(--taomni-chrome-border);margin:2px 0 2px 12px;padding-left:12px;display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--taomni-text-muted)}
.timeline .tl{display:flex;gap:8px}.timeline .tl .t{font:10.5px var(--font-mono);color:var(--taomni-text-subtle);width:38px;flex-shrink:0}
.timeline .tl .w{color:var(--taomni-accent);width:68px;flex-shrink:0;font-weight:600}
.note-line{display:flex;align-items:center;gap:6px;color:var(--taomni-text-muted);font-size:11.5px;padding-left:30px}
.hidden-hint{align-self:center;color:var(--taomni-text-subtle);font-size:11.5px;padding:2px 0}

/* ---- 输入区 ---- */
.composer{padding:8px 14px 10px;border-top:1px solid var(--taomni-chrome-border);background:var(--taomni-panel-bg)}
.composer-box{max-width:820px;margin:0 auto;border:1px solid var(--taomni-input-border);background:var(--taomni-input-bg);border-radius:10px;padding:8px 10px 6px}
.composer-box:focus-within{border-color:var(--taomni-accent-soft)}
.composer textarea{width:100%;resize:none;height:38px;color:var(--taomni-text);line-height:1.5}
.composer-tools{display:flex;align-items:center;gap:6px;margin-top:4px}

/* ---- 右栏 ---- */
.tabs{display:flex;align-items:center;border-bottom:1px solid var(--taomni-chrome-border);background:var(--taomni-chrome-bg);padding:0 4px;overflow:auto}
.tab{height:32px;padding:0 10px;color:var(--taomni-text-muted);display:inline-flex;align-items:center;gap:5px;border-bottom:2px solid transparent;font-weight:500;position:relative}
.tab:hover{color:var(--taomni-text)}
.tab.on{color:var(--taomni-accent);border-bottom-color:var(--taomni-accent)}
.tab .n{font:700 9.5px var(--font-mono);background:var(--taomni-warning);color:#1b1305;border-radius:99px;padding:0 5px;height:14px;line-height:14px}
.tab .n.bad{background:var(--taomni-danger);color:#fff}.tab .n.ok{background:var(--taomni-success);color:#06281c}
.tab-body{flex:1;min-height:0;overflow:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:12px}
.sec-title{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--taomni-text-subtle);font-weight:700;margin-bottom:6px}
.box{border:1px solid var(--taomni-card-border);background:var(--taomni-card-bg);border-radius:9px}
.wk{padding:8px 10px;display:flex;gap:8px;border-bottom:1px solid var(--taomni-card-border)}
.wk:last-child{border-bottom:0}
.wk .nm{font-weight:600}
.wk .meta{font-size:11px;color:var(--taomni-text-muted)}
.wk .dot{margin-top:5px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:600;color:var(--taomni-text-muted);font-size:11px;padding:5px 8px;border-bottom:1px solid var(--taomni-card-border)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--taomni-card-border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.gate{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--taomni-card-border)}
.gate:last-child{border-bottom:0}
.gate .gi{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--taomni-chrome-bg);color:var(--taomni-text-subtle)}
.gate.ok .gi{background:var(--taomni-success-bg);color:var(--taomni-success)}
.gate.bad .gi{background:var(--taomni-danger-bg);color:var(--taomni-danger)}
.gate.run .gi{background:var(--taomni-info-bg);color:var(--taomni-accent)}
.gate.warn .gi{background:var(--taomni-warning-bg);color:var(--taomni-warning)}
.case{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--taomni-card-border);cursor:pointer}
.case:last-child{border-bottom:0}.case:hover{background:var(--taomni-hover)}
.case.sel{background:var(--taomni-selected)}
.code{font:11.5px/1.6 var(--font-mono);background:var(--taomni-term-bg);color:var(--taomni-term-fg);border-radius:8px;padding:8px 10px;white-space:pre;overflow:auto}
.env-steps{display:flex;flex-direction:column}
.es{display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid var(--taomni-card-border);align-items:flex-start}
.es:last-child{border-bottom:0}
.es .gi{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:var(--taomni-chrome-bg);color:var(--taomni-text-subtle)}
.es.ok .gi{background:var(--taomni-success-bg);color:var(--taomni-success)}
.es.run .gi{background:var(--taomni-info-bg);color:var(--taomni-accent)}
.es.bad .gi{background:var(--taomni-danger-bg);color:var(--taomni-danger)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--taomni-text-muted);font-weight:600}
.inp,.sel{height:28px;border:1px solid var(--taomni-input-border);background:var(--taomni-input-bg);border-radius:6px;padding:0 8px;color:var(--taomni-text);width:100%}
textarea.inp{height:64px;padding:6px 8px;resize:vertical}
select.sel{padding-right:4px}
.hunk{padding:6px 10px;border-bottom:1px solid var(--taomni-card-border);display:flex;gap:6px;align-items:center}
.hunk:last-child{border-bottom:0}
.file-row{padding:7px 10px;border-bottom:1px solid var(--taomni-card-border);cursor:pointer}
.file-row:hover{background:var(--taomni-hover)}
.add{color:var(--taomni-success)}.del{color:var(--taomni-danger)}

/* ---- IDE 视图 ---- */
.ide{flex:1;min-height:0;display:flex;flex-direction:column}
.ide-top{flex:1;min-height:0;display:flex}
.ide-tree{width:208px;border-right:1px solid var(--taomni-chrome-border);overflow:auto;padding:6px 4px;background:var(--taomni-panel-bg);flex-shrink:0}
.tr{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:5px;cursor:pointer;color:var(--taomni-text-muted);font-size:12px;white-space:nowrap}
.tr:hover{background:var(--taomni-hover);color:var(--taomni-text)}
.tr.sel{background:var(--taomni-selected);color:var(--taomni-text)}
.tr .gm{margin-left:auto;font:700 10px var(--font-mono)}
.gm.m{color:var(--taomni-warning)}.gm.a{color:var(--taomni-success)}
.ide-ed{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--taomni-code-bg)}
.ed-tabs{display:flex;background:var(--taomni-chrome-bg);border-bottom:1px solid var(--taomni-chrome-border);overflow:auto}
.ed-tab{height:30px;padding:0 12px;display:flex;align-items:center;gap:6px;color:var(--taomni-text-muted);border-right:1px solid var(--taomni-chrome-border);font-size:12px}
.ed-tab.on{background:var(--taomni-code-bg);color:var(--taomni-text);box-shadow:inset 0 2px 0 var(--taomni-accent)}
.ed-body{flex:1;overflow:auto;font:12.5px/1.65 var(--font-mono);padding:6px 0}
.ln{display:flex;min-height:20.5px}
.ln .no{width:44px;text-align:right;padding-right:10px;color:var(--taomni-text-subtle);background:var(--taomni-code-gutter);flex-shrink:0;cursor:pointer;user-select:none}
.ln .no:hover{color:var(--taomni-accent)}
.ln .tx{flex:1;padding:0 12px;white-space:pre}
.ln.a{background:var(--add-bg)}.ln.a .no{box-shadow:inset 3px 0 var(--taomni-success)}
.ln.dd{background:var(--del-bg)}
.ln.reverted{opacity:.45;text-decoration:line-through}
.hunk-bar{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 54px;background:var(--taomni-chrome-bg);border-top:1px solid var(--taomni-chrome-border);border-bottom:1px solid var(--taomni-chrome-border);font:11px var(--font-sans);color:var(--taomni-text-muted)}
.cmt{margin:2px 12px 4px 54px;padding:6px 9px;border-radius:8px;border:1px solid var(--taomni-selected-border);background:var(--taomni-selected);font:12px var(--font-sans);display:flex;gap:8px;align-items:center}
.tk-kw{color:var(--syn-kw)}.tk-str{color:var(--syn-str)}.tk-cm{color:var(--syn-cm);font-style:italic}.tk-num{color:var(--syn-num)}.tk-fn{color:var(--syn-fn)}
.ide-term{height:168px;border-top:1px solid var(--taomni-chrome-border);display:flex;flex-direction:column;background:var(--taomni-term-bg);color:var(--taomni-term-fg);flex-shrink:0}
.term-tabs{display:flex;gap:2px;padding:0 6px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.term-tabs button{height:26px;padding:0 10px;color:#9ca3ad;font-size:11.5px}.term-tabs button.on{color:#e6eaf0;box-shadow:inset 0 -2px #6aa6f8}
.term-body{flex:1;overflow:auto;padding:6px 10px;font:11.5px/1.6 var(--font-mono);white-space:pre}
.term-body .ok{color:#34d399}.term-body .bad{color:#f87171}.term-body .dim{color:#7b8494}

/* ---- 弹层 ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--taomni-panel-bg);border:1px solid var(--taomni-selected-border);border-radius:12px;box-shadow:var(--taomni-shadow-lg);width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal.sm{width:min(640px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--taomni-chrome-border);background:var(--taomni-chrome-bg)}
.modal-head b{font-size:13.5px}
.modal-body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--taomni-chrome-border);background:var(--taomni-chrome-bg)}
.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tpl{text-align:left;white-space:normal;border:1px solid var(--taomni-card-border);background:var(--taomni-card-bg);border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.tpl:hover{border-color:var(--taomni-accent-soft)}
.tpl.on{border-color:var(--taomni-accent-soft);background:var(--taomni-selected)}
.tpl b{font-size:12.5px}.tpl span{color:var(--taomni-text-muted);font-size:11.5px}
.pipe{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pipe .p{padding:2px 8px;border-radius:6px;background:var(--taomni-chrome-bg);border:1px solid var(--taomni-card-border);font-size:11.5px}
.pipe .p.h{border-color:var(--taomni-warning);background:var(--taomni-warning-bg)}
.pipe .ar{color:var(--taomni-text-subtle)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-layout{display:flex;min-height:420px}
.set-nav{width:150px;border-right:1px solid var(--taomni-chrome-border);padding:8px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.set-nav button{text-align:left;padding:6px 8px;border-radius:6px;color:var(--taomni-text-muted)}
.set-nav button.on{background:var(--taomni-selected);color:var(--taomni-accent)}
.set-nav button:hover:not(.on){background:var(--taomni-hover)}
.set-pane{flex:1;padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-width:0}
.switch{width:30px;height:17px;border-radius:99px;background:var(--taomni-chrome-border);position:relative;flex-shrink:0;border:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .12s}
.switch.on{background:var(--taomni-accent-soft)}.switch.on::after{left:15px}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:var(--taomni-card-bg);border:1px solid var(--taomni-selected-border);box-shadow:var(--taomni-shadow-lg);border-radius:9px;padding:8px 14px;z-index:200;display:flex;gap:8px;align-items:center}
.review-footer{height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11px;color:var(--taomni-text-muted);background:var(--taomni-chrome-bg);border-top:1px solid var(--taomni-chrome-border);flex-shrink:0}
.review-footer .grow{display:flex;gap:6px;align-items:center}
.brief-md{font:12px/1.65 var(--font-mono);white-space:pre-wrap;background:var(--taomni-card-bg);border:1px solid var(--taomni-card-border);border-radius:8px;padding:10px 12px;max-height:46vh;overflow:auto;user-select:text}
@media (max-width:1400px){.side-right{position:fixed;right:6px;top:8px;bottom:34px;z-index:60;box-shadow:var(--taomni-shadow-lg)}.tpl-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.sidebar{display:none}}
</style>

      { id: 'd1', type: 'decision', t: nowT(), title: 'D1 · 首个版本的范围', ctx: '为避免过度实现，建议先界定可上线的最小范围。', opts: [{ id: 'a', label: '最小可上线范围（推荐）', desc: '只做验收标准必需的功能，其余记入后续', imp: '成本最低，最快出 PR', rec: true }, { id: 'b', label: '完整范围', desc: '包含需求中所有“可选”项', imp: '预计 +40% 成本与时间' }], timeout: 30, onChoose(mm) { setWk(mm, 'WP-1', 'done', '范围已确认'); setWk(mm, 'WP-2', 'run', '按所选范围继续'); mm.phase = 1; } }],
    quality: { static: 'pending', unit: 'pending', unitText: '尚未运行', sec: 'pending', reviewed: false, stab: 'pending', acs: [['AC-1', '（待澄清阶段从“' + T.inputs + '”提炼）']], cases: [], plan: {}, findings: [], sel: null },
    env: { mode: f.env, state: 'idle', step: 0, preflight: null }, changes: [], hunkState: {}, comments: [], term: { shell: ['（暂无输出）'], e2e: ['E2E 环境未启动。'], prob: ['未发现问题'] }, deliver: null };
  S.missions[id] = m; S.order.unshift(id); S.cur = id; S.view = 'mission'; S.modal = null; S.newForm = null; S.toBottom = true; renderModal(); renderAll(); toast('任务已创建，Router 已开始规划');
}
function applyScenario(k) { S.cur = k; S.view = 'mission'; S.rightOpen = window.innerWidth > 1400; S.rightTab = k === 'm1' ? 'team' : 'quality'; S.toBottom = false; S.modal = null; renderModal(); renderAll(); const fw = $('#feedWrap'); if (fw && k === 'm1') { const d = $('.card.decision:not(.resolved)', fw); if (d) fw.scrollTop = Math.max(0, d.offsetTop - 120); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, m = cur(), d = el.dataset;
  if (a === 'scrim') { if (e.target === el && S.modal !== 'new') { S.modal = null; renderModal(); } return; }
  if (el.tagName === 'SELECT') return;
  const R = () => renderAll();
  switch (a) {
    case 'sel': S.cur = d.m; S.view = 'mission'; S.toBottom = true; R(); break;
    case 'goto': S.cur = d.m; S.view = 'mission'; R(); { const t = $$('.card.decision:not(.resolved)')[0]; if (t) $('#feedWrap').scrollTop = Math.max(0, t.offsetTop - 120); } break;
    case 'new': openModal('new'); break;
    case 'settings': S.setTab = d.t || 'roles'; openModal('settings'); break;
    case 'closeModal': S.modal = null; renderModal(); break;
    case 'view': S.view = d.v; R(); break;
    case 'verb': S.verb = +d.v; R(); break;
    case 'quiet': S.openQuiet[d.f] = !S.openQuiet[d.f]; R(); break;
    case 'decide': decide(m, d.d, d.o); R(); break;
    case 'defer': m.feed.find(x => x.id === d.d).deferred = true; toast('已稍后；超时后会按推荐项继续'); R(); break;
    case 'redo': { const f = m.feed.find(x => x.id === d.d); f.chosen = null; if (f.onUndo) f.onUndo(m); if (m.status === 'run' || m.status === 'ok') m.status = m.status === 'ok' ? 'ok' : 'need'; toast('已改回待决策；依赖它的工作包会重新等待'); R(); break; }
    case 'brief': S.briefKind = 'brief'; openModal('brief'); break;
    case 'briefKind': S.briefKind = d.k; renderModal(); break;
    case 'copyBrief': { const t = $('#briefText').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('已复制 Markdown'), () => toast('原型环境无法写入剪贴板，可手动选择文本复制', 'alert')); break; }
    case 'rtab': if (S.rightOpen && S.rightTab === d.t && el.classList.contains('icon-btn')) S.rightOpen = false; else { S.rightOpen = true; S.rightTab = d.t; } R(); break;
    case 'closeRight': S.rightOpen = false; R(); break;
    case 'wide': S.rightWide = !S.rightWide; R(); break;
    case 'send': send(); break;
    case 'toast': toast(d.t); break;
    case 'envMode': m.env.mode = d.k; m.env.preflight = null; if (m.env.state !== 'starting') { m.env.state = 'idle'; m.env.step = 0; } R(); break;
    case 'preflight': fillPreflight(m); toast('预检完成（原型示例）'); R(); break;
    case 'envStart': runEnvStart(m); break;
    case 'envDestroy': m.env.state = 'destroyed'; m.env.step = 0; m.term.e2e.push('环境已销毁；证据已归档。'); toast('环境已销毁，失败现场按规则保留 1 小时'); R(); break;
    case 'runE2E': runE2E(m); break;
    case 'stab': m.quality.cases.forEach(c => { if (c.st === 'pass') { c.runs = 5; c.pass = 5; } }); m.quality.stab = m.quality.cases.every(c => c.st === 'pass' || c.st === 'quarantine') ? 'ok' : 'pending'; toast(m.quality.stab === 'ok' ? '稳定性复跑 5/5 通过' : '复跑完成：仍有偶发 / 失败用例', m.quality.stab === 'ok' ? 'check' : 'alert'); R(); break;
    case 'case': m.quality.sel = d.c; R(); break;
    case 'fixCase': fixCase(m, d.c); break;
    case 'quarantine': m.quality.cases.find(c => c.id === d.c).st = 'quarantine'; toast(d.c + ' 已隔离并登记到交付说明', 'shield'); R(); break;
    case 'review': reviewRun(m); R(); break;
    case 'sec': m.quality.sec = 'ok'; toast('依赖扫描完成：无新增高危'); R(); break;
    case 'fixF': { const f = m.quality.findings.find(x => x.id === d.f); f.st = 'fixed'; m.cost.worker += 2; toast(f.id + ' 已交给 worker 修复并通过验证'); R(); break; }
    case 'dismissF': m.quality.findings.find(x => x.id === d.f).st = 'dismissed'; toast('已忽略，并记录在简报中'); R(); break;
    case 'deliver': deliver(m); R(); break;
    case 'hunk': m.hunkState[d.p + ':' + d.h] = d.s; toast({ kept: '已保留该变更', reverted: '已撤销（原型不修改真实文件）', asked: '已把该 hunk 作为结构化上下文发给 agent' }[d.s]); R(); break;
    case 'openFile': S.ideFile = d.p; S.view = 'ide'; R(); break;
    case 'term': S.termTab = d.k; R(); break;
    case 'cmt': S.cmtEdit = { path: S.ideFile, line: +d.l }; R(); break;
    case 'costAware': m.costAware = !m.costAware; R(); break;
    case 'tplPick': S.tplPick = d.k; { const f = S.newForm; if (f) { f.title = ($('#nfTitle') || {}).value || f.title; f.goal = ($('#nfGoal') || {}).value || f.goal; } } renderModal(); break;
    case 'nfRef': S.newForm.refs[d.k] = !S.newForm.refs[d.k]; { const f = S.newForm; f.title = $('#nfTitle').value; f.goal = $('#nfGoal').value; } renderModal(); break;
    case 'createMission': createMission(); break;
    case 'setTab': S.setTab = d.k; renderModal(); break;
    case 'setCostAware': SETTINGS.costAware = !SETTINGS.costAware; renderModal(); break;
    case 'setAut': SETTINGS.defaultAutonomy = d.k; renderModal(); break;
    case 'setTrig': SETTINGS.triggers[+d.i].on = !SETTINGS.triggers[+d.i].on; renderModal(); renderSidebar(); break;
    case 'setVerb': SETTINGS.defaultVerb = +d.v; S.verb = +d.v; renderModal(); break;
    case 'setNotify': SETTINGS.notify[d.k] = !SETTINGS.notify[d.k]; renderModal(); break;
    case 'setLesson': SETTINGS.lessons[+d.i].on = !SETTINGS.lessons[+d.i].on; renderModal(); break;
    case 'delLesson': SETTINGS.lessons.splice(+d.i, 1); renderModal(); break;
    case 'addLesson': { const v = $('#newLesson').value.trim(); if (v) { SETTINGS.lessons.push({ id: 'L' + Date.now(), text: v, on: true }); renderModal(); toast('经验已保存，后续任务自动应用'); } break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, m = cur();
  if (a === 'autonomy') { m.autonomy = el.value; toast('自治级别：' + { observe: '观察（只记录，不执行）', supervised: '受监督（关键点问你）', autopilot: '自主（按预授权执行，仍不自动合并）' }[el.value]); renderAll(); }
  if (a === 'setRole') { SETTINGS.roles[el.dataset.k] = el.value; renderModal(); renderAll(); }
  if (a === 'setBudget') SETTINGS.budget = +el.value || 0;
  if (a === 'setOverrun') SETTINGS.onOverrun = el.value;
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const p = e.target.selectionStart; renderSidebar(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); } });
document.addEventListener('keydown', e => {
  if (e.target.id === 'cmtIn' && e.key === 'Enter' && e.target.value.trim()) { cur().comments.push({ path: S.cmtEdit.path, line: S.cmtEdit.line, text: e.target.value.trim() }); S.cmtEdit = null; renderAll(); toast('留言已发给 agent'); }
  if (e.key === 'Escape') { if (S.cmtEdit) { S.cmtEdit = null; renderAll(); } else if (S.modal) { S.modal = null; renderModal(); } }
});
$('#themeBtn').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.classList.toggle('dark', S.theme === 'dark'); renderAll(); });
$('#railSettings').addEventListener('click', () => { S.setTab = 'roles'; openModal('settings'); });
$$('[data-scn]').forEach(b => b.addEventListener('click', () => applyScenario(b.dataset.scn)));
/* 决策撤销时恢复依赖状态 */
S.missions.m1.feed.find(f => f.id === 'd2').onUndo = m => { setWk(m, 'WP-6', 'wait', '等待你的决策 D2'); setCase(m, 'E-05', 'blocked'); };
S.missions.m1.feed.find(f => f.id === 'd3').onUndo = m => { setWk(m, 'WP-7', 'wait', '等待你的决策 D3'); };
renderAll(); applyScenario('m1');
</script>

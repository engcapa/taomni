# Do not inherit build-host-only instructions (e.g. AVX512).
# x86 voice uses a checked AVX2/FMA/F16C baseline; ARM uses its normal NEON backend.
[env]
GGML_NATIVE = "OFF"
GGML_SSE42 = "ON"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_BMI2 = "OFF"
GGML_FMA = "ON"
GGML_F16C = "ON"
# Ensure CMake-based C/C++ dependencies on Windows (e.g. whisper.cpp via whisper-rs-sys)
# link against the static C runtime (MT / libcmt) to match sherpa-onnx-sys and Tauri's
# static vcruntime bundle. Non-MSVC compilers safely ignore these settings.
CMAKE_POLICY_DEFAULT_CMP0091 = "NEW"
CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"

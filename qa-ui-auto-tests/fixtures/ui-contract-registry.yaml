# Each entry reaches a private desktop control through its product UI.
dialogs:
  - slug: explorer-new-file
    title: Explorer New file keeps focus inside the form and returns to the New menu button
    covers: [F-EXPLORER-1]
    fixtures: [reset_db, file_open_files]
    panel: explorer-new-file-dialog
    heading: New file
    first: explorer-new-file-type
    last: explorer-new-file-create
    return_to: explorer-cmd-new
    open:
      - open: ${cfg.app.base_url}
      - vault_first_run: qa-ui-contract-explorer
      - click: '[data-testid="side-tab-explorer"]'
      - wait_for: '[data-testid="explorer-tab"][data-active="true"]'
      - press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
      - fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
      - press: {selector: '[data-testid="explorer-address"]', key: Enter}
      - wait_for: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
      - click: '[data-testid="explorer-cmd-new"]'
      - click: '[data-testid="explorer-new-typed-file"]'

id: TC-auto-F-DB-1-schema-tree-double-click-qualified-native
title: Native schema-tree double-click inserts the database-qualified name
description: 'Connects a real MySQL/MariaDB session whose default database is `test`, filters

  the schema tree for a table that lives in `information_schema`, double-clicks

  that result, and verifies the editor receives the qualified reference

  (`information_schema`.`TABLES`) instead of the bare name. The qualified SELECT

  is then executed and the result grid must appear, proving the inserted

  reference resolves in a real connection. Cross-platform native target (Linux, macOS, Windows).

  '
covers:
- F-DB-1
tags:
- database
- sql
- schema-tree
- qualified-name
- native-boundary
- needs-review
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- mysql_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-qualified-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.database.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.database.port}
- fill:
    selector: input[aria-label="Database username"]
    value: ${cfg.database.user}
- fill:
    selector: input[aria-label="Database password"]
    value: ${cfg.database.password}
- fill:
    selector: input[aria-label="Database name"]
    value: ${cfg.database.database}
- click: '[data-testid="db-save-in-vault"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-qualified
- click: '[data-testid="session-save"]'
- wait_for:
    selector: '[data-testid="vault-setup-pw1"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-native-qualified-master
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-native-qualified-master
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-qualified"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-qualified"]'
- wait_for:
    selector: '[data-testid="db-query-tab"]'
    timeout_sec: 60
- assert_not_visible: '[data-testid="db-connection-error-banner"]'
- wait_for:
    selector: '[data-testid="schema-tree"]'
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="schema-tree-filter"]'
    timeout_sec: 30
- click: '[data-testid="sql-editor"] .cm-content'
- fill:
    selector: '[data-testid="schema-tree-filter"]'
    value: TABLES
- wait_for:
    selector: '[data-testid="schema-tree-object"][data-schema="information_schema"][data-object-name="TABLES"]'
    timeout_sec: 30
- dblclick: '[data-testid="schema-tree-object"][data-schema="information_schema"][data-object-name="TABLES"]'
- wait: 1
- eval_readonly:
    expression: document.querySelector('.cm-content').textContent
    contains: '`information_schema`.`TABLES`'
- screenshot: schema-tree-double-click-qualified-editor.png
- press: Mod+a
- type: SELECT COUNT(*) FROM `information_schema`.`TABLES`;
- click: '[data-testid="db-run-current-statement"]'
- wait_for:
    selector: '[data-testid="query-result-grid"]'
    timeout_sec: 60
- screenshot: schema-tree-double-click-qualified-result.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Native schema-tree double-click inserts the database-qualified name：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 8
    - 10
    - 12
    - 13
    - 14
    - 15
    - 16
    - 17
    - 18
    - 20
    - 21
    - 23
    - 24
    - 25
    - 27
    - 32
    - 33
    - 35
    - 39
    - 40
    - 41
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"session-new\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"session-database-section\"]", "timeout_sec": 10}}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 22
      expectation: '{"wait_for": {"selector": "[data-testid=\"vault-setup-pw1\"]", "timeout_sec": 15}}'
    - step: 26
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-qualified\"]"}'
    - step: 28
      expectation: '{"wait_for": {"selector": "[data-testid=\"db-query-tab\"]", "timeout_sec": 60}}'
    - step: 29
      expectation: '{"assert_not_visible": "[data-testid=\"db-connection-error-banner\"]"}'
    - step: 30
      expectation: '{"wait_for": {"selector": "[data-testid=\"schema-tree\"]", "timeout_sec": 30}}'
    - step: 31
      expectation: '{"wait_for": {"selector": "[data-testid=\"schema-tree-filter\"]", "timeout_sec": 30}}'
    - step: 34
      expectation: '{"wait_for": {"selector": "[data-testid=\"schema-tree-object\"][data-schema=\"information_schema\"][data-object-name=\"TABLES\"]",
        "timeout_sec": 30}}'
    - step: 37
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''.cm-content'').textContent", "contains":
        "`information_schema`.`TABLES`"}}'
    - step: 42
      expectation: '{"wait_for": {"selector": "[data-testid=\"query-result-grid\"]", "timeout_sec": 60}}'
    results:
    - 42
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

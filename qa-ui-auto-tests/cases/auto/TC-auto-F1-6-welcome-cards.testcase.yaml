id: TC-auto-F1-6
title: Welcome panel exposes the action cards and tips section
description: 'Auto-generated focused coverage for F1.6 (WelcomePanel). The panel

  exposes the local-terminal launcher and the "New session…" action, plus

  a static "Tips" section. This case clicks the new-session card and

  verifies the tips block renders.


  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions and
  decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries.'
covers:
- F1.6
tags:
- auto-generated
- smoke
- p1
- welcome
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: text="New session…"
- assert_not_visible: '[data-testid="welcome-panel"] >> text="Import OpenSSH config"'
- assert_not_visible: '[data-testid="welcome-panel"] >> text="Refresh sessions"'
- assert_visible: '[data-testid="welcome-open-home-folder"]'
- assert_visible: text="Tips"
- click: text="New session…"
- wait_for: '[data-testid="session-editor"]'
- press: Escape
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: hidden
    timeout_sec: 5
- screenshot: F1.6-welcome-cards.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home 保留新建会话、Home folder 和 Tips；导入/刷新保留在 Sessions 入口；新建对话框可取消返回。
    actions:
    - 8
    - 10
    checkpoints:
    - step: 3
      expectation: 新建会话主动作可见。
    - step: 4
      expectation: Home 不显示旧导入入口。
    - step: 5
      expectation: Home 不显示旧刷新入口。
    - step: 6
      expectation: Home folder 次级入口可见。
    - step: 7
      expectation: Tips 可见。
    - step: 9
      expectation: 主动作打开 SessionEditor。
    - step: 11
      expectation: Escape 后 SessionEditor 隐藏。
    results:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 9
    - 11
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

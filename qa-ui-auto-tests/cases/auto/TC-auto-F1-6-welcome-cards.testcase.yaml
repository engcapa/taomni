id: TC-auto-F1-6
title: Welcome panel exposes the action cards and tips section
description: 'Auto-generated focused coverage for F1.6 (WelcomePanel). The panel

  exposes the local-terminal launcher and the "New session…" action, plus

  a static "Tips" section. This case clicks the new-session card and

  verifies the tips block renders.

  '
covers:
- F1.6
tags:
- auto-generated
- smoke
- p1
- welcome
- needs-review
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: text="New session…"
- assert_not_visible: '[data-testid="welcome-panel"] >> text="Import OpenSSH config"'
- assert_not_visible: '[data-testid="welcome-panel"] >> text="Refresh sessions"'
- assert_visible: '[data-testid="welcome-open-home-folder"]'
- assert_visible: text="Tips"
- click: text="New session…"
- wait_for: '[data-testid="session-editor"]'
- press: Escape
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 5
- screenshot: F1.6-welcome-cards.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Welcome panel exposes the action cards and tips section：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 8
    - 10
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 3
      expectation: '{"assert_visible": "text=\"New session…\""}'
    - step: 4
      expectation: '{"assert_not_visible": "[data-testid=\"welcome-panel\"] >> text=\"Import OpenSSH config\""}'
    - step: 5
      expectation: '{"assert_not_visible": "[data-testid=\"welcome-panel\"] >> text=\"Refresh sessions\""}'
    - step: 6
      expectation: '{"assert_visible": "[data-testid=\"welcome-open-home-folder\"]"}'
    - step: 7
      expectation: '{"assert_visible": "text=\"Tips\""}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"session-editor\"]", "state": "detached", "timeout_sec":
        5}}'
    results:
    - 11
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

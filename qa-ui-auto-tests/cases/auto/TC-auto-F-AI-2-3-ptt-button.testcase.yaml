id: TC-auto-F-AI-2-3
title: Chat dictation remains available outside the title bar and follows the AI master switch
description: The shared Chat entry exposes dictation. Disabling AI removes Chat dictation and reenabling restores it; title bars have no voice entry.
covers:
- F-AI-2.3
tags:
- ai
- voice
- p2
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="welcome-open-local-terminal"]'
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="chat-voice-button"]'
- assert_visible: '[data-testid="chat-voice-button"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-ai"]'
- click: '[data-testid="ai-master-switch"]'
- wait_for:
    selector: '[data-testid="chat-voice-button"]'
    state: detached
    timeout_sec: 10
- click: '[data-testid="ai-master-switch"]'
- click: '[data-testid="rail-chat-button"]'
- wait_for:
    selector: '[data-testid="chat-voice-button"]'
    timeout_sec: 10
- screenshot: ai-2-3-ptt.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Chat dictation remains available outside the title bar and follows the AI master switch
    actions:
    - 1
    - 6
    - 8
    - 9
    - 11
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"chat-voice-button\"]"}'
    - step: 5
      expectation: '{"assert_visible": "[data-testid=\"chat-voice-button\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"]"}'
    - step: 10
      expectation: '{"wait_for": {"selector": "[data-testid=\"chat-voice-button\"]", "state": "detached", "timeout_sec": 10}}'
    - step: 13
      expectation: '{"wait_for": {"selector": "[data-testid=\"chat-voice-button\"]", "timeout_sec": 10}}'
    results:
    - 13
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-auto-F-AI-2-3
title: PTT mic button mounts in title bar tray and disappears when AI is disabled
description: 'F-AI-2.3: only assert the mic button surface, since real audio capture

  needs OS permissions that browser mode cannot grant. We verify the button

  is present by default, that its data-state attribute is one of the known

  values (idle | unsupported | error), and that toggling AI fully off in

  Settings unmounts the button entirely.

  '
covers:
- F-AI-2.3
tags:
- auto-generated
- ai
- voice
- p2
- needs-review
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="ptt-button"]'
- assert_visible: '[data-testid="ptt-button"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-ai"]'
- click: '[data-testid="ai-master-switch"]'
- wait_for:
    selector: '[data-testid="ptt-button"]'
    state: detached
    timeout_sec: 10
- click: '[data-testid="ai-master-switch"]'
- wait_for:
    selector: '[data-testid="ptt-button"]'
    timeout_sec: 10
- screenshot: ai-2-3-ptt.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: PTT mic button mounts in title bar tray and disappears when AI is disabled：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 4
    - 6
    - 7
    - 9
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"ptt-button\"]"}'
    - step: 3
      expectation: '{"assert_visible": "[data-testid=\"ptt-button\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"]"}'
    - step: 8
      expectation: '{"wait_for": {"selector": "[data-testid=\"ptt-button\"]", "state": "detached", "timeout_sec":
        10}}'
    - step: 10
      expectation: '{"wait_for": {"selector": "[data-testid=\"ptt-button\"]", "timeout_sec": 10}}'
    results:
    - 10
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

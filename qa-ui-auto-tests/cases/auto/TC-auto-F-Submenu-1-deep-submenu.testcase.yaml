id: TC-auto-F-Submenu-1
title: Deeply-nested context-menu submenus stay inside the viewport
description: 'F-Submenu-1: regression test for the v0.1.28 submenu overflow fix. We

  open SessionTree''s root → "Import sessions from third-party programs" →

  "Import iTerm2 profiles" submenu (the deepest reliable chain) and assert

  the third-tier item ("From local iTerm2 DynamicProfiles") is visible in

  the viewport. Before the fix, on macOS WKWebView the submenu rendered

  with `left-full` and got clipped off-screen.

  '
covers:
- F-Submenu-1
tags:
- auto-generated
- ui
- menu
- submenu
- p2
- needs-review
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="session-tree"]'
- right_click:
    selector: '[data-testid="session-tree"]'
    position:
      x: 16
      y: 16
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu"] >> text="Import sessions from third-party programs"'
- wait: 1
- hover: '[data-testid="context-menu"] >> text="Import iTerm2 profiles"'
- wait: 1
- assert_visible: '[data-testid="context-menu"] >> text="From local iTerm2 DynamicProfiles"'
- press: Escape
- screenshot: submenu-flip.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Deeply-nested context-menu submenus stay inside the viewport：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"context-menu\"] >> text=\"From local iTerm2 DynamicProfiles\""}'
    results:
    - 9
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

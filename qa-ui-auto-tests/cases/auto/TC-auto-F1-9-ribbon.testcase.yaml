id: TC-auto-F1-9
title: Control bar core commands dispatch Session / SFTP / Settings / Help to the
  right surface
description: "Coverage for F1.9 (core command dispatch via ControlBar). Exercises\
  \ the\nfour primary commands dispatched from the unified app menu:\n  - new-remote-session\
  \ → SessionEditor opens with SSH proto preselected\n  - new-sftp           → SessionEditor\
  \ opens with SFTP proto preselected\n  - settings           → settings tab mounts\n\
  \  - help               → About dialog opens\n\nShell v2 entry adaptation: Tools\
  \ and Sessions use the permanent Rail with visibility-aware user clicks; Settings\
  \ uses its permanent Rail button. Original business checks are retained."

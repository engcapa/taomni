id: TC-auto-F1-9
title: Control bar core commands dispatch Session / SFTP / Settings / Help to the right surface
description: "Coverage for F1.9 (core command dispatch via ControlBar). Exercises the\nfour primary commands dispatched\
  \ from the unified app menu:\n  - new-remote-session → SessionEditor opens with SSH proto preselected\n  - new-sftp\
  \           → SessionEditor opens with SFTP proto preselected\n  - settings           → settings tab mounts\n\
  \  - help               → About dialog opens\n\nShell v2 entry adaptation: Tools and Sessions use the permanent\
  \ Rail with visibility-aware user clicks; Settings uses its permanent Rail button. Original business checks are\
  \ retained.\nSemantic review for Shell v2: every original step is retained; requirements identify the actual user\
  \ actions and decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries."
covers:
- F1.9
tags:
- auto-generated
- smoke
- p1
- main
- commands
modes:
- browser
fixtures:
- reset_db
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="app-main-menu"]'
- assert_visible: '[data-testid="app-main-menu"]'
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu-item-new-remote-session"]'
- click: '[data-testid="context-menu-item-new-remote-session"]'
- wait_for: '[data-testid="session-editor"]'
- assert_visible: '[data-testid="session-proto-ssh"]'
- press: Escape
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: hidden
    timeout_sec: 5
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu-item-new-sftp"]'
- click: '[data-testid="context-menu-item-new-sftp"]'
- wait_for: '[data-testid="session-editor"]'
- assert_visible: '[data-testid="session-proto-sftp"]'
- press: Escape
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: hidden
    timeout_sec: 5
- wait_for: '[data-testid="shell-rail-settings"]'
- assert_visible: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- assert_visible: '[data-testid="settings-panel"]'
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu-item-help"]'
- click: '[data-testid="context-menu-item-help"]'
- wait_for: '[data-testid="about-dialog"]'
- assert_visible: '[data-testid="about-dialog"]'
- press: Escape
- wait_for:
    selector: '[data-testid="about-dialog"]'
    state: detached
    timeout_sec: 5
- screenshot: F1.9-commands.png

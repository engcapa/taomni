id: TC-auto-F1-9
title: Control bar core commands dispatch Session / SFTP / Settings / Help to the right surface
description: |
  Coverage for F1.9 (core command dispatch via ControlBar). Exercises the
  four primary commands dispatched from the unified app menu:
    - new-remote-session → SessionEditor opens with SSH proto preselected
    - new-sftp           → SessionEditor opens with SFTP proto preselected
    - settings           → settings tab mounts
    - help               → About dialog opens
covers: [F1.9]
tags: [auto-generated, smoke, p1, main, commands, needs-review]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 60
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="app-main-menu"]'
  - assert_visible: '[data-testid="app-main-menu"]'

  # command-session → SessionEditor with SSH preselected
  - click: '[data-testid="app-main-menu"]'
  - wait_for: '[data-testid="context-menu"]'
  - assert_visible: '[data-testid="context-menu-item-new-remote-session"]'
  - click: '[data-testid="context-menu-item-new-remote-session"]'
  - wait_for: '[data-testid="session-editor"]'
  - assert_visible: '[data-testid="session-proto-ssh"]'
  - press: Escape
  - wait_for:
      selector: '[data-testid="session-editor"]'
      state: detached
      timeout_sec: 5

  # command-sftp → SessionEditor with SFTP preselected
  - click: '[data-testid="app-main-menu"]'
  - wait_for: '[data-testid="context-menu"]'
  - assert_visible: '[data-testid="context-menu-item-new-sftp"]'
  - click: '[data-testid="context-menu-item-new-sftp"]'
  - wait_for: '[data-testid="session-editor"]'
  - assert_visible: '[data-testid="session-proto-sftp"]'
  - press: Escape
  - wait_for:
      selector: '[data-testid="session-editor"]'
      state: detached
      timeout_sec: 5

  # ribbon-settings → settings panel mounts in a tab
  - wait_for: '[data-testid="ribbon-settings"]'
  - assert_visible: '[data-testid="ribbon-settings"]'
  - click: '[data-testid="ribbon-settings"]'
  - wait_for: '[data-testid="settings-panel"]'
  - assert_visible: '[data-testid="settings-panel"]'

  # command-help → About dialog opens
  - click: '[data-testid="app-main-menu"]'
  - wait_for: '[data-testid="context-menu"]'
  - assert_visible: '[data-testid="context-menu-item-help"]'
  - click: '[data-testid="context-menu-item-help"]'
  - wait_for: '[data-testid="about-dialog"]'
  - assert_visible: '[data-testid="about-dialog"]'
  - press: Escape
  - wait_for:
      selector: '[data-testid="about-dialog"]'
      state: detached
      timeout_sec: 5
  - screenshot: F1.9-commands.png

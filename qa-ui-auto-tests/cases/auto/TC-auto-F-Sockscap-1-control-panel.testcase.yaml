id: TC-auto-F-Sockscap-1
title: SocksCap panel opens and browser-preview controls transition safely
description: 'F-Sockscap-1 browser smoke coverage. The browser runtime deliberately has no

  OS packet capture, so Start must enter its degraded preview state rather than

  claim Linux capture is active. This case verifies the panel entry point,

  status refresh, rule dry-run, Start → Stop transition, and recovery action.

  Privileged nftables/cgroup capture and Linux launch-only capture are verified

  separately by Rust/Vitest tests and native desktop validation.

  '
covers:
- F-Sockscap-1
tags:
- auto-generated
- smoke
- needs-review
- network
- sockscap
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45

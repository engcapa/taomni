id: TC-auto-F-ImportPreview-1
title: Session import flow exposes the "Import sessions from third-party programs" menu
description: "F-ImportPreview-1 closes the \"no testcase\" gap. Driving the actual file\npicker → SessionImportPreview\
  \ dialog requires a real OS file dialog (we\nuse a transient `<input type=\"file\">` element that is removed from\
  \ the DOM\nbefore Playwright can target it). The realistic e2e here verifies:\n  1. SessionTree's root context\
  \ menu lists the third-party import group;\n  2. The submenu contains MobaXterm / WSL / PuTTY / Xshell / Tabby\n\
  \     Termius / WindTerm / iTerm2 entries;\n  3. The MenuBar's `Sessions → Import sessions` chain is present.\n\
  Authoring the dialog-side assertions (preview-summary / select-all / confirm)\nneeds a real fixture file — left\
  \ for a follow-up that adds an upload helper.\n"
covers:
- F-ImportPreview-1
tags:
- auto-generated
- sessions
- import
- p2
- needs-review
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="session-tree"]'
- right_click:
    selector: '[data-testid="session-tree"]'
    position:
      x: 16
      y: 16
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu"] >> text="Import sessions from third-party programs"'
- hover: '[data-testid="context-menu"] >> text="Import sessions from third-party programs"'
- wait: 1
- assert_visible: '[data-testid="context-menu"] >> text="Import MobaXterm sessions"'
- assert_visible: '[data-testid="context-menu"] >> text="Import WSL sessions"'
- assert_visible: '[data-testid="context-menu"] >> text="Import PuTTY sessions"'

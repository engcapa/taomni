id: TC-auto-F-I18n-1
title: Language switcher cycles between English and Simplified Chinese
description: 'F-I18n-1: tests the bilingual UI introduced in v0.1.32. Default locale

  is English; opening the title-bar globe button reveals every supported

  locale (currently English + 简体中文). Selecting 简体中文 must persist

  across reloads (`localStorage.taomni.locale.v1`) and update the

  document language attribute. Settings → Language section mirrors the

  same set of options for users who don''t notice the tray button.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained.

  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions and
  decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries.'
covers:
- F-I18n-1
tags:
- auto-generated
- i18n
- ui
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- assert_visible: '[data-testid="language-switcher"]'
- click: '[data-testid="language-switcher"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="language-option-en"]'
- assert_visible: '[data-testid="language-option-zh-CN"]'
- click: '[data-testid="language-option-zh-CN"]'
- wait_for:
    selector: '[data-testid="context-menu"]'
    state: detached
    timeout_sec: 5
- assert_localstorage:
    key: taomni.locale.v1
    contains: zh-CN
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-general"]'
- assert_visible: '[data-testid="settings-language-section"]'
- assert_visible: '[data-testid="settings-language-en"]'
- assert_visible: '[data-testid="settings-language-zh-CN"]'
- click: '[data-testid="settings-language-zh-CN"]'
- assert_localstorage:
    key: taomni.locale.v1
    contains: zh-CN
- click: '[data-testid="settings-language-en"]'
- assert_localstorage:
    key: taomni.locale.v1
    contains: en
- screenshot: i18n-language-switcher.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 状态栏语言菜单可选择简体中文并持久化，同时两个选项保留。
    actions:
    - 4
    - 8
    checkpoints:
    - step: 6
      expectation: English 菜单项可见。
    - step: 7
      expectation: 简体中文菜单项可见。
    - step: 10
      expectation: locale 保存为 zh-CN。
    results:
    - 6
    - 7
    - 10
  - id: R2
    requirement: Settings Rail 的 general 分组保留语言选择，重复中文和切回英文均保存正确值。
    actions:
    - 11
    - 13
    - 17
    - 19
    checkpoints:
    - step: 14
      expectation: 语言设置分组可见。
    - step: 15
      expectation: 英文设置按钮可见。
    - step: 16
      expectation: 中文设置按钮可见。
    - step: 18
      expectation: 重复中文保存 zh-CN。
    - step: 20
      expectation: 切回英文保存 en。
    results:
    - 14
    - 15
    - 16
    - 18
    - 20
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

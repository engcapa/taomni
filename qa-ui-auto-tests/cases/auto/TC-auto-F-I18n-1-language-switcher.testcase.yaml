id: TC-auto-F-I18n-1
title: Language switcher cycles between English and Simplified Chinese
description: 'F-I18n-1: tests the bilingual UI introduced in v0.1.32. Default locale

  is English; opening the title-bar globe button reveals every supported

  locale (currently English + 简体中文). Selecting 简体中文 must persist

  across reloads (`localStorage.taomni.locale.v1`) and update the

  document language attribute. Settings → Language section mirrors the

  same set of options for users who don''t notice the tray button.

  '
covers:
- F-I18n-1
tags:
- auto-generated
- i18n
- ui
- p1
- needs-review
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- assert_visible: '[data-testid="language-switcher"]'
- click: '[data-testid="language-switcher"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="language-option-en"]'
- assert_visible: '[data-testid="language-option-zh-CN"]'
- click: '[data-testid="language-option-zh-CN"]'
- wait_for:
    selector: '[data-testid="context-menu"]'
    state: detached
    timeout_sec: 5
- assert_localstorage:
    key: taomni.locale.v1
    contains: zh-CN
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-general"]'
- assert_visible: '[data-testid="settings-language-section"]'
- assert_visible: '[data-testid="settings-language-en"]'
- assert_visible: '[data-testid="settings-language-zh-CN"]'
- click: '[data-testid="settings-language-zh-CN"]'
- assert_localstorage:
    key: taomni.locale.v1
    contains: zh-CN
- click: '[data-testid="settings-language-en"]'
- assert_localstorage:
    key: taomni.locale.v1
    contains: en
- screenshot: i18n-language-switcher.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Language switcher cycles between English and Simplified Chinese：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 4
    - 8
    - 11
    - 13
    - 17
    - 19
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"status-bar\"]"}'
    - step: 3
      expectation: '{"assert_visible": "[data-testid=\"language-switcher\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 6
      expectation: '{"assert_visible": "[data-testid=\"language-option-en\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"language-option-zh-CN\"]"}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"context-menu\"]", "state": "detached", "timeout_sec":
        5}}'
    - step: 10
      expectation: '{"assert_localstorage": {"key": "taomni.locale.v1", "contains": "zh-CN"}}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"]"}'
    - step: 14
      expectation: '{"assert_visible": "[data-testid=\"settings-language-section\"]"}'
    - step: 15
      expectation: '{"assert_visible": "[data-testid=\"settings-language-en\"]"}'
    - step: 16
      expectation: '{"assert_visible": "[data-testid=\"settings-language-zh-CN\"]"}'
    - step: 18
      expectation: '{"assert_localstorage": {"key": "taomni.locale.v1", "contains": "zh-CN"}}'
    - step: 20
      expectation: '{"assert_localstorage": {"key": "taomni.locale.v1", "contains": "en"}}'
    results:
    - 20
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-auto-F-AI-2-4-grok-media-provider
title: Use the Grok ACP profile as an image and video provider
description: 'Enables the built-in locally authenticated Grok ACP profile, then verifies

  that image and video chat modes can select it and expose the local reference

  image attachment control. This case deliberately does not submit generation,

  so it never consumes a Grok quota or requires a configured xAI API key.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained.

  Browser local terminal output uses an explicit IPC preview fixture; native mode uses the real PTY backend.

  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions and
  decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries.'
covers:
- F-AI-2.4
tags:
- auto-generated
- smoke
- ai
- acp
- grok
- media
modes:
- browser
fixtures:
- reset_db
- local_terminal_preview
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-ai"]'
- wait_for: '[data-testid="acp-settings"]'
- click: '[data-testid="acp-bridge-enabled"]'
- click: '[data-testid="acp-save"]'
- click: '[data-testid="tab-item"][data-tab-id="welcome"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- click: '[data-testid="ai-chat-drawer-ribbon"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="chat-mode-image"]'
- wait_for: select[aria-label="Thread LLM provider"]
- select_option:
    selector: select[aria-label="Thread LLM provider"]
    value: acp:grok
- assert_attribute:
    selector: select[aria-label="Thread LLM provider"]
    name: value
    equals: acp:grok
- assert_visible: '[data-testid="ai-chat-attach-button"]'
- click: '[data-testid="chat-mode-video"]'
- wait_for: select[aria-label="Thread LLM provider"]
- select_option:
    selector: select[aria-label="Thread LLM provider"]
    value: acp:grok
- assert_attribute:
    selector: select[aria-label="Thread LLM provider"]
    name: value
    equals: acp:grok
- assert_visible: '[data-testid="ai-chat-attach-button"]'
- screenshot: ai-grok-media-provider.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 保存启用的 ACP bridge 后，Tao 图片会话可选 Grok，选择值准确且支持附件入口。
    actions:
    - 3
    - 5
    - 7
    - 8
    - 9
    - 10
    - 12
    - 14
    - 16
    checkpoints:
    - step: 17
      expectation: 图片会话 provider 精确为 acp:grok。
    - step: 18
      expectation: 图片会话附件入口可见。
    results:
    - 17
    - 18
  - id: R2
    requirement: 同一 Tao 切到视频模式后仍能选择 Grok 并使用附件入口。
    actions:
    - 19
    - 21
    checkpoints:
    - step: 22
      expectation: 视频会话 provider 精确为 acp:grok。
    - step: 23
      expectation: 视频会话附件入口可见。
    results:
    - 22
    - 23
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

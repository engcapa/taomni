    - step: 4
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"acp-settings\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"ai-chat-drawer\"]"}'
    - step: 15
      expectation: '{"wait_for": "select[aria-label=\"Thread LLM provider\"]"}'
    - step: 17
      expectation: '{"assert_attribute": {"selector": "select[aria-label=\"Thread LLM provider\"]", "name": "value",
        "equals": "acp:grok"}}'
    - step: 18
      expectation: '{"assert_visible": "[data-testid=\"ai-chat-attach-button\"]"}'
    - step: 20

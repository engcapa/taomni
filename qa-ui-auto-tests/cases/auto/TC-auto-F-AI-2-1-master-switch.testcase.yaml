id: TC-auto-F-AI-2-1
title: AI master switch + privacy toggle render in Settings
description: 'F-AI-2.1 closes the gap by exercising the two top-level AI privacy controls.

  The "Disable AI completely" row is interactive (clickable container that

  toggles `aiStore.config.fully_disabled`); the "Full local mode" row only

  renders when AI is enabled, so we assert it as soft-optional.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained.

  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions and
  decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries.'
covers:
- F-AI-2.1
tags:
- auto-generated
- ai
- settings
- p2
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-ai"]'
- assert_visible: text="Disable AI completely"
- assert_visible: '[data-testid="ai-master-switch"]'
- click: '[data-testid="ai-master-switch"]'
- wait_for:
    selector: '[data-testid="ptt-button"]'
    state: detached
    timeout_sec: 10
- click: '[data-testid="ai-master-switch"]'
- wait_for:
    selector: '[data-testid="ptt-button"]'
    timeout_sec: 10
- screenshot: ai-2-1-master-switch.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Settings 的 AI 总开关可达，关闭后托盘麦克风移除，再启用后恢复。
    actions:
    - 3
    - 5
    - 8
    - 10
    checkpoints:
    - step: 6
      expectation: 禁用 AI 文案可见。
    - step: 7
      expectation: 总开关可见。
    - step: 9
      expectation: 关闭后的 PTT 已从 DOM 移除。
    - step: 11
      expectation: 重新启用后 PTT 恢复可见。
    results:
    - 6
    - 7
    - 9
    - 11
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-auto-F6-3
title: Session editor switches sections and accepts every advanced/network/bookmark field
description: 'Auto-generated focused coverage for F6.3 (SessionEditor). Walks the

  four section tabs (advanced / terminal / network / bookmark) by

  clicking each session-section-* tab, then fills the previously

  uncovered network and bookmark inputs (proxy port/user/password,

  keep-alive interval, background image/opacity, additional parameters,

  keyboard shortcut). Closes without saving — TC-016 / TC-003 already

  cover the persist path.

  '
covers:
- F6.3
tags:
- auto-generated
- smoke
- p1
- sessions
- session-editor
- needs-review
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_visible: '[data-testid="advanced-ssh-settings"]'
- click: '[data-testid="session-section-terminal"]'
- wait_for: '[data-testid="terminal-settings"]'
- assert_visible: '[data-testid="terminal-settings"]'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- select_option:
    selector: '[data-testid="network-settings"] select'
    value: http
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: http
- fill:
    selector: input[aria-label="Proxy host"]
    value: proxy.example.test
- assert_attribute:
    selector: input[aria-label="Proxy host"]
    name: value
    equals: proxy.example.test
- fill:
    selector: input[aria-label="Proxy port"]
    value: '3128'
- assert_attribute:
    selector: input[aria-label="Proxy port"]
    name: value
    equals: '3128'
- fill:
    selector: input[aria-label="Proxy username"]
    value: qa-user
- assert_attribute:
    selector: input[aria-label="Proxy username"]
    name: value
    equals: qa-user
- fill:
    selector: input[aria-label="Proxy password"]
    value: qa-pass
- assert_attribute:
    selector: input[aria-label="Proxy password"]
    name: type
    equals: password
- fill:
    selector: input[aria-label="Keep-alive interval"]
    value: '30'
- assert_attribute:
    selector: input[aria-label="Keep-alive interval"]
    name: value
    equals: '30'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: input[aria-label="Background image"]
    value: /tmp/bg.png
- assert_attribute:
    selector: input[aria-label="Background image"]
    name: value
    equals: /tmp/bg.png
- fill:
    selector: input[aria-label="Background opacity"]
    value: '0.6'
- assert_attribute:
    selector: input[aria-label="Background opacity"]
    name: value
    equals: '0.6'
- fill:
    selector: input[aria-label="Keyboard shortcut"]
    value: Ctrl+Alt+S
- assert_attribute:
    selector: input[aria-label="Keyboard shortcut"]
    name: value
    equals: Ctrl+Alt+S
- click: '[data-testid="session-proto-file"]'
- wait_for: input[aria-label="Additional parameters"]
- fill:
    selector: input[aria-label="Additional parameters"]
    value: --verbose
- assert_attribute:
    selector: input[aria-label="Additional parameters"]
    name: value
    equals: --verbose
- press: Escape
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 5
- screenshot: F6.3-session-editor-sections.png

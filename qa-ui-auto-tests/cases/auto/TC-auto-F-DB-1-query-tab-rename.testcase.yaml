id: TC-auto-F-DB-1-query-tab-rename
title: Query tab rename updates the label and the browser query-workspace stub
description: 'Opens the offline MySQL session scaffold, renames the active query tab via

  double-click, verifies the browser query-workspace stub stores the custom name,

  then exercises the context-menu rename entry and Escape cancellation. Page

  reload restore is intentionally out of scope here: the reset_db init script

  clears taomni.sessions.v1 on every navigation, so the workspace cannot be

  re-opened after a reload; that path is covered by the Vitest workspace-restore

  test and the native manual verification.

  '
covers:
- F-DB-1
tags:
- auto-generated
- database
- sql
- query-tab
- rename
- persistence
- no-connect
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- wait_for: '[data-testid="sidebar"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: db-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '3306'
- fill:
    selector: input[aria-label="Database username"]
    value: qa_user
- fill:
    selector: input[aria-label="Database name"]
    value: qa_db
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-rename
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-rename"]'
- open_session:
    name: qa-ui-auto-rename
    double_click: true
- wait_for: '[data-testid="db-connection-error-banner"]'
- wait_for: '[data-testid="db-query-tab"]'
- dblclick: '[data-testid="db-query-tab"]'
- wait_for: '[data-testid="db-query-tab-input"]'
- fill:
    selector: '[data-testid="db-query-tab-input"]'
    value: qa-rename-orders
- press: Enter
- assert_text:
    selector: '[data-testid="db-query-tab"]'
    contains: qa-rename-orders
- wait: 1.5s
- assert_localstorage:
    key: taomni.stub.dbQueryWorkspaces.v1
    contains: qa-rename-orders
- right_click: '[data-testid="db-query-tab"]'
- assert_menu_items:
  - Rename tab
- click_menu: Rename tab
- wait_for: '[data-testid="db-query-tab-input"]'
- fill:
    selector: '[data-testid="db-query-tab-input"]'
    value: should-be-cancelled
- press: Escape
- assert_text:
    selector: '[data-testid="db-query-tab"]'
    contains: qa-rename-orders
- screenshot: db-query-tab-rename.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Navigate from Home to Sessions, save and open the fixture MySQL bookmark, and reach the
      declared offline connection banner.
    actions:
    - 1
    - 2
    - 5
    - 7
    - 9
    - 10
    - 11
    - 12
    - 13
    - 15
    - 16
    - 18
    checkpoints:
    - step: 3
      expectation: the Sessions Navigator is visible.
    - step: 4
      expectation: the New session control is visible.
    - step: 6
      expectation: the session editor is visible.
    - step: 8
      expectation: the MySQL settings is visible.
    - step: 14
      expectation: the bookmark editor is visible.
    - step: 17
      expectation: The fixture session or saved query is visible at [data-testid="session-tree-item"][data-session-name="qa-ui-auto-rename"].
    - step: 19
      expectation: the expected offline connection banner is visible.
    results:
    - 3
    - 4
    - 6
    - 8
    - 14
    - 17
    - 19
  - id: R2
    requirement: Rename through double-click and persist qa-rename-orders in the preview workspace; open
      Rename from the menu and cancel with Escape while retaining the original custom label.
    actions:
    - 21
    - 23
    - 24
    - 28
    - 30
    - 32
    - 33
    checkpoints:
    - step: 20
      expectation: the query tab is visible.
    - step: 22
      expectation: the query rename input is visible.
    - step: 25
      expectation: '[data-testid="db-query-tab"] contains the required text ''qa-rename-orders''.'
    - step: 27
      expectation: Preview storage taomni.stub.dbQueryWorkspaces.v1 contains 'qa-rename-orders'.
    - step: 29
      expectation: The query tab menu exposes Rename tab.
    - step: 31
      expectation: the query rename input is visible.
    - step: 34
      expectation: '[data-testid="db-query-tab"] contains the required text ''qa-rename-orders''.'
    results:
    - 20
    - 22
    - 25
    - 27
    - 29
    - 31
    - 34
  visual:
  - check: Inspect SQL toolbar, result log or Query Library inside the current Shell for clipping and
      readable controls.
    method: manual
    reason: DOM assertions need a separate screenshot verdict.
  native:
  - check: Real database connection, execution and transaction effects
    method: not-applicable
    reason: This browser case explicitly uses offline IPC preview; paired native DB cases prove real SQL
      and transaction effects.

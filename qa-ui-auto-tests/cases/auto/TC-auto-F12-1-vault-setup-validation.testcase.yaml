id: TC-auto-F12-1-vault-setup-validation
title: Vault setup dialog validates password requirements
covers:
- F12.1
tags:
- auto-generated
- smoke
- vault
- validation
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tab-bar"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-security"]'
- wait_for: '[data-testid="vault-settings"]'
- assert_visible: '[data-testid="vault-settings"]'
- click: '[data-testid="vault-init-button"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: short
- assert_visible: '[data-testid="vault-setup-too-short"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: LongEnough1!
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: Different99!
- assert_visible: '[data-testid="vault-setup-mismatch"]'
- click: '[data-testid="vault-setup-cancel"]'
- wait: 0.5
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: empty
- screenshot: auto-F12-1-vault-setup-validation.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 原生 setup 拒绝过短/不一致密码，取消后 vault 保持 empty。
    actions:
    - 3
    - 5
    - 8
    - 10
    - 12
    - 13
    - 15
    checkpoints:
    - step: 11
      expectation: 短密码错误可见。
    - step: 14
      expectation: 确认密码不一致错误可见。
    - step: 17
      expectation: 取消后 vault 保持 empty。
    results:
    - 11
    - 14
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

id: TC-auto-F25-1
title: Code Workspace multilingual execution controls
description: 'Browser smoke for the capability-driven Code Workspace Build, Run, and

  Debug surfaces. It verifies the empty-workspace capability state, panel

  navigation, and persistence of all runtime/build/debug tool overrides.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained.

  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions and
  decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries.'
covers:
- F25.1
- F25.2
tags:
- auto-generated
- smoke
- code-workspace
modes:
- browser
fixtures:
- reset_db
timeout_sec: 60
steps:

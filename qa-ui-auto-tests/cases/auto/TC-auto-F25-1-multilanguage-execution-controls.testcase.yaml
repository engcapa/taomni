- press:
    selector: '[data-testid^="debug-function-breakpoint-condition-"]'
    key: Enter
- fill:
    selector: '[data-testid^="debug-function-breakpoint-hit-"]'
    value: '3'
- press:
    selector: '[data-testid^="debug-function-breakpoint-hit-"]'
    key: Enter
- assert_text:
    selector: '[data-testid="debug-function-breakpoint-row"]'
    contains: if ready
- assert_text:
    selector: '[data-testid="debug-function-breakpoint-row"]'
    contains: hit 3
- click: '[data-testid^="debug-function-breakpoint-remove-"]'
- assert_count:
    selector: '[data-testid="debug-function-breakpoint-row"]'
    equal: 0

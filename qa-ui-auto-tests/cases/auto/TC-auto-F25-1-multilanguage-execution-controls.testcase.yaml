- set_check:
    selector: '[data-testid^="debug-function-breakpoint-enabled-"]'
    checked: true
- click: '[data-testid^="debug-function-breakpoint-edit-"]'
- fill:
    selector: '[data-testid^="debug-function-breakpoint-condition-"]'

id: TC-auto-F1-5-tab-details-overlay
title: Tab hover details, large Sessions overview and active detach menu
description: 'Per-tab hover and Ctrl+Shift+H keep compact details. Ctrl+Shift+E and the toolbar open the large live overview; clicking a card activates that session. No Welcome or toolbar
  hover-preview button remains.'
covers:
- F1.5
tags:
- auto-generated
- smoke
- needs-review
- tabs
- terminal
modes:
- browser
fixtures:
- reset_db
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sessions-empty-state"]'
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- click: '[data-testid="new-local-terminal"]'
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 2
- hover: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
- wait_for: '[data-testid="tab-details-overlay"]'
- assert_count:
    selector: '[data-testid^="tab-details-card-"]'
    equal: 1
- hover: '[data-testid="terminal-pane"]:visible'
- assert_not_visible: '[data-testid="tab-details-overlay"]'
- press: Mod+Shift+H
- assert_count:
    selector: '[data-testid^="tab-details-card-"]'
    equal: 2
- press: Mod+Shift+H
- assert_not_visible: '[data-testid="tab-details-overlay"]'
- assert_count:
    selector: '[data-testid="tab-details-hover"]'
    equal: 0
- press: Mod+Shift+E
- wait_for: '[data-testid="tab-overview"][data-scope="sessions"]'
- assert_count:
    selector: '[data-testid="tab-overview-card"]'
    equal: 2
- assert_element_geometry:
    selector: '[data-testid="tab-overview"]'
    min_width: 900
    min_height: 600
- press: Escape
- assert_not_visible: '[data-testid="tab-overview"]'
- click: '[data-testid="tab-overview-trigger"]'
- click: '[data-testid="tab-overview-card"] >> nth=0'
- assert_attribute:
    selector: '[data-testid="tab-item"] >> nth=0'
    name: data-active
    equals: 'true'
- click: '[data-testid="tab-more"]'
- wait_for: '[data-testid="open-tabs-menu"]'
- assert_visible: '[data-testid="open-tabs-detach-active"]'
- screenshot: f1-5-tab-details-overlay.png
- click: '[data-testid="open-tabs-detach-active"]'
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 1
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 保留逐标签 hover、Ctrl+Shift+H 与分离菜单；大预览从快捷键和按钮打开，显示两个真实会话、可点击激活，Esc 可关闭。
    actions:
    - 1
    - 2
    - 4
    - 6
    - 8
    - 11
    - 13
    - 15
    - 18
    - 22
    - 24
    - 25
    - 27
    - 31
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"sessions-empty-state\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 7
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"]", "equal": 2}}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"tab-details-overlay\"]"}'
    - step: 10
      expectation: '{"assert_count": {"selector": "[data-testid^=\"tab-details-card-\"]", "equal": 1}}'
    - step: 12
      expectation: '{"assert_not_visible": "[data-testid=\"tab-details-overlay\"]"}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid^=\"tab-details-card-\"]", "equal": 2}}'
    - step: 16
      expectation: '{"assert_not_visible": "[data-testid=\"tab-details-overlay\"]"}'
    - step: 17
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-details-hover\"]", "equal": 0}}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"tab-overview\"][data-scope=\"sessions\"]"}'
    - step: 20
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-overview-card\"]", "equal": 2}}'
    - step: 21
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"tab-overview\"]", "min_width": 900, "min_height": 600}}'
    - step: 23
      expectation: '{"assert_not_visible": "[data-testid=\"tab-overview\"]"}'
    - step: 26
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tab-item\"] >> nth=0", "name": "data-active", "equals": "true"}}'
    - step: 28
      expectation: '{"wait_for": "[data-testid=\"open-tabs-menu\"]"}'
    - step: 29
      expectation: '{"assert_visible": "[data-testid=\"open-tabs-detach-active\"]"}'
    - step: 32
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"]", "equal": 1}}'
    results:
    - 3
    - 5
    - 7
    - 9
    - 10
    - 12
    - 14
    - 16
    - 17
    - 19
    - 20
    - 21
    - 23
    - 26
    - 28
    - 29
    - 32
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

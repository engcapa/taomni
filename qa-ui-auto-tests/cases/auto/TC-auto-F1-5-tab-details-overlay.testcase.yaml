id: TC-auto-F1-5-tab-details-overlay
title: Visible tab details overlay and active detach menu
description: Per-tab hover and Mod+Shift+H retain rich previews; the removed titlebar preview button is replaced
  by All tabs. The existing detach menu remains reachable.
covers:
- F1.5
tags:
- smoke
- tabs
- terminal
modes:
- browser
fixtures:
- reset_db
- local_terminal_preview
timeout_sec: 25
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tab-bar"]'
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 2
- assert_count:
    selector: '[data-testid="tab-item"]'
    min: 2
- hover: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
- wait_for: '[data-testid="tab-details-overlay"]'
- assert_count:
    selector: '[data-testid^="tab-details-card-"]'
    equal: 1
- hover: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_not_visible: '[data-testid="tab-details-overlay"]'
- press: Mod+Shift+H
- assert_count:
    selector: '[data-testid^="tab-details-card-"]'
    min: 2
- press: Mod+Shift+H
- assert_not_visible: '[data-testid="tab-details-overlay"]'
- click: '[data-testid="shell-overview-trigger"]'
- wait_for: '[data-testid="shell-overview"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    min: 2
- press: Escape
- click: '[data-testid="tab-more"]'
- wait_for: '[data-testid="open-tabs-menu"]'
- assert_visible: '[data-testid="open-tabs-detach-active"]'
- screenshot: f1-5-tab-details-overlay.png
- click: '[data-testid="open-tabs-detach-active"]'
- assert_not_visible: '[data-testid="open-tabs-menu"]'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 2

id: TC-auto-F-AI-2-7-acp-grok-settings
title: Configure the generic ACP bridge and Grok preset
description: 'Opens AI Settings, verifies the built-in Grok ACP profile, exercises both

  direct and application proxy policy, verifies the bridge/profile enable

  switches stay synchronized, changes the bounded request timeout, and saves.

  The case does not run the real Grok process or require xAI credentials.

  '
covers:
- F-AI-2.7
tags:
- auto-generated
- smoke
- needs-review
- settings
- acp
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="ribbon-settings"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-ai"]'
- wait_for: '[data-testid="acp-settings"]'
- assert_visible: '[data-testid="acp-settings"]'
- assert_visible: '[data-testid="acp-profile-grok"]'
- click: '[data-testid="acp-bridge-enabled"]'
- click: '[data-testid="acp-profile-grok-enabled"]'
- click: '[data-testid="acp-profile-grok-enabled"]'
- click: '[data-testid="acp-global-proxy-app"]'
- click: '[data-testid="acp-global-proxy-direct"]'
- fill:
    selector: '[data-testid="acp-request-timeout"]'
    value: '90'
- click: '[data-testid="acp-save"]'
- screenshot: ai-acp-grok-settings.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Configure the generic ACP bridge and Grok preset：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"ribbon-settings\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"acp-settings\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"acp-settings\"]"}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"acp-profile-grok\"]"}'
    results:
    - 6
    - 7
    - 8
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

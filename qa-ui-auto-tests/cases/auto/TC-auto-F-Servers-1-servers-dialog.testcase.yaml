id: TC-auto-F-Servers-1-servers-dialog
title: Local servers tab opens via route, selects a server, shows settings/console, and closes on Cancel
description: >-
  Coverage smoke for F-Servers-1 (Local servers manager). Migrated from the old
  detached OS window to an in-app single-instance tab (`tab-item[data-tab-type="servers"]`
  rendering `servers-tab-panel` / `servers-dialog`). Navigating `?servers=main`
  opens the tab inside the main workspace and Cancel closes the tab cleanly to
  the sessions empty state.
covers:
- F-Servers-1
tags:
- auto-generated
- smoke
- needs-review
- servers
- main
modes:
- browser
fixtures:
- reset_db
timeout_sec: 30
steps:
- open: ${cfg.app.base_url}?servers=main
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 30
- assert_visible: '[data-testid="servers-tab-panel"]'
- assert_visible: '[data-testid="tab-item"][data-tab-type="servers"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="servers"]'
    equal: 1
- assert_visible: '[data-testid="server-list"]'
- assert_visible: '[data-testid="server-settings"]'
- assert_visible: '[data-testid="server-row-ssh"]'
- click: '[data-testid="server-row-ssh"]'
- assert_visible: '[data-testid="server-row-ssh-start"]'
- click: '[data-testid="server-row-ssh-settings"]'
- wait: 0.2
- click: '[data-testid="server-row-http"]'
- wait: 0.2
- assert_visible: '[data-testid="server-settings"]'
- click: '[data-testid="server-row-rdp"]'
- wait: 0.2
- assert_visible: '[data-testid="server-settings"]'
- assert_visible: '[data-testid="server-log"]'
- assert_visible: '[data-testid="server-log-autoscroll"]'
- click: '[data-testid="server-log-autoscroll"]'
- assert_visible: '[data-testid="server-log-clear"]'
- screenshot: servers-1-dialog.png
- assert_visible: '[data-testid="servers-dialog-cancel"]'
- click: '[data-testid="servers-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    state: detached
    timeout_sec: 10
- assert_visible: '[data-testid="sessions-empty-state"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="servers"]'
    equal: 0
- assert_no_runtime_errors: null

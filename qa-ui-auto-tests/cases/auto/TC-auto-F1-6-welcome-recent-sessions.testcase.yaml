id: TC-auto-F1-6-welcome-recent-sessions
title: Welcome recent sessions restore and filter controls
description: 'Creates a saved LocalShell session, opens it once so last_connected_at is set,

  then verifies the Welcome recent-session history supports filtering, type

  filtering, sorting, selecting filtered rows, opening selected/filtered rows,

  session-tree reveal, session-tree-equivalent row context actions, and the

  history settings shortcut.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained.

  Browser local terminal output uses an explicit IPC preview fixture; native mode uses the real PTY backend.

  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions
  and decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries. Settings
  first changes the default value to 35 and verifies persistence, then restores 20 and verifies it again; filling
  an unchanged default alone cannot prove the change handler.'
covers:
- F1.6
- F11.1
tags:
- auto-generated
- smoke
- p1
- welcome
modes:
- browser
fixtures:
- reset_db
- local_terminal_preview
timeout_sec: 60
steps:

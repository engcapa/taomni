- wait_for: '[data-testid="settings-welcome-recent-session-limit"]'
- fill:
    selector: '[data-testid="settings-welcome-recent-session-limit"]'
    value: '35'
- assert_localstorage:
    key: taomni.welcomeRecentSessionLimit
    equals: '35'
- assert_value:
    selector: '[data-testid="settings-welcome-recent-session-limit"]'
    equals: '35'
- fill:
    selector: '[data-testid="settings-welcome-recent-session-limit"]'
    value: '20'
- assert_localstorage:
    key: taomni.welcomeRecentSessionLimit
    equals: '20'
- assert_value:
    selector: '[data-testid="settings-welcome-recent-session-limit"]'
    equals: '20'
- screenshot: F1.6-welcome-recent-sessions.png

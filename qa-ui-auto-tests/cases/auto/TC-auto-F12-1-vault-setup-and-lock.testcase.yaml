id: TC-auto-F12-1-vault-setup-and-lock
title: Credential vault setup, lock, and unlock lifecycle
covers:
- F12.1
tags:
- auto-generated
- smoke
- vault
- security
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tab-bar"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-security"]'
- wait_for: '[data-testid="vault-settings"]'
- assert_visible: '[data-testid="vault-settings"]'
- assert_visible: '[data-testid="vault-state-badge"]'
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: empty
- click: '[data-testid="vault-init-button"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: TestPass123!
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: TestPass123!
- click: '[data-testid="vault-setup-confirm"]'
- wait: 1
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: unlocked
- assert_visible: '[data-testid="vault-lock-button"]'
- assert_visible: '[data-testid="vault-change-master-button"]'
- assert_visible: '[data-testid="vault-entries-section"]'
- click: '[data-testid="vault-lock-button"]'
- wait: 0.5
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: locked
- assert_visible: '[data-testid="vault-unlock-button"]'
- click: '[data-testid="vault-unlock-button"]'
- wait_for: '[data-testid="vault-unlock-dialog"]'
- fill:
    selector: '[data-testid="vault-unlock-pw"]'
    value: TestPass123!
- click: '[data-testid="vault-unlock-confirm"]'
- wait: 1
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: unlocked
- screenshot: auto-F12-1-vault-lifecycle.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 原生 empty vault 的 Settings setup 可初始化为 unlocked，entries 和后续管理入口可见。
    actions:
    - 3
    - 5
    - 10
    - 12
    - 13
    - 14
    checkpoints:
    - step: 9
      expectation: 初始 vault 状态为 empty。
    - step: 16
      expectation: 初始化后为 unlocked。
    - step: 17
      expectation: lock 入口可见。
    - step: 18
      expectation: change master 入口可见。
    - step: 19
      expectation: entries section 可见。
    results:
    - 9
    - 16
    - 17
    - 18
    - 19
  - id: R2
    requirement: 通过用户 lock 后 vault 为 locked；使用正确 master password 解锁后恢复 unlocked。
    actions:
    - 20
    - 24
    - 26
    - 27
    checkpoints:
    - step: 22
      expectation: lock 后状态为 locked。
    - step: 23
      expectation: unlock 入口可见。
    - step: 29
      expectation: 正确密码解锁后为 unlocked。
    results:
    - 22
    - 23
    - 29
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。
description: '

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings

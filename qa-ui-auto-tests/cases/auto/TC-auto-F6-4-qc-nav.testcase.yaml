id: TC-auto-F6-4
title: Quick connect bar exposes navigation controls (back / forward / home / refresh)
description: 'Auto-generated focused coverage for F6.4 (QuickConnect). Asserts the

  four navigation buttons mount alongside the address input, then clicks

  each. Back/forward call window.history (no-op when no history is

  loaded), home calls onHome (returns to welcome). Refresh button on the

  far right of the bar reloads sessions; we click it and assert the

  panel still renders. None of these are destructive so all four can

  fire in one case.

  '
covers:
- F6.4
tags:
- auto-generated
- smoke
- p1
- sessions
- quickconnect
- needs-review
modes:
- browser
fixtures:
- reset_db
timeout_sec: 30
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="quick-connect"]'
- assert_visible: '[data-testid="qc-back"]'
- assert_visible: '[data-testid="qc-forward"]'
- hover: '[data-testid="qc-back"]'
- hover: '[data-testid="qc-forward"]'
- assert_visible: '[data-testid="qc-home"]'
- assert_visible: '[data-testid="qc-refresh"]'
- click: '[data-testid="qc-home"]'
- wait: 0.3
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="qc-refresh"]'
- wait: 0.5
- assert_visible: '[data-testid="quick-connect"]'
- screenshot: F6.4-qc-nav.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Quick connect bar exposes navigation controls (back / forward / home / refresh)：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 4
    - 8
    - 9
    - 12
    - 15
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"quick-connect\"]"}'
    - step: 6
      expectation: '{"assert_visible": "[data-testid=\"qc-back\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"qc-forward\"]"}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"qc-home\"]"}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"qc-refresh\"]"}'
    - step: 14
      expectation: '{"assert_visible": "[data-testid=\"welcome-panel\"]"}'
    - step: 17
      expectation: '{"assert_visible": "[data-testid=\"quick-connect\"]"}'
    results:
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

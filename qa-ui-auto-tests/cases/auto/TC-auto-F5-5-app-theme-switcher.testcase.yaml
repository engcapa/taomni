id: TC-auto-F5-5
title: Application theme switcher exposes Light / Dark / System preview options in settings
description: 'Auto-generated focused coverage for F5.5 (application theme). The

  AppThemeSwitcher renders a preview dropdown in the settings panel with

  option rows (data-testid="app-theme-{light,dark,system}"). TC-015 already exercises

  the title-bar tray cycle button — this case drives the explicit picker

  used inside the settings tab and verifies each click is honored by the

  document attribute and persisted to localStorage.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained.

  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions and
  decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries.'
covers:
- F5.5
tags:
- auto-generated
- smoke
- p1
- settings
- theme
modes:
- browser
fixtures:
- reset_db
timeout_sec: 30
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-general"]'
- assert_visible: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-select"]'
- assert_visible: '[data-testid="app-theme-light"]'
- assert_visible: '[data-testid="app-theme-dark"]'
- assert_visible: '[data-testid="app-theme-system"]'
- click: '[data-testid="app-theme-light"]'
- wait: 0.5
- eval_readonly:
    expression: document.documentElement.getAttribute("data-app-theme")
    contains: light
- click: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-dark"]'
- wait: 0.5
- eval_readonly:
    expression: document.documentElement.getAttribute("data-app-theme")
    contains: dark
- click: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-system"]'
- wait: 0.5
- assert_localstorage:
    key: taomni.appTheme.v1
    exists: true
- assert_localstorage:
    key: taomni.appTheme.v1
    equals: system
- eval_readonly:
    expression: 'Object.is(document.documentElement.getAttribute("data-app-theme"), window.matchMedia("(prefers-color-scheme:
      dark)").matches ? "dark" : "light")'
    expect_truthy: true
- screenshot: F5.5-theme-switcher.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Settings general 保留 Light/Dark/System；Light 和 Dark 分别应用对应主题。
    actions:
    - 3
    - 5
    - 7
    - 11
    - 14
    - 15
    checkpoints:
    - step: 8
      expectation: Light 选项可见。
    - step: 9
      expectation: Dark 选项可见。
    - step: 10
      expectation: System 选项可见。
    - step: 13
      expectation: Light 选择后 document theme 为 light。
    - step: 17
      expectation: Dark 选择后 document theme 为 dark。
    results:
    - 8
    - 9
    - 10
    - 13
    - 17
  - id: R2
    requirement: System 选择实际保存 system，并按 OS media query 解析主题。
    actions:
    - 18
    - 19
    checkpoints:
    - step: 21
      expectation: theme preference 已保存。
    - step: 22
      expectation: 保存值精确为 system。
    - step: 23
      expectation: resolved theme 与 OS media query 一致。
    results:
    - 21
    - 22
    - 23
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

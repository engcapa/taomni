id: TC-auto-F12-1-vault-change-master
title: Vault change master password form validates and updates
covers:
- F12.1
tags:
- auto-generated
- smoke
- vault
- security
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tab-bar"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-security"]'
- wait_for: '[data-testid="vault-settings"]'
- assert_visible: '[data-testid="vault-settings"]'
- click: '[data-testid="vault-init-button"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: OldPass123!
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: OldPass123!
- click: '[data-testid="vault-setup-confirm"]'
- wait: 1
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: unlocked
- click: '[data-testid="vault-change-master-button"]'
- wait_for: '[data-testid="vault-change-master-form"]'
- assert_visible: '[data-testid="vault-change-master-old"]'
- assert_visible: '[data-testid="vault-change-master-new1"]'
- assert_visible: '[data-testid="vault-change-master-new2"]'
- fill:
    selector: '[data-testid="vault-change-master-old"]'
    value: OldPass123!
- fill:
    selector: '[data-testid="vault-change-master-new1"]'
    value: NewPass456!
- fill:
    selector: '[data-testid="vault-change-master-new2"]'
    value: NewPass456!
- click: '[data-testid="vault-change-master-submit"]'
- wait: 1
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: unlocked
- click: '[data-testid="vault-lock-button"]'
- assert_text_equals:
    selector: '[data-testid="vault-state-badge"]'
    equals: locked
- click: '[data-testid="vault-unlock-button"]'
- wait_for: '[data-testid="vault-unlock-dialog"]'
- fill:
    selector: '[data-testid="vault-unlock-pw"]'
    value: OldPass123!
- click: '[data-testid="vault-unlock-confirm"]'
- wait_for: '[data-testid="vault-unlock-error"]'
- assert_text_equals:
    selector: '[data-testid="vault-state-badge"]'
    equals: locked
- fill:
    selector: '[data-testid="vault-unlock-pw"]'
    value: NewPass456!
- click: '[data-testid="vault-unlock-confirm"]'
- wait_for:
    selector: '[data-testid="vault-unlock-dialog"]'
    state: detached
- assert_text_equals:
    selector: '[data-testid="vault-state-badge"]'
    equals: unlocked
- screenshot: auto-F12-1-vault-change-master.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 通过 Settings Security 创建原生 vault 并更换 master password，表单和 unlocked 状态保持。
    actions:
    - 3
    - 5
    - 8
    - 10
    - 11
    - 12
    - 15
    - 20
    - 21
    - 22
    - 23
    checkpoints:
    - step: 14
      expectation: 初始化后状态为 unlocked。
    - step: 17
      expectation: 旧密码输入可见。
    - step: 18
      expectation: 新密码输入可见。
    - step: 19
      expectation: 确认新密码输入可见。
    - step: 25
      expectation: 更改后保持 unlocked。
    results:
    - 14
    - 17
    - 18
    - 19
    - 25
  - id: R2
    requirement: 实际锁定后旧 master password 被拒绝且仍 locked；新密码可成功解锁并关闭对话框。
    actions:
    - 26
    - 28
    - 30
    - 31
    - 34
    - 35
    checkpoints:
    - step: 27
      expectation: 锁定后精确 locked。
    - step: 32
      expectation: 旧密码返回错误。
    - step: 33
      expectation: 旧密码失败后仍精确 locked。
    - step: 36
      expectation: 新密码成功后对话框卸载。
    - step: 37
      expectation: 新密码成功后精确 unlocked。
    results:
    - 27
    - 32
    - 33
    - 36
    - 37
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

id: TC-auto-F-DB-1-sql-session-scaffold
title: SQL session opens its offline query library and saves a query
description: 'Creates a MySQL session in browser mode, opens it into the expected offline

  state, and verifies that the SQL editor and shared Query Library remain

  available even though db_connect is unavailable. Saves a connection-scoped

  query through the browser SQLite stub and exercises namespace/search filters.

  '
covers:
- F-DB-1
- F-DB-4
- F6.3
tags:
- auto-generated
- smoke
- database
- sql
- query-library
- no-connect
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- wait_for: '[data-testid="sidebar"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 5
- assert_visible: '[data-testid="database-settings"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: db-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '3306'
- fill:
    selector: input[aria-label="Database username"]
    value: qa_user
- fill:
    selector: input[aria-label="Database name"]
    value: qa_db
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-mysql
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-mysql"]'
- open_session:
    name: qa-ui-auto-mysql
    double_click: true
- wait_for: '[data-testid="db-connection-error-banner"]'
- assert_visible: '[data-testid="sql-editor"]'
- click: '[data-testid="db-query-library-tab"]'
- wait_for: '[data-testid="query-library-panel"]'
- click: '[data-testid="query-library-all-namespaces"]'
- click: '[data-testid="query-library-current-namespace"]'
- set_check:
    selector: '[data-testid="query-library-show-archived"]'
    checked: true
- set_check:
    selector: '[data-testid="query-library-show-archived"]'
    checked: false
- click: '[data-testid="query-library-create"]'
- wait_for: '[data-testid="query-library-dialog"]'
- fill:
    selector: '[data-testid="query-library-name"]'
    value: qa-ui-auto-query
- fill:
    selector: '[data-testid="query-library-content"]'
    value: SELECT 42;
- select_option:
    selector: '[data-testid="query-library-scope"]'
    value: connection
- click: '[data-testid="query-library-save"]'
- wait_for: '[data-testid^="saved-query-"]'
- fill:
    selector: '[data-testid="query-library-search"]'
    value: qa-ui-auto-query
- assert_count:
    selector: '[data-testid^="saved-query-"]'
    equal: 1
- assert_text:
    selector: '[data-testid^="saved-query-"]'
    contains: qa-ui-auto-query
- assert_localstorage:
    key: taomni.stub.dbSavedQueries.v1
    contains: SELECT 42;
- screenshot: db-1-query-library.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Navigate from Home to Sessions, save and open the fixture MySQL bookmark, and reach the
      declared offline connection banner.
    actions:
    - 1
    - 2
    - 5
    - 7
    - 10
    - 11
    - 12
    - 13
    - 14
    - 16
    - 17
    - 19
    checkpoints:
    - step: 3
      expectation: the Sessions Navigator is visible.
    - step: 4
      expectation: the New session control is visible.
    - step: 6
      expectation: the session editor is visible.
    - step: 8
      expectation: the MySQL settings is visible.
    - step: 9
      expectation: the database options is visible.
    - step: 15
      expectation: the bookmark editor is visible.
    - step: 18
      expectation: The fixture session or saved query is visible at [data-testid="session-tree-item"][data-session-name="qa-ui-auto-mysql"].
    - step: 20
      expectation: the expected offline connection banner is visible.
    results:
    - 3
    - 4
    - 6
    - 8
    - 9
    - 15
    - 18
    - 20
  - id: R2
    requirement: The offline SQL editor keeps Query Library available; namespace/archive toggles and searching
      retain exactly one saved connection query with its complete SELECT 42 content in preview storage.
    actions:
    - 22
    - 24
    - 25
    - 26
    - 27
    - 28
    - 30
    - 31
    - 32
    - 33
    - 35
    checkpoints:
    - step: 21
      expectation: the complete SQL editor is visible.
    - step: 23
      expectation: the Query Library is visible.
    - step: 29
      expectation: the saved-query editor is visible.
    - step: 34
      expectation: The fixture session or saved query is visible at [data-testid^="saved-query-"].
    - step: 36
      expectation: Exactly 1 elements match [data-testid^="saved-query-"].
    - step: 37
      expectation: '[data-testid^="saved-query-"] contains the required text ''qa-ui-auto-query''.'
    - step: 38
      expectation: Preview storage taomni.stub.dbSavedQueries.v1 contains 'SELECT 42;'.
    results:
    - 21
    - 23
    - 29
    - 34
    - 36
    - 37
    - 38
  visual:
  - check: Inspect SQL toolbar, result log or Query Library inside the current Shell for clipping and
      readable controls.
    method: manual
    reason: DOM assertions need a separate screenshot verdict.
  native:
  - check: Real database connection, execution and transaction effects
    method: not-applicable
    reason: This browser case explicitly uses offline IPC preview; paired native DB cases prove real SQL
      and transaction effects.

id: TC-auto-F11-1-sql-completion-settings
title: SQL completion preferences persist and reset
description: 'Covers the searchable global settings surface and the SQL completion controls.

  Records a non-conflicting completion shortcut, changes automatic/accept behavior,

  verifies persistence, then restores the defaults. This does not require a live

  database because completion preferences are browser-local editor settings.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained.

  Semantic review for Shell v2: every original step is retained; requirements identify the actual user actions and
  decisive outcomes. Additional postconditions do not certify unexecuted OS/manual boundaries.'
covers:
- F11.1
tags:
- auto-generated
- smoke
- settings
- database
- sql
modes:
- browser
fixtures:
- reset_db
timeout_sec: 30
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: autocomplete
- assert_visible: '[data-testid="settings-search-count"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: no-such-setting
- assert_visible: '[data-testid="settings-search-empty"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: ''
- click: '[data-testid="settings-group-toggle-code"]'
- click: '[data-testid="settings-reset-code-view-profile"]'
- click: '[data-testid="settings-group-toggle-terminal"]'
- click: '[data-testid="settings-reset-terminal-default-profile"]'
- assert_visible: '[data-testid="sql-completion-settings"]'
- set_check:
    selector: '[data-testid="sql-completion-activate-on-typing"]'
    checked: false
- click: '[data-testid="sql-completion-trigger-shortcut"]'
- press:
    selector: '[data-testid="sql-completion-trigger-shortcut"]'
    key: F5
- assert_visible: '[data-testid="sql-completion-shortcut-error"]'
- press:
    selector: '[data-testid="sql-completion-trigger-shortcut"]'
    key: Alt+i
- set_check:
    selector: '[data-testid="sql-completion-accept-tab"]'
    checked: false
- set_check:
    selector: '[data-testid="sql-completion-accept-tab"]'
    checked: true
- set_check:
    selector: '[data-testid="sql-completion-accept-enter"]'
    checked: false
- assert_localstorage:
    key: taomni.sqlCompletionPreferences.v1
    contains: '"triggerShortcut":"Alt-i"'
- assert_localstorage:
    key: taomni.sqlCompletionPreferences.v1
    contains: '"activateOnTyping":false'
- assert_localstorage:
    key: taomni.sqlCompletionPreferences.v1
    contains: '"acceptWithEnter":false'
- click: '[data-testid="sql-completion-reset"]'
- assert_localstorage:
    key: taomni.sqlCompletionPreferences.v1
    equals: '{"activateOnTyping":true,"triggerShortcut":"Ctrl-Space","acceptWithTab":true,"acceptWithEnter":true}'
- screenshot: F11.1-sql-completion-settings.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Settings 搜索命中/无命中准确；重置视图配置后 SQL completion 配置可达。
    actions:
    - 3
    - 5
    - 7
    - 9
    - 10
    - 11
    - 12
    - 13
    checkpoints:
    - step: 6
      expectation: 命中计数可见。
    - step: 8
      expectation: 无命中空状态可见。
    - step: 14
      expectation: SQL completion 配置可见。
    results:
    - 6
    - 8
    - 14
  - id: R2
    requirement: 冲突 F5 被拒绝；Alt-i、typing 和 accept 参数持久化，reset 恢复完整默认 JSON。
    actions:
    - 15
    - 16
    - 17
    - 19
    - 20
    - 21
    - 22
    - 26
    checkpoints:
    - step: 18
      expectation: F5 快捷键错误可见。
    - step: 23
      expectation: triggerShortcut 为 Alt-i。
    - step: 24
      expectation: activateOnTyping 为 false。
    - step: 25
      expectation: acceptWithEnter 为 false。
    - step: 27
      expectation: reset 后完整 JSON 精确等于默认四项。
    results:
    - 18
    - 23
    - 24
    - 25
    - 27
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-auto-F-Detach-1-terminal-detach
title: Terminal floating toolbar exposes maximize + detach-to-window controls
description: 'Coverage smoke for F-Detach-1 (generic detach/reattach). Opens a local

  terminal and verifies the floating toolbar exposes the in-window maximize

  toggle and the detach-to-window button.


  Maximize is non-destructive, so it is toggled (on then off) and asserted.

  Detach is the LAST action: in browser mode it falls back to window.open

  and drops the source tab (same destructive pattern as TC-043/TC-111), so

  nothing is asserted after it. The detached-window shell + reattach controls

  (detached-session-window / detached-reattach / detached-os-fullscreen) only

  mount inside a real detached window and are left to native/manual regression.

  '
covers:
- F-Detach-1
tags:
- auto-generated
- smoke
- needs-review
- terminal
- detach
- window
modes:
- browser
fixtures:
- reset_db
timeout_sec: 30
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 15
- wait_for:
    selector: '[data-testid="terminal-detach"]'
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-detach"]'
- screenshot: detach-1-terminal-toolbar.png
- click: '[data-testid="terminal-detach"]'
- wait: 1
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Terminal floating toolbar exposes maximize + detach-to-window controls：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-pane\"]", "timeout_sec": 15}}'
    - step: 5
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-detach\"]", "timeout_sec": 5}}'
    - step: 6
      expectation: '{"assert_visible": "[data-testid=\"terminal-detach\"]"}'
    results:
    - 4
    - 5
    - 6
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

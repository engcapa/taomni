id: TC-auto-F1-5-tab-launch-menu
title: Tab bar split-button quick-launch menu opens the session editor
description: 'Coverage smoke for F1.5''s "+ ▾" split-button quick launch (Windows

  Terminal style). Clicks the chevron to open the launch context menu,

  asserts the menu surface + the "New session…" leaf are visible, then

  clicks it to confirm the route into the SessionEditor.


  The shell entries (launch-menu-shell-<id>) and recent-session entries

  (launch-menu-recent-<id>) are dynamic and host-dependent, so this case

  exercises the stable launch-menu-new-session leaf only.

  '
covers:
- F1.5
tags:
- auto-generated
- smoke
- needs-review
- tabs
- launch-menu
modes:
- browser
fixtures:
- reset_db
timeout_sec: 25
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tab-bar"]'
- assert_visible: '[data-testid="new-tab-split"]'
- assert_visible: '[data-testid="new-local-terminal"]'
- click: '[data-testid="new-tab-launch-menu"]'
- wait_for:
    selector: '[data-testid="context-menu"]'
    timeout_sec: 5
- assert_visible: '[data-testid="launch-menu-new-session"]'
- click: '[data-testid="launch-menu-new-session"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    timeout_sec: 5
- assert_visible: '[data-testid="session-editor"]'
- screenshot: f1-5-launch-menu.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tab bar split-button quick-launch menu opens the session editor：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 5
    - 8
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"tab-bar\"]"}'
    - step: 3
      expectation: '{"assert_visible": "[data-testid=\"new-tab-split\"]"}'
    - step: 4
      expectation: '{"assert_visible": "[data-testid=\"new-local-terminal\"]"}'
    - step: 6
      expectation: '{"wait_for": {"selector": "[data-testid=\"context-menu\"]", "timeout_sec": 5}}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"launch-menu-new-session\"]"}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"session-editor\"]", "timeout_sec": 5}}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"session-editor\"]"}'
    results:
    - 9
    - 10
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

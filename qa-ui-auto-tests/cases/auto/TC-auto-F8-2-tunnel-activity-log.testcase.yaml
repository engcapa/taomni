id: TC-auto-F8-2-tunnel-activity-log
title: Tunnel manager activity log expands and exposes the clear control
description: 'Coverage smoke for F8.2''s tunnel activity log (added in the v0.1.34

  tunnel row/log work). Opens the tunnel manager, asserts the activity-log

  panel renders at the footer, toggles it open, and asserts the clear

  button appears. With no tunnel events the clear button is disabled, so

  the case asserts presence + disabled state rather than clicking it.

  '
covers:
- F8.2
tags:
- auto-generated
- smoke
- needs-review
- tunnel
- activity-log
modes:
- browser
fixtures:
- reset_db
timeout_sec: 30
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="app-main-menu"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-tunneling"]'
- wait_for: '[data-testid="tunnel-manager"]'
- assert_visible: '[data-testid="tunnel-activity-log"]'
- assert_visible: '[data-testid="tunnel-activity-log-toggle"]'
- click: '[data-testid="tunnel-activity-log-toggle"]'
- wait_for:
    selector: '[data-testid="tunnel-activity-log-clear"]'
    timeout_sec: 5
- assert_visible: '[data-testid="tunnel-activity-log-clear"]'
- assert_disabled: '[data-testid="tunnel-activity-log-clear"]'
- click: '[data-testid="tunnel-activity-log-toggle"]'
- assert_not_visible: '[data-testid="tunnel-activity-log-clear"]'
- screenshot: f8-2-activity-log.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tunnel manager activity log expands and exposes the clear control：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 4
    - 5
    - 9
    - 13
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"app-main-menu\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"tunnel-manager\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"tunnel-activity-log\"]"}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"tunnel-activity-log-toggle\"]"}'
    - step: 10
      expectation: '{"wait_for": {"selector": "[data-testid=\"tunnel-activity-log-clear\"]", "timeout_sec": 5}}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"tunnel-activity-log-clear\"]"}'
    - step: 12
      expectation: '{"assert_disabled": "[data-testid=\"tunnel-activity-log-clear\"]"}'
    - step: 14
      expectation: '{"assert_not_visible": "[data-testid=\"tunnel-activity-log-clear\"]"}'

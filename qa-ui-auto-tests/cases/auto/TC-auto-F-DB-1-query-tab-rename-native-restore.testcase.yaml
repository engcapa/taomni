id: TC-auto-F-DB-1-query-tab-rename-native-restore
title: Native restart restores the renamed query tab from the SQLite workspace
description: 'App restart half of the native rename verification. Runs after

  TC-auto-F-DB-1-query-tab-rename-native in the same invocation: a fresh QA

  process unlocks the vault at startup, restores the last session from the

  Welcome panel, and asserts the custom query tab name persisted by the first

  case. Does not reset app state because it only reads the persisted workspace.

  Cross-platform native target (Linux, macOS, Windows).

  '
covers:
- F-DB-1
tags:
- database
- sql
- query-tab
- rename
- persistence
- native-boundary
- needs-review
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- mysql_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="vault-unlock-pw"]'
    timeout_sec: 30
- fill:
    selector: '[data-testid="vault-unlock-pw"]'
    value: qa-native-rename-master
- click: '[data-testid="vault-unlock-confirm"]'
- assert_not_visible: '[data-testid="vault-unlock-dialog"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for:
    selector: '[data-testid="db-query-tab"]'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="db-query-tab"]'
    contains: native-orders
- click: '[data-testid="db-query-history-toggle"]'
- wait_for:
    selector: '[data-testid="db-query-history-entry"]'
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="db-query-history-entry-name"]'
    contains: native-orders
- screenshot: native-query-tab-rename-restored.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Native restart restores the renamed query tab from the SQLite workspace：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 4
    - 7
    - 10
    checkpoints:
    - step: 2
      expectation: '{"wait_for": {"selector": "[data-testid=\"vault-unlock-pw\"]", "timeout_sec": 30}}'
    - step: 5
      expectation: '{"assert_not_visible": "[data-testid=\"vault-unlock-dialog\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 8
      expectation: '{"wait_for": {"selector": "[data-testid=\"db-query-tab\"]", "timeout_sec": 60}}'
    - step: 9
      expectation: '{"assert_text": {"selector": "[data-testid=\"db-query-tab\"]", "contains": "native-orders"}}'
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"db-query-history-entry\"]", "timeout_sec": 30}}'
    - step: 12
      expectation: '{"assert_text": {"selector": "[data-testid=\"db-query-history-entry-name\"]", "contains": "native-orders"}}'
    results:
    - 11
    - 12
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

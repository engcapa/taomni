id: TC-022
title: Terminal macro records keystrokes and replays via Ctrl+Space
covers:
- F4.4
tags:
- legacy-imported
- macro
- p1
- terminal
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]:is([data-terminal-ready="true"], [data-terminal-text*="SSH disconnected"], [data-terminal-text*="Press Enter to retry"])'
    timeout_sec: 60
- click: '[data-testid="terminal-pane"]'
- press: Enter
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- right_click:
    selector: '[data-testid="terminal-pane"]'
    position:
      x: 24
      y: 24
- wait_for: '[data-testid="context-menu"]'
- click: text="Record new macro"
- wait: 1
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo qa-macro-payload
    submit: true
- wait: 1
- right_click:
    selector: '[data-testid="terminal-pane"]'
    position:
      x: 24
      y: 24
- wait_for: '[data-testid="context-menu"]'
- assert_visible: text="Stop macro recording"
- click: text="Stop macro recording"
- wait: 1
- click: '[data-testid="terminal-pane"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 20
- eval_readonly:
    expression: (document.querySelector('[data-terminal-text]').getAttribute("data-terminal-text").match(/^qa-macro-payload\r?$/gm)
      || []).length === 1
    expect_truthy: true
- press: Control+Space
- wait: 1
- eval_readonly:
    expression: (document.querySelector('[data-terminal-text]').getAttribute("data-terminal-text").match(/^qa-macro-payload\r?$/gm)
      || []).length === 2
    expect_truthy: true
- screenshot: 022-terminal-macro.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 录制一次命令、停止录制后快捷键回放，独立输出行从一次增加到恰好两次
    actions:
    - 18
    - 20
    - 25
    - 30
    checkpoints:
    - step: 15
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"][data-terminal-ready=\"true\"]", "timeout_sec": 60}}'
    - step: 24
      expectation: '{"assert_visible": "text=\"Stop macro recording\""}'
    - step: 29
      expectation: '{"eval_readonly": {"expression": "(document.querySelector(''[data-terminal-text]'').getAttribute(\"data-terminal-text\").match(/^qa-macro-payload\\r?$/gm)
        || []).length === 1", "expect_truthy": true}}'
    - step: 32
      expectation: '{"eval_readonly": {"expression": "(document.querySelector(''[data-terminal-text]'').getAttribute(\"data-terminal-text\").match(/^qa-macro-payload\\r?$/gm)
        || []).length === 2", "expect_truthy": true}}'
    results:
    - 32
  visual:
  - check: 检查最终截图中的编辑器/菜单/状态反馈无遮挡和溢出；截图本身不是视觉通过。
    method: manual
    reason: 没有自动像素基准；需结合实际截图记录评审。
  native:
  - check: 本用例只验证浏览器渲染交互；系统级输入、桌面窗口与真实持久化需独立 native 验证。
    method: external
    reason: 按实际执行模式与指定边界解释证据。

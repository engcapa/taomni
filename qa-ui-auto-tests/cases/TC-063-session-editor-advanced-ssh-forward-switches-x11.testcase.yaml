id: TC-063
title: Session editor advanced SSH forward switches (X11, compression, OSC 7)
covers:
- F3.2
- F6.3
tags:
- advanced
- legacy-imported
- p1
- session
- ssh
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- send_text_via_label:
    label_contains: Specify username
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- assert_visible: '[data-testid="advanced-ssh-settings"]'
- click: '[data-testid="advanced-ssh-settings"] input[type="checkbox"]'
- wait: 1
- send_text_via_label:
    label_contains: Use SSH compression
    checked: true
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-adv-switches
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-adv-switches"]'
- screenshot: 063-session-advanced-forward-switches.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Session editor advanced SSH forward switches (X11, compression, OSC 7)：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 8
    - 10
    - 12
    - 13
    - 15
    - 16
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"advanced-ssh-settings\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-adv-switches\"]"}'
    results:
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

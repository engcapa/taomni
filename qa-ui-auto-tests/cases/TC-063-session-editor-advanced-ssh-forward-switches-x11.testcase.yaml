id: TC-063
title: SSH session editor controls X11 forwarding and persists advanced options
covers:
- F3.2
- F6.3
tags:
- advanced
- p1
- session
- ssh
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-advanced-settings.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-advanced-user
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'true'
- assert_enabled: '[data-testid="session-x11-trusted-toggle"]'
- assert_attribute:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    name: data-checked
    equals: 'true'
- set_check:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'false'
- assert_disabled: '[data-testid="session-x11-trusted-toggle"]'
- set_check:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    checked: true
- assert_enabled: '[data-testid="session-x11-trusted-toggle"]'
- set_check:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    checked: false
- set_check:
    selector: '[data-testid="session-compression-toggle"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-compression-toggle"]'
    name: data-checked
    equals: 'true'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-advanced-settings
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-advanced-settings"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-advanced-settings"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-compression-toggle"]'
    name: data-checked
    equals: 'true'
- screenshot: 063-ssh-session-advanced-settings.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Disabling X11 forwarding disables trusted forwarding, and enabling X11 restores the trusted-forwarding control.
    actions:
    - 11
    - 16
    - 19
    checkpoints:
    - step: 14
      expectation: '{"assert_enabled": "[data-testid=\"session-x11-trusted-toggle\"]"}'
    - step: 15
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-x11-trusted-toggle\"]", "name": "data-checked", "equals": "true"}}'
    - step: 17
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-x11-forwarding-toggle\"]", "name": "data-checked", "equals": "false"}}'
    - step: 18
      expectation: '{"assert_disabled": "[data-testid=\"session-x11-trusted-toggle\"]"}'
    - step: 20
      expectation: '{"assert_enabled": "[data-testid=\"session-x11-trusted-toggle\"]"}'
    results:
    - 17
    - 18
    - 20
  - id: R2
    requirement: X11 forwarding, trusted mode, and SSH compression values persist when the bookmark is reopened for editing.
    actions:
    - 22
    - 26
    - 28
    - 29
    - 30
    - 31
    - 32
    - 34
    checkpoints:
    - step: 23
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-x11-forwarding-toggle\"]", "name": "data-checked", "equals": "true"}}'
    - step: 24
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-x11-trusted-toggle\"]", "name": "data-checked", "equals": "false"}}'
    - step: 25
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-compression-toggle\"]", "name": "data-checked", "equals": "true"}}'
    - step: 30
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-ssh-advanced-settings\"]"}'
    - step: 33
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 35
      expectation: '{"wait_for": "[data-testid=\"advanced-ssh-settings\"]"}'
    - step: 36
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-x11-forwarding-toggle\"]", "name": "data-checked", "equals": "true"}}'
    - step: 37
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-x11-trusted-toggle\"]", "name": "data-checked", "equals": "false"}}'
    - step: 38
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-compression-toggle\"]", "name": "data-checked", "equals": "true"}}'
    results:
    - 23
    - 24
    - 25
    - 36
    - 37
    - 38
  visual:
  - check: The advanced SSH editor shows the X11 forwarding, trusted-mode, and compression controls without clipping or overlap.
    method: manual
    reason: Functional assertions do not assess field layout or text clipping.
  native:
  - check: The packaged session database restores X11 and compression settings after saving and reopening the SSH bookmark.
    method: automated
    reason: Browser mode stores sessions through local-storage stubs and cannot establish Tauri SQLite persistence.

  - id: edit-focus
    ui_standard: [UI-DLG-06, UI-DLG-07]
    requirement: The editor starts in the issuer field, wraps keyboard focus at both ends, and restores the originating account action after saving.
    actions: [39, 40, 43, 45, 51]
    checkpoints:
    - {step: 42, expectation: The issuer field owns focus.}
    - {step: 44, expectation: Reverse traversal wraps to Save.}
    - {step: 46, expectation: Forward traversal returns to the issuer field.}
    - {step: 53, expectation: The original account action regains focus.}
    results: [42, 44, 46, 53]
  visual:
  - check: Metadata and confirmation dialogs, group/filter and pin remain legible in supported WebViews.
    method: manual
    reason: Retained screenshots require per-platform visual review.
  native:
  - check: Real Tauri commands call the MFA engine with the protected Vault key and persist metadata, pin, preferences,
      counter and deletion in mfa.db.
    method: automated
    reason: Native mode uses the isolated QA release app on Linux, Windows and macOS. Browser mode checks the same
      renderer workflow with stubs and does not prove encryption or disk effects.

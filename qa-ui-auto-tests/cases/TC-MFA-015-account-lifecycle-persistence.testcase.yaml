    - 35
    checkpoints:
    - step: 10
      expectation: Vault setup opens an empty MFA store
    - step: 21
      expectation: RFC 4226 counter zero is 755 224
    - step: 23
      expectation: Next persists counter one as 287 082
    - step: 32
      expectation: Equivalent HOTP secret is refused
    - step: 34
      expectation: Keeping the unsaved duplicate draft has initial focus.
    - step: 36
      expectation: Explicit discard closes the duplicate form.
    - step: 37
      expectation: No duplicate account was added
    - step: 38
      expectation: Duplicate refusal did not advance or reset the original counter
    results:

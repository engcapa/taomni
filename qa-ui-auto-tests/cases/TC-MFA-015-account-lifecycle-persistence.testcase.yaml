id: TC-MFA-015
title: MFA account edits and preferences persist while duplicates and cancelled deletion preserve the HOTP counter
description: AC-010/016 retained MFA behavior during engine extraction. From an isolated profile create RFC HOTP,
  advance once, refuse the same secret under another name, edit metadata and pin, select persisted sort/filter,
  reload, search the saved note, cancel deletion, then confirm and reload again. Native verifies production Rust
  engine, real Vault and mfa.db; browser verifies renderer workflow with preview stubs. This case does not establish
  an independent MFA host or normal process restart.
ui_standard: [UI-DLG-06, UI-DLG-07, UI-DLG-10]
covers:
- F-MFA-1
- F-MFA-2
tags:
- mfa
- p0
- persistence
- modular-retained
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 240

  # reload_window destroys the webview JS context. Re-enter via recents so
  # the workspace mounts fresh and workspace-ready discovery runs the
  # pending-entry scan (the same mechanism that runs after a process
  # restart, since localStorage is webview-persistent under the QA overlay).
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for:
      selector: '[data-testid="confirm-dialog"]'
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="confirm-dialog"]'
      contains: "Refactor recovery pending"
      timeout_sec: 10
  - click: '[data-testid="confirm-dialog-confirm"]'
  - wait_for:
      selector: '[data-testid="confirm-dialog"]'
      timeout_sec: 30
  - assert_text:
      selector: '[data-testid="confirm-dialog"]'
      contains: "Restore pre-refactor content"
      timeout_sec: 10
  - click: '[data-testid="confirm-dialog-confirm"]'
  # After restore: every affected file is rolled back to its preimage;
  # assert_file_sha256 re-reads the host bytes and requires the exact
  # preimage sha256.
  - wait_for:
      selector: '[data-testid="status-bar-message"]'
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="status-bar-message"]'
      contains: "Refactor recovery complete"
      timeout_sec: 30
  - assert_file_sha256:
      path: "${fixture.maven_single_root}/src/main/java/com/example/single/App.java"
      equals: "d1a95976fce19b5ab5c4719fccbc59875db10f684e5177eef08323a8fc554d59"
      timeout_sec: 30
  - assert_file_sha256:
      path: "${fixture.maven_single_root}/src/test/java/com/example/single/AppTest.java"
      equals: "493c42a3010d40104c812b9169e7ad978e7e6a3b79719abefcfc9f5cb0cf9673"
      timeout_sec: 30
  - screenshot: tc-ide-audit-014-segment2-restored.png

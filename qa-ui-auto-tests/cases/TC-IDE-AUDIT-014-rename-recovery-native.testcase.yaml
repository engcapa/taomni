id: TC-IDE-AUDIT-014-rename-recovery-native
title: 'Refactor postcondition recovery: real jdtls rename + seeded v2 journal reopen'
description: "ED-AUDIT-014 native gate case. Crosses the real packaged-app boundary on\nLinux with a live JDT LS\
  \ provider and proves two production paths:\n\n1. A1/provider: a real Shift+F6 rename of the `blank` variable\
  \ in\n   QuickFixTarget.java (maven-single sample) applies a real provider\n   WorkspaceEdit through the packaged\
  \ app UI, with preview/apply, the\n   shared-undo status naming the journal entry, a save, and the disk hash\n\
  \   observed, closing the journal entry in the committed state. The rename\n   targets QuickFixTarget.java (NOT\
  \ App.java): App.java carries\n   intentional completion-target fragments that are syntax errors, and a\n   bare-LSP\
  \ probe proved JDT LS 1.61 refuses ANY rename in a compilation\n   unit with syntax errors (\"cannot be performed\
  \ correctly due to syntax\n   errors\"), answering prepare fine but erroring the rename itself\n   (surfaced by\
  \ production as the honest \"Rename produced no edits\").\n   QuickFixTarget.java is syntax-clean (only an unresolved-type\n\
  \   diagnostic) and the same probe proved rename returns a real edit. A\n   variable (not the class) is renamed\
  \ so no file-move operation is\n   involved; undo-inversion of resource moves is a separate recorded gap.\n 2.\
  \ A2/A3 native restart/disk: a seeded v2 refactor recovery journal entry\n   describes a `prepared` transaction\
  \ whose pre/post images are the literal\n   preimage and a `QA14PostA` substitute (computed offline). The webview\n\
  \   JS context is destroyed by `reload_window`, the workspace is re-entered\n   through recents, the pending entry\
  \ surfaces in the review dialog\n   (affected files with live states, Keep / Restore / Abandon outlets),\n   the\
  \ case presses Restore, confirms \"Restore pre-refactor content\", and\n   the verified rollback restores every\
  \ affected file to its preimage. The\n   host re-reads the affected files (assert_file_sha256 == preHash), proves\n\
  \   the journal entry was promoted to `rolled-back`, and confirms a parallel\n   `host_write_file` conflict is\
  \ never overwritten. The case labels the\n   restart primitive faithfully (`reload_window` destroys the JS context\
  \ and\n   re-runs workspace ready discovery from localStorage; a process kill is\n   unrun on this box and would\
  \ only additionally prove WebKitGTK's own\n   localStorage flush durability).\n\nHighest claim on green: L2 native\
  \ + provider-backed (Linux), packaged app\nUI over a real jdtls process, real disk bytes. IDEA comparison (required\n\
  kind) is recorded separately as unrun on this box — no IDEA 2026.2.x.\n"

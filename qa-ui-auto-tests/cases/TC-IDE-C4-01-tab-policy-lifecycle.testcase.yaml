    contains: beta.txt
- click: '[data-testid="confirm-dialog-cancel"]'
- wait_for: '[data-testid="code-workspace-tab"][data-tab-policy-receipt-status="aborted"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-tab-policy-limit
    equals: '12'
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-tab-policy-receipt-evicted-count
    equals: '0'
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-tab-policy-receipt-cleanup-count
    equals: '0'
- assert_count:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key]'
    equal: 3
- wait_for: '[data-testid="workspace-tab-policy-apply"]:focus'
- eval_readonly:
    expression: document.querySelector("[data-layout-revision]")?.getAttribute("data-layout-revision") === document.querySelector("[data-tab-policy-receipt-layout-revision]")?.getAttribute("data-tab-policy-receipt-layout-revision")
    expect_truthy: true
- click: '[data-testid="workspace-tab-policy-apply"]'
- wait_for: '[data-testid="confirm-dialog"]'
- press:
    key: Enter
    selector: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tab"][data-tab-policy-receipt-status="applied"][data-tab-policy-limit="1"]'
- assert_count:
    selector: '[data-testid="workspace-tab-policy-settings-dialog"]'
    equal: 0
- assert_count:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key][data-active="true"] button[title*="README.txt"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-tab-policy-receipt-evicted-count
    equals: '2'
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-tab-policy-receipt-cleanup-count
    equals: '2'
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-tab-policy-receipt-cleanup-committed-count
    equals: '2'
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-tab-policy-receipt-cleanup-recovery-count
    equals: '0'
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-resource-recovery-count
    equals: '0'
- assert_not_visible: '[data-testid="workspace-resource-cleanup-recovery"]'
- assert_count:
    selector: '[data-testid="workspace-resource-cleanup-recovery-item"]'
    equal: 0
- assert_attribute:
    selector: '[data-testid="code-workspace-tab"]'
    name: data-reopen-stack-count
    equals: '2'
- eval_readonly:
    expression: document.querySelector("[data-layout-revision]")?.getAttribute("data-layout-revision") === document.querySelector("[data-tab-policy-receipt-layout-revision]")?.getAttribute("data-tab-policy-receipt-layout-revision")
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector("[data-active-editor-key]")?.getAttribute("data-active-editor-key") === document.querySelector("[data-tab-policy-receipt-active-key]")?.getAttribute("data-tab-policy-receipt-active-key")
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector("[data-open-resource-count]")?.getAttribute("data-open-resource-count") ===
      document.querySelector("[data-tab-policy-receipt-open-resource-count]")?.getAttribute("data-tab-policy-receipt-open-resource-count")
    expect_truthy: true
- eval_readonly:
    expression: document.activeElement?.getAttribute("data-testid") === "code-workspace-tab-policy-settings"
    expect_truthy: true

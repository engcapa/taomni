id: TC-MODULES-053
title: The signed VNC viewer and host follow the module lifecycle
description: >-
  Install the matching signed VNC module, enable it and open a saved VNC session.
  Check authentication, pixels and input on a real runner-local RFB server. Disable
  the module while the session is active, verify the authenticated socket closes
  and that the open tab explains how to enable the module. Resume the same saved
  session without restarting the app, detach it to its own WebView, then return
  it to the main window. Both windows load the installed signed frontend.
covers: [F-Modules-1, F9.1, F9.6, F-Detach-1]
tags: [modules, vnc, lifecycle, native-boundary, p1]
modes: [native]
fixtures: [reset_db, module_signed_vnc_archive, vnc_required]
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.vnc_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.vnc_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- click: '[data-testid="module-action-enable-vnc-client"]'
- wait_for: '[data-testid="module-action-disable-vnc-client"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- click: '[data-testid="session-proto-vnc"]'
- fill: {selector: '[data-testid="session-host"]', value: '${fixture.vnc_host}'}
- fill: {selector: '[data-testid="session-port"]', value: '${fixture.vnc_port}'}
- click: '[data-testid="session-section-bookmark"]'
- fill: {selector: '[data-testid="session-name"]', value: qa-signed-vnc}
- click: '[data-testid="session-save"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-signed-vnc"]'
- click: '[data-testid="vnc-unencrypted-continue"]'
- fill: {selector: '[data-testid="vnc-auth-password"]', value: '${env.QA_VNC_PASSWORD}'}
- click: '[data-testid="vnc-auth-ok"]'
- wait_for: {selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]', timeout_sec: 30}
- eval_readonly:
    expression: "document.querySelector('.vnc-container')?.getAttribute('data-frontend-source')?.includes('/__taomni_plugins__/vnc-client/${fixture.vnc_signed_version}/frontend/index.js') === true && document.querySelector('.vnc-container canvas')?.getContext('2d')?.getImageData(16, 16, 1, 1).data[3] === 255"
    timeout_sec: 15
- press: {key: a, selector: '[data-testid="vnc-canvas"]'}
- assert_file_contains: {path: '${fixture.vnc_events}', contains: '"keysym": 97, "keysym_hex": "0x61"'}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-vnc-client"]'
- wait_for: '[data-testid="module-action-enable-vnc-client"]'
- assert_file_contains: {path: '${fixture.vnc_events}', contains: '"type": "session_closed"'}
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="tab-item"][data-tab-type="vnc"]'
- wait_for: '[data-plugin-slug="vnc-client"] [data-testid="plugin-tab-unavailable"][data-reason="disabled"]'
- assert_count: {selector: '[data-testid="vnc-panel"]', equal: 0}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="vnc"]', equal: 1}
- click: '[data-plugin-slug="vnc-client"] [data-testid="plugin-tab-settings"]'
- wait_for: '[data-testid="module-action-enable-vnc-client"]'
- click: '[data-testid="module-action-enable-vnc-client"]'
- wait_for: '[data-testid="module-action-disable-vnc-client"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="tab-item"][data-tab-type="vnc"]'
- click: '[data-testid="vnc-unencrypted-continue"]'
- fill: {selector: '[data-testid="vnc-auth-password"]', value: '${env.QA_VNC_PASSWORD}'}
- click: '[data-testid="vnc-auth-ok"]'
- wait_for: {selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]', timeout_sec: 30}
- eval_readonly:
    expression: "document.querySelector('.vnc-container')?.getAttribute('data-frontend-source')?.includes('/__taomni_plugins__/vnc-client/${fixture.vnc_signed_version}/frontend/index.js') === true && document.querySelector('.vnc-container canvas')?.getContext('2d')?.getImageData(16, 16, 1, 1).data[3] === 255"
    timeout_sec: 15
- press: {key: b, selector: '[data-testid="vnc-canvas"]'}
- assert_file_contains: {path: '${fixture.vnc_events}', contains: '"keysym": 98, "keysym_hex": "0x62"'}
- assert_no_runtime_errors: null
- click: '[data-testid="vnc-detach"]'
- switch_window: {selector: '[data-testid="detached-session-window"]'}
- wait_for: '[data-testid="vnc-panel"][data-frontend-source*="/__taomni_plugins__/vnc-client/${fixture.vnc_signed_version}/frontend/index.js"]'
- click: '[data-testid="vnc-unencrypted-continue"]'
- fill: {selector: '[data-testid="vnc-auth-password"]', value: '${env.QA_VNC_PASSWORD}'}
- click: '[data-testid="vnc-auth-ok"]'
- wait_for: {selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]', timeout_sec: 30}
- eval_readonly:
    expression: "document.querySelector('.vnc-container canvas')?.getContext('2d')?.getImageData(16, 16, 1, 1).data[3] === 255"
    timeout_sec: 15
- press: {key: c, selector: '[data-testid="vnc-canvas"]'}
- assert_file_contains: {path: '${fixture.vnc_events}', contains: '"keysym": 99, "keysym_hex": "0x63"'}
- assert_no_runtime_errors: null
- switch_window:
    selector: '[data-testid="status-bar"]'
    close_with: '[data-testid="detached-reattach"]'
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="vnc"]', equal: 1}
- wait_for: '[data-testid="vnc-panel"][data-frontend-source*="/__taomni_plugins__/vnc-client/${fixture.vnc_signed_version}/frontend/index.js"]'
- click: '[data-testid="vnc-unencrypted-continue"]'
- fill: {selector: '[data-testid="vnc-auth-password"]', value: '${env.QA_VNC_PASSWORD}'}
- click: '[data-testid="vnc-auth-ok"]'
- wait_for: {selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]', timeout_sec: 30}
- eval_readonly:
    expression: "document.querySelector('.vnc-container canvas')?.getContext('2d')?.getImageData(16, 16, 1, 1).data[3] === 255"
    timeout_sec: 15
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The core accepts the signed VNC archive and the installed host paints frames and forwards input.
    actions: [5, 6, 7, 9, 19, 20, 21, 22, 23, 26]
    checkpoints:
    - {step: 8, expectation: The native verifier completes installation.}
    - {step: 10, expectation: Settings shows the enabled module.}
    - {step: 25, expectation: The signed viewer displays pixels from the RFB fixture.}
    - {step: 27, expectation: The fixture receives the first key through the relay.}
    results: [8, 10, 25, 27]
  - id: R2
    requirement: Disabling VNC closes its active transport and enabling it restores the saved session without restarting the desktop.
    actions: [28, 29, 30, 33, 34, 35, 39, 41, 43, 44, 45, 46, 47, 48, 51]
    checkpoints:
    - {step: 31, expectation: Settings shows the module ready to enable.}
    - {step: 32, expectation: The RFB server observes the authenticated connection end on disable.}
    - {step: 36, expectation: The saved session displays the disabled module state.}
    - {step: 37, expectation: The VNC renderer unmounts when the module is disabled.}
    - {step: 38, expectation: A single VNC tab preserves the saved session.}
    - {step: 42, expectation: Settings shows the module enabled again.}
    - {step: 50, expectation: The reopened saved session paints frames from the installed viewer.}
    - {step: 52, expectation: The RFB server receives fresh input from the reopened viewer.}
    - {step: 53, expectation: Lifecycle changes leave the desktop without uncaught renderer errors.}
    results: [31, 32, 36, 37, 38, 42, 50, 52, 53]
  - id: R3
    requirement: The detached WebView authenticates with the signed viewer and reattachment restores exactly one working main-window tab.
    actions: [54, 55, 57, 58, 59, 62, 65, 68, 69, 70]
    checkpoints:
    - {step: 56, expectation: The detached WebView loads the installed frontend path.}
    - {step: 61, expectation: The detached canvas paints fixture pixels.}
    - {step: 63, expectation: The fixture receives a key sent from the detached canvas.}
    - {step: 66, expectation: Reattachment returns to a single VNC tab.}
    - {step: 67, expectation: The returned tab uses the installed frontend path.}
    - {step: 72, expectation: The returned session paints the framebuffer.}
    - {step: 73, expectation: The reattached window has no runtime errors.}
    results: [56, 61, 63, 66, 67, 72, 73]
  visual:
  - check: The connected viewer paints the fixture before disable and after re-enable.
    method: automated
    reason: Read the rendered framebuffer in both sessions.
  native:
  - check: Verify the package against the application's trust key and drive the live host through the normal desktop UI.
    method: automated
    reason: The native bridge exercises the installed host and real TCP teardown.

id: TC-MFA-009
title: An MFA account is edited from its context menu and deleted only after confirmation
description: >-
  V-18 (AC-13). Browser stub. Right-clicking a row lists Edit, Pin, Move up,
  Move down and Delete. Edit refuses an empty name, saves issuer, account,
  group and a searchable note without changing the code, and Cancel or Escape
  ask before discarding changes. Countdown refreshes preserve focus in the edited field. Delete asks first: cancelling keeps the account,
  confirming removes it and announces the deletion.
covers: [F-MFA-1]
tags: [mfa, p1]
ui_standard: [UI-DLG-04, UI-DLG-06, UI-DLG-07, UI-DLG-10]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill: {selector: '[data-testid="vault-setup-pw1"]', value: qa-mfa-master-009}
- fill: {selector: '[data-testid="vault-setup-pw2"]', value: qa-mfa-master-009}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill: {selector: '[data-testid="mfa-add-issuer"]', value: QA Edit}
- fill: {selector: '[data-testid="mfa-add-account"]', value: edit@example.com}
- fill: {selector: '[data-testid="mfa-add-secret"]', value: JBSWY3DPEHPK3PXP}
- click: '[data-testid="mfa-add-submit"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- right_click: '[data-testid="mfa-account-row"][data-issuer="QA Edit"]'
- assert_menu_items: [Edit, Pin to top, Move up, Move down, Delete]
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- assert_attribute: {selector: '[data-testid="mfa-edit-issuer"]', name: value, equals: QA Edit}
- fill: {selector: '[data-testid="mfa-edit-issuer"]', value: ''}
- fill: {selector: '[data-testid="mfa-edit-account"]', value: ''}
- click: '[data-testid="mfa-edit-save"]'
- assert_text: {selector: '[data-testid="mfa-edit-error"]', contains: Enter an issuer or an account name}
- fill: {selector: '[data-testid="mfa-edit-issuer"]', value: QA Renamed}
- fill: {selector: '[data-testid="mfa-edit-account"]', value: renamed@example.com}
- wait: 0.6
- assert_visible: '[data-testid="mfa-edit-account"]:focus'
- fill: {selector: '[data-testid="mfa-edit-group"]', value: Ops}
- fill: {selector: '[data-testid="mfa-edit-note"]', value: rotate yearly}
- click: '[data-testid="mfa-edit-save"]'
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- assert_attribute: {selector: '[data-testid="mfa-account-row"][data-issuer="QA Renamed"]', name: data-account, equals: renamed@example.com}
- assert_text_equals: {selector: '[data-testid="mfa-account-group"]', equals: Ops}
- assert_text: {selector: '[data-testid="mfa-status"]', contains: Saved QA Renamed}
- assert_totp_code: {selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Renamed"] *)', secret: JBSWY3DPEHPK3PXP}
- fill: {selector: '[data-testid="mfa-search"]', value: rotate}
- assert_items: {selector: '[data-testid="mfa-account-row"]', attribute: data-issuer, equals: [QA Renamed]}
- fill: {selector: '[data-testid="mfa-search"]', value: ''}
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- fill: {selector: '[data-testid="mfa-edit-issuer"]', value: Should Not Save}
- click: '[data-testid="mfa-edit-cancel"]'
- assert_focus_on: '[data-testid="confirm-dialog-cancel"]'
- press: Escape
- assert_focus_on: '[data-testid="mfa-edit-cancel"]'
- assert_attribute: {selector: '[data-testid="mfa-edit-issuer"]', name: value, equals: Should Not Save}
- click: '[data-testid="mfa-edit-cancel"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- fill: {selector: '[data-testid="mfa-edit-issuer"]', value: Should Not Save Either}
- press: Escape
- assert_focus_on: '[data-testid="confirm-dialog-cancel"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- assert_focus_on: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- assert_items: {selector: '[data-testid="mfa-account-row"]', attribute: data-issuer, equals: [QA Renamed]}
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text: {selector: '[data-testid="confirm-dialog-message"]', contains: Delete QA Renamed}
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- assert_count: {selector: '[data-testid="mfa-account-row"]', equal: 1}
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- assert_text: {selector: '[data-testid="mfa-status"]', contains: Deleted QA Renamed}
- screenshot: mfa-009-after-delete.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The row context menu lists the account actions and Edit validates and saves issuer, account, group and note without stealing field focus on countdown refreshes (AC-13).
    actions: [11, 13, 14, 15, 16, 18, 20, 23, 24, 25, 27, 28, 31, 32, 33, 39]
    checkpoints:
    - {step: 19, expectation: 'menu lists Edit, Pin, Move up, Move down and Delete'}
    - {step: 22, expectation: edit form prefilled}
    - {step: 26, expectation: empty name refused}
    - {step: 30, expectation: account field keeps focus after a countdown refresh}
    - {step: 34, expectation: dialog closed after saving}
    - {step: 35, expectation: account name saved}
    - {step: 36, expectation: group saved}
    - {step: 37, expectation: save announced}
    - {step: 38, expectation: code unchanged and RFC 6238 correct}
    - {step: 40, expectation: the note is searchable}
    results: [40]
  - id: R2
    ui_standard: [UI-DLG-04, UI-DLG-06, UI-DLG-07, UI-DLG-10]
    requirement: Cancel and Escape offer to keep editing. Confirming discard closes the form and restores focus to the original account (AC-13, AC-17).
    actions: [41, 42, 43, 45, 46, 54, 55, 57, 58]
    checkpoints:
    - {step: 47, expectation: The safe action starts focused.}
    - {step: 49, expectation: Escape returns to the edit form's Cancel button.}
    - {step: 50, expectation: The unsaved issuer remains in the form.}
    - {step: 59, expectation: The keyboard discard path also focuses the safe action.}
    - {step: 62, expectation: The original account menu regains focus.}
    - {step: 44, expectation: edit dialog open}
    - {step: 53, expectation: cancel closed it}
    - {step: 56, expectation: edit dialog open again}
    - {step: 61, expectation: Escape closed it}
    - {step: 63, expectation: issuer unchanged}
    results: [47, 49, 50, 59, 62, 63]
  - id: R3
    requirement: Delete asks for confirmation; cancel keeps the account and confirm removes it (AC-13).
    actions: [64, 65, 68, 71, 72, 74]
    checkpoints:
    - {step: 66, expectation: confirmation shown}
    - {step: 67, expectation: message names the account}
    - {step: 69, expectation: dialog closed on cancel}
    - {step: 70, expectation: account kept}
    - {step: 73, expectation: confirmation shown again}
    - {step: 75, expectation: list empty after confirming}
    - {step: 76, expectation: deletion announced}
    results: [75, 76]
  visual:
  - check: Edit dialog and confirmation dialog are legible.
    method: manual
    reason: Screenshot needs human review.
  native:
  - check: Rust update/delete in mfa.db are covered by Rust unit tests and TC-MFA-101 persistence.
    method: external
    reason: Browser stub evidence is not native.

id: TC-MFA-009
title: An MFA account is edited from its context menu and deleted only after confirmation
description: 'V-18 (AC-13). Browser stub. Right-clicking a row lists Edit, Pin, Move
  up, Move down and Delete. Edit refuses an empty name, saves issuer, account, group
  and a searchable note without changing the code, and Cancel or Escape discard changes.
  Delete asks first: cancelling keeps the account, confirming removes it and announces
  the deletion.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F-MFA-1
tags:
- mfa
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-master-009
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-master-009
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill:
    selector: '[data-testid="mfa-add-issuer"]'
    value: QA Edit
- fill:
    selector: '[data-testid="mfa-add-account"]'
    value: edit@example.com
- fill:
    selector: '[data-testid="mfa-add-secret"]'
    value: JBSWY3DPEHPK3PXP
- click: '[data-testid="mfa-add-submit"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- right_click: '[data-testid="mfa-account-row"][data-issuer="QA Edit"]'
- assert_menu_items:
  - Edit
  - Pin to top
  - Move up
  - Move down
  - Delete
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- assert_attribute:
    selector: '[data-testid="mfa-edit-issuer"]'
    name: value
    equals: QA Edit
- fill:
    selector: '[data-testid="mfa-edit-issuer"]'
    value: ''
- fill:
    selector: '[data-testid="mfa-edit-account"]'
    value: ''
- click: '[data-testid="mfa-edit-save"]'
- assert_text:
    selector: '[data-testid="mfa-edit-error"]'
    contains: Enter an issuer or an account name
- fill:
    selector: '[data-testid="mfa-edit-issuer"]'
    value: QA Renamed
- fill:
    selector: '[data-testid="mfa-edit-account"]'
    value: renamed@example.com
- fill:
    selector: '[data-testid="mfa-edit-group"]'
    value: Ops
- fill:
    selector: '[data-testid="mfa-edit-note"]'
    value: rotate yearly
- click: '[data-testid="mfa-edit-save"]'
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- assert_attribute:
    selector: '[data-testid="mfa-account-row"][data-issuer="QA Renamed"]'
    name: data-account
    equals: renamed@example.com
- assert_text_equals:
    selector: '[data-testid="mfa-account-group"]'
    equals: Ops
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Saved QA Renamed
- assert_totp_code:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Renamed"] *)'
    secret: JBSWY3DPEHPK3PXP
- fill:
    selector: '[data-testid="mfa-search"]'
    value: rotate
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - QA Renamed
- fill:
    selector: '[data-testid="mfa-search"]'
    value: ''
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- fill:
    selector: '[data-testid="mfa-edit-issuer"]'
    value: Should Not Save
- click: '[data-testid="mfa-edit-cancel"]'
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- fill:
    selector: '[data-testid="mfa-edit-issuer"]'
    value: Should Not Save Either
- press: Escape
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - QA Renamed
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: Delete QA Renamed
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- assert_count:
    selector: '[data-testid="mfa-account-row"]'
    equal: 1
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Renamed"] *)'
- click: '[data-testid="mfa-menu-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Deleted QA Renamed
- screenshot: mfa-009-after-delete.png

id: TC-FILE-OPEN-041
title: Live Markdown tables render inline formatting and preserve standard source through edit, history and reopen
description: 'User regression: Live showed raw emphasis inside table cells while Split/PDF rendered it. Read-only and inactive editable cells
  render inline GFM using the shared sanitizer, math and controlled local images. Focus exposes source only for the active editable cell. Verify
  Live/Split parity, cell edit, Tab, Undo/Redo, escaped pipes, unchanged neighbors, source bytes, Save and reopen. Native asserts real disk bytes
  and packaged WebView focus/render behavior; synthetic WebView input does not certify physical OS IME.'
modes:
- browser
- native
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p0
- file-open
- markdown
- editor
- regression
- crash-regression
fixtures:
- reset_db
- file_open_files
timeout_sec: 360
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-live-table
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- wait_for: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="table.md"]'
- wait_for: '[data-testid="markdown-editor"][data-mode="live"][data-editing="false"]'
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] th strong'
    equals: Heading
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] strong'
    equals: bold
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] em'
    equals: italic
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] del'
    equals: removed
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] code'
    equals: code
- assert_count:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] .katex'
    equal: 1
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="2"][data-cell-column="0"]'
    equals: Keep | pipe
- assert_count:
    selector: '[data-testid="markdown-table-widget"] script,[data-testid="markdown-table-widget"] [onerror],[data-testid="markdown-table-widget"]
      a[href^="javascript:"]'
    equal: 0
- wait_for: '[data-testid="markdown-table-widget"] img[src^="data:image/"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/table.md
    sha256: ${fixture.file_open_table_sha}
- click: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] strong'
    equals: bold
- assert_attribute:
    selector: '[data-testid="file-viewer"]'
    name: data-dirty
    equals: 'false'
- click: '[data-testid="markdown-mode-split"]'
- assert_text_equals:
    selector: '[data-testid="markdown-preview"] td strong'
    equals: bold
- click: '[data-testid="markdown-mode-live"]'
- click: '[data-testid="markdown-live-edit"]'
- click: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
    equals: '**bold** *italic* ~~removed~~ `code` $x^2$'
- press:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
    key: Control+a
    macos_key: Meta+a
- eval_readonly:
    expression: window.getSelection()?.toString() === "**bold** *italic* ~~removed~~ `code` $x^2$" && document.activeElement?.contains(window.getSelection()?.anchorNode)
      && document.activeElement?.contains(window.getSelection()?.focusNode)
    expect_truthy: true
- fill:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
    value: '**changed** *italic* ~~removed~~ `code` $x^2$'
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
    equals: '**changed** *italic* ~~removed~~ `code` $x^2$'
- press:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
    key: Tab
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] strong'
    equals: changed
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="1"]'
    equals: '[safe](https://example.test)'
- press:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="1"]'
    key: Control+z
    macos_key: Meta+z
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] strong'
    equals: bold
- press:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="1"]'
    key: Control+y
    macos_key: Meta+Shift+z
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] strong'
    equals: changed
- click: '[data-testid="markdown-live-edit"]'
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] th strong'
    equals: Heading
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] strong'
    equals: changed
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] em'
    equals: italic
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] del'
    equals: removed
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] code'
    equals: code
- assert_count:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] .katex'
    equal: 1
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="2"][data-cell-column="0"]'
    equals: Keep | pipe
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="1"] a'
    equals: safe
- click: '[data-testid="markdown-mode-source"]'
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - '# Live table'
    - ''
    - '| **Heading** | Link | Safety |'
    - '| :--- | :---: | ---: |'
    - '| **changed** *italic* ~~removed~~ `code` $x^2$ | [safe](https://example.test) | [bad](javascript:alert(1)) <img src="assets/pixel.png"
      onerror="window.TABLE_UNSAFE=true"> |'
    - '| Keep \| pipe | <u>underline</u><br>next | untouched |'
    - ''
- click: '[data-testid="viewer-save"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/table.md
    equals: '# Live table


      | **Heading** | Link | Safety |

      | :--- | :---: | ---: |

      | **changed** *italic* ~~removed~~ `code` $x^2$ | [safe](https://example.test) | [bad](javascript:alert(1)) <img src="assets/pixel.png"
      onerror="window.TABLE_UNSAFE=true"> |

      | Keep \| pipe | <u>underline</u><br>next | untouched |

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="table.md"]'
- wait_for: '[data-testid="markdown-editor"][data-mode="live"][data-editing="false"]'
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] th strong'
    equals: Heading
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] strong'
    equals: changed
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] em'
    equals: italic
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] del'
    equals: removed
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] code'
    equals: code
- assert_count:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"] .katex'
    equal: 1
- assert_text_equals:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="2"][data-cell-column="0"]'
    equals: Keep | pipe
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/table.md
    equals: '# Live table


      | **Heading** | Link | Safety |

      | :--- | :---: | ---: |

      | **changed** *italic* ~~removed~~ `code` $x^2$ | [safe](https://example.test) | [bad](javascript:alert(1)) <img src="assets/pixel.png"
      onerror="window.TABLE_UNSAFE=true"> |

      | Keep \| pipe | <u>underline</u><br>next | untouched |

      '
- assert_no_runtime_errors: null
- screenshot: TC-FILE-OPEN-041-live-table-inline.png

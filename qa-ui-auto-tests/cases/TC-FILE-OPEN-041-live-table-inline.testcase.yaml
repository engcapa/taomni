  visual:
  - check: New-file dialog and resulting editor/table layout.
    method: manual
    reason: Retained screenshots require review; DOM assertions alone do not certify visual layout.
  native:
  - check: Packaged WebView Live table rendering, focus/history lifecycle, real disk Save and reopen.
    method: automated
    reason: Native mode uses real Tauri IPC and independent host bytes; browser mode proves only its isolated VFS. WebView key delivery does not
      prove physical OS or AppKit accelerator input.

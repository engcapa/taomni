id: TC-024
title: Terminal Special Command sends SIGINT to interrupt foreground process
covers: [F3.1]
tags: [legacy-imported, p1, signal, terminal]
modes: [browser]
fixtures: [reset_db, ssh_required]
steps:
  - open: "${cfg.app.base_url}"
  - click: '[data-testid="app-main-menu"]'
  - hover: '[data-testid="context-menu-item-view"]'
  - click: '[data-testid="context-menu-item-toggle-quick-connect"]'
  - wait_for: '[data-testid="qc-input"]'
  - fill: {selector: "[data-testid=\"qc-input\"]", value: "ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}"}
  - click: "[data-testid=\"qc-submit\"]"
  - wait_for: "[data-testid=\"auth-prompt\"]"
  - fill: {selector: "[data-testid=\"auth-password\"]", value: "${env.QA_SSH_PASSWORD}"}
  - click: "[data-testid=\"auth-submit\"]"
  - wait_for: "[data-testid=\"terminal-pane\"]"
  - wait_for:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
      timeout_sec: 20
  - click: '[data-testid="terminal-pane"][data-terminal-active="true"]'
  - type: "sleep 60 && echo qa-should-not-appear"
  - press: Enter
  - wait: 1
  - right_click: { selector: "[data-testid=\"terminal-pane\"]", position: { x: 24, y: 24 } }
  - wait_for: "[data-testid=\"context-menu\"]"
  - hover: '[data-testid="context-menu"] >> text=Special Command'
  - wait_for: "[data-testid=\"context-menu\"] >> text=\"SIGINT (Interrupt)\""
  - click: "[data-testid=\"context-menu\"] >> text=\"SIGINT (Interrupt)\""
  - wait_for:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
      timeout_sec: 20
  - click: '[data-testid="terminal-pane"][data-terminal-active="true"]'
  - type: echo qa-after-sigint
  - press: Enter
  - wait: 1
  - assert_text: {selector: "[data-testid=\"terminal-pane\"]", contains: qa-after-sigint}
  - screenshot: 024-terminal-sigint.png

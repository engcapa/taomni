    timeout_sec: 60
- fill:
    selector: '[data-testid="mail-archive-search"]'
    value: '"'
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 0 messages
    timeout_sec: 60
- fill:
    selector: '[data-testid="mail-archive-search"]'

- click: '[data-testid="mail-storage-resume"]'
- wait_for:
    selector: '[data-testid="mail-storage-resume"]:enabled'
    timeout_sec: 60
- click: '[data-testid="mail-archive-open"]'
- wait_for:
    selector: '[data-testid="mail-archive-refresh"]:enabled'
    timeout_sec: 60
- select_option:
    selector: '[data-testid="mail-archive-folder"]'
    value: INBOX
- fill:
    selector: '[data-testid="mail-archive-search"]'
    value: Literal
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 12 messages
    timeout_sec: 60
- fill:
    selector: '[data-testid="mail-archive-search"]'
    value: literal
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 12 messages

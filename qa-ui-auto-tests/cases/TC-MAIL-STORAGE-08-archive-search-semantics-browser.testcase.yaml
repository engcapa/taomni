id: TC-MAIL-STORAGE-08
title: Literal, short and non-Latin archive search with range selection and filter states
description: Whole-archive search treats text literally for short, wildcard-like and non-Latin
  queries, scopes searches to recipients and senders, keeps shift range selection exact and
  reports the filtered-empty and active-filter states. Browser renderer and stub workflow;
  indexed SQLite search semantics are covered by TC-MAIL-STORAGE-09.
covers:
- F-MAIL-23
tags:
- mail
- p1
modes:
- browser
fixtures:
- reset_db
- mail_server
- mail_storage
timeout_sec: 420
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:
    selector: input[aria-label="IMAP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-imap-security"]'
    value: None
- fill:
    selector: input[aria-label="IMAP port"]
    value: ${fixture.mail_imap_port}
- fill:
    selector: input[aria-label="Mail email or username"]
    value: qa@example.com
- fill:
    selector: input[aria-label="Mail password or app password token"]
    value: qa-pass
- fill:
    selector: input[aria-label="SMTP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-smtp-security"]'
    value: None
- fill:
    selector: input[aria-label="SMTP port"]
    value: ${fixture.mail_smtp_port}
- assert_attribute:
    selector: input[aria-label="Mail save directory"]
    name: placeholder
    equals: Optional directory for extra .eml copies
- assert_text:
    selector: '[data-testid="session-editor"]'
    contains: does not change the cache location
- fill:
    selector: '[data-testid="mail-storage-directory"]'
    value: ${fixture.mail_storage_a}
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: QA archive search
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-mail-storage-password
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 60
- wait_for: '[data-testid="session-tree-item"][data-session-name="QA archive search"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="QA archive search"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 60
- mail_server_deliver:
    folder: INBOX
    count: 12
    prefix: Literal
- mail_server_deliver:
    folder: INBOX
    count: 3
    prefix: 发票
- mail_server_deliver:
    folder: INBOX
    count: 1
    prefix: 100%
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches:
    folder: INBOX

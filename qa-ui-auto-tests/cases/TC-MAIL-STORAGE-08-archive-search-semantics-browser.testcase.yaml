- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 1 messages
    timeout_sec: 60
- fill:
    selector: '[data-testid="mail-archive-search"]'
    value: 发票
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 3 messages
    timeout_sec: 60
- select_option:
    selector: '[data-testid="mail-archive-search-field"]'
    value: to
- fill:
    selector: '[data-testid="mail-archive-search"]'
    value: user@example.com
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 19 messages
    timeout_sec: 60
- select_option:
    selector: '[data-testid="mail-archive-search-field"]'
    value: all
- fill:
    selector: '[data-testid="mail-archive-search"]'
    value: 发票
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 3 messages
    timeout_sec: 60
- screenshot: archive-search-literal-and-unicode.png
- click: '[data-testid="mail-archive-reset"]'
- wait_for:
    selector: '[data-testid="mail-archive-refresh"]:enabled'
    timeout_sec: 60
- select_option:
    selector: '[data-testid="mail-archive-folder"]'
    value: INBOX
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 19 messages
    timeout_sec: 60
- click: '[data-testid="mail-archive-row"]:first-child input[type="checkbox"]'
- click:
    selector: '[data-testid="mail-archive-row"]:nth-child(4) input[type="checkbox"]'
    modifiers:
    - Shift
- assert_text:
    selector: '[data-testid="mail-archive-selection-count"]'
    contains: 4 selected
    timeout_sec: 60
- click: '[data-testid="mail-archive-advanced"] summary'
- fill:
    selector: '[data-testid="mail-archive-min-size"]'
    value: '0.0001'
- assert_text:
    selector: '[data-testid="mail-archive-advanced"]'
    contains: 1 active
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-archive-results"]'
    contains: of 19 messages
    timeout_sec: 60
- screenshot: archive-search-range-and-badge.png
- click: '[data-testid="mail-archive-reset"]'
- wait_for:
    selector: '[data-testid="mail-archive-refresh"]:enabled'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-archive-selection-count"]'
    contains: 0 selected
    timeout_sec: 60
- click: '[data-testid="mail-archive-close"]'
- assert_not_visible: '[data-testid="mail-archive-dialog"]'

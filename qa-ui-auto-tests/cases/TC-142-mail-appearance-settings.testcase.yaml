id: TC-142
title: Mail appearance settings preview and theme customization
covers:
- F6.3
- F-MAIL-4
- F12.1
tags:
- mail
- appearance
- theme
- smoke
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:
    selector: input[aria-label="IMAP server"]
    value: imap.example.test
- fill:
    selector: input[aria-label="SMTP server"]
    value: smtp.example.test
- fill:
    selector: input[aria-label="Mail email or username"]
    value: qa@example.test
- fill:
    selector: input[aria-label="Mail password or app password token"]
    value: secret
- click: '[data-testid="session-section-appearance"]'
- wait_for: '[data-testid="mail-appearance-settings"]'
- assert_visible: '[data-testid="mail-appearance-preview"]'
- click: '[data-testid="mail-theme-select"]'
- wait_for: '[data-testid^="mail-theme-option-"]'
- click: '[data-testid^="mail-theme-option-"]'
- fill:
    selector: input[aria-label="Mail background hex"]
    value: '#1e1e1e'
- fill:
    selector: input[aria-label="Mail foreground hex"]
    value: '#f0f0f0'
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: TestPass123!
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: TestPass123!
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="session-tree-item"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Mail appearance settings preview and theme customization：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 12
    - 14
    - 15
    - 16
    - 17
    - 19
    - 20
    - 21
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"mail-appearance-settings\"]"}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"mail-appearance-preview\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid^=\"mail-theme-option-\"]"}'
    - step: 18
      expectation: '{"wait_for": "[data-testid=\"vault-setup-dialog\"]"}'
    - step: 22
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"]"}'
    results:
    - 22
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

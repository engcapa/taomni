id: TC-MAIL-POP3-01
title: Mail POP3 account downloads into local folders without duplicates
description: 'TASK-21 (docs-feature/mail-thunderbird-parity-design.md AC-65).

  Opens a POP3 account through Quick Connect (pop3://), requires the local

  INBOX to match the server mailbox, delivers three more messages, syncs twice

  and requires the list to still match the server exactly (UIDL de-duplication,

  no repeated downloads). Opens a newly downloaded message and checks its
  rendered text. Reopens the same account and checks the complete list and
  a single row for the most recent message.

  Browser mode drives the stub server model (renderer orchestration only);

  native mode runs the real Tauri POP3 client (USER/PASS, UIDL, RETR) against

  the in-process fake POP3 listener of the mail_server fixture, which serves

  the same INBOX as its IMAP side.

  '
covers:
- F-MAIL-17
- F-MAIL-3
tags:
- mail
- p2
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 210
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_pop3_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: POP3
- wait_for:
    selector: '[data-testid="mail-sync-button"]:not([disabled])'
    timeout_sec: 60
- mail_server_deliver:
    count: 3
    prefix: Pop3-added
- click: '[data-testid="mail-sync-button"]:not([disabled])'
- wait_for:
    selector: '[data-testid="mail-sync-button"]:not([disabled])'
    timeout_sec: 60
- mail_server_assert_list_matches:
    timeout_sec: 60
- click: '[data-testid="mail-sync-button"]:not([disabled])'
- wait_for:
    selector: '[data-testid="mail-sync-button"]:not([disabled])'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: Synced 0 new headers across
    timeout_sec: 30
- mail_server_assert_list_matches:
    timeout_sec: 30
- press:
    selector: '[data-testid="mail-message-row"][data-subject="Pop3-added 0003"]'
    key: Enter
- eval_readonly:
    expression: >-
      (document.querySelector('.taomni-mail-reader-frame')?.contentDocument?.body?.textContent
      ?? document.querySelector('.taomni-mail-reader-text')?.textContent
      ?? '').includes('Pop3-added 0003')
    timeout_sec: 30
- assert_no_runtime_errors: null
- screenshot: mail-pop3-01-local-inbox.png
- right_click: '[data-testid="tab-item"][data-tab-type="mail"]'
- click: '[data-testid="context-menu-item-close"]'
- wait_for: {selector: '[data-testid="tab-item"][data-tab-type="mail"]', state: detached}
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_pop3_quick_connect}'}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"][data-active="true"]'
- mail_server_assert_list_matches: {timeout_sec: 45}
- assert_count: {selector: '[data-testid="mail-message-row"][data-subject="Pop3-added 0003"]', equal: 1}
- press: {selector: '[data-testid="mail-message-row"][data-subject="Pop3-added 0003"]', key: Enter}
- eval_readonly:
    expression: >-
      (document.querySelector('.taomni-mail-reader-frame')?.contentDocument?.body?.textContent
      ?? document.querySelector('.taomni-mail-reader-text')?.textContent
      ?? '').includes('Pop3-added 0003')
    timeout_sec: 30
- click: '[data-testid="mail-test-connection"]'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'POP3 ok, SMTP ok'}
- click: '[data-testid="mail-mark-folder-read"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"][data-active="true"]'
    contains: messages as read
    timeout_sec: 30
- assert_count:
    selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-message-row"][data-unread="true"]'
    equal: 0
- assert_disabled: '[data-testid="mail-mark-folder-read"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: POP3 账户打开后本地 INBOX 与服务器邮箱一致，状态栏显示 POP3。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    checkpoints:
    - step: 8
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 9
      expectation: '{"assert_text": {"selector": "[data-testid=\"mail-client-tab\"]", "contains": "POP3"}}'
    results:
    - 8
    - 9
  - id: R2
    requirement: 服务器新增 3 封后同步两次，列表仍与服务器完全一致，新邮件的正文可以打开（AC-65）。
    actions:
    - 10
    - 11
    - 12
    - 13
    - 15
    - 16
    - 19
    checkpoints:
    - step: 14
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 17
      expectation: After both syncs finish, the repeat reports exactly zero new headers.
    - step: 18
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 30}}'
    - step: 20
      expectation: The visible message reader renders the selected Pop3-added 0003 body in its active format.
    - step: 21
      expectation: '{"assert_no_runtime_errors": null}'
    results:
    - 14
    - 17
    - 18
    - 20
    - 21
  - id: R3
    requirement: Reopening the same account preserves the downloaded message and its deduplication state.
    actions: [23, 24, 26, 27, 31]
    checkpoints:
    - {step: 25, expectation: The original Mail tab has closed.}
    - {step: 29, expectation: The reopened account contains the complete local copy of the server inbox.}
    - {step: 30, expectation: The newest downloaded message appears once after reopen.}
    - {step: 32, expectation: The reopened account still renders the newest message body.}
    results: [25, 29, 30, 32]
  - id: R4
    requirement: The Mail pane reports the connection status and marks the reopened local inbox read.
    actions: [33, 35]
    checkpoints:
    - {step: 34, expectation: The visible status reports both connections succeeded.}
    - {step: 36, expectation: The active Mail pane reports that marking the folder read has completed.}
    - {step: 37, expectation: Marking the folder read clears all visible unread flags.}
    - {step: 38, expectation: The Mark Folder Read command is disabled when no unread messages remain.}
    - {step: 39, expectation: No uncaught renderer errors occur.}
    results: [34, 36, 37, 38, 39]
  visual:
  - check: 截图中本地文件夹（INBOX/Sent/Drafts/Trash/Junk）与 POP3 状态显示正确。
    method: manual
    reason: 像素与布局需人工评审。
  native:
  - check: native 模式验证真实 POP3 客户端与本地存储；“保留 N 天后删除”由 Rust 测试覆盖；browser 仅验证渲染层。
    method: automated
    reason: 按实际执行模式与平台解释证据。

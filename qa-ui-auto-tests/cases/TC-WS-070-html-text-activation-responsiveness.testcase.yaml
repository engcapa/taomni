id: TC-WS-070
title: HTML and text documents open and switch responsively across file sizes
description: Reproduce the reported all-types activation stall with a five-line HTML document, a 704-line plain document and a tiny text file. Cold-open
  each through the real tree, then activate all three tabs twice. Retain exact canonical content, HTML syntax highlighting, every frame and zero automatic
  SDK/LSP discovery. Native uses real file reads in the QA release WebView.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
- F11.2
tags:
- p0
- workspace-redesign
- file-explorer
- regression
- performance
fixtures:
- reset_db
- workspace_language_files
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-plain-files
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="Documents"] [data-testid="code-workspace-tree-dir-arrow"]'
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/page.html"]'
    expected: ${fixture.workspace_html_text}
    event: dblclick
    label: cold-html
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: page.html
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/report.txt"]'
    expected: ${fixture.workspace_report_text}
    event: dblclick
    label: cold-text-704
    require_highlight: false
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: report.txt
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/notes.txt"]'
    expected: ${fixture.workspace_notes_text}
    event: dblclick
    label: cold-text-tiny
    require_highlight: false
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: notes.txt
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="page.html"]'
    expected: ${fixture.workspace_html_text}
    event: click
    label: return-1-html
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: page.html
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="report.txt"]'
    expected: ${fixture.workspace_report_text}
    event: click
    label: return-1-text-704
    require_highlight: false
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: report.txt
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
    expected: ${fixture.workspace_notes_text}
    event: click
    label: return-1-text-tiny
    require_highlight: false
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: notes.txt
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="page.html"]'
    expected: ${fixture.workspace_html_text}
    event: click
    label: return-2-html
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: page.html
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="report.txt"]'
    expected: ${fixture.workspace_report_text}
    event: click
    label: return-2-text-704
    require_highlight: false
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: report.txt
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
    expected: ${fixture.workspace_notes_text}
    event: click
    label: return-2-text-tiny
    require_highlight: false
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: notes.txt
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- assert_no_runtime_errors: null
- screenshot: workspace-html-text-responsiveness.png

id: TC-WS-082
title: Find non-source files and empty folders beyond the capped workspace index
modes:
- browser
- native
description: A mixed fixture places 2100 noise files before documents. Native uses real disk listings; browser exercises VFS and real renderer. Empty workspace
  shortcut has one owner; searching and clearing preserve lazy hierarchy.
covers:
- F-WS-2
- F25.1
- F25.3
fixtures:
- reset_db
- workspace_search_large
tags:
- regression
- workspace-redesign
- file-explorer
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-large-workspace-search
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- assert_language_startup:
    commands:
      workspace_list_files_recursive:
        equal: 0
    quiet_ms: 500
- press: Mod+Shift+n
- fill:
    selector: '[aria-label="Go to file"]'
    value: notes.txt
- wait_for: '[data-testid="code-workspace-search-everywhere"] button[data-index]'
- assert_count:
    selector: '[data-testid="session-cancel"]'
    equal: 0
- assert_text:
    selector: '[data-testid="search-everywhere-selected-path"]'
    contains: Documents/notes.txt
- screenshot: non-source-file-beyond-index.png
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-search-everywhere"] button[data-index="0"]'
    event: click
    expected: ${fixture.workspace_search_notes_text}
    label: search-non-source
    require_highlight: false
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: Weekly notes
- click: '[data-testid="code-workspace-tree-search"]'
- fill:
    selector: '[data-testid="code-workspace-tree-filter"]'
    value: Documents
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="Documents"]'
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="EmptyDocuments"]'
- wait_for: '[data-testid="code-workspace-flat-file"][data-path="Documents/notes.txt"]'
- screenshot: file-and-folder-search-beyond-index.png
- assert_language_startup:
    commands:
      workspace_list_files_recursive:
        equal: 1
    quiet_ms: 200
- dblclick: '[data-testid="code-workspace-tree-dir"][data-path="EmptyDocuments"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-tree-filter"]'
    name: value
    equals: ''
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="EmptyDocuments"][aria-expanded="true"]'
- assert_count:
    selector: '[data-testid="code-workspace-flat-file"]'
    equal: 0
- click: '[data-testid="code-workspace-tree-view-selector"]'
- click: '[data-testid="code-workspace-tree-view-packages"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- fill:
    selector: '[data-testid="code-workspace-tree-filter"]'
    value: notes.txt
- wait_for: '[data-testid="code-workspace-flat-file"][data-path="Documents/notes.txt"]'
- screenshot: packages-search-includes-documents.png
- fill:
    selector: '[data-testid="code-workspace-tree-filter"]'
    value: no-such-workspace-file
- wait_for: '[data-testid="code-workspace-tree"]'
- assert_count:
    selector: '[data-testid="code-workspace-flat-file"]'
    equal: 0
- click: '[data-testid="code-workspace-tree-speed-search-close"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-filter"]'
    equal: 0
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A mixed fixture places 2100 noise files before documents. Native uses real disk listings; browser exercises VFS and real renderer. Empty
      workspace shortcut has one owner; searching and clearing preserve lazy hierarchy.
    actions:
    - 4
    - 5
    - 6
    - 7
    - 8
    - 11
    - 12
    - 19
    - 20
    - 26
    - 30
    - 31
    - 33
    - 36
    - 39
    results:
    - 10
    - 14
    - 15
    - 18
    - 25
    - 27
    - 29
    - 38
    - 40
    - 41
    checkpoints:
    - step: 10
      expectation: '{"assert_language_startup": {"commands": {"workspace_list_files_recursive": {"equal": 0}}, "quiet_ms": 500}}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"session-cancel\"]", "equal": 0}}'
    - step: 15
      expectation: '{"assert_text": {"selector": "[data-testid=\"search-everywhere-selected-path\"]", "contains": "Documents/notes.txt"}}'
    - step: 18
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content", "contains": "Weekly notes"}}'
    - step: 25
      expectation: '{"assert_language_startup": {"commands": {"workspace_list_files_recursive": {"equal": 1}}, "quiet_ms": 200}}'
    - step: 27
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tree-filter\"]", "name": "value", "equals": ""}}'
    - step: 29
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-flat-file\"]", "equal": 0}}'
    - step: 38
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-flat-file\"]", "equal": 0}}'
    - step: 40
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-filter\"]", "equal": 0}}'
    - step: 41
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: Review retained search screenshot for actual result rows and unobstructed controls.
    method: manual
    reason: Screenshot review supplements exact functional assertions.
  native:
  - check: Search real filesystem metadata and route the shortcut in the packaged WebView.
    method: automated
    reason: Native mode runs identical UI actions against isolated disposable disk fixtures.

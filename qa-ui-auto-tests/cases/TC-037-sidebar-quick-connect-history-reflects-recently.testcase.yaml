id: TC-037
title: Sidebar quick-connect history reflects recently saved sessions
covers:
- F1.6
- F6.2
tags:
- legacy-imported
- main
- p1
- quickconnect
- sidebar
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- send_text_via_label:
    label_contains: Specify username
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-recent
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-recent"]'
- assert_visible: '[data-testid="session-search"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-recent"]'
- assert_visible: '[data-testid="session-edit"]'
- assert_visible: '[data-testid="session-duplicate"]'
- assert_visible: '[data-testid="session-delete"]'
- fill:
    selector: '[data-testid="session-search"]'
    value: qa-ui-auto-recent
- assert_visible: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-recent"]'
- fill:
    selector: '[data-testid="session-search"]'
    value: qa-ui-auto-no-such-session
- wait: 1
- assert_visible: '[data-testid="session-tree"] >> text="No matching sessions."'
- screenshot: 037-sidebar-search.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Sidebar quick-connect history reflects recently saved sessions：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 8
    - 10
    - 11
    - 14
    - 18
    - 20
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-recent\"]"}'
    - step: 13
      expectation: '{"assert_visible": "[data-testid=\"session-search\"]"}'
    - step: 15
      expectation: '{"assert_visible": "[data-testid=\"session-edit\"]"}'
    - step: 16
      expectation: '{"assert_visible": "[data-testid=\"session-duplicate\"]"}'
    - step: 17
      expectation: '{"assert_visible": "[data-testid=\"session-delete\"]"}'
    - step: 19
      expectation: '{"assert_visible": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-recent\"]"}'
    - step: 22
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"] >> text=\"No matching sessions.\""}'
    results:
    - 22
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-MODULES-106
title: Signed MFA automatic restore preserves uninstalled retained data, paired Vault and HOTP account
description: >-
  Install the signed MFA module, create a paired Vault and HOTP account, uninstall MFA while
  retaining data, and create a manual local v2 backup. Reinstall and enable MFA to advance
  HOTP, rekey Vault, and uninstall MFA again while retaining data. Reject the old master
  password in Settings, then confirm with the new password. Observe automatic desktop relaunch
  and verify the restored uninstalled retained state (missing module notice, retained locator
  and exact mfa.db bytes, released lease), Vault password rollback, and HOTP continuity after
  reinstalling and enabling MFA.
covers: [F-Modules-1, F-BACKUP-1, F-MFA-1, F-MFA-2, F-MFA-3, F12.1]
tags: [p0, modules, mfa, backup, vault, native-boundary, persistence]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, module_signed_mfa_archive, release_build_required]
timeout_sec: 480

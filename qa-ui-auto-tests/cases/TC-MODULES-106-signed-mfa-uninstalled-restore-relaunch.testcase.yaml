verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Uninstalling signed MFA removes code and creates a paired v2 backup retaining plugins/mfa/data/mfa.db and its locator.
    actions: [9, 11, 20, 28, 35, 37, 44]
    checkpoints:
    - {step: 29, expectation: "Initial RFC HOTP is 755 224."}
    - {step: 30, expectation: "Signed package, live host, writer lease and module SQLite at counter 0 match."}
    - {step: 39, expectation: "Settings displays that MFA data is retained after uninstall."}
    - {step: 47, expectation: "The exact UI-created v2 ZIP pairs Vault and plugins/mfa/data/mfa.db while code and runtime are absent."}
    results: [29, 30, 39, 47]
  - id: R2
    requirement: Reinstalling to advance HOTP, rekeying Vault, and uninstalling again precede restore confirmation, rejecting the old password.
    actions: [52, 54, 61, 72, 76, 78, 83, 89]
    checkpoints:
    - {step: 62, expectation: "HOTP advances to 287 082."}
    - {step: 73, expectation: "Vault master password updates."}
    - {step: 80, expectation: "Settings confirms retained data after second uninstall."}
    - {step: 85, expectation: "Restore dialog lists plugins/mfa/data/mfa.db."}
    - {step: 86, expectation: "Restore dialog lists databases/vault.db."}
    - {step: 90, expectation: "Incorrect old master password fails verification."}
    - {step: 91, expectation: "Failed verification does not stage pending restore state."}
    - {step: 93, expectation: "Archive, mutated counter 1, retained locator, released lease and unchanged generation are ready before confirmation."}
    - {step: 94, expectation: "Original renderer emits no runtime errors."}
    results: [62, 73, 80, 85, 86, 90, 91, 93, 94]
  - id: R3
    requirement: Automatic relaunch preserves the uninstalled retained state, rolls back Vault and exact mfa.db bytes, and decrypts HOTP after reinstall.
    actions: [95, 100, 104, 118, 120, 129]
    checkpoints:
    - {step: 95, expectation: "Single confirmation exits original desktop at 0 and reattaches to new QA desktop PID."}
    - {step: 97, expectation: "Generation advances, active pointer stays intact, code stays absent, retained locator and exact archived mfa.db bytes match."}
    - {step: 101, expectation: "Changed password is rejected after restore."}
    - {step: 109, expectation: "Manager tab shows the missing-module unavailable notice."}
    - {step: 110, expectation: "No MFA account codes render while uninstalled."}
    - {step: 115, expectation: "Module store shows retained data on the uninstalled MFA card."}
    - {step: 128, expectation: "Reinstalling and enabling decrypts restored HOTP 755 224."}
    - {step: 130, expectation: "Reinstalled signed host advances restored account to 287 082."}
    - {step: 131, expectation: "Reinstalled signed MFA host holds the writer lease on the relaunched desktop."}
    - {step: 132, expectation: "Complete automatic restore produces no runtime errors."}
    results: [95, 97, 101, 109, 110, 115, 128, 130, 131, 132]
  visual:
  - check: Reinstalled signed MFA pane showing restored HOTP 287 082 after advancing from 755 224.
    method: manual
    reason: Review signed-mfa-uninstalled-restore-relaunch.png; screenshot capture alone is not a visual verdict.
  native:
  - check: Uninstalled retained signed MFA v2 backup, automatic desktop relaunch, code removal, locator and exact SQLite byte match.
    method: automated
    reason: Kernel PIDs, OS locks, ZIP checksums and SQLite bytes/ciphertext are verified independently of renderer claims.

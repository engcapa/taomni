id: TC-WS-NATIVE-001
title: 'AC-02/11: SQLite rename and reference removal survive a complete native application restart'
description: Uses the isolated QA app and SQLite catalog. restart_native_app closes and relaunches the OS application
  without resetting fixtures; reload alone cannot satisfy this case.
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- native
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-test-password
- wait_for: '[data-testid="workspace-navigator"]'
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-rename"]'
- fill:
    selector: '[data-testid="workspace-rename-input"]'
    value: QA Renamed
- click: '[data-testid="workspace-canvas"] form > button:not([type])'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: QA Renamed
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"] > div > button:last-child'
- assert_not_visible: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"]'
- restart_native_app: null
- wait_for: '[data-testid="workspace-navigator"]'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: QA Renamed
- assert_not_visible: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"]'
- click: '[data-testid="workspace-row-qa-workspace-remote"]'
- assert_visible: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"]'
- click: '[data-testid="side-tab-sessions"]'
- fill:
    selector: '[data-testid="session-search"]'
    value: QA shared SSH
- assert_count:
    selector: '[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"]'
    equal: 1
- screenshot: native-workspace-restart.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: 'AC-02/11: SQLite rename and reference removal survive a complete native application restart'
    actions:
    - 5
    - 6
    - 7
    - 8
    - 10
    - 12
    - 16
    - 18
    - 19
    checkpoints:
    - step: 9
      expectation: '{''assert_text'': {''selector'': ''[data-testid="workspace-header"]'', ''contains'': ''QA Renamed''}}'
    - step: 11
      expectation: '{''assert_not_visible'': ''[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"]''}'
    - step: 14
      expectation: '{''assert_text'': {''selector'': ''[data-testid="workspace-header"]'', ''contains'': ''QA Renamed''}}'
    - step: 15
      expectation: '{''assert_not_visible'': ''[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"]''}'
    - step: 17
      expectation: '{''assert_visible'': ''[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"]''}'
    - step: 20
      expectation: '{''assert_count'': {''selector'': ''[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"]'',
        ''equal'': 1}}'
    results:
    - 9
    - 11
    - 14

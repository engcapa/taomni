id: TC-WS-NATIVE-011
title: 'AC-05/10: shared Mail retains pushed messages with one IDLE worker across Workspace projections'
covers:
- F-Workspace-1
- F-MAIL-10
- F-MAIL-20
tags:
- workspace-first
- p1
- mail
modes:
- browser
- native
native_platforms:
- Windows
- macOS
- Linux
fixtures:
- reset_db
- mail_server
- workspace_membership
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-test-password
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- click: '[data-testid="session-proto-mail"]'
- fill:
    selector: '[data-testid="session-editor"] input[aria-label="IMAP server"]'
    value: ${fixture.mail_host}
- fill:
    selector: '[data-testid="session-editor"] input[aria-label="IMAP port"]'
    value: ${fixture.mail_imap_port}
- fill:
    selector: '[data-testid="session-editor"] input[aria-label="Mail email or username"]'
    value: qa@example.com
- fill:
    selector: '[data-testid="session-editor"] input[aria-label="Mail password or app password token"]'
    value: ${fixture.mail_fixture_password}
- fill:
    selector: '[data-testid="session-editor"] input[aria-label="SMTP server"]'
    value: ${fixture.mail_smtp_host}
- fill:
    selector: '[data-testid="session-editor"] input[aria-label="SMTP port"]'
    value: ${fixture.mail_smtp_port}
- select_option:
    selector: '[data-testid="session-editor"] select[aria-label="IMAP security"]'
    label: ${fixture.mail_security}
- select_option:
    selector: '[data-testid="session-editor"] select[aria-label="SMTP security"]'
    label: ${fixture.mail_security}
- set_check:
    selector: '[data-testid="session-save-in-vault"]'
    checked: true
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: QA Mail resource
- click: '[data-testid="session-save"]'
- vault_first_run: qa-workspace-test-password
- wait_for: '[data-testid="session-tree-item"][data-session-name="QA Mail resource"]'
- click: '[data-testid="side-tab-work"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- select_option:
    selector: '[data-testid="workspace-navigator"] [data-testid="workspace-add-session"]'
    label: QA Mail resource
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-open-reference"][data-session-name="QA Mail resource"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- mail_server_assert_idle_clients:
    equals: 1
    timeout_sec: 30
- assert_count:
    selector: '[data-testid="mail-client-tab"]'
    equal: 1
- click: '[data-testid="workspace-row-qa-workspace-remote"]'
- select_option:
    selector: '[data-testid="workspace-navigator"] [data-testid="workspace-add-session"]'
    label: QA Mail resource
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-open-reference"][data-session-name="QA Mail resource"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- mail_server_assert_idle_clients:
    equals: 1
    timeout_sec: 30
- assert_count:
    selector: '[data-testid="mail-client-tab"]'
    equal: 1
- click: '[data-testid="workspace-surface-overview"]'
- mail_server_deliver:
    count: 2
    prefix: WorkspacePush
- mail_server_assert_idle_clients:
    equals: 1
    timeout_sec: 20
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-open-reference"][data-session-name="QA Mail resource"]'
- mail_server_assert_list_matches:
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: WorkspacePush 0002
- click: '[data-testid="workspace-surface-mail"]'
- assert_text:
    selector: '[data-testid="mail-unified-count"]'
    contains: 1 account
- click: '[data-testid="mail-unified-refresh"]'
- assert_text:
    selector: '[data-testid="mail-unified-row"]'
    contains: WorkspacePush 0002
- mail_server_assert_idle_clients:
    equals: 1
    timeout_sec: 20
- click: '[data-testid="tab-item"][data-tab-type="mail-unified"] [data-testid="tab-close"]'
- mail_server_assert_idle_clients:
    equals: 1
    timeout_sec: 20
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-open-reference"][data-session-name="QA Mail resource"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: WorkspacePush 0002
- click: '[data-testid="tab-item"][data-tab-type="mail"] [data-testid="tab-close"]'
- mail_server_assert_idle_clients:
    equals: 0
    timeout_sec: 20
- click: '[data-testid="side-tab-sessions"]'
- fill:
    selector: '[data-testid="session-search"]'
    value: QA Mail resource
- assert_count:
    selector: '[data-testid="session-tree-item"][data-session-name="QA Mail resource"]'
    equal: 1
- screenshot: workspace-mail-worker-lifecycle.png

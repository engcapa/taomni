id: TC-IDE-C8-01
title: Virtual space mixed carets, selection reversal, composition, and one undo
description: '§8.19.10 gate case C8 / ED-VSPACE-003 browser slice. Through the production

  editor and ActionHost, verifies independent desired columns for three mixed

  carets, exact deferred padding, one undo, Shift anchor reversal, browser

  composition bypass, keyboard focus, textbox semantics, and 200% editor zoom.

  This case is browser-only and never substitutes for packaged Linux IME.

  Highest claim on green: L2 browser behavioral slice.

  '
covers:
- F25.5
- F25.3
tags:
- code-workspace
- ide-c8
- virtual-space
- navigation
- caret
- accessibility
- p0
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-tab"]'
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
- click: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
- type: Editor Appearance Settings
- click: '[data-testid="code-workspace-search-everywhere"] >> text=Editor Appearance Settings'
- wait_for: '[data-testid="workspace-editor-appearance-settings-dialog"]'
- set_check:
    selector: '[data-testid="workspace-editor-appearance-virtual-space-after-line-end"]'
    checked: true
- set_check:
    selector: '[data-testid="workspace-editor-appearance-virtual-space-at-file-bottom"]'
    checked: true
- fill:
    selector: '[data-testid="workspace-editor-appearance-font-size-px"]'
    value: '26'
- click: '[data-testid="workspace-editor-appearance-apply"]'
- wait_for:
    selector: '[data-testid="workspace-editor-appearance-settings-dialog"]'
    state: detached
- assert_text:
    selector: '[data-testid="code-workspace-zoom-reset"]'
    contains: 26px
- fill:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    value: 'prefixX

      X

      longprefixX'
- wait: 1.0
- assert_attribute:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    name: role
    equals: textbox
- assert_attribute:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    name: aria-multiline
    equals: 'true'
- eval_readonly:
    expression: document.querySelector(".cm-content:focus")?.matches(".cm-content")
    expect_truthy: true
- press: Mod+Home
- press: End
- press: Shift+ArrowLeft
- press: Alt+j
- press: Alt+j
- press: ArrowRight
- press: ArrowDown
- type: Z
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[1]?.textContent === "X      Z"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[2]?.textContent === "lZongprefixXZ"
    expect_truthy: true
- press: Mod+z
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[1]?.textContent === "X"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[2]?.textContent === "longprefixX"
    expect_truthy: true
- press: Escape
- press: Mod+Home
- press: End
- press: Shift+ArrowLeft
- press: Alt+j
- press: Alt+j
- press: ArrowRight
- press: End
- type: W
- eval_readonly:
    expression: JSON.stringify([document.querySelectorAll(".cm-line")[0]?.textContent, document.querySelectorAll(".cm-line")[1]?.textContent,
      document.querySelectorAll(".cm-line")[2]?.textContent])
    contains: '["prefixX W","X W","longprefixX W"]'
- press: Mod+z
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX" && document.querySelectorAll(".cm-line")[1]?.textContent
      === "X" && document.querySelectorAll(".cm-line")[2]?.textContent === "longprefixX"
    expect_truthy: true
- type: V
- eval_readonly:
    expression: JSON.stringify([document.querySelectorAll(".cm-line")[0]?.textContent, document.querySelectorAll(".cm-line")[1]?.textContent,
      document.querySelectorAll(".cm-line")[2]?.textContent])
    contains: '["prefixX V","X V","longprefixX V"]'
- press: Mod+z
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX"
    expect_truthy: true
- press: Escape
- press: Mod+Home
- press: ArrowDown
- press: Shift+ArrowDown
- press: Shift+ArrowUp
- press: Shift+ArrowUp
- press: Shift+ArrowDown
- type: Q
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[1]?.textContent === "QX"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[2]?.textContent === "longprefixX"
    expect_truthy: true
- press: Mod+z
- press: Mod+Home
- compose_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    text: 你
    during_key: ArrowDown
- eval_readonly:
    expression: document.querySelectorAll(".cm-line")[0]?.textContent === "你prefixX" && document.querySelectorAll(".cm-line")[1]?.textContent
      === "X"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector(".cm-content:focus")?.matches(".cm-content")
    expect_truthy: true
- screenshot: tc-ide-c8-virtual-space-behavior.png
- click: '[data-testid="code-workspace-zoom-reset"]'
- assert_text:
    selector: '[data-testid="code-workspace-zoom-reset"]'
    contains: 13px

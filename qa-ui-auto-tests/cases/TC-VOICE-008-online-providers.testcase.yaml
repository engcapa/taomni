covers:
- F-AI-2.3
tags:
- ai
- voice
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
id: TC-VOICE-008
title: Volcengine and Soniox selection, neutral hotwords and experimental Gemini
steps:
- open: ${cfg.app.base_url}/?voiceFixture=1
- click: '[data-testid="titlebar-actions-more"]'
- wait_for: '[data-testid="ptt-button"]'
- click: '[data-testid="ptt-button"]'
- wait_for: '[data-testid="asr-settings"]'
- select_option:
    selector: '[data-testid="asr-realtime-provider"]'
    value: volcengine
- assert_attribute:
    selector: '[data-testid="asr-provider-endpoint"]'
    name: value
    equals: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async
- fill:
    selector: '[data-testid="asr-hotwords"]'
    value: 'Taomni

      src/main.rs

      Taomni'
- click: '[data-testid="asr-hotwords-save"]'
- assert_localstorage:
    key: taomni.ai.config.v1
    contains: '"hotwords":["Taomni","src/main.rs"]'
- select_option:
    selector: '[data-testid="asr-realtime-provider"]'
    value: soniox
- assert_attribute:
    selector: '[data-testid="asr-realtime-settings"] label:has-text("Model") input'
    name: value
    equals: stt-rt-v5
- assert_not_visible: '[data-testid="asr-realtime-provider"] option[value="gemini"]'
- click: '[data-testid="asr-experimental"]'
- select_option:
    selector: '[data-testid="asr-realtime-provider"]'
    value: gemini
- assert_localstorage:
    key: taomni.ai.config.v1
    contains: '"active":"gemini"'
- screenshot: online-providers.png
- fill:
    selector: '[data-testid="asr-provider-endpoint"]'
    value: wss://example.invalid/experimental
- click: '[data-testid="asr-realtime-settings"] button:has-text("Save provider")'
- assert_localstorage:
    key: taomni.ai.config.v1
    contains: wss://example.invalid/experimental
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Volcengine and Soniox selection, neutral hotwords and experimental Gemini
    actions:
    - 6
    - 8
    - 9
    - 11
    - 14
    - 15
    checkpoints:
    - step: 7
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"asr-provider-endpoint\"]", "name": "value", "equals": "wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async"}}'
    - step: 10
      expectation: '{"assert_localstorage": {"key": "taomni.ai.config.v1", "contains": "\"hotwords\":[\"Taomni\",\"src/main.rs\"]"}}'
    - step: 12
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"asr-realtime-settings\"] label:has-text(\"Model\") input", "name": "value", "equals": "stt-rt-v5"}}'
    - step: 13
      expectation: '{"assert_not_visible": "[data-testid=\"asr-realtime-provider\"] option[value=\"gemini\"]"}'
    - step: 16
      expectation: '{"assert_localstorage": {"key": "taomni.ai.config.v1", "contains": "\"active\":\"gemini\""}}'
    results:
    - 7
    - 10
    - 12
    - 13
    - 16
  - id: R2
    requirement: Custom endpoints persist only after explicitly saving the provider.
    actions:
    - 18
    - 19
    checkpoints:
    - step: 20
      expectation: '{"assert_localstorage": {"key": "taomni.ai.config.v1", "contains": "wss://example.invalid/experimental"}}'
    results:
    - 20
  visual:
  - method: manual
    reason: Inspect retained screenshots.
    check: Settings and original transcript remain readable
  native:
  - method: external
    reason: Native socket/config/cleanup tests establish backend behavior; browser fixtures do not validate vendor service availability.
    check: Provider transport, credentials and LLM protection

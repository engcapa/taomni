id: TC-MODULES-038
title: The macOS Settings upgrade relaunches with a working signed MFA module
description: >-
  Create an encrypted MFA account in the candidate's legacy store. In Settings
  present the matching production-signed MFA package and reject a wrong Vault
  password. Confirm with the correct password, observe the original process
  exit normally, and attach to the application's own new process. Reopen MFA
  and confirm the migrated HOTP counter and the next code.
covers: [F-Modules-1, F-MFA-1, F-MFA-2]
tags: [modules, mfa, upgrade, native-boundary, macos, p0]
modes: [native]
native_platforms: [macOS]
fixtures: [reset_db, module_signed_mfa_archive, release_build_required]
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: {selector: '[data-testid="welcome-panel"]', timeout_sec: 60}
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill: {selector: '[data-testid="vault-setup-pw1"]', value: qa-original-mfa-038}
- fill: {selector: '[data-testid="vault-setup-pw2"]', value: qa-original-mfa-038}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: {selector: '[data-testid="mfa-empty"]', timeout_sec: 30}
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill: {selector: '[data-testid="mfa-add-issuer"]', value: Signed Upgrade}
- fill: {selector: '[data-testid="mfa-add-secret"]', value: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ}
- click: '[data-testid="mfa-add-advanced"]'
- select_option: {selector: '[data-testid="mfa-add-kind"]', value: hotp}
- click: '[data-testid="mfa-add-submit"]'
- assert_text_equals: {selector: '[data-testid="mfa-account-code"]', equals: 755 224}
- click: '[data-testid="mfa-account-hotp-next"]'
- assert_text_equals: {selector: '[data-testid="mfa-account-code"]', equals: 287 082}
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- press: {selector: '[data-testid="module-upgrade-mfa-open"]', key: Enter}
- fill: {selector: '[data-testid="module-upgrade-mfa-archive"]', value: '${fixture.mfa_signed_archive}'}
- fill: {selector: '[data-testid="module-upgrade-mfa-signature"]', value: '${fixture.mfa_signed_signature}'}
- fill: {selector: '[data-testid="module-upgrade-mfa-password"]', value: wrong-password}
- press: {selector: '[data-testid="module-upgrade-mfa-submit"]:not([disabled])', key: Enter}
- assert_text: {selector: '[data-testid="module-upgrade-mfa-error"]', contains: Incorrect Vault password, timeout_sec: 30}
- assert_no_runtime_errors: null
- fill: {selector: '[data-testid="module-upgrade-mfa-password"]', value: qa-original-mfa-038}
- native_confirm_mfa_upgrade_relaunch: null
- wait_for: {selector: '[data-testid="status-bar"]', timeout_sec: 60}
- wait_for: '[data-testid="vault-unlock-dialog"]'
- fill: {selector: '[data-testid="vault-unlock-pw"]', value: qa-original-mfa-038}
- click: '[data-testid="vault-unlock-confirm"]'
- assert_count: {selector: '[data-testid="vault-unlock-dialog"]', equal: 0}
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- assert_visible: '[data-testid="module-upgrade-mfa-result"][data-state="complete"]'
- assert_count: {selector: '[data-testid="module-upgrade-mfa-open"]', equal: 0}
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- assert_visible: '[data-testid="mfa-account-row"][data-issuer="Signed Upgrade"]'
- assert_text_equals: {selector: '[data-testid="mfa-account-code"]', equals: 287 082, timeout_sec: 30}
- click: '[data-testid="mfa-account-hotp-next"]'
- assert_text_equals: {selector: '[data-testid="mfa-account-code"]', equals: 359 152}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Real package verification and a valid Vault password are required before automatically restarting the app.
    actions: [21, 23, 24, 25, 26, 27, 28, 31, 32]
    checkpoints:
    - {step: 29, expectation: The wrong Vault password leaves the original UI open.}
    - {step: 32, expectation: The owned original process exits normally and the bridge attaches to its own new process.}
    - {step: 41, expectation: Settings reports a committed MFA upgrade.}
    - {step: 42, expectation: The committed profile has no remaining MFA migration action.}
    results: [29, 32, 41, 42]
  - id: R2
    requirement: The signed host reads and updates the migrated encrypted account using its retained Vault key.
    actions: [17, 19, 35, 36, 43, 44, 46, 49]
    checkpoints:
    - {step: 20, expectation: The legacy store has the counter-one RFC HOTP code.}
    - {step: 47, expectation: The original issuer appears after Vault unlock.}
    - {step: 48, expectation: The hosted account preserves the counter-one code.}
    - {step: 50, expectation: Next returns the counter-two code from the signed host.}
    - {step: 51, expectation: The relaunched UI has no unhandled runtime errors.}
    results: [47, 48, 50, 51]
  visual:
  - check: Wrong password, successful result and the migrated account are visible in the actual application.
    method: automated
    reason: The native bridge observes each application state.
  native:
  - check: The ordinary Settings flow runs the signed artifact and restarts the same isolated macOS app.
    method: automated
    reason: Both process identities, normal exit and the reattached native UI are recorded.

id: TC-SHELL-B08
title: Thirty terminals preserve active visibility, pinning and close set
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b08.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-recent-open-all"]'
- wait_for: '[data-testid="tab-item"][data-active="true"]:has-text("qa-029")'
- wait_for: '[data-testid="shell-tab-overflow"]'
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 7
- assert_not_visible: '[data-testid="shell-overview"]'
- click: '[data-testid="shell-tab-overflow"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 31
- assert_attribute:
    selector: '[data-testid="shell-tab-count"]'
    name: data-total
    equals: '31'
- click: '[data-testid="shell-tab-card"]:has-text("qa-000") [data-testid="shell-tab-card-pin"]'
- assert_attribute:
    selector: '[data-testid="shell-tab-card"]:has-text("qa-000")'
    name: data-pinned
    equals: 'true'
- click: '[data-testid="shell-tab-card"]:has-text("qa-001") [data-testid="shell-tab-card-more"]'
- click: '[data-testid="shell-tab-close-all"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-cancel"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 31
- click: '[data-testid="shell-tab-card"]:has-text("qa-001") [data-testid="shell-tab-card-more"]'
- click: '[data-testid="shell-tab-close-all"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-confirm"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 2
- assert_count:
    selector: '[data-testid="shell-tab-card"]:has-text("qa-000")'
    equal: 1
- screenshot: tc-shell-b08.png
verification:
  review: reviewed
  requirements:

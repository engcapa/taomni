id: TC-109
title: Terminal context menu exposes zoom and appearance controls
description: 'Covers the terminal right-click top-level zoom actions and the unified

  Appearance panel after the duplicate Font size submenu was removed.

  '
covers:
- F4.2
- F4.8
- F5.1
tags:
- smoke
- p1
- terminal
- right-menu
- font-size
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- right_click:
    selector: '[data-testid="terminal-pane"]'
    position:
      x: 24
      y: 24
- wait_for: '[data-testid="context-menu"]'
- assert_visible: text="Zoom in"
- assert_visible: text="Zoom out"
- assert_visible: text="Reset zoom"
- assert_not_visible: '[data-testid="context-menu"] [data-testid="context-menu-item-font-size"]'
- assert_visible: '[data-testid="context-menu-item-appearance"]'
- assert_not_visible: '[data-testid="context-menu"] [data-testid="context-menu-item-font-settings"]'
- assert_not_visible: '[data-testid="context-menu"] >> text="More fonts..."'
- assert_not_visible: '[data-testid="context-menu"] >> text="Display font ligatures"'
- hover: '[data-testid="context-menu-item-appearance"]'
- wait_for: '[data-testid="terminal-context-font-size"]'
- assert_visible: '[data-testid="terminal-context-font-select"]'
- screenshot: 109-terminal-appearance-menu.png
- click: '[data-testid^="terminal-context-theme-option-"] >> text="Kanagawa Lotus"'
- eval_readonly:
    expression: getComputedStyle(document.querySelector('[data-terminal-active]')).backgroundColor === 'rgb(242, 236, 188)' && getComputedStyle(document.querySelector('[data-terminal-active] .xterm-viewport')).backgroundColor === 'rgb(242, 236, 188)'
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector('[data-terminal-active] .xterm-screen').getBoundingClientRect().left - document.querySelector('[data-terminal-active]').getBoundingClientRect().left >= 8
    expect_truthy: true
- click:
    selector: '[data-testid="terminal-pane"]'
    position: {x: 4, y: 120}
- wait_for:
    selector: '[data-testid="context-menu"]'
    state: hidden
- screenshot: 109-terminal-light-gutter.png
- right_click:
    selector: '[data-testid="terminal-pane"]'
    position: {x: 24, y: 24}
- hover: '[data-testid="context-menu-item-appearance"]'
- click: '[data-testid="terminal-context-theme-option-kanagawa-wave"]'
- eval_readonly:
    expression: getComputedStyle(document.querySelector('[data-terminal-active]')).backgroundColor === 'rgb(31, 31, 40)' && getComputedStyle(document.querySelector('[data-terminal-active] .xterm-viewport')).backgroundColor === 'rgb(31, 31, 40)'
    expect_truthy: true
    timeout_sec: 5
- click:
    selector: '[data-testid="terminal-pane"]'
    position: {x: 4, y: 120}
- wait_for:
    selector: '[data-testid="context-menu"]'
    state: hidden
- set_viewport: {width: 800, height: 600}
- eval_readonly:
    expression: document.querySelector('[data-terminal-active] .xterm-screen').getBoundingClientRect().left - document.querySelector('[data-terminal-active]').getBoundingClientRect().left >= 8
    expect_truthy: true
    timeout_sec: 5
- screenshot: 109-terminal-dark-gutter-narrow.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Terminal context menu exposes zoom and appearance controls：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 14
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 6
      expectation: '{"assert_visible": "text=\"Zoom in\""}'
    - step: 7
      expectation: '{"assert_visible": "text=\"Zoom out\""}'
    - step: 8
      expectation: '{"assert_visible": "text=\"Reset zoom\""}'
    - step: 9
      expectation: '{"assert_not_visible": "[data-testid=\"context-menu\"] [data-testid=\"context-menu-item-font-size\"]"}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"context-menu-item-appearance\"]"}'
    - step: 11
      expectation: '{"assert_not_visible": "[data-testid=\"context-menu\"] [data-testid=\"context-menu-item-font-settings\"]"}'
    - step: 12
      expectation: '{"assert_not_visible": "[data-testid=\"context-menu\"] >> text=\"More fonts...\""}'
    - step: 13
      expectation: '{"assert_not_visible": "[data-testid=\"context-menu\"] >> text=\"Display font ligatures\""}'
    - step: 15
      expectation: '{"wait_for": "[data-testid=\"terminal-context-font-size\"]"}'
    - step: 16
      expectation: '{"assert_visible": "[data-testid=\"terminal-context-font-select\"]"}'
    results:
    - 15
    - 16
  - id: R2
    requirement: 切换浅色和深色终端主题后，左侧留白与 session 底色一致，窄窗口仍保留首列前的 8px 选择空间。
    actions: [18, 21, 24, 25, 26, 28, 30]
    checkpoints:
    - step: 19
      expectation: Kanagawa Lotus 的终端和 xterm viewport 均为 rgb(242, 236, 188)。
    - step: 20
      expectation: 首列文本左侧留白至少为 8px。
    - step: 22
      expectation: 点击左侧留白后关闭外观菜单。
    - step: 27
      expectation: Kanagawa Wave 的终端和 xterm viewport 均为 rgb(31, 31, 40)。
    - step: 29
      expectation: 点击左侧留白后关闭外观菜单。
    - step: 31
      expectation: 800px 窄窗口内首列文本左侧留白至少为 8px。
    results: [19, 20, 22, 27, 29, 31]
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

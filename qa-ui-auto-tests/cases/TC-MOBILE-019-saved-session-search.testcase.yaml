id: TC-MOBILE-019
title: Mobile Web batches and searches terminal and saved sessions
covers: [F-MOBILE-1]
tags: [mobile, control-plane]
modes: [browser]
fixtures: [mobile_web]
timeout_sec: 180
description: Production mobile bundle at phone dimensions with twenty terminal sessions, twenty saved terminal configurations and one Agent. Both lists start with eight rows, reveal eight more on demand and search the complete data without losing open actions.
steps:
- set_viewport: {width: 390, height: 844}
- open: ${fixture.mobile_endpoint}
- wait_for: '[data-testid="mobile-empty-instances"]'
- click: '[data-testid="mobile-add-instance"]'
- fill: {selector: '[data-testid="mobile-pair-code"]', value: qa-mobile-code}
- click: '[data-testid="mobile-pair-submit"]'
- wait_for: '[data-testid="mobile-session"][data-session-kind="terminal"]'
- assert_count: {selector: '[data-testid="mobile-session"]', equal: 8}
- assert_count: {selector: '[data-testid="mobile-session"][data-session-kind="agent"]', equal: 0}
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 8}
- assert_text: {selector: '[data-testid="mobile-sessions-result-count"]', contains: 共 20 个会话，当前显示 8 条}
- assert_text: {selector: '[data-testid="mobile-saved-result-count"]', contains: 共 20 个会话，当前显示 8 条}
- screenshot: mobile-session-lists-initial.png
- click: '[data-testid="mobile-sessions-more"]'
- assert_count: {selector: '[data-testid="mobile-session"]', equal: 16}
- click: '[data-testid="mobile-saved-more"]'
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 16}
- click: '[data-testid="mobile-sessions-more"]'
- assert_count: {selector: '[data-testid="mobile-session"]', equal: 20}
- assert_count: {selector: '[data-testid="mobile-sessions-more"]', equal: 0}
- click: '[data-testid="mobile-saved-more"]'
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 20}
- screenshot: mobile-session-lists-expanded.png
- fill: {selector: '[data-testid="mobile-sessions-search"]', value: '  DATABASE '}
- assert_count: {selector: '[data-testid="mobile-session"]', equal: 1}
- assert_text: {selector: '[data-testid="mobile-session"]', contains: Database maintenance}
- screenshot: mobile-session-search-filtered.png
- click: '[data-testid="mobile-sessions-search-clear"]'
- assert_count: {selector: '[data-testid="mobile-session"]', equal: 8}
- fill: {selector: '[data-testid="mobile-sessions-search"]', value: missing}
- assert_count: {selector: '[data-testid="mobile-session"]', equal: 0}
- assert_text: {selector: '[data-testid="mobile-sessions-empty-search"]', contains: 没有匹配}
- click: '[data-testid="mobile-sessions-search-clear"]'
- fill: {selector: '[data-testid="mobile-sessions-search"]', value: terminal 12}
- assert_count: {selector: '[data-testid="mobile-session"]', equal: 1}
- click: '[data-testid="mobile-session"]'
- wait_for: '[data-testid="mobile-terminal-screen"]'
- click: '[data-testid="mobile-sessions-back"]'
- wait_for: '[data-testid="mobile-sessions"]'
- wait_for: '[data-testid="mobile-saved-search"]'
- fill: {selector: '[data-testid="mobile-saved-search"]', value: '  BUILD '}
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 1}
- assert_text: {selector: '[data-testid="mobile-saved-session"]', contains: Build host}
- fill: {selector: '[data-testid="mobile-saved-search"]', value: serial}
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 1}
- assert_text: {selector: '[data-testid="mobile-saved-session"]', contains: Console}
- fill: {selector: '[data-testid="mobile-saved-search"]', value: hardware/lab}
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 1}
- assert_text: {selector: '[data-testid="mobile-saved-session"]', contains: Console}
- fill: {selector: '[data-testid="mobile-saved-search"]', value: Archive 16}
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 1}
- assert_text: {selector: '[data-testid="mobile-saved-session"]', contains: Archive 16}
- fill: {selector: '[data-testid="mobile-saved-search"]', value: missing}
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 0}
- assert_text: {selector: '[data-testid="mobile-saved-empty-search"]', contains: 没有匹配}
- screenshot: mobile-saved-search-empty.png
- click: '[data-testid="mobile-saved-search-clear"]'
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 8}
- fill: {selector: '[data-testid="mobile-saved-search"]', value: console}
- assert_count: {selector: '[data-testid="mobile-saved-session"]', equal: 1}
- screenshot: mobile-saved-search-filtered.png
- click: '[data-testid="mobile-saved-open"]'
- wait_for: '[data-testid="mobile-terminal-screen"]'
- assert_file_contains: {path: '${fixture.mobile_receipt}', contains: 'OPEN saved lab'}
- eval_readonly:
    expression: document.documentElement.scrollWidth <= innerWidth
    expect_truthy: true
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Initial session-list counts and screenshots
    actions: [4, 5, 6, 7]
    checkpoints:
    - {step: 8, expectation: Terminal count is eight}
    - {step: 9, expectation: Agent rows are absent}
    - {step: 10, expectation: Saved count is eight}
    - {step: 11, expectation: Terminal result count reports twenty total and eight visible}
    - {step: 12, expectation: Saved result count reports twenty total and eight visible}
    results: [8, 9, 10, 11, 12]
  - id: R2
    requirement: Session loading reaches twenty entries and captures the expanded list.
    actions: [14, 16, 18, 21]
    checkpoints:
    - {step: 15, expectation: Sixteen sessions are visible}
    - {step: 17, expectation: Sixteen saved sessions are visible}
    - {step: 19, expectation: Twenty sessions are visible}
    - {step: 20, expectation: No more sessions are available}
    - {step: 22, expectation: Twenty saved sessions are visible}
    results: [15, 17, 19, 20, 22]
  - id: R3
    requirement: Active-session search covers summaries, empty results, clearing, and title matching.
    actions: [24, 28, 30, 33, 34]
    checkpoints:
    - {step: 25, expectation: Summary search finds one result}
    - {step: 26, expectation: Summary contains Database maintenance}
    - {step: 29, expectation: Clearing restores eight results}
    - {step: 31, expectation: Missing query yields zero sessions}
    - {step: 32, expectation: Empty message is visible}
    - {step: 35, expectation: Title search finds one session}
    results: [25, 26, 29, 31, 32, 35]
  - id: R4
    requirement: Saved-session search covers name, type, group, empty, and clear behavior.
    actions: [41, 44, 47, 50, 53, 57, 59]
    checkpoints:
    - {step: 42, expectation: Name query returns one session}
    - {step: 43, expectation: Build host is visible}
    - {step: 45, expectation: Serial query finds one session}
    - {step: 46, expectation: Console text is visible}
    - {step: 48, expectation: Group query returns one session}
    - {step: 49, expectation: Console group text is visible}
    - {step: 51, expectation: Archive query finds one result}
    - {step: 52, expectation: Archive 16 text is visible}
    - {step: 54, expectation: Missing query returns zero saved sessions}
    - {step: 55, expectation: Empty message is visible}
    - {step: 58, expectation: Clear restores eight saved sessions}
    - {step: 60, expectation: Final console query finds exactly one result}
    results: [42, 43, 45, 46, 48, 49, 51, 52, 54, 55, 58, 60]
  - id: R5
    requirement: Filtered session opening retains identity and responsive layout.
    actions: [36, 38, 62]
    checkpoints:
    - {step: 37, expectation: Filtered terminal opens}
    - {step: 39, expectation: Session workspace is visible}
    - {step: 63, expectation: Saved session opens}
    - {step: 64, expectation: Receipt records saved lab}
    - {step: 65, expectation: Viewport has no overflow}
    - {step: 66, expectation: Runtime has no errors}
    results: [37, 39, 63, 64, 65, 66]
  visual:
  - check: Initial eight-row, filtered and opened-session views remain readable at 390x844 without horizontal overflow or runtime errors.
    method: automated
    reason: Screenshots, exact row counts, status text and a runtime-error assertion cover the browser renderer; physical-device appearance and native mobile pane behavior remain owned by other cases.
  native:
  - check: Native listener, IPC and PTY effects.
    method: not-applicable
    reason: This case exercises only the production browser renderer against a deterministic peer; the mandatory native crash-regression cases cover the native mobile boundary.

  visual:
  - check: Phone controls and output remain readable without horizontal overflow.
    method: automated
    reason: Geometry assertions and diagnostic phone screenshots; physical devices remain unverified.
  native:
  - check: Native networking is outside the deterministic renderer peer.
    method: not-applicable
    reason: TC-MOBILE-007 uses actual Tauri IPC, russh, a loopback SSH peer and native platform shell.

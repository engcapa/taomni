    checkpoints:
    - step: 10
      expectation: A fresh login round prefills the account and masks an empty password.
    - step: 14
      expectation: Next SSH authentication round replaces the login form.
    - step: 18
      expectation: Independent peer receipt contains AUTH login.
    - step: 19
      expectation: Independent peer receipt contains AUTH otp.
    - step: 20
      expectation: Neither password nor OTP is persisted in phone storage.
    - step: 23
      expectation: Default full viewport has at least 450px of output and compact keys without a system input field taking focus.
    - step: 28
      expectation: Independent peer receipt contains PTY q.
    - step: 29
      expectation: Independent peer receipt contains PTY \x03.
    - step: 30
      expectation: Independent peer receipt contains PTY \r.
    - step: 39
      expectation: Shift/symbol/space/backspace input reaches the peer, and hiding the input area restores output space.
    - step: 40
      expectation: Shift/symbol/space/backspace input reaches the peer, and hiding the input area restores output space.
    - step: 41
      expectation: Shift/symbol/space/backspace input reaches the peer, and hiding the input area restores output space.
    - step: 42
      expectation: Shift/symbol/space/backspace input reaches the peer, and hiding the input area restores output space.
    - step: 44
      expectation: Shift/symbol/space/backspace input reaches the peer, and hiding the input area restores output space.
    - step: 51
      expectation: Switching input modes preserves the unsent native IME draft.
    - step: 54
      expectation: Short portrait keeps terminal output and input mode controls inside the viewport.
    - step: 56
      expectation: Landscape keeps terminal and compact keyboard usable without overflow.
    - step: 63
      expectation: Server-acknowledged cancellation removes this round and the opening state.
    - step: 64
      expectation: Independent peer receipt contains CANCEL qa-open-2.
    - step: 67
      expectation: Independent peer receipt contains OPEN local.
    - step: 68
      expectation: No runtime errors throughout authentication, mode changes, cancellation and local opening.
    - step: 74
      expectation: Direct system typing reaches PTY before Tab, without implicit Enter.
    - step: 75
      expectation: Direct input focuses xterm for immediate keyboard and IME input.
    - step: 77
      expectation: Compact mode disables system keyboard on output taps.
    - step: 78
      expectation: No runtime errors after direct typing.
    results:

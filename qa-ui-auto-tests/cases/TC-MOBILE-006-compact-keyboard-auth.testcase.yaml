id: TC-MOBILE-006
title: Compact phone keyboard and transient multi-round connection authentication
covers:
- F-MOBILE-1
tags:
- mobile
- terminal
- authentication
modes:
- browser
fixtures:
- mobile_web
timeout_sec: 150
description: Production mobile bundle with deterministic HTTP/WS peer. Native SSH/password/private-key/OTP ownership is verified by TC-MOBILE-007 and Rust
  service tests.
steps:
- set_viewport:
    width: 390
    height: 844
- open: ${fixture.mobile_endpoint}
- wait_for: '[data-testid="mobile-add-instance"]'
- click: '[data-testid="mobile-add-instance"]'
- fill:
    selector: '[data-testid="mobile-pair-code"]'
    value: qa-mobile-code
- click: '[data-testid="mobile-pair-submit"]'
- wait_for: '[data-testid="mobile-saved-open"]'
- click: '[data-testid="mobile-saved-open"]'
- wait_for: '[data-testid="mobile-connection-auth"]'
- eval_readonly:
    expression: document.querySelector('.connection-auth input').value === 'developer' && document.querySelector('.connection-auth label:last-of-type input').type
      === 'password' && !document.querySelector('.connection-auth label:last-of-type input').value
    expect_truthy: true
    timeout_sec: 5
- fill:
    selector: '[data-testid="mobile-auth-answer-0"]'
    value: phone-user
- fill:
    selector: '[data-testid="mobile-auth-answer-1"]'
    value: qa-temp-secret
- click: '[data-testid="mobile-auth-submit"]'
- assert_text:
    selector: '[data-testid="mobile-connection-auth"]'
    contains: SSH 验证码
- fill:
    selector: '[data-testid="mobile-auth-answer-0"]'
    value: '123456'
- click: '[data-testid="mobile-auth-submit"]'
- wait_for: '[data-testid="mobile-terminal-screen"]'
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: AUTH login
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: AUTH otp
- eval_readonly:
    expression: '!JSON.stringify(localStorage).includes(''qa-temp-secret'') && !JSON.stringify(localStorage).includes(''123456'')'
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid="mobile-take-control"]'
- wait_for: '[data-testid="mobile-compact-keyboard"]'
- eval_readonly:
    expression: document.documentElement.classList.contains('terminal-fullscreen') && document.querySelector('.terminal').offsetHeight >= 450 && !document.querySelector('.command-bar').offsetHeight
      && document.activeElement?.tagName !== 'TEXTAREA'
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid="mobile-type-q"]'
- click: '[data-testid="mobile-key-ctrl"]'
- click: '[data-testid="mobile-type-c"]'
- click: '[data-testid="mobile-type-enter"]'
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY q
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY \x03
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY \r
- click: .compact-keyboard button[aria-label="Shift"]
- click: '[data-testid="mobile-type-A"]'
- click: .compact-keyboard button[aria-label="切换数字符号"]
- click: '[data-testid="mobile-type-1"]'
- click: .compact-keyboard button[aria-label="Shift"]
- click: '[data-testid="mobile-type-!"]'
- click: '[data-testid="mobile-type-space"]'
- click: '[data-testid="mobile-type-backspace"]'
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY A
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY 1
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY !
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY \x7f
- click: '[data-testid="mobile-input-hide"]'
- assert_count:
    selector: '[data-testid="mobile-compact-keyboard"]'
    equal: 0
- click: '[data-testid="mobile-input-compact"]'
- wait_for: '[data-testid="mobile-compact-keyboard"]'
- click: '[data-testid="mobile-terminal-keyboard"]'
- fill:
    selector: '[data-testid="mobile-terminal-command"]'
    value: echo 中文草稿
- click: '[data-testid="mobile-input-compact"]'
- click: '[data-testid="mobile-terminal-keyboard"]'
- eval_readonly:
    expression: document.querySelector('.command-bar input').value === 'echo 中文草稿'
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid="mobile-input-compact"]'
- set_viewport:
    width: 390
    height: 400
- eval_readonly:
    expression: document.querySelector('.terminal').offsetHeight >= 100 && document.querySelector('.input-modes').getBoundingClientRect().bottom <= innerHeight+1
      && document.documentElement.scrollWidth <= innerWidth
    expect_truthy: true
    timeout_sec: 5
- set_viewport:
    width: 844
    height: 390
- eval_readonly:
    expression: document.querySelector('.terminal').offsetHeight >= 100 && document.querySelector('.input-modes').getBoundingClientRect().bottom <= innerHeight+1
      && document.documentElement.scrollWidth <= innerWidth
    expect_truthy: true
    timeout_sec: 5
- set_viewport:
    width: 390
    height: 844
- screenshot: mobile-compact-keyboard.png
- click: '[data-testid="mobile-terminal-back"]'
- click: '[data-testid="mobile-saved-open"]'
- wait_for: '[data-testid="mobile-connection-auth"]'
- click: '[data-testid="mobile-auth-cancel"]'
- eval_readonly:
    expression: '!document.querySelector(''.connection-auth'') && !document.querySelector(''.open-status'')'
    expect_truthy: true
    timeout_sec: 5
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: CANCEL qa-open-2
- click: '[data-testid="mobile-open-local"]'
- wait_for: '[data-testid="mobile-terminal-screen"]'
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: OPEN local
- assert_no_runtime_errors: null
- assert_text:
    selector: '[data-testid="mobile-terminal-status"]'
    contains: 控制中
- assert_text:
    selector: '[data-testid="mobile-terminal-status"]'
    contains: 控制中
- click: '[data-testid="mobile-input-direct"]'
- type:
    selector: '[data-testid="mobile-terminal-screen"] .xterm-helper-textarea'
    text: git che
- click: '[data-testid="mobile-key-tab"]'
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: DIRECT git che\t
- eval_readonly:
    expression: document.querySelector(".xterm-helper-textarea").inputMode === "text" && document.activeElement === document.querySelector(".xterm-helper-textarea")
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid="mobile-input-compact"]'
- eval_readonly:
    expression: document.querySelector(".xterm-helper-textarea").inputMode === "none"
    expect_truthy: true
    timeout_sec: 5
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Compact keyboard sends real terminal frames without editable focus; system drafts survive mode switches. Login and OTP use separate masked
      transient rounds, cancellation waits for the server and a subsequent local open succeeds.

id: TC-110
title: Terminal split view supports layouts, input locks, and MultiExec target count
covers:
- F-Split-1
- F4.11
- F2.2
tags:
- smoke
- p1
- terminal
- split
- multiexec
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 20
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="tab-item"][data-tab-type="terminal"][data-active="true"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 2
- click: '[data-testid="tab-split-view"]'
- wait_for:
    selector: '[data-testid="terminal-split-toolbar"]'
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-panes"]'
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-resize-handle"]'
- click: '[data-testid="terminal-split-layout-vertical"]'
- assert_attribute:
    selector: '[data-testid="terminal-split-panes"]'
    name: data-layout
    equals: vertical
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-resize-handle"]'
- click: '[data-testid="terminal-split-layout-grid"]'
- assert_attribute:
    selector: '[data-testid="terminal-split-panes"]'
    name: data-layout
    equals: grid
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-grid-column-resize-handle"]'
- click: '[data-testid="terminal-split-layout-horizontal"]'
- assert_attribute:
    selector: '[data-testid="terminal-split-panes"]'
    name: data-layout
    equals: horizontal
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid^="terminal-split-lock-"]'
- assert_visible: '[data-testid="terminal-input-locked"]'
- click: '[data-testid="tab-multiexec-toggle"]'
- wait_for:
    selector: '[data-testid="multiexec-bar"]'
    timeout_sec: 5
- click: '[data-testid="multiexec-bar"] button[title="Clear selection"]'
- assert_text:
    selector: '[data-testid="multiexec-bar"]'
    contains: 0 / 2
- click: '[data-testid="multiexec-bar"] button[title="Select all terminals"]'
- assert_text:
    selector: '[data-testid="multiexec-bar"]'
    contains: 1 / 2
- screenshot: 110-terminal-split-smoke.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Split layouts, resize handles, input locks and MultiExec retain their behavior. The active terminal keeps its first-column gutter and fits the available pane in horizontal, vertical and grid layouts.
    actions:
    - 1
    - 3
    - 5
    - 8
    - 15
    - 21
    - 27
    - 32
    - 34
    - 36
    - 38
    checkpoints:
    - step: 7
      expectation: '{assert_count: {equal: 2, selector: ''[data-testid="tab-item"][data-tab-type="terminal"]''}}'
    - step: 10
      expectation: '{assert_visible: ''[data-testid="terminal-split-panes"]''}'
    - step: 12
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8'', timeout_sec: 5}}'
    - step: 13
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right'', timeout_sec: 5}}'
    - step: 14
      expectation: '{assert_visible: ''[data-testid="terminal-split-resize-handle"]''}'
    - step: 16
      expectation: '{assert_attribute: {equals: vertical, name: data-layout, selector: ''[data-testid="terminal-split-panes"]''}}'
    - step: 18
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8'', timeout_sec: 5}}'
    - step: 19
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right'', timeout_sec: 5}}'
    - step: 20
      expectation: '{assert_visible: ''[data-testid="terminal-split-resize-handle"]''}'
    - step: 22
      expectation: '{assert_attribute: {equals: grid, name: data-layout, selector: ''[data-testid="terminal-split-panes"]''}}'
    - step: 24
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8'', timeout_sec: 5}}'
    - step: 25
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right'', timeout_sec: 5}}'
    - step: 26
      expectation: '{assert_visible: ''[data-testid="terminal-split-grid-column-resize-handle"]''}'
    - step: 28
      expectation: '{assert_attribute: {equals: horizontal, name: data-layout, selector: ''[data-testid="terminal-split-panes"]''}}'
    - step: 30
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8'', timeout_sec: 5}}'
    - step: 31
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right'', timeout_sec: 5}}'
    - step: 33
      expectation: '{assert_visible: ''[data-testid="terminal-input-locked"]''}'
    - step: 37
      expectation: '{assert_text: {contains: 0 / 2, selector: ''[data-testid="multiexec-bar"]''}}'
    - step: 39
      expectation: '{assert_text: {contains: 1 / 2, selector: ''[data-testid="multiexec-bar"]''}}'
    results:
    - 7
    - 10
    - 12
    - 13
    - 14
    - 16

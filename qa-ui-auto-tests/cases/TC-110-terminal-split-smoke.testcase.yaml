  visual:
  - check: Inspect first-column gutters and screen clipping in the split screenshot.
    method: manual
    reason: DOM geometry checks cover each layout; screenshots require visual review.
  native:
  - check: Verify split layouts and terminal gutters in the packaged WebView on each selected OS.
    method: automated
    reason: Browser verifies the shared split renderer; native repeats the layout checks with actual local terminals. Selection and OS clipboard correctness are independently covered by TC-155.

id: TC-110
title: Terminal split view supports layouts, input locks, and MultiExec target count
covers:
- F-Split-1
- F4.11
- F2.2
tags:
- smoke
- p1
- terminal
- split
- multiexec
modes:
- browser
- native
fixtures:
- reset_db
- local_terminal_preview
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 20
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="tab-item"][data-tab-type="terminal"][data-active="true"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 2
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- wait_for: '[data-testid="context-menu-item-split-terminal"]'
- click: '[data-testid="context-menu-item-split-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-split-toolbar"]'
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-panes"]'
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left
      - document.querySelector("[data-terminal-active]").getBoundingClientRect().left
      >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right
      <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-resize-handle"]'
- click: '[data-testid="terminal-split-layout-vertical"]'
- assert_attribute:
    selector: '[data-testid="terminal-split-panes"]'
    name: data-layout
    equals: vertical
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left
      - document.querySelector("[data-terminal-active]").getBoundingClientRect().left
      >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right
      <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-resize-handle"]'
- click: '[data-testid="terminal-split-layout-grid"]'
- assert_attribute:
    selector: '[data-testid="terminal-split-panes"]'
    name: data-layout
    equals: grid
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left
      - document.querySelector("[data-terminal-active]").getBoundingClientRect().left
      >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right
      <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- assert_visible: '[data-testid="terminal-split-grid-column-resize-handle"]'
- click: '[data-testid="terminal-split-layout-horizontal"]'
- assert_attribute:
    selector: '[data-testid="terminal-split-panes"]'
    name: data-layout
    equals: horizontal
- wait: 0.4
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left
      - document.querySelector("[data-terminal-active]").getBoundingClientRect().left
      >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right
      <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid^="terminal-split-lock-"]'
- assert_visible: '[data-testid="terminal-input-locked"]'
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- wait_for: '[data-testid="context-menu-item-multiexec"]'
- click: '[data-testid="context-menu-item-multiexec"]'
- wait_for:
    selector: '[data-testid="multiexec-bar"]'
    timeout_sec: 5
- click: '[data-testid="multiexec-bar"] button[title="Clear selection"]'
- assert_text:
    selector: '[data-testid="multiexec-bar"]'
    contains: 0 / 2
- click: '[data-testid="multiexec-bar"] button[title="Select all terminals"]'
- assert_text:
    selector: '[data-testid="multiexec-bar"]'
    contains: 1 / 2
- screenshot: 110-terminal-split-smoke.png
verification:

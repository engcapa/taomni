id: TC-MAIL-STORAGE-05
title: Publish complete originals before large mailbox history finishes and resume safely
description: Native loopback IMAP with 350 messages, multiple header pages, and controlled FETCH latency.
  Independent SQLite/gzip observations require readable complete originals while the header watermark
  is still incomplete. Pause, read an original, reopen the tab, resume, verify every original and attachment,
  and rescan without duplicates. Renderer progress checks are also covered by browser TC-MAIL-STORAGE-04;
  browser stubs cannot prove IMAP batch ordering or persisted bytes. The independent header sync may continue
  after full-original storage is paused; incomplete history is asserted at the first publication observation.
covers:
- F-MAIL-23
tags:
- mail
- p1
modes:
- native
fixtures:
- reset_db
- mail_server
- mail_archive_batches
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:
    selector: input[aria-label="IMAP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-imap-security"]'
    value: None
- fill:
    selector: input[aria-label="IMAP port"]
    value: ${fixture.mail_imap_port}
- fill:
    selector: input[aria-label="Mail email or username"]
    value: qa@example.com
- fill:
    selector: input[aria-label="Mail password or app password token"]
    value: qa-pass
- fill:
    selector: input[aria-label="SMTP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-smtp-security"]'
    value: None
- fill:
    selector: input[aria-label="SMTP port"]
    value: ${fixture.mail_smtp_port}
- fill:

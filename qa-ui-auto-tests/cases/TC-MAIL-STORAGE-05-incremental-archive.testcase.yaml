    value: ${fixture.mail_storage_a}
- select_option:
    selector: '[data-testid="mail-storage-mode"]'
    value: include
- assert_text:
    selector: '[data-testid="mail-storage-settings"]'
    contains: No cached folders. Connect and sync this account first
- assert_count:
    selector: '[data-testid="mail-storage-folders"] input'
    equal: 0
- click: '[data-testid="mail-storage-edit-folders"]'
- fill:
    selector: '[data-testid="mail-storage-folder-names"]'
    value: INBOX
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: QA incremental mail
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-mail-storage-password
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 60
- wait_for: '[data-testid="session-tree-item"][data-session-name="QA incremental mail"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="QA incremental mail"]'
- mail_storage_assert:
    kind: incremental
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    timeout_sec: 30
- click: '[data-testid="mail-storage-pause"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: paused
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-header-progress"]'
    contains: /350
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-original-progress"]'
    contains: 'Saved this scan:'
    timeout_sec: 60
- screenshot: mail-incremental-paused-progress.png
- click: '[data-testid="mail-archive-open"]'
- wait_for: '[data-testid="mail-archive-row"]'
- click: '[data-testid="mail-archive-row"]:first-child [data-testid="mail-archive-read"]'
- assert_text:
    selector: '[data-testid="mail-archive-preview"]'
    contains: batch.bin
    timeout_sec: 60
- click: '[data-testid="mail-archive-preview"] [data-testid="mail-body-mode-plain"]'
- assert_text:
    selector: '[data-testid="mail-archive-preview"]'
    contains: Readable before history completes
    timeout_sec: 60
- screenshot: mail-incremental-readable-original.png
- click: '[data-testid="mail-archive-close"]'
- assert_not_visible: '[data-testid="mail-archive-dialog"]'
- click: '[data-testid="tab-item"][data-tab-type="mail"] [data-testid="tab-close"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="QA incremental mail"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: paused
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-header-progress"]'
    contains: /350
    timeout_sec: 60
- click: '[data-testid="mail-storage-resume"]'
- wait_for:
    selector: '[data-testid="mail-storage-resume"]:enabled'
    timeout_sec: 120
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 60
- mail_storage_assert:
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    full:
      INBOX: 350
    headers:
      INBOX: 350
    timeout_sec: 60
- click: '[data-testid="mail-archive-open"]'
- wait_for: '[data-testid="mail-archive-row"]'
- assert_count:
    selector: '[data-testid="mail-archive-row"]'
    equal: 200
- click: '[data-testid="mail-archive-next"]'
- wait_for:
    selector: '[data-testid="mail-archive-refresh"]:enabled'
    timeout_sec: 60
- assert_count:
    selector: '[data-testid="mail-archive-row"]'
    equal: 150
- click: '[data-testid="mail-archive-close"]'
- assert_not_visible: '[data-testid="mail-archive-dialog"]'
- click: '[data-testid="mail-storage-resume"]'
- wait_for:
    selector: '[data-testid="mail-storage-resume"]:enabled'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-original-progress"]'
    contains: 'Saved this scan: 0'
    timeout_sec: 60
- mail_storage_assert:
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    full:
      INBOX: 350
    headers:
      INBOX: 350

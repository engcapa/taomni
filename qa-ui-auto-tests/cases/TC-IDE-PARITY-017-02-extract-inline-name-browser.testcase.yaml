id: TC-IDE-PARITY-017-02
title: Extract Method names the new method in place; Esc keeps the default name
description: 'ED-PARITY-017 A1/A3 browser case on the controlled parity007 Java provider: Extract Method commits directly and opens the in-place naming session on the extracted method (no naming dialog); Enter renames call and declaration; undo removes the rename then the extraction; Esc twice keeps the default name.


  Mode: browser.

  '

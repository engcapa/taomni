id: TC-IDE-PARITY-018-01
title: Git and Commit entries share the dedicated Workspace Git surface
description: ED-PARITY-028 replaces the embedded location of ED-PARITY-018; preserves repository identities, commit
  draft, keyboard return and editor focus.
covers:
- F25.5
- F26.2
- F-Workspace-1
tags:
- code-workspace
- git
- ed-parity-018
- p1
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity008_root}"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for:
    selector: '[data-testid="code-workspace-git-panel-toggle"]:not([disabled])'
    timeout_sec: 30
- press: Alt+9
- wait_for: '[data-testid="workspace-git-surface"] [data-testid="workspace-git-manager"]'
- wait_for: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- assert_items:
    selector: '[data-testid="workspace-flat-repo-header"]'
    equals:
    - repo-amain2/2
    - repo-bmain1/1
- assert_attribute:
    selector: '[data-testid="workspace-surface-changes"]'
    name: aria-selected
    equals: 'true'
- fill:
    selector: '[data-testid="workspace-git-manager"] textarea'
    value: draft kept across surfaces
- press:
    key: Shift+Escape
    selector: '[data-testid="workspace-git-manager"] textarea'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- eval_readonly:
    expression: document.activeElement?.classList.contains('cm-content') === true
    expect_truthy: true
- click: '[data-testid="code-workspace-tool-rail-commit"]'
- wait_for: '[data-testid="workspace-git-surface"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-git-manager"] textarea').value
      === 'draft kept across surfaces'
    expect_truthy: true
- click: '[data-testid="workspace-surface-files"]'
- press:
    key: Alt+0
    macos_key: Alt+0
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for: '[data-testid="workspace-git-surface"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-git-manager"] textarea').value
      === 'draft kept across surfaces'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll('[data-testid'+String.fromCharCode(61)+'"workspace-git-manager"]').length
      === 1
    expect_truthy: true
- screenshot: workspace-git-dedicated.png
verification:
  review: pending
  requirements:

id: TC-IDE-PARITY-018-01
title: Workspace Git tool window (Alt+9 / rail icon) shows this workspace repositories
description: Alt+9 opens both repositories in the bottom Git tool window. The grouped rail has one Git tool window icon; Shift+Esc hides it and restores
  editor focus. The icon reopens the same changes without a duplicate Commit entry.
covers:
- F25.5
tags:
- code-workspace
- git
- ed-parity-018
- p1
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity008_root}"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for:
    selector: '[data-testid="code-workspace-tool-rail-git"]:not([disabled])'
    timeout_sec: 30
- press: Alt+9
- wait_for:
    selector: '[data-testid="code-workspace-git-tool-window"] [data-testid="workspace-git-manager"]'
    timeout_sec: 15
- wait_for:
    selector: '[data-testid="code-workspace-git-tool-window"] [data-testid="workspace-change-row"][data-repo-root="${fixture.parity008_root}/repo-b"][data-path="same.txt"]'
    timeout_sec: 15
- assert_attribute:
    selector: '[data-testid="code-workspace-bottom-tab-git"]'
    name: aria-pressed
    equals: 'true'
- assert_count:
    selector: '[data-testid="code-workspace-tool-rail-commit"]'
    equal: 0
- assert_items:
    selector: '[data-testid="code-workspace-git-tool-window"] [data-testid="workspace-flat-repo-header"]'
    equals:
    - repo-amain2/2
    - repo-bmain1/1
- press: Shift+Escape
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open]'
    state: detached
    timeout_sec: 5
- eval_readonly:
    expression: document.activeElement?.classList.contains('cm-content') === true
    expect_truthy: true
- click: '[data-testid="code-workspace-bottom-tab-git"]'
- wait_for:
    selector: '[data-testid="code-workspace-git-tool-window"] [data-testid="workspace-change-row"]'
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="code-workspace-bottom-tab-git"]'
    name: aria-label
    equals: Git
- click: '[data-testid="code-workspace-bottom-tab-git"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open]'
    state: detached
    timeout_sec: 5
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A1/DEC-018-01：Alt+9 在 workspace 底部打开 Git 工具窗，内含本 workspace 两个仓库的变更（repo 标识不串）。
    actions:
    - 8
    checkpoints:
    - step: 7
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tool-rail-git\"]:not([disabled])", "timeout_sec": 30}}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-git-tool-window\"] [data-testid=\"workspace-git-manager\"]", "timeout_sec":
        15}}'
    - step: 10
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-git-tool-window\"] [data-testid=\"workspace-change-row\"][data-repo-root=\"${fixture.parity008_root}/repo-b\"][data-path=\"same.txt\"]",
        "timeout_sec": 15}}'
    - step: 11
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-bottom-tab-git\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 13
      expectation: '{"assert_items": {"selector": "[data-testid=\"code-workspace-git-tool-window\"] [data-testid=\"workspace-flat-repo-header\"]", "equals":
        ["repo-amain2/2", "repo-bmain1/1"]}}'
    results:
    - 7
    - 9
    - 10
    - 11
    - 13
  - id: R2
    requirement: Git 工具窗使用单一无标签图标，旧重复 Commit 入口消失；Shift+Esc 隐藏并返回编辑器，点击 Git 工具图标重新打开相同仓库变更。
    actions:
    - 14
    - 17
    - 20
    checkpoints:
    - step: 12
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tool-rail-commit\"]", "equal": 0}}'
    - step: 15
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-bottom-dock\"][data-open]", "state": "detached", "timeout_sec": 5}}'
    - step: 16
      expectation: '{"eval_readonly": {"expression": "document.activeElement?.classList.contains(''cm-content'') === true", "expect_truthy": true}}'
    - step: 18
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-git-tool-window\"] [data-testid=\"workspace-change-row\"]", "timeout_sec":
        10}}'
    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-bottom-tab-git\"]", "name": "aria-label", "equals": "Git"}}'
    - step: 21
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-bottom-dock\"][data-open]", "state": "detached", "timeout_sec": 5}}'
    results:
    - 12
    - 15
    - 16
    - 18
    - 19
    - 21
  visual:
  - check: 对照 IDEA Git/Commit 工具窗位置与结构。
    method: manual
    reason: IDEA Commit 为左侧工具窗，Taomni 为底部（different）。
  native:
  - check: browser 使用受控 Git provider；真实仓库零写入由 TC-IDE-PARITY-008-03 native 证明。
    method: not-applicable
    reason: browser 证据不外推 native。

  visual:
  - check: The saved forward rows and updated endpoints remain readable without clipping in the editor.
    method: manual
    reason: Value assertions do not establish row layout or text clipping.
  native:
  - check: Native SQLite persistence of the initial SSH forward configuration is exercised by TC-003; this renderer edit case uses the browser storage bridge.
    method: external
    reason: Browser mode cannot establish the packaged app's database write path.

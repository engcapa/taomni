id: TC-RDPJ-03-deferred-clipboard-publication
title: Delayed macOS host text publication is forwarded once without an echo loop
description: Real AppKit declares the text type 1.2 seconds before publishing the Unicode payload, without changing its token again. The fixture records
  actual token values and rejects invalid publication. Use the normal product RDP client/server on one computer; retain the complete original announcement,
  clipboard contents, six-second quiet period and shutdown assertions. No clipboard polling observer or protocol results are mocked.
covers:
- F-RdpServer-1
- F9.7
tags:
- rdp
- rdp-server
- rdp-client
- joint
- clipboard
- p1
- regression
- deferred-publication
modes:
- native
fixtures:
- reset_db
- rdp_server_required
- system_rdp_running
- rdp_deferred_clipboard
timeout_sec: 420

id: TC-SHELL-B51
title: Held-Control MRU cycles commit once and Escape restores origin
description: Production entry regression after main merge and Shell simplification. Browser IPC faults are controlled
  external-boundary fixtures, not native evidence.
covers:
- F-SHELL-1
tags:
- workspace-shell
- p1
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- click: '[data-testid="shell-rail-home"]'
- keyboard_sequence:
  - down: Control
  - press: Tab
  - press: Tab
  - up: Control
- assert_text_equals:
    selector: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
    equals: qa-alpha
- click: '[data-testid="shell-rail-home"]'
- keyboard_sequence:
  - down: Control
  - press: Tab
  - press: Escape
  - up: Control
- assert_visible: '[data-testid="welcome-panel"]'
- keyboard_sequence:
  - down: Control
  - down: Shift
  - press: Tab
  - up: Shift
  - up: Control
- assert_text_equals:
    selector: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
    equals: qa-beta
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 2
- screenshot: held-mru.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Two Tab presses while holding Control advance twice even when a terminal takes focus.
    actions:
    - 3
    - 5
    - 6
    - 8
    - 9
    checkpoints:
    - step: 10
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"tab-item\"][data-active=\"true\"] [data-testid=\"tab-title\"]",
        "equals": "qa-alpha"}}'
    results:
    - 10
  - id: R2
    requirement: Escape cancels the cycle; reverse cycling reaches the expected retained terminal without new instances.
    actions:
    - 11
    - 12
    - 14
    checkpoints:
    - step: 13
      expectation: '{"assert_visible": "[data-testid=\"welcome-panel\"]"}'
    - step: 15
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"tab-item\"][data-active=\"true\"] [data-testid=\"tab-title\"]",
        "equals": "qa-beta"}}'
    - step: 16
      expectation: '{"assert_count": {"selector": "[data-testid=\"terminal-pane\"]", "equal": 2}}'
    results:
    - 13
    - 15
    - 16
  visual:
  - check: Review captured layout for clipped controls and content.
    method: manual
    reason: DOM visibility does not prove visual quality.
  native:
  - check: Native boundaries
    method: not-applicable
    reason: This case establishes renderer routing only.

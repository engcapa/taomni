id: TC-WS-054
title: 'Crash regression: release WebView multi-file layouts, cold restart and exact disk save'
description: Runs toolbar layouts through production controls and real editor/store owners in the matching QA release WebView. Verifies four real files,
  exact saved bytes, a process cold restart with the initially empty vault, and layouts after restoration. No layout or resizable-panel mocks.
modes:
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-5
- F25.3
- F25.5
tags:
- p0
- workspace-redesign
- regression
- crash-regression
- component-upgrade
fixtures:
- reset_db
- workspace_explorer
- release_build_required
timeout_sec: 300

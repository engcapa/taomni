id: TC-WS-054
title: 'Crash regression: release WebView multi-file layouts, cold restart and exact disk save'
description: Runs toolbar layouts through production controls and real editor/store owners in the matching QA release WebView. Verifies four real files,
  exact saved bytes, a process cold restart with the initially empty vault, and layouts after restoration. No layout or resizable-panel mocks. Repeats four
  consecutive narrow/wide editor geometry cycles with Documentation and sidebar resizing, then saves long and short content before cold restart. Also checks
  undo/redo, dirty state and unchanged disk bytes after the first wide save; preserves the LSP-decoration selection regression without retrying or replaying
  input.
modes:
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-5
- F25.3
- F25.5
tags:
- p0
- workspace-redesign
- regression
- crash-regression
- component-upgrade

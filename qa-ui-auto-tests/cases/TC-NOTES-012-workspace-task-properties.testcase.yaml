id: TC-NOTES-012
title: Notes Workspace and Tao Notes share task properties without saving dirty text
description: Uses both Notes entry points and the shared task UI. Native additionally verifies real SQLite metadata
  IPC and persistence after WebView reload.
covers:
- F-TAO-1
- F-WS-1
tags:
- notes
- regression
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-notes-parity
- click: '[data-testid="rail-chat-button"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- click: '[data-testid="notes-open-workspace"]'
- click: '[data-testid="notes-workspace-new"]'
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-title"]'
    value: Task parity
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-save"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-properties"]
    > summary'
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    key: Mod+A
- type:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    text: '# Unsaved task draft'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-pin"]'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-pin"][aria-pressed="true"]'
    timeout_sec: 10
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-priority"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-priority-menu"]
    [role="option"]:nth-child(4)'
- assert_text:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-priority"]'
    contains: High
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-due"]'
    value: 2035-06-15 16:30
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-due"]'
    key: Escape
- blur: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-due"]'
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-reminder"]'
    value: 2035-06-14 09:00
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-reminder"]'
    key: Escape
- blur: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-reminder"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-color-#10b981"]'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-color-#10b981"][aria-pressed="true"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-new-step"]'
    value: Check native persistence
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-new-step"]'
    key: Enter
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"]'
    timeout_sec: 10
- assert_count:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"]'
    equal: 1
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"]
      input'
    value: Verify shared task fields
- blur: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"] input'
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"]
      input'
    name: value
    equals: Verify shared task fields
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step-complete"]'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step-complete"][aria-pressed="true"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-new-tag"]'
    value: parity-tag
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-new-tag"]'
    key: Enter
- assert_text:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tag"]'
    contains: parity-tag
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"]'
    name: data-dirty
    equals: 'true'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    equals: '# Unsaved task draft'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-save"]'
- assert_not_visible: '[data-testid="notes-workspace-document"][data-active="true"][data-dirty="true"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tao"]'
- wait_for:
    selector: '[data-testid="note-editor-pin"][aria-pressed="true"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="note-editor-priority"]'
    contains: High
- assert_text:
    selector: '[data-testid="note-editor-tag"]'
    contains: parity-tag
- wait_for:
    selector: '[data-testid="note-editor-step"]'
    timeout_sec: 10
- assert_count:
    selector: '[data-testid="note-editor-step"]'
    equal: 1
- eval_readonly:
    expression: document.querySelector(".notes-link-field-shell textarea")?.value === "# Unsaved task draft"
    expect_truthy: true
    timeout_sec: 10
- click: '[data-testid="note-editor-priority"]'
- click: '[data-testid="note-editor-priority-menu"] [role="option"]:nth-child(3)'
- assert_text:
    selector: '[data-testid="note-editor-priority"]'
    contains: Medium
- fill:
    selector: '[data-testid="note-editor-reminder"]'
    value: 2035-06-13 08:15
- press:
    selector: '[data-testid="note-editor-reminder"]'
    key: Escape
- blur: '[data-testid="note-editor-reminder"]'
- click: '[data-testid="note-editor-pin"]'
- wait_for:
    selector: '[data-testid="note-editor-pin"][aria-pressed="false"]'
    timeout_sec: 10
- click: '[data-testid="note-editor-preview"]'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-pin"][aria-pressed="false"]'
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-reminder"]'
    name: value
    equals: 2035-06-13 08:15
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-completed-at"]'
    value: 2026-10-01 12:20
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-completed-at"]'
    key: Escape
- blur: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-completed-at"]'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-complete"][aria-pressed="true"]'
    timeout_sec: 10
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-completed-at-clear"]'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-complete"][aria-pressed="false"]'
    timeout_sec: 10
- reload_window: null
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-properties"]
    > summary'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-pin"][aria-pressed="false"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-priority"]'
    contains: Medium
- assert_text:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tag"]'
    contains: parity-tag
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step-complete"][aria-pressed="true"]'
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"]
      input'
    name: value
    equals: Verify shared task fields
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-due"]'
    name: value
    equals: 2035-06-15 16:30
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-reminder"]'
    name: value
    equals: 2035-06-13 08:15
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-mode-edit"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    equals: '# Unsaved task draft'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step-delete"]'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"]'
    state: detached
    timeout_sec: 10
- assert_count:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-step"]'
    equal: 0
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tag"] button'
- wait_for:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tag"]'
    state: detached
    timeout_sec: 10
- assert_count:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tag"]'
    equal: 0
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-due-clear"]'
- assert_not_visible: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-due-clear"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-reminder-clear"]'
- assert_not_visible: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-reminder-clear"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-color-clear"]'
- assert_no_runtime_errors: null
- screenshot: notes-012-task-parity.png

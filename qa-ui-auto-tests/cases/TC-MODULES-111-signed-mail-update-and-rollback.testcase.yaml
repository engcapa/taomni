- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="tab-item"][data-tab-type="mail"]'
- wait_for: {selector: '[data-testid="plugin-tab-panel"][data-plugin-slug="mail"][data-plugin-kind="account"][data-plugin-version="${fixture.mail_previous_version}"] [data-testid="mail-client-tab"]', timeout_sec: 25}
- click: '[data-testid="mail-sync-button"]:enabled'
- mail_server_assert_list_matches: {folder: INBOX, timeout_sec: 40}
- wait_for: '[data-testid="mail-message-row"][data-subject="Fresh ownership 0001"]'
- assert_signed_module_lifecycle: {slug: mail, phase: old-reenabled}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}

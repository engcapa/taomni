verification:
  review: reviewed
  requirements:
  - id: disabled-update-and-rollback
    requirement: Update and roll back a disabled Mail package without restarting Taomni while preserving the module-owned IMAP SQLite database and showing disabled account guidance.
    actions: [10, 12, 29, 31, 34, 38, 44, 55, 58, 60, 63]
    checkpoints:
    - {step: 39, expectation: Synchronized mailbox INBOX matches the server contents.}
    - {step: 41, expectation: 'The earlier signed Mail host owns the writer lease, account SQLite database, and .imap-owner receipt.'}
    - {step: 46, expectation: Disabling releases the writer lease cleanly.}
    - {step: 62, expectation: Updating while disabled activates the current signed version without starting the host.}
    - {step: 65, expectation: Rolling back while disabled restores the earlier version with no running host.}
    results: [39, 41, 46, 62, 65]
  - id: enabled-update-and-failed-handshake
    requirement: Replace and roll back an active Mail host, keep IMAP sync working cleanly on every switched version, and recover cleanly when an update fails handshake.
    actions: [66, 72, 80, 81, 88, 95, 99, 106]
    checkpoints:
    - {step: 73, expectation: Re-enabled earlier Mail host preserves the SQLite database identity and synchronizes INBOX.}
    - {step: 75, expectation: Re-enabled earlier host owns its writer lease.}
    - {step: 83, expectation: Live update starts the current Mail host cleanly without restarting Taomni.}
    - {step: 89, expectation: Current Mail host synchronizes INBOX with the preserved account store.}
    - {step: 97, expectation: Handshake-failure candidate reports permission denied without replacing the active Mail host.}
    - {step: 98, expectation: Failed update keeps the active current host running cleanly.}
    - {step: 101, expectation: Manual rollback switches the running host back to the earlier version.}
    - {step: 107, expectation: Rolled-back earlier Mail host synchronizes INBOX cleanly.}
    results: [73, 75, 83, 89, 97, 98, 101, 107]
  - id: retained-uninstall-and-reinstall
    requirement: Uninstall removes Mail versions and runtime while retaining the IMAP SQLite database, ownership receipt, and locator, renders missing-module placeholder, and restores sync on reinstall.
    actions: [111, 112, 125, 127, 133]
    checkpoints:
    - {step: 114, expectation: Uninstall displays retained-data indicator on the Mail store card.}
    - {step: 115, expectation: Retained locator still declares both SQLite database and .imap-owner receipt.}
    - {step: 120, expectation: Existing Mail account tab shows missing-module guidance with no Mail content mounted.}
    - {step: 134, expectation: Reinstalling and enabling current Mail restores IMAP synchronization.}
    - {step: 136, expectation: Reinstalled Mail host owns its writer lease and preserved database identity.}
    - {step: 137, expectation: No renderer runtime errors occurred across the full lifecycle.}
    results: [114, 115, 120, 134, 136, 137]
  visual:
  - check: Synchronized Mail message row, unavailable placeholders across disabled and uninstalled states, and Module Store retained indicator.
    method: automated
    reason: UI waits and assertions confirm rendered version attributes, INBOX rows, and placeholder states.
  native:
  - check: Real OS process lineage, signed host and frontend hashes, writer lease, module SQLite store, .imap-owner receipt, zero legacy mail-cache files, and retained locator entries.
    method: automated
    reason: assert_signed_module_lifecycle inspects live processes, leases, SQLite tables, receipts, and directories in isolated QA profiles.

- wait_for: {selector: '[data-testid="plugin-tab-panel"][data-plugin-slug="mail"][data-plugin-kind="account"][data-plugin-version="${fixture.mail_current_version}"] [data-testid="mail-client-tab"]', timeout_sec: 25}

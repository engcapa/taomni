id: TC-MODULES-111
title: Signed Mail switches versions and preserves module-owned IMAP SQLite store and owner receipt in one session
description: >-
  Install an independently compiled Mail prerelease, create and synchronize an owned IMAP account
  against the local fake mail server, download the current signed package from the loopback catalog,
  update and roll back both while disabled and while running without restarting Taomni, recover from
  a handshake-failure candidate, uninstall with module SQLite database, ownership receipt, and
  retained locator preserved, and reinstall with seamless IMAP synchronization restored.
covers: [F-Modules-1, F-MAIL-1, F-MAIL-3, F-MAIL-23]
tags: [modules, mail, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, mail_server, module_signed_mail_archive, module_marketplace, release_build_required]
timeout_sec: 420
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- module_marketplace_probe: {phase: source}
- reload_window: null
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.mail_previous_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.mail_previous_signature}'}
- press: {selector: '[data-testid="module-offline-submit"]', key: Enter}
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- press: {selector: '[data-testid="module-action-enable-mail"]:enabled', key: Enter}
- wait_for: '[data-testid="module-action-disable-mail"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'

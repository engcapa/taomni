  visual:
  - check: Inspect the SSH terminal settings and live terminal screenshot for dialog layout, status feedback, and no overlap.
    method: manual
    reason: Screenshot review is required for cross-WebView terminal overlays.
  native:
  - check: Execute the connected SSH settings actions in the declared native modes; browser evidence does not certify Tauri WebViews.
    method: external
    reason: Native execution is collected by the platform workflow.

    - <svg xmlns="http://www.w3.org/2000/svg" width="80" height="40"><rect width="80" height="40" fill="blue"/></svg>
    - ''
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.svg
    equals: '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40"><rect width="80" height="40" fill="blue"/></svg>

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- assert_count:
    selector: '[data-testid="file-viewer"]'
    equal: 0
- click: '[data-testid="explorer-cmd-new"]'
- click: '[data-testid="explorer-new-typed-file"]'
- wait_for: '[data-testid="explorer-new-file-dialog"]'
- select_option:
    selector: '[data-testid="explorer-new-file-type"]'
    value: json
- fill:
    selector: '[data-testid="explorer-new-file-name"]'
    value: authored.json
- click: '[data-testid="explorer-new-file-create"]'
- wait_for: '[data-testid="explorer-file-row"][data-name="authored.json"][aria-selected="true"]'
- assert_not_visible: '[data-testid="explorer-new-file-dialog"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.json
    equals: ''
- press:
    selector: '[data-testid="explorer-rename-input"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.json"]'
- wait_for: '[data-testid="file-viewer"][data-kind="text"]'
- wait_for: '[data-testid="viewer-editor"] .cm-content'
- fill:
    selector: '[data-testid="viewer-editor"] .cm-content'
    value: '{ "created": true, "text": "中文" }

      '
- click: '[data-testid="viewer-save"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.json
    equals: '{ "created": true, "text": "中文" }

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.json"]'
- wait_for: '[data-testid="file-viewer"][data-kind="text"]'
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - '{ "created": true, "text": "中文" }'
    - ''
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.json
    equals: '{ "created": true, "text": "中文" }

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- assert_count:
    selector: '[data-testid="file-viewer"]'
    equal: 0
- click: '[data-testid="explorer-cmd-new"]'
- click: '[data-testid="explorer-new-typed-file"]'
- wait_for: '[data-testid="explorer-new-file-dialog"]'
- select_option:
    selector: '[data-testid="explorer-new-file-type"]'
    value: ts
- fill:
    selector: '[data-testid="explorer-new-file-name"]'
    value: authored.ts
- click: '[data-testid="explorer-new-file-create"]'
- wait_for: '[data-testid="explorer-file-row"][data-name="authored.ts"][aria-selected="true"]'
- assert_not_visible: '[data-testid="explorer-new-file-dialog"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.ts
    equals: ''
- press:
    selector: '[data-testid="explorer-rename-input"]'
    key: Enter
- right_click: '[data-testid="explorer-file-row"][data-name="authored.ts"]'
- click: '[data-testid="explorer-context-open-with"]'
- click: '[data-testid="file-open-with-workspace"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- fill:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    value: 'export const createdFromExplorer = "中文";

      '
- press:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    key: Control+s
    macos_key: Meta+s
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.ts
    equals: 'export const createdFromExplorer = "中文";

      '
- reload_window: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - export const createdFromExplorer = "中文";
    - ''
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.ts
    equals: 'export const createdFromExplorer = "中文";

      '
- assert_no_runtime_errors: null

id: TC-EXPLORER-013
title: Files created by Explorer open in their real editor and save exact source through reopen
description: Create Markdown, HTML, SVG, JSON and TypeScript using the type selector; open through Explorer and edit/save/reopen through
  their existing editor routes. Independently read full bytes after creation, save and reopen. This is native disk/IPC coverage on native
  runners, not a browser stub claim. Code goes through the real loose-file Code Workspace route.
modes:
- browser
- native
covers:
- F-EXPLORER-1
- F-FILEOPEN-1
tags:
- p1
- explorer
- file-open
- editor
- filesystem
- native-boundary
- crash-regression
fixtures:
- reset_db
- file_open_files
timeout_sec: 360
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-explorer-new-editor
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- wait_for: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
- click: '[data-testid="explorer-cmd-new"]'
- click: '[data-testid="explorer-new-typed-file"]'
- wait_for: '[data-testid="explorer-new-file-dialog"]'
- select_option:
    selector: '[data-testid="explorer-new-file-type"]'
    value: md
- fill:
    selector: '[data-testid="explorer-new-file-name"]'
    value: authored.md
- click: '[data-testid="explorer-new-file-create"]'
- wait_for: '[data-testid="explorer-file-row"][data-name="authored.md"][aria-selected="true"]'
- assert_not_visible: '[data-testid="explorer-new-file-dialog"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.md
    equals: ''
- press:
    selector: '[data-testid="explorer-rename-input"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.md"]'
- wait_for: '[data-testid="file-viewer"][data-kind="markdown"]'
- click: '[data-testid="markdown-mode-source"]'
- wait_for: '[data-testid="viewer-editor"] .cm-content'
- fill:
    selector: '[data-testid="viewer-editor"] .cm-content'
    value: '# Created Markdown


      **中文**

      '
- click: '[data-testid="viewer-save"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.md
    equals: '# Created Markdown


      **中文**

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.md"]'
- wait_for: '[data-testid="file-viewer"][data-kind="markdown"]'
- click: '[data-testid="markdown-mode-source"]'
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - '# Created Markdown'
    - ''
    - '**中文**'
    - ''
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.md
    equals: '# Created Markdown


      **中文**

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- assert_count:
    selector: '[data-testid="file-viewer"]'
    equal: 0
- click: '[data-testid="explorer-cmd-new"]'
- click: '[data-testid="explorer-new-typed-file"]'
- wait_for: '[data-testid="explorer-new-file-dialog"]'
- select_option:
    selector: '[data-testid="explorer-new-file-type"]'
    value: html
- fill:
    selector: '[data-testid="explorer-new-file-name"]'
    value: authored.html
- click: '[data-testid="explorer-new-file-create"]'
- wait_for: '[data-testid="explorer-file-row"][data-name="authored.html"][aria-selected="true"]'
- assert_not_visible: '[data-testid="explorer-new-file-dialog"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.html
    equals: ''
- press:
    selector: '[data-testid="explorer-rename-input"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.html"]'
- wait_for: '[data-testid="file-viewer"][data-kind="html"]'
- click: '[data-testid="html-mode-split"]'
- wait_for: '[data-testid="viewer-editor"] .cm-content'
- fill:
    selector: '[data-testid="viewer-editor"] .cm-content'
    method: paste
    value: '<!doctype html><h1>Created HTML 中文</h1>

      '
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - <!doctype html><h1>Created HTML 中文</h1>
    - ''
- click: '[data-testid="viewer-save"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.html
    equals: '<!doctype html><h1>Created HTML 中文</h1>

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.html"]'
- wait_for: '[data-testid="file-viewer"][data-kind="html"]'
- click: '[data-testid="html-mode-split"]'
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - <!doctype html><h1>Created HTML 中文</h1>
    - ''
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.html
    equals: '<!doctype html><h1>Created HTML 中文</h1>

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- assert_count:
    selector: '[data-testid="file-viewer"]'
    equal: 0
- click: '[data-testid="explorer-cmd-new"]'
- click: '[data-testid="explorer-new-typed-file"]'
- wait_for: '[data-testid="explorer-new-file-dialog"]'
- select_option:
    selector: '[data-testid="explorer-new-file-type"]'
    value: svg
- fill:
    selector: '[data-testid="explorer-new-file-name"]'
    value: authored.svg
- click: '[data-testid="explorer-new-file-create"]'
- wait_for: '[data-testid="explorer-file-row"][data-name="authored.svg"][aria-selected="true"]'
- assert_not_visible: '[data-testid="explorer-new-file-dialog"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.svg
    equals: ''
- press:
    selector: '[data-testid="explorer-rename-input"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.svg"]'
- wait_for: '[data-testid="file-viewer"][data-kind="svg"]'
- click: '[data-testid="image-svg-mode-code"]'
- wait_for: '[data-testid="viewer-editor"] .cm-content'
- fill:
    selector: '[data-testid="viewer-editor"] .cm-content'
    value: '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40"><rect width="80" height="40" fill="blue"/></svg>

      '
- click: '[data-testid="viewer-save"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/authored.svg
    equals: '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40"><rect width="80" height="40" fill="blue"/></svg>

      '
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="authored.svg"]'
- wait_for: '[data-testid="file-viewer"][data-kind="svg"]'

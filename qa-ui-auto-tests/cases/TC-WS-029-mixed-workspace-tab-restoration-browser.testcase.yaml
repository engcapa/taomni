id: TC-WS-029
title: Mixed workspace files and saved protocol tabs restore their owner, order and active document
description: Opens file and nine saved protocols through UI, reorders/renames, reloads, checks draft and tab identity, excludes explicitly closed tabs and handles
  a deleted saved session without opening a local shell. Browser protocol surfaces use stubs; native reconnect is TC-WS-030.
modes:
- browser
covers:
- F-WS-1
- F-WS-2
- F-WS-5
tags:
- p0
- workspace-redesign
- regression
- persistence
fixtures:
- reset_db
- platform_workspace_root
- workspace_restore_sessions
timeout_sec: 420

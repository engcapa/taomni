id: TC-SHOT-033
title: Pin options copy save zoom collapse and persist a recoverable local favorite
covers:
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- wait_for: '[data-testid="screenshot-pin-menu"]'
- click: '[data-testid="screenshot-pin-tools-close"]'
- assert_not_visible: '[data-testid="screenshot-pin-menu"]'
- right_click: '[data-testid="screenshot-pin-window"]'
- wait_for: '[data-testid="screenshot-pin-menu"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-help"]'
    contains: Favorites stay on this device
- click: '[data-testid="screenshot-pin-reset"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-pin-zoom"]'
    equals: 100%
- press:
    key: Mod+-
    selector: '[data-testid="screenshot-pin-window"]'
- wait_for: '[data-testid="screenshot-pin-opacity"][value="90"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-opacity"]'
    name: value
    equals: '90'
- click: '[data-testid="screenshot-pin-zoom-in"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-pin-zoom"]'
    equals: 110%
- click: '[data-testid="screenshot-pin-zoom-out"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-pin-zoom"]'
    equals: 100%
- press:
    key: Home
    selector: '[data-testid="screenshot-pin-opacity"]'
- press:
    key: ArrowRight
    selector: '[data-testid="screenshot-pin-opacity"]'
- press:
    key: ArrowRight
    selector: '[data-testid="screenshot-pin-opacity"]'
- press:
    key: ArrowRight
    selector: '[data-testid="screenshot-pin-opacity"]'
- press:
    key: ArrowRight
    selector: '[data-testid="screenshot-pin-opacity"]'
- click: '[data-testid="screenshot-pin-tools-close"]'
- eval_readonly:
    expression: Number(getComputedStyle(document.querySelector('[data-testid'+String.fromCharCode(61)+'"screenshot-pin-surface"]')).opacity)
      === 0.5
- click: '[data-testid="screenshot-pin-collapse"]'
- wait_for: '[data-testid="screenshot-pin-expand"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-window"]'
    name: data-collapsed
    equals: 'true'
- click: '[data-testid="screenshot-pin-expand"]'
- wait_for: '[data-testid="screenshot-pin-toolbar"]'
- eval_readonly:
    expression: Number(getComputedStyle(document.querySelector('[data-testid'+String.fromCharCode(61)+'"screenshot-pin-surface"]')).opacity)
      === 0.5
- assert_visible: '[data-testid="screenshot-pin-surface"]'
- click: '[data-testid="screenshot-pin-copy"]'
- wait_for: '[data-testid="screenshot-pin-notice"]'
- press: Mod+C
- wait_for: '[data-testid="screenshot-pin-notice"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_copy_image"
- click: '[data-testid="screenshot-pin-save"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: pinned-original.png
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="screenshot-pin-notice"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_save_image" && window.__taomniStubScreenshotCalls.at(-1).args.dest
      === "pinned-original.png"
- click: '[data-testid="screenshot-pin-favorite"]'
- wait_for: '[data-testid="screenshot-pin-favorite"][aria-pressed="true"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-favorite"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-pin-close"]'
- wait_for: '[data-testid="system-screenshot"]'
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorites"]'
- assert_count:
    selector: '[data-testid="screenshot-favorite-item"]'
    equal: 1
- wait_for: '[data-testid="screenshot-favorite-thumbnail"]'
- click: '[data-testid="screenshot-favorites-refresh"]'
- wait_for: '[data-testid="screenshot-favorite-open"]'
- click: '[data-testid="screenshot-favorite-open"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- wait_for: '[data-testid="screenshot-pin-favorite"][aria-pressed="true"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-favorite"]'
    name: aria-pressed
    equals: 'true'
- eval_readonly:
    expression: document.querySelector('img').naturalWidth === 400 && document.querySelector('img').naturalHeight === 300
- press: Mod+D
- wait_for: '[data-testid="screenshot-pin-favorite"][aria-pressed="false"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-favorite"]'
    name: aria-pressed
    equals: 'false'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorites-empty"]'
- assert_count:
    selector: '[data-testid="screenshot-favorite-item"]'
    equal: 0
- click: '[data-testid="screenshot-favorites-close"]'
- assert_not_visible: '[data-testid="screenshot-favorites"]'
- assert_visible: '[data-testid="system-screenshot"]'

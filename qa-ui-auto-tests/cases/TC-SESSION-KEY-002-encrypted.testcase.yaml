id: TC-SESSION-KEY-002
title: Encrypted generated SSH key unlocks through a masked native prompt
covers:
- F6.3
- F2.2
tags:
- session
- native
- regression
modes:
- native
fixtures:
- reset_db
- ssh_features_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 45
- click: '[data-testid="session-new"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    timeout_sec: 45
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh_features.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh_features.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh_features.user}
- click: '[data-testid="session-section-advanced"]'
- click: '[data-testid="session-auth-privatekey"]'
- click: '[data-testid="session-private-key-generate"]'
- wait_for: '[data-testid="session-key-generator"]'
- fill:
    selector: '[data-testid="session-key-output-path"]'
    value: ${cfg.ssh_features.encrypted_key}
- fill:
    selector: '[data-testid="session-key-passphrase"]'
    value: ${env.QA_SSH_KEY_PASSPHRASE}
- click: '[data-testid="session-key-create"]'
- assert_text:
    selector: '[data-testid="session-key-result"]'
    contains: 'Key created:'
    timeout_sec: 45
- assert_attribute:
    selector: '[data-testid="session-key-passphrase"]'
    name: value
    equals: ''
- assert_file_contains:
    path: ${cfg.ssh_features.encrypted_public_key}
    contains: ssh-ed25519
- click: '[data-testid="session-test-connection"]'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: Encrypted private key requires a passphrase
    timeout_sec: 45
- click: '[data-testid="alert-dialog-ok"]'
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-encrypted-key
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-encrypted-key"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-encrypted-key"]'
- wait_for:
    selector: '[data-testid="mfa-prompt"]'
    timeout_sec: 45
- assert_attribute:
    selector: '[data-testid="mfa-answer-0"]'
    name: type
    equals: password
- fill:
    selector: '[data-testid="mfa-answer-0"]'
    value: ${env.QA_SSH_KEY_PASSPHRASE}
- click: '[data-testid="mfa-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: printf '\nQA_ENCRYPTED_KEY_%s\n' OK
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_ENCRYPTED_KEY_OK\s*$
    timeout_sec: 45
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Encrypted generated SSH key unlocks through a masked native prompt
    actions:
    - 1
    - 2
    - 4
    - 6
    - 7
    - 8
    - 9
    - 10
    - 11
    - 12
    - 14
    - 15
    - 16
    - 20
    - 22
    - 23
    - 24
    - 25
    - 27
    - 30
    - 31
    - 33
    results:
    - 3
    - 5
    - 13
    - 17
    - 18
    - 19
    - 21
    - 26
    - 28
    - 29
    - 32
    - 34
    checkpoints:
    - step: 3
      expectation: '{"wait_for": {"selector": "[data-testid=\"sidebar\"]", "timeout_sec": 45}}'
    - step: 5
      expectation: '{"wait_for": {"selector": "[data-testid=\"session-editor\"]", "timeout_sec": 45}}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"session-key-generator\"]"}'
    - step: 17
      expectation: '{"assert_text": {"selector": "[data-testid=\"session-key-result\"]", "contains": "Key created:", "timeout_sec": 45}}'
    - step: 18
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"session-key-passphrase\"]", "name": "value", "equals": ""}}'
    - step: 19
      expectation: '{"assert_file_contains": {"path": "${cfg.ssh_features.encrypted_public_key}", "contains": "ssh-ed25519"}}'
    - step: 21
      expectation: '{"assert_text": {"selector": "[data-testid=\"session-test-result-summary\"]", "contains": "Encrypted private key requires a passphrase", "timeout_sec":
        45}}'
    - step: 26
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-encrypted-key\"]"}'
    - step: 28
      expectation: '{"wait_for": {"selector": "[data-testid=\"mfa-prompt\"]", "timeout_sec": 45}}'
    - step: 29
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"mfa-answer-0\"]", "name": "type", "equals": "password"}}'
    - step: 32
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-pane\"][data-terminal-ready=\"true\"]", "timeout_sec": 60}}'
    - step: 34
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_ENCRYPTED_KEY_OK\\s*$", "timeout_sec": 45}}'
  native:
  - check: Encrypted key file and real SSH authentication
    method: automated
    reason: The product writes and decrypts the encrypted OpenSSH key; the fixture authorizes only its public key.
  visual:
  - check: Passphrase masking and clearing
    method: automated
    reason: Explicit input type and empty-value assertions.

id: TC-WS-077
title: Large explorer virtual rows preserve keyboard navigation, search and list sorting
description: Use the public 300-file/100-folder fixture. Keep mounted rows bounded, navigate beyond the viewport without opening a file, open the selected
  real file, filter an offscreen filename, clear the filter, and reverse list sorting. File responsiveness budgets remain covered by TC-WS-073/074.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_large_directory
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-virtual-tree
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-viewport"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree"] [role="treeitem"]'
    min: 5
    max: 100
- press:
    key: End
    selector: '[data-testid="code-workspace-tree-pane"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="README.md"][aria-selected="true"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute("data-path") === "README.md"
    expect_truthy: true
    timeout_sec: 5
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- press:
    key: ArrowUp
    selector: '[data-testid="code-workspace-tree-pane"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="Draft10.txt"][aria-selected="true"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute("data-path") === "Draft10.txt"
    expect_truthy: true
    timeout_sec: 5
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Draft10.txt"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: Tenth.
- press:
    key: Mod+F
    selector: '[data-testid="code-workspace-tree-pane"]'
- fill:
    selector: '[data-testid="code-workspace-tree-filter"]'
    value: document-0299
- wait_for: '[data-testid="code-workspace-flat-file"][data-path="document-0299.txt"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree"] [role="treeitem"]'
    equal: 2
- dblclick: '[data-testid="code-workspace-flat-file"][data-path="document-0299.txt"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: Public document 299
- press:
    key: Escape
    selector: '[data-testid="code-workspace-tree-filter"]'
- wait_for: '[data-testid="code-workspace-tree-viewport"]'
- press:
    key: Home
    selector: '[data-testid="code-workspace-tree-pane"]'
- wait_for: '[data-testid="code-workspace-tree-root"][aria-selected="true"]'
- click: '[data-testid="code-workspace-tree-view-selector"]'
- click: '[data-testid="code-workspace-tree-view-list"]'
- wait_for: '[data-testid="code-workspace-list-columns"]'
- click: '[data-testid="code-workspace-list-sort-name"]'
- press:
    key: End
    selector: '[data-testid="code-workspace-tree-pane"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="document-0000.txt"][aria-selected="true"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute("data-path") === "document-0000.txt" && document.activeElement.getBoundingClientRect().top >= document.querySelector(".taomni-explorer-list-columns").getBoundingClientRect().bottom
      && document.activeElement.getBoundingClientRect().bottom <= document.activeElement.closest("[data-view-mode]").getBoundingClientRect().bottom
    expect_truthy: true
    timeout_sec: 5
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="document-0000.txt"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: Public document 0
- assert_count:
    selector: '[data-testid="code-workspace-tree"] [role="treeitem"]'
    min: 5
    max: 100
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 3
- assert_no_runtime_errors: null
- screenshot: workspace-tc-ws-077-virtual-tree.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Virtualization bounds mounted tree rows while preserving the full logical keyboard order, exact opened documents, filtering, view changes
      and sorting without extra activations.
    actions:
    - 3
    - 5
    - 6
    - 7
    - 8
    - 11
    - 15
    - 18
    - 20
    - 21
    - 24
    - 26
    - 28
    - 30
    - 31
    - 33
    - 34
    - 37
    results:
    - 9
    - 10
    - 12
    - 13
    - 14
    - 16
    - 17
    - 19
    - 22
    - 23
    - 25
    - 27
    - 29
    - 32
    - 35
    - 36
    - 38
    - 39
    - 40
    - 41
    checkpoints:
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-viewport\"]"}'
    - step: 10
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree\"] [role=\"treeitem\"]", "min": 5, "max": 100}}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"README.md\"][aria-selected=\"true\"]"}'
    - step: 13
      expectation: '{"eval_readonly": {"expression": "document.activeElement?.getAttribute(\"data-path\") === \"README.md\"", "expect_truthy": true, "timeout_sec":
        5}}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-tab\"]", "equal": 0}}'
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"Draft10.txt\"][aria-selected=\"true\"]"}'
    - step: 17
      expectation: '{"eval_readonly": {"expression": "document.activeElement?.getAttribute(\"data-path\") === \"Draft10.txt\"", "expect_truthy": true, "timeout_sec":
        5}}'
    - step: 19
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "contains": "Tenth."}}'
    - step: 22
      expectation: '{"wait_for": "[data-testid=\"code-workspace-flat-file\"][data-path=\"document-0299.txt\"]"}'
    - step: 23
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree\"] [role=\"treeitem\"]", "equal": 2}}'
    - step: 25
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "contains": "Public document 299"}}'
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-viewport\"]"}'
    - step: 29
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-root\"][aria-selected=\"true\"]"}'
    - step: 32
      expectation: '{"wait_for": "[data-testid=\"code-workspace-list-columns\"]"}'
    - step: 35
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"document-0000.txt\"][aria-selected=\"true\"]"}'
    - step: 36
      expectation: '{"eval_readonly": {"expression": "document.activeElement?.getAttribute(\"data-path\") === \"document-0000.txt\" && document.activeElement.getBoundingClientRect().top
        >= document.querySelector(\".taomni-explorer-list-columns\").getBoundingClientRect().bottom && document.activeElement.getBoundingClientRect().bottom
        <= document.activeElement.closest(\"[data-view-mode]\").getBoundingClientRect().bottom", "expect_truthy": true, "timeout_sec": 5}}'
    - step: 38
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "contains": "Public document 0"}}'
    - step: 39
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree\"] [role=\"treeitem\"]", "min": 5, "max": 100}}'
    - step: 40
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-tab\"]", "equal": 3}}'
    - step: 41
      expectation: '{"assert_no_runtime_errors": null}'
  native:
  - check: Real packaged WebView scrolling, focus, key input and native document reads.
    method: automated
    reason: Browser rendering alone cannot establish packaged WebView focus, scroll lifecycle or real disk reads.
  visual:
  - check: Tree rows and list columns remain readable after scrolling and sorting.
    method: manual
    reason: Viewport clipping, focus and column readability require visual review beyond counts and exact document assertions.

id: TC-137
title: SSH proxy kind validation and system proxy state hide manual fields correctly
covers:
- F6.3
- F6.2
tags:
- ssh
- session
- settings
- proxy
- validation
- persistence
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120

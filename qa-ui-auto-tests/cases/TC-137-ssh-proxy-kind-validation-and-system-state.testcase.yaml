    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: system
- assert_not_visible: 'input[aria-label="Proxy host"]'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: none
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: none
- assert_not_visible: 'input[aria-label="Proxy host"]'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: socks5
- assert_visible: 'input[aria-label="Proxy host"]'
- fill:
    selector: 'input[aria-label="Proxy host"]'
    value: socks5-validation.example.test
- fill:
    selector: 'input[aria-label="Proxy port"]'
    value: '1080'
- assert_attribute:
    selector: 'input[aria-label="Proxy host"]'
    name: value
    equals: socks5-validation.example.test
- assert_attribute:
    selector: 'input[aria-label="Proxy port"]'
    name: value
    equals: '1080'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: system
- assert_not_visible: 'input[aria-label="Proxy host"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-system-proxy-state
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-system-proxy-state"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-system-proxy-state"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_attribute:

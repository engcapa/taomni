id: TC-IDE-PARITY-026-01
title: Search Everywhere tab and group keys match IDEA (Alt+Left/Right, Ctrl+Tab, PageUp/PageDown) and reopen with an empty query
description: "ED-PARITY-026 A1 browser case. Ctrl+Shift+N / Ctrl+N open Search Everywhere; IDEA's SearchEverywhereUI also binds the platform NextTab/PreviousTab (XWin Alt+Right/Alt+Left, macOS Ctrl+Right/Ctrl+Left and Cmd+Shift+]) and Switcher (Ctrl+Tab / Ctrl+Shift+Tab) to switch tabs, and NavigateToNextGroup/PrevGroup (PageDown/PageUp, Ctrl+Down/Ctrl+Up) to jump to the last/first result (checked on the Actions tab, which always lists several rows). A reopened popup starts from an empty query (the TC-IDE-PARITY-013-04 macOS regression).\n\n  Mode: browser.\n"
covers:
- F25.5
tags:
- code-workspace
- search-everywhere
- ed-parity-026
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Shift+N
- wait_for: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press:
    key: Alt+ArrowRight
    macos_key: Control+ArrowRight
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-symbols"]'
    name: aria-selected
    equals: 'true'
- press:
    key: Alt+ArrowLeft
    macos_key: Control+ArrowLeft
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press:
    key: Alt+ArrowLeft
    macos_key: Control+ArrowLeft
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-classes"]'
    name: aria-selected
    equals: 'true'
- press:
    key: Alt+ArrowRight
    macos_key: Meta+Shift+BracketRight
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press: ArrowRight
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- screenshot: tc-ide-parity-026-01-next-tab.png
- press: Control+Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-symbols"]'
    name: aria-selected
    equals: 'true'
- press: Control+Shift+Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press: Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-symbols"]'
    name: aria-selected
    equals: 'true'
- press: Shift+Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press: Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-symbols"]'
    name: aria-selected
    equals: 'true'
- press: Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-actions"]'
    name: aria-selected
    equals: 'true'
- wait_for: '[data-testid="code-workspace-search-everywhere"] [data-index="1"]'
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]').length > 1
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')[0].getAttribute('data-selected') === 'true'
    expect_truthy: true
- press: PageDown
- eval_readonly:
    expression: Array.from(document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')).at(-1).getAttribute('data-selected') === 'true'
    expect_truthy: true
- press: PageUp
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')[0].getAttribute('data-selected') === 'true'
    expect_truthy: true
- press: Control+ArrowDown
- eval_readonly:
    expression: Array.from(document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')).at(-1).getAttribute('data-selected') === 'true'
    expect_truthy: true
- press: Control+ArrowUp
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')[0].getAttribute('data-selected') === 'true'
    expect_truthy: true
- type:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    text: zzqq
- assert_attribute:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    name: value
    equals: zzqq
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    state: detached
    timeout_sec: 5
- press: Control+N
- wait_for: '[data-testid="code-workspace-search-everywhere"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] input').value === ''
    expect_truthy: true
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- assert_visible: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
- screenshot: tc-ide-parity-026-01-reopened.png
- press: Escape

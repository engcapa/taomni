id: TC-SHOT-006
title: Recorder bar shows timer stop preview and completes the flow
covers:
- F27.1
tags:
- screenshot
- recording
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-recorder
- wait_for: '[data-testid="screenshot-recorder"]'
- assert_visible: '[data-testid="screenshot-recorder-timer"]'
- assert_visible: '[data-testid="screenshot-recorder-stop"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls || []).includes("screenshot_current_recording")
- click: '[data-testid="screenshot-recorder-stop"]'
- wait_for: '[data-testid="screenshot-recorder-preview"]'
- assert_visible: '[data-testid="screenshot-recorder-preview"]'
- assert_visible: '[data-testid="screenshot-recorder-save"]'
- assert_visible: '[data-testid="screenshot-recorder-done"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls || []).includes("screenshot_stop_recording")
- click: '[data-testid="screenshot-recorder-save"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-cancel"]'
- wait_for: '[data-testid="screenshot-recorder-preview"]'
- click: '[data-testid="screenshot-recorder-done"]'
- wait_for:
    selector: '[data-testid="system-screenshot"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls || []).includes("screenshot_stop_recording")

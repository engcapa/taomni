id: TC-010
title: SFTP remote context menu supports chmod, rename, and delete
covers:
- F7.5
tags:
- chmod
- legacy-imported
- p1
- right-menu
- sftp
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 2
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: mkdir -p '${cfg.sftp.remote_test_dir}/tc010' && printf '\nQA_TC010_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_TC010_READY\r?$
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- wait_for:
    selector: '[data-testid="sftp-remote-path"] > span:last-child > svg'
    timeout_sec: 30
- click: '[data-testid="sftp-remote-path"] > span:last-child > svg'
- wait_for: input[data-testid="sftp-remote-path"]
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}/tc010
- press: Enter
- assert_text:
    selector: '[data-testid="sftp-remote-path"]'
    contains: tc010
- wait_for: '[data-testid="sftp-remote-list"] tbody tr td[colspan]'
- right_click:
    selector: '[data-testid="sftp-remote-list"]'
    position:
      x: 50
      y: 50
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu"] >> text="New folder…"'
- assert_visible: '[data-testid="context-menu"] >> text="New file…"'
- press: Escape
- click: '[data-testid="sftp-remote-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-menu.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- wait_for: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-menu.txt"'
- right_click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-menu.txt"'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu"] >> text="Download to local"'
- assert_visible: text="Rename"
- assert_visible: text="Permissions…"
- assert_visible: '[data-testid="context-menu"] >> text="Delete"'
- click: '[data-testid="context-menu-item-permissions"]'
- wait_for: '[aria-label="Permissions"]'
- assert_visible: '[aria-label="Permissions"] >> text="Owner"'
- assert_visible: '[aria-label="Permissions"] >> text="Group"'
- assert_visible: '[aria-label="Permissions"] >> text="Other"'
- fill:
    selector: '#chmod-octal'
    value: '600'
- assert_attribute:
    selector: '#chmod-octal'
    name: value
    equals: '600'
- click: role=button[name="Apply"]
- assert_not_visible: '[aria-label="Permissions"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: printf '\nQA_MODE=%s\n' "$(stat -c %a '${cfg.sftp.remote_test_dir}/tc010/qa-ui-auto-menu.txt')"
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_MODE=600\r?$
- wait: 1
- right_click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-menu.txt"'
- wait_for: '[data-testid="context-menu"]'
- click: '[data-testid="context-menu-item-rename"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-menu-renamed.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- wait_for: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-menu-renamed.txt"'
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-menu-renamed.txt"'
- click: '[data-testid="sftp-remote-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- assert_not_visible: '[data-testid="sftp-browser"] tr[title$="/qa-ui-auto-menu-renamed.txt"]'
- screenshot: 010-sftp-context-chmod-rename.png

id: TC-015
title: Application theme cycles Light → Dark → Follow system and persists
covers:
- F5.5
tags:
- legacy-imported
- p0
- persistence
- settings
- theme
modes:
- browser
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: button[aria-label="Cycle application theme"]
- assert_localstorage:
    key: taomni.appTheme.v1
    equals: light
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: light
- click: button[aria-label="Cycle application theme"]
- assert_localstorage:
    key: taomni.appTheme.v1
    equals: dark
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: dark
- click: button[aria-label="Cycle application theme"]
- assert_localstorage:
    key: taomni.appTheme.v1
    equals: system
- eval_readonly:
    expression: 'document.documentElement.getAttribute("data-app-theme") === (matchMedia("(prefers-color-scheme:
      dark)").matches ? "dark" : "light")'
    expect_truthy: true
- reload: null
- wait_for: '[data-testid="status-bar"]'
- assert_localstorage:
    key: taomni.appTheme.v1
    equals: system
- eval_readonly:
    expression: 'document.documentElement.getAttribute("data-app-theme") === (matchMedia("(prefers-color-scheme:
      dark)").matches ? "dark" : "light")'
    expect_truthy: true
- screenshot: 015-app-theme-cycle.png

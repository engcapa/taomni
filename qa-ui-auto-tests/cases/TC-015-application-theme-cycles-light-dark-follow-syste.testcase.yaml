    - 6
    - 9
    - 12
    checkpoints:
    - step: 4
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "equals": "light"}}'
    - step: 5
      expectation: '{"assert_attribute": {"selector": "html", "name": "data-app-theme", "equals": "light"}}'
    - step: 7
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "equals": "dark"}}'
    - step: 8
      expectation: '{"assert_attribute": {"selector": "html", "name": "data-app-theme", "equals": "dark"}}'
    - step: 10
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "equals": "system"}}'
    - step: 11

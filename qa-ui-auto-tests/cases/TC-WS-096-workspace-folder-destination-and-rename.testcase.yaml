id: TC-WS-096
title: Workspace rename, add-folder destination, cancellation and persistence
description: Use existing Workspace UI; default workspace remains undeletable, cancellation mounts nothing, a custom-named
  workspace owns only the chosen root, and real reload restores both names and roots. Native validates actual directories
  and WebView persistence.
modes:
- browser
- native
covers:
- F25.1
- F-WS-2
tags:
- p1
- regression
- workspace
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-008
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default
      Workspace (默认工作区)","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"qa-root","path":"${fixture.platform_workspace_root}","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="workspace-switcher-button"]'
- click: '[data-testid="workspace-switcher-menu-rename"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: ' Team default '
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-button"]'
    contains: Team default
- click: '[data-testid="workspace-switcher-button"]'
- assert_not_visible: '[data-testid="workspace-switcher-menu-delete"]'
- click: '[data-testid="workspace-switcher-add-folder"]'
- wait_for: '[data-testid="workspace-root-current"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}/src
- click: '[data-testid="workspace-root-new"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-root-name"]').value === "src"
    expect_truthy: true
- click: '[data-testid="workspace-root-current"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-root-current"]').checked && document.querySelectorAll('input[name'+String.fromCharCode(61)+'"workspace-root-destination"]:checked').length
      === 1
    expect_truthy: true
- assert_not_visible: '[data-testid="workspace-root-name"]'
- click: '[data-testid="workspace-fs-modal-cancel"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 1
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}/src
- click: '[data-testid="workspace-root-new"]'
- fill:
    selector: '[data-testid="workspace-root-name"]'
    value: Sample project
- click: '[data-testid="workspace-fs-modal-confirm"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-button"]'
    contains: Sample project
- wait_for: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/src"]'
- reload_window: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-switcher-button"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-button"]'
    contains: Sample project
- click: '[data-testid="workspace-switcher-button"]'
- click: '[data-testid="workspace-switcher-option-default-workspace"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-button"]'
    contains: Team default
- wait_for: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}"]'
- click: '[data-testid="workspace-switcher-button"]'
- click: xpath=//*[@data-testid="workspace-switcher-menu"]//*[text()="Sample project"]
- click: '[data-testid="workspace-switcher-button"]'
- click: '[data-testid="workspace-switcher-menu-delete"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-button"]'
    contains: Team default
- assert_no_runtime_errors: null
- screenshot: workspace-folder-destination-and-rename.png

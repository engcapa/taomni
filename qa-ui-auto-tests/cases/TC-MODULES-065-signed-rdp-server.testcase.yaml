id: TC-MODULES-065
title: Signed RDP Server migrates and backs up its settings and closes its listener on disable
description: Install through the offline form. Start from the migrated listener settings and use the legacy password through Vault. Check real graphics, the running module snapshot and shutdown.
covers: [F-Modules-1, F-Servers-1, F-RdpServer-1, F-BACKUP-1]
tags: [modules, rdp, rdp-server, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows]
fixtures: [reset_db, rdp_server_required, system_rdp_running, module_signed_rdp_server_archive]
timeout_sec: 360
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.rdp_server_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.rdp_server_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- click: '[data-testid="module-action-enable-rdp-server"]'
- wait_for: '[data-testid="module-action-disable-rdp-server"]'
- assert_signed_rdp_server: idle
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="global-search-trigger"]'
- fill: {selector: '[data-testid="global-search-input"]', value: Local servers}
- click: '[data-testid="global-search-result"][data-result-id="servers"]'
- click: '[data-testid="server-row-rdp"]'
- wait_for: '[data-testid="rdp-field-username"]'
- assert_attribute: {selector: '[data-testid="server-field-port"]', name: value, equals: '${env.QA_RDP_PORT}'}
- assert_attribute: {selector: '[data-testid="server-field-bind-address"]', name: value, equals: '127.0.0.1'}
- assert_visible: '[data-testid="rdp-field-view-only"]:checked'
- assert_attribute: {selector: '[data-testid="rdp-field-username"]', name: value, equals: '${env.QA_RDP_USER}'}
- assert_attribute: {selector: '[data-testid="rdp-field-password"]', name: value, equals: ''}
- wait_for: {selector: '[data-testid="rdp-field-clipboard-to-client"] option[value="text"]:checked', state: attached}
- wait_for: '[data-testid="rdp-field-microphone"]:not(:checked)'
- click: '[data-testid="server-row-rdp-start"]'
- platform_choice:
    platforms: [Windows]
    dialog: '[data-testid="choice-dialog"]'
    click: '[data-testid="choice-dialog-secondary"]'
- wait_for: {selector: '[data-testid="vault-setup-dialog"]', timeout_sec: 30}
- fill: {selector: '[data-testid="vault-setup-pw1"]', value: '${env.QA_VAULT_PASSWORD}'}
- fill: {selector: '[data-testid="vault-setup-pw2"]', value: '${env.QA_VAULT_PASSWORD}'}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: {selector: '[data-testid="server-row-rdp"][data-status="running"]', timeout_sec: 45}
- rdp_probe:
    scenario: connect
    artifact: signed-rdp-server-graphics
    args: {seconds: 3, compression: none}
    expect:
      graphics_updates: {min: 1}
      framebuffer.painted_share: {min: 0.95}
      rfx.bulk.decompression_errors: 0
- assert_signed_rdp_server: running
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: backup}
- wait_for: '[data-testid="backup-global-includePlugins"]'
- assert_attribute: {selector: '[data-testid="backup-global-includePlugins"]', name: aria-checked, equals: 'true'}
- set_check: {selector: '[data-testid="backup-local-select"]', checked: true}
- click: '[data-testid="backup-selected-start"]'
- wait_for: {selector: '[data-testid="backup-action-success"]', timeout_sec: 90}
- assert_signed_rdp_server: backup
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-rdp-server"]'
- wait_for: '[data-testid="module-action-enable-rdp-server"]'
- assert_signed_rdp_server: disabled
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="global-search-trigger"]'
- fill: {selector: '[data-testid="global-search-input"]', value: Local servers}
- click: '[data-testid="global-search-result"][data-result-id="servers"]'
- wait_for: '[data-testid="server-row-rdp"][data-status="stopped"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: signed-rdp-server
    requirement: The signed host serves a native RDP session using the migrated settings and stopping the module releases its listener without restarting the core.
    actions: [7, 9, 15, 25, 30, 39, 44, 50]
    checkpoints:
    - {step: 8, expectation: The normal offline installer selected the trusted candidate.}
    - {step: 11, expectation: Module data holds the migrated settings and the original row remains available for rollback.}
    - {step: 18, expectation: The form shows the migrated port.}
    - {step: 22, expectation: The form hides the legacy password.}
    - {step: 32, expectation: The real loopback client uses the legacy password and decodes actual desktop frames.}
    - {step: 33, expectation: The signed host owns the writer lease and its settings now point to Vault.}
    - {step: 41, expectation: The running module backs up its settings and TLS files with Vault.}
    - {step: 46, expectation: The listener and write lease have been released while the data files remain.}
    - {step: 51, expectation: The original server row shows stopped.}
    - {step: 52, expectation: The local server and module store complete the workflow without runtime errors.}
    results: [8, 11, 18, 22, 32, 33, 41, 46, 51, 52]
  visual:
  - check: The client decodes a real desktop image and Local servers reflects the lifecycle.
    method: automated
    reason: The probe records actual frames and the app row reports the transition.
  native:
  - check: The signed host owns the active TLS identity and its listener closes on disable.
    method: automated
    reason: The case reads the installed bytes and the independent OS lock and checks the runner loopback port.

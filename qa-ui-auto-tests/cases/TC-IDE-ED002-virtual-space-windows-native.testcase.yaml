id: TC-IDE-ED002-virtual-space-windows-native
title: "Windows native virtual space transaction and one undo"
description: |
  ED-AUDIT-002 packaged Windows slice. Uses the real com.taomni.app.qa
  WebView2 input boundary and production appearance action to enable virtual
  space, then verifies mixed caret padding, selection-anchor reversal, exact
  editor text, and one workspace undo. Browser composition and Linux/X11 IME
  remain separate evidence layers and are not claimed by this case.
  Highest claim on green: current Windows packaged editor behavior.
covers: [F25.5, F25.3]
tags: [code-workspace, ide-ed002, virtual-space, navigation, caret, native-gate, p1]
modes: [native]
native_platforms: [Windows]
fixtures: [reset_db, workspace_root]
timeout_sec: 240
steps:
  - open: "${cfg.app.base_url}"
  - vault_first_run: "qa-ed002-virtual-space-windows-password"
  - wait_for: '[data-testid="welcome-panel"]'
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-ed002","name":"qa-ed002","roots":[{"id":"r1","name":"qa-ed002","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
  - click: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'

  - fill:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      value: prefixXXlongprefixX
  - click: '[data-testid="code-workspace-tab"]'
  - press: Control+Shift+N
  - wait_for:
      selector: '[data-testid="code-workspace-search-everywhere"]'
      timeout_sec: 30
  - click: '[data-testid="code-workspace-search-everywhere"] button[role="tab"]:nth-of-type(5)'
  - click: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
  - type: Editor Appearance Settings
  - press: Enter
  - wait_for: '[data-testid="workspace-editor-appearance-settings-dialog"]'
  - click: '[data-testid="workspace-editor-appearance-virtual-space-after-line-end"]'
  - click: '[data-testid="workspace-editor-appearance-virtual-space-at-file-bottom"]'
  - click: '[data-testid="workspace-editor-appearance-apply"]'
  - wait: 1

  # Build the deterministic three-line document through the packaged editor.
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: [Control+Home, ArrowRight, ArrowRight, ArrowRight, ArrowRight, ArrowRight, ArrowRight, ArrowRight, Enter, ArrowRight, Enter]
  - eval_readonly:
      expression: 'JSON.stringify([document.querySelectorAll(".cm-line")[0]?.textContent, document.querySelectorAll(".cm-line")[1]?.textContent, document.querySelectorAll(".cm-line")[2]?.textContent])'
      contains: '["prefixX","X","longprefixX"]'

  # Mixed carets consume virtual padding in one production transaction.
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: [Control+Home, End, Shift+ArrowLeft, Alt+j, Alt+j, ArrowRight, ArrowDown, Z]
  - eval_readonly:
      expression: 'JSON.stringify([document.querySelectorAll(".cm-line")[0]?.textContent, document.querySelectorAll(".cm-line")[1]?.textContent, document.querySelectorAll(".cm-line")[2]?.textContent])'
      contains: '["prefixX","X      Z","lZongprefixXZ"]'
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: [Control+z]
  - eval_readonly:
      expression: 'document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX" && document.querySelectorAll(".cm-line")[1]?.textContent === "X" && document.querySelectorAll(".cm-line")[2]?.textContent === "longprefixX"'
      expect_truthy: true

  # A reversed Shift selection keeps its anchor and inserts only on line 2.
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: [Escape, Control+Home, ArrowDown, Shift+ArrowDown, Shift+ArrowUp, Shift+ArrowUp, Shift+ArrowDown, Q]
  - eval_readonly:
      expression: 'document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX" && document.querySelectorAll(".cm-line")[1]?.textContent === "QX" && document.querySelectorAll(".cm-line")[2]?.textContent === "longprefixX"'
      expect_truthy: true
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: [Control+z]
  - eval_readonly:
      expression: 'document.querySelectorAll(".cm-line")[0]?.textContent === "prefixX" && document.querySelectorAll(".cm-line")[1]?.textContent === "X" && document.querySelectorAll(".cm-line")[2]?.textContent === "longprefixX"'
      expect_truthy: true

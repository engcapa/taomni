id: TC-WS-040
title: Empty workspaces retain one full file explorer and folder/file entry points
description: The empty default workspace shows a shared Project area without mounting HOME. Cancel both choosers, add a folder from the empty file area,
  open a file and retain one runtime/one folder menu.
modes:
- browser
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_explorer
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-empty-explorer
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- assert_visible: '[data-testid="code-workspace-tree-open-file"]'
- assert_attribute:
    selector: '[data-testid="workspace-linked-sessions-toggle"]'
    name: aria-expanded
    equals: 'false'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 0
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-cancel"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 0
- click: '[data-testid="code-workspace-tree-open-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-cancel"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 0
- click: '[data-testid="code-workspace-tree-add-folder"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tree"]'
    equal: 1
- eval_readonly:
    expression: JSON.parse(localStorage.getItem("taomni.platformWorkspaces.v1")).workspaces[0].rootFolders.length === 1
    expect_truthy: true
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"]'
    contains: platform workspace root
- click: '[data-testid="workspace-switcher-button"]'
- assert_count:
    selector: '[data-testid="workspace-switcher-add-folder"]'
    equal: 1
- assert_count:
    selector: '[data-testid="workspace-switcher-menu-add-folder"]'
    equal: 0
- click: '[data-testid="workspace-switcher-add-folder"]'
- wait_for: '[data-testid="workspace-fs-modal-input"]'
- click: '[data-testid="workspace-fs-modal-cancel"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 1
- assert_no_runtime_errors: null
- screenshot: workspace-empty-shared-explorer.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: An empty workspace exposes files and sessions; cancellation adds no root, adding the chosen folder upgrades the same runtime and opens
      the selected file.
    actions:
    - 3
    - 9
    - 11
    - 13
    - 15
    - 17
    - 18
    - 19
    - 24
    - 27
    - 30
    - 32
    results:
    - 5
    - 6
    - 7
    - 8
    - 12
    - 16
    - 21
    - 22
    - 23
    - 26
    - 28
    - 29
    - 33
    - 34
    checkpoints:
    - step: 5
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-open-file\"]"}'
    - step: 6
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"workspace-linked-sessions-toggle\"]", "name": "aria-expanded", "equals": "false"}}'
    - step: 7
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 0}}'
    - step: 8
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"]", "equal": 1}}'
    - step: 12
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 0}}'
    - step: 16
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 0}}'
    - step: 21
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"]", "equal": 1}}'
    - step: 22
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree\"]", "equal": 1}}'
    - step: 23
      expectation: '{"eval_readonly": {"expression": "JSON.parse(localStorage.getItem(\"taomni.platformWorkspaces.v1\")).workspaces[0].rootFolders.length
        === 1", "expect_truthy": true}}'
    - step: 26
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"]", "contains": "platform workspace root"}}'
    - step: 28
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-switcher-add-folder\"]", "equal": 1}}'
    - step: 29
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-switcher-menu-add-folder\"]", "equal": 0}}'
    - step: 33
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 1}}'
    - step: 34
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: Review file area, row metadata, selection, toolbar and package layout in the retained screenshot.
    method: manual
    reason: Functional assertions do not establish visual fidelity; review the case screenshot separately.
  native:
  - check: Native filesystem and provider effects are verified by TC-WS-042/043.
    method: manual
    reason: This browser case establishes renderer behavior only; dedicated native cases cover the OS boundary.

id: TC-DB-TX-001-manual-commit-browser
title: Transaction mode toggle is shown for MySQL and disabled while offline
description: |
  DB-TX-001 V5. In the offline MySQL scaffold the editor toolbar shows the
  transaction mode toggle in Auto mode, disabled because there is no live
  connection; the Commit / Rollback controls stay hidden.
covers:
- F-DB-1
tags:
- database
- sql
- transaction
- db-parity
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- wait_for: '[data-testid="sidebar"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: db-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '3306'
- fill:
    selector: input[aria-label="Database username"]
    value: qa_user
- fill:
    selector: input[aria-label="Database name"]
    value: qa_db
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-db-tx
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-db-tx"]'
- open_session:
    name: qa-db-tx
    double_click: true
- wait_for: '[data-testid="db-connection-error-banner"]'
- assert_visible: '[data-testid="db-tx-mode"]'
- assert_disabled: '[data-testid="db-tx-mode"]'
- assert_text:
    selector: '[data-testid="db-tx-mode"]'
    contains: Auto
- assert_attribute:
    selector: '[data-testid="db-tx-mode"]'
    name: data-mode
    equals: auto
- assert_count:
    selector: '[data-testid="db-tx-commit"]'
    equal: 0
- assert_count:
    selector: '[data-testid="db-tx-pending"]'
    equal: 0
- screenshot: db-tx-001-manual-commit-browser.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Navigate from Home to Sessions, save and open the fixture MySQL bookmark, and reach the
      declared offline connection banner.
    actions:
    - 1
    - 2
    - 5
    - 7
    - 9
    - 10
    - 11
    - 12
    - 13
    - 15
    - 16
    - 18
    checkpoints:
    - step: 3
      expectation: the Sessions Navigator is visible.
    - step: 4
      expectation: the New session control is visible.
    - step: 6
      expectation: the session editor is visible.
    - step: 8
      expectation: the MySQL settings is visible.
    - step: 14
      expectation: the bookmark editor is visible.
    - step: 17
      expectation: The fixture session or saved query is visible at [data-testid="session-tree-item"][data-session-name="qa-db-tx"].
    - step: 19
      expectation: the expected offline connection banner is visible.
    results:
    - 3
    - 4
    - 6
    - 8
    - 14
    - 17
    - 19
  - id: R2
    requirement: The offline MySQL toolbar exposes disabled Auto mode and has no Commit or pending transaction
      controls.
    actions:
    - 18
    checkpoints:
    - step: 20
      expectation: The fixture session or saved query is visible at [data-testid="db-tx-mode"].
    - step: 21
      expectation: The fixture session or saved query is visible at [data-testid="db-tx-mode"].
    - step: 22
      expectation: '[data-testid="db-tx-mode"] contains the required text ''Auto''.'
    - step: 23
      expectation: '[data-testid="db-tx-mode"] exposes data-mode=''auto''.'
    - step: 24
      expectation: Exactly 0 elements match [data-testid="db-tx-commit"].
    - step: 25
      expectation: Exactly 0 elements match [data-testid="db-tx-pending"].
    results:
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
  visual:
  - check: Inspect SQL toolbar, result log or Query Library inside the current Shell for clipping and
      readable controls.
    method: manual
    reason: DOM assertions need a separate screenshot verdict.
  native:
  - check: Real database connection, execution and transaction effects
    method: not-applicable
    reason: This browser case explicitly uses offline IPC preview; paired native DB cases prove real SQL
      and transaction effects.

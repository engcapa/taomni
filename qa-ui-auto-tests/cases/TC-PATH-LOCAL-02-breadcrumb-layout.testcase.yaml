id: TC-PATH-LOCAL-02
title: Welcome file browser keeps short and overflowing breadcrumbs readable and editable
description: Open the home folder through Welcome, then navigate to an isolated wide directory. Assert no outer or vertical overflow, one compact segment scrollbar, a fixed edit
  button, focused editing, Escape, ancestor navigation and Back. Browser uses VFS; native uses real host directories and the packaged platform WebView.
covers:
- F1.6
- F7.2
- F7.5
- F-EXPLORER-1
tags:
- p1
- breadcrumb
- filebrowser
- welcome
modes:
- browser
- native
fixtures:
- reset_db
- path_completion
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="tao-home-shell-menu"]'
- wait_for:
    selector: '[data-testid="welcome-open-home-folder"]'
    timeout_sec: 60
- click: '[data-testid="welcome-open-home-folder"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="tab-item"][data-tab-type="file-browser"]'
- wait_for: '[data-testid="explorer-crumbs"]'
- eval_readonly:
    expression: document.querySelectorAll(".ex-address")[0].scrollWidth === document.querySelectorAll(".ex-address")[0].clientWidth
    expect_truthy: true
- eval_readonly:
    expression: JSON.stringify([document.querySelectorAll(".ex-address")[0].scrollHeight - document.querySelectorAll(".ex-address")[0].clientHeight,
      document.querySelectorAll(".ex-address")[0].clientHeight, document.querySelectorAll(".ex-address")[0].scrollHeight])
    expect_truthy: true
    contains: '[0,'
- eval_readonly:
    expression: document.querySelectorAll(".ex-address")[0].offsetHeight <= document.querySelectorAll(".ex-address")[0].parentElement.clientHeight
    expect_truthy: true
- eval_readonly:
    expression: getComputedStyle(document.querySelectorAll(".ex-address")[0]).overflowY === "hidden"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".ex-crumbs")[0].scrollWidth === document.querySelectorAll(".ex-crumbs")[0].clientWidth
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".ex-crumbs")[0].offsetHeight === document.querySelectorAll(".ex-crumbs")[0].clientHeight
    expect_truthy: true
- eval_readonly:
    expression: getComputedStyle(document.querySelectorAll(".ex-crumbs")[0], "::-webkit-scrollbar").height === "4px" ||
      getComputedStyle(document.querySelectorAll(".ex-crumbs")[0]).scrollbarWidth === "thin"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".ex-address")[0].lastElementChild.getBoundingClientRect().right <=
      document.querySelectorAll(".ex-address")[0].getBoundingClientRect().right
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll(".ex-address")[0].lastElementChild.getBoundingClientRect().left >=
      document.querySelectorAll(".ex-address")[0].getBoundingClientRect().left
    expect_truthy: true
- screenshot: welcome-short-path.png

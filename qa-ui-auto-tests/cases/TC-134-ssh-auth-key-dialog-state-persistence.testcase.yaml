id: TC-134
title: SSH authentication and private-key picker preserve enabled state and saved key path
covers:
- F6.3
tags:
- ssh
- session
- settings
- authentication
- private-key
- dialogs
- persistence
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-auth-key-state.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-auth-key-state
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- click: '[data-testid="session-auth-password"]'
- assert_count:
    selector: '[data-testid="session-auth-password"]:checked'
    equal: 1
- set_check:
    selector: '[data-testid="session-save-in-vault"]'
    checked: true
- assert_count:
    selector: '[data-testid="session-save-in-vault"]:checked'
    equal: 1
- set_check:
    selector: '[data-testid="session-save-in-vault"]'
    checked: false
- assert_count:
    selector: '[data-testid="session-save-in-vault"]:checked'
    equal: 0
- click: '[data-testid="session-auth-privatekey"]'
- assert_count:
    selector: '[data-testid="session-auth-privatekey"]:checked'
    equal: 1
- assert_attribute:
    selector: '[data-testid="session-private-key-toggle"]'
    name: data-checked
    equals: 'true'
- assert_enabled: input[aria-label="Private key path"]
- fill:
    selector: input[aria-label="Private key path"]
    value: /home/qauser/.ssh/auth-state-ed25519
- click: '[data-testid="session-private-key-browse"]'
- wait_for: '[data-testid="text-input-dialog"]'
- assert_attribute:
    selector: '[data-testid="text-input-dialog-input"]'
    name: value
    equals: /home/qauser/.ssh/auth-state-ed25519
- click: '[data-testid="text-input-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="text-input-dialog"]'
    state: detached
- assert_attribute:
    selector: input[aria-label="Private key path"]
    name: value
    equals: /home/qauser/.ssh/auth-state-ed25519
- click: '[data-testid="session-private-key-browse"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: /home/qauser/.ssh/auth-state-ed25519-new
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_attribute:
    selector: input[aria-label="Private key path"]
    name: value
    equals: /home/qauser/.ssh/auth-state-ed25519-new
- set_check:
    selector: '[data-testid="session-private-key-toggle"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-private-key-toggle"]'
    name: data-checked
    equals: 'false'
- assert_disabled: input[aria-label="Private key path"]
- assert_disabled: '[data-testid="session-private-key-browse"]'
- set_check:
    selector: '[data-testid="session-private-key-toggle"]'
    checked: true
- assert_enabled: '[data-testid="session-private-key-browse"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-auth-key-state
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-key-state"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-key-state"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_count:
    selector: '[data-testid="session-auth-privatekey"]:checked'
    equal: 1
- assert_attribute:
    selector: input[aria-label="Private key path"]
    name: value
    equals: /home/qauser/.ssh/auth-state-ed25519-new
- assert_attribute:
    selector: '[data-testid="session-private-key-toggle"]'
    name: data-checked
    equals: 'true'
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 134-ssh-auth-key-state.png

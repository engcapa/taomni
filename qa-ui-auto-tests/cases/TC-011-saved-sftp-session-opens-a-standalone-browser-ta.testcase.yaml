id: TC-011
title: Saved SFTP session opens a standalone tab with an unclipped permanent rail
covers:
- F7.4
- F1.3
tags:
- p0
- session
- sftp
- standalone
modes:
- browser
- native
fixtures:
- reset_db
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="session-new"]'
    timeout_sec: 60
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-sftp"]'
- assert_visible: '[data-testid="session-proto-sftp"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.sftp.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.sftp.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- wait: 1
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.sftp.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-sftp-session
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-sftp-session"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-sftp-session"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="sftp-browser"]'
- assert_visible: '[data-testid="sftp-remote-pane"]'
- assert_visible: '[data-testid="sftp-local-pane"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- wait_for: input[data-testid="sftp-remote-path"]
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: ${cfg.sftp.remote_test_dir}
- press: Enter
- wait: 1
- assert_visible: '[data-testid="sftp-remote-pane"] >> text="REMOTE"'
- assert_visible: '[data-testid="sftp-local-pane"] >> text="LOCAL"'
- assert_visible: '[data-testid="sftp-transfer-queue"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- wait_for: input[data-testid="sftp-remote-path"]
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${fixture.sftp_sync_test_dir}
- assert_element_geometry:
    selector: '[data-testid="side-tab-sessions"], [data-testid="side-tab-tools"]'
    min_count: 2
    min_width: 32
    min_height: 32
    same_width: true
    icon_size: 16
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"side-tab-sessions"]').getBoundingClientRect().left>=document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-rail"]').getBoundingClientRect().left
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"side-tab-sessions"]').getBoundingClientRect().right<=document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-rail"]').getBoundingClientRect().right
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"side-tab-tools"]').getBoundingClientRect().left>=document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-rail"]').getBoundingClientRect().left
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"side-tab-tools"]').getBoundingClientRect().right<=document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-rail"]').getBoundingClientRect().right
    expect_truthy: true
- screenshot: 011-standalone-sftp-session.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 保存 SFTP 会话后双击并认证，独立 SFTP 双栏和队列就绪，导航到精确目标路径。
    actions:
    - 1
    - 4
    - 6
    - 8
    - 9
    - 10
    - 12
    - 13
    - 15
    - 16
    - 18
    - 20
    - 21
    - 25
    - 27
    - 28
    - 33
    checkpoints:
    - step: 3
      expectation: '{"wait_for": {"selector": "[data-testid=\"session-new\"]", "timeout_sec": 60}}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"session-proto-sftp\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-sftp-session\"]"}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 22
      expectation: '{"wait_for": "[data-testid=\"sftp-browser\"]"}'
    - step: 23
      expectation: '{"assert_visible": "[data-testid=\"sftp-remote-pane\"]"}'
    - step: 24
      expectation: '{"assert_visible": "[data-testid=\"sftp-local-pane\"]"}'
    - step: 26
      expectation: '{"wait_for": "input[data-testid=\"sftp-remote-path\"]"}'
    - step: 30
      expectation: '{"assert_visible": "[data-testid=\"sftp-remote-pane\"] >> text=\"REMOTE\""}'
    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"sftp-local-pane\"] >> text=\"LOCAL\""}'
    - step: 32
      expectation: '{"assert_visible": "[data-testid=\"sftp-transfer-queue\"]"}'
    - step: 34
      expectation: '{"wait_for": "input[data-testid=\"sftp-remote-path\"]"}'
    - step: 35
      expectation: '{"assert_attribute": {"selector": "input[data-testid=\"sftp-remote-path\"]", "name": "value", "equals": "${fixture.sftp_sync_test_dir}"}}'
    results:
    - 35
  - id: R2
    requirement: 打开和认证独立 SFTP 后，主导航条的 Sessions/Tools 保持相同尺寸且完整落在主导航条可视范围内，不因分栏或滚动到选中会话而裁切。
    actions:
    - 20
    - 21
    checkpoints:
    - step: 36
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"side-tab-sessions\"], [data-testid=\"side-tab-tools\"]", "min_count": 2, "min_width":
        32, "min_height": 32, "same_width": true, "icon_size": 16}}'
    - step: 37
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"side-tab-sessions\"]'').getBoundingClientRect().left>=document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-rail\"]'').getBoundingClientRect().left",
        "expect_truthy": true}}'
    - step: 38
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"side-tab-sessions\"]'').getBoundingClientRect().right<=document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-rail\"]'').getBoundingClientRect().right",
        "expect_truthy": true}}'
    - step: 39
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"side-tab-tools\"]'').getBoundingClientRect().left>=document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-rail\"]'').getBoundingClientRect().left",
        "expect_truthy": true}}'
    - step: 40
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"side-tab-tools\"]'').getBoundingClientRect().right<=document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-rail\"]'').getBoundingClientRect().right",
        "expect_truthy": true}}'
    results:
    - 36
    - 37
    - 38
    - 39
    - 40
  visual:
  - check: 独立标签和双栏目录显示清晰。
    method: manual
    reason: 截图必须单独评审，不能由功能步骤通过推导视觉通过。
  native:
  - check: 原生磁盘和 SFTP 链路需 native 模式的真实执行；browser 本地窗格为 VFS。
    method: automated
    reason: 按实际执行模式解释；其他平台不继承 Linux 证据。

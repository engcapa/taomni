id: TC-MFA-014
title: Changing the Vault master password preserves the MFA key, HOTP counter and password-gated export
description: TASK-025-E and AC-015/016 retained behavior. Create and advance an RFC 4226 HOTP account through the UI, change the master password in Settings,
  then lock and unlock. The old password must fail; the new password must decrypt the same account at its advanced counter. Export also rejects the old
  password and reveals the original secret only with the new password. Browser verifies renderer flows; native verifies real Rust rekey and encrypted Vault/MFA
  stores in the isolated profile.
covers:
- F-MFA-1
- F12.1
tags:
- mfa
- vault
- lifecycle
- modules
- p0
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 360

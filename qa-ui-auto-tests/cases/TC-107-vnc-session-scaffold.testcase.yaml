id: TC-107
title: Saved VNC session opens the VNC panel scaffolding
description: 'Coverage smoke for F9.6. Creates a VNC session bookmark and double-clicks

  to open it. The panel mounts immediately (the canvas inside is hidden

  until conn.status === "connected"), so we assert the vnc-panel testid

  is present without requiring a real RFB handshake. No password is

  stored and none is asked before connecting: the VNC panel asks only when

  the server requires one (DEC-VNC-21), so no pre-connect auth prompt opens.


  The host is not a VNC server, so the test only confirms the protocol

  selector + direct open + panel mount path is wired up. Real VNC connection

  and in-session authentication are covered by TC-151 with the VNC fixture.

  '
covers:
- F9.6
tags:
- smoke
- p1
- vnc
- scaffolding-only
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: text="New session…"
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: vnc-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '5900'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-vnc
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc"]'
- open_session:
    name: qa-ui-auto-vnc
    double_click: true
- wait_for:
    selector: '[data-testid="vnc-panel"]'
    timeout_sec: 10
- assert_visible: '[data-testid="vnc-panel"]'
- assert_not_visible: '[data-testid="auth-prompt"]'
- wait_for:
    selector: '[data-testid="vnc-canvas"]'
    state: attached
    timeout_sec: 5
- screenshot: 107-vnc-saved.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A saved VNC session without a stored password opens the VNC panel scaffolding directly, without a pre-connect password prompt.
    actions:
    - 1
    - 3
    - 5
    - 6
    - 7
    - 8
    - 10
    - 11
    - 13
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"sidebar\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-vnc\"]"}'
    - step: 14
      expectation: Opening the session without a stored password mounts the VNC panel directly.
    - step: 15
      expectation: '{"assert_visible": "[data-testid=\"vnc-panel\"]"}'
    - step: 16
      expectation: No pre-connect password prompt opens; the panel asks only when the server requires a password.
    - step: 17
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-canvas\"]", "state": "attached", "timeout_sec":
        5}}'
    results:
    - 14
    - 16
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

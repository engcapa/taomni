id: TC-107
title: Saved VNC session opens the VNC panel scaffolding
description: 'Coverage smoke for F9.6. Creates a VNC session bookmark and double-clicks

  to open it. The panel mounts immediately (the canvas inside is hidden

  until conn.status === "connected"), so we assert the vnc-panel testid

  is present without requiring a real RFB handshake. The auth prompt

  also fires for the configured host; we dismiss it.


  Because the configured cfg.ssh.host is not necessarily a VNC server, we

  do NOT actually authenticate — the test only confirms the protocol

  selector + auth flow + panel mount path is wired up. Real VNC connection

  testing requires a configured VNC fixture.

  '
covers:
- F9.6
tags:
- smoke
- p1
- vnc
- scaffolding-only
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: text="New session…"
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: vnc-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '5900'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-vnc
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc"]'
- open_session:
    name: qa-ui-auto-vnc
    double_click: true
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: qa-ui-auto-password
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="vnc-panel"]'
    timeout_sec: 10
- assert_visible: '[data-testid="vnc-panel"]'
- wait_for:
    selector: '[data-testid="vnc-canvas"]'
    state: attached
    timeout_sec: 5
- screenshot: 107-vnc-saved.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Saved VNC session opens the VNC panel scaffolding：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 6
    - 7
    - 8
    - 10
    - 11
    - 13
    - 15
    - 16
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"sidebar\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-vnc\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 17
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-panel\"]", "timeout_sec": 10}}'
    - step: 18
      expectation: '{"assert_visible": "[data-testid=\"vnc-panel\"]"}'
    - step: 19
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-canvas\"]", "state": "attached", "timeout_sec":
        5}}'
    results:
    - 17
    - 18
    - 19
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

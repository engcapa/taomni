id: TC-SHOT-037
title: Pin menu splits this-pin and all-pins actions into tabs, the note shows on the pin and collapsed thumbnail with a full
  tooltip, and the favorites list displays the same note when reopening.
covers:
- F27.1
tags:
- screenshot
- pins
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-tab-pin"]'
    name: aria-selected
    equals: 'true'
- assert_visible: '[data-testid="screenshot-pin-help"]'
- assert_not_visible: '[data-testid="screenshot-pins-tile"]'
- click: '[data-testid="screenshot-pin-tab-all"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-tab-all"]'
    name: aria-selected
    equals: 'true'
- assert_visible: '[data-testid="screenshot-pins-tile"]'
- assert_not_visible: '[data-testid="screenshot-pin-help"]'
- click: '[data-testid="screenshot-pin-tab-pin"]'
- click: '[data-testid="screenshot-pin-reset"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-pin-zoom"]'
    equals: 100%
- fill:
    selector: '[data-testid="screenshot-pin-note-input"]'
    value: Compare with design
- click: '[data-testid="screenshot-pin-zoom-in"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-pin-zoom"]'
    equals: 110%
- assert_attribute:
    selector: '[data-testid="screenshot-pin-note-input"]'
    name: value
    equals: Compare with design
- click: '[data-testid="screenshot-pin-zoom-out"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-pin-zoom"]'
    equals: 100%
- assert_attribute:
    selector: '[data-testid="screenshot-pin-note-input"]'
    name: value
    equals: Compare with design
- click: '[data-testid="screenshot-pin-note-save"]'
- click: '[data-testid="screenshot-pin-tools-close"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-note"]'
    contains: Compare with design
- assert_attribute:
    selector: '[data-testid="screenshot-pin-note"]'
    name: title
    equals: Compare with design
- click: '[data-testid="screenshot-pin-collapse"]'
- wait_for: '[data-testid="screenshot-pin-expand"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-thumb-note"]'
    contains: Compare with design
- assert_attribute:
    selector: '[data-testid="screenshot-pin-thumb-note"]'
    name: title
    equals: Compare with design
- click: '[data-testid="screenshot-pin-expand"]'
- wait_for: '[data-testid="screenshot-pin-toolbar"]'
- click: '[data-testid="screenshot-pin-favorite"]'
- wait_for: '[data-testid="screenshot-pin-favorite"][aria-pressed="true"]'
- click: '[data-testid="screenshot-pin-close"]'
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorite-note"]'
- assert_count:
    selector: '[data-testid="screenshot-favorite-item"]'
    equal: 1
- assert_text:
    selector: '[data-testid="screenshot-favorite-note"]'
    contains: Compare with design
- assert_attribute:
    selector: '[data-testid="screenshot-favorite-note"]'
    name: title
    equals: Compare with design
- click: '[data-testid="screenshot-favorite-open"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-note"]'
    contains: Compare with design
- press: Mod+D
- wait_for: '[data-testid="screenshot-pin-favorite"][aria-pressed="false"]'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorites-empty"]'
- click: '[data-testid="screenshot-favorites-close"]'
- assert_not_visible: '[data-testid="screenshot-favorites"]'
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: pin-note-visibility
    requirement: The options menu opens on the this-pin tab holding view, note and editor controls while batch arrangement
      and closing stay on the all-pins tab. A saved note shows on the expanded pin and the collapsed thumbnail with the full
      text as tooltip, is stored on the favorite, listed by the favorites dialog with the full text as tooltip, and shown
      again when the favorite reopens. A draft entered as the options appear survives consecutive source zoom updates before
      it is saved.

id: TC-SHOT-037
title: Pin menu splits this-pin and all-pins actions into tabs, the note shows on the pin and collapsed thumbnail with a full tooltip,
  and the favorites list displays the same note when reopening.
covers:
- F27.1
tags:
- screenshot
- pins
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-tab-pin"]'
    name: aria-selected
    equals: 'true'
- assert_visible: '[data-testid="screenshot-pin-help"]'
- assert_not_visible: '[data-testid="screenshot-pins-tile"]'
- click: '[data-testid="screenshot-pin-tab-all"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-tab-all"]'
    name: aria-selected
    equals: 'true'
- assert_visible: '[data-testid="screenshot-pins-tile"]'
- assert_not_visible: '[data-testid="screenshot-pin-help"]'
- click: '[data-testid="screenshot-pin-tab-pin"]'
- fill:
    selector: '[data-testid="screenshot-pin-note-input"]'
    value: Compare with design
- click: '[data-testid="screenshot-pin-note-save"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-note"]'
    contains: Compare with design
- assert_attribute:
    selector: '[data-testid="screenshot-pin-note"]'
    name: title
    equals: Compare with design
- click: '[data-testid="screenshot-pin-collapse"]'
- wait_for: '[data-testid="screenshot-pin-expand"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-thumb-note"]'
    contains: Compare with design
- assert_attribute:
    selector: '[data-testid="screenshot-pin-thumb-note"]'
    name: title
    equals: Compare with design
- click: '[data-testid="screenshot-pin-expand"]'
- wait_for: '[data-testid="screenshot-pin-toolbar"]'
- click: '[data-testid="screenshot-pin-favorite"]'
- wait_for: '[data-testid="screenshot-pin-favorite"][aria-pressed="true"]'
- click: '[data-testid="screenshot-pin-close"]'
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorite-note"]'
- assert_count:
    selector: '[data-testid="screenshot-favorite-item"]'
    equal: 1
- assert_text:
    selector: '[data-testid="screenshot-favorite-note"]'
    contains: Compare with design
- assert_attribute:
    selector: '[data-testid="screenshot-favorite-note"]'
    name: title
    equals: Compare with design
- click: '[data-testid="screenshot-favorite-open"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-note"]'
    contains: Compare with design
- press: Mod+D
- wait_for: '[data-testid="screenshot-pin-favorite"][aria-pressed="false"]'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorites-empty"]'
- click: '[data-testid="screenshot-favorites-close"]'
- assert_not_visible: '[data-testid="screenshot-favorites"]'
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: pin-note-visibility
    requirement: The options menu opens on the this-pin tab holding view, note and editor controls while batch arrangement and closing
      stay on the all-pins tab. A saved note shows on the expanded pin and the collapsed thumbnail with the full text as tooltip, is
      stored on the favorite, listed by the favorites dialog with the full text as tooltip, and shown again when the favorite reopens.
    actions:
    - 1
    - 4
    - 5
    - 7
    - 11
    - 15
    - 16
    - 17
    - 21
    - 25
    - 27
    - 29
    - 32
    - 37
    - 40
    - 42
    checkpoints:
    - step: 8
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-pin-tab-pin"]'', ''name'': ''aria-selected'', ''equals'': ''true''}'
    - step: 9
      expectation: 'assert_visible: [data-testid="screenshot-pin-help"]'
    - step: 10
      expectation: 'assert_not_visible: [data-testid="screenshot-pins-tile"]'
    - step: 13
      expectation: 'assert_visible: [data-testid="screenshot-pins-tile"]'
    - step: 14
      expectation: 'assert_not_visible: [data-testid="screenshot-pin-help"]'
    - step: 19
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-pin-note"]'', ''contains'': ''Compare with design''}'
    - step: 20
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-pin-note"]'', ''name'': ''title'', ''equals'': ''Compare with design''}'
    - step: 23
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-pin-thumb-note"]'', ''contains'': ''Compare with design''}'
    - step: 24
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-pin-thumb-note"]'', ''name'': ''title'', ''equals'': ''Compare with design''}'
    - step: 35
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-favorite-note"]'', ''contains'': ''Compare with design''}'
    - step: 36
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-favorite-note"]'', ''name'': ''title'', ''equals'': ''Compare with design''}'
    - step: 39
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-pin-note"]'', ''contains'': ''Compare with design''}'
    - step: 41
      expectation: 'wait_for: [data-testid="screenshot-pin-favorite"][aria-pressed="false"]'
    - step: 46
      expectation: 'wait_for: [data-testid="screenshot-favorites-empty"]'
    - step: 48
      expectation: 'assert_not_visible: [data-testid="screenshot-favorites"]'
    results:
    - 8
    - 9
    - 10
    - 13
    - 14
    - 19
    - 20
    - 23
    - 24
    - 35
    - 36
    - 39
    - 41
    - 46
    - 48
  visual:
  - check: Tabbed menu layout, note bar, collapsed thumbnail caption and favorites note
    method: automated
    reason: Assertions check actual renderer state and tooltip attributes; screenshots are retained.
  native:
  - check: Real favorite storage, note sync and reopening
    method: external
    reason: TC-SHOT-N17 verifies the persistent favorite file and note survival on the real desktop.

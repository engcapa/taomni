id: TC-033
title: Tunnel manager toggles autostart and credential reveal per row
covers:
- F8.2
tags:
- autostart
- credentials
- legacy-imported
- p1
- tunnel
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="app-main-menu"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-tunneling"]'
- wait_for: '[data-testid="tunnel-manager"]'
- click: '[data-testid="tunnel-new"]'
- wait_for: '[data-testid="tunnel-editor"]'
- fill:
    selector: input[placeholder="e.g. postgres-replica"]
    value: qa-ui-auto-tunnel-autostart
- fill:
    selector: input[placeholder="ssh.example.com"]
    value: ${cfg.ssh.host}
- fill:
    selector: input[placeholder="user"]
    value: ${cfg.ssh.user}
- fill:
    selector: input[placeholder="22"]
    value: ${cfg.ssh.port}
- fill:
    selector: input[placeholder="0"]
    value: '19181'
- fill:
    selector: input[placeholder="db.internal"]
    value: 127.0.0.1
- fill:
    selector: input[placeholder="5432"]
    value: '5432'
- click: '[data-testid="tunnel-editor-save"]'
- wait: 1
- wait_for: '[data-testid="tunnel-manager"] >> text="qa-ui-auto-tunnel-autostart"'
- click: '[data-testid="tunnel-manager"] tr:has-text("qa-ui-auto-tunnel-autostart") button[title*="Auto-start" i]'
- assert_attribute:
    selector: '[data-testid="tunnel-row-autostart"]'
    name: title
    equals: Auto-start enabled (click to disable)
- click: '[data-testid="tunnel-row-autostart"]'
- assert_attribute:
    selector: '[data-testid="tunnel-row-autostart"]'
    name: title
    equals: Enable auto-start
- wait: 1
- click: '[data-testid="tunnel-manager"] tr:has-text("qa-ui-auto-tunnel-autostart") button[title*="credentials"
    i]'
- assert_attribute:
    selector: '[data-testid="tunnel-row-toggle-reveal"]'
    name: title
    equals: Hide credentials
- click: '[data-testid="tunnel-row-toggle-reveal"]'
- assert_attribute:
    selector: '[data-testid="tunnel-row-toggle-reveal"]'
    name: title
    equals: Show credentials
- wait: 1
- click: '[data-testid="tunnel-manager"] tr:has-text("qa-ui-auto-tunnel-autostart") button[title="Test SSH connection"]'
- assert_text:
    selector: '[data-testid="tunnel-activity-log"]'
    contains: Testing tunnels is only available in the desktop build.
- wait: 2
- seed_dialog:
    confirm: true
- wait: 1
- screenshot: 033-tunnel-autostart-credentials.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 隧道自动启动开关进入启用/关闭状态，凭据显示开关可往返
    actions:
    - 19
    - 21
    - 24
    - 26
    checkpoints:
    - step: 20
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tunnel-row-autostart\"]", "name": "title",
        "equals": "Auto-start enabled (click to disable)"}}'
    - step: 22
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tunnel-row-autostart\"]", "name": "title",
        "equals": "Enable auto-start"}}'
    - step: 25
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tunnel-row-toggle-reveal\"]", "name": "title",
        "equals": "Hide credentials"}}'
    - step: 27
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tunnel-row-toggle-reveal\"]", "name": "title",
        "equals": "Show credentials"}}'
    results:
    - 27
  - id: R2
    requirement: 浏览器连接检测明确返回桌面能力限制
    actions:
    - 29
    checkpoints:
    - step: 30
      expectation: '{"assert_text": {"selector": "[data-testid=\"tunnel-activity-log\"]", "contains": "Testing tunnels
        is only available in the desktop build."}}'
    results:
    - 30
  visual:
  - check: 检查截图中表格列、行名、按钮不重叠/截断，排序或操作反馈可见。
    method: manual
    reason: 没有自动像素基准；需结合实际截图记录评审。
  native:
  - check: 本用例只验证浏览器渲染交互；系统级输入、桌面窗口与真实持久化需独立 native 验证。
    method: external
    reason: 按实际执行模式与指定边界解释证据。

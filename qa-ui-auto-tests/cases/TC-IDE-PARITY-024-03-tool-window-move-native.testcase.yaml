id: TC-IDE-PARITY-024-03-tool-window-move-native
title: Native tool window Move to keeps the terminal session
description: 'ED-PARITY-024 A2 native case: in the isolated QA app the Terminal tool window runs a real PTY; moving it to Right Top through the stripe context menu and back to Bottom Left through its ⋮ Options re-parents the same session — earlier output stays and new commands run in the moved window.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-024
- p1
modes:
- native
fixtures:
- reset_db
- workspace_root
timeout_sec: 600
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-ed024","name":"qa-ed024","roots":[{"id":"qa-ed024","name":"qa-ed024","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-ed024","path":"notes.txt"},"lastOpenedAt":1756500000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- click: '[data-testid="code-workspace-bottom-tab-terminal"]'
- wait_for:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_ED024_BEFORE
    submit: true
- assert_pattern:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"]'
    regex: (?m)^QA_ED024_BEFORE\r?$
    timeout_sec: 30
- right_click: '[data-testid="code-workspace-bottom-tab-terminal"]'
- click: '[data-testid="code-workspace-tool-rail-menu-move"]'
- click: '[data-testid="code-workspace-tool-rail-menu-move-right-top"]'
- wait_for:
    selector: '[data-testid="code-workspace-right-pane"] [data-testid="code-workspace-terminal-dock"]'
    timeout_sec: 15
- assert_pattern:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"]'
    regex: (?m)^QA_ED024_BEFORE\r?$
    timeout_sec: 10
- terminal_input:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_ED024_RIGHT
    submit: true
- assert_pattern:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"]'
    regex: (?m)^QA_ED024_RIGHT\r?$
    timeout_sec: 30
- screenshot: tc-ide-parity-024-03-terminal-right.png
- click: '[data-testid="code-workspace-tool-window-options-terminal"]'
- click: '[data-testid="code-workspace-tool-window-move"]'
- click: '[data-testid="code-workspace-tool-window-move-bottom-left"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"] [data-testid="code-workspace-terminal-dock"]'
    timeout_sec: 15
- assert_pattern:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"]'
    regex: (?m)^QA_ED024_RIGHT\r?$
    timeout_sec: 10
- assert_pattern:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"]'
    regex: (?m)^QA_ED024_BEFORE\r?$
    timeout_sec: 10
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A2：真实 PTY 终端输出 QA_ED024_BEFORE 后，经侧栏按钮右键 Move to → Right Top 移到右上区，原输出保留，且在移动后的窗口继续执行命令输出 QA_ED024_RIGHT。
    actions:
    - 10
    - 12
    - 14
    - 15
    - 16
    - 19
    checkpoints:
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-terminal-ready=\"true\"]", "timeout_sec": 60}}'
    - step: 13
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_ED024_BEFORE\\r?$", "timeout_sec": 30}}'
    - step: 17
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-right-pane\"] [data-testid=\"code-workspace-terminal-dock\"]", "timeout_sec": 15}}'
    - step: 18
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_ED024_BEFORE\\r?$", "timeout_sec": 10}}'
    - step: 20
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_ED024_RIGHT\\r?$", "timeout_sec": 30}}'
    results:
    - 11
    - 13
    - 17
    - 18
    - 20
  - id: R2
    requirement: A2：经工具窗口 ⋮ Options → Move to → Bottom Left 移回底部，两次输出均保留（同一会话被重新挂载，而非新建）。
    actions:
    - 22
    - 23
    - 24
    checkpoints:
    - step: 25
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-bottom-dock\"] [data-testid=\"code-workspace-terminal-dock\"]", "timeout_sec": 15}}'
    - step: 26
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_ED024_RIGHT\\r?$", "timeout_sec": 10}}'
    - step: 27
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_ED024_BEFORE\\r?$", "timeout_sec": 10}}'
    results:
    - 25
    - 26
    - 27
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

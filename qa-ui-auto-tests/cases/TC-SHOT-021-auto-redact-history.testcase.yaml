id: TC-SHOT-021
title: Auto redact consumes the cropped export and adds one undoable annotation
description: Tests the deterministic browser email-box response and shape history; this does not prove real OCR detection or sensitive-pixel concealment.
covers: [F27.1]
tags: [screenshot, redact, history, p1]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position: {x: 100, y: 100}
    to_position: {x: 500, y: 400}
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_disabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-auto-redact"]'
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-toast"]'
    equals: Redacted 1 sensitive item(s)
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_auto_redact" && window.__taomniStubScreenshotCalls.at(-1).args.path === window.__taomniStubScreenshotCalls.at(-2).args.path && window.__taomniStubScreenshotCalls.at(-2).args.width === 160
- assert_enabled: '[data-testid="screenshot-undo"]'
- assert_disabled: '[data-testid="screenshot-redo"]'
- click: '[data-testid="screenshot-undo"]'
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="0"]'
- assert_disabled: '[data-testid="screenshot-undo"]'
- assert_enabled: '[data-testid="screenshot-redo"]'
- click: '[data-testid="screenshot-redo"]'
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- assert_disabled: '[data-testid="screenshot-redo"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: '160 × 120'
- assert_not_visible: '[data-testid="screenshot-ocr-panel"]'
- click: '[data-testid="screenshot-copy"]'
- wait_for: '[data-testid="system-screenshot"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-3).cmd === "screenshot_save_data_url" && window.__taomniStubScreenshotCalls.at(-3).args.width === 160 && window.__taomniStubScreenshotCalls.at(-3).args.height === 120
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Auto-redact consumes the selected crop export and adds the returned email box as one annotation mutation with exact count feedback.
    actions: [1, 2, 4, 7]
    checkpoints:
    - {step: 6, expectation: No previous history exists.}
    - {step: 8, expectation: The returned box adds one committed shape.}
    - {step: 9, expectation: Feedback reports exactly one sensitive item.}
    - {step: 10, expectation: Redact dispatch uses the selected 160px-wide export path.}
    - {step: 11, expectation: The redact addition is undoable.}
    - {step: 12, expectation: A fresh redact does not create redo history.}
    results: [8, 9, 10, 11, 12]
  - id: R2
    requirement: Undo removes the redact batch, redo restores it, and copy retains the selected crop dimensions without opening a separate OCR panel.
    actions: [13, 17, 22]
    checkpoints:
    - {step: 14, expectation: Undo removes the only redact shape.}
    - {step: 15, expectation: Undo history is exhausted after the single redact batch.}
    - {step: 16, expectation: Redo becomes available after undo.}
    - {step: 18, expectation: Redo restores the redact shape.}
    - {step: 19, expectation: Redo is exhausted.}
    - {step: 20, expectation: Selection remains 160x120.}
    - {step: 21, expectation: Redact does not open the OCR text panel.}
    - {step: 23, expectation: Copy completes and returns to main.}
    - {step: 24, expectation: The final export retains the cropped dimensions.}
    results: [14, 15, 16, 18, 19, 20, 21, 23, 24]
  visual:
  - check: Redaction batch count and history transitions.
    method: automated
    reason: The box count, toast and crop size are asserted; neither email recognition nor pixel concealment is passed by shape-count evidence.
  native:
  - check: Actual sensitive-token detection and concealment in exported native pixels.
    method: external
    reason: Browser returns a deterministic email box; real OCR and redaction output require native or canvas/unit checks separately.

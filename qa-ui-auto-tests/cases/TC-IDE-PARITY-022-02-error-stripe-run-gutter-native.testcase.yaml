- host_write_file:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/App.java
    text: "package com.example.single;\n\npublic class App {\n\n    public static void main(String[] args) {\n        int count = \"text\";\n        java.util.List raw = null;\n        System.out.println(count + \" \" + raw);\n    }\n}\n"

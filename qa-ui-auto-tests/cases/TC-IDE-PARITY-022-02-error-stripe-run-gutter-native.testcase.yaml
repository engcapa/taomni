id: TC-IDE-PARITY-022-02
title: Native JDT LS error stripe, run gutter menu and semantic caret usages
description: 'ED-PARITY-022 A2/A3 native case on the in-repo maven-single sample and the CI-provisioned JDT LS: App.java with one type error and one raw-type warning shows error/warning marks on the right error stripe (click moves the caret), run gutter icons on the class and main lines backed by real run facts with a Run/Debug menu, and provider-backed caret usage highlights, all without editing the buffer.


  Mode: native.

  '
covers:
- F25.5
tags:
- code-workspace
- editor-surface
- ed-parity-022
- native-gate
- provider-fixture
- p1
modes:
- native
fixtures:
- reset_db
- java_sample_projects
- jdtls_required
timeout_sec: 600

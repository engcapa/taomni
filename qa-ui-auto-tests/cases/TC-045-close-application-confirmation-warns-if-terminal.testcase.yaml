id: TC-045
title: Close application confirmation warns if terminals are active
covers:
- F1.5
tags:
- legacy-imported
- main
- p1
- window-close
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_text:
    selector: '[data-testid="status-bar"]'
    contains: 1 terminals
- wait: 1
- click: '[data-testid="window-close"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text_equals:
    selector: '[data-testid="confirm-dialog-message"]'
    equals: There is 1 open tab, including 1 terminal session. Exit Taomni and close them?
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 1
- screenshot: 045-close-app-confirmation.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Close application confirmation warns if terminals are active：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 6
    - 9
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 4
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar\"]", "contains": "1 terminals"}}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 8
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"confirm-dialog-message\"]", "equals": "There
        is 1 open tab, including 1 terminal session. Exit Taomni and close them?"}}'
    - step: 10
      expectation: '{"assert_not_visible": "[data-testid=\"confirm-dialog\"]"}'
    - step: 11
      expectation: '{"assert_count": {"selector": "[data-testid=\"terminal-pane\"]", "equal": 1}}'
    results:
    - 10
    - 11
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

    - step: 53
      expectation: HTML export leaves saved source exact.
    - step: 57
      expectation: Host PNG decodes to a nonblank long document image.
    - step: 63
      expectation: DOCX ZIP checksums/XML/body/media are independently valid.
    - step: 67
      expectation: Bundled Markdown references resolve to native saved image pixels.
    - step: 68
      expectation: All exports leave the source hash unchanged.
    results:
    - 52
    - 53
    - 57
    - 63
    - 67
    - 68

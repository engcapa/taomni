id: TC-SHELL-B52
title: Bulk close reports partial progress and retries only the remaining target
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b15.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F25.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.qa.shell.enabled
    value: 'true'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - ''
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    key: Mod+End
- type: z
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - z
- shell_backend_scenario:
    action: fail-next
    command: workspace_write_file_encoded
- right_click: '[data-testid="tab-item"][data-active="true"]'
- click: '[data-testid="shell-tab-close-all"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-save"]'
- click: '[data-testid="shell-close-confirm"]'
- wait_for: '[data-testid="shell-close-error"]'
- assert_attribute:
    selector: '[data-testid="shell-close-summary"]'
    name: data-closed-count
    equals: '1'
- assert_attribute:
    selector: '[data-testid="shell-close-summary"]'
    name: data-remaining-count
    equals: '1'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 0
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - z
- click: '[data-testid="shell-close-retry-remaining"]'
- wait_for: '[data-testid="shell-close-save"]'
- click: '[data-testid="shell-close-save"]'
- click: '[data-testid="shell-close-confirm"]'
- wait_for: '[data-testid="welcome-panel"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 0
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 0
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 1
- screenshot: partial-close-retry.png

id: TC-SHOT-014
title: New annotation tools draw and erase
covers:
- F27.1
tags:
- screenshot
- annotate
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
# Highlighter: drag a stroke, undo becomes available.
- click: '[data-testid="screenshot-tool-highlighter"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-canvas"]'
    to: '[data-testid="screenshot-annotation-canvas"]'
    from_position:
      x: 80
      y: 80
    to_position:
      x: 200
      y: 120
- assert_enabled: '[data-testid="screenshot-undo"]'
# Blur: drag a region, undo still available.
- click: '[data-testid="screenshot-tool-blur"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-canvas"]'
    to: '[data-testid="screenshot-annotation-canvas"]'
    from_position:
      x: 220
      y: 80
    to_position:
      x: 300
      y: 160
- assert_enabled: '[data-testid="screenshot-undo"]'
# Balloon: drag a balloon, undo still available.
- click: '[data-testid="screenshot-tool-balloon"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-canvas"]'
    to: '[data-testid="screenshot-annotation-canvas"]'
    from_position:
      x: 80
      y: 200
    to_position:
      x: 220
      y: 280
- assert_enabled: '[data-testid="screenshot-undo"]'
# Eraser: draw a rect then erase it; undo chain reflects removal.
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-canvas"]'
    to: '[data-testid="screenshot-annotation-canvas"]'
    from_position:
      x: 250
      y: 200
    to_position:
      x: 320
      y: 260
- click: '[data-testid="screenshot-tool-eraser"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-canvas"]'
    to: '[data-testid="screenshot-annotation-canvas"]'
    from_position:
      x: 240
      y: 190
    to_position:
      x: 330
      y: 270
# Erasing pushes removed shapes to redo; redo becomes available.
- assert_enabled: '[data-testid="screenshot-redo"]'
- click: '[data-testid="screenshot-cancel"]'
- wait_for:
    selector: '[data-testid="system-screenshot"]'

id: TC-WS-078
title: Platform file activation keeps application menu ownership and close availability current
description: Open the first public file without a shell subscription, use its current contributed Save command, close the last file through the application menu,
  and reopen it. Browser proves the renderer menu and file workflow; native menu subscription and cleanup have focused mounted contracts. TC-WS-064/073 retain the
  unchanged activation budgets.
modes:
- browser
covers:
- F1.8
- F-WS-2
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_explorer
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-menu-ownership
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- click: '[data-testid="app-main-menu"]'
- assert_disabled: '[data-testid="context-menu-item-close-active-tab"]'
- press: Escape
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"] .cm-content'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: platform workspace root
- fill:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    value: 'Public menu save

      '
- wait_for: '[data-testid="workspace-editor-save"]:not(:disabled)'
- click: '[data-testid="app-main-menu"]'
- assert_enabled: '[data-testid="context-menu-item-close-active-tab"]'
- hover: '[data-testid="context-menu-item-tools"]'
- hover: '[data-testid="context-menu-workspace-actions"]'
- assert_enabled: '[data-testid="context-menu-workspace-command-workspace.save"]'
- click: '[data-testid="context-menu-workspace-command-workspace.save"]'
- wait_for: '[data-testid="workspace-editor-save"]:disabled'
- click: '[data-testid="app-main-menu"]'
- click: '[data-testid="context-menu-item-close-active-tab"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- assert_not_visible: '[data-testid="workspace-file-editor"]'
- click: '[data-testid="app-main-menu"]'
- assert_disabled: '[data-testid="context-menu-item-close-active-tab"]'
- hover: '[data-testid="context-menu-item-tools"]'
- assert_not_visible: '[data-testid="context-menu-workspace-actions"]'
- press: Escape
- press: Escape
- assert_not_visible: '[data-testid="context-menu-item-close-active-tab"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: Public menu save
- click: '[data-testid="app-main-menu"]'
- assert_enabled: '[data-testid="context-menu-item-close-active-tab"]'
- press: Escape
- assert_no_runtime_errors: null
- screenshot: workspace-tc-ws-078-menu-ownership.png
verification:
  review: reviewed
  native:
  - check: Native menu store subscriptions and disposal.
    method: not-applicable
    reason: This case covers the renderer menu. Focused mounted contracts cover the native menu subscription boundary.
  visual:
  - check: Menu readability.
    method: manual
    reason: Screenshot retained; enabled state, save, close and reopened content have executable assertions.
  requirements:
  - id: R1
    requirement: The first file enables Close, its live Save command saves edited content, closing the last file disables Close and releases its menu contribution,
      and reopening restores the saved contents.

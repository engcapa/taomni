id: TC-BACKUP-CLOUD-001
title: Separate destination proxies, inherited scope and saved settings survive reopening
description: Uses real Tauri IPC and OS credentials for two initially disabled destinations. No real Feishu authorization
  is claimed.
covers:
- F-BACKUP-1
- F-BACKUP-2
tags:
- backup
- settings
- p1
modes:
- native
fixtures:
- reset_db
- credential_store
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for: '[data-testid="backup-global-scope"]'
- click: '[data-testid="backup-feishu-add"]'
- fill:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-name"]'
    value: QA Feishu Direct
- select_option:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-proxy"]'
    value: none
- wait_for: '[data-testid="backup-settings-save-status"]'
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- assert_not_visible: '[data-testid="backup-feishu-app-id"]'
- click: '[data-testid="backup-feishu-add"]'
- fill:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(2) [data-testid="backup-cloud-name"]'
    value: QA Feishu App Proxy
- click: '[data-testid="backup-cloud-destination"]:nth-of-type(2) > summary'
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- click: '[data-testid="settings-group-toggle-backup"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- click: '[data-testid="backup-cloud-destination"]:nth-of-type(1) > summary'
- click: '[data-testid="backup-cloud-destination"]:nth-of-type(2) > summary'
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-name"]'
    name: value
    equals: QA Feishu Direct
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-proxy"]'
    name: value
    equals: none
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-range-mode"]'
    name: value
    equals: inherit
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(2) [data-testid="backup-cloud-name"]'
    name: value
    equals: QA Feishu App Proxy
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(2) [data-testid="backup-cloud-proxy"]'
    name: value
    equals: app
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(2) [data-testid="backup-cloud-range-mode"]'
    name: value
    equals: inherit
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-feishu-folder"]'
    name: value
    equals: ''
- fill:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-password"]'
    value: synthetic-case-password
- click: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-save"]'
- wait_for: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-enabled"]:not([disabled])'
- set_check:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-enabled"]'
    checked: true
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-zh-CN"]'
- assert_text:
    selector: '[data-testid="backup-feishu-add"]'
    contains: 添加飞书目标
- screenshot: backup-destinations-zh.png
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- assert_text:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-save"]'
    contains: Save archive password
- screenshot: backup-destinations-en.png
- select_option:
    selector: '[data-testid="backup-cloud-target"]'
    label: QA Feishu Direct
- assert_text:
    selector: '[data-testid="backup-cloud-target"] option:checked'
    contains: QA Feishu Direct
verification:
  review: reviewed
  native:
  - check: Disk persistence and native task cleanup
    method: automated
    reason: Production IPC and isolated profile; loopback Feishu is synthetic, not live service evidence.
  visual:
  - check: Backup layout and translated controls
    method: manual
    reason: Review retained workflow screenshots.
  requirements:
  - id: R1
    requirement: Targets retain names, separate proxy modes and inherited scope after reopening
    actions:
    - 7
    - 9
    - 13
    - 18
    checkpoints:
    - step: 12
      expectation: noSecrets
    - step: 21
      expectation: name1
    - step: 22
      expectation: proxy1Saved
    - step: 24
      expectation: name2
    - step: 25
      expectation: proxy2Saved
    - step: 23
      expectation: inherit1
    - step: 26
      expectation: inherit2
    - step: 27
      expectation: emptyRoot
    results:
    - 12
    - 21
    - 22
    - 24
    - 25
    - 23
    - 26
    - 27
  - id: R2
    requirement: Independent password enables a destination and controls translate live
    actions:
    - 29
    - 31
    - 34
    checkpoints:
    - step: 30
      expectation: passwordSaved
    - step: 32
      expectation: enabledSaved
    - step: 35
      expectation: translated
    - step: 39
      expectation: en
    results:
    - 30
    - 32
    - 35
    - 39

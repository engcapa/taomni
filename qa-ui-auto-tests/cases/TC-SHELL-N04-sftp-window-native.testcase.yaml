id: TC-SHELL-N04
title: Native SFTP independent channels, hidden jobs and interrupted child recover without a ghost view
description: V-N04 and SFTP portion of V-N18. The real original channel uploads while the detached channel
  downloads. OS close preserves a running child; the parent Transfers shows both actual jobs. Hard destruction
  returns the source and adopts live bytes before an explicit cancel. Final normal detach/OS-close restores
  path and selection once. Physical focus, IME and complete process crashes remain separate manual boundaries.
covers:
- F7.4
- F-SHELL-1
- F-Detach-1
tags:
- p1
- workspace-shell
modes:
- native
fixtures:
- reset_db
- shell_sftp_server
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-sftp-password
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- shell_navigate: sessions
- click: '[data-testid="session-new"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    timeout_sec: 15
- click: '[data-testid="session-proto-sftp"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: 127.0.0.1
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.shell_sftp_port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: SHELL-SFTP-ALPHA
- click: '[data-testid="session-save"]'
- wait_for:
    selector: '[data-testid="session-tree-item"][data-session-name="SHELL-SFTP-ALPHA"]'
    timeout_sec: 15
- dblclick: '[data-testid="session-tree-item"][data-session-name="SHELL-SFTP-ALPHA"]'
- wait_for:
    selector: '[data-testid="auth-prompt"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SHELL_SFTP_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="sftp-remote-list"]'
    timeout_sec: 15
- click: '[data-testid="sftp-local-path-edit"]'
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.shell_sftp_local}
- press: Enter
- wait_for:
    selector: '[data-testid="sftp-local-list"] tr[data-row][title$="upload 中文.bin"]'
    timeout_sec: 15
- click: '[data-testid="sftp-local-list"] tr[data-row][title$="upload 中文.bin"]'
- click: '[data-testid="sftp-local-upload-selected"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-state="running"]'
    timeout_sec: 20
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="tab-more"]'
- click: '[data-testid="open-tabs-detach-active"]'
- switch_window:
    route: '#sftp='
- wait_for:
    selector: '[data-testid="sftp-detached-window"][data-phase="ready"]'
    timeout_sec: 20
- assert_native_window_count:
    equal: 2
- wait_for:
    selector: '[data-testid="sftp-local-list"] tr[data-row][title$="upload 中文.bin"]'
    timeout_sec: 20
- wait_for:
    selector: '[data-testid="sftp-remote-list"] tr[data-row][title="/download 中文.bin"]'
    timeout_sec: 20
- click: '[data-testid="sftp-remote-list"] tr[data-row][title="/download 中文.bin"]'
- click: '[data-testid="sftp-remote-download-selected"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-state="running"]'
    timeout_sec: 20
- assert_file_progress:
    path: ${fixture.shell_sftp_local}/download 中文.bin
    state: growing
    full_size: 16777216
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: growing
    full_size: 16777216
- close_window: null
- switch_window:
    route: ''
- wait_for:
    selector: '[data-testid="shell-detached-placeholder"]'
    timeout_sec: 20
- assert_native_window_count:
    equal: 2
- click: '[data-testid="shell-transfers-trigger"]'
- wait_for:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-remote-path$="/download
      中文.bin"]'
    timeout_sec: 20
- assert_count:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"]'
    equal: 2
- assert_file_progress:
    path: ${fixture.shell_sftp_local}/download 中文.bin
    state: growing
    full_size: 16777216
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="shell-transfers-close"]'
- click: '[data-testid="shell-detached-focus"]'
- switch_window:
    route: '#sftp='
- wait_for:
    selector: '[data-testid="sftp-detached-window"][data-phase="ready"]'
    timeout_sec: 20
- assert_native_window_count:
    equal: 2
- wait_for:
    selector: '[data-testid="transfer-job"][data-state="done"]'
    timeout_sec: 90
    state: attached
- assert_file_sha256:
    path: ${fixture.shell_sftp_local}/download 中文.bin
    equals: ${fixture.shell_sftp_sha256}
- click: '[data-testid="sftp-local-list"] tr[data-row][title$="cancel 中文.bin"]'
- click: '[data-testid="sftp-local-upload-selected"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-state="running"]'
    timeout_sec: 20
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/cancel 中文.bin
    state: growing
    full_size: 16777216
- interrupt_detached_window: '#sftp='
- switch_window:
    route: ''
- assert_native_window_count:
    equal: 1
- assert_not_visible: '[data-testid="shell-detached-placeholder"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    timeout_sec: 20
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/cancel 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="shell-transfers-trigger"]'
- wait_for:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-remote-path$="/cancel
      中文.bin"]'
    timeout_sec: 20
- assert_count:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-state="running"]'
    equal: 1
- click: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-remote-path$="/cancel 中文.bin"]
    [data-testid="transfer-job-cancel"]'
- wait_for:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-remote-path$="/cancel
      中文.bin"][data-state="cancelled"]'
    timeout_sec: 20
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/cancel 中文.bin
    state: incomplete
    full_size: 16777216
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/cancel 中文.bin
    state: stable
    full_size: 16777216
- assert_file_sha256:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    equals: ${fixture.shell_sftp_sha256}
    timeout_sec: 90
- click: '[data-testid="shell-transfers-close"]'
- click: '[data-testid="tab-more"]'
- click: '[data-testid="open-tabs-detach-active"]'
- switch_window:
    route: '#sftp='
- wait_for:
    selector: '[data-testid="sftp-detached-window"][data-phase="ready"]'
    timeout_sec: 20
- close_window: null
- switch_window:
    route: ''
- assert_native_window_count:
    equal: 1
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    timeout_sec: 20
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_count:
    selector: '[data-testid="sftp-remote-list"] tr[aria-selected="true"][title="/download 中文.bin"]'
    equal: 1
- screenshot: tc-shell-n04-native-channels.png

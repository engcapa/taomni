id: TC-WS-041
title: Detailed file list sorts and persists; source packages flatten independently
description: Use all column headers and sort options, verify real row ordering and persistence, then open a nested package file. Return to Project and toggle
  Flatten Packages in Appearance.
modes:
- browser
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_explorer

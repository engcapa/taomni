id: TC-IDE-CW-ANALYSIS-03-suppress-file-native
title: Provider diagnostic can be hidden locally for one file
description: 'Native provider gate for the file-scoped Problems context menu action. The

  case is isolated from the line-suppression case so each action is verified

  against a clean inspection profile and the underlying source remains intact.

  '
covers:
- F25.2
tags:
- code-workspace
- analysis
- problems
- suppression
- jdtls
- native-gate
- p1
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- java_sample_projects
- jdtls_required
timeout_sec: 360
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-analysis-file-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-analysis-file","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/QuickFixTarget.java"},"lastOpenedAt":1789259400000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-lsp-status-pill"]'
    timeout_sec: 90
- click: '[data-testid="code-workspace-bottom-tab-problems"]'
- wait_for: '[data-testid="code-workspace-problems-panel"]'
- assert_text:
    selector: '[data-testid="code-workspace-problems-panel"]'
    contains: StringUtils cannot be resolved
    timeout_sec: 30
- right_click: '[data-testid="problems-diagnostic-row"]'
- wait_for: '[data-testid="context-menu-item-hide-this-diagnostic-locally-whole-file"]'
- click: '[data-testid="context-menu-item-hide-this-diagnostic-locally-whole-file"]'
- wait_for: '[data-testid="code-workspace-problems-panel"]'
- assert_text:
    selector: '[data-testid="code-workspace-problems-panel"]'
    contains: No problems in open files
    timeout_sec: 15
- screenshot: tc-ide-cw-analysis-03-suppress-file.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Provider diagnostic can be hidden locally for one file：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 10
    - 13
    - 15
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-lsp-status-pill\"]", "timeout_sec":
        90}}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"code-workspace-problems-panel\"]"}'
    - step: 12
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-problems-panel\"]", "contains":
        "StringUtils cannot be resolved", "timeout_sec": 30}}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"context-menu-item-hide-this-diagnostic-locally-whole-file\"]"}'
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"code-workspace-problems-panel\"]"}'
    - step: 17
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-problems-panel\"]", "contains":
        "No problems in open files", "timeout_sec": 15}}'
    results:
    - 16
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

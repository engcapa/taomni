id: TC-MFA-008
title: Many MFA accounts are found by search, group filter and keyboard, and copied without the mouse
description: V-17a (AC-10, AC-11, AC-17). Browser stub. Four exported accounts are imported into group Work and
  one is moved to Personal. Search matches issuer and account case-insensitively, Enter copies the first match,
  and an unmatched query shows the empty-result state. The group filter narrows to a group or to ungrouped accounts.
  ArrowDown from search walks the codes, ArrowUp goes back, and Enter on a focused code copies it.
covers:
- F-MFA-1
- F-MFA-2
tags:
- mfa
- keyboard
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-master-008
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-master-008
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-empty-add-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- upload_file:
    selector: '[data-testid="mfa-image-file"]'
    path: qa-ui-auto-tests/synthetic-fixtures/mfa/migration-four.png
- wait_for:
    selector: '[data-testid="mfa-import-preview"]'
    timeout_sec: 20
- fill:
    selector: '[data-testid="mfa-import-group"]'
    value: Work
- click: '[data-testid="mfa-import-confirm"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Zeta Cloud
    - Alpha Mail
    - Mid Bank
    - Beta Git
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="Beta Git"] *)'
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- fill:
    selector: '[data-testid="mfa-edit-group"]'
    value: Personal
- click: '[data-testid="mfa-edit-save"]'
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- fill:
    selector: '[data-testid="mfa-search"]'
    value: MAIL
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Alpha Mail
- press:
    key: Enter
    selector: '[data-testid="mfa-search"]'
- eval_readonly:
    expression: navigator.clipboard.readText()
    contains: '436092'
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Copied Alpha Mail
- fill:
    selector: '[data-testid="mfa-search"]'
    value: kim@
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Mid Bank
- fill:
    selector: '[data-testid="mfa-search"]'
    value: nomatch-xyz
- assert_visible: '[data-testid="mfa-no-results"]'
- fill:
    selector: '[data-testid="mfa-search"]'
    value: ''
- assert_count:
    selector: '[data-testid="mfa-account-row"]'
    equal: 4
- select_option:
    selector: '[data-testid="mfa-group-filter"]'
    value: Personal
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Beta Git
- select_option:
    selector: '[data-testid="mfa-group-filter"]'
    value: __ungrouped__
- assert_visible: '[data-testid="mfa-no-results"]'
- select_option:
    selector: '[data-testid="mfa-group-filter"]'
    value: ''
- assert_count:
    selector: '[data-testid="mfa-account-row"]'
    equal: 4
- press:
    key: ArrowDown
    selector: '[data-testid="mfa-search"]'
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Zeta Cloud
- press: ArrowDown
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Alpha Mail
- press: ArrowDown
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Mid Bank
- press: Enter
- eval_readonly:
    expression: navigator.clipboard.readText()
    contains: '885398'
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Copied Mid Bank
- press: ArrowUp
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Alpha Mail
- screenshot: mfa-008-search-groups.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: Search matches issuer or account case-insensitively, Enter copies the first match, and no match
      shows the empty-result state (AC-10, AC-11).
    actions:
    - 2
    - 3
    - 13
    - 15
    - 17
    - 18
    - 21
    - 22
    - 24
    - 25
    - 27
    - 29
    - 32
    - 34
    - 36
    checkpoints:
    - step: 20
      expectation: four imported accounts in export order
    - step: 26
      expectation: edit dialog closed after saving the group
    - step: 28
      expectation: MAIL finds Alpha Mail
    - step: 30
      expectation: Enter copied Alpha Mail's code
    - step: 31
      expectation: copy announced
    - step: 33
      expectation: account-name search finds Mid Bank
    - step: 35
      expectation: unmatched query shows no results
    - step: 37
      expectation: clearing search shows all four
    results:
    - 37
  - id: R2
    requirement: The group filter shows one group, ungrouped accounts, or all accounts (AC-11).
    actions:
    - 38
    - 40
    - 42
    checkpoints:
    - step: 39
      expectation: Personal holds Beta Git only
    - step: 41
      expectation: no ungrouped accounts
    - step: 43
      expectation: all groups restored
    results:
    - 43
  - id: R3
    requirement: Arrow keys move focus between codes and Enter on a focused code copies it (AC-17, AC-10).
    actions:
    - 44
    - 46
    - 48
    - 50
    - 53
    checkpoints:
    - step: 45
      expectation: first code focused from search
    - step: 47
      expectation: second code focused
    - step: 49
      expectation: third code focused
    - step: 51
      expectation: Enter copied Mid Bank's code
    - step: 52
      expectation: copy announced
    - step: 54
      expectation: ArrowUp returned to Alpha Mail
    results:
    - 54
  - id: workspace-navigation
    requirement: Explicit navigation preserves access to the original workflow in the Workspace-first shell.
    actions:
    - 2
    - 3
    checkpoints:
    - step: 52
      expectation: The original final visible result remains reachable after the navigation migration.
    results:
    - 52
  visual:
  - check: Search, group filter and focus ring on the focused code are visible.
    method: manual
    reason: Focus visibility needs human review of the screenshot.
  native:
  - check: Screen-reader announcements of the status line are not automated.
    method: manual
    reason: Requires assistive technology on each platform.

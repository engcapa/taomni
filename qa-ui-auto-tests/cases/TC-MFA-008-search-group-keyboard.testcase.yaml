id: TC-MFA-008
title: Many MFA accounts are found by search, group filter and keyboard, and copied without the mouse
description: 'V-17a (AC-10, AC-11, AC-17). Browser stub. Four exported accounts are imported into group
  Work and one is moved to Personal. Search matches issuer and account case-insensitively, Enter copies
  the first match, and an unmatched query shows the empty-result state. The group filter narrows to a
  group or to ungrouped accounts. ArrowDown from search walks the codes, ArrowUp goes back, and Enter
  on a focused code copies it.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks;
  Settings uses its permanent Rail button. Original business checks are retained.'
covers:
- F-MFA-1
- F-MFA-2
tags:
- mfa
- keyboard
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-master-008
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-master-008
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-empty-add-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- upload_file:
    selector: '[data-testid="mfa-image-file"]'
    path: qa-ui-auto-tests/synthetic-fixtures/mfa/migration-four.png
- wait_for:
    selector: '[data-testid="mfa-import-preview"]'
    timeout_sec: 20
- fill:
    selector: '[data-testid="mfa-import-group"]'
    value: Work
- click: '[data-testid="mfa-import-confirm"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Zeta Cloud
    - Alpha Mail
    - Mid Bank
    - Beta Git
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="Beta Git"] *)'
- click: '[data-testid="mfa-menu-edit"]'
- wait_for: '[data-testid="mfa-edit-dialog"]'
- fill:
    selector: '[data-testid="mfa-edit-group"]'
    value: Personal
- click: '[data-testid="mfa-edit-save"]'
- assert_not_visible: '[data-testid="mfa-edit-dialog"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-row"][data-issuer="Beta Git"] [data-testid="mfa-account-group"]'
    equals: Personal
- fill:
    selector: '[data-testid="mfa-search"]'
    value: MAIL
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Alpha Mail
- press:
    key: Enter
    selector: '[data-testid="mfa-search"]'
- eval_readonly:
    expression: navigator.clipboard.readText()
    contains: '436092'
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Copied Alpha Mail
- fill:
    selector: '[data-testid="mfa-search"]'
    value: kim@
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Mid Bank
- fill:
    selector: '[data-testid="mfa-search"]'
    value: nomatch-xyz
- assert_visible: '[data-testid="mfa-no-results"]'
- fill:
    selector: '[data-testid="mfa-search"]'
    value: ''
- assert_count:
    selector: '[data-testid="mfa-account-row"]'
    equal: 4
- select_option:
    selector: '[data-testid="mfa-group-filter"]'
    value: Personal
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Beta Git
- select_option:
    selector: '[data-testid="mfa-group-filter"]'
    value: __ungrouped__
- assert_visible: '[data-testid="mfa-no-results"]'
- select_option:
    selector: '[data-testid="mfa-group-filter"]'
    value: ''
- assert_count:
    selector: '[data-testid="mfa-account-row"]'
    equal: 4
- press:
    key: ArrowDown
    selector: '[data-testid="mfa-search"]'
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Zeta Cloud
- press: ArrowDown
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Alpha Mail
- press: ArrowDown
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Mid Bank
- press: Enter
- eval_readonly:
    expression: navigator.clipboard.readText()
    contains: '885398'
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Copied Mid Bank
- press: ArrowUp
- eval_readonly:
    expression: document.activeElement.dataset.testid + '|' + document.activeElement.closest('li').dataset.issuer
    contains: mfa-account-code|Alpha Mail
- screenshot: mfa-008-search-groups.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Search matches issuer or account case-insensitively, Enter copies the first match, and
      no match shows the empty-result state (AC-10, AC-11).
    actions:
    - 11
    - 13
    - 15
    - 16
    - 19
    - 20
    - 22
    - 23
    - 26
    - 28
    - 31
    - 33
    - 35
    checkpoints:
    - step: 18
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-account-row\"]", "attribute": "data-issuer",
        "equals": ["Zeta Cloud", "Alpha Mail", "Mid Bank", "Beta Git"]}}'
    - step: 24
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-edit-dialog\"]"}'
    - step: 27
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-account-row\"]", "attribute": "data-issuer",
        "equals": ["Alpha Mail"]}}'
    - step: 29
      expectation: '{"eval_readonly": {"expression": "navigator.clipboard.readText()", "contains": "436092"}}'
    - step: 30
      expectation: '{"assert_text": {"selector": "[data-testid=\"mfa-status\"]", "contains": "Copied Alpha
        Mail"}}'
    - step: 32
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-account-row\"]", "attribute": "data-issuer",
        "equals": ["Mid Bank"]}}'
    - step: 34
      expectation: '{"assert_visible": "[data-testid=\"mfa-no-results\"]"}'
    - step: 36
      expectation: '{"assert_count": {"selector": "[data-testid=\"mfa-account-row\"]", "equal": 4}}'
    results:
    - 36
  - id: R2
    requirement: The group filter shows one group, ungrouped accounts, or all accounts (AC-11).
    actions:
    - 37
    - 39
    - 41
    checkpoints:
    - step: 38
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-account-row\"]", "attribute": "data-issuer",
        "equals": ["Beta Git"]}}'
    - step: 40
      expectation: '{"assert_visible": "[data-testid=\"mfa-no-results\"]"}'
    - step: 42
      expectation: '{"assert_count": {"selector": "[data-testid=\"mfa-account-row\"]", "equal": 4}}'
    - step: 25
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-account-row\"][data-issuer=\"Beta
        Git\"] [data-testid=\"mfa-account-group\"]", "equals": "Personal"}}'
    results:
    - 42
    - 25
  - id: R3
    requirement: Arrow keys move focus between codes and Enter on a focused code copies it (AC-17, AC-10).
    actions:
    - 43
    - 45
    - 47
    - 49
    - 52
    checkpoints:
    - step: 44
      expectation: '{"eval_readonly": {"expression": "document.activeElement.dataset.testid + ''|'' +
        document.activeElement.closest(''li'').dataset.issuer", "contains": "mfa-account-code|Zeta Cloud"}}'
    - step: 46
      expectation: '{"eval_readonly": {"expression": "document.activeElement.dataset.testid + ''|'' +
        document.activeElement.closest(''li'').dataset.issuer", "contains": "mfa-account-code|Alpha Mail"}}'
    - step: 48
      expectation: '{"eval_readonly": {"expression": "document.activeElement.dataset.testid + ''|'' +
        document.activeElement.closest(''li'').dataset.issuer", "contains": "mfa-account-code|Mid Bank"}}'
    - step: 50
      expectation: '{"eval_readonly": {"expression": "navigator.clipboard.readText()", "contains": "885398"}}'
    - step: 51
      expectation: '{"assert_text": {"selector": "[data-testid=\"mfa-status\"]", "contains": "Copied Mid
        Bank"}}'
    - step: 53
      expectation: '{"eval_readonly": {"expression": "document.activeElement.dataset.testid + ''|'' +
        document.activeElement.closest(''li'').dataset.issuer", "contains": "mfa-account-code|Alpha Mail"}}'
    results:
    - 53
  visual:
  - check: Search, group filter and focus ring on the focused code are visible.
    method: manual
    reason: Focus visibility needs human review of the screenshot.
  native:
  - check: Screen-reader announcements of the status line are not automated.
    method: manual
    reason: Requires assistive technology on each platform.

id: TC-DB-EXEC-002-error-choice-browser
title: Failed statement asks Stop / Skip / Skip all and follows the choice
description: |
  DB-EXEC-002 V4. In the offline MySQL scaffold every statement fails. Running
  three statements shows the "Statement failed" choice; Skip runs the next
  statement, Stop on the second prompt leaves the third as NOT RUN.
covers:
- F-DB-1
tags:
- database
- sql
- execution-log
- db-parity
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- wait_for: '[data-testid="sidebar"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: db-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '3306'
- fill:
    selector: input[aria-label="Database username"]
    value: qa_user
- fill:
    selector: input[aria-label="Database name"]
    value: qa_db
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-db-exec-choice
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-db-exec-choice"]'
- open_session:
    name: qa-db-exec-choice
    double_click: true
- wait_for: '[data-testid="db-connection-error-banner"]'
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: SELECT 1 AS a; SELECT 2 AS b; SELECT 3 AS c;
- click: '[data-testid="db-run-all"]'
- wait_for: '[data-testid="choice-dialog"]'
- assert_text:
    selector: '[data-testid="choice-dialog-message"]'
    contains: Statement 1 of 3 failed
- click: '[data-testid="choice-dialog-secondary"]'
- assert_text:
    selector: '[data-testid="choice-dialog-message"]'
    contains: Statement 2 of 3 failed
    timeout_sec: 15
- click: '[data-testid="choice-dialog-cancel"]'
- wait_for: '[data-testid="db-execution-log"]'
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="failed"]'
    equal: 2
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="not-run"]'
    equal: 1
- assert_text:
    selector: '[data-testid="db-execution-log-summary"]'
    contains: 'Failed: 2'
- screenshot: db-exec-002-error-choice-browser.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Navigate from Home to Sessions, save and open the fixture MySQL bookmark, and reach the
      declared offline connection banner.
    actions:
    - 1
    - 2
    - 5
    - 7
    - 9
    - 10
    - 11
    - 12
    - 13
    - 15
    - 16
    - 18
    checkpoints:
    - step: 3
      expectation: the Sessions Navigator is visible.
    - step: 4
      expectation: the New session control is visible.
    - step: 6
      expectation: the session editor is visible.
    - step: 8
      expectation: the MySQL settings is visible.
    - step: 14
      expectation: the bookmark editor is visible.
    - step: 17
      expectation: The fixture session or saved query is visible at [data-testid="session-tree-item"][data-session-name="qa-db-exec-choice"].
    - step: 19
      expectation: the expected offline connection banner is visible.
    results:
    - 3
    - 4
    - 6
    - 8
    - 14
    - 17
    - 19
  - id: R2
    requirement: Skip the first failed statement, stop the second, and report exactly two FAILED / one
      NOT RUN entries with the matching statement numbers and summary.
    actions:
    - 20
    - 21
    - 22
    - 23
    - 26
    - 28
    checkpoints:
    - step: 24
      expectation: the statement error choice is visible.
    - step: 25
      expectation: '[data-testid="choice-dialog-message"] contains the required text ''Statement 1 of
        3 failed''.'
    - step: 27
      expectation: '[data-testid="choice-dialog-message"] contains the required text ''Statement 2 of
        3 failed''.'
    - step: 29
      expectation: the execution log is visible.
    - step: 30
      expectation: Exactly 2 elements match [data-testid="db-execution-log-entry"][data-status="failed"].
    - step: 31
      expectation: Exactly 1 elements match [data-testid="db-execution-log-entry"][data-status="not-run"].
    - step: 32
      expectation: '[data-testid="db-execution-log-summary"] contains the required text ''Failed: 2''.'
    results:
    - 24
    - 25
    - 27
    - 29
    - 30
    - 31
    - 32
  visual:
  - check: Inspect SQL toolbar, result log or Query Library inside the current Shell for clipping and
      readable controls.
    method: manual
    reason: DOM assertions need a separate screenshot verdict.
  native:
  - check: Real database connection, execution and transaction effects
    method: not-applicable
    reason: This browser case explicitly uses offline IPC preview; paired native DB cases prove real SQL
      and transaction effects.

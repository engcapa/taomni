id: TC-DB-EXEC-002-error-choice-browser
title: Failed statement asks Stop / Skip / Skip all and follows the choice
description: |
  DB-EXEC-002 V4. In the offline MySQL scaffold every statement fails. Running
  three statements shows the "Statement failed" choice; Skip runs the next
  statement, Stop on the second prompt leaves the third as NOT RUN.
covers:
- F-DB-1
tags:
- database
- sql
- execution-log
- db-parity
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: db-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '3306'
- fill:
    selector: input[aria-label="Database username"]
    value: qa_user
- fill:
    selector: input[aria-label="Database name"]
    value: qa_db
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-db-exec-choice
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-db-exec-choice"]'
- open_session:
    name: qa-db-exec-choice
    double_click: true
- wait_for: '[data-testid="db-connection-error-banner"]'
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: SELECT 1 AS a; SELECT 2 AS b; SELECT 3 AS c;
- click: '[data-testid="db-run-all"]'
- wait_for: '[data-testid="choice-dialog"]'
- assert_text:
    selector: '[data-testid="choice-dialog-message"]'
    contains: Statement 1 of 3 failed
- click: '[data-testid="choice-dialog-secondary"]'
- assert_text:
    selector: '[data-testid="choice-dialog-message"]'
    contains: Statement 2 of 3 failed
    timeout_sec: 15
- click: '[data-testid="choice-dialog-cancel"]'
- wait_for: '[data-testid="db-execution-log"]'
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="failed"]'
    equal: 2
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="not-run"]'
    equal: 1
- assert_text:
    selector: '[data-testid="db-execution-log-summary"]'
    contains: 'Failed: 2'
- screenshot: db-exec-002-error-choice-browser.png

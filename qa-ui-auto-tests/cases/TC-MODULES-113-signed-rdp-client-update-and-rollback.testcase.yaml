id: TC-MODULES-113
title: Signed RDP Client restores the saved session and certificate across version switches
description: >-
  Switch signed RDP Client versions against a runner-local RDP server. A native click reaches
  the desktop target after each resumed connection, including in a separate WebView. Verify
  disable, failed handshake recovery, rollback, and reuse of the saved session and certificate
  pin after reinstall.
covers: [F-Modules-1, F9.7, F-RdpServer-1, F-Detach-1]
tags: [modules, rdp-client, rdp-server, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, rdp_server_required, system_rdp_running, module_signed_rdp_archive, module_marketplace, release_build_required]
timeout_sec: 660

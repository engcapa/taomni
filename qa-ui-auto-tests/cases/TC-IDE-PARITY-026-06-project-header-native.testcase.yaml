id: TC-IDE-PARITY-026-06-project-header-native
title: Native Project tool window header, New file, Details and speed search match IDEA
description: 'ED-PARITY-026 A3 native case in the isolated QA app on a real host folder: the IDEA single title row (Project ▾, Search, New, Select
  Opened File, Expand All, Collapse All, Options, Hide), New (+) › File creating a real file on disk, Options › Appearance › Details showing the
  host modification time and byte size (notes.txt = 14 B), and speed search opened by typing in the tree and cleared with Esc.

  '
covers:
- F25.5
tags:
- splitter-regression
- code-workspace
- project-tree
- ed-parity-026
- p1
modes:
- native
fixtures:
- reset_db
- workspace_root
timeout_sec: 300
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-ed026t","name":"qa-ed026t","roots":[{"id":"qa-ed026t","name":"qa-ed026t","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-ed026t","path":"notes.txt"},"lastOpenedAt":1756500000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="tao-home-history"]'
- wait_for: '[data-testid="tao-home-history-popover"]'
- click: '[data-testid="tao-home-history-tab-workspaces"]'
- click: '[data-testid="tao-home-history-row"][data-workspace-path="${fixture.workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="code-workspace-tree-view-selector"]'
    contains: Project
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(1)')?.getAttribute('data-testid')
      === 'code-workspace-tree-view-selector'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(3)')?.getAttribute('title')
      === 'New…'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(4)')?.getAttribute('data-testid')
      === 'code-workspace-tree-select-opened'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(5)')?.getAttribute('data-testid')
      === 'code-workspace-tree-expand-all'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(6)')?.getAttribute('data-testid')
      === 'code-workspace-tree-collapse-all'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(7)')?.getAttribute('data-testid')
      === 'code-workspace-tree-toolbar-more'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(8)')?.getAttribute('data-testid')
      === 'code-workspace-tree-collapse'
    expect_truthy: true
- assert_text:
    selector: '[data-testid="code-workspace-tree-root-path"]'
    contains: native-workspaces
- click: '[data-testid="code-workspace-tree-select-opened"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
    name: data-selected
    equals: 'true'
- screenshot: tc-ide-parity-026-06-header.png
- click: '[data-testid="code-workspace-tree-new"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: ed026-native.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="ed026-native.txt"]'
    timeout_sec: 15
- assert_file_exists:
    path: ${fixture.workspace_root}/ed026-native.txt
- click: '[data-testid="code-workspace-tree-toolbar-more"]'
- click: '[data-testid="code-workspace-tree-menu-appearance"]'
- click: '[data-testid="code-workspace-tree-menu-details"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"] [data-testid="code-workspace-tree-file-details"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"] [data-testid="code-workspace-tree-file-details"]'
    contains: ', 14 B'
- assert_pattern:
    selector: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"] [data-testid="code-workspace-tree-file-details"]'
    regex: 20\d\d.*\d{1,2}:\d{2}, 14 B
- screenshot: tc-ide-parity-026-06-details.png
- press:
    key: n
    selector: '[data-testid="code-workspace-tree-pane"]'
- wait_for: '[data-testid="code-workspace-tree-speed-search"]'
- fill:
    selector: '[data-testid="code-workspace-tree-filter"]'
    value: notes
- wait_for:
    selector: '[data-testid="code-workspace-flat-file"][data-path="notes.txt"]'
    timeout_sec: 15
- assert_not_visible: '[data-testid="code-workspace-flat-file"][data-path="README.md"]'
- assert_not_visible: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- press:
    key: Escape
    selector: '[data-testid="code-workspace-tree-filter"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-speed-search"]'
    state: detached
    timeout_sec: 5
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
    timeout_sec: 15
- click: '[data-testid="code-workspace-tree-collapse"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-pane"]'
    state: hidden
    timeout_sec: 5
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Alt+1
- wait_for: '[data-testid="code-workspace-tree-pane"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-editor-pane"]').getBoundingClientRect().width
      > 100
    expect_truthy: true
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A3：原生应用中 Project 工具窗口为 IDEA 单行标题栏（Project ▾、Search、New、Select Opened File、Expand All、Collapse All、Options、Hide 顺序），根节点名后显示宿主路径。
    actions:
    - 22
    checkpoints:
    - step: 13
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tree-view-selector\"]", "contains": "Project"}}'
    - step: 14
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-tree-toolbar-actions\"]
        > button:nth-of-type(1)'')?.getAttribute(''data-testid'') === ''code-workspace-tree-view-selector''", "expect_truthy": true}}'
    - step: 15
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-tree-toolbar-actions\"]
        > button:nth-of-type(3)'')?.getAttribute(''title'') === ''New…''", "expect_truthy": true}}'
    - step: 16
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-tree-toolbar-actions\"]
        > button:nth-of-type(4)'')?.getAttribute(''data-testid'') === ''code-workspace-tree-select-opened''", "expect_truthy": true}}'
    - step: 17
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-tree-toolbar-actions\"]
        > button:nth-of-type(5)'')?.getAttribute(''data-testid'') === ''code-workspace-tree-expand-all''", "expect_truthy": true}}'
    - step: 18
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-tree-toolbar-actions\"]
        > button:nth-of-type(6)'')?.getAttribute(''data-testid'') === ''code-workspace-tree-collapse-all''", "expect_truthy": true}}'
    - step: 19
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-tree-toolbar-actions\"]
        > button:nth-of-type(7)'')?.getAttribute(''data-testid'') === ''code-workspace-tree-toolbar-more''", "expect_truthy": true}}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-tree-toolbar-actions\"]
        > button:nth-of-type(8)'')?.getAttribute(''data-testid'') === ''code-workspace-tree-collapse''", "expect_truthy": true}}'
    - step: 21
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tree-root-path\"]", "contains": "native-workspaces"}}'
    - step: 23
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"notes.txt\"]", "name": "data-selected",
        "equals": "true"}}'
    results:
    - 13
    - 14
    - 15
    - 16
    - 17
    - 18
    - 19
    - 20
    - 21
    - 23
  - id: R2
    requirement: A3：New(+) › File 在宿主目录创建 ed026-native.txt，树中出现该文件。
    actions:
    - 25
    - 26
    - 28
    - 29
    checkpoints:
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 30
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"ed026-native.txt\"]", "timeout_sec": 15}}'
    - step: 31
      expectation: '{"assert_file_exists": {"path": "${fixture.workspace_root}/ed026-native.txt"}}'
    results:
    - 27
    - 30
    - 31
  - id: R3
    requirement: A3：Options › Appearance › Details 在 notes.txt 行显示宿主修改时间与字节数 14 B。
    actions:
    - 32
    - 33
    - 34
    checkpoints:
    - step: 35
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"notes.txt\"] [data-testid=\"code-workspace-tree-file-details\"]",
        "timeout_sec": 10}}'
    - step: 36
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"notes.txt\"] [data-testid=\"code-workspace-tree-file-details\"]",
        "contains": ", 14 B"}}'
    - step: 37
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"notes.txt\"] [data-testid=\"code-workspace-tree-file-details\"]",
        "regex": "20\\d\\d.*\\d{1,2}:\\d{2}, 14 B"}}'
    results:
    - 35
    - 36
    - 37
  - id: R4
    requirement: A3：在树中键入字符打开速搜，过滤到 notes 后 README.md 消失；Esc 清空速搜并恢复全部文件。
    actions:
    - 39
    - 41
    - 45
    checkpoints:
    - step: 40
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-speed-search\"]"}'
    - step: 42
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-flat-file\"][data-path=\"notes.txt\"]", "timeout_sec": 15}}'
    - step: 43
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-flat-file\"][data-path=\"README.md\"]"}'
    - step: 44
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree-file\"][data-path=\"README.md\"]"}'
    - step: 46
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-speed-search\"]", "state": "detached", "timeout_sec": 5}}'
    - step: 47
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"README.md\"]", "timeout_sec": 15}}'
    results:
    - 40
    - 42
    - 43
    - 44
    - 46
    - 47
  - id: R-SIZE
    requirement: Restoring Project leaves both the tree and editor usable with nonzero editor width; retain the real panel-library pixel-width
      and continuous-drag regression in CodeWorkspaceSplitter.integration.test.tsx.
    actions:
    - 48
    results:
    - 53
    - 54
    checkpoints:
    - step: 53
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"code-workspace-editor-pane\"]'').getBoundingClientRect().width
        > 100", "expect_truthy": true}}'
    - step: 54
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

id: TC-MODULES-025
title: Native VNC-only legacy preflight preserves data and idempotent pending state through restart
description: Seeds disposable SSH/VNC rows, an existing core Mobile desktop policy and two invalid SQLite LanChat files before startup. Real Settings preflight
  must recommend only vnc-client, read no removed chat database, write nothing before explicit migration, and keep a
  single pending VNC journal through repeat and normal restart. Press Enter on the focused migration button at both
  activations. TC-MODULES-027 covers the already installed 0.5.x app.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- native
fixtures:
- reset_db
- module_upgrade
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- &id001
  wait_for: '[data-testid="status-bar"]'
- &id002
  click: '[data-testid="ribbon-settings"]'
- &id003
  wait_for: '[data-testid="settings-panel"]'
- &id004
  fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- &id005
  wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- &id006
  assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 1
- &id007
  assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- &id008
  assert_visible: '[data-testid="module-upgrade-retained"]'
- &id009
  assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- &id010
  assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: preflight
- press:
    selector: '[data-testid="module-upgrade-migrate"]:not([disabled])'
    key: Enter
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- module_upgrade_probe:
    phase: pending
- native_restart_app:
    expect_exit_confirmation:
      title: Exit
      message: There is 1 open tab. Exit Taomni and close it?
      confirm_label: Exit
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- *id007
- *id008
- *id009
- *id010
- module_upgrade_probe:

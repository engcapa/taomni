id: TC-061
title: Tab middle-click closes a closable tab
covers:
- F1.5
tags:
- legacy-imported
- mouse
- p1
- tabs
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tab-bar"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_count:
    selector: '[data-testid="tab-item"]'
    min: 2
- middle_click: '[data-testid="tab-item"][data-tab-type="terminal"]'
- wait: 1
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 1
- screenshot: 061-tab-middle-click-close.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tab middle-click closes a closable tab：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 6
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"tab-bar\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 5
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"]", "min": 2}}'
    - step: 8
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"]", "equal": 1}}'
    results:
    - 8
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

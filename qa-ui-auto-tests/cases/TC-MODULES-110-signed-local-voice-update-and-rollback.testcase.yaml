id: TC-MODULES-110
title: Signed Local Voice switches versions and decodes real speech in one desktop session
description: >-
  Install an independently compiled Local Voice host-only prerelease, select the cached whisper-base
  English model, verify real JFK audio decoding in the AI chat drawer, confirm disabled refusal links
  to Module Store, download the current signed build from the loopback catalog, update and roll back
  both while disabled and while active without restarting Taomni, recover from a handshake-failure
  candidate, uninstall with cached ASR weights intact and an empty retained locator, verify install
  guidance when missing, and reinstall with real speech decoding restored.
covers: [F-Modules-1, F-AI-2.3]
tags: [modules, voice, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, module_signed_voice_archive, module_marketplace, release_build_required]
timeout_sec: 480
steps:

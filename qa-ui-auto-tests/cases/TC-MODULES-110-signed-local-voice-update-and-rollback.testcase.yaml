verification:
  review: reviewed
  requirements:
  - id: disabled-update-and-rollback
    requirement: Update and roll back a disabled Local Voice host-only package without restarting Taomni while rejecting dictation cleanly when disabled and preserving the cached Whisper model.
    actions: [10, 12, 17, 19, 27, 29, 36, 43, 52, 55, 57, 60]
    checkpoints:
    - {step: 30, expectation: The earlier signed host decodes JFK speech into the empty composer draft.}
    - {step: 31, expectation: The decoded transcript includes the distinct reference word country.}
    - {step: 33, expectation: The earlier signed host owns the writer lease and cached model hash matches.}
    - {step: 38, expectation: Disabling releases the writer lease cleanly.}
    - {step: 45, expectation: Dictation while disabled surfaces Enable Local Voice guidance and remains idle.}
    - {step: 59, expectation: Updating while disabled activates the current host-only version without starting the host.}
    - {step: 62, expectation: Rolling back while disabled restores the earlier version with no running host.}
    results: [30, 31, 33, 38, 45, 59, 62]
  - id: enabled-update-and-failed-handshake
    requirement: Replace and roll back an active Local Voice host, decode real speech on every switched version, and recover cleanly when an update fails handshake.
    actions: [63, 71, 73, 82, 83, 92, 94, 102, 106, 115, 117]
    checkpoints:
    - {step: 74, expectation: Re-enabled earlier host freshly decodes JFK speech after clearing the composer.}
    - {step: 77, expectation: Old host is re-enabled and owns its writer lease.}
    - {step: 85, expectation: Live update starts the current signed host cleanly.}
    - {step: 95, expectation: Current signed host freshly decodes JFK speech in the composer.}
    - {step: 104, expectation: Handshake-failure version reports permission denied without interrupting the active host.}
    - {step: 105, expectation: Failed update preserves the running current host and its writer lease.}
    - {step: 108, expectation: Manual rollback switches the running host back to the earlier version.}
    - {step: 118, expectation: Rolled-back earlier host freshly decodes JFK speech.}
    results: [74, 77, 85, 95, 104, 105, 108, 118]
  - id: stateless-uninstall-and-reinstall
    requirement: Uninstalling Local Voice clears binaries and runtime with an empty retained locator while preserving cached ASR model weights, shows install guidance while missing, and restores real decoding on reinstall.
    actions: [123, 124, 131, 140, 142, 150, 152]
    checkpoints:
    - {step: 126, expectation: Uninstall removes versions and runtime cleanly with stateless empty retained-data locator and preserved whisper-base cache.}
    - {step: 133, expectation: Dictation while uninstalled displays Install Local Voice guidance.}
    - {step: 153, expectation: Reinstalling and enabling current Local Voice restores JFK speech decoding.}
    - {step: 156, expectation: Reinstalled host owns its writer lease and passes final lifecycle checks.}
    - {step: 157, expectation: No renderer runtime errors occurred across all lifecycle transitions.}
    results: [126, 133, 153, 156, 157]
  visual:
  - check: Whisper model selection, composer transcription text, and Module Store action/error badges across all switches.
    method: automated
    reason: UI waits and assertions confirm model state, decoded speech text, and dictation alerts.
  native:
  - check: Real OS process lineage, signed host bytes (without frontend), writer lease, cached ggml-base.bin SHA-256, and stateless empty retained locator.
    method: automated
    reason: assert_signed_module_lifecycle inspects native process tables, writer leases, cached weights, and on-disk directories.

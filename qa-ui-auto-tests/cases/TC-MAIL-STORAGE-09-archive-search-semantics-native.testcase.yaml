id: TC-MAIL-STORAGE-09
title: Indexed archive search stays literal for short, wildcard-like and non-Latin queries
description: The real indexed SQLite archive returns literal substring matches for short queries
  through the metadata scan path, for three-or-more character queries through the FTS path with
  its literal recheck, for wildcard-like and quoted text without expansion or syntax errors, and
  for non-Latin text; field scoping selects senders or recipients only. Native indexed storage
  and byte accounting; the renderer workflow is covered by TC-MAIL-STORAGE-08.
covers:
- F-MAIL-23
tags:
- mail
- p1
modes:
- native
fixtures:
- reset_db
- mail_server
- mail_storage
timeout_sec: 420
steps:

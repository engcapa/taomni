- click: '[data-testid="session-port"]'
- assert_visible: '[data-testid="session-editor"] >> text="SSH command imported into this session."'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: ssh-import.example.test
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: '2202'
- assert_attribute:
    selector: '[data-testid="session-user"]'
    name: value
    equals: qa

    contains: Project
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) +
      '"code-workspace-tree-toolbar-actions"] > button:nth-of-type(1)')?.getAttribute('data-testid')
      === 'code-workspace-tree-view-selector'
    expect_truthy: true
- eval_readonly:

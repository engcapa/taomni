id: TC-IDE-PARITY-026-05
title: Project tool window header, New menu, views, Appearance and speed search match
  IDEA
description: "ED-PARITY-026 A3 browser case. The Project tool window uses IDEA's single
  title row — \"Project ▾\" view selector, then New (+), Select Opened File, Expand
  All, Collapse All, Options (⋮) and Hide (−) — instead of the two Taomni toolbar
  rows. New (+) creates files; the selector switches Project / Project Files; Options
  › Appearance toggles Details (time, size), Compact Directories and the tree zoom;
  typing in the tree opens IDEA speed search, Esc clears it; Hide collapses the tool
  window and Alt+1 restores it.\n\n  Mode: browser.\n\nShell v2 entry adaptation:
  Tools and Sessions use the permanent Rail with visibility-aware user clicks; Settings
  uses its permanent Rail button. Original business checks are retained."
covers:
- F25.5
tags:
- code-workspace
- project-tree
- ed-parity-026
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'

id: TC-IDE-PARITY-026-05
title: Project tool window header, New menu, views, Appearance and speed search match IDEA
description: "ED-PARITY-026 A3 browser case. The Project tool window uses IDEA's single title row — \"Project ▾\" view selector, then New (+),\
  \ Select Opened File, Expand All, Collapse All, Options (⋮) and Hide (−) — instead of the two Taomni toolbar rows. New (+) creates files; the\
  \ selector switches Project / Project Files; Options › Appearance toggles Details (time, size), Compact Directories and the tree zoom; typing\
  \ in the tree opens IDEA speed search, Esc clears it; Hide collapses the tool window and Alt+1 restores it.\n\n  Mode: browser.\n Header actions\
  \ may publish after the editor shell; allow 1.5s for their exact order to settle."
covers:
- F25.5
tags:
- splitter-regression
- code-workspace
- project-tree
- ed-parity-026
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240

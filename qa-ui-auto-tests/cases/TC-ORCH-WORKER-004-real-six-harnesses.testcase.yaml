id: TC-ORCH-WORKER-004
title: Native Taomni schedules all six installed coding harnesses against the isolated fixture LLM
description: Real UI submissions freeze and approve one worker at a time. Native teardown independently verifies six durable candidate tasks, owned Git worktrees, harmless marker diffs, real tool-result protocol requests and pinned installed process receipts. No browser stub or standalone canary substitutes for this evidence.
modes: [native]
native_platforms: [Linux]
covers: [F-ORCH-1]
tags: [p0, orchestration, real-worker, release-native]
fixtures: [reset_db, orchestration_llm, release_build_required]
timeout_sec: 600
steps:

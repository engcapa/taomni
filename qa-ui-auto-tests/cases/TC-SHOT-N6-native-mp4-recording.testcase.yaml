id: TC-SHOT-N6
title: Native animated fixture records decodable built-in H264 MP4
covers: [F27.1]
tags: [screenshot, recording, native, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario: {scenario: record, format: mp4, secs: 3}
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: mp4-capture
    requirement: Built-in H264 and MP4 recording captures real motion at correct dimensions and wall-clock duration without system ffmpeg.
    actions: [1]
    checkpoints:
    - {step: 3, expectation: "Actual H264 samples decode, at least twelve frames/four distinct frames, duration 75-140 percent of three seconds and actual MP4 retained."}
    results: [3]
  visual:
  - {check: Motion fidelity, method: external, reason: Play retained MP4; automated H264 decoder verifies frames and duration.}
  native:
  - {check: MP4 pipeline, method: automated, reason: "Real screen source and built-in OpenH264/muxer, not file-header-only or stub evidence."}

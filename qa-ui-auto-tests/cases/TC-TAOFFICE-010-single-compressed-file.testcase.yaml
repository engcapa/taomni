id: TC-TAOFFICE-010
title: Preview and decompress a single gzip file in Explorer
description: Extract the decompressed file directly to the chosen directory and verify the original source and destination after a collision.
modes: [browser, native]
covers: [F-FILEOPEN-1]
tags: [p0, file-open, taoffice, archive, core-only]
fixtures: [reset_db, file_open_files]
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- dblclick: '[data-testid="explorer-file-row"][data-name="notes-backup.txt.GZ"]'
- wait_for: '[data-testid="archive-entry"][data-name="notes-backup.txt"]'
- assert_count: {selector: '[data-testid="archive-entry"]', equal: 1}
- press: {selector: '[data-testid="archive-extract-here"]', key: Enter}
- assert_text: {selector: '[data-testid="archive-output"]', contains: notes-backup.txt}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/notes-backup.txt', sha256: '${fixture.file_open_original_sha}'}
- press: {selector: '[data-testid="archive-extract-here"]', key: Enter}
- wait_for: '[data-testid="archive-error"]'
- assert_file_open_bytes: {path: '${fixture.file_open_root}/notes-backup.txt', sha256: '${fixture.file_open_original_sha}'}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/notes-backup.txt.GZ', sha256: '${fixture.taoffice_gzip_sha}'}
- press: {selector: '[data-testid="archive-preview"]', key: Enter}
- wait_for: '[data-testid="file-viewer"][data-kind="text"][data-active="true"] [data-testid="viewer-readonly"]'
- assert_file_open_bytes: {selector: '[data-testid="file-viewer"][data-kind="text"][data-active="true"]', sha256: '${fixture.file_open_original_sha}'}
- assert_no_runtime_errors: null

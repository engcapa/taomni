id: TC-SHOT-N27
title: Native screenshot overlay startup timing is measured in backend and renderer segments to the select phase
description: "P0-0/P0-0b measurement case for the screenshot startup delay. The overlay is opened in two groups of 20 through the production command entry: first a hidden-renderer handshake probe without early window or exclusion, then the dependent optimized P1 candidate. Run 0 is the same-process first open, not a process cold start. Profiles are scoped QA experiments until native gates justify production enables. Each run reports the backend stages recorded inside the open pipeline (entry lead, permission, display, hide, capture with its open/drain/drop sub-stages and the Wayland portal milestones, save_png, window_built, window_joined, cover, ready or ready_timeout, show, hide_after_show on the exclusion path, focus, read_file), the renderer marks of the QA bundle (entry, app, mount, init, read, decode, commit, paint, fcp) aligned to the backend start, the chosen isolation path and startup profile, the time to the overlay window, base image and select phase, and firstMs = max(show, renderer commit). The summary gives P50/P95 per stage and the ready-handshake ratio (ready before show vs timeouts). This case is measurement, not an absolute budget gate: it fails only when a run never reaches select, a required stage or renderer mark is missing, or the main window is not restored. It runs on Linux (Xvfb, X11, VNC and Wayland profiles), Windows and macOS so the platform segments are comparable with the P0-0 baseline (run 41271553565). CI runners are not slow machines."
covers: [F27.1]
tags: [screenshot, native, timing, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario: {scenario: startup-timing}
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: startup-timing
    requirement: Forty overlay opens in two groups of twenty each reach the select phase and each reports the complete set of backend stages, the renderer marks of the QA bundle and the ready-handshake outcome, so the startup delay can be attributed to entry, permission, display lookup, isolation, capture (portal/capturer open, drain, drop), PNG encoding, window creation, cover, the handshake, show, focus and the renderer's module load, payload read-back and decode instead of guessed from a single total.
    actions: [1, 2]
    checkpoints:
    - {step: 3, expectation: "Evidence contains 40 runs in two groups of 20 (run 0 same-process first open), with per-group P50/P95 and handshake ratios, closed and mainRestored true on every run, each with selectMs, windowMs, imageMs, firstMs, backendComplete true (start, permission, display, hide, capture, save_png, window_built, window_joined, cover, show and focus present, plus ready or ready_timeout when the handshake is enabled), per-stage deltas, the isolation note, rendererComplete true (entry, app, mount, init, read, decode, commit marks) and the summary with P50/P95 per stage, selectMs, firstMs and the ready-before-show ratio; the main window is visible after the scenario. No absolute millisecond threshold is asserted."}
    results: [3]
  visual:
  - {check: Overlay timing evidence, method: automated, reason: "The claimed evidence is numeric timing from the backend snapshot, the renderer marks and DOM phase polling, not pixel comparison; flash frames are sampled by TC-SHOT-N28."}
  native:
  - {check: Production overlay open through the QA scenario, method: automated, reason: "The scenario calls the production screenshot_open_overlay command (not a stub capture) in the isolated debug QA app, reads the real WebviewWindow and overlay DOM, and reports the backend timing snapshot recorded inside the open pipeline together with the QA bundle's renderer marks."}

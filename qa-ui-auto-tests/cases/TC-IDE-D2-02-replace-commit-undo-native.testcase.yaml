id: TC-IDE-D2-02-replace-commit-undo-native
title: "Replace commit with preconditions and one undo in packaged app"
description: |
  §8.19.10 native gate case (ED-FIND-004 A3/A4). Enters a disposable
  workspace_root through persisted recents, searches the seeded notes file
  with the real ripgrep backend, opens the replace preview, commits, and
  proves the file receipt changed on host disk; then one workspace undo
  restores the original bytes. Dirty/disk preconditions run before apply;
  preview exclusion and cancel are covered by unit tests and the browser
  gate. Highest claim on green: L2 provider-backed (Linux).

  ED-IMPROVE-004 extension: a second segment searches "notes" across
  notes.txt and the astral-prefixed unicode.txt ("😀notes"). The preview
  must count 2 of 2, the commit must write exact UTF-8/LF bytes for both
  files (sha256 pinned; a code-point/UTF-16 mix-up would produce a broken
  surrogate and a different hash), and one workspace undo must restore both
  original files in a single transaction.
covers: [F25.5]
tags: [code-workspace, ide-find, replace, native-gate, p1]
modes: [native]
fixtures: [reset_db, workspace_root]
timeout_sec: 600
steps:
  - open: "${cfg.app.base_url}"
  - vault_first_run: "qa-native-gate-password"
  - wait_for: '[data-testid="welcome-panel"]'
  # Enter the disposable fixture root through persisted recents (no picker).
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-d2","name":"qa-root","roots":[{"id":"qa-root","name":"qa-root","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-root","path":"notes.txt"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for:
      selector: '[data-testid="code-workspace-editor-pane"]'
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "scratch notes"
      timeout_sec: 60
  - click: '[data-testid="code-workspace-bottom-tab-search"]'
  - wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
  - assert_attribute:
      selector: '[data-testid="code-workspace-bottom-tab-search"]'
      name: aria-selected
      equals: "true"
  - native_click:
      selector: '[aria-label="Search query"]'
  - native_keys:
      selector: '[aria-label="Search query"]'
      keys: ["Control+a", "s", "c", "r", "a", "t", "c", "h", "Enter"]
  - click: '[data-testid="code-workspace-find-run-search"]'
  - assert_text:
      selector: '[data-testid="code-workspace-find-in-files-panel"]'
      contains: "notes.txt"
      timeout_sec: 60
  - native_click:
      selector: '[aria-label="Replace text"]'
  - native_keys:
      selector: '[aria-label="Replace text"]'
      keys: ["Control+a", "s", "n", "a", "t", "c", "h"]
  - click: '[data-testid="code-workspace-find-replace-all"]'
  - wait_for: '[data-testid="code-workspace-replace-preview"]'
  - assert_text:
      selector: '[data-testid="code-workspace-replace-counts"]'
      contains: "1 of 1"
      timeout_sec: 10
  - click: '[data-testid="code-workspace-replace-commit"]'
  - assert_file_contains:
      path: "${fixture.workspace_root}/notes.txt"
      contains: "snatch notes"
      timeout_sec: 30
  - native_click:
      selector: '[aria-label="Search query"]'
  - native_keys:
      selector: '[aria-label="Search query"]'
      keys: ["Control+z"]
  - assert_file_contains:
      path: "${fixture.workspace_root}/notes.txt"
      contains: "scratch notes"
      timeout_sec: 30
  # ---------------------------------------------------------------------
  # ED-IMPROVE-004: astral-prefixed, multi-file replace with exact bytes.
  # unicode.txt starts with an emoji before the match, so a code-point
  # offset used as a UTF-16 character would split the surrogate pair.
  # ---------------------------------------------------------------------
  - native_click:
      selector: '[aria-label="Search query"]'
  - native_keys:
      selector: '[aria-label="Search query"]'
      keys: ["Control+a", "n", "o", "t", "e", "s", "Enter"]
  - click: '[data-testid="code-workspace-find-run-search"]'
  - assert_text:
      selector: '[data-testid="code-workspace-find-in-files-panel"]'
      contains: "unicode.txt"
      timeout_sec: 60
  - native_click:
      selector: '[aria-label="Replace text"]'
  - native_keys:
      selector: '[aria-label="Replace text"]'
      keys: ["Control+a", "r", "e", "m", "a", "r", "k", "s"]
  - click: '[data-testid="code-workspace-find-replace-all"]'
  - wait_for: '[data-testid="code-workspace-replace-preview"]'
  - assert_text:
      selector: '[data-testid="code-workspace-replace-counts"]'
      contains: "2 of 2"
      timeout_sec: 10
  - click: '[data-testid="code-workspace-replace-commit"]'
  # Exact bytes: UTF-8 emoji intact, LF endings, no replacement character.
  - assert_file_sha256:
      path: "${fixture.workspace_root}/unicode.txt"
      equals: "f92df32d9b7e0ac26c410d4ee14c41700f02512e25fb701732bba1931b7e78c8"
      timeout_sec: 30
  - assert_file_sha256:
      path: "${fixture.workspace_root}/notes.txt"
      equals: "1547844594dec1a34955217c21adc261063b390647aae0582e7a70f952dccc0a"
      timeout_sec: 30
  # ONE workspace undo restores BOTH original files (single transaction).
  - native_click:
      selector: '[aria-label="Search query"]'
  - native_keys:
      selector: '[aria-label="Search query"]'
      keys: ["Control+z"]
  - assert_file_sha256:
      path: "${fixture.workspace_root}/unicode.txt"
      equals: "fd567d8fb0684d0ac4754b8453a837f68113374f0abd92135fb6959b37d1b6c3"
      timeout_sec: 30
  - assert_file_sha256:
      path: "${fixture.workspace_root}/notes.txt"
      equals: "d10eea22971a9850a14277b8e4b2f5922c5f27530a9d216774c8029d6340a538"
      timeout_sec: 30
  - screenshot: tc-ide-d2-02-replace-undo.png
  # ---------------------------------------------------------------------
  # ED-REPAIR-006: case-distinct files on POSIX (A.java and a.java).
  # Confirm independent creation and read, replace across both files,
  # commit changes to disk, and verify single transaction undo.
  # ---------------------------------------------------------------------
  - assert_file_contains:
      path: "${fixture.workspace_root}/A.java"
      contains: "class CaseAlpha"
      timeout_sec: 10
  - assert_file_contains:
      path: "${fixture.workspace_root}/a.java"
      contains: "class CaseBeta"
      timeout_sec: 10
  - native_click:
      selector: '[aria-label="Search query"]'
  - native_keys:
      selector: '[aria-label="Search query"]'
      keys: ["Control+a", "m", "a", "t", "c", "h", "Enter"]
  - click: '[data-testid="code-workspace-find-run-search"]'
  - assert_text:
      selector: '[data-testid="code-workspace-find-in-files-panel"]'
      contains: "A.java"
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="code-workspace-find-in-files-panel"]'
      contains: "a.java"
      timeout_sec: 60
  - native_click:
      selector: '[aria-label="Replace text"]'
  - native_keys:
      selector: '[aria-label="Replace text"]'
      keys: ["Control+a", "s", "w", "a", "p", "p", "e", "d"]
  - click: '[data-testid="code-workspace-find-replace-all"]'
  - wait_for: '[data-testid="code-workspace-replace-preview"]'
  - assert_text:
      selector: '[data-testid="code-workspace-replace-counts"]'
      contains: "2 of 2"
      timeout_sec: 10
  - click: '[data-testid="code-workspace-replace-commit"]'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/A.java"
      equals: "34ff590ff2c2bb60fd7d7759c35d6248150e5ea694a47c032e580e484fef3df9"
      timeout_sec: 30
  - assert_file_sha256:
      path: "${fixture.workspace_root}/a.java"
      equals: "0b7fa25adf2ccbc0aa923ec8b0ac6b43dcd43781c360ca3da056a13276f38e2b"
      timeout_sec: 30
  - native_click:
      selector: '[aria-label="Search query"]'
  - native_keys:
      selector: '[aria-label="Search query"]'
      keys: ["Control+z"]
  - assert_file_sha256:
      path: "${fixture.workspace_root}/A.java"
      equals: "d35a1d24a4a83b201cf533f96f2dfa0392d1ada7043d8c587a69aa46ef16b2a2"
      timeout_sec: 30
  - assert_file_sha256:
      path: "${fixture.workspace_root}/a.java"
      equals: "15d66fc6cb85ec5cd64547811d5551a91454946f3a7ddb985af514b56906c4a1"
      timeout_sec: 30
  - screenshot: tc-ide-d2-02-replace-case-undo.png

id: TC-WS-NATIVE-002
title: 'AC-05: a real local PTY survives workspace and surface switches'
description: Uses xterm text input and real native PTY output to verify lifecycle. This is not physical OS keyboard
  evidence; whole-string input avoids WKWebView per-key synthesis truncation.
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- native
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-test-password
- wait_for: '[data-testid="workspace-navigator"]'
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-local-shell"] > button'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)[$#>%]\s*$
    timeout_sec: 30
- click: '[data-testid="terminal-pane"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_WORKSPACE_PTY_BEFORE
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_WORKSPACE_PTY_BEFORE\s*$
    timeout_sec: 15
- click: '[data-testid="workspace-surface-overview"]'
- click: '[data-testid="workspace-row-qa-workspace-remote"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-local-shell"] > button'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_WORKSPACE_PTY_BEFORE\s*$
    timeout_sec: 15
- click: '[data-testid="terminal-pane"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_WORKSPACE_PTY_AFTER
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_WORKSPACE_PTY_AFTER\s*$
    timeout_sec: 15
- screenshot: native-workspace-pty.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: 'AC-05: a real local PTY survives workspace and surface switches'
    actions:
    - 5
    - 6
    - 9
    - 10
    - 12
    - 13
    - 14
    - 15
    - 19
    - 20
    checkpoints:
    - step: 8
      expectation: '{''assert_pattern'': {''selector'': ''[data-testid="terminal-pane"]'', ''regex'': ''(?m)[$#>%]\\s*$'',
        ''timeout_sec'': 30}}'
    - step: 11
      expectation: '{''assert_pattern'': {''selector'': ''[data-testid="terminal-pane"]'', ''regex'': ''(?m)^QA_WORKSPACE_PTY_BEFORE\\s*$'',
        ''timeout_sec'': 15}}'
    - step: 17
      expectation: '{''assert_count'': {''selector'': ''[data-testid="terminal-pane"]'', ''equal'': 1}}'
    - step: 18
      expectation: '{''assert_pattern'': {''selector'': ''[data-testid="terminal-pane"]'', ''regex'': ''(?m)^QA_WORKSPACE_PTY_BEFORE\\s*$'',
        ''timeout_sec'': 15}}'
    - step: 21
      expectation: '{''assert_pattern'': {''selector'': ''[data-testid="terminal-pane"]'', ''regex'': ''(?m)^QA_WORKSPACE_PTY_AFTER\\s*$'',
        ''timeout_sec'': 15}}'
    results:
    - 8
    - 11
    - 17
    - 18
    - 21
  visual:
  - check: Compare typography, theme tokens, Lucide icon shape, spacing and clipping with the existing shell.
    method: manual
    reason: Visual evidence must be inspected after execution; pending is not a pass.
  native:
  - check: Real local shell output before and after switching Workspaces, with exactly one retained PTY renderer.
      SSH/SFTP/DB/Mail/VNC/RDP require their separate service fixtures and retained lifecycle cases.
    method: automated
    reason: Runs the isolated QA application against actual Tauri IPC and native resources; browser stubs cannot
      replace this evidence.
native_platforms:
- Windows
- macOS
- Linux

id: TC-WS-NATIVE-005
title: 'AC-03/05: shared SSH identity and attached SFTP survive Workspace switches'
description: Real runner-owned SSH/SFTP endpoint. Authenticate each workspace surface, retain the first PTY output
  and remote listing, and verify a single canonical session.
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
- workspace_membership
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-test-password
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"] > button'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"][data-terminal-active="true"]'
- click: '[data-testid="terminal-pane"]'
- type: echo QA_SHARED_BEFORE
- press: Enter
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_SHARED_BEFORE\s*$
    timeout_sec: 30
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- wait_for: 'input[data-testid="sftp-remote-path"]'
- fill:
    selector: 'input[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}
- press:
    selector: 'input[data-testid="sftp-remote-path"]'
    key: Enter
- wait_for: '[data-testid="sftp-remote-pane"]'
- click: '[data-testid="workspace-surface-overview"]'
- click: '[data-testid="workspace-row-qa-workspace-remote"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"] > button'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"][data-terminal-active="true"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"] > button'
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_SHARED_BEFORE\s*$
    timeout_sec: 30
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="side-tab-sessions"]'
- fill:
    selector: '[data-testid="session-search"]'
    value: QA shared SSH
- assert_count:
    selector: '[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"]'
    equal: 1
- assert_text:
    selector: '[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"]'
    contains: Used by 2 workspaces
verification:
  review: pending
  requirements:
  - id: R1
    requirement: 'AC-03/05: shared SSH identity and attached SFTP survive Workspace switches'
    actions:
    - 4
    - 5
    - 8
    - 10
    - 11
    - 12
    - 14
    - 16
    - 18
    - 19
    - 21
    - 22
    - 23
    - 26
    - 28
    - 29
    - 32
    - 33
    checkpoints:
    - step: 13
      expectation: The retained SSH output, SFTP listing or canonical reference is observable after navigation.
    - step: 20
      expectation: The retained SSH output, SFTP listing or canonical reference is observable after navigation.
    - step: 30
      expectation: The retained SSH output, SFTP listing or canonical reference is observable after navigation.
    - step: 31
      expectation: The retained SSH output, SFTP listing or canonical reference is observable after navigation.
    - step: 34
      expectation: The retained SSH output, SFTP listing or canonical reference is observable after navigation.
    - step: 35
      expectation: The retained SSH output, SFTP listing or canonical reference is observable after navigation.
    results:
    - 13
    - 20
    - 30
    - 31
    - 34
    - 35
  visual:
  - check: Compare typography, theme tokens, Lucide icon shape, spacing and clipping with the existing shell.
    method: manual
    reason: Visual evidence must be inspected after execution; pending is not a pass.
  native:
  - check: Real SSH PTY output and attached SFTP connection remain available after switching away and back; the
      canonical session remains unique.
    method: automated
    reason: Uses the runner-owned SSH/SFTP endpoint through real native IPC.
native_platforms:
- Windows
- macOS
- Linux

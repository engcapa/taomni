id: TC-SHOT-N8
title: Native MP4 recorder preview decodes and actually plays
covers: [F27.1]
tags: [screenshot, recording, native, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario: {scenario: recorder, format: mp4}
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: mp4-recorder
    requirement: Recorder stop loads a real MP4 in the platform WebView and playback advances, then Done restores main/removes temp clip.
    actions: [1]
    checkpoints:
    - {step: 3, expectation: "Timer advances, video has loaded metadata/pixels with currentTime advancement, dimensions match decoded clip, reentry retains preview, Done closes and temp removed; actual MP4 retained."}
    results: [3]
  visual:
  - {check: Preview quality, method: external, reason: Play retained recorder-preview MP4; automated currentTime/pixels establish platform codec playback.}
  native:
  - {check: WebView MP4 support, method: automated, reason: Real WebView2/WebKitGTK/WKWebView video element must decode and play; VIDEO tag presence alone cannot pass.}

id: TC-WS-025
title: Home and Sessions editor entries belong to Workspaces
description: Home new and recent preserve the full editor and saved text, IDE tools have a separate group; context-free Tools entry opens the default workspace. Native
  uses an actual OS directory chooser and disk reread.
modes:
- browser
covers:
- F-WS-1
- F-WS-2
- F25.1
- F25.5
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-25
- click: '[data-testid="home-open-workspace"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_attribute:
    selector: '[data-testid="nav-mode-workspaces"]'
    name: aria-pressed
    equals: 'true'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
    equal: 0
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="code"]'
    equal: 1
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="code-workspace-editor"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    key: Mod+End
- type:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    text: '

      QA_HOME_ROUTE_SAVE'
- press: Mod+s
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: QA_HOME_ROUTE_SAVE
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-tool-window-rail"]').title.length > 0 &&
      parseFloat(getComputedStyle(document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-tool-window-rail"]')).borderTopWidth) >= 1
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-tool-window-rail"]').getBoundingClientRect().top -
      document.querySelector('[data-testid'+String.fromCharCode(61)+'"rail-mode-group"]').getBoundingClientRect().bottom >= 12
    expect_truthy: true
- screenshot: home-workspace-ide-group.png
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.platform_workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: QA_HOME_ROUTE_SAVE
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="code"]'
    equal: 1
- click: '[data-testid="side-tab-sessions"]'
- assert_not_visible: '[data-testid="code-workspace-tab"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
    equal: 0
- assert_not_visible: '[data-testid="nav-mode-agents"]'
- assert_visible: '[data-testid="rail-chat-button"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_attribute:
    selector: '[data-testid="nav-mode-workspaces"]'
    name: aria-pressed
    equals: 'true'
- assert_visible: '[data-testid="expanded-sidebar-panel"]'
- wait_for: '[data-testid="workspace-switcher"]'
- assert_visible: '[data-testid="workspace-default-badge"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
    equal: 0
- screenshot: sessions-code-entry-default-workspace.png
- click: '[data-testid="titlebar-actions-more"]'
- assert_text_equals:
    selector: '[data-testid="workspace-toolbar-bottom-dock"]'
    equals: Show/hide workspace bottom dock
- assert_count:
    selector: '[data-testid="platform-toolbar-actions"] [data-testid="workspace-toolbar-bottom-dock"]'
    equal: 0
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home new/recent opens the same full editor inside Workspaces, save survives re-entry, Sessions contains no code tabs, and context-free Code Editor routes
      to the default workspace. IDE tools are separated by at least 12px with a divider and tooltip.
    actions:
    - 3
    - 5
    - 6
    - 14
    - 15
    - 16
    - 17
    - 22
    - 23
    - 24
    - 28
    - 33
    - 34
    - 42
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"nav-mode-workspaces\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 9
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"code-workspace\"]", "equal": 0}}'
    - step: 10
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-tab\"][data-tab-kind=\"code\"]", "equal": 1}}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor\"]"}'
    - step: 18
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"]", "contains": "QA_HOME_ROUTE_SAVE"}}'
    - step: 19
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-tool-window-rail\"]'').title.length > 0 &&
        parseFloat(getComputedStyle(document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-tool-window-rail\"]'')).borderTopWidth) >= 1", "expect_truthy":
        true}}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-tool-window-rail\"]'').getBoundingClientRect().top
        - document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"rail-mode-group\"]'').getBoundingClientRect().bottom >= 12", "expect_truthy": true}}'
    - step: 25
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 26
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"]", "contains": "QA_HOME_ROUTE_SAVE"}}'
    - step: 27
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-tab\"][data-tab-kind=\"code\"]", "equal": 1}}'
    - step: 29
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 30
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"code-workspace\"]", "equal": 0}}'
    - step: 31
      expectation: '{"assert_not_visible": "[data-testid=\"nav-mode-agents\"]"}'
    - step: 32
      expectation: '{"assert_visible": "[data-testid=\"rail-chat-button\"]"}'
    - step: 35
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 36
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"nav-mode-workspaces\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 37
      expectation: '{"assert_visible": "[data-testid=\"expanded-sidebar-panel\"]"}'
    - step: 38
      expectation: '{"wait_for": "[data-testid=\"workspace-switcher\"]"}'
    - step: 39
      expectation: '{"assert_visible": "[data-testid=\"workspace-default-badge\"]"}'
    - step: 40
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"code-workspace\"]", "equal": 0}}'
    - step: 44
      expectation: '{"assert_count": {"selector": "[data-testid=\"platform-toolbar-actions\"] [data-testid=\"workspace-toolbar-bottom-dock\"]", "equal": 0}}'
    results:
    - 4
    - 7
    - 8
    - 9
    - 10
    - 11
    - 13
    - 18
    - 19
    - 20
    - 25
    - 26
    - 27
    - 29
    - 30
    - 31
    - 32
    - 35
    - 36
    - 37
    - 38
    - 39
    - 40
    - 44
  visual:
  - check: Compact controls retain readable icons and active states without toolbar overlap.
    method: manual
    reason: Inspect the retained screenshots; functional assertions do not establish visual matching.
  native:
  - check: Renderer workflow; real OS boundaries are verified by the corresponding native workspace cases.
    method: external
    reason: Browser preview uses platform stubs and does not claim native process, disk, picker or clipboard evidence.

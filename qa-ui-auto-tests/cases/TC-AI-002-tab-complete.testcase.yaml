id: TC-AI-002
title: Tab completion settings expose three-source picker + Ctrl+K rewrite
description: 'F-AI-2.2 input assistance UI: settings panel offers history / +path / +path+ai

  radios, plus the "Enable AI command rewrite (Ctrl+K)" toggle and shortcut

  field. Confirms each radio is selectable (interactive coverage), that

  +path+ai persists, and that the Ctrl+K shortcut field is editable when

  the toggle is on.

  '
covers:
- F-AI-2.2
- F1.3
tags:
- ai
- ghost-text
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="ribbon-settings"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-group-toggle-terminal"]'
- click: '[data-testid="settings-group-toggle-terminal"]'
- wait_for: '[data-testid="settings-panel"] >> text=Inline command suggestions'
- assert_visible: input[name="inlineSuggestionsSource"][value="history"]
- assert_visible: input[name="inlineSuggestionsSource"][value="history+path"]
- assert_visible: input[name="inlineSuggestionsSource"][value="history+path+ai"]
- click: input[name="inlineSuggestionsSource"][value="history"]
- click: input[name="inlineSuggestionsSource"][value="history+path"]
- click: input[name="inlineSuggestionsSource"][value="history+path+ai"]
- click: '[data-testid="ai-command-rewrite-toggle"]'
- assert_visible: input[aria-label="AI command rewrite shortcut"]
- fill:
    selector: input[aria-label="AI command rewrite shortcut"]
    value: Control+K
- screenshot: ai-002-tab-complete-settings.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tab completion settings expose three-source picker + Ctrl+K rewrite：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 10
    - 11
    - 12
    - 13
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"ribbon-settings\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"settings-group-toggle-terminal\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"] >> text=Inline command suggestions"}'
    - step: 7
      expectation: '{"assert_visible": "input[name=\"inlineSuggestionsSource\"][value=\"history\"]"}'
    - step: 8
      expectation: '{"assert_visible": "input[name=\"inlineSuggestionsSource\"][value=\"history+path\"]"}'
    - step: 9
      expectation: '{"assert_visible": "input[name=\"inlineSuggestionsSource\"][value=\"history+path+ai\"]"}'
    - step: 14
      expectation: '{"assert_visible": "input[aria-label=\"AI command rewrite shortcut\"]"}'
    results:
    - 14
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

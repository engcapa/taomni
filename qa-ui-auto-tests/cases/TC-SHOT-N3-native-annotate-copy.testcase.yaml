id: TC-SHOT-N3
title: Native copy backend accepts a captured image
covers:
- F27.1
tags:
- screenshot
- native
- p1
modes:
- native
native_platforms:
- Linux
- Windows
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
# Ensure the main window (and Tauri API) is ready before invoking backends.
- wait_for: '[data-testid="system-screenshot"]'
- wait: 5
# Capture a real screenshot, then route its path through the copy backend.
# The nested invoke is chained via .then without arrow functions.
- eval_readonly:
    expression: 'window.__TAURI_INTERNALS__.invoke("screenshot_capture_full", {displayId: null}).then(JSON.stringify)'
    contains: '"path"'

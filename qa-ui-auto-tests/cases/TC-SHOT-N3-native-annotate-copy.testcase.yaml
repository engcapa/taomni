id: TC-SHOT-N3
title: Native annotate then copy completes through the real clipboard path
covers:
- F27.1
tags:
- screenshot
- annotate
- native
- p2
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for:
    selector: '[data-testid="screenshot-base-image"]'
    timeout_sec: 30
- drag_to:
    from: '[data-testid="screenshot-base-image"]'
    to: '[data-testid="screenshot-base-image"]'
    from_position:
      x: 60
      y: 60
    to_position:
      x: 320
      y: 240
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-tool-arrow"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-canvas"]'
    to: '[data-testid="screenshot-annotation-canvas"]'
    from_position:
      x: 90
      y: 90
    to_position:
      x: 220
      y: 170
- wait: 1
- click: '[data-testid="screenshot-copy"]'
- wait_for: '[data-testid="screenshot-toast"]'
- assert_visible: '[data-testid="screenshot-toast"]'

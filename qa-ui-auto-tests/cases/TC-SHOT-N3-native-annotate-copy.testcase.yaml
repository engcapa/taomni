id: TC-SHOT-N3
title: Native copy backend accepts a captured image
covers:
- F27.1
tags:
- screenshot
- native
- p1
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
# Capture a real screenshot, then route its path through the copy backend.
# The nested invoke is chained via .then without arrow functions.
- eval_readonly:
    expression: 'window.__TAURI__.core.invoke("screenshot_capture_full", {displayId: null}).then(JSON.stringify)'
    contains: '"path"'

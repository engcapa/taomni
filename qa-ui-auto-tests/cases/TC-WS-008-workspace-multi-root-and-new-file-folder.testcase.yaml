id: TC-WS-008
title: Workspace multi-root management with new file and new folder creation
description: The shared Project explorer creates a file and a directory under the selected folder, retains root context actions, and adds/removes a second
  root through the workspace menu. Native validates the created paths through the Project explorer real filesystem listing.
modes:
- browser
- native
covers:
- F25.1
- F-WS-2
tags:
- smoke
- p0
- workspace-redesign
- files
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-008
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default Workspace (默认工作区)","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"qa-root","path":"${fixture.platform_workspace_root}","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-tree-root"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- click: '[data-testid="code-workspace-tree-new"]'
- wait_for: '[data-testid="code-workspace-tree-new-file"]'
- assert_enabled: '[data-testid="code-workspace-tree-new-directory"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: hello-workspace.ts
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="workspace-file-editor"][data-path="hello-workspace.ts"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="hello-workspace.ts"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="src"] [data-testid="code-workspace-tree-dir-arrow"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="src"]'
- click: '[data-testid="code-workspace-tree-new"]'
- click: '[data-testid="code-workspace-tree-new-directory"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: generated
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="src/generated"]'
- right_click: '[data-testid="code-workspace-tree-root"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="code-workspace-tree-new-file"]'
- assert_visible: '[data-testid="code-workspace-tree-new-directory"]'
- assert_visible: '[data-testid="code-workspace-tree-remove-root"]'
- press: Escape
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- wait_for: '[data-testid="workspace-fs-modal"][data-kind="root"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}/src/generated
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for:
    selector: '[data-testid="workspace-fs-modal"]'
    state: hidden
    timeout_sec: 10
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 2
- right_click: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/src/generated"]'
- click: '[data-testid="code-workspace-tree-remove-root"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/src/generated"]'
    state: detached
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 1
- assert_visible: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}"]'
- screenshot: ws-008-workspace-new-file-folder.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 共享 Project 树的新建菜单提供文件和目录操作，创建并打开文件，树同步显示。
    actions:
    - 10
    - 12
    - 15
    - 17
    - 18
    results:
    - 9
    - 11
    - 13
    - 14
    - 16
    - 19
    - 20
    checkpoints:
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"README.md\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-new-file\"]"}'
    - step: 14
      expectation: '{"assert_enabled": "[data-testid=\"code-workspace-tree-new-directory\"]"}'
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"workspace-file-editor\"][data-path=\"hello-workspace.ts\"]"}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"hello-workspace.ts\"]"}'
  - id: R2
    requirement: 在选中 src 目录内创建 generated 子目录；真实 Project 树同步列出创建结果。
    actions:
    - 21
    - 22
    - 23
    - 24
    - 25
    - 26
    results:
    - 27
    checkpoints:
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-dir\"][data-path=\"src/generated\"]"}'
  - id: R3
    requirement: 根目录右键保留新建和移除操作，工作区菜单添加第二个根，移除后保留原始根。
    actions:
    - 28
    - 33
    - 34
    - 35
    - 37
    - 38
    - 41
    - 42
    - 44
    results:
    - 29
    - 30
    - 31
    - 32
    - 36
    - 39
    - 40
    - 43
    - 45
    - 46
    - 47
    checkpoints:
    - step: 29
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 30
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-new-file\"]"}'
    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-new-directory\"]"}'
    - step: 32
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-remove-root\"]"}'
    - step: 36
      expectation: '{"wait_for": "[data-testid=\"workspace-fs-modal\"][data-kind=\"root\"]"}'
    - step: 39
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-fs-modal\"]", "state": "hidden", "timeout_sec": 10}}'
    - step: 40
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 2}}'
    - step: 43
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 45
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-root\"][data-root-path=\"${fixture.platform_workspace_root}/src/generated\"]",
        "state": "detached"}}'
    - step: 46
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 1}}'
    - step: 47
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-root\"][data-root-path=\"${fixture.platform_workspace_root}\"]"}'
  visual:
  - check: 多根文件树与新建入口在左栏紧凑对齐，创建后无重复节点。
    method: manual
    reason: 树层级与多根标记需要截图评审。
  native:
  - check: 真实磁盘目录下的新建文件/目录与多根挂载生效。
    method: automated
    reason: platform_workspace_root 在 native 创建真实宿主目录。

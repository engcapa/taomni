- click: '[data-testid="transfer-job"][data-remote-path$="/upload 中文.bin"] [data-testid="transfer-job-pause"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-remote-path$="/upload 中文.bin"][data-state="paused"]'
    timeout_sec: 15
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: stable
    full_size: 16777216
- close_window: null
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-cancel"]'
- native_app_process:
    state: running
- assert_native_window_count:
    equal: 2
- mysql_assert_rows:
    query: SELECT id, v FROM qa_shell_tx ORDER BY id
    equals:
    - - 1
      - before
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: stable
    full_size: 16777216
- switch_window:
    route: '#notes='
- assert_value:
    selector: '[data-testid="note-editor-body"]'
    equals: 'Exit cancellation retains this note

      中文全文'
- switch_window:
    route: ''
- click: '[data-testid="app-main-menu"]'
- click: '[data-testid="context-menu-item-exit"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- assert_count:

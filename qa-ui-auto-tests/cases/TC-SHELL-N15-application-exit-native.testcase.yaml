- assert_count:
    selector: '[data-testid="shell-close-risk"][data-risk-kind="job"]'
    equal: 1
- assert_not_visible: '[data-testid="shell-close-background"]'
- click: '[data-testid="shell-close-cancel"]'
- native_app_process:
    state: running
- mysql_assert_rows:
    query: SELECT id, v FROM qa_shell_tx ORDER BY id
    equals:
    - - 1
      - before
- click: '[data-testid="shell-quick-switch"]'
- fill:
    selector: '[data-testid="shell-quick-input"]'
    value: qa-db-tx2
- click: '[data-testid="shell-quick-option"]'
- wait_for: '[data-testid="db-tx-pending"]'
- assert_text:
    selector: '[data-testid="db-tx-pending"]'

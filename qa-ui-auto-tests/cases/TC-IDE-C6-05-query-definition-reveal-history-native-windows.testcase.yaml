id: TC-IDE-C6-05-query-definition-reveal-history-native-windows
title: "Definition reveal and history back over real JDT LS in packaged Windows app"
description: |
  Windows native variant of the ED-QUERY-004 A1 gate. Enters the in-repo
  single-module Maven sample through persisted recents, waits for the real
  JDT LS provider, places the caret on `App` in AppTest.java, fires F12 through
  the production keymap, and proves cross-file open/reveal plus navigation
  history back. The native_keys step uses the packaged WebDriver transport,
  which is the supported Windows equivalent of the Linux/X11 transport.
  Highest claim on green: L2 provider-backed (Windows).
covers: [F25.5]
tags: [code-workspace, ide-c6, query, declaration, native-gate, windows, p1]
modes: [native]
native_platforms: [Windows]
fixtures: [reset_db, java_sample_projects]
timeout_sec: 600
steps:
  - open: "${cfg.app.base_url}"
  - vault_first_run: "qa-native-gate-password"
  - wait_for: '[data-testid="welcome-panel"]'
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-q4","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/test/java/com/example/single/AppTest.java"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for:
      selector: '[data-testid="code-workspace-editor-pane"]'
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "appHasMain"
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="code-workspace-lsp-status-pill"]'
      contains: "Java"
      timeout_sec: 60
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: ["Control+Home"]
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: ["ArrowDown", "ArrowDown", "ArrowDown", "ArrowDown", "ArrowDown", "ArrowDown", "ArrowDown", "ArrowDown", "ArrowDown"]
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: ["Home"]
  - native_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      transport: webdriver
      keys: ["ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight", "ArrowRight"]
  - press: "F12"
  - assert_text:
      selector: '[data-testid="code-workspace-editor-tab-strip"]'
      contains: "App.java"
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "public static void main"
      timeout_sec: 60
  - assert_text:
      selector: '[data-testid="code-workspace-breadcrumbs"]'
      contains: "App.java"
      timeout_sec: 30
  - click: '[data-testid="code-workspace-nav-back"]'
  - assert_text:
      selector: '[data-testid="code-workspace-editor-tab-strip"]'
      contains: "AppTest.java"
      timeout_sec: 30
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "appHasMain"
      timeout_sec: 30
  - screenshot: tc-ide-c6-05-definition-reveal-history-windows.png

id: TC-SHELL-B20
title: Git opens in the bottom Host and keeps two distinct repository rows
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b20.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F25.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - ''
- click: '[data-testid="code-workspace-git-panel-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-edge
    equals: bottom
- wait_for: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- assert_items:
    selector: '[data-testid="workspace-change-row"]'
    attribute: aria-label
    equals:
    - repo-a same.txt Staged
    - repo-a untracked.txt Untracked
    - repo-b same.txt Modified
- fill:
    selector: textarea[placeholder="Commit message"]:visible
    value: SHELL-GIT-DRAFT
- click: '[data-testid="shell-host-hide"]'
- assert_not_visible: '[data-testid="shell-host"]'
- click: '[data-testid="code-workspace-git-panel-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- assert_value:
    selector: textarea[placeholder="Commit message"]:visible
    equals: SHELL-GIT-DRAFT
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 2
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="git"]'
    equal: 0
- screenshot: tc-shell-b20.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home opens the fixture workspace with the complete file buffer.
    actions:
    - 3
    - 4
    checkpoints:
    - step: 5
      expectation: Home opens the fixture workspace with the complete file buffer.
    - step: 6
      expectation: Home opens the fixture workspace with the complete file buffer.
    results:
    - 5
    - 6
  - id: R2
    requirement: Opening Git reads the complete multiroot change list in one bottom
      Host.
    actions:
    - 7
    checkpoints:
    - step: 8
      expectation: Opening Git reads the complete multiroot change list in one bottom
        Host.
    - step: 9
      expectation: Opening Git reads the complete multiroot change list in one bottom
        Host.
    - step: 10
      expectation: Opening Git reads the complete multiroot change list in one bottom
        Host.
    - step: 11
      expectation: Opening Git reads the complete multiroot change list in one bottom
        Host.
    results:
    - 8
    - 9
    - 10
    - 11
  - id: R3
    requirement: Hiding Git and reopening preserves its complete draft without creating
      a primary Git tab.
    actions:
    - 12
    - 13
    - 15
    - 18
    checkpoints:
    - step: 14
      expectation: Hiding Git and reopening preserves its complete draft without creating
        a primary Git tab.
    - step: 16
      expectation: Hiding Git and reopening preserves its complete draft without creating
        a primary Git tab.
    - step: 17
      expectation: Hiding Git and reopening preserves its complete draft without creating
        a primary Git tab.
    - step: 19
      expectation: Hiding Git and reopening preserves its complete draft without creating
        a primary Git tab.
    - step: 20
      expectation: Hiding Git and reopening preserves its complete draft without creating
        a primary Git tab.
    results:
    - 14
    - 16
    - 17
    - 19
    - 20
  visual:
  - check: Inspect the final screenshot for readable controls, clipping and overlay
      placement.
    method: manual
    reason: Screenshots require a visual verdict; geometry assertions are recorded
      separately.
  native:
  - check: Tauri, OS window, physical input and real service effects
    method: not-applicable
    reason: This case is browser renderer coverage; paired TC-SHELL-N cases cover
      native boundaries.

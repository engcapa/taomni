id: TC-SHELL-B42
title: Restore identities remain independent; missing recent-panel owners require explicit rebinding
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b42.
  Browser IPC fixtures prove renderer outcomes only. Classification now uses dock/Actions; Project uses the unified
  Workspaces entry. Existing workspace content, shortcut and state assertions remain.'
covers:
- F1.6
- F25.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
- parity008_git
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.shellLayout.v2
    value: '{"version": 2, "restoreSources": {"workspace:restore-A": {"kind": "workspace", "workspaceInstanceId":
      "restore-A", "workspace": {"repoRoot": "/preview/parity008", "workspaceId": "same-directory", "name": "同路径甲",
      "roots": [{"id": "root-restore-A", "name": "parity008", "path": "/preview/parity008", "kind": "folder"}],
      "looseFiles": [], "initialFile": {"kind": "root", "rootId": "root-restore-A", "path": "repo-a/same.txt"}}},
      "workspace:restore-B": {"kind": "workspace", "workspaceInstanceId": "restore-B", "workspace": {"repoRoot":
      "/preview/parity008", "workspaceId": "same-directory", "name": "同路径乙", "roots": [{"id": "root-restore-B",
      "name": "parity008", "path": "/preview/parity008", "kind": "folder"}], "looseFiles": [], "initialFile": {"kind":
      "root", "rootId": "root-restore-B", "path": "repo-a/same.txt"}}}}, "restoredTabs": {"workspace:restore-A":
      {"pinned": true, "order": 1, "laneOverride": "connect"}, "workspace:restore-B": {"pinned": false, "order":
      0}}, "panelOverrides": {"workspace:restore-A:git": {"edge": "right", "size": 350, "pinned": true}, "workspace:restore-B:git":
      {"edge": "bottom", "size": 280, "pinned": true}}, "lastActiveRestoreRef": "workspace:restore-A", "recentPanels":
      [{"kind": "git", "restoreRef": "workspace:restore-A", "preferredPlacement": "detached", "lastUsedAt": 1},
      {"kind": "sftp", "restoreRef": "run-entry:saved:deleted-owner", "preferredPlacement": "dock", "lastUsedAt":
      0}]}'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 0
- shell_backend_scenario:
    action: hold
    command: workspace_list_dir
    owner: /preview/parity008
    once: true
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for: '[data-testid="shell-restore-entry"][data-entry-id="workspace:restore-A"][data-status="ready"]'
- assert_count:

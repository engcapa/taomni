id: TC-WS-NATIVE-003
title: 'AC-01/09/12: packaged WebView rail, command shortcut and scoped Files remain usable'
description: Packaged WebView2/WKWebView/WebKitGTK and real workspace filesystem IPC. Shortcuts use WebDriver key
  delivery; this does not claim OS-global hotkey evidence.
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- native
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-test-password
- wait_for: '[data-testid="workspace-navigator"]'
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- assert_count:
    selector: '[data-testid="control-bar"] [data-testid="tab-bar"]'
    equal: 0
- click: '[data-testid="workspace-surface-files"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="workspace-surface-overview"]'
- click: '[data-testid="workspace-hide"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- assert_element_geometry:
    selector: '[data-testid="workspace-canvas"]'
    min_width: 180
    min_height: 100
- click: '[data-testid="side-tab-work"]'
- wait_for: '[data-testid="workspace-navigator"]'
- press: Control+k
- wait_for: '[data-testid="command-center"]'
- fill:
    selector: '[data-testid="command-center-search"]'
    value: QA Remote
- click: '[data-testid="command-center"] button'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: QA Remote
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-surface-files"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- screenshot: native-workspace-shell.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: 'AC-01/09/12: packaged WebView rail, command shortcut and scoped Files remain usable'
    actions:
    - 5
    - 7
    - 9
    - 10
    - 13
    - 15
    - 17
    - 18
    - 20
    - 21
    checkpoints:
    - step: 6
      expectation: '{''assert_count'': {''selector'': ''[data-testid="control-bar"] [data-testid="tab-bar"]'', ''equal'':
        0}}'
    - step: 12
      expectation: '{''assert_element_geometry'': {''selector'': ''[data-testid="workspace-canvas"]'', ''min_width'':
        180, ''min_height'': 100}}'
    - step: 19
      expectation: '{''assert_text'': {''selector'': ''[data-testid="workspace-header"]'', ''contains'': ''QA Remote''}}'
    - step: 22
      expectation: Returning to QA Main reopens the existing Files renderer without a blank canvas.
    results:
    - 6
    - 12
    - 19
    - 22
  visual:
  - check: Compare typography, theme tokens, Lucide icon shape, spacing and clipping with the existing shell.
    method: manual
    reason: Visual evidence must be inspected after execution; pending is not a pass.
  native:
  - check: Packaged WebView2/WKWebView/WebKitGTK and real workspace filesystem IPC. Shortcuts use WebDriver key
      delivery; this does not claim OS-global hotkey evidence.
    method: automated
    reason: Runs the isolated QA application against actual Tauri IPC and native resources; browser stubs cannot
      replace this evidence.
native_platforms:
- Windows
- macOS
- Linux


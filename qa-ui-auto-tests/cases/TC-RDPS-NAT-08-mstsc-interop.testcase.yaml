id: TC-RDPS-NAT-08-mstsc-interop
title: Windows mstsc renders bulk-compressed Taomni desktop with clipboard, audio and dynamic channels
description: 'AC-E06/V-E13: launch the Windows native reference client against Taomni. A known magenta/cyan target
  must appear inside the mstsc window; save its screenshot and server negotiation/encoding/lifecycle log. Credentials
  and owned processes are removed on failure and teardown.'
covers:
- F-RdpServer-1
tags:
- rdp
- rdp-server
- interop
- audio
- p1
modes:
- native
native_platforms:
- Windows
fixtures:
- reset_db
- rdp_server_required
- system_rdp_running
- rdp_audio_required
timeout_sec: 480
steps:
- open_route: ?servers=main
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 30
- click: '[data-testid="server-row-rdp"]'
- fill:
    selector: '[data-testid="server-field-port"]'
    value: ${env.QA_RDP_PORT}
- fill:
    selector: '[data-testid="server-field-bind-address"]'
    value: 127.0.0.1
- set_check:
    selector: '[data-testid="server-field-auto-stop"]'
    checked: false
- fill:
    selector: '[data-testid="rdp-field-username"]'
    value: ${env.QA_RDP_USER}
- fill:
    selector: '[data-testid="rdp-field-password"]'
    value: ${env.QA_RDP_PASSWORD}
- set_check:
    selector: '[data-testid="rdp-field-control-approval"]'
    checked: false
- click: '[data-testid="server-row-rdp-start"]'
- platform_choice:
    platforms:
    - Windows
    dialog: '[data-testid="choice-dialog"]'
    click: '[data-testid="choice-dialog-secondary"]'
- wait_for:
    selector: '[data-testid="vault-setup-dialog"]'
    timeout_sec: 30
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: ${env.QA_VAULT_PASSWORD}
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: ${env.QA_VAULT_PASSWORD}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="running"]'
    timeout_sec: 90
- rdp_probe:
    scenario: host-play
    artifact: mstsc-tone
    background: tone
    args:
      freq: 880
      seconds: 40
- host_mstsc:
    action: start
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: clipboard channel ready
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: 'RDP audio: streaming'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: drdynvc channel negotiated
    timeout_sec: 30
- host_helper:
    action: start
    name: target
    mode: flip
    pattern: true
    geometry: 480x320+40+80
- host_helper:
    action: start
    name: animation
    mode: animate
    geometry: 640x360+40+450
- assert_pattern:
    selector: '[data-testid="server-log"]'
    regex: encode=planar:[1-9]
    timeout_sec: 60
- host_mstsc:
    action: capture
    snapshot: mstsc-window.png
    expect_pattern: true
- host_mstsc:
    action: stop
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: disconnected after
    timeout_sec: 30
- save_text:
    selector: '[data-testid="server-log"]'
    path: server-log.txt
- host_helper:
    action: stop
    name: animation
- host_helper:
    action: stop
    name: target
- rdp_probe_wait:
    name: tone
    timeout_sec: 60
    expect:
      freq: 880
- click: '[data-testid="server-row-rdp-stop"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="stopped"]'
    timeout_sec: 30
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: mstsc negotiates clipboard, audio and drdynvc and renders the compressed desktop.
    actions:
    - 17
    - 18
    - 22
    - 23
    checkpoints:
    - step: 19
      expectation: Clipboard handshake completed.
    - step: 20
      expectation: Real host sound is streamed.
    - step: 21
      expectation: The client's actual static channel join includes drdynvc.
    - step: 24
      expectation: At least one planar rectangle is sent.
    - step: 25
      expectation: PrintWindow captures the owned mstsc client window and finds both known remote target colors.
    results:
    - 19
    - 20
    - 21
    - 24
    - 25
  - id: R2
    requirement: Disconnect returns the server to waiting and clears disposable credentials.
    actions:
    - 26
    checkpoints:
    - step: 27
      expectation: The server reports the client disconnected.
    - step: 33
      expectation: The server stops cleanly after the reference session.
    results:
    - 27
    - 33
  native:
  - check: Actual mstsc.exe on Windows, host audio and RDP static/dynamic negotiation.
    method: automated
    reason: Requires the real RDP transport, decoder and hosted desktop; browser stubs cannot establish this.
  visual:
  - check: Decoded pixels are checked against known target colors and retained as JSON/screenshots.
    method: automated
    reason: Known content provides an independent rendering oracle.

id: TC-TAOFFICE-011
title: Preview and extract a solid LZMA2 7z archive in Explorer
description: Check both files in a solid block on disk, open one in the shared read-only preview, and retain the original archive.
modes: [native]
covers: [F-FILEOPEN-1]
tags: [p0, file-open, taoffice, archive, core-only]
fixtures: [reset_db, file_open_files]
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- dblclick: '[data-testid="explorer-file-row"][data-name="records.7Z"]'
- wait_for: '[data-testid="archive-entry"][data-name="images/pixel.png"]'
- assert_count: {selector: '[data-testid="archive-entry"]', equal: 2}
- press: {selector: '[data-testid="archive-extract-here"]', key: Enter}
- wait_for: '[data-testid="archive-output"]'
- assert_file_open_bytes: {path: '${fixture.file_open_root}/records/notes/readme.txt', sha256: '${fixture.file_open_original_sha}'}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/records/images/pixel.png', sha256: '${fixture.file_open_png_sha}'}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/records.7Z', sha256: '${fixture.taoffice_7z_sha}'}
- press: {selector: '[data-testid="archive-entry"][data-name="notes/readme.txt"] [data-testid="archive-preview"]', key: Enter}
- wait_for: '[data-testid="file-viewer"][data-kind="text"][data-active="true"] [data-testid="viewer-readonly"]'
- assert_file_open_bytes: {selector: '[data-testid="file-viewer"][data-kind="text"][data-active="true"]', sha256: '${fixture.file_open_original_sha}'}
- assert_no_runtime_errors: null

id: TC-PATH-LOCAL-01
title: Local browser address dropdown, Tab completion, selection, cancellation and retained navigation
description: Use a File session created through the editor. Browser seeds an isolated IndexedDB VFS; native seeds real host
  directories (including Windows drive paths), spaces and Unicode. Assert exact directory candidates, excluded files, common-prefix/unique/nested
  completion, focus, mouse and keyboard selection, Escape, blur, relative paths and history. Native must obtain the candidates
  and nested marker listings through real local filesystem IPC.
covers:
- F7.2
- F7.5
tags:
- p1
- path-completion
- filebrowser
modes:
- browser
- native
fixtures:
- reset_db
- path_completion
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="session-new"]'
    timeout_sec: 60
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-file"]'
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-path-completion-local
- fill:
    selector: '[data-testid="session-file-target"]'
    value: ${fixture.path_completion_root}
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-path-completion-local"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-path-completion-local"]'
- wait_for: '[data-testid="tab-item"][data-tab-type="file-browser"]'
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: project-alpha
- click: '[data-testid="sftp-local-path-edit"]'
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.path_completion_root}/pro
- assert_items:
    selector: '[data-testid="sftp-local-path-suggestions"] [role="option"]'
    attribute: data-path
    equals:
    - ${fixture.path_completion_root}/project-alpha/
    - ${fixture.path_completion_root}/project-beta/
- screenshot: local-folder-suggestions.png
- press:

- click: '[data-testid="workspace-preview-load"]'
- assert_visible: '[data-testid="workspace-preview"] [role="alert"]'
- fill:
    selector: '[data-testid="workspace-preview-path"]'
    value: README.md
- click: '[data-testid="workspace-preview-load"]'
- assert_text:

    contains: QA workspace preview
- click: '[data-testid="workspace-context-toggle"]'
- assert_visible: '[data-testid="workspace-context-pane"]'
- click: '[data-testid="workspace-context-close"]'
- assert_not_visible: '[data-testid="workspace-context-pane"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute("data-testid") === "workspace-context-toggle"
    expect_truthy: true
- click: '[data-testid="workspace-surface-overview"]'
- assert_attribute:
    selector: '[data-testid="workspace-surface-overview"]'
    name: aria-selected
    equals: 'true'

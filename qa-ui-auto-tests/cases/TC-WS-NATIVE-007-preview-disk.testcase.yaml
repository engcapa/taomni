id: TC-WS-NATIVE-007
title: 'AC-05/09: native Preview reads disk, recovers from missing files and restores context focus'
description: Uses the isolated project on real disk through Tauri IPC, including Markdown rendering and missing-file
  recovery.
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- native
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-test-password
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-surface-preview"]'
- fill:
    selector: '[data-testid="workspace-preview-path"]'

id: TC-IDE-C2-08-completion-source-lifecycle
title: Completion source lifecycle, stability, and cancellation
description: 'Browser verification for completion cancellation via Escape, popup dismissal upon

  typing comment/non-prefix text, and reliably re-triggering completion on a new line.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c2
- completion
- lifecycle
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: App.java
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- type: sout
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 10
- press: Escape
- wait: 0.5
- eval_readonly:
    expression: document.querySelector(".cm-tooltip-autocomplete") === null
    expect_truthy: true
- type: ' // cancelled'
- wait: 0.5
- eval_readonly:
    expression: document.querySelector(".cm-tooltip-autocomplete") === null
    expect_truthy: true
- press: Enter
- type: sout
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 10
- wait: 0.5
- press: ArrowDown
- assert_text:
    selector: .cm-tooltip-autocomplete [aria-selected="true"]
    contains: soutm
- press: Enter
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: System.out.println(
- press: Control+z
- screenshot: tc-ide-c2-08-lifecycle.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Completion source lifecycle, stability, and cancellation：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 10
    - 12
    - 13
    - 15
    - 16
    - 18
    - 21
    - 24
    - 25
    - 28
    - 30
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor\"] .cm-content[data-language=\"java\"]"}'
    - step: 17
      expectation: '{"wait_for": {"selector": ".cm-tooltip-autocomplete li", "timeout_sec": 10}}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\".cm-tooltip-autocomplete\") === null",
        "expect_truthy": true}}'
    - step: 23
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\".cm-tooltip-autocomplete\") === null",
        "expect_truthy": true}}'
    - step: 26
      expectation: '{"wait_for": {"selector": ".cm-tooltip-autocomplete li", "timeout_sec": 10}}'
    - step: 29
      expectation: '{"assert_text": {"selector": ".cm-tooltip-autocomplete [aria-selected=\"true\"]", "contains":
        "soutm"}}'
    - step: 31
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content", "contains":
        "System.out.println("}}'
    results:
    - 31
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

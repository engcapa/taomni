id: TC-IDE-C2-08-completion-source-lifecycle
title: "Completion source lifecycle, stability, and cancellation"
description: |
  Browser verification for completion cancellation via Escape, popup dismissal upon
  typing comment/non-prefix text, and reliably re-triggering completion on a new line.
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, lifecycle, browser-gate, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 180
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - click: '[data-testid="code-workspace-tree-new-file"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - fill:
      selector: '[data-testid="text-input-dialog"] input'
      value: "App.java"
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete li'
      timeout_sec: 10
  - press: "Escape"
  - wait: 0.5
  - eval_readonly:
      expression: 'document.querySelector(".cm-tooltip-autocomplete") === null'
      expect_truthy: true
  - type: " // cancelled"
  - wait: 0.5
  - eval_readonly:
      expression: 'document.querySelector(".cm-tooltip-autocomplete") === null'
      expect_truthy: true
  - press: "Enter"
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete li'
      timeout_sec: 10
  - wait: 0.5
  - press: "ArrowDown"
  - assert_text:
      selector: '.cm-tooltip-autocomplete [aria-selected="true"]'
      contains: "soutm"
  - press: "Enter"
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: "System.out.println("
  - press: "Control+z"
  - screenshot: tc-ide-c2-08-lifecycle.png

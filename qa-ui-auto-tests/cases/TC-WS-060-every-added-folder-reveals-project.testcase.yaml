id: TC-WS-060
title: Every successful Add Folder reveals Project and expands the selected root
description: Add first, second and third real/VFS roots while Project is collapsed or Sessions is selected. Cancellation and passive mode switching preserve
  collapse; explicitly reopening an existing root reveals it without duplicates.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_explorer
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-folder-reveal
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- assert_visible: '[data-testid="code-workspace-tree-dir"][data-path="Documents"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_not_visible: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}/Documents
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/Documents"][aria-expanded="true"]'
- assert_visible: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 2
- click: '[data-testid="code-workspace-tool-rail-sessions"]'
- assert_not_visible: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}/Pictures
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/Pictures"][aria-expanded="true"]'
- assert_visible: '[data-testid="code-workspace-tree-file"][data-path="logo.svg"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 3
- click: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/Documents"] [data-testid="code-workspace-tree-root-arrow"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/Documents"]'
    name: aria-expanded
    equals: 'false'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_not_visible: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- click: '[data-testid="workspace-fs-modal-cancel"]'
- assert_not_visible: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="nav-mode-workspaces"]'
- assert_not_visible: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}/Documents
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"][data-root-path="${fixture.platform_workspace_root}/Documents"][aria-expanded="true"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 3
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- assert_no_runtime_errors: null
- screenshot: workspace-every-added-folder-revealed.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Every explicit successful Add Folder, including an existing root, reveals the active workspace Project tree with the new root expanded.
      Cancellation and passive Home/Workspaces navigation preserve the prior collapse, no root or editor runtime is duplicated.
    actions:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 10
    - 12
    - 13
    - 14
    - 15
    - 19
    - 21
    - 22
    - 23
    - 24
    - 28
    - 30
    - 32
    - 33
    - 34
    - 36
    - 37
    - 39
    - 40
    - 41
    - 42
    results:
    - 9
    - 11
    - 17
    - 18
    - 20
    - 26
    - 27
    - 29
    - 31
    - 35
    - 38
    - 45
    - 46
    - 47
    checkpoints:
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-dir\"][data-path=\"Documents\"]"}'
    - step: 11
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree\"]"}'
    - step: 17
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-file\"][data-path=\"notes.txt\"]"}'
    - step: 18
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 2}}'
    - step: 20
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree\"]"}'
    - step: 26
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-file\"][data-path=\"logo.svg\"]"}'
    - step: 27
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 3}}'
    - step: 29
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tree-root\"][data-root-path=\"${fixture.platform_workspace_root}/Documents\"]",
        "name": "aria-expanded", "equals": "false"}}'
    - step: 31
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree\"]"}'
    - step: 35
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree\"]"}'
    - step: 38
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree\"]"}'
    - step: 45
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 3}}'
    - step: 46
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"]", "equal": 1}}'
    - step: 47
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: Project tree appears with the selected root and readable file rows.
    method: manual
    reason: Retain the screenshot; visibility/expansion is established separately by assertions.
  native:
  - check: Added native directories are enumerated by the shared production explorer in the packaged WebView.
    method: automated
    reason: Browser VFS cannot prove native directory enumeration or native pane layout. Existing TC-WS-042 retains the actual system chooser boundary.

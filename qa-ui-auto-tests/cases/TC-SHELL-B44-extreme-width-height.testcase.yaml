id: TC-SHELL-B44
title: Extreme width and low height keep primary and window actions reachable
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b44.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.2
- F1.6
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150

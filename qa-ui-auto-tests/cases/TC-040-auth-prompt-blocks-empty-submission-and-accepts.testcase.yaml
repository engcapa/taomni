id: TC-040
title: Auth prompt blocks empty submission and accepts paste
description: 'Verifies the auth submit button stays disabled until a non-empty password

  is provided, and that the prompt advances to the terminal once a real

  password is submitted.

  '
covers:
- F6.5
tags:
- auth
- validation
- p1
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- assert_visible: '[data-testid="auth-password"]'
- assert_visible: '[data-testid="auth-submit"]'
- assert_disabled: '[data-testid="auth-submit"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: '   '
- assert_disabled: '[data-testid="auth-submit"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- assert_enabled: '[data-testid="auth-submit"]'
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 30
- screenshot: 040-auth-prompt-validation.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Auth prompt blocks empty submission and accepts paste：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 4
    - 6
    - 7
    - 12
    - 14
    - 16
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"qc-input\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"auth-password\"]"}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"auth-submit\"]"}'
    - step: 11
      expectation: '{"assert_disabled": "[data-testid=\"auth-submit\"]"}'
    - step: 13
      expectation: '{"assert_disabled": "[data-testid=\"auth-submit\"]"}'
    - step: 15
      expectation: '{"assert_enabled": "[data-testid=\"auth-submit\"]"}'
    - step: 17
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-pane\"]", "timeout_sec": 30}}'
    results:
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

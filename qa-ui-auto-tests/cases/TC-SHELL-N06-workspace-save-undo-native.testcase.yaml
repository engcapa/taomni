id: TC-SHELL-N06
title: Project rehosting retains editor history and saves real bytes
description: Isolated packaged Tauri boundary. docs-feature/workspace-shell-ux-redesign-test-cases.md#v-n06 records
  the complete scenario and any remaining manual boundary.
covers:
- F25.5
- F-SHELL-1

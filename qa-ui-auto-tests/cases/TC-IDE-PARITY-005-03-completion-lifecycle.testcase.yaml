id: TC-IDE-PARITY-005-03
title: Completion session cancellation and fresh request
description: B-005 controlled provider through real editor request, accept, undo and deferred responses.
covers: [F25.5]
tags: [code-workspace, completion, parity005, lifecycle, p1]
modes: [browser]
fixtures: [reset_db, parity005_completion]
timeout_sec: 240
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity005_root}"]'
  - wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Files"]'
  - fill:
      selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
      value: Mid.java
  - click: '[data-testid="code-workspace-search-everywhere"] button:has-text("Mid.java")'
  - wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Control+Home
  - press: ArrowDown
  - press: ArrowDown
  - press: ArrowDown
  - press: ArrowDown
  - press: End
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - assert_text:
      selector: '[data-testid="status-bar-workspace-cursor"]'
      contains: Ln 5, Col 18
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - wait: 0.12
  - press: Tab
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', 'import org.apache.commons.lang3.StringUtils;', '', 'public class Main {', '    void sample() {', '        StringUtils;', '    }', '}', '']
  - press: Control+z
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', '', 'public class Main {', '    void sample() {', '        StringUtiSuffix;', '    }', '}', '']
  - assert_text:
      selector: '[data-testid="status-bar-workspace-cursor"]'
      contains: Ln 5, Col 18
  - parity005_trace: {fetch: 1, resolve: 1, pending: 0}
  - wait: 0.5
  - press: Control+Space
  - parity005_trace: {pending: 0}
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - press: Escape
  - wait_for:
      selector: '.cm-tooltip-autocomplete'
      state: hidden
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', '', 'public class Main {', '    void sample() {', '        StringUtiSuffix;', '    }', '}', '']
  - parity005_set_mode: fetch-hold
  - press: Control+Space
  - parity005_wait_pending: fetch
  - press: Escape
  - parity005_release: fetch
  - wait_for:
      selector: '.cm-tooltip-autocomplete'
      state: hidden
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', '', 'public class Main {', '    void sample() {', '        StringUtiSuffix;', '    }', '}', '']
  - parity005_set_mode: normal
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - parity005_set_mode: resolve-hold
  - wait: 0.12
  - press: Enter
  - parity005_wait_pending: resolve
  - press: Escape
  - parity005_release: resolve
  - assert_not_visible: '[data-testid="completion-resolve-gate"]'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', '', 'public class Main {', '    void sample() {', '        StringUtiSuffix;', '    }', '}', '']
  - parity005_set_mode: normal
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - wait: 0.12
  - press: Enter
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'

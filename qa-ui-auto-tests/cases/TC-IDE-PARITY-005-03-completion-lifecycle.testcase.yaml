      popup、不复活 gate，正文逐字节不变；provider 返回零候选时不造假 provider 候选；一个文件的迟到响应不会把该文件的 provider 候选泄漏到等待期间切换到的另一个文件，用户字节保留且切回后重新触发可成功补全。

id: TC-IDE-PARITY-005-03
title: Java Basic Completion lifecycle - pending fetch, cancel, and cross-file isolation
description: 'ED-PARITY-005 V3 (A1/A3), browser with the controlled parity provider.

  A pending fetch and a pending resolve are both cancellable: Escape leaves the

  buffer byte-identical and a late response never commits, reopens the popup or

  resurrects a gate. An explicit invocation that falls back for missing project

  scope names the prerequisite once, a provider that answers with zero items

  produces no fabricated candidate, and a prefix fetched for one file never

  lands in another file opened while the response is in flight.

  Boundary: mocked IPC provider — renderer lifecycle, not real JDT LS.

  '

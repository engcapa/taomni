  - click: '[data-testid="code-workspace-search-everywhere"] button:has-text("Main.java")'
  - parity005_release: resolve
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', '', 'public class Main {', '    void sample() {', '        Stri;', '    }', '}', '']
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Files"]'
  - fill:
      selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
      value: Mid.java
  - click: '[data-testid="code-workspace-search-everywhere"] button:has-text("Mid.java")'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', '', 'public class Main {', '    void sample() {', '        StringUtiSuffix;', '    }', '}', '']
  - press:
      key: End
      selector: '[data-testid="code-workspace-editor"] .cm-content'
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - press: ArrowLeft
  - assert_text:
      selector: '[data-testid="status-bar-workspace-cursor"]'
      contains: 'Ln 5, Col 18'
  - parity005_set_mode: empty
  - press: Control+Space
  - parity005_trace: {fetch: 7}
  - assert_not_visible: '.cm-lsp-provider-option'
  - assert_not_visible: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - press: Escape
  - parity005_set_mode: normal
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - parity005_trace: {fetch: 8}
  - press: Escape
  - assert_items:

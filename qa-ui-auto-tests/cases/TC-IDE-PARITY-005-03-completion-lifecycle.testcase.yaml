id: TC-IDE-PARITY-005-03
title: 'Java Basic Completion lifecycle: pending fetch, pending accept, gate dismiss, cross-file isolation'
description: 'ED-PARITY-005 V3 (A1/A3) browser case. Each timing block resets first and then proves zero commit and no revival: Esc while the provider request is pending, Esc while the acceptance is waiting for its resolve (the late answer must not land), Esc dismissing the resolve gate, and a fresh call that works again afterwards. It also proves the explicit scope-fallback reason for a not-ready project, that a file the controlled provider does not cover gets no controlled candidate, and that work in another file never leaks an edit into the first one. The project-facts GENERATION transition is covered by the CodeMirrorHost.parity005 unit test because the browser preview has no ready facts snapshot to refresh.'
covers:
- F25.5
tags:
- code-workspace
- completion
- ed-parity-005
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 420

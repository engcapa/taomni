  - press: Escape
  - parity005_set_facts: degraded
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - eval_readonly:
      expression: window.__taomniQaParity005.observe().invocations.at(-1).projectScope.status === 'scope-facts-missing' && window.__taomniQaParity005.observe().invocations.at(-1).projectScope.reason.includes('degraded')
      expect_truthy: true
  - press: Escape
  - parity005_set_facts: failed
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - eval_readonly:
      expression: window.__taomniQaParity005.observe().invocations.at(-1).projectScope.status === 'scope-facts-missing' && window.__taomniQaParity005.observe().invocations.at(-1).projectScope.reason.includes('failed')
      expect_truthy: true
  - press: Escape
  - parity005_set_facts: stale
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - eval_readonly:
      expression: window.__taomniQaParity005.observe().invocations.at(-1).projectScope.status === 'scope-facts-missing' && window.__taomniQaParity005.observe().invocations.at(-1).projectScope.reason.includes('stale')
      expect_truthy: true
  - press: Escape
  - parity005_set_facts: ready
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - eval_readonly:
      expression: window.__taomniQaParity005.observe().invocations.at(-1).projectScope.status === 'ready' && window.__taomniQaParity005.observe().invocations.at(-1).projectScope.scope === 'module'
      expect_truthy: true
  - press: Escape
  - parity005_set_mode: resolve-hold
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'
  - wait: 0.12
  - press: Enter
  - parity005_wait_pending: resolve
  - parity005_set_facts: stale
  - parity005_release: resolve
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-line'
      equals: ['package parity005;', '', 'public class Main {', '    void sample() {', '        StringUtiSuffix;', '    }', '}', '']
  - assert_not_visible: '[data-testid="completion-resolve-gate"]'
  - parity005_set_facts: ready
  - parity005_set_mode: normal
  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringUtils")'

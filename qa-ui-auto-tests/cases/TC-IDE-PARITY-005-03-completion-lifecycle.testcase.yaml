id: TC-IDE-PARITY-005-03-completion-lifecycle
title: Basic Completion lifecycle - unavailable provider, cancel and file identity
description: 'ED-PARITY-005 V3. A completion that cannot be served honestly must say so

  instead of inventing a provider answer: with the harness disarmed the editor

  falls back to its own sources and never claims a language-server candidate, and

  arming it again restores the provider list. Cancelling an acceptance that is

  still waiting for its resolve must write nothing and must not be revived by the

  late answer. Switching to another file and back must not leak a candidate, a

  gate or a document between the two buffers.

  '
covers:
- F25.5
tags:
- code-workspace
- parity005
- completion
- lifecycle
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-dir"][data-path="parity005"]'
    timeout_sec: 30
- dblclick: '[data-testid="code-workspace-tree-dir"][data-path="parity005"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="parity005/Main.java"]'
    timeout_sec: 30
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="parity005/Main.java"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 30
- click: '[data-testid="code-workspace-editor"] .cm-content'
# R1 - harness disarmed: no provider answer may be claimed.
- click: '[data-testid="code-workspace-editor"] .cm-content'
- seed_storage:
    key: taomni.qa.parity005CompletionMode.v1
    value: '"off"'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: Control+Space
- wait: 2
# No language-server candidate and no semantic-ready claim.
- assert_not_visible: '[data-testid="code-workspace-lsp-status-pill"][data-semantic-ready="true"]'
- eval_readonly:
    expression: "!document.querySelector('.cm-tooltip-autocomplete') || !document.querySelector('.cm-tooltip-autocomplete').textContent.includes('org.apache.commons.lang3.StringUtils')"
    expect_truthy: true
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;
- eval_readonly:
    expression: "!document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    expect_truthy: true
- screenshot: parity005-03-provider-unavailable.png
# Re-arming restores the provider list, so the fallback is a state and not a dead end.
- press: Escape
- seed_storage:
    key: taomni.qa.parity005CompletionMode.v1
    value: '"resolved"'
# The provider session is probed at boot, so recovery is the user restating the
# workspace after the language server became available again.
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-dir"][data-path="parity005"]'
    timeout_sec: 30
- dblclick: '[data-testid="code-workspace-tree-dir"][data-path="parity005"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="parity005/Main.java"]'
    timeout_sec: 30
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="parity005/Main.java"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 60
- wait_for:
    selector: '[data-testid="code-workspace-lsp-status-pill"][data-semantic-ready="true"]'
    timeout_sec: 60
- click: '[data-testid="code-workspace-editor"] .cm-content'
# Park the caret at the probe again before asking for the list.
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringUtils
- screenshot: parity005-03-provider-recovered.png
- press: Escape
# R2 - Escape ends an acceptance still waiting on resolve.
- click: '[data-testid="code-workspace-editor"] .cm-content'
- seed_storage:
    key: taomni.qa.parity005CompletionMode.v1
    value: '"held"'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
- wait: 0.2
- press: Enter
- wait: 0.5
- press: Escape
# Past the resolve deadline: nothing may commit and no gate may appear.
- wait: 4
- assert_not_visible: '[data-testid="completion-resolve-gate"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;
- eval_readonly:
    expression: "!document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    expect_truthy: true
- screenshot: parity005-03-cancelled.png
# R3 - identity: A -> B -> A keeps both documents and both requests separate.
- click: '[data-testid="code-workspace-editor"] .cm-content'
- seed_storage:
    key: taomni.qa.parity005CompletionMode.v1
    value: '"resolved"'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
# Switching away closes the popup instead of leaving it over the new file.
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="parity005/Other.java"]'
- wait: 1
- assert_not_visible: .cm-tooltip-autocomplete
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: int marker
- screenshot: parity005-03-switched-away.png
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="parity005/Main.java"]'
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;
- eval_readonly:
    expression: "!document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    expect_truthy: true
- click: '[data-testid="code-workspace-editor"] .cm-content'
# Park the caret at the probe again before asking the restored buffer for a list.
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
- screenshot: parity005-03-back-to-a.png
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringUtils

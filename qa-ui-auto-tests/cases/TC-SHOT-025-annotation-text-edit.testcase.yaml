id: TC-SHOT-025
title: Double click edits an existing text mark without duplication
covers:
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-tool-text"]'
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position:
      x: 120
      y: 120
- fill:
    selector: '[data-testid="screenshot-text-input"]'
    value: original
- press: Control+Enter
- click: '[data-testid="screenshot-tool-move"]'
- dblclick:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position:
      x: 130
      y: 130
- assert_attribute:
    selector: '[data-testid="screenshot-text-input"]'
    name: value
    equals: original
- fill:
    selector: '[data-testid="screenshot-text-input"]'
    value: edited
- press: Control+Enter
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- dblclick:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position:
      x: 130
      y: 130
- assert_attribute:
    selector: '[data-testid="screenshot-text-input"]'
    name: value
    equals: edited
- fill:
    selector: '[data-testid="screenshot-text-input"]'
    value: discarded
- press: Escape
- dblclick:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position:
      x: 130
      y: 130
- assert_attribute:
    selector: '[data-testid="screenshot-text-input"]'
    name: value
    equals: edited
- press: Escape
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: edit
    requirement: Double-click opens existing text and Ctrl+Enter edits it in place.
    actions:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 11
    - 12
    checkpoints:
    - step: 10
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-text-input"]'', ''name'': ''value'', ''equals'':
        ''original''}'
    - step: 13
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'': ''data-shapes'',
        ''equals'': ''1''}'
    results:
    - 10
    - 13
  - id: cancel
    requirement: Escape discards text edits and preserves the saved mark.
    actions:
    - 14
    - 16
    - 17
    - 18
    checkpoints:
    - step: 15
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-text-input"]'', ''name'': ''value'', ''equals'':
        ''edited''}'
    - step: 19
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-text-input"]'', ''name'': ''value'', ''equals'':
        ''edited''}'
    results:
    - 15
    - 19
  - id: close
    requirement: Closing the overlay restores the camera.
    actions:
    - 20
    - 21
    checkpoints:
    - step: 22
      expectation: 'wait_for: [data-testid="system-screenshot"]'
    results:
    - 22
  visual:
  - check: Observable capture UI and operation results
    method: automated
    reason: Assertions check the stated visible states and geometry; retained screenshots allow review.
  native:
  - check: Native capture and window lifecycle
    method: external
    reason: Browser verifies renderer interaction and stub dispatch; native window, clipboard and media assertions are covered
      by SHOT-N cases.

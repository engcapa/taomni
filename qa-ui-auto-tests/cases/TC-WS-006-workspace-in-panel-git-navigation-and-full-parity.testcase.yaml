id: TC-WS-006
title: Workspace in-panel Git navigation via rail button, sidebar bar, editor action and GIT tab
description: 'Workspace-first platform redesign AC-06. The workspace sidebar no longer renders the legacy file/Git switch row. Four paths activate the in-panel Git manager: the rail Git button, the sidebar Git bar, the editor compare action and the GIT tab in the workspace strip. The six-tab parity itself is covered by the WorkspaceGitManager and GitPanel suites with real repositories.'
covers:
- F25.1
- F-WS-4
tags:
- workspace-platform
- git
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-sidebar"]'
- assert_count:
    selector: '[data-testid="workspace-sidebar"] [data-testid="workspace-view-switch"]'
    equal: 0
- click: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-git"]'
- wait_for: '[data-testid="workspace-git-manager"]'
- assert_visible: '[data-testid="workspace-tab-item"][data-tab-kind="git"]'
- click: '[data-testid="workspace-tab-editor"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_visible: '[data-testid="editor-open-git-diff"]'
- click: '[data-testid="editor-open-git-diff"]'
- wait_for: '[data-testid="workspace-git-manager"]'
- click: '[data-testid="workspace-tab-editor"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="workspace-sidebar-git-bar"]'
- wait_for: '[data-testid="workspace-git-manager"]'
- assert_visible: '[data-testid="workspace-tab-item"][data-tab-kind="git"][data-active="true"]'
- screenshot: tc-ws-006-in-panel-git.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 工作区左栏已移除旧的 [文件管理 | Git 面板] 切换行。
    actions:
    - 3
    checkpoints:
    - step: 5
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-sidebar\"] [data-testid=\"workspace-view-switch\"]", "equal": 0}}'
    results:
    - 5
  - id: R2
    requirement: 主左侧栏 🌿 Git 按钮、编辑器对比按钮、左栏底部 Git 状态条与工作区 GIT 标签四条路径均激活内置 Git 面板。
    actions:
    - 5
    - 9
    - 11
    - 14
    checkpoints:
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"workspace-git-manager\"]"}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"workspace-tab-item\"][data-tab-kind=\"git\"]"}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"editor-open-git-diff\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"workspace-git-manager\"]"}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"workspace-git-manager\"]"}'
    - step: 18
      expectation: GIT 标签处于激活态。
    results:
    - 7
    - 8
    - 11
    - 13
    - 17
    - 18
  visual:
  - check: 检查截图 Git 面板、工作区标签条与左栏布局无重叠。
    method: manual
    reason: 像素布局与遮挡需要截图人工评审。
  native:
  - check: 原生 WebView 中按相同步骤执行；多仓库 Git 操作由 TC-GIT 系列与 WorkspaceGitManager 套件覆盖。
    method: automated
    reason: browser 证据不替代 native，未执行平台不计作通过。

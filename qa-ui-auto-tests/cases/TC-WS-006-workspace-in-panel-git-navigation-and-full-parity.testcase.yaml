id: TC-WS-006
title: In-workspace Git panel reachable from four entries with the full main parity surface
description: 'v6.1 AC-06 / DEC-04. The removed [Files | Git] row (marker 1) and the removed top-right Git button (marker 3) stay absent. The built-in Git panel
  opens from the workspace status bar, the primary rail Git button, the workspace tab strip and the editor''s compare-in-Git action, and keeps every main Git
  capability: repository selector, six views (Changes/Log/Branches/Tags/Stash/Settings), tree/flat switch, amend and commit, and side-by-side/unified diffs.'
modes:
- browser
- native
covers:
- F25.1
- F-WS-4
tags:
- smoke
- p0
- workspace-redesign
- git
fixtures:
- reset_db
- parity008_git
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-006
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default Workspace (默认工作区)","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"repo-a","path":"${fixture.parity008_root}/repo-a","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-sidebar-panel"]'
- assert_visible: '[data-testid="workspace-sidebar-git-bar"]'
- assert_visible: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-git"]'
- click: '[data-testid="workspace-sidebar-git-bar"]'
- wait_for: '[data-testid="workspace-git-panel"]'
- wait_for: '[data-testid="git-panel"]'

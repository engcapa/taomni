- assert_visible: '[data-testid="git-commit-message"]'
- assert_visible: '[data-testid="git-commit-button"]'
- assert_visible: '[data-testid="git-commit-and-push"]'
- click: '[data-testid="git-changes-tree-toggle"]'
- assert_enabled: '[data-testid="git-changes-tree-toggle"]'
- click: '[data-testid="git-branches-tab"]'
- wait_for: '[data-testid="git-branches-view"]'
- click: '[data-testid="git-tags-tab"]'
- wait_for: '[data-testid="git-tags-view"]'
- click: '[data-testid="git-stash-tab"]'
- assert_attribute:

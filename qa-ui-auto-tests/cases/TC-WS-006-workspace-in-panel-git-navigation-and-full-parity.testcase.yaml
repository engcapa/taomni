    name: aria-pressed
    equals: 'true'
- click: '[data-testid="git-settings-tab"]'
- assert_attribute:
    selector: '[data-testid="git-settings-tab"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="git-changes-tab"]'
- fill:
    selector: '[data-testid="git-commit-message"]'
    value: 'feat(qa): workspace git case'
- set_check:
    selector: '[data-testid="git-commit-amend"]'
    checked: true
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"git-commit-amend"]').checked === true
    expect_truthy: true
- click: '[data-testid="code-workspace-tree-root"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="same.txt"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="same.txt"]'

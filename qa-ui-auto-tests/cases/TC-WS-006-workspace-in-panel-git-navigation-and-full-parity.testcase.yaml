- wait_for: '[data-testid="workspace-git-manager"]'
- assert_visible: '[data-testid="workspace-repo-selector"]'
- assert_visible: '[data-testid="git-changes-tab"]'
- wait_for: '[data-testid="workspace-change-row"]'

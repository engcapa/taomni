id: TC-014
title: Tab bar right-click menu manages open tabs and tab-strip toolbar exposes split / multiexec / more
covers:
- F1.5
tags:
- legacy-imported
- main
- p1
- right-menu
- tabs
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tab-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- right_click: '[data-testid="tab-item"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu"] >> text="Close"'
- assert_visible: '[data-testid="context-menu"] >> text="Close others"'
- assert_visible: '[data-testid="context-menu"] >> text="Close all"'
- assert_visible: '[data-testid="context-menu"] >> text="Duplicate tab"'
- press: Escape
- assert_visible: '[data-testid="tab-split-view"]'
- assert_enabled: '[data-testid="tab-split-view"]'
- click: '[data-testid="tab-multiexec-toggle"]'
- assert_visible: '[data-testid="tab-multiexec-toggle"][data-active="true"]'
- wait: 0.5
- click: '[data-testid="tab-multiexec-toggle"]'
- assert_not_visible: '[data-testid="tab-multiexec-toggle"][data-active="true"]'
- wait: 0.5
- click: '[data-testid="tab-more"]'
- wait_for: '[data-testid="open-tabs-menu"]'
- assert_visible: '[data-testid="open-tabs-menu"]'
- screenshot: 014-tab-right-menu.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 标签右键菜单具有关闭/复制入口；多执行切换按钮状态往返，更多按钮打开标签列表。
    actions:
    - 1
    - 3
    - 5
    - 11
    - 14
    - 17
    - 20
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"tab-bar\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"context-menu\"] >> text=\"Close\""}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"context-menu\"] >> text=\"Close others\""}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"context-menu\"] >> text=\"Close all\""}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"context-menu\"] >> text=\"Duplicate tab\""}'
    - step: 12
      expectation: '{"assert_visible": "[data-testid=\"tab-split-view\"]"}'
    - step: 13
      expectation: '{"assert_enabled": "[data-testid=\"tab-split-view\"]"}'
    - step: 15
      expectation: '{"assert_visible": "[data-testid=\"tab-multiexec-toggle\"][data-active=\"true\"]"}'
    - step: 18
      expectation: '{"assert_not_visible": "[data-testid=\"tab-multiexec-toggle\"][data-active=\"true\"]"}'
    - step: 21
      expectation: '{"wait_for": "[data-testid=\"open-tabs-menu\"]"}'
    - step: 22
      expectation: '{"assert_visible": "[data-testid=\"open-tabs-menu\"]"}'
    results:
    - 21
    - 22
  visual:
  - check: 右键菜单和更多列表无截断，激活状态可区分。
    method: manual
    reason: 截图必须单独评审，不能由功能步骤通过推导视觉通过。
  native:
  - check: 只证明菜单入口及本地状态，不证明系统窗口或向多个 PTY 分发输入。
    method: external
    reason: 按实际执行模式解释；其他平台不继承 Linux 证据。

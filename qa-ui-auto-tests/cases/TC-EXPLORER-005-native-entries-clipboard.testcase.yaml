id: TC-EXPLORER-005
title: Native Explorer opens terminal cwd, publishes real system file clipboard and restores current directory
description: AC03/07/11/12/13/17/20 native boundary. Explorer opens from Tools and creates a real local terminal in its cwd. Terminal right-click
  reuses the existing Explorer or explicitly creates another. Real clipboard formats are read independently, a real desktop file manager
  pastes copied bytes, real external edits refresh preview, and reload restores persisted path/preferences. No browser stub is native proof.
modes:
- native
covers:
- F-EXPLORER-1
- F1.8
- F2.1
- F2.2
tags:
- p0
- explorer
- native-boundary
- clipboard
- terminal
- persistence
- regression
fixtures:
- reset_db
- explorer_files
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-explorer-native
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"]'
- press:
    selector: '[data-testid="explorer-tab"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.explorer_previews}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- wait_for: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
- click: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
- wait_for: '[data-testid="explorer-preview-text"]'
- assert_text:
    selector: '[data-testid="explorer-preview-text"]'
    contains: Explorer preview text
- click: '[data-testid="explorer-cmd-copy"]'
- file_clipboard:
    action: assert
    paths:
    - ${fixture.explorer_previews}/notes.txt
- system_file_paste:
    directory: ${fixture.explorer_external_target}
    paths:
    - ${fixture.explorer_previews}/notes.txt
- assert_file_contains:
    path: ${fixture.explorer_external_target}/notes.txt
    contains: Explorer preview text
- click: '[data-testid="explorer-preview-settings"]'
- click: '[data-testid="explorer-preview-bottom"]'
- assert_attribute:
    selector: '[data-testid="explorer-preview"]'
    name: data-position
    equals: bottom
- click: '[data-testid="explorer-preview-settings"]'
- click: '[data-testid="explorer-preview-wrap"]'
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"wrap":true'
- click: '[data-testid="explorer-cmd-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    text: echo QA_EXPLORER_TERMINAL_READY
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_EXPLORER_TERMINAL_READY\s*$
- right_click: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_visible: '[data-testid="terminal-context-explorer"]'
- assert_visible: '[data-testid="terminal-context-explorer-new"]'
- click: '[data-testid="terminal-context-explorer"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-browser"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="explorer-tab"]'
    name: data-path
    equals: ${fixture.explorer_previews}
- click: '[data-testid="tab-item"][data-tab-type="terminal"]'
- host_write_file:
    path: ${fixture.explorer_previews}/notes.txt
    text: 'External editor changed the preview while Explorer was inactive.

      '
- right_click: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- click: '[data-testid="terminal-context-explorer"]'
- click: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
- assert_text:
    selector: '[data-testid="explorer-preview-text"]'
    contains: External editor changed the preview
- assert_no_runtime_errors: null
- screenshot: explorer-native-clipboard-terminal-preview.png
- reload_window: null
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_previews}"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-browser"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="explorer-preview"]'
    name: data-position
    equals: bottom
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"wrap":true'
- click: '[data-testid="explorer-cmd-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- right_click: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- click: '[data-testid="terminal-context-explorer-new"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-browser"]'
    equal: 2
- assert_count:
    selector: '[data-testid="explorer-tab"][data-path="${fixture.explorer_previews}"]'
    equal: 2
- assert_no_runtime_errors: null
- screenshot: explorer-native-new-tab.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Native text reads actual bytes, Copy publishes the OS file list and an independent real desktop file-manager Paste creates
      exact original content.
    actions:
    - 3
    - 4
    - 6
    - 7
    - 8
    - 10
    - 13
    - 15
    checkpoints:
    - step: 12
      expectation: Native preview shows actual source text.
    - step: 14
      expectation: Independent native CFHDROP/NSURL/GTK MIME oracle sees exactly the selected file.
    - step: 16
      expectation: Real file-manager target contains original fixture content.
    results:
    - 12
    - 14
    - 16
  - id: R2
    requirement: Explorer launches a real terminal in its current cwd; local-terminal context menu returns to existing Explorer rather than
      opening another; external modification is refreshed.
    actions:
    - 23
    - 25
    - 27
    - 30
    - 33
    - 34
    - 35
    - 36
    - 37
    checkpoints:
    - step: 26
      expectation: Anchored PTY output proves actual command execution.
    - step: 28
      expectation: Local terminal exposes Explorer entry.
    - step: 29
      expectation: Local terminal exposes explicit new-tab entry.
    - step: 31
      expectation: Existing same-directory Explorer is reused.
    - step: 32
      expectation: Terminal cwd maps to the Explorer directory that launched it.
    - step: 38
      expectation: Preview re-reads actual externally modified file bytes.
    results:
    - 26
    - 28
    - 29
    - 31
    - 32
    - 38
  - id: R3
    requirement: Explorer current directory and shared preview preferences restore after WebView reload; terminal explicit new opens one
      additional same-cwd Explorer.
    actions:
    - 17
    - 18
    - 20
    - 21
    - 41
    - 46
    - 48
    - 49
    checkpoints:
    - step: 19
      expectation: Bottom position applies before reload.
    - step: 22
      expectation: Wrap is persisted.
    - step: 42
      expectation: Current native directory restores after reload.
    - step: 43
      expectation: Restore does not duplicate Explorer.
    - step: 44
      expectation: Bottom position restores.
    - step: 45
      expectation: Wrap restores.
    - step: 50
      expectation: Force-new from terminal adds exactly one Explorer.
    - step: 51
      expectation: Both same-cwd Explorer panes remain independently mounted.
    - step: 52
      expectation: No runtime errors after native restore and new tab.
    results:
    - 19
    - 22
    - 42
    - 43
    - 44
    - 45
    - 50
    - 51
    - 52
  visual:
  - check: Native packaged preview, terminal context menu and Explorer tabs.
    method: manual
    reason: Screenshots retained for prototype comparison; OS native chrome differs by platform.
  native:
  - check: Real PTY cwd routing, actual filesystem reads, independent file-list clipboard and real file-manager Paste.
    method: automated
    reason: These assertions cannot be established by browser stubs. Clipboard/paste permissions or unavailable actions fail rather than
      skip.
  - check: Cold OS-process restart and physical menu/drag/keyboard input.
    method: manual
    reason: reload_window restores WebView state only; terminal text and key delivery use WebView automation rather than physical input.

id: TC-NOTES-003
title: Notes filter — recent-incomplete vs completed
description: 'Verifies the notes filter views (F-TAO-1): a completed note is hidden by the

  default "recent-incomplete" filter, appears under the "Completed" filter, and

  disappears again when removing the "Completed" status. Exercises NoteFilters.

  '
covers:
- F-TAO-1
tags:
- notes
- tao
- p2
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- wait_for: '[data-testid="ai-chat-drawer-ribbon"]'
- click: '[data-testid="ai-chat-drawer-ribbon"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- wait_for: '[data-testid="notes-panel"]'
- click: '[data-testid="notes-new"]'
- wait_for: '[data-testid="note-editor"]'
- fill:
    selector: '[data-testid="note-editor-title"]'
    value: QA finish me
- click: '[data-testid="note-editor-back"]'
- wait_for: '[data-testid="notes-panel"]'
- assert_text:
    selector: '[data-testid="notes-list"]'
    contains: QA finish me
- click: '[data-testid="notes-toggle-complete"]'
- wait: 0.5
- assert_not_visible: '[data-testid="notes-list"] >> text="QA finish me"'
- click: '[data-testid="notes-filter-menu"]'
- click: '[data-testid="notes-filter-completed"]'
- wait: 0.5
- assert_text:
    selector: '[data-testid="notes-list"]'
    contains: QA finish me
- click: '[data-testid="notes-filter-completed"]'
- wait: 0.5
- assert_not_visible: '[data-testid="notes-list"] >> text="QA finish me"'
- screenshot: notes-003-filter-recent-incomplete.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Notes filter — recent-incomplete vs completed：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 4
    - 6
    - 8
    - 10
    - 11
    - 14
    - 17
    - 18
    - 21
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"status-bar\"]"}'
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"ai-chat-drawer-ribbon\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"ai-chat-drawer\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"notes-panel\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"note-editor\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"notes-panel\"]"}'
    - step: 13
      expectation: '{"assert_text": {"selector": "[data-testid=\"notes-list\"]", "contains": "QA finish me"}}'
    - step: 16
      expectation: '{"assert_not_visible": "[data-testid=\"notes-list\"] >> text=\"QA finish me\""}'
    - step: 20
      expectation: '{"assert_text": {"selector": "[data-testid=\"notes-list\"]", "contains": "QA finish me"}}'
    - step: 23
      expectation: '{"assert_not_visible": "[data-testid=\"notes-list\"] >> text=\"QA finish me\""}'
    results:
    - 23
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

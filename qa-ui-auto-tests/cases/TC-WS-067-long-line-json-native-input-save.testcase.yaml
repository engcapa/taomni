    - step: 27
      expectation: '{"assert_language_startup": {"commands": {"sdk_get_registry": {"equal": 0}, "sdk_analyze_workspace": {"equal": 0}, "sdk_resolve_workspace":
        {"equal": 0}, "lsp_detect_servers": {"equal": 0}, "lsp_discover_java_bundles": {"equal": 0}, "lsp_open_document": {"equal": 0}, "lsp_document_status":

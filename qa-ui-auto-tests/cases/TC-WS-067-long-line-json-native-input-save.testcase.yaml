  visual:
  - check: JSON content and highlighting remain readable.
    method: manual
    reason: Screenshots retained; renderer frames separately verify responsiveness.
  native:
  - check: Packaged WebView, real native file read, keyboard input and independently hashed saved bytes.
    method: automated
    reason: Browser VFS cannot establish real disk or native WebView latency.

id: TC-WS-067
title: Long-line 193KiB JSON retains real input and byte-exact native saving
description: Open public synthetic 693-line 193KiB JSON through real native file reading, require exact content and continuous responsive frames, measure
  32 paced keys with a 150ms p95 input guardrail, save, close and reopen, and independently hash complete disk bytes. Ordinary JSON must never start automatic
  SDK/LSP discovery.
  Every activation/key frame allows at most 165ms (150ms baseline plus the user-approved 10% tolerance); all raw samples are retained.
modes:
- native
covers:
- F-WS-2
- F25.1
- F25.3
- F11.2
tags:
- p0
- workspace-redesign
- file-explorer
- regression
- performance
fixtures:
- reset_db
- workspace_language_files
- release_build_required
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-plain-files
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- click: '[data-testid="code-workspace-tree-dir"][data-path="Documents"] [data-testid="code-workspace-tree-dir-arrow"]'
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/long-records.json"]'
    expected: ${fixture.workspace_long_json_text}
    event: dblclick
    label: native-long-json
- click: '[data-testid="workspace-file-editor"] .cm-content'
- native_keys:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    transport: webdriver
    keys:
    - Mod+End
- native_editor_performance:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    keys: qajsonabcdefghijklmnopqrstuvwxyz
    capture_text: false
    max_p95_ms: 150
    label: long-line-json
- click: '[data-testid="workspace-editor-save"]:enabled'
- assert_file_sha256:
    path: ${fixture.platform_workspace_root}/Documents/long-records.json
    equals: 781211b732004e686ae5a000538858954f74d481a36ea6c75f0c7adae8a36d64
- click: '[data-testid="workspace-tab"][data-tab-title="long-records.json"] [data-testid="workspace-tab-close"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/long-records.json"]'
- click: '[data-testid="workspace-file-editor"] .cm-content'
- native_keys:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    transport: webdriver
    keys:
    - Mod+End
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: qajsonabcdefghijklmnopqrstuvwxyz
- eval_readonly:
    expression: document.querySelectorAll('.cm-content').length === 1 && document.querySelector('.cm-content').cmTile.root.view.state.doc.line(1).text ===
      '{'
    expect_truthy: true
- assert_file_sha256:
    path: ${fixture.platform_workspace_root}/Documents/long-records.json
    equals: 781211b732004e686ae5a000538858954f74d481a36ea6c75f0c7adae8a36d64
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- assert_no_runtime_errors: null
- screenshot: workspace-long-json-native-save.png

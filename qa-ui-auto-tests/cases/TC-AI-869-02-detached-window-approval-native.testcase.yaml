id: TC-AI-869-02-detached-window-approval-native
title: Detached terminal window owns the Tao approval card and deciding clears every window
description: 'Issue #869 native regression. A detached terminal window mounts the same CcAgentBridge as the main window, so a broadcast approval rendered two cards and a side-effect could run twice. This case opens a real second window from a local-shell bookmark and drives the QA-gated probe, which registers a genuine pending permission and emits through the production thread->window targeting. It asserts: only the owner window shows the card; its Allow decision reaches the real pending registry; the ACP gate addressed to the owner window is not duplicated in the main window and the production dismissed broadcast clears it; a pending approval survives a renderer reload of its owner window (and is not replayed once resolved); a real run_in_terminal side effect whose terminal lives in the detached window is routed there even though the chat owner is the main window; a broadcast fallback (stale owner label) renders in both live windows and deciding in one clears the other through agent-cc-permission-resolved;
  and no runtime errors appear. Closing a real detached window is covered by TC-AI-869-03 on Linux and Windows because the WKWebView automation bridge cannot reliably deliver that in-page click on macOS.'
covers:
- F-AI-2.4
- F6.3
tags:
- ai
- approval
- window
- native-gate
- regression
- p1

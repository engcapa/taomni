        1, "min_height": 1, "tolerance": 0, "max_height": 32}}'
    - step: 14
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-sessions\"]", "equals": "Sessions"}}'
    - step: 15

id: TC-MAIN-RAIL-01
title: Permanent Sessions, Tools and Settings share tool window icons and names without a duplicate Git action
description: Browser and packaged native acceptance for the title-bar grip and permanent buttons. Native explicitly
  covers the requested WebView layout and interactions. Names toggle in both directions from both the permanent
  and workspace menus; preferences survive reload and permanent entries stay available across tabs/panels. Settings
  follows the names toggle and opens by keyboard; local terminals and Code Workspace do not add a separate Git action
  to the main sidebar.
covers:
- F1.2
- F1.3
- F1.9
- F6.2
- F25.5
- F-Sockscap-1
- F-I18n-1
tags:
- main
- sidebar
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 240

        ""}}'
    - step: 36
      expectation: '{"wait_for": "[data-testid=\"sidebar-rail-menu-show-names\"]"}'
    - step: 38
      expectation: '{"assert_localstorage": {"key": "taomni.codeWorkspace.toolWindowStripes.v1", "contains":

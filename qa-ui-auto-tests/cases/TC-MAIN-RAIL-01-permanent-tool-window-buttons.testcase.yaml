id: TC-MAIN-RAIL-01
title: Permanent Shell Rail names and workspace stripes share preferences and keyboard
  behavior
description: Adapted for Workspace Shell v2. The permanent Rail, per-lane Navigator
  and merged workspace stripes replace the old expanded/collapsed sidebar wrappers.
  Retained results are declared in each requirement.
covers:
- F1.2
- F1.3
- F25.5
- F-I18n-1
tags:
- main
- sidebar
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-retained-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.shellLayout.v2
    value: '{"version": 2, "navigator": {"collapsedByLane": {"home": false, "build":
      true, "connect": true}, "lastArea": "sessions", "width": 360}}'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- assert_count:
    selector: '[data-testid="shell-rail"]'
    equal: 1
- eval_readonly:
    expression: Math.abs(document.querySelector('[data-window-drag]').getBoundingClientRect().height
      - innerHeight) < 1
    expect_truthy: true
    timeout_sec: 5
- assert_text_equals:
    selector: '[data-testid="shell-rail-sessions"]'
    equals: Sessions
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: Workspaces
- press:
    selector: '[data-testid="shell-rail-sessions"]'
    key: Enter
- assert_not_visible: '[data-testid="session-tree"]'
- assert_attribute:
    selector: '[data-testid="shell-rail-sessions"]'
    name: aria-pressed
    equals: 'false'
- press:
    selector: '[data-testid="shell-rail-sessions"]'
    key: Space
- assert_visible: '[data-testid="session-tree"]'
- assert_attribute:
    selector: '[data-testid="shell-rail-sessions"]'
    name: aria-pressed
    equals: 'true'
- shell_navigate: tools
- click: '[data-testid="shell-navigator-page"][data-page="tools"]'
- assert_visible: '[data-testid="sidebar-tools-panel"]'
- assert_visible: '[data-testid="sidebar-tool-code-workspace"]'
- right_click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_text_equals:
    selector: '[data-testid="shell-rail-sessions"]'
    equals: ''
- assert_attribute:
    selector: '[data-testid="shell-rail-sessions"]'
    name: aria-label
    equals: Sessions
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- right_click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- shell_navigate: tools
- click: '[data-testid="shell-navigator-page"][data-page="tools"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_not_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_visible: '[data-testid="code-workspace-tree-pane"]'
- right_click: '[data-testid="code-workspace-tool-rail-project"]'
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- right_click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- assert_text_equals:
    selector: '[data-testid="code-workspace-tool-rail-project"]'
    equals: Project
- click: '[data-testid="shell-rail-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="shell-rail-home"]'
- assert_visible: '[data-testid="shell-rail-workspaces"]'
- assert_count:
    selector: '[data-testid="shell-rail"]'
    equal: 1
- eval_readonly:
    expression: Math.abs(document.querySelector('[data-window-drag]').getBoundingClientRect().height
      - innerHeight) < 1
    expect_truthy: true
    timeout_sec: 5
- screenshot: main-rail-shell-v2.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The full-height window grip and permanent Rail retain keyboard toggles,
      accessible names and a reachable Tools page.
    actions:
    - 4
    - 5
    - 6
    - 7
    - 9
    - 10
    - 15
    - 18
    - 21
    - 22
    checkpoints:
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 11
      expectation: '{"assert_count": {"selector": "[data-testid=\"shell-rail\"]",
        "equal": 1}}'
    - step: 12
      expectation: '{"eval_readonly": {"expression": "Math.abs(document.querySelector(''[data-window-drag]'').getBoundingClientRect().height
        - innerHeight) < 1", "expect_truthy": true, "timeout_sec": 5}}'
    - step: 13
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-sessions\"]",
        "equals": "Sessions"}}'
    - step: 14
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-workspaces\"]",
        "equals": "Workspaces"}}'
    - step: 16
      expectation: '{"assert_not_visible": "[data-testid=\"session-tree\"]"}'
    - step: 17
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail-sessions\"]",
        "name": "aria-pressed", "equals": "false"}}'
    - step: 19
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"]"}'
    - step: 20
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail-sessions\"]",
        "name": "aria-pressed", "equals": "true"}}'
    - step: 23
      expectation: '{"assert_visible": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 24
      expectation: '{"assert_visible": "[data-testid=\"sidebar-tool-code-workspace\"]"}'
    results:
    - 8
    - 11
    - 12
    - 13
    - 14
    - 16
    - 17
    - 19
    - 20
    - 23
    - 24
  - id: R2
    requirement: Global name toggles persist through reload; a single workspace stripe
      lives in the permanent Rail.
    actions:
    - 25
    - 27
    - 31
    - 34
    - 36
    - 38
    - 39
    - 40
    - 44
    - 46
    checkpoints:
    - step: 26
      expectation: '{"wait_for": "[data-testid=\"sidebar-rail-menu-show-names\"]"}'
    - step: 28
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-sessions\"]",
        "equals": ""}}'
    - step: 29
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail-sessions\"]",
        "name": "aria-label", "equals": "Sessions"}}'
    - step: 30
      expectation: '{"assert_localstorage": {"key": "taomni.codeWorkspace.toolWindowStripes.v1",
        "contains": "\"showNames\":false"}}'
    - step: 32
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 33
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-workspaces\"]",
        "equals": ""}}'
    - step: 35
      expectation: '{"wait_for": "[data-testid=\"sidebar-rail-menu-show-names\"]"}'
    - step: 37
      expectation: '{"assert_localstorage": {"key": "taomni.codeWorkspace.toolWindowStripes.v1",
        "contains": "\"showNames\":true"}}'
    - step: 41
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 42
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-tool-window-rail\"]
        [data-testid=\"code-workspace-tool-rail-left\"]", "equal": 1}}'
    - step: 43
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"]
        [data-testid=\"code-workspace-tool-rail-left\"]", "equal": 0}}'
    - step: 45
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree-pane\"]"}'
    - step: 47
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-pane\"]"}'
    results:

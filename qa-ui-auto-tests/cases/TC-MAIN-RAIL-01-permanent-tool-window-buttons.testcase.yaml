id: TC-MAIN-RAIL-01
title: Permanent Shell Rail names and workspace stripes share preferences and keyboard behavior
description: Adapted for Workspace Shell v2. The permanent Rail, per-lane Navigator and merged workspace stripes
  replace the old expanded/collapsed sidebar wrappers. Retained results are declared in each requirement. Classification
  now uses dock/Actions; Project uses the unified Workspaces entry. Existing workspace content, shortcut and state
  assertions remain.
covers:
- F1.2
- F1.3
- F25.5
- F-I18n-1
tags:
- main
- sidebar
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-retained-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.shellLayout.v2
    value: '{"version": 2, "navigator": {"collapsedByLane": {"home": false, "build": true, "connect": true}, "lastArea":
      "sessions", "width": 360}}'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- assert_count:
    selector: '[data-testid="shell-rail"]'
    equal: 1
- assert_element_geometry:
    selector: '[data-testid="window-drag-handle"]'
    min_width: 1
    min_height: 1
    tolerance: 0
    max_height: 32
- assert_text_equals:
    selector: '[data-testid="shell-rail-sessions"]'
    equals: Sessions
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: Workspaces
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- press:
    selector: '[data-testid="shell-rail-sessions"]'
    key: Enter
- assert_not_visible: '[data-testid="session-tree"]'
- assert_attribute:
    selector: '[data-testid="shell-rail-sessions"]'
    name: aria-pressed
    equals: 'false'
- press:
    selector: '[data-testid="shell-rail-sessions"]'
    key: Space
- assert_visible: '[data-testid="session-tree"]'
- assert_attribute:
    selector: '[data-testid="shell-rail-sessions"]'
    name: aria-pressed
    equals: 'true'
- shell_navigate: tools
- click: '[data-testid="shell-navigator-page"][data-page="tools"]'
- assert_visible: '[data-testid="sidebar-tools-panel"]'
- assert_visible: '[data-testid="sidebar-tool-code-workspace"]'
- right_click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_text_equals:
    selector: '[data-testid="shell-rail-sessions"]'
    equals: ''
- assert_attribute:
    selector: '[data-testid="shell-rail-sessions"]'
    name: aria-label
    equals: Sessions
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- right_click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- shell_navigate: tools
- click: '[data-testid="shell-navigator-page"][data-page="tools"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="shell-rail-workspaces"]'
- assert_not_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="shell-rail-workspaces"]'
- assert_visible: '[data-testid="code-workspace-tree-pane"]'
- right_click: '[data-testid="shell-rail-workspaces"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- right_click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: Workspaces
- click: '[data-testid="shell-rail-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="shell-rail-home"]'
- assert_visible: '[data-testid="shell-rail-workspaces"]'
- assert_count:
    selector: '[data-testid="shell-rail"]'
    equal: 1
- assert_element_geometry:
    selector: '[data-testid="window-drag-handle"]'
    min_width: 1
    min_height: 1
    tolerance: 0
    max_height: 32
- screenshot: main-rail-shell-v2.png

id: TC-MAIN-RAIL-01
title: Permanent Sessions and Tools share the tool window icons, names and keyboard interaction
description: >-
  Browser and packaged native acceptance for the full-height left grip and permanent
  buttons. Native explicitly covers the requested WebView layout and interactions.
  Names toggle in both directions from both the permanent and workspace menus;
  preferences survive reload and both entries stay available across tabs/panels.
covers: [F1.2, F1.3, F6.2, F25.5, F-Sockscap-1]
tags: [main, sidebar, p1]
modes: [browser, native]
fixtures: [reset_db]
timeout_sec: 240
steps:
  - open: ${cfg.app.base_url}
  - vault_first_run: qa-main-rail-password
  - wait_for: '[data-testid="welcome-panel"]'
  - seed_storage: {key: taomni.locale.v1, value: en}
  - seed_storage: {key: taomni.sidebarCollapsed, value: 'false'}
  - seed_storage: {key: taomni.sidebarCollapsedByGroup.v1, value: '{"code-workspace":true,"terminal":true}'}
  - seed_storage: {key: taomni.mergeToolWindowRail, value: 'true'}
  - seed_storage: {key: taomni.codeWorkspace.toolWindowStripes.v1, value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'}
  - reload_window: null
  - wait_for: '[data-testid="session-tree"]'
  - assert_visible: '[data-testid="expanded-sidebar-panel"]'
  - eval_readonly:
      expression: Math.abs(document.querySelector('[data-window-drag]').getBoundingClientRect().height - innerHeight) < 1
      expect_truthy: true
  - eval_readonly:
      expression: document.querySelector('[data-window-drag]').getBoundingClientRect().right <= document.querySelector('button[data-tool-window-id]').getBoundingClientRect().left
      expect_truthy: true
  - assert_count: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"] svg', equal: 1}
  - assert_count: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"] svg', equal: 1}
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]', equals: Sessions}
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', equals: Tools}
  - press: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', key: Enter}
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - assert_attribute: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', name: aria-pressed, equals: 'true'}
  - press: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', key: Space}
  - wait_for: '[data-testid="collapsed-sidebar-rail"]'
  - assert_attribute: {selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]', name: aria-pressed, equals: 'false'}
  - press: {selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-sessions"]', key: Enter}
  - wait_for: '[data-testid="session-tree"]'
  - assert_attribute: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]', name: aria-pressed, equals: 'true'}
  - right_click: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]'
  - click: '[data-testid="sidebar-rail-menu-show-names"]'
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]', equals: ''}
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', equals: ''}
  - assert_attribute: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]', name: aria-label, equals: Sessions}
  - assert_localstorage: {key: taomni.codeWorkspace.toolWindowStripes.v1, contains: '"showNames":false'}
  - reload_window: null
  - wait_for: '[data-testid="session-tree"]'
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]', equals: ''}
  - right_click: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]'
  - click: '[data-testid="sidebar-rail-menu-show-names"]'
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', equals: Tools}
  - click: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
  - assert_visible: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-sessions"]'
  - assert_visible: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
  - eval_readonly:
      expression: Math.abs(document.querySelector('button[data-tool-window-id]').getBoundingClientRect().width - document.querySelector('nav[data-embedded] button').getBoundingClientRect().width) < 1
      expect_truthy: true
  - screenshot: main-rail-workspace-names.png
  - eval_readonly:
      expression: document.querySelector('nav[data-embedded] button').getBoundingClientRect().height >= 32 && document.querySelector('nav[data-embedded] button').getBoundingClientRect().width >= 32
      expect_truthy: true
  - click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
  - assert_not_visible: '[data-testid="code-workspace-tree-pane"]'
  - click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
  - assert_visible: '[data-testid="code-workspace-tree-pane"]'
  - right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
  - click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
  - assert_text_equals: {selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]', equals: ''}
  - assert_text_equals: {selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]', equals: ''}
  - assert_visible: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-sessions"] svg'
  - eval_readonly:
      expression: Math.abs(document.querySelector('button[data-tool-window-id]').getBoundingClientRect().width - document.querySelector('nav[data-embedded] button').getBoundingClientRect().width) < 1 && document.querySelector('nav[data-embedded] button').getBoundingClientRect().width >= 32
      expect_truthy: true
  - screenshot: main-rail-workspace-icons.png
  - right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
  - click: '[data-testid="sidebar-rail-menu-show-names"]'
  - assert_text_equals: {selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]', equals: Project}
  - click: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-sessions"]'
  - wait_for: '[data-testid="session-tree"]'
  - assert_visible: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
  - dblclick: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]'
  - wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
  - click: '[data-testid="tab-item"][data-tab-type="welcome"]'
  - assert_visible: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]'
  - assert_visible: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]'
  - eval_readonly:
      expression: Math.abs(document.querySelector('[data-window-drag]').getBoundingClientRect().height - innerHeight) < 1
      expect_truthy: true
  - screenshot: main-rail-welcome.png

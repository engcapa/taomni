    - step: 23
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"]"}'
    - step: 24
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail-sessions\"]", "name": "aria-pressed",

    - step: 27
      expectation: '{"wait_for": "[data-testid=\"sidebar-rail-menu-show-names\"]"}'
    - step: 29
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-sessions\"]", "equals":
        ""}}'
    - step: 30

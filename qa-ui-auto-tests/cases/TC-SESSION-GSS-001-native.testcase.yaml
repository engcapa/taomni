id: TC-SESSION-GSS-001
title: GSSAPI ticket authentication, real terminal command and SFTP subsystem
description: Navigate both attached and detached SFTP panes, including an address entered while the detached connection is initializing. Initial-directory restoration must not override the submitted path.
covers:
- F6.3
- F2.2
- F7.2
- F7.4
tags:
- session
- native
- regression
modes:
- native
fixtures:
- reset_db
- ssh_features_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 45
- click: '[data-testid="session-new"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    timeout_sec: 45
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh_features.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh_features.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh_features.user}
- click: '[data-testid="session-section-advanced"]'
- click: '[data-testid="session-auth-gssapi"]'
- click: '[data-testid="session-test-connection"]'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: SSH GSSAPI connection OK
    timeout_sec: 45
- click: '[data-testid="alert-dialog-ok"]'
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-gssapi
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-gssapi"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-gssapi"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: printf '\nQA_GSSAPI_TERMINAL_OK\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_GSSAPI_TERMINAL_OK\s*$
    timeout_sec: 45
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    timeout_sec: 45
- click: '[data-testid="sftp-remote-path-edit"]'
- wait_for: input[data-testid="sftp-remote-path"]
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: ${cfg.ssh_features.remote_dir}
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.ssh_features.remote_dir}
- press:
    selector: input[data-testid="sftp-remote-path"]
    key: Enter
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: scp-source.txt
    timeout_sec: 45
- click: '[data-testid="sftp-detach"]'
- switch_window:
    selector: '[data-testid="sftp-detached-window"]'
    timeout_sec: 60
- eval_readonly:
    expression: document.hasFocus()
    expect_truthy: true
    timeout_sec: 10
- click: '[data-testid="sftp-remote-path-edit"]'
- wait_for: input[data-testid="sftp-remote-path"]
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: ${cfg.ssh_features.remote_dir}
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.ssh_features.remote_dir}
- press:
    selector: input[data-testid="sftp-remote-path"]
    key: Enter
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: scp-source.txt
    timeout_sec: 45

id: TC-MAIL-IDLE-01
title: Mail picks up pushed mail through IMAP IDLE while open and drops IDLE on close
description: 'TASK-12 (docs-feature/mail-thunderbird-parity-design.md AC-36/AC-37).

  Opens a mail account through Quick Connect, waits for the IDLE watcher to be

  ready, delivers mail "from another client" without clicking Sync and requires

  the list to match the server within 15 seconds (push, not the 5-minute poll).

  Closing the tab must release the IDLE connection.

  Browser mode drives the stub server model (renderer orchestration only);

  native mode runs the real Tauri backend IDLE watcher against the in-process

  fake IMAP server started by the mail_server fixture.


  Shell v2: hide the mail owner before delivery, then reveal the exact ready account from Tao before acknowledgement.
  The original IDLE readiness, 15-second list sync and close-release assertions remain. Unread rows must
  match the independent server after notification acknowledgement (ack does not mark messages read). Maps
  V-B26/V-N13. Arrival notifications must be published after header catch-up without waiting for optional
  flags reconciliation; notification and independent unread-count assertions retain their original budgets.'
covers:
- F-MAIL-10
- F-MAIL-5
- F-TAO-1
- F-SHELL-1
tags:
- mail
- p1
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
    unread: true
- wait_for:
    selector: '[data-testid="mail-idle-status"][data-active="true"]'
    timeout_sec: 30
- mail_server_assert_idle_clients:
    equals: 1
    timeout_sec: 20
- click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- assert_not_visible: '[data-testid="mail-client-tab"]'
- mail_server_deliver:
    count: 3
    prefix: Pushed
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notifications"]'
- wait_for: '[data-testid="tao-alert-inbox-item"][data-target-kind="mail"]'
- assert_count:
    selector: '[data-testid="tao-alert-inbox-item"][data-target-kind="mail"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="tao-alert-inbox-item"][data-target-kind="mail"]'
    name: data-alert-count
    equals: '3'
- mail_server_assert_idle_clients:
    equals: 1
    timeout_sec: 10
- click: '[data-testid="tao-alert-inbox-item"][data-target-kind="mail"] [data-testid="tao-alert-jump"]'
- wait_for: '[data-testid="mail-client-tab"][data-ready="true"]'
- mail_server_assert_list_matches:
    timeout_sec: 15
    unread: true
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: Pushed 0003
    timeout_sec: 10
- screenshot: mail-idle-01-pushed.png
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notifications"]'
- assert_count:
    selector: '[data-testid="tao-alert-inbox-item"][data-target-kind="mail"]'
    equal: 0
- click: '[data-testid="shell-rail-tao"]'
- mail_server_assert_list_matches:
    timeout_sec: 15
    unread: true
- click: '[data-testid="tab-item"][data-tab-type="mail"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="mail-client-tab"]'
    state: detached
- mail_server_assert_idle_clients:
    equals: 0
    timeout_sec: 10
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: IDLE remains connected while the owner is hidden; exactly one aggregated count-3 alert
      reveals the ready mail account before acknowledgement. The list and unread rows match the independent
      server within 15 seconds, and close releases IDLE within 10 seconds.
    actions:
    - 2
    - 3
    - 5
    - 6
    - 11
    - 14
    - 15
    - 16
    - 21
    - 26
    - 27
    - 29
    - 31
    checkpoints:
    - step: 8
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60, "unread": true}}'
    - step: 10
      expectation: '{"mail_server_assert_idle_clients": {"equals": 1, "timeout_sec": 20}}'
    - step: 13
      expectation: '{"assert_not_visible": "[data-testid=\"mail-client-tab\"]"}'
    - step: 18
      expectation: '{"assert_count": {"selector": "[data-testid=\"tao-alert-inbox-item\"][data-target-kind=\"mail\"]",
        "equal": 1}}'
    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tao-alert-inbox-item\"][data-target-kind=\"mail\"]",
        "name": "data-alert-count", "equals": "3"}}'
    - step: 20
      expectation: '{"mail_server_assert_idle_clients": {"equals": 1, "timeout_sec": 10}}'
    - step: 23
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 15, "unread": true}}'
    - step: 24
      expectation: '{"assert_text": {"selector": "[data-testid=\"mail-client-tab\"]", "contains": "Pushed
        0003", "timeout_sec": 10}}'
    - step: 28
      expectation: '{"assert_count": {"selector": "[data-testid=\"tao-alert-inbox-item\"][data-target-kind=\"mail\"]",
        "equal": 0}}'
    - step: 30
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 15, "unread": true}}'
    - step: 33
      expectation: '{"mail_server_assert_idle_clients": {"equals": 0, "timeout_sec": 10}}'
    results:
    - 8
    - 10
    - 13
    - 18
    - 19
    - 20
    - 23
    - 24
    - 28
    - 30
    - 33
  visual:
  - check: Inspect unread counts, sync/IDLE status and the pushed subjects.
    method: manual
    reason: Screenshots require a verdict; independent server assertions establish functional state.
  native:
  - check: Real IMAP IDLE watcher, pushed-message synchronization, unread preservation and close release.
    method: automated
    reason: Native mode uses the real Tauri backend and local IMAP server; browser mode proves renderer
      orchestration only.

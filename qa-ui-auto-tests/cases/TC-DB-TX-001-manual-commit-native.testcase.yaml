id: TC-DB-TX-001-manual-commit-native
title: Native manual commit keeps writes pending until Commit or Rollback
description: 'DB-TX-001 V4. On a real MySQL/MariaDB session, switching the toolbar to Manual

  keeps an INSERT pending (Pending: 1); Rollback discards it (count 0), and a

  second INSERT followed by Commit persists it (count 1). Switching back to

  Auto with nothing pending needs no confirmation.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks;
  Settings uses its permanent Rail button. Original business checks are retained.'
covers:
- F-DB-1
tags:
- database
- sql
- transaction
- db-parity
- native-boundary
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- mysql_required
timeout_sec: 360
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-db-tx-password
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:

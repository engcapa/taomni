id: TC-012
title: Attached SFTP open-terminal-here changes the SSH working directory
covers: [F3.3, F7.4]
tags: [integration, legacy-imported, p1, sftp, ssh, terminal]
modes: [browser, native]
fixtures: [reset_db, ssh_required, sftp_required]
steps:
  - open: "${cfg.app.base_url}"
  # Reveal the QuickConnect bar without the in-bar app menu: that menu is
  # hidden on native macOS by design (native global menu). Seeding the
  # persisted visibility flag and reloading selects the same UI on all three
  # platforms; Menu-path coverage stays in the browser-only cases.
  - seed_storage:
      key: taomni.quickConnectVisible
      value: 'true'
  - reload_window: null
  - wait_for: '[data-testid="qc-input"]'
  - fill: {selector: "[data-testid=\"qc-input\"]", value: "ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}"}
  - click: "[data-testid=\"qc-submit\"]"
  - wait_for: "[data-testid=\"auth-prompt\"]"
  - fill: {selector: "[data-testid=\"auth-password\"]", value: "${env.QA_SSH_PASSWORD}"}
  - click: "[data-testid=\"auth-submit\"]"
  - wait_for: "[data-testid=\"terminal-pane\"]"
  - wait_for:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
      timeout_sec: 20
  - click: "[data-testid=\"attached-sftp-toggle\"]"
  - wait_for: "[data-testid=\"sftp-browser\"]"
  # The attached pane navigates to the SSH home on mount. Setting the path
  # while that first listing is still in flight lets the older response
  # overwrite the typed target (observed: breadcrumb reverts to home and
  # open-terminal-here cds to the wrong dir). Let the first listing settle,
  # then set + prove the target path; the assertion owns the postcondition.
  - wait_for:
      selector: '[data-testid="sftp-remote-list"] tbody tr'
      timeout_sec: 30
  # Click the segment container, whose separator area enters path edit mode.
  - click: '[data-testid="sftp-remote-path"] > span:last-child > svg'
  - wait_for: 'input[data-testid="sftp-remote-path"]'
  - fill: {selector: "[data-testid=\"sftp-remote-path\"]", value: "${cfg.sftp.remote_test_dir}"}
  - press: Enter
  - wait: 1
  # Click the segment container, whose separator area enters path edit mode.
  - click: '[data-testid="sftp-remote-path"] > span:last-child > svg'
  - wait_for: 'input[data-testid="sftp-remote-path"]'
  - fill: {selector: "[data-testid=\"sftp-remote-path\"]", value: "${cfg.sftp.remote_test_dir}"}
  - press: Enter
  - assert_text:
      selector: '[data-testid="sftp-remote-path"]'
      contains: "temp"
      timeout_sec: 15
  - click: "[data-testid=\"sftp-remote-open-terminal-here\"]"
  - wait: 3
  - type:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
      text: pwd
  - press: Enter
  - wait: 2
  - assert_text: {selector: "[data-testid=\"terminal-pane\"]", contains: "${fixture.sftp_shell_test_dir}"}
  - screenshot: 012-sftp-open-terminal-here.png

verification:
  review: reviewed
  requirements:
  - id: ED-PARITY-007-V3-01-direct
    requirement: Ctrl+Alt+M on the E1 selection runs the single method candidate directly (no candidate menu), prompts in the Extract Method dialog with the provider default name fully selected, and produces
      B1 on the buffer and on disk.
    actions:
    - 19
    checkpoints:
    - step: 33
      expectation: Exactly one code-action request and one resolve; no second candidate and no rename were involved.
    - step: 32
      expectation: No frozen candidate menu is present.
    - step: 2
      expectation: The naming dialog opened directly (Extract Method TextInputDialog).
    - step: 26
      expectation: The provider default name is present and fully selected in the input.
    - step: 27
      expectation: The buffer is the extracted B1 with the call site and the new method.
    results:
    - 33
    - 2
    - 26
    - 27
  - id: ED-PARITY-007-V3-01-naming
    requirement: Enter renames both the call site and the declaration, and two editor undos then redos walk B2 -> B1 -> B0 -> B1 -> B2 without an undo confirmation.
    actions:
    - 30
    checkpoints:
    - step: 32
      expectation: The committed buffer is B2 with sumOf in the declaration and the call site.
    - step: 33
      expectation: The naming step issued exactly one provider prepare and rename.
    - step: 38
      expectation: The first editor undo returns B1 with no undo confirmation.
    - step: 41
      expectation: The second undo returns the initial B0.
    - step: 47
      expectation: Redo restores B1 and then B2.
    - step: 37
      expectation: No undo confirmation dialog appears for the editor undo.
    results:
    - 32
    - 38
    - 41
    - 47
    - 37
  - id: ED-PARITY-007-V3-01-cancel
    requirement: Escape and the mouse Cancel keep the provider default name, leaving exactly one extraction history entry that one undo reverts.
    actions:
    - 73
    checkpoints:
    - step: 65
      expectation: Escape leaves B1 with the default name and no extra rename.
    - step: 72
      expectation: One undo after the Escape path returns B0.
    - step: 87
      expectation: Cancel keeps the default name and adds no rename.
    - step: 91
      expectation: One undo after the Cancel path returns B0.
    results:
    - 65
    - 72
    - 87
    - 91
  - id: ED-PARITY-007-V3-01-validation
    requirement: A provider-rejected name keeps the committed B1 and the user input, and a corrected retry renames without repeating the extraction.
    actions:
    - 103
    checkpoints:
    - step: 107
      expectation: The dialog reopens with the rejected 1bad input preserved.
    - step: 108
      expectation: The committed buffer is still B1; the extraction was not repeated.
    - step: 113
      expectation: The corrected name commits B2.
    - step: 114
      expectation: Only rename requests grew; the code-action request count did not.
    results:
    - 107
    - 108
    - 113
    - 114
  visual:
  - check: Dialog geometry, disabled-confirm styling and the extracted call site against the IDEA reference.
    method: manual
    reason: Screenshots are artifacts; pixel comparison is separate.
  native:
  - check: Real JDT LS kind/resolve/edit, host disk bytes and post-save undo.
    method: external
    reason: The controlled browser provider cannot prove provider or disk behaviour; TC-IDE-PARITY-007-03 owns it.

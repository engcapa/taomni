id: TC-IDE-PARITY-011-01
title: 'IDEA editor surface: floating inspection widget, status-bar navigation bar,
  typed tab icon'
description: 'ED-PARITY-011 A1/A4 browser case: the permanent file-status row became
  a floating IDEA inspection widget inside the editor, the breadcrumbs render as the
  status-bar navigation bar (Alt+Home still focuses it) and editor tabs carry a file
  type badge.


  Mode: browser.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F25.5
tags:
- code-workspace
- ed-parity-011
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) +
      "\"code-workspace-editor\"]").contains(document.querySelector("[data-testid"
      + String.fromCharCode(61) + "\"code-workspace-file-status\"]"))
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) +
      "\"status-bar\"]")?.contains(document.querySelector("[data-testid" + String.fromCharCode(61)
      + "\"code-workspace-breadcrumbs\"]")) === true
    expect_truthy: true
- assert_count:
    selector: '[data-testid="code-workspace-editor-pane"] [data-testid="code-workspace-breadcrumbs"]'
    equal: 0
- assert_text:
    selector: '[data-testid="code-workspace-breadcrumbs"]'
    contains: README.txt
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Alt+Home
- eval_readonly:
    expression: '!!document.activeElement?.closest("[data-testid"+String.fromCharCode(61)+"\"code-workspace-breadcrumbs\"]")'
    expect_truthy: true
- press: Escape
- assert_attribute:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"]
      [data-file-type]'
    name: data-file-type
    equals: generic
- screenshot: tc-ide-parity-011-01-surface.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A4/DEC-011-01：文件状态改为编辑区内浮动检查 widget，编辑区上方不再有常驻信息条。
    actions:
    - 11
    checkpoints:
    - step: 13
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\"[data-testid\"
        + String.fromCharCode(61) + \"\\\"code-workspace-editor\\\"]\").contains(document.querySelector(\"[data-testid\"
        + String.fromCharCode(61) + \"\\\"code-workspace-file-status\\\"]\"))", "expect_truthy":
        true}}'
    results:
    - 13
  - id: R2
    requirement: A1/DEC-011-02：导航栏（Breadcrumbs）在状态栏，编辑区顶部无 breadcrumb 行；Alt+Home 仍进入导航栏。
    actions:
    - 18
    checkpoints:
    - step: 14
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\"[data-testid\"
        + String.fromCharCode(61) + \"\\\"status-bar\\\"]\")?.contains(document.querySelector(\"[data-testid\"
        + String.fromCharCode(61) + \"\\\"code-workspace-breadcrumbs\\\"]\")) ===
        true", "expect_truthy": true}}'
    - step: 15
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-editor-pane\"]
        [data-testid=\"code-workspace-breadcrumbs\"]", "equal": 0}}'
    - step: 16
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-breadcrumbs\"]",
        "contains": "README.txt"}}'
    - step: 19
      expectation: '{"eval_readonly": {"expression": "!!document.activeElement?.closest(\"[data-testid\"+String.fromCharCode(61)+\"\\\"code-workspace-breadcrumbs\\\"]\")",
        "expect_truthy": true}}'
    results:
    - 14
    - 15
    - 19
  - id: R3
    requirement: A1/DEC-011-05：tab 带文件类型图标。
    actions:
    - 11
    checkpoints:
    - step: 21
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"]
        [data-active=\"true\"] [data-file-type]", "name": "data-file-type", "equals":
        "generic"}}'
    results:
    - 21
  visual:
  - check: 检查 widget 与 tab 胶囊/图标需对照 IDEA idea-03/idea-29。
    method: manual
    reason: 像素/字体按 DEC-ALIGN-06 另行比较。
  native:
  - check: 本卡断言均为 renderer 行为。
    method: not-applicable
    reason: 无 native 专有边界。

id: TC-IDE-C2-11-completion-retained-behavior
title: "Completion retained behavior across repeated typing cycles"
description: |
  Verifies RT-22..23 retained behavior. Repeated completion invocations, selections,
  and undos remain performant and stable without leaking timers or causing popup
  state degradation.
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, retained-behavior, browser-gate, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 180
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  - dblclick: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete'
      timeout_sec: 10
  - press: "Enter"
  - wait_for:
      selector: '[data-testid="code-workspace-editor"]'
      timeout_sec: 10
  - press: "Control+z"
  - press: "Enter"
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete'
      timeout_sec: 10
  - press: "Tab"
  - wait_for:
      selector: '[data-testid="code-workspace-editor"]'
      timeout_sec: 10
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "System.out.println"
  - screenshot: tc-ide-c2-11-retained-behavior.png

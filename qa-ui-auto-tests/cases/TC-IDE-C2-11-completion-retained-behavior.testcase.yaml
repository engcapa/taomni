id: TC-IDE-C2-11-completion-retained-behavior
title: "Completion retained behavior across repeated typing cycles"
description: |
  Browser verification for repeated completion typing, selection, and single undo
  cycles across multiple rounds.
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, retained-behavior, browser-gate, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 180
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - click: '[data-testid="code-workspace-tree-new-file"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - fill:
      selector: '[data-testid="text-input-dialog"] input'
      value: "App.java"
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  # Round 1: sout + Enter + undo
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete li'
      timeout_sec: 10
  - wait: 0.5
  - press: "ArrowDown"
  - press: "ArrowUp"
  - assert_text:
      selector: '.cm-tooltip-autocomplete [aria-selected="true"]'
      contains: "sout"
  - press: "Enter"
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: "System.out.println();"
  - press: "Control+z"
  - eval_readonly:
      expression: 'document.querySelector(".cm-content").textContent === "sout"'
      expect_truthy: true
  - press: "Enter"
  # Round 2: soutm + Enter + undo
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete li'
      timeout_sec: 10
  - wait: 0.5
  - press: "ArrowDown"
  - assert_text:
      selector: '.cm-tooltip-autocomplete [aria-selected="true"]'
      contains: "soutm"
  - press: "Enter"
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: "System.out.println("
  - press: "Control+z"
  - screenshot: tc-ide-c2-11-retained-behavior.png

id: TC-027
title: SFTP file table sorts by column header click
covers:
- F7.2
tags:
- columns
- legacy-imported
- p1
- sftp
- sorting
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 4
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: mkdir -p '${cfg.sftp.remote_test_dir}/qa-sort-TC027/folder' && printf abc > '${cfg.sftp.remote_test_dir}/qa-sort-TC027/a.log'
      && printf b > '${cfg.sftp.remote_test_dir}/qa-sort-TC027/b.txt' && printf cc > '${cfg.sftp.remote_test_dir}/qa-sort-TC027/c.csv'
      && touch -t 202001030000 '${cfg.sftp.remote_test_dir}/qa-sort-TC027/a.log' && touch -t 202001020000 '${cfg.sftp.remote_test_dir}/qa-sort-TC027/b.txt'
      && touch -t 202001010000 '${cfg.sftp.remote_test_dir}/qa-sort-TC027/c.csv' && printf '\nQA_SORT_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_SORT_READY\r?$
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-pane"]'
- click: '[data-testid="sftp-remote-path"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}/qa-sort-TC027
- press: Enter
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - a.log
    - b.txt
    - c.csv
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-name"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - c.csv
    - b.txt
    - a.log
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-name"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - a.log
    - b.txt
    - c.csv
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-size"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - b.txt
    - c.csv
    - a.log
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-size"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - a.log
    - c.csv
    - b.txt
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-modified"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - c.csv
    - b.txt
    - a.log
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-modified"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - a.log
    - b.txt
    - c.csv
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-type"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - c.csv
    - a.log
    - b.txt
- click: '[data-testid="sftp-remote-pane"] [data-testid="col-header-type"]'
- assert_items:
    selector: '[data-testid="sftp-remote-pane"] tr[data-row] td:first-child > div > span:first-of-type'
    equals:
    - folder
    - b.txt
    - a.log
    - c.csv
- screenshot: 027-sftp-column-sort.png

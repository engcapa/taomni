id: TC-SHELL-B21
title: Git promotion and docking retain the same complete commit draft
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b21.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F25.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - ''
- click: '[data-testid="code-workspace-git-panel-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- fill:
    selector: textarea[placeholder="Commit message"]:visible
    value: SHELL-PROMOTED-DRAFT
- click: '[data-testid="shell-host-more"]'
- click: '[data-testid="shell-panel-promote"]'
- assert_not_visible: '[data-testid="shell-host"]'
- wait_for: textarea[placeholder="Commit message"]:visible
- assert_value:
    selector: textarea[placeholder="Commit message"]:visible
    equals: SHELL-PROMOTED-DRAFT
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 3
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="git"]'
    equal: 1
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Escape
- assert_not_visible: '[data-testid="shell-overview"]'
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-cancel"]'
- assert_value:
    selector: textarea[placeholder="Commit message"]:visible
    equals: SHELL-PROMOTED-DRAFT
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-dock"]'
- click: '[data-testid="shell-close-confirm"]'
- wait_for: '[data-testid="shell-host"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-edge
    equals: bottom
- assert_value:
    selector: textarea[placeholder="Commit message"]:visible
    equals: SHELL-PROMOTED-DRAFT
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 2
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="git"]'
    equal: 0
- screenshot: tc-shell-b21.png

  visual:
  - check: Text, menu and result layout
    method: automated
    reason: Geometry, font style, visible states and retained screenshots establish the described renderer layout.
  native:
  - check: Packaged WebView, OS capture and clipboard
    method: external
    reason: Native SHOT-N3 and N12 exercise real capture/clipboard and three packaged WebViews. Browser stubs do not establish
      OS behavior.

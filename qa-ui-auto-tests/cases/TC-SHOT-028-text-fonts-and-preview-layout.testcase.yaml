id: TC-SHOT-028
title: Multiline text font controls and recording menu layout
covers:
- F27.1
tags:
- screenshot
- text
- layout
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-tool-text"]'
- select_option:
    selector: '[data-testid="screenshot-font-family"]'
    value: monospace
- fill:
    selector: '[data-testid="screenshot-font-size"]'
    value: '32'
- assert_visible: '[data-testid="screenshot-text-hint"]'
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position:
      x: 120
      y: 120
- fill:
    selector: '[data-testid="screenshot-text-input"]'
    value: Alpha
- press:
    key: End
    selector: '[data-testid="screenshot-text-input"]'
- press:
    key: Enter
    selector: '[data-testid="screenshot-text-input"]'
- type:
    selector: '[data-testid="screenshot-text-input"]'
    text: Beta
- assert_attribute:
    selector: '[data-testid="screenshot-text-input"]'
    name: value
    equals: 'Alpha

      Beta'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '0'
- eval_readonly:
    expression: getComputedStyle(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-text-input\"]")).fontFamily.includes("monospace")
      && getComputedStyle(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-text-input\"]")).fontSize
      === "32px"
- screenshot: multiline-text-editor.png
- press:
    key: Mod+Enter
    selector: '[data-testid="screenshot-text-input"]'
- assert_not_visible: '[data-testid="screenshot-text-input"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- click: '[data-testid="screenshot-tool-move"]'
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position:
      x: 130
      y: 165
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-selection"]'
    name: data-kind
    equals: text
- select_option:
    selector: '[data-testid="screenshot-font-family"]'
    value: serif
- fill:
    selector: '[data-testid="screenshot-font-size"]'
    value: '24'
- click: '[data-testid="screenshot-undo"]'
- assert_attribute:
    selector: '[data-testid="screenshot-font-size"]'
    name: value
    equals: '32'
- click: '[data-testid="screenshot-redo"]'
- assert_attribute:
    selector: '[data-testid="screenshot-font-size"]'
    name: value
    equals: '24'
- dblclick:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position:
      x: 130
      y: 150
- assert_attribute:
    selector: '[data-testid="screenshot-text-input"]'
    name: value
    equals: 'Alpha

      Beta'
- eval_readonly:
    expression: getComputedStyle(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-text-input\"]")).fontFamily.includes("serif")
      && getComputedStyle(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-text-input\"]")).fontSize
      === "24px"
- fill:
    selector: '[data-testid="screenshot-text-input"]'
    value: 'Alpha

      Edited'
- click: '[data-testid="screenshot-tool-rect"]'
- assert_not_visible: '[data-testid="screenshot-text-input"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- click: '[data-testid="screenshot-record"]'
- assert_element_geometry:
    selector: '[data-testid="screenshot-record-menu"]'
    min_width: 300
    min_height: 100
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-menu\"]").getBoundingClientRect().left
      >= 0
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-menu\"]").getBoundingClientRect().right
      <= innerWidth
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-menu\"]").getBoundingClientRect().top
      >= 0
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-menu\"]").getBoundingClientRect().bottom
      <= innerHeight
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-hint\"]").getBoundingClientRect().height
      < 180
- screenshot: record-menu-readable.png
- press: Escape
- assert_not_visible: '[data-testid="screenshot-record-menu"]'
- set_viewport:
    width: 540
    height: 500
- click: '[data-testid="screenshot-record"]'
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-menu\"]").getBoundingClientRect().width
      >= 300
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-menu\"]").getBoundingClientRect().left
      >= 0
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-record-menu\"]").getBoundingClientRect().bottom
      <= innerHeight
- assert_visible: '[data-testid="screenshot-record-gif"]'
- assert_visible: '[data-testid="screenshot-record-mp4"]'
- screenshot: record-menu-narrow-window.png
- press: Escape
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="system-screenshot"]'

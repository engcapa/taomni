id: TC-MFA-002
title: Secret-key HOTP account shows RFC 4226 codes, copies them and keeps its counter
description: V-11 (AC-03, AC-09, AC-10). Browser stub (localStorage + WebCrypto). The RFC 4226 test key is entered
  in lowercase groups with the advanced HOTP type; the row shows 755 224 with its group. The copy button and the
  code itself both put the digits on the clipboard and announce it; Next advances to 287 082, which survives a page
  reload.
covers:
- F-MFA-1
- F-MFA-2
tags:
- mfa
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-master-002
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-master-002
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill:
    selector: '[data-testid="mfa-add-issuer"]'
    value: QA Bank
- fill:
    selector: '[data-testid="mfa-add-account"]'
    value: qa.hotp@example.com
- fill:
    selector: '[data-testid="mfa-add-secret"]'
    value: gezd gnbv gy3t qojq gezd gnbv gy3t qojq
- fill:
    selector: '[data-testid="mfa-add-group"]'
    value: Banking
- click: '[data-testid="mfa-add-advanced"]'
- wait_for: '[data-testid="mfa-add-advanced-panel"]'
- select_option:
    selector: '[data-testid="mfa-add-kind"]'
    value: hotp
- fill:
    selector: '[data-testid="mfa-add-counter"]'
    value: '0'
- click: '[data-testid="mfa-add-submit"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 755 224
- assert_attribute:
    selector: '[data-testid="mfa-account-row"][data-issuer="QA Bank"]'
    name: data-kind
    equals: hotp
- assert_text_equals:
    selector: '[data-testid="mfa-account-group"]'
    equals: Banking
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Added 1 account
- click: '[data-testid="mfa-account-copy"]:is([data-issuer="QA Bank"] *)'
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Copied QA Bank
- eval_readonly:
    expression: navigator.clipboard.readText()
    contains: '755224'
- click: '[data-testid="mfa-account-hotp-next"]:is([data-issuer="QA Bank"] *)'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 287 082
- click: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
- eval_readonly:
    expression: navigator.clipboard.readText()
    contains: '287082'
- reload: null
- wait_for: '[data-testid="app-main-menu"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-mfa"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 287 082
- screenshot: mfa-002-hotp-row.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: A Base32 key typed in lowercase groups with the HOTP type and a group creates a row showing the
      RFC 4226 counter-0 code (AC-03, AC-09).
    actions:
    - 2
    - 3
    - 13
    - 15
    - 16
    - 17
    - 18
    - 19
    - 21
    - 22
    - 23
    checkpoints:
    - step: 14
      expectation: add dialog in secret mode
    - step: 20
      expectation: advanced options expanded
    - step: 24
      expectation: dialog closed after submit
    - step: 25
      expectation: code 755 224
    - step: 26
      expectation: row kind is hotp
    - step: 27
      expectation: group pill Banking
    - step: 28
      expectation: status announces one added account
    results:
    - 25
    - 26
    - 27
    - 28
  - id: R2
    requirement: The copy button and the code button both copy the digits without the display space and announce
      it (AC-10).
    actions:
    - 29
    - 34
    checkpoints:
    - step: 30
      expectation: status announces the copy
    - step: 31
      expectation: clipboard holds 755224
    - step: 35
      expectation: clipboard holds 287082 after clicking the code
    results:
    - 35
  - id: R3
    requirement: Next advances the HOTP counter to 287 082 and the counter persists across a reload (AC-09).
    actions:
    - 32
    - 36
    - 38
    - 39
    - 40
    checkpoints:
    - step: 33
      expectation: code 287 082 after Next
    - step: 37
      expectation: app shell back after reload
    - step: 41
      expectation: still 287 082 after reopening the tab
    results:
    - 41
  - id: workspace-navigation
    requirement: Explicit navigation preserves access to the original workflow in the Workspace-first shell.
    actions:
    - 2
    - 3
    checkpoints:
    - step: 41
      expectation: The original final visible result remains reachable after the navigation migration.
    results:
    - 41
  visual:
  - check: Row layout (pin, issuer, account, group, code, Next, copy, menu) is unclipped in the screenshot.
    method: manual
    reason: Pixel layout needs human review.
  native:
  - check: Rust HOTP, mfa.db persistence and the OS clipboard are proven by TC-MFA-101 and TC-MFA-104.
    method: external
    reason: The browser stub mirrors the backend but is not native evidence.

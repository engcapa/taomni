id: TC-IDE-AUDIT-003-replace-conflict-ledger-native
title: Replace conflict guard and real applier ledger in packaged app
description: "§ED-AUDIT-003 A2 native gate case. Proves the replace-in-files commit\nagainst a real disposable workspace_root\
  \ with deterministic fault\ninjections on both applier paths:\n\n1. Closed-file path, external change between\
  \ preview and commit\n   (host_write_file rewrites the matched file while no editor tab is\n   open): the pre-commit\
  \ freshness recheck blocks with \"changed since\n   search\", the preview stays open, and the disk bytes are provably\n\
  \   untouched (exact SHA-256); restoring the bytes makes the same frozen\n   plan commit, and one workspace undo\
  \ reverts the disk.\n2. Open-buffer path, unwritable workspace directory (native_set_writable\n   removes owner-write\
  \ from the root, so the writer's temp file cannot be\n   created): the applier's open-clean save genuinely fails,\
  \ the resume\n   dialog appears, declining it leaves the real ledger — \"Replace\n   blocked, nothing applied\"\
  \ — the preview stays open, and the disk bytes\n   are provably untouched. No workspace-edit history is registered\
  \ by the\n   failed run.\n3. Recovery: restoring directory write permission and saving the dirty\n   buffer (Ctrl+S)\
  \ lands the intended bytes; a following Ctrl+Z is a\n   no-op, proving the failed run registered zero workspace-edit\
  \ history\n   while the successful paths above each undid with exactly one step.\n\nHighest claim on green: L2\
  \ provider-backed (Linux). Preview exclusion and\ncancel are covered by unit tests and the browser gate (TC-IDE-D2-01).\n"
covers:
- F25.5
tags:
- code-workspace
- ide-find
- replace
- native-gate
- p1
modes:
- native
native_platforms:
- Linux
fixtures:
- reset_db
- workspace_root
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-audit003","name":"qa-root","roots":[{"id":"qa-root","name":"qa-root","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-root","path":"notes.txt"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: scratch notes
    timeout_sec: 60
- click: '[data-testid="code-workspace-bottom-tab-search"]'
- wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
- click: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"] button[title="Close"]'
- assert_not_visible: '[data-testid="code-workspace-editor-tab-strip"]'
- fill:
    selector: '[aria-label="Search query"]'
    value: scratch
- press: Enter
- click: '[data-testid="code-workspace-find-run-search"]'
- assert_text:
    selector: '[data-testid="code-workspace-find-in-files-panel"]'
    contains: notes.txt
    timeout_sec: 60
- fill:
    selector: '[aria-label="Replace text"]'
    value: snatch
- click: '[data-testid="code-workspace-find-replace-all"]'
- wait_for: '[data-testid="code-workspace-replace-preview"]'
- assert_text:
    selector: '[data-testid="code-workspace-replace-counts"]'
    contains: 1 of 1
    timeout_sec: 10
- host_write_file:
    path: ${fixture.workspace_root}/notes.txt
    text: ${fixture.workspace_notes_txt_external_text}
- click: '[data-testid="code-workspace-replace-commit"]'
- assert_text:
    selector: '[data-testid="code-workspace-replace-commit-error"]'
    contains: changed since search
    timeout_sec: 15
- wait_for: '[data-testid="code-workspace-replace-preview"]'
- assert_file_sha256:
    path: ${fixture.workspace_root}/notes.txt
    equals: ${fixture.workspace_notes_txt_external_sha256}
    timeout_sec: 10
- host_write_file:
    path: ${fixture.workspace_root}/notes.txt
    text: 'scratch notes

      '
- click: '[data-testid="code-workspace-replace-commit"]'
- assert_file_contains:
    path: ${fixture.workspace_root}/notes.txt
    contains: snatch notes
    timeout_sec: 30
- assert_not_visible: '[data-testid="code-workspace-replace-preview"]'
- fill:
    selector: '[aria-label="Search query"]'
    value: snatch
- press: Enter
- click: '[data-testid="code-workspace-find-run-search"]'
- assert_text:
    selector: '[data-testid="code-workspace-find-in-files-panel"]'
    contains: notes.txt
    timeout_sec: 60
- click: '[data-testid="code-workspace-find-match-row"]'
- press: Mod+z
- wait_for: '[data-testid="code-workspace-undo-confirm"]'
- click: '[data-testid="code-workspace-undo-confirm-ok"]'
- assert_text:
    selector: '[data-testid="status-bar-message"]'
    contains: Undid Replace in files
- assert_file_contains:
    path: ${fixture.workspace_root}/notes.txt
    contains: scratch notes
    timeout_sec: 30
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
- wait_for: '[data-testid="code-workspace-editor-tab-strip"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: scratch notes
    timeout_sec: 30
- fill:
    selector: '[aria-label="Search query"]'
    value: scratch
- press: Enter
- click: '[data-testid="code-workspace-find-run-search"]'
- assert_text:
    selector: '[data-testid="code-workspace-find-in-files-panel"]'
    contains: notes.txt
    timeout_sec: 60
- fill:
    selector: '[aria-label="Replace text"]'
    value: snatch
- click: '[data-testid="code-workspace-find-replace-all"]'
- wait_for: '[data-testid="code-workspace-replace-preview"]'
- assert_text:
    selector: '[data-testid="code-workspace-replace-counts"]'
    contains: 1 of 1
    timeout_sec: 10
- native_set_writable:
    path: ${fixture.workspace_root}
    writable: false
- click: '[data-testid="code-workspace-replace-commit"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: Retry
    timeout_sec: 15
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_text:
    selector: '[data-testid="code-workspace-replace-commit-error"]'
    contains: nothing applied
    timeout_sec: 15
- wait_for: '[data-testid="code-workspace-replace-preview"]'
- assert_file_sha256:
    path: ${fixture.workspace_root}/notes.txt
    equals: ${fixture.workspace_notes_txt_initial_sha256}
    timeout_sec: 10
- click: '[data-testid="code-workspace-replace-cancel"]'
- assert_not_visible: '[data-testid="code-workspace-replace-preview"]'
- native_set_writable:
    path: ${fixture.workspace_root}
    writable: true
- click: '[data-testid="code-workspace-editor"]'
- press: Mod+s
- assert_file_contains:
    path: ${fixture.workspace_root}/notes.txt
    contains: snatch notes
    timeout_sec: 30
- press:
    key: Mod+z
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- assert_file_contains:
    path: ${fixture.workspace_root}/notes.txt
    contains: snatch notes
    timeout_sec: 30
- screenshot: tc-ide-audit-003-replace-ledger.png

id: TC-SERVERS-003-tab-functional-native
title: Native Local servers HTTP server start/stop, log lifecycle, port Apply warning, and persistence inside singleton tab
description: >-
  Verifies end-to-end native Local servers functional behavior inside the in-app
  single `servers` tab across Linux, Windows, and macOS: opens via Global Command
  Palette, configures HTTP on 127.0.0.1:28489, starts the real in-process HTTP
  server and observes listening log output, preserves running status and live logs
  across Welcome tab switches, applies an updated port (28490) through on-demand
  vault setup and observes the restart warning, stops the server, clears logs,
  closes without a discard prompt, and reopens to verify persisted settings and
  cleared log state.
covers:
- F-Servers-1
tags:
- servers
- regression
modes:
- native
native_platforms:
- Linux
- Windows
- macOS
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 30
- click: '[data-testid="global-search-trigger"]'
- wait_for: '[data-testid="global-search-modal"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: Local servers
- click: '[data-testid="global-search-result"][data-result-id="servers"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 20
- assert_visible: '[data-testid="servers-tab-panel"]'
- assert_disabled: '[data-testid="server-log-clear"]'
- click: '[data-testid="server-row-http"]'
- wait_for: '[data-testid="server-field-bind-address"]'
- assert_attribute:
    selector: '[data-testid="server-row-http"]'
    name: data-status
    equals: stopped
- assert_disabled: '[data-testid="server-row-http-stop"]'
- fill:
    selector: '[data-testid="server-field-bind-address"]'
    value: 127.0.0.1
- fill:
    selector: '[data-testid="server-field-port"]'
    value: '28489'
- click: '[data-testid="server-row-http-start"]'
- wait_for:
    selector: '[data-testid="server-row-http"][data-status="running"]'
    timeout_sec: 20
- assert_enabled: '[data-testid="server-row-http-stop"]'
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: 127.0.0.1:28489
    timeout_sec: 10
- assert_enabled: '[data-testid="server-log-clear"]'
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- assert_visible: '[data-testid="welcome-panel"]'
- assert_not_visible: '[data-testid="servers-dialog"]'
- click: '[data-testid="tab-item"][data-tab-type="servers"]'
- wait_for: '[data-testid="servers-dialog"]'
- assert_attribute:
    selector: '[data-testid="server-row-http"]'
    name: data-status
    equals: running
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: 127.0.0.1:28489
    timeout_sec: 5
- fill:
    selector: '[data-testid="server-field-port"]'
    value: '28490'
- click: '[data-testid="servers-dialog-apply"]'
- wait_for:
    selector: '[data-testid="vault-setup-dialog"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-servers-vault-123
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-servers-vault-123
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="vault-setup-dialog"]'
    state: detached
    timeout_sec: 15
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: Restart server to apply port change
    timeout_sec: 10
- click: '[data-testid="server-row-http-stop"]'
- wait_for:
    selector: '[data-testid="server-row-http"][data-status="stopped"]'
    timeout_sec: 20
- assert_disabled: '[data-testid="server-row-http-stop"]'
- click: '[data-testid="server-log-clear"]'
- assert_disabled: '[data-testid="server-log-clear"]'
- click: '[data-testid="servers-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    state: detached
    timeout_sec: 10
- assert_not_visible: '[data-testid="confirm-dialog"]'
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="global-search-trigger"]'
- wait_for: '[data-testid="global-search-modal"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: Local servers
- click: '[data-testid="global-search-result"][data-result-id="servers"]'
- wait_for: '[data-testid="servers-dialog"]'
- click: '[data-testid="server-row-http"]'
- wait_for: '[data-testid="server-field-port"]'
- assert_attribute:
    selector: '[data-testid="server-field-port"]'
    name: value
    equals: '28490'
- assert_attribute:
    selector: '[data-testid="server-field-bind-address"]'
    name: value
    equals: 127.0.0.1
- assert_attribute:
    selector: '[data-testid="server-row-http"]'
    name: data-status
    equals: stopped
- assert_disabled: '[data-testid="server-log-clear"]'
- click: '[data-testid="tab-item"][data-tab-type="servers"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    state: detached
    timeout_sec: 10
- assert_visible: '[data-testid="welcome-panel"]'
- assert_no_runtime_errors: null

  visual:
  - check: HTTP server configuration, running status and server log output render inside the single servers tab on Linux, Windows and macOS.
    method: not-applicable
    reason: Verified natively across desktop WebViews through live control state, port binding, and layout visibility checks rather than static screenshot diffing.
  native:
  - check: Real Tauri server_configs persistence, built-in TCP/HTTP bind and shutdown, and live event streaming across tab lifecycle.
    method: automated
    reason: Exercises real Rust HTTP ServerRegistry, SQLite persistence, and OS socket lifecycle in packaged native builds.

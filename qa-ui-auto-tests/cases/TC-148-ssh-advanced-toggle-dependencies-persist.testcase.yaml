id: TC-148
title: SSH advanced toggles enforce dependencies and persist after reopen
covers:
- F3.2
- F6.3
tags:
- ssh
- session
- settings
- advanced
- persistence
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-advanced-dependencies.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-advanced-dependencies
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-compression-toggle"]'
    name: data-checked
    equals: 'false'
- set_check:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'false'
- assert_disabled: '[data-testid="session-x11-trusted-toggle"]'
- set_check:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    checked: true
- assert_enabled: '[data-testid="session-x11-trusted-toggle"]'
- set_check:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    name: data-checked
    equals: 'false'
- set_check:
    selector: '[data-testid="session-compression-toggle"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="session-compression-toggle"]'
    name: data-checked
    equals: 'true'
- select_option:
    selector: '[data-testid="session-remote-environment"]'
    label: Custom command…
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: Custom command…
- fill:
    selector: 'input[aria-label="Execute command"]'
    value: printf qa-ssh-advanced-toggle
- set_check:
    selector: '[data-testid="session-do-not-exit"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-do-not-exit"]'
    name: data-checked
    equals: 'false'
- select_option:
    selector: '[data-testid="session-ssh-browser-type"]'
    label: Disabled
- assert_attribute:
    selector: '[data-testid="session-ssh-browser-type"]'
    name: value
    equals: Disabled
- click: '[data-testid="session-auth-privatekey"]'
- assert_attribute:
    selector: '[data-testid="session-private-key-toggle"]'
    name: data-checked
    equals: 'true'
- assert_enabled: 'input[aria-label="Private key path"]'
- fill:
    selector: 'input[aria-label="Private key path"]'
    value: /tmp/qa-ssh-advanced-toggle-key
- click: '[data-testid="session-auth-password"]'
- assert_count:
    selector: '[data-testid="session-auth-password"]:checked'
    equal: 1
- assert_disabled: 'input[aria-label="Private key path"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-advanced-dependencies
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-advanced-dependencies"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-advanced-dependencies"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-compression-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: Custom command…
- assert_attribute:
    selector: 'input[aria-label="Execute command"]'
    name: value
    equals: printf qa-ssh-advanced-toggle
- assert_attribute:
    selector: '[data-testid="session-do-not-exit"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-ssh-browser-type"]'
    name: value
    equals: Disabled
- assert_count:
    selector: '[data-testid="session-auth-password"]:checked'
    equal: 1
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 148-ssh-advanced-toggle-dependencies.png

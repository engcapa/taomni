id: TC-SHOT-009
title: Number markers place incrementing circled numbers and support undo
covers:
- F27.1
tags:
- screenshot
- annotate
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
# Number tool (Flameshot-style): each click places the next circled number.
- click: '[data-testid="screenshot-tool-number"]'
- wait: 1
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 100, y: 100}
    to_position: {x: 101, y: 101}
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 200, y: 150}
    to_position: {x: 201, y: 151}
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 300, y: 200}
    to_position: {x: 301, y: 201}
# Three markers placed: undo is enabled and removes them one by one.
- assert_enabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-undo"]'
- assert_enabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-undo"]'
- assert_disabled: '[data-testid="screenshot-undo"]'
# Redo restores the markers.
- click: '[data-testid="screenshot-redo"]'
- assert_enabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-cancel"]'
- wait_for:
    selector: '[data-testid="system-screenshot"]'

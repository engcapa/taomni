    key: Escape
- assert_not_visible: '[data-testid="vault-setup-dialog"]'
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: empty
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-dock-more"]'
- assert_visible: '[data-testid="tao-home-dock-settings"]'
- press: Escape
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: vault
- click: '[data-testid="vault-init-button"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-home-vault-037
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-home-vault-037
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="vault-lock-button"]'
- click: '[data-testid="vault-unlock-mode-startup"]'
- click: '[data-testid="vault-lock-button"]'
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: locked
- reload_window: null
- wait_for: '[data-testid="vault-unlock-dialog"]'
- assert_visible: '[data-testid="vault-unlock-cancel"]'
- click: '[data-testid="vault-unlock-cancel"]'
- assert_not_visible: '[data-testid="vault-unlock-dialog"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-history"]'
- assert_visible: '[data-testid="tao-home-history-popover"]'
- press: Escape
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: vault
- assert_text:
    selector: '[data-testid="vault-state-badge"]'
    contains: locked
- assert_localstorage:

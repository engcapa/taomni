id: TC-TAO-HOME-037
title: Vault setup and startup unlock can be cancelled without blocking Home
description: A fresh profile can use Home without configuring a master password. Open
  and cancel Vault setup by button and Escape, then initialize and lock via Settings.
  Reload with startup mode and cancel the unlock overlay. Home remains usable while
  the Vault stays locked and MFA still requires explicit unlock. Verify a later explicit
  unlock succeeds. Native establishes actual vault state and reload; browser verifies
  matching renderer transitions with its vault stub.
modes:
- browser
- native
covers:
- F1.11
- F12.1
- F-MFA-1
tags:
- p0
- tao-home
- regression
- vault
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="tao-home-new-chat"]'
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- assert_not_visible: '[data-testid="vault-setup-dialog"]'
- click: '[data-testid="tao-home-new-chat"]'
- click: '[data-testid="tao-home-history"]'
- wait_for: '[data-testid="tao-home-history-popover"]'
- press: Escape
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: vault
- wait_for: '[data-testid="vault-init-button"]'
- assert_text:
    selector: '[data-testid="vault-state-badge"]'

id: TC-SHELL-B02
title: Home draft, external save failure and local launch retry
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b02.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.6
- F1.4
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-new-session"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-draft
- fill:
    selector: '[data-testid="session-host"]'
    value: draft.invalid
- click: '[data-testid="session-cancel"]'
- assert_not_visible: '[data-testid="session-editor"]'
- click: '[data-testid="welcome-new-session"]'
- assert_value:
    selector: '[data-testid="session-name"]'
    equals: qa-draft
- shell_backend_scenario:
    command: save_session
    action: fail-next
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-save-error"]'
- assert_visible: '[data-testid="session-editor"]'
- assert_value:
    selector: '[data-testid="session-name"]'
    equals: qa-draft
- click: '[data-testid="session-save"]'
- assert_not_visible: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-search"]'
    value: qa-draft
- assert_count:
    selector: '[data-testid="session-tree-item"][data-session-name="qa-draft"]'
    equal: 1
- assert_shell_backend:
    command: save_session
    count: 2
    status: requested
- shell_backend_scenario:
    command: create_local_terminal
    action: fail-next
- click: '[data-testid="welcome-open-local-terminal"]'
- click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="shell-home-launch-status"]'
- assert_attribute:
    selector: '[data-testid="shell-home-launch-status"]'
    name: data-state
    equals: failed
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-rail-home"]'
- assert_attribute:
    selector: '[data-testid="shell-home-launch-status"]'
    name: data-state
    equals: started
- assert_shell_backend:
    command: create_local_terminal
    count: 2
    status: requested
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="terminal"]'
    equal: 1
- screenshot: tc-shell-b02.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Cancelling a new connection retains its draft; a rejected save preserves
      the form and retry creates exactly one record.
    actions:
    - 3
    - 5
    - 6
    - 7
    - 8
    - 10
    - 12
    - 13
    - 17
    - 19
    checkpoints:

      expectation: Cancelling a new connection retains its draft; a rejected save
        preserves the form and retry creates exactly one record.
    - step: 9
      expectation: Cancelling a new connection retains its draft; a rejected save
        preserves the form and retry creates exactly one record.
    - step: 11
      expectation: Cancelling a new connection retains its draft; a rejected save
        preserves the form and retry creates exactly one record.

id: TC-IDE-IMPROVE-002-workflow-recovery-native
title: Rearrange workflow postcondition/undo and seeded v2 journal reopen recovery
description: "ED-IMPROVE-002 native gate case. Crosses the real packaged-app boundary on\nLinux with a live JDT\
  \ LS provider and proves the workflow transaction\ncontract added for Rearrange Code:\n\n1. A1/history: a real\
  \ source.sortMembers rearrange applies exactly one\n   transaction through the production UI entry; the shared\
  \ editor undo\n   names the Rearrange Code journal entry and restores the preimage, the\n   redo reapplies the\
  \ same whole transaction, a second undo returns to the\n   preimage, and a save proves the exact original disk\
  \ bytes (sha256\n   68142fea...).\n2. A2/native restart: a seeded v2 recovery journal (status=prepared)\n   describing\
  \ the workflow action is discovered after `reload_window`\n   destroys the JS context, the \"Refactor recovery\
  \ pending\" dialog names\n   the affected file, and \"Restore pre-refactor content\" independently\n   re-reads\
  \ and restores the preimage (host sha256 assertion). The entry\n   is then promoted to `rolled-back` and a further\
  \ reload proves the\n   already-restored entry is idempotent (no dialog, no rewrite).\n3. A2/conflict: a second\
  \ seeded workflow journal with a distinct postimage\n   is blocked after a real third-party host write; the \"\
  Refactor recovery\n   blocked\" dialog reports the conflict and the host bytes stay untouched.\n   Host-writing\
  \ the expected postimage then allows the restore to complete.\n\nHighest claim on green: L2 native + provider-backed\
  \ (Linux), packaged app\nUI over a real jdtls process, real disk bytes. IDEA comparison (required\nkind) is recorded\
  \ separately as unrun on this box — no IDEA 2026.2.x.\n"

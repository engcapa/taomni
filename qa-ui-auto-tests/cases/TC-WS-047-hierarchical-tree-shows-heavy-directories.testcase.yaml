id: TC-WS-047
title: Hierarchical workspace tree shows heavy directories without false Empty rows
description: The file explorer keeps dependency and build directories visible in its normal tree/list views. Recursive package and flat indexing may skip their contents for performance, but a parent containing only those directories must never be rendered as Empty.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_hidden_entries
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-heavy-tree
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="packages"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="packages"] [data-testid="code-workspace-tree-dir-arrow"]'
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="packages/node_modules"]'
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="packages/target"]'
- eval_readonly:
    expression: '!document.querySelector(''[data-testid''+String.fromCharCode(61)+''"code-workspace-tree"]'')?.textContent?.includes(''Empty'')'
    expect_truthy: true
- click: '[data-testid="code-workspace-tree-dir"][data-path="packages/node_modules"] [data-testid="code-workspace-tree-dir-arrow"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="packages/node_modules/package.json"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="packages/target"] [data-testid="code-workspace-tree-dir-arrow"]'
- wait_for: '[data-testid="code-workspace-tree-dir"][data-path="packages/target/classes"]'
- assert_no_runtime_errors: null
- screenshot: workspace-heavy-tree-visible.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Normal hierarchical file explorer views display dependency/build directories and their files; a directory containing only those entries is not falsely labeled Empty.
    actions:
    - 3
    - 4
    - 5
    - 6
    - 9
    - 13
    - 15
    results:
    - 8
    - 10
    - 11
    - 12
    - 14
    - 16
    - 17
    checkpoints:
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-dir\"][data-path=\"packages\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-dir\"][data-path=\"packages/node_modules\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-dir\"][data-path=\"packages/target\"]"}'
    - step: 12
      expectation: '{"eval_readonly": {"expression": "!document.querySelector(''[data-testid''+String.fromCharCode(61)+''\\\"code-workspace-tree\\\"]'')?.textContent?.includes(''Empty'')", "expect_truthy": true}}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"packages/node_modules/package.json\"]"}'
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-dir\"][data-path=\"packages/target/classes\"]"}'
    - step: 17
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: Heavy directories are visible as normal file explorer rows with the same modern tree treatment.
    method: manual
    reason: Functional selectors do not establish visual fidelity.
  native:
  - check: The packaged WebView reads the dependency/build entries from native disk.
    method: automated
    reason: Browser VFS cannot establish native filesystem reads.

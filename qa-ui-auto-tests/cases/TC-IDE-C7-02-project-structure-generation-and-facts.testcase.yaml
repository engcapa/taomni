id: TC-IDE-C7-02
title: Project structure generation lifecycle and facts cache
description: '§8.19.10 gate case C7 part 2 (ED-PROJECT-004 & ED-PROJECT-005).

  Asserts workspace-root-keyed project facts cache, generation lifecycle,

  status badge rendering (ready, loading, untrusted, stale, degraded),

  and fail-closed completion/query/refactor consumer behavior.

  Highest claim on green: L1 browser contract / L2 provider-backed (Linux).

  '

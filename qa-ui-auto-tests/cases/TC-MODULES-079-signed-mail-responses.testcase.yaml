id: TC-MODULES-079
title: Signed Mail answers an invitation and a receipt request from the same account
description: Open a real IMAP account through the installed Mail package and inspect both SMTP responses and the handled receipt after reopening the original.
covers: [F-Modules-1, F-MAIL-13, F-MAIL-18]
tags: [modules, mail, native-boundary, p1]
modes: [native]
fixtures: [reset_db, mail_server, module_signed_mail_archive]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- seed_storage: {key: taomni.quickConnectVisible, value: 'true'}
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.mail_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.mail_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- assert_signed_mail_host: idle
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="qc-input"]'
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_quick_connect}'}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="plugin-tab-panel"][data-plugin-slug="mail"][data-plugin-kind="account"] [data-testid="mail-client-tab"][data-active="true"]'
- mail_server_assert_list_matches: {timeout_sec: 35}
- mail_server_deliver: {count: 1, prefix: Signed calendar, invite: Module review}
- mail_server_deliver: {count: 1, prefix: Signed receipt, read_receipt: true}
- click: '[data-testid="mail-sync-button"]:not([disabled])'
- wait_for: '[data-testid="mail-message-row"][data-subject="Signed calendar 0001"]'
- click: '[data-testid="mail-message-row"][data-subject="Signed calendar 0001"]'
- assert_text: {selector: '[data-testid="mail-invite-summary"]', contains: Module review, timeout_sec: 30}
- click: '[data-testid="mail-invite-tentative"]'
- wait_for: {selector: '[data-testid="mail-invite-responded"]', timeout_sec: 30}
- mail_server_assert_smtp_contains: {text: PARTSTAT=TENTATIVE, timeout_sec: 20}
- click: '[data-testid="mail-message-row"][data-subject="Signed receipt 0001"]'
- wait_for: {selector: '[data-testid="mail-receipt-banner"]', timeout_sec: 25}
- click: '[data-testid="mail-receipt-send"]'
- mail_server_assert_smtp_contains: {text: manual-action/MDN-sent-manually, timeout_sec: 25}
- wait_for: {selector: '[data-testid="mail-receipt-banner"]', state: detached}
- click: '[data-testid="mail-message-row"][data-subject="Signed calendar 0001"]'
- wait_for: '[data-testid="mail-invite-card"]'
- click: '[data-testid="mail-message-row"][data-subject="Signed receipt 0001"]'
- assert_not_visible: '[data-testid="mail-receipt-banner"]'
- assert_signed_mail_host: responses
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: signed-replies
    requirement: The installed Mail host sends the selected attendance response and one manual notification to their respective recipients.
    actions: [4, 5, 6, 7, 8, 10, 13, 15, 16, 19, 20, 21, 23, 25, 28, 30, 33, 35]
    checkpoints:
    - {step: 17, expectation: The active account loads in the signed Mail frontend.}
    - {step: 24, expectation: The fetched invitation shows the delivered event summary.}
    - {step: 27, expectation: The SMTP server receives tentative attendance.}
    - {step: 31, expectation: The second SMTP response carries the manual-read disposition.}
    - {step: 36, expectation: Reopening the handled message leaves its receipt banner closed.}
    - {step: 37, expectation: The signed host owns the lease and the two server messages carry the correct MIME content and recipients.}
    - {step: 38, expectation: Both reader actions finish without a runtime error.}
    results: [17, 24, 27, 31, 36, 37, 38]
  visual:
  - check: The reader displays the invitation summary and marks the reply as sent.
    method: automated
    reason: The assertions exercise the visible card and response state.
  native:
  - check: Inspect the installed host, writer lease and both MIME messages at the SMTP server.
    method: automated
    reason: The test uses a signed native package and the actual messages accepted by the isolated server.

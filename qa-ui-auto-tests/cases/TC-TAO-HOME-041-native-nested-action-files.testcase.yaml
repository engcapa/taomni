id: TC-TAO-HOME-041
title: Native approved README retains nested Markdown fences and following actions
description: A loopback Go reply contains JSON file payloads with fenced shell and action examples. Exactly
  the two outer file proposals remain reviewable. Actual native writes require separate approval, preserve
  exact bytes and restore completed results after reload.
modes:
- native
covers:
- F1.11
tags:
- p0
- tao-home
- native
- regression
fixtures:
- reset_db
- platform_workspace_root
- tao_agent
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-tao-home-041-fences
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- wait_for: '[data-testid="tao-home-composer-input"]:enabled'
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-binding-workspace"]'
- click: '[data-testid="tao-home-binding-option"]'
- click: '[data-testid="tao-home-mode-do"]'
- fill:
    selector: '[data-testid="tao-home-composer-input"]'
    value: 'QA_ACTION_NESTED_FENCES: Propose the README and status file, preserving all nested code blocks.
      Wait for approval.'
- click: '[data-testid="tao-home-send"]'
- assert_count:
    selector: '[data-testid="tao-home-action-card"]'
    equal: 2
- assert_text:
    selector: '[data-testid="tao-home-action-card"]:first-of-type [data-testid="tao-home-action-content"]'
    contains: python -m unittest
- assert_file_sha256:
    path: ${fixture.platform_workspace_root}/README.md
    equals: 6ca435cf0d8229dbdf644e898118d87017d6da85701851dcdcdaaf7d384ace82
- click: '[data-testid="tao-home-action-card"] .tao-home-action-buttons button:first-child'
- assert_count:
    selector: '[data-testid="tao-home-action-result"]'
    equal: 1
- assert_file_sha256:
    path: ${fixture.platform_workspace_root}/README.md
    equals: 02d07b8ac10038bd4986c312fc0c7b73b44a1e53717790cb2bf7a160714a05a2
- assert_count:
    selector: '[data-testid="tao-home-action-card"]'
    equal: 1
- click: '[data-testid="tao-home-action-card"] .tao-home-action-buttons button:first-child'
- assert_count:
    selector: '[data-testid="tao-home-action-result"]'
    equal: 2
- assert_file_contains:
    path: ${fixture.platform_workspace_root}/status.txt
    contains: Ready
- reload_window: null
- wait_for: '[data-testid="tao-home-composer-input"]:enabled'
- assert_count:
    selector: '[data-testid="tao-home-action-result"]'
    equal: 2
- assert_not_visible: '[data-testid="tao-home-action-card"]'
- assert_file_sha256:
    path: ${fixture.platform_workspace_root}/README.md
    equals: 02d07b8ac10038bd4986c312fc0c7b73b44a1e53717790cb2bf7a160714a05a2
- assert_no_runtime_errors: null
- screenshot: native-nested-action-files-restored.png
verification:
  review: reviewed
  requirements:
  - id: AGENT-NESTED-FILE-CONTENT
    requirement: Fences inside JSON file content remain file bytes, with complete proposals, explicit
      approval and durable results.
    actions:
    - 1
    - 2
    - 3
    - 4
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 13
    - 14
    - 15
    - 16
    - 17
    - 21
    - 25
    - 28
    checkpoints:
    - step: 18
      expectation: Exactly two reviewable files; the fenced action example inside README is never an executable
        card.
    - step: 19
      expectation: The complete Markdown file is reviewable before approval.
    - step: 20
      expectation: The original disk bytes remain unchanged before approval.
    - step: 22
      expectation: Only the explicitly approved first file has a native result.
    - step: 23
      expectation: Native README bytes retain quotes, backslashes, code fences and the literal action
        example exactly.
    - step: 24
      expectation: The following file stays pending after the first approval.
    - step: 26
      expectation: The second approval produces its own result.
    - step: 27
      expectation: The following action writes the actual second file.
    - step: 30
      expectation: Both native action results survive reload.
    - step: 31
      expectation: Reload does not restore executed proposals as pending actions.
    - step: 32
      expectation: Reload preserves the exact generated file bytes.
    - step: 33
      expectation: No unhandled runtime errors.
    results:
    - 18
    - 19
    - 20
    - 22
    - 23
    - 24
    - 26
    - 27
    - 30
    - 31
    - 32
    - 33
  native:
  - check: Actual native SSE, approval, disk bytes and SQLite action restoration
    method: automated
    reason: Browser stubs cannot establish approved filesystem effects or persisted native action results.
  visual:
  - check: Complete README content and separate approval cards are readable
    method: manual
    reason: Native screenshots support visual review.

- screenshot: parity005-04-retry-recovered.png
- press: Control+z
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;
# Round C - provider resolve times out; the user degrades explicitly.
- click: '[data-testid="code-workspace-editor"] .cm-content'
- seed_storage:

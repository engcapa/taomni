id: TC-IDE-PARITY-005-04
title: Java Basic Completion resolve gate - D1 no fake success, retry, primary-only
description: 'ED-PARITY-005 V4 (A1/A3), browser with the controlled parity provider.

  A provider resolve that returns null, errors, times out or is unavailable must

  never be reported as a successful original-item resolve: the gate opens with

  the accurate reason, nothing is written, Retry is disabled while a fresh

  resolve is in flight, a failing Retry shows the failed note, an explicit

  Insert-without-import writes only the primary, Dismiss/Escape write nothing,

  and overlapping provider edits reject the whole acceptance.

  Boundary: mocked IPC provider — the renderer gate contract. The Rust

  completionItem/resolve typing and real JDT LS timeouts are covered by the

  native/provider case TC-IDE-PARITY-005-05.

  '

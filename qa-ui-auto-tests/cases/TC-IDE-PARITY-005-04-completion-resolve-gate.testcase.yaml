- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
# The editor refuses to accept an option that appeared less than its
# interactionDelay (75 ms) ago, so pause before the accepting stroke.
- wait: 0.2
- press: Enter
- wait_for:
    selector: '[data-testid="completion-resolve-gate"]'
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="completion-resolve-gate"]'
    contains: timed out
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;
- eval_readonly:
    expression: "!document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    expect_truthy: true
- screenshot: parity005-04-timeout-gate.png
- click: '[data-testid="completion-resolve-gate-insert-without-import"]'
- wait: 1
- assert_not_visible: '[data-testid="completion-resolve-gate"]'
# The explicit degradation writes the primary edit only - never the import.
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtilsSuffix;
- eval_readonly:
    expression: "!document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    expect_truthy: true
- screenshot: parity005-04-primary-only.png
- press: Control+z
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;


id: TC-IDE-PARITY-005-04-completion-resolve-gate
title: Basic Completion resolve gate, retry and explicit degradation
description: 'ED-PARITY-005 V4. A candidate whose import only arrives through

  completionItem/resolve must never be committed as if the resolve had

  succeeded. When the provider answers null, fails or times out the editor shows

  the gate with the accurate reason, writes nothing, and offers Retry and an

  explicit insert-without-import; Retry is disabled while it waits, a failed

  retry reports it, and a successful one lands primary plus import as a single

  undoable step. This is the user-visible contract behind the D1 fix.

  '
covers:
- F25.5
tags:
- code-workspace
- parity005
- completion
- resolve-gate
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'

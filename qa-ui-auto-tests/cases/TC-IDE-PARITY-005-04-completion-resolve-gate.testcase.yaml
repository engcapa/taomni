- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
# Round A - provider resolve answers null.
- press: Escape
- seed_storage:
    key: taomni.qa.parity005CompletionMode.v1
    value: '"null"'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: ArrowLeft
- press: Control+Space
- wait_for:

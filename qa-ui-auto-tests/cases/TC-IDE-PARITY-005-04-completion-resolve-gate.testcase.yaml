  requirements:
  - id: R1
    requirement: resolve 返回 null/失败/超时或不可用时打开 resolve gate 且零写入：gate 原因准确（unavailable、failed、timed out）、正文与
      import/dirty/history 均不变；Retry 等待中按钮 disabled、重复点击不多发；Retry 失败显示 failed-note 且仍无编辑，再 Retry 成功仅一次完整
      postimage；显式 Insert without import 只写 primary、不加 import 且一次 Undo 可回 prefix；Dismiss 与 Esc 关闭 gate
      且零提交；重叠 provider edits 整笔拒绝、无部分落地。

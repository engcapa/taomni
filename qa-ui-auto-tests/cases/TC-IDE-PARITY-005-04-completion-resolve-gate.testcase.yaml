- eval_readonly:
    expression: "!document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    expect_truthy: true
- screenshot: parity005-04-failed-gate.png
# Retry while the provider still fails reports it and writes nothing.
- click: '[data-testid="completion-resolve-gate-retry"]'
- wait_for:

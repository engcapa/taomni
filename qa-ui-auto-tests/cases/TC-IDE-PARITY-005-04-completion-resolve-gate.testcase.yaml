id: TC-IDE-PARITY-005-04
title: 'Java Basic Completion resolve gate: D1 no-fake-success, retry, primary-only, overlap rejection'
description: 'ED-PARITY-005 V4 (A1/A3) browser case for the D1 fix. With raw B-005 candidates that carry no additionalTextEdits, four provider faults (unavailable, failed, renderer timeout, held) must open the resolve gate with zero partial import/body, and the real Retry / Insert without import / Dismiss controls must be driven by actual clicks: Retry is disabled while in flight, a failing Retry keeps the gate and the document intact, a succeeding Retry lands primary+import once, primary-only degrades explicitly without an import, and one undo restores the prefix each time. A contradictory provider additional edit rejects the WHOLE acceptance instead of half-applying it. Before the fix the unavailable resolve was answered with the original item and committed as a fake success.'
covers:
- F25.5
tags:
- code-workspace
- completion
- ed-parity-005
- browser-gate
- p1
modes:
- browser

id: TC-MAIL-SYNC-02
title: Mail sync reconciles deletions and read state changed by another client
description: 'AC-04/AC-05: after the list matches the server, another client delivers 10

  messages, then expunges the newest 3 and marks the next 2 as read. A manual

  Sync must remove the expunged rows and show the server''s read state, so the

  unread rows equal the server''s unseen count after synchronization and
  after reopening the same mailbox. Browser mode uses the stub

  server model; native mode uses the fake IMAP server and the real backend.

  '
covers:
- F-MAIL-5
- F-MAIL-3
tags:
- mail
- p0
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- mail_server_deliver:
    count: 10
    prefix: Other-client
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- mail_server_expunge_newest:
    count: 3
- mail_server_set_flags_newest:
    count: 2
    flags:
    - \Seen
- click: '[data-testid="mail-sync-button"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: new headers across
    timeout_sec: 30
- mail_server_assert_list_matches:
    unread: true
    timeout_sec: 60
- assert_visible: '[data-testid="mail-message-count"]'
- click: '[data-testid="tab-item"][data-tab-type="mail"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="mail-client-tab"]'
    state: detached
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    unread: true
    timeout_sec: 60
- click: '[data-testid="mail-message-row"]'
- wait_for: '[data-testid="mail-message-row"][aria-pressed="true"]'
- assert_no_runtime_errors: null
- assert_count: {selector: '[data-testid="mail-message-row"][data-subject="Other-client 0007"]', equal: 1}
- assert_count: {selector: '[data-testid="mail-message-row"][data-subject="Other-client 0010"]', equal: 0}
- screenshot: mail-sync-02-reconcile.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 手工同步后，其他客户端的新增、删除与已读变化反映到列表，重开后列表数量与未读数仍与服务器一致（AC-04/AC-05）。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 9
    - 10
    - 12
    - 13
    - 14
    - 18
    - 20
    - 21
    - 24
    checkpoints:
    - step: 8
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 11
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 15
      expectation: '{"assert_text": {"selector": "[data-testid=\"mail-client-tab\"]", "contains": "new headers across",
        "timeout_sec": 30}}'
    - step: 16
      expectation: '{"mail_server_assert_list_matches": {"unread": true, "timeout_sec": 60}}'
    - step: 17
      expectation: '{"assert_visible": "[data-testid=\"mail-message-count\"]"}'
    - step: 19
      expectation: The Mail tab closes before reopening the saved mailbox.
    - step: 23
      expectation: The reopened list reflects the deletions and read flags and matches the server counts.
    - step: 25
      expectation: '{"wait_for": "[data-testid=\"mail-message-row\"][aria-pressed=\"true\"]"}'
    - step: 26
      expectation: No runtime errors during reconciliation and reopen.
    - step: 27
      expectation: The newest retained message appears exactly once after reopening the mailbox.
    - step: 28
      expectation: The last expunged message does not reappear after reopening.
    results:
    - 16
    - 17
    - 23
    - 26
    - 19
    - 27
    - 28
  visual:
  - check: 截图中列表与未读样式正确，无残留的已删除邮件。
    method: manual
    reason: 像素与布局需人工评审。
  native:
  - check: native 模式验证真实后端的删除与标志对账；browser 仅验证渲染层；平台结果分别记录。
    method: automated
    reason: 按实际执行模式与平台解释证据。

id: TC-126
title: SSH session editor supports reset, cancel, templates, folders, and forward removal
covers:
- F6.3
- F6.2
tags:
- ssh
- session
- settings
- lifecycle
- forwards
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 45
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-lifecycle.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-lifecycle-user
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- fill:
    selector: 'input[aria-label="Execute command"]'
    value: printf 'qa-lifecycle-command\n'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- fill:
    selector: 'input[aria-label="New forward local address"]'
    value: 127.0.0.1:19100
- fill:
    selector: 'input[aria-label="New forward remote address"]'
    value: service.internal:80
- fill:
    selector: 'input[aria-label="New forward description"]'
    value: lifecycle-forward-one
- click: '[data-testid="session-forward-add"]'
- fill:
    selector: 'input[aria-label="New forward local address"]'
    value: 127.0.0.1:19101
- fill:
    selector: 'input[aria-label="New forward remote address"]'
    value: service.internal:81
- fill:
    selector: 'input[aria-label="New forward description"]'
    value: lifecycle-forward-two
- click: '[data-testid="session-forward-add"]'
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 2
- click: '[data-testid="network-settings"] button:has-text("Remove")'
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 1
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-lifecycle
- fill:
    selector: 'input[aria-label="Background image"]'
    value: /tmp/qa-ui-auto-terminal.png
- fill:
    selector: 'input[aria-label="Background opacity"]'
    value: '42%'
- fill:
    selector: 'textarea[aria-label="Description notes"]'
    value: lifecycle description
- fill:
    selector: 'input[aria-label="Tags"]'
    value: ssh, lifecycle, qa
- fill:
    selector: 'input[aria-label="Keyboard shortcut"]'
    value: Ctrl+Alt+9
- set_check:
    selector: 'label:has-text("Auto-connect when Taomni starts") input[type="checkbox"]'
    checked: false
- set_check:
    selector: 'label:has-text("Open in new window") input[type="checkbox"]'
    checked: true
- set_check:
    selector: 'label:has-text("Reconnect on disconnection") input[type="checkbox"]'
    checked: false
- click: '[data-testid="session-new-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-ssh-folder
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="text-input-dialog"]'
    state: detached
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-lifecycle"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-lifecycle"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: changed-before-reset.example.test
- click: '[data-testid="session-reset"]'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: ssh-lifecycle.example.test
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: 'input[aria-label="Execute command"]'
    name: value
    equals: printf 'qa-lifecycle-command\n'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: discarded-session-name
- click: 'button[aria-label="Cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- assert_visible: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-lifecycle"]'
- assert_not_visible: '[data-testid="session-tree-item"][data-session-name="discarded-session-name"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-template.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-template-user
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-template-source
- click: '[data-testid="session-save-template"]'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: Template saved
- click: 'button[aria-label="Cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-lifecycle"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-delete-editor"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_visible: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-lifecycle"]'
- click: '[data-testid="confirm-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="confirm-dialog"]'
    state: detached
- click: '[data-testid="session-delete-editor"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-lifecycle"]'
    state: detached
- screenshot: 126-ssh-session-lifecycle.png

id: TC-WS-NATIVE-008
title: 'AC-05: real SFTP upload/download and transfer history survive Workspace switches'
description: Upload a fixture-owned file, switch scope, download into a second isolated directory and verify SHA-256
  independently from the UI.
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
- workspace_membership
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-test-password
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"] > button'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"][data-terminal-active="true"]'
- click: '[data-testid="terminal-pane"]'
- type: echo QA_SHARED_BEFORE
- press: Enter
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_SHARED_BEFORE\s*$
    timeout_sec: 30
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"][data-sftp-attached="true"]'
    timeout_sec: 30
- click: '[data-testid="sftp-remote-path-edit"]'
- wait_for: input[data-testid="sftp-remote-path"]
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: ${cfg.sftp.remote_test_dir}
- press:
    selector: input[data-testid="sftp-remote-path"]
    key: Enter
- wait_for: '[data-testid="sftp-remote-pane"]'
- click: '[data-testid="sftp-local-path-edit"]'
- wait_for: input[data-testid="sftp-local-path"]
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.workspace_catalog_root}
- press:
    selector: input[data-testid="sftp-local-path"]
    key: Enter
- click: '[data-testid="sftp-local-pane"] tr[title$="qa-workspace-transfer.txt"]'
- click: '[data-testid="sftp-local-upload-selected"]'
- click: '[data-testid="workspace-surface-overview"]'
- click: '[data-testid="workspace-row-qa-workspace-remote"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"] > button'
- assert_text:
    selector: '[data-testid="sftp-transfer-queue"]'
    contains: done
    timeout_sec: 60
- assert_visible: '[data-testid="sftp-remote-pane"] tr[title$="qa-workspace-transfer.txt"]'
- click: '[data-testid="sftp-local-path-edit"]'
- wait_for: input[data-testid="sftp-local-path"]
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.workspace_catalog_download}
- press:
    selector: input[data-testid="sftp-local-path"]
    key: Enter
- click: '[data-testid="sftp-remote-pane"] tr[title$="qa-workspace-transfer.txt"]'
- click: '[data-testid="sftp-remote-download-selected"]'
- click: '[data-testid="workspace-surface-overview"]'
- click: '[data-testid="workspace-row-qa-workspace-remote"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-navigator"] [data-testid="workspace-reference-qa-shared-ssh"] > button'
- assert_file_sha256:
    path: ${fixture.workspace_catalog_download}/qa-workspace-transfer.txt
    equals: ${fixture.workspace_transfer_sha256}
    timeout_sec: 60
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- click: '[data-testid="sftp-remote-pane"] tr[title$="qa-workspace-transfer.txt"]'
- click: '[data-testid="sftp-remote-delete"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="sftp-remote-pane"] tr[title$="qa-workspace-transfer.txt"]'
- screenshot: workspace-sftp-transfer-retained.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: 'AC-05: real SFTP upload/download and transfer history survive Workspace switches'
    actions:
    - 4
    - 5
    - 7
    - 8
    - 10
    - 11
    - 12
    - 14
    - 16
    - 18
    - 19
    - 21
    - 23
    - 24
    - 25
    - 26
    - 27
    - 28
    - 29
    - 30
    - 33
    - 35
    - 36
    - 37
    - 38
    - 39
    - 40
    - 41
    - 42
    - 45
    - 46
    - 47
    checkpoints:
    - step: 13
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"]",
        "regex": "(?m)^QA_SHARED_BEFORE\\s*$", "timeout_sec": 30}}'
    - step: 31
      expectation: '{"assert_text": {"selector": "[data-testid=\"sftp-transfer-queue\"]", "contains": "done", "timeout_sec":
        60}}'
    - step: 32
      expectation: '{"assert_visible": "[data-testid=\"sftp-remote-pane\"] tr[title$=\"qa-workspace-transfer.txt\"]"}'
    - step: 43
      expectation: '{"assert_file_sha256": {"path": "${fixture.workspace_catalog_download}/qa-workspace-transfer.txt",
        "equals": "${fixture.workspace_transfer_sha256}", "timeout_sec": 60}}'
    - step: 44
      expectation: '{"assert_count": {"selector": "[data-testid=\"sftp-browser\"]", "equal": 1}}'
    - step: 48
      expectation: '{"assert_not_visible": "[data-testid=\"sftp-remote-pane\"] tr[title$=\"qa-workspace-transfer.txt\"]"}'
    results:
    - 13
    - 31
    - 32
    - 43
    - 44
    - 48
  visual:
  - check: Compare typography, theme tokens, Lucide icon shape, spacing and clipping with the existing shell.
    method: manual
    reason: Visual evidence must be inspected after execution; pending is not a pass.
  native:
  - check: Real SSH/SFTP roundtrip with host SHA-256 verification.
    method: automated
    reason: All local paths are under the fixture-owned QA directory; the remote endpoint belongs to the runner.
native_platforms:
- Windows
- macOS
- Linux

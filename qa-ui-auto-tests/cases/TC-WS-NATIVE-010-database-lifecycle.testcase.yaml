  native:
  - check: A real MySQL server executes the queries before and after native window handoff.
    method: automated
    reason: Uses runner-provisioned MySQL credentials and the isolated QA application.
  visual:
  - check: Inspect retained theme, Lucide icons, spacing and clipping in final screenshots.
    method: manual
    reason: Pending screenshot inspection; a captured screenshot alone is not a visual pass.

    checkpoints:
    - step: 33
      expectation: The actual MySQL result marker, original scope or unique query host is observable.
    - step: 34
      expectation: The actual MySQL result marker, original scope or unique query host is observable.
    - step: 39
      expectation: The actual MySQL result marker, original scope or unique query host is observable.
    - step: 44
      expectation: The actual MySQL result marker, original scope or unique query host is observable.
    - step: 47
      expectation: The actual MySQL result marker, original scope or unique query host is observable.
    - step: 48
      expectation: The actual MySQL result marker, original scope or unique query host is observable.
    - step: 49
      expectation: The actual MySQL result marker, original scope or unique query host is observable.

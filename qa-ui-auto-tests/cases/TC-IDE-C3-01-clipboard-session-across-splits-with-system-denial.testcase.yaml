id: TC-IDE-C3-01
title: Cross-leaf clipboard paste, history ring, undo, and lease cleanup; rectangle and denial stay native
description: '§8.19.10 gate case C3 (browser portion) / ED-CLIP-004.

  Capability ids: workspace.clipboard-single-slot / clipboard.history-paste.

  Browser verifies cross-leaf plain paste through the workspace clipboard slot,

  history ring popup selection, single undo restoration, and lease cleanup upon unsplit.

  System-clipboard ownership, rectangular selection paste, and OS-level permission

  denial/grant transitions remain NATIVE concerns (R9 manifest / BB11) and are proven

  separately by TC-IDE-C3-02. Highest claim for this browser case alone: L2 observable

  cross-view/history/undo behavior without an OS-boundary claim.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c3
- clipboard
- split
- p0
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120

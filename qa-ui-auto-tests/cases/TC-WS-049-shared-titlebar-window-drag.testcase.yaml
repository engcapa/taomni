id: TC-WS-049
title: Shared title-bar dragging across Home, Tools, Sessions and overflowing Workspaces
description: Real browser pointer gestures reach the shared renderer handler and observable browser-preview window adapter. Checks actual API dispatch and
  negative control interactions, plus top-frame hit testing. OS window displacement is verified separately by native TC-MAIN-RAIL-03.
modes:
- browser
covers:
- F1.2
- F1.3
- F-WS-1
- F-WS-2
- F1.5
tags:
- p0
- workspace-redesign
- regression
- window
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-titlebar
- set_viewport:
    width: 1280
    height: 800
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniWindowActions) === "[]"
    expect_truthy: true
- eval_readonly:
    expression: document.elementFromPoint(innerWidth/2,4).getAttribute("data-testid") === "main-window-top-drag-region"
    expect_truthy: true
- drag_to:
    from: '[data-testid="main-window-top-drag-region"]'
    by:
      dx: 24
      dy: 12
      steps: 4
- eval_readonly:
    expression: JSON.stringify(window.__taomniWindowActions) === "[\"startDragging\"]"
    expect_truthy: true
- drag_to:
    from: '[data-testid="platform-mode-title"]'
    by:
      dx: 24
      dy: 12
      steps: 4
- eval_readonly:
    expression: JSON.stringify(window.__taomniWindowActions) === "[\"startDragging\",\"startDragging\"]"
    expect_truthy: true
- dblclick: '[data-testid="platform-mode-title"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniWindowActions) === "[\"startDragging\",\"startDragging\",\"startDragging\",\"toggleMaximize\"]"
    expect_truthy: true
- click: '[data-testid="home-toolbar-workspaces"]'
- wait_for: '[data-testid="workspace-tab-strip"]'
- eval_readonly:

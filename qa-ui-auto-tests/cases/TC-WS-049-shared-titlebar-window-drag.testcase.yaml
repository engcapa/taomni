    by:
      dx: 24
      dy: 12
      steps: 4
- eval_readonly:
    expression: JSON.stringify(window.__taomniWindowActions) === "[\"startDragging\",\"startDragging\",\"startDragging\",\"toggleMaximize\",\"startDragging\"]"

id: TC-NOTES-009
title: Notes and Workspace share editing, preview, identity and recoverable drafts
description: Exercises both real UI entry points, content-only saves, primary save shortcut, metadata retention,
  title-independent tab identity, close/reopen/reload recovery and default Notes navigation. Native verifies the
  real SQLite IPC and packaged editor; browser uses stubs.
covers:
- F-TAO-1
- F-WS-1
tags:
- notes
- regression
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-notes-workspace
- click: '[data-testid="rail-chat-button"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- click: '[data-testid="notes-new"]'
- fill:
    selector: '[data-testid="note-editor-title"]'
    value: Shared workspace note
- fill:
    selector: '[data-testid="note-editor-body"]'
    value: '# Shared body original'
- blur: '[data-testid="note-editor-body"]'
- click: '[data-testid="note-editor-pin"]'
- wait_for:
    selector: '[data-testid="note-editor-pin"][aria-pressed="true"]'
    timeout_sec: 10
- click: '[data-testid="note-editor-preview"]'
- assert_visible: '[data-testid="notes-workspace-sidebar"]'
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"]'
    name: data-mode
    equals: preview
- assert_visible: '[data-testid="notes-workspace-status"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] h1'
    equals: Shared body original
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-mode-split"]'
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-title"]'
    value: Renamed shared note
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    key: Mod+A
- type:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    text: '# Saved from Workspace'
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    key: Mod+S
- assert_not_visible: '[data-testid="notes-workspace-document"][data-active="true"][data-dirty="true"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tao"]'
- eval_readonly:
    expression: document.querySelector(".notes-link-field-shell input").value === "Renamed shared note"
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector(".notes-link-field-shell textarea").value === "# Saved from Workspace"
    expect_truthy: true
- wait_for:
    selector: '[data-testid="note-editor-pin"][aria-pressed="true"]'
    timeout_sec: 10
- click: '[data-testid="note-editor-preview"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] h1'
    equals: Saved from Workspace
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-mode-edit"]'
- press:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    key: Mod+A
- type:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    text: '# Recovered draft'
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"]'
    name: data-dirty
    equals: 'true'
- click: '[data-testid="workspace-tab"][data-tab-kind="note"] [data-testid="workspace-tab-close"]'
- assert_not_visible: '[data-testid="notes-workspace-document"][data-active="true"]'
- click: '[data-testid="notes-workspace-note"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    equals: '# Recovered draft'
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"]'
    name: data-dirty
    equals: 'true'
- assert_no_runtime_errors: null
- reload_window: null
- click: '[data-testid="nav-mode-workspaces"]'
- assert_visible: '[data-testid="notes-workspace-document"][data-active="true"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-editor"]
      .cm-content'
    equals: '# Recovered draft'
- assert_attribute:
    selector: '[data-testid="notes-workspace-document"][data-active="true"]'
    name: data-dirty
    equals: 'true'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-save"]'
- assert_not_visible: '[data-testid="notes-workspace-document"][data-active="true"][data-dirty="true"]'
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-mode-preview"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] h1'
    equals: Recovered draft
- fill:
    selector: '[data-testid="notes-workspace-search"]'
    value: not-a-matching-note
- assert_count:
    selector: '[data-testid="notes-workspace-note"]'
    equal: 0
- fill:
    selector: '[data-testid="notes-workspace-search"]'
    value: Renamed
- assert_count:
    selector: '[data-testid="notes-workspace-note"]'
    equal: 1
- fill:
    selector: '[data-testid="notes-workspace-search"]'
    value: ''
- click: '[data-testid="notes-workspace-refresh"]'
- click: '[data-testid="notes-workspace-new"]'
- eval_readonly:
    expression: document.getElementsByClassName("taomni-workspace-tab").length === 2 && document.getElementsByClassName("taomni-workspace-tab")[1].dataset.tabKind
      === "note"
    expect_truthy: true
    timeout_sec: 10
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-title"]'
    value: Second note
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-save"]'
- click: '[data-testid="workspace-tab"][data-tab-title="Renamed shared note.md"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"][data-mode="preview"] h1'
    equals: Recovered draft
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-tao"]'
- eval_readonly:
    expression: document.querySelector(".notes-link-field-shell textarea").value === "# Recovered draft"
    expect_truthy: true
- click: '[data-testid="note-editor-back"]'
- click: '[data-testid="notes-open-workspace"]'
- assert_visible: '[data-testid="notes-workspace-sidebar"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-new-note"]'
- eval_readonly:
    expression: document.getElementsByClassName("taomni-workspace-tab").length === 3 && document.getElementsByClassName("taomni-workspace-tab")[2].dataset.tabKind
      === "note"
    expect_truthy: true
    timeout_sec: 10
- fill:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-title"]'
    value: Third note
- click: '[data-testid="notes-workspace-document"][data-active="true"] [data-testid="notes-workspace-save"]'
- click: '[data-testid="workspace-tab"][data-tab-title="Renamed shared note.md"]'
- assert_text_equals:
    selector: '[data-testid="notes-workspace-document"][data-active="true"] h1'
    equals: Recovered draft
- assert_no_runtime_errors: null
- screenshot: notes-009-shared-workspace.png

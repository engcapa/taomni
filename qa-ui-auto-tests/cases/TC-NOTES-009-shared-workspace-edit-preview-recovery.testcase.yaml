  visual:
  - check: Inspect Notes space layout and Markdown edit/split/preview at normal desktop size.
    method: manual
    reason: Screenshots are retained for review; semantic assertions alone do not certify visual layout.
  native:
  - check: Save/reopen through the real content-only IPC and SQLite, and recover the window-owned draft after WebView
      reload.
    method: automated
    reason: Browser localStorage stubs cannot establish native persistence or packaged WebView behavior.
  - check: Physical Cmd/Ctrl+S and IME delivery on each OS.
    method: manual
    reason: The runner press action establishes app-local routing, not OS shortcut delivery.

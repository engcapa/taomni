      .cm-line")[0]?.textContent === "alpha-one" && document.querySelectorAll(".cm-content .cm-line")[1]?.textContent
      === "beta-two" && document.querySelectorAll(".cm-content .cm-line")[2]?.textContent === ""
    expect_truthy: true
- assert_attribute:

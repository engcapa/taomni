id: TC-IDE-C3-02
title: Packaged clipboard OS grant, real X11 denial, multi-caret distribution, and recovery
description: 'ED-CLIP-004 A4 packaged Linux/WebKitGTK slice. It enters a real host workspace

  through persisted recents and drives the production copy/paste owners against

  the REAL X11 CLIPBOARD selection.


  Grant is proven from outside the app: after an editor Copy, a separate

  process reads the exact payload back through a real X11 selection transfer, so

  the typed `performed` effect is corroborated at the OS boundary rather than

  self-reported. Denial is a real OS-level failure, not a stub: an external owner

  takes the selection and is then replaced by an owner that advertises standard

  text targets but rejects their conversion, so every client''s text read

  genuinely fails at the OS boundary. The

  case asserts the production owner then reports `unavailable` with

  `unknown` effect and a VISIBLE workspace-slot fallback, never success. It then

  restores the granted owner and proves the OS read path recovers and distributes segments

  across two carets in one undo.


  The clipboard observation seam is metadata only: outcome, effect, permission

  epoch, payload shape. The copied text never appears in the DOM.

  '
covers:
- F25.5
- F1.7
tags:
- code-workspace
- ide-c3
- clipboard
- native-gate
- accessibility
- p0
modes:
- native
fixtures:
- linux_x11_required
- reset_db
- workspace_root
timeout_sec: 420

id: TC-SHELL-N03
title: Real SFTP bytes survive pause, hidden views and explicit background owner close
description: 'V-N03: standalone SFTP owners use the real Tauri SSH/SFTP client against an isolated loopback
  protocol endpoint. Independent service files, byte samples and hashes establish native effects. Interrupted
  uploads deliberately retain the original product partial-file policy. No OS picker is required: upload
  uses the real local pane selection.'
covers:
- F7.4
- F-SHELL-1
- F-TAO-1
tags:
- p1
- workspace-shell
modes:
- native
fixtures:
- reset_db
- shell_sftp_server
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-sftp-password
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- shell_navigate: sessions
- click: '[data-testid="session-new"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    timeout_sec: 15
- click: '[data-testid="session-proto-sftp"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: 127.0.0.1
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.shell_sftp_port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: SHELL-SFTP-ALPHA
- click: '[data-testid="session-save"]'
- wait_for:
    selector: '[data-testid="session-tree-item"][data-session-name="SHELL-SFTP-ALPHA"]'
    timeout_sec: 15
- dblclick: '[data-testid="session-tree-item"][data-session-name="SHELL-SFTP-ALPHA"]'
- wait_for:
    selector: '[data-testid="auth-prompt"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SHELL_SFTP_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="sftp-remote-list"]'
    timeout_sec: 15
- click: '[data-testid="sftp-local-path-edit"]'
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.shell_sftp_local}
- press: Enter
- wait_for:
    selector: '[data-testid="sftp-local-list"] tr[data-row][title$="upload 中文.bin"]'
    timeout_sec: 15
- click: '[data-testid="sftp-local-list"] tr[data-row][title$="upload 中文.bin"]'
- click: '[data-testid="sftp-local-upload-selected"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-remote-path$="/upload 中文.bin"][data-state="running"]'
    timeout_sec: 15
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="transfer-job"][data-remote-path$="/upload 中文.bin"] [data-testid="transfer-job-pause"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-remote-path$="/upload 中文.bin"][data-state="paused"]'
    timeout_sec: 15
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: stable
    full_size: 16777216
- click: '[data-testid="transfer-job"][data-remote-path$="/upload 中文.bin"] [data-testid="transfer-job-resume"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-remote-path$="/upload 中文.bin"][data-state="running"]'
    timeout_sec: 15
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-rail-tao"]'
- wait_for:
    selector: '[data-testid="ai-chat-drawer"]'
    timeout_sec: 15
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="shell-rail-tao"]'
- shell_navigate: sessions
- click: '[data-testid="session-new"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    timeout_sec: 15
- click: '[data-testid="session-proto-sftp"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: 127.0.0.1
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.shell_sftp_port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: SHELL-SFTP-BETA
- click: '[data-testid="session-save"]'
- wait_for:
    selector: '[data-testid="session-tree-item"][data-session-name="SHELL-SFTP-BETA"]'
    timeout_sec: 15
- dblclick: '[data-testid="session-tree-item"][data-session-name="SHELL-SFTP-BETA"]'
- wait_for:
    selector: '[data-testid="auth-prompt"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SHELL_SFTP_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="sftp-remote-list"]'
    timeout_sec: 15
- click: '[data-testid="sftp-local-path-edit"]'
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.shell_sftp_local}
- press: Enter
- wait_for:
    selector: '[data-testid="sftp-local-list"] tr[data-row][title$="upload 中文.bin"]'
    timeout_sec: 15
- click: '[data-testid="tab-item"][data-tab-title^="SHELL-SFTP-ALPHA"]'
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="shell-close-dialog"]'
    timeout_sec: 15
- assert_disabled: '[data-testid="shell-close-confirm"]'
- click: '[data-testid="shell-close-cancel"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-title^="SHELL-SFTP-ALPHA"]'
    equal: 1
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="shell-close-background"]'
    timeout_sec: 15
- click: '[data-testid="shell-close-background"]'
- click: '[data-testid="shell-close-confirm"]'
- assert_not_visible: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-title^="SHELL-SFTP-ALPHA"]'
    equal: 0
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-title^="SHELL-SFTP-BETA"]'
    equal: 1
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="shell-transfers-trigger"]'
- wait_for:
    selector: '[data-testid="shell-transfers"]'
    timeout_sec: 15
- wait_for:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-remote-path$="/upload
      中文.bin"][data-state="done"]'
    timeout_sec: 90
- assert_file_sha256:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    equals: ${fixture.shell_sftp_sha256}
    timeout_sec: 90
- click: '[data-testid="shell-transfers-close"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notifications"]'
- wait_for:
    selector: '[data-testid="tao-alert-inbox-item"][data-alert-kind="transfer_done"]'
    timeout_sec: 15
- click: '[data-testid="tao-alert-inbox-item"][data-alert-kind="transfer_done"] [data-testid="tao-alert-jump"]'
- wait_for:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-remote-path$="/upload
      中文.bin"][data-state="done"]'
    timeout_sec: 15
- click: '[data-testid="shell-transfers-close"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notifications"]'
- assert_count:
    selector: '[data-testid="tao-alert-inbox-item"][data-alert-kind="transfer_done"]'
    equal: 0
- click: '[data-testid="shell-rail-tao"]'
- assert_not_visible: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="tab-item"][data-tab-title^="SHELL-SFTP-BETA"]'
- wait_for:
    selector: '[data-testid="sftp-local-list"]'
    timeout_sec: 15
- click: '[data-testid="sftp-local-list"] tr[data-row][title$="cancel 中文.bin"]'
- click: '[data-testid="sftp-local-upload-selected"]'
- wait_for:
    selector: '[data-testid="transfer-job"][data-remote-path$="/cancel 中文.bin"][data-state="running"]'
    timeout_sec: 15
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/cancel 中文.bin
    state: growing
    full_size: 16777216
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="shell-close-cancel-job"]'
    timeout_sec: 15
- click: '[data-testid="shell-close-cancel-job"]'
- click: '[data-testid="shell-close-confirm"]'
- assert_not_visible: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-title^="SHELL-SFTP-BETA"]'
    equal: 0
- click: '[data-testid="shell-transfers-trigger"]'
- wait_for:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-remote-path$="/cancel
      中文.bin"][data-state="cancelled"]'
    timeout_sec: 15
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/cancel 中文.bin
    state: incomplete
    full_size: 16777216
- assert_file_progress:
    path: ${fixture.shell_sftp_remote}/cancel 中文.bin
    state: stable
    full_size: 16777216
- assert_file_sha256:
    path: ${fixture.shell_sftp_remote}/upload 中文.bin
    equals: ${fixture.shell_sftp_sha256}
    timeout_sec: 90
- assert_count:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-state="running"]'
    equal: 0
- screenshot: tc-shell-n03-real-sftp.png

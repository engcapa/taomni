id: TC-050
title: SFTP multi-select and select-all in remote pane
covers:
- F7.2
tags:
- legacy-imported
- multi-select
- p1
- selection
- sftp
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 2
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-remote-path"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}
- press: Enter
- wait: 1
- click: '[data-testid="sftp-remote-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-ms-a.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- wait: 1
- click: '[data-testid="sftp-remote-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-ms-b.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- wait: 1
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-ms-a.txt"'
- click:
    selector: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-ms-b.txt"'
    modifiers:
    - Mod
- assert_text:
    selector: '[data-testid="sftp-remote-pane"]'
    contains: 2 selected
- click: '[data-testid="sftp-remote-list"]'
- press: Control+a
- wait: 1
- assert_text:
    selector: '[data-testid="sftp-remote-pane"]'
    contains: selected
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-ms-a.txt"'
- click: '[data-testid="sftp-remote-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-ms-b.txt"'
- click: '[data-testid="sftp-remote-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- assert_not_visible: '[data-testid="sftp-browser"] tr[title$="/qa-ui-auto-ms-a.txt"]'
- assert_not_visible: '[data-testid="sftp-browser"] tr[title$="/qa-ui-auto-ms-b.txt"]'
- screenshot: 050-sftp-multiselect.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: SFTP multi-select and select-all in remote pane：按步骤执行后，所有声明的可观察结果均满足。

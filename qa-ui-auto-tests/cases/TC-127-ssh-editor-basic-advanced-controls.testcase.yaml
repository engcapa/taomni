id: TC-127
title: SSH editor basic lookup, advanced selectors, authentication, and header actions
covers:
- F6.3
tags:
- ssh
- session
- settings
- advanced
- controls
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- assert_visible: '[data-testid="session-help"]'
- assert_visible: '[data-testid="session-close"]'
- assert_visible: '[data-testid="session-host-lookup"]'
- assert_visible: '[data-testid="session-proto-ssh"]'
- assert_visible: '[data-testid="session-section-advanced"]'
- assert_visible: '[data-testid="session-section-network"]'
- assert_visible: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: qauser@127.0.0.1:2222
- click: '[data-testid="session-host-lookup"]'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: 127.0.0.1
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: '2222'
- assert_attribute:
    selector: '[data-testid="session-user"]'
    name: value
    equals: qauser
- assert_attribute:
    selector: '[data-testid="session-specify-username"]'
    name: data-checked
    equals: 'true'
- click: '[data-testid="session-help"]'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: Fill required fields, then OK to save this session.
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: shell
- select_option:
    selector: '[data-testid="session-remote-environment"]'
    label: LXDE / LXQt desktop
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: lxde
- select_option:
    selector: '[data-testid="session-remote-environment"]'
    label: Xfce desktop
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: xfce
- select_option:
    selector: '[data-testid="session-remote-environment"]'
    label: GNOME desktop
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: gnome
- select_option:
    selector: '[data-testid="session-remote-environment"]'
    label: KDE Plasma desktop
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: kde
- select_option:
    selector: '[data-testid="session-remote-environment"]'
    label: Awesome WM
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: awesome
- select_option:
    selector: '[data-testid="session-remote-environment"]'
    label: Custom command…
- assert_attribute:
    selector: '[data-testid="session-remote-environment"]'
    name: value
    equals: custom
- fill:
    selector: input[aria-label="Execute command"]
    value: printf 'qa-advanced-control\n'
- assert_attribute:
    selector: input[aria-label="Execute command"]
    name: value
    equals: printf 'qa-advanced-control\n'
- set_check:
    selector: '[data-testid="session-do-not-exit"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-do-not-exit"]'
    name: data-checked
    equals: 'false'
- assert_text_equals:
    selector: '[data-testid="session-ssh-browser-type"]'
    equals: SFTP protocol (recommended)
- assert_count:
    selector: '[data-testid="session-ssh-browser-type"]:is(select)'
    equal: 0
- click: '[data-testid="session-auth-agent"]'
- assert_count:
    selector: '[data-testid="session-auth-agent"]:checked'
    equal: 1
- click: '[data-testid="session-auth-gssapi"]'
- assert_count:
    selector: '[data-testid="session-auth-gssapi"]:checked'
    equal: 1
- click: '[data-testid="session-auth-password"]'
- assert_count:
    selector: '[data-testid="session-auth-password"]:checked'
    equal: 1
- fill:
    selector: input[aria-label="SSH password"]
    value: qa-ui-auto-password
- assert_attribute:
    selector: input[aria-label="SSH password"]
    name: type
    equals: password
- click: '[data-testid="session-auth-privatekey"]'
- assert_count:
    selector: '[data-testid="session-auth-privatekey"]:checked'
    equal: 1
- assert_enabled: '[data-testid="session-private-key-toggle"]'
- set_check:
    selector: '[data-testid="session-private-key-toggle"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-private-key-toggle"]'
    name: data-checked
    equals: 'false'
- assert_disabled: input[aria-label="Private key path"]
- set_check:
    selector: '[data-testid="session-private-key-toggle"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="session-private-key-toggle"]'
    name: data-checked
    equals: 'true'
- assert_enabled: input[aria-label="Private key path"]
- click: '[data-testid="session-private-key-browse"]'
- wait_for: '[data-testid="text-input-dialog"]'
- assert_visible: '[data-testid="text-input-dialog-input"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: /home/qauser/.ssh/id_ed25519
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_attribute:
    selector: input[aria-label="Private key path"]
    name: value
    equals: /home/qauser/.ssh/id_ed25519
- click: '[data-testid="session-private-key-generate"]'
- assert_visible: '[data-testid="session-key-generator"]'
- hover: '[data-testid="session-private-key-generate"]'
- click: '[data-testid="session-expert-settings"]'
- fill:
    selector: '[data-testid="session-ssh-cipher"]'
    value: aes256-gcm@openssh.com
- assert_attribute:
    selector: '[data-testid="session-ssh-cipher"]'
    name: value
    equals: aes256-gcm@openssh.com
- hover: '[data-testid="session-expert-settings"]'
- click: '[data-testid="session-close"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 127-ssh-editor-basic-advanced-controls.png
- assert_not_visible: '[data-testid="session-editor"]'

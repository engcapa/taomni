id: TC-IDE-PARITY-021-01
title: Editor and tab context menus follow IDEA order and availability
description: 'ED-PARITY-021 A1/A2/A3 browser case: the editor context menu starts with Show Context Actions and groups clipboard, Find Usages / Go To ›, Rename… / Refactor › and Reformat Code; Escape returns focus to the editor. The tab menu follows IDEA''s order and disables Close Other Tabs and Close Tabs to the Right for a single tab.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-021
- context-menu
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- right_click: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for: '[data-testid="context-menu"]'
- assert_pattern:
    selector: '[data-testid="context-menu"]'
    regex: (?s)^\s*Show Context Actions.*Paste.*Find Usages.*Go To.*Rename.*Refactor.*Reformat Code
- assert_menu_items:
  - Show Context Actions
  - Find Usages
  - Go To
  - Rename…
  - Refactor
  - Reformat Code
- hover: '[data-testid="editor-context-goto"]'
- wait_for:
    selector: '[data-testid="editor-context-goto-declaration"]'
    timeout_sec: 5
- assert_text:
    selector: '[data-testid="editor-context-goto-declaration"]'
    contains: Declaration or Usages
- press: Escape
- press: Escape
- wait_for:
    selector: '[data-testid="context-menu"]'
    state: detached
    timeout_sec: 5
- eval_readonly:
    expression: document.activeElement?.classList.contains('cm-content') === true
    expect_truthy: true
- right_click: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"] button'
- wait_for: '[data-testid="context-menu"]'
- assert_menu_items:
  - Close
  - Close Other Tabs
  - Close All Tabs
  - Copy Path
  - Split Right
  - Pin Tab
  - Open In
- assert_disabled: '[data-testid="context-menu-item-close-other-tabs"]'
- assert_disabled: '[data-testid="context-menu-item-close-tabs-to-the-right"]'
- assert_pattern:
    selector: '[data-testid="context-menu"]'
    regex: (?s)^\s*Close.*Close Other Tabs.*Close All Tabs.*Copy Path.*Split Right.*Pin Tab.*Open In
- press: Escape
- wait_for:
    selector: '[data-testid="context-menu"]'
    state: detached
    timeout_sec: 5
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: Right021.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="Right021.txt"]'
    timeout_sec: 15
- right_click: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="README.txt"] button'
- wait_for: '[data-testid="context-menu"]'
- click: '[data-testid="context-menu-item-close-tabs-to-the-right"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="Right021.txt"]'
    state: detached
    timeout_sec: 10
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: Other021.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="Other021.txt"]'
    timeout_sec: 15
- right_click: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="README.txt"] button'
- wait_for: '[data-testid="context-menu"]'
- click: '[data-testid="context-menu-item-close-other-tabs"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="Other021.txt"]'
    state: detached
    timeout_sec: 10
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A1/DEC-021-01：编辑器右键菜单以 Show Context Actions 置顶，按 剪贴板 → Find Usages/Go To › → Rename…/Refactor › → Reformat Code 分组；Go To › 内含 Declaration or Usages。
    actions:
    - 13
    - 17
    checkpoints:
    - step: 15
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"context-menu\"]", "regex": "(?s)^\\s*Show Context Actions.*Paste.*Find Usages.*Go To.*Rename.*Refactor.*Reformat Code"}}'
    - step: 16
      expectation: '{"assert_menu_items": ["Show Context Actions", "Find Usages", "Go To", "Rename…", "Refactor", "Reformat Code"]}'
    - step: 18
      expectation: '{"wait_for": {"selector": "[data-testid=\"editor-context-goto-declaration\"]", "timeout_sec": 5}}'
    - step: 19
      expectation: '{"assert_text": {"selector": "[data-testid=\"editor-context-goto-declaration\"]", "contains": "Declaration or Usages"}}'
    results:
    - 15
    - 16
    - 19
  - id: R2
    requirement: A3：Esc 关闭菜单后焦点回编辑器。
    actions:
    - 21
    checkpoints:
    - step: 22
      expectation: '{"wait_for": {"selector": "[data-testid=\"context-menu\"]", "state": "detached", "timeout_sec": 5}}'
    - step: 23
      expectation: '{"eval_readonly": {"expression": "document.activeElement?.classList.contains(''cm-content'') === true", "expect_truthy": true}}'
    results:
    - 23
  - id: R3
    requirement: A1/A2/DEC-021-02：tab 菜单按 IDEA 顺序（Close 组 → Copy Path → Split → Pin → Open In ›），单 tab 时 Close Other Tabs 与 Close Tabs to the Right 禁用。
    actions:
    - 24
    checkpoints:
    - step: 26
      expectation: '{"assert_menu_items": ["Close", "Close Other Tabs", "Close All Tabs", "Copy Path", "Split Right", "Pin Tab", "Open In"]}'
    - step: 27
      expectation: '{"assert_disabled": "[data-testid=\"context-menu-item-close-other-tabs\"]"}'
    - step: 28
      expectation: '{"assert_disabled": "[data-testid=\"context-menu-item-close-tabs-to-the-right\"]"}'
    - step: 29
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"context-menu\"]", "regex": "(?s)^\\s*Close.*Close Other Tabs.*Close All Tabs.*Copy Path.*Split Right.*Pin Tab.*Open In"}}'
    - step: 31
      expectation: '{"wait_for": {"selector": "[data-testid=\"context-menu\"]", "state": "detached", "timeout_sec": 5}}'
    results:
    - 26
    - 27
    - 28
    - 29
  - id: R4
    requirement: A3：有其他 tab 时 Close Tabs to the Right 与 Close Other Tabs 可用且执行原有关闭路径。
    actions:
    - 39
    - 48
    checkpoints:
    - step: 36
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-editor-tab-key$=\"Right021.txt\"]", "timeout_sec": 15}}'
    - step: 40
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-editor-tab-key$=\"Right021.txt\"]", "state": "detached", "timeout_sec": 10}}'
    - step: 45
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-editor-tab-key$=\"Other021.txt\"]", "timeout_sec": 15}}'
    - step: 49
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-editor-tab-key$=\"Other021.txt\"]", "state": "detached", "timeout_sec": 10}}'
    results:
    - 40
    - 49
  visual:
  - check: 对照 IDEA idea-15/16 的分组分隔线与子菜单箭头。
    method: manual
    reason: 像素另行比较；助记符下划线未实现（different）。
  native:
  - check: 本用例断言 renderer 菜单模型。
    method: not-applicable
    reason: browser 证据不外推 native。

id: TC-VOICE-004
title: Whisper and Zipformer share model cards, progress, cancellation and resume
covers: [F-AI-2.3]
tags: [ai, voice, download, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 160
steps:
- open: '${cfg.app.base_url}/?voiceFixture=1&voiceDownloadSlow=1'
- click: '[data-testid="welcome-open-local-terminal"]'
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="chat-voice-button"]'
- click: '[data-testid="chat-voice-button"]'
- wait_for: '[data-testid="asr-download-url-whisper-base"]'
- assert_attribute: {selector: '[data-testid="asr-download-url-whisper-base"]', name: href, equals: 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.bin?download=true'}
- click: '[data-testid="asr-copy-url-whisper-base"]'
- assert_text: {selector: '[data-testid="asr-copy-url-whisper-base"]', contains: Copied}
- assert_element_geometry: {selector: '[data-testid="voice-settings-dialog"]', min_width: 850, min_height: 400, viewport_margin: 8}
- screenshot: model-download-layout.png
- click: '[data-testid="asr-download-whisper-base"]'
- wait_for: '[data-testid="asr-installation-progress"]'
- assert_text: {selector: '[data-testid="asr-installation-progress"]', contains: '14.8 /', timeout_sec: 5}
- click: '[data-testid="voice-settings-close"]'
- click: '[data-testid="chat-voice-button"]'
- assert_text: {selector: '[data-testid="asr-installation-progress"]', contains: Downloading}
- assert_attribute: {selector: '[data-testid="asr-download-whisper-base"]', name: disabled, equals: ''}
- screenshot: restored-download-progress.png
- click: '[data-testid="asr-cancel-download"]'
- assert_text: {selector: '[data-testid="asr-installation-progress"]', contains: 'Download cancelled'}
- assert_text: {selector: '[data-testid="asr-download-whisper-base"]', contains: Resume download}
- click: '[data-testid="asr-download-whisper-base"]'
- assert_text: {selector: '[data-testid="asr-installation-progress"]', contains: 'Downloaded and verified', timeout_sec: 20}
- assert_text: {selector: '[data-testid="asr-model-whisper-base"]', contains: Downloaded}
- set_viewport: {width: 620, height: 760}
- assert_element_geometry: {selector: '[data-testid="voice-settings-dialog"]', min_width: 550, min_height: 400, viewport_margin: 8}
- screenshot: model-download-narrow.png
- assert_element_geometry: {selector: '[data-testid="voice-settings-close"]', min_width: 28, min_height: 26, icon_size: 16, tolerance: 2, viewport_margin: 8}
- set_viewport: {width: 1280, height: 900}
- select_option: {selector: '[data-testid="asr-realtime-provider"]', value: whisper-small-q8}
- assert_attribute: {selector: '[data-testid="asr-download-url-sherpa-zipformer-zh-en"]', name: href, equals: 'https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-bilingual-zh-en-2023-02-20/tree/98590b7ed6443e77b714204da2757d75e1a642f4'}
- click: '[data-testid="asr-copy-url-sherpa-zipformer-zh-en"]'
- assert_text: {selector: '[data-testid="asr-copy-url-sherpa-zipformer-zh-en"]', contains: Copied}
- click: '[data-testid="asr-download-sherpa-zipformer-zh-en"]'
- assert_text: {selector: '[data-testid="asr-sherpa-installation-progress"]', contains: '19.9 /', timeout_sec: 5}
- click: '[data-testid="voice-settings-close"]'
- click: '[data-testid="rail-chat-button"]'
- click: '[data-testid="chat-voice-button"]'
- assert_text: {selector: '[data-testid="asr-sherpa-installation-progress"]', contains: Downloading}
- assert_attribute: {selector: '[data-testid="asr-download-whisper-base"]', name: disabled, equals: ''}
- screenshot: zipformer-restored-download.png
- click: '[data-testid="asr-cancel-sherpa-download"]'
- assert_text: {selector: '[data-testid="asr-sherpa-installation-progress"]', contains: 'Download cancelled'}
- assert_text: {selector: '[data-testid="asr-download-sherpa-zipformer-zh-en"]', contains: Resume download}
- click: '[data-testid="asr-download-sherpa-zipformer-zh-en"]'
- assert_text: {selector: '[data-testid="asr-sherpa-installation-progress"]', contains: 'Downloaded and verified', timeout_sec: 20}
- click: '[data-testid="asr-select-sherpa-zipformer-zh-en"]'
- assert_localstorage: {key: taomni.ai.config.v1, contains: '"active":"sherpa-zipformer-zh-en"'}
- set_viewport: {width: 620, height: 760}
- assert_element_geometry: {selector: '[data-testid="voice-settings-dialog"]', min_width: 550, min_height: 400, viewport_margin: 8}
- screenshot: zipformer-model-narrow.png
- click: '[data-testid="asr-download-url-sherpa-zipformer-zh-en"]'
- click: '[data-testid="asr-open-url-sherpa-zipformer-zh-en"]'
- assert_visible: '[data-testid="asr-model-sherpa-zipformer-zh-en"]'

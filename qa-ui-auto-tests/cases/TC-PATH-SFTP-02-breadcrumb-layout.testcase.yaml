id: TC-PATH-SFTP-02
title: Attached SFTP remote and local breadcrumbs use one compact scroller without vertical overflow
description: Create disposable wide directories through SSH and open the attached SFTP pane. On both remote and local sides assert actual overflow, compact horizontal
  scrollbar styling, no vertical or outer overflow, a fixed edit button, focused editing, Escape, ancestor navigation and Back. Navigate remote to root and ensure local
  stays independent.
covers:
- F7.2
- F7.5
tags:
- p1
- breadcrumb
- filebrowser
- sftp
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
- path_completion
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="session-new"]'
    timeout_sec: 60
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- click: '[data-testid="session-specify-username"]'
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-path-overflow-ssh
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-path-overflow-ssh"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-path-overflow-ssh"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: mkdir -p '${fixture.sftp_shell_test_dir}/qa-path-overflow/${fixture.path_overflow_relative}' && printf 'overflow directory\n' >
      '${fixture.sftp_shell_test_dir}/qa-path-overflow/${fixture.path_overflow_relative}/overflow-marker.txt' && printf 'overflow parent\n' >
      '${fixture.sftp_shell_test_dir}/qa-path-overflow/${fixture.path_overflow_directory}/parent-marker.txt' && printf '\nQA_PATH_OVERFLOW_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_PATH_OVERFLOW_READY\r?$
    timeout_sec: 60
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-path-edit"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: ${fixture.sftp_sync_test_dir}/qa-path-overflow/${fixture.path_overflow_relative}
- press:
    selector: input[data-testid="sftp-remote-path"]
    key: Enter
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: overflow-marker.txt
- click: '[data-testid="sftp-local-path-edit"]'
- fill:

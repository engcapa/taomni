id: TC-IDE-PARITY-027-01
title: Code Workspace merges its tool window bar into the collapsed sidebar rail and remembers the sidebar state
description: "ED-PARITY-027 (PROP-026-01 B + A) browser case. Opening a Code Workspace collapses the main sidebar\
  \ to its rail and moves the workspace's left tool window bar into that rail (one bar instead of two); stripe buttons\
  \ keep working there. Expanding the sidebar returns the bar to the workspace and is remembered for Code Workspace\
  \ tabs while other tabs keep their own state; a relaunch starts Welcome from its own state; the Settings toggle\
  \ restores the old layout.\n\n  Mode: browser.\n"
covers:
- F1.2
- F25.5
tags:
- code-workspace
- sidebar
- ed-parity-027
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="control-bar"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    equal: 0
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]:visible'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-sidebar"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    timeout_sec: 5
- assert_not_visible: '[data-testid="session-tree"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"]:visible [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- assert_visible: '[data-testid="code-workspace-tab"]:visible [data-testid="code-workspace-tool-rail-right"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- eval_readonly:
    expression: (document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tree-pane\"]").getBoundingClientRect().width
      > 300) && (document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tree-pane\"]").getBoundingClientRect().width
      < 500)
    expect_truthy: true
- screenshot: tc-ide-parity-027-01-merged.png
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- wait_for:

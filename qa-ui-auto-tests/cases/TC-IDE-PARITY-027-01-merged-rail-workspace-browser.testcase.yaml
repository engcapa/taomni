id: TC-IDE-PARITY-027-01
title: Code Workspace merges its tool window bar into the collapsed sidebar rail and remembers the sidebar state
description: "ED-PARITY-027 (PROP-026-01 B + A) browser case. Opening a Code Workspace collapses the main sidebar to its rail and moves the workspace's left tool window bar into that rail (one bar instead of two); stripe buttons keep working there. Expanding the sidebar returns the bar to the workspace and is remembered for Code Workspace tabs while other tabs keep their own state; a relaunch starts Welcome from its own state; the Settings toggle restores the old layout.\n\n  Mode: browser.\n"
covers:
- F1.2
- F25.5
tags:
- code-workspace
- sidebar
- ed-parity-027
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    equal: 0
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    timeout_sec: 5
- assert_not_visible: '[data-testid="session-tree"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- assert_visible: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-right"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- eval_readonly:
    expression: (document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tree-pane\"]").getBoundingClientRect().width > 300) && (document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tree-pane\"]").getBoundingClientRect().width < 500)
    expect_truthy: true
- screenshot: tc-ide-parity-027-01-merged.png
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-pane"]'
    state: hidden
    timeout_sec: 5
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-pane"]'
    timeout_sec: 5
- assert_attribute:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    state: detached
    timeout_sec: 5
- wait_for: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
- assert_localstorage:
    key: taomni.sidebarCollapsedByGroup.v1
    contains: '"code-workspace":false'
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_visible: '[data-testid="session-tree"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    timeout_sec: 5
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_localstorage:
    key: taomni.sidebarCollapsed
    equals: 'false'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    equal: 0
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-general"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: false
- assert_localstorage:
    key: taomni.mergeToolWindowRail
    equals: 'false'
- click: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- screenshot: tc-ide-parity-027-01-merge-off.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A：从工具面板打开 Code Workspace 后，主侧栏自动折叠为左侧工具条（会话树隐藏）。
    actions:
    - 5
    - 6
    checkpoints:
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "timeout_sec": 5}}'
    - step: 9
      expectation: '{"assert_not_visible": "[data-testid=\"session-tree\"]"}'
    results:
    - 7
    - 8
    - 9
  - id: R2
    requirement: B：工作区的左工具窗口条进入主侧栏工具条（工作区内不再有第二条），右侧条仍在工作区；侧栏折叠后 Project 窗口保持像素宽度（不随工作区变宽而膨胀）；工具条里的 Project 按钮可隐藏/显示 Project 窗口。
    actions:
    - 19
    - 21
    checkpoints:
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 11
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]", "equal": 0}}'
    - step: 12
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-right\"]"}'
    - step: 17
      expectation: '{"eval_readonly": {"expression": "(document.querySelector(\"[data-testid\" + String.fromCharCode(61) + \"\\\"code-workspace-tree-pane\\\"]\").getBoundingClientRect().width > 300) && (document.querySelector(\"[data-testid\" + String.fromCharCode(61) + \"\\\"code-workspace-tree-pane\\\"]\").getBoundingClientRect().width < 500)", "expect_truthy": true}}'
    - step: 20
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-pane\"]", "state": "hidden", "timeout_sec": 5}}'
    - step: 22
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-pane\"]", "timeout_sec": 5}}'
    - step: 23
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-project\"]", "name": "aria-pressed", "equals": "true"}}'
    results:
    - 10
    - 11
    - 12
    - 17
    - 20
    - 22
    - 23
  - id: R3
    requirement: A：在工作区里展开主侧栏后工具条回到工作区，且该选择对 Code Workspace 标签记忆（切到 Welcome 再回来仍展开）；再次折叠后工具条重新合并，且同样被记住。
    actions:
    - 24
    - 29
    - 31
    - 34
    - 37
    - 39
    checkpoints:
    - step: 25
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 26
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "state": "detached", "timeout_sec": 5}}'
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 28
      expectation: '{"assert_localstorage": {"key": "taomni.sidebarCollapsedByGroup.v1", "contains": "\"code-workspace\":false"}}'
    - step: 30
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 32
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 33
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"]"}'
    - step: 35
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "timeout_sec": 5}}'
    - step: 36
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 38

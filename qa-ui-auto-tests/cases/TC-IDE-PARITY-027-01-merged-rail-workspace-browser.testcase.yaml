  - id: R5
    requirement: A：工作区折叠侧栏时重新加载（等同重启），Welcome 仍按自己的状态展开侧栏（旧键 taomni.sidebarCollapsed 保持 false），再开工作区仍折叠合并。
    actions:
    - 42

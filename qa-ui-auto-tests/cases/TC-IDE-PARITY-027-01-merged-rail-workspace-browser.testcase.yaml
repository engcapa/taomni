id: TC-IDE-PARITY-027-01
title: Code Workspace belongs to Workspaces with one grouped rail, persistent names and Project width
description: Retains Project show/hide, names, pixel width, cross-mode isolation and reload recovery. The Workspaces design always merges the editor rail,
  including with the legacy merge preference off.
covers:
- F1.2
- F25.5
tags:
- code-workspace
- sidebar
- ed-parity-027
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="workspace-code-tab"]'
- assert_attribute:
    selector: '[data-testid="nav-mode-workspaces"]'
    name: aria-pressed
    equals: 'true'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- wait_for: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- assert_visible: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-right"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"code-workspace-tree-pane"]').getBoundingClientRect().width > 300 && document.querySelector('[data-testid'+String.fromCharCode(61)+'"code-workspace-tree-pane"]').getBoundingClientRect().width
      < 500
    expect_truthy: true
- click: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-project"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-pane"]'
    state: hidden
    timeout_sec: 5
- click: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-project"]'
- wait_for: '[data-testid="code-workspace-tree-pane"]'
- right_click: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-project"]'
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- wait_for: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"][data-show-names="true"]'
- assert_text_equals:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-project"]'
    equals: Project
- right_click: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-project"]'
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- assert_text_equals:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-project"]'
    equals: ''
- screenshot: TC-IDE-PARITY-027-01-merged.png
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="expanded-sidebar-panel"]'
- wait_for: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_not_visible: '[data-testid="code-workspace-tab"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
    equal: 0
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-code-tab"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-general"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: false
- assert_localstorage:
    key: taomni.mergeToolWindowRail
    equals: 'false'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-code-tab"]'
- wait_for: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-code-tab"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- screenshot: TC-IDE-PARITY-027-01-recovered.png

    results:
    - 25
    - 26
    - 27
    - 28
    - 30
    - 32
    - 33
    - 35
    - 36
    - 38
    - 40
  - id: R4
    requirement: 设置里关闭“单一工具窗口条”后回到旧布局：工作区保留自己的左工具条，不再并入主侧栏。
    actions:

    - 55
    checkpoints:
    - step: 51
      expectation: '{"wait_for": "[data-testid=\"settings-panel\"]"}'
    - step: 54
      expectation: '{"assert_localstorage": {"key": "taomni.mergeToolWindowRail", "equals": "false"}}'
    - step: 56
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 57
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 58
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-tool-window-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]", "equal": 0}}'

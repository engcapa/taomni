id: TC-BACKUP-RESTORE-001
title: Restore confirmation rejects missing and incorrect current Vault passwords and shows staged success once verified
description: Create a preview HOTP and local manual backup through the UI, inspect its paired MFA/Vault file list, then try blank
  and incorrect current Vault passwords. Both must leave success absent and show actionable errors. Correct verification shows
  the staged status, clears the error and disables duplicate confirmation. This browser renderer model does not apply files or
  restart a native process. TC-MODULES-033/034/035 exercise this same confirmation in the native app, including handoff to
  the automatically relaunched desktop.
covers:
- F-BACKUP-1
- F-MFA-3
- F-MFA-1
tags:
- p0
- backup
- vault
- modules
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-module-restore-original
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-module-restore-original
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill:
    selector: '[data-testid="mfa-add-issuer"]'
    value: QA Module Restore
- fill:
    selector: '[data-testid="mfa-add-secret"]'
    value: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
- click: '[data-testid="mfa-add-advanced"]'
- select_option:
    selector: '[data-testid="mfa-add-kind"]'
    value: hotp
- click: '[data-testid="mfa-add-submit"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]'
    equals: 755 224
    timeout_sec: 30
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: backup
- wait_for: '[data-testid="backup-selected-start"]'
- set_check:
    selector: '[data-testid="backup-local-select"]'
    checked: true
- click: '[data-testid="backup-selected-start"]'
- wait_for: '[data-testid="backup-action-success"]'
- wait_for: '[data-testid="backup-local-restore"]'
- click: '[data-testid="backup-local-restore"]'
- wait_for: '[data-testid="backup-restore-files"]'
- assert_text:
    selector: '[data-testid="backup-restore-files"]'
    contains: databases/mfa.db
- assert_text:
    selector: '[data-testid="backup-restore-files"]'
    contains: databases/vault.db
- click: '[data-testid="backup-restore-confirm"]'
- assert_text_equals:
    selector: '[data-testid="backup-restore-error"]'
    equals: Vault master password is required.
- assert_not_visible: '[data-testid="backup-restore-staged"]'
- fill:
    selector: '[data-testid="backup-restore-vault-password"]'
    value: wrong-password
- click: '[data-testid="backup-restore-confirm"]'
- assert_text_equals:
    selector: '[data-testid="backup-restore-error"]'
    equals: Incorrect vault master password. Verification failed.
- assert_not_visible: '[data-testid="backup-restore-staged"]'
- fill:
    selector: '[data-testid="backup-restore-vault-password"]'
    value: qa-module-restore-original
- click: '[data-testid="backup-restore-confirm"]'
- wait_for: '[data-testid="backup-restore-staged"]'
- assert_text_equals:
    selector: '[data-testid="backup-restore-staged"]'
    equals: Staging complete, restarting application...
- assert_attribute:
    selector: '[data-testid="backup-restore-confirm"]'
    name: disabled
    equals: ''
- assert_not_visible: '[data-testid="backup-restore-error"]'
- assert_no_runtime_errors: null
- screenshot: backup-restore-confirmation-staged.png
- assert_count: {selector: '[data-testid="backup-restore-staged"]', equal: 1}
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A UI-created preview backup opens the paired MFA and Vault archive inventory.
    actions:
    - 24
    - 27
    checkpoints:
    - step: 29
      expectation: The renderer lists databases/mfa.db.
    - step: 30
      expectation: The renderer lists databases/vault.db.
    results:
    - 29
    - 30
  - id: R2
    requirement: Blank and rejected passwords never show staged success; a correct password stages and blocks duplicate submission.
    actions:
    - 31
    - 35
    - 39
    checkpoints:
    - step: 32
      expectation: A blank current master password is required before IPC staging.
    - step: 33
      expectation: Blank verification leaves no staged success.
    - step: 36
      expectation: Incorrect verification displays its translated error.
    - step: 37
      expectation: Rejected verification leaves no staged success.
    - step: 41
      expectation: Correct verification shows the staging complete status.
    - step: 42
      expectation: Confirmation is disabled after success.
    - step: 43
      expectation: Successful verification clears the previous dialog error.
    - step: 44
      expectation: Expected password rejection and recovery cause no runtime errors.
    - step: 46
      expectation: The successful submission renders one staging receipt.
    results:
    - 32
    - 33
    - 36
    - 37
    - 41
    - 42
    - 43
    - 44
    - 46
  visual:
  - check: Archive inventory, verification errors and staged state are legible.
    method: manual
    reason: Review backup-restore-confirmation-staged.png.
  native:
  - check: Real files, normal restart/apply and Vault decryption.
    method: external
    reason: Explicit renderer model only; native backend evidence comes from TC-MODULES-013/014/015. Native automatic relaunch
      remains unverified.

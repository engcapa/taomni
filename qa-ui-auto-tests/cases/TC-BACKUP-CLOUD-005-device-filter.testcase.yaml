id: TC-BACKUP-CLOUD-005
title: Cloud restore filter identifies devices by readable names
description: Browser UI model verifies names and stable identifiers in cross-device restore selection.
covers: [F-BACKUP-2]
tags: [backup, settings, p1]
modes: [browser]
fixtures: [reset_db, backup_cloud]
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for: '[data-testid="backup-cloud-refresh"]:not([disabled])'
- click: '[data-testid="backup-cloud-refresh"]'
- wait_for: '[data-testid="backup-cloud-row"]'
- assert_text: {selector: '[data-testid="backup-source-device"]', contains: Office laptop}
- assert_text: {selector: '[data-testid="backup-source-device"]', contains: Home desktop}
- select_option: {selector: '[data-testid="backup-source-device"]', value: '11111111-1111-4111-8111-111111111111'}
- assert_count: {selector: '[data-testid="backup-cloud-row"]', equal: 1}
- assert_text: {selector: '[data-testid="backup-cloud-row"]', contains: Office laptop}
- select_option: {selector: '[data-testid="backup-source-device"]', value: '22222222-2222-4222-8222-222222222222'}
- assert_count: {selector: '[data-testid="backup-cloud-row"]', equal: 1}
- assert_text: {selector: '[data-testid="backup-cloud-row"]', contains: Home desktop}
- screenshot: backup-device-filter.png
verification:
  review: reviewed
  native:
  - check: Device filtering is renderer state only.
    method: not-applicable
    reason: Native folder naming and object identity are covered by TC-BACKUP-CLOUD-004.
  visual:
  - check: Device names and identifier suffixes remain readable in the selector and restore row.
    method: manual
    reason: Inspect the retained browser screenshot.
  requirements:
  - id: R1
    requirement: Cross-device filtering uses stable identity and shows readable names.
    actions: [7, 11, 14]
    checkpoints:
    - {step: 9, expectation: Office device name appears in the selector}
    - {step: 10, expectation: Home device name appears in the selector}
    - {step: 12, expectation: Office selection shows one matching backup}
    - {step: 13, expectation: Office backup has its readable name}
    - {step: 15, expectation: Home selection shows one matching backup}
    - {step: 16, expectation: Home backup has its readable name}
    results: [9, 10, 12, 13, 15, 16]

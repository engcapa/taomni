id: TC-IDE-LAT-01-java-typing-latency-native
title: Java/JDT continuous typing latency with live diagnostics
description: 'AC-LAT-01/02 Linux measurement slice for the Java input path. Enters the

  in-repo single-module Maven sample through persisted recents, opens App.java,

  waits for the real jdtls session (Java status pill), then records continuous

  typing at the end of the last line while the provider is active: a 24-key

  warmup plus two 50-key measured groups (N=100 measured physical keys).

  native_editor_performance stores keydown-to-CodeMirror-DOM raw samples per

  group (native-editor-performance-*.json) together with the observed keydown

  and beforeinput/input records; the case asserts the caret advanced by the

  exact typed length, the appended bytes are present in order (no dropped or

  reordered input), provider diagnostics converge after the burst (gutter

  lightbulb on the error line), and four Ctrl+Z strokes remove exactly the

  last four characters. The per-group max_p95_ms values are sanity guardrails,

  not budgets: the recorded p50/p95/max raw samples are the evidence and no

  absolute budget is claimed. The fixture is the checked-in Maven sample, not

  the reporter''s personal project, because native cases must never mutate a

  personal project.

  '
covers:
- F25.5
tags:
- code-workspace
- ide
- performance
- typing-latency
- java-provider
- native-gate
- p1
modes:
- native
fixtures:
- reset_db
- java_sample_projects
- jdtls_required
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-lat-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-lat-java","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/App.java"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: package com.example.single;
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="code-workspace-lsp-status-pill"]'
    contains: Java
    timeout_sec: 60
- wait: 2
- click: '[data-testid="code-workspace-editor"] .cm-content'
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Mod+End
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: Ln 55, Col 1
    timeout_sec: 10
- native_editor_performance:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    keys: ABCDEFGHIJKLMNOPQRSTUVWX
    capture_text: false
    max_p95_ms: 150
    label: java-jdt-warmup
- native_editor_performance:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    keys: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWX
    capture_text: false
    max_p95_ms: 150
    label: java-jdt-group1
- native_editor_performance:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    keys: 0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN
    capture_text: false
    max_p95_ms: 150
    label: java-jdt-group2
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: Ln 55, Col 125
    timeout_sec: 10
- eval_readonly:
    expression: (document.querySelector('.cm-content')?.textContent ?? '').includes('ABCDEFGHIJKLMNOPQRSTUVWXabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWX0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN')
    expect_truthy: true
- wait_for:
    selector: '[data-testid="code-workspace-lightbulb"]'
    timeout_sec: 60
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Mod+z
    - Mod+z
    - Mod+z
    - Mod+z
- wait: 0.5
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: Ln 55, Col 121
    timeout_sec: 10
- screenshot: tc-ide-lat-01-java-typing.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Java/JDT continuous typing latency with live diagnostics：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 13
    - 14
    - 22
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor-pane\"]", "timeout_sec": 60}}'
    - step: 10
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"]", "contains": "package
        com.example.single;", "timeout_sec": 60}}'
    - step: 11
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-lsp-status-pill\"]", "contains":
        "Java", "timeout_sec": 60}}'
    - step: 15
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar-workspace-cursor\"]", "contains": "Ln
        55, Col 1", "timeout_sec": 10}}'
    - step: 16
      expectation: '{"native_editor_performance": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content",
        "keys": "ABCDEFGHIJKLMNOPQRSTUVWX", "capture_text": false, "max_p95_ms": 150, "label": "java-jdt-warmup"}}'
    - step: 17
      expectation: '{"native_editor_performance": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content",
        "keys": "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWX", "capture_text": false, "max_p95_ms": 150,
        "label": "java-jdt-group1"}}'
    - step: 18
      expectation: '{"native_editor_performance": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content",
        "keys": "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN", "capture_text": false, "max_p95_ms": 150,
        "label": "java-jdt-group2"}}'
    - step: 19
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar-workspace-cursor\"]", "contains": "Ln
        55, Col 125", "timeout_sec": 10}}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "(document.querySelector(''.cm-content'')?.textContent ?? '''').includes(''ABCDEFGHIJKLMNOPQRSTUVWXabcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWX0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN'')",
        "expect_truthy": true}}'
    - step: 21
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-lightbulb\"]", "timeout_sec": 60}}'
    - step: 24
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar-workspace-cursor\"]", "contains": "Ln
        55, Col 121", "timeout_sec": 10}}'
    results:
    - 24
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

id: TC-IDE-PARITY-004-01
title: 'Keymap rebind: draft isolation, Apply commit, real dispatch and reopen read-back'
description: 'ED-PARITY-004 A1.4/A1.5/S2/S3/S5 browser case. Proves the DEC-03 commit
  boundary end to end through real UI controls and REAL key presses: a recorded
  chord is draft-only until Apply, Apply makes the new chord execute and the old
  one stop executing, the dialog reopens on the effective value, and a cancel
  path discards the draft with zero live change.

  A deliberate deviation from the P1 prose: P1 wrote that clicking Apply
  detaches the dialog. Real IDEA 2026.2.3 (IU-262.10968.63, reference §3.1/§3.5)
  keeps Settings open for Apply and only closes on OK, so this case closes the
  dialog explicitly after Apply and asserts that behavior instead.

  Mode: browser — every assertion is a renderer + per-profile localStorage
  effect reachable in the Vite harness. Real-app-restart persistence is
  TC-IDE-PARITY-004-04 (native).

  '
covers:
- F25.5
tags:
- code-workspace
- keymap
- ed-parity-004
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300

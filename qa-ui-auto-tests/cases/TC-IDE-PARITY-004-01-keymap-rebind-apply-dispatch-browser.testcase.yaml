verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: "A1.4 DEC-03：录制并确认后的草稿不写任何存储，关闭对话框零写入，live 仍按旧 chord 派发。"
    actions: [26, 27, 28]
    checkpoints:
    - step: 29
      expectation: "{\"assert_text\": {\"selector\": \"[data-testid=\\\"keymap-replace-editor.replace-0\\\"]\", \"contains\": \"Alt+Shift+R\"}}"
    - step: 30
      expectation: "{\"assert_localstorage\": {\"key\": \"taomni.codeWorkspace.keymap.v3:index\", \"exists\": false}}"
    - step: 36
      expectation: "{\"assert_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"]\"}"
    results: [30, 36]
  - id: R2
    requirement: "A1.4/A1.5 S3：Apply 是唯一提交边界；Apply 后新 chord 真的执行 Replace，旧 chord 不再命中该动作，重复按下不重复派发。"
    actions: [53]
    checkpoints:
    - step: 54
      expectation: "{\"assert_disabled\": \"[data-testid=\\\"keymap-settings-apply\\\"]\"}"
    - step: 55
      expectation: "{\"assert_localstorage\": {\"key\": \"taomni.codeWorkspace.keymap.v3:index\", \"contains\": \"Alt+Shift+R\"}}"
    - step: 60
      expectation: "{\"assert_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"]\"}"
    - step: 65
      expectation: "{\"assert_not_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"]\"}"
    - step: 68
      expectation: "{\"assert_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"]\"}"
    results: [55, 60, 65, 68]
  - id: R3
    requirement: "A1.5 S3c：重开设置对话框读到 Apply 后的有效配置。"
    actions: [78]
    checkpoints:
    - step: 81
      expectation: "{\"assert_text\": {\"selector\": \"[data-testid=\\\"keymap-replace-editor.replace-0\\\"]\", \"contains\": \"Alt+Shift+R\"}}"
    results: [81]
  - id: R4
    requirement: "A1.2 S5：改键后不 Apply 直接 Esc 关闭，live 有效绑定仍按已生效的 Alt+Shift+R 工作。"
    actions: [85]
    checkpoints:
    - step: 85
      expectation: "{\"assert_enabled\": \"[data-testid=\\\"keymap-settings-apply\\\"]\"}"
    - step: 88
      expectation: "{\"wait_for\": {\"selector\": \"[data-testid=\\\"workspace-keymap-settings-dialog\\\"]\", \"state\": \"detached\", \"timeout_sec\": 5}}"
    - step: 91
      expectation: "{\"assert_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"]\"}"
    results: [91]
  visual:
  - check: 草稿态与 Apply 后的动作行 swatch、底部 OK/Cancel/Apply 三按钮（Apply 禁用态）布局无截断；
      720px 对话框内动作标题与 swatch 不互相遮挡。
    method: manual
    reason: 像素/字体/DPI 边界不能由 DOM 断言代替，截图需人工评审。
  native:
  - check: 仅在用例声明的执行模式中采集证据；真实应用重启后的 profile 持久化由 TC-IDE-PARITY-004-04
      在 native 层证明，browser 证据不替代它。
    method: external
    reason: browser 无法证明跨进程重启后 localStorage 存活。


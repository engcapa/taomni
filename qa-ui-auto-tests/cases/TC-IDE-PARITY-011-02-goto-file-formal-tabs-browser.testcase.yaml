    - 44
    - 51
    checkpoints:
    - step: 31
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-editor-tab-key]", "equal": 1}}'
    - step: 53
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-editor-tab-key]", "equal": 4}}'
    - step: 54
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-preview=\"true\"]", "equal": 0}}'
    results:
    - 53
    - 54
  visual:
  - check: 检查 widget 与 tab 胶囊/图标需对照 IDEA idea-03/idea-29。

id: TC-IDE-PARITY-011-02
title: Go to File opens formal tabs instead of replacing a preview
description: 'ED-PARITY-011 A2/A4 browser case (DEC-ALIGN-10): three Go to File openings leave three formal tabs instead of one preview tab replacing the previous file.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-011
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: a011.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="a011.txt"]'
    timeout_sec: 15
- press: Control+F4
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: b011.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="b011.txt"]'
    timeout_sec: 15
- press: Control+F4
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: c011.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key$="c011.txt"]'
    timeout_sec: 15
- press: Control+F4
- assert_count:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key]'
    equal: 1
- click: '[data-testid="code-workspace-tab"]'
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- type:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
    text: a011.txt
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"] button:has-text("a011.txt")'
    timeout_sec: 15
- press: Enter
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"][data-editor-tab-key$="a011.txt"]'
    timeout_sec: 15
- click: '[data-testid="code-workspace-tab"]'
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- type:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
    text: b011.txt
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"] button:has-text("b011.txt")'
    timeout_sec: 15
- press: Enter
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"][data-editor-tab-key$="b011.txt"]'
    timeout_sec: 15
- click: '[data-testid="code-workspace-tab"]'
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- type:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
    text: c011.txt
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"] button:has-text("c011.txt")'
    timeout_sec: 15
- press: Enter
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"][data-editor-tab-key$="c011.txt"]'
    timeout_sec: 15
- assert_count:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key]'
    equal: 4
- assert_count:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-preview="true"]'
    equal: 0
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A2/A4/DEC-011-04：Go to File 连开三个文件得到三个正式 tab（不替换、无 preview）。
    actions:

- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-activeLine'
    contains: System.out.println(names.size());
# Move to the logical source line even while default import folding is active.
# Visual ArrowDown counts can land on main's closing brace after imports fold.
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Home
    - Home
    - Shift+End
- type: '        System.out.p'
- wait_for:
    selector: .cm-tooltip-autocomplete li.cm-completion-type-method
    timeout_sec: 90
- type: r
- wait: 0.6
- type: i
- wait: 0.6
- type: n
- wait: 0.6
- type: t
- wait: 0.6
- type: l
- wait: 0.6
- type: n
- wait: 0.6
- wait: 1
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: println(
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - ArrowDown
    - ArrowUp
    - ArrowDown
- wait: 1
- wait_for: .cm-tooltip-autocomplete .cm-completionInfo
- screenshot: java-completion-selected.png
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Tab
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: System.out.println(
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Mod+z
- eval_readonly:
    expression: document.querySelector(".cm-content").innerText.includes("System.out.println\n")
    expect_truthy: true
- press: Escape
- eval_readonly:

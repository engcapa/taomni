id: TC-SHELL-B30
title: Responsive layout preserves preferences across all breakpoints
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b30.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.2
- F1.6
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- set_viewport:
    width: 1440
    height: 900
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-mode
    equals: wide
- assert_visible: '[data-testid="session-tree"]'
- set_viewport:
    width: 1199
    height: 900
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-mode
    equals: medium
- assert_not_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-navigator-placement
    equals: dock
- press:
    selector: '[data-testid="shell-navigator-hide"]'
    key: Escape
- assert_not_visible: '[data-testid="session-tree"]'
- set_viewport:
    width: 960
    height: 900
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-mode
    equals: medium
- set_viewport:
    width: 959
    height: 900
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-mode
    equals: overlay
- set_viewport:
    width: 720
    height: 600
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-mode
    equals: overlay
- set_viewport:
    width: 719
    height: 600
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-mode
    equals: compact
- assert_visible: '[data-testid="shell-overview-trigger"]'
- assert_visible: '[data-testid="shell-quick-switch"]'
- set_viewport:
    width: 1440
    height: 900
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-mode
    equals: wide
- assert_visible: '[data-testid="session-tree"]'
- screenshot: tc-shell-b30.png

id: TC-WS-PROTOTYPE-001
title: Workspace navigation prototype routes and responsive layout
description: Separate prototype verification; screenshots and console receipt must be reviewed. This does not certify
  production behavior.
covers:
- F-WorkspacePrototype-1
tags:
- workspace-first
- prototype
modes:
- browser
fixtures: []
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}/docs-feature/ui-layout-refactor-prototype.html
- set_viewport:
    width: 1440
    height: 900
- assert_text:
    selector: '#canvasTitle'
    contains: Workspace
- assert_count:
    selector: .top-tab
    equal: 0
- eval_readonly:
    expression: document.characterSet === "UTF-8" && document.querySelector("link").getAttribute("href") === "data:,"
    expect_truthy: true
- click: '[data-view="sessions"]'
- assert_text:
    selector: '#sessionList'
    contains: canonical
- click: '[data-view="tools"]'
- assert_text:
    selector: '#toolsList'
    contains: Tools outside workspace
- click: '[data-view="workspaces"]'
- assert_text:
    selector: '#sessionList'
    contains: taomni
- click: '[data-surface="overview"]'
- assert_visible: '#overviewSurface'
- click: '[data-surface="files"]'
- assert_visible: '#filesSurface'
- click: '[data-surface="preview"]'
- assert_visible: '#previewSurface'
- click: '[data-surface="chat"]'
- assert_visible: '#chatSurface'
- click: '[data-surface="changes"]'
- assert_visible: '#changesSurface'
- click: '[data-surface="mail"]'
- assert_visible: '#mailSurface'
- click: '[data-tool="overview"]'
- assert_text:
    selector: '#sideBody'
    contains: scoped tool
- click: '[data-tool="changes"]'
- assert_text:
    selector: '#sideBody'
    contains: scoped tool
- click: '[data-tool="tasks"]'
- assert_text:
    selector: '#sideBody'
    contains: scoped tool
- click: '[data-tool="notes"]'
- assert_text:
    selector: '#sideBody'
    contains: scoped tool
- click: '[data-view="tools"]'
- click: '[data-global-tool="servers"]'
- assert_text:
    selector: '#toast'
    contains: global scope
- click: '[data-global-tool="network"]'
- assert_text:
    selector: '#toast'
    contains: global scope
- click: '[data-global-tool="capture"]'
- assert_text:
    selector: '#toast'
    contains: global scope
- click: '[data-global-tool="mfa"]'
- assert_text:
    selector: '#toast'
    contains: global scope
- click: '[data-global-tool="lan"]'
- assert_text:
    selector: '#toast'
    contains: global scope
- click: '[data-global-tool="git"]'
- assert_visible: '#changesSurface'
- click: '[data-global-tool="sftp"]'
- assert_visible: '#filesSurface'
- click: '[data-global-tool="mail"]'
- assert_visible: '#mailSurface'
- press: Control+k
- assert_visible: '#commandOverlay'
- fill:
    selector: '#commandInput'
    value: preview
- click: '[data-command="preview"]'
- assert_visible: '#previewSurface'
- click: '#themeBtn'
- assert_attribute:
    selector: html
    name: data-theme
    equals: dark
- click: '#newBtn'
- assert_text:
    selector: '#toast'
    contains: New workspace
- click: '#detachBtn'
- assert_text:
    selector: '#toast'
    contains: native window
- click: '#closeBtn'
- assert_text:
    selector: '#toast'
    contains: Close active workspace
- click: '#sideSearchBtn'
- assert_text:
    selector: '#toast'
    contains: Search tools
- click: '#sideCloseBtn'
- assert_count:
    selector: '#sidePane:not(.hidden)'
    equal: 0
- click: '#sideToggle'
- assert_visible: '#sidePane'
- set_viewport:
    width: 1440
    height: 900
- click: '[data-view="workspaces"]'
- click: '#collapseBtn'
- assert_element_geometry:
    selector: main.main
    min_width: 250
    min_height: 100
- eval_readonly:
    expression: document.documentElement.scrollWidth <= document.documentElement.clientWidth
    expect_truthy: true
- click: '[data-view="workspaces"]'
- assert_visible: '#sessionList'
- screenshot: prototype-1440.png
- set_viewport:
    width: 980
    height: 800
- click: '[data-view="workspaces"]'
- click: '#collapseBtn'
- assert_element_geometry:
    selector: main.main
    min_width: 250
    min_height: 100
- eval_readonly:
    expression: document.documentElement.scrollWidth <= document.documentElement.clientWidth
    expect_truthy: true
- click: '[data-view="workspaces"]'
- assert_visible: '#sessionList'
- screenshot: prototype-980.png
- set_viewport:
    width: 400
    height: 700
- click: '[data-view="workspaces"]'
- click: '#collapseBtn'
- assert_element_geometry:
    selector: main.main
    min_width: 250
    min_height: 100
- eval_readonly:
    expression: document.documentElement.scrollWidth <= document.documentElement.clientWidth
    expect_truthy: true
- click: '[data-view="workspaces"]'
- assert_visible: '#sessionList'
- screenshot: prototype-400.png

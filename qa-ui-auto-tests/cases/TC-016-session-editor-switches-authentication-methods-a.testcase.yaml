id: TC-016
title: Session editor switches authentication methods and reveals credentials
covers:
- F6.3
- F6.5
tags:
- auth
- p1
- session
- ssh
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: auth.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '22'
- send_text_via_label:
    label_contains: Specify username
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qauser
- assert_visible: '[data-testid="advanced-ssh-settings"]'
- assert_visible: input[aria-label="SSH password"]
- fill:
    selector: input[aria-label="SSH password"]
    value: qa-secret-123
- assert_attribute:
    selector: input[aria-label="SSH password"]
    name: type
    equals: password
- click: '[data-testid="session-editor"] div:has(> input[aria-label="Private key path"]) > input[type="checkbox"]'
- wait_for: input[aria-label="Private key path"]
- fill:
    selector: input[aria-label="Private key path"]
    value: /home/qauser/.ssh/id_ed25519
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: ssh-tunnel
- assert_visible: input[aria-label="Jump host"]
- fill:
    selector: input[aria-label="Jump host"]
    value: bastion.example.test
- fill:
    selector: input[aria-label="Jump user"]
    value: qajump
- fill:
    selector: input[aria-label="Jump port"]
    value: '22'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-auth-methods
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-auth-methods"]'
- eval_readonly:
    expression: JSON.parse(JSON.parse(localStorage.getItem("taomni.sessions.v1"))[0].options_json).usePrivKey === true
    expect_truthy: true
- eval_readonly:
    expression: JSON.parse(JSON.parse(localStorage.getItem("taomni.sessions.v1"))[0].options_json).networkSettings.proxyKind === "ssh-tunnel"
    expect_truthy: true
- eval_readonly:
    expression: JSON.parse(JSON.parse(localStorage.getItem("taomni.sessions.v1"))[0].options_json).networkSettings.jumpHost === "bastion.example.test"
    expect_truthy: true
- eval_readonly:
    expression: JSON.parse(JSON.parse(localStorage.getItem("taomni.sessions.v1"))[0].options_json).networkSettings.jumpUser === "qajump"
    expect_truthy: true
- eval_readonly:
    expression: JSON.parse(JSON.parse(localStorage.getItem("taomni.sessions.v1"))[0].options_json).networkSettings.jumpPort === "22"
    expect_truthy: true
- screenshot: 016-session-auth-methods.png

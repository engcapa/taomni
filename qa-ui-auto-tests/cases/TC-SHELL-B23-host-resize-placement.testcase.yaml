id: TC-SHELL-B23
title: Host resize keyboard, placement and persistence
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b23.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F-SHELL-1
- F7.4
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- press:
    selector: '[data-testid="shell-host-resize"]'
    key: Home
- assert_attribute:
    selector: '[data-testid="shell-host-resize"]'
    name: aria-valuenow
    equals: '280'
- press:
    selector: '[data-testid="shell-host-resize"]'
    key: ArrowRight
- assert_attribute:
    selector: '[data-testid="shell-host-resize"]'
    name: aria-valuenow
    equals: '288'
- press:
    selector: '[data-testid="shell-host-resize"]'
    key: Shift+ArrowRight
- assert_attribute:
    selector: '[data-testid="shell-host-resize"]'
    name: aria-valuenow
    equals: '320'
- click: '[data-testid="shell-host-more"]'
- click: '[data-testid="shell-panel-move-bottom"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-edge
    equals: bottom
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_shell_backend:
    command: sftp_attach
    count: 1
    status: requested
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- click: '[data-testid="shell-host-pin"]'
- assert_attribute:
    selector: '[data-testid="shell-work-area"]'
    name: inert
    equals: ''
- press:
    selector: '[data-testid="shell-host-hide"]'
    key: Escape
- assert_not_visible: '[data-testid="shell-host"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 1
    status: requested
- screenshot: tc-shell-b23.png

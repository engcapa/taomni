id: TC-SERVERS-005-local-ssh-credential-browser
title: Local servers saves and removes the SSH password from its settings form
description: Exercise credential entry, hidden saved state and explicit removal after reload through the Browser stub.
covers: [F-Servers-1]
tags: [servers, regression]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 100
steps:
- open: '${cfg.app.base_url}?servers=main'
- seed_storage: {key: taomni.preview.modules.servers.v1, value: '{"lifecycle":"enabled","values":[]}'}
- reload_window: null
- wait_for: '[data-testid="servers-dialog"]'
- click: '[data-testid="server-row-ssh"]'
- wait_for: '[data-testid="plugin-tab-panel"][data-plugin-slug="servers"] [data-testid="server-field-ssh-password"]'
- fill: {selector: '[data-testid="server-field-ssh-password"]', value: 'qa-browser-ssh-secret'}
- click: '[data-testid="servers-dialog-apply"]'
- wait_for: {selector: '[data-testid="vault-setup-dialog"]', timeout_sec: 20}
- fill: {selector: '[data-testid="vault-setup-pw1"]', value: 'qa-local-server-vault'}
- fill: {selector: '[data-testid="vault-setup-pw2"]', value: 'qa-local-server-vault'}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: {selector: '[data-testid="vault-setup-dialog"]', state: detached}
- assert_localstorage: {key: taomni.stub.serverConfigs.v1, contains: '"passwordRef":"vault:stub-ssh-server-password"'}
- reload: null
- wait_for: '[data-testid="servers-dialog"]'
- click: '[data-testid="server-row-ssh"]'
- wait_for: '[data-testid="server-field-ssh-remove-password"]'
- assert_attribute: {selector: '[data-testid="server-field-ssh-password"]', name: value, equals: ''}
- set_check: {selector: '[data-testid="server-field-ssh-remove-password"]', checked: true}
- click: '[data-testid="servers-dialog-apply"]'
- wait_for: {selector: '[data-testid="server-field-ssh-remove-password"]', state: detached}
- reload: null
- wait_for: '[data-testid="servers-dialog"]'
- click: '[data-testid="server-row-ssh"]'
- wait_for: '[data-testid="server-field-ssh-password"]'
- assert_not_visible: '[data-testid="server-field-ssh-remove-password"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: credential
    requirement: The Local servers form remembers an SSH credential reference and removes it after explicit selection.
    actions: [5, 7, 8, 12, 15, 17, 20, 21, 23, 25]
    checkpoints:
    - {step: 14, expectation: Browser preview stored a reference.}
    - {step: 19, expectation: The form does not display the saved password after reload.}
    - {step: 27, expectation: The removed credential is absent after the next reload.}
    - {step: 28, expectation: Both saves complete without runtime errors.}
    results: [14, 19, 27, 28]
  visual:
  - check: The saved credential and removal action appear in the expected form state.
    method: automated
    reason: The case checks the input and removal checkbox after reloading.
  native:
  - check: Actual migrated credential use.
    method: not-applicable
    reason: TC-MODULES-066 covers the native signed module and Vault.

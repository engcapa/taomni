id: TC-SHOT-036
title: Scattered watermark, in-place image editing, pin notes and arrangement controls
description: Browser coverage for tiled watermark, editor dialog, note persistence and batch pin actions; native
  pin arrangement is verified by TC-SHOT-N20.
covers:
- F27.1
tags:
- screenshot
- watermark
- editor
- pins
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-watermark"]'
- fill:
    selector: '[data-testid="screenshot-watermark-text"]'
    value: Confidential
- click: '[data-testid="screenshot-watermark-apply"]'
- assert_attribute:
    selector: '[data-testid="screenshot-watermark"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-edit"]'
- wait_for: '[data-testid="screenshot-edit-panel"]'
- click: '[data-testid="screenshot-edit-rotate"]'
- click: '[data-testid="screenshot-edit-undo"]'
- click: '[data-testid="screenshot-edit-redo"]'
- click: '[data-testid="screenshot-edit-external"]'
- wait_for: '[data-testid="system-screenshot"]'
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- fill:
    selector: '[data-testid="screenshot-pin-note-input"]'
    value: Compare with design
- click: '[data-testid="screenshot-pin-note-save"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- assert_text:
    selector: '[data-testid="screenshot-pin-note"]'
    contains: Compare with design
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- click: '[data-testid="screenshot-pin-collapse"]'
- wait_for: '[data-testid="screenshot-pin-expand"]'
- click: '[data-testid="screenshot-pin-expand"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- click: '[data-testid="screenshot-pins-tile"]'
- click: '[data-testid="screenshot-pin-close"]'
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: watermark-editor-notes
    requirement: Watermark configuration, editor history, external editing, pin notes and batch actions remain usable.
    actions:
    - 5
    - 6
    - 7
    - 9
    - 11
    - 12
    - 13
    - 14
    - 19
    - 21
    - 22
    - 23
    - 24
    - 26
    - 27
    - 28
    - 29
    - 30
    - 31
    - 32
    checkpoints:
    - step: 8
      expectation: Watermark is active.
    - step: 10
      expectation: The in-place editor is open.
    - step: 15
      expectation: External editing restores the main view.
    - step: 20
      expectation: Pin displays the captured image.
    - step: 25
      expectation: Saved note is displayed.
    - step: 33
      expectation: Closing the pin restores the main view.
    results:
    - 8
    - 10
    - 15
    - 20
    - 25
    - 33
  visual:
  - check: Watermark and edited image appearance
    method: external
    reason: Inspect the renderer output; the automated checks establish control state and navigation.
  native:
  - check: Pin arrangement and Wayland board
    method: external
    reason: TC-SHOT-N20 exercises native window geometry, original files and the Wayland board.

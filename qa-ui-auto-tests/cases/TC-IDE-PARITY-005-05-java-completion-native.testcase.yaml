      JDK 同名项），Enter 一次提交 identifier+import，显式 Save 后 host 文件字节包含该 import，一次 Ctrl+Z + Save 使文件 SHA-256
      回到 pristine；append 候选接受后 Tab 仅做纯 snippet 导航（正文无新增换行/缩进），一次 Undo 恢复 appen 且保存后哈希仍为 pristine；保存后再次在
      live buffer 上触发补全成功。browser 无法证明真实 provider 报文、Rust resolve 边界与 host 字节，故为 native；Windows/macOS
      未验证。

id: TC-IDE-PARITY-005-05
title: 'Java Basic Completion against real JDT LS: type import, snippet accept and disk bytes'
description: 'ED-PARITY-005 V5 (A1/A3) native/provider case on Linux/WebKitGTK. The in-repo maven-single sample is opened through persisted recents and served by a REAL JDT LS process (Java pill active). It proves: the type candidate for org.apache.commons.lang3.StringUtils (not the com.sun twin) is selectable and accepting it lands the identifier plus one import, the saved host bytes contain that import, ONE Ctrl+Z plus a save returns the file to its exact pristine SHA-256, the append(String str) method candidate is accepted as one dispatch whose single undo restores the appen prefix (with the save proving disk), completion still works after the saves, and a caret typed inside an identifier (StringUtisuffix) is recorded: this provider returns no JDT LS candidate there (the local template list still opens), which is the recorded provider boundary for the IDEA-observed mid-word Enter/Tab split - that client contract is covered by TC-IDE-PARITY-005-02 and the unit tests. Platform scope: Linux only; Windows/macOS remain unverified.'
covers:
- F25.5
tags:
- code-workspace
- completion
- ed-parity-005
- native
- provider
- p1
modes:
- native
native_platforms:
- Linux

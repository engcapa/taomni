id: TC-IDE-PARITY-005-05
title: Java Basic Completion against real JDT LS - type import, snippet and disk bytes
description: 'ED-PARITY-005 V5 (A1/A3), native on the isolated QA build with the real

  Eclipse JDT LS over the maven-single sample project. A physically inserted

  app-level completion at Ln 30 Col 22 offers the org.apache.commons.lang3

  StringUtils candidate, Enter commits identifier + import in one transaction,

  an explicit Save puts the import into the host file (assert_file_contains),

  and one Ctrl+Z + Save returns the file to its pristine hash. The append

  overload round then verifies that a method-snippet acceptance is one undo and

  that Tab navigation inserts no document change. Saving afterwards keeps

  completion working on the live buffer.

  Boundary: browser cannot prove real JDT LS candidates, the Rust

  completionItem/resolve boundary or host bytes, which is why this case is

  native. Linux/WebKitGTK is the verified current platform; Windows/WebView2 and

  macOS/WKWebView keep the same sequence unverified.

  '

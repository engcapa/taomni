verification:
  review: reviewed
  requirements:
    - id: ED-PARITY-005-V5-type
      requirement: Real ready JDT LS supplies the named class, its original item and import resolve; one acceptance and Undo reconcile with host bytes.
      actions: [4, 7, 19, 22, 26, 28, 34, 37, 40]
      checkpoints:
        - step: 9
          expectation: Maven project facts are ready before completion.
        - step: 10
          expectation: The Java semantic session is ready.
        - step: 21
          expectation: Unsaved prefix editing has not changed the host B0 bytes.
        - step: 23
          expectation: The real popup includes the full Commons Lang package identity.
        - step: 24
          expectation: The matching original JSON-RPC item is recorded.
        - step: 29
          expectation: Resolve returned a real item with the import additional edit.
        - step: 30
          expectation: The type identifier is accepted.
        - step: 31
          expectation: Exactly one import is visible in the editor.
        - step: 32
          expectation: Acceptance has not saved host bytes implicitly.
        - step: 35
          expectation: Explicit Save writes the import to host bytes.
        - step: 36
          expectation: Explicit Save writes the identifier to host bytes.
        - step: 38
          expectation: One Undo restores the prefix.
        - step: 39
          expectation: One Undo also removes the import.
        - step: 41
          expectation: Saving after Undo writes the prefix version to host bytes.
      results: [9, 10, 21, 23, 24, 29, 30, 31, 32, 35, 36, 38, 39, 41]
    - id: ED-PARITY-005-V5-snippet
      requirement: The fixed append(String str) item is provider snippet format, accepts once and Undo restores the method prefix.
      actions: [49, 53, 55, 59, 61, 65, 66, 67]
      checkpoints:
        - step: 56
          expectation: The fixed method overload is in the real popup.
        - step: 57
          expectation: The original method item is saved before acceptance.
        - step: 62
          expectation: The real resolve preserves snippet format and raw fields.
        - step: 63
          expectation: The accepted call appears in the editor.
        - step: 68
          expectation: One Undo restores the method prefix after snippet navigation.
      results: [56, 57, 62, 63, 68]
    - id: ED-PARITY-005-V5-save-reuse
      requirement: Two changed-and-saved Java buffers continue to obtain real method candidates.
      actions: [71, 72, 73, 76, 77, 78, 81, 82, 83]
      checkpoints:
        - step: 74
          expectation: The first save leaves member completion available.
        - step: 75
          expectation: The first post-save request appears in the real provider trace.
        - step: 84
          expectation: The second save leaves member completion available.
        - step: 85
          expectation: The second post-save request appears in the real provider trace.
      results: [74, 75, 84, 85]
    - id: ED-PARITY-005-V5-fault
      requirement: Isolated Rust transport null and error faults show a zero-edit gate, recover after null and dismiss after error.
      actions: [94, 96, 97, 99, 101, 105, 106, 110, 111, 112, 114, 116, 120, 121]
      checkpoints:
        - step: 102
          expectation: A controlled null opens the unavailable gate.
        - step: 103
          expectation: Rust reports null as unavailable, not resolved.
        - step: 104
          expectation: The null response made no primary edit.
        - step: 107
          expectation: Retry closes the gate after restoring real provider resolve.
        - step: 108
          expectation: Retry records a real resolved import edit.
        - step: 109
          expectation: Retry accepts the identifier.
        - step: 117
          expectation: A controlled error opens the gate.
        - step: 118
          expectation: Rust reports the error as failed, not resolved.
        - step: 119
          expectation: The error response made no primary edit.
        - step: 122
          expectation: Dismiss closes the gate without accepting.
      results: [102, 103, 104, 107, 108, 109, 117, 118, 119, 122]
    - id: ED-PARITY-005-V5-midword
      requirement: Real JDT LS insert and replace ranges produce distinct Enter, Tab and double-click results, each with one import and one Undo.
      actions: [123, 140, 150, 151, 155, 156, 159, 162, 165, 166, 169, 172, 175, 177, 180]
      checkpoints:
        - step: 148
          expectation: The same Java document has the exact Tmid preimage before all three entries.
        - step: 149
          expectation: The caret is between StringUti and Suffix.
        - step: 153
          expectation: The Commons Lang original item carries the provider's distinct insert and replace ranges.
        - step: 157
          expectation: Enter resolve preserves both ranges and returns the real import edit.
        - step: 158
          expectation: Enter keeps Suffix and adds exactly one import.
        - step: 160
          expectation: One Undo restores the full Tmid preimage after Enter.
        - step: 164
          expectation: The next provider request supplies the same range contract.
        - step: 167
          expectation: Tab resolve preserves both ranges and returns the real import edit.
        - step: 168
          expectation: Tab replaces Suffix and adds exactly one import.
        - step: 170
          expectation: One Undo restores the full Tmid preimage after Tab.
        - step: 174
          expectation: The mouse round receives a fresh real provider item.
        - step: 176
          expectation: A single click changes selection without editing the buffer.
        - step: 178
          expectation: Double-click resolve preserves both ranges and returns the real import edit.
        - step: 179
          expectation: Double click keeps Suffix and adds exactly one import.
        - step: 181
          expectation: One Undo restores the full Tmid preimage after double click.
      results: [148, 149, 153, 157, 158, 160, 164, 167, 168, 170, 174, 176, 178, 179, 181]
    - id: ED-PARITY-005-V6-matched-profile
      requirement: The real JDT LS popup is captured with the IDEA reference theme and editor font settings while the Tmid buffer remains unchanged.
      actions: [183, 184, 186, 188, 189, 190, 191, 193, 194, 195, 196, 197, 198, 201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 218, 221, 222]
      checkpoints:
        - step: 185
          expectation: The application is using its dark theme.
        - step: 192
          expectation: The editor appearance action opened the real settings dialog.
        - step: 199
          expectation: Applying the font, line height and color scheme closed settings.
        - step: 200
          expectation: The editor font computes to 16px.
        - step: 217
          expectation: The matching real JDT LS candidate and insert/replace ranges are recorded.
        - step: 220
          expectation: The popup remains within the WebView viewport.
        - step: 223
          expectation: Escape leaves the Tmid buffer unchanged.
      results: [185, 192, 199, 200, 217, 220, 223]
  visual:
    - check: Compare provider popup, selected row, documentation, acceptance and Undo states with IDEA R0-R6 at matching profile.
      method: manual
      reason: Pixel and interaction comparison requires review of both sides' original images.
  native:
    - check: Raw JDT LS candidate and resolve item, Rust null/error classification, Java save and independent host bytes.
      method: automated
      reason: Browser B-005 is a controlled renderer provider and cannot prove process, IPC or disk effects.

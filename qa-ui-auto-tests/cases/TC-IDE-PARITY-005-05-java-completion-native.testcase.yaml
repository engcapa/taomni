id: TC-IDE-PARITY-005-05-java-completion-native
title: Basic Completion against real JDT LS - mid-word ranges, import and one undo
description: 'ED-PARITY-005 V5. The real JDT LS answers Basic Completion in a real Maven

  project, so this is where the provider contract is actually proven: the mid-word

  candidate yields a StringUtils type completion, Enter keeps the trailing suffix

  while Tab consumes the whole identifier, the lang3 import arrives through

  completionItem/resolve, one undo restores the exact preimage, and the saved

  bytes on disk follow both. Browser stub evidence cannot establish any of this.

  The trigger is the Alt+/ secondary binding rather than Ctrl+Space, because the

  platform chord did not reach the editor under WebKitGTK; the Ctrl+Space binding

  and its routing are proven by TC-IDE-PARITY-005-01. Linux/WebKitGTK is the

  platform for this run; Windows/WebView2 and macOS/WKWebView stay unverified.

  '
covers:
- F25.5
tags:

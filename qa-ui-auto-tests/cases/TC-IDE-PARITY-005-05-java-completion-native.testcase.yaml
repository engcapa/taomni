id: TC-IDE-PARITY-005-05
title: Java completion native provider accept undo save-continue and mid-word entries (native)
description: 'ED-PARITY-005 V5 (A1/A3) native+provider case (REQ-05 / CW-LANG-001, CW-LANG-002). Proves
  the production chain against a real JDT LS session on the maven-single sample through the packaged app
  UI: type-probe Enter lands identifier plus the single lang3 import in one dispatch (disk bytes asserted
  by re-read), one Ctrl+Z plus save restores the exact prefix bytes; mid-word Tmid keeps the suffix on
  Enter and consumes it on Tab with one Undo each; the snippet probe accepts the provider raw snippet
  as-is (DEC-08, no parameter clearing) with pure Tab navigation and one Undo; after saves a member probe
  still completes from the live buffer. Highest green claim: L2 provider-backed on the executed platform.
  Fault-injected null/error resolve has no isolated native facility in this round and stays unit-covered
  (Rust classifier + lspCompletionResolveGate); Windows/macOS runs remain explicitly unverified.

  '

id: TC-IDE-PARITY-013-05-find-action-platform-native
title: Native Find Action through the platform modifier, terminal keeps the chord
description: 'ED-PARITY-013 A3.1/A3.2 native case. In the isolated QA app, Mod+Shift+A (Cmd on macOS, Ctrl on Windows/Linux) opens Find Action through the packaged WebView, typing stays in its query box, and with the workspace terminal focused the same chord does not open Find Action. macOS input uses the WKWebView bridge (DOM key events), not OS-level keyboard/IME evidence.

  '
covers:
- F25.5
tags:
- code-workspace
- keymap
- ed-parity-013
- native-gate
- p1
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- workspace_root
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-ed013","name":"qa-ed013","roots":[{"id":"qa-ed013","name":"qa-ed013","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-ed013","path":"notes.txt"},"lastOpenedAt":1756500000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Mod+Shift+A
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="code-workspace-search-everywhere"] button[role="tab"][aria-selected="true"]'
    contains: Actions
- type:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    text: zzq013
- eval_readonly:
    expression: '!document.querySelector(".cm-content").innerText.includes("zzq013")'
    expect_truthy: true
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    state: detached
    timeout_sec: 5
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Alt+F12
- wait_for:
    selector: '[data-workspace-focus="terminal"] [data-terminal-ready="true"]'
    timeout_sec: 60
- click: '[data-workspace-focus="terminal"] [data-testid="terminal-pane"]'
- eval_readonly:
    expression: '!!document.activeElement?.closest("[data-workspace-focus"+String.fromCharCode(61)+"\"terminal\"]")'
    expect_truthy: true
- press: Mod+Shift+A
- wait: 1
- assert_count:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    equal: 0
- screenshot: tc-ide-parity-013-05-native.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A3.1：native 下平台修饰键 + Shift + A 打开 Find Action（Actions 分类），键入不进入编辑器。
    actions:
    - 11
    - 14
    checkpoints:
    - step: 12
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-search-everywhere\"]", "timeout_sec": 30}}'
    - step: 13
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-search-everywhere\"] button[role=\"tab\"][aria-selected=\"true\"]", "contains": "Actions"}}'
    - step: 15
      expectation: '{"eval_readonly": {"expression": "!document.querySelector(\".cm-content\").innerText.includes(\"zzq013\")", "expect_truthy": true}}'
    results:
    - 13
    - 15
  - id: R2
    requirement: A3.2：终端获得焦点时同一组合不打开 Find Action。
    actions:
    - 19
    - 23
    checkpoints:
    - step: 20
      expectation: '{"wait_for": {"selector": "[data-workspace-focus=\"terminal\"] [data-terminal-ready=\"true\"]", "timeout_sec": 60}}'
    - step: 22
      expectation: '{"eval_readonly": {"expression": "!!document.activeElement?.closest(\"[data-workspace-focus\"+String.fromCharCode(61)+\"\\\"terminal\\\"]\")", "expect_truthy": true}}'
    - step: 25
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-search-everywhere\"]", "equal": 0}}'
    results:
    - 25
  visual:
  - check: 不声明视觉结论。
    method: not-applicable
    reason: 本用例只证明平台派发。
  native:
  - check: Windows WebView2 / Linux WebKitGTK 经 W3C 键盘动作，macOS 经 WKWebView bridge；OS 级 IME/系统快捷键冲突未证明。
    method: automated
    reason: native runner 驱动打包 WebView。

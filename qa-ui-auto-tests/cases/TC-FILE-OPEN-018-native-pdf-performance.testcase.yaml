fixtures:
- reset_db
- markdown_quality
timeout_sec: 1200
verification:
  review: reviewed
  requirements:
  - id: PDF-PERF-SAMPLES
    requirement: Retain three complete independently readable PDF exports from one fixed long Markdown through actual
      OS save dialogs, with source preserved and no printer API dependency.
    actions:
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 11
    - 13
    - 14
    - 16
    - 19
    - 20
    - 22
    - 25
    - 26
    - 28
    checkpoints:
    - step: 18
      expectation: Fresh PDF exists after the real save chooser and saved result; retain actual bytes and per-step durations
        for matched same-platform baseline/candidate comparison, not an inferred universal performance threshold.
    - step: 24
      expectation: Fresh PDF exists after the real save chooser and saved result; retain actual bytes and per-step durations
        for matched same-platform baseline/candidate comparison, not an inferred universal performance threshold.
    - step: 30
      expectation: Fresh PDF exists after the real save chooser and saved result; retain actual bytes and per-step durations
        for matched same-platform baseline/candidate comparison, not an inferred universal performance threshold.
    - step: 31
      expectation: Source still contains its final section; exports must not truncate the Markdown document.
    results:
    - 18
    - 24
    - 30
    - 31
  native:
  - check: Packaged WebView PDF generation and real chooser/disk
    method: automated
    reason: Browser Chromium timings cannot establish Windows WebView2 or WKWebView performance. Compare retained same-platform
      baseline/candidate samples and PDF pixels/text independently.
  visual:
  - check: Long PDF pagination, table borders and Mermaid text
    method: manual
    reason: Inspect rendered page images for baseline and candidate; timing or nonempty files alone cannot establish
      fidelity.

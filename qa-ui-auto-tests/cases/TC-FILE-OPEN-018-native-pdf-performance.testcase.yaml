id: TC-FILE-OPEN-018
title: 'Native long PDF export: three retained samples with tables, Mermaid and Unicode'
description: Repeat the same fifteen-section document and settings in the packaged release WebView. Raw chooser/result
  step durations include automation overhead; independently inspect the three saved PDFs for complete pages, Unicode
  search and unchanged image quality. This case is identical for baseline and candidate and does not claim a speedup
  by itself.
modes:
- native
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-pdf-performance
- reload_window: null
- host_write_file:
    path: ${fixture.markdown_quality_source}

- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="quality.md"]'
- wait_for: '[data-testid="markdown-editor"]'
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-pdf"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_quality_exports}/performance-1.pdf
    trigger: '[data-testid="markdown-export-confirm"]'
- wait_for:
    selector: '[data-testid="markdown-export-status"][data-export-state="saved"]'
    timeout_sec: 300
- assert_file_exists: ${fixture.markdown_quality_exports}/performance-1.pdf
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-pdf"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_quality_exports}/performance-2.pdf
    trigger: '[data-testid="markdown-export-confirm"]'
- wait_for:
    selector: '[data-testid="markdown-export-status"][data-export-state="saved"]'
    timeout_sec: 300
- assert_file_exists: ${fixture.markdown_quality_exports}/performance-2.pdf
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-pdf"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_quality_exports}/performance-3.pdf
    trigger: '[data-testid="markdown-export-confirm"]'
- wait_for:
    selector: '[data-testid="markdown-export-status"][data-export-state="saved"]'
    timeout_sec: 300
- assert_file_exists: ${fixture.markdown_quality_exports}/performance-3.pdf
- assert_file_contains:
    path: ${fixture.markdown_quality_source}
    contains: '## Section 15'

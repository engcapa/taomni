  visual:
  - check: 对照 IDEA 变更条弹层与 error stripe。
    method: manual
    reason: Commit this change 输入框与 Rollback 图标布局 different。
  native:
  - check: browser 使用受控 Git provider。
    method: not-applicable
    reason: 真实 JDT LS 诊断刻度与运行图标由 TC-IDE-PARITY-022-02 证明。

    - 33
    - 37
    checkpoints:
    - step: 26
      expectation: '{"wait_for": "[data-testid=\"code-workspace-compare-dialog\"]"}'
    - step: 27
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-compare-dialog\"]", "contains": "same.txt (HEAD)"}}'
    - step: 28
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-git-diff-peek\"]", "equal": 0}}'
    - step: 34
      expectation: '{"assert_items": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-line", "equals": ["repo-a HEAD", "shared line", "// TODO: check"]}}'
    - step: 35
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-error-stripe-mark\"][data-kind=\"git-modified\"][data-line=\"1\"]", "state": "detached", "timeout_sec": 30}}'
    - step: 38
      expectation: '{"assert_items": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-line", "equals": ["repo-a WORKTREE", "shared line", "// TODO: check"]}}'
    - step: 39
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-error-stripe-mark\"][data-kind=\"git-modified\"][data-line=\"1\"]", "timeout_sec": 30}}'
    results:
    - 27
    - 34
    - 35
    - 38
    - 39
  - id: R3
    requirement: A2/DEC-022-01/03：右侧 error stripe 显示 VCS 与 TODO 刻度，点击刻度把 caret 移到该行且不修改文档；无运行 facts 时不显示运行图标。
    actions:
    - 40
    checkpoints:
    - step: 8
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-error-stripe-mark\"][data-kind=\"git-modified\"][data-line=\"1\"]", "timeout_sec": 10}}'
    - step: 9
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-run-gutter\"]", "equal": 0}}'
    - step: 13
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-error-stripe-mark\"][data-kind=\"todo\"][data-line=\"3\"]", "timeout_sec": 10}}'
    - step: 41
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar-workspace-cursor\"]", "contains": "3:1", "timeout_sec": 5}}'
    - step: 42
      expectation: '{"assert_items": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-line", "equals": ["repo-a WORKTREE", "shared line", "// TODO: check"]}}'

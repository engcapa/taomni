id: TC-IDE-PARITY-009-06
title: Structural Search dirty buffers, scope and typed file errors
description: 'Review S5/S6 regression: renderer entry, active/inactive buffer search, file/module scope and unchanged editor.
  Native also proves actual parser IPC, UTF-16 error/retry, and unchanged disk hashes.'
covers:
- F25.5
- F25.6
tags:
- code-workspace
- structural-search
- parity009
- regression
- p2
modes:
- native
fixtures:
- reset_db
- parity009_ssr
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-p2-fix-password
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 45
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "qa-p2", "name": "p2-fix", "roots": [{"id": "parity009", "name": "parity009", "path": "${fixture.parity009_root}",
      "kind": "folder"}, {"id": "encoding", "name": "encoding", "path": "${fixture.parity009_encoding_root}", "kind": "folder"}],
      "looseFiles": [], "lastActiveFile": {"kind": "root", "rootId": "parity009", "path": "src/StructuralTarget.java"}, "lastOpenedAt":
      1756100000000, "isGitRepo": false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 45
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Mod+a
- type: class StructuralTarget { void run() { System.out.println(999); } }
- wait_for:
    selector: '[data-testid="code-workspace-save-observation"][data-dirty="true"]'
    timeout_sec: 45
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 45
- click: '[data-testid="code-workspace-search-everywhere"] [data-testid="search-everywhere-tab-actions"]'
- fill:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    value: Search Structurally
- assert_attribute:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    name: value
    equals: Search Structurally
# Do not submit a transient partial-query result while native IME keys settle.
- wait_for: 'xpath=//*[@data-testid="code-workspace-search-everywhere"]//button[@data-selected="true" and .//span[normalize-space(.)="Search Structurally…"]]'
- press: Enter
- wait_for:
    selector: '[data-testid="structural-search-dialog"]'
    timeout_sec: 45
- assert_attribute:
    selector: '[data-testid="structural-search-language"]'
    name: value
    equals: java
- click: '[data-testid="structural-search-scope-module"]'
- fill:
    selector: '[data-testid="structural-search-variable-text"]'
    value: '42'
- click: '[data-testid="structural-search-find"]'
- wait_for:
    selector: '[data-testid="structural-search-empty"]'
    timeout_sec: 45
- assert_count:
    selector: '[data-testid="structural-search-match"]'
    equal: 0
- click: '[data-testid="structural-search-edit-query"]'
- fill:
    selector: '[data-testid="structural-search-variable-text"]'
    value: '999'
- click: '[data-testid="structural-search-find"]'
- wait_for:
    selector: '[data-testid="structural-search-match"]'
    timeout_sec: 45
- assert_count:
    selector: '[data-testid="structural-search-match"]'
    equal: 1
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Other.java"]'
- assert_text_equals:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    equals: class Other {}
- click: '[data-testid="structural-search-edit-query"]'
- click: '[data-testid="structural-search-scope-file"]'
- click: '[data-testid="structural-search-find"]'
- wait_for:
    selector: '[data-testid="structural-search-empty"]'
    timeout_sec: 45
- click: '[data-testid="structural-search-edit-query"]'
- click: '[data-testid="structural-search-scope-module"]'
- click: '[data-testid="structural-search-find"]'
- wait_for:
    selector: '[data-testid="structural-search-match"]'
    timeout_sec: 45
- assert_count:
    selector: '[data-testid="structural-search-match"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="structural-search-match"]'
    name: data-path
    equals: src/StructuralTarget.java
- click: '[data-testid="structural-search-match"]'
- assert_text_equals:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    equals: class StructuralTarget { void run() { System.out.println(999); } }
- wait_for:
    selector: '[data-testid="code-workspace-save-observation"][data-dirty="true"]'
    timeout_sec: 45
- screenshot: dirty-inactive-buffer.png
- click: '[data-testid="structural-search-edit-query"]'
- click: '[data-testid="structural-search-scope-workspace"]'
- click: '[data-testid="structural-search-find"]'
- wait_for:
    selector: '[data-testid="structural-search-error"]'
    timeout_sec: 45
- assert_text:
    selector: '[data-testid="structural-search-error"]'
    contains: 'Legacy.java: file is not UTF-8'
- assert_count:
    selector: '[data-testid="structural-search-empty"]'
    equal: 0
- screenshot: encoding-error.png
- click: '[data-testid="structural-search-scope-module"]'
- click: '[data-testid="structural-search-find"]'
- wait_for:
    selector: '[data-testid="structural-search-match"]'
    timeout_sec: 45
- assert_count:
    selector: '[data-testid="structural-search-match"]'
    equal: 1
- assert_not_visible: '[data-testid="structural-search-dialog"]'
- assert_file_sha256:
    path: ${fixture.parity009_target}
    equals: ${fixture.parity009_target_sha256}
- assert_file_sha256:
    path: ${fixture.parity009_encoding_file}
    equals: ${fixture.parity009_encoding_sha256}
native_platforms:
- Windows
- Linux

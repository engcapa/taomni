id: TC-SESSION-TREE-01
title: Session tree Ctrl/Shift ranges and context-menu batch move persist
description: Creates four saved local-shell sessions through the editor, tests toggle/reverse/shrinking/additive
  ranges and ordinary single selection, then moves the batch through the retained context menu and reopens the app.
  No shell is started.
covers:
- F6.2
- F-Sidebar-1
- F6.3
- F-FolderName-1
tags:

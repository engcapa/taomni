verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Ctrl/Meta toggles individual sessions; Shift selects the visible range and retains the original anchor;
      Mod+Shift adds a range and ordinary click returns to single selection.
    actions:
    - 41
    - 42
    - 44
    - 46
    - 47
    - 49
    - 51
    - 53
    - 55
    checkpoints:
    - step: 43
      expectation: "{assert_items: {attribute: data-session-name, equals: [qa-selection-a, qa-selection-c],\n    selector:\
        \ '[data-testid=\"session-tree-item\"][data-selected=\"true\"]'}}"
    - step: 45
      expectation: '{assert_items: {attribute: data-session-name, equals: [qa-selection-a], selector: ''[data-testid="session-tree-item"][data-selected="true"]''}}'
    - step: 48
      expectation: "{assert_items: {attribute: data-session-name, equals: [qa-selection-a, qa-selection-b,\n      qa-selection-c],\
        \ selector: '[data-testid=\"session-tree-item\"][data-selected=\"true\"]'}}"
    - step: 50
      expectation: "{assert_items: {attribute: data-session-name, equals: [qa-selection-b, qa-selection-c],\n    selector:\
        \ '[data-testid=\"session-tree-item\"][data-selected=\"true\"]'}}"
    - step: 52
      expectation: "{assert_items: {attribute: data-session-name, equals: [qa-selection-b, qa-selection-c,\n      qa-selection-d],\
        \ selector: '[data-testid=\"session-tree-item\"][data-selected=\"true\"]'}}"
    - step: 54
      expectation: '{assert_items: {attribute: data-session-name, equals: [qa-selection-a], selector: ''[data-testid="session-tree-item"][data-selected="true"]''}}'
    - step: 56
      expectation: "{assert_items: {attribute: data-session-name, equals: [qa-selection-a, qa-selection-b,\n      qa-selection-c,\
        \ qa-selection-d], selector: '[data-testid=\"session-tree-item\"][data-selected=\"true\"]'}}"
    results:
    - 43
    - 45
    - 48
    - 50
    - 52
    - 54
    - 56
  - id: R2
    requirement: Right-click on a selected row preserves all four selected sessions; Move to folder moves exactly the
      batch and reload reads their saved group paths.
    actions:
    - 57
    - 60
    - 61
    - 63
    - 65
    checkpoints:
    - step: 58
      expectation: "{assert_items: {attribute: data-session-name, equals: [qa-selection-a, qa-selection-b,\n      qa-selection-c,\
        \ qa-selection-d], selector: '[data-testid=\"session-tree-item\"][data-selected=\"true\"]'}}"
    - step: 59
      expectation: '{assert_visible: ''[data-testid="context-menu-item-connect-selected-sessions-4"]''}'
    - step: 62
      expectation: "{assert_items: {attribute: data-group-path, equals: [qa-selection-target, qa-selection-target,\n\
        \      qa-selection-target, qa-selection-target], selector: '[data-testid=\"session-tree-item\"][data-session-name=\"\
        qa-selection-a\"],\n      [data-testid=\"session-tree-item\"][data-session-name=\"qa-selection-b\"], [data-testid=\"\
        session-tree-item\"][data-session-name=\"qa-selection-c\"],\n      [data-testid=\"session-tree-item\"][data-session-name=\"\
        qa-selection-d\"]'}}"
    - step: 66
      expectation: "{assert_items: {attribute: data-group-path, equals: [qa-selection-target, qa-selection-target,\n\
        \      qa-selection-target, qa-selection-target], selector: '[data-testid=\"session-tree-item\"][data-session-name=\"\
        qa-selection-a\"],\n      [data-testid=\"session-tree-item\"][data-session-name=\"qa-selection-b\"], [data-testid=\"\
        session-tree-item\"][data-session-name=\"qa-selection-c\"],\n      [data-testid=\"session-tree-item\"][data-session-name=\"\
        qa-selection-d\"]'}}"
    results:
    - 58
    - 59
    - 62
    - 66
  - id: R3
    requirement: Right-click outside the selection narrows to one session; moving it to the root retains the other three
      saved group paths.
    actions:
    - 67
    - 69
    - 70
    checkpoints:
    - step: 68
      expectation: '{assert_items: {attribute: data-session-name, equals: [qa-selection-c], selector: ''[data-testid="session-tree-item"][data-selected="true"]''}}'
    - step: 71
      expectation: '{assert_items: {attribute: data-group-path, equals: [''''], selector: ''[data-testid="session-tree-item"][data-session-name="qa-selection-c"]''}}'
    - step: 72
      expectation: "{assert_items: {attribute: data-group-path, equals: [qa-selection-target, qa-selection-target,\n\
        \      qa-selection-target], selector: '[data-testid=\"session-tree-item\"][data-session-name=\"qa-selection-a\"\
        ],\n      [data-testid=\"session-tree-item\"][data-session-name=\"qa-selection-b\"], [data-testid=\"session-tree-item\"\
        ][data-session-name=\"qa-selection-d\"]'}}"
    results:
    - 68
    - 71
    - 72
  visual:
  - check: Tree hierarchy and all selected rows remain visible.
    method: manual
    reason: Inspect the retained screenshots; functional assertions alone do not establish visual clarity.
  native:
  - check: Packaged WebView modifier clicks and real session persistence after reload.
    method: automated
    reason: Native uses the isolated QA app and real IPC/database. Browser uses stubs. macOS uses packaged WebView event
      input for selection; held-pointer drag is not supported by its stateless bridge.

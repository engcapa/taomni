    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- wait_for: '[data-testid="mail-message-row"][data-subject="Account-level AI policy"]'
- click: '[data-testid="mail-message-row"][data-subject="Account-level AI policy"]'
- wait_for: '[data-testid="mail-attachment-open"][data-name="policy.txt"]'
- dblclick: '[data-testid="mail-attachment-open"][data-name="policy.txt"]'
- wait_for: '[data-testid="file-viewer"][data-readonly="true"]'
- assert_visible: '[data-testid="file-viewer"][data-readonly="true"] [data-testid="viewer-readonly"]'
- assert_disabled: '[data-testid="file-viewer"][data-readonly="true"] [data-testid="viewer-save"]'
- assert_attribute:
    selector: '[data-testid="file-viewer"][data-readonly="true"] [data-testid="viewer-editor"] .cm-content'
    name: contenteditable
    equals: 'false'
- assert_items:
    selector: '[data-testid="file-viewer"][data-readonly="true"] [data-testid="viewer-editor"] .cm-line'
    equals:
    - Mail attachment read-only fixture.
    - Save locally before editing.
    - ''
- assert_file_open_bytes:
    selector: '[data-testid="file-viewer"][data-readonly="true"]'
    remember: mail-copy
    equals: 'Mail attachment read-only fixture.

      Save locally before editing.

      '
- click: '[data-testid="tab-item"][data-tab-type="mail"]'
- dblclick: '[data-testid="mail-attachment-open"][data-name="policy.txt"]'
- wait_for: '[data-testid="file-viewer"][data-readonly="true"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-viewer"]'
    equal: 1
- click: '[data-testid="tab-item"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="file-viewer"][data-readonly="true"]'
    state: detached
- assert_file_open_bytes:
    remember: mail-copy
    absent: true
- assert_no_runtime_errors: null
- screenshot: global-settings-mail-temp-closed.png

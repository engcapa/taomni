    name: aria-checked
    equals: 'true'
- click: '[data-testid="file-open-default-system"]'
- assert_attribute:
    selector: '[data-testid="file-open-default-system"]'
    name: aria-checked
    equals: 'true'
- eval_readonly:
    expression: document.getElementById("html-preview-proxy-mode").value === "none"
    expect_truthy: true
- click: '[data-testid="file-open-settings-reset"]'
- assert_attribute:

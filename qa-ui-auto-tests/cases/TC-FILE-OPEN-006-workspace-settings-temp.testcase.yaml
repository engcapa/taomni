id: TC-FILE-OPEN-006
title: Workspace file entries dedupe, global settings persist and mail temps stay read-only then release
description: AC18/19/20. Real project-tree context menu opens a workspace viewer, normal tree entry and second explicit action
  reuse it. Settings use actual controls and persist across reload. Mail attachment downloads through real native IMAP (browser
  stub is VFS-only), dedupes the controlled copy and releases its exact observed temp path after final host close. SFTP cancellation/resume
  and AI/ terminal/Git UI entries are supported by focused unit tests but not exercised here; do not claim complete entry-matrix
  runtime coverage.
modes:
- browser
- native
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
- F-MAIL-5
tags:
- p0
- file-open
- workspace
- settings
- mail
- temporary-file
- crash-regression
fixtures:
- reset_db
- file_open_files
- file_open_mail
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-file-open-contexts
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: ${fixture.file_open_workspace}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-tree-view-selector"]'
- click: '[data-testid="code-workspace-tree-view-project"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
- right_click: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
- click: '[data-testid="code-workspace-tree-open-taomni"]'
- wait_for: '[data-testid="file-viewer"][data-kind="text"] [data-testid="viewer-editor"] .cm-content'
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="viewer"]'
    equal: 1
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - File open original
    - Second line
    - 中文
    - ''
- right_click: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
- click: '[data-testid="code-workspace-tree-open-taomni"]'
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="viewer"]'
    equal: 1
- assert_file_open_bytes:

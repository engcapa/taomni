    sha256: ${fixture.file_open_original_sha}
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: files and opening
- wait_for: '[data-testid="file-open-settings"]'
- click: '[data-testid="file-open-default-system"]'
- select_option:

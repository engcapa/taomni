    name: aria-checked
    equals: 'true'
- assert_localstorage:
    key: taomni.fileOpen.preferences.v1
    contains: '"markdownImageDir":"assets"'
- assert_localstorage:
    key: taomni.fileOpen.preferences.v1
    contains: '"associations":{}'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="side-tab-sessions"]'
- fill:

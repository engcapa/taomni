id: TC-IDE-C0-01
title: Packaged save receipt byte matrix, failure recovery, and undo
description: 'ED-SAVE-004 packaged Linux/WebKitGTK slice. It enters a real temporary

  workspace through persisted recents, saves one deterministic two-line file

  through UTF-8, UTF-8 BOM, UTF-16LE BOM, and ISO-8859-1 across LF and CRLF,

  and after every save independently hashes the host bytes and reconciles them

  with the production receipt. It then induces a real unrepresentable-character

  encoding failure, verifies zero disk effect/focus retention, undoes the edit,

  changes policy, and recovers through a successful save. No browser stub or

  source text is accepted as native receipt evidence.


  ED-AUDIT-004 slice: a real external host_write_file rewrite under a dirty

  buffer raises the watcher conflict dialog; dismissing it (Decide Later)

  leaves the dirty buffer and its stale write guard untouched, so the next

  Ctrl+S is a typed conflict (result-kind conflict, disk-effect none, no

  receipt) and the host bytes are provably untouched by exact SHA-256.

  Restoring the saved bytes lets the watcher refresh the write guard and the

  same Ctrl+S lands the buffer''s intended bytes with a fresh receipt. Two

  editor undos then prove the buffer-only contract - the disk keeps the saved

  bytes through both undos - and the following explicit save lands the undone

  text.

  '

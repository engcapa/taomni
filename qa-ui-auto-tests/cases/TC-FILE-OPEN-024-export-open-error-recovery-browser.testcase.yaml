id: TC-FILE-OPEN-024
title: Markdown export keeps Tao primary and reports system-open failure without losing the document
description: Browser download plus actual secondary result action. The browser explicitly rejects OS shell opening; the error stays
  recoverable and Tao/export actions and source bytes survive. Native actual exported-file opening is TC-FILE-OPEN-023.
modes:
- browser
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p1
- markdown
- export
- regression
fixtures:
- reset_db
- markdown_quality
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-export-quality
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="quality.md"]'
- wait_for: '[data-testid="markdown-editor"]'
- click: '[data-testid="markdown-export"]'
- assert_download:
    trigger: '[data-testid="markdown-export-html"]'
    filename: quality.html
    contains:
    - <!doctype html>
    - Export quality
- wait_for: '[data-testid="markdown-export-status"][data-export-state="saved"]'
- click: '[data-testid="markdown-export-show-system"]'
- assert_text:
    selector: '[data-testid="viewer-operation-error"]'
    contains: Opening files with the OS shell is not available in browser preview.
- assert_enabled: '[data-testid="markdown-export-open-tao"]'
- assert_enabled: '[data-testid="markdown-export"]'
- assert_file_open_bytes:
    path: ${fixture.markdown_quality_source}
    sha256: ${fixture.markdown_quality_sha}
- assert_no_runtime_errors: null
- screenshot: export-open-error-recovery.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Export action failures are surfaced without losing the successful export or source content.
    actions:
    - 4
    - 5
    - 7
    - 8
    - 9
    - 10
    - 12
    - 13
    - 15
    results:
    - 6
    - 11
    - 13
    - 14
    - 16
    - 17
    - 18
    - 19
    - 20
    checkpoints:
    - step: 6
      expectation: 'wait_for: ''[data-testid="explorer-tab"][data-active="true"]'''
    - step: 11
      expectation: 'wait_for: ''[data-testid="markdown-editor"]'''
    - step: 13
      expectation: "assert_download:\n  artifact: html\n  filename: quality.html\n  trigger: '[data-testid=\"markdown-export-html\"\
        ]'"
    - step: 14
      expectation: 'wait_for: ''[data-testid="markdown-export-status"][data-export-state="saved"]'''
    - step: 16
      expectation: "assert_text:\n  contains: Opening files with the OS shell is not available in browser preview.\n  selector:\
        \ '[data-testid=\"viewer-operation-error\"]'"
    - step: 17
      expectation: 'assert_enabled: ''[data-testid="markdown-export-open-tao"]'''
    - step: 18
      expectation: 'assert_enabled: ''[data-testid="markdown-export"]'''
    - step: 19
      expectation: "assert_file_open_bytes:\n  path: ${fixture.markdown_quality_source}\n  sha256: ${fixture.markdown_quality_sha}"
    - step: 20
      expectation: 'assert_no_runtime_errors: null'
  visual:
  - check: The operation error and primary Tao button remain readable
    method: manual
    reason: Review the retained final screenshot.
  native:
  - check: Real OS shell and saved file opening
    method: not-applicable
    reason: Browser verifies explicit unsupported action and recovery; TC-FILE-OPEN-023 verifies native saved-file opening.

- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="unknown.bin"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"][data-preview-kind="metadata"]'
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="huge.png"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"][data-preview-kind="too-large"]'
- assert_count: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-image"]', equal: 0}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="folder"]'

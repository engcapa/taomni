- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-cmd-paste"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="created - 副本 - 副本.txt"]'
- assert_text: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-toast"]', contains: Not found}
- assert_visible: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="created - 副本.txt"]'
- assert_count: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"]', equal: 2}
- assert_no_runtime_errors: null
verification:

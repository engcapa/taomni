id: TC-EXPLORER-002
title: Explorer matches prototype preview types, light/dark geometry, global preferences and narrow overlay
description: >-
  AC03/04/05/06/09/10/20. Uses real renderer and IndexedDB bytes, not a fake preview DOM.
  Fixed 256KiB text and 20MiB image boundaries, binary refusal, quoted/multiline CSV,
  Markdown, stale selection, shared position/wrap/view and narrow preview overlay.
  Browser-only explicit trash-unavailable input proves confirmation/cancel renderer
  but never substitutes for native trash evidence in TC-EXPLORER-003.
modes: [browser]
covers: [F-EXPLORER-1, F5.5]
tags: [p0, explorer, preview, preferences, responsive, regression]
fixtures: [reset_db, explorer_files]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-explorer-preview
- reload_window: null
- set_viewport: {width: 1600, height: 960}
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"]:visible'
- click: 'button[aria-label="Cycle application theme"]'
- assert_attribute: {selector: html, name: data-app-theme, equals: light}
- press: {selector: '[data-testid="explorer-tab"]:visible', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-address"]', value: '${fixture.explorer_previews}'}
- press: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="notes.txt"]'
- assert_element_geometry: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-nav-tree"]', min_width: 210, min_height: 200}
- assert_element_geometry: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"]', min_width: 300, min_height: 200}
- eval_readonly:
    expression: 'getComputedStyle(document.querySelector(".ex-shell")).backgroundColor === "rgb(248, 250, 252)"'
    expect_truthy: true
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="notes.txt"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"][data-preview-kind="text"]'
- assert_text: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-text"]', contains: Explorer preview text}
- assert_attribute: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-text"]', name: data-line-count, equals: '4'}
- eval_readonly:
    expression: 'document.querySelector(".ex-pv").getBoundingClientRect().left >= document.querySelector(".ex-files").getBoundingClientRect().right - 2'
    expect_truthy: true
- screenshot: explorer-prototype-light.png
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="README.md"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-markdown"] h1'
- assert_text_equals: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-markdown"] h1', equals: Explorer Markdown}
- assert_text_equals: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-markdown"] strong', equals: Rendered bold}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="table.csv"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-csv"]'
- assert_count: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-csv"] tr', equal: 3}
- assert_text: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-csv"]', contains: 'quoted, comma'}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="logo.png"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-image"]'
- eval_readonly:
    expression: 'document.querySelector(".ex-pv-img img").complete && document.querySelector(".ex-pv-img img").naturalWidth === 1'

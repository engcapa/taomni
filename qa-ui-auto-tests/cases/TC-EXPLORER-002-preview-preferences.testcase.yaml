- click: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="empty-folder"]', modifiers: [Mod]}
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"][data-preview-kind="multi"]'
- assert_text: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-metadata"]', contains: 2 items selected}
- seed_storage: {key: taomni.explorer.stubTextDelayMs, value: '350'}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="large.txt"]'
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name="notes.txt"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-text"]'
- assert_text: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-text"]', contains: Explorer preview text}
- assert_not_visible: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-truncated"]'
- seed_storage: {key: taomni.explorer.stubTextDelayMs, value: '0'}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-settings"]'
- click: '[data-testid="explorer-preview-bottom"]'
- assert_attribute: {selector: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"]', name: data-position, equals: bottom}
- eval_readonly:
    expression: 'document.querySelector(".ex-pv").getBoundingClientRect().top >= document.querySelector(".ex-files").getBoundingClientRect().bottom - 2'
    expect_truthy: true
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-settings"]'
- click: '[data-testid="explorer-preview-wrap"]'
- assert_localstorage: {key: taomni.explorer.view.v1, contains: '"wrap":true'}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-cmd-view"]'
- click: '[data-testid="explorer-view-icons"]'
- assert_localstorage: {key: taomni.explorer.view.v1, contains: '"view":"icons"'}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-cmd-view"]'
- click: '[data-testid="explorer-view-list"]'
- assert_localstorage: {key: taomni.explorer.view.v1, contains: '"view":"list"'}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-cmd-view"]'
- click: '[data-testid="explorer-view-details"]'
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-cmd-view"]'
- click: '[data-testid="explorer-view-hidden"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-file-row"][data-name=".hidden.txt"]'
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview-settings"]'
- click: '[data-testid="explorer-preview-right"]'
- click: 'button[aria-label="Cycle application theme"]'
- assert_attribute: {selector: html, name: data-app-theme, equals: dark}
- eval_readonly:
    expression: 'getComputedStyle(document.querySelector(".ex-shell")).backgroundColor === "rgb(30, 31, 34)"'
    expect_truthy: true
- screenshot: explorer-prototype-dark.png
- set_viewport: {width: 920, height: 760}
- assert_not_visible: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"]'
- assert_localstorage: {key: taomni.explorer.view.v1, contains: '"preview":true'}
- click: '[data-testid="explorer-tab"]:visible [data-testid="explorer-cmd-preview"]'
- wait_for: '[data-testid="explorer-tab"]:visible [data-testid="explorer-preview"]'
- screenshot: explorer-prototype-narrow-overlay.png

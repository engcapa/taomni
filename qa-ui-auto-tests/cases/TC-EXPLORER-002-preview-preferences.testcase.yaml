    - step: 25
      expectation: Markdown heading is rendered rather than raw syntax.
    - step: 26
      expectation: Bold markup renders strong element.
    - step: 29
      expectation: Multiline quoted CSV parses into exactly three records.
    - step: 30
      expectation: Quoted comma remains in one cell.
    - step: 33
      expectation: Blob image decodes to actual one-pixel fixture.
    - step: 36
      expectation: Text beyond 256KB shows truncation.
    - step: 39
      expectation: Binary text never renders text preview.
    - step: 41
      expectation: Unsupported type displays metadata.
    - step: 44
      expectation: Oversized image never creates image element.
    - step: 47
      expectation: Directory preview shows actual child.
    - step: 50
      expectation: Multiple selection displays aggregate metadata.

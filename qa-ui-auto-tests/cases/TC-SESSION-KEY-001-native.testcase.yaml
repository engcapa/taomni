id: TC-SESSION-KEY-001
title: Generate a real SSH key, reject overwrite, negotiate expert algorithms and authenticate
covers:
- F6.3
- F2.2
tags:
- session
- native
- regression
modes:
- native
fixtures:
- reset_db
- ssh_features_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 45
- click: '[data-testid="session-new"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    timeout_sec: 45
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh_features.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh_features.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh_features.user}
- click: '[data-testid="session-section-advanced"]'
- click: '[data-testid="session-auth-agent"]'
- click: '[data-testid="session-test-connection"]'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: Connection successful
    timeout_sec: 45
- click: '[data-testid="alert-dialog-ok"]'
- click: '[data-testid="session-auth-privatekey"]'
- click: '[data-testid="session-private-key-generate"]'
- wait_for:
    selector: '[data-testid="session-key-generator"]'
    timeout_sec: 45
- fill:
    selector: '[data-testid="session-key-output-path"]'
    value: ${cfg.ssh_features.generated_key}
- fill:
    selector: '[data-testid="session-key-comment"]'
    value: QA generated by product
- fill:
    selector: '[data-testid="session-key-passphrase"]'
    value: ''
- click: '[data-testid="session-key-create"]'
- assert_text:
    selector: '[data-testid="session-key-result"]'
    contains: 'Key created:'
    timeout_sec: 45
- assert_file_contains:
    path: ${cfg.ssh_features.native_public_key}
    contains: ssh-ed25519
    timeout_sec: 20
- click: '[data-testid="session-key-create"]'
- assert_text:
    selector: '[data-testid="session-key-result"]'
    contains: already exists
    timeout_sec: 45
- click: '[data-testid="session-expert-settings"]'
- fill:
    selector: '[data-testid="session-ssh-kex"]'
    value: curve25519-sha256
- fill:
    selector: '[data-testid="session-ssh-cipher"]'
    value: aes256-ctr
- fill:
    selector: '[data-testid="session-ssh-mac"]'
    value: hmac-sha2-256
- click: '[data-testid="session-test-connection"]'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: Connection successful
    timeout_sec: 45
- click: '[data-testid="alert-dialog-ok"]'
- fill:
    selector: '[data-testid="session-ssh-cipher"]'
    value: invalid-cipher
- click: '[data-testid="session-test-connection"]'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: Unsupported SSH algorithm
    timeout_sec: 45
- click: '[data-testid="alert-dialog-ok"]'
- fill:
    selector: '[data-testid="session-ssh-cipher"]'
    value: aes256-ctr
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-generated-key
- set_check:
    selector: '[data-testid="session-reconnect"]'
    checked: true
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-generated-key"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-generated-key"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: printf '\nQA_GENERATED_KEY_OK\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_GENERATED_KEY_OK\s*$
    timeout_sec: 45
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: exit
    submit: true
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: Reconnected to
    timeout_sec: 45
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 45
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: printf '\nQA_AFTER_RECONNECT\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_AFTER_RECONNECT\s*$
    timeout_sec: 45

  native:
  - check: Real SSH server, MIT Kerberos KDC and native filesystem
    method: automated
    reason: Runner fixture authenticates with a real ticket; product connects through its native IPC and protocol implementation.
  visual:
  - check: Visible protocol status and file entries
    method: automated
    reason: Explicit UI assertions cover the rendered outcomes; file assertions independently verify transferred bytes.

id: TC-WS-059
title: Ordinary files open and save without automatic SDK or language-server discovery
description: Observe and forward real browser/native invoke calls. Empty workspace, adding a mixed folder, and opening txt/csv/json/log/markdown documents
  must not start SDK/LSP discovery. Save and reopen an ordinary file through the real shared editor; explicit SDK dialog and Refresh remain available.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
- F11.2
tags:
- p0
- workspace-redesign
- file-explorer
- regression
- sdk
fixtures:
- reset_db
- workspace_language_files
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-plain-files
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- assert_language_startup:
    commands: &id001
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- assert_language_startup:
    commands: *id001
    quiet_ms: 500
- click: '[data-testid="code-workspace-tree-dir"][data-path="Documents"] [data-testid="code-workspace-tree-dir-arrow"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/notes.txt"]'
- wait_for: '[data-testid="workspace-tab"][data-active="true"][data-tab-title="notes.txt"]'
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: notes.txt
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-line:first-child'
    equals: Weekly notes
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/budget.csv"]'
- wait_for: '[data-testid="workspace-tab"][data-active="true"][data-tab-title="budget.csv"]'
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: budget.csv
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-line:first-child'
    equals: item,amount
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/preferences.json"]'
- wait_for: '[data-testid="workspace-tab"][data-active="true"][data-tab-title="preferences.json"]'
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: preferences.json
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-line:first-child'
    equals: '{"language":"auto","plainDocument":true}'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/service.log"]'
- wait_for: '[data-testid="workspace-tab"][data-active="true"][data-tab-title="service.log"]'
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: service.log
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-line:first-child'
    equals: 2026-10-29 INFO ready
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-tab"][data-active="true"][data-tab-title="README.md"]'
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: README.md
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-line:first-child'
    equals: '# platform workspace root'
- assert_language_startup:
    commands: *id001
    quiet_ms: 500
- click: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
- fill:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    value: Ordinary document saved without SDK
- click: '[data-testid="workspace-editor-save"]:enabled'
- assert_visible: '[data-testid="workspace-editor-save"]:disabled'
- click: '[data-testid="workspace-tab"][data-tab-title="notes.txt"] [data-testid="workspace-tab-close"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/notes.txt"]'
- wait_for: '[data-testid="workspace-tab"][data-active="true"][data-tab-title="notes.txt"]'
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    equals: Ordinary document saved without SDK
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="nav-mode-workspaces"]'
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    equals: Ordinary document saved without SDK
- assert_language_startup:
    commands: *id001
    quiet_ms: 500
- click: '[data-testid="code-workspace-sdk-status"]'
- wait_for: '[data-testid="workspace-sdk-dialog"]'
- wait_for: '[data-testid^="workspace-sdk-root-"]'
- assert_language_startup:
    commands:
      sdk_get_registry:
        min: 1
        pending: 0
      sdk_resolve_workspace:
        min: 1
        pending: 0
      lsp_open_document:
        equal: 0
- click: '[data-testid="workspace-sdk-refresh"]'
- assert_language_startup:
    commands:
      sdk_get_registry:
        min: 2
        pending: 0
      sdk_resolve_workspace:
        min: 2
        pending: 0
      lsp_open_document:
        equal: 0
- click: '[data-testid="workspace-sdk-close"]'
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    equals: Ordinary document saved without SDK
- assert_no_runtime_errors: null
- screenshot: workspace-ordinary-files-no-language-discovery.png

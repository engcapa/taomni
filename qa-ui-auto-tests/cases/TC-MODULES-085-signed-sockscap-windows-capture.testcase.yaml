id: TC-MODULES-085
title: Windows SocksCap verifies WinDivert and releases its elevated capture helper
description: Reject changed driver files, start with the restored signed payload and disable capture through the Module Store.
covers: [F-Modules-1, F-Sockscap-1]
tags: [modules, sockscap, native-boundary, p1]
modes: [native]
native_platforms: [Windows]
fixtures: [reset_db, sockscap_legacy_config, module_signed_sockscap_archive]
timeout_sec: 245
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.sockscap_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.sockscap_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- click: '[data-testid="module-action-enable-sockscap"]'
- wait_for: '[data-testid="module-action-disable-sockscap"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-testid="sockscap-start"]:enabled'
- assert_signed_sockscap_host: running
- sockscap_resource_fixture: alter
- click: '[data-testid="sockscap-start"]'
- wait_for: '[data-testid="sockscap-probe-fail-dialog"]'
- click: '[data-testid="sockscap-probe-fail-force"]'
- assert_text: {selector: '[data-testid="sockscap-panel"]', contains: asset bytes differ from the signed package}
- assert_signed_windows_capture: unstaged
- sockscap_resource_fixture: restore
- assert_count: {selector: '[data-testid="sockscap-stop"]', equal: 0}
- wait_for: '[data-testid="sockscap-start"]:enabled'
- click: '[data-testid="sockscap-start"]'
- wait_for: '[data-testid="sockscap-probe-fail-dialog"]'
- click: '[data-testid="sockscap-probe-fail-force"]'
- wait_for: {selector: '[data-testid="sockscap-stop"]:enabled', timeout_sec: 70}
- assert_signed_windows_capture: running
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-sockscap"]'
- wait_for: '[data-testid="module-action-enable-sockscap"]'
- assert_signed_windows_capture: disabled
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-unavailable"][data-reason="disabled"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: trusted-windows-capture
    requirement: Windows validates the signed files before launching the helper and releases the helper when its owning module is disabled.
    actions: [6, 8, 12, 15, 16, 18, 21, 24, 26, 29, 31, 36]
    checkpoints:
    - {step: 7, expectation: The module came from the signed archive.}
    - {step: 14, expectation: The signed host holds the process writer lease.}
    - {step: 19, expectation: The panel reports that the WinDivert asset differs from its signed bytes.}
    - {step: 20, expectation: No elevated helper executable has been staged.}
    - {step: 22, expectation: Capture is inactive after the integrity error.}
    - {step: 23, expectation: "After restoring the case fixture, the user can retry capture."}
    - {step: 28, expectation: The elevated helper runs from the verified payload under the active signed host.}
    - {step: 33, expectation: The owning host and its elevated helper have exited and removed the ready file.}
    - {step: 37, expectation: The existing desktop shows the disabled module state.}
    - {step: 38, expectation: Capture startup and cleanup leave the renderer usable.}
    results: [7, 14, 19, 20, 22, 23, 28, 33, 37, 38]
  visual:
  - check: The capture panel displays the integrity error.
    method: automated
    reason: The test performs the visible Start action and checks the error shown in the panel.
  native:
  - check: The unsigned test edit is rejected before Windows elevation staging.
    method: automated
    reason: The runner records the actual installed and signed asset hashes and checks that the helper has not been copied out.

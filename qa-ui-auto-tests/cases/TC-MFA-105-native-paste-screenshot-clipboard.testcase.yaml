id: TC-MFA-105
title: Paste screenshot reads a real OS clipboard image in the native app
description: 'V-23 (AC-05). Packaged Linux/WebKitGTK app under Xvfb. An external xclip
  process owns the X11 CLIPBOARD as image/png (`native_clipboard_image`); Paste screenshot
  reads it through the Rust arboard path and imports QA Bank with 755 224. With only
  text on the clipboard the pane explains that no image is present.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F-MFA-2
tags:
- mfa
- clipboard
- native-boundary
- p1
modes:
- native
native_platforms:
- Linux
fixtures:
- linux_x11_required
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-native-105
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-native-105
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="mfa-empty"]'
    timeout_sec: 30
- click: '[data-testid="mfa-empty-add-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- native_clipboard_image:
    path: qa-ui-auto-tests/synthetic-fixtures/mfa/hotp-qa-bank.png
- click: '[data-testid="mfa-image-paste"]'
- wait_for:
    selector: '[data-testid="mfa-import-preview"]'
    timeout_sec: 30
- assert_items:
    selector: '[data-testid="mfa-import-item"]'
    attribute: data-issuer
    equals:
    - QA Bank
- click: '[data-testid="mfa-import-confirm"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 755 224
- native_clipboard_owner:
    action: grant
    text: plain text without an image
- click: '[data-testid="mfa-add"]'
- click: '[data-testid="mfa-add-mode-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- click: '[data-testid="mfa-image-paste"]'
- assert_text:
    selector: '[data-testid="mfa-image-status"]'
    contains: clipboard has no image
    timeout_sec: 20
- press: Escape
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- screenshot: mfa-105-native-paste.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: An image on the OS clipboard is read by the desktop app and imported
      (AC-05).
    actions:
    - 11
    - 13
    - 14
    - 17
    checkpoints:
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"mfa-add-dialog\"][data-mode=\"image\"]"}'
    - step: 15
      expectation: '{"wait_for": {"selector": "[data-testid=\"mfa-import-preview\"]",
        "timeout_sec": 30}}'
    - step: 16
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-import-item\"]",
        "attribute": "data-issuer", "equals": ["QA Bank"]}}'
    - step: 18
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    - step: 19
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        Bank\"] *)", "equals": "755 224"}}'
    results:
    - 19
  - id: R2
    requirement: A text-only OS clipboard is reported as having no image (AC-05).
    actions:
    - 20
    - 21
    - 22
    - 24
    - 26
    checkpoints:
    - step: 23
      expectation: '{"wait_for": "[data-testid=\"mfa-add-dialog\"][data-mode=\"image\"]"}'
    - step: 25
      expectation: '{"assert_text": {"selector": "[data-testid=\"mfa-image-status\"]",
        "contains": "clipboard has no image", "timeout_sec": 20}}'
    - step: 27
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    results:
    - 27
  visual:
  - check: Status message is legible.
    method: manual
    reason: Screenshot needs human review.
  native:
  - check: Windows (CF_DIB) and macOS (NSPasteboard) clipboard images are not automated
      and remain unverified.
    method: manual
    reason: The external clipboard image owner is implemented for X11 only.

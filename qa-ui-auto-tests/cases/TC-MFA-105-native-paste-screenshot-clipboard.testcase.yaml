id: TC-MFA-105
title: Paste screenshot reads a real OS clipboard image in the native app
description: V-23 (AC-05). Packaged Linux/WebKitGTK app under Xvfb. An external xclip process owns the X11 CLIPBOARD
  as image/png (`native_clipboard_image`); Paste screenshot reads it through the Rust arboard path and imports QA
  Bank with 755 224. With only text on the clipboard the pane explains that no image is present.
covers:
- F-MFA-2
tags:
- mfa
- clipboard
- native-boundary
- p1
modes:
- native
native_platforms:
- Linux
fixtures:
- linux_x11_required
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-native-105
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-native-105
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="mfa-empty"]'
    timeout_sec: 30
- click: '[data-testid="mfa-empty-add-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- native_clipboard_image:
    path: qa-ui-auto-tests/synthetic-fixtures/mfa/hotp-qa-bank.png
- click: '[data-testid="mfa-image-paste"]'
- wait_for:
    selector: '[data-testid="mfa-import-preview"]'
    timeout_sec: 30
- assert_items:
    selector: '[data-testid="mfa-import-item"]'
    attribute: data-issuer
    equals:
    - QA Bank
- click: '[data-testid="mfa-import-confirm"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 755 224
- native_clipboard_owner:
    action: grant
    text: plain text without an image
- click: '[data-testid="mfa-add"]'
- click: '[data-testid="mfa-add-mode-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- click: '[data-testid="mfa-image-paste"]'
- assert_text:
    selector: '[data-testid="mfa-image-status"]'
    contains: clipboard has no image
    timeout_sec: 20
- press: Escape
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- screenshot: mfa-105-native-paste.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: An image on the OS clipboard is read by the desktop app and imported (AC-05).
    actions:
    - 2
    - 3
    - 13
    - 15
    - 16
    - 19
    checkpoints:
    - step: 14
      expectation: image pane open
    - step: 17
      expectation: review step from the OS clipboard image
    - step: 18
      expectation: QA Bank decoded
    - step: 20
      expectation: dialog closed
    - step: 21
      expectation: code 755 224
    results:
    - 21
  - id: R2
    requirement: A text-only OS clipboard is reported as having no image (AC-05).
    actions:
    - 22
    - 23
    - 24
    - 26
    - 28
    checkpoints:
    - step: 25
      expectation: image pane open
    - step: 27
      expectation: no-image message
    - step: 29
      expectation: Escape closed the dialog
    results:
    - 29
  - id: workspace-navigation
    requirement: Explicit navigation preserves access to the original workflow in the Workspace-first shell.
    actions:
    - 2
    - 3
    checkpoints:
    - step: 29
      expectation: The original final visible result remains reachable after the navigation migration.
    results:
    - 29
  visual:
  - check: Status message is legible.
    method: manual
    reason: Screenshot needs human review.
  native:
  - check: Windows (CF_DIB) and macOS (NSPasteboard) clipboard images are not automated and remain unverified.
    method: manual
    reason: The external clipboard image owner is implemented for X11 only.

id: TC-104
title: Session screenshot entry is removed and system capture remains usable from a terminal
covers:
- F4.13
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 15
- assert_not_visible: '[data-testid="capture-menu"]'
- assert_not_visible: '[data-testid="capture-toolbar"]'
- click: '[data-testid="tab-more"]'
- wait_for: '[data-testid="open-tabs-menu"]'
- assert_not_visible: '[data-testid="open-tabs-screenshot"]'
- press: Escape
- click: '[data-testid="system-screenshot-delay-toggle"]'
- assert_visible: '[data-testid="system-screenshot-current-window"]'
- click: '[data-testid="system-screenshot-current-window"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="terminal-pane"]'
verification:
  review: reviewed
  requirements:
  - id: remove
    requirement: The active terminal and tab menu expose no legacy per-session screenshot tools.
    actions:
    - 1
    - 3
    - 7
    checkpoints:
    - step: 4
      expectation: 'wait_for: {''selector'': ''[data-testid="terminal-pane"]'', ''timeout_sec'': 15}'
    - step: 5
      expectation: 'assert_not_visible: [data-testid="capture-menu"]'
    - step: 6
      expectation: 'assert_not_visible: [data-testid="capture-toolbar"]'
    - step: 8
      expectation: 'wait_for: [data-testid="open-tabs-menu"]'
    - step: 9
      expectation: 'assert_not_visible: [data-testid="open-tabs-screenshot"]'
    results:
    - 4
    - 5
    - 6
    - 8
    - 9
  - id: replace
    requirement: The unified screenshot entry works from the terminal and restores it after cancel.
    actions:
    - 10
    - 11
    - 13
    - 15
    checkpoints:
    - step: 12
      expectation: 'assert_visible: [data-testid="system-screenshot-current-window"]'
    - step: 14
      expectation: 'wait_for: [data-testid="screenshot-toolbar"]'
    - step: 16
      expectation: 'wait_for: [data-testid="terminal-pane"]'
    results:
    - 12
    - 14
    - 16
  visual:
  - check: Observable capture UI and operation results
    method: automated
    reason: Assertions check the stated visible states and geometry; retained screenshots allow review.
  native:
  - check: Native capture and window lifecycle
    method: external
    reason: Browser verifies renderer interaction and stub dispatch; native window, clipboard and media assertions are covered
      by SHOT-N cases.

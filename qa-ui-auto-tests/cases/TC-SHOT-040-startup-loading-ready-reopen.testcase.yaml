id: TC-SHOT-040
title: Screenshot loading stays transparent and noninteractive until decoded pixels commit, and reopening resets selection
description: "Browser renderer regression for P0-1b and the generation-keyed ready signal. A browser-only delayed init fixture exposes the actual loading state: it has no image, no ready signal and ignores a drag. After decoding, the root becomes opaque with a real image, reports generation 1 exactly once, and accepts a selection. Cancel closes the annotated overlay; Escape closes the reopened selection overlay. Reopening returns to selection with no stale crop and produces one additional ready signal. Native window transparency, true IPC read/decode and window restoration are not established by these stubs; TC-SHOT-N27/N28 and native lifecycle cases cover those boundaries."
covers: [F27.1]
tags: [screenshot, startup, p1]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}?qaScreenshotInitDelayMs=1500#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="loading"]'
- eval_readonly:
    expression: getComputedStyle(document.querySelector('[data-phase]')).backgroundColor === 'rgba(0, 0, 0, 0)' && !document.querySelector('[data-phase] img') && !JSON.stringify(window.__taomniStubScreenshotCalls || []).includes('screenshot_overlay_ready')
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position: {x: 100, y: 100}
    to_position: {x: 500, y: 400}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- assert_visible: '[data-testid="screenshot-base-image"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
- eval_readonly:
    expression: getComputedStyle(document.querySelector('[data-phase]')).backgroundColor === 'rgb(0, 0, 0)' && document.querySelector('[data-phase] img').naturalWidth === 400 && JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_overlay_ready"').length === 2 && JSON.stringify(window.__taomniStubScreenshotCalls).includes('"generation":1')
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position: {x: 100, y: 100}
    to_position: {x: 500, y: 400}
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: '160 × 120'
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_overlay_ready"').length === 3
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- assert_no_runtime_errors:
verification:
  review: reviewed
  requirements:
  - id: loading-commit
    requirement: Loading is transparent and ignores selection until decoded image pixels commit, then signals readiness exactly once with the generation and enables selection.
    actions: [1, 2, 5, 10]
    checkpoints:
    - {step: 4, expectation: The loading root is transparent and has neither a base image nor a ready signal.}
    - {step: 6, expectation: The delayed image load reaches select.}
    - {step: 8, expectation: Dragging while loading did not create a crop.}
    - {step: 9, expectation: The loaded root is black behind its decoded 400px image and emitted one ready signal with generation 1.}
    - {step: 12, expectation: A post-load drag produces the expected 160 by 120 physical crop.}
    results: [4, 6, 8, 9, 12]
  - id: reopen-reset
    requirement: Closing and reopening clears selection and repeats readiness without a stale image session or renderer errors.
    actions: [13, 15, 19]
    checkpoints:
    - {step: 14, expectation: Cancel returns to the main renderer.}
    - {step: 17, expectation: Reopening has no stale selection.}
    - {step: 18, expectation: There is exactly one additional ready signal for the second mount.}
    - {step: 20, expectation: The second Escape returns to the main renderer.}
    - {step: 21, expectation: No renderer runtime errors occurred.}
    results: [14, 17, 18, 20, 21]
  visual:
  - {check: Transparent loading and decoded image, method: automated, reason: "Computed backgrounds and image dimensions verify browser renderer state, not native composition."}
  native:
  - {check: Native capture and hidden-window ready handshake, method: external, reason: "TC-SHOT-N27/N28 use real Tauri windows and capture APIs; browser routing and capture IPC here are stubbed."}

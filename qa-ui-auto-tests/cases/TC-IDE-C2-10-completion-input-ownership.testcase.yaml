id: TC-IDE-C2-10-completion-input-ownership
title: Editor keyboard input ownership and focus surface boundaries
description: 'Browser verification for editor keyboard input ownership: normal arrow
  navigation

  and Enter newlines when popup is closed vs ArrowDown navigation and Enter acceptance

  when completion popup is active.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F25.5
tags:
- code-workspace
- ide-c2
- completion
- input-ownership
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- click: '[data-testid="code-workspace-tree-new"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: App.java
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Enter
- press: ArrowUp
- eval_readonly:
    expression: document.querySelector(".cm-tooltip-autocomplete") === null
    expect_truthy: true
- type: sout
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 10
- wait: 0.5
- press: ArrowDown
- assert_text:
    selector: .cm-tooltip-autocomplete [aria-selected="true"]
    contains: soutm
- press: Enter
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: System.out.println(
- press: Control+z
- screenshot: tc-ide-c2-10-input-ownership.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Editor keyboard input ownership and focus surface boundaries：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
    - 13
    - 14
    - 16
    - 17
    - 18
    - 20
    - 23
    - 25
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 15
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor\"] .cm-content[data-language=\"java\"]"}'
    - step: 19
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\".cm-tooltip-autocomplete\")
        === null", "expect_truthy": true}}'
    - step: 21
      expectation: '{"wait_for": {"selector": ".cm-tooltip-autocomplete li", "timeout_sec":
        10}}'
    - step: 24
      expectation: '{"assert_text": {"selector": ".cm-tooltip-autocomplete [aria-selected=\"true\"]",
        "contains": "soutm"}}'
    - step: 26
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"]
        .cm-content", "contains": "System.out.println("}}'
    results:
    - 26
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

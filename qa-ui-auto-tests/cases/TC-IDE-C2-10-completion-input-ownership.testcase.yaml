id: TC-IDE-C2-10-completion-input-ownership
title: "Editor keyboard input ownership and focus surface boundaries"
description: |
  Verifies RT-18..21 keyboard input ownership rules. With popup closed, Arrow keys,
  Enter, and Tab execute normal navigation, newlines, and indentation without
  interception. When popup is active, arrow keys and Enter are owned by the completion popup.
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, input-ownership, browser-gate, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 180
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  - dblclick: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: "Enter"
  - press: "ArrowUp"
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete'
      timeout_sec: 10
  - press: "ArrowDown"
  - press: "Enter"
  - wait_for:
      selector: '[data-testid="code-workspace-editor"]'
      timeout_sec: 10
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "System.out.println"
  - screenshot: tc-ide-c2-10-input-ownership.png

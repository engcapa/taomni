id: TC-SHELL-B38
title: Twenty lane switches retain editor history, Notes and utility drafts, selection and late proxy results
description: V-B38 renderer integration. Real PTY/disk/service effects are paired with N02-N07; the other retained
  consumers are mapped in the design evidence matrix. Classification now uses dock/Actions; Project uses the unified
  Workspaces entry. Existing workspace content, shortcut and state assertions remain. LAN Chat checks are excluded
  from this acceptance at the user's request on 2026-10-06.

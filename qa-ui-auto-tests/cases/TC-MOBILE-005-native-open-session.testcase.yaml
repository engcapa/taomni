id: TC-MOBILE-005
title: Paired phone opens new local and saved LocalShell terminals through the real desktop
covers:
- F-MOBILE-1
- F1.6
- F2.1
tags:
- p0
- mobile
- native-boundary
modes:
- native
native_platforms:
- Linux
fixtures:
- reset_db
- mobile_service
timeout_sec: 180
description: >-
  The real listener starts from global Settings in an isolated QA profile with no
  terminal tabs. An independent HTTP/WS phone oracle proves the default-off gate,
  Settings opt-in, pending-to-opened results, per-device polling isolation, readable
  mirrored titles, and one new desktop terminal per request. Both a new local
  terminal and a credential-free saved LocalShell must execute WS input, producing
  a separate stdout line and exact independent host marker bytes. No live SSH or
  external network is required; browser stubs cannot prove desktop/PTY effects.
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-mobile-open-session-password
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: mobile
- wait_for: '[data-testid="mobile-settings"]'
- assert_text:
    selector: '[data-testid="mobile-settings-status"]'
    contains: Disabled
- assert_count:
    selector: '[data-testid="mobile-settings-open-sessions"]:not(:checked)'
    equal: 1
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 0
- fill:
    selector: '[data-testid="mobile-settings-port"]'
    value: '0'
- click: '[data-testid="mobile-settings-toggle"]'
- assert_text:
    selector: '[data-testid="mobile-settings-status"]'
    contains: Running
- click: '[data-testid="mobile-settings-pair"]'
- wait_for: '[data-testid="mobile-settings-code"]'
- mobile_service_probe: open-session
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 2
- assert_file_contains:
    path: ${fixture.mobile_open_local_marker}
    contains: QA_MOBILE_OPEN_LOCAL_
- assert_file_contains:
    path: ${fixture.mobile_open_saved_marker}
    contains: QA_MOBILE_OPEN_SAVED_
- assert_file_contains:
    path: ${fixture.mobile_open_receipt}
    contains: '"passed": true'
- assert_no_runtime_errors: null
- screenshot: mobile-opened-saved-local-terminal.png
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="mobile-settings"]'
- assert_count:
    selector: '[data-testid="mobile-settings-open-sessions"]:checked'
    equal: 1
- click: '[data-testid="mobile-settings-toggle"]'
- assert_text:
    selector: '[data-testid="mobile-settings-status"]'
    contains: Disabled
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: >-
      Opening defaults off and refuses both local and saved requests with HTTP 403
      open_sessions_disabled without creating any desktop tab. Enabling the actual
      Settings checkbox changes the real service capability, not a browser stub.
    actions: [1, 3, 4, 9, 10, 12]
    checkpoints:
    - step: 6
      expectation: Mobile listener is initially stopped.
    - step: 7
      expectation: The actual open-sessions checkbox is unchecked in the fresh profile.
    - step: 8
      expectation: No terminal is open before any mobile request.
    - step: 11
      expectation: Settings starts the real native listener on a disposable port.
    - step: 14
      expectation: >-
        Independent HTTP clients observe capability false, 403/open_sessions_disabled
        for local and saved requests, no created tabs, then capability true only after
        the probe clicks the actual Settings checkbox.
    results: [6, 7, 8, 11, 14]
  - id: R2
    requirement: >-
      Each allowed request returns pending then opened with a new term: id that only
      the requesting device may poll. The id names one new real local desktop tab
      and a running session with a readable mirrored title; the saved request uses
      the selected credential-free LocalShell configuration rather than a generic
      or already-open terminal.
    actions: [10, 12]
    checkpoints:
    - step: 14
      expectation: >-
        For local and saved LocalShell independently, the protocol receipt retains
        pending-to-opened polls and other-device 404/open_request_not_found. The
        returned backend key matches one new active ready local desktop tab, the
        readable title matches that tab, and the saved instance has its seeded
        shell name/arguments. The two requests yield distinct retained instances.
    - step: 15
      expectation: Exactly two real desktop terminal tabs exist after the two requests.
    - step: 23
      expectation: Settings still shows the desktop opt-in after returning from the new terminals.
    results: [14, 15, 23]
  - id: R3
    requirement: >-
      Both newly opened terminal streams grant take-control to the paired phone and
      forward input to the real PTY. A command echo alone is not execution evidence:
      each command must produce a separate stdout line in the WS and desktop and
      exact independent marker bytes on the runner host.
    actions: [10, 12]
    checkpoints:
    - step: 14
      expectation: >-
        Each returned term: stream grants the expected mobile holder, produces a
        separate anchored stdout line, shows that line in its mapped desktop terminal,
        and creates a previously absent marker file with the exact sent nonce bytes.
        Failures retain their phase and raw observations without pairing secrets.
    - step: 16
      expectation: The local-terminal marker is independently readable from disk.
    - step: 17
      expectation: The saved-LocalShell marker is independently readable from disk.
    - step: 18
      expectation: The protocol receipt records all oracle assertions passing.
    - step: 19
      expectation: No runtime errors occurred while opening or controlling either terminal.
    results: [14, 16, 17, 18, 19]
  - id: R4
    requirement: The normal Settings entry remains usable and the real listener can be stopped after phone-open requests.
    actions: [21, 24]
    checkpoints:
    - step: 25
      expectation: Settings reports the real mobile listener stopped.
    - step: 26
      expectation: No runtime errors occurred during cleanup.
    results: [25, 26]
  visual:
  - check: Saved-local terminal screenshot is diagnostic only.
    method: not-applicable
    reason: Actual protocol, desktop-tab correlation and independent PTY disk receipts own acceptance; no visual parity claim is made.
  native:
  - check: Real Settings IPC, desktop event bridge, native PTY broker and OS disk effects are required.
    method: automated
    reason: >-
      Native Linux runs the isolated QA app and public HTTP/WS clients. The passive
      terminal registry only correlates identities and reads output; app IPC and
      registry input writers are never called. Windows/macOS and live SSH remain
      outside this focused Linux LocalShell case.

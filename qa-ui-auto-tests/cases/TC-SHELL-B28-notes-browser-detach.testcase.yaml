id: TC-SHELL-B28
title: Notes float and dock keep one editor and its complete title
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b28.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F-TAO-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- wait_for: '[data-testid="notes-panel"]'
- click: '[data-testid="notes-new"]'
- wait_for: '[data-testid="note-editor-title"]'
- fill:
    selector: '[data-testid="note-editor-title"]'
    value: SHELL-NOTE
- click: '[data-testid="notes-floating-toggle"]'
- wait_for: '[data-testid="floating-notes-panel"]'
- assert_count:
    selector: '[data-testid="note-editor-title"]:visible'
    equal: 1
- assert_value:
    selector: '[data-testid="note-editor-title"]'
    equals: SHELL-NOTE
- click: '[data-testid="floating-notes-dock"]'
- assert_not_visible: '[data-testid="floating-notes-panel"]'
- assert_count:
    selector: '[data-testid="note-editor-title"]:visible'
    equal: 1
- assert_value:
    selector: '[data-testid="note-editor-title"]'
    equals: SHELL-NOTE
- screenshot: tc-shell-b28.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A note keeps its title when moved from the Hub to the floating view
      and back.
    actions:
    - 3
    - 4
    - 6
    - 8
    - 9
    - 13
    checkpoints:
    - step: 5
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    - step: 7
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    - step: 10
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    - step: 11
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    - step: 12
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    - step: 14
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    - step: 15
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    - step: 16
      expectation: A note keeps its title when moved from the Hub to the floating
        view and back.
    results:
    - 5
    - 7
    - 10
    - 11
    - 12
    - 14
    - 15
    - 16
  visual:
  - check: Inspect the final screenshot for readable controls, clipping and overlay
      placement.
    method: manual
    reason: Screenshots require a visual verdict; geometry assertions are recorded
      separately.
  native:
  - check: Tauri, OS window, physical input and real service effects
    method: not-applicable
    reason: This case is browser renderer coverage; paired TC-SHELL-N cases cover
      native boundaries.

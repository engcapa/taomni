id: TC-WS-016
title: Tao Home compact layout and retained launch actions
description: Home stays full width with the Tao Home Composer and bottom dock, while retained terminal and workspace launch actions still route to their existing tabs.
modes:
- browser
covers:
- F1.11
- F-WS-1
tags:
- p0
- workspace-redesign
- tao-home
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-016
- wait_for: '[data-testid="tao-home-host"]'
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="tao-home-topbar"]'
- assert_count:
    selector: '[data-testid="tao-home-topbar"]'
    equal: 1
- assert_visible: '[data-testid="tao-home-composer"]'
- assert_visible: '[data-testid="tao-home-dock-row"]'
- assert_visible: '[data-testid="tao-home-local-terminal"]'
- assert_visible: '[data-testid="tao-home-new-session"]'
- assert_visible: '[data-testid="tao-home-new-workspace"]'
- assert_not_visible: '[data-testid="tao-home-lan-chat"]'
- set_viewport:
    width: 960
    height: 720
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"tao-home-composer"]').getBoundingClientRect().right < window.innerWidth + 2 && document.querySelector('[data-testid' + String.fromCharCode(61) + '"tao-home-dock-row"]').getBoundingClientRect().bottom < window.innerHeight + 2
    expect_truthy: true
- click: '[data-testid="welcome-panel"] [data-testid="tao-home-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_visible: '[data-testid="tab-bar"]'
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="tao-home-host"]'
- click: '[data-testid="tao-home-new-workspace"]'
- wait_for: '[data-testid="text-input-dialog"]'
- assert_text:
    selector: '[data-testid="text-input-dialog"]'
    contains: Select folder to open
- click: '[data-testid="text-input-dialog-cancel"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- assert_no_runtime_errors: null
- screenshot: ws-016-tao-home-layout.png

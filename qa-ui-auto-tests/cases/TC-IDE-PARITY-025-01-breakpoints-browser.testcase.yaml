id: TC-IDE-PARITY-025-01
title: IDEA breakpoint gutter, balloon and Breakpoints dialog
description: 'ED-PARITY-025 A1/A2/A3 browser case: IDEA''s gutter mouse model (click
  toggles, middle-click disables, Alt+click adds a temporary and Shift+click a non-suspending
  logging breakpoint with the expanded balloon), the right-click balloon (Enabled/Suspend/Condition,
  Enter commits and closes, More opens the dialog), the empty-line Add Breakpoint
  menu, Ctrl+Shift+F8 (balloon on a breakpoint line, View Breakpoints dialog elsewhere)
  with Space/Delete keyboard editing, and Ctrl+Alt+Shift+F8 temporary breakpoints.
  Breakpoints persist without a debug adapter, so browser mode covers the editor and
  dialog surfaces. Debugger actions read the live editor caret even before batched
  workspace cursor state commits; hit semantics are covered natively by TC-IDE-PARITY-025-02.


  Mode: browser.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F25.1
- F25.5
tags:
- code-workspace
- debug
- ed-parity-025
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240

id: TC-TAOFFICE-042
title: Install the signed Visio module and save a rendered page through the native chooser
description: Exercise the signed offline renderer for modern and binary Visio documents, cancel and repeat SVG export, and verify the bytes on disk.
modes: [native]
covers: [F-FILEOPEN-1, F-Modules-1]
tags: [p0, file-open, taoffice, taoffice-visio, crash-regression, native-boundary]
fixtures: [reset_db, file_open_files, taoffice_signed_visio]
ui_standard: [UI-DLG-12, UI-FOC-02, UI-OTH-03, UI-SRF-02]
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.visio_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.visio_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- press: {selector: '[data-testid="module-action-enable-taoffice-visio"]:enabled', key: Enter}
- wait_for: '[data-testid="module-action-disable-taoffice-visio"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- dblclick: '[data-testid="explorer-file-row"][data-name="visio-routing.vsdx"]'
- wait_for: {selector: '[data-testid="taoffice-visio-page"][data-page="1"][data-rendered="true"]', timeout_sec: 55}
- press: {selector: '[data-testid="taoffice-visio-viewport"]', key: Control+f, macos_key: Meta+f}
- assert_focus_on: '[data-testid="taoffice-visio-find-input"]'
- fill: {selector: '[data-testid="taoffice-visio-find-input"]', value: approval}
- press: {selector: '[data-testid="taoffice-visio-find-input"]', key: Enter}
- wait_for: '[data-testid="taoffice-visio-page"][data-page="2"][data-rendered="true"]'
- press: {selector: '[data-testid="taoffice-visio-find-input"]', key: Escape}
- press: {selector: '[data-testid="taoffice-visio-find-input"]', key: Escape}
- assert_focus_on: '[data-testid="taoffice-visio-viewport"]'
- native_file_dialog:
    kind: save
    action: cancel
    trigger: '[data-testid="taoffice-visio-export"]'
- wait_for: '[data-testid="taoffice-visio-export"]:enabled'
- assert_count: {selector: '[data-testid="taoffice-visio-export-status"]', equal: 0}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/visio-routing - copy.svg', absent: true}
- assert_text_equals: {selector: '[data-testid="taoffice-visio-page-name"]', equals: 'Delivery details · 2/2'}
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.file_open_root}/delivery.svg
    trigger: '[data-testid="taoffice-visio-export"]'
- assert_text: {selector: '[data-testid="taoffice-visio-export-status"]', contains: delivery.svg}
- assert_file_contains: {path: '${fixture.file_open_root}/delivery.svg', contains: '<svg'}
- assert_file_contains: {path: '${fixture.file_open_root}/delivery.svg', contains: 'Routing approval'}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/visio-routing.vsdx', sha256: '${fixture.taoffice_visio_modern_sha}'}
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="visio-legacy.vsd"]'
- wait_for: {selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-visio-page"][data-rendered="true"]', timeout_sec: 55}
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.file_open_root}/legacy-lines.svg
    trigger: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-visio-export"]'
- assert_file_contains: {path: '${fixture.file_open_root}/legacy-lines.svg', contains: '<marker'}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/visio-legacy.vsd', sha256: '${fixture.taoffice_visio_legacy_sha}'}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    ui_standard: [UI-DLG-12, UI-OTH-03]
    requirement: The native save chooser operates on the current diagram page and cancellation preserves the page and writes no file.
    actions: [27, 32, 40]
    checkpoints:
    - {step: 29, expectation: Cancelling the chooser produces no success notice.}
    - {step: 30, expectation: The default output path does not contain a file after cancellation.}
    - {step: 31, expectation: The second page remains selected.}
    - {step: 35, expectation: The saved copy contains the second page text.}
    - {step: 41, expectation: Exporting a binary diagram preserves a line marker in the generated SVG.}
    results: [29, 30, 31, 35, 41]
  - id: R2
    ui_standard: [UI-FOC-02, UI-SRF-02]
    requirement: The actual packaged viewer gives the Find input focus and gives the viewport focus back after closing Find.
    actions: [19, 22, 25]
    checkpoints:
    - {step: 20, expectation: The Find input has focus.}
    - {step: 23, expectation: Searching opens the matching second page.}
    - {step: 26, expectation: The viewport regains focus after the search bar closes.}
    results: [20, 23, 26]
  visual:
  - {check: Modern and binary previews, method: automated, reason: Both selected pages load actual decoded SVG images in the packaged WebView.}
  native:
  - {check: Native Save As, method: automated, reason: A native dialog drives each export and the runner reads the resulting SVG and both original files directly from disk.}

id: TC-SHOT-027
title: Scroll progress controls distinguish Finish from Cancel
covers:
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-scroll
- wait_for: '[data-testid="screenshot-scroll-progress"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-scroll-progress"]'
    equals: "Scroll capture \xB7 3 frames"
- click: '[data-testid="screenshot-scroll-stop"]'
- wait_for: '[data-testid="screenshot-overlay"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_stop_scroll_capture" && window.__taomniStubScreenshotCalls.at(-1).args.cancel
      === false
- open: ${cfg.app.base_url}#screenshot-scroll
- wait_for: '[data-testid="screenshot-scroll-controller"]'
- click: '[data-testid="screenshot-scroll-cancel"]'
- wait_for: '[data-testid="screenshot-overlay"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_stop_scroll_capture" && window.__taomniStubScreenshotCalls.at(-1).args.cancel
      === true
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- open: ${cfg.app.base_url}?qaScrollMode=manual#screenshot-scroll
- wait_for: '[data-testid="screenshot-scroll-mode-hint"]'
- assert_text:
    selector: '[data-testid="screenshot-scroll-mode-hint"]'
    contains: Pauses are allowed
- click: '[data-testid="screenshot-scroll-switch-mode"]'
- assert_text:
    selector: '[data-testid="screenshot-scroll-mode-hint"]'
    contains: Taomni will scroll
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_set_scroll_mode" && window.__taomniStubScreenshotCalls.at(-1).args.mode
      === "auto"
- click: '[data-testid="screenshot-scroll-switch-mode"]'
- assert_text:
    selector: '[data-testid="screenshot-scroll-mode-hint"]'
    contains: Pauses are allowed
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).args.mode === "manual"
- click: '[data-testid="screenshot-scroll-cancel"]'
- wait_for: '[data-testid="screenshot-overlay"]'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- assert_visible: '[data-testid="system-screenshot"]'
- open: ${cfg.app.base_url}#screenshot-scroll
- wait_for: '[data-testid="screenshot-scroll-controller"]'
- press: Escape
- wait_for: '[data-testid="screenshot-overlay"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_stop_scroll_capture" && window.__taomniStubScreenshotCalls.at(-1).args.cancel === false
verification:
  review: reviewed
  requirements:
  - id: workflow
    requirement: Finish and Escape keep content and Cancel discards it. A manual capture explains pauses; switching to automatic and back updates
      visible instructions and dispatches the chosen mode without closing the controller.
    actions:
    - 1
    - 4
    - 7
    - 9
    - 12
    - 14
    - 17
    - 20
    - 23
    - 25
    - 28
    - 30
    checkpoints:
    - step: 3
      expectation: "assert_text_equals: {'selector': '[data-testid=\"screenshot-scroll-progress\"]', 'equals': 'Scroll capture \xB7\
        \ 3 frames'}"
    - step: 6
      expectation: 'eval_readonly: {''expression'': ''window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_stop_scroll_capture"
        && window.__taomniStubScreenshotCalls.at(-1).args.cancel === false''}'
    - step: 11
      expectation: 'eval_readonly: {''expression'': ''window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_stop_scroll_capture"
        && window.__taomniStubScreenshotCalls.at(-1).args.cancel === true''}'
    - step: 16
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-scroll-mode-hint"]'', ''contains'': ''Pauses are allowed''}'
    - step: 18
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-scroll-mode-hint"]'', ''contains'': ''Taomni will scroll''}'
    - step: 19
      expectation: 'eval_readonly: {''expression'': ''window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_set_scroll_mode"
        && window.__taomniStubScreenshotCalls.at(-1).args.mode === "auto"''}'
    - step: 21
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-scroll-mode-hint"]'', ''contains'': ''Pauses are allowed''}'
    - step: 22
      expectation: 'eval_readonly: {''expression'': ''window.__taomniStubScreenshotCalls.at(-1).args.mode === "manual"''}'
    - step: 27
      expectation: The main screenshot entry is usable after exit.
    - step: 32
      expectation: Escape dispatches Finish with cancel false.
    results:
    - 3
    - 6
    - 11
    - 16
    - 18
    - 19
    - 21
    - 22
    - 27
    - 32
  visual:
  - check: Visible controls, state and image dimensions
    method: automated
    reason: Assertions check actual renderer state and output; screenshots are retained.
  native:
  - check: OS input, clipboard, windows and persistent files
    method: external
    reason: Browser uses IPC stubs; matching SHOT-N scenarios own actual desktop and disk assertions.

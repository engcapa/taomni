id: TC-IDE-C0-02
title: Save receipt dirty/saved state, keyboard focus, announcement, and undo
description: 'ED-SAVE-004 browser behavior and accessibility slice. It opens the browser

  VFS through the production workspace entry, uses the real CodeMirror save

  shortcut at 200% editor zoom, and observes only production receipt metadata.

  It verifies dirty/saved state, receipt identity and hashes, live-region

  semantics, focus retention, and one undo back to the saved text. It then

  saves again from the restored-clean buffer and requires a fresh, distinct

  receipt (new encoded-bytes hash, write-count 1). The browser VFS is not

  native disk evidence; stale in-flight behavior is covered by the mounted

  deferred-writer regression and real bytes by TC-IDE-C0-01.

  '
covers:
- F25.5
- F1.7
tags:
- code-workspace
- ide-c0
- save
- receipt
- accessibility
- p0
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'

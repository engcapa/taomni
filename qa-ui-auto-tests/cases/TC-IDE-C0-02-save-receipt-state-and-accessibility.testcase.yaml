    contains: 26px
- fill:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    value: 'receipt line one

      receipt line two'
- wait: 1
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-state
    equals: dirty
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: role
    equals: status
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: aria-live
    equals: polite
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: aria-atomic
    equals: 'true'
- assert_text:
    selector: '[data-testid="code-workspace-save-observation"]'
    contains: Unsaved changes
- assert_attribute:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    name: role
    equals: textbox
- assert_attribute:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    name: aria-multiline
    equals: 'true'
- eval_readonly:
    expression: document.querySelector(".cm-content:focus")?.matches(".cm-content")
    expect_truthy: true
- press: Control+s
- wait: 1
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-state
    equals: saved
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-result-kind
    equals: saved-current
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-write-count
    equals: '1'
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-dirty
    equals: 'false'
- eval_readonly:
    expression: /^[a-f0-9]{64}$/.test(document.getElementById("code-workspace-save-observation")?.getAttribute("data-encoded-bytes-sha256")
      ?? "")
    expect_truthy: true
- eval_readonly:
    expression: document.getElementById("code-workspace-save-observation")?.hasAttribute("data-final-text-sha256")
    expect_truthy: true
- assert_text:
    selector: '[data-testid="code-workspace-save-observation"]'
    contains: Saved README.txt
- eval_readonly:
    expression: document.querySelector(".cm-content:focus")?.matches(".cm-content")
    expect_truthy: true
- type: X
- wait: 0.5
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-state
    equals: dirty
- press: Control+z
- wait: 0.5
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-state
    equals: clean
- eval_readonly:
    expression: document.querySelector(".cm-content:focus")?.matches(".cm-content")
    expect_truthy: true
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+End
- type: '2'
- wait: 0.5
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-state
    equals: dirty
- press: Control+s
- wait: 1
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-state
    equals: saved
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-result-kind
    equals: saved-current
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-write-count
    equals: '1'
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-dirty
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="code-workspace-save-observation"]'
    name: data-encoded-bytes-sha256
    equals: 5eebea28ed7980381dff6dedc26f77ca7340bfccb34f6869f83435a0fe4983c1
- eval_readonly:
    expression: document.querySelector(".cm-content:focus")?.matches(".cm-content")
    expect_truthy: true
- screenshot: tc-ide-c0-browser-save-receipt.png

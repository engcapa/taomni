id: TC-IDE-ED011-ime-windows-native
title: "Windows native IME composition isolation and recovery"
description: |
  ED-AUDIT-011 packaged Windows slice. The native runner activates the
  configured Windows Chinese input layout and sends Win32 SendInput keys into
  the real com.taomni.app.qa WebView2 editor. The case checks the composing
  candidate/navigation boundary, Space confirmation, Escape cancellation,
  keyboard focus, textbox semantics, the product's 200% editor size and one
  post-composition undo. It does not use browser composition events as native
  IME evidence.
covers: [F25.5, F25.3]
tags: [code-workspace, ide-ed011, ime, keyboard, accessibility, native-gate, p1]
modes: [native]
native_platforms: [Windows]
fixtures: [reset_db, workspace_root]
timeout_sec: 240
steps:
  - open: "${cfg.app.base_url}"
  - vault_first_run: "qa-ed011-ime-windows-password"
  - wait_for: '[data-testid="welcome-panel"]'
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-ed011","name":"qa-ed011","roots":[{"id":"r1","name":"qa-ed011","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
  - click: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'

  # Set the product's 200%-of-default editor size before the IME workflow.
  - click: '[data-testid="code-workspace-tab"]'
  - press: Control+Shift+N
  - wait_for:
      selector: '[data-testid="code-workspace-search-everywhere"]'
      timeout_sec: 30
  - click: '[data-testid="code-workspace-search-everywhere"] button[role="tab"]:nth-of-type(5)'
  - click: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
  - type: Editor Appearance Settings
  - press: Enter
  - wait_for: '[data-testid="workspace-editor-appearance-settings-dialog"]'
  - fill:
      selector: '[data-testid="workspace-editor-appearance-font-size-px"]'
      value: "26"
  - click: '[data-testid="workspace-editor-appearance-apply"]'
  - wait: 1
  - assert_text:
      selector: '[data-testid="code-workspace-zoom-reset"]'
      contains: "26px"

  - fill:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      value: "alpha\nsecond"
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  # Make the composition origin deterministic instead of relying on the
  # WebDriver element-center click position after the 200% font-size change.
  - press: Control+Home
  - press: End
  - assert_attribute:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      name: role
      equals: textbox
  - assert_attribute:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      name: aria-label
      equals: "Code editor"
  - assert_attribute:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      name: aria-multiline
      equals: "true"
  - eval_readonly:
      expression: 'document.activeElement === document.querySelector(".cm-content") && getComputedStyle(document.querySelector(".cm-content")).fontSize === "26px"'
      expect_truthy: true

  # Confirm a Microsoft Pinyin composition first. Candidate ordering is not a
  # contract, but confirmation must commit a CJK result as one editor edit.
  - native_windows_ime_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      layout: "00000804"
      label: confirmation-compose
      keys: [n, i, h, a, o]
  - eval_readonly:
      expression: 'document.activeElement === document.querySelector(".cm-content") && document.querySelectorAll(".cm-line")[0]?.textContent?.startsWith("alpha") && document.querySelectorAll(".cm-line")[1]?.textContent === "second"'
      expect_truthy: true
  - native_windows_ime_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      label: candidate-navigation
      keys: [ArrowDown]
  - eval_readonly:
      expression: 'document.activeElement === document.querySelector(".cm-content") && document.querySelectorAll(".cm-line").length === 2 && document.querySelectorAll(".cm-line")[0]?.textContent?.startsWith("alpha") && document.querySelectorAll(".cm-line")[1]?.textContent === "second"'
      expect_truthy: true
  - native_windows_ime_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      label: candidate-confirm
      keys: [Space]
  - eval_readonly:
      expression: '/^alpha[\u3400-\u9fff]+\nsecond$/.test(document.querySelector(".cm-content").taomniDocumentSnapshot ?? "")'
      expect_truthy: true

  # A second composition must be cancellable without changing the committed
  # text or the two-line shape.
  - native_windows_ime_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      label: cancellation-compose
      keys: [z, h, o, n, g]
  - native_windows_ime_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      label: cancellation-escape
      keys: [Escape]
  - eval_readonly:
      expression: '/^alpha[\u3400-\u9fff]+\nsecond$/.test(document.querySelector(".cm-content").taomniDocumentSnapshot ?? "") && document.activeElement === document.querySelector(".cm-content")'
      expect_truthy: true
  - wait: 1
  - eval_readonly:
      expression: '/^alpha[\u3400-\u9fff]+\nsecond$/.test(document.querySelector(".cm-content").taomniDocumentSnapshot ?? "") && document.activeElement === document.querySelector(".cm-content")'
      expect_truthy: true

  # After compositionend/cancel, the normal workspace shortcut is available
  # again and one undo removes the one confirmed IME transaction.
  - native_windows_ime_keys:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      label: post-composition-undo
      keys: [Control+z]
  - eval_readonly:
      expression: 'document.querySelector(".cm-content").taomniDocumentSnapshot === "alpha\nsecond" && document.activeElement === document.querySelector(".cm-content")'
      expect_truthy: true

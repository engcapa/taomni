id: TC-MFA-106
title: Scan screen hides Taomni, captures the desktop and imports the visible QR code
description: 'V-24 (AC-06). Packaged app on Linux (Xvfb + Openbox) and Windows. A
  separate topmost window shows the RFC 4226 QR (`native_show_image_window`). Scan
  screen hides Taomni, captures every display through the Rust capture path, restores
  the window and opens the review step; QA Bank imports with 755 224. With the QR
  window closed a second scan reports that no QR code is on screen and the dialog
  stays usable. macOS needs Screen Recording permission and is covered manually (V-26).

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F-MFA-2
tags:
- mfa
- screen-capture
- native-boundary
- p1
modes:
- native
native_platforms:
- Linux
- Windows
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-native-106
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-native-106
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="mfa-empty"]'
    timeout_sec: 30
- native_show_image_window:
    path: qa-ui-auto-tests/synthetic-fixtures/mfa/hotp-qa-bank.png
- click: '[data-testid="mfa-empty-add-screen"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="screen"]'
- click: '[data-testid="mfa-screen-scan"]'
- wait_for:
    selector: '[data-testid="mfa-import-preview"]'
    timeout_sec: 60
- assert_items:
    selector: '[data-testid="mfa-import-item"]'
    attribute: data-issuer
    equals:
    - QA Bank
- click: '[data-testid="mfa-import-confirm"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 755 224
- native_show_image_window:
    action: close
- click: '[data-testid="mfa-add"]'
- click: '[data-testid="mfa-add-mode-screen"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="screen"]'
- click: '[data-testid="mfa-screen-scan"]'
- assert_text:
    selector: '[data-testid="mfa-screen-status"]'
    contains: No QR code found on screen
    timeout_sec: 60
- assert_enabled: '[data-testid="mfa-screen-scan"]'
- press: Escape
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- screenshot: mfa-106-screen-scan.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Scan screen captures a QR shown in another window and imports it
      (AC-06).
    actions:
    - 11
    - 12
    - 14
    - 17
    checkpoints:
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"mfa-add-dialog\"][data-mode=\"screen\"]"}'
    - step: 15
      expectation: '{"wait_for": {"selector": "[data-testid=\"mfa-import-preview\"]",
        "timeout_sec": 60}}'
    - step: 16
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-import-item\"]",
        "attribute": "data-issuer", "equals": ["QA Bank"]}}'
    - step: 18
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    - step: 19
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        Bank\"] *)", "equals": "755 224"}}'
    results:
    - 19
  - id: R2
    requirement: Without a QR on screen the scan reports it and Taomni is usable again
      afterwards (AC-06).
    actions:
    - 20
    - 21
    - 22
    - 24
    - 27
    checkpoints:
    - step: 23
      expectation: '{"wait_for": "[data-testid=\"mfa-add-dialog\"][data-mode=\"screen\"]"}'
    - step: 25
      expectation: '{"assert_text": {"selector": "[data-testid=\"mfa-screen-status\"]",
        "contains": "No QR code found on screen", "timeout_sec": 60}}'
    - step: 26
      expectation: '{"assert_enabled": "[data-testid=\"mfa-screen-scan\"]"}'
    - step: 28
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    results:
    - 28
  visual:
  - check: The window visibly hides during the capture and returns in front.
    method: manual
    reason: Window visibility during capture is not observable through WebDriver.
  native:
  - check: macOS Screen Recording permission (V-26) and Linux Wayland portals (V-27)
      are manual.
    method: manual
    reason: Hosted runners cannot grant those permissions.

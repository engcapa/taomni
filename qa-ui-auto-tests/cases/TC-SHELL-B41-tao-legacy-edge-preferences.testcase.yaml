  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F-TAO-1
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150

id: TC-UIC-015-module-install-error
title: Offline installation explains missing fields and keeps the validation readable after a theme change
covers: [F-Modules-1]
modes: [browser, native]
fixtures: [reset_db]
tags: [ui-contract, settings, modules]
ui_standard: [UI-FND-03a, UI-INP-02]
steps:
- open: ${cfg.app.base_url}
- click: 'button[aria-label="Cycle application theme"]'
- assert_attribute: {selector: html, name: data-app-theme, equals: light}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- wait_for: {selector: '[data-testid="module-marketplace-loading"]', state: detached}
- click: '[data-testid="module-offline-submit"]'
- assert_text: {selector: '[data-testid="module-offline-error"][role="alert"]', contains: Choose a module package}
- assert_attribute: {selector: '[data-testid="module-offline-archive"]', name: aria-invalid, equals: 'true'}
- assert_attribute: {selector: '[data-testid="module-offline-signature"]', name: aria-describedby, equals: module-offline-validation}
- assert_solid_text_contrast: {selector: '[data-testid="module-offline-error"]', minimum: 4.5}
- click: 'button[aria-label="Cycle application theme"]'
- assert_attribute: {selector: html, name: data-app-theme, equals: dark}
- assert_solid_text_contrast: {selector: '[data-testid="module-offline-error"]', minimum: 4.5}
- fill: {selector: '[data-testid="module-offline-archive"]', value: draft.taomni-plugin}
- assert_not_visible: '[data-testid="module-offline-error"]'
- click: '[data-testid="module-offline-submit"]'
- assert_attribute: {selector: '[data-testid="module-offline-signature"]', name: aria-invalid, equals: 'true'}
- assert_count: {selector: '[data-testid="module-offline-archive"][aria-invalid="true"]', equal: 0}
- assert_computed_style: {selector: '[data-testid="module-offline-signature"]', property: border-top-color, equals: 'rgb(248, 113, 113)'}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: themed-error
    ui_standard: [UI-FND-03a]
    requirement: A readable error explains the required input in the current theme and survives an appearance change.
    actions: [2, 7, 12]
    checkpoints:
    - {step: 8, expectation: The alert explains how to correct the empty form.}
    - {step: 11, expectation: Light mode error text meets the contrast threshold.}
    - {step: 14, expectation: The dark mode foreground meets contrast on the new error surface.}
    results: [8, 11, 14]
  - id: missing-fields
    ui_standard: [UI-INP-02]
    requirement: Validation identifies individual missing fields, clears on edit and preserves the package path on retry.
    actions: [7, 15, 17]
    checkpoints:
    - {step: 9, expectation: An empty archive path is marked invalid.}
    - {step: 10, expectation: The signature references the visible error.}
    - {step: 16, expectation: Editing clears the earlier error.}
    - {step: 18, expectation: Submitting again identifies the missing signature.}
    - {step: 19, expectation: The filled archive field is valid on retry.}
    - {step: 20, expectation: The invalid signature uses the dark theme error border.}
    results: [9, 10, 16, 18, 19, 20]
  visual:
  - {check: Actual error contrast, method: automated, reason: Measures foreground against the opaque alert background in both themes.}
  native:
  - {check: Packaged Settings form, method: automated, reason: Exercises validation before installation and keeps the displayed draft across theme changes.}

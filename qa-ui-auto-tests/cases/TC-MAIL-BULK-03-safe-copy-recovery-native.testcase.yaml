id: TC-MAIL-BULK-03
title: Native COPY recovery avoids duplicates and unrelated expunges
description: Exercise COPY success followed by STORE failure, loss of a successful COPY reply, and a server without
  UIDPLUS. Check exact server counts and command history, retry/repeat actions, and preserve an unrelated deleted
  sentinel. All services and storage are disposable.
covers:
- F-MAIL-3
- F-MAIL-12
tags:
- mail
- p1
modes:
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
    unread: true
- mail_server_expunge_newest:
    folder: INBOX
    count: 1000000
- mail_server_deliver:
    count: 3
    prefix: Store recovery
- mail_server_mutation_fault:
    supports_move: false
    max_count: 3
    reject_store_once: true
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches:
    timeout_sec: 30
- click: '[aria-label="Select all visible messages"]'
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-mutation-progress"]'
    contains: Processed 0/3 messages
- mail_server_assert_folder_count:
    folder: Trash
    equals: 3
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: INBOX
    equals: 3
    timeout_sec: 30
- screenshot: mail-bulk-store-failed.png
- click: '[data-testid="mail-mutation-retry"]'
- mail_server_assert_folder_count:
    folder: INBOX
    equals: 0
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Trash
    equals: 3
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 0 selected
- mail_server_assert_mutations:
    no_move: true
    copied: 3
- mail_server_deliver:
    count: 3
    prefix: Ambiguous copy
- mail_server_mutation_fault:
    drop_copy_response_once: true
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches:
    timeout_sec: 30
- click: '[aria-label="Select all visible messages"]'
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 3 selected
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: server result needs verification
- mail_server_assert_folder_count:
    folder: Trash
    equals: 6
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: INBOX
    equals: 3
    timeout_sec: 30
- assert_count:
    selector: '[data-testid="mail-mutation-retry"]'
    equal: 0
- screenshot: mail-bulk-uncertain-copy.png
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: server result needs verification
- mail_server_assert_folder_count:
    folder: Trash
    equals: 6
    timeout_sec: 30
- mail_server_assert_mutations:
    no_move: true
    copied: 6
- mail_server_deliver:
    folder: Archive
    count: 3
    prefix: Safe cleanup
- mail_server_deliver:
    folder: Archive
    count: 1
    prefix: Other deleted sentinel
- mail_server_set_flags_newest:
    folder: Archive
    count: 1
    flags:
    - \Deleted
- mail_server_mutation_fault:
    uidplus: false
- click: '[data-testid="mail-folder-row"][data-folder-name="Archive"]'
- mail_server_assert_list_matches:
    folder: Archive
    timeout_sec: 30
- click:
    selector: '[data-testid="mail-message-row"]:nth-child(2)'
    modifiers:
    - Mod
- click:
    selector: '[data-testid="mail-message-row"]:nth-child(4)'
    modifiers:
    - Shift
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 3 selected
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: UIDPLUS unavailable
- mail_server_assert_folder_count:
    folder: Archive
    equals: 4
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Trash
    equals: 9
    timeout_sec: 30
- screenshot: mail-bulk-no-uidplus.png
- mail_server_mutation_fault:
    uidplus: true
- click: '[data-testid="mail-mutation-retry"]'
- mail_server_assert_folder_count:
    folder: Archive
    equals: 1
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Trash
    equals: 9
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 0 selected
- mail_server_assert_mutations:
    no_move: true
    copied: 9
- screenshot: mail-bulk-sentinel-preserved.png
verification:
  review: reviewed
  requirements:
  - id: R1

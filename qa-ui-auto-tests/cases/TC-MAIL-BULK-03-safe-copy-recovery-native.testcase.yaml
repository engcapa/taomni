    - step: 42
      expectation: '{''assert_text'': {''selector'': ''[data-testid="mail-client-tab"]'', ''contains'': ''server
        result needs verification''}}'
    - step: 43
      expectation: '{''mail_server_assert_folder_count'': {''folder'': ''Trash'', ''equals'': 6, ''timeout_sec'':

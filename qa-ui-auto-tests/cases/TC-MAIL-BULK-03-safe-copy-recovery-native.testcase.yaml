    actions:
    - 35
    - 36
    - 37
    - 39
    - 40
    - 47
    checkpoints:
    - step: 38
      expectation: '{''mail_server_assert_list_matches'': {''timeout_sec'': 30}}'
    - step: 41
      expectation: '{''assert_text'': {''selector'': ''[data-testid="mail-selection-count"]'', ''contains'': ''3

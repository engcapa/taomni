  visual:
  - check: Progress, remaining selection, error, Retry and Details are legible without moving the toolbar.
    method: manual
    reason: Inspect the retained screenshots.
  native:
  - check: Native exercises real IPC, SQLite receipts and loopback IMAP; browser only proves renderer receipt handling.
    method: automated
    reason: Server folder counts are independent of UI success messages.

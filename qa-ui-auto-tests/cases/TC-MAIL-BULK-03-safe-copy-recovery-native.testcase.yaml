id: TC-MAIL-BULK-03
title: Signed Mail COPY recovery avoids duplicates and unrelated expunges
description: Install signed Mail and exercise COPY success followed by STORE failure, loss of a successful COPY reply, and a server without
  UIDPLUS. Check exact server counts and command history, retry/repeat actions, and preserve an unrelated deleted
  sentinel. All services and storage are disposable.
covers:
- F-Modules-1
- F-MAIL-3
- F-MAIL-12
tags:
- mail
- modules
- native-boundary
- p1
modes:
- native
native_platforms: [Linux, Windows, macOS]
fixtures:
- reset_db
- mail_server
- module_signed_mail_archive
timeout_sec: 225
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.mail_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.mail_signed_signature}'}
- press: {selector: '[data-testid="module-offline-submit"]', key: Enter}
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- press: {selector: '[data-testid="module-action-enable-mail"]:enabled', key: Enter}
- wait_for: '[data-testid="module-action-disable-mail"]'
- assert_signed_mail_host: idle
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="plugin-tab-panel"][data-plugin-slug="mail"] [data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
    unread: true
- mail_server_expunge_newest:
    folder: INBOX
    count: 1000000
- mail_server_deliver:
    count: 3
    prefix: Store recovery
- mail_server_mutation_fault:
    supports_move: false
    max_count: 3
    reject_store_once: true
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches:
    timeout_sec: 30
- click: '[aria-label="Select all visible messages"]'
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-mutation-progress"]'
    contains: Processed 0/3 messages
- mail_server_assert_folder_count:
    folder: Trash
    equals: 3
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: INBOX
    equals: 3
    timeout_sec: 30
- screenshot: mail-bulk-store-failed.png
- click: '[data-testid="mail-mutation-retry"]'
- mail_server_assert_folder_count:
    folder: INBOX
    equals: 0
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Trash
    equals: 3
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 0 selected
- mail_server_assert_mutations:
    no_move: true
    copied: 3
- mail_server_deliver:
    count: 3
    prefix: Ambiguous copy
- mail_server_mutation_fault:
    drop_copy_response_once: true
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches:
    timeout_sec: 30
- click: '[aria-label="Select all visible messages"]'
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 3 selected
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: server result needs verification
- mail_server_assert_folder_count:
    folder: Trash
    equals: 6
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: INBOX
    equals: 3
    timeout_sec: 30
- assert_count:
    selector: '[data-testid="mail-mutation-retry"]'
    equal: 0
- screenshot: mail-bulk-uncertain-copy.png
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: server result needs verification
- mail_server_assert_folder_count:
    folder: Trash
    equals: 6
    timeout_sec: 30
- mail_server_assert_mutations:
    no_move: true
    copied: 6
- mail_server_deliver:
    folder: Archive
    count: 3
    prefix: Safe cleanup
- mail_server_deliver:
    folder: Archive
    count: 1
    prefix: Other deleted sentinel
- mail_server_set_flags_newest:
    folder: Archive
    count: 1
    flags:
    - \Deleted
- mail_server_mutation_fault:
    uidplus: false
- click: '[data-testid="mail-folder-row"][data-folder-name="Archive"]'
- mail_server_assert_list_matches:
    folder: Archive
    timeout_sec: 30
- click:
    selector: '[data-testid="mail-message-row"]:nth-child(2)'
    modifiers:
    - Mod
- click:
    selector: '[data-testid="mail-message-row"]:nth-child(4)'
    modifiers:
    - Shift
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 3 selected
- click: '[data-testid="mail-delete-selected"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: UIDPLUS unavailable
- mail_server_assert_folder_count:
    folder: Archive
    equals: 4
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Trash
    equals: 9
    timeout_sec: 30
- screenshot: mail-bulk-no-uidplus.png
- mail_server_mutation_fault:
    uidplus: true
- click: '[data-testid="mail-mutation-retry"]'
- mail_server_assert_folder_count:
    folder: Archive
    equals: 1
    has_subject: Other deleted sentinel 0001
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Trash
    equals: 9
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="mail-selection-count"]'
    contains: 0 selected
- mail_server_assert_mutations:
    no_move: true
    copied: 9
- assert_signed_mail_host: imap-mutations
- assert_no_runtime_errors: null
- screenshot: mail-bulk-sentinel-preserved.png
verification:
  review: reviewed
  requirements:
  - id: signed-install
    requirement: Install the verified Mail package and open the module's mail pane.
    actions: [4, 5, 6, 7, 8, 10, 13, 15, 16]
    checkpoints:
    - {step: 9, expectation: The desktop accepts the signed Mail package.}
    - {step: 12, expectation: The installed host and frontend match the package and the writer lease is idle.}
    - {step: 17, expectation: Quick Connect opens the signed Mail pane.}
    results: [9, 12, 17]
  - id: R1
    requirement: A confirmed COPY resumes at STORE and is never copied twice.
    actions:
    - 20
    - 21
    - 22
    - 24
    - 25
    - 30
    checkpoints:
    - step: 23
      expectation: '{''mail_server_assert_list_matches'': {''timeout_sec'': 30}}'
    - step: 26
      expectation: '{''assert_text'': {''selector'': ''[data-testid="mail-mutation-progress"]'', ''contains'': ''Processed
        0/3 messages''}}'
    - step: 27

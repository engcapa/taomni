        30}}'
    - step: 18
      expectation: '{''mail_server_assert_folder_count'': {''folder'': ''INBOX'', ''equals'': 3, ''timeout_sec'':
        30}}'
    - step: 21
      expectation: '{''mail_server_assert_folder_count'': {''folder'': ''INBOX'', ''equals'': 0, ''timeout_sec'':
        30}}'
    - step: 22
      expectation: '{''mail_server_assert_folder_count'': {''folder'': ''Trash'', ''equals'': 3, ''timeout_sec'':
        30}}'
    - step: 23
      expectation: '{''assert_text'': {''selector'': ''[data-testid="mail-selection-count"]'', ''contains'': ''0
        selected''}}'
    - step: 24
      expectation: '{''mail_server_assert_mutations'': {''no_move'': True, ''copied'': 3}}'
    results:

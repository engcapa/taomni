  visual:
  - check: The final screenshot shows a painted remote desktop without an error overlay.
    method: manual
    reason: Clipboard contents and DOM dimensions do not establish visual correctness.
  native:
  - check: Independent OS clipboard oracle verifies received text, and fixture events verify transmitted
      text.
    method: automated
    reason: Native host_clipboard uses an external platform-specific process; it does not read the product
      clipboard cache.

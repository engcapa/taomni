id: TC-158
title: VNC accepts TigerVNC sync-flushed clipboard and preserves bidirectional copy (native)
description: Receive a finished zlib stream, then two independent TigerVNC-style Z_SYNC_FLUSH messages
  with Unicode text. Verify exact clipboard content, send a new local clipboard back, and then verify
  pointer/key input and repaint. Independent host clipboard reads prove the OS boundary.
covers:
- F9.6
tags:
- vnc
- p1
- regression
modes:
- native
fixtures:
- reset_db
- vnc_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${fixture.vnc_host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.vnc_port}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-vnc-sync-clipboard-native
- click: '[data-testid="session-save"]'
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-sync-clipboard-native"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-sync-clipboard-native"]'
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 20
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-auth-password"]'
    timeout_sec: 20
- fill:
    selector: '[data-testid="vnc-auth-password"]'
    value: ${env.QA_VNC_PASSWORD}
- click: '[data-testid="vnc-auth-ok"]'
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]'
    timeout_sec: 20
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "auth", "ok": true, "security": "VNCAuth"'
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "ext_clipboard", "action": "caps"'
- host_write_file:
    path: ${fixture.vnc_control}
    text: 'extclip finished-stream-copy

      '
- host_clipboard:
    action: assert
    kind: text
    equals: finished-stream-copy
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "clipboard_sent", "flush": "finish", "text": "finished-stream-copy"'
- host_write_file:
    path: ${fixture.vnc_control}
    text: 'extclip-sync LXQt 复制一 中文 123

      '
- host_clipboard:
    action: assert
    kind: text
    equals: LXQt 复制一 中文 123
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "clipboard_sent", "flush": "sync", "text": "LXQt 复制一 中文 123"'
- host_write_file:
    path: ${fixture.vnc_control}
    text: 'extclip-sync LXQt 复制二 第二次 fresh stream

      '
- host_clipboard:
    action: assert
    kind: text
    equals: LXQt 复制二 第二次 fresh stream
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "clipboard_sent", "flush": "sync", "text": "LXQt 复制二 第二次 fresh stream"'
- host_clipboard:
    action: set
    kind: text
    text: client-to-server-copy-after-sync
- host_clipboard:
    action: assert
    kind: text
    equals: client-to-server-copy-after-sync
- click: '[data-testid="vnc-canvas"]'
- press:
    selector: '[data-testid="vnc-canvas"]'
    key: Control+v
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "ext_clipboard", "action": "provide", "formats": 1, "text": "client-to-server-copy-after-sync"'
- press:
    selector: '[data-testid="vnc-canvas"]'
    key: a
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"keysym": 97, "keysym_hex": "0x61"'
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "pointer", "mask": 1'
- host_write_file:
    path: ${fixture.vnc_control}
    text: 'resize 1024 768

      '
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1024"][height="768"]'
    timeout_sec: 15
- eval_readonly:
    expression: document.querySelector('.vnc-container canvas').getContext('2d').getImageData(16, 16,
      1, 1).data[3] === 255
    timeout_sec: 10
- assert_not_visible: '[data-testid="vnc-reconnect"]'
- wait: 1.5
- screenshot: 158-vnc-clipboard-still-connected.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Finished and independent sync-flushed remote copies reach the clipboard exactly; reverse
      copy, input and repaint still work without disconnecting.
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 7
    - 8
    - 10
    - 11
    - 12
    - 14
    - 16
    - 18
    - 19
    - 23
    - 26
    - 29
    - 32
    - 34
    - 35
    - 37
    - 40
    checkpoints:
    - step: 24
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "equals": "finished-stream-copy"}}'
    - step: 27
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "equals": "LXQt 复制一 中文 123"}}'
    - step: 30
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "equals": "LXQt 复制二 第二次 fresh
        stream"}}'
    - step: 33
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "equals": "client-to-server-copy-after-sync"}}'
    - step: 36
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"type\":
        \"ext_clipboard\", \"action\": \"provide\", \"formats\": 1, \"text\": \"client-to-server-copy-after-sync\""}}'
    - step: 38
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"keysym\":
        97, \"keysym_hex\": \"0x61\""}}'
    - step: 39
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"type\":
        \"pointer\", \"mask\": 1"}}'
    - step: 41
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-canvas\"][width=\"1024\"][height=\"768\"]",
        "timeout_sec": 15}}'
    - step: 42
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''.vnc-container canvas'').getContext(''2d'').getImageData(16,
        16, 1, 1).data[3] === 255", "timeout_sec": 10}}'
    - step: 43
      expectation: '{"assert_not_visible": "[data-testid=\"vnc-reconnect\"]"}'
    results:
    - 24
    - 27
    - 30
    - 36
    - 38

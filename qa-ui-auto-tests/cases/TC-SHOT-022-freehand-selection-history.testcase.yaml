id: TC-SHOT-022
title: Freehand selection closes, transforms and preserves annotation history without confusing pen tools
description: Real browser mouse paths exercise concave hit testing, resize/move, degenerate rejection and mode transitions; native capture and OS windows are checked separately.
covers: [F27.1]
tags: [screenshot, freehand, recrop, p1]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- assert_attribute:
    selector: '[data-testid="screenshot-overlay"]'
    name: data-selection-mode
    equals: rectangle
- click: '[data-testid="screenshot-selection-freehand"]'
- assert_attribute:
    selector: '[data-testid="screenshot-selection-freehand"]'
    name: aria-pressed
    equals: 'true'
# A large diagonal has a bounding box but no enclosed area.
- drag_path:
    selector: '[data-testid="screenshot-select-layer"]'
    points: [{x: 100, y: 100}, {x: 500, y: 400}]
- assert_not_visible: '[data-testid="screenshot-toolbar"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
# Do not return to the first vertex: mouse release must close the contour.
- drag_path:
    selector: '[data-testid="screenshot-select-layer"]'
    points: [{x: 100, y: 100}, {x: 500, y: 100}, {x: 500, y: 220}, {x: 220, y: 220}, {x: 220, y: 400}, {x: 100, y: 400}]
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_attribute:
    selector: '[data-testid="screenshot-freehand-contour"]'
    name: d
    matches: '^M 100 100 L .* L 100 400 Z$'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: '160 × 120'
- assert_disabled: '[data-testid="screenshot-scroll-capture"]'
- assert_disabled: '[data-testid="screenshot-record"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 130, y: 140}
    to_position: {x: 190, y: 190}
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- click: '[data-testid="screenshot-recrop"]'
- drag_to:
    from: '[data-testid="screenshot-selection-move"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position: {x: 50, y: 50}
    to_position: {x: 175, y: 175}
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_attribute:
    selector: '[data-testid="screenshot-selection"]'
    name: style
    matches: '.*left: 125px;.*top: 125px;.*width: 400px;.*height: 300px;.*'
- drag_to:
    from: '[data-testid="screenshot-handle-se"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position: {x: 4, y: 4}
    to_position: {x: 725, y: 575}
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_attribute:
    selector: '[data-testid="screenshot-freehand-contour"]'
    name: d
    matches: '^M 125 125 L .*L 305 305 L .* L 125 575 Z$'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: '240 × 180'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- click: '[data-testid="screenshot-undo"]'
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="0"]'
- click: '[data-testid="screenshot-redo"]'
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- click: '[data-testid="screenshot-selection-rectangle"]'
- assert_not_visible: '[data-testid="screenshot-freehand-contour"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: '240 × 180'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- assert_enabled: '[data-testid="screenshot-scroll-capture"]'
- assert_enabled: '[data-testid="screenshot-record"]'
- click: '[data-testid="screenshot-selection-freehand"]'
- assert_not_visible: '[data-testid="screenshot-toolbar"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '0'
- drag_path:
    selector: '[data-testid="screenshot-select-layer"]'
    points: [{x: 100, y: 100}, {x: 500, y: 100}, {x: 100, y: 400}]
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-tool-pen"]'
- drag_path:
    selector: '[data-testid="screenshot-annotation-layer"]'
    points: [{x: 140, y: 140}, {x: 160, y: 155}, {x: 180, y: 145}]
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- assert_attribute:
    selector: '[data-testid="screenshot-overlay"]'
    name: data-selection-mode
    equals: freehand
- click: '[data-testid="screenshot-recrop"]'
# Start inside the bounding box but outside the triangle. Pointer clipping must
# reach reselect rather than dragging the old bounding rectangle.
- drag_path:
    selector: '[data-testid="screenshot-select-layer"]'
    points: [{x: 450, y: 350}, {x: 450, y: 450}, {x: 350, y: 450}]
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_attribute:
    selector: '[data-testid="screenshot-selection"]'
    name: style
    matches: '.*left: 350px;.*top: 350px;.*width: 100px;.*height: 100px;.*'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '0'
- press: Escape
- assert_not_visible: '[data-testid="screenshot-toolbar"]'
- assert_attribute:
    selector: '[data-testid="screenshot-overlay"]'
    name: data-phase
    equals: select
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-overlay"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Rectangle is the default, freehand is an explicit selection mode, straight-line gestures are rejected, and release closes a concave contour with rectangular-only operations disabled.
    actions: [1, 2, 5, 7, 10]
    checkpoints:
    - {step: 4, expectation: Rectangle remains the default selection mode.}
    - {step: 6, expectation: Freehand button is selected.}
    - {step: 8, expectation: A diagonal cannot open annotation tools.}
    - {step: 9, expectation: The invalid diagonal leaves no selection.}
    - {step: 12, expectation: Concave contour closes on release without a final first-vertex event.}
    - {step: 13, expectation: Bounds map to 160x120 original pixels.}
    - {step: 14, expectation: Scrolling requires a rectangle.}
    - {step: 15, expectation: Recording requires a rectangle.}
    results: [4, 6, 8, 9, 12, 13, 14, 15]
  - id: R2
    requirement: Recrop move and resize transform the actual contour and preserve annotations, undo/redo and bounding-box dimensions when switching back to rectangle.
    actions: [16, 17, 19, 20, 23, 28, 30, 32]
    checkpoints:
    - {step: 22, expectation: Move shifts the bounding box by 25 CSS pixels on both axes.}
    - {step: 25, expectation: Resize scales the notch and entire closed contour with the new box.}
    - {step: 26, expectation: Resized crop is 240x180 original pixels.}
    - {step: 27, expectation: Annotation survives move and resize.}
    - {step: 29, expectation: Undo removes the retained annotation.}
    - {step: 31, expectation: Redo restores it.}
    - {step: 33, expectation: Rectangle transition removes the contour mask.}
    - {step: 34, expectation: Rectangle transition retains the resized crop.}
    - {step: 35, expectation: Rectangle transition retains annotations.}
    - {step: 36, expectation: Rectangle re-enables scrolling.}
    - {step: 37, expectation: Rectangle re-enables recording.}
    results: [22, 25, 26, 27, 29, 31, 33, 34, 35, 36, 37]
  - id: R3
    requirement: Returning to freehand resets old shapes; pen remains an annotation tool; pressing outside the contour but inside its box reselects and clears history; Escape resets then closes normally.
    actions: [38, 41, 43, 44, 47, 48, 52, 55]
    checkpoints:
    - {step: 39, expectation: Freehand transition returns to selection.}
    - {step: 40, expectation: Old shapes are cleared on a new freehand selection.}
    - {step: 46, expectation: Pen drawing does not change selection mode.}
    - {step: 50, expectation: Outside-contour pointer begins a new triangle instead of moving the old box.}
    - {step: 51, expectation: Reselect clears the old pen annotation.}
    - {step: 53, expectation: Escape leaves annotation mode.}
    - {step: 54, expectation: Escape returns to region selection.}
    - {step: 57, expectation: A second Escape closes the overlay.}
    results: [39, 40, 46, 50, 51, 53, 54, 57]
  visual:
  - {check: Closed contour and transformed notch geometry, method: automated, reason: Real mouse input and SVG/box/dimension checks establish renderer geometry and outside-contour hit testing; no OS capture claim.}
  native:
  - {check: Actual OS pointer drawing and native export, method: external, reason: TC-SHOT-N11 verifies real system input and RGBA output on the three desktop WebViews.}

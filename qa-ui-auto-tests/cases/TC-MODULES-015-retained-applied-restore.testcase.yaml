verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The exact manual backup contains the module in its selected lifecycle state plus the original encrypted HOTP and
      Vault snapshots.
    actions:
    - 17
    - 31
    - 41
    checkpoints:
    - step: 18
      expectation: The real initial HOTP is 755224.
    - step: 44
      expectation: The exact v2 job, all hashes, standalone module rows, original HOTP counter and paired Vault SQLite pass independent
        inspection; writer ownership matches the lifecycle state.
    results:
    - 18
    - 44
  - id: R2
    requirement: Real module data, HOTP and master password change after backup; only the current master password can stage and
      staging does not apply early.
    actions:
    - 54
    - 59
    - 70
    - 80
    checkpoints:
    - step: 60
      expectation: HOTP advances to 287082 through real business logic.
    - step: 71
      expectation: The live Vault is rekeyed to a different master password.
    - step: 79
      expectation: The original password is rejected by production staging with VAULT_BAD_PASSWORD and no pending files or generation/data
        change.
    - step: 81
      expectation: Independent readback proves the correct-password intent and all staged hashes match the exact original archive,
        while live business data and generation are still unchanged.
    results:
    - 60
    - 71
    - 79
    - 81
  - id: R3
    requirement: Normal restart applies the original data with a new generation while preserving activation and trust; real decryption
      and another restart prove recovery.
    actions:
    - 83
    - 93
    - 103
    checkpoints:
    - step: 85
      expectation: The real signed module has the same enabled, disabled or uninstalled state.
    - step: 86
      expectation: Apply removed pending state, restored only original rows, preserved the executable pointer and advanced generation.
    - step: 90
      expectation: The password introduced after backup no longer unlocks the restored Vault.
    - step: 91
      expectation: No code is visible after that rejected unlock.
    - step: 99
      expectation: Exactly the original account is restored.
    - step: 100
      expectation: The original password decrypts the restored real stores and yields 755224.
    - step: 101
      expectation: No runtime error occurs during stage/apply/decryption.
    - step: 106
      expectation: A second normal cold start keeps restored data, lifecycle and the same new generation.
    - step: 114
      expectation: The original password still decrypts the original HOTP after the second cold start.
    - step: 115
      expectation: The additional restart produces no runtime errors.
    results:
    - 85
    - 86
    - 90
    - 91
    - 99
    - 100
    - 101
    - 106
    - 114
    - 115
  native:
  - check: Production stage, normal shutdown/apply, SQLite replacement, activation, profile generation and real Vault/MFA decryption.
    method: automated
    reason: Browser stubs cannot establish native filesystem, cryptography or process restart. Restore confirmation automatic relaunch
      remains a separate UI gap.
  visual:
  - check: The restored original account and code remain readable.
    method: manual
    reason: Review module-retained-restore-decrypted.png on each native platform.

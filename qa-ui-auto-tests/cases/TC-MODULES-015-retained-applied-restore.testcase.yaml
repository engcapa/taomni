id: TC-MODULES-015
title: A retained signed module and paired Vault/MFA data restore together after a normal cold restart
description: Create the RFC HOTP account and install the current-source official hello through the UI. Back up real host data with
  the module uninstalled; independently verify the exact manual v2 archive and paired SQLite stores. Then change real host data,
  increment HOTP, and rekey Vault through Settings. Reject the old current-profile password, stage the original archive through
  the fixed production backup_stage_restore IPC, and normally close/restart the owned app. Verify original data, unchanged activation/code
  pointer, a new generation, the original master password and 755224; an additional normal restart keeps the new generation and
  decrypted account. Staging intentionally bypasses only the dialog automatic relaunch, so this is backend stage/apply evidence
  and does not claim native automatic-relaunch UI coverage or an independently hosted MFA plugin.
covers:
- F-Modules-1
- F-BACKUP-1
- F-MFA-3
- F-MFA-1
- F12.1
tags:
- p0
- modules
- backup
- vault
- native-boundary
- persistence
modes:

id: TC-MODULES-071
title: SocksCap opens and saves a legacy proxy configuration
description: Load a configuration written before profile metadata and QUIC settings. Change its proxy protocol, then verify the original endpoint and the updated protocol after reopening.
covers: [F-Sockscap-1]
tags: [modules, sockscap, p1]
modes: [browser, native]
fixtures: [reset_db, sockscap_legacy_config]
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- seed_storage: {key: taomni.sockscap.config.v1, value: '${fixture.sockscap_legacy_config}'}
- seed_storage: {key: taomni.sockscap.macosSetupGuide.v1, value: complete}
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-testid="sockscap-panel"]'
- show_sockscap_upstream: null
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.1"]'
- assert_attribute: {selector: '[data-testid="sockscap-upstream-port"]', name: value, equals: '19391'}
- eval_readonly:
    expression: "document.getElementById('sockscap-section-gfwlist-content')?.querySelector('input')?.checked === true"
    expect_truthy: true
- select_option: {selector: '[data-testid="sockscap-upstream-kind"]', value: http}
- eval_readonly:
    expression: "document.getElementById('sockscap-section-upstream-content')?.querySelector('select')?.value === 'http'"
    expect_truthy: true
    timeout_sec: 10
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-testid="sockscap-panel"]'
- show_sockscap_upstream: null
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.1"]'
- assert_attribute: {selector: '[data-testid="sockscap-upstream-port"]', name: value, equals: '19391'}
- eval_readonly:
    expression: "document.getElementById('sockscap-section-upstream-content')?.querySelector('select')?.value === 'http'"
    expect_truthy: true
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: legacy-settings
    requirement: Opening old settings restores the endpoint and applies the current QUIC default. The selected protocol survives reload with the original endpoint.
    actions: [4, 5, 6, 8, 12, 14, 15, 16, 18]
    checkpoints:
    - {step: 7, expectation: The SocksCap panel loads the existing configuration.}
    - {step: 9, expectation: The settings form receives the original loopback host.}
    - {step: 10, expectation: The settings form receives the original listening port.}
    - {step: 11, expectation: The QUIC checkbox uses the current default.}
    - {step: 13, expectation: The panel shows the new proxy protocol after saving.}
    - {step: 19, expectation: Reload restores the original host.}
    - {step: 20, expectation: Reload restores the original port.}
    - {step: 21, expectation: Reload restores the selected protocol.}
    - {step: 22, expectation: Opening and editing the profile produces no runtime errors.}
    results: [7, 9, 10, 11, 13, 19, 20, 21, 22]
  visual:
  - check: The legacy settings can be opened from the native and browser Tools areas.
    method: automated
    reason: The same panel selector is observed in both modes.
  native:
  - check: The real desktop reads the old config file from the isolated profile.
    method: automated
    reason: The native fixture writes an actual legacy configuration before the app starts.

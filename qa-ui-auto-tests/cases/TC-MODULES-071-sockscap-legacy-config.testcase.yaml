id: TC-MODULES-071
title: SocksCap opens and saves a legacy proxy configuration
description: Load a configuration written before profile metadata and QUIC settings. Check the restored endpoint and default, then edit and reopen the profile.
covers: [F-Sockscap-1]
tags: [modules, sockscap, p1]
modes: [browser, native]
fixtures: [reset_db, sockscap_legacy_config]
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- seed_storage: {key: taomni.sockscap.config.v1, value: '${fixture.sockscap_legacy_config}'}
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-testid="sockscap-panel"]'
- show_sockscap_upstream: null
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.1"]'
- assert_attribute: {selector: '[data-testid="sockscap-upstream-port"]', name: value, equals: '19391'}
- eval_readonly:
    expression: "document.getElementById('sockscap-section-gfwlist-content')?.querySelector('input')?.checked === true"
    expect_truthy: true
- fill: {selector: '[data-testid="sockscap-upstream-host"]', value: '127.0.0.2'}
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.2"]'
- fill: {selector: '[data-testid="sockscap-upstream-port"]', value: '19392'}
- wait_for: '[data-testid="sockscap-upstream-port"][value="19392"]'
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-testid="sockscap-panel"]'
- show_sockscap_upstream: null
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.2"]'
- assert_attribute: {selector: '[data-testid="sockscap-upstream-port"]', name: value, equals: '19392'}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: legacy-settings
    requirement: Opening old settings retains the endpoint and obtains the current QUIC default. Editing either endpoint field survives reload.
    actions: [3, 4, 5, 7, 11, 13, 15, 16, 17, 19]
    checkpoints:
    - {step: 6, expectation: The SocksCap panel loads the existing configuration.}
    - {step: 8, expectation: The settings form receives the original loopback host.}
    - {step: 9, expectation: The settings form receives the original listening port.}
    - {step: 10, expectation: The QUIC checkbox uses the current default.}
    - {step: 12, expectation: The address edit has been applied by the panel.}
    - {step: 14, expectation: The port edit has been applied by the panel.}
    - {step: 20, expectation: Reload restores the edited address.}
    - {step: 21, expectation: Reload restores the edited port.}
    - {step: 22, expectation: Opening and editing the profile produces no runtime errors.}
    results: [6, 8, 9, 10, 12, 14, 20, 21, 22]
  visual:
  - check: The legacy settings can be opened from the native and browser Tools areas.
    method: automated
    reason: The same panel selector is observed in both modes.
  native:
  - check: The real desktop reads the old config file from the isolated profile.
    method: automated
    reason: The native fixture writes an actual legacy configuration before the app starts.

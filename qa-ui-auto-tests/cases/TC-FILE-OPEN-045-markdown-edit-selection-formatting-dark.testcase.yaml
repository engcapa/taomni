id: TC-FILE-OPEN-045
title: Dark Markdown edit selection across modes, formatting toolbar, focus mode and slash insert
description: >-
  Verifies readable dark-theme selection across Source, Split, and Live Edit modes (including
  focused/unfocused contrast, non-occluded active line, and local light/dark PreviewAppearance
  override in Live Edit), plus core design/prototype formatting controls (heading selector, bold,
  italic, quote), Focus mode dimming, Outline toggle, slash insert menu, and real save byte
  verification.
modes:
- browser
- native
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p1
- regression
- markdown
- file-open
fixtures:
- reset_db
- file_open_files
timeout_sec: 210
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-markdown-dark-edit-selection
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: theme
- wait_for: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-dark"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="live.md"]'
- wait_for: '[data-testid="markdown-editor"][data-mode="live"]'
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: dark
- click: '[data-testid="markdown-live-edit"]'
- assert_attribute:
    selector: '[data-testid="markdown-editor"]'
    name: data-editing
    equals: 'true'
- click: '[data-testid="viewer-editor"] .cm-content'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+Home
    macos_key: Meta+ArrowUp
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- eval_readonly:
    expression: >-
      /^rgba\(92,\s*143,\s*214,\s*0\.(3[89]|40?)/.test(getComputedStyle(document.querySelector('.fv-md-live-pane .cm-selectionBackground')).backgroundColor) &&
      getComputedStyle(document.querySelector('.fv-md-live-pane .fv-md-current-line')).backgroundColor === 'rgba(0, 0, 0, 0)'
    expect_truthy: true
    timeout_sec: 8
- screenshot: dark-live-edit-selection.png
- select_option:
    selector: '[data-testid="markdown-preview-appearance"]'
    value: light
- click: '[data-testid="viewer-editor"] .cm-content'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+Home
    macos_key: Meta+ArrowUp
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- eval_readonly:
    expression: >-
      /^rgba\(37,\s*99,\s*235,\s*0\.2[4-8]/.test(getComputedStyle(document.querySelector('.fv-md-live-pane .cm-selectionBackground')).backgroundColor)
    expect_truthy: true
    timeout_sec: 8
- screenshot: dark-app-light-live-edit-selection.png
- select_option:
    selector: '[data-testid="markdown-preview-appearance"]'
    value: auto
- click: '[data-testid="markdown-focus"]'
- assert_attribute:
    selector: '[data-testid="markdown-focus"]'
    name: aria-pressed
    equals: 'true'
- eval_readonly:
    expression: >-
      document.querySelector('.fv-markdown').classList.contains('fv-md-focus') &&
      parseFloat(getComputedStyle(document.querySelector('.fv-md-rendered-block')).opacity) < 0.5
    expect_truthy: true
- screenshot: dark-live-focus-mode.png
- click: '[data-testid="markdown-focus"]'
- assert_attribute:
    selector: '[data-testid="markdown-focus"]'
    name: aria-pressed
    equals: 'false'
- click: '[data-testid="markdown-outline-toggle"]'
- assert_not_visible: '[data-testid="markdown-outline"]'
- click: '[data-testid="markdown-outline-toggle"]'
- assert_visible: '[data-testid="markdown-outline"]'
- click: '[data-testid="viewer-editor"] .cm-content'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+End
    macos_key: Meta+ArrowDown
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Enter
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: /
- wait_for: '[data-testid="markdown-insert-menu"]'
- click: '[data-testid="markdown-insert-menu"] button:nth-of-type(2)'
- assert_not_visible: '[data-testid="markdown-insert-menu"]'
- wait_for: '[data-testid="markdown-table-widget"]'
- click: '[data-testid="markdown-mode-split"]'
- click: '[data-testid="viewer-editor"] .cm-content'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+Home
    macos_key: Meta+ArrowUp
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowDown
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowDown
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowDown
- eval_readonly:
    expression: >-
      /^rgba\(92,\s*143,\s*214,\s*0\.(3[89]|40?)/.test(getComputedStyle(document.querySelector('.fv-md-source-pane .cm-selectionBackground')).backgroundColor) &&
      getComputedStyle(document.querySelector('.fv-md-source-pane .cm-activeLine')).backgroundColor === 'rgba(0, 0, 0, 0)'
    expect_truthy: true
    timeout_sec: 8
- screenshot: dark-split-selection.png
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+Home
    macos_key: Meta+ArrowUp
- select_option:
    selector: '[data-testid="markdown-heading"]'
    value: '2'
- assert_text:
    selector: '[data-testid="markdown-preview"] h2'
    contains: File open Markdown
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+End
    macos_key: Meta+ArrowDown
- type:
    selector: '[data-testid="viewer-editor"] .cm-content'
    text: Formatted
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+Home
    macos_key: Meta+Shift+ArrowLeft
- click: '[data-testid="markdown-format-bold"]'
- eval_readonly:
    expression: document.querySelector('.fv-md-preview-pane p:last-of-type strong')?.textContent === 'Formatted'
    expect_truthy: true
    timeout_sec: 8
- click: '[data-testid="markdown-format-italic"]'
- eval_readonly:
    expression: document.querySelector('.fv-md-preview-pane p:last-of-type em')?.textContent === 'Formatted'
    expect_truthy: true
    timeout_sec: 8
- click: '[data-testid="markdown-format-quote"]'
- eval_readonly:
    expression: document.querySelector('.fv-md-preview-pane blockquote')?.textContent.includes('Formatted')
    expect_truthy: true
    timeout_sec: 8
- screenshot: dark-split-formatted.png
- click: '[data-testid="viewer-save"]'
- wait_for: '[data-testid="file-viewer"][data-dirty="false"]'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/live.md
    equals: |-
      ## File open Markdown

      **Rendered bold** and `inline code`.

      Math: $x^2$ and $$\frac{1}{2}$$.

      ## Details

      ![Original](assets/pixel.png)

      - [ ] First task

      ```mermaid
      flowchart LR
        Explorer --> OpenFile --> Viewer
      ```

      | Column 1 | Column 2 |
      | --- | --- |
      |  |  |

      > ***Formatted***
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: DARK-EDIT-SELECTION
    requirement: Live Edit and Split edit modes render readable dark-theme selection backgrounds without active-line occlusion, and Live Edit adapts to local light PreviewAppearance overrides.
    actions: [1, 2, 4, 5, 7, 8, 9, 10, 12, 13, 14, 15, 18, 20, 21, 22, 23, 24, 25, 26, 27, 30, 31, 32, 33, 34, 35, 36, 39, 58, 59, 60, 61, 62, 63]
    checkpoints:
    - step: 28
      expectation: Dark Live Edit selection uses readable dark blue fill and transparent current-line background.
    - step: 37
      expectation: Local light PreviewAppearance in Live Edit switches selection to light-canvas blue fill.
    - step: 64
      expectation: Dark Split source selection uses readable dark blue fill and suppresses active-line occlusion.
    results: [28, 37, 64]
  - id: MD-WORKFLOWS
    requirement: Focus mode dims inactive blocks, Outline toggles cleanly, Slash insert menu inserts a Markdown table, formatting controls update Markdown source and Split preview, and Save writes exact disk bytes.
    actions: [40, 44, 46, 48, 50, 51, 52, 53, 55, 66, 67, 69, 70, 71, 72, 74, 76, 79]
    checkpoints:
    - step: 42
      expectation: Focus mode applies fv-md-focus and dims inactive rendered blocks.
    - step: 47
      expectation: Outline hides when toggled off.
    - step: 49
      expectation: Outline reappears when toggled back on.
    - step: 54
      expectation: Typing slash on an empty line opens the insert menu.
    - step: 57
      expectation: Selecting Table from the insert menu renders a live table widget.
    - step: 68
      expectation: Heading selector changes H1 to H2 in Split preview.
    - step: 73
      expectation: Bold toolbar button wraps selected text and renders strong in preview.
    - step: 75
      expectation: Italic toolbar button wraps selected text and renders em in preview.
    - step: 77
      expectation: Quote toolbar button wraps the line in a blockquote in preview.
    - step: 81
      expectation: Saved file retains exact UTF-8 bytes including H2 heading, slash-inserted table, and formatted blockquote.
    results: [42, 47, 49, 54, 57, 68, 73, 75, 77, 81]
  native:
  - check: Packaged WebView selection rendering, slash insert, formatting toolbar and real host disk write
    method: automated
    reason: WebView2, WebKitGTK and WKWebView render CodeMirror selection layers independently and save directly to the host filesystem.
  visual:
  - check: Inspect dark-live-edit-selection.png, dark-app-light-live-edit-selection.png, dark-live-focus-mode.png, dark-split-selection.png and dark-split-formatted.png.
    method: manual
    reason: Confirms composited text legibility and selection clarity across dark and local light palettes.

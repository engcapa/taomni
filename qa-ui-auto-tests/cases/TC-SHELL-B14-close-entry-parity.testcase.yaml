id: TC-SHELL-B14
title: Dirty workspace cancellation through five visible close entries
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b14.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F25.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: &id002
    - repo-a WORKTREE
    - shared line
    - ''
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    key: Mod+End
- type: z
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: &id001
    - repo-a WORKTREE
    - shared line
    - z
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="shell-close-risk"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="shell-close-risk"]'
    name: data-risk-kind
    equals: dirty
- click: '[data-testid="shell-close-cancel"]'
- assert_not_visible: '[data-testid="shell-close-dialog"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: *id001
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- middle_click: '[data-testid="tab-item"][data-active="true"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="shell-close-risk"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="shell-close-risk"]'
    name: data-risk-kind
    equals: dirty
- click: '[data-testid="shell-close-cancel"]'
- assert_not_visible: '[data-testid="shell-close-dialog"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: *id001
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- right_click: '[data-testid="tab-item"][data-active="true"]'
- click: '[data-testid="shell-tab-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="shell-close-risk"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="shell-close-risk"]'
    name: data-risk-kind
    equals: dirty
- click: '[data-testid="shell-close-cancel"]'
- assert_not_visible: '[data-testid="shell-close-dialog"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: *id001
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="shell-close-risk"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="shell-close-risk"]'
    name: data-risk-kind
    equals: dirty
- click: '[data-testid="shell-close-cancel"]'
- assert_not_visible: '[data-testid="shell-close-dialog"]'
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Escape
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: *id001
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- click: '[data-testid="shell-overview-trigger"]'
- press:
    selector: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-open"]'
    key: Delete
- wait_for: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="shell-close-risk"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="shell-close-risk"]'
    name: data-risk-kind
    equals: dirty
- click: '[data-testid="shell-close-cancel"]'
- assert_not_visible: '[data-testid="shell-close-dialog"]'
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Escape
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: *id001
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- press:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    key: Mod+z
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals: *id002
- type: z
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-discard"]'
- click: '[data-testid="shell-close-confirm"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 1
- screenshot: tc-shell-b14.png

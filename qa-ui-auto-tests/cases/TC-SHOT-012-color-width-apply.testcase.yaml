id: TC-SHOT-012
title: Selected annotation colors and widths change new strokes without repainting old ones
description: Uses real drags and read-only annotation-canvas samples on the synthetic image; canvas pixel checks are renderer-only, not native capture evidence.
covers: [F27.1]
tags: [screenshot, annotate, color, p2]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-color-red"]'
- click: '[data-testid="screenshot-line-width-2"]'
- assert_attribute:
    selector: '[data-testid="screenshot-color-red"]'
    name: aria-pressed
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="screenshot-line-width-2"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 140, y: 160}
    to_position: {x: 320, y: 280}
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- eval_readonly:
    expression: Array.from(document.querySelector('canvas').getContext('2d').getImageData(180 * devicePixelRatio, 160 * devicePixelRatio, 1, 1).data).join(',') === '255,77,79,255'
- eval_readonly:
    expression: document.querySelector('canvas').getContext('2d').getImageData(180 * devicePixelRatio, 163 * devicePixelRatio, 1, 1).data[3] === 0
- click: '[data-testid="screenshot-color-green"]'
- click: '[data-testid="screenshot-line-width-8"]'
- assert_attribute:
    selector: '[data-testid="screenshot-color-green"]'
    name: aria-pressed
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="screenshot-color-red"]'
    name: aria-pressed
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="screenshot-line-width-8"]'
    name: aria-pressed
    equals: 'true'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 400, y: 160}
    to_position: {x: 580, y: 280}
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="2"]'
- eval_readonly:
    expression: Array.from(document.querySelector('canvas').getContext('2d').getImageData(440 * devicePixelRatio, 163 * devicePixelRatio, 1, 1).data).join(',') === '82,196,26,255'
- eval_readonly:
    expression: Array.from(document.querySelector('canvas').getContext('2d').getImageData(180 * devicePixelRatio, 160 * devicePixelRatio, 1, 1).data).join(',') === '255,77,79,255'
- click: '[data-testid="screenshot-color-yellow"]'
- assert_attribute:
    selector: '[data-testid="screenshot-color-yellow"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-color-blue"]'
- assert_attribute:
    selector: '[data-testid="screenshot-color-blue"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-color-white"]'
- assert_attribute:
    selector: '[data-testid="screenshot-color-white"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-line-width-4"]'
- assert_attribute:
    selector: '[data-testid="screenshot-line-width-4"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-tool-line"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 140, y: 360}
    to_position: {x: 320, y: 360}
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="3"]'
- eval_readonly:
    expression: Array.from(document.querySelector('canvas').getContext('2d').getImageData(180 * devicePixelRatio, 360 * devicePixelRatio, 1, 1).data).join(',') === '255,255,255,255'
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Red 2px and green 8px selections are applied to new rectangle strokes, with the earlier rectangle retaining its original color and width.
    actions: [1, 2, 4, 6, 7, 10, 11, 15, 16, 20]
    checkpoints:
    - {step: 8, expectation: Red is selected.}
    - {step: 9, expectation: The 2px width is selected.}
    - {step: 12, expectation: A real rectangle drag committed one shape.}
    - {step: 13, expectation: The first stroke paints an opaque red pixel.}
    - {step: 14, expectation: A pixel three CSS pixels from the thin stroke is transparent.}
    - {step: 17, expectation: Green becomes selected.}
    - {step: 18, expectation: Red is no longer selected for new shapes.}
    - {step: 19, expectation: The 8px width is selected.}
    - {step: 21, expectation: The second drag commits one additional rectangle.}
    - {step: 22, expectation: The thicker new stroke paints an opaque green pixel three pixels from its center.}
    - {step: 23, expectation: Changing defaults did not recolor the older rectangle.}
    results: [13, 14, 17, 18, 19, 21, 22, 23]
  - id: R2
    requirement: Remaining color controls report selection and a white 4px line is committed using the final settings.
    actions: [24, 26, 28, 30, 32, 33, 36]
    checkpoints:
    - {step: 25, expectation: Yellow reports selected state.}
    - {step: 27, expectation: Blue reports selected state.}
    - {step: 29, expectation: White reports selected state.}
    - {step: 31, expectation: The 4px width reports selected state.}
    - {step: 34, expectation: The line drag commits the third shape.}
    - {step: 35, expectation: The new line paints opaque white.}
    - {step: 37, expectation: The overlay remains cancelable.}
    results: [25, 27, 29, 31, 34, 35, 37]
  visual:
  - check: Thin red, thick green and white strokes use the selected colors and widths.
    method: automated
    reason: Read-only live annotation-canvas pixels distinguish applied settings from control touches; these are synthetic renderer pixels only.
  native:
  - check: HiDPI packaged-WebView output and native screenshot pixel fidelity.
    method: external
    reason: Browser canvas sampling cannot certify exported native desktop or clipboard pixels.

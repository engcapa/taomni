id: TC-SHOT-012
title: Annotation color and line width apply to newly drawn shapes
covers:
- F27.1
tags:
- screenshot
- annotate
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
# Select red color and draw a rectangle.
- click: '[data-testid="screenshot-color-red"]'
- click: '[data-testid="screenshot-tool-rect"]'
- wait: 1
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position: {x: 100, y: 100}
- wait: 1
# Change to green with thicker line, draw another rectangle.
- click: '[data-testid="screenshot-color-green"]'
- click: '[data-testid="screenshot-line-width-4"]'
- wait: 1
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position: {x: 300, y: 300}
- wait: 1
# Two shapes exist; undo removes them one by one.
- assert_enabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-undo"]'
- assert_enabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-undo"]'
- assert_disabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-cancel"]'
- wait_for:
    selector: '[data-testid="system-screenshot"]'

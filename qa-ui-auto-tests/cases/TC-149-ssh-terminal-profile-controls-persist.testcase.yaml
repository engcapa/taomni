id: TC-149
title: SSH terminal profile controls update, validate, and persist
covers:
- F5.2
- F6.3
tags:
- ssh
- session
- settings
- terminal
- appearance
- ai
- persistence
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-terminal-profile.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-terminal-profile
- click: '[data-testid="session-section-terminal"]'
- wait_for: '[data-testid="terminal-settings"]'
- assert_visible: '[data-testid="terminal-appearance-settings"]'
- assert_visible: '[data-testid="terminal-preview"]'
- click: '[data-testid="terminal-theme-select"]'
- wait_for: '[data-testid="terminal-theme-select-menu"]'
- click: '[data-testid="terminal-theme-option-kanagawa-wave"]'
- assert_attribute:
    selector: '[data-testid="terminal-theme-select"]'
    name: aria-expanded
    equals: 'false'
- set_check:
    selector: 'input[aria-label="Enable font ligatures"]'
    checked: true
- assert_count:
    selector: 'input[aria-label="Enable font ligatures"]:checked'
    equal: 1
- set_check:
    selector: 'label:has-text("Show terminal scrollbar") input[type="checkbox"]'
    checked: false
- assert_count:
    selector: 'label:has-text("Show terminal scrollbar") input[type="checkbox"]:checked'
    equal: 0
- set_check:
    selector: 'label:has-text("Copy on select") input[type="checkbox"]'
    checked: true
- set_check:
    selector: 'label:has-text("Allow SSH OSC 52 clipboard") input[type="checkbox"]'
    checked: true
- set_check:
    selector: 'label:has-text("Read-only terminal") input[type="checkbox"]'
    checked: true
- set_check:
    selector: 'label:has-text("Bracketed paste") input[type="checkbox"]'
    checked: false
- set_check:
    selector: 'label:has-text("Confirm multiline paste") input[type="checkbox"]'
    checked: false
- set_check:
    selector: 'label:has-text("Enable keyword highlighting") input[type="checkbox"]'
    checked: true
- set_check:
    selector: 'label:has-text("Save scrollback to log file on disconnect") input[type="checkbox"]'
    checked: true
- set_check:
    selector: 'label:has-text("Show ghost-text suggestions from command history") input[type="checkbox"]'
    checked: false
- assert_disabled: 'input[aria-label="Maximum command history entries per host"]'
- set_check:
    selector: 'label:has-text("Show ghost-text suggestions from command history") input[type="checkbox"]'
    checked: true
- assert_enabled: 'input[aria-label="Maximum command history entries per host"]'
- fill:
    selector: 'input[aria-label="Maximum command history entries per host"]'
    value: '99'
- click: '[data-testid="terminal-preview"]'
- wait_for: 'input[aria-label="Maximum command history entries per host"][value="100"]'
- fill:
    selector: 'input[aria-label="Maximum command history entries per host"]'
    value: '50001'
- click: '[data-testid="terminal-preview"]'
- wait_for: 'input[aria-label="Maximum command history entries per host"][value="50000"]'
- click: 'input[name="inlineSuggestionsSource"][value="history+path"]'
- assert_count:
    selector: 'input[name="inlineSuggestionsSource"][value="history+path"]:checked'
    equal: 1
- click: text="Clear all history"
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: Clear all command history
- click: '[data-testid="confirm-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="confirm-dialog"]'
    state: detached
- set_check:
    selector: '[data-testid="ai-command-rewrite-toggle"] input[type="checkbox"]'
    checked: true
- assert_count:
    selector: '[data-testid="ai-command-rewrite-toggle"] input[type="checkbox"]:checked'
    equal: 1
- assert_enabled: 'input[aria-label="AI command rewrite shortcut"]'
- fill:
    selector: 'input[aria-label="AI command rewrite shortcut"]'
    value: Ctrl+Alt+K
- assert_attribute:
    selector: 'input[aria-label="AI command rewrite shortcut"]'
    name: value
    equals: Ctrl+Alt+K
- set_check:
    selector: '[data-testid="ai-command-rewrite-toggle"] input[type="checkbox"]'
    checked: false
- assert_disabled: 'input[aria-label="AI command rewrite shortcut"]'
- set_check:
    selector: 'label:has-text("Render `?? <question>` answers inline") input[type="checkbox"]'
    checked: true
- assert_count:
    selector: 'label:has-text("Render `?? <question>` answers inline") input[type="checkbox"]:checked'
    equal: 1
- click: text="Add entry"
- wait_for: 'input[aria-label="Command 1"]'
- fill:
    selector: 'input[aria-label="Command 1"]'
    value: printf qa-custom-ssh-command
- fill:
    selector: 'input[aria-label="Description 1"]'
    value: SSH profile command
- assert_attribute:
    selector: 'input[aria-label="Command 1"]'
    name: value
    equals: printf qa-custom-ssh-command
- assert_attribute:
    selector: 'input[aria-label="Description 1"]'
    name: value
    equals: SSH profile command
- click: '[aria-label="Remove command 1"]'
- assert_not_visible: 'input[aria-label="Command 1"]'
- click: text="Add entry"
- fill:
    selector: 'input[aria-label="Command 1"]'
    value: printf qa-custom-ssh-command
- fill:
    selector: 'input[aria-label="Description 1"]'
    value: SSH profile command
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-terminal-profile
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-terminal-profile"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-terminal-profile"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-terminal"]'
- wait_for: '[data-testid="terminal-settings"]'
- assert_text:
    selector: '[data-testid="terminal-theme-select"]'
    contains: Kanagawa Wave
- assert_count:
    selector: 'input[aria-label="Enable font ligatures"]:checked'
    equal: 1
- assert_count:
    selector: 'label:has-text("Show terminal scrollbar") input[type="checkbox"]:checked'
    equal: 0
- assert_count:
    selector: 'label:has-text("Copy on select") input[type="checkbox"]:checked'
    equal: 1
- assert_count:
    selector: 'label:has-text("Allow SSH OSC 52 clipboard") input[type="checkbox"]:checked'
    equal: 1
- assert_count:
    selector: 'label:has-text("Read-only terminal") input[type="checkbox"]:checked'
    equal: 1
- assert_count:
    selector: 'label:has-text("Bracketed paste") input[type="checkbox"]:checked'
    equal: 0
- assert_count:
    selector: 'label:has-text("Confirm multiline paste") input[type="checkbox"]:checked'
    equal: 0
- assert_count:
    selector: 'label:has-text("Enable keyword highlighting") input[type="checkbox"]:checked'
    equal: 1
- assert_count:
    selector: 'label:has-text("Save scrollback to log file on disconnect") input[type="checkbox"]:checked'
    equal: 1
- assert_attribute:
    selector: 'input[aria-label="Maximum command history entries per host"]'
    name: value
    equals: '50000'
- assert_count:
    selector: 'input[name="inlineSuggestionsSource"][value="history+path"]:checked'
    equal: 1
- assert_count:
    selector: '[data-testid="ai-command-rewrite-toggle"] input[type="checkbox"]:checked'
    equal: 0
- assert_attribute:
    selector: 'input[aria-label="AI command rewrite shortcut"]'
    name: value
    equals: Ctrl+Alt+K
- assert_count:
    selector: 'label:has-text("Render `?? <question>` answers inline") input[type="checkbox"]:checked'
    equal: 1
- assert_attribute:
    selector: 'input[aria-label="Command 1"]'
    name: value
    equals: printf qa-custom-ssh-command
- assert_attribute:
    selector: 'input[aria-label="Description 1"]'
    name: value
    equals: SSH profile command
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 149-ssh-terminal-profile-controls.png

id: TC-MODULES-050
title: Mail upgrade preview keeps its recommendation and pending state across reload
description: The browser fixture supplies a legacy Mail recommendation. The Settings panel displays one Mail entry
  and reports that a verified package is required when the user confirms before and after reload.
covers: [F-Modules-1]
tags: [p1, modules, upgrade, mail]
modes: [browser]
fixtures: [reset_db, module_upgrade]
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count: {selector: '[data-testid="module-upgrade-candidates"] li', equal: 1}
- assert_text_equals: {selector: '[data-testid="module-upgrade-candidates"] li', equals: mail}
- press: {selector: '[data-testid="module-upgrade-migrate"]', key: Enter}
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_text: {selector: '[data-testid="module-upgrade-pending"]', contains: verified}
- reload_window: null
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count: {selector: '[data-testid="module-upgrade-candidates"] li', equal: 1}
- assert_text_equals: {selector: '[data-testid="module-upgrade-candidates"] li', equals: mail}
- press: {selector: '[data-testid="module-upgrade-migrate"]', key: Enter}
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_text: {selector: '[data-testid="module-upgrade-pending"]', contains: Browser preview}
- assert_no_runtime_errors: null
- screenshot: mail-upgrade-browser.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The Settings panel presents the Mail candidate and pending result across renderer reload.
    actions: [3, 5, 9, 12, 14, 16, 20]
    checkpoints:
    - {step: 7, expectation: One upgrade recommendation appears.}
    - {step: 8, expectation: The recommendation identifies Mail.}
    - {step: 11, expectation: The pending message describes the verified package requirement.}
    - {step: 18, expectation: Reload retains one recommendation.}
    - {step: 19, expectation: The recommendation still identifies Mail.}
    - {step: 22, expectation: Retrying displays the pending browser preview result.}
    - {step: 23, expectation: No renderer runtime error occurred.}
    results: [7, 8, 11, 18, 19, 22, 23]
  native:
  - check: The installed application preserves legacy account rows and the pending migration journal.
    method: not-applicable
    reason: TC-MODULES-049 records the native SQLite and filesystem results.
  visual:
  - check: The Module Store displays the Mail recommendation and its pending message.
    method: manual
    reason: The runner retains a screenshot after the retry.

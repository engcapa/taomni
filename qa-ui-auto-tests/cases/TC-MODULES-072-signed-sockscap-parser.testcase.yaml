id: TC-MODULES-072
title: Signed SocksCap imports a proxy link into an existing routing profile
description: Install the signed SocksCap host. Import a loopback fixture link and verify the endpoint and the host writer lease through disable.
covers: [F-Sockscap-1, F-Modules-1]
tags: [modules, sockscap, native-boundary, p1]
modes: [native]
fixtures: [reset_db, sockscap_legacy_config, module_signed_sockscap_archive]
timeout_sec: 175
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.sockscap_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.sockscap_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- assert_file_sha256: {path: '${fixture.sockscap_signed_host}', equals: '${fixture.sockscap_signed_host_sha256}'}
- assert_signed_sockscap_host: idle
- click: '[data-testid="module-action-enable-sockscap"]'
- wait_for: '[data-testid="module-action-disable-sockscap"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-testid="plugin-tab-panel"][data-plugin-slug="sockscap"] [data-testid="sockscap-panel"]'
- show_sockscap_section: upstream
- wait_for: '[data-testid="sockscap-upstream-kind"]'
- select_option: {selector: '[data-testid="sockscap-upstream-kind"]', value: trojan}
- wait_for: '[data-testid="sockscap-sharelink-input"]'
- fill: {selector: '[data-testid="sockscap-sharelink-input"]', value: 'trojan://qa-sockscap-fixture@127.0.0.2:19392#Hosted%20fixture'}
- click: '[data-testid="sockscap-sharelink-import"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-sockscap-parser-vault
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.2"]'
- assert_attribute: {selector: '[data-testid="sockscap-upstream-port"]', name: value, equals: '19392'}
- assert_signed_sockscap_host: running
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-sockscap"]'
- wait_for: '[data-testid="module-action-enable-sockscap"]'
- assert_signed_sockscap_host: disabled
- assert_file_sha256: {path: '${fixture.sockscap_signed_frontend}', equals: '${fixture.sockscap_signed_frontend_sha256}'}
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-unavailable"][data-reason="disabled"]'
- assert_count: {selector: '[data-testid="sockscap-panel"]', equal: 0}
- assert_no_runtime_errors: null
- assert_file_sha256: {path: '${fixture.sockscap_original_file}', equals: '${fixture.sockscap_original_sha256}'}
- assert_file_contains: {path: '${fixture.sockscap_module_config}', contains: '"host":"127.0.0.2"'}
- assert_file_contains: {path: '${fixture.sockscap_module_config}', contains: '"passwordRef":"vault:'}
- click: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-settings"]'
- click: '[data-testid="module-action-enable-sockscap"]'
- wait_for: '[data-testid="module-action-disable-sockscap"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- show_sockscap_section: upstream
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.2"]'
- assert_attribute: {selector: '[data-testid="sockscap-upstream-port"]', name: value, equals: '19392'}
- assert_no_runtime_errors: null
- fill: {selector: '[data-testid="sockscap-upstream-port"]', value: '19397'}
- eval_readonly:
    expression: "document.getElementsByName('upstreamPort')[0]?.value === '19397' && document.querySelector('.sockscap-panel')?.getAttribute('aria-busy') === 'false'"
    expect_truthy: true
    timeout_sec: 10
- assert_file_contains: {path: '${fixture.sockscap_module_config}', contains: '"port":19397'}
- assert_file_sha256: {path: '${fixture.sockscap_original_file}', equals: '${fixture.sockscap_original_sha256}'}
verification:
  review: reviewed
  requirements:
  - id: signed-parser
    requirement: A signed parser resumes the import after first-time Vault setup, supplies the endpoint and releases its host when disabled.
    actions: [6, 10, 16, 18, 21, 23, 29]
    checkpoints:
    - {step: 8, expectation: The installed executable matches the verified package.}
    - {step: 9, expectation: The installed host is idle before its first request.}
    - {step: 22, expectation: An import into a fresh profile offers Vault setup.}
    - {step: 24, expectation: The original profile shows the exact host parsed from the link.}
    - {step: 25, expectation: The profile also shows the parsed port.}
    - {step: 26, expectation: The signed parser owns a live writer lease during use.}
    - {step: 31, expectation: Module disable releases the lease.}
    - {step: 32, expectation: The installed frontend matches the entry in the signed archive.}
    - {step: 36, expectation: Reopening the retained tool displays the disabled module.}
    - {step: 37, expectation: The proxy configuration panel has unmounted.}
    - {step: 38, expectation: Import and disable complete without runtime errors.}
    results: [8, 9, 22, 24, 25, 26, 31, 32, 36, 37, 38]
  - id: module-owned-settings
    requirement: Save the edited endpoint and Vault reference in the module data directory and use that copy after enabling again.
    actions: [23, 29, 42, 43, 45, 46, 47, 48, 52]
    checkpoints:
    - {step: 39, expectation: The original monolithic configuration retains its initial digest.}
    - {step: 40, expectation: The retained module file contains the new upstream host.}
    - {step: 41, expectation: The persisted proxy password is referenced in Vault.}
    - {step: 49, expectation: The re-enabled panel reads the edited host.}
    - {step: 50, expectation: The re-enabled panel reads the edited port.}
    - {step: 51, expectation: Reopening completes without runtime errors.}
    - {step: 53, expectation: The re-enabled module finishes saving the edited port while its field is still focused.}
    - {step: 54, expectation: The signed host has written port 19397 into its own configuration on disk.}
    - {step: 55, expectation: Editing the imported profile leaves the original file at its recorded digest.}
    results: [39, 40, 41, 49, 50, 51, 53, 54, 55]
  visual:
  - check: The upstream settings reflect the imported proxy link.
    method: automated
    reason: The UI shows the distinct host and port from the fixture link.
  native:
  - check: The signed host is used through the normal SocksCap entry point.
    method: automated
    reason: The native receipt records the installed artifact and real writer lease.

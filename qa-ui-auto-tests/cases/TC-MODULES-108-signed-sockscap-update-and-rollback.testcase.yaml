- assert_signed_module_lifecycle: {slug: sockscap, phase: updated-enabled}
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: {selector: '[data-testid="plugin-tab-panel"][data-plugin-slug="sockscap"][data-plugin-version="${fixture.sockscap_current_version}"] [data-testid="sockscap-panel"]', timeout_sec: 25}
- show_sockscap_section: test
- fill: {selector: '[data-testid="sockscap-test-host"]', value: example.com}

verification:
  review: reviewed
  requirements:
  - id: disabled-update-and-rollback
    requirement: Update and roll back a disabled SocksCap package without restarting the desktop process and preserve the imported upstream configuration.
    actions: [10, 12, 23, 25, 30, 36, 41, 44, 46, 49]
    checkpoints:
    - {step: 33, expectation: The earlier signed host owns the writer lease and evaluates target rules.}
    - {step: 38, expectation: Disabling releases the writer lease.}
    - {step: 48, expectation: Updating while disabled activates the new version without starting the host.}
    - {step: 51, expectation: Rolling back while disabled restores the earlier version with no running host.}
    results: [33, 38, 48, 51]
  - id: enabled-update-and-failed-handshake
    requirement: Replace and roll back a running SocksCap host and recover the previous working host when a replacement fails handshake.
    actions: [52, 63, 71, 72, 81, 88, 92, 101]
    checkpoints:
    - {step: 66, expectation: Re-enabled earlier host preserves the Vault-backed trojan upstream and runs target evaluation.}
    - {step: 74, expectation: Live update switches to the new running host cleanly.}
    - {step: 82, expectation: Updated host panel renders the active version and evaluates targets.}
    - {step: 90, expectation: Handshake-failure version reports permission denied error.}
    - {step: 91, expectation: Failed update restores the active host cleanly.}
    - {step: 94, expectation: Manual rollback switches the running host back to the earlier version.}
    - {step: 102, expectation: Rolled-back earlier host evaluates targets cleanly without runtime errors.}
    results: [66, 74, 82, 90, 91, 94, 102]
  - id: retained-uninstall-and-reinstall
    requirement: Uninstall removes SocksCap versions while retaining config.json and Vault reference, then restores them on reinstall.
    actions: [106, 107, 113, 120, 122, 128]
    checkpoints:
    - {step: 109, expectation: Uninstall displays the retained-data notice.}
    - {step: 110, expectation: Executable versions and runtime are removed while config.json locator and writer lease state match.}
    - {step: 114, expectation: Reopening the retained tool displays the missing-module notice without mounting the panel.}
    - {step: 131, expectation: Reinstalled current host reads the persisted upstream host/port and Vault reference in the original desktop process.}
    results: [109, 110, 114, 131]
  native:
  - check: Record desktop and host process identities, signed digests, writer lease, retained locator and config continuity on Linux, Windows and macOS.
    method: external
    reason: Native observation verifies each phase outside the renderer.
  visual:
  - check: Confirm mounted plugin version, persisted upstream values, and missing placeholder in Settings and Tools tabs.
    method: automated
    reason: Explicit DOM assertions check the mounted version and upstream fields across transitions.

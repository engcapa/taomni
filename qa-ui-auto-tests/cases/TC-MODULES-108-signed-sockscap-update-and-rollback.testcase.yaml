id: TC-MODULES-108
title: Signed SocksCap switches versions and preserves Vault-backed upstream configuration in one session
description: >-
  Install an independently compiled SocksCap prerelease, import a fixture share link with Vault setup,
  and run target evaluation inside the host. Download the current signed build from the loopback catalog,
  update and roll back both while disabled and while running without restarting Taomni, recover from a
  handshake-failure candidate, uninstall with data retained, and reinstall with upstream settings intact.
covers: [F-Modules-1, F-Sockscap-1, F-WS-3]
tags: [modules, sockscap, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, module_signed_sockscap_archive, module_marketplace, release_build_required]
timeout_sec: 420
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- module_marketplace_probe: {phase: source}
- reload_window: null
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.sockscap_previous_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.sockscap_previous_signature}'}
- press: {selector: '[data-testid="module-offline-submit"]', key: Enter}
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- press: {selector: '[data-testid="module-action-enable-sockscap"]:enabled', key: Enter}
- wait_for: '[data-testid="module-action-disable-sockscap"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: {selector: '[data-testid="plugin-tab-panel"][data-plugin-slug="sockscap"][data-plugin-version="${fixture.sockscap_previous_version}"] [data-testid="sockscap-panel"]', timeout_sec: 25}
- show_sockscap_section: upstream
- wait_for: '[data-testid="sockscap-upstream-kind"]'
- select_option: {selector: '[data-testid="sockscap-upstream-kind"]', value: trojan}
- wait_for: '[data-testid="sockscap-sharelink-input"]'
- fill: {selector: '[data-testid="sockscap-sharelink-input"]', value: 'trojan://qa-sockscap-fixture@127.0.0.2:19392#Hosted%20fixture'}
- click: '[data-testid="sockscap-sharelink-import"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-sockscap-lifecycle-vault
- wait_for: '[data-testid="sockscap-upstream-host"][value="127.0.0.2"]'
- assert_attribute: {selector: '[data-testid="sockscap-upstream-port"]', name: value, equals: '19392'}
- show_sockscap_section: test
- fill: {selector: '[data-testid="sockscap-test-host"]', value: example.com}
- click: '[data-testid="sockscap-test-target"]'
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'Decision: direct'}
- click: '[data-testid="sockscap-test-detail-close"]'
- assert_signed_module_lifecycle: {slug: sockscap, phase: old-enabled}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- press: {selector: '[data-testid="module-action-disable-sockscap"]:enabled', key: Enter}
- wait_for: '[data-testid="module-action-enable-sockscap"]:enabled'
- assert_signed_module_lifecycle: {slug: sockscap, phase: old-disabled}
- click: '[data-testid="module-marketplace-refresh"]:not([disabled])'

id: TC-WS-038
title: Restore a workspace with a terminal selected and its editor hidden
description: 'Create the saved layout through the UI, reload on Home, then return to a workspace whose file editor is mounted behind a terminal. Retain
  the draft, terminal, navigator and tool controls. A closed Documentation panel must have no visible layout box after the hidden editor is restored or
  Documentation is toggled closed. File-open migration: this IDE pane/layout lifecycle regression explicitly associates .md/.txt with Code Workspace. New
  viewer defaults are tested separately by TC-FILE-OPEN-001..006; all original pane/content/PTY/save assertions are retained.'
modes:
- browser
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-5
- F25.3
tags:
- p0
- workspace-redesign
- regression
- crash-regression
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-hidden-editor
- seed_storage:
    key: taomni.qa.resizeTrace.v1
    value: '1'
- seed_storage:
    key: taomni.fileOpen.preferences.v1
    value: '{"associations":{"md":"workspace","txt":"workspace"}}'
- reload_window: null
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-tree-root"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"] .cm-content'
- press:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    key: Mod+End
- type:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    text: QA_HIDDEN_EDITOR_DRAFT
- wait_for: '[data-testid="workspace-file-editor"][data-dirty="true"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- assert_no_runtime_errors: null
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: Local Terminal
- assert_visible: '[data-testid="collapsed-sidebar-rail"]'
- assert_no_runtime_errors: null
- click: '[data-testid="workspace-tab"][data-tab-title="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"][data-dirty="true"] .cm-content'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: QA_HIDDEN_EDITOR_DRAFT
- assert_not_visible: '[data-testid="workspace-file-editor"] [data-panel][id="documentation"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- assert_visible: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- click: '[data-testid="code-workspace-tool-rail-documentation"]'
- assert_visible: '[data-testid="code-workspace-right-pane"]'
- click: '[data-testid="code-workspace-tool-rail-documentation"]'
- assert_not_visible: '[data-testid="code-workspace-right-pane"]'
- assert_not_visible: '[data-testid="workspace-file-editor"] [data-panel][id="documentation"]'
- assert_no_runtime_errors: null
- click: '[data-testid="workspace-tab"][data-tab-title="Local Terminal"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- assert_visible: '[data-testid="expanded-sidebar-panel"]'
- assert_count:

  native:
  - check: Restore the hidden editor behind the active terminal in the packaged WebView.
    method: automated
    reason: The reported desktop crash depends on mounting and resizing invisible panels. Browser geometry cannot certify packaged WebView behavior; real
      PTY commands remain covered by TC-WS-015 and TC-WS-024.

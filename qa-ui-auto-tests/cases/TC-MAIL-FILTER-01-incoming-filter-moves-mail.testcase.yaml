id: TC-MAIL-FILTER-01
title: Saved subject and body filters move matching new mail out of the Inbox
description: 'TASK-13 (docs-feature/mail-thunderbird-parity-design.md AC-40, DEC-11).

  Creates a filter "Subject contains Filtered -> Move to Archive" in the

  Message filters dialog, reopens the dialog to read the saved rule, delivers one matching and one non-matching message,

  syncs, and requires the server to hold the matching message in Archive and

  only the other one in INBOX. Adds a second rule whose keyword must appear in
  the body and delivers mail with the keyword in either its subject or body.
  Manual runs, failures (AC-41/AC-42), other condition operators

  conditions and the rule semantics are covered by Rust and Vitest tests.

  Browser mode drives the stub filter engine (renderer orchestration only);

  native mode runs the Rust filter engine against the in-process fake IMAP

  server started by the mail_server fixture.

  '
covers:
- F-MAIL-19
tags:
- mail
- p2
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- click: '[data-testid="mail-filters-open"]'
- click: '[data-testid="mail-filter-new"]'
- fill:
    selector: '[data-testid="mail-filter-name"]'
    value: QA archive
- select_option:
    selector: '[data-testid="mail-filter-condition-field"]'
    value: subject
- fill:
    selector: '[data-testid="mail-filter-condition-value"]'
    value: Filtered
- select_option:
    selector: '[data-testid="mail-filter-action-folder"]'
    value: Archive
- click: '[data-testid="mail-filter-save"]'
- wait_for:
    selector: '[data-testid="mail-filter-row"][data-filter-name="QA archive"]'
    timeout_sec: 20
- click: '[data-testid="mail-filters-close"]'
- click: '[data-testid="mail-filters-open"]'
- wait_for:
    selector: '[data-testid="mail-filter-row"][data-filter-name="QA archive"]'
    timeout_sec: 20
- click: '[data-testid="mail-filters-close"]'
- mail_server_deliver:
    count: 1
    prefix: Filtered
- mail_server_deliver:
    count: 1
    prefix: Keep
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_folder_count:
    folder: Archive
    has_subject: Filtered 0001
    timeout_sec: 60
- mail_server_assert_folder_count:
    folder: INBOX
    has_subject: Keep 0001
    lacks_subject: Filtered 0001
    timeout_sec: 20
- assert_no_runtime_errors: null
- click: '[data-testid="mail-filters-open"]'
- click: '[data-testid="mail-filter-new"]'
- fill: {selector: '[data-testid="mail-filter-name"]', value: QA body archive}
- select_option: {selector: '[data-testid="mail-filter-condition-field"]', value: body}
- fill: {selector: '[data-testid="mail-filter-condition-value"]', value: invoice marker}
- select_option: {selector: '[data-testid="mail-filter-action-folder"]', value: Archive}
- click: '[data-testid="mail-filter-save"]'
- wait_for: '[data-testid="mail-filter-row"][data-filter-name="QA body archive"]'
- click: '[data-testid="mail-filters-close"]'
- mail_server_deliver: {count: 1, prefix: Receivable, body: 'Contains the INVOICE MARKER from accounting.'}
- mail_server_deliver: {count: 1, prefix: invoice marker, body: 'This note is unrelated.'}
- click: '[data-testid="mail-sync-button"]:enabled'
- mail_server_assert_folder_count: {folder: Archive, has_subject: Receivable 0001, lacks_subject: invoice marker 0001, timeout_sec: 45}
- mail_server_assert_folder_count: {folder: INBOX, has_subject: invoice marker 0001, lacks_subject: Receivable 0001}
- assert_no_runtime_errors: null
- screenshot: mail-filter-01-after-sync.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 在“Message filters”对话框中创建并保存规则（主题包含 Filtered → 移动到 Archive），重新打开对话框后仍可读到保存的规则（DEC-11）。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 9
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 17
    - 18
    checkpoints:
    - step: 8
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 16
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-filter-row\"][data-filter-name=\"QA archive\"]", "timeout_sec": 20}}'
    - step: 19
      expectation: 重新打开的对话框显示已保存的 QA archive 规则。
    results:
    - 16
    - 19
  - id: R2
    requirement: 同步到达的新邮件经收信过滤器处理：匹配的邮件在服务器上被移入 Archive，不匹配的留在 INBOX（AC-40）。
    actions:
    - 20
    - 21
    - 22
    - 23
    checkpoints:
    - step: 24
      expectation: '{"mail_server_assert_folder_count": {"folder": "Archive", "has_subject": "Filtered 0001", "timeout_sec": 60}}'
    - step: 25
      expectation: '{"mail_server_assert_folder_count": {"folder": "INBOX", "has_subject": "Keep 0001", "lacks_subject": "Filtered 0001", "timeout_sec": 20}}'
    - step: 26
      expectation: 保存和应用过滤规则期间没有运行时错误。
    results:
    - 24
    - 25
    - 26
  - id: R3
    requirement: 正文规则忽略大小写，并且不会移动只在主题中含有该关键词的邮件。
    actions: [27, 28, 29, 30, 31, 32, 33, 35, 36, 37, 38]
    checkpoints:
    - {step: 34, expectation: 消息过滤器显示已保存的正文规则。}
    - {step: 39, expectation: 正文包含关键词的邮件移到 Archive。}
    - {step: 40, expectation: 仅主题包含关键词的邮件留在 INBOX。}
    - {step: 41, expectation: 完成过滤时无运行时错误。}
    results: [34, 39, 40, 41]
  visual:
  - check: 截图中 INBOX 列表保留只匹配主题的邮件和 Keep 0001。
    method: manual
    reason: 像素与布局需人工评审。
  native:
  - check: native 模式验证 Rust 过滤引擎在假 IMAP 服务器上执行 UID MOVE；browser 仅验证渲染层；平台结果分别记录。
    method: automated
    reason: 按实际执行模式与平台解释证据。

id: TC-IDE-CW-EXECUTION-01-maven-run-build-tests-native
title: Maven Run, Build, Tests, and run-configuration lifecycle
description: 'Native Code Workspace regression gate for the provider-backed Maven execution

  surface. Opens the isolated Maven sample in the packaged app, runs the

  discovered Java main class, builds and rebuilds the project, edits and resets

  the provider configuration, creates and deletes a named copy, then discovers

  and runs the JUnit test. The second test run changes only the retained copy of

  the fixture to prove structured failure details and rerun behavior without

  touching a checked-in project.

  Highest claim on green: L2 packaged native execution and JDTLS/JUnit

  provider-backed UI on the current platform.

  '
covers:
- F25.1
- F25.5
tags:
- code-workspace
- execution
- maven
- run-configuration
- build
- tests
- native-gate
- p0
modes:
- native
fixtures:
- reset_db
- java_sample_projects
- jdtls_required
- java_test_bundle
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-code-workspace-execution-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.codeWorkspace.lspJavaBundles.v1
    value: '{"javaDebugPath":"${fixture.java_debug_bundle_path}","javaTestPath":"${fixture.java_test_bundle_path}"}'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-cw-execution","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/App.java"},"lastOpenedAt":1789259400000,"isGitRepo":false}]'
- host_write_file:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/App.java
    text: "package com.example.single;\n\nimport java.util.Arrays;\nimport java.util.List;\n\npublic class App {\n\
      \    public static void main(String[] args) {\n        List<String> names = Arrays.asList(\"alpha\", \"beta\"\
      );\n        System.out.println(names.size());\n    }\n}\n"
- host_write_file:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/QuickFixTarget.java
    text: "package com.example.single;\n\npublic class QuickFixTarget {\n    void quickFixTargets() {\n        //\
      \ Execution uses a clean source set; diagnostic behavior has\n        // dedicated provider fixtures in the\
      \ Analysis cases.\n    }\n}\n"
- host_write_file:
    path: ${fixture.maven_single_root}/src/test/java/com/example/single/AppTest.java
    text: "package com.example.single;\n\nimport org.junit.Test;\nimport org.junit.Assert;\n\npublic class AppTest\
      \ {\n    @Test\n    public void appHasMain() {\n        Assert.assertTrue(App.class.getDeclaredMethods().length\
      \ > 0);\n    }\n}\n"

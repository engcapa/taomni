  requirements:
  - id: R1
    requirement: Real held SDK discovery leaves Java source editing and workspace navigation responsive; late SDK/LSP results preserve the latest dirty
      buffer, active file and byte-exact saved document.
    actions:
    - 7
    - 8
    - 9
    - 10
    - 11
    - 13
    - 14
    - 15
    - 16
    - 21
    - 23
    - 25
    - 26
    results:
    - 17
    - 18
    - 19
    - 20
    - 22
    - 24
    - 27
    - 28
    checkpoints:
    - step: 17
      expectation: '{"assert_file_contains": {"path": "${fixture.slow_sdk_response_report}", "contains": "\"passed\": true"}}'
    - step: 18
      expectation: '{"assert_file_contains": {"path": "${fixture.slow_sdk_lsp_documents}", "contains": "public class Main { int value = 7; }"}}'
    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"workspace-tab\"][data-active=\"true\"]", "name": "data-tab-title", "equals": "notes.txt"}}'
    - step: 20
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-line:first-child", "equals": "Weekly notes"}}'
    - step: 22
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "equals": "public class Main { int value
        = 7; }"}}'
    - step: 24
      expectation: '{"assert_file_sha256": {"path": "${fixture.platform_workspace_root}/src/Main.java", "equals": "05aecf77fe70bd3f673235370500a22c5183634d3e24b8188bb61552bc3657b4"}}'
    - step: 27
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "equals": "public class Main { int value
        = 7; }"}}'
    - step: 28
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: Current document and SDK status remain readable.
    method: manual
    reason: Screenshot is retained; timings, peer protocol and disk hash establish behavior separately.
  native:
  - check: Real SDK executable, unchanged native probe timeout, real Tauri requests, real stdio LSP and independently reread disk hash.
    method: automated
    reason: Browser stubs cannot establish process liveness or host responsiveness while native SDK discovery is pending.

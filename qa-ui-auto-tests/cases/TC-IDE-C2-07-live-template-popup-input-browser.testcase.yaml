id: TC-IDE-C2-07-live-template-popup-input-browser
title: "Live Template popup input interaction in browser"
description: |
  Browser verification for RT-01..06. Opens code workspace editor in browser mode,
  types `sout`, verifies completion popup appears without feedback request loop,
  navigates candidates with keyboard, accepts with Enter, and undoes cleanly.
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, live-template, browser-gate, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 180
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-tree-file"]'
  - dblclick: '[data-testid="code-workspace-tree-file"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - type: "sout"
  - wait_for:
      selector: '.cm-tooltip-autocomplete'
      timeout_sec: 10
  - press: "ArrowDown"
  - press: "ArrowUp"
  - press: "Enter"
  - wait_for:
      selector: '[data-testid="code-workspace-editor"]'
      timeout_sec: 10
  - press: "Control+z"
  - screenshot: tc-ide-c2-07-live-template-browser.png

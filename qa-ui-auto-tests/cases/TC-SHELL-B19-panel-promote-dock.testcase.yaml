id: TC-SHELL-B19
title: SFTP promotion and close to dock preserve the resource
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b19.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F7.4
- F1.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- click: '[data-testid="shell-host-more"]'
- click: '[data-testid="shell-panel-promote"]'
- assert_not_visible: '[data-testid="shell-host"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]:visible'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 1
    status: requested
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-cancel"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]:visible'
    equal: 1
- click: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-close"]'
- wait_for: '[data-testid="shell-close-dialog"]'
- click: '[data-testid="shell-close-dock"]'
- click: '[data-testid="shell-close-confirm"]'
- wait_for: '[data-testid="shell-host"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-edge
    equals: right
- assert_shell_backend:
    command: sftp_attach
    count: 1
    status: requested
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 2
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- screenshot: tc-shell-b19.png

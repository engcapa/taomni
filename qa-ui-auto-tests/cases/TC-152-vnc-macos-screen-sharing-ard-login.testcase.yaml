id: TC-152
title: VNC session logs in to macOS Screen Sharing with ARD and reports it in Session Information
description: 'Native macOS check for F9.2 against the real Screen Sharing server of the
  runner (ard_required): a saved VNC session with the macOS account name uses Apple
  Remote Desktop authentication (RFB security type 30), passes the per-attempt
  unencrypted-connection warning, connects, and Session Information reports ARD
  and the desktop size the Mac announced. The ARD login of a second account makes
  macOS switch the console to that account, so the app''s own (now background)
  session stops painting frames; frame pixels are covered by TC-151. The
  backgrounded app also answers the WebDriver bridge slowly: on the hosted runner
  the wait for the connected toolbar plus the next click took 26-50 s and once
  more than 45 s for the wait alone, so the waits after the login allow 120 s.

  '
covers:
- F9.1
- F9.6
tags:
- vnc
- p1
- macos
- session
modes:
- native
native_platforms:
- macOS
fixtures:
- reset_db
- ard_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${fixture.ard_host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.ard_port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${fixture.ard_user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-mac-ard
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-mac-ard"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-mac-ard"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_ARD_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 30
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-session-menu"]'
    timeout_sec: 120
- click: '[data-testid="vnc-session-menu"]'
- click: '[data-testid="vnc-menu-info"]'
- wait_for:
    selector: '[data-testid="vnc-session-info"]'
    timeout_sec: 120
- assert_text:
    selector: '[data-testid="vnc-session-info"]'
    contains: ARD (Apple Remote Desktop)
- assert_pattern:
    selector: '[data-testid="vnc-session-info"]'
    regex: '[1-9][0-9]* x [1-9][0-9]*'
- screenshot: 152-vnc-macos-ard.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A VNC session with the macOS account name logs in to Screen Sharing with ARD after the unencrypted-connection confirmation and connects.
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 11
    - 12
    - 14
    - 16
    - 17
    - 19
    checkpoints:
    - step: 3
      expectation: The session editor opens.
    - step: 10
      expectation: The bookmark section is shown.
    - step: 13
      expectation: The saved session appears in the session tree.
    - step: 15
      expectation: Opening the session asks for the password.
    - step: 18
      expectation: Screen Sharing is reached and the connection stops for the unencrypted-connection warning.
    - step: 20
      expectation: The ARD login succeeds and the in-session toolbar of a connected session appears.
    results:
    - 18
    - 20
  - id: R2
    requirement: Session Information names the ARD security method and the desktop size from the Mac's ServerInit.
    actions:
    - 21
    - 22
    checkpoints:
    - step: 23
      expectation: The Session Information dialog opens.
    - step: 24
      expectation: The security row reads ARD (Apple Remote Desktop).
    - step: 25
      expectation: The size row shows the width and height the Mac announced.
    results:
    - 23
    - 24
    - 25
  visual:
  - check: The Session Information dialog is readable over the session without clipping.
    method: manual
    reason: Layout of the dialog over a real session is judged from the screenshot.
  native:
  - check: Runs only on the hosted macOS runner (Screen Sharing on the same Mac, disposable admin account); Windows and Linux have no ARD server.
    method: automated
    reason: Proves the Rust ARD client against Apple's server; keyboard layouts and pointer input on macOS are not part of this case.

id: TC-152
title: VNC session logs in to macOS Screen Sharing with ARD and reports it in Session Information
description: 'Native macOS check for F9.2 against the real Screen Sharing server of the runner (ard_required): a saved VNC session with the macOS account name uses Apple Remote
  Desktop authentication (RFB security type 30), passes the per-attempt unencrypted-connection warning, asks for the password in the session only because ARD needs one (DEC-VNC-21),
  connects, and Session Information reports ARD and the desktop size the Mac announced. The ARD login of a second account makes macOS switch the console to that account, so
  the app''s own (now background) session stops painting frames; frame pixels are covered by TC-151. The backgrounded app also answers the WebDriver bridge slowly: on the hosted
  runner the wait for the connected toolbar plus the next click took 26-50 s and once more than 45 s for the wait alone, so the waits after the login allow 120 s. The opt-in isolated QA WebView disables inactive scheduling so its bridge can still inspect this real background login session; production launches keep their default policy.

  '
covers:
- F9.1
- F9.6
tags:
- vnc
- p1
- macos
- session
modes:
- native
native_platforms:
- macOS
fixtures:
- reset_db
- ard_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${fixture.ard_host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.ard_port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${fixture.ard_user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-mac-ard
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-mac-ard"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-mac-ard"]'
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 30
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-auth-password"]'
    timeout_sec: 30
- fill:
    selector: '[data-testid="vnc-auth-password"]'
    value: ${env.QA_ARD_PASSWORD}
- click: '[data-testid="vnc-auth-ok"]'
- click: '[data-testid="titlebar-actions-more"]'
- wait_for:
    selector: '[data-testid="vnc-session-menu"]'
    timeout_sec: 120
- click: '[data-testid="vnc-session-menu"]'
- click: '[data-testid="vnc-menu-info"]'
- wait_for:
    selector: '[data-testid="vnc-session-info"]'
    timeout_sec: 120
- assert_text:
    selector: '[data-testid="vnc-session-info"]'
    contains: ARD (Apple Remote Desktop)
- assert_pattern:
    selector: '[data-testid="vnc-session-info"]'
    regex: '[1-9][0-9]* x [1-9][0-9]*'
- screenshot: 152-vnc-macos-ard.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A VNC session with the macOS account name and no stored password reaches Screen Sharing, stops for the unencrypted-connection confirmation, asks for the
      password in the session because ARD needs one, and logs in with ARD.
    actions:
    - 1
    - 3
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 13
    - 15
    - 17
    - 19
    - 20
    - 21
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-mac-ard\"]"}'
    - step: 16
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-unencrypted-continue\"]", "timeout_sec": 30}}'
    - step: 18
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-auth-password\"]", "timeout_sec": 30}}'
    - step: 22
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-session-menu\"]", "timeout_sec": 120}}'
    results:
    - 16
    - 18
    - 22
  - id: R2
    requirement: Session Information names the ARD security method and the desktop size from the Mac's ServerInit.
    actions:
    - 23
    - 24
    checkpoints:
    - step: 25
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-session-info\"]", "timeout_sec": 120}}'
    - step: 26
      expectation: '{"assert_text": {"selector": "[data-testid=\"vnc-session-info\"]", "contains": "ARD (Apple Remote Desktop)"}}'
    - step: 27
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"vnc-session-info\"]", "regex": "[1-9][0-9]* x [1-9][0-9]*"}}'
    results:
    - 25
    - 26
    - 27
  visual:
  - check: The Session Information dialog is readable over the session without clipping.
    method: manual
    reason: Layout of the dialog over a real session is judged from the screenshot.
  native:
  - check: Runs only on the hosted macOS runner (Screen Sharing on the same Mac, disposable admin account); Windows and Linux have no ARD server.
    method: automated
    reason: Proves the Rust ARD client against Apple's server; keyboard layouts and pointer input on macOS are not part of this case.

        30}}'
    - step: 46
      expectation: '{"assert_count": {"selector": "[data-testid=\"git-log-file\"]", "equal": 1}}'
    results:
    - 38
    - 39
    - 40
    - 41
    - 43
    - 45
    - 46
  - id: GIT-R5
    requirement: Discard Cancel leaves the tracked worktree edit unchanged. Confirm restores it to HEAD and removes
      its change row while keeping the unrelated untracked manifest.
    actions:
    - 48
    - 49
    - 50
    - 52
    - 55
    - 56
    checkpoints:
    - step: 51
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 53
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "shell-qa", "status": {"long-lines.txt":
        " M", "git-diff-fixture-manifest.json": "??"}, "branches": ["${fixture.git_diff_branch}", "shell-qa"]}}'
    - step: 54
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_aux_repo}", "branch": "main", "head": "${fixture.git_diff_aux_head}",
        "status": {}, "branches": ["main"]}}'
    - step: 57
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "shell-qa", "head_subject":
        "SHELL Git commit 中文", "status": {"git-diff-fixture-manifest.json": "??"}, "timeout_sec": 30, "branches":
        ["${fixture.git_diff_branch}", "shell-qa"]}}'
    - step: 58
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_aux_repo}", "branch": "main", "head": "${fixture.git_diff_aux_head}",
        "status": {}, "branches": ["main"]}}'
    - step: 59
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-change-row\"][data-path=\"long-lines.txt\"]",
        "state": "detached"}}'
    results:
    - 51
    - 53
    - 54
    - 57
    - 58
    - 59
  visual:
  - check: Git controls, checked file count, confirmation branch and log remain readable in the bottom Host.
    method: manual
    reason: Retained screenshots require a visual verdict; functional correctness is established separately by UI
      and independent Git assertions.
  native:
  - check: Real index, branch creation, committed bytes, cancel safety, selected commit and tracked discard through
      Rust Git IPC.
    method: automated
    reason: The packaged QA WebView uses real IPC; the independent Git process checks exact disk state and never
      issues a mutation.

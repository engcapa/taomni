        "status": {}, "branches": ["main"]}}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"workspace-change-row\"][data-path=\"short.txt\"][aria-label$=\"
        Modified\"]"}'
    - step: 21
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "status": {"long-lines.txt": " M",
        "short.txt": "M ", "git-diff-fixture-manifest.json": "??"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-staged\n"},
        "branches": ["${fixture.git_diff_branch}"]}}'
    - step: 22
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_aux_repo}", "branch": "main", "head": "${fixture.git_diff_aux_head}",
        "status": {}, "branches": ["main"]}}'
    - step: 23
      expectation: '{"wait_for": "[data-testid=\"workspace-change-row\"][data-path=\"short.txt\"][aria-label$=\"

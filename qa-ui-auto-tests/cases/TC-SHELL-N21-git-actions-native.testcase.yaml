id: TC-SHELL-N21
title: Native Git Host stages, cancels, commits a checked file to a new branch and discards only confirmed changes
description: Shell retained Git workflow across Windows/Linux/macOS. Uses the real QA app, a disposable Git repository
  and independent read-only Git processes. No external remote or user repository is modified. The CLI oracle preserves
  the index and records its observed branch, HEAD, status and blobs for every decisive result. Uses the actual multi-repository
  Workspace Git UI with an independent clean companion. Every Git oracle also proves the companion retains its original
  branch/HEAD and zero changes, including after commit/discard and cancellation.
covers:
- F25.5
- F26.2
- F-SHELL-1
tags:
- p1
- workspace-shell
- git
- native-boundary
modes:
- native
fixtures:
- reset_db
- git_diff_repo
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-git-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "shell-git-actions", "name": "Shell Git actions", "roots": [{"id": "git-actions", "name": "git-actions",
      "path": "${fixture.git_diff_repo}", "kind": "folder"}, {"id": "git-companion", "name": "unchanged", "path":
      "${fixture.git_diff_aux_repo}", "kind": "git"}], "looseFiles": [], "lastOpenedAt": 3000, "isGitRepo": true,
      "lastActiveFile": {"kind": "root", "rootId": "git-actions", "path": "short.txt"}}]'
- seed_storage:
    key: taomni.git.workspace.changes.tree
    value: flat
    raw: true
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 60
- click: '[data-testid="code-workspace-git-panel-toggle"]'
- wait_for:
    selector: '[data-testid="workspace-change-row"][data-path="short.txt"]'
    timeout_sec: 60
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-edge
    equals: bottom
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    branch: ${fixture.git_diff_branch}
    head: ${fixture.git_diff_commit_b}
    status: &id001
      long-lines.txt: ' M'
      short.txt: 'M '
      git-diff-fixture-manifest.json: ??
    head_files:
      short.txt: 'short-001

        short-002

        short-003

        '
    index_files:
      short.txt: 'short-001

        short-002

        short-staged

        '
    branches:
    - ${fixture.git_diff_branch}
- git_assert_state:
    repo: ${fixture.git_diff_aux_repo}
    branch: main
    head: ${fixture.git_diff_aux_head}
    status: {}
    branches:
    - main
- click: '[data-testid="workspace-change-row"][data-path="short.txt"]'
- click: '[data-testid="git-diff-unstage"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    status:
      long-lines.txt: ' M'
      short.txt: ' M'
      git-diff-fixture-manifest.json: ??
    index_files:
      short.txt: 'short-001

        short-002

        short-003

        '
    branches:
    - ${fixture.git_diff_branch}
- git_assert_state:
    repo: ${fixture.git_diff_aux_repo}
    branch: main
    head: ${fixture.git_diff_aux_head}
    status: {}
    branches:
    - main
- wait_for: '[data-testid="workspace-change-row"][data-path="short.txt"][aria-label$=" Modified"]'
- click: '[data-testid="git-diff-stage"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    status: *id001
    index_files:

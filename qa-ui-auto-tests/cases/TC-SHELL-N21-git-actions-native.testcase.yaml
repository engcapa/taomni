    state: detached
- screenshot: shell-git-discarded.png
verification:
  review: reviewed
  requirements:
  - id: GIT-R1
    requirement: Opening the repository through Home and the workspace Git action presents the bottom Host and reads
      the real initial branch, HEAD, index and worktree without changing them.
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 8
    - 10
    checkpoints:
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content", "timeout_sec":
        60}}'
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-change-row\"][data-path=\"short.txt\"]",
        "timeout_sec": 60}}'
    - step: 12
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-host\"]", "name": "data-edge", "equals":
        "bottom"}}'
    - step: 13
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "${fixture.git_diff_branch}",
        "head": "${fixture.git_diff_commit_b}", "status": {"long-lines.txt": " M", "short.txt": "M ", "git-diff-fixture-manifest.json":
        "??"}, "head_files": {"short.txt": "short-001\nshort-002\nshort-003\n"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-staged\n"},
        "branches": ["${fixture.git_diff_branch}"]}}'
    - step: 14
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_aux_repo}", "branch": "main", "head": "${fixture.git_diff_aux_head}",
        "status": {}, "branches": ["main"]}}'
    results:
    - 9
    - 11
    - 12
    - 13
    - 14
  - id: GIT-R2
    requirement: Unstage restores the tracked index blob; Stage adds the exact worktree blob again. Independent
      porcelain and UI labels agree after each operation.
    actions:
    - 15
    - 16
    - 20
    checkpoints:
    - step: 17
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "status": {"long-lines.txt": " M",
        "short.txt": " M", "git-diff-fixture-manifest.json": "??"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-003\n"},
        "branches": ["${fixture.git_diff_branch}"]}}'
    - step: 18

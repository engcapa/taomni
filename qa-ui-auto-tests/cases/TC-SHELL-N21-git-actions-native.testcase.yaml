- git_assert_state:
    repo: ${fixture.git_diff_aux_repo}
    branch: main
    head: ${fixture.git_diff_aux_head}
    status: {}
    branches:
    - main
- click: '[data-testid="git-diff-discard"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- git_assert_state:

id: TC-SHELL-N21
title: Native Git Host stages, cancels, commits a checked file to a new branch and discards only confirmed
  changes
description: Shell retained Git workflow across Windows/Linux/macOS. Uses the real QA app, a disposable Git
  repository and independent read-only Git processes. No external remote or user repository is modified. The
  CLI oracle preserves the index and records its observed branch, HEAD, status and blobs for every decisive
  result.
covers:
- F25.5
- F26.2
- F-SHELL-1
tags:
- p1
- workspace-shell
- git
- native-boundary
modes:
- native
fixtures:
- reset_db
- git_diff_repo
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-git-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "shell-git-actions", "name": "Shell Git actions", "roots": [{"id": "git-actions", "name":
      "git-actions", "path": "${fixture.git_diff_repo}", "kind": "folder"}], "looseFiles": [], "lastOpenedAt":
      3000, "isGitRepo": true, "lastActiveFile": {"kind": "root", "rootId": "git-actions", "path": "short.txt"}}]'
- seed_storage:
    key: taomni.git.workspace.changes.tree
    value: '"flat"'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 60
- click: '[data-testid="code-workspace-git-panel-toggle"]'
- wait_for:
    selector: '[data-testid="workspace-change-row"][data-path="short.txt"]'
    timeout_sec: 60
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-edge
    equals: bottom
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    branch: ${fixture.git_diff_branch}
    head: ${fixture.git_diff_commit_b}
    status: &id001
      long-lines.txt: ' M'
      short.txt: 'M '
      git-diff-fixture-manifest.json: ??
    head_files:
      short.txt: 'short-001

        short-002

        short-003

        '
    index_files:
      short.txt: 'short-001

        short-002

        short-staged

        '
- click: '[data-testid="workspace-change-row"][data-path="short.txt"]'
- click: '[data-testid="git-diff-unstage"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    status:
      long-lines.txt: ' M'
      short.txt: ' M'
      git-diff-fixture-manifest.json: ??
    index_files:
      short.txt: 'short-001

        short-002

        short-003

        '
- wait_for: '[data-testid="workspace-change-row"][data-path="short.txt"][aria-label$=" Modified"]'
- click: '[data-testid="git-diff-stage"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    status: *id001
    index_files:
      short.txt: 'short-001

        short-002

        short-staged

        '
- wait_for: '[data-testid="workspace-change-row"][data-path="short.txt"][aria-label$=" Staged"]'
- set_check:
    selector: '[data-testid="workspace-change-row"][data-path="long-lines.txt"] input[type="checkbox"]'
    checked: false
- set_check:
    selector: '[data-testid="workspace-change-row"][data-path="git-diff-fixture-manifest.json"] input[type="checkbox"]'
    checked: false
- fill:
    selector: '[aria-label="Commit target branch"]'
    value: shell-qa
- fill:
    selector: textarea[placeholder="Commit message"]
    value: 'SHELL Git commit 中文


      Only checked short.txt'
- click: '[data-testid="git-commit-submit"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: shell-qa
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: 1 file(s)
- click: '[data-testid="confirm-dialog-cancel"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    branch: ${fixture.git_diff_branch}
    head: ${fixture.git_diff_commit_b}
    status: *id001
    index_files:
      short.txt: 'short-001

        short-002

        short-staged

        '
- assert_value:
    selector: textarea[placeholder="Commit message"]
    equals: 'SHELL Git commit 中文


      Only checked short.txt'
- click: '[data-testid="git-commit-submit"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    branch: shell-qa
    head_subject: SHELL Git commit 中文
    status: &id002
      long-lines.txt: ' M'
      git-diff-fixture-manifest.json: ??
    head_files:
      short.txt: 'short-001

        short-002

        short-staged

        '
    index_files:
      short.txt: 'short-001

        short-002

        short-staged

        '
    timeout_sec: 30
- assert_value:
    selector: textarea[placeholder="Commit message"]
    equals: ''
- wait_for:
    selector: '[data-testid="workspace-change-row"][data-path="short.txt"]'
    state: detached
- click: '[data-testid="git-log-tab"]'
- assert_text:
    selector: '[data-testid="git-log-commit"]'
    contains: SHELL Git commit 中文
    timeout_sec: 30
- click: '[data-testid="git-log-commit"]'
- wait_for:
    selector: '[data-testid="git-log-file"][data-path="short.txt"]'
    timeout_sec: 30
- assert_count:
    selector: '[data-testid="git-log-file"]'
    equal: 1
- screenshot: shell-git-committed-log.png
- click: '[data-testid="git-changes-tab"]'
- click: '[data-testid="workspace-change-row"][data-path="long-lines.txt"]'
- click: '[data-testid="git-diff-discard"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-cancel"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    branch: shell-qa
    status: *id002
- click: '[data-testid="git-diff-discard"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- git_assert_state:
    repo: ${fixture.git_diff_repo}
    branch: shell-qa
    head_subject: SHELL Git commit 中文
    status:
      git-diff-fixture-manifest.json: ??
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="workspace-change-row"][data-path="long-lines.txt"]'
    state: detached
- screenshot: shell-git-discarded.png
verification:
  review: reviewed
  requirements:
  - id: GIT-R1
    requirement: Opening the repository through Home and the workspace Git action presents the bottom Host
      and reads the real initial branch, HEAD, index and worktree without changing them.
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 8
    - 10
    checkpoints:
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content", "timeout_sec":
        60}}'
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-change-row\"][data-path=\"short.txt\"]",
        "timeout_sec": 60}}'
    - step: 12
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-host\"]", "name": "data-edge",
        "equals": "bottom"}}'
    - step: 13
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "${fixture.git_diff_branch}",
        "head": "${fixture.git_diff_commit_b}", "status": {"long-lines.txt": " M", "short.txt": "M ", "git-diff-fixture-manifest.json":
        "??"}, "head_files": {"short.txt": "short-001\nshort-002\nshort-003\n"}, "index_files": {"short.txt":
        "short-001\nshort-002\nshort-staged\n"}}}'
    results:
    - 9
    - 11
    - 12
    - 13
  - id: GIT-R2
    requirement: Unstage restores the tracked index blob; Stage adds the exact worktree blob again. Independent
      porcelain and UI labels agree after each operation.
    actions:
    - 14
    - 15
    - 18
    checkpoints:
    - step: 16
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "status": {"long-lines.txt":
        " M", "short.txt": " M", "git-diff-fixture-manifest.json": "??"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-003\n"}}}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"workspace-change-row\"][data-path=\"short.txt\"][aria-label$=\"
        Modified\"]"}'
    - step: 19
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "status": {"long-lines.txt":
        " M", "short.txt": "M ", "git-diff-fixture-manifest.json": "??"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-staged\n"}}}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"workspace-change-row\"][data-path=\"short.txt\"][aria-label$=\"
        Staged\"]"}'
    results:
    - 16
    - 17
    - 19
    - 20
  - id: GIT-R3
    requirement: Commit confirmation names the new branch and one checked file. Cancel preserves the original
      branch and HEAD, index, unchecked changes and the full multiline draft.
    actions:
    - 21
    - 22
    - 23
    - 24
    - 25
    - 29
    checkpoints:
    - step: 26
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 27
      expectation: '{"assert_text": {"selector": "[data-testid=\"confirm-dialog-message\"]", "contains": "shell-qa"}}'
    - step: 28
      expectation: '{"assert_text": {"selector": "[data-testid=\"confirm-dialog-message\"]", "contains": "1
        file(s)"}}'
    - step: 30
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "${fixture.git_diff_branch}",
        "head": "${fixture.git_diff_commit_b}", "status": {"long-lines.txt": " M", "short.txt": "M ", "git-diff-fixture-manifest.json":
        "??"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-staged\n"}}}'
    - step: 31
      expectation: '{"assert_value": {"selector": "textarea[placeholder=\"Commit message\"]", "equals": "SHELL
        Git commit 中文\n\nOnly checked short.txt"}}'
    results:
    - 26
    - 27
    - 28
    - 30
    - 31
  - id: GIT-R4
    requirement: Confirm creates the target branch and commits only short.txt with exact bytes. Unchecked changes
      remain, the draft clears, and the real commit log lists exactly that file.
    actions:
    - 32
    - 33
    - 37
    - 39
    checkpoints:
    - step: 34
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "shell-qa", "head_subject":
        "SHELL Git commit 中文", "status": {"long-lines.txt": " M", "git-diff-fixture-manifest.json": "??"},
        "head_files": {"short.txt": "short-001\nshort-002\nshort-staged\n"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-staged\n"},
        "timeout_sec": 30}}'
    - step: 35
      expectation: '{"assert_value": {"selector": "textarea[placeholder=\"Commit message\"]", "equals": ""}}'
    - step: 36
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-change-row\"][data-path=\"short.txt\"]",
        "state": "detached"}}'
    - step: 38
      expectation: '{"assert_text": {"selector": "[data-testid=\"git-log-commit\"]", "contains": "SHELL Git
        commit 中文", "timeout_sec": 30}}'
    - step: 40
      expectation: '{"wait_for": {"selector": "[data-testid=\"git-log-file\"][data-path=\"short.txt\"]", "timeout_sec":
        30}}'
    - step: 41
      expectation: '{"assert_count": {"selector": "[data-testid=\"git-log-file\"]", "equal": 1}}'
    results:
    - 34
    - 35
    - 36
    - 38
    - 40
    - 41
  - id: GIT-R5
    requirement: Discard Cancel leaves the tracked worktree edit unchanged. Confirm restores it to HEAD and
      removes its change row while keeping the unrelated untracked manifest.
    actions:
    - 43
    - 44
    - 45
    - 47
    - 49
    - 50
    checkpoints:
    - step: 46
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 48
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "shell-qa", "status":
        {"long-lines.txt": " M", "git-diff-fixture-manifest.json": "??"}}}'
    - step: 51
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "branch": "shell-qa", "head_subject":
        "SHELL Git commit 中文", "status": {"git-diff-fixture-manifest.json": "??"}, "timeout_sec": 30}}'
    - step: 52
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-change-row\"][data-path=\"long-lines.txt\"]",
        "state": "detached"}}'
    results:
    - 46
    - 48
    - 51
    - 52
  visual:
  - check: Git controls, checked file count, confirmation branch and log remain readable in the bottom Host.
    method: manual
    reason: Retained screenshots require a visual verdict; functional correctness is established separately
      by UI and independent Git assertions.
  native:
  - check: Real index, branch creation, committed bytes, cancel safety, selected commit and tracked discard
      through Rust Git IPC.
    method: automated
    reason: The packaged QA WebView uses real IPC; the independent Git process checks exact disk state and
      never issues a mutation.

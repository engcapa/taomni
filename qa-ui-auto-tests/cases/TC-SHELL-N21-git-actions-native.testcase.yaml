    requirement: Commit confirmation names the new branch and one checked file. Cancel preserves the original branch
      and HEAD, index, unchecked changes and the full multiline draft.
    actions:
    - 24
    - 25
    - 26
    - 27
    - 28
    - 32
    checkpoints:
    - step: 29
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 30

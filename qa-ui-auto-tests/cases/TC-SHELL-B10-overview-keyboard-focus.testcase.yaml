id: TC-SHELL-B10
title: Overview focus, activation and deletion successor
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b10.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-overview-trigger"]'
- eval_readonly:
    expression: document.activeElement.getAttribute('data-testid') === 'shell-tab-search'
    expect_truthy: true
    timeout_sec: 5
- fill:
    selector: '[data-testid="shell-tab-search"]'
    value: qa-alpha
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Enter
- assert_not_visible: '[data-testid="shell-overview"]'
- assert_text_equals:
    selector: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
    equals: qa-alpha
- click: '[data-testid="shell-overview-trigger"]'
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Escape
- eval_readonly:
    expression: document.activeElement.getAttribute('data-testid') === 'shell-overview-trigger'
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid="shell-overview-trigger"]'
- press:
    selector: '[data-testid="shell-tab-card"][data-tab-type="terminal"]:has-text("qa-alpha")
      [data-testid="shell-tab-card-open"]'
    key: Delete
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 2
- eval_readonly:
    expression: document.activeElement.getAttribute('data-testid') === 'shell-tab-card-open'
    expect_truthy: true
    timeout_sec: 5
- assert_count:
    selector: '[data-testid="shell-tab-card"]:has-text("qa-beta")'
    equal: 1
- screenshot: tc-shell-b10.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Overview starts at search; activation selects Alpha once and Escape
      restores the opener.
    actions:
    - 3
    - 4
    - 6
    - 7
    - 9
    - 11
    - 12
    - 15
    - 16
    checkpoints:
    - step: 5
      expectation: Overview starts at search; activation selects Alpha once and Escape
        restores the opener.
    - step: 8
      expectation: Overview starts at search; activation selects Alpha once and Escape
        restores the opener.
    - step: 10
      expectation: Overview starts at search; activation selects Alpha once and Escape
        restores the opener.
    - step: 13
      expectation: Overview starts at search; activation selects Alpha once and Escape
        restores the opener.
    - step: 14
      expectation: Overview starts at search; activation selects Alpha once and Escape
        restores the opener.
    - step: 17
      expectation: Overview starts at search; activation selects Alpha once and Escape
        restores the opener.
    results:
    - 5
    - 8
    - 10
    - 13
    - 14
    - 17
  - id: R2
    requirement: Deleting focused Alpha keeps the overview open, removes just Alpha
      and places focus on a surviving card.
    actions:
    - 18
    - 19
    checkpoints:
    - step: 20
      expectation: Deleting focused Alpha keeps the overview open, removes just Alpha
        and places focus on a surviving card.
    - step: 21
      expectation: Deleting focused Alpha keeps the overview open, removes just Alpha
        and places focus on a surviving card.
    - step: 22
      expectation: Deleting focused Alpha keeps the overview open, removes just Alpha
        and places focus on a surviving card.
    results:
    - 20
    - 21
    - 22
  visual:
  - check: Inspect the final screenshot for readable controls, clipping and overlay
      placement.
    method: manual
    reason: Screenshots require a visual verdict; geometry assertions are recorded
      separately.
  native:
  - check: Tauri, OS window, physical input and real service effects
    method: not-applicable
    reason: This case is browser renderer coverage; paired TC-SHELL-N cases cover
      native boundaries.

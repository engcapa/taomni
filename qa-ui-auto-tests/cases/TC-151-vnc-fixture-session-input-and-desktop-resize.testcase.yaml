id: TC-151
title: VNC session reaches the hosted RFB fixture, relays input and follows a remote resize
description: 'Real RFB session for F9.6 against the scriptable VNC fixture (vnc_required): the per-attempt
  unencrypted-connection warning, then VNCAuth through the session''s own authentication form (asked only
  because the server requires a password, DEC-VNC-21), first frame at the framebuffer size, pointer/key/Ctrl+Alt+Del
  arrival in the fixture''s event log, and a server DesktopSize change. Native mode exercises the Rust
  RFB client and relay; browser mode exercises the same panel through the dev-server VNC bridge.

  '
covers:
- F9.6
tags:
- vnc
- p1
- session
modes:
- browser
- native
fixtures:
- reset_db
- vnc_required
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${fixture.vnc_host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.vnc_port}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-vnc-fixture
- click: '[data-testid="session-save"]'
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-fixture"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-fixture"]'
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 20
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-auth-password"]'
    timeout_sec: 20
- fill:
    selector: '[data-testid="vnc-auth-password"]'
    value: ${env.QA_VNC_PASSWORD}
- click: '[data-testid="vnc-auth-ok"]'
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]'
    timeout_sec: 20
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "auth", "ok": true, "security": "VNCAuth"'
- click: '[data-testid="vnc-canvas"]'
- press:
    key: a
    selector: '[data-testid="vnc-canvas"]'
- click: '[data-testid="vnc-send-cad"]'
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "pointer", "mask": 1'
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"keysym": 97, "keysym_hex": "0x61"'
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"keysym": 65535, "keysym_hex": "0xffff"'
- host_write_file:
    path: ${fixture.vnc_control}
    text: 'resize 1024 768

      '
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1024"][height="768"]'
    timeout_sec: 15
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "desktop_size", "width": 1024, "height": 768'
- screenshot: 151-vnc-fixture-session.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A saved VNC session without a stored password connects first, stops for the per-attempt
      unencrypted-connection confirmation, asks for the password only because the fixture requires VNCAuth,
      and then paints the remote desktop at its framebuffer size without warning again.
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 7
    - 8
    - 10
    - 11
    - 12
    - 14
    - 16
    - 18
    - 19
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-vnc-fixture\"]"}'
    - step: 15
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-unencrypted-continue\"]", "timeout_sec":
        20}}'
    - step: 17
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-auth-password\"]", "timeout_sec": 20}}'
    - step: 20
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-canvas\"][width=\"1280\"][height=\"720\"]",
        "timeout_sec": 20}}'
    - step: 21
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"type\":
        \"auth\", \"ok\": true, \"security\": \"VNCAuth\""}}'
    results:
    - 20
    - 21
  - id: R2
    requirement: Pointer, keyboard and the Ctrl+Alt+Del action reach the remote desktop as RFB pointer
      and key events.
    actions:
    - 22
    - 23
    - 24
    checkpoints:
    - step: 25
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"type\":
        \"pointer\", \"mask\": 1"}}'
    - step: 26
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"keysym\":
        97, \"keysym_hex\": \"0x61\""}}'
    - step: 27
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"keysym\":
        65535, \"keysym_hex\": \"0xffff\""}}'
    results:
    - 25
    - 26
    - 27
  - id: R3
    requirement: A server DesktopSize change resizes the canvas to the new framebuffer.
    actions:
    - 28
    checkpoints:
    - step: 29
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-canvas\"][width=\"1024\"][height=\"768\"]",
        "timeout_sec": 15}}'
    - step: 30
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"type\":
        \"desktop_size\", \"width\": 1024, \"height\": 768"}}'
    results:
    - 29
    - 30
  visual:
  - check: The connected session shows the fixture's gradient desktop without overlays, letterboxing or
      clipped tab actions.
    method: manual
    reason: DOM and event-log assertions do not judge the rendered pixels.
  native:
  - check: Native mode drives the Rust RFB client and WebSocket relay; browser mode drives the dev-server
      VNC bridge (None/VNCAuth, Raw, DesktopSize) and proves only the shared panel workflow.
    method: automated
    reason: The fixture is synthetic; OS input, the system clipboard, encodings and real VNC servers stay
      covered by the VNC skill's native scenarios.

id: TC-DB-EXEC-001-execution-log-browser
title: Execution log records a failed statement and the statements that did not run
description: |
  DB-EXEC-001 V4. Opens the offline MySQL session scaffold (browser preview has
  no database, so every statement fails), runs two statements with the Run
  toolbar button, answers Stop in the DB-EXEC-002 error prompt, and verifies the
  Log tab becomes active with one FAILED and one NOT RUN entry plus a summary. Success paths are covered by the native case
  TC-DB-EXEC-001-execution-log-native.
covers:
- F-DB-1
tags:
- database
- sql
- execution-log
- db-parity
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- wait_for: '[data-testid="sidebar"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: db-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '3306'
- fill:
    selector: input[aria-label="Database username"]
    value: qa_user
- fill:
    selector: input[aria-label="Database name"]
    value: qa_db
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-db-exec-log
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-db-exec-log"]'
- open_session:
    name: qa-db-exec-log
    double_click: true
- wait_for: '[data-testid="db-connection-error-banner"]'
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: SELECT 1 AS a; SELECT 2 AS b;
- click: '[data-testid="db-run-all"]'
- wait_for: '[data-testid="choice-dialog"]'
- click: '[data-testid="choice-dialog-cancel"]'
- wait_for: '[data-testid="db-execution-log"]'
- assert_attribute:
    selector: '[data-testid="result-log-tab"]'
    name: data-active
    equals: 'true'
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="failed"]'
    equal: 1
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="not-run"]'
    equal: 1
- assert_text:
    selector: '[data-testid="db-execution-log-summary"]'
    contains: 'Failed: 1'
- assert_text:
    selector: '[data-testid="db-execution-log-summary"]'
    contains: 'Not run: 1'
- click: '[data-testid="result-sheet-tab"]'
- assert_not_visible: '[data-testid="db-execution-log"]'
- click: '[data-testid="result-log-tab"]'
- wait_for: '[data-testid="db-execution-log"]'
- click: '[data-testid="shell-rail-home"]'
- assert_not_visible: '[data-testid="sql-editor"]'
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="database"] [data-testid="shell-tab-card-open"]'
- assert_count:
    selector: '[data-testid="sql-editor"]'
    equal: 1
- assert_items:
    selector: '[data-testid="sql-editor"] .cm-line'
    equals:
    - SELECT 1 AS a; SELECT 2 AS b;
- assert_attribute:
    selector: '[data-testid="result-log-tab"]'
    name: data-active
    equals: 'true'
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="failed"]'
    equal: 1
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="not-run"]'
    equal: 1
- screenshot: db-exec-001-execution-log-browser.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Navigate from Home to Sessions, save and open the fixture MySQL bookmark, and reach the
      declared offline connection banner.
    actions:
    - 1
    - 2
    - 5
    - 7
    - 9
    - 10
    - 11
    - 12
    - 13
    - 15
    - 16
    - 18
    checkpoints:
    - step: 3
      expectation: the Sessions Navigator is visible.
    - step: 4
      expectation: the New session control is visible.
    - step: 6
      expectation: the session editor is visible.
    - step: 8
      expectation: the MySQL settings is visible.
    - step: 14
      expectation: the bookmark editor is visible.
    - step: 17
      expectation: The fixture session or saved query is visible at [data-testid="session-tree-item"][data-session-name="qa-db-exec-log"].
    - step: 19
      expectation: the expected offline connection banner is visible.
    results:
    - 3
    - 4
    - 6
    - 8
    - 14
    - 17
    - 19
  - id: R2
    requirement: Run two offline statements, choose Stop after the first failure, and retain one FAILED
      / one NOT RUN entry, their summary and the complete SQL across Home and Overview return.
    actions:
    - 20
    - 21
    - 22
    - 23
    - 25
    - 32
    - 34
    - 36
    - 38
    - 39
    checkpoints:
    - step: 24
      expectation: the statement error choice is visible.
    - step: 26
      expectation: the execution log is visible.
    - step: 27
      expectation: '[data-testid="result-log-tab"] exposes data-active=''true''.'
    - step: 28
      expectation: Exactly 1 elements match [data-testid="db-execution-log-entry"][data-status="failed"].
    - step: 29
      expectation: Exactly 1 elements match [data-testid="db-execution-log-entry"][data-status="not-run"].
    - step: 30
      expectation: '[data-testid="db-execution-log-summary"] contains the required text ''Failed: 1''.'
    - step: 31
      expectation: '[data-testid="db-execution-log-summary"] contains the required text ''Not run: 1''.'
    - step: 33
      expectation: the execution log is hidden.
    - step: 35
      expectation: the execution log is visible.
    - step: 37
      expectation: the complete SQL editor is hidden.
    - step: 40
      expectation: Exactly 1 elements match [data-testid="sql-editor"].
    - step: 41
      expectation: The complete editor lines equal ['SELECT 1 AS a; SELECT 2 AS b;'].
    - step: 42
      expectation: '[data-testid="result-log-tab"] exposes data-active=''true''.'
    - step: 43
      expectation: Exactly 1 elements match [data-testid="db-execution-log-entry"][data-status="failed"].
    - step: 44
      expectation: Exactly 1 elements match [data-testid="db-execution-log-entry"][data-status="not-run"].
    results:
    - 24
    - 26
    - 27
    - 28
    - 29
    - 30
    - 31
    - 33
    - 35
    - 37
    - 40
    - 41
    - 42
    - 43
    - 44
  visual:
  - check: Inspect SQL toolbar, result log or Query Library inside the current Shell for clipping and
      readable controls.
    method: manual
    reason: DOM assertions need a separate screenshot verdict.
  native:
  - check: Real database connection, execution and transaction effects
    method: not-applicable
    reason: This browser case explicitly uses offline IPC preview; paired native DB cases prove real SQL
      and transaction effects.

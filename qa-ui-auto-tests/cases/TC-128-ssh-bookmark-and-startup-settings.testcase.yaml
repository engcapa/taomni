id: TC-128
title: SSH bookmark folder appearance safety and startup settings controls
covers:
- F6.3
tags:
- ssh
- session
- settings
- bookmark
- startup
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 45
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: bookmark.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-bookmark-user
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- assert_visible: '[data-testid="session-folder-select"]'
- click: '[data-testid="session-custom-icon"]'
- fill:
    selector: input[aria-label="Custom session icon"]
    value: ★
- assert_attribute:
    selector: input[aria-label="Custom session icon"]
    name: value
    equals: ★
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-bookmark
- assert_attribute:
    selector: '[data-testid="session-name"]'
    name: value
    equals: qa-ui-auto-ssh-bookmark
- select_option:
    selector: '[data-testid="session-folder-select"]'
    label: User sessions / Development
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions / Development
- click: '[data-testid="session-new-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: QA SSH / Bookmark
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions / QA SSH / Bookmark
- fill:
    selector: input[aria-label="Background image"]
    value: /tmp/qa-ssh-bookmark.png
- assert_attribute:
    selector: input[aria-label="Background image"]
    name: value
    equals: /tmp/qa-ssh-bookmark.png
- click: '[data-testid="session-background-browse"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: /tmp/qa-ssh-selected-background.png
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_attribute:
    selector: input[aria-label="Background image"]
    name: value
    equals: /tmp/qa-ssh-selected-background.png
- fill:
    selector: input[aria-label="Background opacity"]
    value: 42%
- assert_attribute:
    selector: input[aria-label="Background opacity"]
    name: value
    equals: 42%
- fill:
    selector: textarea[aria-label="Description notes"]
    value: SSH bookmark description
- assert_attribute:
    selector: textarea[aria-label="Description notes"]
    name: value
    equals: SSH bookmark description
- fill:
    selector: input[aria-label="Tags"]
    value: ssh,bookmark,qa
- assert_attribute:
    selector: input[aria-label="Tags"]
    name: value
    equals: ssh,bookmark,qa
- set_check:
    selector: '[data-testid="session-disable-ai-write"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="session-disable-ai-write"]'
    name: data-checked
    equals: 'true'
- set_check:
    selector: '[data-testid="session-auto-connect"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-auto-connect"]'
    name: data-checked
    equals: 'false'
- set_check:
    selector: '[data-testid="session-open-new-window"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="session-open-new-window"]'
    name: data-checked
    equals: 'true'
- set_check:
    selector: '[data-testid="session-reconnect"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-reconnect"]'
    name: data-checked
    equals: 'false'
- fill:
    selector: input[aria-label="Keyboard shortcut"]
    value: Ctrl+Alt+9
- assert_attribute:
    selector: input[aria-label="Keyboard shortcut"]
    name: value
    equals: Ctrl+Alt+9
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-bookmark"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-bookmark"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- assert_attribute:
    selector: '[data-testid="session-name"]'
    name: value
    equals: qa-ui-auto-ssh-bookmark
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions / QA SSH / Bookmark
- assert_attribute:
    selector: textarea[aria-label="Description notes"]
    name: value
    equals: SSH bookmark description
- assert_attribute:
    selector: input[aria-label="Tags"]
    name: value
    equals: ssh,bookmark,qa
- assert_attribute:
    selector: '[data-testid="session-disable-ai-write"]'
    name: data-checked
    equals: 'true'
- hover: '[data-testid="session-custom-icon"]'
- click: '[data-testid="session-custom-icon"]'
- assert_attribute:
    selector: input[aria-label="Custom session icon"]
    name: value
    equals: ★
- assert_attribute:
    selector: input[aria-label="Background image"]
    name: value
    equals: /tmp/qa-ssh-selected-background.png
- assert_attribute:
    selector: input[aria-label="Background opacity"]
    name: value
    equals: 42%
- assert_attribute:
    selector: input[aria-label="Keyboard shortcut"]
    name: value
    equals: Ctrl+Alt+9
- assert_attribute:
    selector: '[data-testid="session-auto-connect"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-open-new-window"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-reconnect"]'
    name: data-checked
    equals: 'false'
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 128-ssh-bookmark-and-startup-settings.png
- assert_not_visible: '[data-testid="session-editor"]'

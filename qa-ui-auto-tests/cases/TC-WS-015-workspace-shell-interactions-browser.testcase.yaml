id: TC-WS-015
title: Workspace shell controls, dialog drag/resize/close and scoped context pane
description: 'Browser coverage for the Workspace-first shell''s high frequency controls. It checks that the new-workspace

  and command dialogs stay usable at desktop width, expose stable drag/resize/close affordances, and preserve the

  workspace canvas when the context pane is toggled.'
covers:
- F-Workspace-1
tags:
- workspace-first
- shell-layout
- dialog
- splitter
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- set_viewport:
    width: 1440
    height: 900
- wait_for: '[data-testid="workspace-navigator"]'
- click: '[data-testid="workspace-create"]'
- wait_for: '[data-testid="workspace-create-dialog"]'
- eval_readonly:
    expression: 'document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''"workspace-create-dialog"]'').getBoundingClientRect().width

      > 559 && document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''"workspace-create-dialog"]'').getBoundingClientRect().width

      < 561'
    expect_truthy: true
- assert_attribute:
    selector: '[data-testid="workspace-create-submit"]'
    name: disabled
    equals: ''
- drag_to:
    from: '[data-testid="workspace-dialog-resize-handle"]'
    by:
      dx: 100
      dy: 80
      steps: 8
- eval_readonly:
    expression: 'document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''"workspace-create-dialog"]'').getBoundingClientRect().width

      > 658 && document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''"workspace-create-dialog"]'').getBoundingClientRect().width

      < 662'
    expect_truthy: true
- drag_to:
    from: '[data-testid="workspace-dialog-drag-handle"]'
    by:
      dx: 80
      dy: 60
      steps: 8
- eval_readonly:
    expression: 'document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''"workspace-create-dialog"]'').getBoundingClientRect().left

      > 518 && document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''"workspace-create-dialog"]'').getBoundingClientRect().top

      > 166'
    expect_truthy: true
- screenshot: workspace-dialog-dragged.png
- press:
    selector: '[data-testid="workspace-dialog-resize-handle"]'
    key: ArrowRight
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"workspace-create-dialog"]').getBoundingClientRect().width
      > 668 && document.querySelector('[data-testid' + String.fromCharCode(61) + '"workspace-create-dialog"]').getBoundingClientRect().width
      < 672
    expect_truthy: true
- press:
    selector: '[data-testid="workspace-dialog-resize-handle"]'
    key: Tab
- eval_readonly:
    expression: document.activeElement?.getAttribute("data-testid") === "workspace-dialog-close"
    expect_truthy: true
- press:
    selector: '[data-testid="workspace-dialog-close"]'
    key: Shift+Tab
- eval_readonly:
    expression: document.activeElement?.getAttribute("data-testid") === "workspace-dialog-resize-handle"
    expect_truthy: true
- drag_to:
    from: '[data-testid="workspace-dialog-drag-handle"]'
    by:
      dx: 1200
      dy: 800
      steps: 8
- assert_element_geometry:
    selector: '[data-testid="workspace-create-dialog"]'
    min_width: 360
    min_height: 180
    viewport_margin: 10
- set_viewport:
    width: 400
    height: 700
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"workspace-create-dialog"]').getBoundingClientRect().right
      <= window.innerWidth - 10 && document.querySelector('[data-testid' + String.fromCharCode(61) + '"workspace-create-dialog"]').getBoundingClientRect().bottom
      <= window.innerHeight - 10
    expect_truthy: true
    timeout_sec: 10
- assert_element_geometry:
    selector: '[data-testid="workspace-create-dialog"]'
    min_width: 300
    min_height: 180
    viewport_margin: 10
- assert_element_geometry:
    selector: '[data-testid="workspace-name-input"]'
    min_width: 240
    min_height: 20
    viewport_margin: 10
- screenshot: workspace-dialog-narrow.png
- click: '[data-testid="workspace-dialog-close"]'
- assert_not_visible: '[data-testid="workspace-create-dialog"]'
- eval_readonly:
    expression: document.activeElement === document.querySelector('[data-testid' + String.fromCharCode(61) + '"workspace-create"]')
    expect_truthy: true
- set_viewport:
    width: 1440
    height: 900
- click: '[data-testid="workspace-create"]'
- wait_for: '[data-testid="workspace-create-dialog"]'
- fill:
    selector: '[data-testid="workspace-name-input"]'
    value: UI Interaction Fixture
- click: '[data-testid="workspace-create-submit"]'
- assert_not_visible: '[data-testid="workspace-create-dialog"]'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: UI Interaction Fixture
- click: '[data-testid="global-search"]'
- wait_for: '[data-testid="command-center"]'
- fill:
    selector: '[data-testid="command-center-search"]'
    value: QA Main
- click: '[data-testid="command-center"] button:has-text("Workspace · QA Main")'
- assert_not_visible: '[data-testid="command-center"]'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: Workspace · QA Main
- click: '[data-testid="workspace-context-toggle"]'
- wait_for: '[data-testid="workspace-context-pane"]'
- click: '[data-testid="workspace-context-close"]'
- assert_not_visible: '[data-testid="workspace-context-pane"]'
- eval_readonly:
    expression: document.activeElement === document.querySelector('[data-testid' + String.fromCharCode(61) + '"workspace-context-toggle"]')
    expect_truthy: true
- screenshot: workspace-shell-interactions.png
- click: '[data-testid="global-search"]'
- wait_for: '[data-testid="command-center"]'
- press: Escape
- assert_not_visible: '[data-testid="command-center"]'
- eval_readonly:
    expression: document.activeElement === document.querySelector('[data-testid' + String.fromCharCode(61) + '"global-search"]')
    expect_truthy: true

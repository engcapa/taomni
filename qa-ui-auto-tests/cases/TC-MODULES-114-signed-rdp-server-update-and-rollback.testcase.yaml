id: TC-MODULES-114
title: Signed RDP Server switches versions and releases the active listener
description: >-
  Switch independently compiled signed RDP Server hosts in Local servers. Check loopback input
  and frame responses, listener cleanup after disable, update, failed handshake, rollback and
  uninstall, and reuse of settings and TLS identity after reinstall.
covers: [F-Modules-1, F-Servers-1, F-RdpServer-1]
tags: [modules, rdp-server, servers, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, rdp_server_required, system_rdp_running, module_signed_rdp_server_archive, module_marketplace, release_build_required]
timeout_sec: 660
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- module_marketplace_probe: {phase: source}
- reload_window: null

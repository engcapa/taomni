id: TC-WS-065
title: Ordinary JSON retains responsive real input and byte-exact native saving
description: Open the same public 704-line JSON through real native file reading, measure 32 paced keys with a 150ms p95 input guardrail, save, close and
  reopen, and independently hash the complete disk bytes. Ordinary JSON must never start automatic SDK/LSP discovery.
modes:
- native
covers:
- F-WS-2
- F25.1
- F25.3
- F11.2
tags:
- p0
- workspace-redesign
- file-explorer
- regression
- performance
fixtures:
- reset_db
- workspace_language_files
- release_build_required
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-plain-files
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- click: '[data-testid="code-workspace-tree-dir"][data-path="Documents"] [data-testid="code-workspace-tree-dir-arrow"]'
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/records.json"]'
    expected: ${fixture.workspace_json_text}
    event: dblclick
    label: native-json
- click: '[data-testid="workspace-file-editor"] .cm-content'
- native_keys:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    transport: webdriver
    keys:
    - Mod+End
- native_editor_performance:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    keys: qajsonabcdefghijklmnopqrstuvwxyz
    capture_text: false
    max_p95_ms: 150
    label: ordinary-json
- click: '[data-testid="workspace-editor-save"]:enabled'
- assert_file_sha256:
    path: ${fixture.platform_workspace_root}/Documents/records.json
    equals: f04739e7c9e9fc056bf01a0b4c877f442d59ebd9bfe43f2320dbf428218c9392
- click: '[data-testid="workspace-tab"][data-tab-title="records.json"] [data-testid="workspace-tab-close"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/records.json"]'
- click: '[data-testid="workspace-file-editor"] .cm-content'
- native_keys:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    transport: webdriver
    keys:
    - Mod+End
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: qajsonabcdefghijklmnopqrstuvwxyz
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-line:first-child'
    equals: '{'
- assert_file_sha256:
    path: ${fixture.platform_workspace_root}/Documents/records.json
    equals: f04739e7c9e9fc056bf01a0b4c877f442d59ebd9bfe43f2320dbf428218c9392
- assert_language_startup:
    commands:
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_discover_java_bundles:
        equal: 0
      lsp_open_document:
        equal: 0
      lsp_document_status:
        equal: 0
    quiet_ms: 500
- assert_no_runtime_errors: null
- screenshot: workspace-json-native-save.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Open the same public 704-line JSON through real native file reading, measure 32 paced keys with a 150ms p95 input guardrail, save, close
      and reopen, and independently hash the complete disk bytes. Ordinary JSON must never start automatic SDK/LSP discovery.
    actions:
    - 4
    - 7
    - 8
    - 9
    - 10
    - 13
    - 14
    - 15
    - 16
    - 17
    - 18
    - 20
    - 21
    - 22
    - 23
    results:
    - 6
    - 12
    - 14
    - 17
    - 19
    - 24
    - 25
    - 26
    - 27
    - 28
    checkpoints:

      expectation: '{"assert_language_startup": {"commands": {"sdk_get_registry": {"equal": 0}, "sdk_analyze_workspace": {"equal": 0}, "sdk_resolve_workspace":
        {"equal": 0}, "lsp_detect_servers": {"equal": 0}, "lsp_discover_java_bundles": {"equal": 0}, "lsp_open_document": {"equal": 0}, "lsp_document_status":
        {"equal": 0}}, "quiet_ms": 500}}'
    - step: 12
      expectation: '{"assert_language_startup": {"commands": {"sdk_get_registry": {"equal": 0}, "sdk_analyze_workspace": {"equal": 0}, "sdk_resolve_workspace":
        {"equal": 0}, "lsp_detect_servers": {"equal": 0}, "lsp_discover_java_bundles": {"equal": 0}, "lsp_open_document": {"equal": 0}, "lsp_document_status":
        {"equal": 0}}, "quiet_ms": 500}}'
    - step: 14
      expectation: '{"measure_workspace_file_open": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"Documents/records.json\"]", "expected":
        "${fixture.workspace_json_text}", "event": "dblclick", "label": "native-json"}}'
    - step: 17
      expectation: '{"native_editor_performance": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "keys": "qajsonabcdefghijklmnopqrstuvwxyz",
        "capture_text": false, "max_p95_ms": 150, "label": "ordinary-json"}}'
    - step: 19
      expectation: '{"assert_file_sha256": {"path": "${fixture.platform_workspace_root}/Documents/records.json", "equals": "f04739e7c9e9fc056bf01a0b4c877f442d59ebd9bfe43f2320dbf428218c9392"}}'
    - step: 24
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "contains": "qajsonabcdefghijklmnopqrstuvwxyz"}}'
    - step: 25
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-line:first-child", "equals": "{"}}'
    - step: 26
      expectation: '{"assert_file_sha256": {"path": "${fixture.platform_workspace_root}/Documents/records.json", "equals": "f04739e7c9e9fc056bf01a0b4c877f442d59ebd9bfe43f2320dbf428218c9392"}}'
    - step: 27
      expectation: '{"assert_language_startup": {"commands": {"sdk_get_registry": {"equal": 0}, "sdk_analyze_workspace": {"equal": 0}, "sdk_resolve_workspace":
        {"equal": 0}, "lsp_detect_servers": {"equal": 0}, "lsp_discover_java_bundles": {"equal": 0}, "lsp_open_document": {"equal": 0}, "lsp_document_status":
        {"equal": 0}}, "quiet_ms": 500}}'
    - step: 28
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: JSON content and highlighting remain readable.
    method: manual
    reason: Screenshots retained; renderer frames separately verify responsiveness.
  native:
  - check: Packaged WebView, real native file read, keyboard input and independently hashed saved bytes.
    method: automated
    reason: Browser VFS cannot establish real disk or native WebView latency.

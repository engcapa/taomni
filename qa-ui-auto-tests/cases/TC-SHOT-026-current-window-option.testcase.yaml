id: TC-SHOT-026
title: Current-window menu and Alt+A from a modal allow manual region selection
covers:
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- assert_pattern:
    selector: '[data-testid="system-screenshot-current-window"]'
    regex: '.*\((?:Alt\+A|⌥A)\).*'
- assert_text:
    selector: '[data-testid="system-screenshot-default-hint"]'
    contains: Default capture hides Taomni
- click: '[data-testid="system-screenshot-current-window"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
- assert_not_visible: '[data-testid="screenshot-toolbar"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).args.includeCurrentWindow === true
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position:
      x: 100
      y: 100
    to_position:
      x: 500
      y: 400
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: 160 × 120
- screenshot: current-window-manual-selection.png
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: modal capture draft
- eval_readonly:
    expression: document.activeElement?.dataset.testid === "session-host"
- press: Alt+a
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
- assert_not_visible: '[data-testid="screenshot-toolbar"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).args.includeCurrentWindow === true
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position:
      x: 100
      y: 100
    to_position:
      x: 500
      y: 400
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: 160 × 120
- screenshot: modal-shortcut-manual-selection.png
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).args.includeCurrentWindow === false
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'

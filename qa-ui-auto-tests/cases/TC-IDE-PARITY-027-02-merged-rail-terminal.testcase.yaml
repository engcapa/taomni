id: TC-IDE-PARITY-027-02
title: SSH terminal tool windows (SFTP, Chat) live in the collapsed sidebar rail like Code Workspace
description: Explicit navigator collapse merges the SSH SFTP/Chat tools; restore returns them to the terminal. Switching
  via the open-surfaces menu preserves the global navigator choice and compatibility keys.
covers:
- F1.2
- F7.1
tags:
- terminal
- sftp
- sidebar
- ed-parity-027
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.sidebarCollapsed
    value: 'false'
- seed_storage:
    key: taomni.sidebarCollapsedByGroup.v1
    value: '{"code-workspace":true,"terminal":true}'
- reload_window: null
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ed027-rail
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ed027-rail"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ed027-rail"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-sidebar"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    timeout_sec: 10
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="tab-action-slot"] [data-testid="attached-sftp-toggle"]'
    state: detached
    timeout_sec: 5
- assert_visible: '[data-testid="tab-action-slot"] [data-testid="terminal-detach"]'
- screenshot: tc-ide-parity-027-02-terminal-rail.png
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    timeout_sec: 30
- assert_attribute:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="attached-sftp-toggle"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    state: detached
    timeout_sec: 10
- assert_visible: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    state: detached
    timeout_sec: 5
- wait_for:
    selector: '[data-testid="tab-action-slot"] [data-testid="attached-sftp-toggle"]'
    timeout_sec: 5
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu"] >> text="Sessions"'
- click: '[data-testid="context-menu-item-show-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="tab-more"]'
- click: '[data-testid="open-tabs-menu"] button[title^="qa-ui-auto-ed027-rail"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_visible: '[data-testid="session-tree"]'
- assert_localstorage:
    key: taomni.sidebarCollapsedByGroup.v1
    contains: '"terminal":false'
- assert_localstorage:
    key: taomni.sidebarCollapsedByGroup.v1
    contains: '"code-workspace":true'
verification:
  review: pending
  requirements:
  - id: R1
    requirement: A+B：SSH 终端就绪后主侧栏折叠为工具条，终端的 SFTP 开关出现在工具条里，控制栏的标签操作区不再重复显示（Detach 等操作仍在控制栏）。
    actions:
    - 19
    - 22
    checkpoints:
    - step: 23
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"][data-terminal-ready=\"true\"]",
        "timeout_sec": 60}}'
    - step: 27
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "timeout_sec": 10}}'
    - step: 28
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"attached-sftp-toggle\"]"}'
    - step: 29
      expectation: '{"wait_for": {"selector": "[data-testid=\"tab-action-slot\"] [data-testid=\"attached-sftp-toggle\"]",
        "state": "detached", "timeout_sec": 5}}'
    - step: 30
      expectation: '{"assert_visible": "[data-testid=\"tab-action-slot\"] [data-testid=\"terminal-detach\"]"}'
    results:
    - 23
    - 27
    - 28
    - 29
    - 30
  - id: R2
    requirement: B：工具条里的 SFTP 按钮打开附加 SFTP 浏览器（按钮呈按下态），再次点击关闭，终端保持就绪。
    actions:
    - 32
    - 35
    checkpoints:
    - step: 33
      expectation: '{"wait_for": {"selector": "[data-testid=\"sftp-browser\"]", "timeout_sec": 30}}'
    - step: 34
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"attached-sftp-toggle\"]",
        "name": "aria-pressed", "equals": "true"}}'
    - step: 36
      expectation: '{"wait_for": {"selector": "[data-testid=\"sftp-browser\"]", "state": "detached", "timeout_sec":
        10}}'
    - step: 37
      expectation: '{"assert_visible": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"][data-terminal-ready=\"true\"]"}'
    results:
    - 33
    - 34
    - 36
    - 37
  - id: R3
    requirement: A：展开主侧栏后开关回到控制栏的标签操作区；切到 Welcome 再回到终端仍保持展开，只记住终端组（Code Workspace 组仍为折叠）。
    actions:
    - 38
    - 46
    - 49
    checkpoints:
    - step: 39
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 40
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "state": "detached", "timeout_sec":
        5}}'
    - step: 41
      expectation: '{"wait_for": {"selector": "[data-testid=\"tab-action-slot\"] [data-testid=\"attached-sftp-toggle\"]",
        "timeout_sec": 5}}'
    - step: 47
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 50
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"]"}'
    - step: 51
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"]"}'
    - step: 52
      expectation: '{"assert_localstorage": {"key": "taomni.sidebarCollapsedByGroup.v1", "contains": "\"terminal\":false"}}'
    - step: 53
      expectation: '{"assert_localstorage": {"key": "taomni.sidebarCollapsedByGroup.v1", "contains": "\"code-workspace\":true"}}'
    results:
    - 39
    - 40
    - 41
    - 47
    - 50
    - 51
    - 52
    - 53
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

id: TC-IDE-PARITY-027-02
title: SSH SFTP stays in the actions menu across Sessions collapse while terminal sidebar preferences remain isolated
description: SFTP consistently uses the actions menu and compact floating entry. Retain merged-rail collapse/expand preferences and Home return behavior
  without adding SFTP to the left rail.
covers:
- F1.2
- F7.1
- F7.4
tags:
- terminal
- sftp
- sidebar
- ed-parity-027
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_posix_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.sidebarCollapsedByGroup.v1
    value: '{"terminal": true, "code-workspace": true}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar"]'
- assert_visible: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh_posix.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh_posix.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh_posix.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ed027-rail
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ed027-rail"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ed027-rail"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_POSIX_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_ED027_READY
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?m)^QA_ED027_READY\r?$
      timeout_sec: 30
      attempts: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_ED027_READY\r?$
    timeout_sec: 30
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- wait_for: '[data-testid="sftp-floating-button"]'
- assert_count:
    selector: '[data-testid="sidebar-rail"] [data-testid="attached-sftp-toggle"]'
    equal: 0
- click: '[data-testid="titlebar-actions-more"]'
- assert_visible: '[data-testid="tab-action-slot"] [data-testid="attached-sftp-toggle"]'
- assert_visible: '[data-testid="terminal-detach"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- assert_not_visible: '[data-testid="sftp-floating-button"]'
- click: '[data-testid="titlebar-actions-more"]'
- assert_attribute:
    selector: '[data-testid="attached-sftp-toggle"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    state: detached
- wait_for: '[data-testid="sftp-floating-button"]'
- assert_visible: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    state: detached
- click: '[data-testid="titlebar-actions-more"]'
- assert_visible: '[data-testid="attached-sftp-toggle"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-close"]'
- wait_for: '[data-testid="sftp-floating-button"]'
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="tab-item"][data-tab-type="terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_visible: '[data-testid="session-tree"]'
- assert_localstorage:
    key: taomni.sidebarCollapsedByGroup.v1
    contains: '"terminal":false'
- assert_localstorage:
    key: taomni.sidebarCollapsedByGroup.v1
    contains: '"code-workspace":true'
- screenshot: tc-ide-parity-027-02-consistent-sftp.png
- assert_no_runtime_errors: null

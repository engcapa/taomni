id: TC-IDE-PARITY-027-02
title: SSH tools retain a single merged Rail and live Files view across Navigator toggles
description: Shell v2 retained SSH/SFTP workflow. Merged terminal tools stay on the permanent Rail when
  Navigator is expanded; Files hides without destroying its view. Disabling merge returns tools to the
  toolbar. Connection/authentication, paths and transfer controls remain required in browser and native.
covers:
- F1.2
- F7.1
tags:
- terminal
- sftp
- sidebar
- ed-parity-027
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-rail-ssh-password
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.shellLayout.v2
    value: '{"version": 2, "navigator": {"collapsedByLane": {"home": false, "build": true, "connect":
      true}, "lastArea": "sessions"}}'
- reload_window: null
- shell_navigate: sessions
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ed027-rail
- click: '[data-testid="session-save"]'
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ed027-rail"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ed027-rail"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- assert_not_visible: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
    equal: 1
- assert_count:
    selector: '[data-testid="tab-action-slot"] [data-testid="attached-sftp-toggle"]'
    equal: 0
- assert_visible: '[data-testid="tab-action-slot"] [data-testid="terminal-detach"]'
- click: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    timeout_sec: 30
- wait_for: '[data-testid="sftp-remote-list"]'
- click: '[data-testid="sftp-transfer-queue-close"]'
- assert_visible: '[data-testid="sftp-transfer-queue-collapsed"]'
- assert_attribute:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
- assert_not_visible: '[data-testid="sftp-browser"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_visible: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- shell_navigate: sessions
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
    equal: 1
- click: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
- assert_visible: '[data-testid="sftp-browser"]'
- assert_element_geometry:
    selector: '[data-testid="sftp-transfer-queue-collapsed"]'
    min_width: 100
    min_height: 10
    within_viewport: true
    hit_center: true
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_visible: '[data-testid="sftp-remote-list"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="terminal"] [data-testid="shell-tab-card-open"]'
- assert_visible: '[data-testid="session-tree"]'
- eval_readonly:
    expression: localStorage.getItem('taomni.shellLayout.v2')?.includes("\"connect\":false")
    expect_truthy: true
    timeout_sec: 5
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"connect":false'
- eval_readonly:
    expression: localStorage.getItem('taomni.shellLayout.v2')?.includes("\"build\":true")
    expect_truthy: true
    timeout_sec: 5
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"build":true'
- click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="settings-group-toggle-general"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: false
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="terminal"] [data-testid="shell-tab-card-open"]'
- assert_count:
    selector: '[data-testid="tab-action-slot"] [data-testid="attached-sftp-toggle"]'
    equal: 1
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
    equal: 0
- click: '[data-testid="shell-rail-settings"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: true
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="terminal"] [data-testid="shell-tab-card-open"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="attached-sftp-toggle"]'
    equal: 1
- assert_visible: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- screenshot: tc-ide-parity-027-02-shell-v2.png

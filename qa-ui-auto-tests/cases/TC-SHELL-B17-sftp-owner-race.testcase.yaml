id: TC-SHELL-B17
title: SFTP failure retry and late replies stay with their owner
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b17.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F7.4
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- shell_backend_scenario:
    command: sftp_attach
    action: fail-next
    owner: alpha.invalid
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="shell-host-retry"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-phase
    equals: failed
- click: '[data-testid="shell-host-retry"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- wait_for:
    selector: '[data-testid="shell-host"][data-phase="ready"]'
    timeout_sec: 5
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-phase
    equals: ready
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 2
    status: requested
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]:visible'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 3
    status: requested
- click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]:visible'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 3
    status: requested
- screenshot: tc-shell-b17.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: An external attach rejection preserves a retryable host; retry succeeds with one logical
      surface. Await the observable ready host before reading its exact phase.
    actions:
    - 3
    - 4
    - 6
    - 7
    - 10
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]:visible"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"shell-host-retry\"]"}'
    - step: 9
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-host\"]", "name": "data-phase",
        "equals": "failed"}}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"sftp-remote-list\"]"}'
    - step: 12
      expectation: '{"wait_for": {"selector": "[data-testid=\"shell-host\"][data-phase=\"ready\"]", "timeout_sec":
        5}}'
    - step: 13
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-host\"]", "name": "data-phase",
        "equals": "ready"}}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"sftp-browser\"]", "equal": 1}}'
    - step: 15
      expectation: '{"assert_shell_backend": {"command": "sftp_attach", "count": 2, "status": "requested"}}'
    results:
    - 5
    - 8
    - 9
    - 11
    - 12
    - 13
    - 14
    - 15
  - id: R2
    requirement: Beta attaches independently; switching owners cannot expose both retained browsers at
      once.
    actions:
    - 16
    - 17
    - 19
    - 23
    checkpoints:
    - step: 18
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]:visible"}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"sftp-remote-list\"]"}'
    - step: 21
      expectation: '{"assert_count": {"selector": "[data-testid=\"sftp-browser\"]:visible", "equal": 1}}'
    - step: 22
      expectation: '{"assert_shell_backend": {"command": "sftp_attach", "count": 3, "status": "requested"}}'
    - step: 24
      expectation: '{"wait_for": "[data-testid=\"sftp-remote-list\"]"}'
    - step: 25
      expectation: '{"assert_count": {"selector": "[data-testid=\"sftp-browser\"]:visible", "equal": 1}}'
    - step: 26
      expectation: '{"assert_shell_backend": {"command": "sftp_attach", "count": 3, "status": "requested"}}'
    results:
    - 18
    - 20
    - 21
    - 22
    - 24
    - 25
    - 26
  visual:
  - check: Inspect the final screenshot for readable controls, clipping and overlay placement.
    method: manual
    reason: Screenshots require a visual verdict; geometry assertions are recorded separately.
  native:
  - check: Tauri, OS window, physical input and real service effects
    method: not-applicable
    reason: This case is browser renderer coverage; paired TC-SHELL-N cases cover native boundaries.

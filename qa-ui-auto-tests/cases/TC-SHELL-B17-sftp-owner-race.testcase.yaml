id: TC-SHELL-B17
title: SFTP failure retry and late replies stay with their owner
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b17.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F7.4
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- shell_backend_scenario:
    command: sftp_attach
    action: fail-next
    owner: alpha.invalid
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="shell-host-retry"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-phase
    equals: failed
- click: '[data-testid="shell-host-retry"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-phase
    equals: ready
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 2
    status: requested
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]:visible'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 3
    status: requested
- click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]:visible'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 3
    status: requested
- screenshot: tc-shell-b17.png

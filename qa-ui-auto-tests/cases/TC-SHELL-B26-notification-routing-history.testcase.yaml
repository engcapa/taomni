id: TC-SHELL-B26
title: Notifications preserve failed jumps, cap history, count 101 notes and route terminal transfer events
description: Workspace Shell v2 production workflow; docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b26.
  Browser service fixtures do not establish native effects. Chat source is covered by TC-SHELL-B25; Mail
  IDLE source and native mailbox effects by TC-MAIL-IDLE-01. This case supplies complementary Notes and
  transfer failure/dedupe/history/badge assertions.
covers:
- F-TAO-1
- F-SHELL-1
- F7.4
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 240

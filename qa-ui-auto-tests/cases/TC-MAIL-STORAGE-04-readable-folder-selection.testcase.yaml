    contains: Readable excluded 0001
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 60
- click: '[data-testid="mail-storage-resume"]'
- wait_for:
    selector: '[data-testid="mail-storage-resume"]:enabled'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed

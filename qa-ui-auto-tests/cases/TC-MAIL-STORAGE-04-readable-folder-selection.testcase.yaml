    prefix: Other folder allowed
- click: '[data-testid="mail-sync-button"]'
- click: '[data-testid="mail-folder-row"][data-folder-name="&U,BTFw-"]'
- assert_text:
    selector: '[data-testid="mail-message-list"]'
    contains: Readable excluded 0001
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed

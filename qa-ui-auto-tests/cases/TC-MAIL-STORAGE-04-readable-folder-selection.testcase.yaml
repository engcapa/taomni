    contains: Other folder allowed 0001
    timeout_sec: 60
- eval_readonly:
    expression: '!document.querySelector("dialog").textContent.includes("Readable excluded 0001")'
    expect_truthy: true
- eval_readonly:
    expression: (document.querySelector("dialog").textContent.match(/Readable included 0001/g) || []).length === 1
    expect_truthy: true
- screenshot: mail-readable-folder-exclusion.png
- click: '[data-testid="mail-archive-close"]'
- assert_not_visible: '[data-testid="mail-archive-dialog"]'

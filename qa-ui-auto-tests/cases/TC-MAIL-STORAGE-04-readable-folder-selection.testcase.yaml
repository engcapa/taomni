id: TC-MAIL-STORAGE-04
title: Readable folder names drive include/exclude storage and survive save/reopen
description: Enter a Chinese name before folder discovery, match the encoded IMAP folder, deduplicate
  mixed names and uncheck both aliases. Switch to exclusion and verify newly arrived excluded mail has
  headers but no local original while prior originals remain. Browser proves renderer/preview behavior;
  native proves persisted session settings and real Rust archive selection against a disposable loopback
  IMAP server.
covers:
- F-MAIL-23
tags:
- mail
- p1
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
- mail_storage
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:

id: TC-SHELL-N08
title: Real QA process restart keeps layout and explicit workspace restore
description: Isolated packaged Tauri boundary. docs-feature/workspace-shell-ux-redesign-test-cases.md#v-n08 records
  the complete scenario and any remaining manual boundary. Exit through the real platform menu, confirm close, independently
  observe the owned PID exit, then reopen the same profile. This is a normal close/reopen contract; corrupt-profile
  recovery is separately unverified.
covers:
- F1.6
- F-SHELL-1
tags:
- p1
- workspace-shell
- native-boundary
modes:
- native
fixtures:
- reset_db
- shell_native_files
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-native-password
- wait_for: '[data-testid="welcome-panel"]'
- set_viewport:
    width: 1280
    height: 800
- wait_for: '[data-testid="shell-root"][data-mode="wide"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "shell-native", "name": "Shell Native", "roots": [{"id": "shell", "name": "shell", "path": "${fixture.shell_root}",
      "kind": "folder"}], "looseFiles": [], "lastOpenedAt": 3000, "isGitRepo": false, "lastActiveFile": {"kind":
      "root", "rootId": "shell", "path": "README.md"}}]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 60
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Home
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Shift+ArrowRight
- assert_attribute:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    name: aria-valuenow
    equals: '232'
- click: '[data-testid="shell-rail-home"]'
- eval_readonly:
    expression: localStorage.getItem('taomni.shellLayout.v2')?.includes("\"width\":232")
    expect_truthy: true
    timeout_sec: 5
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"width":232'
- native_app_process:
    state: running
- app_menu_action: exit
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- native_app_process:
    state: exited
    timeout_sec: 30
- restart_native_app: null
- wait_for: '[data-testid="welcome-panel"]'
- set_viewport:
    width: 1280
    height: 800
- wait_for: '[data-testid="shell-root"][data-mode="wide"]'
- assert_attribute:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    name: aria-valuenow
    equals: '232'
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for:
    selector: '[data-testid="code-workspace-tab"]'
    timeout_sec: 60
- click: '[data-testid="shell-rail-home"]'
- assert_attribute:
    selector: '[data-testid="welcome-restore-status"]'
    name: data-state
    equals: succeeded
- assert_count:
    selector: '[data-testid="shell-restore-entry"]'
    equal: 1
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"]'
    equal: 1
- screenshot: tc-shell-n08.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Workspace and Navigator preferences are persisted before a process restart.
    actions:
    - 4
    - 6
    - 7
    - 9
    - 10
    - 12
    - 13
    - 15
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"shell-root\"][data-mode=\"wide\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content", "timeout_sec":
        60}}'
    - step: 14
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"main-sidebar-resize-handle\"]", "name": "aria-valuenow",
        "equals": "232"}}'
    - step: 16
      expectation: '{"eval_readonly": {"expression": "localStorage.getItem(''taomni.shellLayout.v2'')?.includes(\"\\\"width\\\":232\")",
        "expect_truthy": true, "timeout_sec": 5}}'
    - step: 17
      expectation: '{"assert_localstorage": {"key": "taomni.shellLayout.v2", "contains": "\"width\":232"}}'
    results:
    - 5
    - 8
    - 11
    - 14
    - 16
    - 17
  - id: R-EXIT
    requirement: A real UI Exit confirms the clean workspace close and ends the previously observed owned QA process
      before restart.
    actions:
    - 19
    - 21
    checkpoints:
    - step: 18
      expectation: '{"native_app_process": {"state": "running"}}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 22
      expectation: '{"native_app_process": {"state": "exited", "timeout_sec": 30}}'
    results:
    - 22
  - id: R2
    requirement: A new QA process using the same isolated profile starts at Home with saved preferences and restores
      exactly one workspace.
    actions:
    - 23
    - 25
    - 28
    - 30
    - 33
    checkpoints:
    - step: 24
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 26
      expectation: '{"wait_for": "[data-testid=\"shell-root\"][data-mode=\"wide\"]"}'
    - step: 27
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"main-sidebar-resize-handle\"]", "name": "aria-valuenow",
        "equals": "232"}}'
    - step: 29
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tab\"]", "timeout_sec": 60}}'
    - step: 31
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-restore-status\"]", "name": "data-state",
        "equals": "succeeded"}}'
    - step: 32
      expectation: '{"assert_count": {"selector": "[data-testid=\"shell-restore-entry\"]", "equal": 1}}'
    - step: 34
      expectation: '{"assert_count": {"selector": "[data-testid=\"shell-tab-card\"][data-tab-type=\"code-workspace\"]",
        "equal": 1}}'
    results:
    - 24
    - 26
    - 27
    - 29
    - 31
    - 32
    - 34
  visual:
  - check: Read final screenshot for clipped controls and retained content
    method: manual
    reason: Screenshot generation is not a visual verdict.
  native:
  - check: Real Tauri IPC, packaged WebView and declared disk/process/window results
    method: automated
    reason: Uses the isolated QA binary; no browser backend stubs.
  - check: Corrupt-profile restart branches in V-N08.
    method: manual
    reason: The real graceful UI exit/reopen is automated above; this YAML does not inject a corrupt profile.

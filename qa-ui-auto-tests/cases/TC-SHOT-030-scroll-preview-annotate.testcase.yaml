id: TC-SHOT-030
title: Annotate scroll preview through zoom and scrolling, then Done or Escape
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- annotation
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- set_viewport:
    width: 1000
    height: 750
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- assert_visible: '[data-testid="screenshot-scroll-mode-manual"]:checked'
- click: '[data-testid="screenshot-scroll-mode-auto"]'
- click: '[data-testid="screenshot-scroll-start"]'
- wait_for: '[data-testid="screenshot-scroll-result"]'
- assert_visible: '[data-testid="screenshot-toolbar"]'
- assert_not_visible: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position:
      x: 10
      y: 50
    to_position:
      x: 35
      y: 80
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- click: '[data-testid="screenshot-scroll-actual"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- click: '[data-testid="screenshot-undo"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '0'
- click: '[data-testid="screenshot-redo"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- click: '[data-testid="screenshot-color-green"]'
- click:
    selector: '[data-testid="screenshot-scroll-result-viewport"]'
    position:
      x: 20
      y: 80
- press:
    selector: '[data-testid="screenshot-scroll-result-viewport"]'
    key: End
- eval_readonly:
    expression: document.getElementById("screenshot-scroll-result-viewport").scrollTop > 1000
    timeout_sec: 3
- drag_to:
    from: '[data-testid="screenshot-scroll-result-viewport"]'
    to: '[data-testid="screenshot-scroll-result-viewport"]'
    from_position:
      x: 340
      y: 80
    to_position:
      x: 440
      y: 160
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '2'
- screenshot: scroll-bottom-annotation.png
- click: '[data-testid="screenshot-scroll-fit"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '2'
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-viewport\"]").scrollTop
      === 0
- assert_visible: '[data-testid="screenshot-scroll-result-copy"]'
- screenshot: scroll-marked-fit.png
- click: '[data-testid="screenshot-scroll-result-copy"]'
- wait_for: '[data-testid="system-screenshot"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-3).cmd === "screenshot_save_data_url" && window.__taomniStubScreenshotCalls.at(-3).args.width
      === 400 && window.__taomniStubScreenshotCalls.at(-3).args.height === 1800
- open: ${cfg.app.base_url}?qaPreviewCancel=1#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- click: '[data-testid="screenshot-scroll-mode-auto"]'
- click: '[data-testid="screenshot-scroll-start"]'
- wait_for: '[data-testid="screenshot-scroll-result"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position:
      x: 10
      y: 50
    to_position:
      x: 35
      y: 80
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- eval_readonly:
    expression: '!JSON.stringify(window.__taomniStubScreenshotCalls).includes("screenshot_copy_image")'
verification:
  review: reviewed
  requirements:
  - id: preview-annotation
    requirement: Direct preview marks survive fit/100% switches and undo/redo; draw below the initial viewport,
      Done copies full natural dimensions and Escape discards without copying. Manual mode is selected by default
      before explicitly choosing automatic capture.
    actions:
    - 1
    - 2
    - 4
    - 5
    - 7
    - 8
    - 12
    - 13
    - 15
    - 17
    - 19
    - 21
    - 22
    - 23
    - 25
    - 28
    - 33
    - 36
    - 38
    - 39
    - 40
    - 41
    - 43
    - 44
    - 46
    checkpoints:
    - step: 3
      expectation: '{''wait_for'': ''[data-testid="screenshot-hint"]''}'
    - step: 6
      expectation: Manual mode is checked on the first confirmation.
    - step: 9
      expectation: '{''wait_for'': ''[data-testid="screenshot-scroll-result"]''}'
    - step: 10
      expectation: '{''assert_visible'': ''[data-testid="screenshot-toolbar"]''}'
    - step: 11
      expectation: '{''assert_not_visible'': ''[data-testid="screenshot-hint"]''}'
    - step: 14
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'':
        ''data-shapes'', ''equals'': ''1''}}'
    - step: 16
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'':
        ''data-shapes'', ''equals'': ''1''}}'
    - step: 18
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'':
        ''data-shapes'', ''equals'': ''0''}}'
    - step: 20
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'':
        ''data-shapes'', ''equals'': ''1''}}'
    - step: 24
      expectation: Keyboard scrolling reaches the bottom before drawing; scrollTop exceeds 1000 and remaining distance
        is below 2 pixels.
    - step: 26
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'':
        ''data-shapes'', ''equals'': ''2''}}'
    - step: 29
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'':
        ''data-shapes'', ''equals'': ''2''}}'
    - step: 30
      expectation: '{''eval_readonly'': {''expression'': ''document.querySelector("[data-testid" + String.fromCharCode(61)
        + "\\"screenshot-scroll-result-viewport\\"]").scrollTop === 0''}}'
    - step: 31
      expectation: '{''assert_visible'': ''[data-testid="screenshot-scroll-result-copy"]''}'
    - step: 34
      expectation: '{''wait_for'': ''[data-testid="system-screenshot"]''}'
    - step: 35
      expectation: '{''eval_readonly'': {''expression'': ''window.__taomniStubScreenshotCalls.at(-3).cmd === "screenshot_save_data_url"
        && window.__taomniStubScreenshotCalls.at(-3).args.width === 400 && window.__taomniStubScreenshotCalls.at(-3).args.height
        === 1800''}}'
    - step: 37
      expectation: '{''wait_for'': ''[data-testid="screenshot-hint"]''}'
    - step: 42
      expectation: '{''wait_for'': ''[data-testid="screenshot-scroll-result"]''}'
    - step: 45
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'':
        ''data-shapes'', ''equals'': ''1''}}'
    - step: 47
      expectation: '{''wait_for'': ''[data-testid="system-screenshot"]''}'
    - step: 48
      expectation: Escape exits the marked preview without invoking screenshot_copy_image.
    results:
    - 3
    - 6
    - 9
    - 10
    - 11
    - 14
    - 16
    - 18
    - 20
    - 24
    - 26
    - 29
    - 30
    - 31
    - 34
    - 35
    - 37
    - 42
    - 45
    - 47
    - 48
  visual:
  - check: Marked long-image preview
    method: automated
    reason: Retained fit and scrolled screenshots, shape history and full export dimensions; N12 verifies actual
      exported pixels.
  native:
  - check: Full-resolution clipboard pixels
    method: external
    reason: N12 draws top and bottom marks in the actual native preview and checks the OS clipboard.

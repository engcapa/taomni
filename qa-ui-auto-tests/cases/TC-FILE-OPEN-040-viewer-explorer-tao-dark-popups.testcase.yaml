id: TC-FILE-OPEN-040
title: Markdown, Explorer and Tao Home controls follow dark application appearance
covers: [F-FILEOPEN-1, F-EXPLORER-1, F1.11]
modes: [browser, native]
tags: [p1, markdown, file-open, tao-home, theme]
fixtures: [reset_db, markdown_remote_images]
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-markdown-dark-popups
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: theme
- click: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-dark"]'
- click: '[data-testid="tab-item"][data-tab-type="settings"] [data-testid="tab-close"]'
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-sessions"]'
- eval_readonly:
    expression: getComputedStyle(document.querySelector('.tao-home-history-content select')).colorScheme === 'dark'
    expect_truthy: true
- eval_readonly:
    expression: Math.max(...getComputedStyle(document.querySelector('.tao-home-history-content option')).backgroundColor.match(/\d+/g).map(Number)) < 100
    expect_truthy: true
- press: Escape
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Mod+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.platform_workspace_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- click: '[data-testid="explorer-cmd-view"]'
- eval_readonly:
    expression: Math.max(...getComputedStyle(document.querySelector('[data-taomni-context-menu]')).backgroundColor.match(/\d+/g).map(Number)) < 100
    expect_truthy: true
- press: Escape
- dblclick: '[data-testid="explorer-file-row"][data-name="remote-images.md"]'
- click: '[data-testid="markdown-live-edit"]'
- eval_readonly:
    expression: getComputedStyle(document.querySelector('.fv-md-heading-select select')).colorScheme === 'dark'
    expect_truthy: true
- eval_readonly:
    expression: Math.max(...getComputedStyle(document.querySelector('.fv-md-heading-select option')).backgroundColor.match(/\d+/g).map(Number)) < 100
    expect_truthy: true
- eval_readonly:
    expression: Math.max(...getComputedStyle(document.querySelector('.fv-md-appearance option')).backgroundColor.match(/\d+/g).map(Number)) < 100
    expect_truthy: true
- click: '[data-testid="markdown-export"]'
- eval_readonly:
    expression: Math.max(...getComputedStyle(document.querySelector('.fv-md-export-menu')).backgroundColor.match(/\d+/g).map(Number)) < 100
    expect_truthy: true
- press: Escape
- assert_no_runtime_errors: null

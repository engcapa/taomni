    - ''
    - public class ExtractTarget {
    - '    int total(int[] values) {'
    - '        int sum = extracted(values);'
    - '        return sum * 2;'
    - '    }'
    - ''
    - '    private static int extracted(int[] values) {'
    - '        int sum = 0;'
    - '        for (int v : values) {'
    - '            sum += v;'
    - '        }'
    - '        return sum;'
    - '    }'
    - ''

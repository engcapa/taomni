verification:
  review: reviewed
  requirements:
  - id: ED-PARITY-007-V3-04-entries
    requirement: Search Everywhere Actions and the keymap cheat sheet run the same direct Extract Method transaction as the editor chord.
    actions:
    - 40
    checkpoints:
    - step: 42
      expectation: The Actions entry lists the Extract Method command.
    - step: 45
      expectation: The Actions entry produced the extracted B1 on the buffer.
    - step: 51
      expectation: Undo after the Escape path returns the initial B0.
    - step: 67
      expectation: The cheat sheet lists and runs the Extract Method action.
    - step: 78
      expectation: All three entries left no pending provider response (one request and one resolve per entry).
    results:
    - 42
    - 45
    - 51
    - 67
    - 78
  - id: ED-PARITY-007-V3-04-protection
    requirement: The chord is not dispatched from the Find input, requires both modifiers, and never opens a menu for a partial chord.
    actions:
    - 79
    checkpoints:
    - step: 84
      expectation: Ctrl+Alt+M inside the Find query issues no request.
    - step: 96
      expectation: Ctrl+M without Alt issues no request.
    - step: 108
      expectation: Alt+M without Ctrl issues no request and opens no menu.
    results:
    - 84
    - 96
    - 108
  visual:
  - check: Candidate menu anchor at the selection and the dialog chrome against the IDEA reference.
    method: manual
    reason: Screenshots are artifacts; the anchor is asserted through the menu geometry separately.
  native:
  - check: Real JDT LS candidate kinds, titles and resolve payloads.
    method: external
    reason: The controlled provider is fixture-bound; TC-IDE-PARITY-007-03 owns the real provider.

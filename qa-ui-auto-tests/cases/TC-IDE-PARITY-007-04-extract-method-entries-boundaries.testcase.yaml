- parity007_trace:
    pending: 0
verification:
  review: reviewed
  requirements:
  - id: ED-PARITY-007-V3-04-entries
    requirement: Search Everywhere Actions and the keymap cheat sheet run the same direct Extract Method transaction as the editor chord.
    actions:
    - 17
    checkpoints:
    - step: 29
      expectation: The Actions entry lists the Extract Method command.
    - step: 32
      expectation: The Actions entry produced the extracted B1 on the buffer.
    - step: 37
      expectation: Undo after the Escape path returns B0.
    - step: 42
      expectation: The cheat sheet lists and runs the Extract Method action.
    - step: 51
      expectation: Both entries left no pending provider response through the naming flow.
    results:
    - 29
    - 32
    - 37
    - 42
    - 51
  - id: ED-PARITY-007-V3-04-protection
    requirement: The chord is not dispatched from the Find input, requires both modifiers, and never opens a menu for a partial chord.
    actions:
    - 52
    checkpoints:
    - step: 57
      expectation: Ctrl+Alt+M inside the Find query issues no request.
    - step: 69
      expectation: Ctrl+M without Alt issues no request.
    - step: 81
      expectation: Alt+M without Ctrl issues no request and opens no menu.
    results:
    - 57
    - 69
    - 81
  - id: ED-PARITY-007-V3-04-boundaries
    requirement: Zero-candidate results distinguish empty and non-empty selections, and a caret with a real method candidate still extracts.
    actions:
    - 84
    checkpoints:
    - step: 95
      expectation: A non-empty selection without a method candidate gets the DEC-06 selection wording.
    - step: 105
      expectation: An empty caret without a method candidate gets the DEC-06 empty-selection wording.
    - step: 116
      expectation: An empty caret with a method candidate still produces B1 through the normal naming flow.
    results:
    - 95
    - 105
    - 116
  - id: ED-PARITY-007-V3-04-failures
    requirement: Each provider failure mode reports its real reason with zero writes, and symbol/rename failures keep the committed B1.
    actions:
    - 123
    checkpoints:
    - step: 134
      expectation: A provider-declared disabled candidate reports its own reason and writes nothing.
    - step: 149
      expectation: A malformed provider response is reported as malformed, not as an empty list.
    - step: 164
      expectation: An unknown continuation command is rejected before any write.
    - step: 179
      expectation: A provider timeout is reported as a timeout.
    - step: 194
      expectation: A document-changed cancellation is reported as a cancellation.
    - step: 239
      expectation: An ambiguous symbol snapshot keeps B1 and explains that the new method could not be located.
    - step: 279
      expectation: A provider-rejected rename keeps B1 and shows the provider reason.
    results:
    - 134
    - 149
    - 164
    - 179
    - 194
    - 239
    - 279
  - id: ED-PARITY-007-V3-04-menu
    requirement: Multiple method candidates open the frozen menu with every method item, and Escape closes it with zero effect.
    actions:
    - 287
    checkpoints:
    - step: 299
      expectation: Exactly three method candidates are listed (one disabled).
    - step: 302
      expectation: Escape closes the candidate menu and leaves the buffer unchanged.
    results:
    - 299
    - 302
  visual:
  - check: Candidate menu anchor at the selection and the dialog chrome against the IDEA reference.
    method: manual
    reason: Screenshots are artifacts; the anchor is asserted through the menu geometry separately.
  native:
  - check: Real JDT LS candidate kinds, titles and resolve payloads.
    method: external
    reason: The controlled provider is fixture-bound; TC-IDE-PARITY-007-03 owns the real provider.

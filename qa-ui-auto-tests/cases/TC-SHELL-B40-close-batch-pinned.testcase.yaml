    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-tab-card\"]:has-text(\"qa-alpha\")",
        "name": "data-pinned", "equals": "false"}}'
    - step: 22
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-tab-card\"]:has-text(\"qa-alpha\")",
        "name": "data-pinned", "equals": "true"}}'
    - step: 27
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"tab-item\"][data-active=\"true\"]
        [data-testid=\"tab-title\"]", "equals": "SHELL action"}}'
    - step: 31

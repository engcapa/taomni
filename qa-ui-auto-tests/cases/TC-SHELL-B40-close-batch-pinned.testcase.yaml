id: TC-SHELL-B40
title: Strip and Overview Action entries share pin, rename, duplicate, lane move and protected batch close
  results
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b40.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- right_click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- click: '[data-testid="shell-tab-pin"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- right_click: '[data-testid="tab-item"]:has-text("qa-beta")'
- click: '[data-testid="shell-tab-close-all"]'
- assert_not_visible: '[data-testid="tab-item"]:has-text("qa-beta")'
- assert_count:
    selector: '[data-testid="tab-item"]:has-text("qa-alpha")'
    equal: 1
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 2
- assert_attribute:
    selector: '[data-testid="shell-tab-card"]:has-text("qa-alpha")'
    name: data-pinned
    equals: 'true'
- click: '[data-testid="shell-tab-card"][data-pinned="true"]:has-text("qa-alpha") [data-testid="shell-tab-card-pin"]'
- assert_attribute:
    selector: '[data-testid="shell-tab-card"]:has-text("qa-alpha")'
    name: data-pinned
    equals: 'false'
- click: '[data-testid="shell-tab-card"]:has-text("qa-alpha") [data-testid="shell-tab-card-more"]'
- click: '[data-testid="shell-tab-pin"]'
- assert_attribute:
    selector: '[data-testid="shell-tab-card"]:has-text("qa-alpha")'
    name: data-pinned
    equals: 'true'
- click: '[data-testid="shell-tab-card"][data-pinned="true"]:has-text("qa-alpha") [data-testid="shell-tab-card-more"]'
- click: '[data-testid="shell-tab-rename"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: SHELL action
- press:
    selector: '[data-testid="tab-title-input"]'
    key: Enter
- assert_text_equals:
    selector: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
    equals: SHELL action
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-pinned="true"]:has-text("SHELL action") [data-testid="shell-tab-card-more"]'
- click: '[data-testid="shell-tab-duplicate"]'
- wait_for: '[data-testid="shell-tab-card"][data-pinned="false"]:has-text("SHELL action")'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 3
- click: '[data-testid="shell-tab-card"][data-pinned="false"]:has-text("SHELL action") [data-testid="shell-tab-card-more"]'
- click: '[data-testid="shell-tab-rename"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: SHELL action copy
- press:
    selector: '[data-testid="tab-title-input"]'
    key: Enter
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"]:has([data-testid="shell-tab-card-title"]:text-is("SHELL action
    copy")) [data-testid="shell-tab-card-more"]'
- hover: '[data-testid="shell-tab-move-lane"]'
- click: '[data-testid="shell-tab-move-utility"]'
- assert_attribute:
    selector: '[data-testid="shell-tab-card"]:has([data-testid="shell-tab-card-title"]:text-is("SHELL
      action copy"))'
    name: data-lane
    equals: utility
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-pinned="true"][data-lane="connect"]'
    equal: 1
- assert_shell_backend:
    command: create_ssh_terminal
    status: requested
    count: 3
- click: '[data-testid="shell-tab-card"]:has([data-testid="shell-tab-card-title"]:text-is("SHELL action
    copy")) [data-testid="shell-tab-card-close"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 2
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-pinned="true"][data-lane="connect"]'
    equal: 1
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="welcome"]'
    equal: 1
- screenshot: tc-shell-b40.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Close all removes Beta while retaining the pinned Alpha and Home.
    actions:
    - 3
    - 4
    - 6
    - 7
    - 8
    - 9
    - 11
    - 12
    - 15
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]:visible"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]:visible"}'
    - step: 13
      expectation: '{"assert_not_visible": "[data-testid=\"tab-item\"]:has-text(\"qa-beta\")"}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"]:has-text(\"qa-alpha\")",
        "equal": 1}}'
    - step: 16
      expectation: '{"assert_count": {"selector": "[data-testid=\"shell-tab-card\"]", "equal": 2}}'
    - step: 17
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-tab-card\"]:has-text(\"qa-alpha\")",
        "name": "data-pinned", "equals": "true"}}'
    results:
    - 5
    - 10
    - 13
    - 14
    - 16
    - 17

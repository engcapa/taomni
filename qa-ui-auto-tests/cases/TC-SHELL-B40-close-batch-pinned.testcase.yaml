id: TC-SHELL-B40
title: Batch close retains Home and pinned tabs
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b40.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- right_click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- click: '[data-testid="shell-tab-pin"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- right_click: '[data-testid="tab-item"]:has-text("qa-beta")'
- click: '[data-testid="shell-tab-close-all"]'
- assert_not_visible: '[data-testid="tab-item"]:has-text("qa-beta")'
- assert_count:
    selector: '[data-testid="tab-item"]:has-text("qa-alpha")'
    equal: 1
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 2
- assert_attribute:
    selector: '[data-testid="shell-tab-card"]:has-text("qa-alpha")'
    name: data-pinned
    equals: 'true'
- screenshot: tc-shell-b40.png

      expectation: Close all removes Beta while retaining the pinned Alpha and Home.
    - step: 14
      expectation: Close all removes Beta while retaining the pinned Alpha and Home.
    - step: 16
      expectation: Close all removes Beta while retaining the pinned Alpha and Home.
    - step: 17
      expectation: Close all removes Beta while retaining the pinned Alpha and Home.
    results:
    - 5

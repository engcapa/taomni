id: TC-WS-007
title: 'AC-12: actual shortcut opens Command Center; New creates a durable workspace'
description: 'AC-12: actual shortcut opens Command Center; New creates a durable workspace'
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- browser
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="workspace-navigator"]'
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- press: Control+k
- wait_for: '[data-testid="command-center"]'
- fill:
    selector: '[data-testid="command-center-search"]'
    value: QA Remote
- click: '[data-testid="command-center"] button:has-text("Workspace · QA Remote")'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: QA Remote
- click: '[data-testid="global-new"]'
- wait_for: '[data-testid="workspace-create-dialog"]'
- fill:
    selector: '[data-testid="workspace-name-input"]'
    value: QA Created
- click: '[data-testid="workspace-create-submit"]'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: QA Created
- reload_window: null
- wait_for: '[data-testid="workspace-navigator"]'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: QA Created
- click: '[data-testid="global-search"]'
- wait_for: '[data-testid="command-center"]'
- press: Escape
- assert_not_visible: '[data-testid="command-center"]'
verification:
  review: pending
  requirements:

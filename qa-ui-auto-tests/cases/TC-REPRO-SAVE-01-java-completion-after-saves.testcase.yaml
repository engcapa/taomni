id: TC-REPRO-SAVE-01-java-completion-after-saves
title: 'Regression: Java member completion must survive repeated Ctrl+S saves'
description: Real Java member completion must survive repeated saves. Navigate through the Go to Line:Column
  dialog to source position 10:1 and verify the original println statement before replacing it; ArrowDown
  counts visual lines and skips the default folded import block. Select from column zero so Home does
  not accumulate indentation. Preserve the main closing brace and verify each saved statement on disk,
  then require real LSP method rows for names. before saving and after all three save cycles.
covers:
- F25.5
tags:
- code-workspace
- completion
- native-gate
- regression
modes:
- native
fixtures:
- reset_db
- java_sample_projects
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-completion-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-save-cycle","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/App.java"},"lastOpenedAt":1788566400000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for:
    selector: '[data-testid="code-workspace-lsp-status-pill"][data-semantic-ready="true"]'
    timeout_sec: 120
- click: '[data-testid="code-workspace-editor"] .cm-content'
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Control+g
- wait_for:
    selector: '[data-testid="code-workspace-goto-line-dialog"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="code-workspace-goto-line-input"]'
    value: '10:1'
- press: Enter
- wait_for:
    selector: '[data-testid="code-workspace-goto-line-dialog"]'
    state: detached
    timeout_sec: 5
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '10:1'
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-activeLine'
    contains: System.out.println(names.size());
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Home
    - Home
    - Shift+End
- type: '        names.'
- wait_for:
    selector: .cm-tooltip-autocomplete li.cm-completion-type-method
    timeout_sec: 120
- screenshot: baseline-names-members.png
- press: Escape
- press: Home
- press: Home
- press: Shift+End
- type: '        names.size();'
- press: Mod+s
- assert_file_contains:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/App.java
    contains: "        names.size();\n    }"
    timeout_sec: 10
- press: Home
- press: Home
- press: Shift+End
- type: '        names.'
- wait_for:
    selector: .cm-tooltip-autocomplete li.cm-completion-type-method
    timeout_sec: 60
- screenshot: cycle1-names-members.png
- press: Escape
- press: Home
- press: Home
- press: Shift+End
- type: '        names.get(0);'
- press: Mod+s
- assert_file_contains:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/App.java
    contains: "        names.get(0);\n    }"
    timeout_sec: 10
- press: Home
- press: Home
- press: Shift+End
- type: '        names.'
- wait_for:
    selector: .cm-tooltip-autocomplete li.cm-completion-type-method
    timeout_sec: 60
- screenshot: cycle2-names-members.png
- press: Escape
- press: Home
- press: Home
- press: Shift+End
- type: '        names.clear();'
- press: Mod+s
- assert_file_contains:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/App.java
    contains: "        names.clear();\n    }"
    timeout_sec: 10
- press: Home
- press: Home
- press: Shift+End
- type: '        names.isEmpty();'
- press: Mod+s
- assert_file_contains:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/App.java
    contains: "        names.isEmpty();\n    }"
    timeout_sec: 10
- press: Home
- press: Home
- press: Shift+End
- type: '        names.'
- wait_for:
    selector: .cm-tooltip-autocomplete li.cm-completion-type-method
    timeout_sec: 60
- screenshot: cycle3-names-members.png

verification:
  review: reviewed
  requirements:
  - id: old-enabled
    requirement: The original signed host owns the active viewer and its saved session.
    actions: [4, 6, 7, 8, 9, 10, 12, 14, 15, 16, 17, 18, 19, 20, 21, 22, 24, 25, 26, 27, 31, 33, 34, 36, 37, 38, 42, 47, 48, 49, 53]
    checkpoints:
    - {step: 55, expectation: The original signed host owns the active viewer and its saved session.}
    results: [55]
  - id: old-disabled
    requirement: The previous host and its connection are gone. The saved session remains.
    actions: [56, 57, 58]
    checkpoints:
    - {step: 60, expectation: The previous host and its connection are gone. The saved session remains.}
    results: [60]
  - id: updated-disabled
    requirement: The downloaded signed version is active on disk and the client stays disabled.
    actions: [61, 62, 63, 66, 67, 68, 70, 71, 73, 75]
    checkpoints:
    - {step: 77, expectation: The downloaded signed version is active on disk and the client stays disabled.}
    results: [77]
  - id: rolled-back-disabled
    requirement: The original version returns on disk while the module remains disabled.
    actions: [78]
    checkpoints:
    - {step: 80, expectation: The original version returns on disk while the module remains disabled.}
    results: [80]
  - id: old-reenabled
    requirement: The original host reconnects the same saved session and receives fresh input.
    actions: [81, 83, 84, 85, 86, 87, 88, 92]
    checkpoints:
    - {step: 94, expectation: The original host reconnects the same saved session and receives fresh input.}
    results: [94]
  - id: updated-enabled
    requirement: The new host replaces the previous process under the original desktop PID.
    actions: [95, 96, 97, 99, 101]
    checkpoints:
    - {step: 103, expectation: The new host replaces the previous process under the original desktop PID.}
    results: [103]
  - id: failed-update
    requirement: The invalid handshake preserves the active version and its saved data.
    actions: [104, 105, 106, 107, 108, 109, 113, 115, 116, 117, 118, 119]
    checkpoints:
    - {step: 122, expectation: The invalid handshake preserves the active version and its saved data.}
    results: [122]
  - id: rolled-back-enabled
    requirement: The original host is restored under the same desktop process.
    actions: [123, 124, 125, 126, 127, 128, 132, 134, 135, 136]
    checkpoints:
    - {step: 138, expectation: The original host is restored under the same desktop process.}
    results: [138]
  - id: uninstalled
    requirement: The package and runtime are removed. The saved session is preserved.
    actions: [139, 140, 141, 142, 143, 144, 148, 150, 151, 152, 153]
    checkpoints:
    - {step: 156, expectation: The package and runtime are removed. The saved session is preserved.}
    results: [156]
  - id: reinstalled
    requirement: The current host resumes the same saved session with working input.
    actions: [157, 158, 159, 162, 163, 164, 165, 166, 168, 170, 171, 172, 173, 174, 175, 179]
    checkpoints:
    - {step: 181, expectation: The current host resumes the same saved session with working input.}
    results: [181]
  visual:
  - check: The attached and detached VNC viewers display frames from the signed host.
    method: automated
    reason: The case uses the normal renderer controls and reads their results.
  native:
  - check: Observe the signed host, original desktop PID, writer lease and retained profile data.
    method: automated
    reason: Each lifecycle record binds the installed bytes and native observations to the signed build.

id: TC-MODULES-112
title: Signed VNC Client reconnects the saved session across version switches
description: >-
  Switch between two signed VNC Client hosts while the desktop stays running. Verify
  authentication, frames and key delivery on a loopback RFB server, including in a detached
  WebView. Check connection cleanup, handshake recovery and the saved session after uninstall
  and reinstall.
covers: [F-Modules-1, F9.1, F9.6, F-Detach-1]
tags: [modules, vnc, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, vnc_required, module_signed_vnc_archive, module_marketplace, release_build_required]
timeout_sec: 660

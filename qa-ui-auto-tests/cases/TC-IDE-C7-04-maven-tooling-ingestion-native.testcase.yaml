id: TC-IDE-C7-04-maven-tooling-ingestion-native
title: Maven tooling ingestion over real project in packaged app
description: '§8.19.10 native gate case (ED-PROJECT-002). Enters the in-repo

  single-module Maven sample through persisted recents (no native picker),

  then proves the production useProjectFacts -> fetchProjectFacts ->

  workspace_ingest_maven_project chain resolves real modules from the on-disk

  pom.xml: the status badge reaches Ready, the discovery label reports Maven

  Discovered, and the workspace tree lists the sample root. Ingestion is

  read-only pom parsing, so pointing at the checked-in sample is side-effect

  free. Highest claim on green: L2 provider-backed (Linux).

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c7
- maven
- native-gate
- p1
modes:
- native
fixtures:
- reset_db
- java_sample_projects
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-m2","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastOpenedAt":1756100000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="project-facts-status-badge"]'
    timeout_sec: 90
- assert_text:
    selector: '[data-testid="project-facts-status-badge"]'
    contains: Ready
    timeout_sec: 30
- assert_visible: '[data-testid="project-facts-ready-icon"]'
- assert_text:
    selector: '[data-testid="project-facts-discovery-status"]'
    contains: Maven Discovered
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="code-workspace-tree-root"]'
    contains: maven-single
    timeout_sec: 30
- screenshot: tc-ide-c7-04-maven-ingestion.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Maven tooling ingestion over real project in packaged app：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"project-facts-status-badge\"]", "timeout_sec": 90}}'
    - step: 10
      expectation: '{"assert_text": {"selector": "[data-testid=\"project-facts-status-badge\"]", "contains": "Ready",
        "timeout_sec": 30}}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"project-facts-ready-icon\"]"}'
    - step: 12
      expectation: '{"assert_text": {"selector": "[data-testid=\"project-facts-discovery-status\"]", "contains":
        "Maven Discovered", "timeout_sec": 30}}'
    - step: 13
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "contains": "maven-single",
        "timeout_sec": 30}}'
    results:
    - 8
    - 9
    - 10
    - 11
    - 12
    - 13
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

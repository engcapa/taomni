    - 6
    - 7
    - 8
    - 9
    - 10
    - 11
  - id: R2
    requirement: Opening a local terminal and repeatedly returning through both Home
      entries creates no extra Home or terminal.
    actions:
    - 12
    - 14
    - 15
    - 16
    - 17
    - 20
    checkpoints:
    - step: 13
      expectation: Opening a local terminal and repeatedly returning through both
        Home entries creates no extra Home or terminal.
    - step: 18
      expectation: Opening a local terminal and repeatedly returning through both
        Home entries creates no extra Home or terminal.
    - step: 19
      expectation: Opening a local terminal and repeatedly returning through both
        Home entries creates no extra Home or terminal.
    - step: 21
      expectation: Opening a local terminal and repeatedly returning through both

id: TC-WS-020
title: Mode toolbar actions follow the prototype and Sessions onboarding has no Welcome
description: Checks exact ordered toolbar control lists for Home, Sessions, Workspaces and Tools. Operates both Home routes, empty Sessions creation/cancel, empty overview/close,
  the rail menu and Tools return route.
modes:
- browser
covers:
- F1.5
- F-WS-1
- F-WS-2
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-020
- wait_for: '[data-testid="welcome-panel"]'
- assert_items:
    selector: '[data-testid="platform-toolbar-actions"] button'
    attribute: data-testid
    equals:
    - home-toolbar-workspaces
    - home-toolbar-sessions
    - global-search-trigger
    - tab-overview-trigger
    - titlebar-actions-more
- assert_not_visible: '[data-testid="toggle-left-sidebar"]'
- assert_not_visible: '[data-testid="toggle-right-sidebar"]'
- click: '[data-testid="home-toolbar-sessions"]'
- wait_for: '[data-testid="sessions-empty-state"]'
- assert_items:
    selector: '[data-testid="platform-toolbar-actions"] button'
    attribute: data-testid
    equals:
    - tab-multiexec-toggle
    - platform-layout-single
    - tab-split-view
    - platform-layout-grid
    - tab-more
    - global-search-trigger
    - tab-overview-trigger
    - toggle-right-sidebar
    - titlebar-actions-more
- click: '[data-testid="sessions-empty-new-session"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-cancel"]'
- assert_not_visible: '[data-testid="session-editor"]'
- click: '[data-testid="tab-overview-trigger"]'
- wait_for: '[data-testid="tab-overview-empty"]'
- click: '[data-testid="tab-overview-close"]'
- assert_not_visible: '[data-testid="tab-overview"]'
- right_click: '[data-testid="sidebar-rail"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- press: Escape
- assert_not_visible: '[data-testid="context-menu"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="home-toolbar-workspaces"]'
- wait_for: '[data-testid="workspace-main-panel"]'
- assert_items:
    selector: '[data-testid="platform-toolbar-actions"] button'
    attribute: data-testid
    equals:
    - platform-layout-single
    - workspace-layout-split
    - platform-layout-grid
    - workspace-toolbar-bottom-dock
    - global-search-trigger
    - tab-overview-trigger
    - toggle-right-sidebar
    - titlebar-actions-more
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="tools-empty-state"]'
- assert_items:
    selector: '[data-testid="platform-toolbar-actions"] button'
    attribute: data-testid
    equals:
    - tools-toolbar-workspaces
    - global-search-trigger
    - tab-overview-trigger
    - toggle-right-sidebar
    - titlebar-actions-more
- click: '[data-testid="tools-toolbar-workspaces"]'
- assert_attribute:
    selector: '[data-testid="platform-toolbar-actions"]'
    name: data-mode
    equals: workspaces
- assert_visible: '[data-testid="workspace-main-panel"]'
- screenshot: ws-020-mode-toolbar-order.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home、Sessions、Workspaces、Tools 工具栏按原型排列并提供对应导航；Sessions 空状态不显示 Welcome，创建/取消及空预览均可用。
    actions:
    - 1
    - 2
    - 7
    - 10
    - 12
    - 14
    - 16
    - 18
    - 20
    - 22
    - 23
    - 26
    - 29
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"assert_items": {"selector": "[data-testid=\"platform-toolbar-actions\"] button", "attribute": "data-testid", "equals": ["home-toolbar-workspaces", "home-toolbar-sessions",
        "global-search-trigger", "tab-overview-trigger", "titlebar-actions-more"]}}'
    - step: 5
      expectation: '{"assert_not_visible": "[data-testid=\"toggle-left-sidebar\"]"}'
    - step: 6
      expectation: '{"assert_not_visible": "[data-testid=\"toggle-right-sidebar\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"sessions-empty-state\"]"}'
    - step: 9
      expectation: '{"assert_items": {"selector": "[data-testid=\"platform-toolbar-actions\"] button", "attribute": "data-testid", "equals": ["tab-multiexec-toggle", "platform-layout-single",
        "tab-split-view", "platform-layout-grid", "tab-more", "global-search-trigger", "tab-overview-trigger", "toggle-right-sidebar", "titlebar-actions-more"]}}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 13
      expectation: '{"assert_not_visible": "[data-testid=\"session-editor\"]"}'
    - step: 15
      expectation: '{"wait_for": "[data-testid=\"tab-overview-empty\"]"}'
    - step: 17
      expectation: '{"assert_not_visible": "[data-testid=\"tab-overview\"]"}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"sidebar-rail-menu-show-names\"]"}'
    - step: 21
      expectation: '{"assert_not_visible": "[data-testid=\"context-menu\"]"}'
    - step: 24
      expectation: '{"wait_for": "[data-testid=\"workspace-main-panel\"]"}'
    - step: 25
      expectation: '{"assert_items": {"selector": "[data-testid=\"platform-toolbar-actions\"] button", "attribute": "data-testid", "equals": ["platform-layout-single", "workspace-layout-split",
        "platform-layout-grid", "workspace-toolbar-bottom-dock", "global-search-trigger", "tab-overview-trigger", "toggle-right-sidebar", "titlebar-actions-more"]}}'
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"tools-empty-state\"]"}'
    - step: 28
      expectation: '{"assert_items": {"selector": "[data-testid=\"platform-toolbar-actions\"] button", "attribute": "data-testid", "equals": ["tools-toolbar-workspaces", "global-search-trigger",
        "tab-overview-trigger", "toggle-right-sidebar", "titlebar-actions-more"]}}'
    - step: 30
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"platform-toolbar-actions\"]", "name": "data-mode", "equals": "workspaces"}}'
    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"workspace-main-panel\"]"}'
    results:
    - 3
    - 4
    - 5
    - 6
    - 8
    - 9
    - 11
    - 13
    - 15
    - 17
    - 19
    - 21
    - 24
    - 25
    - 27
    - 28
    - 30
    - 31
  visual:
  - check: 各视图右上角图标、布局按钮及模式操作符合 HTML 原型。
    method: manual
    reason: 精确顺序由自动断言覆盖，外观仍需截图评审。
  native:
  - check: 此用例验证 renderer 布局与导航。原生 PTY、文件读写由 TC-WS-018/019 保护。
    method: external
    reason: 不以 browser 断言替代原生边界验证。

id: TC-ORCH-PARTIAL-002
title: A truncated protocol response preserves complete candidates and recovery needs explicit consent
description: Native mode uses a real loopback Anthropic-compatible SSE fixture and durable SQLite/artifact state. Browser mode proves only the renderer's deterministic partial and recovery workflow.
modes: [browser, native]
covers: [F-ORCH-1]
tags: [p0, orchestration, partial-recovery, crash-regression]
fixtures: [reset_db, orchestration_llm]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-orch-partial
- click: '[data-testid="home-open-agents"]'
- wait_for: '[data-testid="orch-workspace"]'
- click: '[data-testid="orch-project-add"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.orchestration_project}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- select_option:
    selector: '[data-testid="orch-intent"]'
    value: plan
- fill:
    selector: '[data-testid="orch-prompt"]'
    value: Design a compatible settings field, interface contract and test plan.
- click: '[data-testid="orch-send"]'
- wait_for: '[data-testid="orch-approve-plan"]'
- click: '[data-testid="orch-approve-plan"]'
- wait_for:
    selector: '[data-testid="orch-run-status"][data-status="partial"]'
    timeout_sec: 90
- assert_count:
    selector: '[data-testid^="orch-partial-artifact-"]'
    equal: 2
- click: '[data-testid^="orch-partial-artifact-"]:first-of-type'
- wait_for: '[data-testid="orch-artifact-content"]'
- assert_text:
    selector: '[data-testid="orch-artifact-content"]'
    contains: candidate
- click: '[data-testid="orch-recovery-open"]'
- wait_for: '[data-testid="orch-recovery-dialog"]'
- click: '[data-testid="orch-recovery-dismiss"]'
- assert_attribute:
    selector: '[data-testid="orch-run-status"]'
    name: data-status
    equals: partial
- reload_window: null
- wait_for:
    selector: '[data-testid="orch-run-status"][data-status="partial"]'
    timeout_sec: 30
- assert_count:
    selector: '[data-testid^="orch-partial-artifact-"]'
    equal: 2
- assert_not_visible: '[data-testid="orch-recovery-dialog"]'
- click: '[data-testid="orch-recovery-open"]'
- click: '[data-testid="orch-recovery-confirm"]'
- wait_for:
    selector: '[data-testid="orch-run-status"][data-status="candidate"]'
    timeout_sec: 90
- assert_not_visible: '[data-testid="orch-recovery-open"]'
- click: '[data-testid="orch-show-changes"]'
- wait_for: '[data-testid="orch-artifacts-panel"]'
- assert_count:
    selector: '[data-testid^="orch-artifact-"]:not([data-testid="orch-artifact-content"])'
    equal: 3
- assert_no_runtime_errors: null
- screenshot: orchestration-retained-candidates-and-recovery.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A truncated Anthropic planning response preserves two complete candidates; dismissing recovery and reloading
      does not retry.
    actions:
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 15
    - 18
    - 20
    - 22
    checkpoints:
    - step: 13
      expectation: Initial request ends partial.
    - step: 14
      expectation: Exactly two complete candidates survive.
    - step: 17
      expectation: A retained candidate body is readable.
    - step: 21
      expectation: Dismissing consent leaves task partial.
    - step: 23
      expectation: Reload restores partial terminal state.
    - step: 24
      expectation: The same two candidates remain.
    - step: 25
      expectation: Recovery consent was not silently restored or accepted.
    results:
    - 13
    - 14
    - 17
    - 21
    - 23
    - 24
    - 25
  - id: R2
    requirement: One explicit recovery adds only missing output and retains earlier candidate identities and hashes.
    actions:
    - 26
    - 27
    - 30
    checkpoints:
    - step: 28
      expectation: Authorized recovery yields an unaccepted candidate group.
    - step: 29
      expectation: No second recovery is offered.
    - step: 32
      expectation: Exactly design, contract and tests candidates exist.
    - step: 33
      expectation: No runtime errors occurred.
    results:
    - 28
    - 29
    - 32
    - 33
  visual:
  - check: Approved v0.6 conversation-first layout and terminal-state screenshot
    method: manual
    reason: The authored screenshot is retained for review; selectors and static checks alone do not prove visual fidelity
      and no screenshot is claimed reviewed or executed.
  native:
  - check: Named native boundary and independent evidence
    method: automated
    reason: Native teardown verifies exactly two Anthropic streaming POSTs (partial then complete), main failed + recovery
      completed ledger/attempts, recoveryCount=1, no extra candidate_saved events, and every original/final candidate
      file hash against SQLite/run snapshots. Browser stub does not establish real HTTP/disk behavior.

id: TC-WS-007
title: Open any global session inside a workspace and keep runtime instances isolated
description: v6.1 AC-07 / DEC-04. Workspaces mode opens global sessions that are not linked to the workspace through the tab-strip + menu, the Ctrl+Alt+O picker and the rail
  Sessions tool window. The workspace-owned instance lives only in the workspace's tab list, so opening/closing it never creates, closes or reconnects the Sessions-mode tab for the
  same saved session.
modes:
- browser
- native
covers:
- F1.5
- F2.4
- F-WS-5
tags:
- smoke
- p0
- workspace-redesign
- session
fixtures:
- reset_db
timeout_sec: 180

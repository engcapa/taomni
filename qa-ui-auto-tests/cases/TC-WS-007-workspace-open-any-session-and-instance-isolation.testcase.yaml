  visual:
  - check: 检查截图选择器、左栏置顶列表与工作区标签条布局无遮挡。
    method: manual
    reason: 像素布局与遮挡需要截图人工评审。
  native:
  - check: 原生 WebView 中执行相同步骤；独立 PTY 连接健康度由 TC-WS-012 证明。
    method: automated
    reason: browser 无法证明 PTY 运行态，未执行平台不计作通过。

id: TC-WS-007
title: Open any global session inside a workspace and keep runtime instances isolated
description: v6.1 AC-07 / DEC-04. Workspaces mode opens global sessions that are not linked to the workspace through the tab-strip + menu, the Ctrl+Alt+O
  picker and the rail Sessions tool window. The workspace-owned instance lives only in the workspace's tab list, so opening/closing it never creates, closes
  or reconnects the Sessions-mode tab for the same saved session.
modes:
- browser
- native
covers:
- F1.5
- F2.4
- F-WS-5
tags:
- smoke
- p0
- workspace-redesign
- session
fixtures:
- reset_db
- ssh_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-007
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: prod-api-01
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="prod-api-01"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-menu"]'
- click: '[data-testid="workspace-plus-open-session"]'
- wait_for: '[data-testid="workspace-session-picker-modal"]'
- assert_visible: '[data-testid="workspace-session-picker-search"]'
- assert_visible: '[data-testid="workspace-session-picker-filter-ssh"]'
- assert_visible: '[data-testid="workspace-session-picker-filter-db"]'
- assert_visible: '[data-testid="workspace-session-picker-filter-sftp"]'
- assert_visible: '[data-testid="workspace-session-picker-filter-desktop"]'
- assert_text:
    selector: '[data-testid="workspace-session-picker-modal"]'
    contains: prod-api-01
- click: '[data-testid="workspace-session-picker-filter-ssh"]'
- wait_for: '[data-testid="workspace-session-picker-row"]'
- click: '[data-testid="workspace-session-picker-filter-db"]'
- assert_count:
    selector: '[data-testid="workspace-session-picker-row"]'
    equal: 0
- click: '[data-testid="workspace-session-picker-filter-all"]'
- fill:
    selector: '[data-testid="workspace-session-picker-search"]'
    value: prod
- assert_count:
    selector: '[data-testid="workspace-session-picker-row"]'
    equal: 1
- fill:
    selector: '[data-testid="workspace-session-picker-search"]'
    value: ''
- click: '[data-testid="workspace-session-picker-pin"]'
- click: '[data-testid="workspace-session-picker-row"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- wait_for: '[data-testid="workspace-tab"][data-tab-kind="terminal"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-menu"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_text:
    selector: '[data-testid="workspace-tab-strip"]'
    contains: Local Terminal
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for: '[data-testid="sessions-sidebar-panel"]'
- assert_not_visible: '[data-testid="workspace-tab-strip"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-tab-strip"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    min: 2
- click: '[data-testid="workspace-tab"][data-tab-kind="terminal"]:not([data-active]) [data-testid="workspace-tab-close"]'
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="terminal"]'
    equal: 1
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-open-session-plus"]'
- screenshot: ws-007-workspace-isolated-session.png
- assert_attribute:
    selector: '[data-testid="workspace-linked-sessions-toggle"]'
    name: aria-expanded
    equals: 'false'
- click: '[data-testid="workspace-linked-sessions-toggle"]'
- assert_visible: '[data-testid="workspace-linked-session"]'
- click: '[data-testid="workspace-linked-sessions-toggle"]'
- assert_not_visible: '[data-testid="workspace-linked-session"]'
- click: '[data-testid="workspace-linked-sessions-toggle"]'
- assert_visible: '[data-testid="workspace-linked-session"]'
- click: '[data-testid="workspace-link-session"]'
- wait_for: '[data-testid="workspace-session-picker-modal"]'
- press: Escape
- assert_not_visible: '[data-testid="workspace-session-picker-modal"]'
- click: '[data-testid="workspace-linked-session"]'
- assert_text:
    selector: '[data-testid="workspace-tab-strip"]'
    contains: prod-api-01
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- assert_visible: '[data-testid="workspace-session-pane"][data-session-id]'

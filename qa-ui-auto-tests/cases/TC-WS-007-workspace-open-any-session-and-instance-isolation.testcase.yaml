id: TC-WS-007
title: Workspace opens any global session as an isolated instance across modes
description: 'Workspace-first platform redesign AC-07. A global session is created through the session editor; the workspace + menu and the picker then list it (not only pinned ones) and open it as an isolated workspace tab. Switching to Sessions mode and back keeps both runtimes separate: the workspace tab survives while the global tree shows the same session config.'
covers:
- F1.5
- F2.4
- F-WS-5
tags:
- workspace-platform
- sessions
- isolation
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: qa-ws-any.invalid
- fill:
    selector: '[data-testid="session-port"]'
    value: '22'
- click: '[data-testid="session-specify-username"]'
- fill:
    selector: '[data-testid="session-user"]'
    value: qa
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-any-session
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-any-session"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-sidebar"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-plus-menu"]'
- assert_visible: '[data-testid="workspace-plus-new-terminal"]'
- assert_visible: '[data-testid="workspace-plus-open-session"]'
- click: '[data-testid="workspace-plus-open-session"]'
- wait_for: '[data-testid="workspace-session-picker-modal"]'
- assert_visible: '[data-testid="workspace-session-picker-search"]'
- assert_visible: '[data-testid="workspace-session-picker-list"]'
- fill:
    selector: '[data-testid="workspace-session-picker-search"]'
    value: qa-any
- wait_for: '[data-testid="workspace-session-picker-row"][data-session-name="qa-any-session"]'
- click: '[data-testid="workspace-session-picker-pin"]'
- click: '[data-testid="workspace-session-picker-row"][data-session-name="qa-any-session"]'
- wait_for: '[data-testid="workspace-tab-item"][data-tab-kind="terminal"]'
- assert_localstorage:
    key: taomni.platformWorkspaces.v1
    contains: pinnedSessionIds
- click: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-sessions"]'
- wait_for: '[data-testid="workspace-sessions-lens"]'
- assert_visible: '[data-testid="workspace-pinned-session"][data-session-name="qa-any-session"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-any-session"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-sidebar"]'
- assert_visible: '[data-testid="workspace-tab-item"][data-tab-kind="terminal"]'
- screenshot: tc-ws-007-isolated-sessions.png

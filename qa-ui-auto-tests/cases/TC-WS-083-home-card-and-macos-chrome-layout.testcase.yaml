id: TC-WS-083
title: Tao Home dock remains inside the viewport and keeps native shell clearance
description: Regression for the Home shell after the Tao Home migration. Browser checks compact geometry and native checks the packaged WebView across the supported desktop platforms.
modes:
- browser
- native
covers:
- F1.11
- F-WS-1
fixtures:
- reset_db
tags:
- regression
- workspace-redesign
- tao-home
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-home-layout
- wait_for: '[data-testid="tao-home-host"]'
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="tao-home-topbar"]'
- assert_visible: '[data-testid="tao-home-binding-bar"]'
- assert_visible: '[data-testid="tao-home-composer"]'
- assert_visible: '[data-testid="tao-home-dock-row"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"tao-home-dock-row"]').getBoundingClientRect().bottom < window.innerHeight + 2 && document.querySelector('[data-testid' + String.fromCharCode(61) + '"tao-home-composer"]').getBoundingClientRect().left > -1
    expect_truthy: true
- click: '[data-testid="tao-home-history"]'
- wait_for: '[data-testid="tao-home-history-popover"]'
- press: Escape
- assert_not_visible: '[data-testid="tao-home-history-popover"]'
- press: Mod+k
- wait_for: '[data-testid="tao-home-search-panel"]'
- press: Escape
- assert_not_visible: '[data-testid="tao-home-search-panel"]'
- assert_not_visible: '[data-testid="tao-home-lan-chat"]'
- assert_no_runtime_errors: null
- screenshot: ws-083-tao-home-shell.png

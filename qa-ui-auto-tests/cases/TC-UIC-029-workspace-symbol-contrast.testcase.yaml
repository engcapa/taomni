id: TC-UIC-029-workspace-symbol-contrast
title: File tabs and File Structure symbols stay readable in Light and Dark
covers: [F25.5]
tags: [ui-contract, code-workspace, theme]
modes: [browser, native]
fixtures: [reset_db, workspace_explorer]
ui_standard: [UI-FND-03a, UI-FND-03c]
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-symbols
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-outline","name":"Symbols","roots":[{"id":"qa-outline","name":"qa-outline","path":"${fixture.platform_workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-outline","path":"src/main/java/com/example/App.java"},"lastOpenedAt":1788566400000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-workspaces"]'
- click: '[data-testid="tao-home-history-row"][data-workspace-path="${fixture.platform_workspace_root}"]'
- assert_text: {selector: '[data-testid="code-workspace-editor"] .cm-content', contains: 'class App'}
- click: '[data-testid="theme-cycle"]'
- assert_attribute: {selector: html, name: data-app-theme, equals: light}
- assert_solid_text_contrast: {selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"] [data-file-type="java"]', minimum: 4.5}
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+F12
- assert_text: {selector: '[data-testid="code-workspace-structure-title"]', contains: App.java}
- assert_solid_text_contrast: {selector: '[data-testid="code-workspace-structure-popup"] [data-symbol-kind="5"]', minimum: 4.5}
- press: Escape
- click: '[data-testid="theme-cycle"]'
- assert_attribute: {selector: html, name: data-app-theme, equals: dark}
- assert_solid_text_contrast: {selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"] [data-file-type="java"]', minimum: 4.5}
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+F12
- assert_solid_text_contrast: {selector: '[data-testid="code-workspace-structure-popup"] [data-symbol-kind="5"]', minimum: 4.5}
- press: Enter
- assert_not_visible: '[data-testid="code-workspace-structure-popup"]'
- assert_text: {selector: '[data-testid="code-workspace-editor"] .cm-content', contains: 'class App'}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: themed-badges
    requirement: The active Java tab and the class badge in its file outline have legible glyphs at both explicit application theme settings.
    ui_standard: [UI-FND-03a, UI-FND-03c]
    actions: [7, 9, 13, 16, 17, 21, 23]
    checkpoints:
    - {step: 10, expectation: The application is in Light mode.}
    - {step: 11, expectation: The Java file type glyph clears 4.5 to 1.}
    - {step: 14, expectation: File Structure names the active Java file.}
    - {step: 15, expectation: The class glyph clears 4.5 to 1 in Light.}
    - {step: 18, expectation: The application is in Dark mode.}
    - {step: 19, expectation: The Java file type glyph clears 4.5 to 1 in Dark.}
    - {step: 22, expectation: The class glyph clears 4.5 to 1 in Dark.}
    - {step: 24, expectation: Activating the symbol dismisses the outline.}
    - {step: 25, expectation: The editor still shows the Java declaration.}
    results: [10, 11, 14, 15, 18, 19, 22, 24, 25]
  visual:
  - {check: Badge contrast, method: automated, reason: Measures the foreground and painted background of the actual file and class glyphs.}
  native:
  - {check: Packaged workspace, method: automated, reason: Opens the seeded Java source on the native filesystem and invokes File Structure from the editor.}

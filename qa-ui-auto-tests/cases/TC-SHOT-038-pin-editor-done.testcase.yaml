id: TC-SHOT-038
title: Editing a pin offers replacement, a new pin or copy only; replacement updates
  the original and copies annotated pixels
covers:
- F27.1
tags:
- screenshot
- pins
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- wait_for: '[data-testid="screenshot-pin-tools-window"]'
- screenshot: pin-options.png
- click: '[data-testid="screenshot-pin-edit"]'
- wait_for: '[data-testid="screenshot-scroll-result-copy"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position:
      x: 10
      y: 10
    to_position:
      x: 35
      y: 35
- click: '[data-testid="screenshot-scroll-result-copy"]'
- wait_for: '[data-testid="screenshot-pin-done-dialog"]'
- screenshot: pin-edit-done.png
- assert_visible: '[data-testid="screenshot-pin-done-new"]'
- assert_visible: '[data-testid="screenshot-pin-done-copy"]'
- press: Escape
- assert_not_visible: '[data-testid="screenshot-pin-done-dialog"]'
- click: '[data-testid="screenshot-scroll-result-copy"]'
- click: '[data-testid="screenshot-pin-done-replace"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split("screenshot_update_pin").length
      === 2
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- wait_for: '[data-testid="screenshot-pin-tools-window"]'
- click: '[data-testid="screenshot-pin-edit"]'
- wait_for: '[data-testid="screenshot-scroll-result-copy"]'
- click: '[data-testid="screenshot-scroll-result-copy"]'
- click: '[data-testid="screenshot-pin-done-cancel"]'
- assert_not_visible: '[data-testid="screenshot-pin-done-dialog"]'
- click: '[data-testid="screenshot-scroll-result-copy"]'
- click: '[data-testid="screenshot-pin-done-new"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_pin_to_screen"').length
      === 3
- click: '[data-testid="screenshot-pin-menu-toggle"]'
- wait_for: '[data-testid="screenshot-pin-tools-window"]'
- click: '[data-testid="screenshot-pin-edit"]'
- wait_for: '[data-testid="screenshot-scroll-result-copy"]'
- click: '[data-testid="screenshot-scroll-result-copy"]'
- click: '[data-testid="screenshot-pin-done-copy"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_copy_image"').length
      === 4 && JSON.stringify(window.__taomniStubScreenshotCalls).split("screenshot_update_pin").length
      === 2
- click: '[data-testid="screenshot-pin-close"]'
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: pin-edit-done
    requirement: Done offers replace/new/copy-only; Escape and Cancel preserve the
      edit. Replacement updates the original, new creates another pin, copy-only closes
      without another replacement, and all three paths copy.
    actions:
    - 6
    - 9
    - 11
    - 12
    - 13
    - 18
    - 20
    - 21
    - 24
    - 26
    - 28
    - 29
    - 31
    - 32
    - 35
    - 37
    - 39
    - 40
    checkpoints:
    - step: 14
      expectation: The Done choice is visible.
    - step: 22
      expectation: The same pin route displays updated pixels.
    - step: 23
      expectation: Replacement reached the screenshot_update_pin boundary exactly
        once.
    - step: 19
      expectation: Escape closes the choice while retaining the editor.
    - step: 30
      expectation: Cancel closes the choice while retaining the editor.
    - step: 34
      expectation: New pin reaches the pin creation boundary a second time.
    - step: 42
      expectation: All three Done paths copied and only replacement updated the source.
    results:
    - 14
    - 19
    - 22
    - 23
    - 30
    - 34
    - 42
  native:
  - check: The options window is independent; the editor can resize; replacement updates
      pin pixels and OS clipboard.
    method: external
    reason: TC-SHOT-N17 verifies actual windows, IPC, stored PNG and OS clipboard.
  visual:
  - check: Independent pin options and Done choices stay readable.
    method: automated
    reason: The browser case retains pin-options.png and pin-edit-done.png; native
      N17 separately verifies real windows.

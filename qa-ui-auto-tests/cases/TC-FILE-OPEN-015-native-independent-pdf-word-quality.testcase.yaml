  visual:
  - check: Diagram labels, page boundaries and popup placement
    method: manual
    reason: Inspect retained screenshots and actual exported documents; structural evidence alone does not establish visual
      fidelity.
  native:
  - check: Real save dialog, filesystem or Home SQLite persistence across WebView reload
    method: automated
    reason: Browser stubs cannot establish native IPC, saved bytes, native WebView rendering or persisted snapshots.

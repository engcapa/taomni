verification:
  review: reviewed
  requirements:
    - id: V-09-POLICY
      ui_standard: [UI-I18N-01]
      requirement: 全部当前 TabKind 及未知类型展示对应受限策略，没有默认自动连接路径
      actions: [2, 3, 4, 5, 9, 15, 17, 19, 21, 23, 25, 27, 29, 31, 33, 35, 37, 39, 41, 43, 45, 47, 49, 51, 53]
      checkpoints: [{step: 7, expectation: 包含全部当前类型与1个未知类型}, {step: 38, expectation: HBase不被当成PTY}, {step: 54, expectation: 未知类型准确提示}, {step: 55, expectation: 不挂载普通终端}]
      results: [7, 38, 54, 55]
    - id: V-05-KEYBOARD
      requirement: 标签按DOM顺序支持Tab加Enter键选择，不需要鼠标专用路由
      actions: [9, 11, 12]
      checkpoints: [{step: 13, expectation: RDP标签通过真实键盘动作选中}, {step: 14, expectation: 内容路由切换到RDP限制}]
      results: [13, 14]
  visual: [{check: 对应限制文本及选中状态, method: automated, reason: DOM属性/文本断言；不证明完整视觉布局}]
  native: [{check: 当前session与9个Tools的真实外部副作用, method: manual, reason: 本例只验证共同路由；完整映射和代表性原生测试见test-cases.md与native runbook}]

id: TC-RDPJ-01-client-server-loopback
title: Taomni RDP client connects to Taomni's own RDP server - desktop, input on the host and the full-screen connection bar
description: |
  V-18 and V-20 (docs-feature/rdp-server-parity-design.md §4.6, §4.8,
  AC-15, AC-19). One QA build plays both roles: it starts the RDP server
  from Local servers and opens a saved RDP session to 127.0.0.1 on the same
  port, so the product client is tested against the product server.

  Starting the server creates the credential vault. After NLA and the
  first-use certificate confirmation the client shows the host desktop. A
  click on the client canvas at the Tk target's desktop position must flip
  the target on the host (its state file counts the flips), proving client
  input reaches the host through the server. In OS full screen the
  connection bar appears with a connection quality taken from the server's
  Network Characteristics Result (auto-detect RTT); pointing at the top edge
  brings it back after it slides away, restore leaves full screen, and in a
  second full screen the bar's disconnect ends the session. The server then
  accepts an independent probe connection, so it went back to waiting (it
  serves one client at a time). On Windows platform_choice picks Taomni over
  the runner's system Remote Desktop.
covers:
- F-RdpServer-1
- F9.7
tags:
- rdp
- rdp-server
- rdp-client
- joint
- p1
modes:
- native
fixtures:
- reset_db
- rdp_server_required
- system_rdp_running
timeout_sec: 480
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-rdp"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: 127.0.0.1
- fill:
    selector: '[data-testid="session-port"]'
    value: ${env.QA_RDP_PORT}
- click: '[data-testid="session-specify-username"]'
- fill:
    selector: '[data-testid="session-user"]'
    value: ${env.QA_RDP_USER}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-rdp-loopback
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-rdp-loopback"]'
- open_route: '?servers=main'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 30
- click: '[data-testid="server-row-rdp"]'
- fill:
    selector: '[data-testid="server-field-port"]'
    value: ${env.QA_RDP_PORT}
- fill:
    selector: '[data-testid="server-field-bind-address"]'
    value: 127.0.0.1
- set_check:
    selector: '[data-testid="server-field-auto-stop"]'
    checked: false
- fill:
    selector: '[data-testid="rdp-field-username"]'
    value: ${env.QA_RDP_USER}
- fill:
    selector: '[data-testid="rdp-field-password"]'
    value: ${env.QA_RDP_PASSWORD}
- set_check:
    selector: '[data-testid="rdp-field-control-approval"]'
    checked: false
- click: '[data-testid="server-row-rdp-start"]'
- platform_choice:
    platforms:
    - Windows
    dialog: '[data-testid="choice-dialog"]'
    click: '[data-testid="choice-dialog-secondary"]'
- wait_for:
    selector: '[data-testid="vault-setup-dialog"]'
    timeout_sec: 30
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: ${env.QA_VAULT_PASSWORD}
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: ${env.QA_VAULT_PASSWORD}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="running"]'
    timeout_sec: 90
- host_helper:
    action: start
    name: target
    mode: flip
    geometry: 480x320+40+80
- open_route: /
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 30
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-rdp-loopback"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_RDP_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="confirm-dialog"]'
    timeout_sec: 60
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_text:
    selector: '[data-testid="rdp-status"]'
    contains: Connected
    timeout_sec: 60
- rdp_canvas_click:
    x: 280
    y: 240
- assert_json_file:
    path: target-state.json
    timeout_sec: 20
    expect:
      flips:
        min: 1
- click: '[data-testid="rdp-view-cycle"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"][data-visible="true"]'
    timeout_sec: 15
- wait_for:
    selector: '[data-testid="rdp-bar-quality"]:not([data-level="0"])'
    timeout_sec: 45
- hover: '[data-testid="rdp-bar-hotzone"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"][data-visible="true"]'
    timeout_sec: 10
- click: '[data-testid="rdp-bar-restore"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"]'
    state: detached
    timeout_sec: 15
- click: '[data-testid="rdp-view-cycle"]'
- hover: '[data-testid="rdp-bar-hotzone"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"][data-visible="true"]'
    timeout_sec: 15
- click: '[data-testid="rdp-bar-disconnect"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"]'
    state: detached
    timeout_sec: 15
- assert_text:
    selector: '[data-testid="rdp-status"]'
    contains: Disconnected
    timeout_sec: 20
- rdp_probe:
    scenario: connect
    artifact: still-serving
    args:
      seconds: 2
    expect:
      first_graphics_ms:
        exists: true
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The product client completes NLA against the product server after confirming its certificate and shows the host desktop.
    actions:
    - 24
    - 34
    - 37
    - 39
    checkpoints:
    - step: 26
      expectation: Starting the server asks for the vault master password (first credential stored).
    - step: 30
      expectation: The RDP server runs on the case port.
    - step: 38
      expectation: The client asks to trust the server's self-signed certificate.
    - step: 40
      expectation: The client reports the session as connected.
    results:
    - 40
  - id: R2
    requirement: A click on the client canvas reaches the host desktop through the server.
    actions:
    - 41
    checkpoints:
    - step: 42
      expectation: The Tk target on the host recorded at least one flip.
    results:
    - 42
  - id: R3
    requirement: In OS full screen the connection bar shows the server-measured connection quality, comes back from the top edge, restores the window and disconnects the session.
    actions:
    - 43
    - 46
    - 48
    - 50
    - 51
    - 53
    checkpoints:
    - step: 44
      expectation: The connection bar is visible after entering full screen.
    - step: 45
      expectation: The quality indicator left the not-measured state (Network Characteristics Result received).
    - step: 47
      expectation: Pointing at the top edge shows the bar again.
    - step: 49
      expectation: Restore leaves full screen and removes the bar.
    - step: 52
      expectation: The bar is shown again in a second full screen.
    - step: 54
      expectation: Disconnect leaves full screen and removes the bar.
    - step: 55
      expectation: The client reports the session as disconnected.
    - step: 56
      expectation: The server accepts a new connection, so it went back to waiting.
    results:
    - 45
    - 49
    - 55
    - 56
  native:
  - check: Real desktop session on the runner with the product RDP client and server in one QA build, OS-level input injection and OS full screen.
    method: automated
    reason: Browser mode has neither the RDP client transport nor the server.
  visual:
  - check: Not a pixel comparison; the bar's presence and quality level are asserted through attributes.
    method: not-applicable
    reason: Visual layout of the bar is covered by Vitest and review.

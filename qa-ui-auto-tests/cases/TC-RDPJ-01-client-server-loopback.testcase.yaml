    requirement: The product client completes NLA against the product server after confirming its certificate
      and shows the host desktop.
    actions:
    - 2
    - 15
    - 26
    - 35
    - 37
    - 40
    - 42
    checkpoints:
    - step: 28
      expectation: '{"wait_for": {"selector": "[data-testid=\"vault-setup-dialog\"]", "timeout_sec": 30}}'
    - step: 32
      expectation: '{"wait_for": {"selector": "[data-testid=\"server-row-rdp\"][data-status=\"running\"]",
        "timeout_sec": 90}}'
    - step: 41
      expectation: '{"wait_for": {"selector": "[data-testid=\"confirm-dialog\"]", "timeout_sec": 60}}'
    - step: 43
      expectation: '{"assert_text": {"selector": "[data-testid=\"rdp-status\"]", "contains": "Connected",
        "timeout_sec": 60}}'
    results:
    - 43
  - id: R2
    requirement: A click on the client canvas reaches the host desktop through the server.
    actions:
    - 44
    checkpoints:
    - step: 45
      expectation: '{"assert_json_file": {"path": "target-state.json", "timeout_sec": 20, "expect": {"flips":
        {"min": 1}}}}'
    results:
    - 45
  - id: R3
    requirement: In OS full screen the connection bar shows the server-measured connection quality, comes
      back from the top edge, restores the window and disconnects the session.
    actions:
    - 46
    - 49
    - 51
    - 53
    - 54
    - 56
    checkpoints:
    - step: 47
      expectation: '{"wait_for": {"selector": "[data-testid=\"rdp-connection-bar\"][data-visible=\"true\"]",
        "timeout_sec": 15}}'
    - step: 48
      expectation: '{"wait_for": {"selector": "[data-testid=\"rdp-bar-quality\"]:not([data-level=\"0\"])",
        "timeout_sec": 45}}'
    - step: 50
      expectation: '{"wait_for": {"selector": "[data-testid=\"rdp-connection-bar\"][data-visible=\"true\"]",
        "timeout_sec": 10}}'
    - step: 52
      expectation: '{"wait_for": {"selector": "[data-testid=\"rdp-connection-bar\"]", "state": "detached",
        "timeout_sec": 15}}'
    - step: 55
      expectation: '{"wait_for": {"selector": "[data-testid=\"rdp-connection-bar\"][data-visible=\"true\"]",
        "timeout_sec": 15}}'
    - step: 57
      expectation: '{"wait_for": {"selector": "[data-testid=\"rdp-connection-bar\"]", "state": "detached",
        "timeout_sec": 15}}'
    - step: 58
      expectation: '{"assert_text": {"selector": "[data-testid=\"rdp-status\"]", "contains": "Disconnected",
        "timeout_sec": 20}}'
    - step: 59
      expectation: '{"rdp_probe": {"scenario": "connect", "artifact": "still-serving", "args": {"seconds":
        2}, "expect": {"first_graphics_ms": {"exists": true}}}}'
    results:
    - 48
    - 52
    - 58
    - 59
  native:
  - check: Real desktop session on the runner with the product RDP client and server in one QA build,
      OS-level input injection and OS full screen.
    method: automated
    reason: Browser mode has neither the RDP client transport nor the server.
  visual:
  - check: Not a pixel comparison; the bar's presence and quality level are asserted through attributes.
    method: not-applicable
    reason: Visual layout of the bar is covered by Vitest and review.

  visual:
  - check: The network editor shows the proxy, keep-alive, and Vault controls without overlap or clipped values.
    method: manual
    reason: Attribute and value assertions do not assess the layout or text clipping.
  native:
  - check: The packaged session database persists SOCKS5, keep-alive, TCP_NODELAY, and IP version settings and excludes the proxy password when Vault save is off.
    method: automated
    reason: Browser mode uses local-storage stubs and cannot establish SQLite persistence or the packaged storage boundary.

id: TC-123
title: SSH network settings persist SOCKS5, keep-alive, and TCP/IP options
covers:
- F6.2
- F6.3
tags:
- ssh
- session
- settings
- network
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-network-settings.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-network-user
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: socks5
- fill:
    selector: 'input[aria-label="Proxy host"]'
    value: 127.0.0.1
- fill:
    selector: 'input[aria-label="Proxy port"]'
    value: '1080'
- fill:
    selector: 'input[aria-label="Proxy username"]'
    value: qa-proxy-user
- fill:
    selector: 'input[aria-label="Proxy password"]'
    value: qa-proxy-secret-not-for-storage
- set_check:
    selector: '[data-testid="session-proxy-save-auth"]'
    checked: false
- set_check:
    selector: '[data-testid="session-keepalive-toggle"]'
    checked: true
- fill:
    selector: 'input[aria-label="Keep-alive interval"]'
    value: '47'
- assert_attribute:
    selector: '[data-testid="session-keepalive-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-proxy-save-auth"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: 'input[aria-label="Proxy password"]'
    name: type
    equals: password
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-socks5-keepalive
- click: '[data-testid="session-save"]'
- assert_not_visible: '[data-testid="session-editor"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-socks5-keepalive"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-socks5-keepalive"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: socks5
- assert_attribute:
    selector: 'input[aria-label="Proxy host"]'
    name: value
    equals: 127.0.0.1
- assert_attribute:
    selector: 'input[aria-label="Proxy port"]'
    name: value
    equals: '1080'
- assert_attribute:
    selector: 'input[aria-label="Proxy username"]'
    name: value
    equals: qa-proxy-user
- assert_attribute:
    selector: 'input[aria-label="Proxy password"]'
    name: value
    equals: ''
- assert_attribute:
    selector: '[data-testid="session-proxy-save-auth"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-keepalive-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: 'input[aria-label="Keep-alive interval"]'
    name: value
    equals: '47'
- set_check:
    selector: '[data-testid="session-tcp-nodelay-toggle"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-tcp-nodelay-toggle"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-disable-nagle-toggle"]'
    name: data-checked
    equals: 'false'
- set_check:
    selector: '[data-testid="session-disable-nagle-toggle"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="session-tcp-nodelay-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-disable-nagle-toggle"]'
    name: data-checked
    equals: 'true'
- set_check:
    selector: '[data-testid="session-tcp-nodelay-toggle"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="session-tcp-nodelay-toggle"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-disable-nagle-toggle"]'
    name: data-checked
    equals: 'false'
- select_option:
    selector: '[data-testid="session-ip-version"]'
    value: ipv6
- assert_attribute:
    selector: '[data-testid="session-ip-version"]'
    name: value
    equals: ipv6
- click: '[data-testid="session-save"]'
- assert_not_visible: '[data-testid="session-editor"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-socks5-keepalive"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-socks5-keepalive"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_attribute:
    selector: '[data-testid="session-tcp-nodelay-toggle"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-disable-nagle-toggle"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-ip-version"]'
    name: value
    equals: ipv6
- screenshot: 123-ssh-network-settings-persist.png

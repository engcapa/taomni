    - 50
  visual:
  - check: Rounded canvas corners and complete dialog with an expanded navigator
    method: manual
    reason: Retain screenshots; actual dimensions and hit testing are automated, while corner appearance is reviewed from the images.
  native:
  - check: Actual WebKitGTK, WKWebView and WebView2 stacking and the same live SSH connection after settings changes
    method: automated
    reason: Browser mode checks Chromium through the real SSH service bridge; native checks the packaged WebView and native SSH connection lifecycle.

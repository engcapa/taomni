id: TC-WS-058
title: Rounded canvas decoration preserves viewport dialogs and the same live terminal
description: Retains the prototype canvas corners while a wide navigator puts the terminal settings dialog partly outside the canvas. Check actual hit testing outside
  the frame, change appearance, return through Home, reopen and close by Escape, and verify a command still runs in the original SSH terminal. This protects against
  replacing rounded overflow with a clip-path that also clips fixed dialogs.
modes:
- browser
- native
covers:
- F-WS-1
- F1.2
- F2.2
- F5.2
- F3.1
- F4.2
tags:
- p0
- regression
- workspace-redesign
- appearance
fixtures:
- reset_db
- ssh_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-058
- seed_storage:
    key: taomni.sidebarCollapsed
    value: 'false'
- seed_storage:
    key: taomni.sidebarCollapsedByGroup.v1
    value: '{"terminal":false}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    checked: true
    selector: '[data-testid="session-specify-username"]'
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-canvas-dialog
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-canvas-dialog"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-canvas-dialog"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- assert_visible: '[data-testid="expanded-sidebar-panel"]'
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: ArrowRight
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: ArrowRight
- right_click:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- click: '[data-testid="terminal-context-change-settings"]'
- wait_for: '[data-testid="terminal-current-settings-dialog"]'
- assert_element_geometry:
    selector: '[data-testid="terminal-current-settings-dialog"]'
    min_width: 600
    min_height: 200
    viewport_margin: 16
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"terminal-current-settings-dialog"]').getBoundingClientRect().left + 12 < document.querySelector('[data-testid'+String.fromCharCode(61)+'"main-canvas-frame"]').getBoundingClientRect().left
    expect_truthy: true
- eval_readonly:
    expression: document.querySelectorAll('[aria-modal]').length === 1 && document.querySelector('[aria-modal]').contains(document.elementFromPoint( document.querySelector('[aria-modal]').getBoundingClientRect().left
      + 12, document.querySelector('[aria-modal]').getBoundingClientRect().top + 20))
    expect_truthy: true
- fill:
    selector: '[data-testid="terminal-current-settings-dialog"] input[aria-label="Terminal font size"]'
    value: '19'
- blur: '[data-testid="terminal-current-settings-dialog"] input[aria-label="Terminal font size"]'
- wait_for: '[data-testid="terminal-current-settings-dialog"] input[aria-label="Terminal font size"][value="19"]'
- screenshot: ws-058-viewport-dialog-outside-canvas.png
- click: '[data-testid="terminal-current-settings-footer-close"]'
- wait_for:
    selector: '[data-testid="terminal-current-settings-dialog"]'
    state: detached
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-sessions"]'
- assert_count:
    selector: '[data-testid="global-session-surface"] [data-testid="terminal-pane"]'
    equal: 1
- right_click:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- click: '[data-testid="terminal-context-change-settings"]'
- wait_for: '[data-testid="terminal-current-settings-dialog"] input[aria-label="Terminal font size"][value="19"]'
- eval_readonly:
    expression: document.querySelectorAll('[aria-modal]').length === 1 && document.querySelector('[aria-modal]').contains(document.elementFromPoint( document.querySelector('[aria-modal]').getBoundingClientRect().left
      + 12, document.querySelector('[aria-modal]').getBoundingClientRect().top + 20))
    expect_truthy: true
- click: '[data-testid="terminal-current-settings-dialog"] input[aria-label="Terminal font size"]'
- press: Escape
- wait_for:
    selector: '[data-testid="terminal-current-settings-dialog"]'
    state: detached
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo qa-canvas-dialog-ok
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?m)^qa-canvas-dialog-ok\r?$
      timeout_sec: 20
      attempts: 2
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^qa-canvas-dialog-ok\r?$
    timeout_sec: 20
- assert_no_runtime_errors: null
- screenshot: ws-058-live-terminal-after-dialog.png

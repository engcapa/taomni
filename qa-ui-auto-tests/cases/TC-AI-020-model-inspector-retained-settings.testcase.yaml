id: TC-AI-020
title: Inspector close preserves key/model editing and original save and test controls
description: Browser vault and connection stubs only; real vault/IPC checked manually
  in N-I-02/N-I-08. Synthetic key only. Authored, unrun.
covers:
- F-AI-2.8
- F-AI-2.4
- F6.3
tags:
- ai
- model-inspector
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- click: '[data-testid="ribbon-settings"]'
- click: '[data-testid="settings-group-toggle-ai"]'
- click: '[data-testid="llm-provider-row"][data-provider="deepseek"] > div:first-child'
- click: '[data-testid="model-inspector-open"][data-provider="deepseek"]'
- wait_for: '[data-testid="model-inspector-panel"]'
- click: '[data-testid="model-inspector-close"]'
- fill:
    selector: '[data-testid="llm-provider-row"][data-provider="deepseek"] [data-testid="llm-provider-key"]'
    value: synthetic-browser-fixture-key
- fill:
    selector: '[data-testid="llm-provider-row"][data-provider="deepseek"] [data-testid="llm-provider-model"]'
    value: manual-browser-model
- click: '[data-testid="model-inspector-open"][data-provider="deepseek"]'
- wait_for: '[data-testid="model-inspector-row"][data-model="manual-browser-model"]'
- click: '[data-testid="model-inspector-check-current"]'
- assert_text:
    selector: '[data-testid="model-inspector-row"]:first-child [data-testid="model-inspector-result"]'
    contains: ✓ 12ms
- click: '[data-testid="model-inspector-close"]'
- click: '[data-testid="llm-provider-row"][data-provider="deepseek"] [data-testid="llm-provider-test"]'
- assert_text:
    selector: '[data-testid="llm-provider-row"][data-provider="deepseek"]'
    contains: Connected
- click: '[data-testid="llm-providers-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-browser-fixture-only
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-browser-fixture-only
- click: '[data-testid="vault-setup-confirm"]'
- assert_localstorage:
    key: taomni.ai.config.v1
    contains: '"model":"manual-browser-model"'
- assert_localstorage:
    key: taomni.ai.config.v1
    contains: vault:stub-ai_api_key:deepseek
- click: '[data-testid="model-inspector-open"][data-provider="deepseek"]'
- wait_for: '[data-testid="model-inspector-row"][data-model="manual-browser-model"]'
- assert_attribute:
    selector: '[data-testid="model-inspector-row"]:first-child'
    name: data-model
    equals: manual-browser-model
verification:
  review: pending
  requirements:
  - id: I-RETAINED
    requirement: Original key/model inputs, connection test and vault save path remain
      wired after inspector closes.
    actions:
    - 8
    - 10
    - 11
    - 12
    - 18
    - 20
    - 22
    - 23
    - 24
    - 27
    checkpoints:
    - step: 19
      expectation: Existing connection stub result visible.
    - step: 25
      expectation: Manual model saved after vault setup.
    - step: 26
      expectation: Synthetic key replaced by vault stub reference.
    - step: 29
      expectation: Inspector current choice agrees with original input.
    results:
    - 19
    - 25
    - 26
    - 29
  - id: I-DRAFT
    requirement: Unsaved manual model enters the inspector and can be checked before
      Save.
    actions:
    - 12
    - 13
    - 15
    checkpoints:
    - step: 16
      expectation: Draft model check succeeds.
    results:
    - 16
  visual:
  - check: Input and inspector state
    method: automated
    reason: Actual original controls are edited and observed.
  native:
  - check: Real vault encryption and preserved connection semantics
    method: manual
    reason: N-I-02/N-I-08; browser returns synthetic refs.

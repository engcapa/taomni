id: TC-MFA-108
title: Native secret key copy is gated by real vault master password
description: >-
  Verifies that secret key copy in native packaging calls the Rust backend
  export command with master password verification. A wrong master password
  is refused by the vault without exposing the secret; the correct password
  reveals the secret and copies it to the native system clipboard.
covers: [F-MFA-1]
tags: [mfa, export, secret, native-boundary, p1]
modes: [native]
fixtures: [reset_db]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: {selector: '[data-testid="welcome-panel"]', timeout_sec: 60}
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill: {selector: '[data-testid="vault-setup-pw1"]', value: qa-mfa-native-108}
- fill: {selector: '[data-testid="vault-setup-pw2"]', value: qa-mfa-native-108}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: {selector: '[data-testid="mfa-empty"]', timeout_sec: 30}
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill: {selector: '[data-testid="mfa-add-issuer"]', value: QA Native Secret}
- fill: {selector: '[data-testid="mfa-add-secret"]', value: JBSWY3DPEHPK3PXP}
- click: '[data-testid="mfa-add-submit"]'
- wait_for: '[data-testid="mfa-account-row"][data-issuer="QA Native Secret"]'
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="QA Native Secret"] *)'
- click: '[data-testid="mfa-menu-copy-secret"]'
- wait_for: '[data-testid="mfa-qr-dialog"][data-state="locked"]'
- fill: {selector: '[data-testid="mfa-qr-password"]', value: wrong-master-password}
- click: '[data-testid="mfa-qr-reveal"]'
- assert_text: {selector: '[data-testid="mfa-qr-error"]', contains: Incorrect master password, timeout_sec: 30}
- assert_count: {selector: '[data-testid="mfa-qr-secret"]', equal: 0}
- fill: {selector: '[data-testid="mfa-qr-password"]', value: qa-mfa-native-108}
- click: '[data-testid="mfa-qr-reveal"]'
- wait_for: {selector: '[data-testid="mfa-qr-secret"]', timeout_sec: 30}
- assert_attribute: {selector: '[data-testid="mfa-qr-dialog"]', name: data-state, equals: shown}
- click: '[data-testid="mfa-qr-toggle-secret"]'
- assert_text: {selector: '[data-testid="mfa-qr-secret"]', contains: 'JBSW Y3DP EHPK 3PXP'}
- click: '[data-testid="mfa-qr-close"]'
- assert_not_visible: '[data-testid="mfa-qr-dialog"]'
- screenshot: mfa-108-native-secret.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The native secret key export refuses a wrong master password and exposes nothing.
    actions: [11, 13, 14, 15, 17, 18, 20, 21]
    checkpoints:
    - {step: 16, expectation: account stored}
    - {step: 19, expectation: password prompt displayed}
    - {step: 22, expectation: vault refused wrong password}
    - {step: 23, expectation: no secret exposed}
    results: [22, 23]
  - id: R2
    requirement: The right master password unlocks the dialog and unmasks the formatted secret key.
    actions: [24, 25, 28, 30]
    checkpoints:
    - {step: 26, expectation: secret revealed}
    - {step: 27, expectation: dialog in shown state}
    - {step: 29, expectation: unmasked secret displayed}
    - {step: 31, expectation: dialog closed}
    results: [27, 29, 31]
  visual:
  - check: Native dialog layout shows formatted secret key and masked state.
    method: manual
    reason: Native packaged WebView rendering.
  native:
  - check: Real vault verification and Rust secret export run in the packaged app on Linux, Windows and macOS.
    method: automated
    reason: Native mode drives the isolated QA build.

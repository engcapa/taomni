id: TC-NATIVE-CORE-001
title: Native QA startup opens a local PTY and receives shell output
covers:
- F1.6
- F2.1
- F2.2
tags:
- smoke
- p0
- native-boundary
- terminal
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-smoke-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)[$#>%]\s*$
    timeout_sec: 20
- click: '[data-testid="terminal-pane"]'
- type: echo QA_NATIVE_SHELL_READY
- press: Enter
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_NATIVE_SHELL_READY\s*$
    timeout_sec: 15
- screenshot: native-shell-ready.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Native QA startup opens a local PTY and receives shell output：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 7
    - 8
    - 9
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 6
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"]", "regex": "(?m)[$#>%]\\s*$",
        "timeout_sec": 20}}'
    - step: 10
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_NATIVE_SHELL_READY\\s*$",
        "timeout_sec": 15}}'
    results:
    - 10
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

id: TC-MODULES-009
title: Core notes and registry recover after normal native shutdown and restart
covers: [F-Modules-1, F-TAO-1]
tags: [modules, core-only, native-boundary, lifecycle, p1]
modes: [native]
fixtures: [reset_db]
timeout_sec: 180
description: >-
  Save a note through the production Notes UI, close the run-owned QA app
  through its normal window path and restart the same isolated profile. The
  native restart receipt must show normal shutdown and a new owned application
  process. Reopen Notes and Module Store to prove core store/profile ownership
  and registry setup recover. No kill or fixture reset is a successful shutdown.
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="rail-chat-button"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- wait_for: '[data-testid="notes-panel"]'
- click: '[data-testid="notes-new"]'
- wait_for: '[data-testid="note-editor"]'
- fill: {selector: '[data-testid="note-editor-title"]', value: QA CoreState normal restart}
- click: '[data-testid="note-editor-back"]'
- assert_text: {selector: '[data-testid="notes-list"]', contains: QA CoreState normal restart}
- assert_no_runtime_errors: null
- native_restart_app: null
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="notes-panel"]'
- assert_text: {selector: '[data-testid="notes-list"]', contains: QA CoreState normal restart}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- wait_for: '[data-testid="module-store-panel"]'
- assert_visible: '[data-testid="module-store-core-api"]'
- assert_visible: '[data-testid="module-upgrade-status"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R-CORE-NORMAL-RESTART
    requirement: Normal native shutdown releases profile ownership and the same saved core data and registry remain available after restarting.
    actions: [3, 4, 6, 8, 9, 12, 14, 17, 18]
    checkpoints:
    - {step: 11, expectation: No runtime errors occur before the lifecycle transition.}
    - {step: 10, expectation: A note is saved before normal app shutdown.}
    - {step: 16, expectation: The note survives the real application restart without reseeding.}
    - {step: 20, expectation: Registry setup succeeded in the restarted process.}
    - {step: 21, expectation: The same profile supports upgrade preflight after restart.}
    - {step: 22, expectation: No runtime error occurs in the restarted application.}
    results: [10, 11, 16, 20, 21, 22]
  native:
  - check: Normal exit, process ownership change, profile lock release and SQLite persistence.
    method: automated
    reason: These effects require the matching native QA application; browser reload cannot establish them.
  visual:
  - check: This case verifies native lifecycle and persisted content.
    method: not-applicable
    reason: No layout or visual fidelity requirement changes.

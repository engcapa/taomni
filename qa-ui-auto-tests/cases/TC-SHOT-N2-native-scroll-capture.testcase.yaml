id: TC-SHOT-N2
title: Native wheel capture stitches ordered rows at their physical height
covers: [F27.1]
tags: [screenshot, scroll-capture, native, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario: {scenario: scroll}
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: long-image
    requirement: Real OS wheel scroll produces a longer screenshot without duplicate, missing or squashed fixture rows.
    actions: [1]
    checkpoints:
    - {step: 3, expectation: "At least three source frames and ten consecutive row IDs, correct interior heights and at least 1.8x output growth; PNG retained."}
    - {step: 4, expectation: Main remains usable after fixture cleanup.}
    results: [3, 4]
  visual:
  - {check: Stitched seams, method: external, reason: Inspect retained scroll-stitched PNG in addition to row-order/height oracle.}
  native:
  - {check: Wheel and capture, method: automated, reason: Enigo injects OS wheel and the product captures real native fixture pixels.}

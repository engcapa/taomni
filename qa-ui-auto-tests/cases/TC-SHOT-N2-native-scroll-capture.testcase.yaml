id: TC-SHOT-N2
title: Native scroll capture backend stitches frames
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- native
- p1
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
# Ensure the main window (and Tauri API) is ready before invoking backends.
- wait_for: '[data-testid="system-screenshot"]'
- wait: 5
# Scroll capture drives the OS wheel over the given region and stitches
# frames; verify the backend resolves with a stitched image file.
- eval_readonly:
    expression: 'window.__TAURI_INTERNALS__.invoke("screenshot_scroll_capture", {displayId: null, x: 0, y: 0, width: 200, height: 200}).then(JSON.stringify)'
    contains: '"path"'

id: TC-SHOT-N2
title: Native scroll capture drives real input and stitches frames
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- native
- p1
modes:
- native
fixtures:
- reset_db
steps:
- open: "#screenshot-overlay"
- wait_for:
    selector: '[data-testid="screenshot-base-image"]'
    timeout_sec: 30
# The native runner has no canvas-drag verb (drag_to is browser-only), so
# reach the annotate phase through the fullscreen-select button instead of
# dragging a region.
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- wait_for: '[data-testid="screenshot-scroll-busy"]'
# Real backend: hides the overlay, injects wheel events through the OS input
# API, captures frames and stitches them into one image. Must finish without
# an error toast.
- wait_for:
    selector: '[data-testid="screenshot-base-image"]'
    timeout_sec: 90
- assert_not_visible: '[data-testid="screenshot-scroll-busy"]'
- assert_not_visible: '[data-testid="screenshot-toast"]'
- assert_not_visible: '[data-testid="screenshot-overlay-error"]'

id: TC-039
title: Quick-connect rejects empty SSH URL and accepts valid SSH URL
covers:
- F6.4
tags:
- legacy-imported
- p1
- quickconnect
- validation
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://
- click: '[data-testid="qc-submit"]'
- wait: 1
- assert_not_visible: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- assert_visible: '[data-testid="auth-password"]'
- click: '[data-testid="auth-cancel"]'
- assert_not_visible: '[data-testid="auth-prompt"]'
- screenshot: 039-quickconnect-validation.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 空 SSH URL 不进入认证；有效 URL 显示密码输入；取消后认证框关闭。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 9
    - 10
    - 13
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"qc-input\"]"}'
    - step: 8
      expectation: '{"assert_not_visible": "[data-testid=\"auth-prompt\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 12
      expectation: '{"assert_visible": "[data-testid=\"auth-password\"]"}'
    - step: 14
      expectation: '{"assert_not_visible": "[data-testid=\"auth-prompt\"]"}'
    results:
    - 14
  visual:
  - check: 认证框错误/输入/取消按钮可见且无遮挡。
    method: manual
    reason: 截图必须单独评审，不能由功能步骤通过推导视觉通过。
  native:
  - check: 不提交认证，不证明 SSH 连接；native 模式只验证当前 WebView 的上述交互。
    method: automated
    reason: 按实际执行模式解释；其他平台不继承 Linux 证据。

id: TC-TERM-TEXT-003
title: Read-only blocks input without stopping live output or full text observation
covers: [F2.2, F3.1, F4.2]
tags: [terminal, ssh, p1, display]
modes: [browser, native]
fixtures: [reset_db, ssh_required]
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: "printf 'RO-BEGIN\\n'; i=0; while [ \"$i\" -lt 10 ]; do sleep 2; printf 'RO-TICK-%02d\\n' \"$i\"; i=$((i+1)); done; printf 'RO-END\\n'"
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: '(?m)^RO-BEGIN\r?$'
    timeout_sec: 10
- right_click:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-read-only-terminal"]'
- wait_for: '[data-testid="terminal-read-only"]'
- eval_readonly:
    expression: (document.querySelector('[data-terminal-active]').getAttribute('data-terminal-text').match(/^RO-END\r?$/gm) || []).length === 0
    expect_truthy: true
- click: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- type: RO-FORBIDDEN-INPUT
- press: Enter
- wait: 1
- assert_attribute:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    name: data-terminal-text
    matches: '(?s)(?!.*RO-FORBIDDEN-INPUT).*'
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: '(?m)^RO-TICK-09\r?\nRO-END\r?$'
    timeout_sec: 30
- eval_readonly:
    expression: (document.querySelector('[data-terminal-active]').getAttribute('data-terminal-text').match(/^RO-TICK-\d{2}\r?$/gm) || []).length === 10
    expect_truthy: true
- assert_visible: '[data-testid="terminal-read-only"]'
- right_click:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-read-only-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-read-only"]'
    state: detached
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 15
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: "printf 'RO-RECOVERED\\n'"
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: '(?m)^RO-RECOVERED\r?$'
    timeout_sec: 15
- screenshot: terminal-readonly-live-output.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 只读禁止新输入，但输出流及镜像持续更新且10条数据完整
    actions: [11, 13, 15, 16, 19, 20, 21]
    checkpoints:
    - {step: 17, expectation: 只读标记出现}
    - {step: 18, expectation: 开启只读时输出尚未结束，不能用旧尾标记冒充持续输出}
    - {step: 23, expectation: 禁止内容未进入终端全文，不仅未执行}
    - {step: 24, expectation: 只读期间仍收到输出尾标记}
    - {step: 25, expectation: tick独立输出恰好10行}
    - {step: 26, expectation: 输出结束未自行撤销只读}
    results: [18, 23, 24, 25, 26]
  - id: R2
    requirement: 解除只读后ready与正常输入恢复
    actions: [27, 29, 30, 33]
    checkpoints:
    - {step: 31, expectation: 只读标记撤销}
    - {step: 32, expectation: 真实prompt处于ready}
    - {step: 34, expectation: 新命令产生独立RECOVERED行}
    results: [34]
  visual:
  - {check: 只读标记与上下文菜单可读且持续输出不白屏, method: manual, reason: 文本属性不证明画面与标记布局}
  native:
  - {check: 打包WebView对真实SSH持续输出与锁定输入的处理, method: automated, reason: browser代理不替代原生输入/输出通道}

id: TC-WS-030
title: Native cold start restores workspace files and reconnects independent SSH, SFTP and saved local shells
description: Uses an actual OS chooser and UI-created workspace tabs. Saves SSH/SFTP credentials in vault, restarts the owned QA process twice without profile reset,
  verifies real SSH command output, SFTP marker, local PTY, unsaved draft, active tab and disk conflict protection. Expanded source directory entries must survive
  both cold starts without re-expanding the tree. The selected root is explicitly below a .cache ancestor on every OS; ordinary descendants must still emit real file-change/conflict
  events.
modes:
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-5
tags:
- p0
- workspace-redesign
- regression
- persistence
fixtures:
- reset_db
- workspace_ignored_ancestor_root
- workspace_restore_sessions
- ssh_required
- sftp_required
timeout_sec: 420
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-30
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- wait_for: '[data-testid="workspace-fs-modal"]'
- native_folder_dialog:
    trigger: '[data-testid="workspace-fs-modal-browse"]'
    action: choose
    path: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- click: '[data-testid="code-workspace-tree-root"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="src"] [data-testid="code-workspace-tree-dir-arrow"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="src/index.ts"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"][data-path="README.md"] .cm-content'
- press:
    selector: '[data-testid="workspace-file-editor"][data-path="README.md"] .cm-content'
    key: Mod+End
- type:
    selector: '[data-testid="workspace-file-editor"][data-path="README.md"] .cm-content'
    text: '

      QA_RESTORED_UNSAVED_DRAFT'
- wait_for: '[data-testid="workspace-file-editor"][data-path="README.md"][data-dirty="true"]'
- assert_attribute:
    selector: '[data-testid="workspace-file-editor"][data-path="README.md"]'
    name: data-dirty
    equals: 'true'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-open-session"]'
- wait_for: '[data-testid="workspace-session-picker-modal"]'
- click: '[data-testid="workspace-session-picker-row"][data-session-id="qa-restore-ssh"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- set_check:
    selector: '[data-testid="auth-save-to-vault"]'
    checked: true
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-ws-30
- wait_for: '[data-testid="workspace-session-pane"][data-session-id="qa-restore-ssh"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf QA_RESTORE_REMOTE > '${fixture.sftp_shell_test_dir}/${fixture.workspace_restore_marker}'; printf '\nQA_RESTORE_SSH_BEFORE\n'
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?m)^QA_RESTORE_SSH_BEFORE\r?\s*$
      timeout_sec: 30

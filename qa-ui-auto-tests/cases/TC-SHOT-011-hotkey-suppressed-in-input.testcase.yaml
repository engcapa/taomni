id: TC-SHOT-011
title: Screenshot hotkey is suppressed while typing in text annotation input
covers:
- F27.1
tags:
- screenshot
- shortcut
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
# Open the text tool and place a text input.
- click: '[data-testid="screenshot-tool-text"]'
- wait: 1
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position: {x: 200, y: 200}
- wait_for: '[data-testid="screenshot-text-input"]'
# While the text input has focus, Ctrl+Shift+A must NOT trigger the overlay
# (it would disrupt typing). The overlay is already open; verify the text
# input remains and no new overlay state appears.
- press: Control+Shift+A
- wait: 1
- assert_visible: '[data-testid="screenshot-text-input"]'
- assert_visible: '[data-testid="screenshot-overlay"]'
# Type some text to confirm the input is functional.
- fill:
    selector: '[data-testid="screenshot-text-input"]'
    value: 'hello'
- press: Escape
- wait: 1
# After blur, the hotkey works again (overlay already open, so Escape closes).
- press: Escape
- wait_for:
    selector: '[data-testid="system-screenshot"]'

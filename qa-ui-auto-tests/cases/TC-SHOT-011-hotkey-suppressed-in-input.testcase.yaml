id: TC-SHOT-011
title: Screenshot and output shortcuts are suppressed in text input with layered Escape recovery
description: App-local editable-field protection and overlay Escape transitions; no OS-global hotkey or native IME claim.
covers: [F27.1]
tags: [screenshot, shortcut, text, p2]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-tool-text"]'
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position: {x: 200, y: 200}
- wait_for: '[data-testid="screenshot-text-input"]'
- fill:
    selector: '[data-testid="screenshot-text-input"]'
    value: hello
- press:
    key: Control+Alt+A
    macos_key: Control+Meta+A
    selector: '[data-testid="screenshot-text-input"]'
- assert_attribute:
    selector: '[data-testid="screenshot-text-input"]'
    name: value
    equals: hello
- press:
    key: Mod+s
    selector: '[data-testid="screenshot-text-input"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- press:
    key: Mod+c
    selector: '[data-testid="screenshot-text-input"]'
- assert_visible: '[data-testid="screenshot-text-input"]'
- eval_readonly:
    expression: >-
      !JSON.stringify(window.__taomniStubScreenshotCalls || []).includes('"cmd":"screenshot_open_overlay"') && !JSON.stringify(window.__taomniStubScreenshotCalls || []).includes('"cmd":"screenshot_save_data_url"')
- press:
    key: Escape
    selector: '[data-testid="screenshot-text-input"]'
- assert_not_visible: '[data-testid="screenshot-text-input"]'
- assert_attribute:
    selector: '[data-testid="screenshot-overlay"]'
    name: data-phase
    equals: annotate
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '0'
- press: Escape
- assert_attribute:
    selector: '[data-testid="screenshot-tool-text"]'
    name: aria-pressed
    equals: 'false'
- assert_visible: '[data-testid="screenshot-selection-move"]'
# The expanded More tools row must not consume an extra Escape.
- press: Escape
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- press:
    key: Control+Alt+A
    macos_key: Control+Meta+A
    selector: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_open_overlay"').length === 2
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: In the focused annotation input the configured capture chord, save and copy do not restart capture or export the screenshot.
    actions: [1, 2, 4, 6, 7, 9, 10, 12, 14]
    checkpoints:
    - {step: 11, expectation: The capture chord preserves input text.}
    - {step: 13, expectation: Save does not open the screenshot save dialog while typing.}
    - {step: 15, expectation: Copy leaves the annotation input mounted.}
    - {step: 16, expectation: The protected chords dispatch neither capture restart nor canvas export.}
    results: [11, 13, 15, 16]
  - id: R2
    requirement: Escape cancels text first, deactivates an empty draw tool next, then resets selection and finally closes; capture works again in main-window chrome.
    actions: [17, 21, 24, 27, 29, 32]
    checkpoints:
    - {step: 18, expectation: The inline text editor closes first.}
    - {step: 19, expectation: Selection remains in annotate phase after text cancel.}
    - {step: 20, expectation: Canceled text committed no shapes.}
    - {step: 22, expectation: The next Escape deactivates the empty text tool.}
    - {step: 23, expectation: Default move selection returns.}
    - {step: 25, expectation: Another Escape returns to select phase.}
    - {step: 26, expectation: The region is reset.}
    - {step: 28, expectation: Escape from select closes the overlay.}
    - {step: 30, expectation: The configured chord works outside the input.}
    - {step: 31, expectation: Only that unprotected chord sent an open request.}
    - {step: 33, expectation: The reopened overlay is cancelable.}
    results: [18, 19, 20, 22, 23, 25, 26, 28, 30, 31, 33]
  visual:
  - check: Text cancel, tool deactivation, selection reset and close are separate states.
    method: automated
    reason: Exact phase, shape and input assertions protect routing without relying on screenshots.
  native:
  - check: OS-global hotkey suppression and real IME composition.
    method: external
    reason: Browser keyboard input is app-local; native registration and composition require separate platform checks.

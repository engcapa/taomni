id: TC-100
title: Custom title bar renders window controls and tray
description: Custom titlebar keeps window controls, the top drag handle, shared toolbar and theme action on Home. Home has no empty overflow menu; Sessions
  exposes its real layout actions in the overflow. Window min/max/close are display-only so the test window stays open.
covers:
- F1.3
tags:
- smoke
- p1
- main
- window
modes:
- browser
browser_platforms:
- Linux
- Windows
fixtures:
- reset_db
timeout_sec: 30
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="control-bar"]'
- assert_visible: '[data-testid="control-bar"]'
- assert_visible: '[data-testid="window-drag-handle"]'
- assert_visible: '[data-testid="window-controls"]'
- assert_visible: '[data-testid="window-min"]'
- assert_visible: '[data-testid="window-max"]'
- assert_visible: '[data-testid="window-close"]'
- assert_not_visible: '[data-testid="titlebar-actions-more"]'
- assert_visible: '[data-testid="theme-cycle"]'
- click: '[data-testid="theme-cycle"]'
- wait: 0.5
- assert_localstorage:
    key: taomni.appTheme.v1
    exists: true
- screenshot: 100-titlebar.png
- eval_readonly:
    expression: document.querySelector('.taomni-control-bar .taomni-window-drag-handle').getBoundingClientRect().height <= 32 && getComputedStyle(document.querySelector('.taomni-main-window')).paddingLeft
      === '0px'
    expect_truthy: true
    timeout_sec: 5
- assert_visible: '[data-testid="control-bar"] [data-testid="platform-toolbar-actions"]'
- click: '[data-testid="side-tab-sessions"]'
- assert_visible: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="titlebar-actions-more"]'
- assert_visible: '[data-testid="titlebar-actions-menu"]'
- assert_visible: '[data-testid="platform-layout-single"]'
- press: Escape
- assert_not_visible: '[data-testid="titlebar-actions-menu"]'
- click: '[data-testid="nav-mode-home"]'
- assert_not_visible: '[data-testid="titlebar-actions-more"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Window controls, drag handle and shared toolbar render on Home; theme cycling persists, while Home omits an empty overflow menu.
    actions:
    - 1
    - 11
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"control-bar\"]"}'
    - step: 3
      expectation: '{"assert_visible": "[data-testid=\"control-bar\"]"}'
    - step: 4
      expectation: '{"assert_visible": "[data-testid=\"window-drag-handle\"]"}'
    - step: 5
      expectation: '{"assert_visible": "[data-testid=\"window-controls\"]"}'
    - step: 6
      expectation: '{"assert_visible": "[data-testid=\"window-min\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"window-max\"]"}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"window-close\"]"}'
    - step: 9
      expectation: '{"assert_not_visible": "[data-testid=\"titlebar-actions-more\"]"}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"theme-cycle\"]"}'
    - step: 13
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "exists": true}}'
    results:
    - 13
  - id: R2
    requirement: 窗口抓手位于顶部标题栏，内容区左侧没有为全高抓手预留的空白。
    actions:
    - 1
    checkpoints:
    - step: 15
      expectation: 抓手在 control-bar 内且高度不超过标题栏，主窗口左侧 padding 为 0。
    - step: 16
      expectation: '{"assert_visible": "[data-testid=\"control-bar\"] [data-testid=\"platform-toolbar-actions\"]"}'
    results:
    - 15
    - 16
  - id: R3
    requirement: Home omits empty actions; Sessions exposes the retained layout menu, dismisses with Escape, and returning Home removes it again.
    actions:
    - 17
    - 19
    - 22
    - 24
    checkpoints:
    - step: 18
      expectation: '{"assert_visible": "[data-testid=\"titlebar-actions-more\"]"}'
    - step: 20
      expectation: '{"assert_visible": "[data-testid=\"titlebar-actions-menu\"]"}'
    - step: 21
      expectation: '{"assert_visible": "[data-testid=\"platform-layout-single\"]"}'
    - step: 23
      expectation: '{"assert_not_visible": "[data-testid=\"titlebar-actions-menu\"]"}'
    - step: 25
      expectation: '{"assert_not_visible": "[data-testid=\"titlebar-actions-more\"]"}'
    results:
    - 18
    - 20
    - 21
    - 23
    - 25
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

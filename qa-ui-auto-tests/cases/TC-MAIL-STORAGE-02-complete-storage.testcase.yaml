id: TC-MAIL-STORAGE-02
title: Native complete MIME, resumable storage, relocation, backup selection and physical cleanup
description: Uses only a disposable QA profile, loopback IMAP/SMTP, independent MIME checksums and read-only SQLite/gzip/ZIP observations. Runs on Linux/WebKitGTK, Windows/WebView2 and
  macOS/WKWebView. Restore inspection is exercised; restart/apply and encrypted backup compatibility are covered by Rust tests and require follow-up native restore execution. Linux native
  is exercised with a separate QA profile; Windows/macOS remain pending.
covers:
- F-MAIL-23
- F-BACKUP-1
tags:
- mail
- backup
- p1
modes:
- native
fixtures:
- reset_db
- mail_server
- mail_storage
timeout_sec: 300

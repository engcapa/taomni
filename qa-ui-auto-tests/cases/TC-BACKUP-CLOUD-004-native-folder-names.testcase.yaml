id: TC-BACKUP-CLOUD-004
title: Readable cloud folders migrate in place and keep backup file identity
description: Native loopback fixture starts with UUID-only device and destination folders. Two real encrypted uploads
  migrate and rename those folders through PATCH, retaining folder tokens and the backup file token used for version
  history. This verifies production networking against a fixture, not real Feishu service behavior.
covers:
- F-BACKUP-2
tags:
- backup
- native-boundary
- p1
modes:
- native
fixtures:
- reset_db
- backup_cloud
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-general"]'
- wait_for: '[data-testid="settings-language-en"]'
- click: '[data-testid="settings-language-en"]'
- assert_attribute:
    selector: html
    name: lang
    equals: en
- click: '[data-testid="settings-group-toggle-general"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for: '[data-testid="backup-selected-start"]:not([disabled])'
- click: '[data-testid="backup-selected-start"]'
- wait_for:
    selector: '[data-testid="backup-cloud-job"][data-operation="upload"][data-phase="completed"]'
    timeout_sec: 45
- assert_file_contains:
    path: ${fixture.backup_service_events}
    contains: renamed=legacyDevice:QA device [
- assert_file_contains:
    path: ${fixture.backup_service_events}
    contains: renamed=legacyPlan:QA cloud [
- click: '[data-testid="backup-device-settings"] > summary'
- fill:
    selector: '[data-testid="backup-device-name"]'
    value: Office laptop
- click: '[data-testid="backup-cloud-destination"] > summary'
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- fill:
    selector: '[data-testid="backup-cloud-name"]'
    value: Daily backup
- click: '[data-testid="backup-cloud-destination"] > summary'
- wait_for: '[data-testid="backup-selected-start"]:not([disabled])'
- click: '[data-testid="backup-selected-start"]'
- assert_file_contains:
    path: ${fixture.backup_service_events}
    contains: same_archive_token_after_rename
    timeout_sec: 45
- assert_file_contains:
    path: ${fixture.backup_service_events}
    contains: renamed=legacyDevice:Office laptop [
- assert_file_contains:
    path: ${fixture.backup_service_events}
    contains: renamed=legacyPlan:Daily backup [
- click: '[data-testid="backup-cloud-refresh"]'
- wait_for: '[data-testid="backup-cloud-row"]'
- assert_text:
    selector: '[data-testid="backup-cloud-row"]'
    contains: Office laptop
- assert_text:
    selector: '[data-testid="backup-cloud-row"]'
    contains: Daily backup / current.taobak
- click: '[data-testid="backup-cloud-row"]'
- press: PageDown
- screenshot: backup-readable-folders.png
verification:
  review: reviewed
  native:
  - check: Actual native PATCH requests and repeated encrypted uploads preserve cloud object tokens.
    method: automated
    reason: Browser fixtures cannot verify native network payloads or file identity.
  visual:
  - check: Source and destination names are readable in the restore list.
    method: manual
    reason: Review the retained native screenshot.
  requirements:
  - id: R1
    requirement: Legacy UUID folders are renamed without replacing their cloud tokens.
    actions:
    - 12
    checkpoints:
    - step: 13
      expectation: Initial encrypted upload completed
    - step: 14
      expectation: Original device folder token receives a readable title
    - step: 15
      expectation: Original destination folder token receives a readable title
    results:
    - 13
    - 14
    - 15
  - id: R2
    requirement: Editing names updates the original folders and preserves the backup file identity.
    actions:
    - 17
    - 18
    - 20
    - 21
    - 23
    - 27
    checkpoints:
    - step: 24
      expectation: Second upload reused the original archive token
    - step: 25
      expectation: Device rename reused its folder token
    - step: 26
      expectation: Destination rename reused its folder token
    - step: 29
      expectation: Restore row displays the source name
    - step: 30
      expectation: Restore row displays the destination name
    results:
    - 24
    - 25
    - 26
    - 29
    - 30

id: TC-MODULES-028
title: Native legacy server preflight keeps HTTP, RDP and VNC under their distinct module owners
description: Seeds an SSH session and three synthetic old server_configs rows. Real Settings/IPC must recommend servers, rdp-server
  and vnc-server exactly once, preserve every configuration byte and retained chat file, and keep three pending entries through
  explicit repeat and normal candidate restart. It does not export configurations or activate modules.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- native
fixtures:
- reset_db
- module_upgrade
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 3
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: servers
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: rdp-server
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(3)'
    equals: vnc-server
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: preflight
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: servers
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: rdp-server
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(3)'
    equals: vnc-server
- module_upgrade_probe:
    phase: pending
- native_restart_app:
    expect_exit_confirmation:
      title: Exit
      message: There is 1 open tab. Exit Taomni and close it?
      confirm_label: Exit
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:

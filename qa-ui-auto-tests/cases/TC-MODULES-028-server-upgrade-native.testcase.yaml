    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 3
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: servers
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: rdp-server
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(3)'
    equals: vnc-server
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: repeat
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- wait_for: '[data-testid="module-upgrade-migrate"]:not([disabled])'
- module_upgrade_probe:
    phase: repeat
- assert_no_runtime_errors: null
- screenshot: server-upgrade-native.png

id: TC-SHOT-N16
title: The public manual mode stays alive across pauses and at page end, switches to automatic and back, receives actual OS wheel input, finishes with the complete
  original page pixels, and cancellation returns the original selection.
covers:
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario:
    scenario: scroll-manual
- assert_visible: '[data-testid="system-screenshot"]'
native_platforms:
- Linux
- Windows
- macOS
verification:
  review: reviewed
  requirements:
  - id: workflow
    requirement: The public manual mode stays alive across pauses and at page end, switches to automatic and back, receives actual OS wheel input, finishes with the
      complete original page pixels, and cancellation returns the original selection. The completed scroll editor has native decorations,
      exits fullscreen and maximized state, opens at the configured 80% display size (capped at 1100 by 800), and can resize to 760 by 620 logical pixels while keeping the original stitched image dimensions.
      Wait for native state and compositor geometry transitions after the result event, including a hidden Wayland selection surface being remapped as a normal document. Retain separate resizable/fullscreen/decorated/maximized facts on failure.
    actions:
    - 1
    - 3
    checkpoints:
    - step: 3
      expectation: 'native_screenshot_scenario: {''scenario'': ''scroll-manual''}'
    - step: 4
      expectation: 'assert_visible: [data-testid="system-screenshot"]'
    results:
    - 3
    - 4
  visual:
  - check: Visible controls, state and image dimensions
    method: automated
    reason: Assertions check actual renderer state and output; screenshots are retained.
  native:
  - check: OS input, clipboard, windows and persistent files
    method: automated
    reason: Native fixed scenarios verify the real OS and independent output pixels. Wayland starts with capture-only consent and requests pointer access only when switching to Auto; Manual pauses and subsequent capture remain valid. Its second full-display capture retains visible Cancel controls outside the captured pixels, verified through Mutter geometry.

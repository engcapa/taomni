id: TC-WS-003
title: Workspaces use one real IDEA tool rail even before a folder is added
description: The shared editor owns the contextual rail in an empty workspace; its actual tool overflow and stripe context menu retain main tool and layout
  operations. Sessions hides workspace controls.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
timeout_sec: 240

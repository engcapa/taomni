id: TC-WS-008
title: 'AC-09/13: Hide preserves canvas width at desktop, medium and 400px viewports'
description: 'AC-09/13: Hide preserves canvas width at desktop, medium and 400px viewports'
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- browser
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="workspace-navigator"]'
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- set_viewport:
    width: 1440
    height: 900
- click: '[data-testid="workspace-hide"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- eval_readonly:
    expression: document.getElementById('sidebar').getBoundingClientRect().width === 0
    expect_truthy: true
    timeout_sec: 5
- assert_element_geometry:
    selector: '[data-testid="workspace-canvas"]'
    min_width: 180
    min_height: 100
- eval_readonly:
    expression: document.documentElement.scrollWidth <= document.documentElement.clientWidth
    expect_truthy: true
- click: '[data-testid="side-tab-work"]'
- wait_for: '[data-testid="workspace-navigator"]'
- screenshot: workspace-1440.png

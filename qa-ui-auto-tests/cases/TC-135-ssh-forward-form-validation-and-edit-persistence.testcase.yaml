id: TC-135
title: SSH port-forward form validates required fields and persists edited rows
covers:
- F6.3
- F6.2
tags:
- ssh
- session
- settings
- forwarding
- validation
- persistence
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-forward-validation.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-forward-validation
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_disabled: '[data-testid="session-forward-add"]'
- fill:
    selector: 'input[aria-label="New forward local address"]'
    value: 127.0.0.1:19210
- assert_disabled: '[data-testid="session-forward-add"]'
- fill:
    selector: 'input[aria-label="New forward remote address"]'
    value: service.internal:80
- assert_enabled: '[data-testid="session-forward-add"]'
- fill:
    selector: 'input[aria-label="New forward description"]'
    value: first-forward
- click: '[data-testid="session-forward-add"]'
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 1
- assert_attribute:
    selector: 'input[aria-label="Forward local address"]'
    name: value
    equals: 127.0.0.1:19210
- assert_attribute:
    selector: 'input[aria-label="Forward remote address"]'
    name: value
    equals: service.internal:80
- assert_attribute:
    selector: 'input[aria-label="Forward description"]'
    name: value
    equals: first-forward
- assert_attribute:
    selector: 'input[aria-label="New forward local address"]'
    name: value
    equals: ''
- fill:
    selector: 'input[aria-label="Forward local address"]'
    value: 127.0.0.1:19211
- assert_attribute:
    selector: 'input[aria-label="Forward local address"]'
    name: value
    equals: 127.0.0.1:19211
- fill:
    selector: 'input[aria-label="Forward remote address"]'
    value: service.internal:81
- assert_attribute:
    selector: 'input[aria-label="Forward remote address"]'
    name: value
    equals: service.internal:81
- fill:
    selector: 'input[aria-label="Forward description"]'
    value: edited-forward
- assert_attribute:
    selector: 'input[aria-label="Forward description"]'
    name: value
    equals: edited-forward
- fill:
    selector: 'input[aria-label="New forward local address"]'
    value: 127.0.0.1:19212
- fill:
    selector: 'input[aria-label="New forward remote address"]'
    value: service.internal:82
- fill:
    selector: 'input[aria-label="New forward description"]'
    value: second-forward
- click: '[data-testid="session-forward-add"]'
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 2
- click: '[data-testid^="session-forward-remove-"]'
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 1
- assert_attribute:
    selector: 'input[aria-label="Forward local address"]'
    name: value
    equals: 127.0.0.1:19212
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-forward-validation
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-forward-validation"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-forward-validation"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 1
- assert_attribute:
    selector: 'input[aria-label="Forward local address"]'
    name: value
    equals: 127.0.0.1:19212
- assert_attribute:
    selector: 'input[aria-label="Forward remote address"]'
    name: value
    equals: service.internal:82
- assert_attribute:
    selector: 'input[aria-label="Forward description"]'
    name: value
    equals: second-forward
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 135-ssh-forward-validation.png

id: TC-EXPLORER-014
title: Explorer creates recognized editable file types and rejects invalid names without overwriting files
description: Toolbar and directory blank-area context entry open the same type selector. Exercise cancellation, path/preview-only rejection,
  an existing-file conflict, retry, extension-specific numbered names, selected rename and exact empty bytes. Native proves real exclusive
  file creation; browser proves VFS only. Existing folder/txt workflow remains protected by TC-EXPLORER-003.
modes:
- browser
- native
covers:
- F-EXPLORER-1
- F-FILEOPEN-1
tags:
- p1
- explorer
- file-open
- filesystem
- native-boundary
fixtures:
- reset_db
- file_open_files
timeout_sec: 360

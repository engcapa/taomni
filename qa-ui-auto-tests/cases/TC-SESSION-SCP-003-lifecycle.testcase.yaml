id: TC-SESSION-SCP-003
title: Previously saved SCP pause, background ownership, cancellation and retry preserve exact bytes
covers:
- F6.3
- F7.2
- F7.3
tags:
- session
- native
- regression
modes:
- native
fixtures:
- reset_db
- ssh_features_required
timeout_sec: 360
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 45
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-scp"]'
- wait_for:
    selector: '[data-testid="startup-vault-check"]'
    state: hidden
    timeout_sec: 45
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-scp"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    timeout_sec: 45
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.ssh_features.remote_dir}
- press: Enter
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: scp-source.txt
    timeout_sec: 45
- click: '[data-testid="sftp-local-path-edit"]'
- fill:
    selector: '[data-testid="sftp-local-path"]'
    value: ${cfg.ssh_features.local_dir}
- press: Enter
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: scp-upload.txt
    timeout_sec: 45
- click: '[data-testid="sftp-remote-list"] tr[title$="/scp-large.bin"]'
- click: '[data-testid="sftp-remote-download-selected"]'
- wait_for: '[data-testid="sftp-transfer-queue"] [data-transfer-state="running"] button[title="Pause"]'
- click: '[data-testid="sftp-transfer-queue"] button[title="Pause"]'
- wait_for: '[data-testid="sftp-transfer-queue"] [data-transfer-state="paused"]'
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-transfer-queue"] [data-transfer-state="paused"]'
- click: '[data-testid="sftp-transfer-queue"] button[title="Resume"]'
- wait_for: '[data-testid="sftp-transfer-queue"] [data-transfer-state="running"]'
- wait_for:
    selector: '[data-testid="sftp-transfer-queue"] [data-transfer-state="running"][data-transfer-bytes]:not([data-transfer-bytes="0"])'
    timeout_sec: 45
- click: '[data-testid="sftp-transfer-queue"] button[title="Cancel"]'
- wait_for: '[data-testid="sftp-transfer-queue"] [data-transfer-state="cancelled"]'
- click: '[data-testid="sftp-transfer-queue"] button[title="Retry"]'
- assert_file_sha256:
    path: ${cfg.ssh_features.large_downloaded}
    equals: 6b4be392164b2c21ce9cd339a9846f9de7afb4407b46becb7ddf98081e3c6cac
    timeout_sec: 90
- assert_visible: '[data-testid="sftp-transfer-queue"] [data-transfer-state="done"][data-resume-bytes]:not([data-resume-bytes="0"])'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Previously saved SCP sessions continue to exercise the original SCP pause, background ownership, cancellation and retry preserve exact bytes workflow;
      new session configuration offers only SFTP.

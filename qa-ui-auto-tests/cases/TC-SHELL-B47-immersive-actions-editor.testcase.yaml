id: TC-SHELL-B47
title: Immersive action search preserves the workspace editor
description: Shell redesign follow-up acceptance. User actions use production controls and commands. Browser stubs
  do not establish native side effects.
covers:
- F-SHELL-1
tags:
- workspace-shell
- p1
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Mod+End
- type: IMMERSIVE_DRAFT
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.immersive.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.immersive.toggle"]'
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-immersive
    equals: 'true'
- assert_not_visible: '[data-testid="app-titlebar"]'
- assert_not_visible: '[data-testid="shell-rail"]'
- assert_not_visible: '[data-testid="status-bar"]'
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-navigator-placement
    equals: hidden
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: IMMERSIVE_DRAFT
- screenshot: immersive-editor.png
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.tao.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.tao.toggle"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- press:
    selector: '[data-testid="ai-chat-drawer-hide"]'
    key: Escape
- assert_not_visible: '[data-testid="ai-chat-drawer"]'
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.immersive.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.immersive.toggle"]'
- assert_attribute:
    selector: '[data-testid="shell-root"]'
    name: data-immersive
    equals: 'false'
- assert_visible: '[data-testid="app-titlebar"]'
- assert_visible: '[data-testid="shell-rail"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: IMMERSIVE_DRAFT
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- press: F1
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: nonexistent-command-4729
- assert_visible: '[data-testid="shell-action-empty"]'
- press:
    selector: '[data-testid="shell-action-search"]'
    key: Enter
- assert_visible: '[data-testid="shell-action-palette"]'
- press:
    selector: '[data-testid="shell-action-search"]'
    key: Escape
- assert_not_visible: '[data-testid="shell-action-palette"]'
- press: F1
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.immersive.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.immersive.toggle"]'
- press: F1
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: app.titlebar
- click: '[data-testid="shell-action-result"][data-action-id="app.titlebar"]'
- assert_visible: '[data-testid="app-titlebar"]'
- assert_visible: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="shell-rail"]'
- press:
    selector: '[data-testid="shell-quick-switch"]'
    key: Escape
- assert_not_visible: '[data-testid="app-titlebar"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - IMMERSIVE_DRAFT
- press: F1
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.immersive.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.immersive.toggle"]'
- assert_visible: '[data-testid="app-titlebar"]'
- press: F1
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.immersive.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.immersive.toggle"]'
- assert_not_visible: '[data-testid="code-workspace-toolbar"]'
- assert_not_visible: '[data-testid="code-workspace-tool-rail-right"]'
- press: F1
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: workspace.showProblems
- click: '[data-testid="shell-action-result"][data-action-id="workspace.showProblems"]'
- wait_for: '[data-testid="shell-host"]'
- assert_visible: '[data-testid="code-workspace-problems-panel"]'
- press:
    selector: '[data-testid="shell-host-hide"]'
    key: Escape
- assert_not_visible: '[data-testid="shell-host"]'
- assert_not_visible: '[data-testid="app-titlebar"]'

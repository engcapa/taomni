  native:
  - check: Native chooser, disk and OS clipboard
    method: not-applicable
    reason: Browser only here; TC-FILE-OPEN-021 separately exercises these native boundaries.
  visual:
  - check: Editable document pages and Mermaid viewer
    method: manual
    reason: Inspect retained exports with an independent graph renderer plus viewer screenshot.

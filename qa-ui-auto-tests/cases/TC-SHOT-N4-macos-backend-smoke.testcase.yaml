id: TC-SHOT-N4
title: Native pin bytes and OS hotkey lifecycle including Wayland portal grant
covers: [F27.1, F27.2]
tags: [screenshot, native, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario: {scenario: pin}
- native_screenshot_scenario: {scenario: hotkey}
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: pin-hotkey
    requirement: Save exact captured bytes, load/close a real pin and remove its copy; OS shortcut opens overlay, native close restores main while its source surface can authorize activation, disable prevents trigger and original setting is restored.
    actions: [1]
    checkpoints:
    - {step: 3, expectation: Saved bytes identical and 320x200 pin loaded then closed with copy removed.}
    - {step: 4, expectation: "Real OS chord triggers loaded overlay, native close restores main, disabled chord does not open and original registration/config restored."}
    - {step: 5, expectation: Main window usable.}
    results: [3, 4, 5]
  visual:
  - {check: Pin aspect ratio, method: external, reason: Inspect saved screenshot artifact; image dimensions are asserted automatically.}
  native:
  - {check: Pin and global hotkey, method: automated, reason: "Real native windows/disk and OS key injection; Wayland registers the compiled host app identity before desktop initialization, then requires a real GlobalShortcuts grant and Activated event. Accessibility failures remain failures."}

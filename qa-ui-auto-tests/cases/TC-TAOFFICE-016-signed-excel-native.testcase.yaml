id: TC-TAOFFICE-016
title: Parse workbooks in the installed signed Excel host
description: Install and enable Excel, verify real worksheet cells and formulas, check a malformed workbook, then disable Excel while its document remains open.
modes: [native]
covers: [F-FILEOPEN-1, F-Modules-1]
tags: [p0, file-open, taoffice, taoffice-excel, native-boundary]
fixtures: [reset_db, file_open_files, taoffice_signed_excel]
timeout_sec: 235
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.excel_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.excel_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- click: '[data-testid="module-action-enable-taoffice-excel"]'
- wait_for: '[data-testid="module-action-disable-taoffice-excel"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- dblclick: '[data-testid="explorer-file-row"][data-name="quarterly.xlsx"]'
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="C2"]'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="C2"]', contains: '24'}
- click: '[data-testid="taoffice-excel-cell"][data-address="C2"]'
- assert_attribute: {selector: '[data-testid="taoffice-excel-formula"]', name: value, equals: '=B2*2'}
- assert_count: {selector: '[data-testid="taoffice-excel-sheet"]', equal: 2}
- press: {selector: '[data-testid="taoffice-excel-sheet"][aria-selected="true"]', key: ArrowRight}
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="B2"]'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="A2"]', contains: 上海}
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: 'TRUE'}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/quarterly.xlsx', sha256: '${fixture.taoffice_workbook_sha}'}
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="broken.xlsx"]'
- wait_for: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-excel-error"]'
- assert_text: {selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-excel-error"]', contains: Check for encryption or file damage}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-taoffice-excel"]'
- wait_for: '[data-testid="module-action-enable-taoffice-excel"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="file-viewer"][data-active="true"][data-module="taoffice-excel"] [data-testid="document-module-state"]'
- assert_count: {selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-excel-grid"]', equal: 0}
- assert_no_runtime_errors: null

    - step: 30
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="mail-storage-mode"]'',
        ''name'': ''value'', ''equals'': ''include''}}'
    - step: 31
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="mail-storage-folder-names"]'',

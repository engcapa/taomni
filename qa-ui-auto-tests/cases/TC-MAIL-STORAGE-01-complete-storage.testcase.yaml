    - step: 15
      expectation: Browse fills the chosen directory.
    - step: 33
      expectation: Unchecking INBOX updates the exact folder-name list.
    - step: 35
      expectation: Checking INBOX restores the selected folder.
    - step: 58
      expectation: The original export UI reports the chosen filename; real bytes

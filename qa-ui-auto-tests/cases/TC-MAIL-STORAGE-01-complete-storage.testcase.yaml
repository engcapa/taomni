id: TC-MAIL-STORAGE-01
title: Configure complete storage and explicitly clean retained local originals
description: Renderer-only workflow with preview mail. Native file migration, MIME
  integrity, backup contents and cleanup are separately asserted by TC-MAIL-STORAGE-02.
  Linux browser is exercised locally; Windows/macOS remain pending.
covers:
- F-MAIL-23
- F-BACKUP-1
tags:
- mail
- backup
- p1
modes:
- browser
fixtures:
- reset_db
- mail_server
- mail_storage
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:
    selector: input[aria-label="IMAP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-imap-security"]'
    value: None
- fill:
    selector: input[aria-label="IMAP port"]
    value: ${fixture.mail_imap_port}
- fill:
    selector: input[aria-label="Mail email or username"]
    value: qa@example.com
- fill:
    selector: input[aria-label="Mail password or app password token"]
    value: qa-pass
- fill:
    selector: input[aria-label="SMTP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-smtp-security"]'
    value: None
- fill:
    selector: input[aria-label="SMTP port"]
    value: ${fixture.mail_smtp_port}
- seed_dialog:
    prompt: ${fixture.mail_storage_a}
- click: '[data-testid="mail-storage-browse"]'
- assert_attribute:
    selector: '[data-testid="mail-storage-directory"]'
    name: value
    equals: ${fixture.mail_storage_a}
- select_option:
    selector: '[data-testid="mail-storage-mode"]'
    value: include
- fill:
    selector: '[data-testid="mail-storage-folder-names"]'
    value: INBOX
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: QA complete mail
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-mail-storage-password
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 60
- wait_for: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- click: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-mail"]'
- assert_attribute:
    selector: '[data-testid="mail-storage-directory"]'
    name: value
    equals: ${fixture.mail_storage_a}
- assert_attribute:
    selector: '[data-testid="mail-storage-mode"]'
    name: value
    equals: include
- assert_attribute:
    selector: '[data-testid="mail-storage-folder-names"]'
    name: value
    equals: INBOX
- set_check:
    selector: '[data-testid="mail-storage-folders"] input[aria-label="INBOX"]'
    checked: false
- assert_attribute:
    selector: '[data-testid="mail-storage-folder-names"]'
    name: value
    equals: ''
- set_check:
    selector: '[data-testid="mail-storage-folders"] input[aria-label="INBOX"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="mail-storage-folder-names"]'
    name: value
    equals: INBOX
- select_option:
    selector: '[data-testid="mail-storage-mode"]'
    value: exclude
- fill:
    selector: '[data-testid="mail-storage-folder-names"]'
    value: Archive
- fill:
    selector: '[data-testid="mail-storage-directory"]'
    value: ${fixture.mail_storage_b}
- click: '[data-testid="session-save"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 60
- click: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-mail"]'
- assert_attribute:
    selector: '[data-testid="mail-storage-mode"]'
    name: value
    equals: exclude
- assert_attribute:
    selector: '[data-testid="mail-storage-folder-names"]'
    name: value
    equals: Archive
- assert_attribute:
    selector: '[data-testid="mail-storage-directory"]'
    name: value
    equals: ${fixture.mail_storage_b}
- click: '[data-testid="session-cancel"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- wait_for: '[data-testid="mail-archive-open"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 30
- click: '[data-testid="mail-archive-open"]'
- wait_for: '[data-testid="mail-archive-read"]'
- click: '[data-testid="mail-archive-row"]:first-child [data-testid="mail-archive-read"]'
- assert_text:
    selector: '[data-testid="mail-archive-preview"]'
    contains: Save original EML
- seed_dialog:
    prompt: ${fixture.mail_storage_a}/original.eml
- click: '[data-testid="mail-archive-export"]'
- assert_text:
    selector: '[data-testid="mail-archive-notice"]'
    contains: original.eml
- click: '[data-testid="mail-archive-read"]:has-text("Account-level AI policy")'
- wait_for: '[data-testid="mail-archive-attachment"]'
- seed_dialog:
    prompt: ${fixture.mail_storage_a}/policy.txt
- click: '[data-testid="mail-archive-attachment"]'
- assert_text:
    selector: '[data-testid="mail-archive-notice"]'
    contains: policy.txt
- click: '[data-testid="mail-archive-row"]:first-child input[type="checkbox"]'
- click: '[data-testid="mail-archive-cleanup"]'
- wait_for: '[data-testid="mail-archive-confirm"]'
- click: '[data-testid="mail-archive-confirm-cancel"]'
- assert_not_visible: '[data-testid="mail-archive-confirm"]'
- click: '[data-testid="mail-archive-cleanup"]'
- click: '[data-testid="mail-archive-confirm-remove"]'
- assert_text:
    selector: '[data-testid="mail-archive-notice"]'
    contains: Local originals removed
    timeout_sec: 30
- click: '[data-testid="mail-archive-close"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: paused
    timeout_sec: 30
- click: '[data-testid="mail-storage-resume"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 30
- mail_server_deliver:
    count: 205
    prefix: Archive page
- click: '[data-testid="mail-sync-button"]'
- assert_text:
    selector: '[data-testid="mail-message-list"]'
    contains: Archive page 0205
    timeout_sec: 30
- click: '[data-testid="mail-storage-resume"]'
- click: '[data-testid="mail-archive-open"]'
- click: '[data-testid="mail-archive-refresh"]'
- assert_count:
    selector: '[data-testid="mail-archive-row"]'
    equal: 200
- click: '[data-testid="mail-archive-next"]'
- assert_count:
    selector: '[data-testid="mail-archive-row"]'
    min: 1
    max: 199
- click: '[data-testid="mail-archive-prev"]'
- assert_count:
    selector: '[data-testid="mail-archive-row"]'
    equal: 200
- click: '[data-testid="mail-archive-close"]'
- click: '[data-testid="ribbon-settings"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- set_check:
    selector: '[data-testid="backup-include-mail"]'
    checked: true
- select_option:
    selector: '[data-testid="backup-scope"]'
    value: full
- set_check:
    selector: '[data-testid="backup-include-mail"]'
    checked: false
- set_check:
    selector: '[data-testid="backup-auto-include-mail"]'
    checked: true
- screenshot: mail-storage-settings.png
- eval_readonly:
    expression: document.getElementById("backup-auto-include-mail").checked
    expect_truthy: true

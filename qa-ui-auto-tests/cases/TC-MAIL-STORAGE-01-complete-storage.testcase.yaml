  visual:
  - check: Storage settings, progress and archive list remain readable without clipping.
    method: manual
    reason: Review screenshots on each OS after the user executes this case.
  native:
  - check: Independent SQLite, gzip MIME/attachments and backup ZIP checks.
    method: not-applicable
    reason: This case verifies renderer controls and preview behavior only; TC-MAIL-STORAGE-02
      covers native bytes.

id: TC-MAIL-STORAGE-01
title: Configure complete storage and explicitly clean retained local originals
description: Renderer-only workflow with preview mail. Native file migration, MIME integrity, backup contents and cleanup are separately asserted by TC-MAIL-STORAGE-02. Linux
  browser is exercised locally; Windows/macOS remain pending.
covers:
- F-MAIL-23
- F-BACKUP-1
tags:
- mail
- backup
- p1
modes:
- browser
fixtures:
- reset_db
- mail_server
- mail_storage
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:

id: TC-IDE-C7-03
title: Project descriptor discovery stays separate from ready facts
description: 'ED-PROJECT-001 browser slice. Creates a real browser-VFS Maven descriptor

  through the Code Workspace UI, refreshes the production facts/discovery

  status, and asserts that descriptor discovery is visible while browser-only

  tooling remains an explicit failed/unresolved facts state rather than Ready.

  Browser VFS proves UI routing and typed unavailable truth only; it does not

  prove native Maven ingestion.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c7
- project-structure
- facts-cache
- p0
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: pom.xml
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- type: <project><artifactId>qa-project</artifactId></project>
- press: Control+s
- wait_for: '[data-testid="project-facts-status-badge"]'
- click: '[data-testid="project-facts-refresh-btn"]'
- assert_text:
    selector: '[data-testid="project-facts-discovery-status"]'
    contains: Maven Discovered
    timeout_sec: 15
- assert_text:
    selector: '[data-testid="project-facts-status-badge"]'
    contains: Facts Failed
    timeout_sec: 15
- assert_not_visible: '[data-testid="project-facts-ready-icon"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Project descriptor discovery stays separate from ready facts：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
    - 13
    - 14
    - 16
    - 17
    - 18
    - 20
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 15
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor\"] .cm-content"}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"project-facts-status-badge\"]"}'
    - step: 21
      expectation: '{"assert_text": {"selector": "[data-testid=\"project-facts-discovery-status\"]", "contains":
        "Maven Discovered", "timeout_sec": 15}}'
    - step: 22
      expectation: '{"assert_text": {"selector": "[data-testid=\"project-facts-status-badge\"]", "contains": "Facts
        Failed", "timeout_sec": 15}}'
    - step: 23
      expectation: '{"assert_not_visible": "[data-testid=\"project-facts-ready-icon\"]"}'
    results:
    - 21
    - 22
    - 23
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

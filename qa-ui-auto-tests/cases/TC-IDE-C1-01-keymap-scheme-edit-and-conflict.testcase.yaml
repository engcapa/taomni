id: TC-IDE-C1-01
title: 'Keymap scheme surface: action binding recorded, conflict, close'
description: '§8.19.10 gate case C1 (browser portion). Capability ids:

  editor.keymap-editable / keymap.scheme-surface.

  Required mode: browser (settings surface is pure UI/store); physical

  layout and OS shortcut interception stay native. Highest claim on green:

  L1 browser-wired. Dispatches workspace.keymapSettings through Search

  Everywhere, records a fresh primary chord on editor.replace via the

  two-stroke recorder, verifies the replace slot renders, then closes.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c1
- keymap
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-tab"]'
- wait: 0.3
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
- click: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
- type: Keymap Settings
- click: '[data-testid="code-workspace-search-everywhere"] >> text=Keymap Settings'
- wait_for: '[data-testid="workspace-keymap-settings-dialog"]'
- assert_visible: '[data-testid="keymap-scheme-select"]'
- select_option:
    selector: '[data-testid="keymap-scheme-select"]'
    label: IDEA defaults (default)
- assert_attribute:
    selector: '[data-testid="keymap-scheme-select"]'
    name: value
    equals: ''
- click: '[data-testid="workspace-keymap-settings-dialog"] >> text=Copy'
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"keymap-scheme-select\"] option:checked")?.textContent?.includes("copy")
    expect_truthy: true
- fill:
    selector: '[data-testid="keymap-action-filter"]'
    value: Replace in File
- wait_for: '[data-testid="keymap-row-editor.replace"]'
- screenshot: tc-ide-c1-dialog.png
- click: '[data-testid="keymap-add-editor.replace"]'
- press: Alt+Shift+r
- press: Enter
- assert_visible: '[data-testid="keymap-replace-editor.replace-0"]'
- screenshot: tc-ide-c1-recorded.png
- click: '[data-testid="keymap-settings-close"]'
- wait_for:
    selector: '[data-testid="workspace-keymap-settings-dialog"]'
    state: detached
    timeout_sec: 5
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 'Keymap scheme surface: action binding recorded, conflict, close：按步骤执行后，所有声明的可观察结果均满足。'
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
    - 13
    - 15
    - 17
    - 18
    - 19
    - 20
    - 23
    - 25
    - 27
    - 30
    - 31
    - 32
    - 35
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor-pane\"]"}'
    - step: 16
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-search-everywhere\"]", "timeout_sec":
        30}}'
    - step: 21
      expectation: '{"wait_for": "[data-testid=\"workspace-keymap-settings-dialog\"]"}'
    - step: 22
      expectation: '{"assert_visible": "[data-testid=\"keymap-scheme-select\"]"}'
    - step: 24
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"keymap-scheme-select\"]", "name": "value",
        "equals": ""}}'
    - step: 26
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\"[data-testid\" + String.fromCharCode(61)
        + \"\\\"keymap-scheme-select\\\"] option:checked\")?.textContent?.includes(\"copy\")", "expect_truthy":
        true}}'
    - step: 28
      expectation: '{"wait_for": "[data-testid=\"keymap-row-editor.replace\"]"}'
    - step: 33
      expectation: '{"assert_visible": "[data-testid=\"keymap-replace-editor.replace-0\"]"}'
    - step: 36
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-keymap-settings-dialog\"]", "state": "detached",
        "timeout_sec": 5}}'
    results:
    - 36
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

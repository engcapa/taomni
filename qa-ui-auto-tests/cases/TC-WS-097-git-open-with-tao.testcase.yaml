id: TC-WS-097
title: Git Changes and Logs open the clicked repository file in Tao
description: Two repositories contain same.txt with distinct bytes. The clicked repo-b worktree opens through both context menus
  in its owning workspace; closing the viewer returns to Git and preserves the source. Native proves real worktree reads, browser
  proves routing.
modes:
- browser
- native
covers:
- F-WS-4
- F26.1
- F-FILEOPEN-1
tags:
- p1
- regression
- git
fixtures:
- reset_db
- parity008_git
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-git-actions-TC-WS-084
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default
      Workspace","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"parity008","path":"${fixture.parity008_root}","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-sidebar-panel"]'
- assert_count:
    selector: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-git"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-bottom-tab-git"]'
    equal: 0
- click: '[data-testid="code-workspace-tool-rail-git"]'
- wait_for: '[data-testid="workspace-git-manager"]'
- wait_for: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- wait_for: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- right_click: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- assert_enabled: '[data-testid="git-file-preview"]'
- click: '[data-testid="git-file-preview"]'
- wait_for: '[data-testid="workspace-tab"][data-tab-kind="viewer"][data-active="true"]'
- assert_text:
    selector: '[data-testid="workspace-canvas-pane"] [data-testid="viewer-editor"] .cm-content'
    contains: repo-b WORKTREE
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="viewer"]'
    equal: 1
- click: '[data-testid="workspace-tab"][data-tab-kind="viewer"] [data-testid="workspace-tab-close"]'
- wait_for: '[data-testid="workspace-git-panel"]'
- click: '[data-testid="git-log-tab"]'
- wait_for: '[data-testid="git-log-commit"][data-repo-root$="repo-b"]'
- click: '[data-testid="git-log-commit"][data-repo-root$="repo-b"]'
- wait_for: '[data-testid="git-log-file"][data-path="same.txt"]'
- right_click: '[data-testid="git-log-file"][data-path="same.txt"]'
- assert_enabled: '[data-testid="git-file-preview"]'
- click: '[data-testid="git-file-preview"]'
- wait_for: '[data-testid="workspace-tab"][data-tab-kind="viewer"][data-active="true"]'
- assert_text:
    selector: '[data-testid="workspace-canvas-pane"] [data-testid="viewer-editor"] .cm-content'
    contains: repo-b WORKTREE
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="viewer"]'
    equal: 1
- click: '[data-testid="workspace-tab"][data-tab-kind="viewer"] [data-testid="workspace-tab-close"]'
- wait_for: '[data-testid="workspace-git-panel"]'
- assert_no_runtime_errors: null
- screenshot: git-open-with-tao.png

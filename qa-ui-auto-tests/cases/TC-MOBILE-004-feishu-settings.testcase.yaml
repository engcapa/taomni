id: TC-MOBILE-004
title: Feishu adapter persists credentials identity bindings and isolated proxy without connecting
covers:
- F-MOBILE-2
- F12.1
tags:
- p1
- mobile
- feishu
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 120
description: Settings entry and persistence workflow. Native verifies real vault/config IPC; browser uses a renderer
  stub. No real Feishu connection or message is made. Native Rust loopback fixtures own long-connection transport
  and Agent effects. A fresh on-demand vault is initialized through the actual setup dialog after saving, not inferred
  from a visible welcome panel.
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: feishu
- wait_for: '[data-testid="feishu-settings"]'
- assert_disabled: '[data-testid="feishu-toggle"]'
- fill:
    selector: '[data-testid="feishu-app-id"]'
    value: cli_qa_settings
- fill:
    selector: '[data-testid="feishu-app-secret"]'
    value: qa-disposable-not-real-secret
- fill:
    selector: '[data-testid="feishu-bindings"]'
    value: invalid_identity
- click: '[data-testid="feishu-save"]'
- assert_text:
    selector: '[data-testid="feishu-error"]'
    contains: invalid_identity_binding
- fill:
    selector: '[data-testid="feishu-bindings"]'
    value: ou_qa_user oc_qa_chat
- fill:
    selector: '[data-testid="feishu-mobile-endpoint"]'
    value: https://mobile.example.invalid
- select_option:
    selector: '[data-testid="feishu-proxy-mode"]'
    value: custom
- wait_for: '[data-testid="feishu-custom-proxy"]'
- select_option:
    selector: '[data-testid="feishu-proxy-mode"]'
    value: none
- click: '[data-testid="feishu-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-feishu-settings-password
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-feishu-settings-password
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="feishu-saved"]'
- assert_items:
    selector: '[data-testid="feishu-app-secret"]'
    attribute: value
    equals:
    - ''
- assert_disabled: '[data-testid="feishu-toggle"]'
- click: '[data-testid="tab-item"][data-tab-type="settings"] [data-testid="tab-close"]'
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: feishu
- assert_items:
    selector: '[data-testid="feishu-app-id"]'
    attribute: value
    equals:
    - cli_qa_settings
- assert_text_equals:
    selector: '[data-testid="feishu-bindings"]'
    equals: ou_qa_user oc_qa_chat
- assert_items:
    selector: '[data-testid="feishu-proxy-mode"] option:checked'
    attribute: value
    equals:
    - none
- assert_text:
    selector: '[data-testid="feishu-status"]'
    contains: Stopped
- assert_no_runtime_errors: null
- screenshot: feishu-settings-saved-without-connection.png
- eval_readonly:
    expression: "!document.getElementById('feishu-allow-files').checked"
    expect_truthy: true
- assert_text:
    selector: '[data-testid="feishu-settings"]'
    contains: file content is not sent by default
- click: '[data-testid="feishu-allow-files"]'
- click: '[data-testid="feishu-save"]'
- wait_for: '[data-testid="feishu-saved"]'
- click: '[data-testid="tab-item"][data-tab-type="settings"] [data-testid="tab-close"]'
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: feishu
- wait_for: '[data-testid="feishu-settings"]'
- eval_readonly:
    expression: document.getElementById('feishu-allow-files').checked
    expect_truthy: true
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Global settings finds Feishu; invalid bindings fail; saved app identity/proxy survive reopening
      while the secret stays hidden and outbound connection remains disabled with mobile off. First use initializes
      the vault inline and resumes the pending save.
    actions:
    - 2
    - 3
    - 6
    - 7
    - 8
    - 9
    - 11
    - 12
    - 13
    - 15
    - 16
    - 18
    - 19
    - 20
    - 24
    - 25
    - 26
    checkpoints:
    - step: 5
      expectation: Adapter cannot start before the mobile service.
    - step: 10
      expectation: Malformed identity is rejected before persistence.
    - step: 14
      expectation: Feature uses shared Settings proxy configuration controls.
    - step: 22
      expectation: App Secret field is empty after saving.
    - step: 23
      expectation: No outbound connection starts from saving credentials.
    - step: 27
      expectation: App ID persists across reopening Settings.
    - step: 28
      expectation: Bound user and chat persist across reopening Settings.
    - step: 29
      expectation: No-proxy selection persists independently.
    - step: 30
      expectation: Adapter remains stopped.
    - step: 31
      expectation: No runtime errors.
    - step: 17
      expectation: Saving the first secret opens the existing on-demand vault setup dialog.
    - step: 21
      expectation: Setting the master password resumes the save, without another click or credential re-entry.
    results:
    - 5
    - 10
    - 14
    - 17
    - 21
    - 22
    - 23
    - 27
    - 28
    - 29
    - 30
    - 31
  - id: R2
    requirement: File content export defaults off, explicitly warns of sending content to Feishu, and an opt-in survives closing and reopening Settings.
    actions: [35, 36, 38, 39, 40]
    checkpoints:
    - step: 33
      expectation: Private-chat file content export defaults off.
    - step: 34
      expectation: The data export warning is visible.
    - step: 42
      expectation: Explicit opt-in persists after Settings is recreated.
    - step: 43
      expectation: No runtime errors after changing the export setting.
    results: [33, 34, 42, 43]
  visual:
  - check: Settings screenshot is diagnostic.
    method: not-applicable
    reason: Field and state assertions own acceptance.
  native:
  - check: Actual credential/config persistence requires native IPC.
    method: automated
    reason: Native mode writes the isolated QA vault and app-data config; the protocol fixture separately checks
      actual HTTP/WS behavior.

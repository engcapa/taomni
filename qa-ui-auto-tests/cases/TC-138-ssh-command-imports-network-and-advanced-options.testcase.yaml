id: TC-138
title: SSH command import fills advanced and network options and persists the complete draft
covers:
- F6.3
tags:
- ssh
- session
- settings
- parser
- advanced
- network
- forwarding
- persistence
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="sidebar"]'
    timeout_sec: 45
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh -p 2201 -i /home/qauser/.ssh/parser_key -J jump-user@bastion.example.test:2200 -L 127.0.0.1:15432:db.internal:5432 -C -Y -6 -o ServerAliveInterval=45
      deploy@app-parser.example.test tmux new -A -s qa
- click: '[data-testid="session-host-lookup"]'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: app-parser.example.test
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: '2201'
- assert_attribute:
    selector: '[data-testid="session-user"]'
    name: value
    equals: deploy
- assert_attribute:
    selector: '[data-testid="session-specify-username"]'
    name: data-checked
    equals: 'true'
- assert_count:
    selector: '[data-testid="session-auth-privatekey"]:checked'
    equal: 1
- assert_attribute:
    selector: input[aria-label="Private key path"]
    name: value
    equals: /home/qauser/.ssh/parser_key
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-x11-trusted-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: '[data-testid="session-compression-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: input[aria-label="Execute command"]
    name: value
    equals: tmux new -A -s qa
- assert_attribute:
    selector: '[data-testid="session-do-not-exit"]'
    name: data-checked
    equals: 'false'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: ssh-tunnel
- assert_attribute:
    selector: input[aria-label="Jump host"]
    name: value
    equals: bastion.example.test
- assert_attribute:
    selector: input[aria-label="Jump port"]
    name: value
    equals: '2200'
- assert_attribute:
    selector: input[aria-label="Jump user"]
    name: value
    equals: jump-user
- assert_attribute:
    selector: '[data-testid="session-keepalive-toggle"]'
    name: data-checked
    equals: 'true'
- assert_attribute:
    selector: input[aria-label="Keep-alive interval"]
    name: value
    equals: '45'
- assert_attribute:
    selector: '[data-testid="session-ip-version"]'
    name: value
    equals: ipv6
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 1
- assert_attribute:
    selector: input[aria-label="Forward local address"]
    name: value
    equals: 127.0.0.1:15432
- assert_attribute:
    selector: input[aria-label="Forward remote address"]
    name: value
    equals: db.internal:5432
- assert_attribute:
    selector: input[aria-label="Forward description"]
    name: value
    equals: ''
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-command-options
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-command-options"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-command-options"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: input[aria-label="Private key path"]
    name: value
    equals: /home/qauser/.ssh/parser_key
- assert_attribute:
    selector: input[aria-label="Execute command"]
    name: value
    equals: tmux new -A -s qa
- assert_attribute:
    selector: '[data-testid="session-do-not-exit"]'
    name: data-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="session-x11-forwarding-toggle"]'
    name: data-checked
    equals: 'true'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: ssh-tunnel
- assert_attribute:
    selector: input[aria-label="Jump host"]
    name: value
    equals: bastion.example.test
- assert_attribute:
    selector: input[aria-label="Keep-alive interval"]
    name: value
    equals: '45'
- assert_attribute:
    selector: '[data-testid="session-ip-version"]'
    name: value
    equals: ipv6
- assert_count:
    selector: '[data-testid="network-settings"] input[aria-label="Forward local address"]'
    equal: 1
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 138-ssh-command-options.png

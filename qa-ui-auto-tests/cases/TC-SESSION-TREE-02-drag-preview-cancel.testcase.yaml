id: TC-SESSION-TREE-02
title: Session tree drag count, text selection, Escape, batch and single move
description: 'Runs real held-pointer gestures in the browser and Windows/Linux packaged WebViews. Inspects the active
  ghost, its count, destination highlight and empty text selection before release; verifies cancellation and reload
  persistence. macOS native held gestures are explicitly outside the bridge capability. The target folder is prepared
  through the editor New folder button: WebKitGTK 2.52 loses the released non-primary W3C button, so a setup context
  click contaminates the subsequent held-pointer input. TC-SESSION-TREE-01 independently verifies real right-click
  batch Move.'
covers:
- F6.2
- F-Sidebar-1
- F6.3
- F-FolderName-1
tags:
- sessions
- multi-select
- drag
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 180
native_platforms:
- Linux
- Windows

  visual:
  - check: Selected rows and the drag count remain legible; drop destination is highlighted.
    method: manual
    reason: Inspect the retained screenshots; functional assertions alone do not establish visual clarity.
  native:
  - check: Real Windows WebView2/Linux WebKitGTK held pointer drag, text-selection suppression, Escape and persistent batch
      move.
    method: automated
    reason: Native uses the isolated QA app and real IPC/database. Browser uses stubs. macOS uses packaged WebView event input
      for selection; held-pointer drag is not supported by its stateless bridge.

id: TC-WS-039
title: Shared panel lifecycle survives hidden nested editors, resizing and reload
description: Use real resizable panels and nested editor splits through public controls, retain a dirty draft while terminal/mode switches hide the editor,
  then collapse, resize and reload. Explicit runtime assertions protect component upgrades even if the UI recovers.
modes:
- browser
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-5
- F25.3
- F25.5
tags:
- p0
- workspace-redesign
- regression
- component-upgrade
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-shared-panels
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-empty-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-tree-root"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"] .cm-content'
- press:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    key: Mod+End
- type:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    text: QA_SHARED_PANEL_DRAFT
- wait_for: '[data-testid="workspace-file-editor"][data-dirty="true"]'
- click: '[data-testid="code-workspace-toolbar-more"]'
- click: '[data-testid="code-workspace-split-right"]'
- wait_for: '[data-testid="code-workspace-editor-split"]'
- assert_count:
    selector: '[data-testid="code-workspace-editor-pane"]'
    equal: 2
- click: '[data-testid="code-workspace-tool-rail-documentation"]'
- assert_visible: '[data-testid="code-workspace-right-pane"]'
- drag_to:
    from: '[data-testid="main-sidebar-resize-handle"]'
    by:
      dx: 45
      dy: 0
      steps: 8
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: ArrowLeft
- assert_no_runtime_errors: null
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- assert_visible: '[data-testid="collapsed-sidebar-rail"]'
- assert_no_runtime_errors: null
- click: '[data-testid="workspace-tab"][data-tab-title="README.md"]'
- wait_for: '[data-testid="code-workspace-editor-split"]'
- assert_count:
    selector: '[data-testid="code-workspace-editor-pane"]'
    equal: 2
- assert_visible: '[data-testid="code-workspace-right-pane"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: QA_SHARED_PANEL_DRAFT
- assert_no_runtime_errors: null
- click: '[data-testid="code-workspace-tool-rail-project"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-toolbar-more"]'
- click: '[data-testid="code-workspace-split-unsplit-all"]'
- assert_count:
    selector: '[data-testid="code-workspace-editor-pane"]'
    equal: 1
- click: '[data-testid="code-workspace-tool-rail-documentation"]'
- assert_not_visible: '[data-testid="code-workspace-right-pane"]'
- click: '[data-testid="workspace-toolbar-bottom-dock"]'
- assert_visible: '[data-testid="workspace-bottom-dock"]'
- click: '[data-testid="workspace-toolbar-bottom-dock"]'
- assert_not_visible: '[data-testid="workspace-bottom-dock"]'
- click: '[data-testid="tab-overview-trigger"]'
- wait_for: '[data-testid="tab-overview"]'
- click: '[data-testid="tab-overview-card"][data-tab-id]:first-child'
- wait_for: '[data-testid="workspace-file-editor"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: QA_SHARED_PANEL_DRAFT
- assert_no_runtime_errors: null
- click: '[data-testid="workspace-tab"][data-tab-title="Local Terminal"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- assert_no_runtime_errors: null
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_no_runtime_errors: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-session-pane"]'
- assert_visible: '[data-testid="collapsed-sidebar-rail"]'
- click: '[data-testid="workspace-tab"][data-tab-title="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"]'
- assert_count:
    selector: '[data-testid="code-workspace-editor-pane"]'
    equal: 1
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: QA_SHARED_PANEL_DRAFT
- click: '[data-testid="code-workspace-tool-rail-project"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- drag_to:
    from: '[data-testid="main-sidebar-resize-handle"]'
    by:
      dx: -35
      dy: 0
      steps: 8
- assert_no_runtime_errors: null
- screenshot: workspace-shared-panels-stable.png

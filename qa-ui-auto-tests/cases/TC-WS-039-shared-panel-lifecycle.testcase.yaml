id: TC-WS-039
title: Shared panel lifecycle survives hidden nested editors, resizing and reload
description: Use real resizable panels and nested editor splits through public controls, retain a dirty draft while terminal/mode switches hide
  the editor, then collapse, resize and reload. Immediately activate and close utility tabs after Home/Sessions navigation to detect delayed navigator
  geometry. Explicit runtime assertions protect component upgrades even if the UI recovers. Retains opt-in, read-only ResizeObserver provenance
  from initial workspace creation through hidden split restoration. Repeat the hidden split restoration three times, resizing both directions,
  to expose observer loops during consecutive returns.
modes:
- browser
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-5
- F25.3
- F25.5
tags:
- p0
- workspace-redesign
- regression
- component-upgrade
- crash-regression

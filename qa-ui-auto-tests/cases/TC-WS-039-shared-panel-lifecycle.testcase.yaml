id: TC-WS-039
title: Shared panel lifecycle survives hidden nested editors, resizing and reload
description: 'Use real resizable panels and nested editor splits through public controls, retain a dirty draft while terminal/mode switches hide the editor,
  then collapse, resize and reload. Immediately activate and close utility tabs after Home/Sessions navigation to detect delayed navigator geometry. Explicit
  runtime assertions protect component upgrades even if the UI recovers. Retains opt-in, read-only ResizeObserver provenance from initial workspace creation
  through hidden split restoration. Repeat the hidden split restoration three times, resizing both directions, to expose observer loops during consecutive
  returns. Check real Documentation and both nested editor rectangles after initial opening and each hidden restore, retaining all runtime and draft assertions.
  File-open migration: this IDE pane/layout lifecycle regression explicitly associates .md/.txt with Code Workspace. New viewer defaults are tested separately
  by TC-FILE-OPEN-001..006; all original pane/content/PTY/save assertions are retained.'

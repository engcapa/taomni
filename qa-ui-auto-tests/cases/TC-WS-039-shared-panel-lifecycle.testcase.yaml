  native:
  - check: Consecutive hidden-panel lifecycle and resizing in the packaged WebView.
    method: automated
    reason: Zero-size nested panel registration and pointer geometry depend on WKWebView/WebKitGTK/WebView2. Browser tests cannot certify those component
      and WebView interactions; real PTY and process restart effects remain covered by TC-WS-024 and TC-WS-030.

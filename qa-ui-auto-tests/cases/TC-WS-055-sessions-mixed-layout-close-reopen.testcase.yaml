id: TC-WS-055
title: 'Crash regression: Sessions split/grid close-to-empty and mixed workspace terminal lifecycle'
description: 'Browser preview cannot create native local PTYs. Exercise the real terminal error/empty surfaces, pending panel lifecycle and layout controls
  without treating them as working shells. TC-WS-056 independently proves real PTY effects in the release WebView. File-open migration: this IDE pane/layout
  lifecycle regression explicitly associates .md/.txt with Code Workspace. New viewer defaults are tested separately by TC-FILE-OPEN-001..006; all original
  pane/content/PTY/save assertions are retained.'
modes:
- browser
covers:
- F-WS-1
- F-WS-2
- F-WS-5
- F25.3
- F25.5
- F1.5
tags:
- p0
- workspace-redesign
- regression
- crash-regression
- component-upgrade

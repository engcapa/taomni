  visual:
  - check: Inspect native geometry artifacts and screenshots for clipped labels, title safety and focus
      rings.
    method: manual
    reason: DOM geometry and screenshots do not establish an OS visual verdict.
  native:
  - check: Actual packaged WebView and native IPC on each selected platform.
    method: automated
    reason: Browser stubs cannot establish this boundary.
  - check: OS DPI, cross-display movement, physical native controls and Narrator/VoiceOver/Orca
    method: manual
    reason: DOM geometry at two client sizes does not certify these OS behaviors; V-N16 remains the runbook.

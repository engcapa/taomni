id: TC-SHELL-N16
title: Native WebView default and minimum layouts keep controls reachable
description: V-N16 automated packaged WebView geometry at 1440x900 and 800x600 CSS client sizes. Actual
  element dimensions, viewport containment and center hit testing are recorded. This does not claim OS
  DPI changes, cross-monitor scaling, native traffic-light clicks or screen-reader output.
covers:
- F25.5
- F-SHELL-1
tags:
- p1
- workspace-shell
- native-boundary
modes:
- native
fixtures:
- reset_db
- shell_native_files
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-native-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "shell-native", "name": "Shell Native", "roots": [{"id": "shell", "name": "shell",
      "path": "${fixture.shell_root}", "kind": "folder"}], "looseFiles": [], "lastOpenedAt": 3000, "isGitRepo":
      false, "lastActiveFile": {"kind": "root", "rootId": "shell", "path": "README.md"}}]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 60
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - alpha
    - beta
    - gamma
    - ''
- set_viewport:
    width: 1440
    height: 900
- assert_element_geometry:
    selector: '[data-testid="shell-rail-home"], [data-testid="shell-rail-workspaces"], [data-testid="shell-rail-tao"]'
    min_count: 3
    min_width: 28
    min_height: 28
    within_viewport: true
    hit_center: true
- assert_element_geometry:
    selector: '[data-testid="shell-overview-trigger"], [data-testid="shell-quick-switch"]'
    min_count: 2
    min_width: 24
    min_height: 24
    within_viewport: true
    hit_center: true
- shell_navigate: tools
- click: '[data-testid="shell-navigator-page"][data-page="project"]'
- assert_visible: '[data-testid="code-workspace-tree-root"]'
- assert_element_geometry:
    selector: '[data-testid="shell-navigator-hide"]'
    min_width: 16
    min_height: 16
    within_viewport: true
    hit_center: true
- click: '[data-testid="shell-navigator-hide"]'
- click: '[data-testid="shell-overview-trigger"]'
- assert_attribute:
    selector: '[data-testid="shell-overview"]'
    name: aria-modal
    equals: 'true'
- assert_element_geometry:
    selector: '[data-testid="shell-overview"]'
    min_width: 300
    min_height: 160
    within_viewport: true
    hit_center: true
- assert_element_geometry:
    selector: '[data-testid="shell-tab-navigator-close"]'
    min_width: 16
    min_height: 16
    within_viewport: true
    hit_center: true
- click: '[data-testid="shell-tab-navigator-close"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- assert_visible: '[data-testid="notes-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- assert_not_visible: '[data-testid="notes-panel"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - alpha
    - beta
    - gamma
    - ''
- eval_readonly:
    expression: document.documentElement.scrollWidth <= innerWidth
    expect_truthy: true
- screenshot: tc-shell-n16-1440x900.png
- set_viewport:
    width: 800
    height: 600
- assert_element_geometry:
    selector: '[data-testid="shell-rail-home"], [data-testid="shell-rail-workspaces"], [data-testid="shell-rail-tao"]'
    min_count: 3
    min_width: 28
    min_height: 28
    within_viewport: true
    hit_center: true
- assert_element_geometry:
    selector: '[data-testid="shell-overview-trigger"], [data-testid="shell-quick-switch"]'
    min_count: 2
    min_width: 24
    min_height: 24
    within_viewport: true
    hit_center: true
- shell_navigate: tools
- click: '[data-testid="shell-navigator-page"][data-page="project"]'
- assert_visible: '[data-testid="code-workspace-tree-root"]'
- assert_element_geometry:
    selector: '[data-testid="shell-navigator-hide"]'
    min_width: 16
    min_height: 16
    within_viewport: true
    hit_center: true
- click: '[data-testid="shell-navigator-hide"]'
- click: '[data-testid="shell-overview-trigger"]'
- assert_attribute:
    selector: '[data-testid="shell-overview"]'
    name: aria-modal
    equals: 'true'
- assert_element_geometry:
    selector: '[data-testid="shell-overview"]'
    min_width: 300
    min_height: 160
    within_viewport: true
    hit_center: true
- assert_element_geometry:
    selector: '[data-testid="shell-tab-navigator-close"]'
    min_width: 16
    min_height: 16
    within_viewport: true
    hit_center: true
- click: '[data-testid="shell-tab-navigator-close"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- assert_visible: '[data-testid="notes-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- assert_not_visible: '[data-testid="notes-panel"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - alpha
    - beta
    - gamma
    - ''
- eval_readonly:
    expression: document.documentElement.scrollWidth <= innerWidth
    expect_truthy: true
- screenshot: tc-shell-n16-800x600.png

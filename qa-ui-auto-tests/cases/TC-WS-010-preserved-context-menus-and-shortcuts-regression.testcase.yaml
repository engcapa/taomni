- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- right_click: '[data-testid="session-tree-item"][data-session-name="prod-api-01"]'
- wait_for: '[data-testid="context-menu"]'
- assert_text:

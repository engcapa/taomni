id: TC-WS-010
title: Context menus and import/export stay complete across the redesigned shell
description: v6.1 AC-10 regression. The app main menu keeps its entries (new local terminal, new remote session, new SFTP, Sessions import/export submenus,
  View, Tools, Settings, Help, Exit); the primary rail keeps Show Tool Window Names; the session tree, tab strip and workspace file tree keep their full
  context menus (connect/edit/duplicate/move/delete, close variants, copy path, new file/directory, add/remove root).
modes:
- browser
- native
covers:
- F1.2
- F1.4
- F1.8
- F25.5
tags:
- p0
- workspace-redesign
- right-menu
- regression
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-010
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:

- assert_visible: '[data-testid="context-menu-item-tools"]'
- assert_visible: '[data-testid="context-menu-item-settings"]'
- assert_visible: '[data-testid="context-menu-item-help"]'
- assert_visible: '[data-testid="context-menu-item-exit"]'
- hover: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="menu-import-sessions"]'
- assert_visible: '[data-testid="menu-export-sessions"]'
- press: Escape
- right_click: '[data-testid="sidebar-rail"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'

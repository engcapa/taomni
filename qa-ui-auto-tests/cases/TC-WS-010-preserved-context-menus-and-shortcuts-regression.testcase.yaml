id: TC-WS-010
title: Preserved context menus and import or export entries regression
description: Workspace-first platform redesign AC-10 regression sweep. The app main menu keeps every entry including the Sessions import/export submenus, the rail context menu toggles Show Tool Window Names, the tab context menu keeps its management entries, and the Tools sidebar still lists every tool entry.
covers:
- F1.2
- F1.4
- F1.8
- F25.5
tags:
- workspace-platform
- regression
- menus
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":false,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="app-main-menu"]'
- assert_visible: '[data-testid="context-menu-item-new-local-terminal"]'
- assert_visible: '[data-testid="context-menu-item-new-remote-session"]'
- assert_visible: '[data-testid="context-menu-item-new-sftp"]'
- assert_visible: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="context-menu-item-view"]'
- assert_visible: '[data-testid="context-menu-item-tools"]'
- assert_visible: '[data-testid="context-menu-item-settings"]'
- assert_visible: '[data-testid="context-menu-item-help"]'
- assert_visible: '[data-testid="context-menu-item-exit"]'
- hover: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="menu-import-sessions"]'
- assert_visible: '[data-testid="menu-export-sessions"]'
- hover: '[data-testid="menu-import-sessions"]'
- assert_visible: '[data-testid="import-json"]'
- assert_visible: '[data-testid="import-openssh"]'
- press: Escape
- right_click: '[data-testid="sidebar-rail"]'
- assert_visible: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_text_equals:
    selector: '[data-testid="sidebar-rail"] [data-testid="side-tab-sessions"]'
    equals: Sessions
- right_click: '[data-testid="sidebar-rail"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- right_click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait_for: '[data-testid="context-menu"]'
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Close
- assert_visible: '[data-testid="tab-context-copy-session-info"]'
- press: Escape
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- assert_visible: '[data-testid="sidebar-tool-code-workspace"]'
- assert_visible: '[data-testid="sidebar-tool-mfa"]'
- assert_visible: '[data-testid="sidebar-tool-git"]'
- screenshot: tc-ws-010-context-menus.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: app-main-menu 保留全部菜单项，Sessions 子菜单保留导入/导出入口与导入子项（完整导出流由 TC-054 覆盖）。
    actions:
    - 5
    - 15
    checkpoints:
    - step: 6
      expectation: '{"assert_visible": "[data-testid=\"context-menu-item-new-local-terminal\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"context-menu-item-sessions\"]"}'
    - step: 16
      expectation: '{"assert_visible": "[data-testid=\"menu-import-sessions\"]"}'
    - step: 17
      expectation: '{"assert_visible": "[data-testid=\"menu-export-sessions\"]"}'
    - step: 19
      expectation: '{"assert_visible": "[data-testid=\"import-json\"]"}'
    results:
    - 6
    - 9
    - 16
    - 17
    - 19
  - id: R2
    requirement: 左侧主导航条右键 Show Tool Window Names 双向切换并显示按钮文字。
    actions:
    - 22
    - 24
    checkpoints:
    - step: 23
      expectation: '{"assert_visible": "[data-testid=\"sidebar-rail-menu-show-names\"]"}'
    - step: 25
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"sidebar-rail\"] [data-testid=\"side-tab-sessions\"]", "equals": "Sessions"}}'
    results:
    - 23
    - 25
  - id: R3
    requirement: TabBar 标签右键菜单保留关闭等管理项；Tools 面板保留全部工具入口。
    actions:
    - 28
    - 33
    checkpoints:
    - step: 29
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 30
      expectation: '{"assert_text": {"selector": "[data-testid=\"context-menu\"]", "contains": "Close"}}'
    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"tab-context-copy-session-info\"]"}'
    - step: 34
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 35
      expectation: '{"assert_visible": "[data-testid=\"sidebar-tool-code-workspace\"]"}'
    - step: 36
      expectation: '{"assert_visible": "[data-testid=\"sidebar-tool-mfa\"]"}'
    results:
    - 29
    - 30
    - 31
    - 34
    - 35
    - 36
  visual:
  - check: 检查截图各菜单展开态、层级与高亮无异常。
    method: manual
    reason: 像素布局与遮挡需要截图人工评审。
  native:
  - check: 原生 WebView 中按相同步骤执行；SessionTree 与工作区文件树右键由 TC-013/TC-IDE 系列覆盖。
    method: automated
    reason: browser 证据不替代 native，未执行平台不计作通过。

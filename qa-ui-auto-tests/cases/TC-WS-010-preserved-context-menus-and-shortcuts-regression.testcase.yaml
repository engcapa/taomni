    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default Workspace (默认工作区)","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"qa-root","path":"${fixture.platform_workspace_root}","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu-item-new-local-terminal"]'
- assert_visible: '[data-testid="context-menu-item-new-remote-session"]'
- assert_visible: '[data-testid="context-menu-item-new-sftp"]'
- assert_visible: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="context-menu-item-view"]'
- assert_visible: '[data-testid="context-menu-item-tools"]'
- assert_visible: '[data-testid="context-menu-item-settings"]'
- assert_visible: '[data-testid="context-menu-item-help"]'
- assert_visible: '[data-testid="context-menu-item-exit"]'
- hover: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="menu-import-sessions"]'
- assert_visible: '[data-testid="menu-export-sessions"]'
- press: Escape
- right_click: '[data-testid="sidebar-rail"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- right_click: '[data-testid="sidebar-rail"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- right_click: '[data-testid="session-tree-item"][data-session-name="prod-api-01"]'
- wait_for: '[data-testid="context-menu"]'
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Connect
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Edit
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Duplicate
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Move to folder
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Delete
- press: Escape
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- right_click: '[data-testid="tab-bar"] [data-testid="tab-item"]'
- wait_for: '[data-testid="context-menu"]'
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Close others
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Close all
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Duplicate tab
- press: Escape
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-tree-root"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- right_click: '[data-testid="code-workspace-tree-root"]'
- wait_for: '[data-testid="context-menu"]'
- assert_menu_items:
  - New File...
- assert_menu_items:
  - New Directory...
- assert_menu_items:
  - Open in Terminal
- assert_menu_items:
  - Rename Root...
- assert_menu_items:
  - Remove from Workspace
- assert_menu_items:
  - Copy Path
- assert_menu_items:
  - Remove from Workspace
- press: Escape
- assert_not_visible: '[data-testid="context-menu"]'
- screenshot: ws-010-preserved-context-menus.png

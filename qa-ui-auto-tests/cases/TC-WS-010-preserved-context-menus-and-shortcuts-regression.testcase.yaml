    selector: '[data-testid="context-menu"]'
    contains: Close all
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Duplicate tab
- press: Escape
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-file-tree"]'
- click: '[data-testid="workspace-tree-root"]'
- wait_for: '[data-testid="workspace-tree-file"]'

id: TC-WS-010
title: Context menus and import/export stay complete across the redesigned shell
description: v6.1 AC-10 regression. The app main menu keeps its entries (new local terminal, new remote session, new SFTP, Sessions import/export submenus, View,
  Tools, Settings, Help, Exit); the primary rail keeps Show Tool Window Names; the session tree, tab strip and workspace file tree keep their full context menus (connect/edit/duplicate/move/delete,
  close variants, copy path, new file/directory, add/remove root).
modes:
- browser
- native
covers:
- F1.2
- F1.4
- F1.8
- F25.5
tags:
- p0
- workspace-redesign
- right-menu
- regression
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-010
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.sessions.v1
    value: '[{"id":"ws-qa-ssh","name":"prod-api-01","session_type":"SSH","group_path":null,"host":"10.9.0.1","port":22,"username":"root","auth_method":"None","options_json":"{}","created_at":1,"updated_at":1,"last_connected_at":null,"sort_order":0}]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default Workspace (默认工作区)","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"qa-root","path":"${fixture.platform_workspace_root}","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="app-main-menu"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu-item-new-local-terminal"]'
- assert_visible: '[data-testid="context-menu-item-new-remote-session"]'
- assert_visible: '[data-testid="context-menu-item-new-sftp"]'
- assert_visible: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="context-menu-item-view"]'
- assert_visible: '[data-testid="context-menu-item-tools"]'
- assert_visible: '[data-testid="context-menu-item-settings"]'
- assert_visible: '[data-testid="context-menu-item-help"]'
- assert_visible: '[data-testid="context-menu-item-exit"]'
- hover: '[data-testid="context-menu-item-sessions"]'
- assert_visible: '[data-testid="menu-import-sessions"]'
- assert_visible: '[data-testid="menu-export-sessions"]'
- press: Escape
- right_click: '[data-testid="expanded-sidebar-panel"] [data-testid="sidebar-rail"]'
- wait_for: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- right_click: '[data-testid="expanded-sidebar-panel"] [data-testid="sidebar-rail"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- right_click: '[data-testid="sessions-sidebar-panel"] >> text="prod-api-01"'
- wait_for: '[data-testid="context-menu"]'
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Connect
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Edit
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Duplicate
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Move to folder
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Delete
- press: Escape
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- right_click: '[data-testid="tab-bar"] [data-testid="tab-item"]'
- wait_for: '[data-testid="context-menu"]'
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Close others
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Close to the right
- assert_text:
    selector: '[data-testid="context-menu"]'
    contains: Duplicate tab
- press: Escape
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-file-tree"]'
- click: '[data-testid="workspace-tree-root"]'
- wait_for: '[data-testid="workspace-tree-file"]'
- right_click: '[data-testid="workspace-tree-root"]'
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="workspace-tree-new-file"]'
- assert_visible: '[data-testid="workspace-tree-new-folder"]'
- assert_visible: '[data-testid="workspace-tree-add-root"]'
- assert_visible: '[data-testid="workspace-tree-rename"]'
- assert_visible: '[data-testid="workspace-tree-delete"]'
- assert_visible: '[data-testid="workspace-tree-copy-path"]'
- assert_visible: '[data-testid="workspace-tree-remove-root"]'
- press: Escape
- screenshot: ws-010-preserved-context-menus.png

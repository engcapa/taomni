- assert_visible: '[data-testid="workspace-tree-copy-path"]'
- assert_visible: '[data-testid="workspace-tree-remove-root"]'
- press: Escape
- assert_not_visible: '[data-testid="context-menu"]'
- screenshot: ws-010-preserved-context-menus.png

id: TC-FILE-OPEN-028
title: 'Reported testing.md: Live table formatting, Word line bodies, editable sequence and PDF (native)'
description: Use the exact 4510-byte user document (SHA c669a35a1cc8ec37aba798b496fa5b6c8c6405118079482bcaec03ee4c27f900).
  Local native can open the original path via TAOMNI_QA_MARKDOWN_SOURCE_FILE; hosted uses the identical committed
  source. Preserve source hash, render Live bold cells, export both diagram vectors and 600DPI fallbacks, reject
  Office-invisible solid dash patterns, require measured CJK glyph positions and independently check draw.io legacy anchors. Native exercises packaged
  WebView, real save chooser and disk bytes.
modes:
- native
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p0
- markdown
- drawio
- regression
fixtures:
- reset_db
- markdown_testing
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-reported-markdown
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.markdown_testing_directory}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="${fixture.markdown_testing_filename}"]'
- wait_for: '[data-testid="markdown-editor"]'
- click: '[data-testid="markdown-outline"] button:last-child'
- wait_for: '[data-testid="markdown-table-widget"] strong'
- click: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="0"]'
- assert_text:
    selector: '[data-testid="markdown-table-widget"]'
    contains: 死循环防护
- eval_readonly:
    expression: document.querySelectorAll(".fv-md-table-wrap strong").length === 3 && document.querySelectorAll(".fv-md-table-wrap
      strong")[0].textContent === "死循环防护" && document.querySelectorAll(".fv-md-table-wrap strong")[1].textContent
      === "人机协同 (HITL)" && document.querySelectorAll(".fv-md-table-wrap strong")[2].textContent === "幂等性控制"
    expect_truthy: true
- screenshot: reported-markdown-live-table.png
- click: '[data-testid="markdown-mode-source"]'
- assert_text:
    selector: '[data-testid="viewer-editor"] .cm-content'
    contains: '**死循环防护**'
- click: '[data-testid="markdown-mode-split"]'
- wait_for: '[data-testid="markdown-preview"] .fv-md-mermaid svg'
- assert_count:
    selector: '[data-testid="markdown-preview"] .fv-md-mermaid svg'
    equal: 2
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-pdf"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_testing_exports}/testing.pdf
    trigger: '[data-testid="markdown-export-confirm"]'
- wait_for:
    selector: '[data-testid="markdown-export-status"][data-export-state="saved"]'
    timeout_sec: 90
- assert_export_quality:
    path: ${fixture.markdown_testing_exports}/testing.pdf
    kind: testing-pdf
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-docx"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_testing_exports}/testing.docx
    trigger: '[data-testid="markdown-export-confirm"]'
- wait_for:
    selector: '[data-testid="markdown-export-status"][data-export-state="saved"]'
    timeout_sec: 90
- assert_export_quality:
    path: ${fixture.markdown_testing_exports}/testing.docx
    kind: testing-docx
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-drawio"]'
- wait_for: '[data-testid="markdown-drawio-export-settings"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_testing_exports}/testing.drawio
    trigger: '[data-testid="markdown-drawio-save"]'
- wait_for: '[data-testid="markdown-export-status"][data-export-state="saved"]'
- assert_export_quality:
    path: ${fixture.markdown_testing_exports}/testing.drawio
    kind: drawio
- eval_readonly:
    expression: /(?:2.*editable diagrams|2.*可编辑图表).*0.*SVG/.test(document.querySelector(".fv-md-export-notice").textContent)
    expect_truthy: true
- assert_no_runtime_errors: null
- screenshot: reported-markdown-export-complete.png

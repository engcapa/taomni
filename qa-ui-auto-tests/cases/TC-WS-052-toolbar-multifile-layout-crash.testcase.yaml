  mode uses the same renderer workflow. No layout or resizable-panel mocks. File-open migration: this IDE pane/layout lifecycle regression explicitly associates
  .md/.txt with Code Workspace. New viewer defaults are tested separately by TC-FILE-OPEN-001..006; all original pane/content/PTY/save assertions are retained.'

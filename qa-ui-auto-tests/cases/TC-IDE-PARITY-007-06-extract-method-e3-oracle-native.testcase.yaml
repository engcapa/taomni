verification:
  review: reviewed
  requirements:
  - id: ED-PARITY-007-V4-4-e3
    requirement: 'The E3 side-effect sample keeps next(base) called exactly once after the extraction and the rename: every fresh JVM prints exactly 13:1, including after undo and redo.'
    actions:
    - 12
    checkpoints:
    - step: 12
      expectation: The unmodified E3 sample prints exactly 13:1 with exit 0.
    - step: 37
      expectation: The default-name extraction prints exactly 13:1 (no double next(base) call).
    - step: 44
      expectation: After naming calculateTotal the program still prints exactly 13:1.
    - step: 49
      expectation: The first undo keeps the program printing 13:1.
    - step: 53
      expectation: The second undo restores the exact initial bytes and prints 13:1.
    - step: 60
      expectation: Redo restores the renamed method and prints 13:1.
    results:
    - 12
    - 37
    - 44
    - 49
    - 53
    - 60
  visual:
  - check: Real WebView rendering of the E3 extraction states.
    method: manual
    reason: Screenshots are recorded artifacts; pixel comparison is separate.
  native:
  - check: Real JDT LS edit on the side-effect sample plus javac/java semantics in a fresh JVM.
    method: automated
    reason: Only executing the program proves the single next(base) call.

id: TC-IDE-C6-01
title: Usages panel pin/rerun contract without provider
description: '§8.19.10 gate case C6 part 1 (contract portion). Capability ids:

  references.pin-rerun / usages.session. Show->Find Usages grouping,

  staleness and rename flows need the jdtls fixture (provider mode). The

  browser run verifies the References panel surfaces its empty/no-provider

  contract and exposes pin/rerun controls only for a real query session.

  Highest claim on green: L1 unavailable-contract only.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c6
- usages
- unavailable-contract
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- assert_visible: '[data-testid="code-workspace-editor-tab-strip"]'
- click: '[data-testid="code-workspace-bottom-tab-analysis"]'
- wait_for: '[data-testid="code-workspace-analysis-panel"]'
- screenshot: tc-ide-c6-usages-no-provider.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Usages panel pin/rerun contract without provider：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
    - 14
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor-pane\"]"}'
    - step: 13
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-editor-tab-strip\"]"}'
    - step: 15
      expectation: '{"wait_for": "[data-testid=\"code-workspace-analysis-panel\"]"}'
    results:
    - 15
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

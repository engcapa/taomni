id: TC-WS-048
title: Compact local launcher and workspace overflow navigation retain active tabs and window drag space
description: Creates twelve UI-owned workspace local terminal tabs. Verifies compact Sessions launch controls, reachable plus/menu, bidirectional overflow,
  Home/End activation and active visibility without closing tabs. Physical window movement is covered by TC-MAIN-RAIL-03. Return through Home and Sessions
  with all twelve tabs open; the restored active tab stays visible and both scroll controls still work without runtime errors.
modes:
- browser
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-3
- F1.5
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-tabs

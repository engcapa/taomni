id: TC-WS-048
title: Compact local launcher and workspace overflow navigation retain active tabs and window drag space
description: Creates twelve UI-owned workspace local terminal tabs. Verifies compact Sessions launch controls, reachable plus/menu, bidirectional overflow,
  Home/End activation and active visibility without closing tabs. Physical window movement is covered by TC-MAIN-RAIL-03. Return through Home and Sessions
  with all twelve tabs open; the restored active tab stays visible and both scroll controls still work without runtime errors. Wait for the rendered disabled-edge
  control before inspecting scroll geometry; hidden terminal panes must not be used as the restored active-pane readiness target. Home/End must keep the
  active endpoint tab focused through delayed terminal activation; repeat after hidden-mode restoration while retaining pointer scrolling. After Home/Sessions
  restoration, await the unchanged 1px active-tab containment condition for at most 1.5s and retain both initial and settled rectangles; a disabled arrow
  can still carry the previous hidden layout before ResizeObserver has measured the restored strip. Wait up to 1.5s for restored overflow controls to settle
  before asserting the same disabled edge.
modes:
- browser
- native
covers:
- F-WS-1
- F-WS-2
- F-WS-3
- F1.5
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
timeout_sec: 300

id: TC-044
title: SFTP remote pane manual Sync button
covers:
- F3.3
- F7.2
tags:
- legacy-imported
- p1
- sftp
- sync
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="terminal-pane"]'
- wait: 1
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: cd '${fixture.sftp_shell_test_dir}' && printf '\nQA_CWD_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_CWD_READY\r?$
- wait: 1
- click: '[data-testid="sftp-browser"] >> button[title*="sync the remote pane"]'
- wait: 1
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${fixture.sftp_shell_test_dir}
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- screenshot: 044-sftp-manual-sync.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: SFTP remote pane manual Sync button：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 4
    - 6
    - 7
    - 9
    - 10
    - 13
    - 15
    - 17
    - 20
    - 22
    - 24
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"qc-input\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"sftp-browser\"]"}'
    - step: 18
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"]", "regex": "(?m)^QA_CWD_READY\\r?$"}}'
    - step: 23
      expectation: '{"assert_attribute": {"selector": "input[data-testid=\"sftp-remote-path\"]", "name": "value",
        "equals": "${fixture.sftp_shell_test_dir}"}}'
    - step: 25
      expectation: '{"assert_not_visible": "input[data-testid=\"sftp-remote-path\"]"}'
    results:
    - 25
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-BACKUP-CANCEL-002
title: Native cancellation interrupts OS lock waits and persisted requests do not replay
description: An external process-style file lock blocks the real snapshot worker. UI cancellation must persist and stop
  local/cloud jobs before publication; a later local backup must still succeed.
covers:
- F-BACKUP-1
- F-BACKUP-2
tags:
- backup
- settings
- p1
modes:
- native
fixtures:
- reset_db
- backup_cloud
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="ribbon-settings"]'
- wait_for:
    selector: '[data-testid="settings-panel"]'
    timeout_sec: 30
- click: '[data-testid="settings-group-toggle-general"]'
- wait_for: '[data-testid="settings-language-en"]'
- click: '[data-testid="settings-language-en"]'
- assert_attribute:
    selector: html
    name: lang
    equals: en
- click: '[data-testid="settings-group-toggle-general"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for:
    selector: '[data-testid="backup-global-categories"]'
    timeout_sec: 30
- assert_file_contains:
    path: ${fixture.backup_recovered_journal}
    contains: '"phase": "cancelled"'
    timeout_sec: 30
- assert_file_contains:
    path: ${fixture.backup_recovered_journal}
    contains: '"cancelRequested": true'
    timeout_sec: 30
- host_write_file:
    path: ${fixture.backup_snapshot_control}
    text: hold-local
- assert_file_contains:
    path: ${fixture.backup_snapshot_events}
    contains: hold-local=locked
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="backup-selected-start"]:not([disabled])'
    timeout_sec: 30
- click: '[data-testid="backup-selected-start"]'
- wait_for:
    selector: '[data-testid="backup-cloud-job"][data-operation="local"][data-phase="preparing"]'
    timeout_sec: 30
- click: '[data-testid="backup-cloud-job"][data-operation="local"][data-phase="preparing"] [data-testid="backup-job-cancel"]'
- wait_for:
    selector: '[data-testid="backup-cloud-job"][data-operation="local"][data-phase="cancelled"]'
    timeout_sec: 10
- assert_file_contains:
    path: ${fixture.backup_snapshot_events}
    contains: cancelled:local:requested=true:artifact=false
    timeout_sec: 30
- host_write_file:
    path: ${fixture.backup_snapshot_control}
    text: release-local
- assert_file_contains:
    path: ${fixture.backup_snapshot_events}
    contains: release-local=released
    timeout_sec: 30
- set_check:
    selector: '[data-testid="backup-local-select"]'
    checked: false
- set_check:
    selector: '[data-testid="backup-destination-select"]'
    checked: true
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- host_write_file:
    path: ${fixture.backup_snapshot_control}
    text: hold-upload
- assert_file_contains:
    path: ${fixture.backup_snapshot_events}
    contains: hold-upload=locked
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="backup-selected-start"]:not([disabled])'
    timeout_sec: 30
- click: '[data-testid="backup-selected-start"]'
- wait_for:
    selector: '[data-testid="backup-cloud-job"][data-operation="upload"][data-phase="preparing"]'
    timeout_sec: 30
- click: '[data-testid="backup-cloud-job"][data-operation="upload"][data-phase="preparing"] [data-testid="backup-job-cancel"]'
- wait_for:
    selector: '[data-testid="backup-cloud-job"][data-operation="upload"][data-phase="cancelled"]'
    timeout_sec: 10
- assert_file_contains:
    path: ${fixture.backup_snapshot_events}
    contains: cancelled:upload:requested=true:artifact=false
    timeout_sec: 30
- host_write_file:
    path: ${fixture.backup_snapshot_control}
    text: release-upload
- assert_file_contains:
    path: ${fixture.backup_snapshot_events}
    contains: release-upload=released
    timeout_sec: 30
- set_check:
    selector: '[data-testid="backup-destination-select"]'
    checked: false
- set_check:
    selector: '[data-testid="backup-local-select"]'
    checked: true
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="backup-selected-start"]:not([disabled])'
    timeout_sec: 30
- click: '[data-testid="backup-selected-start"]'
- wait_for:
    selector: '[data-testid="backup-cloud-job"][data-operation="local"][data-phase="completed"]'
    timeout_sec: 60
- assert_file_contains:
    path: ${fixture.backup_snapshot_events}
    contains: local_completed:valid_archive=true
    timeout_sec: 30
- click: '[data-testid="settings-group-toggle-backup"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- assert_count:
    selector: '[data-testid="backup-cloud-job"][data-operation="local"][data-phase="cancelled"]'
    equal: 1
- click: '[data-testid="backup-local-restore"]'
- wait_for:
    selector: '[data-testid="backup-restore-files"]'
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="backup-restore-files"]'
    contains: databases/taomni.db
- click: '[data-testid="backup-restore-cancel"]'
- screenshot: backup-native-cancellation.png
verification:
  review: reviewed
  native:
  - check: Real isolated IPC, OS lock, journal and archive effects
    method: automated
    reason: Hosted native runs use disposable profiles and independent filesystem observations.
  requirements:
  - id: R1
    requirement: Startup completes a persisted cancellation instead of replaying preparation
    actions:
    - 10
    checkpoints:
    - step: 12
      expectation: Recovered journal cancelled
    - step: 13
      expectation: Cancellation intent retained
    results:
    - 12
    - 13
  - id: R2
    requirement: local cancellation interrupts real OS lock waiting before publication
    actions:
    - 14
    - 17
    - 19
    checkpoints:
    - step: 15
      expectation: External OS lock acquired
    - step: 18
      expectation: Production job waits for lock
    - step: 20
      expectation: Cancellation finishes within ten seconds
    - step: 21
      expectation: No completed artifact and durable cancellation
    results:
    - 15
    - 18
    - 20
    - 21
  - id: R3
    requirement: upload cancellation interrupts real OS lock waiting before publication
    actions:
    - 27
    - 30
    - 32
    checkpoints:
    - step: 28
      expectation: External OS lock acquired
    - step: 31
      expectation: Production job waits for lock
    - step: 33
      expectation: Cancellation finishes within ten seconds
    - step: 34
      expectation: No completed artifact and durable cancellation
    results:
    - 28
    - 31
    - 33
    - 34
  - id: R4
    requirement: A fresh local backup works after cancellation and old jobs stay cancelled
    actions:
    - 41
    - 45
    - 47
    checkpoints:
    - step: 42
      expectation: Fresh backup completed
    - step: 43
      expectation: Independent ZIP reader accepts output
    - step: 46
      expectation: Cancelled task not replayed
    - step: 49
      expectation: Local completed archive opens a valid restore preview
    results:
    - 42
    - 43
    - 46
    - 49
  visual:
  - check: Category and task controls remain readable in retained screenshots
    method: manual
    reason: Review screenshots from the hosted workflow; filesystem assertions establish native effects.

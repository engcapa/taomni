id: TC-IDE-C6-04
title: "Real JDT LS two-file rename preview cancellation, apply and undo"
description: |
  ED-AUDIT-014 normal transaction evidence. Use a compilable isolated Maven
  project, navigate to signatureTargets, cancel a real two-file preview and
  verify both preimage hashes, then apply and undo the same rename through
  production UI. Independently read both host files after each operation.
  Conflict/recovery failures have separate focused and restart-recovery cases.
covers: [F25.5]
tags: [code-workspace, ide-c6, rename, provider-fixture, p1]
modes: [native]
fixtures: [reset_db, java_rename_project, jdtls_required]
timeout_sec: 600
steps:
  - open: "${cfg.app.base_url}"
  - vault_first_run: "qa-native-gate-password"
  - wait_for: '[data-testid="welcome-panel"]'
  # Enter the real sample project through persisted recents; WebDriver cannot
  # operate the native folder picker opened by Add Folder to Workspace.
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-c6-04","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/App.java"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_text:
      selector: '[data-testid="code-workspace-editor"]'
      contains: "public static void main"
      timeout_sec: 60
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - assert_text:
      selector: '[data-testid="code-workspace-lsp-status-pill"]'
      contains: Java
      timeout_sec: 60
  - press: Control+g
  - fill:
      selector: 'input[name="line"]'
      value: '${fixture.rename_caret}'
  - click: '.cm-dialog button[type="submit"]'
  - assert_not_visible: 'input[name="line"]'
  - assert_text:
      selector: '[data-testid="status-bar-workspace-cursor"]'
      contains: '${fixture.rename_cursor_status}'
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] button[role="tab"]:nth-of-type(5)'
  - fill:
      selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
      value: Rename Symbol
  - assert_text:
      selector: '[data-testid="code-workspace-search-everywhere"] [data-index="0"]'
      contains: Rename Symbol
  - press: Enter
  - wait_for:
      selector: '[data-testid="text-input-dialog-input"]'
      timeout_sec: 120
  - fill:
      selector: '[data-testid="text-input-dialog-input"]'
      value: executeWorkflow
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for:
      selector: '[data-testid="refactoring-preview-dialog"]'
      timeout_sec: 120
  - assert_text:
      selector: '[data-testid="refactoring-preview-dialog"]'
      contains: AppTest.java
  - click: '[data-testid="refactoring-preview-cancel"]'
  - assert_file_sha256:
      path: '${fixture.rename_app_file}'
      equals: '${fixture.rename_app_pre_hash}'
  - assert_file_sha256:
      path: '${fixture.rename_test_file}'
      equals: '${fixture.rename_test_pre_hash}'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Control+g
  - fill:
      selector: 'input[name="line"]'
      value: '${fixture.rename_caret}'
  - click: '.cm-dialog button[type="submit"]'
  - assert_not_visible: 'input[name="line"]'
  - assert_text:
      selector: '[data-testid="status-bar-workspace-cursor"]'
      contains: '${fixture.rename_cursor_status}'
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] button[role="tab"]:nth-of-type(5)'
  - fill:
      selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
      value: Rename Symbol
  - assert_text:
      selector: '[data-testid="code-workspace-search-everywhere"] [data-index="0"]'
      contains: Rename Symbol
  - press: Enter
  - wait_for:
      selector: '[data-testid="text-input-dialog-input"]'
      timeout_sec: 120
  - fill:
      selector: '[data-testid="text-input-dialog-input"]'
      value: executeWorkflow
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for:
      selector: '[data-testid="refactoring-preview-dialog"]'
      timeout_sec: 120
  - assert_text:
      selector: '[data-testid="refactoring-preview-dialog"]'
      contains: AppTest.java
  - click: '[data-testid="refactoring-preview-apply"]'
  - assert_file_sha256:
      path: '${fixture.rename_app_file}'
      equals: '${fixture.rename_app_post_hash}'
  - assert_file_sha256:
      path: '${fixture.rename_test_file}'
      equals: '${fixture.rename_test_post_hash}'
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: executeWorkflow
  - press:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      key: Control+z
  - assert_file_sha256:
      path: '${fixture.rename_app_file}'
      equals: '${fixture.rename_app_pre_hash}'
  - assert_file_sha256:
      path: '${fixture.rename_test_file}'
      equals: '${fixture.rename_test_pre_hash}'
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: signatureTargets
  - screenshot: tc-ide-c6b-after-undo.png

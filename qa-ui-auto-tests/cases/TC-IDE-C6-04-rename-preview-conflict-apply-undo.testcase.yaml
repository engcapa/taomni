id: TC-IDE-C6-04
title: Rename preview conflict/apply/undo under jdtls
description: "§8.19.10 gate case C6-04. Capability ids: rename.preview-conflict /\nsemantic.workspace-edit-undo.\
  \ Required mode: PROVIDER FIXTURE — rename\nconflict detection and cross-file WorkspaceEdit apply need jdtls.\n\
  Browser runs must report environment-blocked, never passed. Highest\nclaim on green: L2 provider-backed (Linux).\n\
  \nTwo segments over QuickFixTarget.java (syntax-clean; only an\nunresolved-type diagnostic, so the provider answers\
  \ real edits):\n\nA. Preview conflict: caret on `blank` (line 13, zero-based drag column\n   20, cursor postcondition\
  \ authoritative), one typed space dirties the\n   buffer, Shift+F6 -> Rename prompt -> confirm. The plan gate\
  \ blocks on\n   the unsaved-buffer error conflict: status names \"Rename blocked\" and\n   \"unsaved buffer edits\"\
  , the prompt closes, zero bytes are written\n   (disk hash asserted unchanged at the end of segment B).\nB. Preview\
  \ apply/undo with a file move: buffer cleaned deterministically\n   (drag + Backspace + save + pristine-sha proof,\
  \ which also re-syncs the\n   buffer — a buffer-level undo alone leaves a documentRevision/LSP\n   revision skew\
  \ that reports the same refusal), caret dragged to the\n   class name (line 9, zero-based column 13), Shift+F6\
  \ -> prompt prefill\n   pinned to \"QuickFixTarget\" -> fill \"Qa06Target\" (submission pinned via\n   DOM read,\
  \ distinguishing a silent default-submit early return from a\n   downstream stall) -> confirm. The class rename\
  \ carries a file-move\n   operation, so the preview modal opens: the case asserts the preview\n   dialog, the\
  \ new name, and the resource-operation count, applies, and\n   proves the moved file on disk. One shared undo\
  \ then reverses the whole\n   transaction (text + move-back through snapshot replay); a save proves\n   the disk\
  \ bytes equal the pristine fixture hash f2de5c8a.\n"

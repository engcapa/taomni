id: TC-WS-011
title: Developer agent opens from Home and command palette; global search remains usable
description: Replace the former Crew placeholder with the v0.6 developer conversation surface. Entry navigation must not create a task or call a model; global search still activates workspaces and tools.
modes: [browser, native]
covers: [F-WS-6, F-ORCH-1]
tags: [p0, workspace-redesign, regression, orchestration]
fixtures: [reset_db]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-011
- wait_for: '[data-testid="welcome-panel"]'
- assert_not_visible: '[data-testid="nav-mode-agents"]'
- click: '[data-testid="home-open-agents"]'
- wait_for: '[data-testid="orch-workspace"]'
- assert_visible: '[data-testid="orch-empty-state"]'
- assert_not_visible: '[data-testid="orch-plan"]'
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="global-search-trigger"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: agents
- click: '[data-testid="global-search-result"][data-result-id="mode-agents"]'
- wait_for: '[data-testid="orch-workspace"]'
- assert_not_visible: '[data-testid="global-search-modal"]'
- assert_not_visible: '[data-testid="orch-plan"]'
- press: Mod+k
- wait_for: '[data-testid="global-search-modal"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: mfa
- wait_for: '[data-testid="global-search-result"][data-result-id="floating-mfa"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: Default Workspace
- wait_for: '[data-testid="global-search-result"][data-kind="workspace"]'
- press: Enter
- wait_for: '[data-testid="workspace-switcher"]'
- assert_not_visible: '[data-testid="global-search-modal"]'
- press: Mod+k
- wait_for: '[data-testid="global-search-modal"]'
- press: Escape
- assert_not_visible: '[data-testid="global-search-modal"]'
- assert_no_runtime_errors: null
- screenshot: ws-011-developer-agent-and-global-search.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home and command-palette entries open the real empty developer workspace without creating tasks; retained
      rail behavior is unchanged.
    actions:
    - 5
    - 9
    - 11
    - 12
    - 13
    checkpoints:
    - step: 4
      expectation: No separate Agents primary rail mode appears.
    - step: 7
      expectation: Home entry opens the empty conversation.
    - step: 8
      expectation: Entry navigation creates no plan.
    - step: 14
      expectation: Command-palette action opens developer workspace.
    - step: 15
      expectation: Command palette closes after action.
    - step: 16
      expectation: Second entry still creates no plan.
    results:
    - 4
    - 7
    - 8
    - 14
    - 15
    - 16
  - id: R2
    requirement: Retained global search finds MFA and workspaces, activates the selected workspace with Enter and closes
      with Escape.
    actions:
    - 17
    - 19
    - 21
    - 23
    - 26
    - 28
    checkpoints:
    - step: 20
      expectation: MFA tool remains searchable.
    - step: 22
      expectation: Workspace result remains searchable.
    - step: 24
      expectation: Enter activates workspace UI.
    - step: 25
      expectation: Palette closes after activation.
    - step: 29
      expectation: Escape closes palette.
    - step: 30
      expectation: No runtime errors occurred.
    results:
    - 20
    - 22
    - 24
    - 25
    - 29
    - 30
  visual:
  - check: Approved v0.6 conversation-first layout and terminal-state screenshot
    method: manual
    reason: The authored screenshot is retained for review; selectors and static checks alone do not prove visual fidelity
      and no screenshot is claimed reviewed or executed.
  native:
  - check: Named native boundary and independent evidence
    method: automated
    reason: Native mode retains actual Tauri/WebView entry, keyboard and workspace activation coverage. It does not execute
      an API or worker; API/disk ledgers are asserted in the dedicated orchestration fixture cases.

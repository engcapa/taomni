id: TC-WS-011
title: Crew placeholder from Home and command palette; global search remains usable
description: Agents / Crew is deferred by product scope. Each supported entry shows the development notice without changing the active canvas or creating
  tasks. Global search still finds workspaces and tools, and executes selected entries.
modes:
- browser
- native
covers:
- F-WS-6
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-011
- wait_for: '[data-testid="welcome-panel"]'
- assert_not_visible: '[data-testid="nav-mode-agents"]'
- click: '[data-testid="home-open-agents"]'
- wait_for: '[data-testid="alert-dialog-message"]'
- assert_text:
    selector: '[data-testid="alert-dialog-message"]'
    contains: under development
- click: '[data-testid="alert-dialog-ok"]'
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="home-open-agents"]'
- wait_for: '[data-testid="alert-dialog-message"]'
- click: '[data-testid="alert-dialog-ok"]'
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="global-search-trigger"]'
- wait_for: '[data-testid="global-search-modal"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: agents
- click: '[data-testid="global-search-result"][data-result-id="mode-agents"]'
- wait_for: '[data-testid="alert-dialog-message"]'
- click: '[data-testid="alert-dialog-ok"]'
- assert_not_visible: '[data-testid="alert-dialog-message"]'
- press: Mod+k
- wait_for: '[data-testid="global-search-modal"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: mfa
- wait_for: '[data-testid="global-search-result"][data-result-id="floating-mfa"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: Default Workspace
- wait_for: '[data-testid="global-search-result"][data-kind="workspace"]'
- press: Enter
- wait_for: '[data-testid="workspace-switcher"]'
- assert_not_visible: '[data-testid="global-search-modal"]'
- press: Mod+k
- wait_for: '[data-testid="global-search-modal"]'
- press: Escape
- assert_not_visible: '[data-testid="global-search-modal"]'
- screenshot: ws-011-agents-placeholder-and-global-search.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home Crew and command-palette Agents display the development notice and preserve the canvas; global search can still activate workspaces
      and tools.

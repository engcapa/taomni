    - step: 27
      expectation: '{"wait_for": "[data-testid=\"global-search-result\"][data-kind=\"workspace\"]"}'
    - step: 29
      expectation: '{"wait_for": "[data-testid=\"workspace-switcher\"]"}'
    - step: 30
      expectation: '{"assert_not_visible": "[data-testid=\"global-search-modal\"]"}'
    - step: 32
      expectation: '{"wait_for": "[data-testid=\"global-search-modal\"]"}'
    - step: 34

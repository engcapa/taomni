id: TC-054
title: Session import and export JSON, CSV, and MobaXterm formats
covers:
- F6.6
tags:
- export
- import
- legacy-imported
- p1
- session
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- send_text_via_label:
    label_contains: Specify username
    checked: true
- wait: 0.5
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-export-source
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-export-source"]'
- seed_dialog:
    confirm: true
- right_click:
    selector: '[data-testid="session-tree"]'
    position:
      x: 16
      y: 16
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu"] >> text=/Export Taomni session/i'
- press: Escape
- right_click:
    selector: '[data-testid="session-tree"]'
    position:
      x: 16
      y: 16
- wait_for: '[data-testid="context-menu"]'
- assert_visible: '[data-testid="context-menu"] >> text=/Export MobaXterm session/i'
- press: Escape
- screenshot: 054-session-import-export.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Session import and export JSON, CSV, and MobaXterm formats：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 8
    - 9
    - 11
    - 12
    - 14
    - 15
    - 18
    - 19
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-export-source\"]"}'
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 17
      expectation: '{"assert_visible": "[data-testid=\"context-menu\"] >> text=/Export Taomni session/i"}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 21
      expectation: '{"assert_visible": "[data-testid=\"context-menu\"] >> text=/Export MobaXterm session/i"}'
    results:
    - 20
    - 21
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-023
title: Terminal saves buffer to file and toggles output recording
covers:
- F4.5
tags:
- export
- legacy-imported
- logging
- p1
- terminal
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- click: '[data-testid="terminal-pane"]'
- type: echo qa-buffer-export-line
- press: Enter
- wait: 1
- right_click:
    selector: '[data-testid="terminal-pane"]'
    position:
      x: 24
      y: 24
- wait_for: '[data-testid="context-menu"]'
- assert_visible: text="Save to file"
- assert_visible: text="Record terminal output to file"
- click: text="Record terminal output to file"
- wait: 1
- click: '[data-testid="terminal-pane"]'
- type: echo qa-recorded-line
- press: Enter
- wait: 1
- right_click:
    selector: '[data-testid="terminal-pane"]'
    position:
      x: 24
      y: 24
- wait_for: '[data-testid="context-menu"]'
- assert_visible: text="Stop recording terminal output"
- click: text="Stop recording terminal output"
- wait: 1
- assert_text:
    selector: '[data-testid="status-bar"]'
    contains: recorded
- screenshot: 023-terminal-output-recording.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Terminal saves buffer to file and toggles output recording：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 8
    - 12
    - 14
    - 15
    - 16
    - 18
    - 21
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 10
      expectation: '{"assert_visible": "text=\"Save to file\""}'
    - step: 11
      expectation: '{"assert_visible": "text=\"Record terminal output to file\""}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 20
      expectation: '{"assert_visible": "text=\"Stop recording terminal output\""}'
    - step: 23
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar\"]", "contains": "recorded"}}'
    results:
    - 23
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

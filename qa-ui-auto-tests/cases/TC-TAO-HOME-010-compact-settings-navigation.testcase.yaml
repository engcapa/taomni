id: TC-TAO-HOME-010
title: Compact Home settings navigation keeps the section heading below sticky search
description: >-
  Navigate through the actual no-key card, appearance button and Tao menu, then
  search the tall Tao settings section. Check the settled heading against the
  search input at desktop and compact sizes. Native TC-TAO-HOME-003 retains
  packaged Settings-tab and deep-link checks; this case owns renderer resizing.
modes: [browser]
covers: [F1.11, F11.1]
tags: [p1, tao-home, settings, regression]
fixtures: [reset_db]
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-tao-home-010
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- set_viewport: {width: 1366, height: 768}
- click: '[data-testid="tao-home-open-settings"]'
- wait_for: '[data-testid="tao-settings"]'
# A smooth scroll must finish before checking the final position.
- wait: 0.5
- eval_readonly:
    expression: document.getElementById('tao-settings-heading').getBoundingClientRect().top >= document.getElementById('settings-search-input').getBoundingClientRect().bottom + 12
    expect_truthy: true
- assert_element_geometry:
    selector: '#tao-settings-heading'
    min_width: 100
    min_height: 14
    viewport_margin: 0
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="settings"]'
    equal: 1
- screenshot: tao-settings-desktop.png
- click: '[data-testid="nav-mode-home"]'
- set_viewport: {width: 800, height: 600}
- click: '[data-testid="tao-home-appearance"]'
- wait_for: '#settings-theme-heading'
- wait: 0.5
- eval_readonly:
    expression: document.getElementById('settings-theme-heading').getBoundingClientRect().top >= document.getElementById('settings-search-input').getBoundingClientRect().bottom + 12
    expect_truthy: true
- assert_element_geometry:
    selector: '#settings-theme-heading'
    min_width: 100
    min_height: 14
    viewport_margin: 0
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-more"]'
- click: '[data-testid="tao-home-settings"]'
- wait_for: '[data-testid="tao-settings"]'
- wait: 0.5
- eval_readonly:
    expression: document.getElementById('tao-settings-heading').getBoundingClientRect().top >= document.getElementById('settings-search-input').getBoundingClientRect().bottom + 12
    expect_truthy: true
- assert_element_geometry:
    selector: '#tao-settings-heading'
    min_width: 100
    min_height: 14
    viewport_margin: 0
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="settings"]'
    equal: 1
- screenshot: tao-settings-compact.png
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: tao
- wait: 0.5
- eval_readonly:
    expression: document.getElementById('tao-settings-heading').getBoundingClientRect().top >= document.getElementById('settings-search-input').getBoundingClientRect().bottom + 12
    expect_truthy: true
- assert_element_geometry:
    selector: '#tao-settings-heading'
    min_width: 100
    min_height: 14
    viewport_margin: 0
- press:
    selector: '[data-testid="settings-search-input"]'
    key: Escape
- assert_attribute:
    selector: '[data-testid="settings-search-input"]'
    name: value
    equals: ''
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="settings"]'
    equal: 1
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: SETTINGS-ENTRY
    requirement: Public Home entry points reveal the correct section heading below search at 1366x768 and 800x600 while reusing a single Settings tab.
    actions: [5, 6, 13, 14, 15, 20, 21, 22]
    checkpoints:
    - {step: 9, expectation: No-key CTA reveals the Tao heading below the settled sticky search.}
    - {step: 10, expectation: The Tao heading lies inside the desktop viewport.}
    - {step: 11, expectation: Only one Settings tab exists.}
    - {step: 18, expectation: Appearance opens the application theme section below search.}
    - {step: 19, expectation: The theme heading lies inside the compact viewport.}
    - {step: 25, expectation: Tao menu navigation reveals its heading below search at compact size.}
    - {step: 26, expectation: The Tao heading lies inside the compact viewport.}
    - {step: 27, expectation: Repeated navigation reuses the same single Settings tab.}
    results: [9, 10, 11, 18, 19, 25, 26, 27]
  - id: SETTINGS-SEARCH
    requirement: Searching a tall section preserves its heading and Escape clears the search without duplicating tabs or raising runtime errors.
    actions: [29, 33]
    checkpoints:
    - {step: 31, expectation: Settled search leaves the Tao heading below the toolbar.}
    - {step: 32, expectation: Search leaves the heading inside the viewport.}
    - {step: 34, expectation: Escape clears the query.}
    - {step: 35, expectation: The Settings tab remains unique.}
    - {step: 36, expectation: No runtime errors occurred through entry and search transitions.}
    results: [31, 32, 34, 35, 36]
  visual:
  - check: Settled headings clear the sticky toolbar at desktop and compact sizes
    method: automated
    reason: Independent heading/search DOM rectangles and viewport bounds verify actual final layout; screenshots retain both sizes.
  native:
  - check: Native scrolling and public Settings entry routing
    method: not-applicable
    reason: TC-TAO-HOME-003 retains packaged WebView deep-link geometry and tab checks. This renderer case owns explicit viewport resizing, with no native IPC or OS input assertion.

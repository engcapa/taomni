id: TC-SHELL-B04
title: Workset restore preserves successful owners through partial failure, cancel and retry
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b04.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.6
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
- parity008_git
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="shell-rail-home"]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: '[data-testid="welcome-restore-last-session"]'
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="shell-rail-home"]'
- assert_attribute:
    selector: '[data-testid="welcome-restore-status"]'
    name: data-state
    equals: succeeded
- assert_count:
    selector: '[data-testid="shell-restore-entry"]'
    equal: 1
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"]'
    equal: 1
- screenshot: tc-shell-b04.png
- seed_storage:
    key: taomni.shellLayout.v2
    value: '{"version": 2, "restoreSources": {"workspace:mixed-A": {"kind": "workspace", "workspaceInstanceId":
      "mixed-A", "workspace": {"repoRoot": "/preview/parity008", "workspaceId": "mixed-A", "name": "mixed-A",
      "roots": [{"id": "mixed-A", "name": "mixed-A", "path": "/preview/parity008", "kind": "folder"}],
      "looseFiles": []}}, "workspace:mixed-B": {"kind": "workspace", "workspaceInstanceId": "mixed-B",
      "workspace": {"repoRoot": "/preview/parity008/repo-b", "workspaceId": "mixed-B", "name": "mixed-B",
      "roots": [{"id": "mixed-B", "name": "mixed-B", "path": "/preview/parity008/repo-b", "kind": "folder"}],
      "looseFiles": []}}}, "restoredTabs": {"workspace:mixed-A": {"order": 0}, "workspace:mixed-B": {"order":
      1}}}'
- seed_storage:
    key: taomni.welcome.sessionResumeCleared.v1
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- shell_backend_scenario:
    action: fail-next
    command: workspace_list_dir
    owner: /preview/parity008/repo-b
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
- click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="welcome-restore-status"][data-state="partial"]'
- assert_count:
    selector: '[data-testid="shell-restore-entry"][data-status="ready"]'
    equal: 1
- assert_count:
    selector: '[data-testid="shell-restore-entry"][data-status="failed"]'
    equal: 1
- assert_text:
    selector: '[data-testid="shell-restore-entry"][data-entry-id="workspace:mixed-B"]'
    contains: QA fixture rejected workspace_list_dir
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"]'
    equal: 1
- click: '[data-testid="shell-tab-navigator-close"]'
- shell_backend_scenario:
    action: hold
    command: workspace_list_dir
    owner: /preview/parity008/repo-b
    once: true
- click: '[data-testid="welcome-restore-retry"]'
- assert_shell_backend:
    command: workspace_list_dir
    owner: /preview/parity008/repo-b
    status: held
    count: 1
- click: '[data-testid="welcome-restore-cancel"]'
- shell_backend_scenario:
    action: release
- wait_for: '[data-testid="welcome-restore-status"][data-state="partial"]'
- assert_count:
    selector: '[data-testid="shell-restore-entry"][data-status="ready"]'
    equal: 1
- assert_count:
    selector: '[data-testid="shell-restore-entry"][data-status="cancelled"]'
    equal: 1
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"]'
    equal: 1
- click: '[data-testid="shell-tab-navigator-close"]'
- click: '[data-testid="welcome-restore-retry"]'
- click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="welcome-restore-status"][data-state="succeeded"]'
- assert_items:
    selector: '[data-testid="shell-restore-entry"]'
    attribute: data-entry-id
    equals:
    - workspace:mixed-A
    - workspace:mixed-B
- assert_count:
    selector: '[data-testid="shell-restore-entry"][data-status="ready"]'
    equal: 2
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"]'
    equal: 2
- assert_count:
    selector: '[data-testid="shell-tab-card"]:has-text("mixed-A")'
    equal: 1
- assert_count:
    selector: '[data-testid="shell-tab-card"]:has-text("mixed-B")'
    equal: 1
- screenshot: tc-shell-b04-mixed-retry.png

    - step: 8
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"welcome-restore-last-session\"]"}'
    results:
    - 5
    - 8
    - 9

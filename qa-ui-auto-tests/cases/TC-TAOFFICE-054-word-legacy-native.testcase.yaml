verification:
  review: reviewed
  requirements:
  - id: R1
    ui_standard: [UI-FND-07a]
    requirement: The converted document explains its layout limits while the original content is still visible.
    actions: [18]
    checkpoints:
    - {step: 19, expectation: The converted preview is visible.}
    - {step: 20, expectation: "Original body, table and follow-up remain visible."}
    - {step: 21, expectation: The layout limits are visible.}
    results: [19, 20, 21]
  - id: R2
    ui_standard: [UI-FOC-02, UI-BTN-03, UI-BTN-05]
    requirement: The editor manages keyboard focus and enables the explicit DOCX copy operation after an edit.
    actions: [24, 28]
    checkpoints:
    - {step: 22, expectation: The button identifies the DOCX copy.}
    - {step: 23, expectation: The save action starts disabled.}
    - {step: 25, expectation: The first paragraph is focused.}
    - {step: 29, expectation: Escape returns focus to Edit paragraphs.}
    results: [22, 23, 25, 29]
  - id: R3
    ui_standard: [UI-BTN-04]
    requirement: Cancelling the native chooser restores the Save DOCX copy action and keeps the draft.
    actions: [31]
    checkpoints:
    - {step: 32, expectation: Save DOCX copy becomes available again.}
    - {step: 33, expectation: The document still has the original draft.}
    results: [32, 33]
  - id: R4
    ui_standard: [UI-KEY-06]
    requirement: Enter on the archive member opens its temporary file in the signed Word module read-only.
    actions: [104]
    checkpoints:
    - {step: 106, expectation: The temporary document displays the read-only notice.}
    - {step: 107, expectation: The preview shows the selected member's text and table.}
    - {step: 108, expectation: The active document has no paragraph editing action.}
    - {step: 109, expectation: The active document has no save action.}
    results: [106, 107, 108, 109]
  visual:
  - {check: Document preview, method: automated, reason: Assertions inspect visible layout guidance and page content.}
  native:
  - {check: Native chooser with signed module, method: automated, reason: Cancels and retries real save operations and reopens copies from disk.}

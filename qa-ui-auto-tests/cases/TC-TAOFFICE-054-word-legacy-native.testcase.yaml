    timeout_sec: 20
- assert_count: {selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-word-conversion"]', equal: 0}
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'

id: TC-TAOFFICE-034
title: Save and reopen annotated and rotated PDF pages in the signed desktop module
description: Write an edited PDF through the system dialog and verify the surviving page, intrinsic rotation and saved note after reopening from disk.
modes: [native]
covers: [F-FILEOPEN-1, F-Modules-1]
tags: [p0, file-open, taoffice, taoffice-pdf, native-boundary, crash-regression]
fixtures: [reset_db, file_open_files, taoffice_signed_pdf]
timeout_sec: 250
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.pdf_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.pdf_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- wait_for: '[data-testid="module-action-enable-taoffice-pdf"]:enabled'
- press: {selector: '[data-testid="module-action-enable-taoffice-pdf"]', key: Enter}
- wait_for: '[data-testid="module-action-disable-taoffice-pdf"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="report.pdf"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="report.pdf"]'
- click: '[data-testid="taoffice-pdf-edit-toggle"]'
- wait_for: '[data-testid="taoffice-pdf-edit"]:focus'
- select_option: {selector: '[data-testid="taoffice-pdf-edit-tool"]', value: note}
- fill: {selector: '[data-testid="taoffice-pdf-edit-note"]', value: Check contract totals}
- press: {selector: '[data-testid="taoffice-pdf-markup-surface"]', key: ArrowRight}
- press: {selector: '[data-testid="taoffice-pdf-markup-surface"]', key: Enter}
- assert_text: {selector: '[data-testid="taoffice-pdf-annotations"]', contains: Check contract totals}
- click: '[data-testid="taoffice-pdf-edit-rotate"]'
- click: '[data-testid="taoffice-pdf-edit-later"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-page="2"][data-source-page="1"][data-rotation="90"][data-ready="true"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-text"]', contains: Quarterly report}
- assert_disabled: '[data-testid="taoffice-pdf-edit-later"]'
- click: '[data-testid="taoffice-pdf-previous"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-source-page="2"][data-ready="true"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-text"]', contains: Revenue by region}
- click: '[data-testid="taoffice-pdf-edit-remove"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-page="1"][data-source-page="1"][data-rotation="90"][data-ready="true"]'
- assert_disabled: '[data-testid="taoffice-pdf-edit-remove"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-annotations"]', contains: Check contract totals}
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.file_open_root}/reviewed.pdf
    trigger: '[data-testid="taoffice-pdf-edit-save"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-edit-output"]', contains: reviewed.pdf}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/report.pdf', sha256: '${fixture.taoffice_pdf_sha}'}
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="reviewed.pdf"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="reviewed.pdf"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-ready="true"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-page-count"]', contains: '/ 1'}
- assert_text: {selector: '[data-testid="taoffice-pdf-text"]', contains: Quarterly report}
- eval_readonly:
    expression: document.querySelector('.taoffice-pdf-page canvas').height > document.querySelector('.taoffice-pdf-page canvas').width
- click: '[data-testid="taoffice-pdf-edit-toggle"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-annotations"]', contains: Check contract totals}
- assert_disabled: '[data-testid="taoffice-pdf-edit-save"]'
- assert_no_runtime_errors: null

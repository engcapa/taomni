id: TC-009
title: SFTP upload, download, preview, and cleanup
covers:
- F7.2
- F7.3
tags:
- legacy-imported
- p0
- sftp
- transfer
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 2
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-remote-path"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}
- press: Enter
- wait: 1
- click: '[data-testid="sftp-local-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-transfer.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- wait_for: '[data-testid="sftp-local-pane"] >> text="qa-ui-auto-transfer.txt"'
- click: '[data-testid="sftp-local-pane"] tr[title$="qa-ui-auto-transfer.txt"]'
- click: '[data-testid="sftp-local-upload-selected"]'
- wait_for: '[data-testid="sftp-transfer-queue"] >> text="done"'
- click: '[data-testid="sftp-remote-pane"] tr[title$="qa-ui-auto-transfer.txt"]'
- click: '[data-testid="sftp-remote-download-selected"]'
- wait_for: '[data-testid="sftp-transfer-queue"] >> text="done"'
- click: '[data-testid="sftp-remote-preview"]'
- assert_visible: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-transfer.txt"'
- click: '[data-testid="sftp-preview-close"]'
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-transfer.txt"'
- click: '[data-testid="sftp-remote-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- click: '[data-testid="sftp-local-pane"] >> text="qa-ui-auto-transfer.txt"'
- click: '[data-testid="sftp-local-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- assert_not_visible: '[data-testid="sftp-browser"] tr[title$="/qa-ui-auto-transfer.txt"]'
- screenshot: 009-sftp-transfer-cleanup.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: SFTP upload, download, preview, and cleanup：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 4
    - 6
    - 7
    - 9
    - 10
    - 13
    - 15
    - 16
    - 17
    - 19
    - 21
    - 22
    - 25
    - 26
    - 28
    - 29
    - 31
    - 33
    - 34
    - 35
    - 37
    - 40
    - 41
    - 43
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"qc-input\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"sftp-browser\"]"}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 23
      expectation: '{"assert_not_visible": "[data-testid=\"text-input-dialog\"]"}'
    - step: 24
      expectation: '{"wait_for": "[data-testid=\"sftp-local-pane\"] >> text=\"qa-ui-auto-transfer.txt\""}'
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"sftp-transfer-queue\"] >> text=\"done\""}'
    - step: 30
      expectation: '{"wait_for": "[data-testid=\"sftp-transfer-queue\"] >> text=\"done\""}'
    - step: 32
      expectation: '{"assert_visible": "[data-testid=\"sftp-remote-pane\"] >> text=\"qa-ui-auto-transfer.txt\""}'
    - step: 36

id: TC-MFA-010
title: MFA accounts sort six ways, pin to the top, reorder by menu and drag, and keep
  the order
description: 'V-17b (AC-12). Browser stub. Four exported accounts are copied in a
  known pattern so issuer, account, recently used, most used, recently added and custom
  orders are all distinct. Reordering is only offered in custom order; a pinned account
  stays first; Move up, Move down and dragging the handle change the custom order;
  the sort choice, pin and order survive a reload; unpinning returns the account to
  its custom position.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F-MFA-1
tags:
- mfa
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-master-010
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-master-010
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'

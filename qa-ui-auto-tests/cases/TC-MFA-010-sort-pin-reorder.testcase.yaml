- click: '[data-testid="mfa-account-code"]:is([data-issuer="Alpha Mail"] *)'
- click: '[data-testid="mfa-account-code"]:is([data-issuer="Alpha Mail"] *)'
- click: '[data-testid="mfa-account-code"]:is([data-issuer="Mid Bank"] *)'

    equals: 'false'
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Alpha Mail
    - Beta Git
    - Zeta Cloud
    - Mid Bank
- screenshot: mfa-010-sorted.png

    attribute: data-issuer
    equals:
    - Mid Bank
    - Zeta Cloud
    - Beta Git
    - Alpha Mail
- assert_attribute:
    selector: '[data-testid="mfa-sort-mode"]'
    name: value
    equals: account
- select_option:
    selector: '[data-testid="mfa-sort-mode"]'
    value: custom
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - Mid Bank
    - Alpha Mail
    - Beta Git
    - Zeta Cloud
- click: '[data-testid="mfa-account-menu"]:is([data-issuer="Mid Bank"] *)'
- click: '[data-testid="mfa-menu-pin"]'
- assert_attribute:

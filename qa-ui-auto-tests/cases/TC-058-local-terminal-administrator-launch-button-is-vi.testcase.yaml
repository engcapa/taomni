id: TC-058
title: Local terminal administrator launch button is visible and clickable
covers:
- F2.1
tags:
- admin
- legacy-imported
- local
- p1
- terminal
modes:
- browser
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: '[data-testid="welcome-panel"] >> text="Start local terminal"'
- assert_count:
    selector: button[aria-label="Open as administrator"]
    min: 0
- wait: 1
- screenshot: 058-local-terminal-admin.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Local terminal administrator launch button is visible and clickable：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 3
      expectation: '{"assert_visible": "[data-testid=\"welcome-panel\"] >> text=\"Start local terminal\""}'
    - step: 4
      expectation: '{"assert_count": {"selector": "button[aria-label=\"Open as administrator\"]", "min": 0}}'
    results:
    - 2
    - 3
    - 4
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

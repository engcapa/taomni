  visual:
  - check: Inspect the retained screenshots for readable terminal content, compact SFTP controls and usable side-panel sizing.
    method: manual
    reason: Geometry and DOM assertions support, but do not replace, visual review.
  native:
  - check: Create and destroy two actual Tauri SFTP windows, verify native SFTP directory listings and execute distinct commands in the original SSH
      PTY after each restore.
    method: automated
    reason: Browser stubs cannot establish native WebView/window, SSH PTY or SFTP channel ownership.
description: Use isolated local fixture directories on every OS, including Windows drive paths. Verify distinct local and remote marker listings before
  detach, in the popup, and after each restore; the popup changes both selected directories.

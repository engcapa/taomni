id: TC-043
title: SFTP popup restores its current folders to the original SSH side panel and can detach again
covers:
- F7.4
- F3.1
tags:
- detach
- reattach
- sftp
- window
- lifecycle
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_posix_required
- path_completion
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.sidebarCollapsedByGroup.v1
    value: '{"terminal": false, "code-workspace": true}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar"]'
- assert_visible: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh_posix.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh_posix.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh_posix.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-sftp-window
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-sftp-window"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-sftp-window"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_POSIX_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: mkdir -p /tmp/qa-sftp-window/before /tmp/qa-sftp-window/popup; touch /tmp/qa-sftp-window/before/QA_SFTP_BEFORE.txt /tmp/qa-sftp-window/popup/QA_SFTP_POPUP.txt;
      echo QA_SFTP_WINDOW_READY
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?m)^QA_SFTP_WINDOW_READY\r?$
      timeout_sec: 30
      attempts: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_SFTP_WINDOW_READY\r?$
    timeout_sec: 30
- click: '[data-testid="sftp-floating-button"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: /tmp/qa-sftp-window/before
- press:
    selector: input[data-testid="sftp-remote-path"]
    key: Enter
- wait_for: '[data-testid="sftp-remote-path-segments"] button[data-path="/tmp/qa-sftp-window/before"]'
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: QA_SFTP_BEFORE.txt
- click: '[data-testid="sftp-local-path-edit"]'
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.path_completion_root}/project-beta
- press:
    selector: input[data-testid="sftp-local-path"]
    key: Enter
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: beta-marker.txt
- click: '[data-testid="sftp-detach"]'
- switch_window:
    selector: '[data-testid="sftp-detached-window"]'
    # Allow a read-only DOM probe to recover after WKWebView's first-navigation
    # evaluation callback times out (30s); window/listing assertions still apply.
    timeout_sec: 60
- wait_for: '[data-testid="sftp-remote-path-segments"] button[data-path="/tmp/qa-sftp-window/before"]'
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: QA_SFTP_BEFORE.txt
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: beta-marker.txt
- assert_visible: '[data-testid="sftp-reattach"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: /tmp/qa-sftp-window/popup
- press:
    selector: input[data-testid="sftp-remote-path"]
    key: Enter
- wait_for: '[data-testid="sftp-remote-path-segments"] button[data-path="/tmp/qa-sftp-window/popup"]'
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: QA_SFTP_POPUP.txt
- click: '[data-testid="sftp-local-path-edit"]'
- fill:
    selector: input[data-testid="sftp-local-path"]
    value: ${fixture.path_completion_root}/only space/child
- press:
    selector: input[data-testid="sftp-local-path"]
    key: Enter
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: child-marker.txt
- assert_no_runtime_errors: null
- screenshot: sftp-window-restore-action.png
- switch_window:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    close_with: '[data-testid="sftp-reattach"]'
    timeout_sec: 30
- wait_for: '[data-testid="sftp-browser"]'
- wait_for: '[data-testid="sftp-remote-path-segments"] button[data-path="/tmp/qa-sftp-window/popup"]'
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: child-marker.txt
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: QA_SFTP_POPUP.txt
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 1
- assert_not_visible: '[data-testid="sftp-floating-button"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_SFTP_RESTORED_LIVE
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?m)^QA_SFTP_RESTORED_LIVE\r?$
      timeout_sec: 30
      attempts: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_SFTP_RESTORED_LIVE\r?$
    timeout_sec: 30
- click: '[data-testid="sftp-close"]'
- wait_for: '[data-testid="sftp-floating-button"]'
- click: '[data-testid="sftp-floating-button"]'
- wait_for: '[data-testid="sftp-browser"]'
- wait_for: '[data-testid="sftp-remote-path-segments"] button[data-path="/tmp/qa-sftp-window/popup"]'
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: child-marker.txt
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: QA_SFTP_POPUP.txt
- click: '[data-testid="sftp-detach"]'
- switch_window:
    selector: '[data-testid="sftp-detached-window"]'
    timeout_sec: 60
- wait_for: '[data-testid="sftp-remote-path-segments"] button[data-path="/tmp/qa-sftp-window/popup"]'
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: QA_SFTP_POPUP.txt
- assert_no_runtime_errors: null
- switch_window:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    close_with: '[data-testid="sftp-reattach"]'
    timeout_sec: 30
- wait_for: '[data-testid="sftp-browser"]'
- assert_not_visible: '[data-testid="sftp-floating-button"]'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 1
- assert_text:
    selector: '[data-testid="sftp-local-list"]'
    contains: child-marker.txt
- screenshot: sftp-window-restored-sidebar.png
- click: '[data-testid="sftp-close"]'
- wait_for: '[data-testid="sftp-floating-button"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: rm -rf /tmp/qa-sftp-window; echo QA_SFTP_SECOND_RESTORE_LIVE
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?m)^QA_SFTP_SECOND_RESTORE_LIVE\r?$
      timeout_sec: 30
      attempts: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_SFTP_SECOND_RESTORE_LIVE\r?$
    timeout_sec: 30
- assert_no_runtime_errors: null

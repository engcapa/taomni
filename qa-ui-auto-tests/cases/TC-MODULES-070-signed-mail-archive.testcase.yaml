id: TC-MODULES-070
title: Signed Mail archives complete originals after pausing and resuming
description: Disable Mail during a live archive scan, re-enable it and pause and resume complete storage, then read and search the custom local archive and export the selected attachment after deleting the messages on the server. Compare the original and exported bytes with the fixture.
covers: [F-Modules-1, F-MAIL-23]
tags: [modules, mail, native-boundary, p1]
modes: [native]
fixtures: [reset_db, mail_server, mail_storage, module_signed_mail_archive]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.mail_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.mail_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- assert_signed_mail_host: idle
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:
    selector: input[aria-label="IMAP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-imap-security"]'
    value: None
- fill:
    selector: input[aria-label="IMAP port"]
    value: ${fixture.mail_imap_port}
- fill:
    selector: input[aria-label="Mail email or username"]
    value: qa@example.com
- fill:
    selector: input[aria-label="Mail password or app password token"]
    value: qa-pass
- fill:
    selector: input[aria-label="SMTP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-smtp-security"]'
    value: None
- fill:
    selector: input[aria-label="SMTP port"]
    value: ${fixture.mail_smtp_port}
- fill:
    selector: '[data-testid="mail-storage-directory"]'
    value: ${fixture.mail_storage_a}
- select_option:
    selector: '[data-testid="mail-storage-mode"]'
    value: include
- assert_text:
    selector: '[data-testid="mail-storage-settings"]'
    contains: No cached folders. Connect and sync this account first
- assert_count:
    selector: '[data-testid="mail-storage-folders"] input'
    equal: 0
- click: '[data-testid="mail-storage-edit-folders"]'
- fill:
    selector: '[data-testid="mail-storage-folder-names"]'
    value: INBOX
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: QA complete mail
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-mail-storage-password
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 60
- wait_for: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- wait_for: '[data-testid="mail-storage-pause"]'
- assert_text: {selector: '[data-testid="mail-storage-progress"]', contains: downloading, timeout_sec: 40}
- mail_storage_assert: {kind: worker, root: '${fixture.mail_storage_a}', expected: '${fixture.mail_expected}', active: true, timeout_sec: 10}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-mail"]'
- wait_for: '[data-testid="module-action-enable-mail"]'
- assert_signed_mail_host: disabled
- mail_storage_assert: {kind: worker, root: '${fixture.mail_storage_a}', expected: '${fixture.mail_expected}', active: false, timeout_sec: 10}
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="home-toolbar-sessions"]'
- click: '[data-testid="tab-item"][data-tab-type="mail"]'
- wait_for: '[data-plugin-slug="mail"][data-plugin-kind="account"] [data-testid="plugin-tab-unavailable"][data-reason="disabled"]'
- click: '[data-plugin-slug="mail"] [data-testid="plugin-tab-settings"]'
- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="home-toolbar-sessions"]'
- click: '[data-testid="tab-item"][data-tab-type="mail"]'
- assert_text: {selector: '[data-testid="mail-storage-progress"]', contains: downloading, timeout_sec: 40}
- click: '[data-testid="mail-storage-pause"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: paused
    timeout_sec: 60
- click: '[data-testid="mail-storage-resume"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 60
- mail_storage_assert:
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    partial_files: 0
    paused: false
    full:
      INBOX: 2
    headers:
      INBOX: 2
      Archive: 2
- assert_signed_mail_host: running
- mail_server_expunge_newest: {folder: INBOX, count: 2}
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches: {folder: INBOX, timeout_sec: 60}
- click: '[data-testid="mail-archive-open"]'
- wait_for: '[data-testid="mail-archive-row"]'
- assert_count: {selector: '[data-testid="mail-archive-row"]', equal: 2}
- click: '[data-testid="mail-archive-row"]:first-child [data-testid="mail-archive-read"]'
- assert_text_equals: {selector: '[data-testid="mail-archive-attachment"]', equals: complete.bin}
- click: '[data-testid="mail-archive-preview"] [data-testid="mail-body-mode-plain"]'
- assert_text: {selector: '[data-testid="mail-archive-preview"]', contains: Offline body Complete INBOX}
- wait_for: '[data-testid="mail-archive-attachment"]:enabled'
- native_file_dialog:
    kind: save
    action: choose
    trigger: '[data-testid="mail-archive-attachment"]'
    path: ${fixture.mail_storage_a}/exported-complete.bin
- assert_text: {selector: '[data-testid="mail-archive-notice"]', contains: exported-complete.bin}
- assert_file_sha256: {path: '${fixture.mail_storage_a}/exported-complete.bin', equals: '${fixture.mail_archive_attachment_sha256}'}
- click: '[data-testid="mail-archive-close"]'
- mail_storage_assert:
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    partial_files: 0
    paused: false
    full: {INBOX: 2}
    headers: {INBOX: 0, Archive: 2}
- assert_no_runtime_errors: null
- assert_signed_mail_host: running
- click: '[data-testid="mail-archive-open"]'
- fill: {selector: '[data-testid="mail-archive-search"]', value: Complete INBOX}
- assert_text: {selector: '[data-testid="mail-archive-results"]', contains: of 2 messages, timeout_sec: 30}
- fill: {selector: '[data-testid="mail-archive-search"]', value: no-saved-message-match}
- assert_text: {selector: '[data-testid="mail-archive-results"]', contains: of 0 messages, timeout_sec: 30}
- click: '[data-testid="mail-archive-close"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: archive-pause-resume
    requirement: The installed Mail module preserves complete originals after interrupting and resuming a live archive scan.
    actions: [6, 8, 58, 60]
    checkpoints:
    - {step: 39, expectation: The initial scan reaches the downloading phase before it is paused.}
    - {step: 59, expectation: The scan reports that it paused.}
    - {step: 61, expectation: The resumed transfer finishes the scan.}
    - {step: 62, expectation: Gzip originals and SQLite metadata match the fixture. Resume clears the persisted pause and removes partial transfer files.}
    - {step: 63, expectation: The verified Mail host and renderer own the enabled module.}
    results: [39, 59, 61, 62, 63]
  - id: read-after-server-removal
    requirement: Local originals and their attachments remain readable after both messages have been removed from IMAP.
    actions: [64, 65, 67, 70, 72, 75, 78]
    checkpoints:
    - {step: 66, expectation: The synced inbox matches the now-empty server inbox.}
    - {step: 69, expectation: The local archive still lists both originals.}
    - {step: 71, expectation: The saved MIME exposes the original attachment.}
    - {step: 73, expectation: The saved plaintext body identifies the expunged fixture message.}
    - {step: 76, expectation: The archive manager reports saving the selected attachment.}
    - {step: 77, expectation: The exported file matches the original attachment digest.}
    - {step: 79, expectation: Both originals and attachments still match the fixture digests after their live headers disappear.}
    - {step: 80, expectation: The workflow finishes without runtime errors.}
    - {step: 81, expectation: The signed host still owns the mailbox after decoding the original.}
    results: [66, 69, 71, 73, 76, 77, 79, 80, 81]
  - id: archive-module-lifecycle
    requirement: Disabling Mail releases the active archive worker and retains its tab for automatic resume after re-enabling.
    actions: [43, 49, 51, 52, 54, 56]
    checkpoints:
    - {step: 40, expectation: The archive worker holds the account's native lock before disabling.}
    - {step: 45, expectation: The disabled Mail host has released its writer lease.}
    - {step: 46, expectation: The account's archive worker has released its native lock.}
    - {step: 50, expectation: The existing Mail tab shows the disabled module.}
    - {step: 57, expectation: The same tab again downloads the originals without a manual resume.}
    - {step: 62, expectation: The final archived bytes and metadata match the server fixture.}
    results: [40, 45, 46, 50, 57, 62]
  - id: archive-index-query
    requirement: Reopening and searching the custom local archive finds both originals after the live inbox is empty and returns an empty page for a missing subject.
    actions: [82, 83, 85, 87]
    checkpoints:
    - {step: 84, expectation: The signed host finds both saved subjects in the configured account cache.}
    - {step: 86, expectation: A query with no matching subject shows an empty page.}
    - {step: 88, expectation: Repeated archive queries finish without runtime errors.}
    results: [84, 86, 88]
  visual:
  - check: The Mail pane displays downloading, paused and completed as the scan runs.
    method: automated
    reason: The case reads the visible storage progress around the pause and resume actions.
  native:
  - check: Signed Mail, loopback IMAP and actual disk storage.
    method: automated
    reason: The runner validates signed executables, visible archive state and byte-exact persisted originals.

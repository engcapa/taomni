id: TC-SHOT-016
title: Re-crop after capture keeps annotations
covers:
- F27.1
tags:
- screenshot
- annotate
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
# Draw a rectangle annotation first.
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-canvas"]'
    to: '[data-testid="screenshot-annotation-canvas"]'
    from_position:
      x: 80
      y: 80
    to_position:
      x: 200
      y: 160
- assert_enabled: '[data-testid="screenshot-undo"]'
# Enter re-crop mode; toolbar hides while selecting.
- click: '[data-testid="screenshot-recrop"]'
- assert_not_visible: '[data-testid="screenshot-toolbar"]'
# Drag a new region; toolbar returns and annotation survives (undo still on).
- drag_to:
    from: '[data-testid="screenshot-base-image"]'
    to: '[data-testid="screenshot-base-image"]'
    from_position:
      x: 40
      y: 40
    to_position:
      x: 320
      y: 240
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_enabled: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-cancel"]'
- wait_for:
    selector: '[data-testid="system-screenshot"]'

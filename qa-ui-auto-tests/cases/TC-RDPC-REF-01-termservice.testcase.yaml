id: TC-RDPC-REF-01-termservice
title: Taomni RDP client renders and controls a real termservice reference desktop
description: 'AC-E07/E08: connect the product client to a disposable reference account, confirm its certificate, assert decoded magenta/cyan pixels and
  click to flip the target. Exercise full screen, quality evidence, restore and disconnect. DEC-07 authorizes sudo xrdp provisioning only on the hosted
  Linux runner.'
covers:
- F9.7
tags:
- rdp
- rdp-client
- reference
- p1
modes:
- native
native_platforms:
- Windows
fixtures:
- reset_db
- rdp_baseline_required
- release_build_required
timeout_sec: 480
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar"]'
- assert_visible: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-rdp"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: 127.0.0.1
- fill:
    selector: '[data-testid="session-port"]'
    value: ${env.QA_RDP_BASELINE_PORT}
- click: '[data-testid="session-specify-username"]'
- fill:
    selector: '[data-testid="session-user"]'
    value: ${env.QA_RDP_BASELINE_USER1}
- click: '[data-testid="session-section-rdp"]'
- fill:
    selector: .rdp-options-form input[type="number"][min="320"]
    value: '1280'
- fill:
    selector: .rdp-options-form input[type="number"][min="200"]
    value: '720'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-rdp-termservice
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-rdp-termservice"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-rdp-termservice"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_RDP_BASELINE_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="confirm-dialog"]'
    timeout_sec: 60
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_text:
    selector: '[data-testid="rdp-status"]'
    contains: Connected
    timeout_sec: 60
- host_copy_file:
    from_env_dir: QA_RDP_BASELINE_DIR
    name: flip-state.json
    to: reference-ready.json
    timeout_sec: 180
    expect:
      ready: true
- rdp_canvas_assert:
    artifact: reference-before
    timeout_sec: 60
    points:
    - x: 60
      y: 100
      rgb:
      - 255
      - 0
      - 255
    - x: 160
      y: 100
      rgb:
      - 0
      - 255
      - 255
    - x: 280
      y: 240
      rgb:
      - 0
      - 0
      - 0
- rdp_canvas_click:
    x: 280
    y: 240
- host_copy_file:
    from_env_dir: QA_RDP_BASELINE_DIR
    name: flip-state.json
    to: reference-flipped.json
    expect:
      flips:
        min: 1
- rdp_canvas_assert:
    artifact: reference-after
    points:
    - x: 280
      y: 240
      rgb:
      - 255
      - 255
      - 255
- click: '[data-testid="rdp-view-cycle"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"][data-visible="true"]'
    timeout_sec: 15
- wait_for: '[data-testid="rdp-bar-quality"]'
- rdp_canvas_assert:
    artifact: reference-fullscreen
    points:
    - x: 280
      y: 240
      rgb:
      - 255
      - 255
      - 255
- assert_json_file:
    path: reference-fullscreen.json
    expect:
      quality_level:
        min: 0
        max: 4
- click: '[data-testid="rdp-bar-restore"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"]'
    state: detached
    timeout_sec: 15
- click: '[data-testid="rdp-view-cycle"]'
- hover: '[data-testid="rdp-bar-hotzone"]'
- wait_for:
    selector: '[data-testid="rdp-connection-bar"][data-visible="true"]'
    timeout_sec: 15
- click: '[data-testid="rdp-bar-disconnect"]'
- assert_text:
    selector: '[data-testid="rdp-status"]'
    contains: Disconnected
    timeout_sec: 20

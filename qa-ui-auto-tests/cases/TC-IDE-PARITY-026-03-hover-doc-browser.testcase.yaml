id: TC-IDE-PARITY-026-03
title: Hover documentation stays while the pointer moves onto it, like IDEA
description: "ED-PARITY-026 A2 browser case on the B-005 controlled Java provider (hover advertised through taomni.qa.parity005.hover). Hovering a class name opens the documentation popup; moving the pointer across neighbouring characters towards the popup and resting inside it keeps it open (CodeMirror's hover closed it on the first move off the character), moving away closes it after the grace period, Esc closes it from the editor, a popup the user clicked into stays until Esc returns focus to the editor, and Pin moves it to the Documentation tool window.\n\n  Mode: browser.\n"
covers:
- F25.5
tags:
- code-workspace
- quick-documentation
- ed-parity-026
- parity005
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.qa.parity005.hover
    value: 'true'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity005_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: Stri;
- hover: '[data-testid="code-workspace-editor"] .cm-content > .cm-line:nth-child(3) span:text-is("Main")'
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-hover-doc"]'
    contains: parity005.Main
- mouse_path:
    points:
    - selector: '[data-testid="code-workspace-editor"] .cm-content > .cm-line:nth-child(3) span:text-is("Main")'
      dx: 14
      dy: 3
      steps: 4
    - selector: '[data-testid="code-workspace-editor"] .cm-content > .cm-line:nth-child(3) span:text-is("Main")'
      dx: 46
      dy: 8
      steps: 5
- wait: 0.8
- assert_visible: '[data-testid="code-workspace-hover-doc"]'
- mouse_path:
    points:
    - selector: '[data-testid="code-workspace-hover-doc"]'
      dx: 0
      dy: 0
      steps: 8
      pause_ms: 1000
- assert_visible: '[data-testid="code-workspace-hover-doc"]'
- assert_text:
    selector: '[data-testid="code-workspace-hover-doc"]'
    contains: Browser B-005 documentation
- screenshot: tc-ide-parity-026-03-hover-kept.png
- mouse_path:
    points:
    - selector: '[data-editor-tab-key][data-active="true"]'
      dx: 0
      dy: 0
      steps: 6
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    state: detached
    timeout_sec: 5
- click: '[data-testid="code-workspace-editor"] .cm-content'
- hover: '[data-testid="code-workspace-editor"] .cm-content > .cm-line:nth-child(3) span:text-is("Main")'
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    timeout_sec: 10
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    state: detached
    timeout_sec: 5
- mouse_path:
    points:
    - selector: '[data-editor-tab-key][data-active="true"]'
      dx: 0
      dy: 0
      steps: 2
- hover: '[data-testid="code-workspace-editor"] .cm-content > .cm-line:nth-child(3) span:text-is("Main")'
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    timeout_sec: 10
- mouse_path:
    points:
    - selector: '[data-testid="code-workspace-hover-doc"]'
      dx: 0
      dy: 0
      steps: 6
- click: '[data-testid="code-workspace-hover-doc"] .cm-lsp-hover'
- mouse_path:
    points:
    - selector: '[data-testid="status-bar"]'
      dx: 0
      dy: 0
      steps: 6
      pause_ms: 1000
- assert_visible: '[data-testid="code-workspace-hover-doc"]'
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    state: detached
    timeout_sec: 5
- eval_readonly:
    expression: document.activeElement?.closest('.cm-editor') !== null
    expect_truthy: true
- mouse_path:
    points:
    - selector: '[data-editor-tab-key][data-active="true"]'
      dx: 0
      dy: 0
      steps: 2
- hover: '[data-testid="code-workspace-editor"] .cm-content > .cm-line:nth-child(3) span:text-is("Main")'
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    timeout_sec: 10
- mouse_path:
    points:
    - selector: '[data-testid="code-workspace-hover-doc"]'
      dx: 0
      dy: 0
      steps: 6
- click: '[data-testid="code-workspace-hover-doc-pin"]'
- wait_for:
    selector: '[data-testid="code-workspace-hover-doc"]'
    state: detached
    timeout_sec: 5
- wait_for:
    selector: '[data-testid="code-workspace-documentation-pane"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-documentation-pane"]'
    contains: parity005.Main
- screenshot: tc-ide-parity-026-03-pinned.png

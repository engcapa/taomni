id: TC-WS-043
title: Native explorer and workspace switching remain usable while a real LSP initializes
description: A real stdio LSP process holds initialize on a host-file gate. Before releasing it, expand directories, open a plain document, sort and create
  another workspace. Late initialize/didOpen must leave the selected empty workspace and previous document unchanged.
modes:
- native
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_slow_lsp
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-slow-lsp
- seed_storage:
    key: taomni.codeWorkspace.lspCommandPrefs.v1
    value: ${fixture.slow_lsp_prefs}
- seed_storage:
    key: taomni.codeWorkspace.lspCustomCommands.v1
    value: ${fixture.slow_lsp_command}
- reload_window: null
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="src"] [data-testid="code-workspace-tree-dir-arrow"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="src/index.ts"]'
- wait_for: '[data-testid="workspace-file-editor"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"]'
    contains: export const platform = "workspace"
- assert_file_contains:
    path: ${fixture.slow_lsp_events}
    contains: initialize-blocked
- click: '[data-testid="code-workspace-tree-dir"][data-path="Documents"] [data-testid="code-workspace-tree-dir-arrow"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Documents/notes.txt"]'
- wait_for: '[data-testid="workspace-file-editor"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"]'
    contains: Weekly notes
- click: '[data-testid="code-workspace-tree-view-selector"]'
- click: '[data-testid="code-workspace-tree-view-list"]'
- click: '[data-testid="code-workspace-list-sort-size"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-list-sort-size"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="workspace-create-button"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: While LSP waits
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- host_write_file:
    path: ${fixture.slow_lsp_gate}
    text: release
- assert_file_contains:
    path: ${fixture.slow_lsp_events}
    contains: 'didOpen:'
- assert_visible: '[data-testid="code-workspace-tree-empty"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-button"]'
    contains: While LSP waits
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- click: '[data-testid="workspace-switcher-button"]'
- click: '[data-testid="workspace-switcher-option-default-workspace"]'
- wait_for: '[data-testid="workspace-file-editor"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"]'
    contains: Weekly notes
- assert_attribute:
    selector: '[data-testid="workspace-tab"][data-active="true"]'
    name: data-tab-title
    equals: notes.txt
- assert_no_runtime_errors: null
- screenshot: workspace-slow-lsp-background.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Directory/file operations complete before provider initialize is released; a late provider response never activates an old file or workspace.
    actions:
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 13
    - 17
    - 18
    - 21
    - 22
    - 23
    - 25
    - 27
    - 28
    - 30
    - 35
    - 36
    results:
    - 15
    - 16
    - 20
    - 24
    - 31
    - 32
    - 33
    - 34
    - 38
    - 39
    - 40
    checkpoints:
    - step: 15
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"]", "contains": "export const platform = \"workspace\""}}'
    - step: 16
      expectation: '{"assert_file_contains": {"path": "${fixture.slow_lsp_events}", "contains": "initialize-blocked"}}'
    - step: 20
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"]", "contains": "Weekly notes"}}'
    - step: 24
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-list-sort-size\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 31
      expectation: '{"assert_file_contains": {"path": "${fixture.slow_lsp_events}", "contains": "didOpen:"}}'
    - step: 32
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-empty\"]"}'
    - step: 33
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-switcher-button\"]", "contains": "While LSP waits"}}'
    - step: 34
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-tab\"]", "equal": 0}}'
    - step: 38
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"]", "contains": "Weekly notes"}}'
    - step: 39
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"workspace-tab\"][data-active=\"true\"]", "name": "data-tab-title", "equals": "notes.txt"}}'
    - step: 40
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: Review file area, row metadata, selection, toolbar and package layout in the retained screenshot.
    method: manual
    reason: Functional assertions do not establish visual fidelity; review the case screenshot separately.
  native:
  - check: Real language-server process and held JSON-RPC initialize through production Tauri IPC.
    method: automated
    reason: Real Tauri IPC, native filesystem or process effects cannot be established by browser stubs.

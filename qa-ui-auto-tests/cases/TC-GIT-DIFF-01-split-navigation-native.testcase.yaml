    - step: 37
      expectation: '{"eval_readonly": {"expression": "Math.abs(document.querySelector(\".git-log-view\")?.querySelector(\"[data-testid\"
        + String.fromCharCode(61) + \"\\\"git-diff-left-scroll\\\"]\")?.scrollLeft ?? 0) <= 1 && Math.abs(document.querySelector(\".git-log-view\")?.querySelector(\"[data-testid\"

id: TC-MAIN-RAIL-04
title: Main sidebar owns resizing and the names menu in every tab and panel state
description: Renderer regression for Welcome with no open sessions, expanded and collapsed panels, Code Workspace and a local terminal. The full-height main
  rail edge resizes independently of embedded tab tools. Background, Settings and permanent buttons expose the names preference; tool buttons retain their own
  context menu. Width and names remain shared across tab switches and survive reload. Explicit Code Workspace entry reveals the file area; collapsed rail checks
  use the sidebar toggle explicitly.
covers:
- F1.2
- F1.9
- F6.2
- F25.5
tags:
- main
- sidebar
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.sidebarCollapsed
    value: 'false'
- seed_storage:
    key: taomni.sidebarCollapsedByGroup.v1
    value: '{"code-workspace":true,"terminal":true}'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- right_click: '[data-testid="sidebar-rail"]'
- assert_count:
    selector: '[data-testid="context-menu"]'
    equal: 1
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- assert_text_equals:
    selector: '[data-testid="side-tab-tools"]'
    equals: ''
- right_click: '[data-testid="ribbon-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 59
    expect_truthy: true
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: 20
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 79
    expect_truthy: true
- press:
    selector: '[data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"leftWidth":83'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 83
    expect_truthy: true
- click: '[data-testid="side-tab-sessions"]:visible'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- eval_readonly:
    expression: document.querySelector('[aria-valuenow]').getBoundingClientRect().height > 500
    expect_truthy: true
- drag_to:
    from: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    by:
      dx: 100
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 100
    expect_truthy: true
- drag_to:
    from: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    by:
      dx: -200
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 40
    expect_truthy: true
- press:

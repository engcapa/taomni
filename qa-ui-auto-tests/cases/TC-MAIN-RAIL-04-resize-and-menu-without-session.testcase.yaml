id: TC-MAIN-RAIL-04
title: Main sidebar owns resizing and the names menu in every tab and panel state
description: Main resize ownership migrated to the permanent Shell Rail, including Home, collapsed Navigator, workspace
  and terminal. Shell labels require a 68px minimum; embedded tools never add a second resize edge. Width and names
  persist across switches and reload.
covers:
- F1.2
- F1.9
- F6.2
- F25.5
tags:
- main
- sidebar
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":68,"rightWidth":59}'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- right_click: '[data-testid="shell-rail"]'
- assert_count:
    selector: '[data-testid="context-menu"]'
    equal: 1
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- right_click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      68
    expect_truthy: true
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: 20
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      88
    expect_truthy: true
- press:
    selector: '[data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      92
    expect_truthy: true
- shell_navigate: sessions
- click: '[data-testid="shell-rail-sessions"]'
- assert_not_visible: '[data-testid="session-tree"]'
- eval_readonly:
    expression: document.querySelector('[data-testid="sidebar-rail-resize"]').getBoundingClientRect().height > 500
    expect_truthy: true
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: 100
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      100
    expect_truthy: true
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: -200
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      68
    expect_truthy: true
- press:
    selector: '[data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      72
    expect_truthy: true
- shell_navigate: tools
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_count:
    selector: '[data-testid="sidebar-rail-resize"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tool-rail-left-resize"]'
    equal: 0
- right_click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_count:
    selector: '[data-testid="sidebar-rail-menu-show-names"]'
    equal: 0
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- right_click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="shell-rail-home"]'
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      72
    expect_truthy: true
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_count:
    selector: '[data-testid="sidebar-rail-resize"]'
    equal: 1
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: 12
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      84
    expect_truthy: true
- click: '[data-testid="shell-rail-home"]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- eval_readonly:
    expression: Math.round(document.querySelector('[data-testid="shell-rail"]').getBoundingClientRect().width) ===
      84
    expect_truthy: true
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- screenshot: main-rail-restored.png

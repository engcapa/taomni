id: TC-MAIN-RAIL-04
title: Main sidebar owns resizing and the names menu in every tab and panel state
description: Renderer regression for Welcome with no open sessions, expanded and collapsed panels, Code Workspace
  and a local terminal. The full-height main rail edge resizes independently of embedded tab tools. Background,
  Settings and permanent buttons expose the names preference; tool buttons retain their own context menu. Width
  and names remain shared across tab switches and survive reload.
covers:
- F1.2
- F1.9
- F6.2
- F25.5
tags:
- main
- sidebar
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="control-bar"]'
- seed_storage:
    key: taomni.sidebarCollapsed
    value: 'false'
- seed_storage:
    key: taomni.sidebarCollapsedByGroup.v1
    value: '{"code-workspace":true,"terminal":true}'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- right_click: '[data-testid="expanded-sidebar-panel"] [data-testid="sidebar-rail"]'
- assert_count:
    selector: '[data-testid="context-menu"]'
    equal: 1
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- assert_text_equals:
    selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]'
    equals: ''
- right_click: '[data-testid="expanded-sidebar-panel"] [data-testid="ribbon-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 59
    expect_truthy: true
- drag_to:
    from: '[data-testid="expanded-sidebar-panel"] [data-testid="sidebar-rail-resize"]'
    by:
      dx: 20
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 79
    expect_truthy: true
- press:
    selector: '[data-testid="expanded-sidebar-panel"] [data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"leftWidth":83'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 83
    expect_truthy: true
- click: '[data-testid="side-tab-sessions"]:visible'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- eval_readonly:
    expression: document.querySelector('[aria-valuenow]').getBoundingClientRect().height > 500
    expect_truthy: true
- drag_to:
    from: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    by:
      dx: 100
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 100
    expect_truthy: true
- drag_to:
    from: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    by:
      dx: -200
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 40
    expect_truthy: true
- press:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 44
    expect_truthy: true
- right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_count:
    selector: '[data-testid="sidebar-rail-resize"]'
    equal: 0
- right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="ribbon-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 44
    expect_truthy: true
- screenshot: main-rail-welcome-resized.png
- click: '[data-testid="side-tab-tools"]:visible'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- drag_to:
    from: '[data-testid="expanded-sidebar-panel"] [data-testid="sidebar-rail-resize"]'
    by:
      dx: 20
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 64
    expect_truthy: true
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-code-workspace"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-sidebar"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    equal: 1
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left-resize"]'
    equal: 0
- press:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 68
    expect_truthy: true
- right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- assert_count:
    selector: '[data-testid="sidebar-rail-menu-show-names"]'
    equal: 0
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- assert_text_equals:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
    equals: ''
- right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="ribbon-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 68
    expect_truthy: true
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_count:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    equal: 1
- drag_to:
    from: '[data-testid="collapsed-sidebar-rail"] [data-testid="sidebar-rail-resize"]'
    by:
      dx: 12
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 80
    expect_truthy: true
- right_click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_text_equals:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
    equals: ''
- right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="ribbon-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 80
    expect_truthy: true
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="expanded-sidebar-panel"] [data-testid="sidebar-rail-resize"]'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 80
    expect_truthy: true
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- screenshot: main-rail-welcome-restored.png
- click: '[data-testid="side-tab-tools"]:visible'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-code-workspace"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- click: '[data-testid="side-tab-sessions"]:visible'
- wait_for: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
- press:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left-resize"]'
    key: ArrowLeft
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"leftWidth":76'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 76
    expect_truthy: true
- screenshot: main-rail-standalone-workspace.png

id: TC-MAIN-RAIL-04
title: Main sidebar owns resizing and the names menu in every tab and panel state
description: Main resize ownership migrated to the permanent Shell Rail, including Home, collapsed Navigator, workspace
  and terminal. Shell labels require a 68px minimum; embedded tools never add a second resize edge. Width and names
  persist across switches and reload. Classification now uses dock/Actions; Project uses the unified Workspaces
  entry. Existing workspace content, shortcut and state assertions remain.
covers:
- F1.2
- F1.9
- F6.2
- F25.5
tags:
- main
- sidebar
- p1
modes:
- browser
fixtures:
- reset_db
- local_terminal_preview
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":68,"rightWidth":59}'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- right_click: '[data-testid="shell-rail"]'
- assert_count:
    selector: '[data-testid="context-menu"]'
    equal: 1
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- right_click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_element_geometry:
    selector: '[data-testid="shell-rail"]'
    min_width: 67.51
    min_height: 1
    tolerance: 0
    max_width: 68.49
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: 20
- assert_element_geometry:
    selector: '[data-testid="shell-rail"]'
    min_width: 87.51
    min_height: 1
    tolerance: 0
    max_width: 88.49
- press:
    selector: '[data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- assert_element_geometry:
    selector: '[data-testid="shell-rail"]'
    min_width: 91.51
    min_height: 1
    tolerance: 0
    max_width: 92.49
- shell_navigate: sessions
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_not_visible: '[data-testid="session-tree"]'
- assert_element_geometry:
    selector: '[data-testid="sidebar-rail-resize"]'
    min_width: 1
    min_height: 500.01
    tolerance: 0
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: 100
- assert_element_geometry:
    selector: '[data-testid="shell-rail"]'
    min_width: 99.51
    min_height: 1
    tolerance: 0
    max_width: 100.49
- drag_to:
    from: '[data-testid="sidebar-rail-resize"]'
    by:
      dx: -200
- assert_element_geometry:
    selector: '[data-testid="shell-rail"]'
    min_width: 67.51
    min_height: 1
    tolerance: 0
    max_width: 68.49
- press:
    selector: '[data-testid="sidebar-rail-resize"]'
    key: ArrowRight
- assert_element_geometry:
    selector: '[data-testid="shell-rail"]'
    min_width: 71.51
    min_height: 1
    tolerance: 0
    max_width: 72.49
- shell_navigate: tools
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_count:
    selector: '[data-testid="sidebar-rail-resize"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tool-rail-left-resize"]'
    equal: 0
- right_click: '[data-testid="code-workspace-bottom-tab-problems"]'
- assert_count:
    selector: '[data-testid="sidebar-rail-menu-show-names"]'
    equal: 0
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- assert_text_equals:

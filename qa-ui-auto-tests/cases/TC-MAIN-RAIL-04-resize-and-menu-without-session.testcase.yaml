    selector: '[data-testid="shell-rail"]'
    min_width: 83.51
    min_height: 1
    tolerance: 0
    max_width: 84.49
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- screenshot: main-rail-restored.png
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-tool-rail-right-resize"]'
- press:
    selector: '[data-testid="code-workspace-tool-rail-right-resize"]'
    key: End
- assert_element_geometry:
    selector: '[data-testid="code-workspace-tool-rail-right"]'
    min_width: 100
    max_width: 100
    min_height: 32
    tolerance: 0.5
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"rightWidth":100'
- assert_count:
    selector: '[data-testid="code-workspace-tool-rail-left-resize"]'
    equal: 0

    equals: ''
- right_click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- click: '[data-testid="shell-rail-home"]'
- assert_element_geometry:
    selector: '[data-testid="shell-rail"]'

    expect_truthy: true
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="sidebar-rail-resize"]'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 80
    expect_truthy: true
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- screenshot: main-rail-welcome-restored.png
- click: '[data-testid="side-tab-tools"]:visible'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="sidebar-tool-window-rail"]'
- press:
    selector: '[data-testid="sidebar-rail-resize"]'
    key: ArrowLeft
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"leftWidth":76'
- eval_readonly:
    expression: document.querySelector('[data-show-names]').getBoundingClientRect().width === 76
    expect_truthy: true
- screenshot: main-rail-standalone-workspace.png

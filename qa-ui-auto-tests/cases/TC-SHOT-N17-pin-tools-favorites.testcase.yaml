id: TC-SHOT-N17
title: The real pin remains above other windows and moves with OS drag. Zoom changes actual dimensions, opacity reveals desktop pixels,
  64px collapse restores geometry and opacity, public Copy/Save retain original pixels, and a persistent favorite reopens after temporary
  artifacts are deleted with the pin note preserved. Independent options and a resizable editor support Done replacement, new pin and copy only.
covers:
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario:
    scenario: pin-tools
- assert_visible: '[data-testid="system-screenshot"]'
native_platforms:
- Linux
- Windows
- macOS
verification:
  review: reviewed
  requirements:
  - id: workflow
    requirement: The real pin remains above other windows and moves with OS drag. Zoom changes actual dimensions, opacity reveals desktop
      pixels, 64px collapse restores geometry and opacity, public Copy/Save retain original pixels. A note written through the pin menu
      is stored on the persistent favorite, and reopening the favorite after temporary artifacts are deleted shows the same note.
      Options use an independent window. The editor is resizable. Done replacement updates only the original pin and preserves its note;
      new pin retains the original and creates annotated pixels; copy only retains the original pin. Every branch writes the same annotated pixels to the OS clipboard.
    actions:
    - 1
    - 3
    checkpoints:
    - step: 3
      expectation: 'native_screenshot_scenario: {''scenario'': ''pin-tools''}'
    - step: 4
      expectation: 'assert_visible: [data-testid="system-screenshot"]'
    results:
    - 3
    - 4
  visual:
  - check: Visible controls, state and image dimensions
    method: automated
    reason: Assertions check actual renderer state and output; screenshots are retained.
  native:
  - check: OS input, clipboard, windows and persistent files
    method: automated
    reason: Native fixed scenarios verify actual OS geometry including the 64x64 logical compact window, real desktop opacity matching the original-image/background blend without extra shadow darkening, and independent original pixels. Save uses the OS dialog and exact destination, with US physical shortcut keycodes on hosted macOS. Windows input waits for the QA-owned save dialog and its default filename edit to gain focus. macOS checks actual AX focus in the QA process tree before typing and waits for the Go to Folder field. It enters the whole directory through the system clipboard and physical Command+V, restores the previously checked pin image, verifies both field values and the return to the save panel, then waits for stable enabled Save button bounds and confirms through an OS mouse click. Native state, input stages and wait time are recorded; no dialog mock substitutes for the native save.

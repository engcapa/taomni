  - check: Actual native IPC, provider and relevant disk boundaries
    method: automated
    reason: 'Three real requests: cite an isolated workspace, then reject and approve actual assistant file proposals.
      Independent disk bytes and native undo are required. Browser stubs cannot establish these results.'

  visual:
  - check: Tab bar, servers tab panel, and native blocked dialog render in the main WebView on Linux, Windows, and macOS.
    method: not-applicable
    reason: UI placement is checked live across both native processes by DOM and layout visibility assertions rather than baseline image diffing.
  native:
  - check: Two concurrent QA Taomni processes share the isolated app data root with separate WebView profiles so ModuleLock OS handle contention and crash recovery run on Linux, Windows, and macOS.
    method: automated
    reason: Executed natively by servers_multi_instance_probe against two live packaged Taomni instances on each platform.

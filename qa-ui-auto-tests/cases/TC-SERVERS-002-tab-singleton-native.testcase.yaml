id: TC-SERVERS-002-tab-singleton-native
title: Native Local servers enforces single tab in main window and across OS processes
description: >-
  Native boundary required: verifies real Tauri ModuleLock filesystem/handle lock
  semantics across two concurrent packaged Taomni processes sharing the app data
  root (Linux, Windows, macOS). Proves Tools sidebar and Global Command Palette
  open Local servers in a single main-window tab (no detached OS window, no
  ?servers=main navigation), disable tab Duplicate, preserve unsaved edits across
  tab switches and revert them on Discard, block competing OS instances
  symmetrically with servers-blocked-dialog until release or exit, and release cleanly
  across ?servers=main and / route navigation.
covers:
- F-Servers-1
tags:
- servers
- regression
modes:
- native
native_platforms:
- Linux
- Windows
- macOS
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 30
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tool-servers"]'
- click: '[data-testid="sidebar-tool-servers"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 20
- assert_visible: '[data-testid="tab-bar"]'
- assert_visible: '[data-testid="servers-tab-panel"]'
- eval_readonly:
    expression: "document.querySelectorAll('[data-tab-type'+String.fromCharCode(61)+'\"servers\"]').length === 1 && !window.location.search.includes('servers')"
    expect_truthy: true
- right_click: '[data-testid="tab-item"][data-tab-type="servers"]'
- wait_for: '[data-testid="tab-context-duplicate"]'
- assert_disabled: '[data-testid="tab-context-duplicate"]'
- press: Escape
- wait_for:
    selector: '[data-testid="tab-context-duplicate"]'
    state: detached
    timeout_sec: 5
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="sidebar-tool-servers"]'
- wait_for: '[data-testid="servers-dialog"]'
- eval_readonly:
    expression: "document.querySelectorAll('[data-tab-type'+String.fromCharCode(61)+'\"servers\"]').length === 1"
    expect_truthy: true
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="global-search-trigger"]'
- wait_for: '[data-testid="global-search-modal"]'
- fill:
    selector: '[data-testid="global-search-input"]'
    value: Local servers
- click: '[data-testid="global-search-result"][data-result-id="servers"]'
- wait_for: '[data-testid="servers-dialog"]'
- eval_readonly:
    expression: "document.querySelectorAll('[data-tab-type'+String.fromCharCode(61)+'\"servers\"]').length === 1"
    expect_truthy: true
- click: '[data-testid="server-row-ssh"]'
- wait_for: '[data-testid="server-field-port"]'
- fill:
    selector: '[data-testid="server-field-port"]'
    value: '2229'
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="tab-item"][data-tab-type="servers"]'
- wait_for: '[data-testid="servers-dialog"]'
- assert_attribute:
    selector: '[data-testid="server-field-port"]'
    name: value
    equals: '2229'
- click: '[data-testid="servers-dialog-cancel"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_visible: '[data-testid="servers-dialog"]'
- assert_attribute:
    selector: '[data-testid="server-field-port"]'
    name: value
    equals: '2229'
- click: '[data-testid="servers-dialog-cancel"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    state: detached
    timeout_sec: 10
- assert_visible: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tool-servers"]'
- click: '[data-testid="sidebar-tool-servers"]'
- wait_for: '[data-testid="servers-dialog"]'
- click: '[data-testid="server-row-ssh"]'
- assert_attribute:
    selector: '[data-testid="server-field-port"]'
    name: value
    equals: '22'
- servers_multi_instance_probe: {}
- open_route: ?servers=main
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 30
- assert_visible: '[data-testid="servers-tab-panel"]'
- eval_readonly:
    expression: "document.querySelectorAll('[data-tab-type'+String.fromCharCode(61)+'\"servers\"]').length === 1"
    expect_truthy: true
- open_route: /
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 30
- eval_readonly:
    expression: "document.querySelectorAll('[data-tab-type'+String.fromCharCode(61)+'\"servers\"]').length === 0"
    expect_truthy: true
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tool-servers"]'
- click: '[data-testid="sidebar-tool-servers"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 20
- assert_not_visible: '[data-testid="servers-blocked-dialog"]'
- eval_readonly:
    expression: "document.querySelectorAll('[data-tab-type'+String.fromCharCode(61)+'\"servers\"]').length === 1"
    expect_truthy: true
- click: '[data-testid="servers-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    state: detached
    timeout_sec: 10
- assert_visible: '[data-testid="welcome-panel"]'
- assert_no_runtime_errors: null

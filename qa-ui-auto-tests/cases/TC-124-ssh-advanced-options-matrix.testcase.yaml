- assert_count:
    selector: '[data-testid="session-ssh-browser-type"]:is(select)'
    equal: 0
- assert_attribute:
    selector: input[aria-label="Execute command"]
    name: value
    equals: printf 'qa-advanced-command\n'
- assert_attribute:
    selector: '[data-testid="session-do-not-exit"]'
    name: data-checked
    equals: 'false'
- assert_count:
    selector: '[data-testid="session-auth-privatekey"]:checked'
    equal: 1
- assert_attribute:
    selector: input[aria-label="Private key path"]
    name: value
    equals: /home/qauser/.ssh/id_ed25519
- screenshot: 124-ssh-advanced-options-matrix.png

id: TC-124
title: SSH advanced options matrix persists remote environment, fixed SFTP browser, and authentication
covers:
- F6.3
tags:
- ssh
- session
- settings
- advanced
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:

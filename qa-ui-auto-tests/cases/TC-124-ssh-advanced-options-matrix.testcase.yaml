id: TC-124
title: SSH advanced options matrix persists remote environment, browser mode, and authentication
covers:
- F6.3
tags:
- ssh
- session
- settings
- advanced
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-advanced-matrix.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-advanced-user
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    label: Interactive shell
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    label: LXDE / LXQt desktop
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    label: Xfce desktop
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    label: GNOME desktop
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    label: KDE Plasma desktop
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    label: Awesome WM
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    label: Custom command…
- assert_attribute:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    name: value
    equals: Custom command…
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(10) select'
    label: SFTP protocol (recommended)
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(10) select'
    label: SCP (enhanced speed)
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(10) select'
    label: SCP (compatibility)
- select_option:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(10) select'
    label: Disabled
- assert_attribute:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(10) select'
    name: value
    equals: Disabled
- fill:
    selector: 'input[aria-label="Execute command"]'
    value: printf 'qa-advanced-command\n'
- set_check:
    selector: 'label:has-text("Do not exit after command ends") input[type="checkbox"]'
    checked: false
- assert_attribute:
    selector: 'label:has-text("Do not exit after command ends") input[type="checkbox"]'
    name: data-checked
    equals: 'false'
- click: 'label:has-text("Use private key") input[type="radio"]'
- assert_enabled: 'input[aria-label="Private key path"]'
- fill:
    selector: 'input[aria-label="Private key path"]'
    value: /home/qauser/.ssh/id_ed25519
- click: 'label:has-text("ssh-agent / Pageant") input[type="radio"]'
- assert_disabled: 'input[aria-label="Private key path"]'
- click: 'label:has-text("GSSAPI (Kerberos)") input[type="radio"]'
- assert_count:
    selector: 'label:has-text("GSSAPI (Kerberos)") input[type="radio"]:checked'
    equal: 1
- click: 'label:has-text("Password / keyboard-interactive") input[type="radio"]'
- assert_attribute:
    selector: 'input[aria-label="SSH password"]'
    name: type
    equals: password
- set_check:
    selector: '[data-testid="session-save-in-vault"]'
    checked: false
- click: 'label:has-text("Use private key") input[type="radio"]'
- set_check:
    selector: 'label:has-text("Do not exit after command ends") input[type="checkbox"]'
    checked: false
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-advanced-matrix
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-advanced-matrix"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-advanced-matrix"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(6) select'
    name: value
    equals: Custom command…
- assert_attribute:
    selector: '[data-testid="advanced-ssh-settings"] > div:nth-of-type(10) select'
    name: value
    equals: Disabled
- assert_attribute:
    selector: 'input[aria-label="Execute command"]'
    name: value
    equals: printf 'qa-advanced-command\n'
- assert_attribute:
    selector: 'label:has-text("Do not exit after command ends") input[type="checkbox"]'
    name: data-checked
    equals: 'false'
- assert_count:
    selector: 'label:has-text("Use private key") input[type="radio"]:checked'
    equal: 1
- assert_attribute:
    selector: 'input[aria-label="Private key path"]'
    name: value
    equals: /home/qauser/.ssh/id_ed25519
- screenshot: 124-ssh-advanced-options-matrix.png

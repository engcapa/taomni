id: TC-SHOT-N9
title: Native scroll capture stitches real content without duplication
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- native
- p1
modes:
- native
native_platforms:
- Linux
- Windows
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- wait: 5
# Scroll-capture a region, then verify the stitched image contains real
# scrolled content: at least 2 of 3 vertical thirds must have differing
# average colors (proving the wheel moved, not duplicated frames).
- eval_readonly:
    expression: 'window.__TAURI_INTERNALS__.invoke("screenshot_test_scroll_content", {width: 200, height: 200}).then(JSON.stringify)'
    contains: 'OK differing_thirds='

id: TC-WS-004
title: Rail bottom tools order and the bottom-left floating MFA window
description: v6.1 AC-04 / DEC-03. The primary rail's bottom group renders MFA → Screenshot → Chat → Theme → Language → Settings top-to-bottom. Clicking MFA opens
  the floating authenticator at the bottom-left (left 50px / bottom 30px equivalents) which can be pinned, expanded to the full MFA tab and closed without touching
  the active terminal.
modes:
- browser
- native
covers:
- F5.5
- F27.1
- F-MFA-1
- F-I18n-1
- F-WS-3
tags:
- smoke
- p0
- workspace-redesign
- mfa
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- assert_visible: '[data-testid="rail-mfa-button"]'
- assert_visible: '[data-testid="system-screenshot"]'
- assert_visible: '[data-testid="rail-chat-button"]'
- assert_visible: '[data-testid="theme-cycle"]'
- assert_visible: '[data-testid="language-switcher"]'
- assert_visible: '[data-testid="ribbon-settings"]'
- assert_items:
    selector: '[data-testid="rail-bottom-tools"] [data-testid]'
    attribute: data-testid
    equals:
    - rail-mfa-button
    - system-screenshot
    - system-screenshot-delay-toggle
    - rail-chat-button
    - theme-cycle
    - language-switcher
    - ribbon-settings
- assert_count:
    selector: '[data-testid="control-bar"] [data-testid="system-screenshot"]'
    equal: 0
- assert_count:
    selector: '[data-testid="control-bar"] [data-testid="language-switcher"]'
    equal: 0
- click: '[data-testid="rail-mfa-button"]'
- wait_for: '[data-testid="mfa-floating-window"]'
- assert_visible: '[data-testid="mfa-floating-locked"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"mfa-floating-window"]').getBoundingClientRect().left >= 40 && (window.innerHeight
      - document.querySelector('[data-testid' + String.fromCharCode(61) + '"mfa-floating-window"]').getBoundingClientRect().bottom) <= 80
    expect_truthy: true
- click: '[data-testid="mfa-floating-expand-tab"]'
- wait_for: '[data-testid="mfa-tab"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-ws-004
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-ws-004
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="mfa-empty"]'
    timeout_sec: 30
- click: '[data-testid="rail-mfa-button"]'
- wait_for: '[data-testid="mfa-floating-window"]'
- assert_visible: '[data-testid="mfa-floating-search"]'
- assert_visible: '[data-testid="mfa-floating-pin"]'
- assert_visible: '[data-testid="mfa-floating-drag-handle"]'
- click: '[data-testid="mfa-floating-pin"]'
- assert_attribute:
    selector: '[data-testid="mfa-floating-pin"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="mfa-floating-expand-tab"]'
- wait_for: '[data-testid="mfa-tab"]'
- assert_not_visible: '[data-testid="mfa-floating-window"]'
- click: '[data-testid="rail-mfa-button"]'
- wait_for: '[data-testid="mfa-floating-window"]'
- press: Escape
- assert_not_visible: '[data-testid="mfa-floating-window"]'
- screenshot: ws-004-rail-bottom-and-floating-mfa.png

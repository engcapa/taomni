id: TC-SHELL-B43
title: Navigator retains sessions, JSON import/export, Quick Connect and utility menu routes
description: Workspace Shell renderer and retained workflow evidence. See docs-feature/workspace-shell-ux-redesign-test-cases.md;
  native effects require the paired native cases. Folder selectors use the production canonical display path
  with spaced separators; import inputs retain their portable raw paths.
covers:
- F1.9
- F8.1
- F-Sockscap-1
- F-MFA-1
- F-Servers-1
- F-SHELL-1
- F6.2
- F6.4
- F6.6
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- vault_first_run: qa-shell-tools-password
- shell_navigate: tools

    path: ${fixture.shell_import}
- wait_for: '[data-testid="session-import-preview"]'
- assert_count:
    selector: '[data-testid="session-import-preview-table"] tbody tr'
    equal: 2
- click: '[data-testid="session-import-preview-select-all"]'
- click: '[data-testid="session-import-preview-table"] tr:has-text("SHELL imported") input[type="checkbox"]'
- assert_text:
    selector: '[data-testid="session-import-preview-summary"]'
    contains: 1 of 2
- click: '[data-testid="session-import-preview-confirm"]'
- assert_not_visible: '[data-testid="session-import-preview"]'

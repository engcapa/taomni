- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-sessions"]'
- hover: '[data-testid="menu-export-sessions"]'
- download_file:
    trigger: '[data-testid="export-json"]'
    path: ${fixture.shell_export}
- assert_json_file:
    path: ${fixture.shell_export}
    expect:
      format: taomni.sessions
      schema_version: 1
      security.secrets: excluded
      sessions:
        length_min: 7
        contains: SHELL imported
        excludes: password
      sessions.7:
        exists: false
- assert_count:
    selector: '[data-testid="session-tree-item"]'
    equal: 7
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://
- click: '[data-testid="qc-submit"]'
- assert_not_visible: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://qa@alpha.invalid:22
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- auth: qa-fixture-password
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QUICK_SHELL_READY
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?ms)\A(?!(?:.*?^QUICK_SHELL_READY[ \t]*$){2}).*?^QUICK_SHELL_READY[ \t]*$
- assert_attribute:
    selector: '[data-testid="shell-lane-select"]'
    name: data-lane
    equals: connect
- screenshot: tc-shell-b43.png

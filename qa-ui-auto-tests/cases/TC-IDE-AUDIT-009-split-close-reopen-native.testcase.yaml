id: TC-IDE-AUDIT-009-split-close-reopen-native
title: Same-document split shares one history; close/cancel/discard/reopen/restart semantics
description: "ED-AUDIT-009 A1/A2/A3 native gate case. Enters a disposable fixture workspace\nthrough persisted recents\
  \ and proves the split/close/reopen contract through\nthe packaged app UI:\n\n1. One logical history across split\
  \ leaves (A1): Split Right renders a second\n   editor pane for the same notes.txt buffer. Typing \"SPLIT1\" in\
  \ the new\n   leaf appears in the primary leaf in real time. A single-char edit \"X\"\n   typed in the new leaf\
  \ mirrors to the primary; Ctrl+Z pressed in the new\n   leaf removes it from BOTH leaves; Ctrl+Shift+Z re-applies\
  \ it to BOTH -\n   edit/undo/redo are one shared history while each leaf keeps its own\n   caret/scroll state.\
  \ (The shared ledger records per-keystroke entries, so\n   the undo target is one typed char rather than the whole\
  \ burst.)\n2. Close semantics (A2): Ctrl+S writes the buffer (disk sha proves the exact\n   bytes). Closing the\
  \ non-last leaf's tab needs no confirm, keeps the\n   survivor's text AND its history (undo/redo still work there),\
  \ and never\n   touches the disk. Closing the LAST view while dirty raises the\n   \"Discard unsaved changes\"\
  \ confirm: Cancel is zero effect (buffer intact,\n   tab still open, disk unchanged); Confirm discards without\
  \ any write (disk\n   keeps the last save). Ctrl+Shift+T reopens the tab and the editor reads\n   the CURRENT\
  \ disk bytes (an external host_write_file between close and\n   reopen proves the read is fresh - the discarded\
  \ dirty text is not\n   revived and no write happens during reopen).\n3. Restart read through the persisted layout\
  \ snapshot (A3): reload_window\n   destroys the webview JS context; re-entering the workspace through\n   recents\
  \ restores the session from the localStorage layout snapshot\n   (taomni.codeWorkspace.layout.v2.<workspace-identity>,\
  \ the identity\n   derived from the workspace roots) and re-reads the file from disk. The\n   same-document split\
  \ re-created before the reload comes back as two\n   editor panes - something the recents lastActiveFile alone\
  \ cannot do -\n   proving the snapshot drove the restore. A subsequent unsaved edit is\n   captured by the bounded\
  \ recovery copy\n   (taomni.codeWorkspace.recovery.v1:<workspace-identity>, 400ms debounce);\n   the next reload\
  \ opens the Workspace recovery dialog, and Recover all\n   restores the unsaved buffer text while the disk stays\
  \ untouched.\n\nHighest claim on green: L2 native (Linux), packaged app UI, real webview\nlocalStorage persistence\
  \ and real disk bytes. IDEA comparison (required\nkind) is recorded separately as unrun on this box.\n"
covers:
- F25.1
- F25.5
- F-Confirm-1

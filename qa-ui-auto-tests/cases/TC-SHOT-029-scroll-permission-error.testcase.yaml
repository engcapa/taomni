id: TC-SHOT-029
title: Scroll capture permission error preserves the editor and is closeable
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}?qaScreenshotScrollError=always#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position:
      x: 100
      y: 100
    to_position:
      x: 800
      y: 500
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position:
      x: 160
      y: 160
    to_position:
      x: 260
      y: 240
- click: '[data-testid="screenshot-scroll-capture"]'
- wait_for: '[data-testid="screenshot-scroll-confirm"]'
- click: '[data-testid="screenshot-scroll-start"]'
- assert_visible: '[data-testid="screenshot-scroll-error"]'
- assert_text:
    selector: '[data-testid="screenshot-scroll-error"]'
    contains: Accessibility
- assert_visible: '[data-testid="screenshot-selection"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- screenshot: scroll-permission-error.png
- click: '[data-testid="screenshot-scroll-error-close"]'
- wait_for: '[data-testid="system-screenshot"]'
- open: ${cfg.app.base_url}?qaScreenshotScrollError=always#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- click: '[data-testid="screenshot-scroll-start"]'
- assert_visible: '[data-testid="screenshot-scroll-error"]'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: permission-error
    requirement: Scroll permission failure explains Accessibility remediation and preserves selection/annotation; explicit
      close and Escape both return to main.
    actions:
    - 1
    - 4
    - 5
    - 6
    - 7
    - 9
    - 15
    - 17
    - 19
    - 20
    - 21
    - 23
    checkpoints:
    - step: 10
      expectation: '{''assert_visible'': ''[data-testid="screenshot-scroll-error"]''}'
    - step: 11
      expectation: '{''assert_text'': {''selector'': ''[data-testid="screenshot-scroll-error"]'', ''contains'': ''Accessibility''}}'
    - step: 12
      expectation: '{''assert_visible'': ''[data-testid="screenshot-selection"]''}'
    - step: 13
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="screenshot-annotation-canvas"]'', ''name'': ''data-shapes'',
        ''equals'': ''1''}}'
    - step: 16
      expectation: '{''wait_for'': ''[data-testid="system-screenshot"]''}'
    - step: 22
      expectation: '{''assert_visible'': ''[data-testid="screenshot-scroll-error"]''}'
    - step: 24
      expectation: '{''wait_for'': ''[data-testid="system-screenshot"]''}'
    results:
    - 10
    - 11
    - 12
    - 13
    - 16
    - 22
    - 24
  visual:
  - check: Permission error readability
    method: automated
    reason: Error panel visibility and text are asserted while the selected editor remains visible.
  native:
  - check: Native Accessibility denial
    method: automated
    reason: TC-SHOT-N15 injects denial only inside the isolated debug QA app and exercises the same production permission
      boundary.

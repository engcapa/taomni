id: TC-DB-GRID-002-search-navigation-native
title: Native query-result search navigates virtual cells and respects sort/filter order
description: A real database session returns 240 rows with three distant matching cells. Buttons and actual WebView key events
  navigate, wrap, scroll and preserve row filtering. Cmd/Ctrl+F belongs to the focused results and macOS Cmd+Shift+G moves backward.
  Sort the visible rightmost label header after horizontal navigation. Native validates real query delivery and WebView virtualization; mounted units cover editable and IME ownership.
modes:
- native
covers:
- F-DB-1
tags:
- p1
- regression
- result
fixtures:
- reset_db
- mysql_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-db-grid-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.database.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.database.port}
- fill:
    selector: input[aria-label="Database username"]
    value: ${cfg.database.user}
- fill:
    selector: input[aria-label="Database password"]
    value: ${cfg.database.password}
- fill:
    selector: input[aria-label="Database name"]
    value: ${cfg.database.database}
- click: '[data-testid="db-save-in-vault"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-db-grid
- click: '[data-testid="session-save"]'
- wait_for:
    selector: '[data-testid="vault-setup-pw1"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-db-grid-master
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-db-grid-master
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-db-grid"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-db-grid"]'
- wait_for:
    selector: '[data-testid="db-query-tab"]'
    timeout_sec: 60
- assert_not_visible: '[data-testid="db-connection-error-banner"]'
- wait_for:
    selector: '[data-testid="schema-tree"]'
    timeout_sec: 30
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: WITH RECURSIVE seq(n) AS (SELECT 1 UNION ALL SELECT n+1 FROM seq WHERE n<240) SELECT n AS id, CONCAT('filler-',n) AS c1,
    CONCAT('filler-',n) AS c2, CONCAT('filler-',n) AS c3, CONCAT('filler-',n) AS c4, CONCAT('filler-',n) AS c5, CONCAT('filler-',n)
    AS c6, CONCAT('filler-',n) AS c7, CONCAT('filler-',n) AS c8, CONCAT('filler-',n) AS c9, CONCAT('filler-',n) AS c10, CONCAT('filler-',n)
    AS c11, CONCAT('filler-',n) AS c12, CONCAT('filler-',n) AS c13, CONCAT('filler-',n) AS c14, CONCAT('filler-',n) AS c15, CONCAT('filler-',n)
    AS c16, CONCAT('filler-',n) AS c17, CONCAT('filler-',n) AS c18, IF(n IN(1,151,240),CONCAT('Target-',n),CONCAT('row-',n)) AS
    label FROM seq ORDER BY n;
- click: '[data-testid="db-run-all"]'
- wait_for: '[data-testid="query-result-row"]'
- fill:
    selector: input[aria-label="Search result set"]
    value: target
- assert_text:
    selector: '[data-testid="query-result-search-count"]'
    contains: 1/3
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-1
- click: '[data-testid="query-result-search-next"]'
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-151
- click: '[data-testid="query-result-search-previous"]'
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-1
- click: '[data-testid="query-result-search-next"]'
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-151
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"query-result-grid-scroll"]').scrollTop > 2000 &&
      document.querySelector('[data-testid'+String.fromCharCode(61)+'"query-result-grid-scroll"]').scrollLeft > 0
    expect_truthy: true
- press:
    selector: input[aria-label="Search result set"]
    key: Enter
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-240
- press:
    selector: input[aria-label="Search result set"]
    key: F3
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-1
- press:
    selector: input[aria-label="Search result set"]
    key: Shift+F3
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-240
- click: '[data-testid="query-result-sort-header"][data-column="label"]'
- click: '[data-testid="query-result-sort-header"][data-column="label"]'
- assert_text:
    selector: '[data-testid="query-result-search-count"]'
    contains: 1/3
- click: '[data-testid="query-result-search-next"]'
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-151
- press:
    selector: '[data-testid="query-result-grid-scroll"]'
    key: Control+f
    macos_key: Meta+f
- eval_readonly:
    expression: document.activeElement?.getAttribute("aria-label") === "Search result set"
    expect_truthy: true
- press:
    selector: input[aria-label="Search result set"]
    key: Shift+Enter
    macos_key: Meta+Shift+g
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-240
- click: '[data-testid="query-result-grid"] button[aria-label="Filter rows"]'
- fill:
    selector: '[data-testid="query-result-grid"] input[placeholder="Filter rows"]'
    value: Target-151
- assert_text:
    selector: '[data-testid="query-result-search-count"]'
    contains: 1/1
- assert_text:
    selector: '[data-search-current="true"]'
    contains: Target-151
- fill:
    selector: input[aria-label="Search result set"]
    value: no-match
- assert_text:
    selector: '[data-testid="query-result-search-count"]'
    contains: 0/0
- assert_disabled: '[data-testid="query-result-search-next"]'
- assert_disabled: '[data-testid="query-result-search-previous"]'
- assert_no_runtime_errors: null
- screenshot: result-search-navigation-native.png

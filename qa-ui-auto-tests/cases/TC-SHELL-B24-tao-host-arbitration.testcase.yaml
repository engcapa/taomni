- click: '[data-testid="shell-rail-tao"]'
- assert_not_visible: '[data-testid="shell-host"]'
- click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- wait_for: '[data-testid="shell-host"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_shell_backend:

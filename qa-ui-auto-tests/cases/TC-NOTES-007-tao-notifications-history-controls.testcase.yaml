id: TC-NOTES-007
title: Tao notifications history controls mount without showing history by default
description: 'Verifies the Notifications tab controls for F-TAO-1: the pending-alert inbox

  opens from Tao Hub, historical notifications are not rendered while the

  search box is empty, and the history search, 30/300 retention, and manual

  clear controls are present. State semantics are covered by Vitest.

  '
covers:
- F-TAO-1
tags:
- notes
- tao
- notifications
- history
- p2
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- wait_for: '[data-testid="ai-chat-drawer-ribbon"]'
- click: '[data-testid="ai-chat-drawer-ribbon"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="tao-hub-tab-notifications"]'
- wait_for: '[data-testid="tao-alert-inbox"]'
- assert_visible: '[data-testid="tao-alert-history-search"]'
- assert_visible: '[data-testid="tao-alert-history-limit-30"]'
- assert_visible: '[data-testid="tao-alert-history-limit-300"]'
- assert_visible: '[data-testid="tao-alert-history-clear"]'
- assert_disabled: '[data-testid="tao-alert-history-clear"]'
- assert_not_visible: '[data-testid="tao-alert-history-result"]'
- fill:
    selector: '[data-testid="tao-alert-history-search"]'
    value: qa-no-history-match
- assert_text:
    selector: '[data-testid="tao-alert-inbox"]'
    contains: No matching history
- click: '[data-testid="tao-alert-history-limit-30"]'
- assert_attribute:
    selector: '[data-testid="tao-alert-history-limit-30"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="tao-alert-history-limit-300"]'
- assert_attribute:
    selector: '[data-testid="tao-alert-history-limit-300"]'
    name: aria-pressed
    equals: 'true'
- screenshot: notes-007-notifications-history-controls.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tao notifications history controls mount without showing history by default：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 4
    - 6
    - 14
    - 16
    - 18
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"status-bar\"]"}'
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"ai-chat-drawer-ribbon\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"ai-chat-drawer\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"tao-alert-inbox\"]"}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"tao-alert-history-search\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"tao-alert-history-limit-30\"]"}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"tao-alert-history-limit-300\"]"}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"tao-alert-history-clear\"]"}'
    - step: 12
      expectation: '{"assert_disabled": "[data-testid=\"tao-alert-history-clear\"]"}'
    - step: 13
      expectation: '{"assert_not_visible": "[data-testid=\"tao-alert-history-result\"]"}'
    - step: 15
      expectation: '{"assert_text": {"selector": "[data-testid=\"tao-alert-inbox\"]", "contains": "No matching history"}}'
    - step: 17
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tao-alert-history-limit-30\"]", "name": "aria-pressed",
        "equals": "true"}}'
    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"tao-alert-history-limit-300\"]", "name": "aria-pressed",
        "equals": "true"}}'
    results:
    - 19
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

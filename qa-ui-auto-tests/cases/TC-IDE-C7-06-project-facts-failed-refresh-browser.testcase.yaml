id: TC-IDE-C7-06-project-facts-failed-refresh-browser
title: Project facts failed badge and explicit refresh in browser
description: 'Browser gate case (ED-PROJECT-004 A3). The stub preview has no build

  tooling backend, so production autoFetch must fail closed: the status

  badge renders Facts Failed with an explicit refresh control, and clicking

  refresh re-runs the fetch without crashing or fabricating ready facts.

  The ready path in the packaged runtime is covered by the native

  TC-IDE-C7-04/05 gates; this case pins the browser failure/refresh half.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c7
- project-structure
- facts-cache
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- wait_for:
    selector: '[data-testid="project-facts-status-badge"]'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="project-facts-status-badge"]'
    contains: Facts Failed
    timeout_sec: 30
- assert_visible: '[data-testid="project-facts-failed-icon"]'
- click: '[data-testid="project-facts-refresh-btn"]'
- assert_text:
    selector: '[data-testid="project-facts-status-badge"]'
    contains: Facts Failed
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="code-workspace-tree-file"]'
    contains: README
    timeout_sec: 10
- screenshot: tc-ide-c7-06-facts-failed-refresh.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Project facts failed badge and explicit refresh in browser：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 14
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"]"}'
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"project-facts-status-badge\"]", "timeout_sec": 60}}'
    - step: 12
      expectation: '{"assert_text": {"selector": "[data-testid=\"project-facts-status-badge\"]", "contains": "Facts
        Failed", "timeout_sec": 30}}'
    - step: 13
      expectation: '{"assert_visible": "[data-testid=\"project-facts-failed-icon\"]"}'
    - step: 15
      expectation: '{"assert_text": {"selector": "[data-testid=\"project-facts-status-badge\"]", "contains": "Facts
        Failed", "timeout_sec": 30}}'
    - step: 16
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tree-file\"]", "contains": "README",
        "timeout_sec": 10}}'
    results:
    - 15
    - 16
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

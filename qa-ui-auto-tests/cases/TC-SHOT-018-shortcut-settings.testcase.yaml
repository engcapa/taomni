id: TC-SHOT-018
title: Screenshot shortcut settings record validate disable reset and route the configured
  chord
description: 'Browser shortcut changes are in-memory app-local state, not persisted
  OS-global registration; the capability probe is native-only.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F27.1
- F27.2
tags:
- screenshot
- settings
- shortcut
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: screenshot
- wait_for: '[data-testid="settings-screenshot-shortcut"]'
- assert_text_equals:
    selector: '[data-testid="settings-screenshot-shortcut-status"]'
    equals: Works while this window is focused.
- assert_attribute:
    selector: '[data-testid="system-screenshot"]'
    name: title
    matches: .*(?:Ctrl\+Alt\+A|⌃⌘A).*
- assert_not_visible: '[data-testid="settings-screenshot-probe"]'
- click: '[data-testid="settings-screenshot-shortcut"]'
- assert_attribute:
    selector: '[data-testid="settings-screenshot-shortcut"]'
    name: aria-pressed
    equals: 'true'
- press:
    key: a
    selector: '[data-testid="settings-screenshot-shortcut"]'
- assert_text_equals:
    selector: '[data-testid="settings-screenshot-shortcut-error"]'
    equals: Use at least one of Ctrl, Alt or Cmd (or a function key)
- assert_attribute:
    selector: '[data-testid="settings-screenshot-shortcut"]'
    name: aria-pressed
    equals: 'true'
- press:
    key: Escape
    selector: '[data-testid="settings-screenshot-shortcut"]'
- assert_attribute:
    selector: '[data-testid="settings-screenshot-shortcut"]'
    name: aria-pressed
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="system-screenshot"]'
    name: title
    matches: .*(?:Ctrl\+Alt\+A|⌃⌘A).*
- click: '[data-testid="settings-screenshot-shortcut"]'
- assert_not_visible: '[data-testid="settings-screenshot-shortcut-error"]'
- press:
    key: Control+Alt+k
    selector: '[data-testid="settings-screenshot-shortcut"]'
- assert_attribute:
    selector: '[data-testid="settings-screenshot-shortcut"]'
    name: aria-pressed
    equals: 'false'
- assert_pattern:
    selector: '[data-testid="settings-screenshot-shortcut"]'
    regex: ^(?:Ctrl\+Alt\+K|⌃⌥K)$
- assert_attribute:
    selector: '[data-testid="system-screenshot"]'
    name: title
    matches: .*(?:Ctrl\+Alt\+K|⌃⌥K).*
- assert_not_visible: '[data-testid="screenshot-overlay"]'
- eval_readonly:
    expression: '!JSON.stringify(window.__taomniStubScreenshotCalls || []).includes(''"cmd":"screenshot_open_overlay"'')'
- press:
    key: Control+Alt+A
    macos_key: Control+Meta+A
    selector: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-overlay"]'
- eval_readonly:
    expression: '!JSON.stringify(window.__taomniStubScreenshotCalls || []).includes(''"cmd":"screenshot_open_overlay"'')'
- press:
    key: Control+Alt+k
    selector: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: screenshot
- click: '[data-testid="settings-screenshot-shortcut-disable"]'
- assert_text_equals:
    selector: '[data-testid="settings-screenshot-shortcut"]'
    equals: Disabled
- assert_disabled: '[data-testid="settings-screenshot-shortcut-disable"]'
- assert_text_equals:
    selector: '[data-testid="settings-screenshot-shortcut-status"]'
    equals: The hotkey is off; use the camera button in the title bar.
- assert_attribute:
    selector: '[data-testid="system-screenshot"]'
    name: title
    equals: System screenshot
- press:
    key: Control+Alt+k
    selector: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-overlay"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_open_overlay"').length
      === 2
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: screenshot
- click: '[data-testid="settings-screenshot-shortcut-reset"]'
- assert_text_equals:
    selector: '[data-testid="settings-screenshot-shortcut-status"]'
    equals: Works while this window is focused.
- assert_enabled: '[data-testid="settings-screenshot-shortcut-disable"]'
- assert_attribute:
    selector: '[data-testid="system-screenshot"]'
    name: title
    matches: .*(?:Ctrl\+Alt\+A|⌃⌘A).*
- press:
    key: Control+Alt+A
    macos_key: Control+Meta+A
    selector: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_open_overlay"').length
      === 4
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'

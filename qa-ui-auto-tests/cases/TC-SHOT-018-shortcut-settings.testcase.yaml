  visual:
  - check: Shortcut recording, validation, configured label, disabled label and status.
    method: automated
    reason: Labels and shared tooltip state are asserted rather than assuming button
      clicks applied settings.
  native:
  - check: Global shortcut persistence, OS conflict feedback and actual capability
      probe.
    method: external
    reason: Browser update is intentionally in-memory and app-local; native registration
      and permissions are not verified here.

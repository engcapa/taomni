id: TC-FILE-OPEN-026
title: Mermaid selection controls, distinct download formats and editable sequence/path exports (native)
description: Repeat actual CodeMirror selections and view changes without adding import controls. Download the reported Chinese
  agent sequence and all four diagrams; independently parse XML for editable ungrouped cells, connected messages, activation/loop/numbering,
  straight/stepped/curved paths and viewer transforms. Native additionally validates real chooser and host bytes. Curved edges
  use compact native draw.io connector controls; independent saved-artifact checks reject dense SVG sample handles.
modes:
- native
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p0
- markdown
- drawio
- regression
fixtures:
- reset_db
- markdown_drawio
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-mermaid-regression
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="mermaid-regressions.md"]'
- wait_for: '[data-testid="markdown-editor"]'
- click: '[data-testid="markdown-mode-source"]'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+Home
    macos_key: Meta+ArrowUp
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowRight
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+End
    macos_key: Meta+ArrowDown
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowLeft
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+Home
    macos_key: Meta+ArrowUp
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Shift+ArrowDown
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- assert_count:
    selector: '[data-testid="markdown-export"]'
    equal: 1
- click: '[data-testid="markdown-mode-live"]'
- click: '[data-testid="markdown-mode-split"]'
- wait_for: '[data-testid="markdown-preview"] .fv-md-doc > .fv-md-mermaid:nth-child(2) svg'
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- dblclick: '[data-testid="markdown-preview"] .fv-md-doc > .fv-md-mermaid:nth-child(2)'
- wait_for: '[data-testid="markdown-diagram-viewer"]'
- assert_text:
    selector: '[data-testid="markdown-diagram-view-save-svg"]'
    contains: SVG
- assert_text:
    selector: '[data-testid="markdown-diagram-view-save-png"]'
    contains: PNG
- assert_text:
    selector: '[data-testid="markdown-diagram-view-save-drawio"]'
    contains: draw.io
- eval_readonly:
    expression: document.querySelector(".fv-md-diagram-save .lucide-file-code-2") !== null && document.querySelector(".fv-md-diagram-save
      .lucide-file-image") !== null && document.querySelector(".fv-md-diagram-save .lucide-workflow") !== null
    expect_truthy: true
- screenshot: mermaid-viewer-download-formats.png
- click: '[data-testid="markdown-diagram-view-rotate-right"]'
- click: '[data-testid="markdown-diagram-view-flip-h"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_quality_exports}/sequence.drawio
    trigger: '[data-testid="markdown-diagram-view-save-drawio"]'
- assert_file_contains:
    path: ${fixture.markdown_quality_exports}/sequence.drawio
    contains: rotation=90;flipH=1;
- assert_export_quality:
    kind: drawio
    path: ${fixture.markdown_quality_exports}/sequence.drawio
- click: '[data-testid="markdown-diagram-close"]'
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-drawio"]'
- wait_for: '[data-testid="markdown-drawio-export-settings"]'
- select_option:
    selector: '[data-testid="markdown-drawio-scope"]'
    value: images
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_quality_exports}/mermaid-regressions.drawio
    trigger: '[data-testid="markdown-drawio-save"]'
- wait_for: '[data-testid="markdown-export-status"][data-export-state="saved"]'
- assert_export_quality:
    kind: drawio
    path: ${fixture.markdown_quality_exports}/mermaid-regressions.drawio
- eval_readonly:
    expression: /(?:4.*editable diagrams|4.*可编辑图表).*0.*SVG/.test(document.querySelector(".fv-md-export-notice").textContent)
    expect_truthy: true
- assert_count:
    selector: '[data-testid="markdown-import-drawio"]'
    equal: 1
- assert_no_runtime_errors: null
- screenshot: mermaid-independent-editable-exports.png

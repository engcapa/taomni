    - step: 15
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"expanded-sidebar-panel\"]", "min_width":
        390, "min_height": 200}}'
    - step: 17
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"expanded-sidebar-panel\"]", "min_width":
        420, "min_height": 200}}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61)
        + ''\"workspace-canvas\"]'').getBoundingClientRect().width >= 1300", "expect_truthy": true, "timeout_sec":
        10}}'
    - step: 21
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"workspace-canvas\"]", "min_width":
        1300, "min_height": 200}}'
    - step: 24
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"expanded-sidebar-panel\"]", "min_width":
        420, "min_height": 200}}'
    - step: 27
      expectation: '{"assert_visible": "[data-testid=\"workspace-navigator\"] section:first-of-type [data-testid=\"workspace-row-qa-workspace-main\"]"}'
    - step: 28
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"expanded-sidebar-panel\"]", "min_width":

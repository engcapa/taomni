  visual:
  - check: Inspect input width, reference actions and canvas spacing after the navigator is widened.
    method: manual
    reason: Geometry does not establish visual balance.
  native:
  - check: Renderer-only interactions; durable native workspace records use TC-WS-NATIVE-001.
    method: external
    reason: This case does not certify native storage.

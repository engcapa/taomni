    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"workspace-navigator\"] section:nth-of-type(2) [data-testid=\"workspace-row-qa-workspace-main\"]"}'
    - step: 32
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-header\"]", "contains": "Workspace \u00b7
        QA Main"}}'
    - step: 35
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61)
        + ''\"workspace-canvas\"]'').getBoundingClientRect().width >= 1300", "expect_truthy": true, "timeout_sec":
        10}}'
    - step: 40
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"expanded-sidebar-panel\"]", "min_width":
        420, "min_height": 200}}'
    results:

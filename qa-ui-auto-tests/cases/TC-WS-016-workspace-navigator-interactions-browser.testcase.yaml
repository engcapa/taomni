    - step: 6
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-row-qa-workspace-main\"]", "equal":
        0}}'
    - step: 8
      expectation: '{"assert_count": {"selector": "[data-testid^=\"workspace-row-\"]", "equal": 0}}'
    - step: 13

id: TC-MODULES-056
title: The signed RDP client keeps its saved session through disable and reconnect
description: >-
  Install the matching signed package and open a saved session against the
  runner's local Taomni RDP server. Confirm its certificate and deliver a click
  to the host. Disable the client module, verify the server accepts another
  connection, and re-enable the module. The same tab must reconnect without
  another certificate confirmation and deliver a second click. A separate
  session without a configured RD Gateway username shows the gateway validation error.
  The migration imports legacy pins and records the new pin in the module database.
  The reconnected signed viewer also measures the input-to-decoded-frame delay.
  The saved session then reconnects in a detached WebView and back in the original window.
covers: [F-Modules-1, F9.7, F-RdpServer-1, F-Detach-1]
tags: [modules, rdp-client, rdp-server, lifecycle, native-boundary, p1]
modes: [native]
fixtures: [reset_db, module_upgrade, module_signed_rdp_archive, rdp_server_required, system_rdp_running, release_build_required]
timeout_sec: 420

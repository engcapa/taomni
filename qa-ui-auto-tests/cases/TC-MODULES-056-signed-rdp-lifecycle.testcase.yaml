verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The native app loads the matching signed RDP client, authenticates and sends input to the real server.
    actions: [4, 5, 6, 8, 20, 31, 36, 41, 44, 46, 48, 50]
    checkpoints:
    - {step: 7, expectation: The normal offline control accepts the signed package.}
    - {step: 47, expectation: The loaded renderer URL identifies the installed module version.}
    - {step: 49, expectation: The signed client reaches CredSSP/NLA connected state.}
    - {step: 51, expectation: The native host target observes the first click.}
    results: [7, 47, 49, 51]
  - id: R2
    requirement: Disabling releases the connection and enabling restores the existing tab and already accepted certificate.
    actions: [55, 57, 58, 59, 63, 64, 66, 67, 68, 71, 74]
    checkpoints:
    - {step: 60, expectation: The original tab identifies the disabled module.}
    - {step: 61, expectation: No module framebuffer remains after disable.}
    - {step: 62, expectation: The single-client server accepts a new independent connection.}
    - {step: 69, expectation: The same saved session occupies one tab after enabling.}
    - {step: 73, expectation: The second connection did not require renewed certificate approval.}
    - {step: 75, expectation: A second click reaches the same host target after enabling.}
    - {step: 76, expectation: Forty target clicks yield at least 36 measured signed viewer frames and a p95 at or below 130 ms.}
    - {step: 77, expectation: The native renderer has no uncaught runtime errors.}
    results: [60, 61, 62, 69, 73, 75, 76, 77]
  - id: detached-signed-viewer
    requirement: The separate WebView and the reattached tab reconnect through the same signed RDP renderer and retained certificate.
    actions: [78, 79, 80, 86, 89]
    checkpoints:
    - {step: 81, expectation: The detached WebView loads the exact installed signed frontend path.}
    - {step: 83, expectation: The detached WebView paints a frame from the real RDP server.}
    - {step: 84, expectation: The existing pin avoids a new certificate prompt in the separate window.}
    - {step: 85, expectation: The separate viewer has no uncaught renderer errors.}
    - {step: 87, expectation: The reattached tab loads the same signed frontend.}
    - {step: 88, expectation: Reattachment restores exactly one RDP tab in the original window.}
    - {step: 91, expectation: The reattached tab paints frames from the same saved session.}
    - {step: 92, expectation: The returning tab still accepts the original pin.}
    - {step: 93, expectation: The detachment lifecycle leaves the original renderer healthy.}
    results: [81, 83, 84, 85, 87, 88, 91, 92, 93]
  - id: R3
    requirement: The signed viewer reports an invalid gateway using its normal connection workflow.
    actions: [94, 95, 96, 97, 99, 100, 101, 102, 105, 106, 108, 109]
    checkpoints:
    - {step: 110, expectation: The signed renderer shows the missing gateway username error.}
    - {step: 111, expectation: The gateway validation produces no uncaught renderer errors.}
    results: [110, 111]
  - id: R4
    requirement: A signed installation imports old certificate decisions and records newly accepted certificates in the module store.
    actions: [6, 8, 46]
    checkpoints:
    - {step: 112, expectation: "The native profile preserves the legacy rows and contains the import receipt and the new module-owned pin."}
    results: [112]
  - id: retained-rdp-sessions
    requirement: Upgrading with a verified RDP viewer records the existing core sessions and keeps VNC pending.
    actions: [113, 114, 116]
    checkpoints:
    - {step: 118, expectation: The refreshed recommendations include the missing VNC viewer and omit the verified RDP viewer.}
    - {step: 119, expectation: The original RDP session and committed pin import are preserved in their respective stores.}
    - {step: 120, expectation: The refreshed upgrade view has no runtime errors.}
    results: [118, 119, 120]
  visual:
  - check: The signed viewer and the disabled state appear in the saved tab.
    method: automated
    reason: The case checks the loaded renderer URL and the visible lifecycle state.
  native:
  - check: Exercise a signed package and live RDP input against the desktop application's own server.
    method: automated
    reason: The browser preview cannot exercise the native module process, verified artifact or RDP negotiation.

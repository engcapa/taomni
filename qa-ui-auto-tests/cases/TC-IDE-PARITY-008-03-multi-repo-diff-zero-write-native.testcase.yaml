    - step: 30
      expectation: '{assert_text: {contains: ''HEAD ${fixture.parity008_repo_b_head7}'', selector: ''[data-testid="workspace-diff-old-label"]''}}'
    - step: 31
      expectation: '{assert_pattern: {regex: ''(?s)^(?!.*repo-a).*repo-b HEAD.*repo-b WORKTREE'', selector: ''[data-testid="git-diff-viewer"]''}}'

  requirements:
  - id: ED-PARITY-008-N1
    requirement: 真实 Git IPC 下两仓库状态与 HEAD/INDEX/WORKTREE 内容、HEAD 短 oid、1/3→3/3 与 manifest 一致且不串仓库。
    actions:
    - 8
    - 15
    - 18
    - 24
    - 26
    checkpoints:
    - step: 17
      expectation: '{assert_items: {attribute: aria-label, equals: [repo-a same.txt Staged, repo-a untracked.txt
        Untracked, repo-b same.txt Modified], selector: ''[data-testid="workspace-change-row"]''}}'
    - step: 19
      expectation: '{wait_for: {selector: ''[data-testid="git-diff-viewer"][data-repo-root$="repo-a"][data-path="same.txt"]'',
        timeout_sec: 30}}'
    - step: 20

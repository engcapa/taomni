        ''[data-testid="git-diff-viewer"]''}}'
    - step: 27
      expectation: '{wait_for: {selector: ''[data-testid="git-diff-viewer"][data-repo-root$="repo-b"][data-path="same.txt"]'',
        timeout_sec: 30}}'
    - step: 28

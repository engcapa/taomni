    state: visible
    timeout_sec: 45
- assert_count:
    selector: '[data-testid="ai-chat-safety-gate"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="ai-chat-safety-gate"]'
    name: data-queue-length
    equals: '1'
- screenshot: native-closed-owner-fallback-card.png
- click: '[data-testid="ai-chat-cc-permission-allow"]'
- wait_for:
    selector: '[data-testid="ai-chat-safety-gate"]'

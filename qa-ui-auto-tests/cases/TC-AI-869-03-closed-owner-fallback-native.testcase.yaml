id: TC-AI-869-03-closed-owner-fallback-native
title: Closing the approval owner window still delivers the next prompt to the main window
description: 'Issue #869 native regression for the window-closed fallback. A detached terminal window owns the thread and its approval card; the window is then reattached (destroyed). The backend must forget that window''s routing as soon as it is destroyed, so the next request falls back to a broadcast that the main window shows and can decide. macOS is excluded because its WKWebView automation bridge cannot reliably deliver the in-page Reattach click that destroys the window; that platform gap is recorded rather than asserted unreliably.'
covers:
- F-AI-2.4
- F6.3
tags:
- ai
- approval
- window
- native-gate
- regression
- p1
modes:
- native
native_platforms:
- Linux
- Windows
fixtures:
- reset_db
timeout_sec: 300

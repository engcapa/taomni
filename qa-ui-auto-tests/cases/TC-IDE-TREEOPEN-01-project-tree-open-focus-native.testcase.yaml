        "bbbab91a4e4ea594b1e2207721999dc375ac98c30c5960cfbbf1329a441aa01a"}}'
    - step: 40
      expectation: '{"assert_menu_items": ["Open", "Rename...", "Delete"]}'
    - step: 43
      expectation: '{"assert_not_visible": "[data-testid=\"context-menu\"]"}'
    - step: 44
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"src/main/example.txt\"]",
        "name": "aria-selected", "equals": "true"}}'
    - step: 45
      expectation: '{"eval_readonly": {"expression": "document.activeElement?.getAttribute(''data-path'') === ''src/main/example.txt''"}}'
    - step: 46
      expectation: '{"assert_file_sha256": {"path": "${fixture.project_tree_root}/src/main/example.txt", "equals":

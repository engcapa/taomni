        "name": "aria-selected", "equals": "true"}}'
    - step: 21
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"src/main/example.txt\"]"}'
    - step: 23
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"src/main/example.txt\"]",
        "name": "aria-selected", "equals": "true"}}'
    - step: 24
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"] [data-editor-tab-key]",
        "equal": 1}}'
    - step: 27

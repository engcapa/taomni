id: TC-DB-EXEC-003-dangerous-confirm-native
title: Native DROP confirmation keeps the table on Cancel and drops it on Execute
description: 'DB-EXEC-003 V5. Creates a scratch table on a real MySQL/MariaDB session, runs

  DROP TABLE and cancels the confirmation, proves the table still answers a

  SELECT, then runs DROP again with Execute and proves a follow-up SELECT fails.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks;
  Settings uses its permanent Rail button. Original business checks are retained.'
covers:
- F-DB-1
tags:
- database
- sql
- dangerous-statement
- db-parity
- native-boundary
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- mysql_required
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-db-exec-danger-password
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.database.host}
- fill:

id: TC-056
title: Tunnel editor supports Remote and Dynamic types and clones tunnels
covers:
- F8.2
tags:
- dynamic
- editor
- legacy-imported
- p1
- remote
- tunnel
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="app-main-menu"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-tunneling"]'
- wait_for: '[data-testid="tunnel-manager"]'
- click: '[data-testid="tunnel-new"]'
- wait_for: '[data-testid="tunnel-editor"]'
- fill:
    selector: input[placeholder="e.g. postgres-replica"]
    value: qa-ui-auto-remote-tunnel
- fill:
    selector: input[placeholder="ssh.example.com"]
    value: ${cfg.ssh.host}
- fill:
    selector: input[placeholder="user"]
    value: ${cfg.ssh.user}
- fill:
    selector: input[placeholder="22"]
    value: ${cfg.ssh.port}
- click: label:has-text("Remote port forwarding") input[type="radio"]
- wait: 1
- fill:
    selector: input[placeholder="0"]
    value: '19222'
- fill:
    selector: input[placeholder="127.0.0.1"]
    value: 127.0.0.1
- fill:
    selector: input[placeholder="5432"]
    value: '8080'
- click: '[data-testid="tunnel-editor-save"]'
- wait: 1
- wait_for: '[data-testid="tunnel-manager"] >> text="qa-ui-auto-remote-tunnel"'
- assert_visible: '[data-testid="tunnel-manager"] >> text="Remote"'
- click: '[data-testid="tunnel-manager"] tr:has-text("qa-ui-auto-remote-tunnel") button[title="Clone"]'
- wait: 1
- wait_for: '[data-testid="tunnel-manager"] >> text="qa-ui-auto-remote-tunnel (copy)"'
- click: '[data-testid="tunnel-manager"] tr:has-text("qa-ui-auto-remote-tunnel (copy)") button[title="Edit"]'
- wait: 1
- click: label:has-text("Dynamic port forwarding (SOCKS proxy)") input[type="radio"]
- wait: 1
- click: '[data-testid="tunnel-editor-save"]'
- wait: 1
- wait_for: '[data-testid="tunnel-manager"] >> text="Dynamic"'
- seed_dialog:
    confirm: true
- wait: 1
- screenshot: 056-tunnel-remote-dynamic-clone.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tunnel editor supports Remote and Dynamic types and clones tunnels：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 4
    - 5
    - 7
    - 9
    - 10
    - 11
    - 12
    - 13
    - 15
    - 16
    - 17
    - 18
    - 22
    - 25
    - 27
    - 29
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"app-main-menu\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"tunnel-manager\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"tunnel-editor\"]"}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"tunnel-manager\"] >> text=\"qa-ui-auto-remote-tunnel\""}'
    - step: 21
      expectation: '{"assert_visible": "[data-testid=\"tunnel-manager\"] >> text=\"Remote\""}'
    - step: 24
      expectation: '{"wait_for": "[data-testid=\"tunnel-manager\"] >> text=\"qa-ui-auto-remote-tunnel (copy)\""}'
    - step: 31
      expectation: '{"wait_for": "[data-testid=\"tunnel-manager\"] >> text=\"Dynamic\""}'
    results:
    - 31
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-IDE-PARITY-010-01
title: 'IDEA tool window rails: stripe buttons, side + bottom windows, hide and Alt+number'
description: 'ED-PARITY-010 A2/A4 browser case: the workspace edges carry IDEA tool window stripes. Bottom tools (Problems, Terminal, Run, …) are rail buttons that show/hide the bottom window, whose header shows the tool title and a hide (—) button returning focus to the editor. Project stays open next to a bottom window; Structure toggles on the right rail; More tool windows lists every bottom tool.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-010
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- assert_visible: '[data-testid="code-workspace-tool-rail-left"]'
- assert_visible: '[data-testid="code-workspace-tool-rail-right"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-tool-rail-project"]'
    name: aria-pressed
    equals: 'true'
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tool-rail-left\"]")?.contains(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-bottom-tab-problems\"]")) === true
    expect_truthy: true
- click: '[data-testid="code-workspace-bottom-tab-problems"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open]'
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="code-workspace-bottom-tab-problems"]'
    name: aria-pressed
    equals: 'true'
- assert_text:
    selector: '[data-testid="code-workspace-tool-window-title"]'
    contains: Problems
- assert_attribute:
    selector: '[data-testid="code-workspace-tool-rail-project"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="code-workspace-bottom-tab-terminal"]'
- assert_text:
    selector: '[data-testid="code-workspace-tool-window-title"]'
    contains: Terminal
- assert_attribute:
    selector: '[data-testid="code-workspace-bottom-tab-problems"]'
    name: aria-pressed
    equals: 'false'
- click: '[data-testid="code-workspace-tool-window-hide"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open]'
    state: detached
    timeout_sec: 5
- eval_readonly:
    expression: document.activeElement?.classList?.contains("cm-content") === true
    expect_truthy: true
- press: Alt+4
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open]'
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="code-workspace-bottom-tab-run"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="code-workspace-bottom-tab-run"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open]'
    state: detached
    timeout_sec: 5
- click: '[data-testid="code-workspace-tool-rail-structure"]'
- assert_visible: '[data-testid="code-workspace-left-tool-area"] [data-testid="code-workspace-tool-window-structure"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-tool-rail-structure"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="code-workspace-tool-rail-structure"]'
- assert_not_visible: '[data-testid="code-workspace-tool-window-structure"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-tool-rail-project"]'
    name: aria-pressed
    equals: 'false'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_visible: '[data-testid="code-workspace-tree-add-folder"]'
- click: '[data-testid="code-workspace-bottom-tab-overflow"]'
- assert_visible: '[data-testid="code-workspace-bottom-tab-overflow-problems"]'
- click: '[data-testid="code-workspace-bottom-tab-overflow-problems"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-tool-window-title"]'
    contains: Problems
- screenshot: tc-ide-parity-010-01-rails.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A4：左右 tool rail 存在，底部工具按钮位于左 rail，Project 默认按下。
    actions:
    - 1
    checkpoints:
    - step: 13
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 14
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tool-rail-right\"]"}'
    - step: 15
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tool-rail-project\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 16
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\"[data-testid\" + String.fromCharCode(61) + \"\\\"code-workspace-tool-rail-left\\\"]\")?.contains(document.querySelector(\"[data-testid\" + String.fromCharCode(61) + \"\\\"code-workspace-bottom-tab-problems\\\"]\")) === true", "expect_truthy": true}}'
    results:
    - 13
    - 14
    - 16
  - id: R2
    requirement: A2/A4：rail 打开 Problems，工具窗头显示标题；Project 与底部工具窗同时打开；切换 Terminal 后选中态转移。
    actions:
    - 17
    - 22
    checkpoints:
    - step: 18
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-bottom-dock\"][data-open]", "timeout_sec": 10}}'
    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-bottom-tab-problems\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 20
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tool-window-title\"]", "contains": "Problems"}}'
    - step: 21
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tool-rail-project\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 23
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tool-window-title\"]", "contains": "Terminal"}}'
    - step: 24
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-bottom-tab-problems\"]", "name": "aria-pressed", "equals": "false"}}'
    results:
    - 19
    - 21
    - 23
    - 24
  - id: R3
    requirement: A2：— 隐藏工具窗并把焦点交回编辑器；Alt+4 打开 Run 并高亮，再点其 rail 按钮隐藏。
    actions:
    - 25
    - 28
    - 31
    checkpoints:
    - step: 26
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-bottom-dock\"][data-open]", "state": "detached", "timeout_sec": 5}}'
    - step: 27
      expectation: '{"eval_readonly": {"expression": "document.activeElement?.classList?.contains(\"cm-content\") === true", "expect_truthy": true}}'
    - step: 30
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-bottom-tab-run\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 32
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-bottom-dock\"][data-open]", "state": "detached", "timeout_sec": 5}}'
    results:
    - 27
    - 30
    - 32
  - id: R4
    requirement: A4：Structure（IDEA 默认 Left Bottom，Project 下方分屏）与 Project 按 IDEA 切换显隐；More tool windows 列出全部工具窗。
    actions:
    - 33
    - 38
    - 40
    - 42
    - 44
    checkpoints:
    - step: 34
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-left-tool-area\"] [data-testid=\"code-workspace-tool-window-structure\"]"}'
    - step: 35
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tool-rail-structure\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 37
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tool-window-structure\"]"}'
    - step: 39
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-tool-rail-project\"]", "name": "aria-pressed", "equals": "false"}}'
    - step: 41
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-add-folder\"]"}'
    - step: 43
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-bottom-tab-overflow-problems\"]"}'
    - step: 46
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-tool-window-title\"]", "contains": "Problems"}}'
    results:
    - 35
    - 37
    - 39
    - 41
    - 43
    - 46
  visual:
  - check: rail 图标/标签截断与选中蓝底需人工对照 IDEA idea-01-shell。
    method: manual
    reason: 像素与字体按 DEC-ALIGN-06 profile 另行比较。
  native:
  - check: 打包 WebView 中的 rail/工具窗由 TC-IDE-PARITY-010-04 覆盖。
    method: external
    reason: browser 不经过打包 WebView。

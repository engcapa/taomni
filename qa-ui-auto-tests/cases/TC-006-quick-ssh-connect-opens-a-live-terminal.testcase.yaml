id: TC-006
title: Quick SSH connect opens a live terminal
covers: [F6.4, F3.1]
tags: [legacy-imported, p0, quickconnect, ssh, terminal]
modes: [browser, native]
fixtures: [reset_db, ssh_required]
steps:
  - open: "${cfg.app.base_url}"
  # Reveal the QuickConnect bar without the in-bar app menu: that menu is
  # hidden on native macOS by design (native global menu). Seeding the
  # persisted visibility flag and reloading selects the same UI on all three
  # platforms; Menu-path coverage stays in the browser-only cases.
  - seed_storage:
      key: taomni.quickConnectVisible
      value: 'true'
  - reload_window: null
  - wait_for: '[data-testid="qc-input"]'
  - fill: {selector: "[data-testid=\"qc-input\"]", value: "ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}"}
  - click: "[data-testid=\"qc-submit\"]"
  - wait_for: "[data-testid=\"auth-prompt\"]"
  - fill: {selector: "[data-testid=\"auth-password\"]", value: "${env.QA_SSH_PASSWORD}"}
  - click: "[data-testid=\"auth-submit\"]"
  - wait_for: "[data-testid=\"terminal-pane\"]"
  - wait_for:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
      timeout_sec: 20
  # The Windows SSH fixture launches Git Bash, which clears the pre-session
  # info banner after connecting. The command/output pair below is the live
  # session assertion and is stable across all browser hosts.
  - type:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
      text: "printf 'qa-quick-ssh-live\\n'"
  - press: Enter
  - wait: 1
  - assert_text: {selector: "[data-testid=\"terminal-pane\"]", contains: qa-quick-ssh-live}
  - screenshot: 006-quick-ssh-terminal.png

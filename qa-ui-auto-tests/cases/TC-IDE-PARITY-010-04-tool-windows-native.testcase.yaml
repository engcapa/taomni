id: TC-IDE-PARITY-010-04-tool-windows-native
title: Native tool window rail keeps the terminal session across hide/show
description: "ED-PARITY-010 A2/A3 native case: in the isolated QA app the Terminal rail button opens a real PTY;\
  \ hiding the tool window with — and reopening it keeps the session output; Alt+1 toggles Project through the packaged\
  \ WebView.\n Classification now uses dock/Actions; Project uses the unified Workspaces entry. Existing workspace\
  \ content, shortcut and state assertions remain."
covers:
- F25.5
tags:
- code-workspace
- ed-parity-010
- native-gate
- p1
modes:
- native
fixtures:
- reset_db
- workspace_root
timeout_sec: 600
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-ed010","name":"qa-ed010","roots":[{"id":"qa-ed010","name":"qa-ed010","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-ed010","path":"notes.txt"},"lastOpenedAt":1756500000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- click: '[data-testid="code-workspace-bottom-tab-terminal"]'
- wait_for:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_ED010_MARK
    submit: true
- assert_pattern:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"]'
    regex: (?m)^QA_ED010_MARK\r?$
    timeout_sec: 30
- click: '[data-testid="shell-host"][data-panel-id$=":terminal"] [data-testid="shell-host-hide"]'
- wait_for:
    selector: '[data-testid="shell-host"][data-panel-id$=":terminal"]'
    state: hidden
    timeout_sec: 5
- click: '[data-testid="code-workspace-bottom-tab-terminal"]'
- wait_for:
    selector: '[data-testid="shell-host"][data-panel-id$=":terminal"]'
    timeout_sec: 10
- assert_pattern:
    selector: '[data-testid="code-workspace-terminal-dock"] [data-testid="terminal-pane"]'
    regex: (?m)^QA_ED010_MARK\r?$
    timeout_sec: 10
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press:
    key: Alt+1
    macos_key: Meta+1
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- assert_attribute:
    selector: '[data-testid="shell-rail-workspaces"]'
    name: aria-pressed
    equals: 'true'
- wait_for:
    selector: '[data-testid="code-workspace-tree-pane"]:focus-within'
    timeout_sec: 5
- press:
    key: Alt+1
    macos_key: Meta+1
    selector: '[data-testid="code-workspace-tree-pane"]'
- assert_attribute:
    selector: '[data-testid="shell-rail-workspaces"]'
    name: aria-pressed
    equals: 'false'
- press:
    key: Alt+1
    macos_key: Meta+1
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- assert_attribute:
    selector: '[data-testid="shell-rail-workspaces"]'
    name: aria-pressed
    equals: 'true'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A2/A3：rail 打开真实终端并输出；— 隐藏后再从 rail 打开，输出仍在。
    actions:
    - 10
    - 12
    - 14
    - 16
    checkpoints:
    - step: 11
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-terminal-ready=\"true\"]",
        "timeout_sec": 60}}'
    - step: 13
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-testid=\"terminal-pane\"]",
        "regex": "(?m)^QA_ED010_MARK\\r?$", "timeout_sec": 30}}'
    - step: 15
      expectation: '{"wait_for": {"selector": "[data-testid=\"shell-host\"][data-panel-id$=\":terminal\"]", "state":
        "hidden", "timeout_sec": 5}}'
    - step: 18
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-terminal-dock\"] [data-testid=\"terminal-pane\"]",
        "regex": "(?m)^QA_ED010_MARK\\r?$", "timeout_sec": 10}}'
    results:
    - 13
    - 15
    - 18
  - id: R2
    requirement: A2：Alt+1 在打包 WebView 中按 IDEA 语义切换 Project 工具窗：已显示但编辑器有焦点时激活（焦点进项目树），激活时再按隐藏，隐藏后再按打开。
    actions:
    - 20
    - 23
    - 25
    checkpoints:
    - step: 21
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail-workspaces\"]", "name": "aria-pressed",
        "equals": "true"}}'
    - step: 22
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-pane\"]:focus-within", "timeout_sec":
        5}}'
    - step: 24
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail-workspaces\"]", "name": "aria-pressed",
        "equals": "false"}}'
    - step: 26
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail-workspaces\"]", "name": "aria-pressed",
        "equals": "true"}}'
    results:
    - 21
    - 22
    - 24
    - 26
  visual:
  - check: 不声明视觉结论。
    method: not-applicable
    reason: native 只证明会话与派发。
  native:
  - check: Windows/Linux W3C 键盘、macOS WKWebView bridge；OS 级快捷键冲突未证明。
    method: automated
    reason: native runner 驱动打包 WebView。

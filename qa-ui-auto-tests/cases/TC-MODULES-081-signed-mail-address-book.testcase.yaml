id: TC-MODULES-081
title: A saved address-book contact survives disabling the signed Mail module
description: Save a contact, stop its host, reopen the account, choose the retained address in the composer and delete it from the module mailbox.
covers: [F-Modules-1, F-MAIL-21, F-MAIL-2]
tags: [modules, mail, contacts, p1]
modes: [native]
fixtures: [reset_db, mail_server, module_signed_mail_archive]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- seed_storage: {key: taomni.quickConnectVisible, value: 'true'}
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.mail_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.mail_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- assert_signed_mail_host: idle
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="qc-input"]'
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_quick_connect}'}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="plugin-tab-panel"][data-plugin-slug="mail"][data-plugin-kind="account"] [data-testid="mail-client-tab"][data-active="true"]'
- mail_server_assert_list_matches: {timeout_sec: 60}
- click: '[data-testid="mail-address-book-open"]'
- click: '[data-testid="mail-contact-new"]'
- fill: {selector: '[data-testid="mail-contact-name"]', value: Signed Book Contact}
- fill: {selector: '[data-testid="mail-contact-email"]', value: signed.book@example.org}
- click: '[data-testid="mail-contact-save"]'
- wait_for: '[data-testid="mail-contact-row"][data-contact-name="Signed Book Contact"]'
- assert_signed_mail_host: contact-saved
- click: '[data-testid="mail-address-book-close"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-mail"]'
- wait_for: '[data-testid="module-action-enable-mail"]'
- assert_signed_mail_host: contact-retained
- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="home-toolbar-sessions"]'
- click: '[data-testid="tab-item"][data-tab-type="mail"]'
- wait_for: '[data-testid="mail-client-tab"][data-active="true"]'
- click: '[data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: signed.book}
- wait_for: '[data-testid="mail-recipient-suggestion"]'
- assert_text: {selector: '[data-testid="mail-recipient-suggestions"]', contains: Signed Book Contact}
- assert_text: {selector: '[data-testid="mail-recipient-suggestions"]', contains: signed.book@example.org}
- click: '[data-testid="mail-recipient-suggestion"]'
- assert_text: {selector: '[data-testid="mail-recipient-to"]', contains: Signed Book Contact}
- click: '[role="dialog"][aria-label="New message"] button[aria-label="Close dialog"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- click: '[data-testid="mail-address-book-open"]'
- assert_text: {selector: '[data-testid="mail-contact-row"][data-contact-name="Signed Book Contact"]', contains: signed.book@example.org}
- click: '[data-testid="mail-contact-row"][data-contact-name="Signed Book Contact"] [data-testid="mail-contact-delete"]'
- wait_for: {selector: '[data-testid="mail-contact-row"][data-contact-name="Signed Book Contact"]', state: detached}
- assert_signed_mail_host: contact-deleted
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: signed-address-book
    requirement: Save, retain, use and remove an address through the signed account view and its module-owned mailbox.
    actions: [4, 5, 6, 7, 8, 10, 13, 15, 16, 19, 20, 21, 22, 23, 26, 27, 28, 29, 32, 34, 35, 36, 38, 39, 43, 45, 47, 49]
    checkpoints:
    - {step: 12, expectation: The enabled package has its verified host and frontend and starts without a writer.}
    - {step: 17, expectation: The account is displayed inside the signed Mail panel.}
    - {step: 24, expectation: The saved contact is visible in the address book.}
    - {step: 25, expectation: The leased module mailbox owns one identifiable contact and the legacy cache has no copy.}
    - {step: 31, expectation: Disabling releases the native writer and retains the same database and contact UID.}
    - {step: 41, expectation: The composer offers the retained contact by name after enabling Mail again.}
    - {step: 42, expectation: The suggested email belongs to the saved card.}
    - {step: 44, expectation: The selected To recipient shows the saved name.}
    - {step: 48, expectation: The reopened address book shows the saved email.}
    - {step: 50, expectation: The deleted contact disappears from the account view.}
    - {step: 51, expectation: The host removed the original contact from its retained database.}
    - {step: 52, expectation: The account and module transitions have no renderer errors.}
    results: [12, 17, 24, 25, 31, 41, 42, 44, 48, 50, 51, 52]
  visual:
  - check: The contact remains usable in the reopened account and as a composer recipient.
    method: automated
    reason: The case asserts the visible name and address in both views.
  native:
  - check: The signed host owns the card and releases its writer when disabled.
    method: automated
    reason: The runner reads SQLite, checks the OS writer lease and verifies the installed package and host digests.

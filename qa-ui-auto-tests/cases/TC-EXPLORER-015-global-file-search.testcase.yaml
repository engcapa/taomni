id: TC-EXPLORER-015
title: Search local filenames from Explorer and the command palette
covers: [F-EXPLORER-1, F-WS-6, F-FILEOPEN-1]
modes: [browser, native]
fixtures: [reset_db, explorer_global_search]
tags: [explorer, search, native-boundary, regression]
ui_standard: [UI-DLG-03, UI-DLG-04, UI-FOC-03, UI-BTN-03]
timeout_sec: 140
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-global-file-search
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.global_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="${fixture.global_dir}"]'
- press: {selector: '[data-testid="explorer-global-file-search"]', key: Enter}
- wait_for: '[data-testid="file-search-dialog"]:modal'
- assert_focus_on: '[data-testid="file-search-input"]'
- fill: {selector: '[data-testid="file-search-input"]', value: q}
- assert_disabled: '[data-testid="file-search-submit"]'
- fill: {selector: '[data-testid="file-search-input"]', value: '${fixture.global_empty}'}
- assert_visible: '[data-testid="file-search-status"][data-state="idle"]'
- press: {selector: '[data-testid="file-search-input"]', key: Enter}
- wait_for: '[data-testid="file-search-status"][data-state="done"][data-provider]'
- assert_text: {selector: '[data-testid="file-search-status"]', contains: No matching names}
- fill: {selector: '[data-testid="file-search-input"]', value: '${fixture.global_dir}'}
- click: '[data-testid="file-search-submit"]'
- wait_for: '[data-testid="file-search-result"]${fixture.global_dir_match}'
- click: '[data-testid="file-search-result"]${fixture.global_dir_match}'
- wait_for: '[data-testid="explorer-file-row"][data-name="${fixture.global_file}"]'
- assert_not_visible: '[data-testid="file-search-dialog"]'
- click: '[data-testid="global-search-trigger"]'
- fill: {selector: '[data-testid="global-search-input"]', value: '${fixture.global_needle}'}
- press: {selector: '[data-testid="global-search-input"]', key: ArrowDown}
- assert_not_visible: '[data-testid="file-search-dialog"]'
- press: {selector: '[data-testid="global-search-files"]', key: Enter}
- wait_for: '[data-testid="file-search-status"][data-state="done"][data-provider]'
- wait_for: '[data-testid="file-search-result"]${fixture.global_file_match}'
- press: {selector: '[data-testid="file-search-input"]', key: Escape}
- assert_not_visible: '[data-testid="file-search-dialog"]'
- assert_focus_on: '[data-testid="global-search-files"]'
- press: {selector: '[data-testid="global-search-files"]', key: Enter}
- wait_for: '[data-testid="file-search-result"]${fixture.global_file_match}'
- press: {selector: '[data-testid="file-search-input"]', key: ArrowDown}
- assert_focus_on: '[data-testid="file-search-result"]${fixture.global_file_match}'
- press: Enter
- wait_for: '[data-testid="explorer-platform-view"] [data-testid="file-viewer"][data-kind="text"]'
- assert_text_equals: {selector: '[data-testid="viewer-editor"] .cm-line', equals: '${fixture.global_text}'}
- assert_not_visible: '[data-testid="global-search-modal"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: explicit-query
    ui_standard: [UI-DLG-03, UI-BTN-03]
    requirement: Opening and typing preserve idle state until a valid query is submitted. A completed empty search identifies its source.
    actions: [9, 12, 14, 16]
    checkpoints:
    - {step: 10, expectation: Explorer opened a top-layer search dialog.}
    - {step: 11, expectation: Keyboard input immediately targets the filename.}
    - {step: 13, expectation: A one-character name cannot be submitted.}
    - {step: 15, expectation: A valid unsubmitted name leaves search idle.}
    - {step: 17, expectation: A submitted lookup settles and reports its search source.}
    - {step: 18, expectation: The unique missing name has an explicit empty state.}
    results: [10, 11, 13, 15, 17, 18]
  - id: folder
    requirement: An explicitly submitted folder name opens the matching fresh directory in Explorer.
    actions: [19, 20, 22]
    checkpoints:
    - {step: 21, expectation: The matching absolute directory path is displayed.}
    - {step: 23, expectation: Explorer lists the unique child of the selected folder.}
    - {step: 24, expectation: Opening the folder dismisses search.}
    results: [21, 23, 24]
  - id: palette-fuzzy
    ui_standard: [UI-DLG-04, UI-FOC-03]
    requirement: The palette permits ordinary navigation before opting in. Escape returns to its action and fuzzy ordered characters reopen the exact file by keyboard.
    actions: [25, 26, 27, 29, 32, 35, 37, 39]
    checkpoints:
    - {step: 28, expectation: Typing and navigating ordinary commands leaves file search closed.}
    - {step: 31, expectation: A noncontiguous filename query retrieves the unique file and full path.}
    - {step: 34, expectation: Escape restores the dedicated palette button.}
    - {step: 38, expectation: Arrow Down selects the intended file.}
    - {step: 40, expectation: Enter opens the Explorer text viewer.}
    - {step: 41, expectation: The editor contains the unique fixture text.}
    - {step: 42, expectation: Opening the target dismisses the parent palette.}
    results: [28, 31, 34, 38, 40, 41, 42]
  visual:
  - {check: Search state and result visibility, method: automated, reason: Verifies the visibility of the source status and full-path result before activation.}
  native:
  - {check: Fresh filesystem entries and fuzzy search IPC, method: automated, reason: The fixture creates a unique host tree immediately before the lookup and the packaged viewer reads its contents.}

id: TC-SHOT-017
title: Watermark apply clear and OCR display copy expose actual renderer state
description: Watermark applied and cleared UI state plus deterministic OCR text; no exported watermark-pixel or genuine OCR-engine pass is claimed.
covers: [F27.1]
tags: [screenshot, watermark, ocr, p2]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-watermark"]'
- wait_for: '[data-testid="screenshot-watermark-panel"]'
- assert_element_geometry:
    selector: '[data-testid="screenshot-watermark-panel"], [data-testid="screenshot-watermark-opacity"]'
    min_width: 1
    min_height: 1
    min_count: 2
    viewport_margin: 8
- set_viewport: {width: 520, height: 420}
- wait_for: '[data-testid="screenshot-watermark-panel"][style*="max-height: 404px"]'
- assert_element_geometry:
    selector: '[data-testid="screenshot-watermark-panel"], [data-testid="screenshot-watermark-opacity"]'
    min_width: 1
    min_height: 1
    min_count: 2
    viewport_margin: 8
- screenshot: watermark-panel-narrow.png
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-watermark-panel"][style*="max-height: 734px"]'
- assert_element_geometry:
    selector: '[data-testid="screenshot-watermark-panel"], [data-testid="screenshot-watermark-opacity"]'
    min_width: 1
    min_height: 1
    min_count: 2
    viewport_margin: 8
- fill:
    selector: '[data-testid="screenshot-watermark-text"]'
    value: QA watermark
- press:
    key: Home
    selector: '[data-testid="screenshot-watermark-opacity"]'
- press:
    key: ArrowRight
    selector: '[data-testid="screenshot-watermark-opacity"]'
- assert_attribute:
    selector: '[data-testid="screenshot-watermark-opacity"]'
    name: value
    equals: '11'
- click: '[data-testid="screenshot-watermark-color-ff4444"]'
- click: '[data-testid="screenshot-watermark-apply"]'
- assert_not_visible: '[data-testid="screenshot-watermark-panel"]'
- assert_attribute:
    selector: '[data-testid="screenshot-watermark"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-watermark"]'
- wait_for: '[data-testid="screenshot-watermark-panel"]'
- assert_attribute:
    selector: '[data-testid="screenshot-watermark-text"]'
    name: value
    equals: QA watermark
- assert_attribute:
    selector: '[data-testid="screenshot-watermark-opacity"]'
    name: value
    equals: '11'
- click: '[data-testid="screenshot-watermark-clear"]'
- assert_not_visible: '[data-testid="screenshot-watermark-panel"]'
- assert_attribute:
    selector: '[data-testid="screenshot-watermark"]'
    name: aria-pressed
    equals: 'false'
- click: '[data-testid="screenshot-watermark"]'
- wait_for: '[data-testid="screenshot-watermark-panel"]'
- assert_attribute:
    selector: '[data-testid="screenshot-watermark-text"]'
    name: value
    equals: ''
- press: Escape
- assert_not_visible: '[data-testid="screenshot-watermark-panel"]'
- assert_visible: '[data-testid="screenshot-selection"]'
- click: '[data-testid="screenshot-ocr"]'
- wait_for: '[data-testid="screenshot-ocr-text"]'
- assert_attribute:
    selector: '[data-testid="screenshot-ocr-text"]'
    name: value
    equals: "Taomni stub OCR\nuser@example.com"
- assert_attribute:
    selector: '[data-testid="screenshot-ocr-text"]'
    name: readonly
    equals: ''
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_ocr" && window.__taomniStubScreenshotCalls.at(-1).args.path === window.__taomniStubScreenshotCalls.at(-2).args.path
- seed_clipboard: screenshot-ocr-before
- click: '[data-testid="screenshot-ocr-copy"]'
- assert_text_equals:
    selector: '[data-testid="screenshot-toast"]'
    equals: Text copied to clipboard
- eval_readonly:
    expression: navigator.clipboard.readText().then(RegExp.prototype.test.bind(/^Taomni stub OCR\r?\nuser@example\.com$/))
- click: '[data-testid="screenshot-ocr-close"]'
- assert_not_visible: '[data-testid="screenshot-ocr-panel"]'
- assert_attribute:
    selector: '[data-testid="screenshot-overlay"]'
    name: data-phase
    equals: annotate
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '0'
- click: '[data-testid="screenshot-cancel"]'
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The watermark panel and opacity control remain inside the viewport after toolbar wrapping and live resizing; watermark text and opacity survive apply and reopen; Clear removes the applied state and text; Escape closes only the panel.
    actions: [1, 2, 4, 6, 9, 13, 16, 17, 18, 20, 21, 24, 28, 31, 34]
    checkpoints:
    - {step: 8, expectation: Watermark panel and slider stay inside the 1000px viewport even when the toolbar wraps.}
    - {step: 11, expectation: The open panel and slider reposition within a 520 by 420 viewport.}
    - {step: 15, expectation: The open panel and slider remain within bounds after restoring the viewport.}
    - {step: 19, expectation: Keyboard slider input changes opacity to eleven percent.}
    - {step: 22, expectation: Apply closes the watermark panel.}
    - {step: 23, expectation: Applied watermark keeps the action selected.}
    - {step: 26, expectation: Reopen preserves the entered text.}
    - {step: 27, expectation: Reopen preserves opacity.}
    - {step: 29, expectation: Clear closes the panel.}
    - {step: 30, expectation: Clear removes applied watermark state.}
    - {step: 33, expectation: Cleared watermark text is empty on reopen.}
    - {step: 35, expectation: Escape dismisses the panel.}
    - {step: 36, expectation: The underlying crop remains selected.}
    results: [8, 11, 15, 22, 23, 26, 27, 29, 30, 33, 35, 36]
  - id: R2
    requirement: OCR displays the exact returned fixture text including its email, copies that text, and closes its panel without creating annotations.
    actions: [37, 42, 43, 46, 50]
    checkpoints:
    - {step: 39, expectation: OCR text is the actual deterministic stub result rather than an assumed error.}
    - {step: 40, expectation: Recognized text is read-only.}
    - {step: 41, expectation: OCR consumes the renderer export path.}
    - {step: 44, expectation: Copy reports a successful text result.}
    - {step: 45, expectation: Browser clipboard equals the complete OCR result with platform LF or CRLF line endings.}
    - {step: 47, expectation: The OCR panel closes.}
    - {step: 48, expectation: The capture selection stays in annotate phase.}
    - {step: 49, expectation: OCR adds no annotation shapes.}
    - {step: 51, expectation: Capture remains cancelable.}
    results: [39, 40, 41, 44, 45, 47, 48, 49, 51]
  visual:
  - check: Applied and cleared watermark state plus exact OCR content.
    method: automated
    reason: UI state and text are asserted; exported watermark pixel appearance is not asserted or passed by this case.
  native:
  - check: Watermark output pixels and genuine OCR recognition against a captured image.
    method: external
    reason: Browser OCR is deterministic stub text; actual watermark export pixels and OCR engine accuracy require canvas/unit or native evidence separately.

id: TC-EXPLORER-016
title: Local filename lookup retrieves an independently indexed system path when available
covers: [F-EXPLORER-1]
modes: [native]
fixtures: [reset_db, explorer_index_probe]
tags: [explorer, search, native-boundary]
ui_standard: [UI-DLG-03]
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-file-search-index-probe
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.global_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="${fixture.global_dir}"]'
- click: '[data-testid="explorer-global-file-search"]'
- wait_for: '[data-testid="file-search-dialog"]:modal'
- fill: {selector: '[data-testid="file-search-input"]', value: '${fixture.index_probe_query}'}
- press: {selector: '[data-testid="file-search-input"]', key: Enter}
- wait_for: '[data-testid="file-search-status"][data-state="done"]${fixture.index_probe_source}'
- wait_for: '[data-testid="file-search-result"]${fixture.index_probe_result}'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: real-index
    ui_standard: [UI-DLG-03]
    requirement: An external index hit outside the traversal roots requires both the real adapter name and the exact path. A runner without an indexed public control must still find a fresh local fixture and record the scope of that evidence.
    actions: [9, 11, 12]
    checkpoints:
    - {step: 10, expectation: Explorer owns the search dialog.}
    - {step: 13, expectation: Search settled and identifies the expected available provider.}
    - {step: 14, expectation: The result contains the independent absolute path.}
    results: [10, 13, 14]
  visual:
  - {check: Search source and path, method: automated, reason: The actual search window exposes the settled source and the matching path.}
  native:
  - {check: Native index availability and result, method: automated, reason: index-probe.json records the independent reference query outcome before UI lookup.}

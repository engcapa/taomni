id: TC-SHELL-B25
title: Chat follows or pins context and keeps a streaming reply in its original thread
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b25.
  Browser IPC fixtures prove renderer outcomes only. A held browser IPC answer additionally exercises
  Stop and exactly-once draining of the queued prompt; TC-SHELL-N19 verifies real transport cancellation.'
covers:
- F-TAO-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-chat"]'
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: QA-A-PROMPT
- shell_backend_scenario:
    command: chat_stream
    action: hold
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: 'QA fixture reply:'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_attribute:
    selector: '[data-testid="shell-tao-context"]'
    name: data-binding
    equals: follow
- assert_text:
    selector: '[data-testid="shell-tao-context"]'
    contains: Shell 工作区
- assert_pattern:
    selector: '[data-testid="shell-chat-content"]'
    regex: ^(?![\s\S]*QA-A-PROMPT)[\s\S]*$
- shell_backend_scenario:
    command: chat_stream
    action: release
- assert_shell_backend:
    command: chat_stream
    status: completed
    count: 1
- click: '[data-testid="tao-hub-tab-notifications"]'
- wait_for: '[data-testid="tao-alert-inbox-item"][data-target-kind="chat"]'
- click: '[data-testid="tao-alert-inbox-item"][data-target-kind="chat"] [data-testid="tao-alert-jump"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: 'QA fixture reply: QA-A-PROMPT'
- assert_attribute:
    selector: '[data-testid="shell-tao-context"]'
    name: data-binding
    equals: fixed
- click: '[data-testid="shell-rail-home"]'
- assert_text:
    selector: '[data-testid="shell-tao-context"]'
    contains: qa-alpha
- click: '[data-testid="shell-tao-context-pin"]'
- assert_attribute:
    selector: '[data-testid="shell-tao-context"]'
    name: data-binding
    equals: follow
- assert_pattern:
    selector: '[data-testid="shell-chat-content"]'
    regex: ^(?![\s\S]*QA-A-PROMPT)[\s\S]*$
- click: '[data-testid="tao-hub-tab-notes"]'
- click: '[data-testid="notes-new"]'
- wait_for: '[data-testid="note-editor"]'
- fill:
    selector: '[data-testid="note-editor-title"]'
    value: Shell 中文草稿
- fill:
    selector: '[data-testid="note-editor-body"]'
    value: 'first line

      第二行'
- fill:
    selector: '[data-testid="note-editor-new-step"]'
    value: unfinished step
- fill:
    selector: '[data-testid="note-editor-new-tag"]'
    value: unfinished tag
- click: '[data-testid="tao-hub-tab-notifications"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- assert_count:
    selector: '[data-testid="note-editor"]'
    equal: 1
- assert_value:
    selector: '[data-testid="note-editor-title"]'
    equals: Shell 中文草稿
- assert_value:
    selector: '[data-testid="note-editor-body"]'
    equals: 'first line

      第二行'
- assert_value:
    selector: '[data-testid="note-editor-new-step"]'
    equals: unfinished step
- assert_value:
    selector: '[data-testid="note-editor-new-tag"]'
    equals: unfinished tag
- click: '[data-testid="tao-hub-tab-chat"]'
- shell_backend_scenario:
    command: chat_stream
    action: hold
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: QA-CANCEL-PROMPT
- click: '[data-testid="ai-chat-send-button"]'
- wait_for: '[data-testid="ai-chat-stop-button"]'
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: QA-QUEUED-PROMPT
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-testid="ai-chat-queue-badge"]'
    contains: '1'
- click: '[data-testid="ai-chat-stop-button"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: Stream stopped by user
- shell_backend_scenario:
    command: chat_stream
    action: release
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: 'QA fixture reply: QA-QUEUED-PROMPT'
- assert_shell_backend:
    command: chat_stream
    status: completed
    count: 2
- assert_not_visible: '[data-testid="ai-chat-queue-badge"]'
- screenshot: tc-shell-b25.png

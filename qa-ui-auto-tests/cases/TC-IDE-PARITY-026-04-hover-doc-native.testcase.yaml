id: TC-IDE-PARITY-026-04-hover-doc-native
title: Native JDT LS hover documentation stays while the pointer moves onto it
description: 'ED-PARITY-026 A2 native case on the in-repo maven-single sample and the CI-provisioned JDT LS: hovering the greet(...) call (kept near the left edge so the popup always has room in the narrow CI window) shows the real hover documentation; moving the pointer across the line into the popup and resting there keeps it, moving away closes it after the grace period, and Esc closes it from the editor.

  '
covers:
- F25.5
tags:
- code-workspace
- quick-documentation
- ed-parity-026
- native-gate
- provider-fixture
- p1
modes:
- native
fixtures:
- reset_db
- java_sample_projects
- jdtls_required
timeout_sec: 600
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-p026","name":"maven-single","roots":[{"id":"maven-single","name":"maven-single","path":"${fixture.maven_single_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-single","path":"src/main/java/com/example/single/App.java"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
- host_write_file:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/App.java
    text: "package com.example.single;\n\npublic class App {\n\n    /**\n     * Greets the given name for the hover documentation check.\n     */\n    public static String greet(String name) {\n        return \"Hello \" + name;\n    }\n\n    public static void main(String[] args) {\n        greet(\"taomni\");\n    }\n}\n"
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.maven_single_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: greet("taomni")
    timeout_sec: 60
- wait_for:

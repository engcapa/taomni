id: TC-EXPLORER-006
title: Explorer detail columns resize, fit contents and persist with aligned horizontal scrolling
description: Drag the real header separators in the shared Explorer, keeping selection and sort unchanged. Check all four
  columns, minimum widths, keyboard ownership, reload and new-tab persistence, automatic fitting and header/body alignment
  after actual horizontal overflow.
modes:
- browser
- native
covers:
- F-EXPLORER-1
tags:
- p1
- explorer
- columns
- preferences
- regression
fixtures:
- reset_db
- explorer_files
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-explorer-columns
- seed_storage:
    key: taomni.explorer.view.v1
    value: '{"view":"details","preview":false,"columnWidths":{"name":260,"mtime":140,"type":96,"size":80}}'
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]'
    value: ${fixture.explorer_previews}
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]'
    key: Enter
- wait_for: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-file-row"][data-name="notes.txt"]'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-file-row"][data-name="notes.txt"]'
- drag_to:
    from: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
    by:
      dx: 150
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-column:nth-child(1)').getBoundingClientRect().width >=
      409 && document.querySelector('.ex-shell:focus-within .ex-column:nth-child(1)').getBoundingClientRect().width <= 411
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-frow .ex-name').getBoundingClientRect().width >= 409
      && document.querySelector('.ex-shell:focus-within .ex-frow .ex-name').getBoundingClientRect().width <= 411
    expect_truthy: true
- drag_to:
    from: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-mtime"]'
    by:
      dx: 80
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width >=
      219 && document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width <= 221
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-frow .ex-mod').getBoundingClientRect().width >= 219 &&
      document.querySelector('.ex-shell:focus-within .ex-frow .ex-mod').getBoundingClientRect().width <= 221
    expect_truthy: true
- drag_to:
    from: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-type"]'
    by:
      dx: -250
- assert_attribute:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-type"]'
    name: aria-valuenow
    equals: '72'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-size"]'
    key: ArrowRight
- assert_attribute:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-size"]'
    name: aria-valuenow
    equals: '90'
- assert_attribute:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-file-row"][data-name="notes.txt"]'
    name: aria-selected
    equals: 'true'
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"sortKey":"name"'
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"sortDir":"asc"'
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"name":410'
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"mtime":220'
- screenshot: explorer-columns-resized.png
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]'
    value: ${fixture.explorer_previews}
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]'
    key: Enter
- wait_for: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-file-row"][data-name="notes.txt"]'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-column:nth-child(1)').getBoundingClientRect().width >=
      409 && document.querySelector('.ex-shell:focus-within .ex-column:nth-child(1)').getBoundingClientRect().width <= 411
    expect_truthy: true
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width >=
      219 && document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width <= 221
    expect_truthy: true
- drag_to:
    from: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
    by:
      dx: 300
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-size"]'
    key: ArrowRight
- eval_readonly:
    expression: document.querySelector(".ex-shell:focus-within .ex-fbody").scrollLeft > 0 && Math.abs(document.querySelector(".ex-shell:focus-within
      .ex-column:last-child").getBoundingClientRect().left - document.querySelector(".ex-shell:focus-within .ex-frow .ex-size").getBoundingClientRect().left)
      < 1.5
    expect_truthy: true
- screenshot: explorer-columns-horizontal-alignment.png
- dblclick: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-column:nth-child(1)').getBoundingClientRect().width >=
      140 && document.querySelector('.ex-shell:focus-within .ex-column:nth-child(1)').getBoundingClientRect().width <= 409
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector(".ex-shell:focus-within .ex-fbody").scrollLeft === 0 && document.querySelector(".ex-shell:focus-within
      .ex-frow .ex-name > span").scrollWidth <= document.querySelector(".ex-shell:focus-within .ex-frow .ex-name > span").clientWidth
      + 1
    expect_truthy: true
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-mtime"]'
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"sortKey":"mtime"'
- assert_localstorage:
    key: taomni.explorer.view.v1
    contains: '"mtime":220'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-cmd-view"]'
- click: '[data-testid="explorer-view-icons"]'
- assert_count:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid^="explorer-column-resize-"]'
    equal: 0
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-cmd-view"]'
- click: '[data-testid="explorer-view-list"]'
- assert_count:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid^="explorer-column-resize-"]'
    equal: 0
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-cmd-view"]'
- click: '[data-testid="explorer-view-details"]'
- assert_count:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid^="explorer-column-resize-"]'
    equal: 4
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width >=
      219 && document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width <= 221
    expect_truthy: true
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-cmd-newtab"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Tab
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-name"]'
- eval_readonly:
    expression: document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width >=
      219 && document.querySelector('.ex-shell:focus-within .ex-column:nth-child(2)').getBoundingClientRect().width <= 221
    expect_truthy: true
- assert_attribute:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-size"]'
    name: aria-valuenow
    equals: '100'
- assert_no_runtime_errors: null
- click: button[aria-label="Cycle application theme"]
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: light
- screenshot: explorer-columns-light.png
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-column-resize-size"]'
    key: ArrowLeft
- eval_readonly:
    expression: Math.abs(document.querySelector(".ex-shell:focus-within .ex-column:last-child").getBoundingClientRect().left
      - document.querySelector(".ex-shell:focus-within .ex-frow .ex-size").getBoundingClientRect().left) < 1.5
    expect_truthy: true
- assert_no_runtime_errors: null
- screenshot: explorer-columns-restored.png
- click: button[aria-label="Cycle application theme"]
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: dark
- screenshot: explorer-columns-dark.png
- assert_no_runtime_errors: null

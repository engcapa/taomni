    method: manual
    reason: Inspect retained resized, horizontal-alignment, restored, explicit light and explicit dark screenshots. Browser
      TC-EXPLORER-002 additionally checks narrow viewports; native uses the actual packaged window and tests induced horizontal
      overflow.
  native:

id: TC-TAOFFICE-014
title: Explain desktop RAR support in browser preview
description: Open an uppercase RAR extension in the core viewer and show how to preview and extract it on desktop.
modes: [browser]
covers: [F-FILEOPEN-1]
tags: [p0, file-open, taoffice, archive, core-only]
fixtures: [reset_db, file_open_files]
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- dblclick: '[data-testid="explorer-file-row"][data-name="records.RAR"]'
- wait_for: '[data-testid="file-viewer"][data-kind="archive"][data-active="true"] [data-testid="archive-error"]'
- assert_text: {selector: '[data-testid="archive-error"]', contains: Open this RAR archive in the desktop app}
- assert_disabled: '[data-testid="archive-extract-here"]'
- assert_file_open_bytes: {path: '${fixture.file_open_root}/records.RAR', sha256: '${fixture.taoffice_rar_sha}'}
- assert_no_runtime_errors: null

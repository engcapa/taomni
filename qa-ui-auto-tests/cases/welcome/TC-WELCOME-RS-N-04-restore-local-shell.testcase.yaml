id: TC-WELCOME-RS-N-04-restore-local-shell
title: 'Native: saved LocalShell run snapshot restores and locates the live tab'
covers:
- F1.6
tags:
- welcome
- native-gate
- p1
modes:
- native
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: sessions
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-shell"]'
- wait_for: '[data-testid="session-proto-shell"][data-active="true"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-native-shell
- click: '[data-testid="session-save"]'
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-native-shell"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-native-shell"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait_for: '[data-testid="welcome-panel"]'
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="available"]'
    timeout_sec: 20
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for: '[data-testid="tab-item"][data-tab-type="terminal"][data-active="true"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 1
- screenshot: F1.6-native-restore-localshell.png
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_RESTORED_LOCAL
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_RESTORED_LOCAL\s*$
    timeout_sec: 20
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
      and that PTY executes a new command.
    actions:
    - 1
    - 2
    - 4
    - 5
    - 7
    - 9
    - 11
    - 12
    - 13
    - 15
    - 17
    - 20
    - 24
    checkpoints:
    - step: 3
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 6
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 8
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 10
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 14
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 16
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 18
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 19
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 21
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 22
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    - step: 25
      expectation: UI-created LocalShell commits a restore candidate; restore locates exactly one active terminal
        and that PTY executes a new command.
    results:
    - 3
    - 6
    - 8
    - 10
    - 14
    - 16
    - 18
    - 19
    - 21
    - 22
    - 25
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

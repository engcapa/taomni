id: TC-WELCOME-RS-N-04-restore-local-shell
title: 'Native: Tao Home history restores and locates the saved local shell without
  duplicates'
covers:
- F1.6
- F1.11
tags:
- welcome
- native-gate
- p1
modes:
- native
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="tao-home-new-session"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-shell"]'
- wait_for: '[data-testid="session-proto-shell"][data-active="true"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-native-shell
- click: '[data-testid="session-save"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-native-shell"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-native-shell"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 30
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="tao-home-history"]'
- wait_for: '[data-testid="tao-home-history-restore"]:enabled'
- click: '[data-testid="tao-home-history-restore"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 1
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-history"]'
- wait_for: '[data-testid="tao-home-history-restore"]:enabled'
- click: '[data-testid="tao-home-history-restore"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 1
- assert_no_runtime_errors: null
- screenshot: F1.6-native-restore-localshell.png
verification:
  review: reviewed
  requirements:
  - id: HOME-RESTORE-SHELL
    requirement: Reuse the saved-shell restore scenario through the Home history footer.
      Restore locates the existing terminal tab; a repeated invocation keeps one active
      live terminal pane.
    actions:
    - 18
    - 20
    - 23
    - 24
    - 26
    checkpoints:
    - step: 22
      expectation: Home history restores the actual terminal without duplication.
    - step: 28
      expectation: Repeating restore locates the same single terminal tab.
    - step: 21
      expectation: '{''wait_for'': ''[data-testid="terminal-pane"]''}'
    - step: 27
      expectation: '{''wait_for'': ''[data-testid="terminal-pane"]''}'
    - step: 29
      expectation: '{''assert_no_runtime_errors'': None}'
    results:
    - 21
    - 22
    - 27
    - 28
    - 29
  native:
  - check: Real saved session and local PTY restored through Home history
    method: automated
    reason: Browser cannot create a native local shell.
  visual:
  - check: Restored local shell and a single active terminal tab
    method: manual
    reason: Inspect the recorded screenshot; DOM assertions do not establish OS window
      fidelity.
description: Reuse the saved-shell restore scenario through the Home history footer.
  Restore locates the existing terminal tab; a repeated invocation keeps one active
  live terminal pane.

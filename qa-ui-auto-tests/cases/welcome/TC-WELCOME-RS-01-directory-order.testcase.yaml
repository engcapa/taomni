id: TC-WELCOME-RS-01-directory-order
title: Welcome local directories follow confirmed-use ordering with unknown-time rows
description: "Fixture seeds confirmed use times (A=3000, Home=2000, Downloads=1000) and a\nlegacy rank row. The\
  \ directories tab must render the backend order\n(A/Home/Downloads), keep it under filtering, preserve the default\
  \ Home\ntime, and not advance any time when a row is clicked in browser mode\n(local PTY is unsupported there).\n\
  \ Tao Home history is the retained directories entry; the backend ordering and failed-launch assertions are unchanged."
covers:
- F1.6
- F1.11
tags:
- auto-generated
- p1
- welcome
- needs-review
modes:
- browser
fixtures:
- reset_db
- welcome_recents
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-directories"]'
- wait_for: '[data-testid="welcome-local-directories"]'
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=0'
    name: data-directory-path
    equals: /preview/A
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=1'
    name: data-directory-path
    equals: /preview
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=2'
    name: data-directory-path
    equals: /preview/Downloads
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview"]'
    name: data-last-used-at-ms
    equals: '2000'
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'
    name: data-last-used-at-ms
    equals: '3000'
- fill:
    selector: '[data-testid="welcome-local-directory-filter"]'
    value: preview
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=0'
    name: data-directory-path
    equals: /preview/A
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=1'
    name: data-directory-path
    equals: /preview
- fill:
    selector: '[data-testid="welcome-local-directory-filter"]'
    value: ''
- assert_count:
    selector: '[data-testid="welcome-local-directory"]'
    min: 4
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/Legacy"]'
    name: data-last-used-at-ms
    equals: ''
- assert_text:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/Legacy"]'
    contains: unknown
- click: '[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'
- click: '[data-testid="nav-mode-home"]'
- assert_text:
    selector: '[data-testid="tao-home-host"]'
    contains: Local terminal is not available in browser preview
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-directories"]'
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'
    name: data-last-used-at-ms
    equals: '3000'
- screenshot: F1.6-welcome-directory-order.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Welcome local directories follow confirmed-use ordering with unknown-time rows：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 4
    - 11
    - 14
    - 18
    - 19
    - 21
    - 22
    checkpoints:
    - step: 2
      expectation: '{''wait_for'': ''[data-testid="welcome-panel"]''}'
    - step: 5
      expectation: '{''wait_for'': ''[data-testid="welcome-local-directories"]''}'
    - step: 6
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"] >> nth=0'',
        ''name'': ''data-directory-path'', ''equals'': ''/preview/A''}}'
    - step: 7
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"] >> nth=1'',
        ''name'': ''data-directory-path'', ''equals'': ''/preview''}}'
    - step: 8
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"] >> nth=2'',
        ''name'': ''data-directory-path'', ''equals'': ''/preview/Downloads''}}'
    - step: 9
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"][data-directory-path="/preview"]'',
        ''name'': ''data-last-used-at-ms'', ''equals'': ''2000''}}'
    - step: 10
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'',
        ''name'': ''data-last-used-at-ms'', ''equals'': ''3000''}}'
    - step: 12
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"] >> nth=0'',
        ''name'': ''data-directory-path'', ''equals'': ''/preview/A''}}'
    - step: 13
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"] >> nth=1'',
        ''name'': ''data-directory-path'', ''equals'': ''/preview''}}'
    - step: 15
      expectation: '{''assert_count'': {''selector'': ''[data-testid="welcome-local-directory"]'', ''min'': 4}}'
    - step: 16
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"][data-directory-path="/preview/Legacy"]'',
        ''name'': ''data-last-used-at-ms'', ''equals'': ''''}}'
    - step: 17
      expectation: '{''assert_text'': {''selector'': ''[data-testid="welcome-local-directory"][data-directory-path="/preview/Legacy"]'',
        ''contains'': ''unknown''}}'
    - step: 20
      expectation: Browser preview reports that it cannot start the terminal.
    - step: 23
      expectation: '{''assert_attribute'': {''selector'': ''[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'',
        ''name'': ''data-last-used-at-ms'', ''equals'': ''3000''}}'
    results:
    - 20
    - 23
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

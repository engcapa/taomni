id: TC-WELCOME-RS-01-directory-order
title: Welcome local directories follow confirmed-use ordering with unknown-time rows
description: 'Fixture seeds confirmed use times (A=3000, Home=2000, Downloads=1000) and a

  legacy rank row. The directories tab must render the backend order

  (A/Home/Downloads), keep it under filtering, preserve the default Home

  time, and not advance any time when a row is clicked in browser mode

  (local PTY is unsupported there).

  '
covers:
- F1.6
tags:
- auto-generated
- p1
- welcome
- needs-review
modes:
- browser
fixtures:
- reset_db
- welcome_recents
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-directories"]'
- wait_for: '[data-testid="welcome-local-directories"]'
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=0'
    name: data-directory-path
    equals: /preview/A
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=1'
    name: data-directory-path
    equals: /preview
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=2'
    name: data-directory-path
    equals: /preview/Downloads
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview"]'
    name: data-last-used-at-ms
    equals: '2000'
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'
    name: data-last-used-at-ms
    equals: '3000'
- fill:
    selector: '[data-testid="welcome-local-directory-filter"]'
    value: preview
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=0'
    name: data-directory-path
    equals: /preview/A
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"] >> nth=1'
    name: data-directory-path
    equals: /preview
- fill:
    selector: '[data-testid="welcome-local-directory-filter"]'
    value: ''
- assert_count:
    selector: '[data-testid="welcome-local-directory"]'
    min: 4
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/Legacy"]'
    name: data-last-used-at-ms
    equals: ''
- assert_text:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/Legacy"]'
    contains: unknown
- click: '[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'
- wait: 1
- assert_attribute:
    selector: '[data-testid="welcome-local-directory"][data-directory-path="/preview/A"]'
    name: data-last-used-at-ms
    equals: '3000'
- screenshot: F1.6-welcome-directory-order.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Welcome local directories follow confirmed-use ordering with unknown-time rows：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 10
    - 13
    - 17
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"welcome-local-directories\"]"}'
    - step: 5
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"] >> nth=0", "name":
        "data-directory-path", "equals": "/preview/A"}}'
    - step: 6
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"] >> nth=1", "name":
        "data-directory-path", "equals": "/preview"}}'
    - step: 7
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"] >> nth=2", "name":
        "data-directory-path", "equals": "/preview/Downloads"}}'
    - step: 8
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"][data-directory-path=\"/preview\"]",
        "name": "data-last-used-at-ms", "equals": "2000"}}'
    - step: 9
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"][data-directory-path=\"/preview/A\"]",
        "name": "data-last-used-at-ms", "equals": "3000"}}'
    - step: 11
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"] >> nth=0", "name":
        "data-directory-path", "equals": "/preview/A"}}'
    - step: 12
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"] >> nth=1", "name":
        "data-directory-path", "equals": "/preview"}}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"welcome-local-directory\"]", "min": 4}}'
    - step: 15
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"][data-directory-path=\"/preview/Legacy\"]",
        "name": "data-last-used-at-ms", "equals": ""}}'
    - step: 16
      expectation: '{"assert_text": {"selector": "[data-testid=\"welcome-local-directory\"][data-directory-path=\"/preview/Legacy\"]",
        "contains": "unknown"}}'
    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-local-directory\"][data-directory-path=\"/preview/A\"]",
        "name": "data-last-used-at-ms", "equals": "3000"}}'
    results:
    - 19
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-WELCOME-RS-03-restore-failure
title: Local-shell restore fails honestly in browser mode and retries without stacking tabs
description: 'Fixture seeds a confirmed snapshot whose entry is a saved LocalShell. The

  browser stub refuses create_local_terminal, so the restore must surface a

  real failed state (never "succeeded"), keep the seeded record intact, and

  retry must not stack terminal tabs.

  '
covers:
- F1.6
tags:
- p1
- welcome
modes:
- browser
fixtures:
- reset_db
- welcome_recents
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="welcome-restore-status"][data-state="available"]'
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="failed"]'
    timeout_sec: 30
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 0
- assert_visible: '[data-testid="shell-restore-entry"][data-status="failed"]'
- click: '[data-testid="welcome-restore-retry"]'
- wait_for: '[data-testid="welcome-restore-status"][data-state="failed"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 0
- assert_count:
    selector: '[data-testid="shell-restore-entry"][data-status="failed"]'
    equal: 1
- screenshot: F1.6-welcome-restore-failure.png
- assert_localstorage:
    key: taomni.welcome.sessionResume.v1
    contains: '"savedSessionId":"sess-local-shell"'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
      the failed tab; retry does not stack tabs.
    actions:
    - 1
    - 4
    - 8
    checkpoints:
    - step: 2
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 3
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 5
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 6
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 7
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 9
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 10
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 11
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    - step: 13
      expectation: Failed local-shell restore reports one failed outcome, retains its saved descriptor and removes
        the failed tab; retry does not stack tabs.
    results:
    - 2
    - 3
    - 5
    - 6
    - 7
    - 9
    - 10
    - 11
    - 13
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

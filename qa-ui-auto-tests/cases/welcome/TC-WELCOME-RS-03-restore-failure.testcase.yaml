id: TC-WELCOME-RS-03-restore-failure
title: Local-shell restore fails honestly in browser mode and retries without stacking tabs
description: 'Fixture seeds a confirmed snapshot whose entry is a saved LocalShell. The

  browser stub refuses create_local_terminal, so the restore must surface a

  real failed state (never "succeeded"), keep the seeded record intact, and

  retry must not stack terminal tabs.

  '
covers:
- F1.6
tags:
- auto-generated
- p1
- welcome
- needs-review
modes:
- browser
fixtures:
- reset_db
- welcome_recents
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="available"]'
    timeout_sec: 15
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    timeout_sec: 15
- wait: 1
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait: 1
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="failed"]'
    timeout_sec: 30
- wait_for: '[data-testid="welcome-restore-retry"]'
- click: '[data-testid="welcome-restore-retry"]'
- wait: 4
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait: 1
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="terminal"]'
    equal: 1
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="failed"], [data-testid="welcome-restore-status"][data-state="partial"]'
    timeout_sec: 15
- screenshot: F1.6-welcome-restore-failure.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Local-shell restore fails honestly in browser mode and retries without stacking tabs：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 4
    - 7
    - 11
    - 13
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 3
      expectation: '{"wait_for": {"selector": "[data-testid=\"welcome-restore-status\"][data-state=\"available\"]",
        "timeout_sec": 15}}'
    - step: 5
      expectation: '{"wait_for": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"terminal\"]", "timeout_sec":
        15}}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"welcome-restore-status\"][data-state=\"failed\"]",
        "timeout_sec": 30}}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"welcome-restore-retry\"]"}'
    - step: 15
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"terminal\"]", "equal":
        1}}'
    - step: 16
      expectation: '{"wait_for": {"selector": "[data-testid=\"welcome-restore-status\"][data-state=\"failed\"],
        [data-testid=\"welcome-restore-status\"][data-state=\"partial\"]", "timeout_sec": 15}}'
    results:
    - 15
    - 16
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-WELCOME-RS-N-03-osc-cwd-record
title: 'Native: plain local terminal OSC 7 cwd records local-cwd directory use'
covers:
- F1.6
tags:
- welcome
- native-gate
- p1
modes:
- native
fixtures:
- reset_db
- shell_native_files
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: cd "${fixture.shell_root}"
    submit: true
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_CWD_CHANGED
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_CWD_CHANGED\s*$
    timeout_sec: 20
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-directories"]'
- wait_for: '[data-testid="welcome-local-directories"]'
- assert_visible: '[data-testid="welcome-local-directory"]'
- screenshot: F1.6-native-osc-cwd.png
- fill:
    selector: '[data-testid="welcome-local-directory-filter"]'
    value: ${fixture.shell_dir_name}
- assert_count:
    selector: '[data-testid="welcome-local-directory"]'
    equal: 1
- assert_count:
    selector: '[data-testid="welcome-local-directory"][data-last-used-at-ms]:not([data-last-used-at-ms=""])'
    equal: 1
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A real terminal changes to the isolated fixture directory; shell integration records that uniquely
      named directory with a confirmed-use timestamp visible in Home.

id: TC-WELCOME-RS-N-01-native-smoke
title: Native Home launch executes a real PTY and commits a restorable working set
description: Fresh isolated app data; real PTY output proves execution and a native app restart proves the saved
  run snapshot survives. No direct SQLite inspection is claimed.
covers:
- F1.6
tags:
- welcome
- native-gate
- p1
modes:
- native
fixtures:
- reset_db
timeout_sec: 420
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="empty"]'
    timeout_sec: 30
- assert_attribute:
    selector: '[data-testid="welcome-restore-last-session"]'
    name: disabled
    equals: ''
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: echo QA_HOME_NATIVE_PTY
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_HOME_NATIVE_PTY\s*$
    timeout_sec: 20
- click: '[data-testid="tab-item"][data-tab-type="welcome"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-directories"]'
- wait_for: '[data-testid="welcome-local-directories"]'
- assert_visible: '[data-testid="welcome-local-directory"]'
- assert_visible: '[data-testid="welcome-local-directory-filter"]'
- screenshot: F1.6-native-welcome-directories.png
- wait: 2
- assert_visible: '[data-testid="welcome-restore-status"]'
- screenshot: F1.6-native-restore-state.png
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="available"]'
    timeout_sec: 20
- restart_native_app: null
- wait_for: '[data-testid="welcome-restore-status"][data-state="available"]'

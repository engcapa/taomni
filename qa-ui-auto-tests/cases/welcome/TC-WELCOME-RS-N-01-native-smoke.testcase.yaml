id: TC-WELCOME-RS-N-01-native-smoke
title: 'Linux native smoke: restore empty state, real local PTY launch, snapshot commit'
description: 'V-10 Linux slice (design docs-feature/welcome-recents-session-restore-design.md

  §8). Fresh isolated app-data: the restore entry starts empty/disabled;

  opening a real host local terminal through the Welcome directory entry

  produces a genuine WebKitGTK/PTY tab; the run-snapshot collector commits the

  saved LocalShell tab into taomni.db, verified on disk after the case.

  '
covers:
- F1.6
tags:
- welcome
- native-gate
- p1
- needs-review
modes:
- native
fixtures:
- reset_db
timeout_sec: 420
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu"] >> text="Sessions"'
- click: '[data-testid="context-menu-item-show-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- wait_for:
    selector: '[data-testid="welcome-restore-status"][data-state="empty"]'
    timeout_sec: 30
- assert_attribute:
    selector: '[data-testid="welcome-restore-last-session"]'
    name: disabled
    equals: ''
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 30
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu"] >> text="Sessions"'
- click: '[data-testid="context-menu-item-show-sessions"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu"] >> text="Sessions"'
- click: '[data-testid="context-menu-item-show-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-directories"]'
- wait_for: '[data-testid="welcome-local-directories"]'
- assert_visible: '[data-testid="welcome-local-directory"]'
- assert_visible: '[data-testid="welcome-local-directory-filter"]'
- screenshot: F1.6-native-welcome-directories.png
- wait: 2
- assert_visible: '[data-testid="welcome-restore-status"]'
- screenshot: F1.6-native-restore-state.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: 'Linux native smoke: restore empty state, real local PTY launch, snapshot commit：按步骤执行后，所有声明的可观察结果均满足。'
    actions:
    - 1
    - 2
    - 11
    - 19
    - 21
    checkpoints:
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 9
      expectation: '{"wait_for": {"selector": "[data-testid=\"welcome-restore-status\"][data-state=\"empty\"]",
        "timeout_sec": 30}}'
    - step: 10
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"welcome-restore-last-session\"]", "name":
        "disabled", "equals": ""}}'
    - step: 12
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-pane\"]", "timeout_sec": 30}}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 22
      expectation: '{"wait_for": "[data-testid=\"welcome-local-directories\"]"}'
    - step: 23
      expectation: '{"assert_visible": "[data-testid=\"welcome-local-directory\"]"}'
    - step: 24
      expectation: '{"assert_visible": "[data-testid=\"welcome-local-directory-filter\"]"}'
    - step: 27
      expectation: '{"assert_visible": "[data-testid=\"welcome-restore-status\"]"}'
    results:
    - 22
    - 23
    - 24
    - 27
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

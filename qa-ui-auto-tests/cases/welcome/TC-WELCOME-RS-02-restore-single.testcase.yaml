id: TC-WELCOME-RS-02-restore-single
title: Home history restores a saved folder and locates the same tab on repeat
description: Reuse the existing saved-folder snapshot through the Tao Home history footer. Assert the
  active filesystem pane, selected absolute directory, and no duplicate tab after repeated restoration.
covers:
- F1.6
- F1.11
tags:
- p1
- welcome
- tao-home
- regression
modes:
- browser
fixtures:
- reset_db
- welcome_recents
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-directories"]'
- wait_for: '[data-testid="welcome-local-directories"]'
- click: '[data-testid="tao-home-history-popover"] [data-testid="tao-home-history-tab-sessions"]'
- assert_attribute:
    selector: '[data-testid="tao-home-history-popover"] [data-testid="tao-home-history-tab-sessions"]'
    name: aria-selected
    equals: 'true'
- wait_for: '[data-testid="tao-home-history-restore"]:enabled'
- assert_visible: .tao-home-history-footer
- click: '[data-testid="tao-home-history-restore"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- assert_attribute:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    name: data-path
    equals: /preview
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-browser"]'
    equal: 1
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-history"]'
- wait_for: '[data-testid="tao-home-history-restore"]:enabled'
- click: '[data-testid="tao-home-history-restore"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-browser"]'
    equal: 1
- assert_no_runtime_errors: null
- screenshot: F1.6-home-history-restore-single.png
verification:
  review: reviewed
  requirements:
  - id: HOME-RESTORE-FOLDER
    requirement: Reuse the existing saved-folder snapshot through the Tao Home history footer. Assert
      the active filesystem pane, selected absolute directory, and no duplicate tab after repeated restoration.
    actions:
    - 3
    - 10
    - 14
    - 15
    - 17
    - 4
    - 6
    checkpoints:
    - step: 12
      expectation: The Home footer restores the actual fixture folder.
    - step: 13
      expectation: Restoration opens exactly one file-browser tab.
    - step: 19
      expectation: Repeated restoration reuses the same single active tab.
    - step: 20
      expectation: Both routes complete without runtime errors.
    - step: 9
      expectation: The migrated restore footer is visible inside Home history.
    - step: 7
      expectation: History switches from directories back to sessions while preserving the restore entry.
    results:
    - 12
    - 13
    - 19
    - 20
    - 9
    - 7
  visual:
  - check: Restored folder and active file browser
    method: manual
    reason: Inspect screenshot content; DOM transitions alone do not certify prototype fidelity.
  native:
  - check: Native local PTY restoration is covered by TC-WELCOME-RS-N-04-restore-local-shell
    method: automated
    reason: This case intentionally covers browser saved-folder restoration; native shell creation uses
      its retained native case.

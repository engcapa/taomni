id: TC-WELCOME-RS-02-restore-single
title: Home restores a saved folder from the top action and locates the same tab from History
description: Keyboard-activate the new Home restore row, verify its completed banner disappears, then repeat from History and assert
  the original active filesystem pane and tab count.
covers:
- F1.6
- F1.11
tags:
- p1
- welcome
- tao-home
- regression
modes:
- browser
fixtures:
- reset_db
- welcome_recents
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-directories"]'
- wait_for: '[data-testid="welcome-local-directories"]'
- click: '[data-testid="tao-home-history-popover"] [data-testid="tao-home-history-tab-sessions"]'
- assert_attribute:
    selector: '[data-testid="tao-home-history-popover"] [data-testid="tao-home-history-tab-sessions"]'
    name: aria-selected
    equals: 'true'
- press: Escape
- assert_visible: '[data-testid="welcome-restore-row"]'
- press:
    selector: '[data-testid="welcome-restore-last-session"]'
    key: Enter
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- assert_attribute:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    name: data-path
    equals: /preview
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-browser"]'
    equal: 1
- click: '[data-testid="nav-mode-home"]'
- assert_not_visible: '[data-testid="welcome-restore-row"]'
- click: '[data-testid="tao-home-history"]'
- wait_for: '[data-testid="tao-home-history-restore"]:enabled'
- click: '[data-testid="tao-home-history-restore"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="file-browser"]'
    equal: 1
- assert_no_runtime_errors: null
- screenshot: F1.6-home-history-restore-single.png
verification:
  review: reviewed
  requirements:
  - id: HOME-RESTORE-FOLDER
    requirement: Keyboard-activate the Home restore row, verify its banner disappears after success, then repeat from History and
      assert the original active filesystem pane and tab count.
    actions:
    - 3
    - 10
    - 14
    - 16
    - 18
    - 4
    - 6
    checkpoints:
    - step: 12
      expectation: Keyboard activation restores the actual fixture folder.
    - step: 13
      expectation: Restoration opens exactly one file-browser tab.
    - step: 15
      expectation: Successful restoration removes the completed banner from Home.
    - step: 20
      expectation: Repeated restoration from History reuses the same single active tab.
    - step: 21
      expectation: Both routes complete without runtime errors.
    - step: 9
      expectation: The restore row is visible directly in Home.
    - step: 7
      expectation: History switches from directories back to sessions while preserving the restore entry.
    results:
    - 12
    - 13
    - 15
    - 20
    - 21
    - 9
    - 7
  visual:
  - check: Restored folder and active file browser
    method: manual
    reason: Inspect screenshot content; DOM transitions alone do not certify prototype fidelity.
  native:
  - check: Native local PTY restoration is covered by TC-WELCOME-RS-N-04-restore-local-shell
    method: automated
    reason: This case intentionally covers browser saved-folder restoration; native shell creation uses its retained native case.

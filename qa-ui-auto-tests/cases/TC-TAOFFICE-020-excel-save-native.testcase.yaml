id: TC-TAOFFICE-020
title: Save edited XLSX cells through the signed Excel host and reopen the copy
description: Install the signed module, protect a table heading, edit table data, cancel the save shortcut's desktop dialog, then save and reopen with the table and formula intact.
modes: [native]
covers: [F-FILEOPEN-1, F-Modules-1]
tags: [p0, file-open, taoffice, taoffice-excel, native-boundary]
fixtures: [reset_db, file_open_files, taoffice_signed_excel]
ui_standard: [UI-INP-07, UI-FOC-02, UI-KEY-04]
timeout_sec: 260
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.excel_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.excel_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- wait_for: '[data-testid="module-action-enable-taoffice-excel"]:enabled'
- press: {selector: '[data-testid="module-action-enable-taoffice-excel"]', key: Enter}
- wait_for: '[data-testid="module-action-disable-taoffice-excel"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="quarterly.xlsx"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="quarterly.xlsx"]'
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="A2"]'
- click: '[data-testid="taoffice-excel-cell"][data-address="A1"]'
- assert_attribute: {selector: '[data-testid="taoffice-excel-cell"][data-address="A1"]', name: aria-readonly, equals: 'true'}
- assert_disabled: '[data-testid="taoffice-excel-edit-cell"]'
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="A1"]', key: F2}
- assert_not_visible: '[data-testid="taoffice-excel-input"]'
- assert_text: {selector: '[data-testid="taoffice-excel-table-readonly"]', contains: Table headers and totals rows are read-only}
- click: '[data-testid="taoffice-excel-cell"][data-address="A2"]'
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="A2"]', key: F2}
- fill: {selector: '[data-testid="taoffice-excel-input"]', value: Mechanical Keyboard}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Tab}
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="B2"]:focus'
- dblclick: '[data-testid="taoffice-excel-cell"][data-address="B2"]'
- fill: {selector: '[data-testid="taoffice-excel-input"]', value: '15.5'}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Control+s, macos_key: Meta+s}
- native_file_dialog: {kind: save, action: cancel}
- wait_for: '[data-testid="taoffice-excel-save-copy"]:enabled'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: '15.5'}
- wait_for: '[data-testid="explorer-workspace-tab"][data-active="true"] [data-testid="viewer-tab-dirty"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.file_open_root}/edited.xlsx
    trigger: '[data-testid="taoffice-excel-save-copy"]'
- wait_for: '[data-testid="taoffice-excel-copy-output"]'
- assert_text: {selector: '[data-testid="taoffice-excel-copy-output"]', contains: edited.xlsx}
- wait_for: {selector: '[data-testid="explorer-workspace-tab"][data-active="true"] [data-testid="viewer-tab-dirty"]', state: detached}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/quarterly.xlsx', sha256: '${fixture.taoffice_workbook_sha}'}
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="edited.xlsx"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="edited.xlsx"]'
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="A2"]'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="A1"]', contains: Product}
- assert_attribute: {selector: '[data-testid="taoffice-excel-cell"][data-address="A1"]', name: aria-readonly, equals: 'true'}
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="A2"]', contains: Mechanical Keyboard}
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: '15.5'}
- click: '[data-testid="taoffice-excel-cell"][data-address="C2"]'
- assert_attribute: {selector: '[data-testid="taoffice-excel-formula"]', name: value, equals: '=B2*2'}
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="C2"]', contains: '31'}
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="C2"]', key: ArrowLeft}
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="B2"]'
- dblclick: '[data-testid="taoffice-excel-cell"][data-address="B2"]'
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="B2"] [data-testid="taoffice-excel-cell-editor"] [data-testid="taoffice-excel-input"]'
- fill: {selector: '[data-testid="taoffice-excel-input"]', value: '99'}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Escape}
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="B2"]'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: '15.5'}
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', key: F2}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Shift+Enter}
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="B1"]'
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
    - id: R1
      ui_standard: [UI-INP-07, UI-FOC-02, UI-KEY-04]
      requirement: Cell editing owns keyboard input until a commit moves the selection or Escape restores the selected cell.
      actions: [59, 61, 63, 64, 67, 68]
      checkpoints:
        - {step: 60, expectation: Left Arrow selects the reopened B2.}
        - {step: 62, expectation: The native WebView focuses the editor inside B2.}
        - {step: 65, expectation: Escape restores B2 focus.}
        - {step: 66, expectation: Cancelling preserves the saved number.}
        - {step: 69, expectation: Shift+Enter selects the row above.}
      results: [60, 62, 65, 66, 69]
  visual:
    - {check: Active worksheet cell, method: automated, reason: The editor belongs to the selected gridcell and keyboard navigation restores visible focus.}
  native:
    - {check: Reopen the saved XLSX, method: automated, reason: The signed module saves and reopens edited cells through the native chooser.}

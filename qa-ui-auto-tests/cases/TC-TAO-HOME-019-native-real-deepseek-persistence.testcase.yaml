id: TC-TAO-HOME-019
title: Real DeepSeek context and unsent draft survive a normal native application restart
description: >-
  One actual commercial reply precedes a normal owned process shutdown/restart.
  Unlock the same vault without reseeding, restore transcript and draft, then ask
  DeepSeek to recall its earlier unpredictable token. At most two chat requests.
modes: [native]
covers: [F1.11]
tags: [p1, tao-home, native, real-provider, regression]
fixtures: [reset_db, tao_real_provider]
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-tao-home-019-real-persistence
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- wait_for: '[data-testid="tao-home-composer-input"]:enabled'
- observe_tao_provider: null
- tao_real_provider_expanded: {scenario: persistence-prepare}
- native_restart_app: null
- wait_for: '[data-testid="vault-unlock-dialog"]'
- fill: {selector: '[data-testid="vault-unlock-pw"]', value: qa-tao-home-019-real-persistence}
- click: '[data-testid="vault-unlock-confirm"]'
- wait_for: '[data-testid="tao-home-composer-input"]:enabled'
- observe_tao_provider: null
- tao_real_provider_expanded: {scenario: persistence-verify}
- assert_no_runtime_errors: null
- screenshot: tao-home-real-restart-final.png
verification:
  review: reviewed
  requirements:
  - id: REAL-COLD-RESTART
    requirement: Normal native process restart preserves the real transcript, independent draft and provider context without an automatic request.
    actions: [1, 2, 3, 4, 5, 6, 8, 10, 11, 13]
    checkpoints:
    - {step: 7, expectation: Real reply completed and a known synthetic draft was retained before restart; explicit invalid credentials are logged.}
    - {step: 14, expectation: "The original user/assistant pair and exact draft reappear with zero post-restart requests. A second commercial reply recalls the earlier token from persisted context. Explicit invalid credentials alone may finish early."}
    - {step: 15, expectation: No unhandled runtime errors.}
    results: [14, 15]
  native:
  - check: Owned application closure and cold restart with real storage
    method: automated
    reason: native_restart_app independently verifies normal closure and relaunch without deleting or reseeding storage; commercial recall proves persisted backend context.
  visual:
  - check: Restored native transcript and draft
    method: manual
    reason: Counts, token and exact draft are asserted; screenshots preserve context.

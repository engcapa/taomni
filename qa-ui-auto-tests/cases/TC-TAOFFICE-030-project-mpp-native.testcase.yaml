id: TC-TAOFFICE-030
title: Signed Project host imports binary MPP and saves a new XML schedule
description: Confirm the signed native parser recognizes a real MPP, preserves its link and source bytes, and rejects an invalid file through the normal viewer.
modes: [native]
covers: [F-FILEOPEN-1, F-Modules-1]
tags: [p0, file-open, taoffice, taoffice-project, native-boundary]
fixtures: [reset_db, file_open_files, taoffice_signed_project]
timeout_sec: 250
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.project_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.project_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- press: {selector: '[data-testid="module-action-enable-taoffice-project"]:enabled', key: Enter}
- wait_for: '[data-testid="module-action-disable-taoffice-project"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="damaged.mpp"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="damaged.mpp"]'
- wait_for: '[data-testid="taoffice-project-error"]'
- assert_visible: '[data-testid="taoffice-project-retry"]'
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- wait_for: '[data-testid="explorer-file-row"][data-name="linked-tasks.mpp"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="linked-tasks.mpp"]'
- wait_for: '[data-testid="taoffice-project-schedule"]'
- assert_attribute: {selector: '[data-testid="taoffice-project-task"][data-uid="2"]', name: data-start, equals: '2014-10-30T08:00:00'}
- assert_visible: '[data-testid="taoffice-project-task"][data-uid="2"] [data-testid="taoffice-project-bar"]'
- assert_visible: '[data-testid="taoffice-project-task"][data-uid="16"]'
- press: {selector: '[data-testid="taoffice-project-task"][data-uid="2"] [data-testid="taoffice-project-rename"]', key: Enter}
- fill: {selector: '[data-testid="taoffice-project-task-name"]', value: 'Review linked task'}
- press: Enter
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.file_open_root}/linked-tasks-revised.xml
    trigger: '[data-testid="taoffice-project-save"]'
- wait_for: '[data-testid="taoffice-project-output"]'
- assert_file_open_bytes: {path: '${fixture.file_open_root}/linked-tasks.mpp', sha256: '${fixture.taoffice_mpp_sha}'}
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="linked-tasks-revised.xml"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="linked-tasks-revised.xml"]'
- wait_for: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-schedule"]'
- assert_text:
    selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-task"][data-uid="2"]'
    contains: 'Review linked task'
- assert_attribute:
    selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-task"][data-uid="2"]'
    name: data-start
    equals: '2014-10-30T08:00:00'
- assert_no_runtime_errors: null

id: TC-IDE-PARITY-006-01
title: Replace exclude preview cancel commit in browser
description: Browser gate case for ED-PARITY-006 A1/V3. Directory scope + mask search finds 3 occurrences across 2 files; result row exclusion via Delete key and context menu; Replace All preview reflects seeded exclusions in summary and checkboxes; Escape cancels with zero disk/buffer commit; Enter commits 2 replacements and prunes committed rows; post-commit notice and remaining row state verified.
covers:
- F25.5
tags:
- code-workspace
- ide-find
- replace
- parity006
- p1
modes:
- browser
fixtures:
- reset_db
- parity006_replace
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity006_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- press: Control+Shift+F
- wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute('aria-label') === 'Search query'
    expect_truthy: true
- select_option:
    selector: '[data-testid="code-workspace-find-scope-select"]'
    value: directory
- fill:
    selector: '[data-testid="code-workspace-find-directory-input"]'
    value: src
- fill:
    selector: '[aria-label="Include globs"]'
    value: '*.txt'
- fill:
    selector: '[aria-label="Search query"]'
    value: token
- press: Enter
- wait_for: '[data-testid="code-workspace-find-file-group"]'
- assert_text:
    selector: '[data-testid="code-workspace-find-in-files-panel"]'
    contains: 3 results · 2 files
- assert_count:
    selector: '[data-testid="code-workspace-find-file-group"]'
    equal: 2
- assert_count:
    selector: '[data-testid="code-workspace-find-match-row"]'
    equal: 3
- assert_text:
    selector: '[data-testid="code-workspace-find-in-files-panel"]'
    contains: src/a.txt
- assert_text:
    selector: '[data-testid="code-workspace-find-in-files-panel"]'
    contains: src/b.txt
- click: '[data-testid="code-workspace-find-match-row"][title*="b.txt:1"]'
- wait_for: '[data-testid="code-workspace-editor-tab-strip"] button[title*="b.txt"]'
- click: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
- press:
    key: Delete
    selector: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
    name: data-excluded
    equals: 'true'
- eval_readonly:
    expression: Boolean(document.activeElement?.getAttribute('title')?.includes('b.txt:1'))
    expect_truthy: true
- right_click: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
- wait_for: '[data-testid="code-workspace-find-row-restore"]'
- click: '[data-testid="code-workspace-find-row-restore"]'
- eval_readonly:
    expression: document.querySelector('[data-excluded]') === null
    expect_truthy: true
- right_click: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
- wait_for: '[data-testid="code-workspace-find-row-exclude"]'
- click: '[data-testid="code-workspace-find-row-exclude"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
    name: data-excluded
    equals: 'true'
- fill:
    selector: '[aria-label="Replace text"]'
    value: coin
- click: '[data-testid="code-workspace-find-replace-all"]'
- wait_for: '[data-testid="code-workspace-replace-preview"]'
- assert_text:
    selector: '[data-testid="code-workspace-replace-summary"]'
    contains: Replace 2 occurrences of 'token' across 2 files with 'coin'?
- assert_text:
    selector: '[data-testid="code-workspace-replace-counts"]'
    contains: 2 of 3
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-replace-commit'
    expect_truthy: true
- screenshot: tc-ide-parity-006-01-preview.png
- press: Escape
- assert_not_visible: '[data-testid="code-workspace-replace-preview"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-find-replace-all'
    expect_truthy: true
- assert_count:
    selector: '[data-testid="code-workspace-find-match-row"]'
    equal: 3
- assert_attribute:
    selector: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
    name: data-excluded
    equals: 'true'
- click: '[data-testid="code-workspace-editor-tab-strip"] button[title*="a.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - alpha token one
    - beta token two
    - ''
- click: '[data-testid="code-workspace-editor-tab-strip"] button[title*="b.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - gamma token three
    - ''
- click: '[data-testid="code-workspace-find-replace-all"]'
- wait_for: '[data-testid="code-workspace-replace-preview"]'
- press: Enter
- assert_not_visible: '[data-testid="code-workspace-replace-preview"]'
- wait_for: '[data-testid="code-workspace-find-replaced-notice"]'
- assert_text:
    selector: '[data-testid="code-workspace-find-replaced-notice"]'
    contains: Replaced 2 occurrences in 2 files
- assert_count:
    selector: '[data-testid="code-workspace-find-match-row"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="code-workspace-find-match-row"]'
    name: data-excluded
    equals: 'true'
- click: '[data-testid="code-workspace-editor-tab-strip"] button[title*="a.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - alpha coin one
    - beta token two
    - ''
- click: '[data-testid="code-workspace-editor-tab-strip"] button[title*="b.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - gamma coin three
    - ''
- assert_disabled: '[data-testid="code-workspace-find-replace-all"]'
- screenshot: tc-ide-parity-006-01-post-commit.png

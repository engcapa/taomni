id: TC-IDE-PARITY-006-01
title: Replace results exclusion, preview cancel and commit
description: Browser VFS sequence for F1-REPL-006. Proves result-row exclusion and restore,
  seeded preview selection, keyboard cancel/commit, post-commit pruning, and the all-excluded gate.
covers: [F25.5]
tags: [code-workspace, ide-find, replace, parity006, p1]
modes: [browser]
fixtures: [reset_db, parity006_replace]
timeout_sec: 240
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity006_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - press: Control+Shift+F
  - wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
  - eval_readonly:
      expression: document.activeElement?.getAttribute('aria-label') === 'Search query'
      expect_truthy: true
  - select_option:
      selector: '[data-testid="code-workspace-find-scope-select"]'
      value: directory
  - fill:
      selector: '[data-testid="code-workspace-find-directory-input"]'
      value: src
  - fill:
      selector: '[aria-label="Include globs"]'
      value: "*.txt"
  - fill:
      selector: '[aria-label="Search query"]'
      value: token
  - press: Enter
  - wait_for:
      selector: '[data-testid="code-workspace-find-file-group"]'
      timeout_sec: 30
  - assert_text:
      selector: '[data-testid="code-workspace-find-in-files-panel"]'
      contains: 3 results · 2 files
  - assert_count:
      selector: '[data-testid="code-workspace-find-file-group"]'
      equal: 2
  - assert_count:
      selector: '[data-testid="code-workspace-find-match-row"]'
      equal: 3
  - assert_items:
      selector: '[data-testid="code-workspace-find-file-group"]'
      attribute: data-file
      equals: [src/a.txt, src/b.txt]
  - click: '[data-testid="code-workspace-find-match-row"]:has-text("beta token two")'
  - press: Delete
  - assert_attribute:
      selector: '[data-testid="code-workspace-find-match-row"]:has-text("beta token two")'
      name: data-excluded
      equals: 'true'
  - eval_readonly:
      expression: document.activeElement?.textContent?.includes('gamma token three') === true
      expect_truthy: true
  - right_click: '[data-testid="code-workspace-find-match-row"]:has-text("beta token two")'
  - click_menu: Restore
  - assert_attribute:
      selector: '[data-testid="code-workspace-find-match-row"]:has-text("beta token two")'
      name: data-excluded
      equals: 'false'
  - right_click: '[data-testid="code-workspace-find-match-row"]:has-text("beta token two")'
  - click_menu: Exclude
  - assert_attribute:
      selector: '[data-testid="code-workspace-find-match-row"]:has-text("beta token two")'
      name: data-excluded
      equals: 'true'
  - fill:
      selector: '[aria-label="Replace text"]'
      value: coin
  - click: '[data-testid="code-workspace-find-replace-all"]'
  - wait_for: '[data-testid="code-workspace-replace-preview"]'
  - assert_text:
      selector: '[data-testid="code-workspace-replace-summary"]'
      contains: "Replace 2 occurrences of 'token' across 2 files with 'coin'?"
  - assert_text:
      selector: '[data-testid="code-workspace-replace-counts"]'
      contains: 2 of 3
  - assert_count:
      selector: '[data-testid="code-workspace-replace-usage"][aria-label*="a.txt:2"]:not(:checked)'
      equal: 1
  - eval_readonly:
      expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-replace-commit'
      expect_truthy: true
  - screenshot: tc-ide-parity-006-01-preview.png
  - press: Tab
  - eval_readonly:
      expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-replace-file-toggle'
      expect_truthy: true
  - press: Shift+Tab
  - eval_readonly:
      expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-replace-commit'
      expect_truthy: true
  - press: Escape
  - assert_not_visible: '[data-testid="code-workspace-replace-preview"]'
  - eval_readonly:
      expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-find-replace-all'
      expect_truthy: true
  - assert_count:
      selector: '[data-testid="code-workspace-find-match-row"]'
      equal: 3
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
      equals: [alpha token one, beta token two, '']
  - click: '[data-testid="code-workspace-find-replace-all"]'
  - wait_for: '[data-testid="code-workspace-replace-preview"]'
  - press: Enter
  - assert_not_visible: '[data-testid="code-workspace-replace-preview"]'
  - assert_text:
      selector: '[data-testid="code-workspace-find-replaced-notice"]'
      contains: Replaced 2 occurrences in 2 files
  - assert_count:
      selector: '[data-testid="code-workspace-find-match-row"]'
      equal: 1
  - assert_attribute:
      selector: '[data-testid="code-workspace-find-match-row"]'
      name: data-excluded
      equals: 'true'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
      equals: [alpha coin one, beta token two, '']
  - assert_disabled: '[data-testid="code-workspace-find-replace-all"]'
  - press:
      key: Delete
      selector: '[data-testid="code-workspace-find-match-row"]'
  - assert_enabled: '[data-testid="code-workspace-find-replace-all"]'
  - press: Delete
  - assert_disabled: '[data-testid="code-workspace-find-replace-all"]'
  - screenshot: tc-ide-parity-006-01-final.png

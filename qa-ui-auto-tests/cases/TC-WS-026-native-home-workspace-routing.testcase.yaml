id: TC-WS-026
title: Home and Sessions editor entries belong to Workspaces (native)
description: Home new and recent preserve the full editor and saved text, IDE tools have a separate group; context-free Tools entry opens the default workspace.
  Native uses an actual OS directory chooser and disk reread.
modes:
- native
covers:
- F-WS-1
- F-WS-2
- F25.1
- F25.5
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-26
- click: '[data-testid="home-open-workspace"]'
- native_folder_dialog:
    action: choose
    path: ${fixture.platform_workspace_root}
- wait_for: '[data-testid="workspace-code-tab"]'
- assert_attribute:
    selector: '[data-testid="nav-mode-workspaces"]'
    name: aria-pressed
    equals: 'true'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
    equal: 0
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="code"]'
    equal: 1
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="code-workspace-editor"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    key: Mod+End
- type:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    text: '

      QA_HOME_ROUTE_SAVE'
- press: Mod+s
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: QA_HOME_ROUTE_SAVE
- assert_file_contains:
    path: ${fixture.platform_workspace_root}/README.md
    contains: QA_HOME_ROUTE_SAVE
- eval_readonly:
    expression: getComputedStyle(document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-tool-window-rail"]'),'::before').content.includes('IDE')
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"sidebar-tool-window-rail"]').getBoundingClientRect().top - document.querySelector('[data-testid'+String.fromCharCode(61)+'"rail-mode-group"]').getBoundingClientRect().bottom
      >= 12
    expect_truthy: true
- screenshot: home-workspace-ide-group.png
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.platform_workspace_root}"]'
- wait_for: '[data-testid="workspace-code-tab"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: QA_HOME_ROUTE_SAVE
- assert_count:
    selector: '[data-testid="workspace-tab"][data-tab-kind="code"]'
    equal: 1
- click: '[data-testid="side-tab-sessions"]'
- assert_not_visible: '[data-testid="code-workspace-tab"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
    equal: 0
- assert_not_visible: '[data-testid="nav-mode-agents"]'
- assert_visible: '[data-testid="rail-chat-button"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="workspace-code-tab"]'
- assert_attribute:
    selector: '[data-testid="nav-mode-workspaces"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="workspace-switcher"]'
- assert_visible: '[data-testid="workspace-default-badge"]'
- assert_count:
    selector: '[data-testid="tab-item"][data-tab-type="code-workspace"]'
    equal: 0
- screenshot: sessions-code-entry-default-workspace.png
- assert_text_equals:
    selector: '[data-testid="workspace-toolbar-bottom-dock"]'
    equals: ''
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home new/recent opens the same full editor inside Workspaces, save survives re-entry, Sessions contains no code tabs, and context-free
      Code Editor routes to the default workspace. IDE tools are separated by at least 12px with an IDE label.
    actions:
    - 3
    - 4
    - 12
    - 13
    - 14
    - 15
    - 21
    - 22
    - 23
    - 27
    - 32
    - 33
    - 36
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"workspace-code-tab\"]"}'
    - step: 6
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"nav-mode-workspaces\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 7
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"code-workspace\"]", "equal": 0}}'
    - step: 8
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-tab\"][data-tab-kind=\"code\"]", "equal": 1}}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor\"]"}'
    - step: 16
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"]", "contains": "QA_HOME_ROUTE_SAVE"}}'
    - step: 17
      expectation: '{"assert_file_contains": {"path": "${fixture.platform_workspace_root}/README.md", "contains": "QA_HOME_ROUTE_SAVE"}}'
    - step: 18
      expectation: '{"eval_readonly": {"expression": "getComputedStyle(document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-tool-window-rail\"]''),''::before'').content.includes(''IDE'')",
        "expect_truthy": true}}'
    - step: 19
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"sidebar-tool-window-rail\"]'').getBoundingClientRect().top
        - document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"rail-mode-group\"]'').getBoundingClientRect().bottom >= 12", "expect_truthy":
        true}}'
    - step: 24
      expectation: '{"wait_for": "[data-testid=\"workspace-code-tab\"]"}'
    - step: 25
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"]", "contains": "QA_HOME_ROUTE_SAVE"}}'
    - step: 26
      expectation: '{"assert_count": {"selector": "[data-testid=\"workspace-tab\"][data-tab-kind=\"code\"]", "equal": 1}}'
    - step: 28
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 29
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"code-workspace\"]", "equal": 0}}'
    - step: 30
      expectation: '{"assert_not_visible": "[data-testid=\"nav-mode-agents\"]"}'
    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"rail-chat-button\"]"}'
    - step: 34
      expectation: '{"wait_for": "[data-testid=\"workspace-code-tab\"]"}'
    - step: 35
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"nav-mode-workspaces\"]", "name": "aria-pressed", "equals": "true"}}'
    - step: 37
      expectation: '{"wait_for": "[data-testid=\"workspace-switcher\"]"}'
    - step: 38
      expectation: '{"assert_visible": "[data-testid=\"workspace-default-badge\"]"}'
    - step: 39
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-item\"][data-tab-type=\"code-workspace\"]", "equal": 0}}'
    - step: 41
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"workspace-toolbar-bottom-dock\"]", "equals": ""}}'
    results:
    - 5
    - 6
    - 7
    - 8
    - 9
    - 11
    - 16
    - 17
    - 18
    - 19
    - 24
    - 25
    - 26
    - 28
    - 29
    - 30
    - 31
    - 34
    - 35
    - 37
    - 38
    - 39
    - 41
  visual:
  - check: Compact controls retain readable icons and active states without toolbar overlap.
    method: manual
    reason: Inspect the retained screenshots; functional assertions do not establish visual matching.
  native:
  - check: Home new/recent opens the same full editor inside Workspaces, save survives re-entry, Sessions contains no code tabs, and context-free Code Editor
      routes to the default workspace. IDE tools are separated by at least 12px with an IDE label.
    method: automated
    reason: Runs the isolated packaged application and explicitly asserts real native effects.

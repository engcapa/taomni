id: TC-WS-018
title: Workspace layout presets and large live/global overview preserve unsaved files
description: Operates the prototype toolbar, split/grid/single, bottom dock and large overview. File previews read the current unsaved document. Global
  Home cards activate their owning workspace. Native verifies real file loading and retained editor state in the packaged WebView.
modes:
- browser
- native
covers:
- F1.5
- F-WS-1
- F-WS-2
- F-WS-5
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-018
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version": 1, "activeWorkspaceId": "default-workspace", "createdNodes": [], "workspaces": [{"id": "default-workspace", "name": "Default Workspace",
      "description": "", "isDefault": true, "rootFolders": [{"id": "root-1", "name": "qa-root", "path": "${fixture.platform_workspace_root}", "addedAt":
      1}], "pinnedSessionIds": [], "activeLeftToolWindow": "project", "bottomDock": {"open": false, "activeTool": "terminal", "heightPx": 220}, "openTabs":
      [], "activeTabId": ""}, {"id": "second-workspace", "name": "Second Workspace", "description": "", "isDefault": false, "rootFolders": [], "pinnedSessionIds":
      [], "activeLeftToolWindow": "project", "bottomDock": {"open": false, "activeTool": "terminal", "heightPx": 220}, "openTabs": [], "activeTabId": ""}]}'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="code-workspace-tree-root"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"] .cm-content'
- click: '[data-testid="code-workspace-tree-dir"][data-path="src"] [data-testid="code-workspace-tree-dir-arrow"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="src/index.ts"]'
- wait_for: '[data-testid="workspace-file-editor"][data-path="src/index.ts"] .cm-content'
- press:
    selector: '[data-testid="workspace-file-editor"][data-path="src/index.ts"] .cm-content'
    key: Mod+a
- type:
    selector: '[data-testid="workspace-file-editor"][data-path="src/index.ts"] .cm-content'
    text: export const previewUnsaved = "live draft";
- click: '[data-testid="workspace-layout-split"]'
- assert_count:
    selector: '[data-testid="workspace-file-editor"] [data-testid="code-workspace-editor-pane"]'
    equal: 2
- assert_attribute:
    selector: '[data-testid="workspace-canvas-panes"]'
    name: data-layout
    equals: split
- click: '[data-testid="platform-layout-grid"]'
- assert_count:
    selector: '[data-testid="workspace-file-editor"] [data-testid="code-workspace-editor-pane"]'
    equal: 2
- click: '[data-testid="platform-layout-single"]'
- assert_count:
    selector: '[data-testid="workspace-file-editor"] [data-testid="code-workspace-editor-pane"]'
    equal: 1
- click: '[data-testid="tab-overview-trigger"]'
- wait_for: '[data-testid="tab-overview"][data-scope="workspaces"]'
- assert_count:
    selector: '[data-testid="tab-overview-card"]'
    equal: 2
- click: '[data-testid="tab-overview-all"]'
- assert_attribute:
    selector: '[data-testid="tab-overview"]'
    name: data-scope
    equals: all
- click: '[data-testid="tab-overview-current"]'
- assert_attribute:
    selector: '[data-testid="tab-overview"]'
    name: data-scope
    equals: workspaces
- assert_text:
    selector: '[data-testid="tab-overview"]'
    contains: previewUnsaved
- screenshot: ws-018-workspace-large-overview.png
- click: '[data-testid="tab-overview-card"]:nth-child(1)'
- assert_text:
    selector: '[data-testid="workspace-file-editor"][data-path="README.md"] .cm-content'
    contains: platform workspace root
- press: Mod+Shift+E
- wait_for: '[data-testid="tab-overview"]'
- press: Escape
- assert_not_visible: '[data-testid="tab-overview"]'
- press: Mod+Shift+E
- wait_for: '[data-testid="tab-overview"]'
- press: Escape
- assert_not_visible: '[data-testid="tab-overview"]'
- click: '[data-testid="workspace-toolbar-bottom-dock"]'
- assert_visible: '[data-testid="workspace-bottom-dock"]'
- click: '[data-testid="workspace-toolbar-bottom-dock"]'
- assert_not_visible: '[data-testid="workspace-bottom-dock"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tab-overview-trigger"]'
- wait_for: '[data-testid="tab-overview"][data-scope="all"]'
- assert_text:
    selector: '[data-testid="tab-overview"]'
    contains: previewUnsaved
- click: '[data-testid="tab-overview-card"]:nth-child(2)'
- wait_for: '[data-testid="workspace-file-editor"][data-path="src/index.ts"][data-dirty="true"]'
- assert_attribute:
    selector: '[data-testid="workspace-file-editor"][data-path="src/index.ts"]'
    name: data-dirty
    equals: 'true'
- assert_text:
    selector: '[data-testid="workspace-file-editor"][data-path="src/index.ts"] .cm-content'
    contains: previewUnsaved
- assert_count:
    selector: '[data-testid="ai-chat-drawer-ribbon"]'
    equal: 0
- screenshot: ws-018-workspace-layout-overview.png

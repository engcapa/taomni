id: TC-PATH-SFTP-01
title: SFTP remote and local address completion stays isolated and preserves navigation
description: Create a disposable remote directory tree through the real SSH terminal, then drive the attached SFTP address
  bars. The remote namespace is POSIX even when hosted OpenSSH runs on Windows. Browser uses the real SSH/SFTP dev bridge
  and local VFS; native exercises packaged russh-sftp and real local filesystem IPC. Verify remote/local independence, exact
  candidates, excluded files, common-prefix, nested and mouse completion, selected Enter, cancellation, empty matches and
  history.
covers:
- F7.2
- F7.5
tags:
- p1
- path-completion
- filebrowser
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
- path_completion
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: mkdir -p '${fixture.sftp_shell_test_dir}/qa-path-completion/project-alpha' '${fixture.sftp_shell_test_dir}/qa-path-completion/project-beta'
      '${fixture.sftp_shell_test_dir}/qa-path-completion/only space/child' '${fixture.sftp_shell_test_dir}/qa-path-completion/.hidden'
      && printf 'nested directory\n' > '${fixture.sftp_shell_test_dir}/qa-path-completion/only space/child/child-marker.txt'
      && printf 'beta directory\n' > '${fixture.sftp_shell_test_dir}/qa-path-completion/project-beta/beta-marker.txt' && printf
      'regular file\n' > '${fixture.sftp_shell_test_dir}/qa-path-completion/project.txt' && printf '\nQA_PATH_COMPLETION_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_PATH_COMPLETION_READY\r?$
    timeout_sec: 60
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-path-edit"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: input[data-testid="sftp-remote-path"]
    value: ${fixture.sftp_sync_test_dir}/qa-path-completion
- press:

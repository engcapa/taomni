id: TC-PATH-SFTP-01
title: SFTP remote and local address completion stays isolated and preserves navigation
description: Create a disposable remote directory tree through the real SSH terminal, then drive the attached SFTP address
  bars. The remote namespace is POSIX even when hosted OpenSSH runs on Windows. Browser uses the real SSH/SFTP dev bridge
  and local VFS; native exercises packaged russh-sftp and real local filesystem IPC. Verify remote/local independence, exact
  candidates, excluded files, common-prefix, nested and mouse completion, selected Enter, cancellation, empty matches and
  history.
covers:
- F7.2
- F7.5
tags:
- p1
- path-completion
- filebrowser
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
- path_completion
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="session-new"]'
    timeout_sec: 60
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:

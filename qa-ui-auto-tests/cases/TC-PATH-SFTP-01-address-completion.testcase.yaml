    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: mkdir -p '${fixture.sftp_shell_test_dir}/qa-path-completion/project-alpha' '${fixture.sftp_shell_test_dir}/qa-path-completion/project-beta'
      '${fixture.sftp_shell_test_dir}/qa-path-completion/only space/child' '${fixture.sftp_shell_test_dir}/qa-path-completion/.hidden'
      && printf 'nested directory\n' > '${fixture.sftp_shell_test_dir}/qa-path-completion/only space/child/child-marker.txt'
      && printf 'beta directory\n' > '${fixture.sftp_shell_test_dir}/qa-path-completion/project-beta/beta-marker.txt' && printf
      'regular file\n' > '${fixture.sftp_shell_test_dir}/qa-path-completion/project.txt' && printf '\nQA_PATH_COMPLETION_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_PATH_COMPLETION_READY\r?$
    timeout_sec: 60
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-path-edit"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:

id: TC-WS-033
title: Sessions broadcast subset, filtered target picker and shared Chat entry (native PTY)
description: Selects individual sessions through inline checkboxes and the searchable broadcast picker while protocol filters hide their tabs. Keeps active tab, selection
  and live instances; the shared bottom Chat button reopens the current session thread. Real shell output reaches only the chosen Alpha/Gamma sessions; Beta independently
  prints a barrier without the broadcast marker.
modes:
- native
covers:
- F4.11
- F1.5
- F-WS-1
- F-AI-2.4
tags:
- p0
- workspace-redesign
- regression
- broadcast
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-33
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- dblclick: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: QA Broadcast Alpha
- press: Enter
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- dblclick: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: QA Broadcast Beta
- press: Enter
- click: '[data-testid="new-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- dblclick: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: QA Broadcast Gamma
- press: Enter
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="tab-multiexec-toggle"]'
- wait_for: '[data-testid="multiexec-bar"]'
- assert_count:
    selector: '[data-testid="tab-multiexec-checkbox"]'
    equal: 3
- click: '[data-testid="tab-multiexec-checkbox"]'
- assert_text:
    selector: '[data-testid="multiexec-targets"]'
    contains: 1 / 3
- assert_attribute:
    selector: '[data-testid="tab-item"][data-active="true"]'
    name: data-tab-title
    equals: QA Broadcast Gamma
- click: '[data-testid="tab-multiexec-checkbox"]'
- assert_text:
    selector: '[data-testid="multiexec-targets"]'
    contains: 0 / 3
- click: '[data-testid="tab-more"]'
- click: '[data-testid="session-tab-filter-ssh"]'
- press: Escape
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 0
- click: '[data-testid="multiexec-targets"]'
- fill:
    selector: '[data-testid="multiexec-target-search"]'
    value: missing-target
- assert_visible: '[data-testid="multiexec-target-empty"]'
- fill:
    selector: '[data-testid="multiexec-target-search"]'
    value: Gamma
- assert_count:
    selector: '[data-testid="multiexec-target-checkbox"]'
    equal: 1
- click: '[data-testid="multiexec-target-checkbox"]'
- fill:
    selector: '[data-testid="multiexec-target-search"]'
    value: Alpha
- click: '[data-testid="multiexec-target-checkbox"]'
- assert_text:
    selector: '[data-testid="multiexec-targets"]'
    contains: 2 / 3
- press:
    selector: '[data-testid="multiexec-target-search"]'
    key: Escape
- assert_not_visible: '[data-testid="multiexec-target-menu"]'
- assert_visible: '[data-testid="multiexec-bar"]'
- click: '[data-testid="tab-filter-chip"]'
- assert_items:
    selector: '[data-testid="tab-item"][data-multiexec-selected="true"]'
    attribute: data-tab-title
    equals:
    - QA Broadcast Alpha
    - QA Broadcast Gamma
- assert_attribute:
    selector: '[data-testid="tab-item"][data-active="true"]'
    name: data-tab-title
    equals: QA Broadcast Gamma
- fill:
    selector: '[data-testid="multiexec-input"]'
    value: echo QA_BROADCAST_SUBSET
- press:
    selector: '[data-testid="multiexec-input"]'
    key: Enter
- click: '[data-testid="tab-item"][data-tab-title="QA Broadcast Alpha"]'
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^\s*QA_BROADCAST_SUBSET\r?\s*$
- click: '[data-testid="tab-item"][data-tab-title="QA Broadcast Gamma"]'
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^\s*QA_BROADCAST_SUBSET\r?\s*$
- click: '[data-testid="tab-item"][data-tab-title="QA Broadcast Beta"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_BROADCAST_BARRIER
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?s)\A(?!.*QA_BROADCAST_SUBSET).*QA_BROADCAST_BARRIER
- wait_for:
    selector: '[data-testid="terminal-pane"]:not([data-terminal-ready="true"])'
    state: detached
    timeout_sec: 15
- assert_count:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    equal: 3
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"tab-chat-toggle"]') === null
    expect_truthy: true
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="ai-chat-drawer-hide"]'
- assert_not_visible: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- screenshot: workspace-broadcast-targets-33.png

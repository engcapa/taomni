id: TC-TAO-HOME-025
title: Native Go agent action loop with deterministic gateway and real processes
description: >-
  A loopback Go protocol gateway proposes an isolated Python calculator through Tao
  Home. Every file and command waits for visible confirmation. Real native test
  processes cover initial success, an explicit controlled regression, failed
  feedback, repair, feature extension and successful final tests. Replies are
  checked by flow and results, not exact wording. This deterministic case
  is independent of cloud credentials and runs on hosted platforms.
modes: [native]
covers: [F1.11]
tags: [p0, tao-home, native, regression]
fixtures: [reset_db, tao_agent]
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-tao-home-025-agent
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- wait_for: '[data-testid="tao-home-composer-input"]:enabled'
- observe_tao_provider: null
- tao_real_provider_expanded: {scenario: development}
- assert_no_runtime_errors: null
- assert_file_contains:
    path: ${fixture.tao_agent_log}
    contains: '"failure": true'
- screenshot: tao-agent-development-final.png
verification:
  review: reviewed
  requirements:
  - id: AGENT-CLOSED-LOOP
    requirement: Approved real files and native test exits drive the next development round.
    actions: [1, 2, 3, 4, 5, 6]
    checkpoints:
    - {step: 7, expectation: "No write before approval; two actual Python files; native tests pass, then fail after the explicit regression; the next turn receives the actual failure, repairs it, extends functionality and tests pass again. The final review adds no unapproved actions. Explicit invalid credentials are recorded separately with later stages unverified."}
    - {step: 8, expectation: No unhandled runtime errors.}
    - {step: 9, expectation: The actual next Go request contains the failed native test output.}
    results: [7, 8, 9]
  native:
  - check: Go protocol streaming, filesystem changes and actual child process exit statuses
    method: automated
    reason: Browser stubs cannot establish native provider, approved disk effects or real tests.
  visual:
  - check: Action review cards and result readability
    method: manual
    reason: Retained screenshots support review; text/exit checks do not certify full prototype fidelity.

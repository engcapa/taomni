id: TC-MAIN-RAIL-02
title: Shell Rail keeps horizontal Chinese names, theme and hit targets at narrow
  widths
description: Adapted for Workspace Shell v2. The permanent Rail, per-lane Navigator
  and merged workspace stripes replace the old expanded/collapsed sidebar wrappers.
  Retained results are declared in each requirement.
covers:
- F1.2
- F1.3
- F25.5
- F-I18n-1
tags:
- main
- sidebar
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-retained-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.shellLayout.v2
    value: '{"version": 2, "navigator": {"collapsedByLane": {"home": false, "build":
      true, "connect": true}, "lastArea": "sessions", "width": 360}}'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-zh-CN"]'
- click: '[data-testid="theme-cycle"]'
- assert_localstorage:
    key: taomni.appTheme.v1
    equals: light
- assert_text_equals:
    selector: '[data-testid="shell-rail-sessions"]'
    equals: 会话
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: 工作区
- assert_element_geometry:
    selector: '[data-testid="shell-rail-sessions"]'
    min_width: 1
    min_height: 1
    within_viewport: true
    hit_center: true
- assert_element_geometry:
    selector: '[data-testid="shell-rail-workspaces"]'
    min_width: 1
    min_height: 1
    within_viewport: true
    hit_center: true
- eval_readonly:
    expression: getComputedStyle(document.querySelector('nav button')).writingMode
      === 'horizontal-tb'
    expect_truthy: true
    timeout_sec: 5
- screenshot: main-rail-chinese-light-v2.png
- click: '[data-testid="theme-cycle"]'
- assert_localstorage:
    key: taomni.appTheme.v1
    equals: dark
- set_viewport:
    width: 800
    height: 600
- eval_readonly:
    expression: document.documentElement.scrollWidth <= innerWidth
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector('.taomni-control-bar [data-testid="window-drag-handle"]').getBoundingClientRect().height <= 32
    expect_truthy: true
    timeout_sec: 5
- right_click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":false'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: ''
- assert_element_geometry:
    selector: '[data-testid="shell-rail-workspaces"]'
    min_width: 1
    min_height: 1
    within_viewport: true
    hit_center: true
- press:
    selector: '[data-testid="shell-rail-workspaces"]'
    key: Enter
- click: '[data-testid="shell-navigator-page"][data-page="tools"]'
- assert_visible: '[data-testid="sidebar-tool-code-workspace"]'
- right_click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="sidebar-rail-menu-show-names"]'
- assert_localstorage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    contains: '"showNames":true'
- assert_text_equals:
    selector: '[data-testid="shell-rail-workspaces"]'
    equals: 工作区
- shell_navigate: tools
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_visible: '[data-testid="code-workspace-tool-rail-left"]'
- click: '[data-testid="code-workspace-bottom-tab-problems"]'
- assert_visible: '[data-testid="shell-host"][data-panel-id$=":problems"] [data-testid="code-workspace-problems-panel"]'
- assert_visible: '[data-testid="shell-rail-workspaces"]'
- eval_readonly:
    expression: document.documentElement.scrollWidth <= innerWidth
    expect_truthy: true
    timeout_sec: 5
- screenshot: main-rail-narrow-workspace-dark-v2.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Chinese names render horizontally in the light theme, with the title-bar
      grip outside the primary content.
    actions:
    - 4
    - 5
    - 6
    - 7
    - 9
    - 10
    - 11
    checkpoints:
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 12
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "equals":
        "light"}}'
    - step: 13
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-sessions\"]",
        "equals": "会话"}}'
    - step: 14
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-workspaces\"]",
        "equals": "工作区"}}'
    - step: 15
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"shell-rail-sessions\"]",
        "min_width": 1, "min_height": 1, "within_viewport": true, "hit_center": true}}'
    - step: 16
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"shell-rail-workspaces\"]",
        "min_width": 1, "min_height": 1, "within_viewport": true, "hit_center": true}}'
    - step: 17
      expectation: '{"eval_readonly": {"expression": "getComputedStyle(document.querySelector(''nav
        button'')).writingMode === ''horizontal-tb''", "expect_truthy": true, "timeout_sec":
        5}}'
    results:
    - 8
    - 12
    - 13
    - 14
    - 15
    - 16
    - 17
  - id: R2
    requirement: The 800px dark layout keeps the Rail and Tools overlay usable with
      names on and off.
    actions:
    - 19
    - 21
    - 24
    - 25
    - 29
    - 30
    - 32
    - 33
    - 37
    - 40
    checkpoints:
    - step: 20
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "equals":
        "dark"}}'
    - step: 22
      expectation: '{"eval_readonly": {"expression": "document.documentElement.scrollWidth
        <= innerWidth", "expect_truthy": true, "timeout_sec": 5}}'
    - step: 23
      expectation: '{"eval_readonly": {"expression": "Math.abs(document.querySelector(''[data-window-drag]'').getBoundingClientRect().height
        - innerHeight) < 1", "expect_truthy": true, "timeout_sec": 5}}'
    - step: 26
      expectation: '{"assert_localstorage": {"key": "taomni.codeWorkspace.toolWindowStripes.v1",
        "contains": "\"showNames\":false"}}'
    - step: 27
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-workspaces\"]",
        "equals": ""}}'
    - step: 28
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"shell-rail-workspaces\"]",
        "min_width": 1, "min_height": 1, "within_viewport": true, "hit_center": true}}'
    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"sidebar-tool-code-workspace\"]"}'
    - step: 34
      expectation: '{"assert_localstorage": {"key": "taomni.codeWorkspace.toolWindowStripes.v1",
        "contains": "\"showNames\":true"}}'
    - step: 35
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"shell-rail-workspaces\"]",
        "equals": "工作区"}}'
    - step: 38
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 39
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 41
      expectation: '{"assert_visible": "[data-testid=\"shell-host\"][data-panel-id$=\":problems\"]
        [data-testid=\"code-workspace-problems-panel\"]"}'
    - step: 42
      expectation: '{"assert_visible": "[data-testid=\"shell-rail-workspaces\"]"}'
    - step: 43
      expectation: '{"eval_readonly": {"expression": "document.documentElement.scrollWidth
        <= innerWidth", "expect_truthy": true, "timeout_sec": 5}}'
    results:
    - 20
    - 22
    - 23
    - 26
    - 27
    - 28
    - 31
    - 34
    - 35
    - 38
    - 39
    - 41
    - 42
    - 43
  visual:
  - check: 检查对应截图的图标、名称、选中态、标题栏抓手以及点击区域无缩小、遮挡或截断。
    method: manual
    reason: 实际尺寸断言辅助视觉评审；CI 图片在下载后评审。
  native:
  - check: 原生 WebView 交互和尺寸由真实 QA 应用执行；Linux 窗口拖动另由 TC-MAIN-RAIL-03 的 X11 输入和独立几何读数证明。
    method: external
    reason: browser 不能证明 OS 窗口移动，未执行平台不计作通过。

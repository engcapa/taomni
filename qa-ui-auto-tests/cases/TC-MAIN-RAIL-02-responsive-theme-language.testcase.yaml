id: TC-MAIN-RAIL-02
title: Left rail keeps upright Chinese names and a full-height grip at narrow widths in both themes
description: Browser layout acceptance at 1280 and 800 CSS pixels with theme, locale, collapse and names changes; screenshots require visual review.
covers: [F1.2, F1.3, F6.2, F-Sockscap-1, F25.5, F-I18n-1]
tags: [main, sidebar, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 120
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="welcome-panel"]'
  - set_viewport: {width: 1280, height: 820}
  - seed_storage: {key: taomni.sidebarCollapsed, value: 'false'}
  - seed_storage: {key: taomni.codeWorkspace.toolWindowStripes.v1, value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'}
  - reload_window: null
  - wait_for: '[data-testid="session-tree"]'
  - click: '[data-testid="language-switcher"]'
  - click: '[data-testid="language-option-zh-CN"]'
  - click: '[data-testid="theme-cycle"]'
  - assert_localstorage: {key: taomni.appTheme.v1, equals: light}
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]', equals: 会话}
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', equals: 工具}
  - eval_readonly:
      expression: getComputedStyle(document.querySelector('button[data-tool-window-id]')).writingMode === 'horizontal-tb'
      expect_truthy: true
  - screenshot: main-rail-chinese-light.png
  - click: '[data-testid="theme-cycle"]'
  - assert_localstorage: {key: taomni.appTheme.v1, equals: dark}
  - set_viewport: {width: 800, height: 600}
  - eval_readonly:
      expression: Math.abs(document.querySelector('[data-window-drag]').getBoundingClientRect().height - innerHeight) < 1
      expect_truthy: true
  - eval_readonly:
      expression: JSON.stringify({fits:document.documentElement.scrollWidth<=innerWidth,viewport:innerWidth,document:document.documentElement.scrollWidth,main:document.querySelector('.taomni-main-window').scrollWidth,status:document.querySelector('.taomni-status').scrollWidth,title:document.querySelector('.taomni-control-bar').scrollWidth})
      contains: '"fits":true'
      timeout_sec: 3
  - click: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-sessions"]'
  - wait_for: '[data-testid="collapsed-sidebar-rail"]'
  - assert_visible: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
  - right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
  - assert_text: {selector: '[data-testid="sidebar-rail-menu-show-names"]', contains: 显示工具窗口名称}
  - click: '[data-testid="sidebar-rail-menu-show-names"]'
  - assert_text_equals: {selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]', equals: ''}
  - screenshot: main-rail-narrow-dark-icons.png
  - press: {selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]', key: Enter}
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - assert_visible: '[data-testid="sidebar-tool-code-workspace"]'
  - right_click: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]'
  - click: '[data-testid="sidebar-rail-menu-show-names"]'
  - assert_text_equals: {selector: '[data-testid="expanded-sidebar-panel"] [data-testid="side-tab-tools"]', equals: 工具}
  - screenshot: main-rail-narrow-dark-names.png
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
  - assert_element_geometry:
      selector: '[data-testid="collapsed-sidebar-rail"] button[data-tool-window-id]'
      min_count: 3
      min_width: 32
      min_height: 32
      same_width: true
      icon_size: 16
  - click: '[data-testid="code-workspace-bottom-tab-problems"]'
  - assert_visible: '[data-testid="code-workspace-tool-window-problems"]'
  - assert_visible: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
  - screenshot: main-rail-narrow-workspace-dark.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 中文横排图标名称在明暗主题和 800px 窄窗口中正常，拖拽带全高且无横向溢出；底部 Problems 点击有效。
    actions:
    - 1
    - 3
    - 6
    - 8
    - 9
    - 10
    - 16
    - 18
    - 21
    - 24
    - 26
    - 29
    - 32
    - 33
    - 36
    - 39
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 11
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "equals": "light"}}'
    - step: 12
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"expanded-sidebar-panel\"] [data-testid=\"side-tab-sessions\"]",
        "equals": "会话"}}'
    - step: 13
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"expanded-sidebar-panel\"] [data-testid=\"side-tab-tools\"]",
        "equals": "工具"}}'
    - step: 14
      expectation: '{"eval_readonly": {"expression": "getComputedStyle(document.querySelector(''button[data-tool-window-id]'')).writingMode
        === ''horizontal-tb''", "expect_truthy": true}}'
    - step: 17
      expectation: '{"assert_localstorage": {"key": "taomni.appTheme.v1", "equals": "dark"}}'
    - step: 19
      expectation: '{"eval_readonly": {"expression": "Math.abs(document.querySelector(''[data-window-drag]'').getBoundingClientRect().height
        - innerHeight) < 1", "expect_truthy": true}}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "JSON.stringify({fits:document.documentElement.scrollWidth<=innerWidth,viewport:innerWidth,document:document.documentElement.scrollWidth,main:document.querySelector(''.taomni-main-window'').scrollWidth,status:document.querySelector(''.taomni-status'').scrollWidth,title:document.querySelector(''.taomni-control-bar'').scrollWidth})",
        "contains": "\"fits\":true", "timeout_sec": 3}}'
    - step: 22
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"]"}'
    - step: 23
      expectation: '{"assert_visible": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"side-tab-tools\"]"}'
    - step: 25
      expectation: '{"assert_text": {"selector": "[data-testid=\"sidebar-rail-menu-show-names\"]", "contains": "显示工具窗口名称"}}'
    - step: 27
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"side-tab-tools\"]",
        "equals": ""}}'
    - step: 30
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 31
      expectation: '{"assert_visible": "[data-testid=\"sidebar-tool-code-workspace\"]"}'
    - step: 34
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"expanded-sidebar-panel\"] [data-testid=\"side-tab-tools\"]",
        "equals": "工具"}}'
    - step: 37
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 38
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"collapsed-sidebar-rail\"] button[data-tool-window-id]",
        "min_count": 3, "min_width": 32, "min_height": 32, "same_width": true, "icon_size": 16}}'
    - step: 40
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tool-window-problems\"]"}'
    - step: 41
      expectation: '{"assert_visible": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"side-tab-tools\"]"}'
    results:
    - 2
    - 7
    - 11
    - 12
    - 13
    - 14

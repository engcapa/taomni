id: TC-IDE-PARITY-004-03
title: 'Keymap retained behavior: input protection, reserved strokes, IME, Reset/Delete, Shell shortcuts'
description: 'ED-PARITY-004 A1.6/A3.3/A3.4/A3.5 browser case — S6/S7/S8 and the DEC-08
  retention gates that the keymap refactor could plausibly have broken.

  Covers: editable-field protection (filter and Cheat Sheet search must receive
  Ctrl+F as text, never dispatch), reserved bare strokes still unbindable, IME
  composition never recorded, user-disabled actions still visible with their
  label, Reset/Delete round-trip, implicit fork from the default scheme, and the
  already-delivered Shell shortcuts Control+Shift+N / Control+Alt+/ plus Ctrl+Z.

  Mode: browser — every assertion is a renderer effect.

  '
covers:
- F25.5
tags:
- code-workspace
- keymap
- ed-parity-004
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'

id: TC-WS-018
title: Workspace long names and compact layouts keep rename, context and cancel actions
  usable
covers:
- F-Workspace-1
tags:
- workspace-first
- shell-layout
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- set_viewport:
    width: 1440
    height: 900
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-rename"]'
- fill:
    selector: '[data-testid="workspace-rename-input"]'
    value: Workspace with a deliberately long project name for layout review
- click: '[data-testid="workspace-canvas"] button:has-text("Cancel")'
- assert_not_visible: '[data-testid="workspace-rename-input"]'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: QA Main
- click: '[data-testid="workspace-rename"]'
- fill:
    selector: '[data-testid="workspace-rename-input"]'
    value: Workspace with a deliberately long project name for layout review
- click: '[data-testid="workspace-canvas"] button:has-text("Save")'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: Workspace with a deliberately long project name
- click: '[data-testid="workspace-hide"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) +
      '"workspace-canvas"]').getBoundingClientRect().width >= 1300
    expect_truthy: true
    timeout_sec: 10
- set_viewport:
    width: 400
    height: 700
- assert_element_geometry:
    selector: '[data-testid="workspace-context-toggle"]'
    min_width: 20
    min_height: 20
    viewport_margin: 0
- click: '[data-testid="workspace-rename"]'
- assert_element_geometry:
    selector: '[data-testid="workspace-rename-input"]'
    min_width: 160
    min_height: 20
    viewport_margin: 0
- assert_element_geometry:
    selector: '[data-testid="workspace-canvas"] button:has-text("Save")'
    min_width: 24
    min_height: 20
    viewport_margin: 0
- assert_element_geometry:
    selector: '[data-testid="workspace-canvas"] button:has-text("Cancel")'
    min_width: 24
    min_height: 20
    viewport_margin: 0
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) +
      '"workspace-canvas"]').scrollWidth <= document.querySelector('[data-testid'
      + String.fromCharCode(61) + '"workspace-canvas"]').clientWidth + 1
    expect_truthy: true
- screenshot: workspace-narrow-rename.png
- click: '[data-testid="workspace-canvas"] button:has-text("Cancel")'
- click: '[data-testid="workspace-context-toggle"]'
- wait_for: '[data-testid="workspace-context-pane"]'
- assert_element_geometry:
    selector: '[data-testid="workspace-context-close"]'
    min_width: 20
    min_height: 20
    viewport_margin: 0
- assert_element_geometry:
    selector: '[data-testid="workspace-context-pane"] [data-testid="workspace-add-session"]'
    min_width: 180
    min_height: 20
    viewport_margin: 0
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) +
      '"workspace-context-pane"]').scrollWidth <= document.querySelector('[data-testid'
      + String.fromCharCode(61) + '"workspace-context-pane"]').clientWidth + 1
    expect_truthy: true
- screenshot: workspace-narrow-context.png
- click: '[data-testid="workspace-context-close"]'
- assert_not_visible: '[data-testid="workspace-context-pane"]'
- click: '[data-testid="workspace-surface-terminal"]'
- assert_attribute:
    selector: '[data-testid="workspace-surface-terminal"]'
    name: aria-selected
    equals: 'true'
- click: '[data-testid="workspace-hide"]'
- click: '[data-testid="workspace-surface-overview"]'
- click: '[data-testid="workspace-hide"]'
- assert_text:
    selector: '[data-testid="workspace-canvas"] h1'
    contains: Overview
- click: '[data-testid="workspace-delete"]'
- assert_visible: '[role="alertdialog"][aria-label="Delete workspace"]'
- assert_element_geometry:
    selector: '[data-testid="workspace-delete-confirm"]'
    min_width: 24
    min_height: 20
    viewport_margin: 0
- click: '[role="alertdialog"] button:has-text("Cancel")'
- assert_not_visible: '[role="alertdialog"][aria-label="Delete workspace"]'
- assert_text:
    selector: '[data-testid="workspace-header"]'
    contains: Workspace with a deliberately long project name
- set_viewport:
    width: 1024
    height: 768
- click: '[data-testid="side-tab-work"]'
- assert_element_geometry:
    selector: '[data-testid="workspace-search"]'
    min_width: 120
    min_height: 20
    viewport_margin: 0
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) +
      '"workspace-navigator"]').scrollWidth <= document.querySelector('[data-testid'
      + String.fromCharCode(61) + '"workspace-navigator"]').clientWidth + 1
    expect_truthy: true
- screenshot: workspace-compact-overview.png

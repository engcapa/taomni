id: TC-IDE-PARITY-009-05
title: Structural Search includes inactive unsaved buffers within scope
description: 'Review S5/S6 regression: renderer entry, active/inactive buffer search, file/module scope and unchanged editor.
  Native also proves actual parser IPC, UTF-16 error/retry, and unchanged disk hashes.'
covers:
- F25.5
- F25.6
tags:
- code-workspace
- structural-search
- parity009
- regression
- p2
modes:
- browser
fixtures:
- reset_db
- parity009_ssr
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 45
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "qa-p2", "name": "p2-fix", "roots": [{"id": "parity009", "name": "parity009", "path": "${fixture.parity009_root}",
      "kind": "folder"}], "looseFiles": [], "lastActiveFile": {"kind": "root", "rootId": "parity009", "path": "src/StructuralTarget.java"},
      "lastOpenedAt": 1756100000000, "isGitRepo": false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 45
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Mod+a
- type: class StructuralTarget { void run() { System.out.println(999); } }
- wait_for:

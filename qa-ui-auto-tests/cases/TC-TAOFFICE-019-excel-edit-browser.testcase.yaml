id: TC-TAOFFICE-019
title: Edit XLSX cells with keyboard commit, cancellation and dirty close
description: Protect table headings and formulas, reject invalid numeric input, commit and advance to the next cell with Tab, and retain edits when cancelling the shared close dialog.
modes: [browser]
covers: [F-FILEOPEN-1]
tags: [p0, file-open, taoffice, taoffice-excel]
fixtures: [reset_db, file_open_files]
ui_standard: [UI-INP-06, UI-INP-07, UI-FOC-02, UI-KEY-04]
timeout_sec: 140
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- seed_storage:
    key: taomni.preview.modules.taoffice-excel.v1
    value: '{"lifecycle":"enabled","values":[]}'
- seed_storage:
    key: taomni.preview.taoffice-excel.workbook.v1
    value: '${fixture.taoffice_workbook_model}'
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="quarterly.xlsx"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="quarterly.xlsx"]'
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="C2"]'
- eval_readonly:
    expression: getComputedStyle(document.querySelector(".taoffice-excel-grid td")).borderBottomWidth === "1px"
    expect_truthy: true
- click: '[data-testid="taoffice-excel-cell"][data-address="A1"]'
- assert_attribute: {selector: '[data-testid="taoffice-excel-cell"][data-address="A1"]', name: aria-readonly, equals: 'true'}
- assert_disabled: '[data-testid="taoffice-excel-edit-cell"]'
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="A1"]', key: F2}
- assert_not_visible: '[data-testid="taoffice-excel-input"]'
- assert_text: {selector: '[data-testid="taoffice-excel-table-readonly"]', contains: Table headers and totals rows are read-only}
- click: '[data-testid="taoffice-excel-cell"][data-address="C2"]'
- assert_disabled: '[data-testid="taoffice-excel-edit-cell"]'
- click: '[data-testid="taoffice-excel-cell"][data-address="B2"]'
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', key: F2}
- wait_for: '[data-testid="taoffice-excel-input"]:focus'
- fill: {selector: '[data-testid="taoffice-excel-input"]', value: letters}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Enter}
- assert_text: {selector: '[data-testid="taoffice-excel-input-error"]', contains: Enter a valid number}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Escape}
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="B2"]:focus'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: '12'}
- click: '[data-testid="taoffice-excel-edit-cell"]'
- fill: {selector: '[data-testid="taoffice-excel-input"]', value: '15.5'}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Tab}
- wait_for: '[data-testid="taoffice-excel-cell"][data-address="C2"]:focus'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: '15.5'}
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="C2"]', contains: '31'}
- assert_attribute: {selector: '[data-testid="taoffice-excel-formula"]', name: value, equals: '=B2*2'}
- assert_enabled: '[data-testid="taoffice-excel-save-copy"]'
- wait_for: '[data-testid="explorer-workspace-tab"][data-active="true"] [data-testid="viewer-tab-dirty"]'
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- wait_for: '[data-testid="viewer-close-dialog"]'
- click: '[data-testid="viewer-close-cancel"]'
- wait_for: {selector: '[data-testid="viewer-close-dialog"]', state: detached}
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: '15.5'}
- screenshot: taoffice-edit-worksheet.png
- assert_file_open_bytes: {path: '${fixture.file_open_root}/quarterly.xlsx', sha256: '${fixture.taoffice_workbook_sha}'}
- dblclick: '[data-testid="taoffice-excel-cell"][data-address="A2"]'
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="A2"] [data-testid="taoffice-excel-cell-editor"] [data-testid="taoffice-excel-input"]'
- compose_text: {selector: '[data-testid="taoffice-excel-input"]', text: 审阅, during_key: Enter}
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="A2"] [data-testid="taoffice-excel-cell-editor"] [data-testid="taoffice-excel-input"]'
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Escape}
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="A2"]'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="A2"]', contains: Keyboard}
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="A2"]', key: ArrowRight}
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="B2"]'
- press: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', key: F2}
- fill: {selector: '[data-testid="taoffice-excel-input"]', value: '17'}
- press: {selector: '[data-testid="taoffice-excel-input"]', key: Enter}
- assert_focus_on: '[data-testid="taoffice-excel-cell"][data-address="B3"]'
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="B2"]', contains: '17'}
- assert_text: {selector: '[data-testid="taoffice-excel-cell"][data-address="C2"]', contains: '34'}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
    - id: R1
      ui_standard: [UI-INP-06, UI-INP-07, UI-FOC-02, UI-KEY-04]
      requirement: Cell editing owns keyboard input until a commit moves the selection or Escape restores the selected cell.
      actions: [48, 50, 52, 55, 57, 58, 59]
      checkpoints:
        - {step: 49, expectation: The editor is inside the active cell.}
        - {step: 51, expectation: A composing Enter keeps focus in the editor.}
        - {step: 53, expectation: Escape returns focus to A2.}
        - {step: 54, expectation: Cancelling preserves the original text.}
        - {step: 56, expectation: Right Arrow selects B2.}
        - {step: 60, expectation: Enter focuses the row below.}
        - {step: 61, expectation: B2 contains the committed number.}
        - {step: 62, expectation: The dependent formula displays the recalculated value.}
      results: [49, 51, 53, 54, 56, 60, 61, 62]
  visual:
    - {check: Active worksheet cell, method: automated, reason: The editor belongs to the selected gridcell and keyboard navigation restores visible focus.}
  native:
    - {check: Reopen the saved XLSX, method: external, reason: TC-TAOFFICE-020 verifies the disk copy in the isolated desktop app.}

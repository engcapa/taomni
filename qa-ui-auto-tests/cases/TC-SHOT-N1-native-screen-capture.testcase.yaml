id: TC-SHOT-N1
title: Native real screen capture backend returns a valid image
covers:
- F27.1
tags:
- screenshot
- native
- p1
modes:
- native
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
# Ensure the main window (and Tauri API) is ready before invoking backends.
- wait_for: '[data-testid="system-screenshot"]'
- wait: 5
# The overlay opens in a separate WebviewWindow in native mode, which the
# runner cannot address; verify the real backend directly. WebDriver waits
# for the returned promise to resolve; JSON.stringify + contains avoids the
# audit's ban on assignment and arrow functions in eval_readonly.
- eval_readonly:
    expression: 'window.__TAURI_INTERNALS__.invoke("screenshot_list_displays").then(JSON.stringify)'
    contains: '"width"'
- eval_readonly:
    expression: 'window.__TAURI_INTERNALS__.invoke("screenshot_capture_full", {displayId: null}).then(JSON.stringify)'
    contains: '"path"'
- eval_readonly:
    expression: 'window.__TAURI_INTERNALS__.invoke("screenshot_probe").then(JSON.stringify)'
    contains: '"permission"'

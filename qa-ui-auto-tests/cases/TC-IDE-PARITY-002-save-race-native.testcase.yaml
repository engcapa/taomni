id: TC-IDE-PARITY-002
title: "ED-PARITY-002 save-while-typing W0/W1/W2 byte + dirty retention baseline (native desktop)"
description: |
  ED-PARITY-002 / REQ-11 / CW-EDIT-003 packaged native desktop slice. It
  proves with real native writes, real acknowledgements and real watched-file
  notifications that a save freezes B1 on disk while newer typing keeps its
  own live buffer:

  - W0: an edit typed after the prepare/history await and before the byte
    writer cancels the save with ZERO writer calls (disk still B0).
  - W1: an edit typed after the REAL native writer was invoked but before its
    real ack is delivered keeps the live buffer and dirty flag (disk B1).
  - W2: an edit typed after the real ack and before the real watched-files
    notification completes keeps the live buffer (RISK-01 regression).

  The W0/W1/W2 holds are controlled by the isolated QA build's save-race gate
  (`save_race_*` verbs; a production binary fails them explicitly). The gate
  never fabricates acks/hashes: the writer, the ack and the watcher call are
  the production ones; only the delivery time point is held while the runner
  types through the real editor. In-page enter/release/revision/invoke/ack
  order is persisted as `save-race-trace.json` evidence.

  It also covers: one independent single-character undo group and a fresh
  explicit save; a real external rewrite + Decide Later then typed conflict
  with zero disk effect; explicit Load Disk restore then a successful save; an
  ISO-8859-1 unrepresentable-character failure with zero disk effect and
  recovery, plus a UTF-8 BOM+CRLF hold variant; and three controlled
  response-loss faults whose REAL read-back proves the intended bytes landed
  (committed), that a restored-old disk classifies as none and recovers, and
  that foreign disk content produces an unknown result with a recovery row,
  a blocked retry, a zero-write Decide Later and an explicit Acknowledge that
  unblocks a successful retry.

  Owner invalidation: closing the last view during the held real ack settles
  as committed-writeback-discarded; after reload the Recovery center shows the
  row and its Reopen action loads the real B1 bytes into the editor.

  Focus/selection/undo-grouping/cursor facts are recorded into
  `save-race-notes.json`; IDEA comparison (REF-PARITY-002-WIN-20260916) and
  remaining unverified layers are recorded in the ED-PARITY-002 report, not
  claimed here.
covers: [F25.5, F1.7]
tags: [code-workspace, ide-parity, save, save-race, w0-w1-w2, recovery, native, cross-platform, p0]
modes: [native]
native_platforms: [Linux, macOS, Windows]
fixtures: [reset_db, editor_save_race]
timeout_sec: 600
steps:
  - open: "${cfg.app.base_url}"
  # Fresh isolated app-data => empty vault => first-run master-password gate.
  - vault_first_run: "qa-native-gate-password"
  - wait_for: '[data-testid="welcome-panel"]'

  # Enter the isolated host workspace through persisted recents (no native
  # folder picker). The path-qualified row guards against other recents.
  - seed_storage:
      key: taomni.recentWorkspaces.v1
      value: '[{"id":"qa-parity-002","name":"qa-parity-002","roots":[{"id":"r1","name":"qa-parity-002","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastOpenedAt":1756100000000,"isGitRepo":false}]'
  - reload_window: null
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for: '[data-testid="code-workspace-tree-file"][data-path="edit.txt"]'

  # ---------------------------------------------------------------------
  # S0: open the reference B0 file. Disk bytes and dirty state are clean.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit.txt"
      equals: 2b7edc22ece15ead9636ecf67c54fa5e48bb7c4325409a7651fda976073ae88d
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: clean
  - save_race_note:
      label: s0-focus-open
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - screenshot: s0-open-b0-clean.png

  # ---------------------------------------------------------------------
  # S1: type S at the end and Mod+S. Disk becomes B1 with a fresh receipt;
  # the live buffer is clean again (no append, no EOL/BOM change).
  # ---------------------------------------------------------------------
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - save_race_note:
      label: s1-focus-before-save
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - type: "S"
  # The editor commits text into React store state on a 220 ms idle flush; the
  # sr-only observation node derives from that state.
  - wait: 0.6
  - save_race_note:
      label: s1-cursor-before-save
      expression: 'document.querySelector("[data-testid\x3d\"status-bar-workspace-cursor\"]")?.textContent'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: dirty
  - press: Mod+s
  - assert_file_receipt:
      path: "${fixture.workspace_root}/edit.txt"
      selector: '[data-testid="code-workspace-save-observation"]'
      encoding: UTF-8
      bom: false
      eol: lf
      expected_text: "alpha Alpha ALPHA\ntree tree\nline three\nS"
      require_history: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "false"
  - save_race_note:
      label: s1-focus-after-save
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - save_race_note:
      label: s1-cursor-after-save
      expression: 'document.querySelector("[data-testid\x3d\"status-bar-workspace-cursor\"]")?.textContent'
  - screenshot: s1-saved-b1.png

  # ---------------------------------------------------------------------
  # S2-W0 (edit-w0.txt, independent B0 copy): type S => B1 dirty with disk
  # still B0. Mod+S is held BEFORE the byte writer; typing X lands in the
  # live buffer only, and releasing cancels the save with zero writer calls.
  # ---------------------------------------------------------------------
  # Let the tree finish any async re-render (project facts / watcher refresh)
  # so the file row cannot go stale between element lookup and the click.
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-w0.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeS'
  - save_race_arm:
      stage: prepare
      filePath: "${fixture.workspace_root}/edit-w0.txt"
      timeoutMs: 60000
  - press: Mod+s
  - save_race_wait_entered:
      stage: prepare
      timeout_sec: 20
  - type: "X"
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSX'
  - save_race_release: null
  - wait: 1
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSX'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: cancelled
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "true"
  # Zero writer calls: the host bytes are still exactly B0.
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-w0.txt"
      equals: 2b7edc22ece15ead9636ecf67c54fa5e48bb7c4325409a7651fda976073ae88d
  - save_race_trace:
      artifact: s2-w0-trace.json
      expect_contains: [arm, enter, release, commit-settled]
      require_settled_kind: cancelled
      forbid_between:
        anchor: arm
        until: commit-settled
        events: [writer-invoked, ack-delivered, watcher-invoked]
  - screenshot: s2-w0-cancelled.png

  # ---------------------------------------------------------------------
  # S2-W1 (edit-w1.txt): type S => B1 dirty. Mod+S invokes the REAL writer;
  # the ack delivery is held. Typing X then releasing must keep the live
  # B2 buffer and dirty flag while disk stays at the frozen B1 bytes.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-w1.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - save_race_arm:
      stage: ack
      filePath: "${fixture.workspace_root}/edit-w1.txt"
      timeoutMs: 60000
  - press: Mod+s
  - save_race_wait_entered:
      stage: ack
      timeout_sec: 20
  - type: "X"
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSX'
  - save_race_release: null
  - wait: 1
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSX'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: saved-stale-snapshot
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "true"
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: committed
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-w1.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - save_race_trace:
      artifact: s2-w1-trace.json
      expect_contains: [arm, writer-invoked, enter, release, ack-delivered, commit-settled]
      require_ack_hashes: true
      require_settled_kind: saved-stale-snapshot
  - screenshot: s2-w1-ack-held.png
  # Record the actual undo grouping after the race (DEC-04: never forced to
  # match IDEA). The disk must not roll back with the buffer.
  - press: Mod+z
  - wait: 0.5
  - save_race_note:
      label: s2-w1-undo-text
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-w1.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - screenshot: s2-w1-undo-grouping.png

  # ---------------------------------------------------------------------
  # S2-W2 (edit-w2.txt, RISK-01): real writer ack delivered, REAL watcher
  # notify invoked, merge not yet run. Typing X in that window must survive
  # the merge and keep dirty=true.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-w2.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - save_race_arm:
      stage: watcher
      filePath: "${fixture.workspace_root}/edit-w2.txt"
      timeoutMs: 60000
  - press: Mod+s
  - save_race_wait_entered:
      stage: watcher
      timeout_sec: 20
  - type: "X"
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSX'
  - save_race_release: null
  - wait: 1
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSX'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: saved-stale-snapshot
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "true"
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-w2.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - save_race_trace:
      artifact: s2-w2-trace.json
      expect_contains: [arm, writer-invoked, ack-delivered, watcher-invoked, enter, release, commit-settled]
      require_ack_hashes: true
      require_settled_kind: saved-stale-snapshot
  - screenshot: s2-w2-watcher-held.png
  # Record the actual W2 undo grouping too; the disk stays frozen.
  - press: Mod+z
  - wait: 0.5
  - save_race_note:
      label: s2-w2-undo-text
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-w2.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172

  # ---------------------------------------------------------------------
  # S3 (edit.txt): stable B1 base. Move the caret, type one independent
  # character, undo it: buffer returns to B1 and the disk never rolls back.
  # Then a fresh explicit save lands the new B2 bytes with a new receipt.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - press: ArrowLeft
  - press: ArrowRight
  - type: "X"
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSX'
  - wait: 0.6
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: dirty
  - press: Mod+z
  - wait: 0.5
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeS'
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent?.indexOf("line threeSX") === -1'
      expect_truthy: true
  - save_race_note:
      label: s3-cursor-after-undo
      expression: 'document.querySelector("[data-testid\x3d\"status-bar-workspace-cursor\"]")?.textContent'
  # Undo is buffer-only: the saved B1 bytes stay on disk.
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - type: "X"
  - press: Mod+s
  - assert_file_receipt:
      path: "${fixture.workspace_root}/edit.txt"
      selector: '[data-testid="code-workspace-save-observation"]'
      encoding: UTF-8
      bom: false
      eol: lf
      expected_text: "alpha Alpha ALPHA\ntree tree\nline three\nSX"
      require_history: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit.txt"
      equals: 75699982db826f8191ba939313abc59ee80b767b1e2a51776a17f81585317900
  - save_race_note:
      label: s3-focus-after-save
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - screenshot: s3-undo-then-save-b2.png

  # ---------------------------------------------------------------------
  # S4 (edit-conflict.txt): real host rewrite under a dirty buffer raises
  # the conflict dialog. Decide Later removes only the queue entry: buffer
  # and disk are untouched, and the next explicit save is a typed conflict
  # with zero disk effect.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-conflict.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - host_write_file:
      path: "${fixture.workspace_root}/edit-conflict.txt"
      text: "EXTERNAL\n"
  - wait_for:
      selector: '[data-testid="external-file-conflict-dialog"]'
      timeout_sec: 30
  - screenshot: s4-conflict-dialog.png
  - click: '[data-testid="external-file-conflict-dialog"] button[aria-label="Dismiss external file conflict"]'
  - assert_not_visible: '[data-testid="external-file-conflict-dialog"]'
  - save_race_note:
      label: s4-focus-after-dismiss
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-conflict.txt"
      equals: c0cd94660e03e9ce34eccf2ebff469c2ee8b1d331e557ddfe9f473781f6c3ea9
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeS'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+s
  - wait: 1
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: conflict
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: none
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "true"
  - eval_readonly:
      expression: '!document.getElementById("code-workspace-save-observation")?.hasAttribute("data-receipt-id")'
      expect_truthy: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-conflict.txt"
      equals: c0cd94660e03e9ce34eccf2ebff469c2ee8b1d331e557ddfe9f473781f6c3ea9
  - save_race_trace:
      artifact: s4-conflict-trace.json
      require_settled_kind: conflict

  # ---------------------------------------------------------------------
  # S5 (edit-conflict2.txt): same real external rewrite, but the explicit
  # Load Disk action replaces the buffer with the disk text; a follow-up
  # independent edit + save succeeds.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-conflict2.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - host_write_file:
      path: "${fixture.workspace_root}/edit-conflict2.txt"
      text: "EXTERNAL\n"
  - wait_for:
      selector: '[data-testid="external-file-conflict-dialog"]'
      timeout_sec: 30
  - click: '[data-testid="external-file-conflict-dialog"] footer button:nth-of-type(2)'
  - wait: 1
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'EXTERNAL'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-conflict2.txt"
      equals: c0cd94660e03e9ce34eccf2ebff469c2ee8b1d331e557ddfe9f473781f6c3ea9
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "Z"
  - press: Mod+s
  - assert_file_receipt:
      path: "${fixture.workspace_root}/edit-conflict2.txt"
      selector: '[data-testid="code-workspace-save-observation"]'
      encoding: UTF-8
      bom: false
      eol: lf
      expected_text: "EXTERNAL\nZ"
      require_history: true
  - screenshot: s5-load-disk-then-save.png

  # ---------------------------------------------------------------------
  # S6 (edit-encoding.txt): ISO-8859-1 cannot encode 你. The save fails with
  # zero disk effect and stays dirty; undo + switching policy back to UTF-8
  # recovers. A UTF-8 BOM + CRLF representative variant is added, including
  # a watcher hold that keeps a new input while the frozen BOM+CRLF bytes
  # stay on disk.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-encoding.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - press: Mod+s
  - wait_for:
      selector: '[data-testid="code-workspace-save-observation"][data-state="saved"]'
      timeout_sec: 30
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-encoding.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - click: '[data-testid="status-bar-workspace-encoding"]'
  - wait_for: '[data-testid="file-encoding-dialog"]'
  - select_option: {selector: '[data-testid="file-encoding-select"]', value: ISO-8859-1}
  - wait: 0.2
  - click: '[data-testid="file-encoding-convert"]'
  - wait: 0.3
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "你"
  - press: Mod+s
  - wait: 1
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: failed
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: none
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "true"
  - eval_readonly:
      expression: '!document.getElementById("code-workspace-save-observation")?.hasAttribute("data-receipt-id")'
      expect_truthy: true
  # The target bytes are exactly the pre-failure B1 bytes.
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-encoding.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - screenshot: s6-encoding-failed.png
  # Undo the unrepresentable character and switch the policy back to UTF-8.
  - press: Mod+z
  - wait: 0.5
  - click: '[data-testid="status-bar-workspace-encoding"]'
  - wait_for: '[data-testid="file-encoding-dialog"]'
  - select_option: {selector: '[data-testid="file-encoding-select"]', value: UTF-8}
  - wait: 0.2
  - click: '[data-testid="file-encoding-convert"]'
  - wait: 0.3
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+s
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-encoding.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  # UTF-8 BOM + CRLF representative variant on the same B1 logical text.
  - click: '[data-testid="status-bar-workspace-encoding"]'
  - wait_for: '[data-testid="file-encoding-dialog"]'
  - select_option: {selector: '[data-testid="file-encoding-select"]', value: UTF-8}
  - click: '[data-testid="file-encoding-bom"]'
  - eval_readonly:
      expression: 'document.activeElement?.getAttribute("data-testid") === "file-encoding-bom" && document.activeElement?.checked'
      expect_truthy: true
  - wait: 0.2
  - click: '[data-testid="file-encoding-convert"]'
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"status-bar-message\"]")?.textContent'
      contains: 'save as UTF-8 BOM'
  - click: '[data-testid="status-bar-workspace-eol"]'
  - wait: 0.3
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+s
  - assert_file_receipt:
      path: "${fixture.workspace_root}/edit-encoding.txt"
      selector: '[data-testid="code-workspace-save-observation"]'
      encoding: UTF-8
      bom: true
      eol: crlf
      expected_text: "alpha Alpha ALPHA\ntree tree\nline three\nS"
      require_history: false
  - screenshot: s6-bom-crlf-saved.png
  # BOM+CRLF hold variant: a W2-class watcher hold on the same policy. The
  # frozen disk keeps the B1+X BOM+CRLF bytes while the live buffer gets Y.
  - save_race_note:
      label: s6-bom-crlf-focus-before-hold
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "X"
  - wait: 0.6
  - save_race_arm:
      stage: watcher
      filePath: "${fixture.workspace_root}/edit-encoding.txt"
      timeoutMs: 60000
  - press: Mod+s
  - save_race_wait_entered:
      stage: watcher
      timeout_sec: 20
  - type: "Y"
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSXY'
  - save_race_release: null
  - wait: 1
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeSXY'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: saved-stale-snapshot
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "true"
  # Frozen bytes: BOM + CRLF B1+X, exactly 47 bytes.
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-encoding.txt"
      equals: e1f9874b4479b6d4ff06d264a4c16fedf0f6c74ad205a7f48b5899514d189dba
  - save_race_trace:
      artifact: s6-bom-crlf-watcher-trace.json
      expect_contains: [arm, writer-invoked, ack-delivered, watcher-invoked, enter, release, commit-settled]
      require_ack_hashes: true
      require_settled_kind: saved-stale-snapshot
  - screenshot: s6-bom-crlf-watcher-held.png
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+s
  - assert_file_receipt:
      path: "${fixture.workspace_root}/edit-encoding.txt"
      selector: '[data-testid="code-workspace-save-observation"]'
      encoding: UTF-8
      bom: true
      eol: crlf
      expected_text: "alpha Alpha ALPHA\ntree tree\nline three\nSXY"
      require_history: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-encoding.txt"
      equals: 237aa6c59e51a8885aacf16a92af0514f2f7d741303d67f2f20058809d503198

  # ---------------------------------------------------------------------
  # S7a (edit-unknown.txt): controlled QA response loss. The REAL native
  # write completes but its response is withheld, so the production
  # unknown-effect path must re-read the real disk bytes and prove the
  # intended bytes landed (committed) instead of guessing.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-unknown.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - save_race_arm:
      stage: fault
      mode: unknown-response
      filePath: "${fixture.workspace_root}/edit-unknown.txt"
      timeoutMs: 60000
  - press: Mod+s
  - wait: 1.5
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: saved-current
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: committed
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-unknown.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - save_race_trace:
      artifact: s7-unknown-response-trace.json
      expect_contains: [arm, writer-invoked, fault-injected, unknown-readback, commit-settled]
      require_settled_kind: saved-current
      require_readback_outcome: committed
  - screenshot: s7-unknown-readback-committed.png

  # ---------------------------------------------------------------------
  # S7b (edit-unknown-old.txt): delayed response fault while the host
  # restores the OLD bytes. The real read-back sees the old hash, classifies
  # confirmed-none and the retry is allowed (and lands B1).
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-unknown-old.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - save_race_arm:
      stage: fault
      mode: unknown-response-delay
      filePath: "${fixture.workspace_root}/edit-unknown-old.txt"
      timeoutMs: 60000
  - press: Mod+s
  - save_race_wait_entered:
      stage: fault
      timeout_sec: 20
  # Restore the exact old B0 bytes while the real response is withheld.
  - host_write_file:
      path: "${fixture.workspace_root}/edit-unknown-old.txt"
      text: "alpha Alpha ALPHA\ntree tree\nline three\n"
  - save_race_release: null
  - wait: 1.5
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: failed
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: none
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-dirty
      equals: "true"
  - eval_readonly:
      expression: '!document.getElementById("code-workspace-save-observation")?.hasAttribute("data-receipt-id")'
      expect_truthy: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-unknown-old.txt"
      equals: 2b7edc22ece15ead9636ecf67c54fa5e48bb7c4325409a7651fda976073ae88d
  - save_race_trace:
      artifact: s7-old-trace.json
      expect_contains: [arm, writer-invoked, fault-pending, enter, release, fault-injected, unknown-readback, commit-settled]
      require_settled_kind: failed
      require_readback_outcome: none
  - screenshot: s7-old-confirmed-none.png
  # Recovery: the retry is allowed and lands the frozen B1 bytes. The
  # pre-failure attempt already snapshotted the identical B0 preimage, so the
  # deduplicated history id is legitimately absent here.
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+s
  - assert_file_receipt:
      path: "${fixture.workspace_root}/edit-unknown-old.txt"
      selector: '[data-testid="code-workspace-save-observation"]'
      encoding: UTF-8
      bom: false
      eol: lf
      expected_text: "alpha Alpha ALPHA\ntree tree\nline three\nS"
      require_history: false
  # Optionally leave the file saved on disk as B1.

  # ---------------------------------------------------------------------
  # S7c (edit-unknown-foreign.txt): delayed response fault while the host
  # writes FOREIGN bytes. The real read-back sees neither intended nor old:
  # failed/unknown with a recovery id; the retry is blocked with no writer
  # call. After reload the recovery center shows the foreign-blocked row;
  # Decide Later closes it with zero extra writes, and an explicit
  # Acknowledge removes it, after which a fresh edit saves successfully.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-unknown-foreign.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - save_race_arm:
      stage: fault
      mode: unknown-response-delay
      filePath: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      timeoutMs: 60000
  - press: Mod+s
  - save_race_wait_entered:
      stage: fault
      timeout_sec: 20
  - host_write_file:
      path: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      text: "FOREIGN\n"
  - save_race_release: null
  - wait: 1.5
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: failed
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: unknown
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: recovery
  - eval_readonly:
      expression: '!!document.getElementById("code-workspace-save-observation")?.getAttribute("data-recovery-id")'
      expect_truthy: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      equals: 861bbb9fd984a70f43ae176609ecb9ba7f9d35d2db54ea8af5bafb51d67812e2
  - save_race_trace:
      artifact: s7-foreign-trace.json
      expect_contains: [arm, writer-invoked, fault-pending, enter, release, fault-injected, unknown-readback, commit-settled]
      require_settled_kind: failed
      require_readback_outcome: foreign
  - screenshot: s7-foreign-unknown.png
  # The host mutation settles as a real external-conflict dialog; Decide Later
  # keeps both sides and must not write anything.
  - wait_for:
      selector: '[data-testid="external-file-conflict-dialog"]'
      timeout_sec: 30
  - click: '[data-testid="external-file-conflict-dialog"] button[aria-label="Dismiss external file conflict"]'
  - assert_not_visible: '[data-testid="external-file-conflict-dialog"]'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-result-kind
      equals: failed
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: unknown
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: recovery
  - eval_readonly:
      expression: '!!document.getElementById("code-workspace-save-observation")?.getAttribute("data-recovery-id")'
      expect_truthy: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      equals: 861bbb9fd984a70f43ae176609ecb9ba7f9d35d2db54ea8af5bafb51d67812e2
  # Blind retry is blocked before any writer call.
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+s
  - wait: 0.6
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"status-bar-message\"]")?.textContent'
      contains: 'Save blocked'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-disk-effect
      equals: unknown
  - eval_readonly:
      expression: '!document.getElementById("code-workspace-save-observation")?.hasAttribute("data-receipt-id")'
      expect_truthy: true
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      equals: 861bbb9fd984a70f43ae176609ecb9ba7f9d35d2db54ea8af5bafb51d67812e2
  # Reload #1: the recovery center must surface the persisted ledger row.
  # Tabs are not restored across a reload in this app, so the workspace is
  # re-entered through the same persisted recents row.
  - reload_window: null
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
  - wait_for:
      selector: '[data-testid="code-workspace-tab"]'
      timeout_sec: 60
  - wait_for:
      selector: '[data-testid="workspace-recovery-dialog"]'
      timeout_sec: 60
  - click: '[data-testid="workspace-recovery-disk-results-tab"]'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-results"]'
      contains: 'edit-unknown-foreign.txt'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-result-row"]'
      contains: 'Foreign content · retries blocked'
  - save_race_note:
      label: s7-foreign-ledger-row-reload1
      expression: 'document.querySelector("[data-testid\x3d\"workspace-recovery-disk-result-row\"]")?.textContent'
  - screenshot: s7-foreign-recovery-center.png
  # Decide Later: closing the recovery UI writes nothing.
  - click: '[data-testid="workspace-recovery-dialog"] footer button:last-of-type'
  - assert_not_visible: '[data-testid="workspace-recovery-dialog"]'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      equals: 861bbb9fd984a70f43ae176609ecb9ba7f9d35d2db54ea8af5bafb51d67812e2
  # Reload #2: explicit Acknowledge resolves the row and unblocks saving.
  - reload_window: null
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
  - wait_for:
      selector: '[data-testid="workspace-recovery-dialog"]'
      timeout_sec: 60
  - click: '[data-testid="workspace-recovery-disk-results-tab"]'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-result-row"]'
      contains: 'Foreign content · retries blocked'
  - click: '[data-testid="workspace-recovery-disk-result-row"] button[title="Acknowledge only this row and unblock saving this path"]'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-results"]'
      contains: 'No unresolved disk results'
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"status-bar-message\"]")?.textContent'
      contains: 'Acknowledged disk result'
  - click: '[data-testid="workspace-recovery-dialog"] footer button:last-of-type'
  - assert_not_visible: '[data-testid="workspace-recovery-dialog"]'
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      equals: 861bbb9fd984a70f43ae176609ecb9ba7f9d35d2db54ea8af5bafb51d67812e2
  # Post-resolution retry: a fresh edit saves over the clean FOREIGN buffer.
  - click: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key="root:r1:edit-unknown-foreign.txt"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "Z"
  - wait: 0.6
  - press: Mod+s
  - assert_file_receipt:
      path: "${fixture.workspace_root}/edit-unknown-foreign.txt"
      selector: '[data-testid="code-workspace-save-observation"]'
      encoding: UTF-8
      bom: false
      eol: lf
      expected_text: "FOREIGN\nZ"
      require_history: true
  - screenshot: s7-foreign-acknowledged-retry.png

  # ---------------------------------------------------------------------
  # S8 (edit-close.txt): close the buffer while the REAL ack is held. The
  # late result must not resurrect the tab; the bytes stay committed on
  # disk and a persisted recovery ledger row is shown by the Recovery
  # center, whose Reopen action loads the real B1 bytes into the editor.
  # ---------------------------------------------------------------------
  - wait: 0.8
  - dblclick: '[data-testid="code-workspace-tree-file"][data-path="edit-close.txt"]'
  - wait_for: '[data-testid="code-workspace-editor-pane"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+End
  - type: "S"
  - save_race_arm:
      stage: ack
      filePath: "${fixture.workspace_root}/edit-close.txt"
      timeoutMs: 60000
  - press: Mod+s
  - save_race_wait_entered:
      stage: ack
      timeout_sec: 20
  - click: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key="root:r1:edit-close.txt"] button[title="Close"]'
  - wait_for: '[data-testid="confirm-dialog"]'
  - click: '[data-testid="confirm-dialog-confirm"]'
  - assert_count:
      selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key="root:r1:edit-close.txt"]'
      equal: 0
  # The hold releases itself as `owner-invalidated` when the buffer is gone;
  # the real ack is then delivered to a dead owner (no explicit release).
  - wait: 1.5
  # The real write landed; the buffer was never resurrected and focus was not
  # stolen back into an editor.
  - assert_count:
      selector: '[data-testid="code-workspace-editor-tab-strip"] [data-editor-tab-key="root:r1:edit-close.txt"]'
      equal: 0
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-close.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - save_race_note:
      label: s8-focus-after-settle
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - save_race_trace:
      artifact: s8-close-during-ack-trace.json
      expect_contains: [arm, writer-invoked, enter, owner-invalidated, ack-delivered, commit-settled]
      require_ack_hashes: true
      require_settled_kind: committed-writeback-discarded
  - screenshot: s8-close-during-ack.png
  # Reload: the Recovery center must show the persisted row for this exact
  # path and transaction, and its Reopen must load the real B1 bytes.
  - reload_window: null
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
  - wait_for:
      selector: '[data-testid="code-workspace-tab"]'
      timeout_sec: 60
  - wait_for:
      selector: '[data-testid="workspace-recovery-dialog"]'
      timeout_sec: 60
  - click: '[data-testid="workspace-recovery-disk-results-tab"]'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-results"]'
      contains: 'edit-close.txt'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-result-row"]'
      contains: 'Saved to disk · editor writeback discarded'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-result-row"]'
      contains: 'writeback-discarded'
  - save_race_note:
      label: s8-ledger-row
      expression: 'document.querySelector("[data-testid\x3d\"workspace-recovery-disk-result-row\"]")?.textContent'
  - screenshot: s8-recovery-center.png
  - click: '[data-testid="workspace-recovery-disk-result-row"] button[title="Open the file as it is on disk right now"]'
  - wait_for:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      timeout_sec: 30
  - wait: 0.6
  - eval_readonly:
      expression: 'document.querySelector("[data-testid\x3d\"code-workspace-editor\"] .cm-content")?.textContent'
      contains: 'line threeS'
  - assert_attribute:
      selector: '[data-testid="code-workspace-save-observation"]'
      name: data-state
      equals: clean
  - assert_file_sha256:
      path: "${fixture.workspace_root}/edit-close.txt"
      equals: 77e11801e1006d4d36d0abb43cf57a9964954445acea8c6d017689796fa38172
  - save_race_note:
      label: s8-focus-after-reopen
      expression: 'document.activeElement?.getAttribute("data-testid") ?? document.activeElement?.className ?? document.activeElement?.tagName'
  - screenshot: s8-recovery-reopen-b1.png
  - click: '[data-testid="workspace-recovery-disk-result-row"] button[title="Acknowledge only this row and unblock saving this path"]'
  - assert_text:
      selector: '[data-testid="workspace-recovery-disk-results"]'
      contains: 'No unresolved disk results'
  - click: '[data-testid="workspace-recovery-dialog"] footer button:last-of-type'
  - assert_not_visible: '[data-testid="workspace-recovery-dialog"]'

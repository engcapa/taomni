id: TC-IDE-PARITY-002
title: ED-PARITY-002 save-while-typing W0/W1/W2 byte + dirty retention baseline (native desktop)
description: "ED-PARITY-002 / REQ-11 / CW-EDIT-003 packaged native desktop slice. It\nproves with real native writes,\
  \ real acknowledgements and real watched-file\nnotifications that a save freezes B1 on disk while newer typing\
  \ keeps its\nown live buffer:\n\n- W0: an edit typed after the prepare/history await and before the byte\n  writer\
  \ cancels the save with ZERO writer calls (disk still B0).\n- W1: an edit typed after the REAL native writer was\
  \ invoked but before its\n  real ack is delivered keeps the live buffer and dirty flag (disk B1).\n- W2: an edit\
  \ typed after the real ack and before the real watched-files\n  notification completes keeps the live buffer (RISK-01\
  \ regression).\n\nThe W0/W1/W2 holds are controlled by the isolated QA build's save-race gate\n(`save_race_*`\
  \ verbs; a production binary fails them explicitly). The gate\nnever fabricates acks/hashes: the writer, the ack\
  \ and the watcher call are\nthe production ones; only the delivery time point is held while the runner\ntypes\
  \ through the real editor. In-page enter/release/revision/invoke/ack\norder is persisted as `save-race-trace.json`\
  \ evidence.\n\nIt also covers: one independent single-character undo group and a fresh\nexplicit save; a real\
  \ external rewrite + Decide Later then typed conflict\nwith zero disk effect; explicit Load Disk restore then\
  \ a successful save; an\nISO-8859-1 unrepresentable-character failure with zero disk effect and\nrecovery, plus\
  \ a UTF-8 BOM+CRLF hold variant; and three controlled\nresponse-loss faults whose REAL read-back proves the intended\
  \ bytes landed\n(committed), that a restored-old disk classifies as none and recovers, and\nthat foreign disk\
  \ content produces an unknown result with a recovery row,\na blocked retry, a zero-write Decide Later and an explicit\
  \ Acknowledge that\nunblocks a successful retry.\n\nOwner invalidation: closing the last view during the held\
  \ real ack settles\nas committed-writeback-discarded; after reload the Recovery center shows the\nrow and its\
  \ Reopen action loads the real B1 bytes into the editor.\n\nFocus/selection/undo-grouping/cursor facts are recorded\
  \ into\n`save-race-notes.json`; IDEA comparison (REF-PARITY-002-WIN-20260916) and\nremaining unverified layers\
  \ are recorded in the ED-PARITY-002 report, not\nclaimed here.\n"
covers:
- F25.5
- F1.7
tags:
- code-workspace
- ide-parity
- save
- save-race
- w0-w1-w2
- recovery
- native
- cross-platform
- p0
modes:

id: TC-MODULES-043
title: Review and update an installed disabled module and keep it disabled on rollback
description: The browser fixture models a disabled earlier version with saved data and a later marketplace artifact.
  The renderer checks the version and requires confirmation. Rollback remains available in the installed list.
covers: [F-Modules-1]
tags: [p1, modules, marketplace, lifecycle]
modes: [browser]
fixtures: [reset_db, module_marketplace_preview]
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-marketplace-update"]'
- assert_text:
    selector: '[data-testid="module-marketplace-installed"]'
    contains: 0.0.9
- click: '[data-testid="module-marketplace-download"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-confirm"]'
    contains: Download update
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="module-marketplace-review"]'
- click: '[data-testid="module-marketplace-review"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-confirm"]'
    contains: Update
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="module-marketplace-current"]'
- assert_text:
    selector: '[data-testid="module-status-hello-plugin"]'
    contains: Disabled
- click: '[data-testid="module-action-rollback-hello-plugin"]'
- wait_for:
    selector: '[data-testid="module-marketplace-current"]'
    state: detached
- assert_text:
    selector: '[data-testid="module-marketplace-installed"]'
    contains: 0.0.9
- assert_text:
    selector: '[data-testid="module-status-hello-plugin"]'
    contains: Disabled
- click: '[data-testid="module-action-enable-hello-plugin"]'
- click: '[data-testid="module-action-open-hello-plugin-hello-plugin"]'
- assert_text:
    selector: '[data-testid="hello-plugin-values"]'
    contains: retained across module versions
- assert_no_runtime_errors: null
- screenshot: module-update-browser.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Offer and confirm a verified update for the installed version while preserving the disabled state.
    actions: [3, 4, 7, 9, 11, 13]
    checkpoints:
    - step: 6
      expectation: The installed version is shown separately from the update.
    - step: 8
      expectation: The download confirmation identifies this as an update.
    - step: 12
      expectation: The final review offers the Update action.
    - step: 14
      expectation: The approved version appears as current.
    - step: 15
      expectation: The updated module remains disabled.
    results: [6, 8, 12, 14, 15]
  - id: R2
    requirement: Roll back the code while preserving disabled state and data.
    actions: [16, 20, 21]
    checkpoints:
    - step: 18
      expectation: The earlier installed version is current after rollback.
    - step: 19
      expectation: Rollback does not enable the module.
    - step: 22
      expectation: After enabling, the original saved value can be read.
    - step: 23
      expectation: The renderer reports no unhandled errors.
    results: [18, 19, 22, 23]
  native:
  - check: Real package verification, host start and data ownership.
    method: external
    reason: TC-MODULES-042 exercises the production native boundary.
  visual:
  - check: Inspect the module tab after update and rollback.
    method: manual
    reason: The retained screenshot shows the saved value.

id: TC-WS-050
title: Workspace funnel combines category/search, preserves drafts and independent filters, and compact actions stay reachable
description: Renderer navigation and focus are covered here. TC-WS-051 verifies real IPC, live PTY continuity and file bytes; browser stubs cannot establish those
  effects.
modes:
- browser
covers:
- F-WS-1
- F-WS-2
- F-WS-3
- F1.5
tags:
- p0
- workspace-redesign
- regression
- filter
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-filter
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version": 1, "activeWorkspaceId": "default-workspace", "createdNodes": [], "workspaces": [{"id": "default-workspace", "name": "Default Workspace", "description":
      "", "isDefault": true, "rootFolders": [{"id": "root-1", "name": "qa-root", "path": "${fixture.platform_workspace_root}", "addedAt": 1}], "pinnedSessionIds": [], "activeLeftToolWindow":
      "project", "bottomDock": {"open": false, "activeTool": "terminal", "heightPx": 220}, "openTabs": [], "activeTabId": ""}, {"id": "second-workspace", "name": "Second Workspace",
      "description": "", "isDefault": false, "rootFolders": [], "pinnedSessionIds": [], "activeLeftToolWindow": "project", "bottomDock": {"open": false, "activeTool": "terminal",
      "heightPx": 220}, "openTabs": [], "activeTabId": ""}]}'
- reload_window:
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="code-workspace-tree-root"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="workspace-file-editor"]'
- press:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    key: Mod+a
- type:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    text: QA_FILTER_UNSAVED_DRAFT
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 2
- assert_items:
    selector: '[data-testid="platform-toolbar-actions"] button'
    attribute: data-testid
    equals:
    - workspace-tabs-filter-trigger
    - global-search-trigger
    - tab-overview-trigger
    - toggle-right-sidebar
    - titlebar-actions-more
- click: '[data-testid="workspace-tabs-filter-trigger"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-tabs-filter-trigger"]').querySelector('svg').classList.contains('lucide-filter')
    expect_truthy: true
- eval_readonly:
    expression: document.activeElement === document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-tabs-filter-search"]')
    expect_truthy: true
- assert_items:
    selector: '[data-testid="workspace-tab-categories"] button'
    attribute: data-testid
    equals:
    - workspace-tab-filter-all
    - workspace-tab-filter-files
    - workspace-tab-filter-ssh
    - workspace-tab-filter-database
    - workspace-tab-filter-sftp
    - workspace-tab-filter-remote
    - workspace-tab-filter-local
    - workspace-tab-filter-other
- click: '[data-testid="workspace-tab-filter-files"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="workspace-tab-filter-files"]'
    name: aria-pressed
    equals: 'true'
- fill:
    selector: '[data-testid="workspace-tabs-filter-search"]'
    value: readme.MD
- assert_count:
    selector: '[data-testid="workspace-tabs-filter-row"]'
    equal: 1
- click: '[data-testid="workspace-tabs-filter-row"]'
- assert_not_visible: '[data-testid="workspace-tabs-filter-menu"]'
- click: '[data-testid="workspace-tabs-filter-trigger"]'
- fill:
    selector: '[data-testid="workspace-tabs-filter-search"]'
    value: missing-document
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- assert_visible: '[data-testid="workspace-tabs-filter-empty"]'
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    equals: QA_FILTER_UNSAVED_DRAFT
- press:
    selector: '[data-testid="workspace-tabs-filter-search"]'
    key: Escape
- assert_not_visible: '[data-testid="workspace-tabs-filter-menu"]'
- eval_readonly:
    expression: document.activeElement === document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-tabs-filter-trigger"]')
    expect_truthy: true
- click: '[data-testid="workspace-tab-filter-chip"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 2
- click: '[data-testid="workspace-tabs-filter-trigger"]'
- click: '[data-testid="workspace-tab-filter-local"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 1
- assert_attribute:
    selector: '[data-testid="workspace-tab"]'
    name: data-tab-kind

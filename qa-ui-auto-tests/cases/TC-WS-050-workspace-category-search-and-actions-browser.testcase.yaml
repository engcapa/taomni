- assert_not_visible: '[data-testid="workspace-tabs-filter-menu"]'
- click: '[data-testid="workspace-switcher"]'
- click: '[data-testid="workspace-switcher-option-second-workspace"]'
- click: '[data-testid="workspace-tabs-filter-trigger"]'
- assert_attribute:

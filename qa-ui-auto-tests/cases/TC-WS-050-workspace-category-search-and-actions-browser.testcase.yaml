- press: Escape
- click: '[data-testid="workspace-switcher"]'
- click: '[data-testid="workspace-switcher-option-default-workspace"]'
- click: '[data-testid="workspace-tabs-filter-trigger"]'
- assert_attribute:
    selector: '[data-testid="workspace-tabs-filter-search"]'
    name: value
    equals: terminal
- assert_attribute:
    selector: '[data-testid="workspace-tab-filter-local"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="workspace-tabs-filter-clear"]'
- click: '[data-testid="workspace-tab-filter-all"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 2
- click: '[data-testid="workspace-tab-filter-ssh"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- assert_visible: '[data-testid="workspace-tabs-filter-empty"]'
- click: '[data-testid="workspace-tab-filter-database"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- assert_visible: '[data-testid="workspace-tabs-filter-empty"]'
- click: '[data-testid="workspace-tab-filter-sftp"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- assert_visible: '[data-testid="workspace-tabs-filter-empty"]'
- click: '[data-testid="workspace-tab-filter-remote"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- assert_visible: '[data-testid="workspace-tabs-filter-empty"]'
- click: '[data-testid="workspace-tab-filter-other"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 0
- assert_visible: '[data-testid="workspace-tabs-filter-empty"]'
- click: '[data-testid="workspace-tabs-filter-clear"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 2
- click: '[data-testid="workspace-tab-filter-files"]'
- press: Escape
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 3
- assert_not_visible: '[data-testid="workspace-tab-filter-chip"]'
- click: '[data-testid="workspace-tabs-filter-trigger"]'
- click: '[data-testid="workspace-tab-filter-files"]'
- press: Escape
- click: '[data-testid="workspace-tab"][data-tab-kind="file"]'
- assert_text_equals:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    equals: QA_FILTER_UNSAVED_DRAFT
- set_viewport:
    width: 800
    height: 700
- press: Mod+Shift+A
- wait_for: '[data-testid="code-workspace-search-everywhere"]'
- press: Escape
- click: '[data-testid="workspace-tabs-filter-trigger"]'
- assert_element_geometry:
    selector: '[data-testid="workspace-tabs-filter-menu"]'
    min_width: 220
    min_height: 140
    viewport_margin: 4
- press: Escape
- click: '[data-testid="titlebar-actions-more"]'
- assert_visible: '[data-testid="workspace-layout-split"]'
- assert_text_equals:
    selector: '[data-testid="workspace-toolbar-bottom-dock"]'
    equals: Show/hide workspace bottom dock
- assert_not_visible: '[data-testid="ptt-button"]'
- click: '[data-testid="workspace-toolbar-bottom-dock"]'
- assert_visible: '[data-testid="workspace-bottom-dock"]'
- assert_not_visible: '[data-testid="titlebar-actions-menu"]'
- click: '[data-testid="titlebar-actions-more"]'
- press: Escape
- eval_readonly:
    expression: document.activeElement === document.querySelector('[data-testid'+String.fromCharCode(61)+'"titlebar-actions-more"]')
    expect_truthy: true
- assert_no_runtime_errors:
- screenshot: workspace-filter-and-compact-actions.png

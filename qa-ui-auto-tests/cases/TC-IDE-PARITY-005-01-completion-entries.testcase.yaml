    - 54
  visual:
  - check: 候选弹窗锚定 caret，不遮挡接受入口；选中行可辨。
    method: manual
    reason: 截图需人工评审确认布局与状态。
  - check: 窄窗口与边缘翻转的像素级 IDEA 对照。
    method: manual
    reason: 逐像素对照归 V6 双侧比较。
  native:
  - check: 真实 JDT LS 候选、Rust 边界与磁盘字节仅在用例声明模式中采集；browser 证据不替代 native。
    method: external
    reason: provider 断言归 005-05 native。

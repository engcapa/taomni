id: TC-IDE-PARITY-005-01
title: Java Basic Completion entries, ordinal facts and focus protection
description: 'ED-PARITY-005 V1 (A1/A3), browser with the controlled parity provider.

  Ctrl+Space and Alt+/ both open exactly the controlled provider list at the same

  prefix, the repeated invocation reports ordinal 2 without a second commit, the

  Search Everywhere Actions entry and the keymap cheat sheet run the same action,

  Escape leaves the buffer byte-identical, and Find-input focus is never stolen.

  Boundary: mocked IPC provider (parity005_completion) — renderer routing, not

  real JDT LS semantics.

  '
covers:
- F25.5
tags:
- code-workspace
- completion
- ed-parity-005
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- wait_for: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="/preview/parity005"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="/preview/parity005"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="Main.java"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Main.java"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: End
- press: ArrowLeft
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - package parity005;
    - ''
    - public class Main {
    - '    void sample() {'
    - '        Stri;'
    - '    }'
    - '}'
    - ''
- press: Control+Space
- wait_for: .cm-tooltip-autocomplete
- wait: 0.4
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuilder
    timeout_sec: 10
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: org.apache.commons.lang3.StringUtils
    timeout_sec: 10
- eval_readonly:
    expression: window.__taomniQaCompletion.requests
    contains: '1'
- eval_readonly:
    expression: window.__taomniQaCompletion.activeFile
    contains: Main.java
- screenshot: tc-ide-parity-005-01-ctrl-space.png
- press: Control+Space
- wait: 0.5
- eval_readonly:
    expression: window.__taomniQaCompletion.requests
    contains: '2'
- press: Escape
- wait: 0.5
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - package parity005;
    - ''
    - public class Main {
    - '    void sample() {'
    - '        Stri;'
    - '    }'
    - '}'
    - ''
- eval_readonly:
    expression: 'document.activeElement ? document.activeElement.className : ""'
    contains: cm-content
- press: Alt+/
- wait_for: .cm-tooltip-autocomplete
- wait: 0.4
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuilder
    timeout_sec: 10
- press: Escape
- wait: 0.4
- press: Control+Alt+Shift+N
- wait_for: '[data-testid="code-workspace-search-everywhere"]'
- click: '[data-testid="search-everywhere-tab-actions"]'
- fill:
    selector: '[data-testid="quick-pick-input"]'
    value: Basic Completion
- wait_for: '[data-testid="quick-pick-item"][data-index="0"]'
- assert_text:
    selector: '[data-testid="quick-pick-item"][data-index="0"]'
    contains: Basic Completion
- press: Enter
- wait_for: .cm-tooltip-autocomplete
- wait: 0.4
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuilder
    timeout_sec: 10
- press: Escape
- wait: 0.4
- press: Control+Alt+/
- wait_for: '[data-testid="keymap-cheatsheet-dialog"]'
- fill:
    selector: '[data-testid="keymap-search-input"]'
    value: Basic Completion
- wait_for: '[data-testid="keymap-run-editor.basicCompletion"]'
- assert_enabled: '[data-testid="keymap-run-editor.basicCompletion"]'
- click: '[data-testid="keymap-run-editor.basicCompletion"]'
- wait_for: .cm-tooltip-autocomplete
- wait: 0.4
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuilder
    timeout_sec: 10
- press:
    key: Escape
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- assert_not_visible: .cm-tooltip-autocomplete
- wait: 0.4
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - package parity005;
    - ''
    - public class Main {
    - '    void sample() {'
    - '        Stri;'
    - '    }'
    - '}'
    - ''
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+f
- wait_for: '[data-testid="code-workspace-editor-search"]'
- fill:
    selector: '[data-testid="code-workspace-editor-search"] input[name="search"]'
    value: String
- assert_attribute:
    selector: '[data-testid="code-workspace-editor-search"] input[name="search"]'
    name: value
    equals: String
- press: Control+Space
- wait: 0.8
- assert_attribute:
    selector: '[data-testid="code-workspace-editor-search"] input[name="search"]'
    name: value
    equals: String
- eval_readonly:
    expression: document.activeElement === document.querySelector('.cm-workspace-search-input')
    expect_truthy: true
- assert_not_visible: .cm-tooltip-autocomplete
- eval_readonly:
    expression: window.__taomniQaCompletion.requests === 5
    expect_truthy: true
- press: Escape
- assert_not_visible: '[data-testid="code-workspace-editor-search"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - package parity005;
    - ''
    - public class Main {
    - '    void sample() {'
    - '        Stri;'
    - '    }'
    - '}'
    - ''
- screenshot: tc-ide-parity-005-01-final.png

id: TC-IDE-PARITY-005-01
title: 'Java Basic Completion entries: key bindings, Action search, cheat sheet and focus protection'
description: ED-PARITY-005 V1 (A1/A3) browser case. With the controlled parity provider (fixture B-005) the case presses the real keys of the same editor.basicCompletion action (Ctrl+Space, Alt+/), executes it from Search Everywhere's Actions page and from the keymap cheat sheet, and proves every entry routes to the same candidate list at the same caret with zero document edit. The second binding is pressed while the list is open and must report ordinal 2 / requestedScope=expanded while the provider scope stays honestly unchanged; Esc ends the session so the next explicit call is a fresh ordinal 1. Find input focus is never stolen. The provider is a controlled fixture, not a real JDT LS answer (native/provider evidence is 005-05).
covers:
- F25.5
tags:
- code-workspace
- completion
- ed-parity-005
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: ${fixture.parity005_root}
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="Main.java"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="Main.java"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
- assert_text:
    selector: '[data-testid="code-workspace-lsp-status-pill"]'
    contains: controlled parity provider
    timeout_sec: 20
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: End
- press: ArrowLeft
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: Ln 5, Col 13
    timeout_sec: 10
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 15
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuilder
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuffer
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringUtils
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-request-ordinal
    equals: '1'
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-requested-scope
    equals: default
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-provider-scope
    equals: unknown
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-phase
    equals: request
- screenshot: tc-ide-parity-005-01-ctrl-space.png
- press: Alt+/
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 15
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-request-ordinal
    equals: '2'
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-requested-scope
    equals: expanded
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-provider-scope
    equals: unchanged
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals: &id001
    - package parity005;
    - ''
    - public class Main {
    - '    void sample() {'
    - '        Stri;'
    - '    }'
    - '}'
    - ''
- press:
    key: Escape
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for:
    selector: .cm-tooltip-autocomplete
    state: hidden
    timeout_sec: 5
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals: *id001
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 15
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-request-ordinal
    equals: '1'
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-requested-scope
    equals: default
- press: Escape
- wait_for:
    selector: .cm-tooltip-autocomplete
    state: hidden
    timeout_sec: 5
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals: *id001
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
- click: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
- type: Basic Completion
- click: '[data-testid="code-workspace-search-everywhere"] >> text=Basic Completion'
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 15
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuilder
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-phase
    equals: request
- screenshot: tc-ide-parity-005-01-search-everywhere.png
- press:
    key: Escape
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for:
    selector: .cm-tooltip-autocomplete
    state: hidden
    timeout_sec: 5
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals: *id001
- press: Control+Alt+/
- wait_for:
    selector: '[data-testid="keymap-cheatsheet-dialog"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="keymap-search-input"]'
    value: Basic Completion
- wait_for: '[data-testid="keymap-item-editor.basicCompletion"]'
- click: '[data-testid="keymap-run-editor.basicCompletion"]'
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 15
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringBuilder
- assert_attribute:
    selector: '[data-testid="completion-session-observation"]'
    name: data-phase
    equals: request
- wait_for:
    selector: '[data-testid="keymap-cheatsheet-dialog"]'
    state: detached
    timeout_sec: 10
- press:
    key: Escape
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for:
    selector: .cm-tooltip-autocomplete
    state: hidden
    timeout_sec: 5
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals: *id001
- press: Control+f
- wait_for: '[data-testid="code-workspace-editor-search"]'
- click: '[data-testid="code-workspace-editor-search"] input[name="search"]'
- press: Control+Space
- press: Alt+/
- assert_not_visible: .cm-tooltip-autocomplete
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals: *id001
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-editor-search"]'
    state: hidden
    timeout_sec: 5
- screenshot: tc-ide-parity-005-01-focus-protection.png

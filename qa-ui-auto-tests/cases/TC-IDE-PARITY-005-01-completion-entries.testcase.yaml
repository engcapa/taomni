verification:
  review: reviewed
  requirements:
    - id: ED-PARITY-005-V1
      requirement: Ctrl+Space requests the current controlled candidate once; Escape preserves the input.
      actions: [4, 8, 17, 21]
      checkpoints:
        - step: 18
          expectation: The actual autocomplete list becomes visible.
        - step: 19
          expectation: The list contains the controlled StringBuilder candidate.
        - step: 20
          expectation: Exactly one provider request was recorded.
        - step: 22
          expectation: The completion popup closes after Escape.
        - step: 23
          expectation: The original prefix remains after Escape.
      results: [19, 20, 22, 23]
    - id: ED-PARITY-005-V1-entries
      requirement: Alternate key, Actions, All and cheat sheet entries each route one request without editing the buffer.
      actions: [25, 31, 36, 40, 44, 48, 52]
      checkpoints:
        - step: 27
          expectation: Alt slash produced exactly one additional request.
        - step: 38
          expectation: Actions Enter produced exactly one additional request.
        - step: 46
          expectation: All click produced exactly one additional request.
        - step: 54
          expectation: Cheat sheet Run produced exactly one additional request.
        - step: 56
          expectation: The original buffer remains intact after all entries.
      results: [27, 38, 46, 54, 56]
    - id: ED-PARITY-005-V1-repeat-focus
      requirement: Repeated invocation refreshes one request per key, while Find, Search Everywhere and settings inputs retain focus and issue none.
      actions: [57, 59, 62, 66, 69, 70, 78, 79, 90, 91]
      checkpoints:
        - step: 61
          expectation: Two Ctrl+Space invocations each issue one fresh request.
        - step: 64
          expectation: Alt slash adds exactly one request while the popup is open.
        - step: 71
          expectation: Find keys issue no completion request and leave Find focused.
        - step: 72
          expectation: The active input remains the Find query.
        - step: 80
          expectation: Search keys issue no completion request and leave the query focused.
        - step: 81
          expectation: The active input remains the Search Everywhere query.
        - step: 92
          expectation: Settings keys issue no completion request and leave the font input focused.
        - step: 93
          expectation: The active input remains the font family setting.
        - step: 95
          expectation: All protected input checks leave the Java buffer unchanged.
      results: [61, 64, 71, 72, 80, 81, 92, 93, 95]
    - id: ED-PARITY-005-V1-modifiers-composition
      requirement: Parameter-info chord does not request Basic Completion; a composing Basic key does not request completion and the committed text remains undoable.
      actions: [104, 107, 110]
      checkpoints:
        - step: 105
          expectation: Ctrl Shift Space did not call the Basic provider.
        - step: 108
          expectation: Ctrl Space during composition did not call the Basic provider.
        - step: 109
          expectation: The composition committed one space at the caret.
        - step: 111
          expectation: One Undo returns the exact original buffer.
      results: [105, 108, 109, 111]
  visual:
    - check: Popup anchor, selected row, documentation and viewport clipping against the IDEA state.
      method: manual
      reason: Screenshots require separate visual comparison.
  native:
    - check: Real JDT LS response, Rust bridge and host file bytes.
      method: external
      reason: Browser-controlled provider cannot prove these native boundaries; case 005-05 owns them.

  - click: '[data-testid="code-workspace-search-everywhere"] >> text=Basic Completion'
  - wait_for: '.cm-tooltip-autocomplete li'
  - parity005_trace: {fetch: 4, resolve: 0, pending: 0}
  - press: Escape
  - press: Control+Alt+/
  - wait_for: '[data-testid="keymap-cheatsheet-dialog"]'
  - fill:
      selector: '[data-testid="keymap-search-input"]'

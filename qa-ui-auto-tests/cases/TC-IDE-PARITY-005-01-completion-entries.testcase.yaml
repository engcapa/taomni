  - press: Control+Space
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringBuilder")'
  - parity005_trace: {fetch: 7, resolve: 0, pending: 0}
  - press: Alt+/
  - wait_for: '.cm-tooltip-autocomplete li:has-text("StringBuilder")'
  - parity005_trace: {fetch: 8, resolve: 0, pending: 0}
  - press: Escape
  - press: Control+f

id: TC-IDE-PARITY-005-01
title: Basic Completion editor entries and cancellation
description: Browser-controlled B-005 provider through the real workspace and editor action route.
covers: [F25.5]
tags: [code-workspace, completion, parity005, p1]
modes: [browser]
fixtures: [reset_db, parity005_completion]
timeout_sec: 180
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity005_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: Stri;
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Control+End
  - press: Control+Home
  - press: ArrowDown
  - press: ArrowDown
  - press: ArrowDown
  - press: ArrowDown
  - press: End
  - press: ArrowLeft
  - press: Control+Space
  - wait_for:
      selector: '.cm-tooltip-autocomplete li'
      timeout_sec: 20
  - assert_text:
      selector: '.cm-tooltip-autocomplete'
      contains: StringBuilder
  - eval_readonly:
      expression: window.__taomniQaParity005.observe().events.length === 1
      expect_truthy: true
  - press: Escape
  - wait_for:
      selector: '.cm-tooltip-autocomplete'
      state: hidden
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: Stri;
  - screenshot: tc-ide-parity-005-01-escape.png
  - press: Alt+/
  - wait_for: '.cm-tooltip-autocomplete li'
  - parity005_trace: {fetch: 2, resolve: 0, pending: 0}
  - eval_readonly:
      expression: window.__taomniQaParity005.observe().events.at(-1).ordinal === 1
      expect_truthy: true
  - screenshot: tc-ide-parity-005-01-popup.png
  - press: Escape
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
  - fill:
      selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
      value: Basic Completion
  - assert_text:
      selector: '[data-testid="code-workspace-search-everywhere"]'

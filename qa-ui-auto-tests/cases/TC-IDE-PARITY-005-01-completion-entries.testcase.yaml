  - press: Enter
  - wait_for: '.cm-tooltip-autocomplete li'
  - parity005_trace: {fetch: 3, resolve: 0, pending: 0}
  - press: Escape
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="All"]'
  - fill:

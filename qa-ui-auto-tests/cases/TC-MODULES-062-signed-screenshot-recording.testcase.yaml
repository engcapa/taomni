id: TC-MODULES-062
title: Signed Screenshot host encodes GIF and MP4 recordings
description: Install the matching signed package, finish two recordings in the same desktop process and verify their decoded frames and timestamps.
covers: [F-Modules-1, F27.1]
tags: [modules, screenshot, recording, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, module_signed_screenshot_archive]
timeout_sec: 260
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.screenshot_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.screenshot_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- click: '[data-testid="module-action-enable-screenshot"]'
- wait_for: '[data-testid="module-action-disable-screenshot"]'
- assert_signed_screenshot_host: idle
- click: '[data-testid="nav-mode-home"]'
- native_screenshot_scenario: {scenario: recorder, format: gif, signed_renderer: true}
- assert_signed_screenshot_host: running
- native_screenshot_scenario: {scenario: recorder, format: mp4, signed_renderer: true}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-screenshot"]'
- wait_for: '[data-testid="module-action-enable-screenshot"]'
- assert_signed_screenshot_host: disabled
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: encode-recordings
    requirement: The installed signed host encodes real captured frames in both formats and releases its lease on disable.
    actions: [7, 9, 12, 18]
    checkpoints:
    - {step: 8, expectation: The normal installer verified and selected the signed package.}
    - {step: 11, expectation: The host was idle before the first recording.}
    - {step: 13, expectation: 'The signed recorder renders the GIF preview. Decoded pixels and timestamps match the source and Done removes the temporary recording.'}
    - {step: 14, expectation: The selected signed host held the writer lease after encoding.}
    - {step: 15, expectation: The same host completes an MP4 with source-matched frames and native preview cleanup.}
    - {step: 20, expectation: Disabling the module released the host lease.}
    - {step: 21, expectation: The settings and recorder lifecycle produced no runtime errors.}
    results: [8, 11, 13, 14, 15, 20, 21]
  visual:
  - check: Recorder controls, decoded source pixels and preview lifecycle.
    method: automated
    reason: Each scenario drives the real recorder and compares the encoded output against original frame pixels.
  native:
  - check: Installed host identity, OS clipboard, output files and writer lease.
    method: automated
    reason: The case verifies artifacts and the isolated module profile outside the WebView.

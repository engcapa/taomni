id: TC-MAIL-KEYS-01
title: Mail list follows Thunderbird keyboard shortcuts outside inputs
description: 'TASK-22 (docs-feature/mail-thunderbird-parity-design.md AC-55).

  With a message selected, S stars it on the server, F moves to the next

  message and B back to the previous one. Ctrl+Shift+K focuses search, and

  typing S inside the search box does not star anything.

  Browser mode drives the stub server model (renderer orchestration only);

  native mode sends real key events to the Tauri WebView against the

  in-process fake IMAP server started by the mail_server fixture.

  '
covers:
- F-MAIL-12
tags:
- mail
- p2
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- click: '[data-testid="mail-message-row"][data-flagged="false"]'
- wait_for: '[data-testid="mail-message-row"][aria-pressed="true"][data-flagged="false"]'
- press:
    key: s
    selector: '[data-testid="mail-message-row"][aria-pressed="true"]'
- wait_for:
    selector: '[data-testid="mail-message-row"][aria-pressed="true"][data-flagged="true"]'
    timeout_sec: 15
- press:
    key: f
    selector: '[data-testid="mail-message-row"][aria-pressed="true"]'
- wait_for:
    selector: '[data-testid="mail-message-row"][aria-pressed="true"][data-flagged="false"]'
    timeout_sec: 10
- press:
    key: b
    selector: '[data-testid="mail-message-row"][aria-pressed="true"]'
- wait_for:
    selector: '[data-testid="mail-message-row"][aria-pressed="true"][data-flagged="true"]'
    timeout_sec: 10
- press: Control+Shift+K
- press:
    key: s
    selector: '[data-testid="mail-search-input"]'
- fill:
    selector: '[data-testid="mail-search-input"]'
    value: ''
- assert_count:
    selector: '[data-testid="mail-message-row"][data-flagged="true"]'
    equal: 1
- screenshot: mail-keys-01-shortcuts.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 列表焦点下 S 给选中邮件加星，F/B 切换到下一封/上一封（AC-55）。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 9
    - 11
    - 13
    - 15
    checkpoints:
    - step: 8
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"mail-message-row\"][aria-pressed=\"true\"][data-flagged=\"false\"]"}'
    - step: 12
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-message-row\"][aria-pressed=\"true\"][data-flagged=\"true\"]", "timeout_sec": 15}}'
    - step: 14
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-message-row\"][aria-pressed=\"true\"][data-flagged=\"false\"]", "timeout_sec": 10}}'
    - step: 16
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-message-row\"][aria-pressed=\"true\"][data-flagged=\"true\"]", "timeout_sec": 10}}'
    results:
    - 12
    - 14
    - 16
  - id: R2
    requirement: 在搜索框中输入 S 不触发加星；清空搜索后列表仍只有一封星标邮件（AC-55）。
    actions:
    - 17
    - 18
    - 19
    checkpoints:
    - step: 20
      expectation: '{"assert_count": {"selector": "[data-testid=\"mail-message-row\"][data-flagged=\"true\"]", "equal": 1}}'
    results:
    - 20
  visual:
  - check: 截图中选中行与星标状态正确。
    method: manual
    reason: 像素与布局需人工评审。
  native:
  - check: native 模式通过 WebDriver 发送真实按键验证快捷键与星标写回；browser 仅验证渲染层；平台结果分别记录。
    method: automated
    reason: 按实际执行模式与平台解释证据。

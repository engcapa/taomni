id: TC-AI-006
title: Go catalog hot refresh retains an unlisted thread pin without substitution
description: Changed-catalog browser fixture, not a real upstream removal. Authored, unrun.
covers: [F-AI-2.4]
tags: [ai, opencode-go, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 60
steps:
- open: ${cfg.app.base_url}/?goFixture=changed
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- click: '[data-testid="tab-chat-toggle"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- select_option:
    selector: '[data-testid="ai-chat-provider-select"]'
    value: opencode-go
- click: '[data-testid="ai-chat-drawer"] button[title="New chat"]'
- wait_for: '[data-testid="go-thread-model-select"]'
- assert_text:
    selector: '[data-testid="go-thread-model-select"]'
    contains: May be used for training
- assert_text:
    selector: '[data-testid="go-thread-model-select"]'
    contains: Deprecated
- select_option:
    selector: '[data-testid="go-thread-model-select"]'
    value: kimi-k3
- click: '[data-testid="go-catalog-refresh"]'
- assert_text:
    selector: '[data-testid="go-thread-model-select"]'
    contains: new-online-model
- assert_text:
    selector: '[data-testid="go-thread-model-select"]'
    contains: No longer listed?
- assert_attribute:
    selector: '[data-testid="go-thread-model-select"]'
    name: value
    equals: kimi-k3
- fill:
    selector: '[data-testid="go-thread-model-search"]'
    value: google
- assert_text:
    selector: '[data-testid="go-thread-model-select"]'
    contains: gemini-4-argon-contributor
- assert_attribute:
    selector: '[data-testid="go-thread-model-select"]'
    name: value
    equals: kimi-k3
verification:
  review: pending
  requirements:
  - id: R1
    requirement: Refresh updates options but never substitutes an unlisted pin; search preserves selection.
    actions: [7, 8, 12, 13, 17]
    checkpoints:
    - {step: 10, expectation: Training warning is visible.}
    - {step: 11, expectation: Deprecated model remains selectable.}
    - {step: 14, expectation: Newly available model appears.}
    - {step: 15, expectation: Unlisted model warning is present.}
    - {step: 16, expectation: Pin is unchanged.}
    - {step: 18, expectation: Search shows Google model.}
    - {step: 19, expectation: Search does not change the pin.}
    results: [10, 11, 14, 15, 16, 18, 19]
  visual:
  - {check: Grouping and warnings fit narrow WebViews., method: manual, reason: Not executed; inspect at each supported WebView width.}
  native:
  - {check: Real removal error triggers one refresh with no request retry., method: external, reason: Native runbook N-GO-06 exercises the gateway and IPC boundary.}

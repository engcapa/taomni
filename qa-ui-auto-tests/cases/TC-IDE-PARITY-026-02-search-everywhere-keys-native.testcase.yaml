id: TC-IDE-PARITY-026-02-search-everywhere-keys-native
title: Native Search Everywhere tab and group keys match IDEA and reopen empty
description: 'ED-PARITY-026 A1 native case in the isolated QA app: Search Everywhere opened with Ctrl+Shift+N switches tabs with the platform NextTab/PreviousTab chords (Alt+Right/Alt+Left; macOS Ctrl+Right/Ctrl+Left), Ctrl+Tab / Ctrl+Shift+Tab and Tab / Shift+Tab, jumps to the last/first result on the Actions tab with PageDown/PageUp and Ctrl+Down/Ctrl+Up, and reopens with an empty query.

  '
covers:
- F25.5
tags:
- code-workspace
- search-everywhere
- ed-parity-026
- p1
modes:
- native
fixtures:
- reset_db
- workspace_root
timeout_sec: 300
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-ed026","name":"qa-ed026","roots":[{"id":"qa-ed026","name":"qa-ed026","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-ed026","path":"notes.txt"},"lastOpenedAt":1756500000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Shift+N
- wait_for: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Go to file"]'
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press:
    key: Alt+ArrowRight
    macos_key: Control+ArrowRight
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-symbols"]'
    name: aria-selected
    equals: 'true'
- press:
    key: Alt+ArrowLeft
    macos_key: Control+ArrowLeft
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press:
    key: Alt+ArrowLeft
    macos_key: Control+ArrowLeft
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-classes"]'
    name: aria-selected
    equals: 'true'
- press: Control+Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press: Control+Shift+Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-classes"]'
    name: aria-selected
    equals: 'true'
- press: Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- screenshot: tc-ide-parity-026-02-files-tab.png
- press: Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-symbols"]'
    name: aria-selected
    equals: 'true'
- press: Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-actions"]'
    name: aria-selected
    equals: 'true'
- wait_for: '[data-testid="code-workspace-search-everywhere"] [data-index="1"]'
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]').length > 1
    expect_truthy: true
- press: PageDown
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')[document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]').length - 1].getAttribute('data-selected') === 'true'
    expect_truthy: true
- press: PageUp
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')[0].getAttribute('data-selected') === 'true'
    expect_truthy: true
- press: Control+ArrowDown
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')[document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]').length - 1].getAttribute('data-selected') === 'true'
    expect_truthy: true
- press: Control+ArrowUp
- eval_readonly:
    expression: document.querySelectorAll('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] [data-index]')[0].getAttribute('data-selected') === 'true'
    expect_truthy: true
- type:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    text: zzqq
- assert_attribute:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    name: value
    equals: zzqq
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    state: detached
    timeout_sec: 5
- press: Control+Shift+N
- wait_for: '[data-testid="code-workspace-search-everywhere"]'
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"code-workspace-search-everywhere"] input').value === ''
    expect_truthy: true
- press: Escape

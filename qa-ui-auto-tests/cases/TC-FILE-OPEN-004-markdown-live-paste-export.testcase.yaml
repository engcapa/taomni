id: TC-FILE-OPEN-004
title: Markdown live widgets preserve source, paste a real table/image and export self-contained HTML
description: AC11/12/13/15. Real CodeMirror renderer and Chromium clipboard, not simulation buttons. Asserts live/source/split
  rendering, one-step table Undo, stored image bytes/link, export contents and unchanged source bytes. Browser VFS/clipboard
  and actual browser download are not native OS clipboard/save-dialog evidence. PDF/print, Word/PNG export, native image clipboard
  formats and dialog failures remain explicit unrun native gaps. Real Mermaid (not mocked) is asserted in live/split and the
  self-contained HTML artifact. Ctrl+Y is the Linux/Windows standard Redo and Cmd+Shift+Z is used on macOS; async clipboard
  status waits for actual completion. Light screenshots retained; dark prototype comparison still requires separate hosted
  visual evidence.
modes:
- browser
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p0
- file-open
- markdown
- clipboard
- export
- crash-regression
fixtures:
- reset_db
- file_open_files
timeout_sec: 240

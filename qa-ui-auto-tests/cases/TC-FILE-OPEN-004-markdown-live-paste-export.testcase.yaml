id: TC-FILE-OPEN-004
title: Markdown live widgets preserve source, paste a real table/image and export self-contained HTML
description: AC11/12/13/15. Real CodeMirror renderer and Chromium clipboard, not simulation buttons. Asserts live/source/split
  rendering, one-step table Undo, stored image bytes/link, export contents and unchanged source bytes. Browser VFS/clipboard
  and actual browser download are not native OS clipboard/save-dialog evidence. PDF/print, Word/PNG export, native image clipboard
  formats and dialog failures remain explicit unrun native gaps.
modes:
- browser
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p0
- file-open
- markdown
- clipboard
- export
- crash-regression
fixtures:
- reset_db
- file_open_files
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-file-open-markdown
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="live.md"]'
- wait_for: '[data-testid="markdown-editor"][data-mode="live"]'
- assert_visible: '[data-testid="markdown-outline"]'
- assert_text_equals:
    selector: '[data-testid="markdown-outline"] button[data-heading-from="0"]'
    equals: File open Markdown
- assert_visible: '[data-testid="markdown-image-widget"] img'
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/live.md
    sha256: ${fixture.file_open_markdown_sha}
- click: '[data-testid="markdown-outline"] button[data-heading-from="0"]'
- assert_text:
    selector: '[data-testid="viewer-editor"] .cm-line'
    contains: '# File open Markdown'
- click: '[data-testid="markdown-mode-split"]'
- wait_for: '[data-testid="markdown-preview"] h1'
- assert_text_equals:
    selector: '[data-testid="markdown-preview"] h1'
    equals: File open Markdown
- assert_text_equals:
    selector: '[data-testid="markdown-preview"] strong'
    equals: Rendered bold
- click: '[data-testid="markdown-mode-source"]'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+End
    macos_key: Meta+ArrowDown
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Enter
- seed_clipboard: "Name\tValue\nAlpha\t1"
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+v
    macos_key: Meta+v
- wait_for: '[data-testid="markdown-paste-status"]'
- assert_text:
    selector: '[data-testid="viewer-editor"]'
    contains: '| Name | Value |'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+z
    macos_key: Meta+z
- assert_text:
    selector: '[data-testid="viewer-editor"]'
    contains: "Name\tValue"
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+Shift+z
    macos_key: Meta+Shift+z
- assert_text:
    selector: '[data-testid="viewer-editor"]'
    contains: '| Alpha | 1 |'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+End
    macos_key: Meta+ArrowDown
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Enter
- seed_clipboard_image:
    selector: '[data-testid="markdown-outline"]'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+v
    macos_key: Meta+v
- assert_text:
    selector: '[data-testid="markdown-paste-status"]'
    contains: relative links inserted
- assert_pattern:
    selector: '[data-testid="viewer-editor"]'
    regex: assets/image-[^\s)]+\.png
- click: '[data-testid="viewer-save"]'
- click: '[data-testid="markdown-mode-live"]'
- wait_for: '[data-testid="markdown-table-widget"]'
- assert_count:
    selector: '[data-testid="markdown-image-widget"]'
    min: 2
- click: '[data-testid="markdown-image-widget"]:has(img[alt="Original"])'
- click: '[data-testid="markdown-image-widget"]:has(img[alt="Original"]) button[aria-label="Zoom image (view only)"]'
- assert_text:
    selector: '[data-testid="markdown-image-widget"]:has(img[alt="Original"]) button[aria-label="Zoom image (view only)"]'
    contains: 75%
- assert_count:
    selector: '[data-testid="file-viewer"][data-dirty="true"]'
    equal: 0
- fill:
    selector: '[data-testid="markdown-table-widget"] [data-cell-row="1"][data-cell-column="1"]'
    value: '2'
- click: '[data-testid="markdown-mode-source"]'
- assert_text:
    selector: '[data-testid="viewer-editor"]'
    contains: '| Alpha | 2 |'
- click: '[data-testid="viewer-save"]'
- click: '[data-testid="markdown-mode-split"]'
- assert_count:
    selector: '[data-testid="markdown-preview"] table tbody tr'
    equal: 1
- eval_readonly:
    expression: document.querySelectorAll(".fv-md-preview-pane img").length === 2 && document.querySelectorAll(".fv-md-preview-pane
      img")[0].complete && document.querySelectorAll(".fv-md-preview-pane img")[0].naturalWidth > 0 && document.querySelectorAll(".fv-md-preview-pane
      img")[1].complete && document.querySelectorAll(".fv-md-preview-pane img")[1].naturalWidth > 0
    expect_truthy: true
    timeout_sec: 10
- click: '[data-testid="markdown-export"]'
- assert_visible: '[data-testid="markdown-export-pdf"]'
- assert_visible: '[data-testid="markdown-export-png"]'
- assert_visible: '[data-testid="markdown-export-docx"]'
- assert_visible: '[data-testid="markdown-export-markdown"]'
- assert_visible: '[data-testid="markdown-export-richtext"]'
- assert_visible: '[data-testid="markdown-export-html-source"]'
- assert_visible: '[data-testid="markdown-export-print"]'
- click: '[data-testid="markdown-export-pdf"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- assert_visible: '[data-testid="markdown-export-confirm"]'
- press:
    selector: '[data-testid="markdown-export-settings"] select[aria-label="Paper"]'
    key: Escape
- assert_not_visible: '[data-testid="markdown-export-settings"]'
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-docx"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- assert_visible: '[data-testid="markdown-export-confirm"]'
- press:
    selector: '[data-testid="markdown-export-settings"] select[aria-label="Paper"]'
    key: Escape
- assert_not_visible: '[data-testid="markdown-export-settings"]'
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-print"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- assert_visible: '[data-testid="markdown-export-confirm"]'
- press:
    selector: '[data-testid="markdown-export-settings"] select[aria-label="Paper"]'
    key: Escape
- assert_not_visible: '[data-testid="markdown-export-settings"]'
- click: '[data-testid="markdown-export"]'
- assert_download:
    trigger: '[data-testid="markdown-export-html"]'
    filename: live.html
    contains:
    - File open Markdown
    - <table
    - data:image/png;base64,
    - Alpha
- assert_text:
    selector: '[data-testid="markdown-export-status"]'
    contains: Export completed
- click: '[data-testid="markdown-export"]'
- assert_download:
    trigger: '[data-testid="markdown-export-png"]'
    filename: live.png
- assert_text:
    selector: '[data-testid="markdown-export-status"]'
    contains: Export completed
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-richtext"]'
- assert_attribute:
    selector: '[data-testid="markdown-export-status"]'
    name: data-export-state
    equals: copied
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-html-source"]'
- assert_attribute:
    selector: '[data-testid="markdown-export-status"]'
    name: data-export-state
    equals: copied
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-markdown"]'
- assert_attribute:
    selector: '[data-testid="markdown-export-status"]'
    name: data-export-state
    equals: failed
- assert_text:
    selector: '[data-testid="viewer-operation-error"]'
    contains: Markdown + image folder export requires the desktop app
- assert_count:
    selector: '[data-testid="file-viewer"][data-dirty="true"]'
    equal: 0
- assert_count:
    selector: '[data-testid="file-viewer"][data-dirty="true"]'
    equal: 0
- click: '[data-testid="tab-item"][data-tab-type="file-viewer"][data-active="true"] [data-testid="tab-close"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="live.md"]'
- wait_for: '[data-testid="markdown-editor"]'
- click: '[data-testid="markdown-mode-source"]'
- assert_text:
    selector: '[data-testid="viewer-editor"]'
    contains: '| Alpha | 2 |'
- assert_pattern:
    selector: '[data-testid="viewer-editor"]'
    regex: assets/image-[^\s)]+\.png
- assert_no_runtime_errors: null
- screenshot: markdown-live-paste-export.png

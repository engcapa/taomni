id: TC-133
title: SSH bookmark file and folder dialogs cancel without losing editor state
covers:
- F6.3
tags:
- ssh
- session
- settings
- bookmark
- dialogs
- cancel
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-bookmark-dialog.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-bookmark-dialog
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions
- assert_disabled: '[data-testid="session-custom-icon"]'
- fill:
    selector: 'input[aria-label="Background image"]'
    value: /tmp/qa-ssh-background-original.png
- click: '[data-testid="session-background-browse"]'
- wait_for: '[data-testid="text-input-dialog"]'
- assert_attribute:
    selector: '[data-testid="text-input-dialog-input"]'
    name: value
    equals: /tmp/qa-ssh-background-original.png
- click: '[data-testid="text-input-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="text-input-dialog"]'
    state: detached
- assert_attribute:
    selector: 'input[aria-label="Background image"]'
    name: value
    equals: /tmp/qa-ssh-background-original.png
- click: '[data-testid="session-new-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-cancel"]'
- wait_for:
    selector: '[data-testid="text-input-dialog"]'
    state: detached
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions
- click: '[data-testid="session-new-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: QA SSH Dialog Recovery
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="text-input-dialog"]'
    state: detached
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions / QA SSH Dialog Recovery
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-dialog-recovery
- fill:
    selector: 'textarea[aria-label="Description notes"]'
    value: dialog cancel recovery
- fill:
    selector: 'input[aria-label="Tags"]'
    value: ssh,dialog,recovery
- set_check:
    selector: '[data-testid="session-disable-ai-write"]'
    checked: true
- assert_attribute:
    selector: '[data-testid="session-name"]'
    name: value
    equals: qa-ui-auto-ssh-dialog-recovery
- assert_attribute:
    selector: 'textarea[aria-label="Description notes"]'
    name: value
    equals: dialog cancel recovery
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions / QA SSH Dialog Recovery
- assert_attribute:
    selector: '[data-testid="session-disable-ai-write"]'
    name: data-checked
    equals: 'true'
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-dialog-recovery"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-dialog-recovery"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- assert_attribute:
    selector: '[data-testid="session-folder-select"]'
    name: value
    equals: User sessions / QA SSH Dialog Recovery
- assert_attribute:
    selector: 'textarea[aria-label="Description notes"]'
    name: value
    equals: dialog cancel recovery
- assert_attribute:
    selector: 'input[aria-label="Tags"]'
    name: value
    equals: ssh,dialog,recovery
- assert_attribute:
    selector: '[data-testid="session-disable-ai-write"]'
    name: data-checked
    equals: 'true'
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 133-ssh-bookmark-dialog-cancel.png

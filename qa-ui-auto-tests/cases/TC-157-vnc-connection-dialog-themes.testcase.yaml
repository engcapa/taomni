id: TC-157
title: VNC connection dialogs are readable in light and dark themes
description: Inspect the unencrypted warning, username/password form and authentication error in both themes. Preserve password autofocus, masking, disabled empty-password
  submission and Enter-to-submit. Screenshots require visual review; the successful fixture handshake proves corrected credentials still connect.
covers:
- F9.6
tags:
- vnc
- p1
- regression
modes:
- browser
- native
fixtures:
- reset_db
- vnc_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="theme-cycle"]'
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: light
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${fixture.vnc_host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.vnc_port}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-vnc-fixture
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-fixture"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-fixture"]'
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 20
- screenshot: 157-warning-light.png
- click: '[data-testid="theme-cycle"]'
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: dark
- screenshot: 157-warning-dark.png
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-auth-password"]'
    timeout_sec: 20
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'vnc-auth-password'
    timeout_sec: 5
- assert_attribute:
    selector: '[data-testid="vnc-auth-password"]'
    name: type
    equals: password
- assert_disabled: '[data-testid="vnc-auth-ok"]'
- fill:
    selector: '[data-testid="vnc-auth-username"]'
    value: qa-vnc-user
- fill:
    selector: '[data-testid="vnc-auth-password"]'
    value: invalid-test-password
- assert_enabled: '[data-testid="vnc-auth-ok"]'
- screenshot: 157-auth-dark.png
- click: '[data-testid="theme-cycle"]'
- click: '[data-testid="theme-cycle"]'
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: light
- screenshot: 157-auth-light.png
- click: '[data-testid="vnc-auth-ok"]'
- wait_for:
    selector: '[data-testid="vnc-auth-error"]'
    timeout_sec: 20
- screenshot: 157-error-light.png
- click: '[data-testid="theme-cycle"]'
- assert_attribute:
    selector: html
    name: data-app-theme
    equals: dark
- assert_visible: '[data-testid="vnc-auth-error"]'
- screenshot: 157-error-dark.png
- fill:
    selector: '[data-testid="vnc-auth-password"]'
    value: ${env.QA_VNC_PASSWORD}
- press:
    selector: '[data-testid="vnc-auth-password"]'
    key: Enter
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 20
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]'
    timeout_sec: 20
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "auth", "ok": true, "security": "VNCAuth"'
- host_write_file:
    path: ${fixture.vnc_control}
    text: 'drop

      '
- wait_for:
    selector: '[data-testid="vnc-reconnect"]'
    timeout_sec: 15
- screenshot: 157-disconnected-dark.png
- click: '[data-testid="vnc-reconnect"]'
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 20
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]'
    timeout_sec: 20
- eval_readonly:
    expression: document.querySelector('.vnc-container canvas').getContext('2d').getImageData(16, 16, 1, 1).data[3] === 255
    timeout_sec: 10
- wait: 1.5
- screenshot: 157-reconnected.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Connection warning and authentication form support both themes while preserving password focus, masking and keyboard submission.
    actions:
    - 1
    - 3
    - 6
    - 8
    - 9
    - 10
    - 11
    - 13
    - 14
    - 19
    - 22
    - 27
    - 28
    - 31
    - 32
    - 35
    - 38
    - 42
    - 43
    - 45
    checkpoints:
    - step: 4
      expectation: '{"assert_attribute": {"selector": "html", "name": "data-app-theme", "equals": "light"}}'
    - step: 20
      expectation: '{"assert_attribute": {"selector": "html", "name": "data-app-theme", "equals": "dark"}}'
    - step: 24
      expectation: "{\"eval_readonly\": {\"expression\": \"document.activeElement?.getAttribute('data-testid') === 'vnc-auth-password'\", \"timeout_sec\": 5}}"
    - step: 25
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"vnc-auth-password\"]", "name": "type", "equals": "password"}}'
    - step: 26
      expectation: '{"assert_disabled": "[data-testid=\"vnc-auth-ok\"]"}'
    - step: 29
      expectation: '{"assert_enabled": "[data-testid=\"vnc-auth-ok\"]"}'
    - step: 33
      expectation: '{"assert_attribute": {"selector": "html", "name": "data-app-theme", "equals": "light"}}'
    - step: 46
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-canvas\"][width=\"1280\"][height=\"720\"]", "timeout_sec": 20}}'
    - step: 47
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"type\": \"auth\", \"ok\": true, \"security\": \"VNCAuth\""}}'
    - step: 44
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-unencrypted-continue\"]", "timeout_sec": 20}}'
    results:
    - 46
    - 47
  - id: R2
    requirement: Authentication failure stays visible in both themes and the user can correct the password to connect.
    actions:
    - 35
    - 38
    - 42
    - 43
    - 45
    checkpoints:
    - step: 36
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-auth-error\"]", "timeout_sec": 20}}'
    - step: 39
      expectation: '{"assert_attribute": {"selector": "html", "name": "data-app-theme", "equals": "dark"}}'
    - step: 40
      expectation: '{"assert_visible": "[data-testid=\"vnc-auth-error\"]"}'
    - step: 47
      expectation: '{"assert_file_contains": {"path": "${fixture.vnc_events}", "contains": "\"type\": \"auth\", \"ok\": true, \"security\": \"VNCAuth\""}}'
    - step: 44
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-unencrypted-continue\"]", "timeout_sec": 20}}'
    results:
    - 47
  - id: R3
    requirement: A remote disconnect exposes a readable reconnect action; reconnect confirms the unencrypted connection and paints a new framebuffer.
    actions:
    - 48
    - 51
    - 53
    checkpoints:
    - step: 49
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-reconnect\"]", "timeout_sec": 15}}'
    - step: 52
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-unencrypted-continue\"]", "timeout_sec": 20}}'
    - step: 54
      expectation: '{"wait_for": {"selector": "[data-testid=\"vnc-canvas\"][width=\"1280\"][height=\"720\"]", "timeout_sec": 20}}'
    - step: 55
      expectation: "{\"eval_readonly\": {\"expression\": \"document.querySelector('.vnc-container canvas').getContext('2d').getImageData(16, 16, 1, 1).data[3] === 255\", \"timeout_sec\"\
        : 10}}"
    results:
    - 54
    - 55
  visual:
  - check: 'Review dialog screenshots: opaque theme-appropriate cards; readable titles, descriptions, field labels, entered username, buttons and error text; visible focus and no clipping.
      Check the disconnected card and reconnect button too.'
    method: manual
    reason: Theme attributes and successful input do not prove contrast or visual quality.
  native:
  - check: Native mode renders the dialogs in the packaged WebView and connects through the Rust relay; browser mode covers the shared renderer only.
    method: automated
    reason: The native fixture handshake verifies the actual authentication boundary.

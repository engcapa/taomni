id: TC-IDE-PARITY-018-02
title: Native dedicated Workspace Git reads real repositories and returns to the dirty editor
description: ED-PARITY-028 dedicated surface; preserves ED-PARITY-018 dirty buffer and real repository index/ref/worktree
  zero-write assertions.
covers:
- F25.5
- F26.2
- F-Workspace-1
tags:
- code-workspace
- git
- ed-parity-018
- native-gate
- p1
modes:
- native
native_platforms:
- Windows
- Linux
- macOS
fixtures:
- reset_db
- parity008_git
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-parity008-password
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-parity008-native","name":"parity008","roots":[{"id":"parity008","name":"parity008","path":"${fixture.parity008_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"parity008","path":"repo-a/same.txt"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
- seed_storage:
    key: taomni.git.workspace.changes.tree
    value: '"flat"'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity008_root}"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 60
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Mod+End
- type: edit-kept
- wait_for: '[data-editor-tab-key][data-active="true"][data-dirty="true"]'
- wait_for:
    selector: '[data-testid="code-workspace-git-panel-toggle"]:not([disabled])'
    timeout_sec: 60
- press:
    key: Alt+9
    macos_key: Alt+9
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for:
    selector: '[data-testid="workspace-git-surface"] [data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
    timeout_sec: 60
- assert_items:
    selector: '[data-testid="workspace-git-surface"] [data-testid="workspace-change-row"]'
    attribute: aria-label
    equals:
    - repo-a same.txt Staged
    - repo-a untracked.txt Untracked
    - repo-b same.txt Modified
- screenshot: tc-ide-parity-018-02-git-tool-window.png
- press:
    key: Shift+Escape
    selector: '[data-testid="workspace-git-surface"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 10
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - edit-kept
- assert_visible: '[data-editor-tab-key][data-active="true"][data-dirty="true"]'
- assert_file_sha256:
    path: ${fixture.parity008_repo_a}/.git/index
    equals: ${fixture.parity008_repo_a_index_sha256}
- assert_file_sha256:
    path: ${fixture.parity008_repo_b}/.git/index
    equals: ${fixture.parity008_repo_b_index_sha256}
- assert_file_sha256:
    path: ${fixture.parity008_repo_a}/.git/refs/heads/main
    equals: ${fixture.parity008_repo_a_main_sha256}
- assert_file_sha256:
    path: ${fixture.parity008_repo_b}/.git/refs/heads/main
    equals: ${fixture.parity008_repo_b_main_sha256}
- assert_file_sha256:
    path: ${fixture.parity008_repo_a}/same.txt
    equals: ${fixture.parity008_repo_a_worktree_sha256}
- assert_file_sha256:
    path: ${fixture.parity008_repo_b}/same.txt
    equals: ${fixture.parity008_repo_b_worktree_sha256}
verification:
  review: pending
  requirements:
  - id: R1
    requirement: Alt+9 opens the dedicated Git surface over two real repos; Shift+Esc restores dirty editor; all
      index/ref/worktree hashes remain unchanged.
    actions:
    - 1
    - 2
    - 6
    - 7
    - 8
    - 11
    - 12
    - 14
    - 15
    - 16
    - 19
    - 23
    checkpoints:
    - step: 5
      expectation: '{''wait_for'': ''[data-testid="welcome-panel"]''}'
    - step: 13
      expectation: '{''wait_for'': {''selector'': ''[data-testid="code-workspace-editor"] .cm-content'', ''timeout_sec'':
        60}}'
    - step: 17
      expectation: '{''wait_for'': ''[data-editor-tab-key][data-active="true"][data-dirty="true"]''}'
    - step: 18
      expectation: '{''wait_for'': {''selector'': ''[data-testid="code-workspace-git-panel-toggle"]:not([disabled])'',
        ''timeout_sec'': 60}}'
    - step: 20
      expectation: '{''wait_for'': {''selector'': ''[data-testid="workspace-git-surface"] [data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'',
        ''timeout_sec'': 60}}'
    - step: 21
      expectation: '{''assert_items'': {''selector'': ''[data-testid="workspace-git-surface"] [data-testid="workspace-change-row"]'',
        ''attribute'': ''aria-label'', ''equals'': [''repo-a same.txt Staged'', ''repo-a untracked.txt Untracked'',
        ''repo-b same.txt Modified'']}}'
    - step: 24
      expectation: '{''wait_for'': {''selector'': ''[data-testid="code-workspace-editor"] .cm-content'', ''timeout_sec'':
        10}}'
    - step: 25
      expectation: '{''assert_items'': {''selector'': ''[data-testid="code-workspace-editor"] .cm-line'', ''equals'':
        [''repo-a WORKTREE'', ''shared line'', ''edit-kept'']}}'
    - step: 26
      expectation: '{''assert_visible'': ''[data-editor-tab-key][data-active="true"][data-dirty="true"]''}'
    - step: 27
      expectation: '{''assert_file_sha256'': {''path'': ''${fixture.parity008_repo_a}/.git/index'', ''equals'':
        ''${fixture.parity008_repo_a_index_sha256}''}}'
    - step: 28
      expectation: '{''assert_file_sha256'': {''path'': ''${fixture.parity008_repo_b}/.git/index'', ''equals'':
        ''${fixture.parity008_repo_b_index_sha256}''}}'
    - step: 29
      expectation: '{''assert_file_sha256'': {''path'': ''${fixture.parity008_repo_a}/.git/refs/heads/main'', ''equals'':
        ''${fixture.parity008_repo_a_main_sha256}''}}'
    - step: 30
      expectation: '{''assert_file_sha256'': {''path'': ''${fixture.parity008_repo_b}/.git/refs/heads/main'', ''equals'':
        ''${fixture.parity008_repo_b_main_sha256}''}}'
    - step: 31
      expectation: '{''assert_file_sha256'': {''path'': ''${fixture.parity008_repo_a}/same.txt'', ''equals'': ''${fixture.parity008_repo_a_worktree_sha256}''}}'
    - step: 32
      expectation: '{''assert_file_sha256'': {''path'': ''${fixture.parity008_repo_b}/same.txt'', ''equals'': ''${fixture.parity008_repo_b_worktree_sha256}''}}'

    - 31
    - 32
  visual:
  - check: Dedicated full-size Git surface retains existing controls and icons.
    method: manual
    reason: Functional assertions do not prove visual balance.
  native:
  - check: Repository bytes remain unchanged across Git and editor navigation.
    method: external
    reason: TC-IDE-PARITY-018-02 asserts real index/ref/worktree hashes; browser covers renderer only.

id: TC-IDE-FINDFOCUS-01
title: Focused F0 Find navigation, recovery, Replace and split remount
description: ED-FINDFOCUS-001 / V-FF-03 self-check. Exact UTF-8/LF F0 is created through UI in isolated browser VFS. True
  focus before chords; automatic first match, Enter/Shift+Enter, Esc selection, repeat, invalid/zero recovery, retained Replace/undo
  and split. Does not prove native disk, IME or provider. Second F0 tree is [54,58), corrected against original bytes.
covers:
- F25.1
- F25.5
tags:
- code-workspace
- find-focus
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 150

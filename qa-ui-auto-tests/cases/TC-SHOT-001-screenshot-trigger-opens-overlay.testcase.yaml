id: TC-SHOT-001
title: ControlBar system screenshot button opens the fullscreen overlay
covers:
- F27.1
tags:
- screenshot
- trigger
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
# The trigger must live in the global window chrome, not inside any tab.
- wait_for: '[data-testid="system-screenshot"]'
- assert_visible: '[data-testid="system-screenshot"]'
- assert_attribute:
    selector: '[data-testid="system-screenshot"]'
    name: title
    matches: "Shift\\+A"
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"]'
- assert_visible: '[data-testid="screenshot-overlay"]'
- assert_visible: '[data-testid="screenshot-base-image"]'
- assert_visible: '[data-testid="screenshot-hint"]'
- eval_readonly:
    expression: JSON.stringify(window.__tauriStubScreenshotCalls || []).includes("screenshot_open_overlay")
- press: Escape
- wait_for:
    selector: '[data-testid="system-screenshot"]'

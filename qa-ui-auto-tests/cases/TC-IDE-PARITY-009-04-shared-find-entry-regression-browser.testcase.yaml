id: TC-IDE-PARITY-009-04
title: Local Find and regex project search keep their own results and focus next to Structural Search
description: >-
  ED-PARITY-009 V-009-04 retained behavior for the shared Code Workspace search entries. Local
  Ctrl/Cmd+F stays inside the editor and Esc returns focus there; regex Find in Files still returns the
  textual set (5 hits including the comment and string) while Structural Search returns only the 3 AST
  matches; switching between the Search and Structural Search dock tabs keeps each result set, and the
  editor text is unchanged (no dirty tab). Browser renderer only.
covers: [F25.6, F25.5]
tags: [code-workspace, structural-search, ide-find, parity009, p2]
modes: [browser]
fixtures: [reset_db, parity009_ssr]
timeout_sec: 180
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity009_root}"]'
  - wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: Mod+f
  - wait_for: '[data-testid="code-workspace-editor-search"] input[name="search"]'
  - fill:
      selector: '[data-testid="code-workspace-editor-search"] input[name="search"]'
      value: println(42)
  - press: Enter
  - assert_count:
      selector: '[data-testid="code-workspace-editor"] .cm-searchMatch'
      min: 1
  - press: Escape
  - eval_readonly:
      expression: document.activeElement?.classList.contains('cm-content') === true
      expect_truthy: true
  - press: Mod+Shift+F
  - wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
  - click: '[data-testid="code-workspace-find-in-files-panel"] button[aria-label="Regular expression"]'
  - fill:
      selector: '[aria-label="Search query"]'
      value: 'System\.out\.println\('
  - press: Enter
  - wait_for:
      selector: '[data-testid="code-workspace-find-file-group"]'
      timeout_sec: 30
  - assert_count:
      selector: '[data-testid="code-workspace-find-match-row"]'
      equal: 5
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
  - fill:
      selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
      value: Search Structurally
  - press: Enter
  - wait_for: '[data-testid="structural-search-dialog"]'
  - click: '[data-testid="structural-search-find"]'
  - wait_for: '[data-testid="structural-search-panel"][data-phase="results"]'
  - assert_count:
      selector: '[data-testid="structural-search-match"]'
      equal: 3
  - assert_attribute:
      selector: '[data-testid="code-workspace-bottom-tab-structural"]'
      name: aria-selected
      equals: 'true'
  - click: '[data-testid="code-workspace-bottom-tab-search"]'
  - assert_count:
      selector: '[data-testid="code-workspace-find-match-row"]'
      equal: 5
  - click: '[data-testid="code-workspace-bottom-tab-structural"]'
  - assert_count:
      selector: '[data-testid="structural-search-match"]'
      equal: 3
  - parity009_trace: {runs: 1, last_count: 3, active: 0}
  - assert_count:
      selector: '[data-editor-tab-key][data-dirty="true"]'
      equal: 0
  - screenshot: tc-ide-parity-009-04-shared-entries.png
verification:
  review: reviewed
  requirements:
  - id: ED-PARITY-009-V4
    requirement: 本地 Find 焦点返回编辑器；regex 项目搜索保持 5 个文本命中，Structural Search 3 个 AST 命中，两 dock tab 切换互不覆盖，编辑器不 dirty。
    actions:
    - 7
    - 9
    - 10
    - 12
    - 16
    - 17
    - 18
    - 27
    - 31
    - 33
    checkpoints:
    - step: 8
      expectation: '{wait_for: ''[data-testid="code-workspace-editor-search"] input[name="search"]''}'
    - step: 11
      expectation: '{assert_count: {min: 1, selector: ''[data-testid="code-workspace-editor"] .cm-searchMatch''}}'
    - step: 13
      expectation: '{eval_readonly: {expect_truthy: true, expression: ''document.activeElement?.classList.contains(''''cm-content'''')
        === true''}}'
    - step: 19
      expectation: '{wait_for: {selector: ''[data-testid="code-workspace-find-file-group"]'', timeout_sec: 30}}'
    - step: 20
      expectation: '{assert_count: {equal: 5, selector: ''[data-testid="code-workspace-find-match-row"]''}}'
    - step: 28
      expectation: '{wait_for: ''[data-testid="structural-search-panel"][data-phase="results"]''}'
    - step: 29
      expectation: '{assert_count: {equal: 3, selector: ''[data-testid="structural-search-match"]''}}'
    - step: 30
      expectation: '{assert_attribute: {equals: ''true'', name: aria-selected, selector: ''[data-testid="code-workspace-bottom-tab-structural"]''}}'
    - step: 32
      expectation: '{assert_count: {equal: 5, selector: ''[data-testid="code-workspace-find-match-row"]''}}'
    - step: 34
      expectation: '{assert_count: {equal: 3, selector: ''[data-testid="structural-search-match"]''}}'
    - step: 35
      expectation: '{parity009_trace: {active: 0, last_count: 3, runs: 1}}'
    - step: 36
      expectation: '{assert_count: {equal: 0, selector: ''[data-editor-tab-key][data-dirty="true"]''}}'
    results:
    - 32
    - 34
    - 35
    - 36
  visual:
  - check: 截图中标题、n/N 导航、两侧标签/结果树与高亮无截断遮挡；与 IDEA 参照的视觉差异单独记录于 comparison record。
    method: manual
    reason: 像素与视觉 parity 不能由 DOM 断言替代。
  native:
  - check: Browser 仅证明 renderer 入口/路由/可见结果；真实 Tauri IPC、磁盘与 provider 由对应 native case 证明。
    method: not-applicable
    reason: browser mode 使用受控 stub，不跨越 OS/IPC 边界。

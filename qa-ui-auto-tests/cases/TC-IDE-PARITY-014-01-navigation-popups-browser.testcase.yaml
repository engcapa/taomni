id: TC-IDE-PARITY-014-01
title: 'Navigation popups: syntax-only structure, query-bound Search Everywhere, Recent
  Files switcher'
description: 'ED-PARITY-014 A4 browser case (no language server in browser preview):
  File Structure titles the file and shows a syntax-only Java outline; Search Everywhere
  All for ''total'' lists the matching file first, drops unrelated actions and keeps
  provider diagnostics out of the footer; Recent Files shows tool windows beside the
  files, the selected path, and toggles Show edited only on a repeated Ctrl+E.


  Mode: browser.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F25.5
tags:
- code-workspace
- ed-parity-014
- navigation
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-tree-new"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: Totals.java
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"][data-editor-tab-key$="Totals.java"]'
    timeout_sec: 15
- click: '[data-testid="code-workspace-editor"] .cm-content'
- type: 'class Totals {

    int total;

    int sum(int a) { return a; }

    '
- press: Control+s
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"]:not([data-dirty])'
    timeout_sec: 10
- press: Control+F12
- wait_for:
    selector: '[data-testid="code-workspace-structure-popup"]'
    timeout_sec: 15
- wait_for:
    selector: '[data-testid="code-workspace-structure-syntax-only"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-structure-title"]'
    contains: Totals.java
- assert_text:
    selector: '[data-testid="code-workspace-structure-popup"]'
    contains: sum
- assert_text:
    selector: '[data-testid="code-workspace-structure-popup"]'
    contains: total
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-structure-popup"]'
    state: detached
    timeout_sec: 5
- press: Control+Shift+A
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- click: '[data-testid="code-workspace-search-everywhere"] [role="tab"]:has-text("All")'
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search
      everywhere"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search
      everywhere"]'
    value: total
- assert_text:
    selector: '[data-testid="search-everywhere-selected-path"]'
    contains: Totals.java
    timeout_sec: 10
- assert_pattern:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    regex: (?s)\A(?!.*Move to Line Start)
- assert_pattern:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    regex: (?s)\A(?!.*generation)
- assert_attribute:
    selector: '[data-testid="search-everywhere-symbol-provider-status"]'
    name: role
    equals: img
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    state: detached
    timeout_sec: 5
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+e
- wait_for:
    selector: '[data-testid="code-workspace-recent-files"]'
    timeout_sec: 10
- assert_visible: '[data-testid="code-workspace-recent-files-tool-window-problems"]'
- assert_text:
    selector: '[data-testid="code-workspace-recent-files-path"]'
    contains: README.txt
- assert_attribute:
    selector: '[data-testid="code-workspace-recent-files-edited-only"]'
    name: data-checked
    equals: 'false'
- press: Control+e
- wait_for:
    selector: '[data-testid="code-workspace-recent-files-edited-only"][data-checked="true"]'
    timeout_sec: 5
- click: '[data-testid="code-workspace-recent-files-edited-only"]'
- wait_for:
    selector: '[data-testid="code-workspace-recent-files-edited-only"][data-checked="false"]'
    timeout_sec: 5
- click: '[data-testid="code-workspace-recent-files-tool-window-problems"]'
- wait_for:
    selector: '[data-testid="code-workspace-recent-files"]'
    state: detached
    timeout_sec: 5
- wait_for:
    selector: '[data-testid="code-workspace-problems-panel"]'
    timeout_sec: 10
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A4/DEC-014-04：无 provider 时 File Structure 以文件名为标题，给出标注 syntax only
      的 Java 大纲（字段、方法）。
    actions:
    - 23
    checkpoints:
    - step: 25
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-structure-syntax-only\"]",
        "timeout_sec": 10}}'
    - step: 26
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-structure-title\"]",
        "contains": "Totals.java"}}'
    - step: 27
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-structure-popup\"]",
        "contains": "sum"}}'
    - step: 28
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-structure-popup\"]",
        "contains": "total"}}'
    results:
    - 25
    - 26
    - 27
  - id: R2
    requirement: A4/DEC-014-01/02：Search Everywhere All 查询 total 时首项为相关文件，不含 Move
      to Line Start 等无关动作，底栏为选中项路径且无 generation/provider 诊断文字（诊断在 tooltip）。
    actions:
    - 33
    - 35
    checkpoints:
    - step: 36
      expectation: '{"assert_text": {"selector": "[data-testid=\"search-everywhere-selected-path\"]",
        "contains": "Totals.java", "timeout_sec": 10}}'
    - step: 37
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-search-everywhere\"]",
        "regex": "(?s)\\A(?!.*Move to Line Start)"}}'
    - step: 38
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"code-workspace-search-everywhere\"]",
        "regex": "(?s)\\A(?!.*generation)"}}'
    - step: 39
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"search-everywhere-symbol-provider-status\"]",
        "name": "role", "equals": "img"}}'
    results:
    - 36
    - 37
    - 38
  - id: R3
    requirement: A4/DEC-014-03：Recent Files 为双列：左侧工具窗、右侧文件，底栏完整路径；再按 Ctrl+E 切换 Show
      edited only；点击工具窗激活它并关闭弹层。
    actions:
    - 43
    - 48
    - 50
    - 52
    checkpoints:
    - step: 45
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-recent-files-tool-window-problems\"]"}'
    - step: 46
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-recent-files-path\"]",
        "contains": "README.txt"}}'
    - step: 47
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-recent-files-edited-only\"]",
        "name": "data-checked", "equals": "false"}}'
    - step: 49
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-recent-files-edited-only\"][data-checked=\"true\"]",
        "timeout_sec": 5}}'
    - step: 51
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-recent-files-edited-only\"][data-checked=\"false\"]",
        "timeout_sec": 5}}'
    - step: 53
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-recent-files\"]",
        "state": "detached", "timeout_sec": 5}}'
    - step: 54
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-problems-panel\"]",
        "timeout_sec": 10}}'
    results:
    - 45
    - 46
    - 49
    - 54
  visual:
  - check: 对照 IDEA idea-02/Recent Files/File Structure 截图检查列布局与宽度。
    method: manual
    reason: 像素另行比较。
  native:
  - check: provider 就绪的符号结果需 native JDT LS，本用例不声明。
    method: not-applicable
    reason: browser 证据不外推 native。

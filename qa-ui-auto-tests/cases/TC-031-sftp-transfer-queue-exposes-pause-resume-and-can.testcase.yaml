id: TC-031
title: SFTP transfer queue exposes pause, resume, and cancel controls
covers:
- F7.3
tags:
- legacy-imported
- p1
- queue
- sftp
- transfer
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 2
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-remote-path"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}
- press: Enter
- wait: 1
- click: '[data-testid="sftp-local-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-queue.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- wait: 1
- click: '[data-testid="sftp-local-pane"] >> text="qa-ui-auto-queue.txt"'
- click: '[data-testid="sftp-local-upload-selected"]'
- wait_for: '[data-testid="sftp-transfer-queue"]'
- assert_count:
    selector: '[data-testid="sftp-transfer-queue"] button[title]'
    min: 1
- click: '[data-testid="sftp-transfer-queue"] button[title="Remove from list"]'
- wait: 1
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-queue.txt"'
- click: '[data-testid="sftp-remote-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- click: '[data-testid="sftp-local-pane"] >> text="qa-ui-auto-queue.txt"'
- click: '[data-testid="sftp-local-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- assert_not_visible: '[data-testid="sftp-browser"] tr[title$="/qa-ui-auto-queue.txt"]'
- screenshot: 031-sftp-queue-controls.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: SFTP transfer queue exposes pause, resume, and cancel controls：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 4
    - 6
    - 7
    - 9
    - 10
    - 13
    - 15
    - 16
    - 17
    - 19
    - 21
    - 22
    - 25
    - 26
    - 29
    - 31
    - 32
    - 34
    - 37
    - 38
    - 40
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"qc-input\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"sftp-browser\"]"}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 23
      expectation: '{"assert_not_visible": "[data-testid=\"text-input-dialog\"]"}'
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"sftp-transfer-queue\"]"}'
    - step: 28
      expectation: '{"assert_count": {"selector": "[data-testid=\"sftp-transfer-queue\"] button[title]", "min":
        1}}'
    - step: 33
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 35
      expectation: '{"assert_not_visible": "[data-testid=\"confirm-dialog\"]"}'
    - step: 39
      expectation: '{"wait_for": "[data-testid=\"confirm-dialog\"]"}'
    - step: 41
      expectation: '{"assert_not_visible": "[data-testid=\"confirm-dialog\"]"}'
    - step: 43
      expectation: '{"assert_not_visible": "[data-testid=\"sftp-browser\"] tr[title$=\"/qa-ui-auto-queue.txt\"]"}'
    results:
    - 41
    - 43
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

id: TC-SHELL-B13
title: Explicit ordering and lane overrides preserve terminal identity
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b13.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- right_click: '[data-testid="tab-item"]:has-text("qa-beta")'
- click: '[data-testid="shell-tab-move-first"]'
- assert_items:
    selector: '[data-testid="tab-title"]'
    equals:
    - qa-beta
    - qa-alpha
- right_click: '[data-testid="tab-item"]:has-text("qa-beta")'
- assert_attribute:
    selector: '[data-testid="shell-tab-move-first"]'
    name: disabled
    equals: ''
- press: Escape
- assert_not_visible: '[data-testid="context-menu"]'
- right_click: '[data-testid="tab-item"]:has-text("qa-beta")'
- click: '[data-testid="shell-tab-move-lane"]'
- hover: '[data-testid="shell-tab-move-lane"]'
- click: '[data-testid="shell-tab-move-build"]'
- assert_attribute:
    selector: '[data-testid="shell-lane-select"]'
    name: data-lane
    equals: build
- assert_shell_backend:
    command: create_ssh_terminal
    count: 2
    status: requested
- right_click: '[data-testid="tab-item"]:has-text("qa-beta")'
- click: '[data-testid="shell-tab-default-lane"]'
- assert_attribute:
    selector: '[data-testid="shell-lane-select"]'
    name: data-lane
    equals: connect
- assert_shell_backend:
    command: create_ssh_terminal
    count: 2
    status: requested
- screenshot: tc-shell-b13.png

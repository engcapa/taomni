      expectation: Moving Beta first gives the exact strip order, and the edge move
        is disabled.
    - step: 8
      expectation: Moving Beta first gives the exact strip order, and the edge move
        is disabled.
    - step: 11
      expectation: Moving Beta first gives the exact strip order, and the edge move
        is disabled.
    - step: 13
      expectation: Moving Beta first gives the exact strip order, and the edge move
        is disabled.
    - step: 15
      expectation: Moving Beta first gives the exact strip order, and the edge move
        is disabled.
    results:
    - 5
    - 8
    - 11
    - 13
    - 15

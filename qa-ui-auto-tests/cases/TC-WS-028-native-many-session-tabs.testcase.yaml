id: TC-WS-028
title: Unified Sessions overflow filters and searchable many-tab navigation (native)
description: Creates many real UI tabs, checks compact protocol selection, no-match recovery, searchable picker keyboard activation, Home/End tab navigation
  and full overview without closing sessions.
modes:
- native
covers:
- F-WS-1
- F-WS-3
- F1.5
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-28
- click: '[data-testid="side-tab-sessions"]'

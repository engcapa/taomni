    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"tab-scroll-area"]').scrollLeft < document.querySelector('[data-testid'+String.fromCharCode(61)+'"tab-scroll-area"]').scrollWidth
      - document.querySelector('[data-testid'+String.fromCharCode(61)+'"tab-scroll-area"]').clientWidth - 10
    expect_truthy: true
- click: '[data-testid="tab-scroll-right"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"tab-scroll-area"]').scrollLeft > 10
    expect_truthy: true
- assert_count:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    equal: 12
- dblclick: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: QA Many target
- press: Enter
- click: '[data-testid="tab-more"]'
- click: '[data-testid="session-tab-filter-ssh"]'
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 0
- assert_visible: '[data-testid="tab-filter-empty"]'

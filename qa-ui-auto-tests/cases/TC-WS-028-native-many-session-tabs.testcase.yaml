- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 12
- assert_attribute:
    selector: '[data-testid="session-tab-categories"]'
    name: data-category
    equals: local
- wait_for: '[data-testid="open-tabs-menu"]'
- fill:
    selector: '[data-testid="open-tabs-filter"]'
    value: QA Many target
- assert_count:
    selector: '[data-testid^="open-tabs-tab-"]:not([data-testid^="open-tabs-tab-checkbox-"])'
    equal: 1
- press:
    selector: '[data-testid="open-tabs-filter"]'
    key: ArrowDown
- press:
    selector: '[data-testid="open-tabs-filter"]'
    key: Enter
- assert_not_visible: '[data-testid="open-tabs-menu"]'
- assert_attribute:
    selector: '[data-testid="tab-item"][data-active="true"]'
    name: data-tab-title
    equals: QA Many target
- click: '[data-testid="tab-more"]'
- fill:
    selector: '[data-testid="open-tabs-filter"]'
    value: QA Many target
- click: '[data-testid^="open-tabs-tab-"]:not([data-testid^="open-tabs-tab-checkbox-"])'
- assert_not_visible: '[data-testid="open-tabs-menu"]'
- assert_attribute:
    selector: '[data-testid="tab-item"][data-active="true"]'
    name: data-tab-title
    equals: QA Many target
- click: '[data-testid="tab-filter-chip"]'
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 12
- press:
    selector: '[data-testid="tab-item"][data-active="true"]'
    key: Home
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"tab-scroll-area"]').scrollLeft < 5
    expect_truthy: true
- press:
    selector: '[data-testid="tab-item"][data-active="true"]'
    key: End
- assert_attribute:
    selector: '[data-testid="tab-item"][data-active="true"]'
    name: data-tab-title
    equals: QA Many target
- click: '[data-testid="tab-more"]'
- click: '[data-testid="session-tab-filter-all"]'
- press: Escape
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 12
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"session-tab-filter"]') === null
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"control-bar"]').getBoundingClientRect().height <= 34
    expect_truthy: true
- screenshot: sessions-many-tabs-compact-filter.png
- click: '[data-testid="tab-overview-trigger"]'
- wait_for: '[data-testid="tab-overview"]'
- assert_count:
    selector: '[data-testid="tab-overview-card"]'
    equal: 12
- click: '[data-testid="tab-overview-close"]'
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 12

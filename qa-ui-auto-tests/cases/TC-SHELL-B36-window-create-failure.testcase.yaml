id: TC-SHELL-B36
title: Rejected SFTP window creation preserves source and allows retry
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b36.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F-SHELL-1
- F-Detach-1
- F7.4
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- shell_backend_scenario:
    command: open_detached_window
    action: fail-next
- click: '[data-testid="shell-host-more"]'
- click: '[data-testid="shell-panel-detach"]'
- wait_for: '[data-testid="shell-host-retry"]'
- assert_visible: '[data-testid="sftp-remote-list"]'
- assert_not_visible: '[data-testid="shell-detached-placeholder"]'
- assert_shell_backend:
    command: sftp_attach
    count: 1
    status: requested
- assert_shell_backend:
    command: open_detached_window
    count: 1
    status: failed
- screenshot: tc-shell-b36.png

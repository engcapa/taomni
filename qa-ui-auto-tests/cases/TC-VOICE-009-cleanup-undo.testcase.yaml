covers:
- F-AI-2.3
tags:
- ai
- voice
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
id: TC-VOICE-009
title: Optional cleanup preserves an accessible original and undo in the titlebar
  draft
steps:
- open: ${cfg.app.base_url}/?voiceFixture=1
- wait_for: '[data-testid="ptt-button"]'
- click: '[data-testid="ptt-button"]'
- wait_for: '[data-testid="asr-settings"]'
- select_option:
    selector: '[data-testid="asr-realtime-provider"]'
    value: sherpa-zipformer-zh-en
- select_option:
    selector: '[data-testid="asr-cleanup"]'
    value: full
- assert_localstorage:
    key: taomni.ai.config.v1
    contains: '"cleanup":"full"'
- click: '[data-testid="voice-settings-close"]'
- click: '[data-testid="ptt-button"]'
- wait_for: '[data-testid="ptt-button"][data-state="recording"]'
- click: '[data-testid="ptt-button"]'
- wait_for: '[data-testid="chat-composer-textarea"]'
- eval_readonly:
    expression: document.querySelector("#chat-composer-textarea").value === "Cleaned
      stream fixture."
    timeout_sec: 5
- click: '[data-testid="composer-voice-original"] summary'
- assert_text:
    selector: '[data-testid="composer-voice-original"]'
    contains: Final stream fixture.
- click: '[data-testid="composer-voice-original"] button'
- eval_readonly:
    expression: document.querySelector("#chat-composer-textarea").value === "Final
      stream fixture."
- screenshot: cleanup-original.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Optional cleanup preserves an accessible original and undo in the
      titlebar draft
    actions:
    - 5
    - 6
    - 8
    - 9
    - 11
    - 14
    - 16
    checkpoints:
    - step: 7
      expectation: Cleanup requires explicit opt-in.
    - step: 13
      expectation: Cleaned final is staged once.
    - step: 15
      expectation: Raw original remains available.
    - step: 17
      expectation: Undo restores raw text without sending.
    results:
    - 7
    - 13
    - 15
    - 17
  visual:
  - check: Settings and original transcript remain readable
    method: manual
    reason: Inspect retained screenshots.
  native:
  - check: Provider transport, credentials and LLM protection
    method: external
    reason: Native socket/config/cleanup tests establish backend behavior; browser
      fixtures do not validate vendor service availability.

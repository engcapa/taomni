id: TC-MFA-101
title: Native MFA codes come from Rust and survive a reload through mfa.db
description: 'V-19 (AC-02, AC-03, AC-09, AC-14). Isolated `com.taomni.app.qa` profile
  on each desktop platform. The sidebar Tools entry opens MFA behind the real vault
  setup. The RFC 4226 key yields 755 224 then 287 082 from the Rust generator; an
  otpauth link with SHA256 and eight digits matches an independent Python RFC 6238
  code. After a WebView reload both accounts are read back from the encrypted mfa.db
  with the HOTP counter kept, and copying a code through the desktop clipboard path
  is announced.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F-MFA-1
- F-MFA-2
tags:
- mfa
- native-boundary
- p0
modes:
- native
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-native-101
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-native-101
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="mfa-empty"]'
    timeout_sec: 30
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill:
    selector: '[data-testid="mfa-add-issuer"]'
    value: QA Bank
- fill:
    selector: '[data-testid="mfa-add-account"]'
    value: qa.hotp@example.com
- fill:
    selector: '[data-testid="mfa-add-secret"]'
    value: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
- click: '[data-testid="mfa-add-advanced"]'
- wait_for: '[data-testid="mfa-add-advanced-panel"]'
- select_option:
    selector: '[data-testid="mfa-add-kind"]'
    value: hotp
- click: '[data-testid="mfa-add-submit"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 755 224
- click: '[data-testid="mfa-account-hotp-next"]:is([data-issuer="QA Bank"] *)'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 287 082
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill:
    selector: '[data-testid="mfa-add-uri"]'
    value: otpauth://totp/QA%20TOTP:totp%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=QA%20TOTP&algorithm=SHA256&digits=8&period=30
- assert_text:
    selector: '[data-testid="mfa-add-notice"]'
    contains: Filled in from the otpauth link
- click: '[data-testid="mfa-add-submit"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_totp_code:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA TOTP"] *)'
    secret: JBSWY3DPEHPK3PXP
    digits: 8
    algorithm: SHA256
- reload: null
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Bank"] *)'
    equals: 287 082
    timeout_sec: 30
- assert_totp_code:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA TOTP"] *)'
    secret: JBSWY3DPEHPK3PXP
    digits: 8
    algorithm: SHA256
- click: '[data-testid="mfa-account-copy"]:is([data-issuer="QA Bank"] *)'
- assert_text:
    selector: '[data-testid="mfa-status"]'
    contains: Copied QA Bank
- screenshot: mfa-101-native-rows.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The native sidebar entry opens MFA behind the real vault setup (AC-01,
      AC-02).
    actions:
    - 3
    - 5
    - 7
    - 8
    - 9
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"vault-setup-dialog\"]"}'
    - step: 10
      expectation: '{"wait_for": {"selector": "[data-testid=\"mfa-empty\"]", "timeout_sec":
        30}}'
    results:
    - 10
  - id: R2
    requirement: Rust generates RFC 4226 HOTP and RFC 6238 SHA256/8-digit TOTP codes
      (AC-03, AC-09).
    actions:
    - 11
    - 13
    - 14
    - 15
    - 16
    - 18
    - 19
    - 22
    - 24
    - 26
    - 28
    checkpoints:
    - step: 20
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    - step: 21
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        Bank\"] *)", "equals": "755 224"}}'
    - step: 23
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        Bank\"] *)", "equals": "287 082"}}'
    - step: 27
      expectation: '{"assert_text": {"selector": "[data-testid=\"mfa-add-notice\"]",
        "contains": "Filled in from the otpauth link"}}'
    - step: 29
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    - step: 30
      expectation: '{"assert_totp_code": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        TOTP\"] *)", "secret": "JBSWY3DPEHPK3PXP", "digits": 8, "algorithm": "SHA256"}}'
    results:
    - 21
    - 23
    - 30
  - id: R3
    requirement: Accounts and the HOTP counter are read back from mfa.db after a reload
      and copying is announced (AC-09, AC-10, AC-14).
    actions:
    - 31
    - 32
    - 34
    - 37
    checkpoints:
    - step: 33
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 35
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        Bank\"] *)", "equals": "287 082", "timeout_sec": 30}}'
    - step: 36
      expectation: '{"assert_totp_code": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        TOTP\"] *)", "secret": "JBSWY3DPEHPK3PXP", "digits": 8, "algorithm": "SHA256"}}'
    - step: 38
      expectation: '{"assert_text": {"selector": "[data-testid=\"mfa-status\"]", "contains":
        "Copied QA Bank"}}'
    results:
    - 38
  visual:
  - check: Native WebView renders the MFA rows without clipping.
    method: manual
    reason: Screenshot needs human review per platform.
  native:
  - check: Rust OTP, AES-GCM storage in mfa.db and vault-held key run in the packaged
      app; disk ciphertext is asserted by Rust unit tests.
    method: automated
    reason: Native mode drives the isolated QA build through WebDriver on Linux, Windows
      and macOS.

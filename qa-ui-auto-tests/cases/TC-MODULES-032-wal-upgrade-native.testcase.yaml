  native:
  - check: A committed real SQLite WAL contributes to the pending source fingerprint, remains uncheckpointed and
      retains its exact rows through normal candidate restart.
    method: automated
    reason: Native disk/SQLite/IPC and normal process lifecycle are required. Browser TC-MODULES-026 retains renderer
      preflight/pending behavior and cannot validate SQLite WAL.
  visual:
  - check: Upgrade state, owner and pending notice remain readable in Module Store.
    method: manual
    reason: The screenshot retains the one VNC recommendation and pending notice; no layout change is introduced.

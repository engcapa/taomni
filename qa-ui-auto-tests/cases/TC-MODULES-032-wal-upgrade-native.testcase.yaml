id: TC-MODULES-032
title: Native upgrade fingerprints include committed WAL data through normal restart
description: Seeds an SSH/VNC profile and commits a VNC options change only to its actual SQLite WAL, retaining
  the writer across candidate restarts. Real Settings/IPC must preserve the main database bytes, read committed
  options, and bind both main and WAL bytes in the one pending VNC journal. No package, exporter or module activation
  is involved.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- native
fixtures:
- reset_db
- module_upgrade
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 1
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: preflight
- press: {selector: '[data-testid="module-upgrade-migrate"]:not([disabled])', key: Enter}
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- module_upgrade_probe:
    phase: pending
- native_restart_app:
    expect_exit_confirmation:
      title: Exit
      message: There is 1 open tab. Exit Taomni and close it?
      confirm_label: Exit
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 1
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: repeat
- press: {selector: '[data-testid="module-upgrade-migrate"]:not([disabled])', key: Enter}
- wait_for: '[data-testid="module-upgrade-pending"]'
- wait_for: '[data-testid="module-upgrade-migrate"]:not([disabled])'
- module_upgrade_probe:
    phase: repeat
- assert_no_runtime_errors: null
- screenshot: module-upgrade-wal-native.png

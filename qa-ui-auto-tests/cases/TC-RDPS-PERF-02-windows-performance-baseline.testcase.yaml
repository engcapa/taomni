id: TC-RDPS-PERF-02-windows-performance-baseline
title: RDP server performance on Windows - connect time, input-to-frame latency and animation throughput next to the system Remote Desktop
description: |
  V-13 on Windows (docs-feature/rdp-server-parity-design.md §4.7, AC-16,
  DEC-04). Same measurements as TC-RDPS-PERF-01 on a release QA build: M1
  connect/first-graphics time, M2 input-to-frame latency (40 clicks on a host
  Tk target) and M3/M4 visible-change rate and bandwidth of a 640x360 host
  animation. The runner's system Remote Desktop is running
  (system_rdp_running), so Start first asks and Taomni is chosen explicitly.

  Round 1 records Taomni's numbers; the TermService reference measurement
  with the same probe scenarios is added beside them to derive the budgets.
covers:
- F-RdpServer-1
tags:
- rdp
- rdp-server
- performance
- windows
- p1
modes:
- native
native_platforms:
- Windows
fixtures:
- reset_db
- rdp_server_required
- system_rdp_running
- release_build_required
timeout_sec: 600
steps:
- open_route: '?servers=main'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 30
- click: '[data-testid="server-row-rdp"]'
- fill:
    selector: '[data-testid="server-field-port"]'
    value: ${env.QA_RDP_PORT}
- fill:
    selector: '[data-testid="server-field-bind-address"]'
    value: 127.0.0.1
- set_check:
    selector: '[data-testid="server-field-auto-stop"]'
    checked: false
- fill:
    selector: '[data-testid="rdp-field-username"]'
    value: ${env.QA_RDP_USER}
- fill:
    selector: '[data-testid="rdp-field-password"]'
    value: ${env.QA_RDP_PASSWORD}
- set_check:
    selector: '[data-testid="rdp-field-control-approval"]'
    checked: false
- click: '[data-testid="server-row-rdp-start"]'
- wait_for:
    selector: '[data-testid="choice-dialog"]'
    timeout_sec: 30
- click: '[data-testid="choice-dialog-secondary"]'
- wait_for:
    selector: '[data-testid="vault-setup-dialog"]'
    timeout_sec: 30
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: ${env.QA_VAULT_PASSWORD}
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: ${env.QA_VAULT_PASSWORD}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="running"]'
    timeout_sec: 90
- rdp_probe:
    scenario: connect
    artifact: perf-connect
    args:
      seconds: 2
    expect:
      first_graphics_ms:
        exists: true
      framebuffer.painted_share:
        min: 0.95
- host_helper:
    action: start
    name: target
    mode: flip
    geometry: 480x320+40+80
- rdp_probe:
    scenario: latency
    artifact: perf-latency
    timeout_sec: 330
    args:
      x: 280
      y: 240
      samples: 40
      timeout-sec: 300
    expect:
      timeouts:
        max: 4
      latency_ms.count:
        min: 36
- host_helper:
    action: stop
    name: target
- host_helper:
    action: start
    name: animation
    mode: animate
    geometry: 640x360+40+80
- rdp_probe:
    scenario: throughput
    artifact: perf-throughput
    args:
      seconds: 10
      rect: 40,80,640,360
    expect:
      visible_changes:
        min: 10
- host_helper:
    action: stop
    name: animation
- click: '[data-testid="server-row-rdp-stop"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="stopped"]'
    timeout_sec: 30
verification:
  review: pending
  requirements:
  - id: R1
    requirement: With the system Remote Desktop running, Taomni is chosen explicitly and its connect time, input-to-frame latency and animation throughput are measured on a release build.
    actions:
    - 10
    - 12
    - 19
    - 22
    checkpoints:
    - step: 18
      expectation: The connect report includes first_graphics_ms and at least 95% of the framebuffer grid is painted.
    - step: 20
      expectation: At least 36 of 40 latency samples were observed.
    - step: 23
      expectation: At least 10 visible changes were received during 10 s of animation.
    results:
    - 20
    - 23
  native:
  - check: Real capture, encoder, network loopback and input injection timings on the hosted runner.
    method: automated
    reason: Browser stubs have no RDP server; only the packaged app exercises the measured path.
  visual:
  - check: Not a visual check.
    method: not-applicable
    reason: Metrics come from the probe's decoded framebuffer.

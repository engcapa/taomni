- fill:
    selector: '[data-testid="mfa-qr-password"]'
    value: wrong-master-password
- click: '[data-testid="mfa-qr-reveal"]'
- assert_text:
    selector: '[data-testid="mfa-qr-error"]'
    contains: Incorrect master password
- assert_count:
    selector: '[data-testid="mfa-qr-image"]'
    equal: 0
- fill:
    selector: '[data-testid="mfa-qr-password"]'
    value: qa-mfa-master-011
- press:
    key: Enter
    selector: '[data-testid="mfa-qr-password"]'
- wait_for: '[data-testid="mfa-qr-image"]'
- assert_attribute:
    selector: '[data-testid="mfa-qr-dialog"]'
    name: data-state
    equals: shown
- seed_clipboard_image:
    selector: '[data-testid="mfa-qr-image"]'
- click: '[data-testid="mfa-qr-close"]'
- assert_not_visible: '[data-testid="mfa-qr-dialog"]'
- click: '[data-testid="mfa-add"]'
- click: '[data-testid="mfa-add-mode-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- click: '[data-testid="mfa-image-paste"]'
- wait_for:

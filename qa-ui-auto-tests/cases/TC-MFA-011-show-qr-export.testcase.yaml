id: TC-MFA-011
title: A saved account is shown as a scannable QR code only after the master password
description: 'V-28 (AC-18). Browser stub. Show QR code from the row menu first asks for the master password: an
  empty and a wrong password are refused without rendering anything. The right password (submitted with Enter) renders
  the otpauth QR. A screenshot of that QR is pasted back into the app''s own image import, which decodes the same
  HOTP account with its current counter and flags it as already added, proving the code is scannable and carries
  the stored secret and parameters. Reopening asks for the password again and Escape closes it.'
covers:
- F-MFA-1
- F-MFA-2
tags:
- mfa
- export
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:

    timeout_sec: 20
- assert_items:
    selector: '[data-testid="mfa-import-item"]'
    attribute: data-issuer
    equals:
    - QA Export
- assert_attribute:
    selector: '[data-testid="mfa-import-item"]'
    name: data-duplicate
    equals: 'true'
- assert_text:
    selector: '[data-testid="mfa-import-item"]'
    contains: counter 1
- assert_text:
    selector: '[data-testid="mfa-import-item-label"]'
    contains: export@example.com
- press: Escape
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- right_click: '[data-testid="mfa-account-row"][data-issuer="QA Export"]'
- click: '[data-testid="mfa-menu-qr"]'
- wait_for: '[data-testid="mfa-qr-dialog"][data-state="locked"]'
- press: Escape
- assert_not_visible: '[data-testid="mfa-qr-dialog"]'
- screenshot: mfa-011-qr-export.png

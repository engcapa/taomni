id: TC-MOBILE-002
title: Desktop mobile settings authenticate devices share real PTY and revoke access
covers:
- F-MOBILE-1
- F1.6
- F2.1
- F2.2
tags:
- p0
- mobile
- native-boundary
modes:
- native
native_platforms:
- Linux
fixtures:
- reset_db
- mobile_service
timeout_sec: 180
description: Native-only HTTP/WS oracle starts the listener through global Settings and checks actual shared PTY output and actual desktop
  input reclamation. Browser stubs cannot prove these effects.
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-mobile-service-password
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)[$#>%]\s*$
    timeout_sec: 20
- click: '[data-testid="ribbon-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: mobile
- wait_for: '[data-testid="mobile-settings"]'
- assert_text:
    selector: '[data-testid="mobile-settings-status"]'
    contains: 已关闭
- fill:
    selector: '[data-testid="mobile-settings-port"]'
    value: '0'
- click: '[data-testid="mobile-settings-toggle"]'
- assert_text:
    selector: '[data-testid="mobile-settings-status"]'
    contains: 运行中
- click: '[data-testid="mobile-settings-pair"]'
- wait_for: '[data-testid="mobile-settings-code"]'
- mobile_service_probe: desktop
- assert_text:
    selector: '[data-testid="mobile-settings-status"]'
    contains: 已关闭
- assert_file_contains:
    path: ${fixture.mobile_native_receipt}
    contains: '"passed": true'
- assert_no_runtime_errors: null
- screenshot: mobile-service-disabled-after-real-pty.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Real listener enforces auth, CORS, saved-session sanitization, single-writer PTY sharing, desktop reclamation, revocation
      and shutdown.
    actions:
    - 1
    - 3
    - 6
    - 7
    - 10
    - 11
    - 13
    checkpoints:
    - step: 5
      expectation: Real native shell prompt is ready.
    - step: 9
      expectation: '[data-testid="mobile-settings-status"] shows 已关闭.'
    - step: 12
      expectation: '[data-testid="mobile-settings-status"] shows 运行中.'
    - step: 15
      expectation: Real native desktop network, lifecycle and security oracle passes all assertions.
    - step: 16
      expectation: '[data-testid="mobile-settings-status"] shows 已关闭.'
    - step: 17
      expectation: 'Independent receipt contains "passed": true.'
    - step: 18
      expectation: No runtime errors occurred.
    results:
    - 5
    - 9
    - 12
    - 15
    - 16
    - 17
    - 18
  visual:
  - check: Settings evidence is diagnostic.
    method: not-applicable
    reason: Behavioral and network assertions own acceptance.
  native:
  - check: Real Tauri settings IPC and native PTY are required.
    method: automated
    reason: Independent HTTP/WS clients and desktop shell output verify native side effects.

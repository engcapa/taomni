id: TC-028
title: SFTP path breadcrumb supports segment click and inline editing
covers:
- F7.2
tags:
- breadcrumb
- legacy-imported
- navigation
- p1
- sftp
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 2
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: mkdir -p '${cfg.sftp.remote_test_dir}/qa-path-TC028/a/b' && printf '\nQA_PATH_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_PATH_READY\r?$
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-pane"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}/qa-path-TC028/a/b
- press: Enter
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.sftp.remote_test_dir}/qa-path-TC028/a/b
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- click: '[data-testid="sftp-remote-up"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.sftp.remote_test_dir}/qa-path-TC028/a
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- click: '[data-testid="sftp-remote-up"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.sftp.remote_test_dir}/qa-path-TC028
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- click: '[data-testid="sftp-remote-back"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.sftp.remote_test_dir}/qa-path-TC028/a
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- click: '[data-testid="sftp-remote-forward"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.sftp.remote_test_dir}/qa-path-TC028
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- click: '[data-testid="sftp-remote-path"] button[data-path="${cfg.sftp.remote_test_dir}"]'
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: ${cfg.sftp.remote_test_dir}
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: /
- press: Enter
- click: '[data-testid="sftp-remote-path-edit"]'
- assert_attribute:
    selector: input[data-testid="sftp-remote-path"]
    name: value
    equals: /
- press: Escape
- assert_not_visible: input[data-testid="sftp-remote-path"]
- screenshot: 028-sftp-breadcrumb.png

id: TC-145
title: SSH attached SFTP toggles closed and reopened without losing the live terminal
description: 'Verify the portable attached-SFTP lifecycle against a real POSIX SSH PTY. Hosted Windows uses a separate Cygwin OpenSSH service: direct
  protocol probes reproduce first-byte loss in Win32 OpenSSH/Git Bash without Taomni. TC-010 and TC-012 retain the Win32 permissions and path conversion
  contracts.'
covers:
- F3.1
- F7.1
- F7.2
- F7.4
- F2.2
tags:
- ssh
- sftp
- attached
- terminal
- lifecycle
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_posix_required
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar"]'
- assert_visible: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh_posix.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh_posix.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh_posix.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-attached-sftp
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-attached-sftp"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-attached-sftp"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_POSIX_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- assert_not_visible: '[data-testid="sftp-floating-button"]'
- wait_for:
    selector: '[data-testid="sftp-remote-list"] tbody tr'
    timeout_sec: 30
- assert_visible: '[data-testid="sftp-remote-pane"]'
- assert_visible: '[data-testid="sftp-local-pane"]'
- assert_visible: '[data-testid="sftp-transfer-queue"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 10
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo qa-ssh-with-sftp-open
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^qa\-ssh\-with\-sftp\-open\r?$
      timeout_sec: 10
      attempts: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa\-ssh\-with\-sftp\-open\r?$
    timeout_sec: 10
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    state: detached
- wait_for: '[data-testid="sftp-floating-button"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo qa-ssh-after-sftp-close
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^qa\-ssh\-after\-sftp\-close\r?$
      timeout_sec: 60
      attempts: 1
- wait: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa\-ssh\-after\-sftp\-close\r?$
    timeout_sec: 60
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- assert_not_visible: '[data-testid="sftp-floating-button"]'
- wait_for:
    selector: '[data-testid="sftp-remote-list"] tbody tr'
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo qa-ssh-reopened-sftp
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^qa-ssh-reopened-sftp\r?$
      timeout_sec: 10
      attempts: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa-ssh-reopened-sftp\r?$
    timeout_sec: 10
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:

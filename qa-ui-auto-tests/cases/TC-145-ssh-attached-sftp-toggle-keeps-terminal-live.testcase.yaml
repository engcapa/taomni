id: TC-145
title: SSH attached SFTP toggles closed and reopened without losing the live terminal
covers:
- F3.1
- F7.1
- F7.2
- F7.4
- F2.2
tags:
- ssh
- sftp
- attached
- terminal
- lifecycle
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-attached-sftp
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-attached-sftp"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-attached-sftp"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- wait_for:
    selector: '[data-testid="sftp-remote-list"] tbody tr'
    timeout_sec: 30
- assert_visible: '[data-testid="sftp-remote-pane"]'
- assert_visible: '[data-testid="sftp-local-pane"]'
- assert_visible: '[data-testid="sftp-transfer-queue"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="terminal-pane"]'
    name: data-terminal-ready
    equals: 'true'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    state: detached
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf 'qa-ssh-after-sftp-close\n'
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^qa\-ssh\-after\-sftp\-close\r?$
      timeout_sec: 10
      attempts: 2
- wait: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa\-ssh\-after\-sftp\-close\r?$
    timeout_sec: 20
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- wait_for:
    selector: '[data-testid="sftp-remote-list"] tbody tr'
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    state: detached
- assert_not_visible: '[data-testid="sftp-browser"]'
- screenshot: 145-ssh-attached-sftp-toggle.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: An authenticated SSH terminal opens its attached SFTP browser, exposes both panes and the transfer queue, closes the browser without disconnecting, accepts a command while closed, and reopens and closes the browser again with the terminal still ready.
    actions:
    - 1
    - 3
    - 5
    - 6
    - 8
    - 9
    - 11
    - 12
    - 16
    - 17
    - 19
    - 27
    - 30
    - 33
    - 37
    checkpoints:
    - step: 22
      expectation: '{assert_visible: ''[data-testid="sftp-remote-pane"]''}'
    - step: 23
      expectation: '{assert_visible: ''[data-testid="sftp-local-pane"]''}'
    - step: 24
      expectation: '{assert_visible: ''[data-testid="sftp-transfer-queue"]''}'
    - step: 26
      expectation: '{assert_attribute: {equals: ''true'', name: data-terminal-ready, selector: ''[data-testid="terminal-pane"]''}}'
    - step: 32
      expectation: '{assert_pattern: {regex: ''(?m)^qa\-ssh\-after\-sftp\-close\r?$'', selector: ''[data-testid="terminal-pane"]'', timeout_sec: 20}}'
    - step: 39
      expectation: '{assert_not_visible: ''[data-testid="sftp-browser"]''}'
    results:
    - 22
    - 23
    - 24
    - 26
    - 32
    - 39
  visual:
  - check: Attached SFTP panes, transfer queue, and terminal remain readable across open/close transitions.
    method: manual
    reason: DOM assertions do not establish split-pane sizing or visual continuity.
  native:
  - check: Native runs verify the packaged SSH terminal remains connected while the attached SFTP panel is mounted and unmounted.
    method: automated
    reason: Browser VFS behavior cannot prove native SSH/SFTP lifecycle wiring.

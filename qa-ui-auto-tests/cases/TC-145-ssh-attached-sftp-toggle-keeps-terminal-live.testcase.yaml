- wait_for: '[data-testid="sftp-floating-button"]'
- assert_not_visible: '[data-testid="sftp-browser"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 30
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo qa-ssh-after-reopened-sftp-close
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^qa-ssh-after-reopened-sftp-close\r?$
      timeout_sec: 10
      attempts: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa-ssh-after-reopened-sftp-close\r?$
    timeout_sec: 10
- screenshot: 145-ssh-attached-sftp-toggle.png
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: An authenticated SSH terminal opens its attached SFTP browser, exposes both panes and the transfer queue, accepts a command while
      the browser is open, closes the browser without disconnecting, accepts a command while closed, and reopens and closes the browser again with
      the terminal still ready. Each of the two open and two close transitions must execute a distinct command once with its exact standalone output;
      a lost write is never replayed. The floating entry is hidden with the panel open and visible after each hide.

id: TC-IDE-PARITY-024-02
title: 'IDEA popup keys: Search Everywhere Tab/Shift+Tab tabs, Recent Files Left/Right
  columns'
description: 'ED-PARITY-024 A4 browser case: in Search Everywhere Tab and Shift+Tab
  switch the category tab (IDEA SearchEverywhere.NextTab/PrevTab) while the query
  keeps focus, and Left/Right still move the caret (IDEA does not switch tabs on arrows).
  In Recent Files Left moves the keyboard selection into the tool-window column, Up/Down
  walk it, Right returns to the files, and Enter on a tool window activates it.


  Mode: browser.


  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F25.5
tags:
- code-workspace
- ed-parity-024
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Shift+N
- wait_for: '[data-testid="code-workspace-search-everywhere"]'
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- press: Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-symbols"]'
    name: aria-selected
    equals: 'true'
- eval_readonly:
    expression: document.activeElement?.getAttribute("aria-label") === "Go to symbol"
    expect_truthy: true
- press: Shift+Tab
- press: Shift+Tab
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-classes"]'
    name: aria-selected
    equals: 'true'
- press: ArrowRight
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-classes"]'
    name: aria-selected
    equals: 'true'
- click: '[data-testid="search-everywhere-tab-files"]'
- assert_attribute:
    selector: '[data-testid="search-everywhere-tab-files"]'
    name: aria-selected
    equals: 'true'
- eval_readonly:
    expression: document.activeElement?.getAttribute("aria-label") === "Go to file"
    expect_truthy: true
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    state: detached
    timeout_sec: 5
- press: Control+e
- wait_for: '[data-testid="code-workspace-recent-files"]'
- wait_for: '[data-testid="code-workspace-recent-files"] input[aria-label="Recent
    files"]:focus'
- press: ArrowLeft
- assert_attribute:
    selector: '[data-testid="code-workspace-recent-files-tool-window-project"]'
    name: data-selected
    equals: 'true'
- press: ArrowDown
- assert_attribute:
    selector: '[data-testid="code-workspace-recent-files-tool-window-problems"]'
    name: data-selected
    equals: 'true'
- press: ArrowRight
- assert_count:
    selector: '[data-testid="code-workspace-recent-files-tool-windows"] [data-selected="true"]'
    equal: 0
- press: ArrowLeft
- press: ArrowDown
- press: Enter
- wait_for:
    selector: '[data-testid="code-workspace-recent-files"]'
    state: detached
    timeout_sec: 5
- wait_for:
    selector: '[data-testid="shell-host"][data-panel-id$=":problems"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="shell-host"][data-panel-id$=":problems"] [data-testid="shell-host-tab"][aria-selected="true"]'
    contains: Problems
- screenshot: tc-ide-parity-024-02-popup-keys.png

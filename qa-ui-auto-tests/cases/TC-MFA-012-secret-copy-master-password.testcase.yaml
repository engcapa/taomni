id: TC-MFA-012
title: Secret key copy requires master password and provides direct masked view and copy actions
description: >-
  Verifies the MFA secret key export flow and card redesign. Copying the secret
  key from the account row menu triggers the master password prompt. An incorrect
  password is rejected without exposing data. The correct master password unlocks
  the dialog, displays the masked/formatted secret key, and automatically copies
  the secret key to the system clipboard. Also verifies the redesigned large OTP
  code button copies the current digits on direct click, and that secret mask
  toggling and copy buttons work as expected.
covers: [F-MFA-1, F-MFA-2]
tags: [mfa, export, secret, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill: {selector: '[data-testid="vault-setup-pw1"]', value: qa-mfa-master-012}
- fill: {selector: '[data-testid="vault-setup-pw2"]', value: qa-mfa-master-012}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill: {selector: '[data-testid="mfa-add-issuer"]', value: QA Secret}
- fill: {selector: '[data-testid="mfa-add-account"]', value: secret@example.com}
- fill: {selector: '[data-testid="mfa-add-secret"]', value: JBSWY3DPEHPK3PXP}
- click: '[data-testid="mfa-add-submit"]'
- wait_for: '[data-testid="mfa-account-row"][data-issuer="QA Secret"]'
- assert_visible: '[data-testid="mfa-account-avatar"]:is([data-issuer="QA Secret"] *)'
- click: '[data-testid="mfa-account-code"]:is([data-issuer="QA Secret"] *)'
- assert_text: {selector: '[data-testid="mfa-status"]', contains: Copied QA Secret}
- right_click: '[data-testid="mfa-account-row"][data-issuer="QA Secret"]'
- click: '[data-testid="mfa-menu-copy-secret"]'
- wait_for: '[data-testid="mfa-qr-dialog"][data-state="locked"]'
- fill: {selector: '[data-testid="mfa-qr-password"]', value: wrong-password}
- click: '[data-testid="mfa-qr-reveal"]'
- assert_text: {selector: '[data-testid="mfa-qr-error"]', contains: Incorrect master password}
- assert_count: {selector: '[data-testid="mfa-qr-secret"]', equal: 0}
- fill: {selector: '[data-testid="mfa-qr-password"]', value: qa-mfa-master-012}
- press: {key: Enter, selector: '[data-testid="mfa-qr-password"]'}
- wait_for: '[data-testid="mfa-qr-secret"]'
- assert_attribute: {selector: '[data-testid="mfa-qr-dialog"]', name: data-state, equals: shown}
- eval_readonly: {expression: navigator.clipboard.readText(), contains: 'JBSWY3DPEHPK3PXP'}
- assert_text: {selector: '[data-testid="mfa-status"]', contains: Copied QA Secret}
- assert_text: {selector: '[data-testid="mfa-qr-secret"]', contains: '••••'}
- click: '[data-testid="mfa-qr-toggle-secret"]'
- assert_text: {selector: '[data-testid="mfa-qr-secret"]', contains: 'JBSW Y3DP EHPK 3PXP'}
- click: '[data-testid="mfa-qr-copy-secret"]'
- eval_readonly: {expression: navigator.clipboard.readText(), contains: 'JBSWY3DPEHPK3PXP'}
- click: '[data-testid="mfa-qr-copy-uri"]'
- eval_readonly: {expression: navigator.clipboard.readText(), contains: 'otpauth://totp/QA%20Secret'}
- click: '[data-testid="mfa-qr-close"]'
- assert_not_visible: '[data-testid="mfa-qr-dialog"]'
- screenshot: mfa-012-secret-copy.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Copying secret key from row menu requires master password and rejects wrong password.
    actions: [11, 13, 14, 15, 16, 19, 21, 22, 24, 25]
    checkpoints:
    - {step: 17, expectation: account created}
    - {step: 18, expectation: avatar displayed}
    - {step: 20, expectation: direct code copy confirmed}
    - {step: 23, expectation: password prompt locked}
    - {step: 26, expectation: wrong password error}
    - {step: 27, expectation: no secret exposed}
    results: [26, 27]
  - id: R2
    requirement: Right master password reveals secret key, copies it automatically, and allows toggling mask and copying URI.
    actions: [28, 29, 35, 37, 39, 41]
    checkpoints:
    - {step: 30, expectation: secret displayed}
    - {step: 31, expectation: dialog in shown state}
    - {step: 32, expectation: secret copied to clipboard}
    - {step: 34, expectation: secret masked initially}
    - {step: 36, expectation: formatted secret unmasked}
    - {step: 38, expectation: secret manually copied}
    - {step: 40, expectation: uri copied}
    - {step: 42, expectation: dialog closed}
    results: [32, 36, 38, 40, 42]
  visual:
  - check: Secret key is masked initially and toggles to formatted Base32 with copy feedback.
    method: manual
    reason: Visual styling and mask appearance.
  native:
  - check: Master password gating and secret export are covered natively by TC-MFA-108.
    method: external
    reason: Browser stub mode.

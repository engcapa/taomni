id: TC-FILE-OPEN-021
title: Native draw.io exports and imports through real OS save/open dialogs and system clipboard
description: Production Markdown entry and actual user controls. Retains selected export/import outcomes, editable graph XML,
  text/table data and original source; browser uses VFS, native uses OS dialogs/disk/clipboard.
modes:
- native
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-drawio
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="quality.md"]'
- wait_for: '[data-testid="markdown-editor"]'
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-drawio"]'
- wait_for: '[data-testid="markdown-drawio-export-settings"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_quality_exports}/document.drawio
    trigger: '[data-testid="markdown-drawio-save"]'
- wait_for: '[data-testid="markdown-export-status"][data-export-state="saved"]'
- eval_readonly:
    expression: document.querySelector(".fv-md-export-notice").getBoundingClientRect().top >= document.querySelector(".fv-md-toolbar").getBoundingClientRect().bottom
    expect_truthy: true
- assert_file_contains:
    path: ${fixture.markdown_quality_exports}/document.drawio
    contains: taomniKind="table"
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-drawio"]'
- wait_for: '[data-testid="markdown-drawio-export-settings"]'
- click: '[data-testid="markdown-drawio-copy-link"]'
- host_clipboard:
    action: assert
    kind: text
    contains: https://app.diagrams.net/?client=1#R
- dblclick: .fv-md-mermaid
- wait_for: '[data-testid="markdown-diagram-viewer"]'
- click: '[data-testid="markdown-diagram-view-rotate-right"]'
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.markdown_quality_exports}/diagram.drawio
    trigger: '[data-testid="markdown-diagram-view-save-drawio"]'
- assert_file_contains:
    path: ${fixture.markdown_quality_exports}/diagram.drawio
    contains: edge="1"
- click: '[data-testid="markdown-diagram-close"]'
- click: '[data-testid="markdown-live-edit"]'
- native_file_dialog:
    kind: open
    action: cancel
    trigger: '[data-testid="markdown-import-drawio"]'
- assert_count:
    selector: '[data-testid="markdown-drawio-import-dialog"]'
    equal: 0
- native_file_dialog:
    kind: open
    action: choose
    path: ${fixture.drawio_import_file}
    trigger: '[data-testid="markdown-import-drawio"]'
- wait_for:
    selector: '[data-testid="markdown-drawio-import-dialog"] [data-testid="markdown-drawio-import-preview"] svg'
    timeout_sec: 30
- assert_disabled: '[data-testid="markdown-drawio-import-confirm"]'
- click: '[data-testid="markdown-drawio-import-diagram"]'
- click: '[data-testid="markdown-drawio-import-confirm"]'
- wait_for:
    selector: .fv-md-drawio svg
    timeout_sec: 30
- click: '[data-testid="viewer-save"]'
- assert_file_contains:
    path: ${fixture.markdown_quality_source}
    contains: '```drawio'
- assert_no_runtime_errors: null
- screenshot: drawio-native-save-import.png
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p0
- markdown
- drawio
- regression
fixtures:
- reset_db
- markdown_drawio
timeout_sec: 300
verification:
  review: reviewed
  requirements:
  - id: DRAWIO-WORKFLOW
    requirement: Native draw.io exports and imports through real OS save/open dialogs and system clipboard
    actions:
    - 4
    - 5
    - 7
    - 8
    - 9
    - 10
    - 12
    - 13
    - 15
    - 19
    - 20
    - 22
    - 24
    - 26
    - 27
    - 29
    - 30
    - 31
    - 33
    - 36
    - 37
    - 39
    checkpoints:
    - step: 18
      expectation: Actual control state/content or retained file/clipboard matches the explicit assertion; source and cancellation
        behavior remain intact.
    - step: 28
      expectation: Actual control state/content or retained file/clipboard matches the explicit assertion; source and cancellation
        behavior remain intact.
    - step: 32
      expectation: Cancelling the real native chooser leaves no import dialog or document insertion; a later import remains
        available.
    - step: 35
      expectation: Actual control state/content or retained file/clipboard matches the explicit assertion; source and cancellation
        behavior remain intact.
    - step: 40
      expectation: Actual control state/content or retained file/clipboard matches the explicit assertion; source and cancellation
        behavior remain intact.
    - step: 41
      expectation: Actual control state/content or retained file/clipboard matches the explicit assertion; source and cancellation
        behavior remain intact.
    results:
    - 18
    - 28
    - 32
    - 35
    - 40
    - 41
  - id: EXPORT-NOTICE-WRAPPED-TOOLBAR
    requirement: Native export result remains below the actual wrapped toolbar so subsequent export actions stay available.
    actions:
    - 15
    - 19
    checkpoints:
    - step: 17
      expectation: Notice starts below the actual toolbar bottom; the subsequent real pointer click reopens Export without
        dismissing the result.
    - step: 21
      expectation: The actual pointer click can reopen draw.io export settings while the previous saved result is still shown.
    results:
    - 17
    - 21
  native:
  - check: Actual file chooser, draw.io bytes, remembered directory, import and OS clipboard
    method: automated
    reason: Browser VFS/downloads cannot prove Tauri chooser, host bytes or system clipboard.
  visual:
  - check: Sheet previews and Markdown content remain readable
    method: manual
    reason: Inspect retained screenshot and SVG/graph artifacts; nonempty files alone do not establish visual fidelity.

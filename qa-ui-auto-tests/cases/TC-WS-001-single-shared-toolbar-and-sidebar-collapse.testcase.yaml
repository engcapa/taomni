id: TC-WS-001
title: Single 33px shared toolbar with left/right collapse and global search entry
description: Workspace-first platform redesign AC-01. The window keeps exactly one 33px ControlBar with no extra top rows or decorative dots. The left toggle (and Ctrl+B) collapse/expand the main sidebar, the right toggle flips the right panel state, and the global search trigger opens the Ctrl+K palette.
covers:
- F1.2
- F1.3
- F-WS-1
tags:
- workspace-platform
- shell
- p1
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="control-bar"]'
- assert_count:
    selector: '[data-testid="control-bar"]'
    equal: 1
- assert_count:
    selector: .window-decoration-dots
    equal: 0
- eval_readonly:
    expression: document.querySelector('.taomni-control-bar').getBoundingClientRect().height <= 33 && document.querySelectorAll('.taomni-control-bar').length === 1
    expect_truthy: true
- assert_visible: '[data-testid="app-main-menu"]'
- assert_visible: '[data-testid="toggle-left-sidebar"]'
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- assert_not_visible: '[data-testid="expanded-sidebar-panel"]'
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="expanded-sidebar-panel"]'
- press: Control+b
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- press: Control+b
- wait_for: '[data-testid="expanded-sidebar-panel"]'
- assert_visible: '[data-testid="toggle-right-sidebar"]'
- click: '[data-testid="toggle-right-sidebar"]'
- assert_attribute:
    selector: '[data-testid="toggle-right-sidebar"]'
    name: data-active
    equals: 'true'
- click: '[data-testid="toggle-right-sidebar"]'
- assert_visible: '[data-testid="global-search-trigger"]'
- click: '[data-testid="global-search-trigger"]'
- wait_for: '[data-testid="global-search-modal"]'
- press: Escape
- assert_not_visible: '[data-testid="global-search-modal"]'
- screenshot: tc-ws-001-shared-toolbar.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 窗口只有一行 33px 共享工具栏，无额外顶栏行、无装饰圆点。
    actions:
    - 1
    - 3
    - 4
    checkpoints:
    - step: 3
      expectation: '{"assert_count": {"selector": "[data-testid=\"control-bar\"]", "equal": 1}}'
    - step: 4
      expectation: 装饰圆点元素数量为 0。
    - step: 5
      expectation: ControlBar 高度不超过 33px 且全文档仅一个。
    results:
    - 3
    - 4
    - 5
  - id: R2
    requirement: 左栏收缩按钮与 Ctrl+B 均可折叠/展开主侧栏；右侧栏按钮切换状态；全局搜索入口打开 Ctrl+K 面板并可 Esc 关闭。
    actions:
    - 8
    - 11
    - 13
    - 18
    - 22
    checkpoints:
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"]"}'
    - step: 10
      expectation: '{"assert_not_visible": "[data-testid=\"expanded-sidebar-panel\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"expanded-sidebar-panel\"]"}'
    - step: 14
      expectation: Ctrl+B 折叠侧栏。
    - step: 16
      expectation: Ctrl+B 再次展开侧栏。
    - step: 19
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"toggle-right-sidebar\"]", "name": "data-active", "equals": "true"}}'
    - step: 23
      expectation: '{"wait_for": "[data-testid=\"global-search-modal\"]"}'
    - step: 25
      expectation: '{"assert_not_visible": "[data-testid=\"global-search-modal\"]"}'
    results:
    - 9
    - 10
    - 12
    - 16
    - 19
    - 23
    - 25
  visual:
  - check: 检查截图中工具栏单行、无遮挡、按钮间距正常。
    method: manual
    reason: 像素布局与遮挡需要截图人工评审。
  native:
  - check: 原生 WebView 中由真实 QA 应用执行相同步骤；Linux 窗口拖动另由 TC-MAIN-RAIL-03 证明。
    method: automated
    reason: browser 无法证明原生窗口行为，未执行平台不计作通过。

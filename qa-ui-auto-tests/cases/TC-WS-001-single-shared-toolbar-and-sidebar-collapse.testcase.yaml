id: TC-WS-001
title: Single shared 33px toolbar with left/right sidebar collapse and Ctrl+B
description: 'Prototype shell: a full-height rail beside aligned rounded navigator and main canvas, one 33px toolbar inside the canvas, 6px gutters and
  functional sidebar toggles.'
modes:
- browser
- native
covers:
- F1.2
- F1.3
- F-WS-1
tags:
- smoke
- p0
- workspace-redesign
- main
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-001
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sessions-empty-state"]'
- assert_count:
    selector: '[data-testid="control-bar"]'
    equal: 1
- assert_visible: '[data-testid="toggle-left-sidebar"]'
- assert_visible: '[data-testid="window-drag-handle"]'
- assert_visible: '[data-testid="global-search-trigger"]'
- assert_visible: '[data-testid="toggle-right-sidebar"]'
- assert_visible: '[data-testid="titlebar-actions-more"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"control-bar"]').getBoundingClientRect().height <= 34
    expect_truthy: true
- eval_readonly:
    expression: Math.abs(document.querySelector('.taomni-navigator-frame').getBoundingClientRect().top - document.querySelector('.taomni-main-canvas-frame').getBoundingClientRect().top)
      < 1 && document.querySelector('.taomni-platform-resizer').getBoundingClientRect().width === 6
    expect_truthy: true
- assert_count:
    selector: '[data-testid="sidebar-rail"] [data-testid="rail-app-menu-host"]'
    equal: 1
- eval_readonly:
    expression: 'typeof window.__TAURI_INTERNALS__ !== ''undefined'' && /Mac/.test(navigator.platform) ? document.querySelector(''[data-testid''+String.fromCharCode(61)+''"rail-app-menu-host"]'').childElementCount
      === 0 : document.querySelector(''[data-testid''+String.fromCharCode(61)+''"rail-app-menu-host"]'').getBoundingClientRect().width > 0'
    expect_truthy: true
- click: '[data-testid="toggle-left-sidebar"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- press: Mod+b
- wait_for: '[data-testid="expanded-sidebar-panel"]'
- click: '[data-testid="toggle-right-sidebar"]'
- assert_count:
    selector: '[data-testid="right-sidebar"]'
    equal: 1
- click: '[data-testid="toggle-right-sidebar"]'
- assert_count:
    selector: '[data-testid="right-sidebar"]'
    equal: 0
- screenshot: ws-001-single-shared-toolbar.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Home 与 Sessions 按原型独立呈现；共享工具栏、对应模式的侧栏控制、保留启动入口和响应式布局均满足断言。
    actions:
    - 1
    - 2
    - 4
    - 16
    - 18
    - 20
    - 22
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"sessions-empty-state\"]"}'
    - step: 6
      expectation: '{"assert_count": {"selector": "[data-testid=\"control-bar\"]", "equal": 1}}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"toggle-left-sidebar\"]"}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"window-drag-handle\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"global-search-trigger\"]"}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"toggle-right-sidebar\"]"}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"titlebar-actions-more\"]"}'
    - step: 12
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"control-bar\"]'').getBoundingClientRect().height
        <= 34", "expect_truthy": true}}'
    - step: 13
      expectation: '{"eval_readonly": {"expression": "Math.abs(document.querySelector(''.taomni-navigator-frame'').getBoundingClientRect().top - document.querySelector(''.taomni-main-canvas-frame'').getBoundingClientRect().top)
        < 1 && document.querySelector(''.taomni-platform-resizer'').getBoundingClientRect().width === 6", "expect_truthy": true}}'
    - step: 15
      expectation: macOS native uses the system application menu and leaves the rail host empty; browser and other native hosts show the rail application
        menu.
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"]"}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"expanded-sidebar-panel\"]"}'
    - step: 21
      expectation: '{"assert_count": {"selector": "[data-testid=\"right-sidebar\"]", "equal": 1}}'
    - step: 23
      expectation: '{"assert_count": {"selector": "[data-testid=\"right-sidebar\"]", "equal": 0}}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-rail\"] [data-testid=\"rail-app-menu-host\"]", "equal": 1}}'
    results:
    - 3
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    - 11
    - 12
    - 13
    - 15
    - 17
    - 19
    - 21
    - 23
    - 14
  visual:
  - check: 与 HTML 原型比较圆角框架、紧凑尺寸、无溢出和可用操作入口。
    method: manual
    reason: 保留运行截图供视觉对比，自动断言验证具体布局和状态。
  native:
  - check: 在真实桌面 WebView 验证布局与持久化；终端用例额外验证真实 PTY，编辑器用例验证真实磁盘写入。
    method: automated
    reason: 浏览器存根不能证明 WebKit/WebView2 渲染与原生磁盘、进程行为。

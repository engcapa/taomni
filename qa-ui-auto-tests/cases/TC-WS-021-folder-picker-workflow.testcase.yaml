id: TC-WS-021
title: Browser directory-picker workflow mounts a workspace root and preserves cancellation
description: Exercises the browser VFS dialog adapter through the production Browse action, cancellation, explicit Add, file listing and persisted root.
  Native OS selection is covered separately by TC-WS-022.
modes:
- browser
covers:
- F-WS-2
- F25.1
tags:
- p0
- workspace-redesign
- files
- folder-picker
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-folder-picker
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- wait_for: '[data-testid="workspace-fs-modal"][data-kind="root"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-browse"]'
- wait_for: '[data-testid="text-input-dialog"]'
- assert_text:
    selector: '[data-testid="text-input-dialog"]'
    contains: Select folder to open
- assert_attribute:
    selector: '[data-testid="text-input-dialog-input"]'
    name: value
    equals: ${fixture.platform_workspace_root}
- click: '[data-testid="text-input-dialog-cancel"]'
- assert_attribute:
    selector: '[data-testid="workspace-fs-modal-input"]'
    name: value
    equals: ${fixture.platform_workspace_root}
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 0
- click: '[data-testid="workspace-fs-modal-browse"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: ${fixture.platform_workspace_root}/src
- click: '[data-testid="text-input-dialog-confirm"]'
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-fs-modal-input"]').value.split(String.fromCharCode(92)).join('/').replace(/\/$/,
      '') === '${fixture.platform_workspace_root}/src'
    expect_truthy: true
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 0
- click: '[data-testid="workspace-fs-modal-confirm"]'
- assert_not_visible: '[data-testid="workspace-fs-modal"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 1
- assert_visible: '[data-testid="code-workspace-tree-root"][title="${fixture.platform_workspace_root}/src"]'
- click: '[data-testid="code-workspace-tree-root"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="index.ts"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- wait_for: '[data-testid="workspace-fs-modal"]'
- click: '[data-testid="workspace-fs-modal-cancel"]'
- assert_count:
    selector: '[data-testid="code-workspace-tree-root"]'
    equal: 1
- reload_window: null
- click: '[data-testid="nav-mode-workspaces"]'
- assert_visible: '[data-testid="code-workspace-tree-root"][title="${fixture.platform_workspace_root}/src"]'
- screenshot: workspace-folder-picker.png
verification:
  review: reviewed
  native:
  - check: Renderer workflow; real OS boundaries are verified by the corresponding native workspace cases.
    method: external
    reason: Browser preview uses platform stubs and does not claim native process, disk, picker or clipboard evidence.
  requirements:
  - id: R1
    requirement: Browse opens the folder chooser; cancellation retains the typed path; choosing a directory waits for Add, mounts exactly that existing
      directory, lists its files and survives reload. Cancelling Add mounts nothing else.
    actions:
    - 3
    - 6
    - 8
    - 9
    - 13
    - 16
    - 18
    - 19
    - 22
    - 26
    - 28
    - 29
    - 31
    - 33
    - 34
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-empty\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"workspace-fs-modal\"][data-kind=\"root\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 11
      expectation: '{"assert_text": {"selector": "[data-testid=\"text-input-dialog\"]", "contains": "Select folder to open"}}'
    - step: 12
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"text-input-dialog-input\"]", "name": "value", "equals": "${fixture.platform_workspace_root}"}}'
    - step: 14
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"workspace-fs-modal-input\"]", "name": "value", "equals": "${fixture.platform_workspace_root}"}}'
    - step: 15
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 0}}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"workspace-fs-modal-input\"]'').value.split(String.fromCharCode(92)).join(''/'').replace(/\\/$/,
        '''') === ''${fixture.platform_workspace_root}/src''", "expect_truthy": true}}'
    - step: 21
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 0}}'
    - step: 23
      expectation: '{"assert_not_visible": "[data-testid=\"workspace-fs-modal\"]"}'
    - step: 24
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 1}}'
    - step: 25
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-root\"][title=\"${fixture.platform_workspace_root}/src\"]"}'
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"index.ts\"]"}'
    - step: 30
      expectation: '{"wait_for": "[data-testid=\"workspace-fs-modal\"]"}'
    - step: 32
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tree-root\"]", "equal": 1}}'
    - step: 35
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-root\"][title=\"${fixture.platform_workspace_root}/src\"]"}'
    results:
    - 4
    - 7
    - 10
    - 11
    - 12
    - 14
    - 15
    - 17
    - 20
    - 21
    - 23
    - 24
    - 25
    - 27
    - 30
    - 32
    - 35
  visual:
  - check: The path field and Browse action fit the compact Add folder dialog.
    method: manual
    reason: Inspect the native chooser and resulting workspace screenshots.

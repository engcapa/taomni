  visual:
  - check: Configuration and workflow state
    method: automated
    reason: Visible fields and exact values are asserted at each decisive state.
  native:
  - check: Native boundary
    method: automated
    reason: Fixture seeds a previous-version SSH row before native startup; actual protocol transfers, independent SHA256 checks and queue lifecycle assertions are
      retained. No removed editor control is used.

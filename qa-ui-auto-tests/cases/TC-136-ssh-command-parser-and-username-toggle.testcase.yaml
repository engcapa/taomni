id: TC-136
title: SSH command parsing updates host fields and username enablement state
covers:
- F6.3
- F6.2
tags:
- ssh
- session
- settings
- parser
- validation
- persistence
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh -p 2201 parser-user@parser.example.test
- click: '[data-testid="session-host-lookup"]'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: parser.example.test
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: '2201'
- assert_attribute:
    selector: '[data-testid="session-user"]'
    name: value
    equals: parser-user
- assert_attribute:
    selector: '[data-testid="session-specify-username"]'
    name: data-checked
    equals: 'true'
- assert_text:
    selector: '[data-testid="session-test-result-summary"]'
    contains: SSH command imported
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: false
- assert_disabled: '[data-testid="session-user"]'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- assert_enabled: '[data-testid="session-user"]'
- fill:
    selector: '[data-testid="session-user"]'
    value: parser-user-updated
- assert_attribute:
    selector: '[data-testid="session-user"]'
    name: value
    equals: parser-user-updated
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh parser-no-port.example.test
- click: '[data-testid="session-host-lookup"]'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: parser-no-port.example.test
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: '22'
- assert_attribute:
    selector: '[data-testid="session-specify-username"]'
    name: data-checked
    equals: 'false'
- assert_disabled: '[data-testid="session-user"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-command-parser
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-command-parser"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-command-parser"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: parser-no-port.example.test
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: '22'
- assert_attribute:
    selector: '[data-testid="session-specify-username"]'
    name: data-checked
    equals: 'false'
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 136-ssh-command-parser.png

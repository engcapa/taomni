id: TC-SHELL-B46
title: Four dock edges, portrait geometry and hidden-dock recovery
description: Shell redesign follow-up acceptance. User actions use production controls and commands. Browser stubs
  do not establish native side effects.
covers:
- F-SHELL-1
tags:
- workspace-shell
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- set_viewport:
    width: 800
    height: 1100
- right_click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-rail-move-top"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: top
- &id001
  assert_element_geometry:
    selector: '[data-testid="shell-rail"] > button:not([data-testid="shell-rail-communicate"]):not([data-testid="shell-rail-utility"]):not([data-testid="shell-rail-more"])'
    min_count: 5
    min_width: 32
    min_height: 32
    within_viewport: true
    hit_center: true
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"rail":{"edge":"top","visible":true}'
- screenshot: dock-top.png
- right_click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-rail-move-right"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: right
- *id001
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"rail":{"edge":"right","visible":true}'
- screenshot: dock-right.png
- right_click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-rail-move-bottom"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: bottom
- *id001
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"rail":{"edge":"bottom","visible":true}'
- screenshot: dock-bottom.png
- right_click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-rail-move-left"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: left
- *id001
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"rail":{"edge":"left","visible":true}'
- screenshot: dock-left.png
- right_click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="shell-rail-hide"]'
- assert_not_visible: '[data-testid="shell-rail"]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_not_visible: '[data-testid="shell-rail"]'
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.rail.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.rail.toggle"]'
- assert_visible: '[data-testid="shell-rail"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: left
- assert_count:
    selector: '[data-testid="tab-details-hover"],[data-testid="shell-navigator-toggle"],[data-testid="ai-chat-drawer-ribbon"],[data-testid="ribbon-git"]'
    equal: 0
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: All four dock orientations adapt to a portrait viewport and persist exact placement.
    actions:
    - 1
    - 3
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 7
      expectation: Primary dock targets remain within the portrait viewport with usable hit areas.
    results:
    - 2
    - 7
  - id: R2
    requirement: User moves the global dock to top; buttons remain visible and clickable.
    actions:
    - 4
    - 5
    checkpoints:
    - step: 6
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail\"]", "name": "data-edge", "equals":
        "top"}}'
    - step: 7
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"shell-rail\"] > button", "min_count":
        5, "min_width": 32, "min_height": 32, "within_viewport": true, "hit_center": true}}'
    - step: 8
      expectation: '{"assert_localstorage": {"key": "taomni.shellLayout.v2", "contains": "\"rail\":{\"edge\":\"top\",\"visible\":true}"}}'
    results:
    - 6
    - 7
    - 8
  - id: R3
    requirement: User moves the global dock to right; buttons remain visible and clickable.
    actions:
    - 10
    - 11
    checkpoints:
    - step: 12
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail\"]", "name": "data-edge", "equals":
        "right"}}'
    - step: 13
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"shell-rail\"] > button", "min_count":
        5, "min_width": 32, "min_height": 32, "within_viewport": true, "hit_center": true}}'
    - step: 14
      expectation: '{"assert_localstorage": {"key": "taomni.shellLayout.v2", "contains": "\"rail\":{\"edge\":\"right\",\"visible\":true}"}}'
    results:
    - 12
    - 13
    - 14
  - id: R4
    requirement: User moves the global dock to bottom; buttons remain visible and clickable.
    actions:
    - 16
    - 17
    checkpoints:
    - step: 18
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail\"]", "name": "data-edge", "equals":
        "bottom"}}'
    - step: 19
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"shell-rail\"] > button", "min_count":
        5, "min_width": 32, "min_height": 32, "within_viewport": true, "hit_center": true}}'
    - step: 20
      expectation: '{"assert_localstorage": {"key": "taomni.shellLayout.v2", "contains": "\"rail\":{\"edge\":\"bottom\",\"visible\":true}"}}'
    results:
    - 18
    - 19
    - 20
  - id: R5
    requirement: User moves the global dock to left; buttons remain visible and clickable.
    actions:
    - 22
    - 23
    checkpoints:
    - step: 24
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail\"]", "name": "data-edge", "equals":
        "left"}}'
    - step: 25
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"shell-rail\"] > button", "min_count":
        5, "min_width": 32, "min_height": 32, "within_viewport": true, "hit_center": true}}'
    - step: 26
      expectation: '{"assert_localstorage": {"key": "taomni.shellLayout.v2", "contains": "\"rail\":{\"edge\":\"left\",\"visible\":true}"}}'
    results:
    - 24
    - 25
    - 26
  - id: R6
    requirement: Hidden dock survives reload and F1 recovers it without another visible entry.
    actions:
    - 28
    - 29
    - 31
    - 34
    - 36
    - 37
    checkpoints:
    - step: 30
      expectation: '{"assert_not_visible": "[data-testid=\"shell-rail\"]"}'
    - step: 32
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 33
      expectation: '{"assert_not_visible": "[data-testid=\"shell-rail\"]"}'
    - step: 35
      expectation: '{"wait_for": "[data-testid=\"shell-action-search\"]"}'
    - step: 38
      expectation: '{"assert_visible": "[data-testid=\"shell-rail\"]"}'
    - step: 39
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"shell-rail\"]", "name": "data-edge", "equals":
        "left"}}'
    - step: 40
      expectation: '{"assert_count": {"selector": "[data-testid=\"tab-details-hover\"],[data-testid=\"shell-navigator-toggle\"],[data-testid=\"ai-chat-drawer-ribbon\"],[data-testid=\"ribbon-git\"]",
        "equal": 0}}'
    results:
    - 30
    - 32
    - 33
    - 35
    - 38
    - 39
    - 40
  visual:
  - check: Dock, palette and content stay readable with no clipped controls.
    method: manual
    reason: Review retained screenshots from each engine.
  native:
  - check: Packaged WebView, PTY and native lifecycle boundaries.
    method: not-applicable
    reason: Native cases retain actual backend effects; browser cases prove renderer behavior only.

    - 18
    - 19
    - 23
    checkpoints:
    - step: 20
      expectation: Switching from quick to overview carries the query and uses a single
        focus trap; Escape returns focus.
    - step: 21
      expectation: Switching from quick to overview carries the query and uses a single
        focus trap; Escape returns focus.
    - step: 22
      expectation: Switching from quick to overview carries the query and uses a single
        focus trap; Escape returns focus.
    - step: 24
      expectation: Switching from quick to overview carries the query and uses a single

id: TC-SHELL-B11
title: Quick switch semantics, query carry and one active destination
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b11.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F25.5
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-quick-switch"]'
- assert_attribute:
    selector: '[data-testid="shell-quick-input"]'
    name: role
    equals: combobox
- assert_count:
    selector: '[data-testid="shell-quick-option"] button'
    equal: 0
- fill:
    selector: '[data-testid="shell-quick-input"]'
    value: qa-alpha
- assert_count:
    selector: '[data-testid="shell-quick-option"]'
    equal: 1
- press:
    selector: '[data-testid="shell-quick-input"]'
    key: Enter
- assert_not_visible: '[data-testid="shell-quick-dialog"]'
- assert_text_equals:
    selector: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
    equals: qa-alpha
- click: '[data-testid="shell-quick-switch"]'
- fill:
    selector: '[data-testid="shell-quick-input"]'
    value: qa-beta
- click: '[data-testid="shell-quick-overview"]'
- assert_not_visible: '[data-testid="shell-quick-dialog"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 1
- eval_readonly:
    expression: document.activeElement.value === 'qa-beta'
    expect_truthy: true
    timeout_sec: 5
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Escape
- eval_readonly:
    expression: document.activeElement.getAttribute('data-testid') === 'shell-quick-switch'
    expect_truthy: true
    timeout_sec: 5
- screenshot: tc-shell-b11.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Quick switch is one combobox/listbox without destructive row buttons;
      Enter activates the selected result.
    actions:
    - 3
    - 4
    - 6
    - 7
    - 9
    - 12
    - 14
    checkpoints:
    - step: 5
      expectation: Quick switch is one combobox/listbox without destructive row buttons;
        Enter activates the selected result.
    - step: 8
      expectation: Quick switch is one combobox/listbox without destructive row buttons;
        Enter activates the selected result.
    - step: 10
      expectation: Quick switch is one combobox/listbox without destructive row buttons;
        Enter activates the selected result.
    - step: 11
      expectation: Quick switch is one combobox/listbox without destructive row buttons;
        Enter activates the selected result.
    - step: 13
      expectation: Quick switch is one combobox/listbox without destructive row buttons;
        Enter activates the selected result.
    - step: 15
      expectation: Quick switch is one combobox/listbox without destructive row buttons;
        Enter activates the selected result.
    - step: 16
      expectation: Quick switch is one combobox/listbox without destructive row buttons;
        Enter activates the selected result.
    results:

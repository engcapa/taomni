id: TC-TERM-IME-001
title: Real terminal IME commit and cancel stay intact after closing and reopening the PTY
description: Linux/X11 fcitx5 wbpy supplies physical composition keys to the real xterm textarea and PTY.
  Two committed CJK characters appear exactly once in printf output; cancellation leaves only ASCII. A
  fresh terminal repeats composition after the first owner has unmounted. This does not establish Windows/macOS
  IME transport behavior.
covers:
- F2.1
- F2.2
tags:
- terminal
- ime
- lifecycle
- p1
modes:
- native
native_platforms:
- Linux
fixtures:
- reset_db
- linux_x11_required
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-terminal-ime-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf 'qa-ime-first-<%s>\n' '
    submit: false
- native_ime_keys:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    expected_engine: wbpy
    keys:
    - n
    - i
    - h
    - a
    - o
    - Space
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: ''''
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^qa-ime-first-<[\u4e00-\u9fff]{2}>\r?$
    timeout_sec: 20
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 20
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf 'qa-ime-cancel-<%s>\n' '
    submit: false
- native_ime_keys:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    expected_engine: wbpy
    keys:
    - n
    - i
    - h
    - a
    - o
    - Escape
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: ASCII'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^qa-ime-cancel-<ASCII>\r?$
    timeout_sec: 20
- click: '[data-testid="tab-item"][data-tab-type="terminal"] [data-testid="tab-close"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    state: detached
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf 'qa-ime-reopened-<%s>\n' '
    submit: false
- native_ime_keys:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    expected_engine: wbpy
    keys:
    - n
    - i
    - h
    - a
    - o
    - Space
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: ''''
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^qa-ime-reopened-<[\u4e00-\u9fff]{2}>\r?$
    timeout_sec: 20
- eval_readonly:
    expression: '!(/nihao/.test(document.querySelector("[data-terminal-text]").getAttribute("data-terminal-text")
      || ""))'
    expect_truthy: true
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 1
- screenshot: terminal-ime-after-reopen.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Physical fcitx commit reaches the local PTY once, Escape sends no preedit, and a newly
      opened terminal accepts another composition without stale listeners or duplicate input.
    actions:
    - 1
    - 4
    - 6
    - 7
    - 8
    - 11
    - 12
    - 13
    - 15
    - 18
    - 20
    - 21
    - 22
    results:
    - 9
    - 14
    - 23
    - 24
    - 25
    checkpoints:
    - step: 9
      expectation: '{''assert_pattern'': {''selector'': ''[data-testid="terminal-pane"][data-terminal-active="true"]'',
        ''regex'': ''(?m)^qa-ime-first-<[\\u4e00-\\u9fff]{2}>\\r?$'', ''timeout_sec'': 20}}'
    - step: 14
      expectation: '{''assert_pattern'': {''selector'': ''[data-testid="terminal-pane"][data-terminal-active="true"]'',
        ''regex'': ''(?m)^qa-ime-cancel-<ASCII>\\r?$'', ''timeout_sec'': 20}}'
    - step: 23
      expectation: '{''assert_pattern'': {''selector'': ''[data-testid="terminal-pane"][data-terminal-active="true"]'',
        ''regex'': ''(?m)^qa-ime-reopened-<[\\u4e00-\\u9fff]{2}>\\r?$'', ''timeout_sec'': 20}}'
    - step: 24
      expectation: '{''eval_readonly'': {''expression'': ''!(/nihao/.test(document.querySelector("[data-terminal-text]").getAttribute("data-terminal-text")
        || ""))'', ''expect_truthy'': True}}'
    - step: 25
      expectation: '{''assert_count'': {''selector'': ''[data-testid="terminal-pane"]'', ''equal'': 1}}'
  native:
  - check: Real X11 XTest → fcitx5 wbpy → WebKitGTK/xterm → local PTY composition, cancellation and remount.
    method: automated
    reason: Browser and synthetic composition events cannot establish real input-method delivery. Windows/macOS
      IME remains outside this Linux case.
  visual:
  - check: Candidate popup location and caret appearance.
    method: manual
    reason: The functional result does not establish visual placement.

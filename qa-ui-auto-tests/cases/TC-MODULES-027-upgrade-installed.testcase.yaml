id: TC-MODULES-027
title: Installed 0.5.10 sessions remain available after the signed VNC upgrade
description: Installs the pinned public 0.5.10 deb/MSI/DMG on an owned GitHub runner and runs its headless entry twice in the
  candidate QA profile. The old binary creates the actual schema; SSH/VNC business rows are synthetic and must survive its
  reopening. The candidate then uses real Settings/IPC to recommend only VNC, retain old chat bytes and sidecars, and keep
  pending state through normal candidate restart. The main window then installs Hello and MFA from the signed release roster.
  The oracle verifies that both packages, the original data and the pending VNC journal are present. Installing and
  enabling the signed VNC client completes the original session entry in place and opens the original saved tab.
  Unix old processes must exit normally.
  Windows GUI-subsystem old processes are forcibly stopped and recorded as crash input.

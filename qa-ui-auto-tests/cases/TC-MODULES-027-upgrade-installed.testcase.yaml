id: TC-MODULES-027
title: Installed 0.5.9 profile opens safely in the candidate with idempotent pending VNC upgrade
description: Installs the pinned public 0.5.9 deb/MSI/DMG on an owned GitHub runner and runs its headless entry twice in the
  candidate QA profile. The old binary creates the actual schema; SSH/VNC business rows are synthetic and must survive its
  reopening. The candidate then uses real Settings/IPC to recommend only VNC, retain old chat bytes and sidecars, and keep
  pending state through normal candidate restart. Unix old processes must exit normally; Windows GUI-subsystem old processes
  are forcibly stopped and recorded as crash input. This establishes old-installed initialization to candidate preflight,
  not candidate installer replacement or completed module migration.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- native
fixtures:
- reset_db
- module_legacy_install
timeout_sec: 900
steps:
- open: ${cfg.app.base_url}
- &id001
  wait_for: '[data-testid="status-bar"]'
- &id002
  click: '[data-testid="ribbon-settings"]'
- &id003
  wait_for: '[data-testid="settings-panel"]'
- &id004
  fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- &id005
  wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- &id006
  assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 1
- &id007
  assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- &id008
  assert_visible: '[data-testid="module-upgrade-retained"]'
- &id009
  assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- &id010
  assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: preflight
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- module_upgrade_probe:
    phase: pending
- native_restart_app:
    expect_exit_confirmation:
      title: Exit
      message: There is 1 open tab. Exit Taomni and close it?
      confirm_label: Exit
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- *id007
- *id008
- *id009
- *id010
- module_upgrade_probe:
    phase: repeat
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- wait_for: '[data-testid="module-upgrade-migrate"]:not([disabled])'
- module_upgrade_probe:
    phase: repeat
- assert_no_runtime_errors: null
- screenshot: module-upgrade-installed-059-native.png

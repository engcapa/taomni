id: TC-SESSION-NET-001
title: ClickHouse ports and independent proxy survive save and reopen
covers:
- F6.3
- F6.2
tags:
- session
- database
- regression
modes:
- browser
- native
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-clickhouse"]'
- assert_not_visible: '[data-testid="session-port"]'
- fill:
    selector: input[aria-label="ClickHouse HTTP port"]
    value: '18123'
- select_option:
    selector: '[data-testid="session-clickhouse-protocol"]'
    value: Native
- assert_visible: '[data-testid="session-port"]'
- assert_not_visible: input[aria-label="ClickHouse HTTP port"]
- fill:
    selector: '[data-testid="session-host"]'
    value: clickhouse.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '19000'
- click: '[data-testid="session-section-network"]'
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: none
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: custom
- assert_visible: '[data-testid="session-custom-proxy"]'
- fill:
    selector: '[data-testid="session-custom-proxy"] input[aria-label="Proxy host"]'
    value: proxy.example.test
- fill:
    selector: '[data-testid="session-custom-proxy"] input[aria-label="Port"]'
    value: '3129'
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-clickhouse-config
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-clickhouse-config"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-clickhouse-config"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-database"]'
- assert_attribute:
    selector: '[data-testid="session-clickhouse-protocol"]'
    name: value
    equals: Native
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: '19000'
- select_option:
    selector: '[data-testid="session-clickhouse-protocol"]'
    value: HTTP
- assert_attribute:
    selector: input[aria-label="ClickHouse HTTP port"]
    name: value
    equals: '18123'
- assert_not_visible: '[data-testid="session-port"]'
- click: '[data-testid="session-section-network"]'
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: custom
- assert_attribute:
    selector: '[data-testid="session-custom-proxy"] input[aria-label="Proxy host"]'
    name: value
    equals: proxy.example.test
- assert_attribute:
    selector: '[data-testid="session-custom-proxy"] input[aria-label="Port"]'
    name: value
    equals: '3129'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: none
- assert_not_visible: '[data-testid="session-custom-proxy"]'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: app
- assert_not_visible: '[data-testid="session-custom-proxy"]'
- click: '[data-testid="session-cancel"]'
- assert_not_visible: '[data-testid="session-editor"]'

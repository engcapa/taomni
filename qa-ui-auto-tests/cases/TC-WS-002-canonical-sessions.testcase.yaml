id: TC-WS-002
title: 'AC-03/04/08: canonical filtering and deletion cancellation preserve shared references'
description: 'AC-03/04/08: canonical filtering and deletion cancellation preserve shared references'
covers:
- F-Workspace-1
tags:
- workspace-first
- p1
modes:
- browser
fixtures:
- reset_db
- workspace_membership
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="workspace-navigator"]'
- wait_for: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="workspace-row-qa-workspace-main"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- fill:
    selector: '[data-testid="session-search"]'
    value: QA shared SSH
- assert_count:
    selector: '[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"]'
    equal: 1
- assert_text:
    selector: '[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"]'
    contains: Used by 2 workspaces
- click: '[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"] > span.truncate'
- click: '[data-testid="session-delete"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: 2 workspaces
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_count:
    selector: '[data-testid="session-tree-item"][data-session-id="qa-shared-ssh"]'
    equal: 1
- fill:
    selector: '[data-testid="session-search"]'
    value: ''
- click: '[data-testid="session-kind-filters"] button:has-text("Mail")'
- assert_count:
    selector: '[data-testid="session-tree-item"]'
    equal: 1
- assert_text:
    selector: '[data-testid="session-tree"]'
    contains: QA mailbox
- click: '[data-testid="session-kind-filters"] button:has-text("All")'
- fill:
    selector: '[data-testid="session-search"]'
    value: no-match-workspace-qa
- assert_count:
    selector: '[data-testid="session-tree-item"]'
    equal: 0
verification:
  review: pending
  requirements:
  - id: R1
    requirement: 'AC-03/04/08: canonical filtering and deletion cancellation preserve shared references'

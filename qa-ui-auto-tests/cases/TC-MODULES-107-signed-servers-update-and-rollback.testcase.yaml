verification:
  review: reviewed
  requirements:
  - id: disabled-update-and-rollback
    requirement: Update and roll back a disabled Local servers package without restarting the desktop process and retain the saved HTTP settings.
    actions: [10, 12, 24, 30, 36, 41, 44]
    checkpoints:
    - {step: 27, expectation: The earlier signed host owns the writer lease and serves the HTTP document.}
    - {step: 33, expectation: Disabling releases the writer lease and closes the HTTP listener.}
    - {step: 43, expectation: Updating while disabled activates the new version without starting the host.}
    - {step: 46, expectation: Rolling back while disabled restores the earlier version with no running host.}
    results: [27, 33, 43, 46]
  - id: enabled-update-and-failed-handshake
    requirement: Replace and roll back a running Local servers host, cleanly stop active listeners across switches, and recover when an update fails handshake.
    actions: [47, 57, 65, 66, 77, 84, 89, 99]
    checkpoints:
    - {step: 60, expectation: Re-enabled earlier host preserves port 28489 and root directory and serves HTTP again.}
    - {step: 69, expectation: Live update closes the previous HTTP listener and restarts the current host cleanly.}
    - {step: 79, expectation: Updated host reads the saved settings and serves HTTP.}
    - {step: 86, expectation: Handshake-failure version reports permission denied error.}
    - {step: 88, expectation: Failed update restores the active host cleanly with zero leaked listeners.}
    - {step: 92, expectation: Manual rollback switches the running host back to the earlier version cleanly.}
    - {step: 101, expectation: Rolled-back earlier host serves the saved HTTP document again.}
    results: [60, 69, 79, 86, 88, 92, 101]
  - id: retained-uninstall-and-reinstall
    requirement: Uninstall removes Local servers versions while retaining config data and restores live HTTP serving on reinstall.
    actions: [104, 105, 112, 119, 121, 131, 135]
    checkpoints:
    - {step: 107, expectation: Uninstall shows retained data indicator.}
    - {step: 109, expectation: All executable versions are removed while config.json locator and writer lease remain intact.}
    - {step: 113, expectation: Open Local servers panel shows missing-module unavailable notice.}
    - {step: 134, expectation: Reinstalled current host serves the retained HTTP document on the original desktop process.}
    - {step: 137, expectation: Stopping HTTP cleanly closes the listener without runtime errors.}
    results: [107, 109, 113, 134, 137]
  native:
  - check: Record desktop and host process identities, signed digests, writer lease, retained locator and HTTP state on Linux, Windows and macOS.
    method: external
    reason: Native observation verifies each phase outside the renderer.
  visual:
  - check: Confirm disabled/missing placeholders and live panel version mounts through Settings and tab transitions.
    method: automated
    reason: Explicit DOM wait assertions verify each mounted plugin version and unavailable notice.

id: TC-MODULES-107
title: Signed Local servers switches versions and preserves HTTP settings and listener safety in one session
description: >-
  Install an independently compiled Local servers prerelease, configure HTTP on 127.0.0.1:28489,
  and verify live static file serving. Download the current signed package from the loopback catalog,
  update and roll back both while disabled and while running, verify host replacement cleanly stops
  the HTTP listener without restarting Taomni, recover from a handshake-failure candidate, uninstall
  with data retained, and reinstall the current version with the HTTP configuration intact.
covers: [F-Modules-1, F-Servers-1, F-WS-3]
tags: [modules, servers, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, local_servers_http, module_signed_servers_archive, module_marketplace, release_build_required]
timeout_sec: 420
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- module_marketplace_probe: {phase: source}
- reload_window: null
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.servers_previous_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.servers_previous_signature}'}
- press: {selector: '[data-testid="module-offline-submit"]', key: Enter}
- wait_for: {selector: '[data-testid="module-offline-install"][data-phase="completed"]', timeout_sec: 45}
- press: {selector: '[data-testid="module-action-enable-servers"]:enabled', key: Enter}
- wait_for: '[data-testid="module-action-disable-servers"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="global-search-trigger"]'
- wait_for: '[data-testid="global-search-modal"]'
- fill: {selector: '[data-testid="global-search-input"]', value: Local servers}

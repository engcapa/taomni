- screenshot: html-native-network-closed.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The actual WebView resolves local assets and cannot reach parent/native IPC; default HTTP requests never reach the
      origin.
    actions:
    - 9
    - 11
    checkpoints:
    - step: 12
      expectation: Exact CSS color, PNG natural width and external local JS marker arrive through the real console bridge.
    - step: 13
      expectation: Parent DOM access is denied by the opaque origin.
    - step: 14
      expectation: No Tauri IPC object is injected into the HTML frame.
    - step: 15
      expectation: Author fetch rejects and independently logged origin/proxy request count stays zero for default policy.
    results:
    - 12
    - 13
    - 14
    - 15
  - id: R2
    requirement: Allow-once uses the selected application/custom/no-proxy route and configured proxy failure never falls back to direct.
    actions:
    - 16
    - 31
    - 38
    - 45
    - 50
    - 57
    - 63
    checkpoints:
    - step: 19
      expectation: Origin and application proxy both log actual GET with app forwarding provenance.
    - step: 41
      expectation: Origin and independent proxy both log actual GET with custom provenance.
    - step: 53
      expectation: Only the origin logs direct GET, neither proxy receives this phase.
    - step: 65
      expectation: Bound non-listening custom proxy produces handled failure and zero direct origin requests for invalid phase.
    results:
    - 19
    - 41
    - 53
    - 65
  - id: R3
    requirement: Local navigation owns browser-style history while traversal, cross-token, symlink and IPC requests are denied.
    actions:
    - 20
    - 23
    - 25
    - 74
    checkpoints:
    - step: 21
      expectation: Next page code executes through the same token.
    - step: 26
      expectation: Back then forward returns to the readable next.html address.
    - step: 75
      expectation: Parent traversal never returns outside bytes.
    - step: 76
      expectation: Layered encoded traversal never returns outside bytes.
    - step: 77
      expectation: Actual symlink/junction outside the canonical root is refused.
    - step: 78
      expectation: A different token cannot read this root.
    - step: 79
      expectation: IPC protocol fetch rejects in the real frame.
    results:
    - 21
    - 26
    - 75
    - 76
    - 77
    - 78
    - 79
  - id: R4
    requirement: Closing an HTML viewer invalidates the token and promptly cancels its active native HTTP stream.
    actions:
    - 82
    - 89
    - 91
    checkpoints:
    - step: 90
      expectation: The independent origin records the started real HTTP stream before closure.
    - step: 92
      expectation: Origin sees the peer close rather than waiting for download completion or timeout.
    - step: 93
      expectation: Viewer/protocol lifecycle leaves the app runtime healthy.
    results:
    - 90
    - 92
    - 93
  visual:
  - check: Native frame and console visible
    method: automated
    reason: Runtime console receipts plus retained screenshot; no prototype pixel fidelity claim.
  native:
  - check: Real custom protocol, proxy routing, connection cancellation and symlink/junction root boundaries
    method: automated
    reason: Packaged WebView author code plus independent loopback origin/proxy receipts. Browser stubs cannot certify these properties.
  - check: Native system-browser launch after explicit Open confirmation
    method: manual
    reason: This scope never launches external apps. TC-FILE-OPEN-010 tests parent confirmation and Cancel/no IPC instead.

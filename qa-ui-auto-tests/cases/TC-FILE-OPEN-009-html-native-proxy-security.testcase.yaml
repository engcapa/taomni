id: TC-FILE-OPEN-009
title: Native HTML resources use selected proxies, reject escapes and cancel on token close
description: AC16/17/22. Real packaged WebView loads per-case local HTML/CSS/JS/PNG and its author script requests independently logged
  loopback resources. App/custom/no-proxy listeners distinguish actual native routes; a bound non-listening proxy proves no direct fallback.
  A slow origin independently observes connection cancellation after tab closure. No direct Rust invocation, forged product state or
  parent iframe-DOM inspection substitutes for WebView requests. Windows requires a real symlink or junction; unavailable setup fails
  rather than skipping.
modes:
- native
covers:
- F-FILEOPEN-1
- F-EXPLORER-1
tags:
- p0
- file-open
- html
- sandbox
- security
- crash-regression
fixtures:
- reset_db
- html_network_test

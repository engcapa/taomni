id: TC-032
title: Tunnel manager opens, lists controls, and the new-tunnel editor
description: 'Smoke test for the SSH tunnel manager UI. Does not actually start a tunnel

  (that requires the configured SSH host) — only verifies the tab opens, the

  global controls render, and the tunnel editor opens with its required

  fields when "New SSH tunnel" is clicked.

  '
covers:
- F8.2
tags:
- tunnel
- smoke
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="app-main-menu"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-tools"]'
- click: '[data-testid="context-menu-item-tunneling"]'
- wait_for: '[data-testid="tunnel-manager"]'
- assert_visible: '[data-testid="tunnel-list"]'
- assert_visible: '[data-testid="tunnel-new"]'
- assert_visible: '[data-testid="tunnel-start-all"]'
- assert_visible: '[data-testid="tunnel-stop-all"]'
- click: '[data-testid="tunnel-new"]'
- wait_for: '[data-testid="tunnel-editor"]'
- assert_visible: input[placeholder="e.g. postgres-replica"]
- assert_visible: input[placeholder="ssh.example.com"]
- assert_visible: input[placeholder="user"]
- press: Escape
- assert_not_visible: '[data-testid="tunnel-editor"]'
- screenshot: 032-tunnel-manager.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tunnel manager opens, lists controls, and the new-tunnel editor：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 4
    - 5
    - 11
    - 16
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"app-main-menu\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"tunnel-manager\"]"}'
    - step: 7
      expectation: '{"assert_visible": "[data-testid=\"tunnel-list\"]"}'
    - step: 8
      expectation: '{"assert_visible": "[data-testid=\"tunnel-new\"]"}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"tunnel-start-all\"]"}'
    - step: 10
      expectation: '{"assert_visible": "[data-testid=\"tunnel-stop-all\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"tunnel-editor\"]"}'
    - step: 13
      expectation: '{"assert_visible": "input[placeholder=\"e.g. postgres-replica\"]"}'
    - step: 14
      expectation: '{"assert_visible": "input[placeholder=\"ssh.example.com\"]"}'
    - step: 15
      expectation: '{"assert_visible": "input[placeholder=\"user\"]"}'
    - step: 17
      expectation: '{"assert_not_visible": "[data-testid=\"tunnel-editor\"]"}'
    results:
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

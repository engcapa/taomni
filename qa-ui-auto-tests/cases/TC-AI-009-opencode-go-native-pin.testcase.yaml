id: TC-AI-009
title: Native Go thread pin survives renderer reload through real SQLite IPC
description: Native only because model writes/readback cross Tauri IPC and SQLite.
  Before execution use isolated configuration and block catalog hosts as described
  in native/opencode-go-provider.md so the bundled snapshot is deterministic.
  Renderer reload is not process restart; N-GO-03 separately tests cold restart.
  Opening tab chat creates the fresh thread after reset_db; wait for its Go
  picker after switching providers before pinning the model. No key needed,
  no messages sent.
covers: [F-AI-2.4]
tags: [ai, opencode-go, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="welcome-open-local-terminal"]'
# A local terminal spawns PowerShell through ConPTY; a loaded Windows runner
# can need more than the 10s default.
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 30
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- select_option:
    selector: '[data-testid="ai-chat-provider-select"]'
    value: opencode-go
- wait_for: '[data-testid="go-thread-model-select"]'
- select_option:
    selector: '[data-testid="go-thread-model-select"]'
    value: kimi-k3
- wait: 5
- assert_attribute:
    selector: '[data-testid="go-thread-model-select"]'
    name: value
    equals: kimi-k3
- wait: 5
- reload: {}
- wait_for: '[data-testid="status-bar"]'
- wait_for: '[data-testid="welcome-restore-last-session"]'
- click: '[data-testid="welcome-restore-last-session"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 30
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="go-thread-model-select"]'
- assert_attribute:
    selector: '[data-testid="go-thread-model-select"]'
    name: value
    equals: kimi-k3
- select_option:
    selector: '[data-testid="go-thread-model-select"]'
    value: ''
- wait: 2
- assert_attribute:
    selector: '[data-testid="go-thread-model-select"]'
    name: value
    equals: ''
verification:
  review: pending
  requirements:
  - id: R1
    requirement: Real IPC writes llm_model; renderer reload reads it back, and explicit clear is available.
    actions: [3, 5, 7, 9, 13, 16, 19, 21]
    checkpoints:
    - {step: 11, expectation: Pin is selected after IPC save.}
    - {step: 20, expectation: SQLite-backed pin is read after renderer reload.}
    - {step: 23, expectation: Explicit clear restores inherited selection.}
    results: [11, 20, 23]
  visual:
  - {check: Native select keyboard/focus behavior., method: manual, reason: DOM selection does not establish OS keyboard/focus behavior.}
  native:
  - {check: Tauri IPC and SQLite readback., method: automated, reason: The steps save the pin and read it back after renderer reload.}
  - {check: Cold restart and independent thread pins., method: manual, reason: N-GO-03 covers process restart unsupported by the selected runner verbs.}

id: TC-SHELL-B05
title: Navigator toggles preserve the primary tab and tool entry points
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b05.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.2
- F1.3
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_not_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-workspaces"]'
- assert_visible: '[data-testid="shell-recent-workspace"]'
- assert_attribute:
    selector: '[data-testid="shell-navigator"]'
    name: data-area
    equals: workspaces
- click: '[data-testid="shell-navigator-page"][data-page="tools"]'
- assert_visible: '[data-testid="sidebar-tools-panel"]'
- assert_count:
    selector: '[data-testid="welcome-panel"]'
    equal: 1
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="shell-rail-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="settings"]'
    equal: 1
- assert_count:
    selector: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"]'
    equal: 1
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 3
- screenshot: tc-shell-b05.png

id: TC-MAIL-STORAGE-03
title: Archive inaccurate MIME sizes and retry unavailable content without blocking other mail
description: Real native IMAP partial FETCH and independent SQLite/gzip MIME checks. A newest message
  returns empty chunks; the older message has an underestimated RFC822.SIZE and must still be saved completely.
  Repeated Retry preserves saved originals and explicit failure. Restoring server content lets Retry finish
  without duplicates. Browser stubs cannot prove protocol ranges or persisted bytes.
covers:
- F-MAIL-23
tags:
- mail
- p1
modes:
- native
native_platforms:
- Linux
- Windows
- macOS
fixtures:
- reset_db
- mail_server
- mail_storage
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- mail_server_archive_fault:
    folder: INBOX
    size_delta: -27
    empty_newest: true
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mail"]'
- fill:
    selector: input[aria-label="IMAP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-imap-security"]'
    value: None
- fill:
    selector: input[aria-label="IMAP port"]
    value: ${fixture.mail_imap_port}
- fill:
    selector: input[aria-label="Mail email or username"]
    value: qa@example.com
- fill:
    selector: input[aria-label="Mail password or app password token"]
    value: qa-pass
- fill:
    selector: input[aria-label="SMTP server"]
    value: ${fixture.mail_host}
- select_option:
    selector: '[data-testid="mail-smtp-security"]'
    value: None
- fill:
    selector: input[aria-label="SMTP port"]
    value: ${fixture.mail_smtp_port}
- fill:
    selector: '[data-testid="mail-storage-directory"]'
    value: ${fixture.mail_storage_a}
- select_option:
    selector: '[data-testid="mail-storage-mode"]'
    value: include
- assert_text:
    selector: '[data-testid="mail-storage-settings"]'
    contains: No cached folders. Connect and sync this account first
- assert_count:
    selector: '[data-testid="mail-storage-folders"] input'
    equal: 0
- click: '[data-testid="mail-storage-edit-folders"]'
- fill:
    selector: '[data-testid="mail-storage-folder-names"]'
    value: INBOX
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: QA complete mail
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- vault_first_run: qa-mail-storage-password
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
    timeout_sec: 60
- wait_for: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="QA complete mail"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: failed
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: 1/2
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: INBOX, UID
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: empty full email chunk at offset 0
- mail_storage_assert:
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    full:
      INBOX: 1
    headers:
      INBOX: 2
      Archive: 2
- click: '[data-testid="mail-storage-resume"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: failed
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: 0/1
- mail_storage_assert:
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    full:
      INBOX: 1
    headers:
      INBOX: 2
      Archive: 2
- screenshot: mail-archive-incomplete-content.png
- mail_server_archive_fault:
    folder: INBOX
    size_delta: -27
    empty_newest: false
- click: '[data-testid="mail-storage-resume"]'
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 60
- mail_storage_assert:
    root: ${fixture.mail_storage_a}
    expected: ${fixture.mail_expected}
    full:
      INBOX: 2
    headers:
      INBOX: 2
      Archive: 2
- click: '[data-testid="mail-archive-open"]'
- wait_for: '[data-testid="mail-archive-dialog"][open]'
- assert_count:
    selector: '[data-testid="mail-archive-row"]'
    equal: 2
- click: '[data-testid="mail-archive-row"]:first-child [data-testid="mail-archive-read"]'
- assert_text:
    selector: '[data-testid="mail-archive-preview"]'
    contains: complete.bin
    timeout_sec: 30
- screenshot: mail-archive-recovered.png
- click: '[data-testid="mail-archive-close"]'
- assert_not_visible: '[data-testid="mail-archive-dialog"]'

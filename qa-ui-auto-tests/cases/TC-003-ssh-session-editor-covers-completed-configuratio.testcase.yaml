id: TC-003
title: SSH session editor covers completed configuration sections
covers:
- F6.3
- F3.2
tags:
- legacy-imported
- p0
- session
- settings
- ssh
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- assert_visible: '[data-testid="session-proto-ssh"]'
- assert_visible: '[data-testid="session-proto-sftp"]'
- assert_visible: '[data-testid="session-proto-rdp"]'
- assert_visible: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- send_text_via_label:
    label_contains: Specify username
    checked: true
- wait: 1
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- assert_visible: '[data-testid="advanced-ssh-settings"]'
- assert_visible: '[data-testid="session-editor"] >> text="SSH-browser type"'
- fill:
    selector: input[aria-label="Execute command"]
    value: echo qa-ui-auto-session
- click: '[data-testid="session-section-terminal"]'
- assert_visible: '[data-testid="terminal-settings"]'
- assert_visible: '[data-testid="terminal-appearance-settings"]'
- assert_visible: '[data-testid="terminal-preview"]'
- click: '[data-testid="session-section-network"]'
- assert_visible: '[data-testid="network-settings"]'
- assert_visible: '[data-testid="session-editor"] >> text="Keep-alive"'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: http
- fill:
    selector: input[aria-label="Proxy host"]
    value: proxy.example.test
- fill:
    selector: input[aria-label="New forward local address"]
    value: 127.0.0.1:19090
- fill:
    selector: input[aria-label="New forward remote address"]
    value: 127.0.0.1:22
- fill:
    selector: input[aria-label="New forward description"]
    value: qa-ui-auto-forward
- click: '[data-testid="session-editor"] >> text="Add"'
- assert_visible: '[data-testid="session-editor"] input[aria-label="Forward local address"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-settings
- fill:
    selector: textarea[aria-label="Description notes"]
    value: Created by qa-ui-auto
- fill:
    selector: input[aria-label="Tags"]
    value: qa, e2e, ssh
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-settings"]'
- right_click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-settings"]'
- click_menu: Edit...
- wait_for: '[data-testid="session-editor"]'
- assert_attribute:
    selector: '[data-testid="session-host"]'
    name: value
    equals: ${cfg.ssh.host}
- assert_attribute:
    selector: '[data-testid="session-port"]'
    name: value
    equals: ${cfg.ssh.port}
- assert_attribute:
    selector: '[data-testid="session-user"]'
    name: value
    equals: ${cfg.ssh.user}
- click: '[data-testid="session-section-advanced"]'
- wait_for: '[data-testid="advanced-ssh-settings"]'
- assert_attribute:
    selector: input[aria-label="Execute command"]
    name: value
    equals: echo qa-ui-auto-session
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_attribute:
    selector: input[aria-label="Proxy host"]
    name: value
    equals: proxy.example.test
- assert_attribute:
    selector: input[aria-label="Forward local address"]
    name: value
    equals: 127.0.0.1:19090
- assert_attribute:
    selector: input[aria-label="Forward remote address"]
    name: value
    equals: 127.0.0.1:22
- assert_attribute:
    selector: input[aria-label="Forward description"]
    name: value
    equals: qa-ui-auto-forward
- fill:
    selector: input[aria-label="Forward local address"]
    value: 127.0.0.1:19091
- fill:
    selector: input[aria-label="Forward remote address"]
    value: 127.0.0.1:22
- fill:
    selector: input[aria-label="Forward description"]
    value: qa-ui-auto-forward-edited
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- assert_attribute:
    selector: textarea[aria-label="Description notes"]
    name: value
    equals: Created by qa-ui-auto
- assert_attribute:
    selector: input[aria-label="Tags"]
    name: value
    equals: qa, e2e, ssh
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-settings"]'
- right_click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-settings"]'
- click_menu: Edit...
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- assert_attribute:
    selector: input[aria-label="Forward local address"]
    name: value
    equals: 127.0.0.1:19091
- assert_attribute:
    selector: input[aria-label="Forward remote address"]
    name: value
    equals: 127.0.0.1:22
- assert_attribute:
    selector: input[aria-label="Forward description"]
    name: value
    equals: qa-ui-auto-forward-edited
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- assert_attribute:
    selector: textarea[aria-label="Description notes"]
    name: value
    equals: Created by qa-ui-auto
- assert_attribute:
    selector: input[aria-label="Tags"]
    name: value
    equals: qa, e2e, ssh
- screenshot: 003-ssh-session-settings.png

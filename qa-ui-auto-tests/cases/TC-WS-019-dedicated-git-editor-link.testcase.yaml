id: TC-WS-019
title: Dedicated Workspace Changes opens nested repository files in the original Files surface
covers:
- F-Workspace-1
- F26.2
- F25.5
tags:
- workspace-first
- git
- p1
modes:
- browser
fixtures:
- reset_db
- parity008_git
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="workspace-navigator"]'
- click: '[data-testid="workspace-navigator"] button:has-text("Import parity008")'
- wait_for: '[data-testid="workspace-header"]'
- click: '[data-testid="workspace-surface-changes"]'
- wait_for: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- assert_count:
    selector: '[data-testid="workspace-flat-repo-header"]'
    equal: 2
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 0
- fill:
    selector: '[data-testid="workspace-git-manager"] textarea'
    value: draft retained without Files
- click: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- click: '[data-testid="git-diff-open-in-editor"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-b WORKTREE
    - shared line
    - ''
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Mod+End
- type: X
- assert_visible: '[data-editor-tab-key][data-active="true"][data-dirty="true"]'
- click: '[data-testid="workspace-surface-changes"]'
- click: '[data-testid="workspace-change-row"][data-repo-root$="repo-a"][data-path="same.txt"]'
- click: '[data-testid="git-diff-open-in-editor"]'
- wait_for: '[data-editor-tab-key][data-active="true"][data-editor-tab-key$="repo-a/same.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-a WORKTREE
    - shared line
    - ''
- click: '[data-testid="workspace-surface-changes"]'
- click: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- click: '[data-testid="git-diff-open-in-editor"]'
- wait_for: '[data-editor-tab-key][data-active="true"][data-dirty="true"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-b WORKTREE
    - shared line
    - X
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 1
- press:
    key: Mod+z
    selector: '[data-testid="code-workspace-editor"] .cm-content'
- wait_for: '[data-editor-tab-key][data-active="true"]:not([data-dirty])'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-line'
    equals:
    - repo-b WORKTREE
    - shared line
    - ''
- click: '[data-testid="tab-item"][data-tab-type="code-workspace"] [data-testid="tab-close"]'
- click: '[data-testid="workspace-surface-changes"]'
- wait_for: '[data-testid="workspace-git-manager"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"]'
    equal: 0
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"workspace-git-manager"] textarea').value
      === 'draft retained without Files'
    expect_truthy: true
- assert_attribute:
    selector: '[data-testid="workspace-change-row"][data-active="true"]'
    name: data-repo-root
    equals: ${fixture.parity008_root}/repo-b
- parity008_trace:
    writes: 0
    pending: 0
    last_pair_repo: ${fixture.parity008_root}/repo-b
- screenshot: workspace-git-after-closing-files.png
- click: '[data-testid="workspace-surface-overview"]'
- click: '[data-testid="workspace-canvas"] button:has-text("Remove folder")'
- click: '[data-testid="workspace-surface-changes"]'
- wait_for: '[data-testid="workspace-git-surface"] [role="status"]'
- assert_text:
    selector: '[data-testid="workspace-git-surface"]'
    contains: No Git repository in this workspace
- assert_count:
    selector: '[data-testid="workspace-change-row"]'
    equal: 0

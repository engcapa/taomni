id: TC-048
title: SFTP cross-pane drag-and-drop transfers files between remote and local
covers:
- F7.2
- F7.3
tags:
- drag-drop
- legacy-imported
- p1
- sftp
- transfer
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 2
- click: '[data-testid="titlebar-actions-more"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-remote-path"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}
- press: Enter
- wait: 1
- click: '[data-testid="sftp-local-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-drag.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- wait: 1
- click: '[data-testid="sftp-local-pane"] >> text="qa-ui-auto-drag.txt"'
- drag_to:
    from: '[data-testid="sftp-local-pane"] tr:has-text("qa-ui-auto-drag.txt")'
    to: '[data-testid="sftp-remote-pane"] [data-testid="sftp-remote-list"]'
- wait: 2
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-drag.txt"'
- drag_to:
    from: '[data-testid="sftp-remote-pane"] tr:has-text("qa-ui-auto-drag.txt")'
    to: '[data-testid="sftp-local-pane"] [data-testid="sftp-local-list"]'
- wait: 2
- click: '[data-testid="sftp-remote-pane"] >> text="qa-ui-auto-drag.txt"'
- click: '[data-testid="sftp-remote-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- click: '[data-testid="sftp-local-pane"] >> text="qa-ui-auto-drag.txt"'
- click: '[data-testid="sftp-local-delete"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- wait: 1
- assert_not_visible: '[data-testid="sftp-browser"] tr[title$="/qa-ui-auto-drag.txt"]'
- screenshot: 048-sftp-cross-pane-drag.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: SFTP cross-pane drag-and-drop transfers files between remote and local：按步骤执行后，所有声明的可观察结果均满足。

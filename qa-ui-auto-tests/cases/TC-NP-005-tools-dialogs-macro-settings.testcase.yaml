id: TC-NP-005
title: Notepad tools open real preference, shortcut-mapper, compare, hash and print dialogs; macro recording toggles; app Settings persists Notepad prefs
description: >-
  AC-37/43/45/46 browser slice. From a new untitled document the Tools menu opens the Preferences dialog (embedding the shared Notepad
  settings panel), the Shortcut Mapper with a real bindable command list, the saved-version Compare overlay, the hash toolbox that
  computes the known SHA-256 of the typed document, and the print setup dialog; every dialog closes with Escape. Toolbar macro record
  shows the recording chip plus status chip and Stop clears them. Finally the app Settings tab shows the Notepad preferences section
  and unchecking line numbers persists to the taomni.notepad.preferences.v1 localStorage key.
modes:
- browser
covers:
- F-NOTEPAD-4
tags:
- p0
- notepad
- tools
- settings
fixtures:
- reset_db
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar-rail"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab-new-notepad"]'
- click: '[data-testid="explorer-tab-new-notepad"]'
- wait_for: '[data-testid="notepad-workbench"]'
- click: '[data-testid="viewer-editor"]'
- type: hash me
- click: '[data-testid="notepad-menu-tools"]'
- wait_for: '[data-testid="notepad-menu-item-tools.preferences"]'
- click: '[data-testid="notepad-menu-item-tools.preferences"]'
- wait_for: '[data-testid="notepad-preferences-dialog"]'
- assert_visible: '[data-testid="notepad-settings"]'
- assert_visible: '[data-testid="notepad-pref-eol"]'
- assert_visible: '[data-testid="notepad-pref-encoding"]'
- assert_visible: '[data-testid="notepad-pref-backup-mode"]'
- press: Escape
- wait_for:
    selector: '[data-testid="notepad-preferences-dialog"]'
    state: detached
- click: '[data-testid="notepad-menu-tools"]'
- wait_for: '[data-testid="notepad-menu-item-tools.shortcutMapper"]'
- click: '[data-testid="notepad-menu-item-tools.shortcutMapper"]'
- wait_for: '[data-testid="notepad-shortcut-mapper-dialog"]'
- assert_visible: '[data-testid="notepad-keymap-filter"]'
- assert_count:
    selector: '[data-testid^="notepad-keymap-bind-"]'
    min: 50
- press: Escape
- wait_for:
    selector: '[data-testid="notepad-shortcut-mapper-dialog"]'
    state: detached
- click: '[data-testid="notepad-menu-compare"]'
- wait_for: '[data-testid="notepad-menu-item-tools.compareDisk"]'
- click: '[data-testid="notepad-menu-item-tools.compareDisk"]'
- wait_for: '[data-testid="notepad-compare-dialog"]'
- assert_pattern:
    selector: '[data-testid="notepad-compare-dialog"]'
    regex: (Compare Documents|文档对比)
- click: '[data-testid="notepad-compare-dialog"] .np-modal-header button'
- wait_for:
    selector: '[data-testid="notepad-compare-dialog"]'
    state: detached
- click: '[data-testid="notepad-menu-tools"]'
- wait_for: '[data-testid="notepad-menu-item-tools.hashDialog"]'
- click: '[data-testid="notepad-menu-item-tools.hashDialog"]'
- wait_for: '[data-testid="notepad-hash-dialog"]'
- click: '[data-testid="notepad-hash-generate"]'
- wait_for: '[data-testid="notepad-hash-output"]'
- assert_attribute:
    selector: '[data-testid="notepad-hash-output"]'
    name: value
    equals: eb201af5aaf0d60629d3d2a61e466cfc0fedb517add831ecac5235e1daa963d6
- press: Escape
- wait_for:
    selector: '[data-testid="notepad-hash-dialog"]'
    state: detached
- click: '[data-testid="notepad-menu-file"]'
- wait_for: '[data-testid="notepad-menu-item-file.print"]'
- click: '[data-testid="notepad-menu-item-file.print"]'
- wait_for: '[data-testid="notepad-print-dialog"]'
- assert_visible: '[data-testid="notepad-print-confirm"]'
- press: Escape
- wait_for:
    selector: '[data-testid="notepad-print-dialog"]'
    state: detached
- assert_attribute:
    selector: '[data-testid="notepad-tool-macro-record"]'
    name: aria-pressed
    equals: 'false'
- click: '[data-testid="notepad-tool-macro-record"]'
- wait_for: '[data-testid="notepad-menubar-recording"]'
- assert_visible: '[data-testid="notepad-status-rec"]'
- assert_attribute:
    selector: '[data-testid="notepad-tool-macro-record"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="notepad-tool-macro-stop"]'
- wait_for:
    selector: '[data-testid="notepad-menubar-recording"]'
    state: detached
- assert_count:
    selector: '[data-testid="notepad-status-rec"]'
    equal: 0
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: notepad
- wait_for: '[data-testid="notepad-settings"]'
- set_check:
    selector: '[data-testid="notepad-pref-line-numbers"]'
    checked: false
- assert_localstorage:
    key: taomni.notepad.preferences.v1
    contains: '"showLineNumbers":false'
- assert_no_runtime_errors: null
- screenshot: np-005-tools-dialogs-settings.png

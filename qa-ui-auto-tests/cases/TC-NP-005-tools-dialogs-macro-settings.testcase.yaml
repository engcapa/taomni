    - step: 14
      expectation: The default EOL preference field is present.
    - step: 15
      expectation: The default encoding preference field is present.
    - step: 16
      expectation: The backup mode preference field is present.
    - step: 18
      expectation: Escape closes the dialog.
    results:
    - 13
    - 15
    - 18

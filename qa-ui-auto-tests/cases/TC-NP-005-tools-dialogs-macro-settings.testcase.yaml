  visual:
  - check: Dialog chrome, macro chips and settings section layout
    method: manual
    reason: The case asserts DOM state and persistence; visual fidelity of each dialog is reviewed manually.
  native:
  - check: Real native file dialogs, macro file integrity and native menu accelerators
    method: external
    reason: Browser mode uses renderer dialogs and localStorage; native boundary behavior belongs to native cases.

id: TC-IDE-AUDIT-008-intention-quickfix-apply-undo-native
title: Intention quick fix apply, one undo, and second-entry parity under jdtls
description: "ED-AUDIT-008 A1/A3 native gate case. Enters the in-repo single-module Maven\nsample through persisted\
  \ recents, opens the W3 quick-fix target\n(QuickFixTarget.java references StringUtils without importing it), waits\
  \ for\nthe real JDT LS diagnostic, and proves the canonical intention commit chain\nthrough the packaged app UI\
  \ from two real entry points:\n\n1. Alt+Enter at the caret inside the unresolved `StringUtils` token opens\n \
  \  the frozen intention menu. The offered list must contain the provider's\n   org.apache.commons.lang3 import\
  \ and \"Add all missing imports\", matching\n   the CI-pinned JDTLS 1.50 trace's offeredTitles.\n   Clicking \"\
  Import 'StringUtils' (org.apache.commons.lang3)\" resolves\n   through the real provider, applies the single-file\
  \ WorkspaceEdit with no\n   preview dialog (affectedFileCount == 1), and lands the import. Saving\n   proves the\
  \ disk bytes equal the provider trace's appliedSha256, and ONE\n   Ctrl+Z (workspace.undoWorkspaceEdit, the canUndo-gated\
  \ keybinding) plus a\n   save proves the disk bytes equal the original fixture hash again - one\n   undo reverts\
  \ the whole commit, and the status message names the undo\n   transaction.\n2. The gutter lightbulb (openCodeActionsForLine)\
  \ opens the same frozen\n   menu for the same diagnostic; clicking the same action produces the same\n   actual\
  \ commit (identical appliedSha256 on disk) and is again reverted by\n   one Ctrl+Z back to the original fixture\
  \ hash. Two real UI entries thus\n   produce the same commit and one history entry each.\n\nHighest claim on green:\
  \ L2 provider-backed (Linux), packaged app UI over a\nreal jdtls process. Provider facts come from\nsrc/components/editor/workspace/__fixtures__/jdtls/traces/maven-single.trace.json\n\
  (caseId import-quick-fix): actionTitle, offeredTitles, appliedSha256,\noriginalSha256, revertedRestoresOriginalHash.\
  \ Resolve-null, malformed,\ncommand-failure recovery, preview-cancel, and stale results are simulated at\nthe\
  \ regression layer (mounted CodeWorkspaceTab tests + adapter unit tests)\nper the spec, which records that IDEA\
  \ cannot precisely reproduce them.\n"
covers:
- F25.5
tags:
- code-workspace
- ide-editor
- code-actions
- provider-fixture
- native-gate
- p1
modes:
- native

    contains: import org.apache.commons.lang3.StringUtils;
    timeout_sec: 30
- press: Control+s
- assert_file_sha256:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/QuickFixTarget.java
    equals: a1a321c4326cdfef25e6aec6ccce42ec1f06395f10ba44154a0f424b5105dec2
    timeout_sec: 30
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+z
- assert_text:
    selector: '[data-testid="status-bar-message"]'
    contains: Undid Import 'StringUtils'
    timeout_sec: 10
- eval_readonly:
    expression: '!document.querySelector(''.cm-content'').innerText.includes(''import org.apache.commons.lang3'')'
    expect_truthy: true
- press: Control+s
- assert_file_sha256:
    path: ${fixture.maven_single_root}/src/main/java/com/example/single/QuickFixTarget.java
    equals: f2de5c8ab98b58cf18ff998ebc47d19c127bb6f4290550d2827a40a37552e70a

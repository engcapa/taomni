verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: "A1.1 DEC-02/D1：录制已被占用的 chord 时，捕获控件内出现常驻就地冲突区，语义为 Already assigned to:，逐条指名占用动作（标题+id）。此处录到的是小写 Ctrl+f，而 editor.find 的存储绑定显示为 Ctrl+F——能指名即证明冲突按物理 stroke 判定而非显示字符串（D1 大小写分叉已消除）。警告只存在于录制器内，不会在动作行伪造已提交冲突。"
    actions: [48]
    checkpoints:
    - step: 49
      expectation: "{\"assert_visible\": \"[data-testid=\\\"keymap-capture-conflicts\\\"]\"}"
    - step: 50
      expectation: "{\"assert_text\": {\"selector\": \"[data-testid=\\\"keymap-capture-conflicts\\\"]\", \"contains\": \"Already assigned to:\"}}"
    - step: 51
      expectation: "{\"assert_visible\": \"[data-testid=\\\"keymap-capture-conflict-editor.find\\\"]\"}"
    - step: 52
      expectation: "{\"assert_text\": {\"selector\": \"[data-testid=\\\"keymap-capture-conflict-editor.find\\\"]\", \"contains\": \"editor.find\"}}"
    - step: 54
      expectation: "{\"assert_count\": {\"selector\": \"[data-testid=\\\"workspace-keymap-settings-dialog\\\"] [aria-label=\\\"conflict\\\"]\", \"equal\": 0}}"
    results: [49, 50, 52, 54]
  - id: R2
    requirement: "A1.2 DEC-02/03：冲突不阻断录入但可取消；取消后冲突区清空、草稿恢复、Apply 仍禁用，关闭对话框后 Ctrl+F 仍执行原占用者 Find。"
    actions: [55]
    checkpoints:
    - step: 56
      expectation: "{\"assert_not_visible\": \"[data-testid=\\\"keymap-capture-conflicts\\\"]\"}"
    - step: 57
      expectation: "{\"assert_text\": {\"selector\": \"[data-testid=\\\"keymap-replace-editor.replace-0\\\"]\", \"contains\": \"Alt+Shift+R\"}}"
    - step: 58
      expectation: "{\"assert_disabled\": \"[data-testid=\\\"keymap-settings-apply\\\"]\"}"
    - step: 63
      expectation: "{\"assert_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"] input[name=\\\"search\\\"]\"}"
    - step: 64
      expectation: "{\"assert_not_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"] input[name=\\\"replace\\\"]\"}"
    results: [56, 58, 63, 64]
  - id: R3
    requirement: "A1.3 DEC-02/04：冲突仍不阻断（OK 可用、Enter 可确认）；确认并 Apply 后原占用者 editor.find 失去该 chord 并保留其无关的 Meta+F，全局不再有任何已提交冲突徽标。"
    actions: [79, 80, 28, 29]
    checkpoints:
    - step: 80
      expectation: "{\"assert_enabled\": \"[data-testid=\\\"keymap-recorder-ok\\\"]\"}"
    - step: 84
      expectation: "{\"wait_for\": \"[data-testid=\\\"keymap-row-editor.find\\\"]\"}"
    - step: 85
      expectation: "{\"assert_text\": {\"selector\": \"[data-testid=\\\"keymap-row-editor.find\\\"]\", \"contains\": \"Meta+F\"}}"
    - step: 86
      expectation: "{\"assert_count\": {\"selector\": \"[data-testid=\\\"workspace-keymap-settings-dialog\\\"] [aria-label=\\\"conflict\\\"]\", \"equal\": 0}}"
    results: [86, 85]
  - id: R4
    requirement: "A1.3 S4b：确认并 Apply 后真实按键 Ctrl+F 执行目标动作 Replace（可用候选恰好 1），不再由 Find 触发。"
    actions: [78]
    checkpoints:
    - step: 91
      expectation: "{\"assert_visible\": \"[data-testid=\\\"code-workspace-editor-search\\\"] input[name=\\\"replace\\\"]\"}"
    results: [91]
  visual:
  - check: "捕获内冲突区（⚠ + 'Already assigned to:' + 逐条动作标题与 id）在 720px 对话框内完整可见，列表可滚动而非截断；冲突徽标与 swatch 不互相遮挡；底部 OK/Cancel/Apply 不被冲突区挤出。"

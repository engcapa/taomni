id: TC-IDE-PARITY-004-02
title: 'Keymap conflict: inline warning names every holder, cancel is zero-change, confirm reassigns'
description: 'ED-PARITY-004 A1.1/A1.2/A1.3 browser case — the S4a/S4b sequence.

  Records a chord that is already taken, proves the recorder shows an INLINE live
  warning naming every holder (never a modal), proves cancelling that capture
  changes nothing and Ctrl+F still runs Find, then confirms the same chord and
  applies it so the chord has exactly one owner and the previous holder visibly
  loses it.

  Correction to the P1 prose: this platform''s editor.find carries a SECOND base
  binding (Meta+F), so after Ctrl+F is reassigned the row keeps Meta+F instead of
  becoming literally empty. DEC-04 revokes the contested STROKE, not the whole
  binding set, so the assertions check that Ctrl+F is gone from editor.find and
  that its unrelated Meta+F survives. A1.3''s actual target — exactly one available
  candidate for the chord — is asserted by the live dispatch result.

  Mode: browser; conflict identity, both exits and dispatch routing are all
  renderer-observable.

  '
covers:
- F25.5
tags:
- code-workspace
- keymap
- ed-parity-004
- p1

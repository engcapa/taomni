id: TC-FILE-OPEN-014
title: Markdown dropdown without toolbar scrollbars, independent PDF and portable Word downloads
description: Production Explorer and export UI. Desktop and narrow layout, keyboard navigation/focus, default settings, real printer-independent
  searchable PDF, PNG long image and Word downloads. Independent host parsing checks exact Chinese/English, accents, emoji, final-page
  text and original red/blue raster pixels in the 300DPI A4 PDF, the 300 DPI whole-document PNG (not 96 DPI 1:1 pixels), three
  vector diagrams with measured glyph-pinned label positions and 600DPI Word fallback; original raster stays 1600x800. Browser
  evidence is not native chooser evidence.
modes:
- browser
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-export-quality
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="quality.md"]'
- wait_for: '[data-testid="markdown-editor"]'
- click: '[data-testid="markdown-export"]'
- wait_for: '[data-testid="markdown-export-menu"]'
- assert_element_geometry:
    selector: '[data-testid="markdown-export-menu"]'
    min_width: 250
    min_height: 220
    viewport_margin: 7
- eval_readonly:
    expression: '!document.querySelector(''.fv-md-export-menu'').closest(''.fv-md-toolbar'') && document.querySelector(''.fv-md-export-menu'').getBoundingClientRect().top
      >= document.querySelector(''.fv-md-export-control>button'').getBoundingClientRect().bottom'
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('.fv-md-toolbar').scrollHeight <= document.querySelector('.fv-md-toolbar').clientHeight
      + 1 && document.querySelector('.fv-md-toolbar').scrollWidth <= document.querySelector('.fv-md-toolbar').clientWidth + 1
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('.fv-md-format').scrollHeight <= document.querySelector('.fv-md-format').clientHeight +
      1 && document.querySelector('.fv-md-format').scrollWidth <= document.querySelector('.fv-md-format').clientWidth + 1
    expect_truthy: true
- press:
    selector: '[data-testid="markdown-export-html"]'
    key: End
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'markdown-export-print'
    expect_truthy: true
- press:
    selector: '[data-testid="markdown-export-print"]'
    key: Escape
- assert_not_visible: '[data-testid="markdown-export-menu"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'markdown-export'
    expect_truthy: true
- set_viewport:
    width: 820
    height: 700
- eval_readonly:
    expression: document.querySelector('.fv-md-toolbar').scrollHeight <= document.querySelector('.fv-md-toolbar').clientHeight
      + 1 && document.querySelector('.fv-md-toolbar').scrollWidth <= document.querySelector('.fv-md-toolbar').clientWidth + 1
    expect_truthy: true
- eval_readonly:
    expression: document.querySelector('.fv-md-format').scrollHeight <= document.querySelector('.fv-md-format').clientHeight +
      1 && document.querySelector('.fv-md-format').scrollWidth <= document.querySelector('.fv-md-format').clientWidth + 1
    expect_truthy: true
- click: '[data-testid="markdown-export"]'
- assert_element_geometry:
    selector: '[data-testid="markdown-export-menu"]'
    min_width: 250
    min_height: 220
    viewport_margin: 7
- screenshot: export-menu-narrow.png
- press: Escape
- set_viewport:
    width: 1366
    height: 900
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-pdf"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- eval_readonly:
    expression: '!document.querySelector(''.fv-md-setting-check input'').checked'
    expect_truthy: true
- click: '[data-testid="markdown-export-fileHeader"]'
- assert_download:
    trigger: '[data-testid="markdown-export-confirm"]'
    filename: quality.pdf
    artifact: pdf
- wait_for: '[data-testid="markdown-export-status"][data-export-state="saved"]'
- click: '[data-testid="markdown-export"]'
- click: '[data-testid="markdown-export-docx"]'
- wait_for: '[data-testid="markdown-export-settings"]'
- eval_readonly:
    expression: '!document.querySelector(''.fv-md-setting-check input'').checked'
    expect_truthy: true
- click: '[data-testid="markdown-export-fileHeader"]'
- assert_download:
    trigger: '[data-testid="markdown-export-confirm"]'
    filename: quality.docx
    artifact: docx
- wait_for: '[data-testid="markdown-export-status"][data-export-state="saved"]'
- click: '[data-testid="markdown-export"]'
- assert_download:
    trigger: '[data-testid="markdown-export-png"]'
    filename: quality.png
    artifact: png-doc
- wait_for: '[data-testid="markdown-export-status"][data-export-state="saved"]'
- assert_file_open_bytes:
    path: ${fixture.markdown_quality_source}
    sha256: ${fixture.markdown_quality_sha}
- assert_no_runtime_errors: null
- screenshot: export-independent-pdf-word.png
- assert_visible: '[data-testid="markdown-export-open-tao"]'
- assert_visible: '[data-testid="markdown-export-show-system"]'
- eval_readonly:
    expression: document.querySelector(".fv-md-export-notice button").dataset.testid === "markdown-export-open-tao"
    expect_truthy: true
- screenshot: export-tao-primary-actions.png
covers:
- F-FILEOPEN-1
- F-EXPLORER-1

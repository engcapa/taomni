id: TC-IDE-C2-09-live-template-settings-retained
title: Live template settings and language isolation retained
description: 'Browser verification for Java postfix template expansion (`list.for` -> Tab)

  and suppression of live template autocomplete popups within comments.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c2
- completion
- live-template
- settings
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: App.java
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- type: list.for
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 10
- press: Tab
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: for (
- press: Control+z
- press: Enter
- type: // sout
- wait: 0.5
- eval_readonly:
    expression: document.querySelector(".cm-tooltip-autocomplete") === null
    expect_truthy: true
- screenshot: tc-ide-c2-09-settings-retained.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Live template settings and language isolation retained：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 10
    - 12
    - 13
    - 15
    - 16
    - 18
    - 20
    - 21
    - 22
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor\"] .cm-content[data-language=\"java\"]"}'
    - step: 17
      expectation: '{"wait_for": {"selector": ".cm-tooltip-autocomplete li", "timeout_sec": 10}}'
    - step: 19
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content", "contains":
        "for ("}}'
    - step: 24
      expectation: '{"eval_readonly": {"expression": "document.querySelector(\".cm-tooltip-autocomplete\") === null",
        "expect_truthy": true}}'
    results:
    - 24
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

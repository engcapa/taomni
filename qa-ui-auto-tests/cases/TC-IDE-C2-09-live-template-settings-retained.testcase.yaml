id: TC-IDE-C2-09-live-template-settings-retained
title: "Live template settings and language isolation retained"
description: |
  Browser verification for Java postfix template expansion (`list.for` -> Tab)
  and suppression of live template autocomplete popups within comments.
covers: [F25.5]
tags: [code-workspace, ide-c2, completion, live-template, settings, browser-gate, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 180
steps:
  - open: "${cfg.app.base_url}"
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="side-tab-tools"]'
  - wait_for: '[data-testid="sidebar-tools-panel"]'
  - click: '[data-testid="sidebar-tool-code-workspace"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - click: '[data-testid="code-workspace-tree-add-folder"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - click: '[data-testid="text-input-dialog-confirm"]'
  - click: '[data-testid="code-workspace-tree-new-file"]'
  - wait_for: '[data-testid="text-input-dialog"]'
  - fill:
      selector: '[data-testid="text-input-dialog"] input'
      value: "App.java"
  - click: '[data-testid="text-input-dialog-confirm"]'
  - wait_for: '[data-testid="code-workspace-editor"] .cm-content[data-language="java"]'
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - type: "list.for"
  - wait_for:
      selector: '.cm-tooltip-autocomplete li'
      timeout_sec: 10
  - press: "Tab"
  - assert_text:
      selector: '[data-testid="code-workspace-editor"] .cm-content'
      contains: "for ("
  - press: "Control+z"
  - press: "Enter"
  - type: "// sout"
  - wait: 0.5
  - eval_readonly:
      expression: 'document.querySelector(".cm-tooltip-autocomplete") === null'
      expect_truthy: true
  - screenshot: tc-ide-c2-09-settings-retained.png

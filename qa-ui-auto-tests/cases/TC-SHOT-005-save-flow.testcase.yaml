id: TC-SHOT-005
title: Save cancellation preserves annotations and keyboard save exports to the chosen path
description: Browser in-app path dialog and stub dispatch only; no host-file write or native save-dialog claim.
covers: [F27.1]
tags: [screenshot, save, shortcut, p2]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position: {x: 100, y: 100}
    to_position: {x: 500, y: 400}
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 160, y: 160}
    to_position: {x: 300, y: 260}
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- click: '[data-testid="screenshot-save"]'
- wait_for: '[data-testid="text-input-dialog"]'
- assert_attribute:
    selector: '[data-testid="text-input-dialog-input"]'
    name: value
    matches: 'Taomni-.*\.png'
- click: '[data-testid="text-input-dialog-cancel"]'
- assert_not_visible: '[data-testid="text-input-dialog"]'
- assert_attribute:
    selector: '[data-testid="screenshot-overlay"]'
    name: data-phase
    equals: annotate
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '1'
- assert_text_equals:
    selector: '[data-testid="screenshot-size-hint"]'
    equals: '160 × 120'
- eval_readonly:
    expression: >-
      !JSON.stringify(window.__taomniStubScreenshotCalls).includes('"cmd":"screenshot_save_image"')
- press:
    key: Mod+s
    selector: '[data-testid="screenshot-save"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-shot.png
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-overlay"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-3).cmd === "screenshot_save_data_url" && window.__taomniStubScreenshotCalls.at(-3).args.width === 160 && window.__taomniStubScreenshotCalls.at(-3).args.height === 120
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-2).cmd === "screenshot_save_image" && window.__taomniStubScreenshotCalls.at(-2).args.dest === "qa-ui-auto-shot.png" && window.__taomniStubScreenshotCalls.at(-2).args.path === window.__taomniStubScreenshotCalls.at(-3).args.path
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_save_image"').length === 2 && window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_close_overlay"
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Canceling the save-path dialog does not save or close capture and preserves the selected crop and its annotation.
    actions: [1, 2, 4, 6, 7, 9, 12]
    checkpoints:
    - {step: 11, expectation: The save dialog offers a PNG destination.}
    - {step: 13, expectation: Cancel dismisses the path dialog.}
    - {step: 14, expectation: Capture remains in annotate phase.}
    - {step: 15, expectation: The rectangle remains committed.}
    - {step: 16, expectation: Crop dimensions are unchanged.}
    - {step: 17, expectation: Cancel sent no save-image request.}
    results: [13, 14, 15, 16, 17]
  - id: R2
    requirement: Ctrl+S or Cmd+S reopens save, sends the selected PNG artifact and exact chosen destination once, and closes capture.
    actions: [18, 20, 21]
    checkpoints:
    - {step: 19, expectation: Keyboard save opens the in-app path dialog.}
    - {step: 22, expectation: The main window returns after confirmation.}
    - {step: 23, expectation: The overlay is unmounted.}
    - {step: 24, expectation: The canvas export decodes to the chosen 160x120 crop.}
    - {step: 25, expectation: Save receives that exported path and the exact requested filename.}
    - {step: 26, expectation: Exactly one save-image request was followed by close.}
    results: [19, 22, 23, 24, 25, 26]
  visual:
  - check: Save cancel and confirmation produce the expected dialog and capture states.
    method: automated
    reason: Assertions cover renderer state and decoded export size, not native dialog appearance.
  native:
  - check: Host PNG bytes, native path dialog and write failure handling.
    method: external
    reason: Browser save_image is a logged stub; disk and OS-dialog evidence must be collected natively.

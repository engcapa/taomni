id: TC-SHOT-005
title: Save flow prompts for a path and saves the annotated image
covers:
- F27.1
tags:
- screenshot
- save
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- drag_to:
    from: '[data-testid="screenshot-base-image"]'
    to: '[data-testid="screenshot-base-image"]'
    from_position:
      x: 60
      y: 60
    to_position:
      x: 260
      y: 220
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-save"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: qa-ui-auto-shot.png
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="screenshot-toast"]'
- eval_readonly:
    expression: JSON.stringify(window.__tauriStubScreenshotCalls || []).includes("qa-ui-auto-shot.png")

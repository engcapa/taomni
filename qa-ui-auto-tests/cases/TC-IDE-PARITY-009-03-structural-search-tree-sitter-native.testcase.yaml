  - id: ED-PARITY-009-N2
    requirement: 无效模板为类型化错误；大工作区 In Project 运行中 Esc 取消，后端 active requests 回到 0；源文件 SHA-256 不变、编辑器不 dirty。
    actions:
    - 38
    - 39
    - 44
    - 45
    - 48
    checkpoints:
    - step: 40
      expectation: '{wait_for: ''[data-testid="structural-search-error"]''}'
    - step: 41
      expectation: '{assert_text: {contains: ''not a single Java statement, expression or class member'', selector: ''[data-testid="structural-search-error"]''}}'
    - step: 46
      expectation: '{wait_for: ''[data-testid="structural-search-running"]''}'
    - step: 49
      expectation: '{assert_not_visible: ''[data-testid="structural-search-dialog"]''}'
    - step: 50
      expectation: '{wait_for: {selector: ''[data-testid="structural-search-panel"][data-phase="cancelled"][data-active-requests="0"]'',
        timeout_sec: 60}}'
    - step: 51
      expectation: '{assert_visible: ''[data-testid="structural-search-cancelled"]''}'
    - step: 53
      expectation: '{assert_count: {equal: 0, selector: ''[data-editor-tab-key][data-dirty="true"]''}}'
    - step: 54
      expectation: '{assert_file_sha256: {equals: ''${fixture.parity009_target_sha256}'', path: ''${fixture.parity009_target}''}}'
    results:

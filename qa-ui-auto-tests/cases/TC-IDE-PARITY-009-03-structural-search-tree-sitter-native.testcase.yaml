        .cm-activeLine''}}'
    - step: 29
      expectation: '{wait_for: {selector: ''[data-testid="structural-search-panel"][data-phase="results"]'', timeout_sec:
        60}}'
    - step: 30
      expectation: '{assert_items: {attribute: data-line, equals: [''4''], selector: ''[data-testid="structural-search-match"]''}}'
    - step: 34
      expectation: '{wait_for: {selector: ''[data-testid="structural-search-empty"]'', timeout_sec: 60}}'
    - step: 35
      expectation: '{assert_count: {equal: 0, selector: ''[data-testid="structural-search-unavailable"]''}}'

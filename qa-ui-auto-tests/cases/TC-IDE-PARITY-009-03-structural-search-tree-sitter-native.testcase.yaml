    - 53
    - 54
  visual:
  - check: 截图中标题、n/N 导航、两侧标签/结果树与高亮无截断遮挡；与 IDEA 参照的视觉差异单独记录于 comparison record。
    method: manual
    reason: 像素与视觉 parity 不能由 DOM 断言替代。
  native:
  - check: 当前平台 Windows/WebView2 真实 Tauri IPC 与主机文件 SHA-256；Linux/macOS 未在本机执行。
    method: automated
    reason: assert_file_sha256 由 harness 在主机侧独立读取字节。

id: TC-SHELL-B07
title: Lane selection and empty lane retain the previous real surface
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b07.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- select_option:
    selector: '[data-testid="shell-lane-select"]'
    value: communicate
- assert_visible: '[data-testid="shell-lane-empty"]'
- assert_attribute:
    selector: '[data-testid="shell-work-area"]'
    name: inert
    equals: ''
- click: '[data-testid="shell-lane-empty-home"]'
- assert_visible: '[data-testid="welcome-panel"]'
- select_option:
    selector: '[data-testid="shell-lane-select"]'
    value: connect
- assert_visible: '[data-testid="terminal-pane"]:visible'
- assert_attribute:
    selector: '[data-testid="shell-lane-select"]'
    name: data-lane
    equals: connect
- screenshot: tc-shell-b07.png
verification:
  review: reviewed
  requirements:

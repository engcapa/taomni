id: TC-DB-EXEC-003-dangerous-confirm-browser
title: DROP asks for confirmation; Cancel runs nothing and Execute runs the statement
description: |
  DB-EXEC-003 V4. In the offline MySQL scaffold, running DROP TABLE opens the
  danger confirmation listing the statement. Cancel leaves no Log tab (nothing
  ran); running again and choosing Execute runs it (it fails because browser
  preview has no database), producing one FAILED log entry.
covers:
- F-DB-1
tags:
- database
- sql
- dangerous-statement
- db-parity
modes:
- browser
fixtures:
- reset_db
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- shell_navigate: sessions
- wait_for: '[data-testid="sidebar"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: db-host.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '3306'
- fill:
    selector: input[aria-label="Database username"]
    value: qa_user
- fill:
    selector: input[aria-label="Database name"]
    value: qa_db
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-db-exec-danger
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-db-exec-danger"]'
- open_session:
    name: qa-db-exec-danger
    double_click: true
- wait_for: '[data-testid="db-connection-error-banner"]'
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: DROP TABLE qa_db_exec003_t;
- click: '[data-testid="db-run-all"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: '[DROP] DROP TABLE qa_db_exec003_t'
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- assert_count:
    selector: '[data-testid="result-log-tab"]'
    equal: 0
- click: '[data-testid="db-run-all"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="db-execution-log"]'
- assert_count:
    selector: '[data-testid="db-execution-log-entry"][data-status="failed"]'
    equal: 1
- screenshot: db-exec-003-dangerous-confirm-browser.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Navigate from Home to Sessions, save and open the fixture MySQL bookmark, and reach the
      declared offline connection banner.
    actions:
    - 1
    - 2
    - 5
    - 7
    - 9
    - 10
    - 11
    - 12
    - 13
    - 15
    - 16
    - 18
    checkpoints:
    - step: 3
      expectation: the Sessions Navigator is visible.
    - step: 4
      expectation: the New session control is visible.
    - step: 6
      expectation: the session editor is visible.
    - step: 8
      expectation: the MySQL settings is visible.
    - step: 14
      expectation: the bookmark editor is visible.
    - step: 17
      expectation: The fixture session or saved query is visible at [data-testid="session-tree-item"][data-session-name="qa-db-exec-danger"].
    - step: 19
      expectation: the expected offline connection banner is visible.
    results:
    - 3
    - 4
    - 6
    - 8
    - 14
    - 17
    - 19
  - id: R2
    requirement: Cancel DROP with no execution log, then confirm the same DROP and report exactly one
      failed execution in the offline preview.
    actions:
    - 20
    - 21
    - 22
    - 23
    - 26
    - 29
    - 31
    checkpoints:
    - step: 24
      expectation: the dangerous SQL confirmation is visible.
    - step: 25
      expectation: '[data-testid="confirm-dialog-message"] contains the required text ''[DROP] DROP TABLE
        qa_db_exec003_t''.'
    - step: 27
      expectation: the dangerous SQL confirmation is hidden.
    - step: 28
      expectation: Exactly 0 elements match [data-testid="result-log-tab"].
    - step: 30
      expectation: the dangerous SQL confirmation is visible.
    - step: 32
      expectation: the execution log is visible.
    - step: 33
      expectation: Exactly 1 elements match [data-testid="db-execution-log-entry"][data-status="failed"].
    results:
    - 24
    - 25
    - 27
    - 28
    - 30
    - 32
    - 33
  visual:
  - check: Inspect SQL toolbar, result log or Query Library inside the current Shell for clipping and
      readable controls.
    method: manual
    reason: DOM assertions need a separate screenshot verdict.
  native:
  - check: Real database connection, execution and transaction effects
    method: not-applicable
    reason: This browser case explicitly uses offline IPC preview; paired native DB cases prove real SQL
      and transaction effects.

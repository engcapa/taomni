    - 43
    - 44
    - 45
    - 50
  - id: R3
    requirement: Distraction-Free toggles np-mode-focus with a floating exit pill; CharPanel inserts once; Open With hides TaOffice for non-office files; empty-selection sort prompts; ReDoS errors surface verbatim.
    actions:

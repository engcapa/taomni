      expectation: Save As remains enabled in read-only mode.
    - step: 44
      expectation: Save a Copy remains enabled in read-only mode.
    - step: 45
      expectation: Print remains enabled in read-only mode.
    - step: 50
      expectation: Clicking the status chip clears read-only state.
    results:

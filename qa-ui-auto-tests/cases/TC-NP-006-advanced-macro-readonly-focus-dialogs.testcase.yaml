id: TC-NP-006
title: Notepad macro text playback, read-only Save As/exit, focus mode pill, CharPanel single insert, Open With scope, whole-doc confirm and ReDoS error visibility
description: >-
  Regression coverage for P0/P1 workbench behaviors: recording typed text plus Edit commands into a saved macro and replaying
  the saved macro by its own steps; toggling editor read-only while keeping Save As / Save a Copy / Print enabled and exiting via
  the clickable status chip; entering and exiting Distraction-Free focus mode; verifying CharPanel single-click inserts once;
  confirming Open With hides TaOffice for non-office documents; prompting before whole-document sort; and displaying ReDoS regex
  rejection details verbatim before closing Find on Escape.
modes:
- browser
covers:
- F-NOTEPAD-1
- F-NOTEPAD-2
- F-NOTEPAD-3
- F-NOTEPAD-4
tags:
- p0
- notepad
- macro
- readonly
- search
- dialogs
fixtures:
- reset_db
timeout_sec: 180
steps:

      expectation: Replaying the saved EchoUpper macro appends typed text and uppercases the seeded document to SEEDAB.
    results:
    - 35
  - id: R2
    requirement: Read-only toggle preserves Save As, Save a Copy and Print in the File menu while clicking the status bar chip exits read-only.
    actions:
    - 36
    - 38
    - 40
    - 46
    - 48
    checkpoints:

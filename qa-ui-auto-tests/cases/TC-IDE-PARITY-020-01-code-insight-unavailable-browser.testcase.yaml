id: TC-IDE-PARITY-020-01
title: Code insight answers with a caret popup when the language service is unavailable
description: 'ED-PARITY-020 A2/A3 browser case (no JDT LS in browser preview): member completion no longer offers buffer words, and Quick Doc, Parameter Info and Alt+Enter each show a caret popup naming the unavailable service. Escape closes it without moving focus or the caret; Configure opens Language Servers settings.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-020
- completion
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-tree-new"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: Demo020.java
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"][data-editor-tab-key$="Demo020.java"]'
    timeout_sec: 15
- click: '[data-testid="code-workspace-editor"] .cm-content'
- type: class Demo020 { String calculator; void m() { calculator
- wait: 0.5
- type: .le
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    contains: Member completion unavailable
- assert_count:
    selector: .cm-tooltip-autocomplete
    equal: 0
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    state: detached
    timeout_sec: 5
- &id001
  eval_readonly:
    expression: document.activeElement?.classList.contains('cm-content') === true
    expect_truthy: true
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: 1:60
- press: Control+q
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    contains: Documentation unavailable
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: 1:60
- press: Control+p
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    contains: Parameter info unavailable
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: 1:60
- press: Alt+Enter
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    contains: Context actions unavailable
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: 1:60
- press: Control+q
- wait_for:
    selector: '[data-testid="code-workspace-code-insight-notice"]'
    timeout_sec: 10
- click: '[data-testid="code-workspace-code-insight-configure"]'
- wait_for:
    selector: '[data-testid="language-servers-settings"]'
    timeout_sec: 15

id: TC-MODULES-029
title: Server upgrade preview retains the three distinct owners and explicit pending result
description: Uses an explicit browser model of HTTP/RDP/VNC legacy server candidates. Settings must render servers, rdp-server
  and vnc-server separately and preserve the model through reopen/reload and repeated pending actions. Native 028 checks actual
  SQLite/IPC; this browser model does not establish data migration.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- browser
fixtures:
- reset_db
- module_upgrade
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 3
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: servers
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: rdp-server
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(3)'
    equals: vnc-server
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: servers
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: rdp-server
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(3)'
    equals: vnc-server
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: Browser preview
- reload_window: null
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'

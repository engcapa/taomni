id: TC-SHOT-N28
title: Native screenshot startup isolates the main-window marker and has no sampled flash with gaps bounded to 100ms
description: "Pixel evidence for the optimized startup pipeline (I1 with P1-2 early window, P1-3 overlapped Linux capture and P1-6 capture exclusion, plus P0-1b/P0-1 first frame). Step 3 paints a full-window magenta marker into the main window. A direct capture with the window visible must contain at least 400 sampled marker pixels; the marker is checked every third row and column, not at every pixel and not in detached or unmarked Taomni windows. Where capture exclusion is supported, it must remove this marker from a direct capture and release must bring it back. Five production opens must store base images with zero sampled marker pixels and restore the main window on close. Step 4 uses a separately owned, finite-lifetime sampler process over the non-uniform QA fixture (intentionally exempt from hiding). Fresh snapshots use independent GDI on Windows, X11 on all three X11 Linux profiles, CoreGraphics on macOS and the owned Mutter broker's GNOME Shell.Screenshot stage pixels on Wayland, without another portal session, chooser or flash. It targets 50ms intervals and requires the measured conservative maximum capture gap, including show/end boundaries and capture-time uncertainty, to be at most 100ms. No sampled post-show frame may be uniform. Missing pixels, capture errors, clock jumps, slow sampling or helper shutdown failure fail the case; no platform gets a green skip. Flashes shorter than the measured sampling resolution are not ruled out."
covers: [F27.1]
tags: [screenshot, native, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario: {scenario: startup-isolation}
- native_screenshot_scenario: {scenario: startup-flash}
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: startup-isolation
    requirement: The marked main window does not appear at sampled marker locations in the captured base image on the platform's chosen startup path; exclusion is verified and released where supported, and every session restores the main window. This check does not establish absence of unmarked detached windows or every individual pixel.
    actions: [1, 2]
    checkpoints:
    - {step: 3, expectation: "controlMarkerPixels is at least 400 sampled pixels; exclusion is unsupported or passed (main excluded, 0 marker pixels while excluded, at least 400 after release); all five opens record markerPixels 0, the isolation path, mainHiddenDuringSession true, closed true and mainRestored true."}
    results: [3]
  - id: startup-first-frame
    requirement: From show through the observation end, independent fresh display pixels contain no sampled uniform flash, with no conservative capture gap above 100ms. This bound is evidence resolution, not a claim that sub-100ms flashes cannot occur.
    actions: [1, 2]
    checkpoints:
    - {step: 4, expectation: "On Windows, macOS and each Linux profile (ubuntu-24.04-xvfb, ubuntu-22.04-x11, ubuntu-22.04-vnc, ubuntu-26.04-wayland): evidence.sampled true, desktopVaried true before open, at least 5 samplesAfterShow, flashFrames empty, samplingCoverage true, monotonic true, clockStable true and maxGapMs at most 100. Trace retains actual capture-time brackets, native capture durations, conservative inter-capture gaps and first/last boundary gaps. Wayland transport is owned GNOME Shell stage capture without a portal. Helper logs and incremental samples survive failure, and the owned sampler exits or is killed/reaped on every error; capture or shutdown failures fail rather than skip."}
    results: [4]
  visual:
  - {check: Base image and sampled frames, method: automated, reason: "Main-window marker pixels are counted every third row/column in the real base image and direct control captures. Flash detection uses 48x27 actual display pixel grids with capture brackets and a measured gap bound, not DOM readiness or cached frames. The control capture, first base image, raw sampling JSONL and helper log are retained; shorter flashes and unmarked windows remain outside this proof."}
  native:
  - {check: Real capture APIs and window isolation, method: automated, reason: "The isolated QA app calls the real production exclusion/open commands. A separate killable process independently reads fresh OS snapshots, using owned GNOME Shell stage capture rather than competing product PipeWire/portal sessions on Wayland. Browser stubs, WebView screenshots and handshake timestamps cannot establish this pixel evidence."}

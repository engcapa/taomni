id: TC-RDPS-NAT-05-microphone
title: RDP server microphone - a tone sent through AUDIO_INPUT is recordable on this computer
description: |
  V-09 (docs-feature/rdp-server-parity-design.md §4.4, AC-13). The server
  runs with microphone redirection on (the default) and offers the
  AUDIO_INPUT dynamic channel because a host input exists:
  rdp_audio_required provides the PipeWire graph on Linux, and the workflow
  installs VB-CABLE on Windows and Background Music on macOS.

  A background rdp-probe connects as an RDP client, completes the MS-RDPEAI
  handshake (version, formats, open, format change) and streams a 440 Hz tone
  for twelve seconds. Once the server log reports the host microphone, the
  host records it independently of the server: Linux from the PipeWire
  source taomni-rdp-microphone by name, Windows from CABLE Output, macOS from
  the Background Music input. The recording's dominant frequency must be the
  sent tone. On Windows platform_choice picks Taomni over the runner's system
  Remote Desktop.
covers:
- F-RdpServer-1
tags:
- rdp
- rdp-server
- audio
- p1
modes:
- native
fixtures:
- reset_db
- rdp_server_required
- system_rdp_running
- rdp_audio_required
timeout_sec: 420
steps:
- open_route: '?servers=main'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 30
- click: '[data-testid="server-row-rdp"]'
- fill:
    selector: '[data-testid="server-field-port"]'
    value: ${env.QA_RDP_PORT}
- fill:
    selector: '[data-testid="server-field-bind-address"]'
    value: 127.0.0.1
- set_check:
    selector: '[data-testid="server-field-auto-stop"]'
    checked: false
- fill:
    selector: '[data-testid="rdp-field-username"]'
    value: ${env.QA_RDP_USER}
- fill:
    selector: '[data-testid="rdp-field-password"]'
    value: ${env.QA_RDP_PASSWORD}
- set_check:
    selector: '[data-testid="rdp-field-control-approval"]'
    checked: false
- click: '[data-testid="server-row-rdp-start"]'
- platform_choice:
    platforms:
    - Windows
    dialog: '[data-testid="choice-dialog"]'
    click: '[data-testid="choice-dialog-secondary"]'
- wait_for:
    selector: '[data-testid="vault-setup-dialog"]'
    timeout_sec: 30
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: ${env.QA_VAULT_PASSWORD}
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: ${env.QA_VAULT_PASSWORD}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="running"]'
    timeout_sec: 90
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: 'RDP microphone: client microphones will play into'
    timeout_sec: 30
- rdp_probe:
    scenario: mic-send
    artifact: mic-send
    background: mic
    args:
      freq: 440
      seconds: 12
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: 'RDP microphone: client PCM'
    timeout_sec: 30
- rdp_probe:
    scenario: host-record
    artifact: host-mic
    timeout_sec: 60
    args:
      taomni-mic: true
      seconds: 4
      freq: 440
    expect:
      frequency_matches: true
      rms_dbfs:
        min: -30
- rdp_probe_wait:
    name: mic
    timeout_sec: 60
    expect:
      audio_input.open: true
      audio_input.server_version: 2
      audio_input.packets_sent:
        min: 500
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: 'RDP microphone stopped'
    timeout_sec: 20
- click: '[data-testid="server-row-rdp-stop"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="stopped"]'
    timeout_sec: 30
verification:
  review: pending
  requirements:
  - id: R1
    requirement: A client microphone redirected over AUDIO_INPUT is played into a host input that local applications record with the same tone.
    actions:
    - 18
    - 20
    checkpoints:
    - step: 17
      expectation: The server found a host input and offers the microphone channel.
    - step: 19
      expectation: The server opened the host microphone in the client's PCM format.
    - step: 20
      expectation: The host recording of the Taomni microphone has a dominant frequency of 440 Hz within 2 % above -30 dBFS.
    - step: 21
      expectation: The probe completed the MS-RDPEAI handshake with server version 2 and sent at least 500 packets.
    - step: 22
      expectation: Closing the session stops the host microphone.
    results:
    - 20
    - 21
    - 22
  native:
  - check: Real host audio input (PipeWire Audio/Source node on Linux, VB-CABLE on Windows, Background Music on macOS) fed by AUDIO_INPUT over NLA, recorded outside the server.
    method: automated
    reason: Browser stubs have no RDP server or host audio.
  visual:
  - check: Not a visual check; audio is compared by frequency analysis.
    method: not-applicable
    reason: The case asserts audio fidelity, not rendering.

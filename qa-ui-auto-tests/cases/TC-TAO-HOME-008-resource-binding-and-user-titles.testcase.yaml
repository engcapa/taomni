id: TC-TAO-HOME-008
title: Tao Home preserves user titles and removes stale resource excerpts on rebind
description: >-
  Open two disposable real workspaces through Tao history, preserve Chinese user
  titles in English chrome, and exercise binding, explicit citation, rebind and
  unbind. Native verifies resource publication from the packaged workspace owner;
  browser verifies the same renderer workflow with its isolated VFS.
modes: [browser, native]
covers: [F1.11]
tags: [p0, tao-home, regression]
fixtures: [reset_db, platform_workspace_root]
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-tao-home-008
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-source-title","name":"来源","roots":[{"id":"root-a","name":"来源","path":"${fixture.platform_workspace_root}","kind":"folder"}],"looseFiles":[],"lastOpenedAt":1756100000000,"isGitRepo":false},{"id":"qa-file-title","name":"文件","roots":[{"id":"root-b","name":"文件","path":"${fixture.platform_workspace_root}/src","kind":"folder"}],"looseFiles":[],"lastOpenedAt":1756000000000,"isGitRepo":false}]'
- assert_localstorage:
    key: taomni.recentWorkspaces.v1
    contains: 来源
- reload_window: null
- assert_localstorage:
    key: taomni.recentWorkspaces.v1
    contains: 来源
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-workspaces"]'
- assert_text:
    selector: '[data-testid="tao-home-history-row"][data-title="来源"]'
    contains: 来源
- click: '[data-testid="tao-home-history-row"][data-title="来源"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-history"]'
- click: '[data-testid="tao-home-history-tab-workspaces"]'
- assert_text:
    selector: '[data-testid="tao-home-history-row"][data-title="文件"]'
    contains: 文件
- click: '[data-testid="tao-home-history-row"][data-title="文件"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-binding-workspace"]'
- assert_count:
    selector: '[data-testid="tao-home-binding-option"]'
    min: 2
- click: 'xpath=(//*[@data-testid="tao-home-binding-option"])[1]'
- assert_not_visible: '[role="dialog"]'
- eval_readonly:
    expression: document.querySelector(".tao-home-binding-bar").scrollHeight <= document.querySelector(".tao-home-topbar").clientHeight
    expect_truthy: true
- assert_not_visible: '[data-testid="tao-home-context-chips"]'
- click: '[data-testid="tao-home-binding-workspace"]'
- click: '[data-testid="tao-home-binding-cite"]'
- assert_not_visible: '[role="dialog"]'
- assert_visible: '[data-testid="tao-home-context-chips"]'
- click: '[data-testid="tao-home-binding-workspace"]'
- click: 'xpath=(//*[@data-testid="tao-home-binding-option"])[2]'
- assert_not_visible: '[role="dialog"]'
- assert_not_visible: '[data-testid="tao-home-context-chips"]'
- click: '[data-testid="tao-home-binding-workspace"]'
- click: '[data-testid="tao-home-binding-cite"]'
- assert_visible: '[data-testid="tao-home-context-chips"]'
- click: '[data-testid="tao-home-binding-workspace"]'
- click: '[data-testid="tao-home-binding-unbind"]'
- assert_not_visible: '[role="dialog"]'
- assert_not_visible: '[data-testid="tao-home-context-chips"]'
- assert_text:
    selector: '[data-testid="tao-home-binding-workspace"]'
    contains: + Bind Workspace
- assert_no_runtime_errors: null
- screenshot: tao-resource-binding-and-user-titles.png

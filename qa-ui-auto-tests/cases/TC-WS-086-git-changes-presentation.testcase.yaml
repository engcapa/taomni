id: TC-WS-086
title: Changes has one Tree/Flat action and status colors match Log
description: Single and multi-repository tree/flat layouts, wide and compact toolbars. Staged Modified and Added files must have distinct colors and match
  Log foreground/background colors. Browser uses a controlled provider; native validates real Git status/commit data and packaged WebView styles as explicitly
  requested. No OS shortcut-delivery claim.
modes:
- browser
- native
covers:
- F-WS-4
- F26.1
- F26.2
tags:
- p1
- workspace
- git
- regression
fixtures:
- reset_db
- git_change_types
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-git-presentation
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default Workspace (\u9ed8\u8ba4\u5de5\u4f5c\u533a)","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"repo-b","path":"${fixture.parity008_root}/repo-b","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="code-workspace-tool-rail-git"]'
- wait_for: '[data-testid="git-panel"]'
- wait_for: '[data-testid="git-change-status"][data-change-status="added"]'
- wait_for: '[data-testid="git-change-status"][data-change-status="modified"]'
- press:
    selector: '[data-testid="git-changes-list-resize-handle"]'
    key: End
- eval_readonly:
    expression: document.querySelector('[data-tree-mode]').parentElement.clientWidth > 576
    expect_truthy: true
    timeout_sec: 5
- assert_count:
    selector: button[aria-label="Switch to flat list"], button[aria-label="Switch to directory tree"]
    equal: 1
- assert_attribute:
    selector: '[data-testid="git-changes-tree-toggle"]'
    name: data-tree-mode
    equals: tree
- eval_readonly:
    expression: getComputedStyle(document.querySelector('[data-change-status' + String.fromCharCode(61) + '"modified"]')).color !== getComputedStyle(document.querySelector('[data-change-status'
      + String.fromCharCode(61) + '"added"]')).color
    expect_truthy: true
    timeout_sec: 5
- click: '[data-testid="git-changes-tree-toggle"]'
- assert_attribute:
    selector: '[data-testid="git-changes-tree-toggle"]'
    name: data-tree-mode
    equals: flat
- eval_readonly:
    expression: getComputedStyle(document.querySelector('[data-change-status' + String.fromCharCode(61) + '"modified"]')).color !== getComputedStyle(document.querySelector('[data-change-status'

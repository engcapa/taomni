        "SHELL single Git 中文", "status": {"git-diff-fixture-manifest.json": "??"}, "timeout_sec": 30}}'
    - step: 65
      expectation: '{"wait_for": {"selector": "[data-testid=\"git-change-row\"][data-path=\"long-lines.txt\"]",
        "state": "detached"}}'
    results:
    - 58
    - 60
    - 64
    - 65
  - id: R-followup
    requirement: Navigate the current Shell categories and wait for actionable controls while retaining all business-result
      assertions.
    actions:
    - 15
    results:
    - 16
    - 18
    - 20
    - 56
    - 61
    checkpoints:
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"git-diff-unstage\"]:not([disabled])"}'
    - step: 18
      expectation: '{"git_assert_state": {"repo": "${fixture.git_diff_repo}", "status": {"long-lines.txt": " M",
        "short.txt": " M", "git-diff-fixture-manifest.json": "??"}, "index_files": {"short.txt": "short-001\nshort-002\nshort-003\n"}}}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"git-diff-stage\"]:not([disabled])"}'
    - step: 56
      expectation: '{"wait_for": "[data-testid=\"git-diff-discard\"]:not([disabled])"}'
    - step: 61
      expectation: '{"wait_for": "[data-testid=\"git-diff-discard\"]:not([disabled])"}'
  visual:
  - check: Read the final Git Log and Changes screenshots for readable content and unobstructed Host controls.
    method: manual
    reason: Screenshots record the actual single-repository UI; capture alone is not a visual verdict.
  native:
  - check: Real Git IPC, local branch creation/cancellation, commit and discard effects.
    method: automated
    reason: Uses the isolated packaged QA app and independent Git processes; no browser Git stubs.

id: TC-BACKUP-SETTINGS-002
title: Native category selections persist and manual cloud jobs freeze the global plan
description: Real policy/config disk writes and a loopback upload verify category planning while preserving a legacy
  core destination override.
covers:
- F-BACKUP-1
- F-BACKUP-2
tags:
- backup
- settings
- p1
modes:
- native
fixtures:
- reset_db
- backup_cloud
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="ribbon-settings"]'
- wait_for:
    selector: '[data-testid="settings-panel"]'
    timeout_sec: 30
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for:
    selector: '[data-testid="backup-global-categories"]'
    timeout_sec: 30
- set_check:
    selector: '[data-testid="backup-global-include-mail"]'
    checked: true
- set_check:
    selector: '[data-testid="backup-global-includeLanchat"]'
    checked: true
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- assert_file_contains:
    path: ${fixture.backup_policy_path}
    contains: '"defaultScope": "custom"'
    timeout_sec: 30
- assert_file_contains:
    path: ${fixture.backup_policy_path}
    contains: '"includeMailOriginals": true'
    timeout_sec: 30
- click: '[data-testid="backup-cloud-destination"] > summary'
- assert_attribute:
    selector: '[data-testid="backup-cloud-range-mode"]'
    name: value
    equals: custom
- assert_attribute:
    selector: '[data-testid="backup-cloud-include-mail"]'
    name: aria-checked
    equals: 'false'
- wait_for:
    selector: '[data-testid="backup-selected-start"]:not([disabled])'
    timeout_sec: 30
- click: '[data-testid="backup-selected-start"]'
- wait_for:
    selector: '[data-testid="backup-cloud-job"][data-operation="upload"][data-phase="completed"]'
    timeout_sec: 120
- assert_file_contains:
    path: ${fixture.backup_service_events}
    contains: execution_scope=custom
    timeout_sec: 30
- set_check:
    selector: '[data-testid="backup-global-include-mail"]'
    checked: false
- assert_file_contains:
    path: ${fixture.backup_policy_path}
    contains: '"includeMail": false'
    timeout_sec: 30
- assert_file_contains:
    path: ${fixture.backup_policy_path}
    contains: '"includeMailOriginals": false'
    timeout_sec: 30
- select_option:
    selector: '[data-testid="backup-cloud-range-mode"]'
    value: inherit
- assert_file_contains:
    path: ${fixture.backup_control_path}
    contains: '"rangeMode": "inherit"'
    timeout_sec: 30
- click: '[data-testid="settings-group-toggle-backup"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- assert_attribute:
    selector: '[data-testid="backup-global-include-mail"]'
    name: aria-checked
    equals: 'false'
- assert_attribute:
    selector: '[data-testid="backup-global-includeLanchat"]'
    name: aria-checked
    equals: 'true'
- screenshot: backup-native-category-range.png
verification:
  review: reviewed
  native:
  - check: Real isolated IPC, OS lock, journal and archive effects
    method: automated
    reason: Hosted native runs use disposable profiles and independent filesystem observations.
  requirements:
  - id: R1
    requirement: Category choices are durable and manual work uses the global plan despite a legacy target override
    actions:
    - 7
    - 8
    - 16
    checkpoints:
    - step: 10
      expectation: Explicit custom flags persisted
    - step: 11
      expectation: Mail child flags saved
    - step: 13
      expectation: Legacy target remains independent
    - step: 14
      expectation: Legacy core target still excludes mail
    - step: 17
      expectation: Real upload completed
    - step: 18
      expectation: Job uses frozen category plan
    results:
    - 10
    - 11
    - 13
    - 14
    - 17
    - 18
  - id: R2
    requirement: Mail exclusion and explicit inheritance survive native disk writes and remount
    actions:
    - 19
    - 22
    - 25
    checkpoints:
    - step: 20
      expectation: Mail excluded on disk
    - step: 21
      expectation: Originals excluded on disk
    - step: 23
      expectation: Inheritance saved
    - step: 26
      expectation: Excluded after remount
    - step: 27
      expectation: Other selected category retained
    results:
    - 20
    - 21
    - 23
    - 26
    - 27
  visual:
  - check: Category and task controls remain readable in retained screenshots
    method: manual
    reason: Review screenshots from the hosted workflow; filesystem assertions establish native effects.

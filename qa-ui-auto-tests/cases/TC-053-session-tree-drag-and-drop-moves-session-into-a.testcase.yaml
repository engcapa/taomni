id: TC-053
title: Session tree drag-and-drop moves session into a folder
covers:
- F6.2
tags:
- drag-drop
- folders
- legacy-imported
- p1
- session
modes:
- browser
fixtures:
- reset_db
- ssh_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- send_text_via_label:
    label_contains: Specify username
    checked: true
- wait: 0.5
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-dnd-target
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-dnd-target"]'
- right_click:
    selector: '[data-testid="session-tree"]'
    position:
      x: 16
      y: 16
- wait_for: '[data-testid="context-menu"]'
- click: '[data-testid="context-menu"] >> text=/new folder|new group|create folder/i'
- wait_for: '[data-testid="folder-name-dialog"]'
- fill:
    selector: '[data-testid="folder-name-dialog-input"]'
    value: qa-ui-auto-dnd-group
- click: '[data-testid="folder-name-dialog-confirm"]'
- wait: 1
- drag_to:
    from: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-dnd-target"]'
    to: '[data-testid="session-tree"] >> text="qa-ui-auto-dnd-group"'
- wait: 1
- assert_visible: '[data-testid="session-tree"] >> text="qa-ui-auto-dnd-group"'
- eval_readonly:
    expression: JSON.parse(localStorage.getItem("taomni.sessions.v1"))[0]?.group_path === "User sessions / qa-ui-auto-dnd-group"
    expect_truthy: true
- screenshot: 053-session-tree-drag-drop.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 将会话拖放进新文件夹后，保存的 group_path 精确指向该文件夹。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 8
    - 9
    - 11
    - 12
    - 14
    - 16
    - 18
    - 19
    - 21
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-dnd-target\"]"}'
    - step: 15
      expectation: '{"wait_for": "[data-testid=\"context-menu\"]"}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"folder-name-dialog\"]"}'
    - step: 23
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"] >> text=\"qa-ui-auto-dnd-group\""}'
    - step: 24
      expectation: '{"eval_readonly": {"expression": "JSON.parse(localStorage.getItem(\"taomni.sessions.v1\"))[0]?.group_path
        === \"User sessions / qa-ui-auto-dnd-group\"", "expect_truthy": true}}'
    results:
    - 23
    - 24
  visual:
  - check: 拖放目标、文件夹展开层级与会话位置清晰。
    method: manual
    reason: 截图必须单独评审，不能由功能步骤通过推导视觉通过。
  native:
  - check: 浏览器合成拖放验证应用处理；桌面系统拖拽另需 native 验证。
    method: external
    reason: 按实际执行模式解释；其他平台不继承 Linux 证据。

id: TC-BACKUP-SETTINGS-001
title: Global scope persists; legacy and inherited channels remain distinct
description: Renderer model verifies persisted global choices, custom channel semantics, manual summary and live translations. Native disk and range execution
  have separate cases.
covers:
- F-BACKUP-1
- F-BACKUP-2
tags:
- backup
- settings
- p1
modes:
- browser
fixtures:
- reset_db
- backup_cloud
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for: '[data-testid="backup-global-scope"]'
- wait_for: '[data-testid="backup-cloud-panel"]'
- select_option:
    selector: '[data-testid="backup-global-scope"]'
    value: full
- eval_readonly:
    expression: document.getElementById("backup-global-include-mail").checked
    expect_truthy: true
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- click: '[data-testid="backup-cloud-destination"]:nth-of-type(1) > summary'
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-range-mode"]'
    name: value
    equals: custom
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-scope"]'
    name: value
    equals: core
- set_check:
    selector: '[data-testid="backup-cloud-include-mail"]'
    checked: true
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- select_option:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-range-mode"]'
    value: inherit
- assert_text:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-range-summary"]'
    contains: LAN chat
- assert_not_visible: '[data-testid="backup-manual"] select'
- assert_text:
    selector: '[data-testid="backup-manual"] [data-testid="backup-range-summary"]'
    contains: Mail
- set_check:
    selector: '[data-testid="backup-global-include-mail"]'
    checked: false
- assert_text:
    selector: '[data-testid="backup-settings-save-status"]'
    contains: Saved
    timeout_sec: 30
- click: '[data-testid="settings-group-toggle-backup"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- assert_attribute:
    selector: '[data-testid="backup-global-scope"]'
    name: value
    equals: full
- eval_readonly:
    expression: '!document.getElementById("backup-global-include-mail").checked'
    expect_truthy: true
- click: '[data-testid="backup-cloud-destination"]:nth-of-type(1) > summary'
- assert_attribute:
    selector: '[data-testid="backup-cloud-destination"]:nth-of-type(1) [data-testid="backup-cloud-range-mode"]'
    name: value
    equals: inherit
- click: '[data-testid="backup-local-destination"] > summary'
- select_option:
    selector: '[data-testid="backup-local-range-mode"]'
    value: custom
- select_option:
    selector: '[data-testid="backup-local-scope"]'
    value: core
- select_option:
    selector: '[data-testid="backup-global-scope"]'
    value: custom
- set_check:
    selector: '[data-testid="backup-global-includeLocalHistory"]'
    checked: true
- set_check:
    selector: '[data-testid="backup-global-includeMfa"]'
    checked: false
- assert_enabled: '[data-testid="backup-global-includeVault"]'
- set_check:
    selector: '[data-testid="backup-global-includeVault"]'
    checked: false
- eval_readonly:
    expression: '!document.querySelector(''[data-testid''+String.fromCharCode(61)+''"backup-global-includeVault"]'').checked'
    expect_truthy: true
- set_check:
    selector: '[data-testid="backup-global-includeVault"]'
    checked: true
- set_check:
    selector: '[data-testid="backup-global-includeMfa"]'
    checked: true
- eval_readonly:
    expression: document.querySelector('[data-testid'+String.fromCharCode(61)+'"backup-global-includeVault"]').checked
    expect_truthy: true
- assert_attribute:
    selector: '[data-testid="backup-global-includeVault"]'
    name: disabled
    equals: ''
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-zh-CN"]'
- assert_text:
    selector: '[data-testid="backup-global-defaults"]'
    contains: 全局默认配置
- assert_attribute:
    selector: '[data-testid="backup-global-scope"]'
    name: value
    equals: custom
- screenshot: backup-global-zh.png
- click: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_failed_id}"] [data-testid="backup-job-retry"]'
- wait_for: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_failed_id}"][data-phase="completed"]'
verification:
  review: reviewed
  native:
  - check: Renderer behavior only
    method: not-applicable
    reason: Native boundaries are covered separately by TC-BACKUP-SETTINGS-002, TC-BACKUP-AUTH-715 and TC-BACKUP-COMPAT-001.
  visual:
  - check: Backup layout and translated controls
    method: manual
    reason: Review retained workflow screenshots.
  requirements:
  - id: R1
    requirement: Full preset persists atomically and explicit mail exclusion survives reopening
    actions:
    - 8
    - 20
    - 23
    checkpoints:
    - step: 9
      expectation: '{"eval_readonly": {"expression": "document.getElementById(\"backup-global-include-mail\").checked", "expect_truthy": true}}'
    - step: 10
      expectation: saved
    - step: 24
      expectation: fullPersisted
    - step: 25
      expectation: '{"eval_readonly": {"expression": "!document.getElementById(\"backup-global-include-mail\").checked", "expect_truthy": true}}'
    results:
    - 9
    - 10
    - 24
    - 25
  - id: R2
    requirement: Legacy override is retained until explicit inheritance and manual uses the global summary
    actions:
    - 16
    - 23
    checkpoints:
    - step: 12
      expectation: legacyCustom
    - step: 13
      expectation: legacyCore
    - step: 17
      expectation: effectiveFull
    - step: 18
      expectation: manualNoScope
    - step: 19
      expectation: manualMail
    - step: 27
      expectation: inheritPersisted
    results:
    - 12
    - 13
    - 17
    - 18
    - 19
    - 27
  - id: R3
    requirement: Local override, custom history and MFA/vault controls survive live language changes
    actions:
    - 29
    - 31
    - 32
    - 33
    - 35
    - 37
    - 38
    - 42
    checkpoints:
    - step: 34
      expectation: '{"assert_enabled": "[data-testid=\"backup-global-includeVault\"]"}'
    - step: 36
      expectation: '{"eval_readonly": {"expression": "!document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"backup-global-includeVault\"]'').checked",
        "expect_truthy": true}}'
    - step: 39
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid''+String.fromCharCode(61)+''\"backup-global-includeVault\"]'').checked",
        "expect_truthy": true}}'
    - step: 40
      expectation: mfaVault
    - step: 43
      expectation: translated
    - step: 44
      expectation: customRetained
    results:
    - 34
    - 36
    - 39
    - 40
    - 43
    - 44

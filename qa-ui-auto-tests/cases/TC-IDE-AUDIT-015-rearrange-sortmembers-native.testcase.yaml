id: TC-IDE-AUDIT-015-rearrange-sortmembers-native
title: Rearrange Code via live JDT LS source.sortMembers with preview, apply, undo
description: "ED-AUDIT-015 native gate case. Crosses the real packaged-app boundary on\nLinux with live Eclipse\
  \ JDT LS 1.61.0 and proves the supported rearrange\npath end to end through the production UI entry:\n\n1. A SortMembers.java\
  \ file with unsorted members (methods before fields,\n   zebra before apple) is written by the host, then the\
  \ workspace is\n   entered through persisted recents with that file active.\n2. Rearrange Code is invoked from\
  \ Search Everywhere Actions (the\n   production workspace.rearrangeCode entry). JDT LS is never advertised\n \
  \  in codeActionKinds, so the handler discovers the dedicated\n   source.sortMembers action live (exact kind equality)\
  \ instead of\n   trusting summary booleans.\n3. The rearrange preview dialog is confirmed, the apply status names\
  \ the\n   transaction, and the editor shows fields before methods (order asserted\n   with a DOTALL pattern, not\
  \ just substring presence).\n4. One shared undo names the Rearrange Code journal entry, a save returns\n   the\
  \ exact original bytes (sha256 pinned from the host-written source),\n   proving single-undo preimage restore.\n\
  5. ED-IMPROVE-001: while the first preview dialog is open, an external\n   process rewrites the file; the clean\
  \ buffer reloads from disk, so\n   confirming that old preview must be rejected with a typed stale status\n  \
  \ and zero writes (exact bytes of the external revision stay on disk)\n   before the normal rearrange flow runs\
  \ on the restored preimage.\n\nHighest claim on green: L2 native + provider-backed (Linux), packaged app\nUI over\
  \ a real jdtls process, real disk bytes. IDEA comparison (required\nkind) is recorded separately as unrun on this\
  \ box — no IDEA 2026.2.x.\n"

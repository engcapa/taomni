id: TC-IDE-JAVA-RENAME-DELETED-RECOVERY-WIN
title: 'Java rename-delete recovery: abandon both-missing, restore mixed shape'
description: "java-rename-deleted-recovery seeded native gate case (F25.5). Runs the\nfilesystem- and DOM-only half\
  \ of TC-IDE-JAVA-RENAME-DELETED-RECOVERY on\nLinux, macOS, and Windows (no pointer/keyboard injection): the live\
  \ JDT LS\nclass-rename provider segment remains in the Linux case because its pointer\ncaret verbs are Linux/X11-only,\
  \ while this case proves on the real packaged\napp, real disk, and webview-persistent journals:\n\n1. AC-02/04\
  \ seeded history: a seeded v2 entry in the deleted-after-rename\n   shape (old and new paths both missing) reviews\
  \ as\n   document-unreadable / move `both-missing`, states non-existence without\n   claiming the user deleted\
  \ anything, keeps Restore disabled, and offers\n   Keep plus a two-step Abandon. Opening Abandon then pressing\
  \ Escape\n   closes only the inline confirm and keeps the entry pending.\n2. AC-03 abandon: confirming Abandon\
  \ records only a `user-dismissed`\n   resolution marker (zero file writes: the staged post bytes keep their\n\
  \   hash, the gone paths stay gone) and the abandoned record stays silent\n   after reload while the sibling pending\
  \ entry still prompts.\n3. AC-05 seeded mixed shape: a seeded v2 entry in the production mixed\n   text+rename\
  \ shape (`contentHash` = pre-image hash, document pre/post\n   images, new path staged with the POST bytes) classifies\
  \ restorable,\n   restores new->old with byte-preservation proof plus preimage read-back,\n   and lands `rolled-back`\
  \ with the reversed move recorded\n   (assert_file_sha256 == preHash on the moved-home bytes).\n\nHighest claim\
  \ on green: L2 native on the executed platform, packaged QA app\nover real disk bytes. Explicitly NOT claimed\
  \ by this run: the live provider class\nrename (Linux case), the live user order \"rename then delete the renamed\n\
  file via the tree then reopen\" (no tree-delete verb exists; recorded\nmanual V-05), the 736x375 / 1280x800 viewport\
  \ matrix (no native viewport\nverb), host proof that a missing path stays missing (no assert-file-missing\nverb;\
  \ the zero-write ack plus unchanged staged hashes plus the\n`user-dismissed` marker are the automated evidence).\
  \ Linux/macOS/Windows\nevidence remains independently required; a pass on one end never passes the\nother ends\
  \ by proxy.\n"
covers:
- F25.5
tags:
- code-workspace
- ide-editor
- refactor
- recovery
- java-rename
- native-gate
- p1
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- java_rename_deleted_fixtures
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-jrdr-win","name":"jrdr","roots":[{"id":"jrdr","name":"jrdr","path":"${fixture.jrdr_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"jrdr","path":"MixNew.java"},"lastOpenedAt":1756100000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.jrdr_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-pane"]'
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: public class MixNew
    timeout_sec: 60
- seed_storage:
    key: taomni.refactor.recovery.v2:qa-jrdrw-abandon
    value: '{"schemaVersion": 2, "recoveryId": "qa-jrdrw-abandon", "transactionId": "qa-jrdrw-txn-abandon", "actionId":
      "rename:qa-jrdrw-abandon", "kind": "rename", "workspaceRoot": "${fixture.jrdr_root}", "createdAt": 1757000002000,
      "updatedAt": 1757000002000, "status": "recovery-required", "appliedOperationIndex": null, "documents": [{"uri":
      "file://${fixture.jrdr_root}/Gone.java", "canonicalPath": "${fixture.jrdr_root}/Gone.java", "preText": "class
      Gone { int a = 1; }\n", "preHash": "d0a3257e508b876863b3ab9f4dc7f0fc04211e05fd33ba64e41c2ccc16852351", "postText":
      "class GoneRenamed { int a = 1; }\n", "postHash": "6fc89ed34e31da3e3927f9c1890dbc52154d62671a175db7796f45d24bde1b57",
      "encoding": "UTF-8", "bom": false, "eol": "lf"}], "resourceMoves": [{"oldUri": "file://${fixture.jrdr_root}/Gone.java",
      "newUri": "file://${fixture.jrdr_root}/GoneRenamed.java", "oldPath": "${fixture.jrdr_root}/Gone.java", "newPath":

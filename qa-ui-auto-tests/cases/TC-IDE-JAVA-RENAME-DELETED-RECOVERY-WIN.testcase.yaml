      "updatedAt": 1757000001000, "status": "prepared", "appliedOperationIndex": null, "documents": [{"uri": "file://${fixture.jrdr_root}/MixOld.java",
      "canonicalPath": "${fixture.jrdr_root}/MixOld.java", "preText": "public class MixOld {}\n", "preHash": "3533c9cac826533ea8dd12c771268366d3901f2d14fb43fd1d9a70dd794444c1",

id: TC-IDE-PARITY-025-02-debugger-native
title: 'IDEA debugger parity: non-suspending stack-trace breakpoint, Remove once hit, frames, threads and evaluate'
description: 'ED-PARITY-025 A4/A5 native case on the isolated Java 25 Maven fixture. Two line breakpoints are configured through IDEA''s balloon and Breakpoints dialog: line 6 without Suspend and with Stack trace logging, line 7 with Remove once hit. The real java-debug session must pass line 6 without showing a stop while the console prints IDEA''s "Breakpoint reached" stack, stop on line 7 and remove that breakpoint, render the frame as main:7, App (com.example.app) with the "main" thread combo and value = 42, evaluate value + 1 to 43 from the Variables field with Enter, and resume to completion. Highest claim on green: L2 provider-backed native DAP behavior.

  '
covers:
- F25.1
- F25.5
tags:
- code-workspace
- java25
- debug
- dap
- ed-parity-025
- p1
modes:
- native
fixtures:
- reset_db
- java25_projects
timeout_sec: 600
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-java25-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-java25-debug","name":"maven-java25","roots":[{"id":"maven-java25","name":"maven-java25","path":"${fixture.java25_maven_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"maven-java25","path":"src/main/java/com/example/app/App.java"},"lastOpenedAt":1788537600000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.java25_maven_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"]'
    contains: System.out.println("debug-value=" + value);
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="code-workspace-lsp-status-pill"]'
    contains: Java
    timeout_sec: 60
- click: '[data-testid="code-workspace-editor"] .cm-content'
- native_keys:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    transport: webdriver
    keys:
    - Control+Home
    - ArrowDown
    - ArrowDown
    - ArrowDown
    - ArrowDown
    - ArrowDown
    - Home
    - Control+F8
    - ArrowDown
    - Control+F8
    - ArrowUp
    - Control+Shift+F8
- wait_for:
    selector: '[data-testid="debug-breakpoint-popup"]'
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="debug-breakpoint-popup-title"]'
    contains: App.java:6
- click: '[data-testid="debug-breakpoint-popup-more"]'
- wait_for: '[data-testid="debug-breakpoints-dialog"]'
- click: '[data-testid="debug-breakpoints-dialog-suspend"]'
- click: '[data-testid="debug-breakpoints-dialog-log-stack"]'
- click: '[data-testid="debug-breakpoints-dialog-line"][data-breakpoint-line="7"]'
- click: '[data-testid="debug-breakpoints-dialog-remove-once-hit"]'
- click: '[data-testid="debug-breakpoints-dialog-done"]'
- wait_for:
    selector: '[data-testid="debug-breakpoints-dialog"]'
    state: detached
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="code-workspace-editor"] [data-bp-gutter-line="6"] .taomni-bp'
    name: data-bp-kind
    equals: no-suspend
- assert_attribute:
    selector: '[data-testid="code-workspace-editor"] [data-bp-gutter-line="7"] .taomni-bp'
    name: data-bp-temporary
    equals: 'true'
- native_click:
    selector: '[data-testid="code-workspace-debug-target"]'
- assert_text:
    selector: '[data-testid="debug-panel"]'
    contains: stopped · breakpoint
    timeout_sec: 60
- assert_text:
    selector: '[data-testid="debug-frames-list"]'
    contains: main:7, App (com.example.app)
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="debug-thread-select"]'
    contains: '"main"@'
    timeout_sec: 30
- wait_for:
    selector: '[data-testid="code-workspace-editor"] [data-bp-gutter-line="7"] .taomni-bp'
    state: detached
    timeout_sec: 15
- assert_attribute:
    selector: '[data-testid="code-workspace-editor"] [data-bp-gutter-line="6"] .taomni-bp'
    name: data-bp-kind
    equals: no-suspend
- assert_text:
    selector: '[data-testid="debug-variables-tree"]'
    contains: = 42
    timeout_sec: 30
- fill:
    selector: '[data-testid="debug-watch-input"]'
    value: value + 1
- press:
    key: Enter
    selector: '[data-testid="debug-watch-input"]'
- assert_text:
    selector: '[data-testid="debug-evaluate-inline-result"]'
    contains: '43'
    timeout_sec: 30
- screenshot: tc-ide-parity-025-02-debugger.png
- click: '[data-testid="debug-subtab-console"]'
- assert_text:
    selector: '[data-testid="debug-console-output"]'
    contains: Breakpoint reached
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="debug-console-output"]'
    contains: App.main(App.java:6)
    timeout_sec: 10
- click: '[data-testid="debug-continue"]'
- assert_text:
    selector: '[data-testid="debug-console-output"]'
    contains: debug-value=42
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="debug-panel"]'
    contains: terminated
    timeout_sec: 60

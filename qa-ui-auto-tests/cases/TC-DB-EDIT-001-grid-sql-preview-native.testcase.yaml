id: TC-DB-EDIT-001-grid-sql-preview-native
title: Native grid save confirmation lists the SQL and warns without a primary key
description: |
  DB-EDIT-001 V3. On a real MySQL/MariaDB session, deleting a grid row of a
  table with a primary key shows the DELETE statement matched on the key (no
  warning) and applying it removes the row; the same edit on a table without a
  primary key warns that every column is matched, and canceling runs nothing.
covers:
- F-DB-1
tags:
- database
- sql
- grid-edit
- db-parity
- native-boundary
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- mysql_required
timeout_sec: 360
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-db-edit-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-mysql"]'
- wait_for:
    selector: '[data-testid="session-database-section"]'
    timeout_sec: 10
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.database.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.database.port}
- fill:
    selector: input[aria-label="Database username"]
    value: ${cfg.database.user}
- fill:
    selector: input[aria-label="Database password"]
    value: ${cfg.database.password}
- fill:
    selector: input[aria-label="Database name"]
    value: ${cfg.database.database}
- click: '[data-testid="db-save-in-vault"]'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-db-edit
- click: '[data-testid="session-save"]'
- wait_for:
    selector: '[data-testid="vault-setup-pw1"]'
    timeout_sec: 15
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-db-edit-master
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-db-edit-master
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-db-edit"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-db-edit"]'
- wait_for:
    selector: '[data-testid="db-query-tab"]'
    timeout_sec: 60
- assert_not_visible: '[data-testid="db-connection-error-banner"]'
- wait_for:
    selector: '[data-testid="schema-tree"]'
    timeout_sec: 30
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: "CREATE TABLE IF NOT EXISTS qa_db_edit001_pk (id INT PRIMARY KEY, v VARCHAR(10)); CREATE TABLE IF NOT EXISTS qa_db_edit001_nopk (id INT, v VARCHAR(10)); DELETE FROM qa_db_edit001_pk WHERE id >= 0; DELETE FROM qa_db_edit001_nopk WHERE id >= 0; INSERT INTO qa_db_edit001_pk VALUES (1, 'a'); INSERT INTO qa_db_edit001_nopk VALUES (1, 'a');"
- click: '[data-testid="db-run-all"]'
- wait_for:
    selector: '[data-testid="result-log-tab"]'
    timeout_sec: 60
- click: '[data-testid="result-log-tab"]'
- assert_text:
    selector: '[data-testid="db-execution-log-run"]:first-of-type [data-testid="db-execution-log-summary"]'
    contains: 'Success: 6'
    timeout_sec: 60
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: "SELECT * FROM qa_db_edit001_pk;"
- click: '[data-testid="db-run-all"]'
- wait_for:
    selector: '[data-testid="query-result-grid"] button[title="Row 1"]'
    timeout_sec: 60
- click: '[data-testid="query-result-grid"] button[title="Row 1"]'
- click: '[data-testid="query-result-grid"] button[aria-label="Delete row"]'
- click: '[data-testid="query-result-grid"] button[aria-label="Submit grid edits"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: 'SQL to execute (1):'
- assert_pattern:
    selector: '[data-testid="confirm-dialog-message"]'
    regex: '^(?![\s\S]*No primary key)[\s\S]*DELETE FROM (`[^`]+`\.)?`qa_db_edit001_pk` WHERE `id` = ''1'';'
- click: '[data-testid="confirm-dialog-confirm"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: "SELECT CONCAT('count-', COUNT(*)) AS n FROM qa_db_edit001_pk;"
- click: '[data-testid="db-run-all"]'
- assert_text:
    selector: '[data-testid="query-result-grid"]'
    contains: count-0
    timeout_sec: 60
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: "SELECT * FROM qa_db_edit001_nopk;"
- click: '[data-testid="db-run-all"]'
- wait_for:
    selector: '[data-testid="query-result-grid"] button[title="Row 1"]'
    timeout_sec: 60
- click: '[data-testid="query-result-grid"] button[title="Row 1"]'
- click: '[data-testid="query-result-grid"] button[aria-label="Delete row"]'
- click: '[data-testid="query-result-grid"] button[aria-label="Submit grid edits"]'
- wait_for: '[data-testid="confirm-dialog"]'
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: No primary key found
- assert_text:
    selector: '[data-testid="confirm-dialog-message"]'
    contains: "WHERE `id` = '1' AND `v` = 'a'"
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_not_visible: '[data-testid="confirm-dialog"]'
- click: '[data-testid="sql-editor"] .cm-content'
- press: Mod+a
- type: "SELECT CONCAT('count-', COUNT(*)) AS n FROM qa_db_edit001_nopk;"
- click: '[data-testid="db-run-all"]'
- assert_text:
    selector: '[data-testid="query-result-grid"]'
    contains: count-1
    timeout_sec: 60
- screenshot: db-edit-001-grid-sql-preview-native.png

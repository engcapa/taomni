    method: automated
    reason: Browser stubs cannot prove database execution and retained native wiring.
  - check: Cross-client visibility and server connection teardown beyond the listed SELECT results.
    method: external
    reason: Those extra boundaries are covered by the paired Shell N12/N15 independent SQL/process cases,
      not this UI log.

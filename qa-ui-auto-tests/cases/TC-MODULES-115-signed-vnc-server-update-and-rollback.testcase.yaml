id: TC-MODULES-115
title: Signed VNC Server keeps its settings and releases the Linux daemon across version switches
description: >-
  Switch signed VNC Server hosts in Local servers with the original Vault credential and
  settings. On Linux authenticate to the loopback RFB listener and prove x11vnc exits at each
  switch. On macOS and Windows verify the system sharing and external server guidance on the
  hosted runner, respectively.
covers: [F-Modules-1, F-Servers-1]
tags: [modules, vnc, servers, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, module_signed_vnc_server_archive, module_marketplace, release_build_required]
timeout_sec: 660
steps:

verification:
  review: reviewed
  requirements:
  - id: old-enabled
    requirement: The previous signed host serves the runner-local desktop or displays the platform setup guidance.
    actions: [3, 4, 5, 6, 7, 9, 12, 14, 15, 17, 18, 20, 25, 27]
    checkpoints:
    - {step: 29, expectation: The previous signed host serves the runner-local desktop or displays the platform setup guidance.}
    results: [29]
  - id: old-disabled
    requirement: The listener and previous host have stopped while settings remain on disk.
    actions: [30, 31, 32]
    checkpoints:
    - {step: 34, expectation: The listener and previous host have stopped while settings remain on disk.}
    results: [34]
  - id: updated-disabled
    requirement: The downloaded signed version is selected and the module stays disabled.
    actions: [35, 36, 37, 39, 42, 43, 44, 46, 47, 49, 51]
    checkpoints:
    - {step: 53, expectation: The downloaded signed version is selected and the module stays disabled.}
    results: [53]
  - id: rolled-back-disabled
    requirement: The previous signed version returns without starting a server.
    actions: [54]
    checkpoints:
    - {step: 56, expectation: The previous signed version returns without starting a server.}
    results: [56]
  - id: old-reenabled
    requirement: The previous signed host uses the same settings after enabling.
    actions: [57, 59, 60, 61, 63, 67]
    checkpoints:
    - {step: 69, expectation: The previous signed host uses the same settings after enabling.}
    results: [69]
  - id: updated-enabled
    requirement: The current host takes over and the previous listener is released.
    actions: [70, 71, 72, 74, 76]
    checkpoints:
    - {step: 78, expectation: The current host takes over and the previous listener is released.}
    results: [78]
  - id: failed-update
    requirement: The active signed version survives the failed handshake and releases the listener.
    actions: [79, 80, 81, 83, 87, 89, 90, 91, 92, 93]
    checkpoints:
    - {step: 96, expectation: The active signed version survives the failed handshake and releases the listener.}
    results: [96]
  - id: rolled-back-enabled
    requirement: The previous host returns under the original desktop PID and the listener is released.
    actions: [97, 98, 99, 101, 105, 107, 108, 109]
    checkpoints:
    - {step: 111, expectation: The previous host returns under the original desktop PID and the listener is released.}
    results: [111]
  - id: uninstalled
    requirement: The host and derived runtime are removed and the retained data locator is complete.
    actions: [112, 113, 114, 116, 120, 122, 123, 124, 125]
    checkpoints:
    - {step: 128, expectation: The host and derived runtime are removed and the retained data locator is complete.}
    results: [128]
  - id: reinstalled
    requirement: The current signed host uses the original settings after reinstalling.
    actions: [129, 130, 131, 133, 136, 137, 138, 139, 140, 142, 144, 145, 146, 148, 152]
    checkpoints:
    - {step: 154, expectation: The current signed host uses the original settings after reinstalling.}
    results: [154]
  visual:
  - check: Local servers shows the signed VNC settings and platform-specific start result.
    method: automated
    reason: The case uses the normal renderer controls and reads their results.
  native:
  - check: Observe the signed host, original desktop PID, writer lease and retained profile data.
    method: automated
    reason: Each lifecycle record binds the installed bytes and native observations to the signed build.

id: TC-WS-005
title: Resizable left sidebar with the workspace switcher, default workspace and persisted width
description: v6.1 AC-05 / DEC-04. The left sidebar keeps its 6px drag handle and can be widened continuously; the width survives a reload. The workspace switcher
  sits at the top of the Workspaces sidebar, always offers the undeletable Default Workspace, and can create and switch workspaces.
modes:
- browser
- native
covers:
- F1.2
- F-WS-2
tags:
- smoke
- p0
- workspace-redesign
- sidebar
fixtures:
- reset_db
- platform_workspace_root
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-005
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default Workspace (默认工作区)","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"qa-root","path":"${fixture.platform_workspace_root}","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-switcher"]'
- assert_text:
    selector: '[data-testid="workspace-switcher"]'
    contains: Default Workspace
- assert_visible: '[data-testid="workspace-default-badge"]'
- assert_visible: '[data-testid="main-sidebar-resize-handle"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"expanded-sidebar-panel"]').getBoundingClientRect().width >= 180
    expect_truthy: true
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: ArrowRight
- eval_readonly:
    expression: JSON.parse(localStorage.getItem('taomni.resizable-panels.v4.main-layout') || '{}').sidebar > 22.5
    expect_truthy: true
- reload_window: null
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-switcher"]'
- eval_readonly:
    expression: Math.abs(document.querySelector('[data-testid' + String.fromCharCode(61) + '"expanded-sidebar-panel"]').getBoundingClientRect().width - window.innerWidth
      * JSON.parse(localStorage.getItem('taomni.resizable-panels.v4.main-layout') || '{}').sidebar / 100) < 80
    expect_truthy: true
- click: '[data-testid="workspace-switcher-button"]'
- wait_for: '[data-testid="workspace-switcher-menu"]'
- assert_text:
    selector: '[data-testid="workspace-switcher-menu"]'
    contains: Default Workspace
- press: Escape
- assert_not_visible: '[data-testid="workspace-switcher-menu"]'
- screenshot: ws-005-workspace-switcher-default.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Workspaces 左栏顶部为工作区切换器，初始自带 DEFAULT 徽标的默认工作区。
    actions:
    - 9
    checkpoints:
    - step: 8
      expectation: 切换器已挂载
    - step: 9
      expectation: 切换器文本包含 Default Workspace
    - step: 10
      expectation: DEFAULT 徽标可见
    results:
    - 9
    - 10
  - id: R2
    requirement: 左栏通过 main-sidebar-resize-handle 可键盘/拖拽调宽且重载后保持。
    actions:
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 17
    - 18
    checkpoints:
    - step: 11
      expectation: 拖拽分隔条可见
    - step: 14
      expectation: 拖拽分隔条改变左栏宽度
    - step: 19
      expectation: 重载后宽度保持
    results:
    - 14
    - 19
  - id: R3
    requirement: 切换器下拉菜单列出默认工作区并可关闭。
    actions:
    - 20
    - 21
    - 22
    - 23
    checkpoints:
    - step: 21
      expectation: 切换菜单出现
    - step: 22
      expectation: 菜单包含默认工作区
    - step: 24
      expectation: Esc 关闭菜单
    results:
    - 21
    - 24
  visual:
  - check: 切换器位于左栏顶部且不出现已删除的 [文件管理|Git 面板] 行。
    method: manual
    reason: 布局位置与视觉层级需要截图评审。
  native:
  - check: 真实 WebView 中分隔条拖拽与宽度持久化一致。
    method: automated
    reason: 用例声明 browser 与 native 两种模式。

id: TC-IDE-C2-01
title: jdtls completion accept lands import+identifier and snippet as one undo each
description: "ED-AUDIT-007 A1/A2 native gate. Enters the in-repo single-module Maven\nsample through persisted recents\
  \ (no native picker), waits for the real\nJDT LS provider, then proves the two provider-backed acceptance forms\n\
  through the packaged app UI:\n\n1. Import-on-resolve accept: the caret sits after the bare `StringUti`\n   token\
  \ (the fixture's un-imported org.apache.commons.lang3 target).\n   Basic completion is fired explicitly. The CI-pinned\
  \ JDTLS 1.50 provider\n   answers with the org.apache.commons.lang3 candidate; the case proves\n   its decorated\
  \ package identity and accepts the selected item with Enter.\n   (JDTLS 1.61 also exposed a JDK-internal com.sun\
  \ twin, but that is not the\n   provider version exercised by this hosted workflow.) Provider resolve supplies\n\
  \   one additionalTextEdit (the lang3 import). The acceptance must land\n   the identifier AND the import in one\
  \ dispatch; saving proves the disk\n   bytes equal the provider trace's appliedSha256, and ONE Ctrl+Z plus a\n\
  \   save proves the disk bytes equal the original fixture hash again -\n   one undo reverts the whole acceptance\
  \ (identifier + import together),\n   matching the real-provider acceptance hashes recorded by\n   run-jdtls-fixture.mjs\
  \ (traces/maven-single.trace.json,\n   caseId dependency-source-import).\n2. Snippet accept: the caret sits after\
  \ the `appen` prefix of\n   `new StringBuilder().appen`; the top method choice is accepted with\n   Enter (jdtls\
  \ advertises snippetSupport and the client capabilities\n   enable it), the call text must land, Tab must advance\
  \ the snippet\n   tabstop without a document edit, and ONE Ctrl+Z must restore the\n   exact original line.\n\n\
  Highest claim on green: L2 provider-backed (Linux), packaged app UI over\na real jdtls process. All keystrokes\
  \ use the self-activating XTest\nnative_keys transport: the W3C WebDriver press path is rejected by\nWebKitGTK\
  \ for Control+Space (preserved ED-COMP-004 failure).\n"
covers:
- F25.5

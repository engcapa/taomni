- click: '[data-testid="workspace-switcher-button"]'
- click: '[data-testid^="workspace-switcher-option-"]:not([data-testid="workspace-switcher-option-default-workspace"])'
- assert_items:
    selector: '[data-testid="workspace-tab"]'
    attribute: title
    equals:
    - Other retained
- screenshot: workspace-tab-menu-isolation.png

    - QA beta
    - QA gamma
- right_click: '[data-testid="workspace-tab"][title="QA alpha"]'
- click: '[data-testid="workspace-tab-context-move-right"]'
- assert_items:
    selector: '[data-testid="workspace-tab"]'
    attribute: title
    equals:
    - QA alpha-1
    - QA alpha
    - QA beta
    - QA gamma
- right_click: '[data-testid="workspace-tab"][title="QA alpha"]'
- click: '[data-testid="workspace-tab-context-move-left"]'
- assert_items:
    selector: '[data-testid="workspace-tab"]'
    attribute: title
    equals:

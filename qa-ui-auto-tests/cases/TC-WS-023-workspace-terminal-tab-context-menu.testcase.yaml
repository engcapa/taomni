- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: QA beta
- click: '[data-testid="text-input-dialog-confirm"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-menu"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="workspace-session-pane"]:visible'
- right_click: '[data-testid="workspace-tab"][title="Local Terminal"]'
- click: '[data-testid="workspace-tab-context-rename"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:

id: TC-WS-023
title: Workspace terminal tab menu preserves ordering, rename, duplication and isolation
description: Runs every context menu action through the workspace strip. Cancellation preserves titles; closing affects only this workspace.
modes:
- browser
covers:
- F-WS-2
- F-WS-3
tags:
- p0
- workspace-redesign
- regression
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-023
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-menu"]'
- click: '[data-testid="workspace-plus-local-terminal"]'

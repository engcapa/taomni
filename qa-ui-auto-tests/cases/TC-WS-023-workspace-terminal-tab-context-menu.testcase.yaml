    contains: copied
- right_click: '[data-testid="workspace-tab"][title="QA alpha-1"]'
- click: '[data-testid="workspace-tab-context-close"]'
- assert_items:
    selector: '[data-testid="workspace-tab"]'
    attribute: title
    equals:
    - QA alpha
    - QA beta
    - QA gamma
- click: '[data-testid="workspace-create-button"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: QA other
- click: '[data-testid="text-input-dialog-confirm"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-menu"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="workspace-session-pane"]:visible'
- right_click: '[data-testid="workspace-tab"][title="Local Terminal"]'
- click: '[data-testid="workspace-tab-context-rename"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: Other retained
- click: '[data-testid="text-input-dialog-confirm"]'
- click: '[data-testid="workspace-switcher-button"]'
- click: '[data-testid="workspace-switcher-option-default-workspace"]'
- right_click: '[data-testid="workspace-tab"][title="QA beta"]'
- click: '[data-testid="workspace-tab-context-close-others"]'
- assert_items:
    selector: '[data-testid="workspace-tab"]'
    attribute: title
    equals:
    - QA beta
- right_click: '[data-testid="workspace-tab"][title="QA beta"]'
- click: '[data-testid="workspace-tab-context-close-all"]'
- assert_count:

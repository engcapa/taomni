    - 68
    - 69
    - 70
    - 71
    - 72
    - 73
    checkpoints:
    - step: 10
      expectation: '[data-testid="mobile-session"] has 2 entries.'
    - step: 11
      expectation: '[data-testid="mobile-saved-session"] shows Build host.'
    - step: 15
      expectation: '[data-testid="mobile-terminal-status"] shows 只读.'
    - step: 17
      expectation: '[data-testid="mobile-resize"] is disabled.'
    - step: 20
      expectation: '[data-testid="mobile-terminal-status"] shows 控制中.'
    - step: 21
      expectation: Taking control adopts the phone geometry automatically (RESIZE receipt before the manual fit click).
    - step: 28
      expectation: Independent receipt contains PTY QA_MOBILE_WEBSOCKET_INPUT.
    - step: 30
      expectation: '[data-testid="mobile-terminal-status"] shows 只读.'
    - step: 32
      expectation: '[data-testid="mobile-resize"] is disabled.'
    - step: 39
      expectation: '[data-testid="mobile-task-status"] shows 运行中.'
    - step: 40
      expectation: Independent receipt contains AGENT QA_AGENT_PROMPT_CHANNEL.
    - step: 41
      expectation: '[data-testid="mobile-agent-send"] is disabled.'
    - step: 43
      expectation: '[data-testid="mobile-task-status"] shows 空闲.'
    - step: 45
      expectation: '[data-testid="mobile-file-content"] shows QA_MOBILE_CHANGED.'
    - step: 47
      expectation: '[data-testid="mobile-file-view"] shows @@ -1 +1 @@.'
    - step: 48
      expectation: Phone document does not overflow horizontally.
    - step: 58
      expectation: '[data-testid="mobile-instance-open"] has 2 entries.'
    - step: 60
      expectation: '[data-testid="mobile-instance-open"] has 2 entries.'
    - step: 63
      expectation: '[data-testid="mobile-session"] has 2 entries.'
    - step: 66
      expectation: '[data-testid="mobile-instance-open"] has 1 entries.'
    - step: 70
      expectation: Terminal box is 200px..55% of the phone viewport and has no internal overflow.
    - step: 72
      expectation: Terminal box stays bounded and the key bar remains inside the document after 1.5s (no fit feedback growth).
    - step: 142
      expectation: No runtime errors occurred.
    results:
    - 10
    - 11
    - 15
    - 17
    - 20
    - 21
    - 28
    - 30
    - 32
    - 39
    - 40
    - 41
    - 43
    - 45
    - 47
    - 48
    - 58

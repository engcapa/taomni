id: TC-MOBILE-001
title: Mobile Web pairs switches instances and separates terminal and Agent input
covers:
- F-MOBILE-1
tags:
- p0
- mobile
- control-plane
modes:
- browser
fixtures:
- mobile_web
timeout_sec: 180
description: Production mobile bundle at phone dimensions with a deterministic HTTP/WS peer. Rust service security and real PTY effects
  are covered separately by TC-MOBILE-002 and native mobile contracts.
steps:
- set_viewport:
    width: 390
    height: 844
- open: ${fixture.mobile_endpoint}
- wait_for: '[data-testid="mobile-empty-instances"]'
- click: '[data-testid="mobile-add-instance"]'
- fill:
    selector: '[data-testid="mobile-endpoint"]'
    value: ${fixture.mobile_endpoint}
- fill:
    selector: '[data-testid="mobile-label"]'
    value: Home PC
- fill:
    selector: '[data-testid="mobile-pair-code"]'
    value: qa-mobile-code
- click: '[data-testid="mobile-pair-submit"]'
- wait_for: '[data-testid="mobile-session"][data-session-kind="agent"]'
- assert_count:
    selector: '[data-testid="mobile-session"]'
    equal: 2
- assert_text:
    selector: '[data-testid="mobile-saved-session"]'
    contains: Build host
- click: '[data-testid="mobile-session"][data-session-kind="terminal"]'
- assert_text:
    selector: '[data-testid="mobile-terminal-status"]'
    contains: 只读
- assert_disabled: '[data-testid="mobile-resize"]'
- click: '[data-testid="mobile-take-control"]'
- assert_text:
    selector: '[data-testid="mobile-terminal-status"]'
    contains: 控制中
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: RESIZE
- click: '[data-testid="mobile-resize"]'
- click: '[data-testid="mobile-paste"]'
- fill:
    selector: '[data-testid="mobile-terminal-input"]'
    value: QA_MOBILE_WEBSOCKET_INPUT
- click: '[data-testid="mobile-terminal-send"]'
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: PTY QA_MOBILE_WEBSOCKET_INPUT
- click: '[data-testid="mobile-take-control"]'
- assert_text:
    selector: '[data-testid="mobile-terminal-status"]'
    contains: 只读
- assert_disabled: '[data-testid="mobile-resize"]'
- screenshot: mobile-terminal-readonly.png
- click: '[data-testid="mobile-sessions-back"]'
- click: '[data-testid="mobile-session"][data-session-kind="agent"]'
- fill:
    selector: '[data-testid="mobile-agent-input"]'
    value: QA_AGENT_PROMPT_CHANNEL
- click: '[data-testid="mobile-agent-send"]'
- assert_text:
    selector: '[data-testid="mobile-task-status"]'
    contains: 运行中
- assert_file_contains:
    path: ${fixture.mobile_receipt}
    contains: AGENT QA_AGENT_PROMPT_CHANNEL
- assert_disabled: '[data-testid="mobile-agent-send"]'
- click: '[data-testid="mobile-task-stop"]'
- assert_text:
    selector: '[data-testid="mobile-task-status"]'
    contains: 空闲
- click: '[data-testid="mobile-file-open"]'
- assert_text:
    selector: '[data-testid="mobile-file-content"]'
    contains: QA_MOBILE_CHANGED
- click: '[data-testid="mobile-diff-open"]'
- assert_text:
    selector: '[data-testid="mobile-file-view"]'
    contains: '@@ -1 +1 @@'
- eval_readonly:
    expression: document.documentElement.scrollWidth <= window.innerWidth
    expect_truthy: true
- screenshot: mobile-agent-files.png
- click: '[data-testid="mobile-instances-back"]'
- click: '[data-testid="mobile-add-instance"]'
- fill:
    selector: '[data-testid="mobile-endpoint"]'
    value: ${fixture.mobile_endpoint2}
- fill:
    selector: '[data-testid="mobile-label"]'
    value: Cloud
- fill:
    selector: '[data-testid="mobile-pair-code"]'
    value: qa-mobile-code
- click: '[data-testid="mobile-pair-submit"]'
- wait_for: '[data-testid="mobile-session"][data-session-kind="agent"]'
- click: '[data-testid="mobile-instances-back"]'
- assert_count:
    selector: '[data-testid="mobile-instance-open"]'
    equal: 2
- reload_window: null
- assert_count:
    selector: '[data-testid="mobile-instance-open"]'
    equal: 2
- click: article:has(h3:text-is("Cloud")) [data-testid="mobile-instance-open"]
- wait_for: '[data-testid="mobile-session"][data-session-kind="agent"]'
- assert_count:
    selector: '[data-testid="mobile-session"]'
    equal: 2
- click: '[data-testid="mobile-instances-back"]'
- click: article:has(h3:text-is("Cloud")) [data-testid="mobile-instance-remove"]
- assert_count:
    selector: '[data-testid="mobile-instance-open"]'
    equal: 1
- click: '[data-testid="mobile-instance-open"]'
- click: '[data-testid="mobile-session"][data-session-kind="terminal"]'
- wait_for: '[data-testid="mobile-terminal-screen"]'
- eval_readonly:
    expression: document.querySelector('.terminal').getBoundingClientRect().height <= window.innerHeight * 0.55 && document.querySelector('.terminal').getBoundingClientRect().height >= 200 && document.querySelector('.terminal').scrollHeight <= document.querySelector('.terminal').clientHeight + 1
    expect_truthy: true
- wait: 1.5
- eval_readonly:
    expression: document.querySelector('.terminal').getBoundingClientRect().height <= window.innerHeight * 0.55 && document.querySelector('.terminal').scrollHeight <= document.querySelector('.terminal').clientHeight + 1 && document.querySelector('.keybar').getBoundingClientRect().top <= document.documentElement.scrollHeight
    expect_truthy: true
- screenshot: mobile-terminal-layout.png
- assert_no_runtime_errors: null

  - check: Phone viewport has no horizontal page overflow.
    method: automated
    reason: DOM geometry assertion plus diagnostic screenshots.
  native:
  - check: Native networking is outside this renderer case.
    method: not-applicable
    reason: TC-MOBILE-002/003 and Rust mobile contracts own the native boundary.

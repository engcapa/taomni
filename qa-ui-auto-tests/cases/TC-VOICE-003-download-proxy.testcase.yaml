id: TC-VOICE-003
title: Model download proxy modes and independent Settings editor
covers: [F-AI-2.3]
tags: [ai, voice, proxy, p1]
modes: [browser]
fixtures: [reset_db]
timeout_sec: 90
steps:
- open: '${cfg.app.base_url}/?voiceFixture=1'
- click: '[data-testid="welcome-open-local-terminal"]'
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="chat-voice-button"]'
- click: '[data-testid="chat-voice-button"]'
- wait_for: '[data-testid="asr-download-proxy-mode"]'
- select_option: {selector: '[data-testid="asr-download-proxy-mode"]', value: custom}
- fill: {selector: '[data-testid="asr-download-proxy"] input[placeholder="Proxy host"]', value: '127.0.0.1'}
- fill: {selector: '[data-testid="asr-download-proxy"] input[placeholder="Port"]', value: '7890'}
- assert_text: {selector: '[data-testid="asr-download-proxy"]', contains: 'Save proxy changes before downloading.'}
- click: '[data-testid="asr-download-proxy-save"]'
- assert_localstorage: {key: taomni.ai.config.v1, contains: '"host":"127.0.0.1"'}
- screenshot: custom-download-proxy.png
- click: '[data-testid="voice-settings-close"]'
- click: '[data-testid="chat-voice-button"]'
- assert_attribute: {selector: '[data-testid="asr-download-proxy"] input[placeholder="Proxy host"]', name: value, equals: '127.0.0.1'}
- select_option: {selector: '[data-testid="asr-download-proxy-mode"]', value: none}
- click: '[data-testid="asr-download-proxy-save"]'
- assert_localstorage: {key: taomni.ai.config.v1, contains: '"mode":"none","custom"'}
- select_option: {selector: '[data-testid="asr-download-proxy-mode"]', value: app}
- click: '[data-testid="asr-download-proxy-save"]'
- assert_localstorage: {key: taomni.ai.config.v1, contains: '"mode":"app","custom"'}
- click: '[data-testid="asr-download-whisper-base"]'
- assert_text: {selector: '[data-testid="asr-model-whisper-base"]', contains: Downloaded}
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Custom proxy uses the shared Settings editor and persists across opening the voice setup; no-proxy and app modes save independently.
    actions:
    - 7
    - 8
    - 9
    - 11
    - 14
    - 15
    - 17
    - 18
    - 20
    - 21
    - 23
    checkpoints:
    - {step: 10, expectation: '{"assert_text": {"selector": "[data-testid=\"asr-download-proxy\"]", "contains": "Save proxy changes before downloading."}}'}
    - {step: 12, expectation: '{"assert_localstorage": {"key": "taomni.ai.config.v1", "contains": "\"host\":\"127.0.0.1\""}}'}
    - {step: 16, expectation: '{"assert_attribute": {"selector": "[data-testid=\"asr-download-proxy\"] input[placeholder=\"Proxy host\"]", "name": "value", "equals": "127.0.0.1"}}'}
    - {step: 19, expectation: '{"assert_localstorage": {"key": "taomni.ai.config.v1", "contains": "\"mode\":\"none\",\"custom\""}}'}
    - {step: 22, expectation: '{"assert_localstorage": {"key": "taomni.ai.config.v1", "contains": "\"mode\":\"app\",\"custom\""}}'}
    - {step: 24, expectation: '{"assert_text": {"selector": "[data-testid=\"asr-model-whisper-base\"]", "contains": "Downloaded"}}'}
    results:
    - 10
    - 12
    - 16
    - 19
    - 22
    - 24
  visual:
  - {check: Shared proxy editor in voice modal, method: manual, reason: Inspect screenshot for clipping and scroll access.}
  native:
  - {check: HTTP routing and direct environment bypass, method: external, reason: Rust local-server tests validate the real downloader client; browser download is a
      fixture.}

id: TC-130
title: SSH session terminal appearance controls persist after save and reopen
covers:
- F6.3
- F5.2
tags:
- ssh
- session
- settings
- terminal
- appearance
- persistence
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-ssh"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ssh-terminal-appearance.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '2222'
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qa-terminal-appearance
- click: '[data-testid="session-section-terminal"]'
- wait_for: '[data-testid="terminal-settings"]'
- assert_visible: '[data-testid="terminal-appearance-settings"]'
- assert_visible: '[data-testid="terminal-preview"]'
- assert_visible: '[data-testid="terminal-preview-cursor"]'
- click: '[data-testid="terminal-theme-select"]'
- wait_for: '[data-testid="terminal-theme-option-kanagawa-wave"]'
- click: '[data-testid="terminal-theme-option-kanagawa-wave"]'
- click: '[data-testid="terminal-theme-select"]'
- assert_attribute:
    selector: '[data-testid="terminal-theme-option-kanagawa-wave"]'
    name: aria-selected
    equals: 'true'
- fill:
    selector: 'input[aria-label="Terminal font size"]'
    value: '16'
- press:
    selector: 'input[aria-label="Terminal font size"]'
    key: Tab
- assert_attribute:
    selector: 'input[aria-label="Terminal font size"]'
    name: value
    equals: '16'
- click: 'button[aria-label="Decrease text size"]'
- wait: 0.5
- assert_attribute:
    selector: 'input[aria-label="Terminal font size"]'
    name: value
    equals: '15'
- click: 'button[aria-label="Increase text size"]'
- wait: 0.5
- assert_attribute:
    selector: 'input[aria-label="Terminal font size"]'
    name: value
    equals: '16'
- set_check:
    selector: 'input[aria-label="Enable font ligatures"]'
    checked: true
- assert_count:
    selector: 'input[aria-label="Enable font ligatures"]:checked'
    equal: 1
- fill:
    selector: 'input[aria-label="Scrollback lines"]'
    value: '12000'
- press:
    selector: 'input[aria-label="Scrollback lines"]'
    key: Tab
- assert_attribute:
    selector: 'input[aria-label="Scrollback lines"]'
    name: value
    equals: '12000'
- select_option:
    selector: 'select[aria-label="Terminal cursor"]'
    label: Vertical bar (steady)
- assert_attribute:
    selector: 'select[aria-label="Terminal cursor"]'
    name: value
    equals: Vertical bar (steady)
- select_option:
    selector: 'select[aria-label="Right click behavior"]'
    label: Paste clipboard
- assert_attribute:
    selector: 'select[aria-label="Right click behavior"]'
    name: value
    equals: Paste clipboard
- fill:
    selector: 'input[aria-label="Terminal background hex"]'
    value: '#112233'
- fill:
    selector: 'input[aria-label="Terminal foreground hex"]'
    value: '#ddeeff'
- assert_attribute:
    selector: 'input[aria-label="Terminal background hex"]'
    name: value
    equals: '#112233'
- assert_attribute:
    selector: 'input[aria-label="Terminal foreground hex"]'
    name: value
    equals: '#ddeeff'
- fill:
    selector: 'input[aria-label="Maximum command history entries per host"]'
    value: '2500'
- press:
    selector: 'input[aria-label="Maximum command history entries per host"]'
    key: Tab
- assert_attribute:
    selector: 'input[aria-label="Maximum command history entries per host"]'
    name: value
    equals: '2500'
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-terminal-appearance
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-terminal-appearance"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-terminal-appearance"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-section-terminal"]'
- wait_for: '[data-testid="terminal-settings"]'
- assert_attribute:
    selector: 'input[aria-label="Terminal font size"]'
    name: value
    equals: '16'
- assert_count:
    selector: 'input[aria-label="Enable font ligatures"]:checked'
    equal: 1
- assert_attribute:
    selector: 'input[aria-label="Scrollback lines"]'
    name: value
    equals: '12000'
- assert_attribute:
    selector: 'select[aria-label="Terminal cursor"]'
    name: value
    equals: Vertical bar (steady)
- assert_attribute:
    selector: 'select[aria-label="Right click behavior"]'
    name: value
    equals: Paste clipboard
- assert_attribute:
    selector: 'input[aria-label="Terminal background hex"]'
    name: value
    equals: '#112233'
- assert_attribute:
    selector: 'input[aria-label="Terminal foreground hex"]'
    name: value
    equals: '#ddeeff'
- assert_attribute:
    selector: 'input[aria-label="Maximum command history entries per host"]'
    name: value
    equals: '2500'
- click: '[data-testid="session-cancel"]'
- wait_for:
    selector: '[data-testid="session-editor"]'
    state: detached
- screenshot: 130-ssh-session-terminal-appearance.png

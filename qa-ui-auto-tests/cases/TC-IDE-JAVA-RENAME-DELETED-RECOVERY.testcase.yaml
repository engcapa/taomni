id: TC-IDE-JAVA-RENAME-DELETED-RECOVERY
title: 'Java class rename + delete: no false recovery, explicit abandon, verified restore'
description: "java-rename-deleted-recovery native gate case (F25.5). Proves the three\nproduction fixes over the\
  \ real packaged-app boundary on Linux:\n\n1. AC-01/provider: a real Shift+F6 rename of the top-level\n   `QuickFixTarget`\
  \ class in the maven-single sample applies a genuine\n   text+rename WorkspaceEdit through the packaged app UI\
  \ (preview modal\n   reporting the resource operation, apply, moved file on disk with the new\n   class, journal\
  \ committed). Re-entering the workspace surfaces NO review\n   dialog for that successful transaction (identity-based\
  \ postcondition:\n   no false `recovery-required` from `/` vs `\\` path spellings).\n2. AC-02/03/04 seeded history:\
  \ a seeded v2 entry in the deleted-after-rename\n   shape (old and new paths both missing) reviews as\n   document-unreadable\
  \ / move `both-missing`, states non-existence without\n   claiming the user deleted anything, keeps Restore disabled,\
  \ and offers\n   Keep plus a two-step Abandon (Esc cancels the second step and keeps the\n   entry pending). Confirming\
  \ Abandon records only a `user-dismissed`\n   resolution marker (zero file writes: the renamed file keeps its\
  \ post\n   bytes, the gone paths stay gone), and after reload the abandoned record\n   stays silent while a sibling\
  \ pending entry still prompts.\n3. AC-05 seeded mixed shape: a seeded v2 entry in the production mixed\n   text+rename\
  \ shape (`contentHash` = pre-image hash, document pre/post\n   images, new path staged with the POST bytes) classifies\
  \ restorable\n   (document proof accepts the post image instead of conflicting on the\n   pre hash), restores\
  \ new->old with byte-preservation proof plus preimage\n   read-back, and lands `rolled-back` with the reversed\
  \ move recorded.\n\nHighest claim on green: L2 native (Linux), packaged app UI over a real\njdtls process (segment\
  \ 1) and real disk bytes plus webview-persistent\nrecovery journals (segments 2-3). Explicitly NOT claimed by\
  \ this run:\nthe live user order \"rename then delete the renamed file via the tree then\nreopen\" (no tree-delete\
  \ verb exists in the catalog; covered by recorded\nmanual V-05), the 736x375 / 1280x800 viewport matrix (no native\
  \ viewport\nverb; small-window geometry is manual V-05), host proof that a missing path\nstays missing (no assert-file-missing\
  \ verb; the zero-write ack plus\nunchanged sibling hashes plus the `user-dismissed` marker are the\nautomated\
  \ evidence), and macOS/Windows native runs (Linux only on this\nbox; other ends stay unverified, never passed-by-proxy).\n"
covers:
- F25.5

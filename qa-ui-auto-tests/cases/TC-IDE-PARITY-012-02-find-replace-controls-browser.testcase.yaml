id: TC-IDE-PARITY-012-02
title: 'IDEA Find/Replace row: history, clear, multiline, filter, Exclude and Ctrl+R focus'
description: 'ED-PARITY-012 A1/A3/A4 and DEC-012-02..05: the Find row carries history, a clear button, multiline and the inline context filter; Ctrl+R shows Replace while focus stays in Find, Tab enters Replace; Exclude keeps a match out of Replace All and one undo restores the buffer; Esc returns focus to the editor and the history dropdown offers session queries.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-012
- find
- focus
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- click: '[data-testid="code-workspace-tree-new"]'
- click: '[data-testid="code-workspace-tree-new-file"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog"] input'
    value: find012.txt
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor-tab-strip"] [data-active="true"][data-editor-tab-key$="find012.txt"]'
    timeout_sec: 15
- click: '[data-testid="code-workspace-editor"] .cm-content'
- type: foo bar foo baz foo
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: foo bar foo baz foo
- press: Mod+Home
- press: Control+f
- eval_readonly:
    expression: document.activeElement?.getAttribute('name') === 'search'
    expect_truthy: true
- assert_not_visible: '[data-testid="code-workspace-editor-search"] button[aria-label="Clear search"]'
- type:
    selector: '[data-testid="code-workspace-editor-search"] input[name="search"]'
    text: foo
- assert_text:
    selector: '[data-testid="code-workspace-editor-search"] .cm-workspace-search-status'
    contains: 1 / 3
- assert_visible: '[data-testid="code-workspace-editor-search"] button[aria-label="Clear search"]'
- assert_visible: '[data-testid="code-workspace-editor-search"] .cm-workspace-search-row button[aria-label="Filter context"]'
- assert_visible: '[data-testid="code-workspace-editor-search"] button[aria-label="Search history"]'
- assert_visible: '[data-testid="code-workspace-editor-search"] button[aria-label="Multiline"]'
- press: Enter
- assert_text:
    selector: '[data-testid="code-workspace-editor-search"] .cm-workspace-search-status'
    contains: 2 / 3
- press: Shift+Enter
- assert_text:
    selector: '[data-testid="code-workspace-editor-search"] .cm-workspace-search-status'
    contains: 1 / 3
- press: Control+r
- assert_visible: '[data-testid="code-workspace-editor-search"] input[name="replace"]'
- eval_readonly:
    expression: document.activeElement?.getAttribute('name') === 'search'
    expect_truthy: true
- assert_visible: '[data-testid="code-workspace-editor-search"] button[aria-label="Exclude current match"]'
- press: Tab
- eval_readonly:
    expression: document.activeElement?.getAttribute('name') === 'replace'
    expect_truthy: true
- type:
    selector: '[data-testid="code-workspace-editor-search"] input[name="replace"]'
    text: qux
- click: '[data-testid="code-workspace-editor-search"] button[aria-label="Exclude current match"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor-search"] .cm-workspace-search-status'
    contains: 1 excluded
- click: '[data-testid="code-workspace-editor-search"] button[aria-label="Replace all matches"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: foo bar qux baz qux
- click: '[data-testid="code-workspace-editor-search"] button[aria-label="Multiline"]'
- assert_visible: '[data-testid="code-workspace-editor-search"] textarea[name="search-multiline"]'
- click: '[data-testid="code-workspace-editor-search"] button[aria-label="Multiline"]'
- assert_visible: '[data-testid="code-workspace-editor-search"] input[name="search"]'
- click: '[data-testid="code-workspace-editor-search"] button[aria-label="Clear search"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor-search"] .cm-workspace-search-status'
    contains: 0 results
- type:
    selector: '[data-testid="code-workspace-editor-search"] input[name="search"]'
    text: bar
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-editor-search"]'
    state: detached
    timeout_sec: 5
- &id001
  eval_readonly:
    expression: document.activeElement?.classList.contains('cm-content') === true
    expect_truthy: true
- press: Control+z
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: foo bar foo baz foo
- press: Control+f
- click: '[data-testid="code-workspace-editor-search"] button[aria-label="Search history"]'
- assert_text:
    selector: '[data-testid="code-workspace-editor-search"] [role="listbox"]'
    contains: bar
- assert_text:
    selector: '[data-testid="code-workspace-editor-search"] [role="listbox"]'
    contains: foo
- click: '[data-testid="code-workspace-editor-search"] [role="listbox"] [role="option"]'
- eval_readonly:
    expression: document.querySelector('.cm-workspace-search-input').value === 'bar'
    expect_truthy: true
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-editor-search"]'
    state: detached
    timeout_sec: 5
- *id001
- screenshot: tc-ide-parity-012-02-find.png

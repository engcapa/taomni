id: TC-TAO-HOME-043
title: Combined LLM and Tao configuration uses one save and ordinary provider defaults
description: Configure the old LLM model and Tao voice/cost/model defaults together. A new chat selects the ordinary local provider,
  keeps unsupported switches off in Research, and restores both sets of settings after a WebView reload. Saving never sends inference.
modes:
- browser
- native
covers:
- F1.11
tags:
- p0
- tao-home
- regression
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-tao-home-043
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- click: '[data-testid="tao-home-dock-more"]'
- click: '[data-testid="tao-home-dock-settings"]'
- wait_for: '[data-testid="tao-settings"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: tao
- eval_readonly:
    expression: getComputedStyle(document.getElementById('tao-settings-heading').closest('[data-search-id]').parentElement.closest('[data-search-id]')).opacity
      === '1'
    expect_truthy: true
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: ''
- assert_count:
    selector: '[data-testid="llm-providers-save"]'
    equal: 1
- assert_not_visible: '[data-testid="tao-settings-save"]'
- assert_attribute:
    selector: '[data-testid="tao-settings-cost"]'
    name: value
    equals: '0'
- assert_not_visible: '[data-testid="tao-settings-key"]'
- select_option:
    selector: '[data-testid="tao-settings-provider"]'
    value: local
- fill:
    selector: '[data-testid="tao-settings-model"]'
    value: qa-chat-default
- select_option:
    selector: '[data-testid="tao-settings-tts"]'
    value: tide
- fill:
    selector: '[data-testid="tao-settings-cost"]'
    value: '2.5'
- click: '[data-provider="local"] > div'
- fill:
    selector: '[data-provider="local"] [data-testid="llm-provider-model"]'
    value: qa-provider-model
- click: '[data-testid="llm-providers-save"]'
- wait_for: '[data-testid="llm-providers-status"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="tao-home-new-chat"]'
- assert_text:
    selector: '[data-testid="tao-home-capabilities"]'
    contains: qa-chat-default
- click: '[data-testid="tao-home-capabilities"]'
- eval_readonly:
    expression: document.querySelector('.tao-home-control-field .taomni-select-trigger').dataset.value === "local"
    expect_truthy: true
- assert_disabled: '[data-testid="tao-home-capability-thinking"]'
- assert_disabled: '[data-testid="tao-home-capability-web"]'
- press: Escape
- click: '[data-testid="tao-home-mode-research"]'
- eval_readonly:
    expression: '!document.querySelector(''.tao-home-capability-button'').textContent.includes("Web")'
    expect_truthy: true
- reload_window: null
- wait_for: '[data-testid="tao-home-host"]'
- click: '[data-testid="tao-home-dock-more"]'
- click: '[data-testid="tao-home-dock-settings"]'
- wait_for: '[data-testid="tao-settings"]'
- assert_attribute:
    selector: '[data-testid="tao-settings-model"]'
    name: value
    equals: qa-chat-default
- eval_readonly:
    expression: document.querySelector('#tao-settings-heading').parentElement.querySelectorAll('select')[2].value === 'tide'
    expect_truthy: true
- assert_attribute:
    selector: '[data-testid="tao-settings-cost"]'
    name: value
    equals: '2.5'
- click: '[data-provider="local"] > div'
- assert_attribute:
    selector: '[data-provider="local"] [data-testid="llm-provider-model"]'
    name: value
    equals: qa-provider-model
- assert_no_runtime_errors: null
- screenshot: combined-ai-settings.png
verification:
  review: reviewed
  requirements:
  - id: PROVIDER-043
    requirement: One shared save retains provider settings and all Tao defaults through reload; ordinary providers remain selectable
      without enabling unsupported capabilities.

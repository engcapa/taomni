    - 4
    - 6
    - 7
    - 8
    - 9
    - 11
    - 12
    - 13
    - 14
    - 16
    - 18
    checkpoints:
    - step: 5
      expectation: Rename Escape keeps the original title; Enter synchronizes the
        strip and overview.
    - step: 10
      expectation: Rename Escape keeps the original title; Enter synchronizes the
        strip and overview.
    - step: 15
      expectation: Rename Escape keeps the original title; Enter synchronizes the
        strip and overview.
    - step: 17
      expectation: Rename Escape keeps the original title; Enter synchronizes the
        strip and overview.
    - step: 19
      expectation: Rename Escape keeps the original title; Enter synchronizes the
        strip and overview.
    results:
    - 5
    - 10
    - 15
    - 17
    - 19
  - id: R2
    requirement: Duplicate creates a second terminal without replacing the manually

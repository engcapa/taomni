id: TC-SHELL-B12
title: Tab rename cancellation, manual title and duplicate identity
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b12.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- right_click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- click: '[data-testid="shell-tab-rename"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: abandoned
- press:
    selector: '[data-testid="tab-title-input"]'
    key: Escape
- assert_text_equals:
    selector: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
    equals: qa-alpha
- right_click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- click: '[data-testid="shell-tab-rename"]'
- fill:
    selector: '[data-testid="tab-title-input"]'
    value: SHELL manual
- press:
    selector: '[data-testid="tab-title-input"]'
    key: Enter
- assert_text_equals:
    selector: '[data-testid="tab-item"][data-active="true"] [data-testid="tab-title"]'
    equals: SHELL manual
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]:has-text("SHELL manual")'
    equal: 1
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Escape
- assert_not_visible: '[data-testid="shell-overview"]'
- right_click: '[data-testid="tab-item"]:has-text("SHELL manual")'
- click: '[data-testid="shell-tab-duplicate"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="shell-overview-trigger"]'
- assert_count:
    selector: '[data-testid="shell-tab-card"]'
    equal: 3
- assert_count:
    selector: '[data-testid="shell-tab-card"]:has-text("SHELL manual")'
    equal: 2
- assert_shell_backend:
    command: create_ssh_terminal
    count: 2
    status: requested
- screenshot: tc-shell-b12.png
verification:
  review: reviewed
  requirements:

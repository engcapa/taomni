id: TC-146
title: SSH saved-session authentication dismissals recover for a later connection
covers:
- F6.2
- F6.3
- F6.5
tags:
- ssh
- session
- authentication
- connection
- recovery
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="sidebar"]'
- assert_visible: '[data-testid="session-new"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-auth-dismiss-reconnect
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-dismiss-reconnect"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-dismiss-reconnect"]'
- wait_for: '[data-testid="auth-prompt"]'
- assert_disabled: '[data-testid="auth-submit"]'
- assert_count:
    selector: '[data-testid="auth-save-to-vault"]:checked'
    equal: 0
- set_check:
    selector: '[data-testid="auth-save-to-vault"]'
    checked: true
- assert_count:
    selector: '[data-testid="auth-save-to-vault"]:checked'
    equal: 1
- click: '[data-testid="auth-close"]'
- wait_for:
    selector: '[data-testid="auth-prompt"]'
    state: detached
- assert_visible: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-dismiss-reconnect"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-dismiss-reconnect"]'
- wait_for: '[data-testid="auth-prompt"]'
- assert_count:
    selector: '[data-testid="auth-save-to-vault"]:checked'
    equal: 0
- click: '[data-testid="auth-cancel"]'
- wait_for:
    selector: '[data-testid="auth-prompt"]'
    state: detached
- assert_visible: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-dismiss-reconnect"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-auth-dismiss-reconnect"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf 'qa-ssh-auth-dismiss-reconnect\n'
    submit: true
- wait: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa\-ssh\-auth\-dismiss\-reconnect\r?$
    timeout_sec: 60
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- click: '[data-testid="context-menu-item-event-log"]'
- wait_for: '[data-testid="terminal-event-log"]'
- assert_text:
    selector: '[data-testid="terminal-event-log"]'
    contains: connection
- assert_text:
    selector: '[data-testid="terminal-event-log"]'
    contains: auth
- click: '[data-testid="terminal-event-log-close"]'
- wait_for:
    selector: '[data-testid="terminal-event-log"]'
    state: detached
- assert_not_visible: '[data-testid="terminal-event-log"]'
- screenshot: 146-ssh-auth-prompt-dismiss-reconnect.png

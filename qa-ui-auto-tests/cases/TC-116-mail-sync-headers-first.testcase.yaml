id: TC-116
title: Mail headers-first refresh followed by reading and replying
description: 'Opens a browser-stub Mail tab and runs the mailbox Sync action. The browser

  stub verifies the visible headers-first refresh path; body warming progress is

  optional because the stub messages already include cached bodies. Reading and
  replying must still work after refresh. Native lock contention and SMTP/copy
  ordering are additionally covered by mail::responsiveness_tests; this browser
  case does not establish native networking latency.

  '
covers:
- F-MAIL-3
- F-MAIL-1
- F-MAIL-2
tags:
- mail
- smoke
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="status-bar"]'
    timeout_sec: 45
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="quick-connect"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: mail://san.zhang%40yourmail.com@imap.yourmail.com:993
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- click: '[data-testid="mail-sync-button"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: Synced
    timeout_sec: 10
- screenshot: mail-116-sync-headers-first.png
- click: '[data-testid="mail-message-row"]:first-child'
- wait_for: '[data-testid="mail-client-tab"] button[title="Reply"]:not(:disabled)'
- click: '[data-testid="mail-client-tab"] button[title="Reply"]'
- wait_for: '[data-testid="mail-compose-dialog"]'
- fill:
    selector: '[data-testid="mail-compose-editor"]'
    value: QA reply after refreshing headers.
- click: '[data-testid="mail-compose-send"]'
- wait_for:
    selector: '[data-testid="mail-compose-dialog"]'
    state: hidden
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: Message sent
- screenshot: mail-116-reply-accepted.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Mail sync headers-first refresh：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 4
    - 5
    - 7
    - 8
    - 10
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"status-bar\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"quick-connect\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"mail-client-tab\"]"}'
    - step: 11
      expectation: '{"assert_text": {"selector": "[data-testid=\"mail-client-tab\"]", "contains": "Synced", "timeout_sec":
        10}}'
    results:
    - 11
  - id: R2
    requirement: After refresh, open a message and send a reply; acceptance closes the composer and displays Message sent.
    actions: [13, 15, 17, 18]
    checkpoints:
    - step: 14
      expectation: The selected message can be replied to.
    - step: 16
      expectation: The reply composer opens.
    - step: 19
      expectation: The composer closes when sending is accepted.
    - step: 20
      expectation: The mailbox displays Message sent.
    results: [19, 20]
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

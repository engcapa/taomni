id: TC-WS-015
title: Workspace-owned local PTY echoes a command on Linux and Windows
description: 'v6.1 native boundary. A local terminal opened from the Workspaces tab-strip menu starts a real PTY, accepts a synthetic command through xterm''s helper textarea and echoes the exact output line. Sessions mode does not inherit the workspace instance. Linux and Windows only: the macOS WebDriver cannot deliver synthetic text to the WKWebView xterm reliably (TC-WS-012 proves the shell prompt there instead).'
modes:
- native
native_platforms:
- Linux
- Windows
covers:
- F-WS-5
tags:
- p1
- workspace-redesign
- native-boundary
- terminal
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-main-panel"]'
- eval_readonly:
    expression: document.querySelector('.taomni-navigator-frame').getBoundingClientRect().width >= 180
    expect_truthy: true
    timeout_sec: 10
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-menu"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- wait: 2
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_WS_PTY_READY
    submit: true
    verify: &id001
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^\s*QA_WS_PTY_READY\r?\s*$
      timeout_sec: 20
- assert_pattern: *id001
- assert_visible: '[data-testid="workspace-tab"][data-tab-kind="terminal"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_not_visible: '[data-testid="workspace-session-pane"]'
- assert_count:
    selector: '[data-testid="global-session-surface"] [data-testid="terminal-pane"]'
    equal: 0
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- assert_pattern:
    selector: '[data-testid="workspace-session-pane"] [data-testid="terminal-pane"]'
    regex: (?m)^\s*QA_WS_PTY_READY\r?\s*$
    timeout_sec: 20
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_WS_PTY_RETAINED
    submit: true
    verify: &id002
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^\s*QA_WS_PTY_RETAINED\r?\s*$
      timeout_sec: 20
- assert_pattern: *id002
- screenshot: ws-015-workspace-pty-echo.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 工作区本地终端启动真实 PTY 并回显命令结果。
    actions:
    - 1
    - 3
    - 6
    - 8
    - 10
    - 14
    - 11
    checkpoints:
    - step: 2
      expectation: '{"wait_for": {"selector": "[data-testid=\"welcome-panel\"]", "timeout_sec": 60}}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"workspace-main-panel\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"workspace-open-session-menu\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"]"}'
    - step: 12
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"]", "regex": "(?m)^\\s*QA_WS_PTY_READY\\r?\\s*$", "timeout_sec": 20}}'
    - step: 13
      expectation: '{"assert_visible": "[data-testid=\"workspace-tab\"][data-tab-kind=\"terminal\"]"}'
    - step: 15
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 5
      expectation: "{\"eval_readonly\": {\"expression\": \"document.querySelector('.taomni-navigator-frame').getBoundingClientRect().width >= 180\", \"expect_truthy\": true, \"timeout_sec\": 10}}"
    results:
    - 2
    - 4
    - 7
    - 9
    - 13
    - 15
    - 12
    - 5
  - id: R2
    requirement: 离开工作区时终端隐藏且不加入全局标签，返回后保留原 PTY 并可继续使用。
    actions:
    - 18
    - 21
    checkpoints:
    - step: 16
      expectation: '{"assert_not_visible": "[data-testid=\"workspace-session-pane\"]"}'
    - step: 17
      expectation: '{"assert_count": {"selector": "[data-testid=\"global-session-surface\"] [data-testid=\"terminal-pane\"]", "equal": 0}}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"]"}'
    - step: 20
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"workspace-session-pane\"] [data-testid=\"terminal-pane\"]", "regex": "(?m)^\\s*QA_WS_PTY_READY\\r?\\s*$", "timeout_sec": 20}}'
    - step: 22
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"]", "regex": "(?m)^\\s*QA_WS_PTY_RETAINED\\r?\\s*$", "timeout_sec": 20}}'
    results:
    - 16
    - 17
    - 19
    - 20
    - 22
  visual:
  - check: 与 HTML 原型比较圆角框架、紧凑尺寸、无溢出和可用操作入口。
    method: manual
    reason: 保留运行截图供视觉对比，自动断言验证具体布局和状态。
  native:
  - check: 在真实桌面 WebView 验证布局与持久化；终端用例额外验证真实 PTY，编辑器用例验证真实磁盘写入。
    method: automated
    reason: 浏览器存根不能证明 WebKit/WebView2 渲染与原生磁盘、进程行为。

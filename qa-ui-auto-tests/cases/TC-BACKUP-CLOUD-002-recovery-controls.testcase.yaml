id: TC-BACKUP-CLOUD-002
title: Cloud backup failures remain actionable across panel reopening and language changes
description: Operates retry, cancellation, explicit discard, cache cleanup and registration recovery controls through
  the production renderer. Browser uses a seeded IPC model; native uses isolated persisted journals and real filesystem
  mutations. No real Feishu account is needed and no cloud authorization is claimed.
covers:
- F-BACKUP-2
tags:
- backup
- settings
- recovery
- p1
modes:
- browser
- native
fixtures:
- reset_db
- backup_cloud
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- click: '[data-testid="settings-group-toggle-general"]'
- wait_for: '[data-testid="settings-language-en"]'
- click: '[data-testid="settings-language-en"]'
- assert_attribute:
    selector: html
    name: lang
    equals: en
- click: '[data-testid="settings-group-toggle-general"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for: '[data-testid="backup-retry-notice"]'
- assert_text:
    selector: '[data-testid="backup-retry-notice"]'
    contains: Automatic retry
- click: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_waiting_id}"] [data-testid="backup-job-cancel"]'
- wait_for: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_waiting_id}"][data-phase="cancelled"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- click: '[data-testid="settings-group-toggle-backup"]'
- wait_for: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_waiting_id}"][data-phase="cancelled"]'
- assert_not_visible: '[data-testid="backup-retry-notice"]'
- click: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_failed_id}"] [data-testid="backup-job-discard"]'
- assert_text:
    selector: '[data-testid="backup-cloud-job"] [role="alertdialog"]'
    contains: can no longer resume
- click: '[data-testid="backup-discard-confirm"]'
- wait_for: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_failed_id}"][data-phase="discarded"]'
- wait_for: '[data-testid="backup-cache-clean"]:not([disabled])'
- click: '[data-testid="backup-cache-clean"]'
- wait_for:
    selector: '[data-testid="backup-cache-clean"]:not([disabled])'
    timeout_sec: 30
- assert_not_visible: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_completed_id}"] [data-testid="backup-cloud-restore"]'
- assert_visible: '[data-testid="backup-cloud-job"][data-job-id="${fixture.backup_waiting_id}"] [data-testid="backup-job-retry"]'
- click: '[data-testid="backup-cloud-destination"] > summary'
- assert_visible: '[data-testid="backup-connection-recovery"]'
- assert_attribute:
    selector: '[data-testid="backup-restart-application"]'
    name: disabled
    equals: ''
- click: '[data-testid="backup-restart-confirm"]'
- wait_for: '[data-testid="backup-restart-application"]:not([disabled])'
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-zh-CN"]'
- assert_text:
    selector: '[data-testid="backup-restart-application"]'
    contains: 重新开始应用连接
- assert_text:
    selector: '[data-testid="backup-cache-clean"]'
    contains: 清理已完成的本地缓存
- screenshot: backup-recovery-zh.png
- click: '[data-testid="language-switcher"]'
- click: '[data-testid="language-option-en"]'
- assert_text:
    selector: '[data-testid="backup-restart-application"]'
    contains: Restart application connection
- screenshot: backup-recovery-en.png
verification:
  review: reviewed
  visual:
  - check: Recovery actions, errors and cache labels remain readable in both languages.
    method: manual
    reason: Review retained screenshots.
  native:
  - check: Cancelled and discarded journals persist through real IPC; cleanup preserves unfinished artifacts.
    method: automated
    reason: Native fixture seeds isolated disk data and the case operates production commands.
  requirements:
  - id: R1
    requirement: Cancel a waiting retry and restore the cancelled state on reopening.
    actions:
    - 13
    - 15
    - 16
    checkpoints:
    - step: 17
      expectation: Cancelled task persists
    - step: 18
      expectation: Retry countdown is absent
    results:
    - 17
    - 18
  - id: R2
    requirement: Explicit discard and completed-cache cleanup preserve other unfinished tasks.
    actions:
    - 19
    - 21
    - 24
    checkpoints:
    - step: 22
      expectation: Discarded task is terminal
    - step: 26
      expectation: Cleared completed archive no longer offers restore
    - step: 27
      expectation: Other unfinished task remains resumable
    results:
    - 22
    - 26
    - 27
  - id: R3
    requirement: Registration restart requires acknowledgement and all recovery controls follow language changes.
    actions:
    - 31
    - 33
    - 34
    - 38
    - 39
    checkpoints:
    - step: 30
      expectation: Restart disabled before acknowledgement
    - step: 32
      expectation: Restart available after acknowledgement
    - step: 35
      expectation: Recovery action translated to Chinese
    - step: 40
      expectation: Recovery action translated back to English
    results:
    - 30
    - 32
    - 35
    - 40

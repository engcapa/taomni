id: TC-038
title: Welcome panel exposes local-terminal launcher
description: 'Verify the welcome panel renders the "Start local terminal" affordance and

  that clicking it opens a terminal pane. Browser-mode: the local shell is

  faked by the dev-mode stubs; we only check that the UI plumbing reaches

  the terminal pane.

  '
covers:
- F1.6
- F2.4
tags:
- smoke
- p0
- welcome
- local-terminal
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: '[data-testid="welcome-open-local-terminal"]'
- assert_text:
    selector: '[data-testid="welcome-panel"]'
    contains: Start local terminal
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"]'
    timeout_sec: 20
- assert_visible: '[data-testid="terminal-pane"]'
- screenshot: 038-welcome-shell-select.png
verification:
  review: pending
  requirements:
  - id: R1
    requirement: Welcome panel exposes local-terminal launcher：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 7
    checkpoints:
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 5
      expectation: '{"assert_visible": "[data-testid=\"welcome-open-local-terminal\"]"}'
    - step: 6
      expectation: '{"assert_text": {"selector": "[data-testid=\"welcome-panel\"]", "contains": "Start local terminal"}}'
    - step: 8
      expectation: '{"wait_for": {"selector": "[data-testid=\"terminal-pane\"]", "timeout_sec": 20}}'
    - step: 9
      expectation: '{"assert_visible": "[data-testid=\"terminal-pane\"]"}'
    results:
    - 8
    - 9
  - id: workspace-navigation
    requirement: Explicit navigation preserves access to the original workflow in the Workspace-first shell.
    actions:
    - 2
    - 3
    checkpoints:
    - step: 9
      expectation: The original final visible result remains reachable after the navigation migration.
    results:
    - 9
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

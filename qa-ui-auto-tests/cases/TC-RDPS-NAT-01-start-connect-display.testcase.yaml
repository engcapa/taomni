id: TC-RDPS-NAT-01-start-connect-display
title: RDP server starts from Local servers, authenticates NLA, serves frames and input, rejects bad credentials and stops
description: |
  V-14 (docs-feature/rdp-server-parity-design.md, AC-17 retained behaviour).
  The Local servers component tree is opened in the packaged main WebView
  (open_route ?servers=main), the RDP server is configured on a free
  loopback port with disposable credentials from rdp_server_required and
  started through the real Start button (vault-backed password, real IPC).

  rdp-probe, an out-of-process RDP client, then proves the observable
  server contract: NLA succeeds with the configured account, graphics
  updates arrive, clicks injected over RDP reach a host Tk window (the
  helper's own state file counts the flips, independently of server logs),
  a wrong password is refused at authentication, and after Stop the port no
  longer accepts connections. Control approval is disabled here; the
  approval gate itself is covered by a dedicated case.

  On Windows the runner's system Remote Desktop is running, so Start first
  offers it; platform_choice answers "Use Taomni anyway" there and asserts the
  prompt never appears on Linux/macOS. TC-RDPS-NAT-06 covers the rest of the
  Windows branch (system choice, remembered choice).
covers:
- F-RdpServer-1
- F-Servers-1
tags:
- rdp
- rdp-server
- servers
- p1
modes:
- native
fixtures:
- reset_db
- rdp_server_required
- system_rdp_running
timeout_sec: 420
steps:
- open_route: '?servers=main'
- wait_for:
    selector: '[data-testid="servers-dialog"]'
    timeout_sec: 30
- click: '[data-testid="server-row-rdp"]'
- fill:
    selector: '[data-testid="server-field-port"]'
    value: ${env.QA_RDP_PORT}
- fill:
    selector: '[data-testid="server-field-bind-address"]'
    value: 127.0.0.1
- set_check:
    selector: '[data-testid="server-field-auto-stop"]'
    checked: false
- fill:
    selector: '[data-testid="rdp-field-username"]'
    value: ${env.QA_RDP_USER}
- fill:
    selector: '[data-testid="rdp-field-password"]'
    value: ${env.QA_RDP_PASSWORD}
- set_check:
    selector: '[data-testid="rdp-field-control-approval"]'
    checked: false
- click: '[data-testid="server-row-rdp-start"]'
- platform_choice:
    platforms:
    - Windows
    dialog: '[data-testid="choice-dialog"]'
    click: '[data-testid="choice-dialog-secondary"]'
- wait_for:
    selector: '[data-testid="vault-setup-dialog"]'
    timeout_sec: 30
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: ${env.QA_VAULT_PASSWORD}
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: ${env.QA_VAULT_PASSWORD}
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="running"]'
    timeout_sec: 90
- host_helper:
    action: start
    name: target
    mode: flip
    geometry: 480x320+40+80
- rdp_probe:
    scenario: connect
    artifact: probe-connect
    args:
      seconds: 3
    expect:
      negotiated.drdynvc: true
      advertised_codecs:
        equals:
        - remotefx
      graphics_updates:
        min: 1
      desktop.width:
        min: 640
      framebuffer.painted_share:
        min: 0.95
- rdp_probe:
    scenario: connect
    artifact: probe-connect-qoiz
    args:
      seconds: 3
      codecs: remotefx,qoi,qoiz
    expect:
      advertised_codecs:
        contains: qoiz
      framebuffer.painted_share:
        min: 0.95
- rdp_probe:
    scenario: latency
    artifact: probe-latency
    args:
      x: 280
      y: 240
      samples: 10
    expect:
      timeouts:
        max: 2
      latency_ms.count:
        min: 8
- assert_json_file:
    path: target-state.json
    expect:
      flips:
        min: 10
- rdp_probe:
    scenario: connect
    artifact: probe-bad-password
    args:
      password-env: QA_RDP_BAD_PASSWORD
    background: bad-password
- rdp_probe_wait:
    name: bad-password
    expect_exit: 3
    expect:
      error.kind: auth
- assert_text:
    selector: '[data-testid="server-log"]'
    contains: RDP client
    timeout_sec: 15
- click: '[data-testid="server-row-rdp-stop"]'
- wait_for:
    selector: '[data-testid="server-row-rdp"][data-status="stopped"]'
    timeout_sec: 30
- rdp_probe:
    scenario: connect
    artifact: probe-after-stop
    args:
      connect-timeout-sec: 5
    expect_exit: 4
    expect:
      error.kind: connection
- host_helper:
    action: stop
    name: target
verification:
  review: pending
  requirements:
  - id: R1
    requirement: Start launches the RDP listener, NLA with the configured account succeeds and the probe decodes the desktop with both the mstsc codec set and the Taomni client codec set.
    actions:
    - 10
    - 15
    checkpoints:
    - step: 16
      expectation: The RDP row reports data-status=running after the vault master password is set.
    - step: 18
      expectation: With RemoteFX only (mstsc-like) drdynvc is negotiated, graphics arrive and at least 95% of the framebuffer grid is painted.
    - step: 19
      expectation: With RemoteFX, QOI and QOIZ offered (Taomni client) at least 95% of the framebuffer grid is painted.
    results:
    - 18
    - 19
  - id: R2
    requirement: Mouse input sent over RDP reaches a host window and the frame change is observed by the client.
    actions:
    - 20
    checkpoints:
    - step: 20
      expectation: At least 8 of 10 clicks produce an observed pixel change, at most 2 time out.
    - step: 21
      expectation: The host Tk target counted at least 10 flips in its own state file.
    results:
    - 21
  - id: R3
    requirement: A wrong password is rejected at authentication.
    actions:
    - 22
    checkpoints:
    - step: 23
      expectation: The probe exits with code 3 and error kind auth.
    results:
    - 23
  - id: R4
    requirement: Stop closes the listener.
    actions:
    - 25
    checkpoints:
    - step: 26
      expectation: The RDP row reports data-status=stopped.
    - step: 27
      expectation: A new connection fails at the transport (exit 4, kind connection).
    results:
    - 27
  native:
  - check: Real Tauri IPC, vault-backed credential storage, OS screen capture and OS input injection on the runner desktop.
    method: automated
    reason: Only the packaged app can bind the listener, capture the desktop and inject input; browser stubs have no RDP server.
  visual:
  - check: No visual assertion; pixel changes are measured by the probe in the decoded framebuffer.
    method: not-applicable
    reason: The case asserts protocol and input effects, not UI rendering.

id: TC-TAOFFICE-007
title: Navigate, zoom and rotate a PDF in its independent renderer
description: The installed preview manifest loads the packaged renderer. Check real page text, painted canvas pixels, keyboard navigation and the source digest.
modes: [browser]
covers: [F-FILEOPEN-1]
tags: [p0, file-open, taoffice, taoffice-pdf]
fixtures: [reset_db, file_open_files]
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- seed_storage:
    key: taomni.preview.modules.taoffice-pdf.v1
    value: '{"lifecycle":"enabled","values":[]}'
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- dblclick: '[data-testid="explorer-file-row"][data-name="report.pdf"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-page="1"][data-ready="true"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-text"]', contains: Quarterly report}
- assert_text: {selector: '[data-testid="taoffice-pdf-page-count"]', contains: '2'}
- assert_disabled: '[data-testid="taoffice-pdf-previous"]'
- press: {selector: '[data-testid="taoffice-pdf-next"]', key: Enter}
- wait_for: '[data-testid="taoffice-pdf-page"][data-page="2"][data-ready="true"]'
- assert_text: {selector: '[data-testid="taoffice-pdf-text"]', contains: Revenue by region}
- eval_readonly:
    expression: document.querySelector(".taoffice-pdf-page canvas").getContext("2d").getImageData(1, 1, document.querySelector(".taoffice-pdf-page canvas").width - 2, document.querySelector(".taoffice-pdf-page canvas").height - 2).data.includes(0)
    expect_truthy: true
- assert_disabled: '[data-testid="taoffice-pdf-next"]'
- screenshot: pdf-second-page.png
- fill: {selector: '[data-testid="taoffice-pdf-page-number"]', value: '9'}
- press: {selector: '[data-testid="taoffice-pdf-page-number"]', key: Enter}
- wait_for: '[data-testid="taoffice-pdf-page-error"]'
- press: {selector: '[data-testid="taoffice-pdf-page-number"]', key: Escape}
- assert_attribute: {selector: '[data-testid="taoffice-pdf-page-number"]', name: aria-invalid, equals: 'false'}
- click: '[data-testid="taoffice-pdf-previous"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-page="1"][data-ready="true"]'
- click: '[data-testid="taoffice-pdf-rotate"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-page="1"][data-rotation="90"][data-ready="true"]'
- click: '[data-testid="taoffice-pdf-zoom-out"]'
- assert_attribute: {selector: '[data-testid="taoffice-pdf-fit"]', name: aria-pressed, equals: 'false'}
- click: '[data-testid="taoffice-pdf-zoom-in"]'
- click: '[data-testid="taoffice-pdf-fit"]'
- assert_attribute: {selector: '[data-testid="taoffice-pdf-fit"]', name: aria-pressed, equals: 'true'}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: theme}
- click: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-dark"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="taoffice-pdf-page"][data-page="1"][data-rotation="90"][data-ready="true"]'
- eval_readonly:
    expression: getComputedStyle(document.querySelector(".taoffice-pdf")).backgroundColor === getComputedStyle(document.documentElement).getPropertyValue("--taomni-panel-bg").trim() || getComputedStyle(document.querySelector(".taoffice-pdf")).backgroundColor === getComputedStyle(document.querySelector(".module-document")).backgroundColor
    expect_truthy: true
- screenshot: pdf-dark-app.png
- assert_file_open_bytes: {path: '${fixture.file_open_root}/report.pdf', sha256: '${fixture.taoffice_pdf_sha}'}
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="damaged.pdf"]'
- wait_for: '[data-testid="taoffice-pdf-error"]'
- click: '[data-testid="taoffice-pdf-retry"]'
- wait_for: '[data-testid="taoffice-pdf-error"]'
- assert_no_runtime_errors: null

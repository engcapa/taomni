id: TC-MODULES-103
title: Signed MFA switches versions and retains its account in the original desktop process
description: >-
  Install an independently compiled MFA prerelease and create a real HOTP account.
  Download the current signed build from the loopback module catalog. Switch and
  roll back both while disabled and while running. Exercise recovery from a signed
  package whose declared version intentionally fails the production handshake.
  Uninstall and explicitly reinstall, then reopen the same account. The native
  checks record the original desktop process, successive host processes, their
  signed bytes, writer ownership and the encrypted account in the module database.
covers: [F-Modules-1, F-MFA-1, F-MFA-2, F-WS-3]
tags: [modules, mfa, marketplace, lifecycle, native-boundary, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db, module_signed_mfa_archive, module_marketplace, release_build_required]
timeout_sec: 420

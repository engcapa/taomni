verification:
  review: reviewed
  requirements:
  - id: disabled-update-and-rollback
    requirement: Update and roll back the disabled MFA module without starting its host or changing the original account.
    actions: [10, 12, 18, 25, 27, 32, 35, 37, 38, 40, 42, 45, 48, 52]
    checkpoints:
    - {step: 29, expectation: The installed prerelease runs the signed host and saves the original account at counter one.}
    - {step: 34, expectation: Disable releases the original host process and the writer lease.}
    - {step: 36, expectation: The signed module catalog offers the current version for the installed prerelease.}
    - {step: 41, expectation: Verified package review identifies the version pending approval.}
    - {step: 44, expectation: The approved package becomes active while the module remains disabled.}
    - {step: 47, expectation: Rollback selects the prerelease while preserving the disabled preference and account.}
    - {step: 54, expectation: Re-enabling the prerelease starts a new host and reopens the same account.}
    results: [29, 34, 36, 41, 44, 47, 54]
  - id: enabled-update-and-failed-handshake
    requirement: Replace a running MFA host, recover after handshake rejection and roll back in the same desktop process.
    actions: [57, 59, 60, 65, 67, 71, 72, 73, 77, 82, 84]
    checkpoints:
    - {step: 62, expectation: The old host has exited and the current signed host already owns the writer lease.}
    - {step: 68, expectation: The current host advances the original account to counter two.}
    - {step: 75, expectation: The install form reports why the replacement failed.}
    - {step: 76, expectation: The failing package reached verified staging and a replacement of the working host already owns the original account.}
    - {step: 79, expectation: Rollback starts the signed prerelease and releases the current host without replacing the desktop.}
    - {step: 85, expectation: The rolled-back host advances the original account to counter three.}
    results: [62, 68, 75, 76, 79, 85]
  - id: retained-uninstall-and-reinstall
    requirement: Remove version files and the active host on uninstall, then reuse the original account after explicitly reinstalling MFA.
    actions: [88, 89, 95, 100, 101, 102, 104, 108]
    checkpoints:
    - {step: 91, expectation: Settings identifies that user data has been retained.}
    - {step: 92, expectation: "Version directories are gone, the lease is free and the data locator owns the original encrypted account."}
    - {step: 96, expectation: The open manager tab identifies the missing module.}
    - {step: 103, expectation: The explicit signed reinstall completes successfully.}
    - {step: 110, expectation: The new host reuses the original encrypted account and counter on the same desktop.}
    - {step: 111, expectation: The complete lifecycle leaves no renderer runtime errors.}
    results: [91, 92, 96, 103, 110, 111]
  visual:
  - check: The signed catalog offers the MFA version and the offline form displays the handshake failure.
    method: automated
    reason: The case exercises both visible product paths and checks their status controls.
  native:
  - check: Verify the OS process lineage and identity, writer lease, package hashes and actual MFA database at each transition.
    method: automated
    reason: Browser preview cannot establish native package trust, host replacement, or encrypted data retention.

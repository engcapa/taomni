id: TC-SHELL-N23
title: Native immersive and dock changes preserve the real PTY
description: Shell redesign follow-up acceptance. User actions use production controls and commands. Browser stubs
  do not establish native side effects.
covers:
- F-SHELL-1
- F2.1
tags:
- workspace-shell
- p1
modes:
- native
fixtures:
- reset_db
- shell_native_files
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-native-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_IMMERSIVE_BEFORE
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_IMMERSIVE_BEFORE\s*$
    timeout_sec: 20
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_IMMERSIVE_RETAINED
    submit: false
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.immersive.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.immersive.toggle"]'
- assert_not_visible: '[data-testid="app-titlebar"]'
- assert_not_visible: '[data-testid="shell-rail"]'
- assert_not_visible: '[data-testid="status-bar"]'
- press:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    key: Enter
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_IMMERSIVE_RETAINED\s*$
    timeout_sec: 20
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.immersive.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.immersive.toggle"]'
- assert_visible: '[data-testid="app-titlebar"]'
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_IMMERSIVE_BEFORE\s*$
    timeout_sec: 20
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 1
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.rail.top
- click: '[data-testid="shell-action-result"][data-action-id="shell.rail.top"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: top
- &id001
  assert_element_geometry:
    selector: '[data-testid="shell-rail"] > button:not([data-testid="shell-rail-communicate"]):not([data-testid="shell-rail-utility"]):not([data-testid="shell-rail-more"])'
    min_count: 5
    min_width: 32
    min_height: 32
    within_viewport: true
    hit_center: true
- screenshot: native-dock-top.png
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.rail.right
- click: '[data-testid="shell-action-result"][data-action-id="shell.rail.right"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: right
- *id001
- screenshot: native-dock-right.png
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.rail.bottom
- click: '[data-testid="shell-action-result"][data-action-id="shell.rail.bottom"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: bottom
- *id001
- screenshot: native-dock-bottom.png
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.rail.left
- click: '[data-testid="shell-action-result"][data-action-id="shell.rail.left"]'
- assert_attribute:
    selector: '[data-testid="shell-rail"]'
    name: data-edge
    equals: left
- *id001
- screenshot: native-dock-left.png
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.rail.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.rail.toggle"]'
- assert_not_visible: '[data-testid="shell-rail"]'
- press: F1
- wait_for: '[data-testid="shell-action-search"]'
- fill:
    selector: '[data-testid="shell-action-search"]'
    value: shell.rail.toggle
- click: '[data-testid="shell-action-result"][data-action-id="shell.rail.toggle"]'
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_DOCK_AFTER
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA_DOCK_AFTER\s*$
    timeout_sec: 20

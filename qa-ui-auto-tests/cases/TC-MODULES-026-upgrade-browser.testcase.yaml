id: TC-MODULES-026
title: Upgrade preview keeps the VNC owner, retained-file notice and explicit pending result
description: Explicit browser model validates candidate/retained/pending projection, repeated user action and renderer
  reload. It provides no SQLite, filesystem, signature, activation or real-upgrade evidence; TC-MODULES-025 covers the
  native boundary.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- browser
fixtures:
- reset_db
- module_upgrade
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- &id001
  wait_for: '[data-testid="status-bar"]'
- &id002
  click: '[data-testid="ribbon-settings"]'
- &id003
  wait_for: '[data-testid="settings-panel"]'
- &id004
  fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- &id005
  wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- &id006
  assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 1
- &id007
  assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- &id008
  assert_visible: '[data-testid="module-upgrade-retained"]'
- &id009
  assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- &id010
  assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equals: vnc-client
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: Browser preview
- reload_window: null
- *id001
- *id002
- *id003
- *id004
- *id005
- *id006
- *id007
- *id008
- *id009
- *id010
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- wait_for: '[data-testid="module-upgrade-migrate"]:not([disabled])'
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: Browser preview
- assert_no_runtime_errors: null
- screenshot: module-upgrade-pending-browser.png

id: TC-153
title: VNC F8 menu switches picture quality on the RFB fixture and sends F8 to the remote
description: 'Native check for F9.6 against the scriptable VNC fixture (vnc_required):
  on a connected session the menu key opens the session menu instead of reaching the
  remote, Picture quality > Low switches the server to Tight with JPEG quality and a
  higher zlib level, the session keeps painting through a server resize under the new
  encoding, and Send F8 delivers the menu key itself. Native only: the browser-preview
  bridge speaks Raw and ignores picture quality.

  '
covers:
- F9.6
tags:
- vnc
- p1
- session
modes:
- native
fixtures:
- reset_db
- vnc_required
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- click: '[data-testid="session-proto-vnc"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${fixture.vnc_host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${fixture.vnc_port}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-vnc-menu
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-menu"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-vnc-menu"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_VNC_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="vnc-unencrypted-continue"]'
    timeout_sec: 20
- click: '[data-testid="vnc-unencrypted-continue"]'
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1280"][height="720"]'
    timeout_sec: 20
- click: '[data-testid="vnc-canvas"]'
- press:
    key: F8
    selector: '[data-testid="vnc-canvas"]'
- wait_for: '[data-testid="vnc-menu-quality"]'
- hover: '[data-testid="vnc-menu-quality"]'
- click: '[data-testid="vnc-quality-low"]'
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "set_encodings", "encodings": [7, 16, 5, 1, 0, -30, -247'
- host_write_file:
    path: ${fixture.vnc_control}
    text: "resize 1024 768\n"
- wait_for:
    selector: '[data-testid="vnc-canvas"][width="1024"][height="768"]'
    timeout_sec: 15
- press:
    key: F8
    selector: '[data-testid="vnc-canvas"]'
- wait_for: '[data-testid="vnc-menu-send-f8"]'
- click: '[data-testid="vnc-menu-send-f8"]'
- assert_file_contains:
    path: ${fixture.vnc_events}
    contains: '"type": "key", "down": true, "keysym": 65477, "keysym_hex": "0xffc5"'
- screenshot: 153-vnc-low-quality-session.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: On a connected VNC session the menu key (F8) opens the session menu.
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 9
    - 10
    - 12
    - 14
    - 15
    - 17
    - 19
    - 20
    checkpoints:
    - step: 3
      expectation: The session editor opens.
    - step: 8
      expectation: The bookmark section is shown.
    - step: 11
      expectation: The saved VNC session appears in the session tree.
    - step: 13
      expectation: Opening the session without a stored password asks for it.
    - step: 16
      expectation: The connection stops for the unencrypted-connection warning before any credential is sent.
    - step: 18
      expectation: The session paints the fixture's 1280x720 framebuffer.
    - step: 21
      expectation: F8 on the canvas opens the session menu with the Picture quality entry.
    results:
    - 18
    - 21
  - id: R2
    requirement: Picture quality Low asks the server for Tight with JPEG quality 2 and zlib level 9, and the session keeps painting under that encoding.
    actions:
    - 22
    - 23
    - 25
    checkpoints:
    - step: 24
      expectation: The fixture logs SetEncodings with Tight first, the JPEG quality 2 and compression level 9 pseudo-encodings.
    - step: 26
      expectation: After the server resize the canvas paints the new 1024x768 framebuffer sent with the Low encoding.
    results:
    - 24
    - 26
  - id: R3
    requirement: Send F8 in the session menu delivers the menu key to the remote desktop.
    actions:
    - 27
    - 29
    checkpoints:
    - step: 28
      expectation: F8 opens the session menu again with the Send F8 entry.
    - step: 30
      expectation: The fixture logs an F8 key press.
    results:
    - 28
    - 30
  visual:
  - check: The session shows the fixture desktop at 1024x768 with Low-quality JPEG artefacts acceptable and no menu or overlay left open.
    method: manual
    reason: DOM and event-log assertions do not judge the rendered pixels.
  native:
  - check: Drives the Rust RFB client, the quality controller and the Tight/JPEG decoder against the fixture; WebDriver key and pointer actions stay inside the WebView.
    method: automated
    reason: System-level keyboard capture, OS input and real VNC servers stay covered by the VNC skill's native scenarios.

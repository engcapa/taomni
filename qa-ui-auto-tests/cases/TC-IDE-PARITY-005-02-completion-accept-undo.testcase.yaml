id: TC-IDE-PARITY-005-02
title: Java Basic Completion accept, snippet navigation, atomic import and single undo
description: 'ED-PARITY-005 V2 (A1/A2/A3) browser case against fixture B-005 / M0. Every round resets to the same preimage and asserts the complete document through the real editor: Enter and Tab accept the same candidate with different provider range intent (insert keeps the word suffix, replace rewrites it), the mouse accepts a second candidate exactly once, primary + import land in one dispatch with dirty=true and no duplicated newline/indent, and ONE undo restores the exact preimage (redo returns the postimage). Snippet tabstops are pure navigation and add no history. The empty placeholder variant proves the caret exits after '')''. Narrow-window/caret-at-edge layout is recorded as a manual visual check because the runner has no viewport-resize verb.'
covers:
- F25.5
tags:
- code-workspace
- completion
- ed-parity-005
- browser-gate
- p1
modes:
- browser

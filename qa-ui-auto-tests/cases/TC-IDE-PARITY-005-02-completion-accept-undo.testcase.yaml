id: TC-IDE-PARITY-005-02
title: Completion accept via Enter Tab mouse, snippet navigation and single undo (browser)
description: 'ED-PARITY-005 V2 (A1/A2/A3) browser gate case. Drives real live-template completions through
  three accept paths on the same prefix: Enter accepts, Tab accepts, mouse click accepts; each lands exactly
  once and one Ctrl+Z restores the exact prefix. A snippet placeholder template (soutv) proves pure Tab/Shift+Tab
  navigation with zero document change before the final Undo. Mid-word Enter/Tab dual-range semantics
  are unit-proven (CodeMirrorHost.parity005 + lspCompletion ED-PARITY-005 tests); the browser live-template
  path has no InsertReplaceEdit provider range, so both keys accept the same text here and the test asserts
  that honestly instead of faking an IDEA suffix split. Highest green claim: L1 browser accept/undo wiring
  on all three entries.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-005
- completion
- accept-undo
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 300

id: TC-IDE-PARITY-005-02-completion-accept-undo
title: Basic Completion accept range, import transaction and one undo
description: 'ED-PARITY-005 V2. With the caret inside a word whose tail the provider

  never saw (StringUti|Suffix), Enter and the mouse keep that tail while Tab

  consumes the whole identifier, and each acceptance lands the primary edit and

  its import in one transaction that a single undo reverts. The browser provider

  is the parity005_completion stub, so this proves the renderer acceptance chain

  (intent -> provider range -> one dispatch -> history) and not real JDT LS

  semantics; the real provider is TC-IDE-PARITY-005-05.

  '
covers:
- F25.5
tags:
- code-workspace
- parity005
- completion
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
- parity005_completion
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-dir"][data-path="parity005"]'
    timeout_sec: 30
- dblclick: '[data-testid="code-workspace-tree-dir"][data-path="parity005"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="parity005/Main.java"]'
    timeout_sec: 30
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="parity005/Main.java"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- wait_for:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    timeout_sec: 30
- click: '[data-testid="code-workspace-editor"] .cm-content'
# Reset to the exact Tmid preimage: whole line selected, then retyped as the
# prefix. Control+Home and Shift+End avoid Smart-Home ambiguity.
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUti'
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUti
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
- assert_text:
    selector: .cm-tooltip-autocomplete
    contains: StringUtils
- screenshot: parity005-02-enter-list.png
# Round 1 - Enter keeps the word suffix (provider insert range).
- press: Enter
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtilsSuffix;
- eval_readonly:
    expression: "document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    contains: 'true'
- screenshot: parity005-02-enter-accepted.png
# One acceptance, one undo: body and import revert together.
- press: Control+z
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;
- eval_readonly:
    expression: "document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    contains: 'false'
- screenshot: parity005-02-enter-undone.png
# Round 2 - Tab replaces the whole identifier (provider replace range).
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUtiSuffix;'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUti'
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
- press: Tab
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtils;
- eval_readonly:
    expression: "document.querySelector('.cm-content').innerText.includes('StringUtilsSuffix')"
    contains: 'false'
- eval_readonly:
    expression: "document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    contains: 'true'
- screenshot: parity005-02-tab-accepted.png
- press: Control+z
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;
# Round 3 - a real double click on the candidate accepts like Enter.
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+Home
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: ArrowDown
- press: Shift+End
- type: '        StringUti'
- press: Control+Space
- wait_for:
    selector: .cm-tooltip-autocomplete li
    timeout_sec: 30
- click: .cm-tooltip-autocomplete li
- dblclick: .cm-tooltip-autocomplete li
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtilsSuffix;
- eval_readonly:
    expression: "document.querySelector('.cm-content').innerText.includes('import org.apache.commons.lang3.StringUtils;')"
    contains: 'true'
- screenshot: parity005-02-mouse-accepted.png
- press: Control+z
- wait: 1
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: StringUtiSuffix;

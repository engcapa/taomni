id: TC-IDE-PARITY-005-02
title: Java Basic Completion accept, range intent, snippet and one undo
description: 'ED-PARITY-005 V2 (A1/A2/A3), browser with the controlled parity provider.

  Enter, Tab and mouse accept the controlled provider item with the frozen range

  intent (insert vs replace), the import lands in the same single dispatch, one

  undo restores the exact preimage and Redo/Undo keep working. The mid-word M0

  fixture separates Enter (keeps the suffix) from Tab (replaces it); a plain

  provider range widens only for the safe Java case; a string literal and a

  contradictory dual range never guess a range. Snippet fields navigate with no

  document edit and the acceptance is still exactly one undo step.

  Boundary: mocked IPC provider — renderer transaction semantics, not real

  JDT LS candidates or host bytes.

  '

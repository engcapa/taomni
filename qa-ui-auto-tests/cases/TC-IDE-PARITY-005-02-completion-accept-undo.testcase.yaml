verification:
  review: reviewed
  requirements:
    - id: ED-PARITY-005-V2-atomic
      requirement: Enter lands exact primary plus import in one edit; one Undo restores B1 and Redo restores B2.
      actions: [14, 19, 22, 24, 26]
      checkpoints:
        - step: 20
          expectation: Complete B2 text includes one import and snippet expansion.
        - step: 21
          expectation: First placeholder is selected.
        - step: 23
          expectation: One Undo restores exact B1.
        - step: 25
          expectation: Redo restores the accepted text.
        - step: 27
          expectation: A second Undo restores the prefix.
      results: [20, 21, 23, 25, 27]
    - id: ED-PARITY-005-V2-tabstops
      requirement: Tab acceptance and subsequent placeholder navigation do not add a document edit.
      actions: [28, 31, 34, 36, 38, 39, 41]
      checkpoints:
        - step: 32
          expectation: Tab accepts the same primary and import.
        - step: 33
          expectation: First placeholder is selected.
        - step: 35
          expectation: Tab selects the second placeholder.
        - step: 37
          expectation: Shift Tab returns to the first placeholder.
        - step: 40
          expectation: Navigation left the text unchanged.
        - step: 42
          expectation: One Undo after navigation restores exact B1.
      results: [32, 33, 35, 37, 40, 42]
    - id: ED-PARITY-005-V2-mouse
      requirement: First click selects the provider item; double click accepts once and one Undo restores B1.
      actions: [43, 45, 47, 49]
      checkpoints:
        - step: 46
          expectation: Single click has not edited the prefix.
        - step: 48
          expectation: Double click accepted the full snippet.
        - step: 50
          expectation: One Undo restores the prefix.
      results: [46, 48, 50]
    - id: ED-PARITY-005-V2-mid-enter
      requirement: Enter at Tmid uses the insert range, retaining Suffix and adding exactly one import; one Undo restores M0.
      actions: [52, 56, 59, 74, 78, 80, 82, 84]
      checkpoints:
        - step: 58
          expectation: Mid.java starts at exact M0.
        - step: 73
          expectation: The caret is after StringUti and before Suffix.
        - step: 76
          expectation: The selected item has the required package identity.
        - step: 80
          expectation: Enter produces complete StringUtilsSuffix plus one import.
        - step: 82
          expectation: One Undo restores exact M0.
        - step: 84
          expectation: Redo restores the insert result.
        - step: 86
          expectation: Undo returns to the original token.
      results: [58, 73, 76, 80, 82, 84, 86]
    - id: ED-PARITY-005-V2-mid-tab
      requirement: Tab at Tmid uses the replace range and one Undo restores M0.
      actions: [86, 89, 91]
      checkpoints:
        - step: 91
          expectation: Tab replaces the full identifier suffix and lands one import.
        - step: 93
          expectation: One Undo restores exact M0.
      results: [91, 93]
    - id: ED-PARITY-005-V2-mid-mouse
      requirement: Single click selects without editing; double click uses the insert range and one Undo restores M0.
      actions: [95, 98, 100, 102]
      checkpoints:
        - step: 93
          expectation: Undo restored the word-middle caret for the next round.
        - step: 99
          expectation: Single click retains M0.
        - step: 101
          expectation: Double click produces complete StringUtilsSuffix plus one import.
        - step: 103
          expectation: One Undo restores exact M0.
      results: [93, 99, 101, 103]
    - id: ED-PARITY-005-V2-empty-placeholder
      requirement: A controlled empty snippet placeholder starts inside the call, Tab reaches the final stop without an edit, and one Undo restores B1.
      actions: [105, 106, 110, 113, 121, 124, 127, 129, 131, 133]
      checkpoints:
        - step: 112
          expectation: Main.java is restored to exact B1 before the variant.
        - step: 125
          expectation: The provider's empty placeholder expands to StringBuilder() with one import.
        - step: 126
          expectation: The caret begins inside the empty parentheses.
        - step: 128
          expectation: Tab moves to the final stop after the closing parenthesis.
        - step: 130
          expectation: Shift Tab returns to the empty placeholder without editing.
        - step: 132
          expectation: Navigation left the full accepted text unchanged.
        - step: 134
          expectation: One Undo returns to exact B1.
      results: [112, 125, 126, 128, 130, 132, 134]
    - id: ED-PARITY-005-V2-nonfirst
      requirement: Keyboard and mouse select different non-first raw items, each resolving its own import and remaining one-Undo recoverable.
      actions: [136, 138, 141, 144, 146, 148, 151, 154]
      checkpoints:
        - step: 139
          expectation: ArrowDown selects StringBuffer.
        - step: 142
          expectation: StringBuffer lands only its matching import and text.
        - step: 143
          expectation: The resolve raw identity remains parity005-buffer-2.
        - step: 145
          expectation: One Undo restores B1.
        - step: 149
          expectation: A single click selects StringJoiner without editing.
        - step: 150
          expectation: The editor still contains the original prefix before double-click.
        - step: 152
          expectation: StringJoiner lands only its matching import and text.
        - step: 153
          expectation: The resolve raw identity remains parity005-joiner-3.
        - step: 155
          expectation: One Undo restores B1.
      results: [139, 142, 143, 145, 149, 150, 152, 153, 155]
    - id: ED-PARITY-005-V2-narrow
      requirement: At 950 by 390 the completion list stays within the viewport and Escape leaves the buffer intact.
      actions: [156, 157, 161]
      checkpoints:
        - step: 159
          expectation: The popup rectangle is fully within the viewport.
        - step: 162
          expectation: Escape leaves B1 untouched.
      results: [159, 162]
    - id: ED-PARITY-005-V2-shared-history
      requirement: Two UI views of Main.java show the same atomic acceptance; Undo from the sibling view restores both and removes the import.
      actions: [164, 174, 177, 180, 181]
      checkpoints:
        - step: 165
          expectation: The split exposes two editor views.
        - step: 178
          expectation: Both views show the same single import.
        - step: 179
          expectation: Both views show the accepted snippet text.
        - step: 182
          expectation: One Undo in the sibling view restores the prefix in both views.
        - step: 183
          expectation: The import is absent from both views after Undo.
      results: [165, 178, 179, 182, 183]
  visual:
    - check: Selected row, documentation, popup anchor, density and clipping against IDEA R1/R2/R6.
      method: manual
      reason: Image review and comparable viewport settings are required beyond DOM assertions.
  native:
    - check: Real provider raw item, Rust resolve and host file bytes.
      method: external
      reason: Case 005-05 owns these boundaries; B-005 is a controlled browser response.

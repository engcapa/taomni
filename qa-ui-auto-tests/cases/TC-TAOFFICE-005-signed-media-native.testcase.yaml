id: TC-TAOFFICE-005
title: Install the signed TaOffice Media module and decode a local WAV
description: Enable the package through the store, read metadata in the native WebView and disable the renderer with the file still open.
modes: [native]
covers: [F-FILEOPEN-1, F-Modules-1]
tags: [p0, file-open, taoffice, media, native-boundary]
fixtures: [reset_db, file_open_files, taoffice_signed_media]
timeout_sec: 210
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.media_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.media_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- click: '[data-testid="module-action-enable-taoffice-video"]'
- wait_for: '[data-testid="module-action-disable-taoffice-video"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- dblclick: '[data-testid="explorer-file-row"][data-name="sample.wav"]'
- wait_for: '[data-testid="taoffice-media-player"][data-ready="true"][controls]'
- eval_readonly:
    expression: document.querySelector("audio").duration > 0
    expect_truthy: true
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-taoffice-video"]'
- wait_for: '[data-testid="module-action-enable-taoffice-video"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="document-module-state"]'
- assert_count: {selector: '[data-testid="taoffice-media-player"]', equal: 0}
- assert_no_runtime_errors: null

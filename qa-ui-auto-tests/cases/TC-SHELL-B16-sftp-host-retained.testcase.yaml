id: TC-SHELL-B16
title: SFTP host hide and owner switching retain one connection
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b16.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F7.4
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="shell-host"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_attribute:
    selector: '[data-testid="shell-host"]'
    name: data-edge
    equals: right
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_count:
    selector: '[data-testid="tab-item"]'
    equal: 2
- click: '[data-testid="shell-host-hide"]'
- assert_not_visible: '[data-testid="shell-host"]'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_shell_backend:
    command: sftp_attach
    count: 1
    status: requested
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-b"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- assert_not_visible: '[data-testid="shell-host"]'
- click: '[data-testid="tab-item"]:has-text("qa-alpha")'
- wait_for: '[data-testid="sftp-remote-list"]'
- assert_count:
    selector: '[data-testid="sftp-browser"]'
    equal: 1
- assert_shell_backend:
    command: sftp_attach
    count: 1
    status: requested
- screenshot: tc-shell-b16.png

id: TC-SHOT-013
title: Undo and redo work across different annotation tool types
covers:
- F27.1
tags:
- screenshot
- annotate
- p2
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
# Draw with three different tools: rect, ellipse, arrow.
- click: '[data-testid="screenshot-tool-rect"]'
- wait: 1
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position: {x: 100, y: 100}
- wait: 1
- click: '[data-testid="screenshot-tool-ellipse"]'
- wait: 1
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position: {x: 250, y: 150}
- wait: 1
- click: '[data-testid="screenshot-tool-arrow"]'
- wait: 1
- click:
    selector: '[data-testid="screenshot-annotation-layer"]'
    position: {x: 400, y: 200}
- wait: 1
# Undo all three, redo all three.
- click: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-undo"]'
- click: '[data-testid="screenshot-undo"]'
- assert_disabled: '[data-testid="screenshot-undo"]'
- assert_enabled: '[data-testid="screenshot-redo"]'
- click: '[data-testid="screenshot-redo"]'
- click: '[data-testid="screenshot-redo"]'
- click: '[data-testid="screenshot-redo"]'
- assert_enabled: '[data-testid="screenshot-undo"]'
- assert_disabled: '[data-testid="screenshot-redo"]'
- click: '[data-testid="screenshot-cancel"]'
- wait_for:
    selector: '[data-testid="system-screenshot"]'

id: TC-SHOT-003
title: Scroll preview directly exposes annotations while preserving aspect ratio and full-size output
description: Tall 400x1800 browser fixture checks preview geometry and export dimensions; native N12 owns actual
  stitching and OS scrolling.
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position:
      x: 100
      y: 100
    to_position:
      x: 500
      y: 400
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position:
      x: 160
      y: 160
    to_position:
      x: 300
      y: 260
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- wait_for: '[data-testid="screenshot-scroll-confirm"]'
- assert_text:
    selector: '[data-testid="screenshot-scroll-instructions"]'
    contains: Choose automatic or manual
- click: '[data-testid="screenshot-scroll-confirm-cancel"]'
- assert_not_visible: '[data-testid="screenshot-scroll-confirm"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- assert_visible: '[data-testid="screenshot-scroll-mode-manual"]:checked'
- click: '[data-testid="screenshot-scroll-mode-auto"]'
- click: '[data-testid="screenshot-scroll-start"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="preview"]'
- assert_not_visible: '[data-testid="screenshot-selection"]'
- assert_visible: '[data-testid="screenshot-toolbar"]'
- assert_not_visible: '[data-testid="screenshot-scroll-busy"]'
- assert_visible: '[data-testid="screenshot-scroll-result"]'
- assert_attribute:
    selector: '[data-testid="screenshot-annotation-canvas"]'
    name: data-shapes
    equals: '0'
- assert_text:
    selector: '[data-testid="screenshot-scroll-result-meta"]'
    contains: 400 × 1800
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-2).cmd === "screenshot_scroll_capture" && JSON.stringify(window.__taomniStubScreenshotCalls.at(-2).args)
      === '{"displayId":"0,0","x":40,"y":40,"width":160,"height":120,"mode":"auto"}'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_overlay_update" && window.__taomniStubScreenshotCalls.at(-1).args.width
      === 400 && window.__taomniStubScreenshotCalls.at(-1).args.height === 1800
- eval_readonly:
    expression: Math.abs(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().width
      / document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().height
      - 400 / 1800) < 0.001
- click: '[data-testid="screenshot-scroll-actual"]'
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().width
      === 400
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().height
      === 1800
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-viewport\"]").scrollHeight
      > document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-viewport\"]").clientHeight
- click: '[data-testid="screenshot-scroll-fit"]'
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().height
      <= document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-viewport\"]").clientHeight
- eval_readonly:
    expression: document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().width
      <= 400
- screenshot: scroll-result-fit.png
- wait_for: '[data-testid="screenshot-toolbar"]'
- assert_disabled: '[data-testid="screenshot-undo"]'
- assert_disabled: '[data-testid="screenshot-redo"]'
- eval_readonly:
    expression: Math.abs(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().width
      / document.querySelector("[data-testid" + String.fromCharCode(61) + "\"screenshot-scroll-result-image\"]").getBoundingClientRect().height
      - 400 / 1800) < 0.001
- click: '[data-testid="screenshot-scroll-result-copy"]'
- wait_for: '[data-testid="system-screenshot"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-3).cmd === "screenshot_save_data_url" && window.__taomniStubScreenshotCalls.at(-3).args.width
      === 400 && window.__taomniStubScreenshotCalls.at(-3).args.height === 1800
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- click: '[data-testid="screenshot-scroll-mode-auto"]'
- click: '[data-testid="screenshot-scroll-start"]'
- wait_for: '[data-testid="screenshot-scroll-result"]'
- click: '[data-testid="screenshot-scroll-result-save"]'
- wait_for: '[data-testid="text-input-dialog"]'
- fill:
    selector: '[data-testid="text-input-dialog-input"]'
    value: long-capture.png
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="system-screenshot"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-2).cmd === "screenshot_save_image" && window.__taomniStubScreenshotCalls.at(-2).args.dest
      === "long-capture.png"
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- click: '[data-testid="screenshot-scroll-mode-auto"]'
- click: '[data-testid="screenshot-scroll-start"]'
- wait_for: '[data-testid="screenshot-scroll-result"]'
- click: '[data-testid="screenshot-scroll-result-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).includes('"cmd":"screenshot_pin_to_screen"')
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- click: '[data-testid="screenshot-scroll-mode-auto"]'
- click: '[data-testid="screenshot-scroll-start"]'
- wait_for: '[data-testid="screenshot-scroll-result"]'
- click: '[data-testid="screenshot-scroll-result-close"]'
- wait_for: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: capture
    requirement: Selected physical region dispatches correctly; confirmation can be cancelled before start; prior
      marks are cleared. Manual mode is selected by default before explicitly choosing automatic capture.
    actions:
    - 1
    - 2
    - 4
    - 6
    - 7
    - 9
    - 12
    - 14
    - 16
    - 17
    checkpoints:
    - step: 8
      expectation: Original mark exists
    - step: 11
      expectation: Instructions visible
    - step: 13
      expectation: Cancel closes instructions
    - step: 15
      expectation: Manual mode is checked on the first confirmation.
    - step: 18
      expectation: Result preview opens
    - step: 19
      expectation: No selection frame
    - step: 20
      expectation: Annotation toolbar immediately available
    - step: 21
      expectation: No busy state
    - step: 22
      expectation: Result is visible
    - step: 23
      expectation: Old marks cleared
    - step: 25
      expectation: Crop IPC is exact
    - step: 26
      expectation: Tall result metadata is stored
    results:
    - 8
    - 11
    - 13
    - 15
    - 18
    - 19
    - 20
    - 21
    - 22
    - 23
    - 25
    - 26
  - id: preview
    requirement: Fit and original-size views preserve proportions and stay readable.
    actions:
    - 28
    - 32
    checkpoints:
    - step: 24
      expectation: Native dimensions shown
    - step: 27
      expectation: Uniform aspect ratio
    - step: 29
      expectation: 100% image with scrollable viewport
    - step: 30
      expectation: 100% image with scrollable viewport
    - step: 31
      expectation: 100% image with scrollable viewport
    - step: 33
      expectation: Fit stays inside viewport without upscaling
    - step: 34
      expectation: Fit stays inside viewport without upscaling
    results:
    - 24
    - 27
    - 29
    - 30
    - 31
    - 33
    - 34
  - id: output
    requirement: Continue annotation directly and copy full natural dimensions.
    actions:
    - 40
    checkpoints:
    - step: 36
      expectation: Toolbar opens
    - step: 37
      expectation: Undo cleared
    - step: 38
      expectation: Redo cleared
    - step: 39
      expectation: Annotation image keeps aspect ratio
    - step: 41
      expectation: Copy closes tool
    - step: 42
      expectation: Export remains 400x1800
    results:
    - 36
    - 37
    - 38
    - 39
    - 41
    - 42
  - id: preview-actions
    requirement: Preview Save uses the chosen filename; Pin opens the captured image; Close exits directly.
    actions:
    - 43
    - 50
    - 52
    - 53
    - 56
    - 63
    - 66
    - 68
    - 75
    checkpoints:
    - step: 55
      expectation: Save dispatched to long-capture.png
    - step: 64
      expectation: Pinned image appears
    - step: 65
      expectation: Pin IPC dispatched
    - step: 67
      expectation: Pin closes
    - step: 76
      expectation: Result closes without another selection
    results:
    - 55
    - 64
    - 65
    - 67
    - 76
  visual:
  - check: Text, menu and result layout
    method: automated
    reason: Geometry, font style, visible states and retained screenshots establish the described renderer layout.
  native:
  - check: Packaged WebView, OS capture and clipboard
    method: external
    reason: Native SHOT-N3 and N12 exercise real capture/clipboard and three packaged WebViews. Browser stubs do
      not establish OS behavior.

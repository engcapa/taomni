id: TC-SHOT-003
title: Scroll capture stitches a tall image and refreshes the overlay
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- drag_to:
    from: '[data-testid="screenshot-base-image"]'
    to: '[data-testid="screenshot-base-image"]'
    from_position:
      x: 40
      y: 40
    to_position:
      x: 200
      y: 180
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-scroll-capture"]'
# The stubbed backend resolves fast; the busy indicator is transient.
# Verify the stitched result and the backend call instead.
- wait_for:
    selector: '[data-testid="screenshot-base-image"]'
    timeout_sec: 30
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls || []).includes("screenshot_scroll_capture")

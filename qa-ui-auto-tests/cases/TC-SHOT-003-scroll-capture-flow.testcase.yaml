id: TC-SHOT-003
title: Scroll capture stitches a tall image and refreshes the overlay
covers:
- F27.1
tags:
- screenshot
- scroll-capture
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-base-image"]'
- drag_to:
    from: '[data-testid="screenshot-base-image"]'
    to: '[data-testid="screenshot-base-image"]'
    from_position:
      x: 40
      y: 40
    to_position:
      x: 360
      y: 260
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-scroll-capture"]'
- wait_for: '[data-testid="screenshot-scroll-busy"]'
- wait_for:
    selector: '[data-testid="screenshot-base-image"]'
    timeout_sec: 30
- assert_not_visible: '[data-testid="screenshot-scroll-busy"]'
- eval_readonly:
    expression: JSON.stringify(window.__tauriStubScreenshotCalls || []).includes("screenshot_scroll_capture")

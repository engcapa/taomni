id: TC-WS-069
title: Mixed file tabs switch responsively and preserve an unsaved draft
description: Open five txt/log/csv/JSON tabs including the public 193KiB long-line document. Edit a plain-text draft, switch through every other tab and
  back twice, retaining every activation frame with a 165ms gap budget and 1500ms exact-content budget. JSON still requires syntax highlighting. Save, close
  and reopen the exact draft and require zero automatic SDK/LSP discovery.
  Every activation/key frame allows at most 165ms (150ms baseline plus the user-approved 10% tolerance); all raw samples are retained.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
- F11.2
tags:
- p0
- workspace-redesign
- file-explorer
- regression
- performance
fixtures:
- reset_db
- workspace_language_files
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-plain-files
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- assert_language_startup:

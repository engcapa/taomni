id: TC-IDE-C0-03
title: Continuous typing latency on 1 MiB text, degraded 5 MiB mode, small-doc no-regression
description: 'ED-AUDIT-005 native measurement slice. Three deterministic plain-text

  fixtures (exactly 1 MiB, exactly 5 MiB, and a small document, all Java-like

  multi-line) are provisioned in a fresh host directory and opened in the

  packaged editor. Plain .txt keeps every language server out of the

  measurement, so the recorded keydown-to-DOM latency is the production

  editor chain itself: CodeMirror transaction -> CodeMirrorHost update

  listener -> shared-document owner -> queueEditorTextUpdate -> debounced

  store flush. The 1 MiB file stays under both large-file thresholds and is

  measured in full editing mode: 24-key warmup, then two repeated 200-key

  groups (N=400 measured keys). The 5 MiB file crosses the large-file

  downgrade thresholds; the case asserts the degraded-mode indicator and

  measures it separately (24-key warmup plus four 100-key groups) so the two

  modes are never mixed. The small document proves ordinary edits do not

  regress with the full per-key DOM capture enabled. After typing, the caret

  position, the saved disk bytes (SHA-256 of base content plus the typed

  suffix), and undo (the shared-document owner pops one entry per keystroke,

  so four undos remove exactly the last four typed chars and the next save

  lands exactly those bytes) prove semantics and history are unharmed. The

  per-group max_p95_ms values are

  responsiveness guardrails, not budgets: the measured p50/p95/max raw

  samples per group are the evidence, and no absolute budget is claimed.

  Highest claim on green: L1 native performance measurement of the real

  input chain.

  '

id: TC-TAOFFICE-002
title: Core opens a TSV table and switches the same document to Notepad source
description: Verify quoted punctuation and multiline cells from an isolated file and use the source button from the keyboard.
modes: [browser, native]
covers: [F-FILEOPEN-1, F-EXPLORER-1]
tags: [p0, taoffice, file-open, core-only]
fixtures: [reset_db, file_open_files]
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- dblclick: '[data-testid="explorer-file-row"][data-name="records.tsv"]'
- wait_for: '[data-testid="delimited-table"] td'
- assert_items:
    selector: '[data-testid="delimited-table"] td'
    equals: [City, Note, Tokyo, 'Metro, East', Paris, "Line 1\nLine 2"]
- press:
    selector: '[data-testid="delimited-source"]'
    key: Enter
- wait_for: '[data-testid="viewer-editor"] .cm-content'
- assert_text:
    selector: '[data-testid="viewer-editor"] .cm-content'
    contains: '"Metro, East"'
- assert_count:
    selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"]'
    equal: 1
- assert_no_runtime_errors: null

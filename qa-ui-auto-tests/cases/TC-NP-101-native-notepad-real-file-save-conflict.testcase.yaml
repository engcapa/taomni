id: TC-NP-101
title: Native Notepad edits real files, saves exact bytes and resolves external changes
description: 'AC-01/AC-09/AC-48: text files opened from the real Explorer now mount the Notepad workbench; Save writes real
  host bytes through viewer_write_text, external edits surface the conflict banner, reload applies disk content and Keep My
  Version saves the buffer. Browser stubs cannot prove host writes, hashes or conflict detection, so this case is native only.'
modes:
- native
native_platforms:
- Linux
- Windows
- macOS
covers:
- F-NOTEPAD-5
tags:
- p0
- notepad
- native
- file-open
- conflict
- crash-regression
fixtures:
- reset_db
- file_open_files
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-notepad-native-save
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press:
    selector: '[data-testid="explorer-tab"][data-active="true"]'
    key: Control+l
    macos_key: Meta+l
- fill:
    selector: '[data-testid="explorer-address"]'
    value: ${fixture.file_open_root}
- press:
    selector: '[data-testid="explorer-address"]'
    key: Enter
- wait_for: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="notes.txt"]'
- wait_for: '[data-testid="file-viewer"][data-kind="text"] [data-testid="notepad-workbench"]'
- wait_for: '[data-testid="notepad-menubar"]'
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - File open original
    - Second line
    - 中文
    - ''
- click: '[data-testid="viewer-editor"] .cm-content'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+a
    macos_key: Meta+a
- type: 'Notepad native save'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+s
    macos_key: Meta+s
- assert_file_contains:
    path: ${fixture.file_open_root}/notes.txt
    contains: Notepad native save
    timeout_sec: 20
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/notes.txt
    equals: Notepad native save
- click: '[data-testid="viewer-editor"] .cm-content'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+a
    macos_key: Meta+a
- type: 'Mine unsaved buffer'
- host_write_file:
    path: ${fixture.file_open_root}/notes.txt
    text: 'External note version'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+s
    macos_key: Meta+s
- wait_for: '[data-testid="viewer-conflict"]'
- assert_file_contains:
    path: ${fixture.file_open_root}/notes.txt
    contains: External note version
- assert_items:
    selector: '[data-testid="viewer-editor"] .cm-line'
    equals:
    - Mine unsaved buffer
- click: '[data-testid="viewer-keep"]'
- press:
    selector: '[data-testid="viewer-editor"] .cm-content'
    key: Control+s
    macos_key: Meta+s
- assert_file_open_bytes:
    path: ${fixture.file_open_root}/notes.txt
    equals: Mine unsaved buffer
- assert_no_runtime_errors: null

verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Workspace has one Git rail entry; it still opens the full multi-repository Git panel.
    actions:
    - 8
    - 12
    checkpoints:
    - step: 10
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-git\"]", "equal": 1}}'
    - step: 11
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-bottom-tab-git\"]", "equal": 0}}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"workspace-change-row\"][data-repo-root$=\"repo-b\"][data-path=\"same.txt\"]"}'
    results:
    - 10
    - 11
    - 14
  - id: R2
    requirement: Changes copies the clicked repo-b file absolute and repository-relative paths, preserving Git actions.
    actions:
    - 16
    - 18
    - 25
    - 26
    checkpoints:
    - step: 17
      expectation: '{"assert_menu_items": ["Stage", "Unstage", "Copy Path", "Copy Relative Path", "Reveal in Explorer", "Open in Terminal"]}'
    - step: 20
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "contains": "repo-b"}}'
    - step: 22
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"git-commit-message\"]'').value.split(String.fromCharCode(92)).join(''/'')
        === \"${fixture.parity008_root}/repo-b/same.txt\"", "expect_truthy": true}}'
    - step: 28
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "equals": "same.txt"}}'
    - step: 30
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''[data-testid'' + String.fromCharCode(61) + ''\"git-commit-message\"]'').value
        === \"same.txt\"", "expect_truthy": true}}'
    results:
    - 17
    - 20
    - 22
    - 28
    - 30
  - id: R3
    requirement: Changes opens the containing directory (or reports the explicit browser limitation) and a terminal at repo-b, then returns to Git.
    actions:
    - 32
    - 33
    - 35
    - 36
    checkpoints:
    - step: 34
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar-message\"]", "contains": "Opened "}}'
    - step: 37
      expectation: '{"wait_for": "[data-testid=\"workspace-tab\"][data-tab-kind=\"terminal\"][data-active=\"true\"]"}'
    - step: 40
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"]", "regex": "(?m)^[^\\r\\n]*[/\\\\]repo-b\\s*$",
        "timeout_sec": 20}}'
    results:
    - 34
    - 37
    - 40
  - id: R4
    requirement: Git Log file actions resolve the selected commit repository and expose all four operations, including a real local PTY in native mode.
    actions:
    - 43
    - 51
    - 53
    - 63
    - 64
    - 73
    - 74
    - 78
    checkpoints:
    - step: 52
      expectation: '{"assert_menu_items": ["Copy Path", "Copy Relative Path", "Reveal in Explorer", "Open in Terminal"]}'
    - step: 55
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "contains": "repo-b"}}'
    - step: 57
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''input[aria-label'' + String.fromCharCode(61) + ''\"Filter messages\"]'').value.split(String.fromCharCode(92)).join(''/'')
        === \"${fixture.parity008_root}/repo-b/same.txt\"", "expect_truthy": true}}'
    - step: 66
      expectation: '{"host_clipboard": {"action": "assert", "kind": "text", "equals": "same.txt"}}'
    - step: 68
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''input[aria-label'' + String.fromCharCode(61) + ''\"Filter messages\"]'').value
        === \"same.txt\"", "expect_truthy": true}}'
    - step: 75
      expectation: '{"assert_text": {"selector": "[data-testid=\"status-bar-message\"]", "contains": "Opened "}}'
    - step: 79
      expectation: '{"wait_for": "[data-testid=\"workspace-tab\"][data-tab-kind=\"terminal\"][data-active=\"true\"]"}'
    - step: 82
      expectation: '{"assert_pattern": {"selector": "[data-testid=\"terminal-pane\"][data-terminal-active=\"true\"]", "regex": "(?m)^[^\\r\\n]*[/\\\\]repo-b\\s*$",
        "timeout_sec": 20}}'
    - step: 84
      expectation: '{"wait_for": "[data-testid=\"workspace-git-panel\"]"}'
    - step: 85
      expectation: '{"assert_no_runtime_errors": null}'
    results:
    - 52
    - 55
    - 57
    - 66
    - 68
    - 75
    - 79
    - 82
    - 84
    - 85
  visual:
  - check: Context-menu layout and one Git rail entry
    method: manual
    reason: Review the retained screenshot; DOM counts establish removal but not pixel appearance.
  native:
  - check: OS clipboard, containing-directory open, and terminal cwd
    method: automated
    reason: Host clipboard oracle and git output from the real PTY; file-manager IPC must succeed. OS window appearance remains a manual boundary.

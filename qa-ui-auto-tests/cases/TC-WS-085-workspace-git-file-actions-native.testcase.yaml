    value: '{"version":1,"activeWorkspaceId":"default-workspace","createdNodes":[],"workspaces":[{"id":"default-workspace","name":"Default Workspace","description":"","isDefault":true,"rootFolders":[{"id":"root-1","name":"parity008","path":"${fixture.parity008_root}","addedAt":1}],"pinnedSessionIds":[],"activeLeftToolWindow":"project","bottomDock":{"open":false,"activeTool":"terminal","heightPx":220},"openTabs":[],"activeTabId":""}]}'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-sidebar-panel"]'
- assert_count:
    selector: '[data-testid="sidebar-rail"] [data-testid="code-workspace-tool-rail-git"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-bottom-tab-git"]'
    equal: 0
- click: '[data-testid="code-workspace-tool-rail-git"]'
- wait_for: '[data-testid="workspace-git-manager"]'
- wait_for: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- fill:
    selector: '[data-testid="git-commit-message"]'
    value: ''
- right_click: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- assert_menu_items:
  - Stage
  - Unstage
  - Copy Path
  - Copy Relative Path
  - Reveal in Explorer
  - Open in Terminal
- click: '[data-testid="git-file-copy-path"]'
- assert_text:
    selector: '[data-testid="status-bar-message"]'
    contains: Copied
- host_clipboard:
    action: assert
    kind: text
    contains: repo-b
- press:
    selector: '[data-testid="git-commit-message"]'
    key: Mod+V
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"git-commit-message"]').value.split(String.fromCharCode(92)).join('/')
      === "${fixture.parity008_root}/repo-b/same.txt"
    expect_truthy: true
- fill:
    selector: '[data-testid="git-commit-message"]'
    value: ''
- fill:
    selector: '[data-testid="git-commit-message"]'
    value: ''
- right_click: '[data-testid="workspace-change-row"][data-repo-root$="repo-b"][data-path="same.txt"]'
- click: '[data-testid="git-file-copy-relative-path"]'
- assert_text:
    selector: '[data-testid="status-bar-message"]'
    contains: Copied
- host_clipboard:
    action: assert
    kind: text
    equals: same.txt
- press:
    selector: '[data-testid="git-commit-message"]'
    key: Mod+V
- eval_readonly:

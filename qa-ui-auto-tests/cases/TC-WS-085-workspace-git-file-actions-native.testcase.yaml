id: TC-WS-085
title: Workspace Git rail and Changes/Log file actions (native)
description: Use two repositories with the same filename to detect wrong-repository dispatch. Browser checks renderer clipboard/paste and the explicit unsupported
  OS-shell error. Native checks the independent OS clipboard, real file-manager IPC, and the PTY working directory. No app-menu or OS keyboard-delivery
  claim.
modes:
- native
covers:
- F-WS-4
- F26.1
tags:
- p1
- workspace
- git
- file-actions
fixtures:
- reset_db
- parity008_git
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-workspace-git-actions-TC-WS-085
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:

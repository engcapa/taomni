id: TC-SHELL-B32
title: Shell keymap rejects business and reserved keys and dispatches only unclaimed
  shortcuts
description: 'Production renderer acceptance. Specification: docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b32.
  Browser IPC fixtures prove renderer outcomes only.'
covers:
- F1.5
- F25.5
- F-SHELL-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- press:
    selector: '[data-testid="terminal-pane"]'
    key: Control+k
- assert_not_visible: '[data-testid="shell-quick-dialog"]'
- press:
    selector: '[data-testid="shell-overview-trigger"]'
    key: Mod+k
- wait_for: '[data-testid="shell-quick-dialog"]'
- press:
    selector: '[data-testid="shell-quick-input"]'
    key: Escape
- assert_not_visible: '[data-testid="shell-quick-dialog"]'
- click: '[data-testid="shell-rail-home"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="settings-group-toggle-general"]'
- wait_for: '[data-testid="shell-keymap"]'
- click: '[data-testid="shell-keymap-row"][data-action-id="shell.overview"] [data-testid="shell-keymap-record"]'
- press:
    selector: '[data-testid="shell-keymap-capture"]'
    key: Mod+k
- assert_visible: '[data-testid="shell-keymap-conflict"]'
- assert_disabled: '[data-testid="shell-keymap-save"]'
- press:
    selector: '[data-testid="shell-keymap-capture"]'
    key: Control+Tab
- assert_visible: '[data-testid="shell-keymap-conflict"]'
- assert_disabled: '[data-testid="shell-keymap-save"]'
- press:
    selector: '[data-testid="shell-keymap-capture"]'
    key: Control+Shift+t
- assert_visible: '[data-testid="shell-keymap-conflict-scope"]'
- assert_disabled: '[data-testid="shell-keymap-save"]'
- click: '[data-testid="shell-keymap-cancel"]'
- assert_not_visible: '[data-testid="shell-keymap-dialog"]'
- assert_localstorage:
    key: taomni.shellKeymap.v1
    exists: false
- click: '[data-testid="shell-keymap-row"][data-action-id="shell.overview"] [data-testid="shell-keymap-record"]'
- press:
    selector: '[data-testid="shell-keymap-capture"]'
    key: Control+Alt+F9
- assert_not_visible: '[data-testid="shell-keymap-conflict"]'
- assert_enabled: '[data-testid="shell-keymap-save"]'
- click: '[data-testid="shell-keymap-save"]'
- assert_localstorage:
    key: taomni.shellKeymap.v1
    contains: Control+Alt+F9
- press:
    selector: '[data-testid="shell-overview-trigger"]'
    key: Control+Alt+F9
- wait_for: '[data-testid="shell-overview"]'
- assert_count:
    selector: '[data-testid="shell-overview"]'
    equal: 1
- press:
    selector: '[data-testid="shell-tab-search"]'
    key: Escape
- click: '[data-testid="shell-keymap-row"][data-action-id="shell.home"] [data-testid="shell-keymap-record"]'
- press:
    selector: '[data-testid="shell-keymap-capture"]'
    key: Shift+Tab
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'shell-keymap-cancel'
    expect_truthy: true
- press:
    selector: '[data-testid="shell-keymap-cancel"]'
    key: Escape
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'shell-keymap-record'
      && document.activeElement?.parentElement?.getAttribute('data-action-id') ===
      'shell.home'
    expect_truthy: true
- eval_readonly:
    expression: '!localStorage.getItem(''taomni.shellKeymap.v1'')?.includes(''shell.home'')'
    expect_truthy: true
- screenshot: tc-shell-b32.png

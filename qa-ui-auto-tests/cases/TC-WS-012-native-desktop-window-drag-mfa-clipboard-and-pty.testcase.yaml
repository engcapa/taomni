    method: manual
    reason: 原生窗口边界与浮层层级需要截图评审。
  native:
  - check: 打包 WebView 中拖拽抓手、复制反馈与本地 PTY 由本用例自动化验证；操作系统剪贴板字节由 Linux 专用用例 TC-WS-014 覆盖。
    method: automated

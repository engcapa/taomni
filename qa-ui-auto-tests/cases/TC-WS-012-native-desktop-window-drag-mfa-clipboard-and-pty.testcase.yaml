id: TC-WS-012
title: Native window drag handle, bottom-left MFA copy and an isolated workspace local PTY
description: v6.1 native boundary. In the packaged desktop WebView the single toolbar keeps a <=32px window drag handle with no reserved full-height grip
  padding; the bottom-left floating MFA window copies a HOTP code and announces it; and a workspace-owned local terminal starts a real PTY that reaches
  an interactive shell prompt, while Sessions mode keeps its own instance list. Command echo through the workspace PTY is covered by TC-WS-015 on the platforms
  whose WebDriver delivers synthetic text reliably.
modes:
- native
covers:
- F1.3
- F2.4
- F-MFA-1
- F-WS-3
tags:
- smoke
- p0
- workspace-redesign
- native-boundary
fixtures:
- reset_db
timeout_sec: 300
steps:

id: TC-WS-012
title: Native window drag handle, bottom-left MFA copy and an isolated workspace local PTY
description: v6.1 native boundary. In the packaged desktop WebView the single toolbar keeps a <=32px window drag handle with no reserved full-height grip padding;
  the bottom-left floating MFA window copies a HOTP code and announces it; and a workspace-owned local terminal starts a real PTY whose command output is visible,
  while Sessions mode keeps its own instance list.
modes:
- native
covers:
- F1.3
- F2.4
- F-MFA-1
- F-WS-3
tags:
- smoke
- p0
- workspace-redesign
- native-boundary
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for:
    selector: '[data-testid="welcome-panel"]'
    timeout_sec: 60
- eval_readonly:
    expression: document.querySelector('.taomni-control-bar .taomni-window-drag-handle').getBoundingClientRect().height <= 32 && getComputedStyle(document.querySelector('.taomni-main-window')).paddingLeft
      === '0px'
    expect_truthy: true
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-ws-012
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-ws-012
- click: '[data-testid="vault-setup-confirm"]'
- wait_for:
    selector: '[data-testid="mfa-empty"]'
    timeout_sec: 30
- click: '[data-testid="mfa-add"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="secret"]'
- fill:
    selector: '[data-testid="mfa-add-issuer"]'
    value: QA Float
- fill:
    selector: '[data-testid="mfa-add-secret"]'
    value: GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
- click: '[data-testid="mfa-add-advanced"]'
- wait_for: '[data-testid="mfa-add-advanced-panel"]'
- select_option:
    selector: '[data-testid="mfa-add-kind"]'
    value: hotp
- click: '[data-testid="mfa-add-submit"]'
- wait_for: '[data-testid="mfa-account-code"]'
- click: '[data-testid="rail-mfa-button"]'
- wait_for: '[data-testid="mfa-floating-window"]'
- eval_readonly:
    expression: document.querySelector('[data-testid' + String.fromCharCode(61) + '"mfa-floating-window"]').getBoundingClientRect().left >= 40 && (window.innerHeight
      - document.querySelector('[data-testid' + String.fromCharCode(61) + '"mfa-floating-window"]').getBoundingClientRect().bottom) <= 80
    expect_truthy: true
- click: '[data-testid="mfa-floating-account"]'
- wait_for: '[data-testid="mfa-floating-account"][data-copied="true"]'
- assert_text:
    selector: '[data-testid="status-bar"]'
    contains: Copied
- click: '[data-testid="mfa-floating-pin"]'
- assert_attribute:
    selector: '[data-testid="mfa-floating-pin"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="mfa-floating-close"]'
- assert_not_visible: '[data-testid="mfa-floating-window"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-main-panel"]'
- click: '[data-testid="workspace-open-session-plus"]'
- wait_for: '[data-testid="workspace-open-session-menu"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- wait: 2
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: echo QA_WS_PTY_READY
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"]'
      regex: (?m)^\s*QA_WS_PTY_READY\r?\s*$
      timeout_sec: 20
      attempts: 3
- assert_visible: '[data-testid="workspace-tab"][data-tab-kind="terminal"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="terminal-pane"]'
    equal: 0
- screenshot: ws-012-native-workspace-pty.png

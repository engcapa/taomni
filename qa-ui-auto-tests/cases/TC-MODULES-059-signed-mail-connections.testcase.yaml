- mail_server_assert_folder_count: {folder: Drafts, has_subject: Signed host IMAP delivery}
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Revised signed IMAP delivery}
- click: '[data-testid="mail-compose-save-draft"]'
- mail_server_assert_folder_count: {folder: Drafts, equals: 1, has_subject: Revised signed IMAP delivery, lacks_subject: Signed host IMAP delivery}
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: Draft saved to Drafts, timeout_sec: 25}
- click: '[data-testid="mail-compose-send"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- mail_server_assert_smtp_contains: {text: Revised signed IMAP delivery, timeout_sec: 20}
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-sent-copy-status"]', contains: copy saved to Sent, timeout_sec: 30}
- mail_server_assert_folder_count: {folder: Sent, has_subject: Revised signed IMAP delivery}
- mail_server_assert_folder_count: {folder: Drafts, lacks_subject: Revised signed IMAP delivery}
- assert_signed_mail_host: imap-delivery
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: receiver@example.com}
- press: Enter
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Discardable server draft}
- click: '[data-testid="mail-compose-save-draft"]'
- mail_server_assert_folder_count: {folder: Drafts, has_subject: Discardable server draft}
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: Draft saved to Drafts, timeout_sec: 25}
- click: '[role="dialog"][aria-label="New message"] [aria-label="Close dialog"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-drafts-open"]'
- assert_text: {selector: '[data-testid="mail-draft-row"][data-subject="Discardable server draft"]', contains: Discardable server draft}
- click: '[data-testid="mail-draft-row"][data-subject="Discardable server draft"] button[title="Delete draft"]'
- mail_server_assert_folder_count: {folder: Drafts, lacks_subject: Discardable server draft}
- wait_for: {selector: '[data-testid="mail-draft-row"][data-subject="Discardable server draft"]', state: detached}
- click: '[role="dialog"][aria-label="Drafts and templates"] [aria-label="Close dialog"]'
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_pop3_quick_connect}'}
- click: '[data-testid="qc-submit"]'
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="mail"]', equal: 2}
- mail_server_assert_list_matches: {timeout_sec: 40}
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-test-connection"]'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'POP3 ok, SMTP ok', timeout_sec: 45}
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: receiver@example.com}
- press: Enter
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Signed host POP3 delivery}
- type: {selector: '[data-testid="mail-compose-editor"]', text: POP3 message from the signed Mail host}
- click: '[data-testid="mail-compose-send"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- mail_server_assert_smtp_contains: {text: Signed host POP3 delivery, timeout_sec: 20}
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-sent-copy-status"]', contains: copy saved to Sent, timeout_sec: 30}
- assert_signed_mail_host: pop3-delivery
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-mail"]'
- wait_for: '[data-testid="module-action-enable-mail"]'
- assert_signed_mail_host: disabled
- wait_for: {selector: '[data-plugin-slug="mail"] [data-testid="mail-client-tab"]', state: detached}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="mail"]', equal: 2}
- assert_count: {selector: '[data-testid="mail-test-connection"]', equal: 0}
- assert_count: {selector: '[data-testid="mail-compose-open"]', equal: 0}

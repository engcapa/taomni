id: TC-MODULES-059
title: The signed Mail module lists and subscribes IMAP folders and tests incoming connections
description: >-
  Install and enable the matching signed Mail package. Use the regular Mail
  tab to populate the IMAP folder tree and unsubscribe Archive. Check the host's
  module data lease before opening the tab, while displaying the folder tree,
  after the normal IMAP, POP3 and SMTP connection tests, and after disable.
covers: [F-Modules-1, F-MAIL-3, F-MAIL-11, F-MAIL-17]
tags: [modules, mail, native-boundary, p1]
modes: [native]
fixtures: [reset_db, mail_server, module_signed_mail_archive]
timeout_sec: 230
steps:
- open: ${cfg.app.base_url}
- seed_storage: {key: taomni.quickConnectVisible, value: 'true'}
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.mail_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.mail_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- assert_signed_mail_host: idle
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="qc-input"]'
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_quick_connect}'}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"][data-active="true"]'
- mail_server_assert_list_matches: {timeout_sec: 40}
- wait_for: '[data-testid="mail-folder-row"][data-folder-name="Archive"]'
- assert_signed_mail_host: folder-tree
- click: '[data-testid="mail-subscriptions-open"]'
- wait_for: '[data-testid="mail-subscription-row"][data-folder-name="Archive"][data-subscribed="true"]'
- click: '[data-testid="mail-subscription-row"][data-folder-name="Archive"] [data-testid="mail-subscription-toggle"]'
- wait_for: '[data-testid="mail-subscription-row"][data-folder-name="Archive"][data-subscribed="false"]'
- click: '[role="dialog"][aria-label="Folder subscriptions"] [aria-label="Close dialog"]'
- click: '[data-testid="mail-sync-button"]:not([disabled])'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'new headers across', timeout_sec: 40}
- click: '[data-testid="mail-subscriptions-open"]'
- wait_for: '[data-testid="mail-subscription-row"][data-folder-name="Archive"][data-subscribed="false"]'
- click: '[role="dialog"][aria-label="Folder subscriptions"] [aria-label="Close dialog"]'
- click: '[data-testid="mail-test-connection"]'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'IMAP ok, SMTP ok', timeout_sec: 45}
- assert_signed_mail_host: running
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_pop3_quick_connect}'}
- click: '[data-testid="qc-submit"]'
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="mail"]', equal: 2}
- mail_server_assert_list_matches: {timeout_sec: 40}
- click: '[data-testid="mail-test-connection"]'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'POP3 ok, SMTP ok', timeout_sec: 45}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-mail"]'
- wait_for: '[data-testid="module-action-enable-mail"]'
- assert_signed_mail_host: disabled
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Opening the Mail tab starts the signed host, lists the actual IMAP folders and changes the server subscription.
    actions: [6, 7, 8, 10, 15, 16, 21, 23, 26, 28]
    checkpoints:
    - {step: 9, expectation: The module installer accepts the verified artifact.}
    - {step: 12, expectation: The signed module is installed and the host has no writer lease yet.}
    - {step: 19, expectation: Opening the account shows Archive from the actual IMAP server.}
    - {step: 20, expectation: The signed Mail host holds its data lease before the connection test.}
    - {step: 22, expectation: The subscription dialog shows the initial subscribed state.}
    - {step: 24, expectation: The updated IMAP folder tree reports Archive as unsubscribed.}
    - {step: 27, expectation: Full synchronization finishes with the signed host supplying the folder tree.}
    - {step: 29, expectation: The refreshed server tree preserves the changed subscription.}
    results: [9, 12, 19, 20, 22, 24, 27, 29]
  - id: R2
    requirement: The normal connection controls test IMAP, POP3 and SMTP using the installed Mail host.
    actions: [30, 31, 34, 35, 38]
    checkpoints:
    - {step: 32, expectation: The hosted app reports working IMAP and SMTP connections.}
    - {step: 33, expectation: The signed Mail host still holds its data lease.}
    - {step: 39, expectation: A separate POP3 account reports working POP3 and SMTP connections.}
    results: [32, 33, 39]
  - id: R3
    requirement: Disabling the module releases its data lease without restarting the desktop.
    actions: [40, 41, 42]
    checkpoints:
    - {step: 43, expectation: The disabled package can be re-enabled.}
    - {step: 44, expectation: The verified module is still installed and the host released its writer lease.}
    - {step: 45, expectation: The same renderer still runs without uncaught errors.}
    results: [43, 44, 45]
  visual:
  - check: The Mail pane shows the connection results for both accounts.
    method: automated
    reason: The case checks the visible status in each active Mail tab.
  native:
  - check: The production verifier, real Mail connection, host and data lease are observable.
    method: automated
    reason: Native execution uses the matching signed artifact and real protocol listeners in an isolated profile.

- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'IMAP ok, SMTP ok', timeout_sec: 45}
- assert_signed_mail_host: running
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: receiver@example.com}
- press: Enter
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Signed host IMAP delivery}
- type: {selector: '[data-testid="mail-compose-editor"]', text: IMAP message from the signed Mail host}
- click: '[data-testid="mail-compose-save-draft"]'

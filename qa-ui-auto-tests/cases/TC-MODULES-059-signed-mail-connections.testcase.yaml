- click: '[data-testid="confirm-dialog-cancel"]'
- assert_visible: '[data-testid="mail-folder-row"][data-folder-name="INBOX/QA module renamed"]'
- mail_server_assert_folder_count: {folder: INBOX/QA module renamed, exists: true, equals: 0}
- right_click: '[data-testid="mail-folder-row"][data-folder-name="INBOX/QA module renamed"]'
- click: '[data-testid="context-menu-item-delete-folder"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: {selector: '[data-testid="mail-folder-row"][data-folder-name="INBOX/QA module renamed"]', state: detached}

- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- click: '[data-testid="tab-item"]:nth-child(1 of [data-tab-type="mail"])'
- wait_for: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-folder-row"][data-folder-name="INBOX"]'
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-folder-row"][data-folder-name="INBOX"]'
- wait_for: {selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-message-row"][data-subject="After Mail re-enable 0001"]', timeout_sec: 40}
- mail_server_assert_list_matches: {folder: INBOX, timeout_sec: 25}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="mail"]', equal: 2}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Opening the Mail tab starts the signed host, lists the actual IMAP folders and changes the server subscription.
    actions: [6, 7, 8, 10, 15, 17, 47, 49, 53, 77]
    checkpoints:
    - {step: 9, expectation: The module installer accepts the verified artifact.}
    - {step: 12, expectation: The signed module is installed and the host has no writer lease yet.}
    - {step: 18, expectation: Opening the account mounts the module's verified frontend.}
    - {step: 20, expectation: Opening the account shows Archive from the actual IMAP server.}
    - {step: 21, expectation: The signed host holds its data lease and the on-disk folder cache contains INBOX and subscribed Archive.}
    - {step: 48, expectation: The subscription dialog shows the initial subscribed state.}
    - {step: 50, expectation: The updated IMAP folder tree reports Archive as unsubscribed.}
    - {step: 54, expectation: Full synchronization reports its completed header counts.}
    - {step: 55, expectation: Synchronization through the signed host added the newly delivered header.}
    - {step: 78, expectation: The refreshed server tree preserves the changed subscription.}
    results: [9, 12, 18, 20, 21, 48, 50, 54, 55, 78]
  - id: R2
    requirement: The normal connection controls test IMAP, POP3 and SMTP using the installed Mail host.
    actions: [79, 110, 147, 148, 151]
    checkpoints:
    - {step: 111, expectation: The hosted app reports working IMAP and SMTP connections.}
    - {step: 112, expectation: The signed Mail host still holds its data lease.}
    - {step: 152, expectation: A separate POP3 account reports working POP3 and SMTP connections.}
    results: [111, 112, 152]
  - id: R3
    requirement: The signature-verified package composes and delivers from both account types, stores an IMAP Sent copy with the same body and Message-ID, and removes the server draft.
    actions: [113, 114, 115, 116, 117, 118, 125, 153, 154, 155, 156, 157, 158]
    checkpoints:
    - {step: 120, expectation: IMAP Drafts contains the composed subject before sending.}
    - {step: 127, expectation: The SMTP server received the message sent from the IMAP account.}
    - {step: 128, expectation: The IMAP Sent copy was stored.}
    - {step: 129, expectation: The actual IMAP Sent folder contains the accepted message.}
    - {step: 130, expectation: IMAP Drafts no longer contains the original server draft.}
    - {step: 131, expectation: The verified host declares recipient recording and the account cache contains exactly one sent-contact entry for the delivered address.}
    - {step: 160, expectation: The SMTP server received the message sent from the POP3 account.}
    - {step: 161, expectation: The POP3 copy was stored in local Sent.}
    - {step: 162, expectation: The verified host still holds the Mail writer lease after POP3 delivery.}
    results: [120, 127, 128, 129, 130, 131, 160, 161, 162]
  - id: R4
    requirement: Disabling the module releases its data lease without restarting the desktop.
    actions: [163, 164, 165]
    checkpoints:
    - {step: 166, expectation: The disabled package can be re-enabled.}
    - {step: 167, expectation: The verified module is still installed and the host released its writer lease.}
    - {step: 168, expectation: Disabling unmounts both Mail account panes.}
    - {step: 169, expectation: Both tabs remain open for reactivation.}
    - {step: 170, expectation: The stopped module exposes no connection-test control.}
    - {step: 171, expectation: The stopped module exposes no compose control.}
    - {step: 172, expectation: The remaining application runs without uncaught errors.}
    results: [166, 167, 168, 169, 170, 171, 172]
  - id: R5
    requirement: The signed Mail host catches up the selected inbox after messages arrive while another folder is open.
    actions: [29, 40, 41]
    checkpoints:
    - {step: 30, expectation: Archive becomes the selected folder.}
    - {step: 42, expectation: Inbox becomes the selected folder again.}
    - {step: 43, expectation: The newest header appears in the inbox.}
    - {step: 46, expectation: The complete visible list matches the server.}
    results: [30, 42, 43, 46]
  - id: R6
    requirement: Subject search in the signed Mail renderer returns the matching header from the selected IMAP folder.
    actions: [56, 57, 58]
    checkpoints:
    - {step: 59, expectation: The IMAP server reports exactly one match in INBOX.}
    - {step: 60, expectation: The result list contains one row.}
    - {step: 61, expectation: The result row shows the newly received subject.}
    - {step: 62, expectation: The signed host holds its lease and the new header appears once in SQLite below the persisted UID watermark.}
    results: [59, 60, 61, 62]
  - id: R7
    requirement: Toggling the selected message star updates the IMAP flag and the visible message list.
    actions: [65, 66, 69]
    checkpoints:
    - {step: 67, expectation: The selected message shows a star.}
    - {step: 68, expectation: Starred UI rows match the IMAP server's flagged UIDs.}
    - {step: 70, expectation: The selected message no longer shows a star.}
    - {step: 71, expectation: Starred UI rows still match the server after removing the flag.}
    - {step: 76, expectation: The signed host keeps its lease and the SQLite index preserves the final star and unread state.}
    results: [67, 68, 70, 71, 76]
  - id: R8
    requirement: Marking the entire inbox as read updates the actual IMAP mailbox and the cached list.
    actions: [72]
    checkpoints:
    - {step: 73, expectation: The whole-folder operation reports its success.}
    - {step: 74, expectation: No displayed message is still unread.}
    - {step: 75, expectation: The unread count and flagged UID set agree with the live IMAP server.}
    results: [73, 74, 75]
  - id: R9
    requirement: The signed Mail module opens and saves the original MIME of a message whose partial archive fetch returns no bytes.
    actions: [16, 22, 23, 27, 80, 81]
    checkpoints:
    - {step: 24, expectation: The raw message shows the exact IMAP subject header.}
    - {step: 25, expectation: The raw message also includes the IMAP body.}
    - {step: 26, expectation: The installed signed host holds the Mail writer lease while serving the account.}
    - {step: 28, expectation: Closing the source dialog returns to the folder list.}
    - {step: 82, expectation: The native file contains the original IMAP subject header.}
    - {step: 83, expectation: The native file contains the original IMAP body.}
    results: [24, 25, 26, 28, 82, 83]
  - id: R10
    requirement: A newly delivered IMAP message opens with its plain-text body in the installed Mail renderer.
    actions: [44]
    checkpoints:
    - {step: 45, expectation: The reader shows the actual body from the IMAP fixture.}
    results: [45]
  - id: R11
    requirement: The signed Mail renderer opens its Archive attachment as a read-only temporary file and releases it on close.
    actions: [32, 34, 37]
    checkpoints:
    - {step: 33, expectation: The selected message exposes the expected attachment.}
    - {step: 36, expectation: The new read-only viewer holds the exact attachment bytes.}
    - {step: 39, expectation: Closing the viewer removes the controlled temporary file.}
    results: [33, 36, 39]
  - id: R12
    requirement: The Mail module supports creating and renaming a folder, cancelling deletion and confirming deletion.
    actions: [87, 93, 100, 105]
    checkpoints:
    - {step: 88, expectation: The new empty subfolder appears.}
    - {step: 89, expectation: The fixture independently verifies the server result.}
    - {step: 94, expectation: The renamed folder replaces its original row.}
    - {step: 96, expectation: The fixture independently verifies the server result.}
    - {step: 101, expectation: Cancelling deletion leaves the folder visible.}
    - {step: 102, expectation: The fixture independently verifies the server result.}
    - {step: 106, expectation: Confirmed deletion removes the folder and keeps its parent.}
    - {step: 108, expectation: The fixture independently verifies the server result.}
    results: [88, 89, 94, 96, 101, 102, 106, 108]
  - id: R13
    requirement: Editing a saved draft replaces its server copy, and deleting a saved draft removes it from both the local list and the server.
    actions: [122, 143]
    checkpoints:
    - {step: 123, expectation: Drafts contains only the revised version before sending.}

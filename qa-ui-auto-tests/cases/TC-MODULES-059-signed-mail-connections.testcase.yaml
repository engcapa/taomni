id: TC-MODULES-059
title: Signed Mail manages IMAP folders and sends from IMAP and POP3 accounts
description: >-
  Install and enable the matching signed Mail package. Use the regular Mail
  tab to populate the IMAP folder tree, unsubscribe Archive, search the server,
  update message flags, view and save the original of an unarchived message, and send
  messages from IMAP and POP3 accounts. Check the installed renderer,
  connection tests, SMTP delivery, Sent copies, and the signed host's data
  lease through disable.
covers: [F-Modules-1, F-MAIL-3, F-MAIL-6, F-MAIL-7, F-MAIL-11, F-MAIL-12, F-MAIL-17, F-MAIL-23]
tags: [modules, mail, native-boundary, p1]
modes: [native]
fixtures: [reset_db, mail_server, module_signed_mail_archive, file_open_files]
timeout_sec: 310
steps:
- open: ${cfg.app.base_url}
- seed_storage: {key: taomni.quickConnectVisible, value: 'true'}
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.mail_signed_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.mail_signed_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- click: '[data-testid="module-action-enable-mail"]'
- wait_for: '[data-testid="module-action-disable-mail"]'
- assert_signed_mail_host: idle
- click: '[data-testid="nav-mode-home"]'
- wait_for: '[data-testid="qc-input"]'
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_quick_connect}'}
- mail_server_archive_fault: {folder: INBOX, empty_newest: true}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="plugin-tab-panel"][data-plugin-slug="mail"][data-plugin-kind="account"] [data-testid="mail-client-tab"][data-active="true"]'
- mail_server_assert_list_matches: {timeout_sec: 40}
- wait_for: '[data-testid="mail-folder-row"][data-folder-name="Archive"]'
- assert_signed_mail_host: folder-tree
- right_click: '[data-testid="mail-message-row"][data-subject="Seed 0030"]'
- click: '[data-testid="context-menu-item-view-source"]'
- assert_text: {selector: '[role="dialog"][aria-label="Message source"] pre', contains: 'Subject: Seed 0030', timeout_sec: 30}
- assert_text: {selector: '[role="dialog"][aria-label="Message source"] pre', contains: 'Body of Seed 0030'}
- assert_signed_mail_host: imap-source
- click: '[role="dialog"][aria-label="Message source"] [aria-label="Close dialog"]'
- wait_for: {selector: '[role="dialog"][aria-label="Message source"]', state: detached}
- click: '[data-testid="mail-folder-row"][data-folder-name="Archive"]'
- wait_for: '[data-testid="mail-folder-row"][data-folder-name="Archive"][data-active="true"]'
- mail_server_deliver: {count: 3, prefix: Signed header}
- click: '[data-testid="mail-folder-row"][data-folder-name="INBOX"]'
- wait_for: '[data-testid="mail-folder-row"][data-folder-name="INBOX"][data-active="true"]'
- wait_for: {selector: '[data-testid="mail-message-row"][data-subject="Signed header 0003"]', timeout_sec: 40}
- click: '[data-testid="mail-message-row"][data-subject="Signed header 0003"]'
- assert_text: {selector: '[data-testid="mail-reader-text"]', contains: 'Body of Signed header 0003', timeout_sec: 30}
- mail_server_assert_list_matches: {timeout_sec: 40}
- click: '[data-testid="mail-subscriptions-open"]'
- wait_for: '[data-testid="mail-subscription-row"][data-folder-name="Archive"][data-subscribed="true"]'
- click: '[data-testid="mail-subscription-row"][data-folder-name="Archive"] [data-testid="mail-subscription-toggle"]'
- wait_for: '[data-testid="mail-subscription-row"][data-folder-name="Archive"][data-subscribed="false"]'
- click: '[role="dialog"][aria-label="Folder subscriptions"] [aria-label="Close dialog"]'
- mail_server_deliver: {count: 1, prefix: Signed full-account header}
- click: '[data-testid="mail-sync-button"]:not([disabled])'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'new headers across', timeout_sec: 40}
- wait_for: {selector: '[data-testid="mail-message-row"][data-subject="Signed full-account header 0001"]', timeout_sec: 40}
- select_option: {selector: '[data-testid="mail-search-field"]', value: subject}
- fill: {selector: '[data-testid="mail-search-input"]', value: 'Signed full-account header 0001'}
- click: '[data-testid="mail-search-server"]'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'Server search found 1 message in INBOX', timeout_sec: 30}
- assert_count: {selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-message-row"]', equal: 1}
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-message-row"]', contains: 'Signed full-account header 0001'}
- assert_signed_mail_host: imap-search
- fill: {selector: '[data-testid="mail-search-input"]', value: ''}
- wait_for: {selector: '[data-testid="mail-search-server"]', state: detached}
- click: '[data-testid="mail-message-row"][data-subject="Signed full-account header 0001"][data-flagged="false"]'
- press: {selector: '[data-testid="mail-message-row"][aria-pressed="true"]', key: s}
- wait_for: '[data-testid="mail-message-row"][data-subject="Signed full-account header 0001"][data-flagged="true"]'
- mail_server_assert_list_matches: {flagged: true, timeout_sec: 20}
- press: {selector: '[data-testid="mail-message-row"][aria-pressed="true"]', key: s}
- wait_for: '[data-testid="mail-message-row"][data-subject="Signed full-account header 0001"][data-flagged="false"]'
- mail_server_assert_list_matches: {flagged: true, timeout_sec: 20}
- click: '[data-testid="mail-mark-folder-read"]:not([disabled])'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'messages as read', timeout_sec: 30}
- assert_count: {selector: '[data-testid="mail-message-row"][data-unread="true"]', equal: 0}
- mail_server_assert_list_matches: {unread: true, flagged: true, timeout_sec: 20}
- assert_signed_mail_host: imap-flags
- click: '[data-testid="mail-subscriptions-open"]'
- wait_for: '[data-testid="mail-subscription-row"][data-folder-name="Archive"][data-subscribed="false"]'
- click: '[role="dialog"][aria-label="Folder subscriptions"] [aria-label="Close dialog"]'
- right_click: '[data-testid="mail-message-row"][data-subject="Seed 0030"]'
- native_file_dialog:
    kind: save
    action: choose
    title: Save message as .eml
    trigger: '[data-testid="context-menu-item-save-as-eml"]'
    path: ${fixture.file_open_root}/mail-original.eml
- assert_file_contains: {path: '${fixture.file_open_root}/mail-original.eml', contains: 'Subject: Seed 0030'}
- assert_file_contains: {path: '${fixture.file_open_root}/mail-original.eml', contains: 'Body of Seed 0030'}
- click: '[data-testid="mail-test-connection"]'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'IMAP ok, SMTP ok', timeout_sec: 45}
- assert_signed_mail_host: running
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: receiver@example.com}
- press: Enter
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Signed host IMAP delivery}
- type: {selector: '[data-testid="mail-compose-editor"]', text: IMAP message from the signed Mail host}
- click: '[data-testid="mail-compose-send"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- mail_server_assert_smtp_contains: {text: Signed host IMAP delivery, timeout_sec: 20}
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-sent-copy-status"]', contains: copy saved to Sent, timeout_sec: 30}
- assert_signed_mail_host: imap-delivery
- fill: {selector: '[data-testid="qc-input"]', value: '${fixture.mail_pop3_quick_connect}'}
- click: '[data-testid="qc-submit"]'
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="mail"]', equal: 2}
- mail_server_assert_list_matches: {timeout_sec: 40}
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-test-connection"]'
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"]', contains: 'POP3 ok, SMTP ok', timeout_sec: 45}
- click: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: receiver@example.com}
- press: Enter
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Signed host POP3 delivery}
- type: {selector: '[data-testid="mail-compose-editor"]', text: POP3 message from the signed Mail host}
- click: '[data-testid="mail-compose-send"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- mail_server_assert_smtp_contains: {text: Signed host POP3 delivery, timeout_sec: 20}
- assert_text: {selector: '[data-testid="mail-client-tab"][data-active="true"] [data-testid="mail-sent-copy-status"]', contains: copy saved to Sent, timeout_sec: 30}
- assert_signed_mail_host: pop3-delivery
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-mail"]'
- wait_for: '[data-testid="module-action-enable-mail"]'
- assert_signed_mail_host: disabled
- wait_for: {selector: '[data-plugin-slug="mail"] [data-testid="mail-client-tab"]', state: detached}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="mail"]', equal: 2}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Opening the Mail tab starts the signed host, lists the actual IMAP folders and changes the server subscription.
    actions: [6, 7, 8, 10, 15, 17, 38, 40, 44, 68]
    checkpoints:
    - {step: 9, expectation: The module installer accepts the verified artifact.}
    - {step: 12, expectation: The signed module is installed and the host has no writer lease yet.}
    - {step: 18, expectation: Opening the account mounts the module's verified frontend.}
    - {step: 20, expectation: Opening the account shows Archive from the actual IMAP server.}
    - {step: 21, expectation: The signed Mail host holds its data lease before the connection test.}
    - {step: 39, expectation: The subscription dialog shows the initial subscribed state.}
    - {step: 41, expectation: The updated IMAP folder tree reports Archive as unsubscribed.}
    - {step: 45, expectation: Full synchronization reports its completed header counts.}
    - {step: 46, expectation: Synchronization through the signed host added the newly delivered header.}
    - {step: 69, expectation: The refreshed server tree preserves the changed subscription.}
    results: [9, 12, 18, 20, 21, 39, 41, 45, 46, 69]
  - id: R2
    requirement: The normal connection controls test IMAP, POP3 and SMTP using the installed Mail host.
    actions: [70, 75, 88, 89, 92]
    checkpoints:
    - {step: 76, expectation: The hosted app reports working IMAP and SMTP connections.}
    - {step: 77, expectation: The signed Mail host still holds its data lease.}
    - {step: 93, expectation: A separate POP3 account reports working POP3 and SMTP connections.}
    results: [76, 77, 93]
  - id: R3
    requirement: The signature-verified package delivers from both account types and preserves the Sent-copy behavior.
    actions: [78, 79, 80, 81, 82, 83, 94, 95, 96, 97, 98, 99]
    checkpoints:
    - {step: 85, expectation: The SMTP server received the message sent from the IMAP account.}
    - {step: 86, expectation: The IMAP Sent copy was stored.}
    - {step: 87, expectation: The verified host still holds the Mail writer lease after IMAP delivery.}
    - {step: 101, expectation: The SMTP server received the message sent from the POP3 account.}
    - {step: 102, expectation: The POP3 copy was stored in local Sent.}
    - {step: 103, expectation: The verified host still holds the Mail writer lease after POP3 delivery.}
    results: [85, 86, 87, 101, 102, 103]
  - id: R4
    requirement: Disabling the module releases its data lease without restarting the desktop.
    actions: [104, 105, 106]
    checkpoints:
    - {step: 107, expectation: The disabled package can be re-enabled.}
    - {step: 108, expectation: The verified module is still installed and the host released its writer lease.}
    - {step: 109, expectation: Disabling unmounts both Mail account panes.}
    - {step: 110, expectation: Both tabs remain open for reactivation.}
    - {step: 111, expectation: The remaining application runs without uncaught errors.}
    results: [107, 108, 109, 110, 111]
  - id: R5
    requirement: The signed Mail host catches up the selected inbox after messages arrive while another folder is open.
    actions: [29, 31, 32]
    checkpoints:
    - {step: 30, expectation: Archive becomes the selected folder.}
    - {step: 33, expectation: Inbox becomes the selected folder again.}
    - {step: 34, expectation: The newest header appears in the inbox.}
    - {step: 37, expectation: The complete visible list matches the server.}
    results: [30, 33, 34, 37]
  - id: R6
    requirement: Subject search in the signed Mail renderer returns the matching header from the selected IMAP folder.
    actions: [47, 48, 49]
    checkpoints:
    - {step: 50, expectation: The IMAP server reports exactly one match in INBOX.}
    - {step: 51, expectation: The result list contains one row.}
    - {step: 52, expectation: The result row shows the newly received subject.}
    - {step: 53, expectation: The verified Mail package and writer lease remain active.}
    results: [50, 51, 52, 53]
  - id: R7
    requirement: Toggling the selected message star updates the IMAP flag and the visible message list.
    actions: [56, 57, 60]
    checkpoints:
    - {step: 58, expectation: The selected message shows a star.}
    - {step: 59, expectation: Starred UI rows match the IMAP server's flagged UIDs.}
    - {step: 61, expectation: The selected message no longer shows a star.}
    - {step: 62, expectation: Starred UI rows still match the server after removing the flag.}
    - {step: 67, expectation: The installed signed host and its writer lease remain active.}
    results: [58, 59, 61, 62, 67]
  - id: R8
    requirement: Marking the entire inbox as read updates the actual IMAP mailbox and the cached list.
    actions: [63]
    checkpoints:
    - {step: 64, expectation: The whole-folder operation reports its success.}
    - {step: 65, expectation: No displayed message is still unread.}
    - {step: 66, expectation: The unread count and flagged UID set agree with the live IMAP server.}
    results: [64, 65, 66]
  - id: R9
    requirement: The signed Mail module opens and saves the original MIME of a message whose partial archive fetch returns no bytes.
    actions: [16, 22, 23, 27, 71, 72]
    checkpoints:
    - {step: 24, expectation: The raw message shows the exact IMAP subject header.}
    - {step: 25, expectation: The raw message also includes the IMAP body.}
    - {step: 26, expectation: The installed signed host holds the Mail writer lease while serving the account.}
    - {step: 28, expectation: Closing the source dialog returns to the folder list.}
    - {step: 73, expectation: The native file contains the original IMAP subject header.}
    - {step: 74, expectation: The native file contains the original IMAP body.}
    results: [24, 25, 26, 28, 73, 74]
  - id: R10
    requirement: A newly delivered IMAP message opens with its plain-text body in the installed Mail renderer.
    actions: [35]
    checkpoints:
    - {step: 36, expectation: The reader shows the actual body from the IMAP fixture.}
    results: [36]
  visual:
  - check: The Mail pane shows the connection results for both accounts.
    method: automated
    reason: The case checks the visible status in each active Mail tab.
  native:
  - check: The production verifier, real Mail connection, host and data lease are observable.
    method: automated
    reason: Native execution uses the matching signed artifact and real protocol listeners in an isolated profile.

  visual:
  - check: SSH terminal display menu, badges, fullscreen state, and event-log contents remain readable without clipping.
    method: manual
    reason: DOM state assertions do not establish menu placement or visual density.
  native:
  - check: Native runs use the hosted SSH service and exercise the packaged terminal input and WebView menu wiring.
    method: automated
    reason: Browser stubs cannot establish native SSH terminal and input behavior.

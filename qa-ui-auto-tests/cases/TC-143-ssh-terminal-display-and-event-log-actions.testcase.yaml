id: TC-143
title: SSH terminal display actions change input, layout, and event-log state
covers:
- F3.1
- F4.2
- F4.7
- F2.2
tags:
- ssh
- terminal
- display
- event-log
- p1
modes:
- browser
- native
fixtures:
- reset_db
- ssh_required
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-ssh-display-actions
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-display-actions"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-ssh-display-actions"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf 'qa-ssh-display-before\n'
    submit: true
- wait: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa\-ssh\-display\-before\r?$
    timeout_sec: 15
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-read-only-terminal"]'
- wait_for: '[data-testid="terminal-read-only"]'
- click: '[data-testid="terminal-pane"]'
- type: qa-ssh-read-only-blocked
- wait: 1
- assert_attribute:
    selector: '[data-testid="terminal-pane"]'
    name: data-terminal-text
    matches: '(?s)(?!.*qa-ssh-read-only-blocked).*'
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-read-only-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-read-only"]'
    state: detached
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: printf 'qa-ssh-display-after-read-only\n'
    submit: true
- wait: 1
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^qa\-ssh\-display\-after\-read\-only\r?$
    timeout_sec: 15
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-toggle-terminal-scrollbar"]'
- assert_attribute:
    selector: '[data-testid="terminal-pane"]'
    name: class
    matches: '.*terminal-hide-scrollbar.*'
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-toggle-terminal-scrollbar"]'
- assert_attribute:
    selector: '[data-testid="terminal-pane"]'
    name: class
    matches: '(?!.*terminal-hide-scrollbar).*'
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-fullscreen-terminal"]'
- assert_attribute:
    selector: '[data-testid="terminal-pane"]'
    name: class
    matches: '.*fixed.*inset-0.*'
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- hover: '[data-testid="context-menu-item-terminal-display"]'
- click: '[data-testid="context-menu-item-fullscreen-terminal"]'
- assert_attribute:
    selector: '[data-testid="terminal-pane"]'
    name: class
    matches: '(?!.*fixed.*inset-0).*'
- right_click:
    selector: '[data-testid="terminal-pane"]'
- wait_for: '[data-testid="context-menu"]'
- click: '[data-testid="context-menu-item-event-log"]'
- wait_for: '[data-testid="terminal-event-log"]'
- assert_text:
    selector: '[data-testid="terminal-event-log"]'
    contains: connection
- assert_text:
    selector: '[data-testid="terminal-event-log"]'
    contains: auth
- click: '[data-testid="terminal-event-log-close"]'
- wait_for:
    selector: '[data-testid="terminal-event-log"]'
    state: detached
- screenshot: 143-ssh-terminal-display-event-log.png

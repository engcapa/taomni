  - id: R2
    requirement: An empty vault blocks the panel with the setup dialog; cancel leaves a placeholder whose action
      reopens setup; a master password mounts the panel (AC-02).
    actions:
    - 11
    - 15
    - 17
    - 18
    - 19
    checkpoints:

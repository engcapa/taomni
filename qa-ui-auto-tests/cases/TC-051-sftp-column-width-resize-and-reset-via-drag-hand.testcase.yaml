id: TC-051
title: SFTP column width resize and reset via drag handle
covers:
- F7.2
tags:
- columns
- legacy-imported
- p1
- resize
- sftp
modes:
- browser
fixtures:
- reset_db
- ssh_required
- sftp_required
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu-item-view"]'
- click: '[data-testid="context-menu-item-toggle-quick-connect"]'
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 2
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-browser"]'
- click: '[data-testid="sftp-remote-path"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${cfg.sftp.remote_test_dir}
- press: Enter
- wait: 1
- drag_to:
    from: '[data-testid="sftp-remote-pane"] [data-testid="col-resize-name"]'
    to: '[data-testid="sftp-remote-pane"] [data-testid="col-resize-size"]'
- eval_readonly:
    expression: JSON.parse(localStorage.getItem("taomni.sftp.cols.remote")).name > 280
    expect_truthy: true
- wait: 1
- drag_to:
    from: '[data-testid="sftp-remote-pane"] [data-testid="col-resize-size"]'
    to: '[data-testid="sftp-remote-pane"] [data-testid="col-resize-modified"]'
- eval_readonly:
    expression: JSON.parse(localStorage.getItem("taomni.sftp.cols.remote")).size > 80
    expect_truthy: true
- wait: 1
- dblclick: '[data-testid="sftp-remote-pane"] [data-testid="col-resize-name"]'
- eval_readonly:
    expression: JSON.parse(localStorage.getItem("taomni.sftp.cols.remote")).name === 280
    expect_truthy: true
- wait: 1
- screenshot: 051-sftp-column-resize.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: SFTP column width resize and reset via drag handle：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 4
    - 6
    - 7
    - 9
    - 10
    - 13
    - 15
    - 16
    - 17
    - 19
    - 22
    - 25
    checkpoints:
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"qc-input\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"auth-prompt\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"terminal-pane\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"sftp-browser\"]"}'
    - step: 20
      expectation: '{"eval_readonly": {"expression": "JSON.parse(localStorage.getItem(\"taomni.sftp.cols.remote\")).name
        > 280", "expect_truthy": true}}'
    - step: 23
      expectation: '{"eval_readonly": {"expression": "JSON.parse(localStorage.getItem(\"taomni.sftp.cols.remote\")).size
        > 80", "expect_truthy": true}}'
    - step: 26
      expectation: '{"eval_readonly": {"expression": "JSON.parse(localStorage.getItem(\"taomni.sftp.cols.remote\")).name
        === 280", "expect_truthy": true}}'
    results:
    - 26
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

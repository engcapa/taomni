id: TC-IDE-PARITY-012-01
title: Popups opened from the editor return focus to it on Escape
description: 'ED-PARITY-012 A4 / DEC-012-01 (DEC-ALIGN-11): Go to File, Recent Files, Recent Locations, File Structure, Find Action and Go to Line each open from the editor and close with Escape; focus returns to the same CodeMirror content and the caret line is unchanged.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-012
- find
- focus
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+End
- press: ArrowUp
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '3:'
- press: Control+Shift+N
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    state: detached
    timeout_sec: 5
- &id001
  eval_readonly:
    expression: document.activeElement?.classList.contains('cm-content') === true
    expect_truthy: true
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '3:'
- press: Control+E
- wait_for:
    selector: '[data-testid="code-workspace-recent-files"]'
    timeout_sec: 30
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-recent-files"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '3:'
- press: Control+Shift+E
- wait_for:
    selector: '[data-testid="recent-locations-dialog"]'
    timeout_sec: 30
- press: Escape
- wait_for:
    selector: '[data-testid="recent-locations-dialog"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '3:'
- press: Control+F12
- wait_for:
    selector: '[data-testid="code-workspace-structure-popup"]'
    timeout_sec: 30
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-structure-popup"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '3:'
- press: Control+Shift+A
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    timeout_sec: 30
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-search-everywhere"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '3:'
- press: Control+g
- wait_for:
    selector: '[data-testid="code-workspace-goto-line-dialog"]'
    timeout_sec: 30
- press: Escape
- wait_for:
    selector: '[data-testid="code-workspace-goto-line-dialog"]'
    state: detached
    timeout_sec: 5
- *id001
- assert_text:
    selector: '[data-testid="status-bar-workspace-cursor"]'
    contains: '3:'

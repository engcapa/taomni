id: TC-WS-036
title: Mixed document explorer has type icons, all files, nested search and retained operations
description: An ordinary mixed document folder shares the existing editor/tree. Copy from a nested search result, paste at the root, edit and save the copy;
  preserve the original and a single Git action.
modes:
- browser
covers:
- F-WS-2
- F25.1
- F25.3
tags:
- p0
- workspace-redesign
- file-explorer
- regression
fixtures:
- reset_db
- workspace_explorer
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-explorer
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-empty-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-tree-view-selector"]'
- click: '[data-testid="code-workspace-tree-view-all-files"]'
- wait_for: '[data-testid="code-workspace-flat-file"][data-path="Documents/notes.txt"]'
- assert_visible: '[data-testid="code-workspace-flat-file"][data-path="Documents/budget.csv"] [data-file-type="spreadsheet"]'
- assert_visible: '[data-testid="code-workspace-flat-file"][data-path="Pictures/logo.svg"] [data-file-type="image"]'
- assert_visible: '[data-testid="code-workspace-flat-file"][data-path="README.md"] [data-file-type="document"]'
- click: '[data-testid="code-workspace-tree-search"]'
- fill:
    selector: '[data-testid="code-workspace-tree-filter"]'
    value: no-such-explorer-file
- assert_count:
    selector: '[data-testid="code-workspace-flat-file"]'
    equal: 0
- fill:
    selector: '[data-testid="code-workspace-tree-filter"]'
    value: Documents/notes
- assert_count:
    selector: '[data-testid="code-workspace-flat-file"]'
    equal: 1
- right_click: '[data-testid="code-workspace-flat-file"][data-path="Documents/notes.txt"]'
- assert_visible: '[data-testid="code-workspace-tree-open-default"]'
- click: '[data-testid="code-workspace-tree-copy"]'
- click: '[data-testid="code-workspace-tree-speed-search-close"]'
- right_click: '[data-testid="code-workspace-tree-root"]'
- click: '[data-testid="code-workspace-tree-paste"]'
- wait_for: '[data-testid="code-workspace-flat-file"][data-path="notes.txt"]'
- dblclick: '[data-testid="code-workspace-flat-file"][data-path="notes.txt"]'
- wait_for: '[data-testid="workspace-file-editor"] .cm-content'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: Weekly notes
- assert_count:
    selector: '[data-testid="code-workspace-highlighting-widget"]'
    equal: 1
- assert_count:
    selector: '[data-testid^="code-workspace-banner-lsp-error:"]'
    equal: 0
- assert_count:
    selector: '[data-testid="editor-open-git-diff"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-git-panel-toggle"]'
    equal: 0
- press:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    key: Mod+End
- type:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    text: X
- wait_for: '[data-testid="workspace-file-editor"][data-dirty="true"]'
- click: '[data-testid="workspace-editor-save"]'
- wait_for:
    selector: '[data-testid="workspace-file-editor"][data-dirty]'
    state: detached
- click: '[data-testid="code-workspace-tree-view-selector"]'
- click: '[data-testid="code-workspace-tree-view-project"]'
- wait_for: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
- screenshot: workspace-mixed-file-explorer.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Mixed file types are discoverable across all-file and tree views; recursive filtering, clipboard copy, editing, save and one Git action
      remain usable.
    actions:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 8
    - 9
    - 14
    - 15
    - 17
    - 19
    - 21
    - 22
    - 23
    - 24
    - 26
    - 33
    - 34
    - 36
    - 38
    - 39
    checkpoints:
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-flat-file\"][data-path=\"Documents/notes.txt\"]"}'
    - step: 11
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-flat-file\"][data-path=\"Documents/budget.csv\"] [data-file-type=\"spreadsheet\"]"}'
    - step: 12
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-flat-file\"][data-path=\"Pictures/logo.svg\"] [data-file-type=\"image\"]"}'
    - step: 13
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-flat-file\"][data-path=\"README.md\"] [data-file-type=\"document\"]"}'
    - step: 16
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-flat-file\"]", "equal": 0}}'
    - step: 18
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-flat-file\"]", "equal": 1}}'
    - step: 20
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-open-default\"]"}'
    - step: 25
      expectation: '{"wait_for": "[data-testid=\"code-workspace-flat-file\"][data-path=\"notes.txt\"]"}'
    - step: 27
      expectation: '{"wait_for": "[data-testid=\"workspace-file-editor\"] .cm-content"}'
    - step: 28
      expectation: '{"assert_text": {"selector": "[data-testid=\"workspace-file-editor\"] .cm-content", "contains": "Weekly notes"}}'
    - step: 29
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-highlighting-widget\"]", "equal": 1}}'
    - step: 30
      expectation: '{"assert_count": {"selector": "[data-testid^=\"code-workspace-banner-lsp-error:\"]", "equal": 0}}'
    - step: 31
      expectation: '{"assert_count": {"selector": "[data-testid=\"editor-open-git-diff\"]", "equal": 1}}'
    - step: 32
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-git-panel-toggle\"]", "equal": 0}}'
    - step: 35
      expectation: '{"wait_for": "[data-testid=\"workspace-file-editor\"][data-dirty=\"true\"]"}'
    - step: 37
      expectation: '{"wait_for": {"selector": "[data-testid=\"workspace-file-editor\"][data-dirty]", "state": "detached"}}'
    - step: 40
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"notes.txt\"]"}'
    results:
    - 7
    - 10
    - 11
    - 12
    - 13
    - 16
    - 18
    - 20
    - 25
    - 27
    - 28
    - 29
    - 30
    - 31
    - 32
    - 35
    - 37
    - 40
  visual:
  - check: Review type icons, tree selection, header density and ordinary document editing.
    method: manual
    reason: Visual fidelity is reviewed from the retained screenshot.
  native:
  - check: Actual disk copy and save are covered separately by TC-WS-037.
    method: manual
    reason: Browser VFS establishes renderer behavior only; native execution is recorded by the matching native scenario.

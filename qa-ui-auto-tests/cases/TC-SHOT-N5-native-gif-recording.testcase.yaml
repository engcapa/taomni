id: TC-SHOT-N5
title: Native GIF frames match actual original screen states and timing
description: Draw each fixture scene on an independent canvas and publish its completed immutable surface without repainting a visible source canvas. Every decoded frame must match the retained actual published original for its complementary frame id and random per-run nonce under the fixed pixel and timing thresholds. Changing frame hashes or multiple frames alone cannot pass.
covers: [F27.1]
tags: [screenshot, recording, native, p1]
modes: [native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="system-screenshot"]'
- native_screenshot_scenario: {scenario: record, format: gif, secs: 3}
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: gif-capture
    requirement: Real persistent screen capture records the original moving scene with correct region pixels, state order and playback timing, rejecting black, wrong-region, stale or unrelated multi-frame GIFs.
    actions: [1]
    checkpoints:
    - {step: 3, expectation: "Every decoded GIF frame has this run's nonce and source frame id and matches its actual retained original pixels across all 24x24 tiles (mean error <=8; no tile >20; <=2 percent materially different pixels). Source states remain ordered and each frame is within <=250ms of its original state's actual visibility interval (draw through next draw), no unexplained frame gap/end stall >700ms after accounting for actual held original states and coverage >=70 percent duration. Existing twelve-frame/four-state and three-second duration checks also pass. Originals, GIF, timeline, per-frame comparisons and original/actual/difference contact sheet are retained."}
    results: [3]
  visual:
  - {check: Original scene fidelity, method: automated, reason: "Compare each decoded frame to a PNG saved during the actual fixture draw; unique nonce prevents old clips passing. Negative unit tests reject changing unrelated GIF frames. Retained paired images support visual review."}
  native:
  - {check: GIF pipeline, method: automated, reason: "Real native window and screen capture into built-in GIF encoder, not generated pixels or file-header-only proof."}

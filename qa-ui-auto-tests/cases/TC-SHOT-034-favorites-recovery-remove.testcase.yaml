id: TC-SHOT-034
title: Favorite load failure is retryable and collection removal requires confirmation
covers:
- F27.1
tags:
- screenshot
- regression
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}?qaScreenshotFavoritesError=once
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorites-error"]'
- assert_text:
    selector: '[data-testid="screenshot-favorites-error"]'
    contains: storage unavailable
- click: '[data-testid="screenshot-favorites-refresh"]'
- wait_for: '[data-testid="screenshot-favorites-empty"]'
- assert_not_visible: '[data-testid="screenshot-favorites-error"]'
- click: '[data-testid="screenshot-favorites-close"]'
- open: ${cfg.app.base_url}#screenshot-overlay
- wait_for: '[data-testid="screenshot-hint"]'
- click: '[data-testid="screenshot-fullscreen"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- click: '[data-testid="screenshot-pin-favorite"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-favorite"]'
    name: aria-pressed
    equals: 'true'
- click: '[data-testid="screenshot-pin-close"]'
- wait_for: '[data-testid="system-screenshot"]'
- click: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="system-screenshot-favorites"]'
- wait_for: '[data-testid="screenshot-favorite-remove"]'
- click: '[data-testid="screenshot-favorite-remove"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-cancel"]'
- assert_count:
    selector: '[data-testid="screenshot-favorite-item"]'
    equal: 1
- click: '[data-testid="screenshot-favorite-remove"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="screenshot-favorites-empty"]'
- assert_count:
    selector: '[data-testid="screenshot-favorite-item"]'
    equal: 0
- press: Escape
- assert_not_visible: '[data-testid="screenshot-favorites"]'
- assert_visible: '[data-testid="system-screenshot"]'
verification:
  review: reviewed
  requirements:
  - id: recovery
    requirement: A failed list read shows a persistent error and Refresh recovers. Cancelling removal retains the favorite; confirming
      removes it and the empty dialog closes with Escape.
    actions:
    - 1
    - 3
    - 4
    - 7
    - 10
    - 11
    - 13
    - 14
    - 16
    - 18
    - 20
    - 21
    - 23
    - 25
    - 27
    - 29
    - 32
    checkpoints:
    - step: 6
      expectation: 'assert_text: {''selector'': ''[data-testid="screenshot-favorites-error"]'', ''contains'': ''storage unavailable''}'
    - step: 9
      expectation: 'assert_not_visible: [data-testid="screenshot-favorites-error"]'
    - step: 17
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-pin-favorite"]'', ''name'': ''aria-pressed'', ''equals'':
        ''true''}'
    - step: 26
      expectation: 'assert_count: {''selector'': ''[data-testid="screenshot-favorite-item"]'', ''equal'': 1}'
    - step: 31
      expectation: 'assert_count: {''selector'': ''[data-testid="screenshot-favorite-item"]'', ''equal'': 0}'
    - step: 33
      expectation: 'assert_not_visible: [data-testid="screenshot-favorites"]'
    - step: 34
      expectation: 'assert_visible: [data-testid="system-screenshot"]'
    results:
    - 6
    - 9
    - 17
    - 26
    - 31
    - 33
    - 34
  visual:
  - check: Load error and recovered empty state
    method: automated
    reason: Visible error, count and empty state assertions own the result.
  native:
  - check: Real favorite storage and removal
    method: external
    reason: TC-SHOT-N17 verifies persistent files and independence from open pins.

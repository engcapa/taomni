id: TC-SHELL-N07
title: Notes handoff preserves full draft and persists through a real process restart
description: Isolated packaged Tauri boundary. docs-feature/workspace-shell-ux-redesign-test-cases.md#v-n07
  records the complete scenario and any remaining manual boundary.
covers:
- F-TAO-1
- F-Detach-1
tags:
- p1
- workspace-shell
- native-boundary
modes:
- native
fixtures:
- reset_db
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-native-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- click: '[data-testid="notes-new"]'
- wait_for: '[data-testid="note-editor"]'
- fill:
    selector: '[data-testid="note-editor-title"]'
    value: SHELL-NOTE 中文
- fill:
    selector: '[data-testid="note-editor-body"]'
    value: 'First line

      第二行'
- fill:
    selector: '[data-testid="note-editor-new-step"]'
    value: Unsubmitted step
- fill:
    selector: '[data-testid="note-editor-new-tag"]'
    value: Unsubmitted tag
- click: '[data-testid="notes-floating-toggle"]'
- switch_window:
    route: '#notes='
- wait_for: '[data-testid="notes-detached-window"][data-phase="ready"]'
- assert_attribute:
    selector: '[data-testid="notes-detached-window"]'
    name: data-phase
    equals: ready
- assert_value:
    selector: '[data-testid="note-editor-title"]'
    equals: SHELL-NOTE 中文
- assert_value:
    selector: '[data-testid="note-editor-body"]'
    equals: 'First line

      第二行'
- assert_value:
    selector: '[data-testid="note-editor-new-step"]'
    equals: Unsubmitted step
- assert_value:
    selector: '[data-testid="note-editor-new-tag"]'
    equals: Unsubmitted tag
- fill:
    selector: '[data-testid="note-editor-body"]'
    value: 'First line

      第二行

      Child edit'
- click: '[data-testid="notes-detached-dock"]'
- switch_window:
    route: ''
- wait_for: '[data-testid="note-editor"]'
- assert_count:
    selector: '[data-testid="note-editor"]'
    equal: 1
- assert_value:
    selector: '[data-testid="note-editor-title"]'
    equals: SHELL-NOTE 中文
- assert_value:
    selector: '[data-testid="note-editor-body"]'
    equals: 'First line

      第二行

      Child edit'
- assert_value:
    selector: '[data-testid="note-editor-new-step"]'
    equals: Unsubmitted step
- assert_value:
    selector: '[data-testid="note-editor-new-tag"]'
    equals: Unsubmitted tag
- click: '[data-testid="note-editor-back"]'
- assert_count:
    selector: '[data-testid="notes-list-item"]'
    equal: 1
- restart_native_app: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- wait_for: '[data-testid="notes-list-item"]'
- assert_count:
    selector: '[data-testid="notes-list-item"]'
    equal: 1
- click: '[data-testid="notes-list-item"]'
- wait_for: '[data-testid="note-editor"]'
- assert_value:
    selector: '[data-testid="note-editor-title"]'
    equals: SHELL-NOTE 中文
- assert_value:
    selector: '[data-testid="note-editor-body"]'
    equals: 'First line

      第二行

      Child edit'
- assert_attribute:
    selector: '[data-testid="note-editor-complete"]'
    name: aria-pressed
    equals: 'false'
- screenshot: tc-shell-n07.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Create one real note and retain incomplete step/tag input before
      detaching.
    actions:
    - 4
    - 5
    - 6
    - 8
    - 9
    - 10
    - 11
    - 12
    - 13

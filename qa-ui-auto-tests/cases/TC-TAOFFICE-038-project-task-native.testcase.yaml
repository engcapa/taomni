id: TC-TAOFFICE-038
title: Schedule and assign a new Project task (native)
description: Add a task, link its predecessor, allocate a resource, and verify progress and the original file.
modes: [native]
covers: [F-FILEOPEN-1, F-Modules-1]
tags: [p0, file-open, taoffice, taoffice-project, native-boundary]
fixtures: [reset_db, file_open_files, taoffice_signed_project]
timeout_sec: 330
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- reload_window: null
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- fill: {selector: '[data-testid="module-offline-archive"]', value: '${fixture.project_archive}'}
- fill: {selector: '[data-testid="module-offline-signature"]', value: '${fixture.project_signature}'}
- click: '[data-testid="module-offline-submit"]'
- wait_for: '[data-testid="module-offline-install"][data-phase="completed"]'
- wait_for: '[data-testid="module-action-enable-taoffice-project"]:enabled'
- press: {selector: '[data-testid="module-action-enable-taoffice-project"]', key: Enter}
- wait_for: '[data-testid="module-action-disable-taoffice-project"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="shift-work.xml"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="shift-work.xml"]'
- wait_for: '[data-testid="taoffice-project-schedule"]'
- click: '[data-testid="taoffice-project-add-task"]'
- assert_focus_on: '[data-testid="taoffice-project-new-name"]'
- fill: {selector: '[data-testid="taoffice-project-new-name"]', value: Publish notes}
- click: '[data-testid="taoffice-project-create-task"]'
- wait_for: '[data-testid="taoffice-project-details"]:focus'
- assert_text: {selector: '[data-testid="taoffice-project-details"] h3', contains: Publish notes}
- select_option: {selector: '[data-testid="taoffice-project-predecessor"]', value: '2'}
- select_option: {selector: '[data-testid="taoffice-project-link-type"]', value: '1'}
- click: '[data-testid="taoffice-project-apply-link"]'
- assert_text: {selector: '[data-testid="taoffice-project-task-links"]', contains: Release review}
- assert_attribute: {selector: '[data-testid="taoffice-project-task"][data-uid="4"]', name: data-start, equals: '2026-12-03T13:00:00'}
- select_option: {selector: '[data-testid="taoffice-project-resource"]', value: '8'}
- fill: {selector: '[data-testid="taoffice-project-resource-units"]', value: '50'}
- click: '[data-testid="taoffice-project-apply-resource"]'
- assert_text: {selector: '[data-testid="taoffice-project-task-assignments"]', contains: Release engineer}
- assert_text: {selector: '[data-testid="taoffice-project-task-assignments"]', contains: '50%'}
- fill: {selector: '[data-testid="taoffice-project-task-progress"]', value: '25'}
- click: '[data-testid="taoffice-project-apply-progress"]'
- assert_text: {selector: '[data-testid="taoffice-project-task"][data-uid="4"]', contains: '25%'}
- native_file_dialog:
    kind: save
    action: choose
    path: ${fixture.file_open_root}/release-updated.xml
    trigger: '[data-testid="taoffice-project-save"]'
- wait_for: '[data-testid="taoffice-project-output"]'
- click: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="release-updated.xml"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="release-updated.xml"]'
- wait_for: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-task"][data-uid="4"]'
- click: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-task"][data-uid="4"] [data-testid="taoffice-project-open-details"]'
- assert_text: {selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-task-links"]', contains: Release review}
- assert_text: {selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-task-assignments"]', contains: '50%'}
- assert_text: {selector: '[data-testid="file-viewer"][data-active="true"] [data-testid="taoffice-project-task"][data-uid="4"]', contains: '25%'}
- assert_file_open_bytes: {path: '${fixture.file_open_root}/shift-work.xml', sha256: '${fixture.taoffice_schedule_sha}'}
- assert_no_runtime_errors: null

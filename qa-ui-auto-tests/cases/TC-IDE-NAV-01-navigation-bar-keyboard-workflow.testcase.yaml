    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-root\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-dir\"][data-path=\"src\"]"}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"][data-path=\"README.txt\"]"}'
    - step: 19
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor-pane\"]"}'
    - step: 21
      expectation: '{"wait_for": "[data-testid=\"code-workspace-breadcrumbs\"]"}'
    - step: 23
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-breadcrumbs\"]", "name": "tabindex",
        "equals": "0"}}'
    - step: 28
      expectation: '{"assert_attribute": {"selector": "[data-testid=\"code-workspace-breadcrumbs\"]", "name": "aria-label",
        "equals": "Editor breadcrumbs"}}'
    - step: 31

id: TC-WS-073
title: Large ordinary directory opens and switches files without recursive project discovery
description: Mount a public directory with 300 extra documents and 100 child folders. Measure actual cold and warm activations with the original 150ms frame/1500ms
  content budgets, retain the editor instance and dirty draft, and reject automatic recursive/SDK/LSP work.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
- F25.5
- F11.2
tags:
- p0
- workspace-redesign
- file-explorer
- regression
- performance
fixtures:
- reset_db
- workspace_large_directory
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-directory-performance
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="Documents"] [data-testid="code-workspace-tree-dir-arrow"]'
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/notes.txt"]'
    expected: ${fixture.workspace_notes_text}
    event: dblclick
    label: cold-notes
    require_highlight: false
    require_editor_reuse: false
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/page.html"]'
    expected: ${fixture.workspace_html_text}
    event: dblclick
    label: cold-html
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/records.json"]'
    expected: ${fixture.workspace_json_text}
    event: dblclick
    label: cold-json
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
    expected: ${fixture.workspace_notes_text}
    event: click
    label: return-notes
    require_highlight: false
    require_editor_reuse: true
- fill:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    value: Public draft retained in the home workspace
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="page.html"]'
    expected: ${fixture.workspace_html_text}
    event: click
    label: switch-html
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="records.json"]'
    expected: ${fixture.workspace_json_text}
    event: click
    label: switch-json
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
    expected: Public draft retained in the home workspace
    event: click
    label: switch-draft
    require_highlight: false
    require_editor_reuse: true
- assert_visible: '[data-testid="workspace-editor-save"]:enabled'
- assert_language_startup:
    commands:
      workspace_list_files_recursive:
        equal: 0
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_open_document:
        equal: 0
      workspace_execution_model:
        equal: 0
    quiet_ms: 1000
- assert_no_runtime_errors: null
- screenshot: workspace-tc-ws-073-file-activation.png
- click: '[data-testid="workspace-tab"][data-tab-title="records.json"]'
- click: '[data-testid="workspace-file-editor"] .cm-content'
- press:
    key: Mod+Home
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- eval_readonly:
    expression: document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.head === 0
    expect_truthy: true
- press:
    key: PageDown
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- eval_readonly:
    expression: document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.head > 0 && document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main.empty
      === true
    expect_truthy: true
- press:
    key: PageUp
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- eval_readonly:
    expression: document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.head === 0 && document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main.empty
      === true
    expect_truthy: true
- press:
    key: Shift+PageDown
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- eval_readonly:
    expression: document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.anchor === 0 && document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.head
      > 0 && document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main.empty === false
    expect_truthy: true
- press:
    key: Mod+End
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- press:
    key: Shift+PageUp
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- eval_readonly:
    expression: document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.anchor === document.querySelector('.cm-content')?.cmTile?.root?.view?.state.doc.length
      && document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.head < document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.anchor
    expect_truthy: true
- press:
    key: Mod+Home
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- press:
    key: Mod+Shift+a
    selector: '[data-testid="workspace-file-editor"] .cm-content'
- wait_for: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
- fill:
    selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
    value: Page Down
- wait_for: '[data-testid="search-everywhere-shortcut-editor.pageDown"]'
- click: '[data-testid="search-everywhere-shortcut-editor.pageDown"]'
- assert_not_visible: '[data-testid="code-workspace-search-everywhere"]'
- eval_readonly:
    expression: document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main?.head > 0 && document.querySelector('.cm-content')?.cmTile?.root?.view?.state.selection.main.empty
      === true
    expect_truthy: true
- assert_disabled: '[data-testid="workspace-editor-save"]'
- click: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
- assert_text:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    contains: Public draft retained in the home workspace
- assert_enabled: '[data-testid="workspace-editor-save"]'
- assert_no_runtime_errors: null
- screenshot: workspace-tc-ws-073-page-actions.png
verification:

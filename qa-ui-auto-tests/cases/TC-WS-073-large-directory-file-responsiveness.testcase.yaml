id: TC-WS-073
title: Large ordinary directory opens and switches files without recursive project discovery
description: Mount a public directory with 300 extra documents and 100 child folders. Measure actual cold and warm activations with the original 150ms frame/1500ms
  content budgets, retain the editor instance and dirty draft, and reject automatic recursive/SDK/LSP work.
modes:
- browser
- native
covers:
- F-WS-2
- F25.1
- F25.3
- F11.2
tags:
- p0
- workspace-redesign
- file-explorer
- regression
- performance
fixtures:
- reset_db
- workspace_large_directory
timeout_sec: 300
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-ws-directory-performance
- observe_language_startup: null
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree-empty"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-root"]'
- click: '[data-testid="code-workspace-tree-dir"][data-path="Documents"] [data-testid="code-workspace-tree-dir-arrow"]'
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/notes.txt"]'
    expected: ${fixture.workspace_notes_text}
    event: dblclick
    label: cold-notes
    require_highlight: false
    require_editor_reuse: false
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/page.html"]'
    expected: ${fixture.workspace_html_text}
    event: dblclick
    label: cold-html
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="code-workspace-tree-file"][data-path="Documents/records.json"]'
    expected: ${fixture.workspace_json_text}
    event: dblclick
    label: cold-json
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
    expected: ${fixture.workspace_notes_text}
    event: click
    label: return-notes
    require_highlight: false
    require_editor_reuse: true
- fill:
    selector: '[data-testid="workspace-file-editor"] .cm-content'
    value: Public draft retained in the home workspace
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="page.html"]'
    expected: ${fixture.workspace_html_text}
    event: click
    label: switch-html
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="records.json"]'
    expected: ${fixture.workspace_json_text}
    event: click
    label: switch-json
    require_highlight: true
    require_editor_reuse: true
- measure_workspace_file_open:
    selector: '[data-testid="workspace-tab"][data-tab-title="notes.txt"]'
    expected: Public draft retained in the home workspace
    event: click
    label: switch-draft
    require_highlight: false
    require_editor_reuse: true
- assert_visible: '[data-testid="workspace-editor-save"]:enabled'
- assert_language_startup:
    commands:
      workspace_list_files_recursive:
        equal: 0
      sdk_get_registry:
        equal: 0
      sdk_analyze_workspace:
        equal: 0
      sdk_resolve_workspace:
        equal: 0
      lsp_detect_servers:
        equal: 0
      lsp_open_document:
        equal: 0
      workspace_execution_model:
        equal: 0
    quiet_ms: 1000
- assert_no_runtime_errors: null
- screenshot: workspace-tc-ws-073-file-activation.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Cold open and warm tab switches meet the unchanged budgets, reuse the editor after the first document, preserve exact public contents and
      dirty text, and avoid recursive project/SDK/LSP discovery for ordinary documents.
    actions:
    - 4
    - 6
    - 7
    - 8
    - 9
    - 11
    - 16
    results:
    - 12
    - 13
    - 14
    - 15
    - 17
    - 18
    - 19
    - 20
    - 21
    - 22
    checkpoints:
    - step: 12
      expectation: "measure_workspace_file_open:\n  selector: '[data-testid=\"code-workspace-tree-file\"][data-path=\"Documents/notes.txt\"]'\n  expected:\
        \ ${fixture.workspace_notes_text}\n  event: dblclick\n  label: cold-notes\n  require_highlight: false\n  require_editor_reuse: false"
    - step: 13
      expectation: "measure_workspace_file_open:\n  selector: '[data-testid=\"code-workspace-tree-file\"][data-path=\"Documents/page.html\"]'\n  expected:\
        \ ${fixture.workspace_html_text}\n  event: dblclick\n  label: cold-html\n  require_highlight: true\n  require_editor_reuse: true"
    - step: 14
      expectation: "measure_workspace_file_open:\n  selector: '[data-testid=\"code-workspace-tree-file\"][data-path=\"Documents/records.json\"]'\n  expected:\
        \ ${fixture.workspace_json_text}\n  event: dblclick\n  label: cold-json\n  require_highlight: true\n  require_editor_reuse: true"
    - step: 15
      expectation: "measure_workspace_file_open:\n  selector: '[data-testid=\"workspace-tab\"][data-tab-title=\"notes.txt\"]'\n  expected: ${fixture.workspace_notes_text}\n\
        \  event: click\n  label: return-notes\n  require_highlight: false\n  require_editor_reuse: true"
    - step: 17
      expectation: "measure_workspace_file_open:\n  selector: '[data-testid=\"workspace-tab\"][data-tab-title=\"page.html\"]'\n  expected: ${fixture.workspace_html_text}\n\
        \  event: click\n  label: switch-html\n  require_highlight: true\n  require_editor_reuse: true"
    - step: 18
      expectation: "measure_workspace_file_open:\n  selector: '[data-testid=\"workspace-tab\"][data-tab-title=\"records.json\"]'\n  expected: ${fixture.workspace_json_text}\n\
        \  event: click\n  label: switch-json\n  require_highlight: true\n  require_editor_reuse: true"
    - step: 19
      expectation: "measure_workspace_file_open:\n  selector: '[data-testid=\"workspace-tab\"][data-tab-title=\"notes.txt\"]'\n  expected: Public draft\
        \ retained in the home workspace\n  event: click\n  label: switch-draft\n  require_highlight: false\n  require_editor_reuse: true"
    - step: 20
      expectation: 'assert_visible: ''[data-testid="workspace-editor-save"]:enabled'''
    - step: 21
      expectation: "assert_language_startup:\n  commands:\n    workspace_list_files_recursive:\n      equal: 0\n    sdk_get_registry:\n      equal: 0\n\
        \    sdk_analyze_workspace:\n      equal: 0\n    sdk_resolve_workspace:\n      equal: 0\n    lsp_detect_servers:\n      equal: 0\n    lsp_open_document:\n\
        \      equal: 0\n    workspace_execution_model:\n      equal: 0\n  quiet_ms: 1000"
    - step: 22
      expectation: 'assert_no_runtime_errors: null'
  native:
  - check: Real home/disk reads and the packaged WebView frame timings.
    method: automated
    reason: Browser VFS cannot establish native I/O, real home scanning or native rendering delays.
  visual:
  - check: Active document and ordinary file tree stay readable.
    method: manual
    reason: Retain screenshots; exact text, editor identity and every measured frame are asserted automatically.

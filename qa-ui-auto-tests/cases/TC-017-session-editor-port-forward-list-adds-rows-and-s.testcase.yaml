id: TC-017
title: Session editor port forward list adds rows and surfaces validation errors
covers:
- F6.3
- F3.2
tags:
- forwards
- legacy-imported
- network
- p1
- session
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: fw.example.test
- fill:
    selector: '[data-testid="session-port"]'
    value: '22'
- send_text_via_label:
    label_contains: Specify username
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: qauser
- click: '[data-testid="session-section-network"]'
- wait_for: '[data-testid="network-settings"]'
- fill:
    selector: input[aria-label="New forward local address"]
    value: 127.0.0.1:18080
- fill:
    selector: input[aria-label="New forward remote address"]
    value: svc.internal:80
- fill:
    selector: input[aria-label="New forward description"]
    value: qa-fwd-1
- click: '[data-testid="session-editor"] >> text="Add"'
- wait_for: '[data-testid="session-editor"] input[aria-label="Forward local address"]'
- assert_visible: '[data-testid="session-editor"] input[aria-label="Forward remote address"]'
- fill:
    selector: input[aria-label="New forward local address"]
    value: not-an-address
- fill:
    selector: input[aria-label="New forward remote address"]
    value: still:nope
- fill:
    selector: input[aria-label="New forward description"]
    value: qa-fwd-broken
- click: '[data-testid="session-editor"] >> text="Add"'
- wait: 1
- assert_count:
    selector: '[data-testid="session-editor"] input[aria-label="Forward local address"]'
    min: 2
- click: '[data-testid="session-section-bookmark"]'
- wait_for: '[data-testid="bookmark-settings"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-ui-auto-forwards
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-ui-auto-forwards"]'
- screenshot: 017-session-forwards.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Session editor port forward list adds rows and surfaces validation errors：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 4
    - 5
    - 6
    - 7
    - 8
    - 10
    - 11
    - 12
    - 13
    - 16
    - 17
    - 18
    - 19
    - 22
    - 24
    - 25
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"session-editor\"]"}'
    - step: 9
      expectation: '{"wait_for": "[data-testid=\"network-settings\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"session-editor\"] input[aria-label=\"Forward local address\"]"}'
    - step: 15
      expectation: '{"assert_visible": "[data-testid=\"session-editor\"] input[aria-label=\"Forward remote address\"]"}'
    - step: 21
      expectation: '{"assert_count": {"selector": "[data-testid=\"session-editor\"] input[aria-label=\"Forward local
        address\"]", "min": 2}}'
    - step: 23
      expectation: '{"wait_for": "[data-testid=\"bookmark-settings\"]"}'
    - step: 26
      expectation: '{"wait_for": "[data-testid=\"session-tree-item\"][data-session-name=\"qa-ui-auto-forwards\"]"}'
    results:
    - 26
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

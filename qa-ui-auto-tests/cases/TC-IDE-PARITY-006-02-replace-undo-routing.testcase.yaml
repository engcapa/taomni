  visual:
  - check: 撤销确认对话框标题、文案、OK/Cancel布局符合小模态居中规格
    method: manual
    reason: 对话框视觉样式与遮罩层需人工评审
  native:
  - check: browser模式验证DOM焦点路由，主机磁盘写入与WebView2键盘由TC-IDE-PARITY-006-03验证

    results: [20, 24, 25, 29, 33, 35, 37, 39, 42, 43, 44, 46, 48, 49, 50, 56, 57, 59, 60, 61, 62, 67, 68, 71]
  visual:
  - check: Undo dialog and focus transitions are readable.
    method: manual
    reason: Screenshot is retained without a pixel matched claim.
  native:
  - check: Packaged WebView key routing and host bytes require TC-IDE-PARITY-006-03 on the current platform; other platforms remain unverified.
    method: external
    reason: Browser VFS does not certify native disk or OS shortcut behavior.

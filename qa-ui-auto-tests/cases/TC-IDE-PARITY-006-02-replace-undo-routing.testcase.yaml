id: TC-IDE-PARITY-006-02
title: Replace undo confirmation and input focus routing
description: Browser VFS sequence for workspace undo confirmation, input Ctrl+Z exemption,
  editor undo ownership, and the Replace in Files focus target.
covers: [F25.5]
tags: [code-workspace, ide-find, replace, undo, parity006, p1]
modes: [browser]
fixtures: [reset_db, parity006_replace]
timeout_sec: 240
steps:
  - open: ${cfg.app.base_url}
  - wait_for: '[data-testid="welcome-panel"]'
  - click: '[data-testid="welcome-history-tab-workspaces"]'
  - click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity006_root}"]'
  - wait_for: '[data-testid="code-workspace-tab"]'
  - press: Control+Shift+F
  - wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
  - select_option:
      selector: '[data-testid="code-workspace-find-scope-select"]'
      value: directory
  - fill:
      selector: '[data-testid="code-workspace-find-directory-input"]'
      value: src
  - fill:
      selector: '[aria-label="Include globs"]'
      value: "*.txt"
  - fill:
      selector: '[aria-label="Search query"]'
      value: token
  - press: Enter
  - wait_for: '[data-testid="code-workspace-find-file-group"]'
  - click: '[data-testid="code-workspace-find-match-row"]:has-text("beta token two")'
  - press: Delete
  - fill:
      selector: '[aria-label="Replace text"]'
      value: coin
  - click: '[data-testid="code-workspace-find-replace-all"]'
  - wait_for: '[data-testid="code-workspace-replace-preview"]'
  - press: Enter
  - assert_text:
      selector: '[data-testid="code-workspace-find-replaced-notice"]'
      contains: Replaced 2 occurrences in 2 files
  - click: '[aria-label="Search query"]'
  - press: Control+z
  - press: Control+Shift+z
  - assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
      equals: [alpha coin one, beta token two, '']
  - click: '[data-testid="code-workspace-find-match-row"]'
  - press: Control+z
  - wait_for: '[data-testid="code-workspace-undo-confirm"]'
  - assert_text:
      selector: '[data-testid="code-workspace-undo-confirm"]'
      contains: Undo Replace in files?
  - eval_readonly:
      expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-undo-confirm-ok'
      expect_truthy: true
  - click: '[data-testid="code-workspace-undo-confirm-cancel"]'
  - assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
      equals: [alpha coin one, beta token two, '']
  - click: '[data-testid="code-workspace-find-match-row"]'
  - press: Control+z
  - wait_for: '[data-testid="code-workspace-undo-confirm"]'
  - press: Escape
  - assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
      equals: [alpha coin one, beta token two, '']
  - click: '[data-testid="code-workspace-find-match-row"]'
  - press: Control+Shift+N
  - wait_for: '[data-testid="code-workspace-search-everywhere"]'
  - click: '[data-testid="code-workspace-search-everywhere"] >> role=tab[name="Actions"]'
  - fill:
      selector: '[data-testid="code-workspace-search-everywhere"] input[aria-label="Search actions"]'
      value: Undo Replace in files
  - click: '[data-testid="code-workspace-search-everywhere"] >> text=Undo Replace in files'
  - wait_for: '[data-testid="code-workspace-undo-confirm"]'
  - click: '[data-testid="code-workspace-undo-confirm-ok"]'
  - assert_text:
      selector: '[data-testid="status-bar-message"]'
      contains: Undid Replace in files (2 files)
  - assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
      equals: [alpha token one, beta token two, '']
  - click: '[data-testid="code-workspace-editor"] .cm-content'
  - press: End
  - type: x
  - press: Control+z
  - assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
  - assert_items:
      selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
      equals: [alpha token one, beta token two, '']
  - press: Control+Shift+R
  - wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
  - eval_readonly:
      expression: document.activeElement?.getAttribute('aria-label') === 'Replace text'
      expect_truthy: true
  - screenshot: tc-ide-parity-006-02-undo-routing.png

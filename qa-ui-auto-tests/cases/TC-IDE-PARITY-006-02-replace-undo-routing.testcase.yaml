id: TC-IDE-PARITY-006-02
title: Replace undo routing and confirmation in browser
description: Browser gate case for ED-PARITY-006 A3/V4. Search input Ctrl+Z/Ctrl+Shift+Z is exempt from workspace command dispatch (preserves native text undo); result row Ctrl+Z asks confirmation before multi-file undo; Cancel and Escape leave history untouched; OK undoes both files; editor-owned Ctrl+Z claims journal directly without confirmation; workspace.replaceInFiles focuses Replace text.
covers:
- F25.5
tags:
- code-workspace
- ide-find
- replace
- parity006
- p1
modes:
- browser
fixtures:
- reset_db
- parity006_replace
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.parity006_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- press: Control+Shift+F
- wait_for: '[data-testid="code-workspace-find-in-files-panel"]'
- select_option:
    selector: '[data-testid="code-workspace-find-scope-select"]'
    value: directory
- fill:
    selector: '[data-testid="code-workspace-find-directory-input"]'
    value: src
- fill:
    selector: '[aria-label="Include globs"]'
    value: '*.txt'
- fill:
    selector: '[aria-label="Search query"]'
    value: token
- press: Enter
- wait_for: '[data-testid="code-workspace-find-file-group"]'
- click: '[data-testid="code-workspace-find-match-row"][title*="b.txt:1"]'
- wait_for: '[data-testid="code-workspace-editor-tab-strip"] button[title*="b.txt"]'
- click: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
- press:
    key: Delete
    selector: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-find-match-row"][title*="a.txt:2"]'
    name: data-excluded
    equals: 'true'
- fill:
    selector: '[aria-label="Replace text"]'
    value: coin
- click: '[data-testid="code-workspace-find-replace-all"]'
- wait_for: '[data-testid="code-workspace-replace-preview"]'
- press: Enter
- assert_not_visible: '[data-testid="code-workspace-replace-preview"]'
- wait_for: '[data-testid="code-workspace-find-replaced-notice"]'
- click: '[data-testid="code-workspace-editor-tab-strip"] button[title*="a.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - alpha coin one
    - beta token two
    - ''
- click: '[aria-label="Search query"]'
- press: Control+z
- press: Control+Shift+z
- assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - alpha coin one
    - beta token two
    - ''
- click: '[data-testid="code-workspace-find-match-row"]'
- press: Control+z
- wait_for: '[data-testid="code-workspace-undo-confirm"]'
- assert_text:
    selector: '[data-testid="code-workspace-undo-confirm"]'
    contains: Undo Replace in files?
- eval_readonly:
    expression: document.activeElement?.getAttribute('data-testid') === 'code-workspace-undo-ok'
    expect_truthy: true
- click: '[data-testid="code-workspace-undo-cancel"]'
- assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - alpha coin one
    - beta token two
    - ''
- click: '[data-testid="code-workspace-find-match-row"]'
- press: Control+z
- wait_for: '[data-testid="code-workspace-undo-confirm"]'
- press: Escape
- assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - alpha coin one
    - beta token two
    - ''
- click: '[data-testid="code-workspace-find-match-row"]'
- press: Control+z
- wait_for: '[data-testid="code-workspace-undo-confirm"]'
- click: '[data-testid="code-workspace-undo-ok"]'
- assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
- click: '[data-testid="code-workspace-editor-tab-strip"] button[title*="a.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - alpha token one
    - beta token two
    - ''
- click: '[data-testid="code-workspace-editor-tab-strip"] button[title*="b.txt"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - gamma token three
    - ''
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: End
- press: x
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: gamma token threex
- press: Control+z
- assert_not_visible: '[data-testid="code-workspace-undo-confirm"]'
- assert_items:
    selector: '[data-testid="code-workspace-editor"] .cm-content .cm-line'
    equals:
    - gamma token three
    - ''
- press: Control+Shift+R
- eval_readonly:
    expression: document.activeElement?.getAttribute('aria-label') === 'Replace text'
    expect_truthy: true
- screenshot: tc-ide-parity-006-02-undo.png

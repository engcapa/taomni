id: TC-MFA-006
title: A Google Authenticator export QR imports several accounts once
description: 'V-15 (AC-05, AC-08). Browser stub. A pasted otpauth-migration QR (QA
  Mail TOTP + QA Git HOTP) is pasted into the image drop zone with the platform shortcut
  and previews two accounts; unchecking one updates the Import count; both are imported
  into one group with RFC-correct codes. Importing the same export again marks both
  as already added, disables Import, and Back plus Escape leave the list unchanged.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware
  user clicks; Settings uses its permanent Rail button. Original business checks are
  retained.'
covers:
- F-MFA-1
- F-MFA-2
tags:
- mfa
- import
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: tools
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-mfa"]'
- wait_for: '[data-testid="vault-setup-dialog"]'
- fill:
    selector: '[data-testid="vault-setup-pw1"]'
    value: qa-mfa-master-006
- fill:
    selector: '[data-testid="vault-setup-pw2"]'
    value: qa-mfa-master-006
- click: '[data-testid="vault-setup-confirm"]'
- wait_for: '[data-testid="mfa-empty"]'
- click: '[data-testid="mfa-empty-add-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- seed_clipboard_image:
    path: qa-ui-auto-tests/synthetic-fixtures/mfa/migration-two.png
- press:
    key: Mod+V
    selector: '[data-testid="mfa-image-dropzone"]'
- wait_for:
    selector: '[data-testid="mfa-import-preview"]'
    timeout_sec: 20
- assert_items:
    selector: '[data-testid="mfa-import-item"]'
    attribute: data-issuer
    equals:
    - QA Mail
    - QA Git
- assert_text:
    selector: '[data-testid="mfa-import-preview"]'
    contains: 2 account(s) found
- assert_count:
    selector: '[data-testid="mfa-import-issuer"]'
    equal: 0
- click: '[data-testid="mfa-import-item-check"]:is([data-issuer="QA Git"] *)'
- assert_text_equals:
    selector: '[data-testid="mfa-import-confirm"]'
    equals: Import 1
- click: '[data-testid="mfa-import-item-check"]:is([data-issuer="QA Git"] *)'
- assert_text_equals:
    selector: '[data-testid="mfa-import-confirm"]'
    equals: Import 2
- fill:
    selector: '[data-testid="mfa-import-group"]'
    value: Migrated
- click: '[data-testid="mfa-import-confirm"]'
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_items:
    selector: '[data-testid="mfa-account-row"]'
    attribute: data-issuer
    equals:
    - QA Mail
    - QA Git
- assert_totp_code:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Mail"] *)'
    secret: OFQS23LJM5ZGC5DJN5XC23LBNFWC2MBR
- assert_text_equals:
    selector: '[data-testid="mfa-account-code"]:is([data-issuer="QA Git"] *)'
    equals: 691 157
- assert_items:
    selector: '[data-testid="mfa-account-group"]'
    equals:
    - Migrated
    - Migrated
- click: '[data-testid="mfa-add"]'
- click: '[data-testid="mfa-add-mode-image"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- seed_clipboard_image:
    path: qa-ui-auto-tests/synthetic-fixtures/mfa/migration-two.png
- click: '[data-testid="mfa-image-paste"]'
- wait_for:
    selector: '[data-testid="mfa-import-all-duplicates"]'
    timeout_sec: 20
- assert_count:
    selector: '[data-testid="mfa-import-duplicate"]'
    equal: 2
- assert_disabled: '[data-testid="mfa-import-confirm"]'
- click: '[data-testid="mfa-import-back"]'
- wait_for: '[data-testid="mfa-add-dialog"][data-mode="image"]'
- press: Escape
- assert_not_visible: '[data-testid="mfa-add-dialog"]'
- assert_count:
    selector: '[data-testid="mfa-account-row"]'
    equal: 2
- screenshot: mfa-006-migration-import.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A migration QR pasted into the drop zone previews every account it
      carries, and selection changes the Import count (AC-05, AC-08).
    actions:
    - 11
    - 13
    - 14
    - 19
    - 21
    checkpoints:
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"mfa-add-dialog\"][data-mode=\"image\"]"}'
    - step: 15
      expectation: '{"wait_for": {"selector": "[data-testid=\"mfa-import-preview\"]",
        "timeout_sec": 20}}'
    - step: 16
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-import-item\"]",
        "attribute": "data-issuer", "equals": ["QA Mail", "QA Git"]}}'
    - step: 17
      expectation: '{"assert_text": {"selector": "[data-testid=\"mfa-import-preview\"]",
        "contains": "2 account(s) found"}}'
    - step: 18
      expectation: '{"assert_count": {"selector": "[data-testid=\"mfa-import-issuer\"]",
        "equal": 0}}'
    - step: 20
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-import-confirm\"]",
        "equals": "Import 1"}}'
    - step: 22
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-import-confirm\"]",
        "equals": "Import 2"}}'
    results:
    - 22
  - id: R2
    requirement: Both accounts are imported into the chosen group with correct TOTP
      and HOTP codes (AC-05, AC-09).
    actions:
    - 23
    - 24
    checkpoints:
    - step: 25
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    - step: 26
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-account-row\"]",
        "attribute": "data-issuer", "equals": ["QA Mail", "QA Git"]}}'
    - step: 27
      expectation: '{"assert_totp_code": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        Mail\"] *)", "secret": "OFQS23LJM5ZGC5DJN5XC23LBNFWC2MBR"}}'
    - step: 28
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"mfa-account-code\"]:is([data-issuer=\"QA
        Git\"] *)", "equals": "691 157"}}'
    - step: 29
      expectation: '{"assert_items": {"selector": "[data-testid=\"mfa-account-group\"]",
        "equals": ["Migrated", "Migrated"]}}'
    results:
    - 26
    - 27
    - 28
    - 29
  - id: R3
    requirement: Re-importing the export flags every account as already added and
      changes nothing (AC-08).
    actions:
    - 30
    - 31
    - 33
    - 34
    - 38
    - 40
    checkpoints:
    - step: 32
      expectation: '{"wait_for": "[data-testid=\"mfa-add-dialog\"][data-mode=\"image\"]"}'
    - step: 35
      expectation: '{"wait_for": {"selector": "[data-testid=\"mfa-import-all-duplicates\"]",
        "timeout_sec": 20}}'
    - step: 36
      expectation: '{"assert_count": {"selector": "[data-testid=\"mfa-import-duplicate\"]",
        "equal": 2}}'
    - step: 37
      expectation: '{"assert_disabled": "[data-testid=\"mfa-import-confirm\"]"}'
    - step: 39
      expectation: '{"wait_for": "[data-testid=\"mfa-add-dialog\"][data-mode=\"image\"]"}'
    - step: 41
      expectation: '{"assert_not_visible": "[data-testid=\"mfa-add-dialog\"]"}'
    - step: 42
      expectation: '{"assert_count": {"selector": "[data-testid=\"mfa-account-row\"]",
        "equal": 2}}'
    results:
    - 42
  visual:
  - check: Batch review list with checkboxes and duplicate badges is legible.
    method: manual
    reason: Screenshot needs human review.
  native:
  - check: The same TypeScript parser runs in the desktop WebView; Rust re-validation
      is covered by unit tests.
    method: external
    reason: Browser stub evidence is not native.

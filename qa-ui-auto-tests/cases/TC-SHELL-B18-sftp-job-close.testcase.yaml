- wait_for: '[data-testid="shell-close-cancel-job"]'
- shell_backend_scenario:
    action: hold
    command: sftp_cancel_transfer
- click: '[data-testid="shell-close-cancel-job"]'
- click: '[data-testid="shell-close-confirm"]'
- assert_shell_backend:
    command: sftp_cancel_transfer
    status: held
    count: 1
- assert_count:
    selector: '[data-testid="tab-item"]:has-text("qa-beta")'
    equal: 1
- shell_backend_scenario:

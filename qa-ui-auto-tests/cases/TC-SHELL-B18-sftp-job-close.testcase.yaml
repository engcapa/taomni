- click: '[data-testid="sftp-remote-download-selected"]'
- wait_for: '[data-testid="transfer-job"][data-session-id*="shell-a"][data-state="running"]'
- assert_attribute:
    selector: '[data-testid="transfer-job"][data-session-id*="shell-a"]'
    name: data-bytes
    equals: '27033'
- assert_count:
    selector: '[data-testid="transfer-job"][data-session-id*="shell-a"]'
    equal: 1
- click: '[data-testid="shell-host-hide"]'
- assert_not_visible: '[data-testid="shell-host"]'

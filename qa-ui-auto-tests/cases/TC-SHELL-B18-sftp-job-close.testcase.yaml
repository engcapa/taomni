- assert_not_visible: '[data-testid="shell-close-dialog"]'
- assert_count:
    selector: '[data-testid="tab-item"]:has-text("qa-beta")'
    equal: 0
- click: '[data-testid="shell-transfers-trigger"]'
- wait_for: '[data-testid="shell-transfers"]'
- assert_attribute:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-session-id*="shell-a"]'
    name: data-state
    equals: done
- assert_attribute:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"][data-session-id*="shell-b"]'
    name: data-state
    equals: cancelled
- assert_count:
    selector: '[data-testid="shell-transfers"] [data-testid="transfer-job"]'
    equal: 2

id: TC-SHELL-B18
title: Two transfer owners survive hide, background close, pause and acknowledged cancellation
description: Workspace Shell v2 production workflow; docs-feature/workspace-shell-ux-redesign-test-cases.md#v-b18.
  Browser service fixtures do not establish native effects.
covers:
- F7.4
- F-SHELL-1
- F-TAO-1
tags:
- p1
- workspace-shell
modes:
- browser
fixtures:
- reset_db
- shell_browser_catalog
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-recent-session-row"][data-session-id="shell-a"] [data-testid="welcome-recent-open"]'
- wait_for: '[data-testid="terminal-pane"]:visible'
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for: '[data-testid="sftp-remote-list"]'

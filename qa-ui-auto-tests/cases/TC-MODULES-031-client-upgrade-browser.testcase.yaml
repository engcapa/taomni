id: TC-MODULES-031
title: Upgrade preview lists two modules for three distinct remote desktop data sources
description: Uses an explicit browser model with RDP/VNC sessions and an RDP pin as three candidate items. Settings must list
  rdp-client and vnc-client exactly once before and after pending, reload and repeat. Native 030 independently checks all
  three journal entries and original SQLite rows; this browser model is renderer evidence only.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- browser
fixtures:
- reset_db
- module_upgrade
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 2
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: rdp-client
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: vnc-client
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: rdp-client
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: vnc-client
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: Browser preview
- reload_window: null
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'

id: TC-155
title: Native local and SSH terminals copy complete first-column selections from the gutter
description: Preserve complete forward, reverse and block selection clipboard results through font zoom and fullscreen.
  Search highlight coordinates must follow terminal buffer reflow so the post-zoom drag still targets the actual output row.
covers:
- F2.1
- F2.2
- F3.1
- F4.1
- F4.2
- F4.8
tags:
- terminal
- selection
- layout
- p1
modes:
- native
fixtures:
- reset_db
- ssh_required
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-open-local-terminal"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
    timeout_sec: 60
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left - document.querySelector("[data-terminal-active]").getBoundingClientRect().left >= 8
    expect_truthy: true
    timeout_sec: 5
- eval_readonly:
    expression: document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().right <= document.querySelector("[data-terminal-active]").getBoundingClientRect().right
    expect_truthy: true
    timeout_sec: 5
- terminal_input:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-helper-textarea'
    text: ' echo QA-LEFT-""GUTTER'
    submit: true
    verify:
      selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
      regex: (?m)^QA-LEFT-GUTTER\r?$
      timeout_sec: 10
      attempts: 2
- assert_pattern:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    regex: (?m)^QA-LEFT-GUTTER\r?$
    timeout_sec: 20
- right_click: '[data-testid="terminal-pane"][data-terminal-active="true"]'
- click: '[data-testid="context-menu-item-find"]'
- wait_for: input[placeholder="Find"]
# Fill uses the host's native adapter: exact input on macOS, real keys with
# verified clipboard recovery on Linux. Synthetic macOS Cmd+V is not OS paste.
# Require the complete query before targeting first-column geometry.
- fill:
    selector: input[placeholder="Find"]
    value: QA-LEFT-GUTTER
- eval_readonly:
    expression: document.activeElement.getAttribute("placeholder") === "Find" && document.activeElement.value === "QA-LEFT-GUTTER"
    expect_truthy: true
    timeout_sec: 5
- press: Enter
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"] .terminal-search-hit-active'
- eval_readonly:
    expression: Math.abs(document.querySelector("[data-terminal-active] .terminal-search-hit-active").getBoundingClientRect().left - document.querySelector("[data-terminal-active] .xterm-screen").getBoundingClientRect().left) < 1
    expect_truthy: true
    timeout_sec: 5
- host_clipboard:
    action: set
    kind: text
    text: NOT-SELECTED
- click: '[data-testid="terminal-pane"][data-terminal-active="true"] .xterm-screen'
- wait_for:
    selector: button[title="Copy (Ctrl+C)"]
    state: hidden
- terminal_drag_selection:
    selector: '[data-testid="terminal-pane"][data-terminal-active="true"]'
    direction: forward
- wait_for: button[title="Copy (Ctrl+C)"]
- click: button[title="Copy (Ctrl+C)"]
- host_clipboard:
    action: assert
    kind: text
    equals: QA-LEFT-GUTTER

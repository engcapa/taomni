  visual:
  - check: Inspect first-column spacing, selected text and highlight alignment in normal and fullscreen screenshots.
    method: manual
    reason: DOM geometry and clipboard assertions are automated; screenshots still need separate visual review.
  native:
  - check: Verify first-column selection and copied bytes in the packaged WebView on each selected OS.
    method: automated
    reason: Native uses the real local/SSH terminal, W3C pointer input and independent OS clipboard reads; browser mode proves the shared renderer and browser clipboard only. macOS uses the packaged WKWebView event bridge, not OS-global mouse injection.

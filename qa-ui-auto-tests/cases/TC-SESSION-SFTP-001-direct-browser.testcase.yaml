id: TC-SESSION-SFTP-001
title: Default direct SSH and fixed SFTP work with an unreachable application proxy
covers:
- F3.2
- F6.2
- F6.3
- F7.2
tags:
- session
- ssh
- sftp
- network
- regression
modes:
- native
fixtures:
- reset_db
- ssh_required
- sftp_required
- unreachable_app_proxy
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="sidebar"]'
- click: '[data-testid="session-new"]'
- wait_for: '[data-testid="session-editor"]'
- fill:
    selector: '[data-testid="session-host"]'
    value: ${cfg.ssh.host}
- fill:
    selector: '[data-testid="session-port"]'
    value: ${cfg.ssh.port}
- set_check:
    selector: '[data-testid="session-specify-username"]'
    checked: true
- fill:
    selector: '[data-testid="session-user"]'
    value: ${cfg.ssh.user}
- fill:
    selector: input[aria-label="SSH password"]
    value: ${env.QA_SSH_PASSWORD}
- assert_text_equals:
    selector: '[data-testid="session-ssh-browser-type"]'
    equals: SFTP protocol (recommended)
- assert_count:
    selector: '[data-testid="session-ssh-browser-type"]:is(select)'
    equal: 0
- click: '[data-testid="session-section-network"]'
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: none
- click: '[data-testid="session-test-connection"]'
- wait_for: '[data-testid="alert-dialog"]'
- assert_attribute:
    selector: '[data-testid="alert-dialog"]'
    name: data-tone
    equals: success
- click: '[data-testid="alert-dialog-ok"]'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: app
- click: '[data-testid="session-test-connection"]'
- wait_for: '[data-testid="alert-dialog"]'
- assert_attribute:
    selector: '[data-testid="alert-dialog"]'
    name: data-tone
    equals: error
- click: '[data-testid="alert-dialog-ok"]'
- select_option:
    selector: '[data-testid="session-proxy-kind"]'
    value: none
- click: '[data-testid="session-test-connection"]'
- wait_for: '[data-testid="alert-dialog"]'
- assert_attribute:
    selector: '[data-testid="alert-dialog"]'
    name: data-tone
    equals: success
- click: '[data-testid="alert-dialog-ok"]'
- click: '[data-testid="session-section-bookmark"]'
- fill:
    selector: '[data-testid="session-name"]'
    value: qa-default-direct-sftp
- click: '[data-testid="session-save"]'
- wait_for: '[data-testid="session-tree-item"][data-session-name="qa-default-direct-sftp"]'
- click: '[data-testid="session-tree-item"][data-session-name="qa-default-direct-sftp"]'
- click: '[data-testid="session-edit"]'
- wait_for: '[data-testid="session-editor"]'
- assert_text_equals:
    selector: '[data-testid="session-ssh-browser-type"]'
    equals: SFTP protocol (recommended)
- assert_count:
    selector: '[data-testid="session-ssh-browser-type"]:is(select)'
    equal: 0
- click: '[data-testid="session-section-network"]'
- assert_attribute:
    selector: '[data-testid="session-proxy-kind"]'
    name: value
    equals: none
- click: '[data-testid="session-cancel"]'
- dblclick: '[data-testid="session-tree-item"][data-session-name="qa-default-direct-sftp"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for:
    selector: '[data-testid="terminal-pane"][data-terminal-ready="true"]'
    timeout_sec: 60
- terminal_input:
    selector: '[data-testid="terminal-pane"] .xterm-helper-textarea'
    text: mkdir -p '${fixture.sftp_shell_test_dir}/direct-default' && printf 'sftp-direct-bytes\n' > '${fixture.sftp_shell_test_dir}/direct-default/direct-sftp.txt'
      && printf '\nQA_DIRECT_SFTP_READY\n'
    submit: true
- assert_pattern:
    selector: '[data-testid="terminal-pane"]'
    regex: (?m)^QA_DIRECT_SFTP_READY\r?$
    timeout_sec: 60
- click: '[data-testid="attached-sftp-toggle"]'
- wait_for:
    selector: '[data-testid="sftp-browser"]'
    timeout_sec: 45
- click: '[data-testid="sftp-remote-path-edit"]'
- fill:
    selector: '[data-testid="sftp-remote-path"]'
    value: ${fixture.sftp_sync_test_dir}/direct-default
- press: Enter
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: direct-sftp.txt
    timeout_sec: 45
- click: '[data-testid="attached-sftp-toggle"]'
- click: '[data-testid="attached-sftp-toggle"]'
- assert_text:
    selector: '[data-testid="sftp-remote-list"]'
    contains: direct-sftp.txt
    timeout_sec: 45
- screenshot: session-direct-sftp-native.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A new SSH session connects directly despite an unreachable application proxy; explicitly
      choosing that proxy fails without fallback and returning to direct succeeds. Saved direct settings
      and fixed SFTP reopen correctly, and the attached native SFTP channel lists a file created by the
      real SSH shell after closing/reopening the view.

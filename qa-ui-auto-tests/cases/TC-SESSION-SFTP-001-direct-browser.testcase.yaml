  visual:
  - check: Configuration and workflow state
    method: automated
    reason: Visible fields and exact values are asserted at each decisive state.
  native:
  - check: Native boundary
    method: automated
    reason: Requires real Rust SSH/SFTP connections and SQLite persistence. The fixture owns a non-listening
      proxy endpoint inside the isolated QA profile; success and failure distinguish proxy routing without
      mocks.

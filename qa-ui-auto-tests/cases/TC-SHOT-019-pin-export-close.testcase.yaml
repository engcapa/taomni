id: TC-SHOT-019
title: Pin retains the original crop; options and explicit close entries preserve window lifecycle
description: Browser pin route and real renderer PNG export only; always-on-top positioning and native window dragging are not asserted.
covers:
- F27.1
tags:
- screenshot
- pin
- p1
modes:
- browser
fixtures:
- reset_db
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport:
    width: 1000
    height: 750
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position:
      x: 100
      y: 100
    to_position:
      x: 500
      y: 400
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position:
      x: 160
      y: 160
    to_position:
      x: 300
      y: 260
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- assert_visible: '[data-testid="screenshot-pin-window"]'
- assert_not_visible: '[data-testid="screenshot-overlay"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-image"]'
    name: src
    matches: data:image/png;base64,.*
- eval_readonly:
    expression: document.querySelector('img').naturalWidth === 160 && document.querySelector('img').naturalHeight === 120
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-2).cmd === "screenshot_pin_to_screen" && window.__taomniStubScreenshotCalls.at(-2).args.path
      === window.__taomniStubScreenshotCalls.at(-3).args.path && window.__taomniStubScreenshotCalls.at(-3).args.width === 160
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-pin-window"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_close_pin"
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- eval_readonly:
    expression: document.querySelector('img').naturalWidth === 400 && document.querySelector('img').naturalHeight === 300
- dblclick: '[data-testid="screenshot-pin-window"]'
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-pin-window"]'
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- right_click: '[data-testid="screenshot-pin-window"]'
- wait_for: '[data-testid="screenshot-pin-menu"]'
- press: Escape
- assert_not_visible: '[data-testid="screenshot-pin-menu"]'
- click: '[data-testid="screenshot-pin-close"]'
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-pin-window"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_pin_to_screen"').length === 4 && JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_close_pin"').length
      === 4
verification:
  review: reviewed
  requirements:
  - id: workflow
    requirement: Public Pin exports the annotated crop and subsequent fullscreen original. Escape and double-click close their pin.
      Right-click opens options; Escape dismisses options and the close button tears down the pin, with exactly three pin/close dispatches.
    actions:
    - 1
    - 2
    - 4
    - 6
    - 7
    - 9
    - 16
    - 20
    - 22
    - 24
    - 27
    - 30
    - 32
    - 34
    - 36
    - 38
    - 40
    checkpoints:
    - step: 11
      expectation: 'assert_visible: [data-testid="screenshot-pin-window"]'
    - step: 12
      expectation: 'assert_not_visible: [data-testid="screenshot-overlay"]'
    - step: 13
      expectation: 'assert_attribute: {''selector'': ''[data-testid="screenshot-pin-image"]'', ''name'': ''src'', ''matches'': ''data:image/png;base64,.*''}'
    - step: 14
      expectation: 'eval_readonly: {''expression'': "document.querySelector(''img'').naturalWidth === 160 && document.querySelector(''img'').naturalHeight
        === 120"}'
    - step: 15
      expectation: 'eval_readonly: {''expression'': ''window.__taomniStubScreenshotCalls.at(-2).cmd === "screenshot_pin_to_screen" &&
        window.__taomniStubScreenshotCalls.at(-2).args.path === window.__taomniStubScreenshotCalls.at(-3).args.path && window.__taomniStubScreenshotCalls.at(-3).args.width
        === 160''}'
    - step: 18
      expectation: 'assert_not_visible: [data-testid="screenshot-pin-window"]'
    - step: 19
      expectation: 'eval_readonly: {''expression'': ''window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_close_pin"''}'
    - step: 26
      expectation: 'eval_readonly: {''expression'': "document.querySelector(''img'').naturalWidth === 400 && document.querySelector(''img'').naturalHeight
        === 300"}'
    - step: 29
      expectation: 'assert_not_visible: [data-testid="screenshot-pin-window"]'
    - step: 39
      expectation: 'assert_not_visible: [data-testid="screenshot-pin-menu"]'
    - step: 42
      expectation: 'assert_not_visible: [data-testid="screenshot-pin-window"]'
    - step: 43
      expectation: 'eval_readonly: {''expression'': ''JSON.stringify(window.__taomniStubScreenshotCalls).split(\''"cmd":"screenshot_pin_to_screen"\'').length
        === 4 && JSON.stringify(window.__taomniStubScreenshotCalls).split(\''"cmd":"screenshot_close_pin"\'').length === 4''}'
    results:
    - 11
    - 12
    - 13
    - 14
    - 15
    - 18
    - 19
    - 26
    - 29
    - 39
    - 42
    - 43
  visual:
  - check: Visible controls, state and image dimensions
    method: automated
    reason: Assertions check actual renderer state and output; screenshots are retained.
  native:
  - check: OS input, clipboard, windows and persistent files
    method: external
    reason: Browser uses IPC stubs; matching SHOT-N scenarios own actual desktop and disk assertions.

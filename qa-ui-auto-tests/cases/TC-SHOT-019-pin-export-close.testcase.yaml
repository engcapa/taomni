id: TC-SHOT-019
title: Pin public action displays the retained crop and all close entries tear down the pin
description: Browser pin route and real renderer PNG export only; always-on-top positioning and native window dragging are not asserted.
covers: [F27.1]
tags: [screenshot, pin, p1]
modes: [browser]
fixtures: [reset_db]
steps:
- open: ${cfg.app.base_url}#screenshot-overlay
- set_viewport: {width: 1000, height: 750}
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- drag_to:
    from: '[data-testid="screenshot-select-layer"]'
    to: '[data-testid="screenshot-select-layer"]'
    from_position: {x: 100, y: 100}
    to_position: {x: 500, y: 400}
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-tool-rect"]'
- drag_to:
    from: '[data-testid="screenshot-annotation-layer"]'
    to: '[data-testid="screenshot-annotation-layer"]'
    from_position: {x: 160, y: 160}
    to_position: {x: 300, y: 260}
- wait_for: '[data-testid="screenshot-annotation-canvas"][data-shapes="1"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- assert_visible: '[data-testid="screenshot-pin-window"]'
- assert_not_visible: '[data-testid="screenshot-overlay"]'
- assert_attribute:
    selector: '[data-testid="screenshot-pin-image"]'
    name: src
    matches: 'data:image/png;base64,.*'
- eval_readonly:
    expression: document.querySelector('img').naturalWidth === 160 && document.querySelector('img').naturalHeight === 120
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-2).cmd === "screenshot_pin_to_screen" && window.__taomniStubScreenshotCalls.at(-2).args.path === window.__taomniStubScreenshotCalls.at(-3).args.path && window.__taomniStubScreenshotCalls.at(-3).args.width === 160
- press: Escape
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-pin-window"]'
- eval_readonly:
    expression: window.__taomniStubScreenshotCalls.at(-1).cmd === "screenshot_close_pin"
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- eval_readonly:
    expression: document.querySelector('img').naturalWidth === 400 && document.querySelector('img').naturalHeight === 300
- dblclick: '[data-testid="screenshot-pin-window"]'
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-pin-window"]'
- click: '[data-testid="system-screenshot"]'
- wait_for: '[data-testid="screenshot-overlay"][data-phase="select"]'
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-toolbar"]'
- click: '[data-testid="screenshot-pin"]'
- wait_for: '[data-testid="screenshot-pin-image"]'
- right_click: '[data-testid="screenshot-pin-window"]'
- wait_for: '[data-testid="system-screenshot"]'
- assert_not_visible: '[data-testid="screenshot-pin-window"]'
- eval_readonly:
    expression: JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_pin_to_screen"').length === 4 && JSON.stringify(window.__taomniStubScreenshotCalls).split('"cmd":"screenshot_close_pin"').length === 4
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: The public pin action exports the annotated region, shows the retained decoded 160x120 image after the overlay closes, and Escape closes the pin.
    actions: [1, 2, 4, 6, 7, 9, 16]
    checkpoints:
    - {step: 8, expectation: The region contains a committed annotation before pin.}
    - {step: 10, expectation: The pin image is reachable from the public button.}
    - {step: 11, expectation: The pin renderer is mounted.}
    - {step: 12, expectation: The source overlay is unmounted.}
    - {step: 13, expectation: The image uses the retained renderer PNG rather than an invented native artifact.}
    - {step: 14, expectation: Decoded dimensions match the exported crop exactly.}
    - {step: 15, expectation: Pin dispatch uses the latest export path and cropped dimensions.}
    - {step: 18, expectation: Escape unmounts the pin.}
    - {step: 19, expectation: Escape sends close-pin.}
    results: [10, 11, 12, 13, 14, 15, 18, 19]
  - id: R2
    requirement: Subsequent public pins use the new export and double-click or right-click closes them without leaving a stale pin route.
    actions: [20, 22, 24, 27, 30, 32, 34, 36]
    checkpoints:
    - {step: 26, expectation: 'A subsequent fullscreen pin decodes to 400x300, not the previous crop.'}
    - {step: 29, expectation: Double-click closes the second pin.}
    - {step: 38, expectation: Right-click closes the third pin.}
    - {step: 39, expectation: Three pins have exactly three matching close dispatches.}
    results: [26, 29, 38, 39]
  visual:
  - check: A retained cropped image is shown by the pinned-image renderer.
    method: automated
    reason: Decoded image dimensions and DOM lifecycle are checked; no native placement or screenshot-pixel comparison is claimed.
  native:
  - check: Frameless always-on-top pin lifecycle, physical drag and native image pixels.
    method: external
    reason: Browser routes and window methods are stubs; native pin scenarios own the desktop window boundary.

id: TC-IDE-PARITY-017-01
title: 'In-place Rename: boxed name, suggestions, Esc zero-change, options, dialog hand-off and preview images'
description: 'ED-PARITY-017 A1/A2/A3 browser case on the controlled parity007 Java provider: Shift+F6 opens the in-place naming session (boxed name, suggestions, IDEA hint) with zero document change; provider rejection and invalid names keep the session; Esc twice leaves the buffer untouched; Alt+Shift+O shows options; Shift+F6 hands the typed name to the Rename dialog; a multi-file rename previews true before/after lines and undoes in one step.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- refactor
- parity007
- ed-parity-017
- p1
modes:
- browser

id: TC-MODULES-033
title: The native restore confirmation automatically relaunches the desktop and restores paired module, Vault and HOTP data
description: Reuse the running signed hello and original paired Vault/MFA backup input from 013, then mutate module data, increment
  HOTP and rekey Vault. Open the exact UI-created local backup through Settings. Reject the old current-profile password in the real
  dialog, then confirm with the new password. Observe staged success, original exit=0 and a different kernel PID/start-time with the
  same QA executable and isolated environment. Attach to the app-created QA WebView bridge without launching or manually restarting an
  application. Independently verify original module rows, active pointer, advanced generation, password rollback and HOTP 755224. This
  case exercises automatic relaunch on Linux, Windows and macOS with paired MFA and Vault data. Existing 013/014/015
  retain the separate three-platform normal-cold-start matrix.
covers:
- F-Modules-1
- F-BACKUP-1
- F-MFA-3
- F-MFA-1
- F12.1
tags:
- p0
- modules
- backup
- vault
- native-boundary
- persistence
modes:
- native
native_platforms:
- Linux
- Windows
- macOS

verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: A real paired backup precedes changed module values, HOTP and Vault password; staging rejection leaves data unchanged.
    actions:
    - 17
    - 31
    - 36
    - 40
    - 45
    - 56
    checkpoints:
    - step: 18
      expectation: Initial RFC HOTP is 755224.
    - step: 39
      expectation: The exact v2 job contains original module rows and valid paired encrypted Vault/MFA SQLite snapshots.
    - step: 46
      expectation: HOTP advances to 287082.
    - step: 57
      expectation: The live master password changes.
    - step: 60
      expectation: Old current-profile credentials are rejected without pending restore files or data changes.
    results:
    - 18
    - 39
    - 46
    - 57
    - 60
  - id: R2
    requirement: Settings opens the local archive and rejects the old current master password without staging.
    actions:
    - 61
    - 63
    - 69
    checkpoints:
    - step: 65
      expectation: The actual native inventory lists the MFA snapshot.
    - step: 66
      expectation: The actual native inventory lists the Vault snapshot.
    - step: 70
      expectation: The real confirmation reports the translated bad-current-password error.
    - step: 71
      expectation: Rejected verification leaves staged success absent.
    - step: 74
      expectation: The original renderer has no runtime errors before automatic relaunch.
    results:
    - 65
    - 66
    - 70
    - 71
    - 74
  - id: R3
    requirement: One valid confirmation stages and performs its own normal native relaunch while retaining the exact isolated profile.
    actions:
    - 73
    - 75
    checkpoints:
    - step: 75
      expectation: The observer clicks once, sees staged success/disabled confirmation, reaps the original at exit=0, validates a different
        PID/start-time and identical executable/QA environment, and attaches without spawning an app.
    - step: 78
      expectation: Independent disk/host observations prove original module values, unchanged active pointer, new generation, clean
        restore state and enabled module writer lease.
    results:
    - 75
    - 78
  - id: R4
    requirement: The restored paired Vault/MFA accepts only the original password and decrypts the original account.
    actions:
    - 81
    - 85
    checkpoints:
    - step: 82
      expectation: The changed password is rejected after actual restore.
    - step: 92
      expectation: Exactly one restored account decrypts and displays the original HOTP 755224.
    - step: 93
      expectation: Expected password rejection and native relaunch produce no renderer runtime errors.
    results:
    - 82
    - 92
    - 93
  visual:
  - check: Restored original HOTP and usable MFA pane.
    method: manual
    reason: Review module-restore-automatic-relaunch-decrypted.png; screenshot collection alone is not a visual verdict.
  native:
  - check: Actual UI-triggered desktop process relaunch, isolated profile, native module data, Vault/MFA pairing and real host ownership.
    method: automated
    reason: Kernel PID/start-time, listener ownership and selected process environment are independently read. No driver.start, subprocess
      launch, restart IPC or native_restart_app substitutes for automatic relaunch.
  - check: Automatic restore of data written by the independent MFA host.
    method: external
    reason: This fixture exercises the legacy MFA database alongside a separately installed signed module.

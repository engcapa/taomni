id: TC-TAOFFICE-027
title: Project duration editing moves linked tasks past a calendar exception
description: Cancel a duration edit, update the predecessor, and verify the critical path and exported schedule.
modes: [browser]
covers: [F-FILEOPEN-1]
tags: [p0, file-open, taoffice, taoffice-project]
fixtures: [reset_db, file_open_files]
ui_standard: [UI-FOC-02]
timeout_sec: 170
steps:
- open: ${cfg.app.base_url}
- vault_first_run: taoffice-document
- seed_storage:
    key: taomni.preview.modules.taoffice-project.v1
    value: '{"lifecycle":"enabled","values":[]}'
- reload_window: null
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"]'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-address"]', value: '${fixture.file_open_root}'}
- press: {selector: '[data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-file-row"][data-name="shift-plan.mppx"]'
- dblclick: '[data-testid="explorer-file-row"][data-name="shift-plan.mppx"]'
- wait_for: '[data-testid="taoffice-project-schedule"]'
- assert_attribute: {selector: '[data-testid="taoffice-project-task"][data-uid="2"]', name: data-start, equals: '2026-12-03T08:00:00'}
- press: {selector: '[data-testid="taoffice-project-task"][data-uid="1"] [data-testid="taoffice-project-duration"]', key: Enter}
- assert_focus_on: '[data-testid="taoffice-project-duration-input"]'
- fill: {selector: '[data-testid="taoffice-project-duration-input"]', value: '2'}
- press: Escape
- assert_focus_on: '[data-testid="taoffice-project-task"][data-uid="1"] [data-testid="taoffice-project-duration"]'
- assert_attribute: {selector: '[data-testid="taoffice-project-task"][data-uid="2"]', name: data-start, equals: '2026-12-03T08:00:00'}
- press: {selector: '[data-testid="taoffice-project-recalculate"]', key: Enter}
- press: {selector: '[data-testid="taoffice-project-task"][data-uid="1"] [data-testid="taoffice-project-duration"]', key: Enter}
- fill: {selector: '[data-testid="taoffice-project-duration-input"]', value: '16'}
- press: Enter
- assert_focus_on: '[data-testid="taoffice-project-task"][data-uid="1"] [data-testid="taoffice-project-duration"]'
- assert_attribute: {selector: '[data-testid="taoffice-project-task"][data-uid="1"]', name: data-finish, equals: '2026-12-03T17:00:00'}
- assert_attribute: {selector: '[data-testid="taoffice-project-task"][data-uid="2"]', name: data-start, equals: '2026-12-04T08:00:00'}
- assert_visible: '[data-testid="taoffice-project-task"][data-uid="2"] [data-testid="taoffice-project-critical"]'
- assert_attribute: {selector: '[data-testid="taoffice-project-task"][data-uid="3"]', name: data-critical, equals: 'false'}
- assert_download:
    trigger: '[data-testid="taoffice-project-save"]'
    filename: shift-plan - copy.mppx
    contains: ['<Duration>PT16H0M0S</Duration>', '<FinishDate>2026-12-04T12:00:00</FinishDate>', '<Baseline><Number>0</Number>']
- assert_file_open_bytes: {path: '${fixture.file_open_root}/shift-plan.mppx', sha256: '${fixture.taoffice_schedule_sha}'}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    ui_standard: [UI-FOC-02]
    requirement: The duration input takes focus when editing, and focus returns to the duration button on cancel or apply.
    actions: [14, 17, 23]
    checkpoints:
    - {step: 15, expectation: The duration input owns focus.}
    - {step: 18, expectation: Cancel returns focus to the same task duration.}
    - {step: 24, expectation: Apply returns focus to the same task duration.}
    results: [15, 18, 24]
  visual:
  - {check: Critical task indicator, method: automated, reason: The linked task has a visible text label after recalculation.}
  native:
  - {check: Native save and reopen, method: external, reason: TC-TAOFFICE-028 exercises the installed module and save chooser.}

verification:
  review: reviewed
  requirements:
  - id: ED-PARITY-007-V4-1-provider
    requirement: The real JDT LS offers the method extraction for E1; the direct chord applies it, the host file becomes B1, and the E1 program oracle keeps stdout 12,0,-2,12.
    actions:
    - 11
    checkpoints:
    - step: 11
      expectation: The host ExtractTarget.java still has the reference B0 bytes before the extraction.
    - step: 12
      expectation: javac/java of the initial source prints exactly 12,0,-2,12 with exit 0.
    - step: 26
      expectation: The real provider edit produced the call site and the new method on disk.
    - step: 28
      expectation: The extracted B1 still prints exactly 12,0,-2,12.
    results:
    - 11
    - 12
    - 26
    - 28
  - id: ED-PARITY-007-V4-2-naming-undo
    requirement: Naming through the real Rename chain updates the declaration and the call site, and two undos then redos walk the host bytes B2 -> B1 -> B0 -> B1 -> B2 with the oracle holding at every
      state.
    actions:
    - 36
    checkpoints:
    - step: 36
      expectation: The host file has sumOf in the declaration and the call site.
    - step: 38
      expectation: The renamed B2 still prints 12,0,-2,12.
    - step: 43
      expectation: The first undo restores B1 on disk and the oracle still passes.
    - step: 46
      expectation: The second undo restores the exact initial B0 hash.
    - step: 55
      expectation: Redo restores B1 then B2 on disk and the oracle still passes.
    results:
    - 36
    - 38
    - 43
    - 46
    - 55
  - id: ED-PARITY-007-V4-3-dirty
    requirement: With unsaved input the extraction stays in the buffer, never writes the pending input to disk, does not prompt for a name, and undo keeps the pending input.
    actions:
    - 57
    checkpoints:
    - step: 77
      expectation: The status line asks to save before renaming.
    - step: 78
      expectation: No naming dialog appears for the dirty buffer.
    - step: 79
      expectation: The host file is unchanged by the dirty extraction.
    - step: 82
      expectation: Undo keeps the pending input in the buffer.
    results:
    - 77
    - 78
    - 79
    - 82
  visual:
  - check: Real WebView dialog rendering and the extracted method layout.
    method: manual
    reason: Screenshots are recorded artifacts; pixel comparison is separate.
  native:
  - check: Real JDT LS kind/resolve/edit, host disk bytes, watcher, javac/java semantics.
    method: automated
    reason: This case is the native gate; the controlled browser provider cannot prove any of these.

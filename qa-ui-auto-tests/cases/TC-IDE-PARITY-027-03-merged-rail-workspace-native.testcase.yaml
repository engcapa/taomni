id: TC-IDE-PARITY-027-03-merged-rail-workspace-native
title: Native Code Workspace tool window bar merges into the collapsed sidebar rail
description: 'ED-PARITY-027 native case in the isolated QA app: opening a Code Workspace collapses the main sidebar
  to its rail and hosts the workspace''s left tool window bar there; the rail''s Project button and its context
  menu (Show Tool Window Names) work; expanding the sidebar returns the bar to the workspace and collapsing merges
  it again; reloading then starts Welcome expanded.

  '
covers:
- F1.2
- F25.5
tags:
- code-workspace
- sidebar
- ed-parity-027
- p1
modes:
- native
fixtures:
- reset_db
- workspace_root
timeout_sec: 300
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-native-gate-password
- wait_for: '[data-testid="control-bar"]'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.sidebarCollapsed
    value: 'false'
- seed_storage:
    key: taomni.sidebarCollapsedByGroup.v1
    value: '{"code-workspace":true,"terminal":true}'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id":"qa-ed027","name":"qa-ed027","roots":[{"id":"qa-ed027","name":"qa-ed027","path":"${fixture.workspace_root}","kind":"folder"}],"looseFiles":[],"lastActiveFile":{"kind":"root","rootId":"qa-ed027","path":"notes.txt"},"lastOpenedAt":1756500000000,"isGitRepo":false}]'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu"] >> text="Sessions"'
- click: '[data-testid="context-menu-item-show-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"][data-workspace-path="${fixture.workspace_root}"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    timeout_sec: 10
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- wait_for:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    state: detached
    timeout_sec: 5
- wait_for:
    selector: '[data-testid="code-workspace-tree-file"][data-path="notes.txt"]'
    timeout_sec: 30
- eval_readonly:
    expression: (document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tree-pane\"]").getBoundingClientRect().width
      > 300) && (document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tree-pane\"]").getBoundingClientRect().width
      < 500)
    expect_truthy: true
- screenshot: tc-ide-parity-027-03-merged.png
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-pane"]'
    state: hidden
    timeout_sec: 5
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- wait_for:
    selector: '[data-testid="code-workspace-tree-pane"]'
    timeout_sec: 5
- right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"][data-show-names="true"]'
    state: detached
    timeout_sec: 5
- right_click: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-project"]'
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"][data-show-names="true"]'
    timeout_sec: 5
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    state: detached
    timeout_sec: 5
- wait_for: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
- click: '[data-testid="side-tab-sessions"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    timeout_sec: 5
- wait_for: '[data-testid="collapsed-sidebar-rail"] [data-testid="code-workspace-tool-rail-left"]'
- assert_localstorage:
    key: taomni.sidebarCollapsedByGroup.v1
    contains: '"code-workspace":true'
- assert_localstorage:
    key: taomni.sidebarCollapsed
    equals: 'false'
- reload_window: null
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu"] >> text="Sessions"'
- click: '[data-testid="context-menu-item-show-sessions"]'
- click: '[data-testid="session-recents"]'
- wait_for: '[data-testid="welcome-panel"]'
- wait_for: '[data-testid="session-tree"]'
- wait_for:
    selector: '[data-testid="collapsed-sidebar-rail"]'
    state: detached
    timeout_sec: 5
verification:
  review: pending
  requirements:
  - id: R1
    requirement: A+B：原生应用打开 Code Workspace 后主侧栏折叠为工具条，工作区左工具窗口条进入该工具条，工作区内不再有第二条；Project 窗口保持像素宽度（300–500 px，不随侧栏折叠膨胀）。
    actions:
    - 16
    - 17
    checkpoints:
    - step: 18
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 19
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "timeout_sec": 10}}'
    - step: 20
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 21
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "state": "detached", "timeout_sec": 5}}'
    - step: 22
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-file\"][data-path=\"notes.txt\"]",
        "timeout_sec": 30}}'
    - step: 23
      expectation: '{"eval_readonly": {"expression": "(document.querySelector(\"[data-testid\" + String.fromCharCode(61)
        + \"\\\"code-workspace-tree-pane\\\"]\").getBoundingClientRect().width > 300) && (document.querySelector(\"[data-testid\"
        + String.fromCharCode(61) + \"\\\"code-workspace-tree-pane\\\"]\").getBoundingClientRect().width < 500)",
        "expect_truthy": true}}'
    results:
    - 18
    - 19
    - 20
    - 21
    - 22
    - 23
  - id: R2
    requirement: B：工具条中的 Project 按钮隐藏/显示 Project 窗口；右键菜单 Show Tool Window Names 在工具条里同样生效（可关可开）。
    actions:
    - 25
    - 27
    - 29
    - 30
    - 32
    - 33
    checkpoints:
    - step: 26
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-pane\"]", "state": "hidden", "timeout_sec":
        5}}'
    - step: 28
      expectation: '{"wait_for": {"selector": "[data-testid=\"code-workspace-tree-pane\"]", "timeout_sec": 5}}'
    - step: 31
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-left\"][data-show-names=\"true\"]",
        "state": "detached", "timeout_sec": 5}}'
    - step: 34
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-left\"][data-show-names=\"true\"]",
        "timeout_sec": 5}}'
    results:
    - 26
    - 28
    - 31
    - 34
  - id: R3
    requirement: A：展开主侧栏后工具窗口条回到工作区，再次折叠后重新合并，Code Workspace 组记住折叠状态。
    actions:
    - 35
    - 39
    checkpoints:
    - step: 36
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 37
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "state": "detached", "timeout_sec":
        5}}'
    - step: 38
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 40
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "timeout_sec": 5}}'
    - step: 41
      expectation: '{"wait_for": "[data-testid=\"collapsed-sidebar-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]"}'
    - step: 42
      expectation: '{"assert_localstorage": {"key": "taomni.sidebarCollapsedByGroup.v1", "contains": "\"code-workspace\":true"}}'
    results:
    - 36
    - 37
    - 38
    - 40
    - 41
    - 42
  - id: R4
    requirement: A：工作区折叠侧栏时重新加载窗口（等同重启），Welcome 仍展开会话树、没有折叠工具条（旧键保持 false）。
    actions:
    - 44
    checkpoints:
    - step: 43
      expectation: '{"assert_localstorage": {"key": "taomni.sidebarCollapsed", "equals": "false"}}'
    - step: 50
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 51
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 52
      expectation: '{"wait_for": {"selector": "[data-testid=\"collapsed-sidebar-rail\"]", "state": "detached", "timeout_sec":
        5}}'
    results:
    - 43
    - 50
    - 51
    - 52
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

id: TC-IDE-PARITY-027-03-merged-rail-workspace-native
title: Workspace stripes merge into Shell Rail independently of Navigator expansion
description: Adapted for Workspace Shell v2. The permanent Rail, per-lane Navigator and merged workspace stripes
  replace the old expanded/collapsed sidebar wrappers. Retained results are declared in each requirement.
covers:
- F1.2
- F25.5
tags:
- code-workspace
- sidebar
- ed-parity-027
- p1
modes:
- native
fixtures:
- reset_db
- workspace_root
timeout_sec: 300
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- set_viewport:
    width: 1280
    height: 800
- wait_for:
    selector: '[data-testid="shell-root"][data-mode="wide"]'
    timeout_sec: 10
- vault_first_run: qa-shell-retained-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.shellLayout.v2
    value: '{"version": 2, "navigator": {"collapsedByLane": {"home": false, "build": true, "connect": true},
      "lastArea": "sessions", "width": 360}}'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "qa-ed027", "name": "qa-ed027", "roots": [{"id": "qa-ed027", "name": "qa-ed027", "path":
      "${fixture.workspace_root}", "kind": "folder"}], "looseFiles": [], "lastActiveFile": {"kind": "root",
      "rootId": "qa-ed027", "path": "notes.txt"}, "lastOpenedAt": 3000, "isGitRepo": false}]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_not_visible: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- assert_visible: '[data-testid="code-workspace-tool-rail-right"]'
- assert_element_geometry:
    selector: '[data-testid="code-workspace-tree-pane"]'
    min_width: 300
    max_width: 500
    min_height: 100
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_not_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="code-workspace-tool-rail-project"]'
- assert_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-open"]'
- assert_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_not_visible: '[data-testid="session-tree"]'
- eval_readonly:
    expression: localStorage.getItem('taomni.shellLayout.v2')?.includes('"build":true')
    expect_truthy: true
    timeout_sec: 5
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"build":true'
- click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="settings-group-toggle-general"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: false
- assert_localstorage:
    key: taomni.mergeToolWindowRail
    equals: 'false'
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-open"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="shell-rail-settings"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: true
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-open"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: '[data-testid="session-tree"]'
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Opening a workspace preserves one Project view and one merged stripe, with no duplicated internal
      bar.
    actions:
    - 2
    - 6
    - 7
    - 8
    - 9
    - 10
    - 12
    - 13
    - 15
    - 16
    - 23
    - 25
    checkpoints:
    - step: 3
      expectation: '{"wait_for": {"selector": "[data-testid=\"shell-root\"][data-mode=\"wide\"]", "timeout_sec":
        10}}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 14
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 17
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 18
      expectation: '{"assert_not_visible": "[data-testid=\"session-tree\"]"}'
    - step: 19
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-tool-window-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "equal": 1}}'
    - step: 20
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "equal": 0}}'
    - step: 21
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tool-rail-right\"]"}'
    - step: 22
      expectation: '{"assert_element_geometry": {"selector": "[data-testid=\"code-workspace-tree-pane\"]",
        "min_width": 300, "max_width": 500, "min_height": 100}}'
    - step: 24
      expectation: '{"assert_not_visible": "[data-testid=\"code-workspace-tree-pane\"]"}'
    - step: 26
      expectation: '{"assert_visible": "[data-testid=\"code-workspace-tree-pane\"]"}'
    results:
    - 3
    - 11
    - 14
    - 17
    - 18
    - 19
    - 20
    - 21
    - 22
    - 24
    - 26
  - id: R2
    requirement: Navigator expansion and lane visits preserve stripe ownership and per-lane preferences in
      the v2 single-writer store.
    actions:
    - 27
    - 30
    - 32
    - 33
    - 35
    checkpoints:
    - step: 28
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"]"}'
    - step: 29
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-tool-window-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "equal": 1}}'
    - step: 31
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 34
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"]"}'
    - step: 36
      expectation: '{"assert_not_visible": "[data-testid=\"session-tree\"]"}'
    - step: 37
      expectation: '{"eval_readonly": {"expression": "localStorage.getItem(''taomni.shellLayout.v2'')?.includes(''\"build\":true'')",
        "expect_truthy": true, "timeout_sec": 5}}'
    - step: 38
      expectation: '{"assert_localstorage": {"key": "taomni.shellLayout.v2", "contains": "\"build\":true"}}'
    results:
    - 28
    - 29
    - 31
    - 34
    - 36
    - 37
    - 38
  - id: R3
    requirement: Disabling merge returns the stripe to its workspace; enabling it returns the same stripe to
      the permanent Rail.
    actions:
    - 39
    - 40
    - 41
    - 43
    - 44
    - 47
    - 48
    - 49
    - 50
    - 53
    checkpoints:
    - step: 42
      expectation: '{"assert_localstorage": {"key": "taomni.mergeToolWindowRail", "equals": "false"}}'
    - step: 45
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "equal": 1}}'
    - step: 46
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-tool-window-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "equal": 0}}'
    - step: 51
      expectation: '{"assert_count": {"selector": "[data-testid=\"sidebar-tool-window-rail\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "equal": 1}}'
    - step: 52
      expectation: '{"assert_count": {"selector": "[data-testid=\"code-workspace-tab\"] [data-testid=\"code-workspace-tool-rail-left\"]",
        "equal": 0}}'
    - step: 54
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 55
      expectation: '{"assert_visible": "[data-testid=\"session-tree\"]"}'
    results:
    - 42
    - 45
    - 46
    - 51
    - 52
    - 54
    - 55
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: automated
    reason: 明确记录执行边界和未验证平台。

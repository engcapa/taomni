id: TC-IDE-PARITY-027-03-merged-rail-workspace-native
title: Workspace stripes merge into Shell Rail independently of Navigator expansion
description: Adapted for Workspace Shell v2. The permanent Rail, per-lane Navigator and merged workspace stripes
  replace the old expanded/collapsed sidebar wrappers. Retained results are declared in each requirement. Classification
  now uses dock/Actions; Project uses the unified Workspaces entry. Existing workspace content, shortcut and state
  assertions remain. Native width is configured with public separator keys because SQLite is the acknowledged layout
  source; seeding its localStorage cache cannot override an existing record.
covers:
- F1.2
- F25.5
tags:
- code-workspace
- sidebar
- ed-parity-027
- p1
modes:
- native
fixtures:
- reset_db
- workspace_root
timeout_sec: 300
native_platforms:
- Linux
- macOS
- Windows
steps:
- open: ${cfg.app.base_url}
- set_viewport:
    width: 1280
    height: 800
- wait_for:
    selector: '[data-testid="shell-root"][data-mode="wide"]'
    timeout_sec: 10
- vault_first_run: qa-shell-retained-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.mergeToolWindowRail
    value: 'true'
- seed_storage:
    key: taomni.codeWorkspace.toolWindowStripes.v1
    value: '{"showNames":true,"leftWidth":59,"rightWidth":59}'
- reload_window: null
- shell_navigate: sessions
- wait_for: '[data-testid="session-tree"]'
- seed_storage:
    key: taomni.recentWorkspaces.v1
    value: '[{"id": "qa-ed027", "name": "qa-ed027", "roots": [{"id": "qa-ed027", "name": "qa-ed027", "path": "${fixture.workspace_root}",
      "kind": "folder"}], "looseFiles": [], "lastActiveFile": {"kind": "root", "rootId": "qa-ed027", "path": "notes.txt"},
      "lastOpenedAt": 3000, "isGitRepo": false}]'
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- shell_navigate: sessions
- wait_for: '[data-testid="main-sidebar-resize-handle"]'
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Home
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Shift+ArrowRight
- press:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    key: Shift+ArrowRight
- assert_attribute:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    name: aria-valuenow
    equals: '360'
- click: '[data-testid="welcome-history-tab-workspaces"]'
- click: '[data-testid="welcome-recent-workspace-row"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- assert_not_visible: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- assert_visible: '[data-testid="code-workspace-tool-rail-right"]'
- assert_element_geometry:
    selector: '[data-testid="code-workspace-tree-pane"]'
    min_width: 300
    max_width: 500
    min_height: 100
- click: '[data-testid="shell-rail-workspaces"]'
- assert_not_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="shell-rail-workspaces"]'
- assert_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- click: '[data-testid="shell-rail-home"]'
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-open"]'
- assert_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-workspaces"]'
- assert_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="shell-rail-workspaces"]'
- assert_not_visible: '[data-testid="code-workspace-tree-pane"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_not_visible: '[data-testid="session-tree"]'
- eval_readonly:
    expression: localStorage.getItem('taomni.shellLayout.v2')?.includes('"build":true')
    expect_truthy: true
    timeout_sec: 5
- assert_localstorage:
    key: taomni.shellLayout.v2
    contains: '"build":true'
- click: '[data-testid="shell-rail-settings"]'
- click: '[data-testid="settings-group-toggle-general"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: false
- assert_localstorage:
    key: taomni.mergeToolWindowRail
    equals: 'false'
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-open"]'
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- click: '[data-testid="shell-rail-settings"]'
- set_check:
    selector: '[data-testid="settings-merge-tool-window-rail"]'
    checked: true
- click: '[data-testid="shell-overview-trigger"]'
- click: '[data-testid="shell-tab-card"][data-tab-type="code-workspace"] [data-testid="shell-tab-card-open"]'
- assert_count:
    selector: '[data-testid="sidebar-tool-window-rail"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 1
- assert_count:
    selector: '[data-testid="code-workspace-tab"] [data-testid="code-workspace-tool-rail-left"]'
    equal: 0
- reload_window: null
- wait_for: '[data-testid="welcome-panel"]'
- assert_visible: '[data-testid="session-tree"]'
- assert_attribute:
    selector: '[data-testid="main-sidebar-resize-handle"]'
    name: aria-valuenow
    equals: '360'

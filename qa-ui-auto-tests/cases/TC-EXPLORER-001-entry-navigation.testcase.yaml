id: TC-EXPLORER-001
title: Dedicated Explorer rail, global entries and in-surface viewers preserve navigation and recovery
description: Production renderer workflow against isolated IndexedDB files. The rail opens HOME initially and restores the existing
  Explorer thereafter; Tools no longer contains an Explorer launcher. Main menu, Workspace rail and Project tree entries share the global
  Explorer, force-new remains explicit, and supported files open inside Explorer rather than Sessions or Workspace. Browser evidence does
  not prove disk or OS shell effects.
modes: [browser]
covers: [F-EXPLORER-1, F1.8, F25.1, F-WS-2]
tags: [p0, explorer, navigation, workspace, regression]
fixtures: [reset_db, explorer_files]
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-explorer-entries
- seed_storage:
    key: taomni.platformWorkspaces.v1
    value: ${fixture.explorer_workspace}
- reload_window: null
- click: '[data-testid="side-tab-tools"]'
- assert_count: {selector: '[data-testid="sidebar-tool-file-explorer"]', equal: 0}
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"][data-path="/preview"]'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 1}
- click: '[data-testid="side-tab-sessions"]'
- click: '[data-testid="side-tab-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"][data-path="/preview"]'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 1}
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]', value: '${fixture.explorer_source}'}
- press: {selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_source}"]:visible'
- assert_visible: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-nav-node"][data-path="${fixture.explorer_source}"][aria-selected="true"]'
- assert_visible: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-crumb"][data-path="${fixture.explorer_source}"]'
- dblclick: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-file-row"][data-name="folder"]'
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_source}/folder"]:visible'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-back"]'
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_source}"]:visible'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-forward"]'
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_source}/folder"]:visible'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-up"]'
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_source}"]:visible'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-crumb"][data-path="${fixture.explorer_operations}"]'
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_operations}"]:visible'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-nav-node"][data-path="${fixture.explorer_source}"]'
- wait_for: '[data-testid="explorer-tab"][data-path="${fixture.explorer_source}"]:visible'
- press: {selector: '[data-testid="explorer-tab"][data-active="true"]', key: Control+l, macos_key: Meta+l}
- fill: {selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]', value: '${fixture.explorer_base}/does-not-exist'}
- press: {selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address"]', key: Enter}
- wait_for: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address-error"]'
- assert_visible: '[data-testid="explorer-tab"][data-path="${fixture.explorer_source}"]:visible'
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-refresh"]'
- wait_for: {selector: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-address-error"]', state: detached}
- click: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-cmd-newtab"]'
- wait_for: ':nth-match([data-testid="explorer-workspace-tab"][data-tab-type="file-browser"], 2)'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 2}
- click: '[data-testid="app-main-menu"]'
- hover: '[data-testid="context-menu"] >> text="Tools"'
- click: '[data-testid="context-menu-item-file-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"][data-path="/preview"]'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 3}
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="code-workspace-tree"]'
- click: '[data-testid="code-workspace-tool-rail-explorer"]'
- wait_for: '[data-testid="explorer-tab"][data-active="true"][data-path="${fixture.explorer_base}"]'
- assert_count: {selector: '[data-testid="workspace-tab"][data-tab-kind="explorer"]', equal: 0}
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="code-workspace-tool-rail-explorer"]'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 4}
- click: '[data-testid="nav-mode-workspaces"]'
- right_click: '[data-testid="code-workspace-tree-root"][data-root-id="root1"]'
- click: '[data-testid="code-workspace-tree-open-explorer"]'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 4}
- click: '[data-testid="nav-mode-workspaces"]'
- right_click: '[data-testid="code-workspace-tree-root"][data-root-id="root1"]'
- click: '[data-testid="code-workspace-tree-open-explorer-new"]'
- wait_for: ':nth-match([data-testid="explorer-workspace-tab"][data-tab-type="file-browser"], 5)'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 5}
- assert_count: {selector: '[data-testid="workspace-tab"][data-tab-kind="explorer"]', equal: 0}
- click: ':nth-match([data-testid="explorer-workspace-tab"][data-tab-type="file-browser"], 1)'
- wait_for: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-file-row"][data-name="alpha.txt"]'
- dblclick: '[data-testid="explorer-tab"][data-active="true"] [data-testid="explorer-file-row"][data-name="alpha.txt"]'
- wait_for: '[data-testid="explorer-platform-view"] [data-testid="file-viewer"][data-kind="text"]'
- assert_attribute: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"][data-active="true"]', name: data-tab-title, equals: alpha.txt}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="file-viewer"]', equal: 0}
- reload_window: null
- wait_for: '[data-testid="explorer-platform-view"]'
- wait_for: '[data-testid="explorer-platform-view"] [data-testid="file-viewer"][data-kind="text"]'
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-browser"]', equal: 5}
- assert_count: {selector: '[data-testid="explorer-workspace-tab"][data-tab-type="file-viewer"]', equal: 1}
- assert_count: {selector: '[data-testid="workspace-tab"][data-tab-kind="explorer"]', equal: 0}
- assert_no_runtime_errors: null
- screenshot: explorer-dedicated-global-entries.png
- assert_attribute:
    selector: ':nth-match([data-testid="explorer-workspace-tab"][data-tab-type="file-browser"], 1) .taomni-explorer-tab-icon path'
    name: fill
    equals: 'var(--ex-folder)'
- click: '[data-testid="side-tab-tools"]'
- assert_count: {selector: '[data-testid="sidebar-tool-file-explorer"]', equal: 0}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tools has no Explorer launcher; initial rail entry opens one HOME browser and returning to the rail restores it without duplication.
    actions: [5, 7, 11, 12, 81]
    checkpoints:
    - {step: 6, expectation: The retired Tools-panel launcher is absent.}
    - {step: 9, expectation: Initial dedicated Explorer displays the browser VFS HOME.}
    - {step: 10, expectation: Exactly one dedicated directory tab exists.}
    - {step: 13, expectation: Returning from Sessions restores the same HOME pane.}
    - {step: 14, expectation: Rail restoration does not create another directory tab.}
    - {step: 82, expectation: The Tools launcher remains absent after all global entry workflows.}
    results: [6, 9, 10, 13, 14, 82]
  - id: R2
    requirement: List, address, breadcrumbs and selected navigation tree follow successful navigation; failed address keeps the current directory and can retry.
    actions: [15, 16, 17, 21, 23, 25, 27, 29, 31, 33, 34, 35, 38]
    checkpoints:
    - {step: 18, expectation: Committed address and visible directory agree.}
    - {step: 19, expectation: Navigation-tree selection follows the address.}
    - {step: 20, expectation: Breadcrumb follows the address.}
    - {step: 22, expectation: Double-click opens the selected folder.}
    - {step: 24, expectation: Back restores source.}
    - {step: 26, expectation: Forward restores folder.}
    - {step: 28, expectation: Up restores source.}
    - {step: 30, expectation: Breadcrumb reaches operations.}
    - {step: 32, expectation: Navigation tree returns to source.}
    - {step: 36, expectation: Missing path produces an actionable error.}
    - {step: 37, expectation: Failed navigation leaves source committed.}
    - {step: 39, expectation: Refresh clears the recoverable error.}
    results: [18, 19, 20, 22, 24, 26, 28, 30, 32, 36, 37, 39]
  - id: R3
    requirement: Main menu, Workspace rail and Project tree entries share the global Explorer; only explicit force-new adds directories and all tabs recover.
    actions: [40, 43, 44, 45, 48, 50, 53, 54, 56, 57, 58, 60, 61, 62, 72]
    checkpoints:
    - {step: 41, expectation: Explicit new-tab creates a second source directory.}
    - {step: 46, expectation: Main Tools menu routes to global Explorer HOME.}
    - {step: 47, expectation: HOME is added once without Workspace-owned Explorer tabs.}
    - {step: 51, expectation: Workspace rail opens its root in the dedicated Explorer.}
    - {step: 52, expectation: No Explorer tab is created inside Code Workspace.}
    - {step: 55, expectation: Repeated Workspace rail activation deduplicates the root.}
    - {step: 59, expectation: Project-tree open reuses the same global root.}
    - {step: 63, expectation: Project-tree force-new creates the fifth directory.}
    - {step: 64, expectation: Exactly five directory tabs exist before viewer recovery.}
    - {step: 73, expectation: Reload restores the Explorer foreground.}
    - {step: 75, expectation: All five directory tabs recover.}
    - {step: 77, expectation: Workspace remains free of legacy Explorer tabs.}
    results: [41, 46, 47, 51, 52, 55, 59, 63, 64, 73, 75, 77]
  - id: R4
    requirement: Supported double-clicks stay in the dedicated Explorer viewer and restore there, never in Sessions or Workspace.
    actions: [66, 68]
    checkpoints:
    - {step: 69, expectation: The text viewer is mounted inside Explorer.}
    - {step: 70, expectation: The active dedicated tab is alpha.txt.}
    - {step: 71, expectation: Sessions has no file-viewer tab.}
    - {step: 74, expectation: The viewer itself restores inside Explorer.}
    - {step: 76, expectation: Recovery retains exactly one dedicated viewer.}
    - {step: 78, expectation: Open and recovery complete without runtime errors.}
    - {step: 83, expectation: Final host transitions remain runtime-error free.}
    results: [69, 70, 71, 74, 76, 78, 83]
  - id: R5
    requirement: Dedicated directory tabs retain the prototype folder SVG and theme-aware color token.
    actions: [7]
    checkpoints:
    - {step: 80, expectation: The directory tab icon uses the Explorer folder color token.}
    results: [80]
  visual:
  - check: Dedicated Explorer rail placement, global tab strip, viewer host and restored directory tabs.
    method: manual
    reason: Retained screenshot requires prototype comparison; DOM presence alone is not a pixel verdict.
  native:
  - check: Real terminal cwd, filesystem and clipboard.
    method: external
    reason: TC-EXPLORER-003, 005 and 009 provide native boundary assertions; this case is renderer/VFS only.

id: TC-MODULES-074
title: Enabling SocksCap mounts its target preview in the existing Tools tab
description: Enable the module through its disabled tab, check matching and non-matching targets, then return to the retained tab through the overview after disabling it.
covers: [F-Sockscap-1, F-Modules-1]
tags: [modules, sockscap, p1]
modes: [browser]
fixtures: [reset_db, module_sockscap_preview]
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-unavailable"][data-reason="disabled"]'
- assert_count: {selector: '[data-testid="sockscap-panel"]', equal: 0}
- click: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-settings"]'
- click: '[data-testid="module-action-enable-sockscap"]'
- wait_for: '[data-testid="module-action-disable-sockscap"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-plugin-slug="sockscap"] [data-testid="sockscap-panel"]'
- click: '[data-testid="sockscap-section-test-toggle"]'
- fill: {selector: '[data-testid="sockscap-test-host"]', value: github.example.test}
- click: '[data-testid="sockscap-test-target"]'
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'github.example.test:443'}
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'Decision: proxy'}
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'Matched rule: ||stub'}
- click: '[data-testid="sockscap-test-detail-close"]'
- wait_for: {selector: '[data-testid="sockscap-test-detail"]', state: detached}
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-disable-sockscap"]'
- wait_for: '[data-testid="module-action-enable-sockscap"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="tab-overview-trigger"]'
- wait_for: '[data-testid="tab-overview-card"][data-surface="sessions"][data-tab-id="sockscap-main"]'
- assert_count: {selector: '[data-testid="tab-overview-card"][data-tab-id="sockscap-main"]', equal: 1}
- click: '[data-testid="tab-overview-card"][data-surface="sessions"][data-tab-id="sockscap-main"]'
- wait_for: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-unavailable"][data-reason="disabled"]'
- assert_count: {selector: '[data-testid="sockscap-panel"]', equal: 0}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="sockscap"]', equal: 1}
- assert_no_runtime_errors: null
- assert_count: {selector: '[data-testid="sockscap-start"]', equal: 0}
- click: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-settings"]'
- click: '[data-testid="module-action-enable-sockscap"]'
- wait_for: '[data-testid="module-action-disable-sockscap"]'
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-plugin-slug="sockscap"] [data-testid="sockscap-panel"]'
- assert_count: {selector: '[data-testid="plugin-tab-unavailable"][data-reason="disabled"]', equal: 0}
- assert_no_runtime_errors: null
- assert_count: {selector: '[data-testid="sockscap-macos-setup-install"]', equal: 0}
- show_sockscap_section: upstream
- select_option: {selector: '[data-testid="sockscap-upstream-kind"]', value: shadowsocks}
- click: '[data-testid="sockscap-test-upstream"]'
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: Upstream test is only available in the desktop build.}
- click: '[data-testid="sockscap-test-detail-close"]'
- assert_no_runtime_errors: null
- assert_count: {selector: '[data-testid="sockscap-stop"]', equal: 0}
- show_sockscap_section: test
- fill: {selector: '[data-testid="sockscap-test-host"]', value: github.example.test}
- click: '[data-testid="sockscap-test-target"]'
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'Matched rule: ||stub'}
- click: '[data-testid="sockscap-test-detail-close"]'
- fill: {selector: '[data-testid="sockscap-test-host"]', value: direct.example.test}
- click: '[data-testid="sockscap-test-target"]'
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'direct.example.test:443'}
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'Decision: direct'}
- assert_text: {selector: '[data-testid="sockscap-test-detail"]', contains: 'Matched rule: -'}
- click: '[data-testid="sockscap-test-detail-close"]'
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: module store}
- click: '[data-testid="module-action-uninstall-sockscap"]'
- wait_for: '[data-testid="confirm-dialog"]'
- click: '[data-testid="confirm-dialog-confirm"]'
- wait_for: '[data-testid="module-action-install-sockscap"]'
- assert_count: {selector: '[data-testid="module-action-uninstall-sockscap"]', equal: 0}
- click: '[data-testid="nav-mode-home"]'
- click: '[data-testid="side-tab-tools"]'
- click: '[data-testid="sidebar-tool-sockscap"]'
- wait_for: '[data-plugin-slug="sockscap"] [data-testid="plugin-tab-unavailable"][data-reason="missing"]'
- assert_count: {selector: '[data-testid="sockscap-start"]', equal: 0}
verification:
  review: reviewed
  requirements:
  - id: target-preview
    requirement: The target test passes the entered host to the preview and displays its complete result.
    actions: [2, 3, 6, 7, 11, 13, 14, 15, 19]
    checkpoints:
    - {step: 4, expectation: Opening Tools shows the disabled module.}
    - {step: 12, expectation: The tab mounts the module panel after enabling.}
    - {step: 16, expectation: The detail contains the requested host and default port.}
    - {step: 17, expectation: The rendered decision matches the preview response.}
    - {step: 18, expectation: The matching preview rule is displayed.}
    - {step: 20, expectation: The user can close the result and return to the panel.}
    results: [4, 12, 16, 17, 18, 20]
  - id: disable
    requirement: Disabling the module releases the panel while keeping its existing tab.
    actions: [21, 22, 23, 25, 26, 27, 30]
    checkpoints:
    - {step: 29, expectation: The overview lists the original SocksCap tab exactly once before returning to it.}
    - {step: 31, expectation: Activating that tab shows the disabled module.}
    - {step: 32, expectation: The configuration panel is absent.}
    - {step: 33, expectation: The Sessions tab strip contains exactly one SocksCap tab.}
    - {step: 34, expectation: The lifecycle and target test run without runtime errors.}
    results: [29, 31, 32, 33, 34]
  - id: reenable
    requirement: Users can reopen the capture panel after disabling and enabling its module in the same desktop.
    actions: [36, 37, 39, 40, 41, 46, 47, 48, 50, 53, 54, 55, 58, 59]
    checkpoints:
    - {step: 35, expectation: Capture cannot be started from the disabled tool.}
    - {step: 42, expectation: The original tool displays the enabled panel again.}
    - {step: 43, expectation: The disabled placeholder has been removed.}
    - {step: 44, expectation: Re-enabling completes without runtime errors.}
    - {step: 45, expectation: The browser preview exposes no macOS system installer action.}
    - {step: 49, expectation: The Shadowsocks probe explains its desktop requirement.}
    - {step: 51, expectation: Closing the result leaves the preview usable.}
    - {step: 52, expectation: The preview still shows capture as stopped after the lifecycle change and probe.}
    - {step: 56, expectation: The same preview rule is available after re-enabling the module.}
    - {step: 60, expectation: The result shows the new target and default port.}
    - {step: 61, expectation: A target with no matching rule uses the direct decision.}
    - {step: 62, expectation: The former matched rule is absent from the new result.}
    results: [35, 42, 43, 44, 45, 49, 51, 52, 56, 60, 61, 62]
  - id: uninstall
    requirement: Confirmed uninstall returns the preview store entry to its installable state and removes the capture controls.
    actions: [64, 65, 66, 68, 71, 72, 73]
    checkpoints:
    - {step: 67, expectation: The store asks the user to confirm uninstall.}
    - {step: 69, expectation: Installation is available again after uninstall.}
    - {step: 70, expectation: The uninstall action is absent from the entry.}
    - {step: 74, expectation: Reopening the original tool shows the missing module state.}
    - {step: 75, expectation: The uninstalled module exposes no capture start control.}
    results: [67, 69, 70, 74, 75]
  visual:
  - check: The detail displays the requested host alongside the decision and rule.
    method: automated
    reason: The case checks the detail opened by the normal control.
  native:
  - check: Native target decisions and signed host execution are covered by TC-MODULES-073.
    method: not-applicable
    reason: This fixture exercises preview behavior. TC-MODULES-080 and TC-MODULES-085 observe the real module recovery journal and process cleanup.

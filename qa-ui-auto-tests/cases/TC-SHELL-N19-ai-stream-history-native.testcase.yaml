- click: '[data-testid="ai-chat-send-button"]'
- click: '[data-testid="shell-rail-tao"]'
- assert_not_visible: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notifications"]'
- wait_for: '[data-testid="tao-alert-inbox-item"][data-alert-kind="ai_done"]'
- assert_count:
    selector: '[data-testid="tao-alert-inbox-item"][data-alert-kind="ai_done"]'
    equal: 1
- click: '[data-testid="tao-alert-inbox-item"][data-alert-kind="ai_done"] [data-testid="tao-alert-jump"]'
- wait_for: '[data-testid="shell-chat-content"][data-ready="true"]'
- assert_count:
    selector: '[data-chat-role="assistant"]'
    equal: 2
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI background
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: 'SHELL AI unsent 中文

      Second draft line'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="shell-rail-tao"]'
- assert_value:
    selector: '[data-testid="ai-chat-composer"] textarea'
    equals: 'SHELL AI unsent 中文

      Second draft line'
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI error
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: QA provider unavailable
    timeout_sec: 20
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI stop
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI partial answer
    timeout_sec: 10
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI recovery
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-testid="ai-chat-queue-badge"]'
    contains: '1'
- click: '[data-testid="ai-chat-stop-button"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: Stream stopped by user
    timeout_sec: 10
- assert_json_file:
    path: ${fixture.ai_provider_requests}
    expect:
      cancelledStreams: 1
    timeout_sec: 10
- eval_readonly:
    expression: document.querySelector('[data-thread-id][data-ready]').textContent.split('SHELL AI response 中文').length
      === 4 && document.querySelector('[data-thread-id][data-ready]').textContent.split('Second paragraph').length
      === 4
    expect_truthy: true
    timeout_sec: 20
- assert_json_file:
    path: ${fixture.ai_provider_requests}
    expect:
      requests: 5
      streamRequests: 5
      lastUserMessage: SHELL AI recovery
      model: qa-model
      toolRequests: 5
      cancelledStreams: 1
      completedStreams: 3
- restart_native_app: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-chat"]'
- click: '[data-testid="ai-chat-drawer"] button[title="History"]'
- wait_for: '[data-chat-thread-id]'
- assert_count:
    selector: '[data-chat-thread-id]'
    equal: 1
- click: '[data-chat-thread-id]'
- wait_for: '[data-testid="shell-chat-content"][data-ready="true"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI 第一条
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI background
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: 'SHELL AI response 中文

      Second paragraph'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI recovery
- assert_json_file:
    path: ${fixture.ai_provider_requests}
    expect:
      requests: 5
      streamRequests: 5
      lastUserMessage: SHELL AI recovery
      model: qa-model
      toolRequests: 5
      cancelledStreams: 1
      completedStreams: 3
- assert_count:
    selector: '[data-chat-role="assistant"]'
    equal: 3
- assert_pattern:
    selector: '[data-testid="shell-chat-content"]'
    regex: ^(?![\s\S]*SHELL AI partial answer)[\s\S]*$
- screenshot: tc-shell-ai-stream-history.png

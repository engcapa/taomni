id: TC-SHELL-N19
title: AI stream, hidden completion, drafts and retained conversation
description: The active qa-loopback provider receives the sent user content. Both replies finish, hidden completion
  raises one Tao alert and reveals the exact ready thread, hide/reopen preserves the unsent multiline draft, and
  history reloads one conversation without resending. Native additionally observes five actual protocol requests
  including provider failure/recovery and restarts the real isolated QA process; browser uses the explicitly labelled
  IPC preview stream. Provider receipts additionally require five requests with the production tool catalog present,
  including real SSE text delivery and failure/recovery. Stop follows an observed partial SSE reply, closes the
  real transport before completion, and drains the queued recovery turn. Interrupted assistant text stays transient
  under the existing history contract.
covers:
- F-AI-2.4
- F-SHELL-1
- F-TAO-1
tags:
- p1
- workspace-shell
modes:
- native
fixtures:
- reset_db
- ai_chat_provider
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-ai-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-chat"]'
- wait_for: '[data-testid="ai-chat-composer"]'
- assert_value:
    selector: '[data-testid="ai-chat-drawer"] select[aria-label="Thread LLM provider"]'
    equals: qa-loopback
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI 第一条
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-chat-role="assistant"]'
    contains: 'SHELL AI response 中文

      Second paragraph'

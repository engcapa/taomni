id: TC-SHELL-N19
title: AI stream, hidden completion, drafts and retained conversation
description: The active qa-loopback provider receives the sent user content. Both replies finish, hidden completion
  raises one Tao alert and reveals the exact ready thread, hide/reopen preserves the unsent multiline draft,
  and history reloads one conversation without resending. Native additionally observes four actual protocol
  requests including provider failure/recovery and restarts the real isolated QA process; browser uses the
  explicitly labelled IPC preview stream. Provider receipts additionally require four requests with the production
  tool catalog present, including real SSE text delivery and failure/recovery.
covers:
- F-AI-2.4
- F-SHELL-1
- F-TAO-1
tags:
- p1
- workspace-shell
modes:
- native
fixtures:
- reset_db
- ai_chat_provider
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-ai-password
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-chat"]'
- wait_for: '[data-testid="ai-chat-composer"]'
- assert_value:
    selector: '[data-testid="ai-chat-drawer"] select[aria-label="Thread LLM provider"]'
    equals: qa-loopback
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI 第一条
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-chat-role="assistant"]'
    contains: 'SHELL AI response 中文

      Second paragraph'
    timeout_sec: 20
- assert_text_equals:
    selector: '[data-chat-role="user"]'
    equals: SHELL AI 第一条
- assert_value:
    selector: '[data-testid="ai-chat-composer"] textarea'
    equals: ''
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI background
- click: '[data-testid="ai-chat-send-button"]'
- click: '[data-testid="shell-rail-tao"]'
- assert_not_visible: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-notifications"]'
- wait_for: '[data-testid="tao-alert-inbox-item"][data-alert-kind="ai_done"]'
- assert_count:
    selector: '[data-testid="tao-alert-inbox-item"][data-alert-kind="ai_done"]'
    equal: 1
- click: '[data-testid="tao-alert-inbox-item"][data-alert-kind="ai_done"] [data-testid="tao-alert-jump"]'
- wait_for: '[data-testid="shell-chat-content"][data-ready="true"]'
- assert_count:
    selector: '[data-chat-role="assistant"]'
    equal: 2
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI background
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: 'SHELL AI unsent 中文

      Second draft line'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="shell-rail-tao"]'
- assert_value:
    selector: '[data-testid="ai-chat-composer"] textarea'
    equals: 'SHELL AI unsent 中文

      Second draft line'
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI error
- click: '[data-testid="ai-chat-send-button"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: QA provider unavailable
    timeout_sec: 20
- fill:
    selector: '[data-testid="ai-chat-composer"] textarea'
    value: SHELL AI recovery
- click: '[data-testid="ai-chat-send-button"]'
- eval_readonly:
    expression: document.querySelector('[data-thread-id][data-ready]').textContent.split('SHELL AI response
      中文').length === 4 && document.querySelector('[data-thread-id][data-ready]').textContent.split('Second
      paragraph').length === 4
    expect_truthy: true
    timeout_sec: 20
- assert_json_file:
    path: ${fixture.ai_provider_requests}
    expect:
      requests: 4
      streamRequests: 4
      lastUserMessage: SHELL AI recovery
      model: qa-model
      toolRequests: 4
- restart_native_app: null
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="shell-rail-tao"]'
- click: '[data-testid="tao-hub-tab-chat"]'
- click: '[data-testid="ai-chat-drawer"] button[title="History"]'
- wait_for: '[data-chat-thread-id]'
- assert_count:
    selector: '[data-chat-thread-id]'
    equal: 1
- click: '[data-chat-thread-id]'
- wait_for: '[data-testid="shell-chat-content"][data-ready="true"]'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI 第一条
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI background
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: 'SHELL AI response 中文

      Second paragraph'
- assert_text:
    selector: '[data-testid="shell-chat-content"]'
    contains: SHELL AI recovery
- assert_json_file:
    path: ${fixture.ai_provider_requests}
    expect:
      requests: 4
      streamRequests: 4
      lastUserMessage: SHELL AI recovery
      model: qa-model
      toolRequests: 4
- screenshot: tc-shell-ai-stream-history.png

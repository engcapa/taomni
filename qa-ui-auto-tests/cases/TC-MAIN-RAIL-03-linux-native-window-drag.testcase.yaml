  requirements:
  - id: R1
    requirement: Linux 原生窗口标题栏抓手的三个拖拽位置产生请求位移且不改变大小，并避开原生边缘缩放区；折叠后同样可拖拽，移动后两个常驻按钮可操作。
    actions:
    - 1
    - 5
    - 13
    - 14
    - 15
    - 17
    - 18
    - 22
    checkpoints:
    - step: 3
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"session-tree\"]"}'
    - step: 12
      expectation: '{"eval_readonly": {"expression": "document.querySelector(''.taomni-control-bar .taomni-window-drag-handle'').getBoundingClientRect().height
        <= 32 && getComputedStyle(document.querySelector(''.taomni-main-window'')).paddingLeft === ''0px''", "expect_truthy": true}}'
    - step: 13
      expectation: '{"native_window_drag": {"selector": "[data-testid=\"window-drag-handle\"]", "y_fraction": 0.35, "dx": 24, "dy": 18}}'
    - step: 14
      expectation: '{"native_window_drag": {"selector": "[data-testid=\"window-drag-handle\"]", "y_fraction": 0.5, "dx": 24, "dy": 18}}'

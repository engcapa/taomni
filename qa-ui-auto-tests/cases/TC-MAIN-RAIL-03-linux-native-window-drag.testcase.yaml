id: TC-MAIN-RAIL-03
title: Shared top frame, mode titles and grip move the actual Linux native window
description: Physical X11 or Mutter Wayland input and independent OS geometry prove window movement from the common top frame in Home, Tools, Sessions and
  empty/occupied Workspaces. Retains the three grip positions, collapse/expand actions and live PTY checks. The outer 2px and corners remain resize targets.
covers:
- F1.2
- F1.3
- F6.2
- F-Sockscap-1
- F-WS-2
tags:
- main
- sidebar
- window
- p1
modes:
- native
native_platforms:
- Linux
fixtures:
- reset_db
- linux_desktop_required
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-main-rail-password
- wait_for: '[data-testid="welcome-panel"]'
- seed_storage:
    key: taomni.sidebarCollapsed
    value: 'false'
- reload_window: null
- wait_for: '[data-testid="platform-mode-title"]'
- native_window_drag:
    selector: '[data-testid="main-window-top-drag-region"]'
    dx: 24
    dy: 18
- native_window_drag:
    selector: '[data-testid="platform-mode-title"]'
    dx: 24
    dy: 18
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- native_window_drag:
    selector: '[data-testid="main-window-top-drag-region"]'
    dx: 24
    dy: 18
- eval_readonly:
    expression: document.querySelector('.taomni-control-bar .taomni-window-drag-handle').getBoundingClientRect().height <= 32 && getComputedStyle(document.querySelector('.taomni-main-window')).paddingLeft
      === '0px'
    expect_truthy: true
- native_window_drag:
    selector: '[data-testid="window-drag-handle"]'
    y_fraction: 0.35
    dx: 24
    dy: 18
- native_window_drag:
    selector: '[data-testid="window-drag-handle"]'
    y_fraction: 0.5
    dx: 24
    dy: 18
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="collapsed-sidebar-rail"]'
- native_window_drag:
    selector: '[data-testid="window-drag-handle"]'
    y_fraction: 0.85
    dx: 24
    dy: 18
- click: '[data-testid="collapsed-sidebar-rail"] [data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- native_window_drag:
    selector: '[data-testid="main-window-top-drag-region"]'
    dx: 24
    dy: 18
- native_window_drag:
    selector: '[data-testid="platform-mode-title"]'
    dx: 24
    dy: 18
- click: '[data-testid="side-tab-sessions"]'
- wait_for: '[data-testid="session-tree"]'
- click: '[data-testid="nav-mode-workspaces"]'
- wait_for: '[data-testid="workspace-tab-drag-region"]'
- native_window_drag:
    selector: '[data-testid="main-window-top-drag-region"]'
    dx: 24
    dy: 18
- native_window_drag:
    selector: '[data-testid="workspace-tab-drag-region"]'
    dx: 24
    dy: 18
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-local-terminal"]'
- wait_for: '[data-testid="terminal-pane"][data-terminal-active="true"][data-terminal-ready="true"]'
- native_window_drag:
    selector: '[data-testid="main-window-top-drag-region"]'
    y_fraction: 0.85
    dx: 24
    dy: 18
- native_window_drag:
    selector: '[data-testid="workspace-tab-drag-region"]'
    dx: 24
    dy: 18
- assert_count:
    selector: '[data-testid="workspace-tab"]'
    equal: 1
- assert_no_runtime_errors: null
- screenshot: main-rail-linux-after-window-moves.png

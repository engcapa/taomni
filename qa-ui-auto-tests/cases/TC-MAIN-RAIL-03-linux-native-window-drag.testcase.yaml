id: TC-MAIN-RAIL-03
title: Upper, middle and lower Shell grip move the real Linux window
description: Adapted for Workspace Shell v2. The permanent Rail, per-lane Navigator
  and merged workspace stripes replace the old expanded/collapsed sidebar wrappers.
  Retained results are declared in each requirement.
covers:
- F1.2
- F1.3
tags:
- main
- sidebar
- window
- p1
modes:
- native
native_platforms:
- Linux
fixtures:
- reset_db
- linux_x11_required
timeout_sec: 120
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-shell-retained-password
- wait_for: '[data-testid="welcome-panel"]'
- eval_readonly:
    expression: Math.abs(document.querySelector('[data-window-drag]').getBoundingClientRect().height
      - innerHeight) < 1
    expect_truthy: true
    timeout_sec: 5
- native_window_drag:
    selector: '[data-testid="window-drag-handle"]'
    y_fraction: 0.15
    dx: 24
    dy: 18
- native_window_drag:
    selector: '[data-testid="window-drag-handle"]'
    y_fraction: 0.5
    dx: 24
    dy: 18
- click: '[data-testid="shell-rail-sessions"]'
- assert_not_visible: '[data-testid="session-tree"]'
- native_window_drag:
    selector: '[data-testid="window-drag-handle"]'
    y_fraction: 0.85
    dx: 24
    dy: 18
- click: '[data-testid="shell-rail-workspaces"]'
- click: '[data-testid="shell-navigator-page"][data-page="tools"]'
- assert_visible: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="shell-rail-sessions"]'
- assert_visible: '[data-testid="session-tree"]'
- assert_element_geometry:
    selector: '[data-testid="shell-rail-sessions"]'
    min_width: 1
    min_height: 1
    within_viewport: true
    hit_center: true
- screenshot: main-rail-linux-v2-after-moves.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Independent X11 geometry confirms all three full-height grip positions
      move rather than resize the window.
    actions:
    - 5
    - 6
    - 7
    - 9
    - 10
    - 11
    - 13
    checkpoints:
    - step: 4
      expectation: Independent X11 geometry confirms all three full-height grip positions
        move rather than resize the window.
    - step: 8
      expectation: Independent X11 geometry confirms all three full-height grip positions
        move rather than resize the window.
    - step: 12
      expectation: Independent X11 geometry confirms all three full-height grip positions
        move rather than resize the window.
    - step: 14
      expectation: Independent X11 geometry confirms all three full-height grip positions
        move rather than resize the window.
    - step: 15
      expectation: Independent X11 geometry confirms all three full-height grip positions
        move rather than resize the window.
    - step: 5
      expectation: Independent OS geometry matches the requested displacement without
        resizing.
    - step: 6
      expectation: Independent OS geometry matches the requested displacement without
        resizing.
    - step: 9
      expectation: Independent OS geometry matches the requested displacement without
        resizing.
    results:
    - 4
    - 8
    - 12
    - 14
    - 15
    - 5
    - 6
    - 9
  visual:
  - check: 检查对应截图的图标、名称、选中态、全高拖拽带以及点击区域无缩小、遮挡或截断。
    method: manual
    reason: 实际尺寸断言辅助视觉评审；CI 图片在下载后评审。
  native:
  - check: 原生 WebView 交互和尺寸由真实 QA 应用执行；Linux 窗口拖动另由 TC-MAIN-RAIL-03 的 X11 输入和独立几何读数证明。
    method: automated
    reason: browser 不能证明 OS 窗口移动，未执行平台不计作通过。

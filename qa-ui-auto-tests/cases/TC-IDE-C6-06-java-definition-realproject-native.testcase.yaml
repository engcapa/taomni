id: TC-IDE-C6-06-java-definition-realproject-native
title: Java definition navigation in Apache Commons Lang
description: Read-only native Java navigation in the public Apache Commons Lang 3.17.0 Maven project. Hosted runners
  download a SHA256-verified archive at a fixed commit and set QA_JAVA_PROJECT_ROOT. Locally, leave that variable
  unset to skip; when set, it must point to a compatible Commons Lang checkout. Exercise same-file field navigation
  with Mod+B and Control+B, cross-file Pair source navigation, JDK Map navigation, history restoration, and unchanged
  source/POM hashes. Browser stubs cannot establish real JDTLS and filesystem results.
covers:
- F25.5
tags:
- code-workspace
- ide-c6
- java
- definition
- regression
- p0
modes:
- native
native_platforms:
- Linux
- macOS
- Windows

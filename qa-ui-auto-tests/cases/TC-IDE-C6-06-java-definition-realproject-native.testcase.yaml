    - step: 44
      expectation: '{"eval_readonly": {"expression": "document.body.innerText.includes(\"decompiled\") || document.body.innerText.includes(\"java.sql\")
        || document.body.innerText.includes(\"Connection.java\")", "expect_truthy": true}}'

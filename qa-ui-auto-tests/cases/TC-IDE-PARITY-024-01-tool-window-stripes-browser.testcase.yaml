id: TC-IDE-PARITY-024-01
title: 'IDEA tool window stripes: names, resizable width, Move between anchors, Remove from Sidebar'
description: 'ED-PARITY-024 A1/A2/A3 browser case: the stripes show tool window names at IDEA''s 59 px default,
  resize from their inner edge (40–100 px) and switch to 40 px icon-only via Show Tool Window Names. A stripe button''s
  context menu moves Problems to Right Top (its button and window follow; the bottom dock closes), Alt+6 toggles
  it there, the window''s ⋮ Move to returns it to Bottom Left. Structure opens below Project (IDEA Left Bottom).
  Remove from Sidebar drops Run''s button and More tool windows restores and shows it. The Project window header
  adds IDEA''s Expand All, Collapse All and Select Opened File.


  Mode: browser.'
covers:
- F1.2
- F25.5
tags:
- code-workspace
- ed-parity-024
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:

id: TC-IDE-PARITY-024-01
title: 'IDEA tool window stripes: names, resizable width, Move between anchors, Remove from Sidebar'
description: 'ED-PARITY-024 A1/A2/A3 browser case: the stripes show tool window names at IDEA''s 59 px default, resize from their inner edge (40–100 px) and switch to 40 px icon-only via Show Tool Window Names. A stripe button''s context menu moves Problems to Right Top (its button and window follow; the bottom dock closes), Alt+6 toggles it there, the window''s ⋮ Move to returns it to Bottom Left. Structure opens below Project (IDEA Left Bottom). Remove from Sidebar drops Run''s button and More tool windows restores and shows it.


  Mode: browser.

  '
covers:
- F25.5
tags:
- code-workspace
- ed-parity-024
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]:visible'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- click: '[data-testid="code-workspace-editor"] .cm-content'
- assert_attribute:
    selector: '[data-testid="code-workspace-tool-rail-left"]'
    name: data-show-names
    equals: 'true'
- eval_readonly:
    expression: Math.round(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tool-rail-left\"]").getBoundingClientRect().width) === 59
    expect_truthy: true
- right_click: '[data-testid="code-workspace-bottom-tab-problems"]'
- click: '[data-testid="code-workspace-tool-rail-menu-move"]'
- click: '[data-testid="code-workspace-tool-rail-menu-move-right-top"]'
- assert_visible: '[data-testid="code-workspace-tool-rail-right"] [data-testid="code-workspace-bottom-tab-problems"]'
- assert_attribute:
    selector: '[data-testid="code-workspace-bottom-tab-problems"]'
    name: aria-pressed
    equals: 'false'
- click: '[data-testid="code-workspace-bottom-tab-problems"]'
- wait_for:
    selector: '[data-testid="code-workspace-right-pane"] [data-testid="code-workspace-tool-window-problems"]'
    timeout_sec: 10
- assert_attribute:
    selector: '[data-testid="code-workspace-bottom-tab-problems"]'
    name: aria-pressed
    equals: 'true'
- assert_not_visible: '[data-testid="code-workspace-bottom-dock-body"]'
- click: '[data-testid="code-workspace-bottom-tab-problems"]'
- wait_for:
    selector: '[data-testid="code-workspace-tool-window-problems"]'
    state: detached
    timeout_sec: 5
- eval_readonly:
    expression: document.activeElement?.classList?.contains("cm-content") === true
    expect_truthy: true
- press: Alt+6
- wait_for:
    selector: '[data-testid="code-workspace-right-pane"] [data-testid="code-workspace-tool-window-problems"]'
    timeout_sec: 10
- click: '[data-testid="code-workspace-tool-window-options-problems"]'
- click: '[data-testid="code-workspace-tool-window-move"]'
- click: '[data-testid="code-workspace-tool-window-move-bottom-left"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-dock"][data-open] [data-testid="code-workspace-tool-window-problems"]'
    timeout_sec: 10
- assert_visible: '[data-testid="code-workspace-tool-rail-left"] [data-testid="code-workspace-bottom-tab-problems"]'
- assert_text:
    selector: '[data-testid="code-workspace-tool-window-title"]'
    contains: Problems
- click: '[data-testid="code-workspace-tool-rail-structure"]'
- wait_for:
    selector: '[data-testid="code-workspace-left-tool-area"] [data-testid="code-workspace-tool-window-structure"]'
    timeout_sec: 10
- assert_visible: '[data-testid="code-workspace-tree-add-folder"]'
- right_click: '[data-testid="code-workspace-bottom-tab-terminal"]'
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- eval_readonly:
    expression: Math.round(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tool-rail-left\"]").getBoundingClientRect().width) === 40
    expect_truthy: true
- assert_count:
    selector: '[data-testid="code-workspace-tool-rail-left-resize"]'
    equal: 0
- right_click: '[data-testid="code-workspace-bottom-tab-terminal"]'
- click: '[data-testid="code-workspace-tool-rail-menu-show-names"]'
- click: '[data-testid="code-workspace-tool-rail-left-resize"]'
- press: ArrowRight
- press: ArrowRight
- press: ArrowRight
- press: ArrowRight
- press: ArrowRight
- eval_readonly:
    expression: Math.round(document.querySelector("[data-testid" + String.fromCharCode(61) + "\"code-workspace-tool-rail-left\"]").getBoundingClientRect().width) === 79
    expect_truthy: true
- right_click: '[data-testid="code-workspace-bottom-tab-run"]'
- click: '[data-testid="code-workspace-tool-rail-menu-remove"]'
- assert_count:
    selector: '[data-testid="code-workspace-bottom-tab-run"]'
    equal: 0
- click: '[data-testid="code-workspace-bottom-tab-overflow"]'
- click: '[data-testid="code-workspace-bottom-tab-overflow-run"]'
- wait_for:
    selector: '[data-testid="code-workspace-bottom-tab-run"][aria-pressed="true"]'
    timeout_sec: 10
- assert_text:
    selector: '[data-testid="code-workspace-tool-window-title"]'
    contains: Run
- screenshot: tc-ide-parity-024-01-stripes.png

id: TC-IDE-PARITY-024-01
title: 'IDEA tool window stripes: names, resizable width, Move between anchors, Remove from Sidebar'
description: 'ED-PARITY-024 A1/A2/A3 browser case adapted to Shell v2: the merged Rail shows tool window
  names at a 68 px minimum, resizes from its inner edge, and switches to 52 px icon-only via Show Tool Window
  Names. A stripe button''s context menu moves Problems to Right Top (its button and window follow; the
  bottom dock closes), Alt+6 toggles it there, the window''s ⋮ Move to returns it to Bottom Left. Structure
  opens below Project (IDEA Left Bottom). Remove from Sidebar drops Run''s button and More tool windows
  restores and shows it. The Project window header adds IDEA''s Expand All, Collapse All and Select Opened
  File.


  Mode: browser.

  Shell v2 entry adaptation: Tools and Sessions use the permanent Rail with visibility-aware user clicks;
  Settings uses its permanent Rail button. Original business checks are retained. Shell v2 names mode
  renders a 68 px minimum so full global labels fit; resizing still preserves the stored stripe preference
  and reaches the existing 79 px target.'
covers:
- F25.5
tags:
- code-workspace
- ed-parity-024
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 240
steps:

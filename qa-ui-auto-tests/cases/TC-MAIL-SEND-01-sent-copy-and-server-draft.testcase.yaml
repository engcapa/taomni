id: TC-MAIL-SEND-01
title: Mail stores server drafts and a Sent copy through IMAP APPEND
description: 'TASK-06 (docs-feature/mail-thunderbird-parity-design.md AC-20/AC-21):

  composing a message and saving it stores a copy in the server Drafts

  folder; sending it removes that server draft and appends the sent message

  to the Sent folder so other clients see both. Browser mode drives the stub

  server model; native mode uses the fake IMAP/SMTP server and the real

  SMTP and IMAP APPEND path. The accepted recipient is available when composing
  another message.

  '
covers:
- F-MAIL-6
- F-MAIL-2
- F-MAIL-23
tags:
- mail
- p1
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_expunge_newest:
    folder: Sent
    count: 1000000
- click: '[data-testid="mail-compose-open"]'
- wait_for: '[data-testid="mail-compose-dialog"]'
- fill:
    selector: '[data-testid="mail-recipient-to"] input'
    value: qa-sent-contact@example.org
- press: Enter
- fill:
    selector: '[data-testid="mail-compose-subject"]'
    value: Server draft and sent copy
- type:
    selector: '[data-testid="mail-compose-editor"]'
    text: Stored on the server for other clients
- click: '[data-testid="mail-compose-save-draft"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: Draft saved to Drafts
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Drafts
    equals: 1
    has_subject: Server draft and sent copy
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Revised draft and sent copy}
- click: '[data-testid="mail-compose-save-draft"]'
- mail_server_assert_folder_count: {folder: Drafts, equals: 1, has_subject: Revised draft and sent copy, lacks_subject: Server draft and sent copy}
- assert_text: {selector: '[data-testid="mail-client-tab"]', contains: Draft saved to Drafts, timeout_sec: 25}
- click: '[data-testid="mail-compose-send"]'
- wait_for:
    selector: '[data-testid="mail-compose-dialog"]'
    state: detached
- assert_text:
    selector: '[data-testid="mail-sent-copy-status"]'
    contains: copy saved to Sent
    timeout_sec: 30
- mail_server_assert_folder_count:
    folder: Sent
    equals: 1
    has_subject: Revised draft and sent copy
- mail_server_assert_folder_count:
    folder: Drafts
    equals: 0
    lacks_subject: Revised draft and sent copy
- click: '[data-testid="mail-sync-button"]'
- assert_text:
    selector: '[data-testid="mail-client-tab"]'
    contains: Synced
    timeout_sec: 30
- assert_text:
    selector: '[data-testid="mail-sent-copy-status"]'
    contains: copy saved to Sent
- assert_text:
    selector: '[data-testid="mail-storage-progress"]'
    contains: completed
    timeout_sec: 60
- mail_server_assert_smtp_contains:
    text: Revised draft and sent copy
    timeout_sec: 20
- mail_server_assert_smtp_contains:
    text: Stored on the server for other clients
    timeout_sec: 20
- click: '[data-testid="mail-client-tab"] [data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: receiver@example.com}
- press: Enter
- fill: {selector: '[data-testid="mail-compose-subject"]', value: Discardable server draft}
- click: '[data-testid="mail-compose-save-draft"]'
- mail_server_assert_folder_count: {folder: Drafts, has_subject: Discardable server draft}
- assert_text: {selector: '[data-testid="mail-client-tab"]', contains: Draft saved to Drafts, timeout_sec: 25}
- click: '[role="dialog"][aria-label="New message"] [aria-label="Close dialog"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- click: '[data-testid="mail-client-tab"] [data-testid="mail-drafts-open"]'
- assert_text: {selector: '[data-testid="mail-draft-row"][data-subject="Discardable server draft"]', contains: Discardable server draft}
- click: '[data-testid="mail-draft-row"][data-subject="Discardable server draft"] button[title="Delete draft"]'
- mail_server_assert_folder_count: {folder: Drafts, lacks_subject: Discardable server draft}
- wait_for: {selector: '[data-testid="mail-draft-row"][data-subject="Discardable server draft"]', state: detached}
- click: '[role="dialog"][aria-label="Drafts and templates"] [aria-label="Close dialog"]'
- assert_no_runtime_errors: null
- screenshot: mail-send-01-sent-copy.png
- click: '[data-testid="mail-folder-row"][data-folder-name="Sent"]'
- wait_for: '[data-testid="mail-message-row"][data-subject="Revised draft and sent copy"]'
- press: {selector: '[data-testid="mail-message-row"][data-subject="Revised draft and sent copy"]', key: Enter}
- eval_readonly:
    expression: >-
      (document.querySelector('.taomni-mail-reader-frame')?.contentDocument?.body?.textContent
      ?? document.querySelector('.taomni-mail-reader-text')?.textContent
      ?? '').includes('Stored on the server for other clients')
    expect_truthy: true
    timeout_sec: 30
- assert_no_runtime_errors: null
- click: '[data-testid="mail-folder-row"][data-folder-name="INBOX"]'
- mail_server_assert_list_matches: {folder: INBOX, timeout_sec: 30}
- click: '[data-testid="mail-client-tab"] [data-testid="mail-compose-open"]'
- fill: {selector: '[data-testid="mail-recipient-to"] input', value: qa-sent-cont}
- assert_text:
    selector: '[data-testid="mail-recipient-suggestions"]'
    contains: qa-sent-contact@example.org
    timeout_sec: 20
- click: '[role="dialog"][aria-label="New message"] [aria-label="Close dialog"]'
- wait_for: {selector: '[data-testid="mail-compose-dialog"]', state: detached}
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 手工保存草稿后服务器 Drafts 出现一份副本（AC-21）。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 9
    - 11
    - 12
    - 13
    - 14
    - 15
    checkpoints:
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"mail-client-tab\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"mail-compose-dialog\"]"}'
    - step: 16
      expectation: '{"assert_text": {"contains": "Draft saved to Drafts"}}'
    - step: 17
      expectation: '{"mail_server_assert_folder_count": {"folder": "Drafts", "equals": 1}}'
    results:
    - 16
    - 17
  - id: R2
    requirement: 发送后服务器 Sent 收到副本、服务器草稿被移除（AC-20/AC-21）。
    actions:
    - 22
    - 27
    - 50
    - 52
    checkpoints:
    - step: 23
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-compose-dialog\"]", "state": "detached"}}'
    - step: 24
      expectation: '{"assert_text": {"contains": "copy saved to Sent"}}'
    - step: 25
      expectation: '{"mail_server_assert_folder_count": {"folder": "Sent", "equals": 1}}'
    - step: 26
      expectation: '{"mail_server_assert_folder_count": {"folder": "Drafts", "equals": 0}}'
    - step: 29
      expectation: A later mailbox refresh does not overwrite the Sent-copy result.
    - step: 31
      expectation: SMTP receives the composed message independently of the Sent folder copy.
    - step: 32
      expectation: SMTP receives the composed text body as well as the subject.
    - step: 48
      expectation: Sending and the subsequent refresh leave no runtime errors.
    - step: 53
      expectation: Opening the Sent copy renders the composed text body.
    - step: 54
      expectation: Opening the Sent copy leaves no runtime errors.
    results:
    - 29
    - 24
    - 25
    - 26
    - 31
    - 32
    - 48
    - 53
    - 54
  - id: R3
    requirement: Quick Connect 默认目录的完整原件下载必须完成，不能在发送成功时遗漏后台归档发布错误；覆盖 Windows 长存储路径。
    actions:
    - 5
    - 6
    - 22
    checkpoints:
    - step: 30
      expectation: Default-directory full MIME storage completes without a publication error, including Windows paths longer than MAX_PATH.
    results:
    - 30
  - id: R4
    requirement: Editing a saved draft replaces its server copy, and deleting a saved draft removes it from both the local list and the server.
    actions: [19, 44]
    checkpoints:
    - {step: 20, expectation: Drafts contains only the revised version before sending.}
    - {step: 38, expectation: The second draft is visible on the server before removal.}
    - {step: 45, expectation: The server no longer lists the discarded draft.}
    - {step: 46, expectation: The deleted draft leaves the local list.}
    results: [20, 38, 45, 46]
  - id: R5
    requirement: Sending makes the accepted recipient available in a new composer opened from the Inbox.
    actions: [22, 55, 57, 58, 60]
    checkpoints:
    - {step: 56, expectation: The visible mailbox is back on Inbox.}
    - {step: 59, expectation: A partial address locates the recipient of the delivered message.}
    - {step: 61, expectation: Closing the new composer leaves the mailbox ready.}
    - {step: 62, expectation: Reopening and closing the composer leaves no runtime errors.}
    results: [56, 59, 61, 62]
  visual:
  - check: 截图中状态栏显示已保存 Sent 副本，写信窗口已关闭。
    method: manual
    reason: 像素与布局需人工评审。
  native:
  - check: native 模式验证真实 SMTP 发送与 IMAP APPEND；browser 仅验证渲染层与桩模型；平台结果分别记录。
    method: automated
    reason: 按实际执行模式与平台解释证据。

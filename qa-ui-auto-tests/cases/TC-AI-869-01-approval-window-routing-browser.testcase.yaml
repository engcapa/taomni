id: TC-AI-869-01-approval-window-routing-browser
title: Tao local-agent approval cards stay in the addressed window, dedupe and clear
description: 'Issue #869 renderer contract. A local-agent approval is an event addressed to the window that started the chat turn; a detached session window mounts the same bridge. This case drives the real bridge through its QA-only trigger and asserts: the addressed card renders once with Allow / Allow for session / Deny, and each decision is reported through cc_resolve_permission; a repeated emit does not stack a second card; agent-cc-permission-resolved removes a card that another window already decided; an event addressed to a different window label is ignored while the unlabelled broadcast fallback stays answerable; and the ACP gate shows its locally trusted option labels, reports the selected option through acp_resolve_permission, reports cancel through acp_cancel_permission and disappears on the production dismissed broadcast. Browser preview has one renderer, so cross-window delivery itself is proven by TC-AI-869-02.'
covers:
- F-AI-2.4
tags:
- ai
- approval
- window
- regression
- p1
modes:
- browser

id: TC-MAIL-AGENDA-01
title: Accepting an invitation writes it into the CalDAV calendar and shows it in the agenda
description: 'TASK-20 phase 2 (docs-feature/mail-thunderbird-parity-design.md AC-64, DEC-14).

  Opens an account with a CalDAV URL, delivers an iMIP invitation, accepts it

  and requires the invite card to report the event is in the calendar, the

  calendar to hold the event with PARTSTAT=ACCEPTED, and the Agenda dialog to

  list it. Recurrence expansion, alarms and the agenda window are covered by

  the Rust tests (mail::caldav) and Vitest (mailCalendar.test.ts).

  Browser mode drives the stub agenda (renderer orchestration only); native

  mode discovers and writes to the fake CalDAV server started by the

  mail_server fixture (well-known redirect, principal, calendar-home-set, PUT).

  '
covers:
- F-MAIL-22
tags:
- mail
- p2
modes:
- browser
- native
fixtures:
- reset_db
- mail_server
timeout_sec: 150
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ${fixture.mail_caldav_quick_connect}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="mail-client-tab"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- mail_server_deliver:
    count: 1
    prefix: Invite
    invite: QA planning
- click: '[data-testid="mail-sync-button"]'
- mail_server_assert_list_matches:
    timeout_sec: 60
- fill:
    selector: '[data-testid="mail-search-input"]'
    value: Invite 0001
- click: '[data-testid="mail-message-row"]'
- wait_for:
    selector: '[data-testid="mail-invite-card"]'
    timeout_sec: 30
- click: '[data-testid="mail-invite-accept"]'
- wait_for:
    selector: '[data-testid="mail-invite-in-calendar"]'
    timeout_sec: 40
- mail_server_assert_caldav_contains:
    text: QA planning
    timeout_sec: 20
- mail_server_assert_caldav_contains:
    text: PARTSTAT=ACCEPTED
    timeout_sec: 10
- click: '[data-testid="mail-agenda-open"]'
- wait_for:
    selector: '[data-testid="mail-agenda-event"][data-summary="QA planning"]'
    timeout_sec: 20
- screenshot: mail-agenda-01.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: 配置了 CalDAV 的账户接受邀请后，事件写入 CalDAV 日历且带我的 PARTSTAT=ACCEPTED，邀请卡片显示已在日历中（AC-64，DEC-14）。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 9
    - 10
    - 12
    - 13
    - 15
    checkpoints:
    - step: 8
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 11
      expectation: '{"mail_server_assert_list_matches": {"timeout_sec": 60}}'
    - step: 14
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-invite-card\"]", "timeout_sec": 30}}'
    - step: 16
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-invite-in-calendar\"]", "timeout_sec": 40}}'
    - step: 17
      expectation: '{"mail_server_assert_caldav_contains": {"text": "QA planning", "timeout_sec": 20}}'
    - step: 18
      expectation: '{"mail_server_assert_caldav_contains": {"text": "PARTSTAT=ACCEPTED", "timeout_sec": 10}}'
    results:
    - 16
    - 17
    - 18
  - id: R2
    requirement: 邮件标签内的 Agenda 列出该事件（不提供日历网格，DEC-14）。
    actions:
    - 19
    checkpoints:
    - step: 20
      expectation: '{"wait_for": {"selector": "[data-testid=\"mail-agenda-event\"][data-summary=\"QA planning\"]", "timeout_sec": 20}}'
    results:
    - 20
  visual:
  - check: 截图中 Agenda 按日期分组显示 “QA planning”，时间与地点正确。
    method: manual
    reason: 像素与布局需人工评审。
  native:
  - check: native 模式验证后端经 RFC 6764 发现假 CalDAV 服务器并 PUT 事件；browser 仅验证渲染层；平台结果分别记录。
    method: automated
    reason: 按实际执行模式与平台解释证据。

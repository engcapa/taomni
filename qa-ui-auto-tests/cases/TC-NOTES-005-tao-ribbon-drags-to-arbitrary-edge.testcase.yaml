id: TC-NOTES-005
title: Permanent Tao entries replace the removed floating ribbon
description: Shell redesign follow-up acceptance. User actions use production controls and commands. Browser stubs
  do not establish native side effects.
covers:
- F-TAO-1
tags:
- workspace-shell
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- assert_count:
    selector: '[data-testid="ai-chat-drawer-ribbon"]'
    equal: 0
- click: '[data-testid="shell-rail-tao"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- click: '[data-testid="notes-new"]'
- wait_for: '[data-testid="note-editor-title"]'
- fill:
    selector: '[data-testid="note-editor-title"]'
    value: Permanent Tao draft
- click: '[data-testid="ai-chat-drawer-hide"]'
- click: '[data-testid="shell-tao-toggle"]'
- assert_value:
    selector: '[data-testid="note-editor-title"]'
    equals: Permanent Tao draft
- assert_count:
    selector: '[data-testid="ai-chat-drawer"]'
    equal: 1
- assert_count:
    selector: '[data-testid="ai-chat-drawer-ribbon"]'
    equal: 0
- screenshot: notes-005-permanent-tao.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Rail and titlebar open one shared Hub; closing and reopening preserve Notes.
    actions:
    - 1
    - 4
    - 6
    - 7
    - 9
    - 10
    - 11
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 3
      expectation: '{"assert_count": {"selector": "[data-testid=\"ai-chat-drawer-ribbon\"]", "equal": 0}}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"ai-chat-drawer\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"note-editor-title\"]"}'
    - step: 12
      expectation: '{"assert_value": {"selector": "[data-testid=\"note-editor-title\"]", "equals": "Permanent Tao
        draft"}}'
    - step: 13
      expectation: '{"assert_count": {"selector": "[data-testid=\"ai-chat-drawer\"]", "equal": 1}}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"ai-chat-drawer-ribbon\"]", "equal": 0}}'
    results:
    - 2
    - 3
    - 5
    - 8
    - 12
    - 13
    - 14
  visual:
  - check: Dock, palette and content stay readable with no clipped controls.
    method: manual
    reason: Review retained screenshots from each engine.
  native:
  - check: Packaged WebView, PTY and native lifecycle boundaries.
    method: not-applicable
    reason: Native cases retain actual backend effects; browser cases prove renderer behavior only.

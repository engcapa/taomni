id: TC-NOTES-005
title: Tao opens from the primary rail without an edge-docked ribbon
description: 'The removed edge ribbon stays absent before and after reload. Chat and Notes remain reachable through the primary rail, including reopening after hiding the drawer.'
covers:
- F-TAO-1
tags:
- notes
- tao
- ribbon
- p2
modes:
- browser
fixtures:
- reset_db
timeout_sec: 45
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- assert_count:
    selector: '[data-testid="ai-chat-drawer-ribbon"]'
    equal: 0
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="tao-hub-tab-notes"]'
- wait_for: '[data-testid="notes-panel"]'
- click: '[data-testid="ai-chat-drawer-hide"]'
- assert_not_visible: '[data-testid="ai-chat-drawer"]'
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="notes-panel"]'
- reload:
- wait_for: '[data-testid="status-bar"]'
- assert_count:
    selector: '[data-testid="ai-chat-drawer-ribbon"]'
    equal: 0
- click: '[data-testid="rail-chat-button"]'
- wait_for: '[data-testid="notes-panel"]'
- screenshot: notes-005-rail-entry-no-ribbon.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Tao 悬浮条已移除；左栏入口打开 Chat/Notes，隐藏后可重新打开，重载后仍无悬浮条。
    actions:
    - 1
    - 4
    - 6
    - 8
    - 10
    - 12
    - 15
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"status-bar\"]"}'
    - step: 3
      expectation: '{"assert_count": {"selector": "[data-testid=\"ai-chat-drawer-ribbon\"]", "equal": 0}}'
    - step: 5
      expectation: '{"wait_for": "[data-testid=\"ai-chat-drawer\"]"}'
    - step: 7
      expectation: '{"wait_for": "[data-testid=\"notes-panel\"]"}'
    - step: 9
      expectation: '{"assert_not_visible": "[data-testid=\"ai-chat-drawer\"]"}'
    - step: 11
      expectation: '{"wait_for": "[data-testid=\"notes-panel\"]"}'
    - step: 13
      expectation: '{"wait_for": "[data-testid=\"status-bar\"]"}'
    - step: 14
      expectation: '{"assert_count": {"selector": "[data-testid=\"ai-chat-drawer-ribbon\"]", "equal": 0}}'
    - step: 16
      expectation: '{"wait_for": "[data-testid=\"notes-panel\"]"}'
    results:
    - 2
    - 3
    - 5
    - 7
    - 9
    - 11
    - 13
    - 14
    - 16
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

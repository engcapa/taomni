id: TC-IDE-C6-07-java-definition-unavailable-browser
title: Definition navigation fails closed without a browser language server
description: 'Browser regression coverage for the Java definition path when the renderer

  has no native language-server provider. Code Workspace must surface the

  degraded-provider banner, keep F12 and Ctrl+B harmless, and never create an

  empty library buffer. Provider-backed Java navigation is covered by the

  native real-project cases.

  '
covers:
- F25.5
tags:
- code-workspace
- ide-c6
- java
- definition
- browser-gate
- p1
modes:
- browser
fixtures:
- reset_db
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="welcome-panel"]'
- click: '[data-testid="side-tab-tools"]'
- wait_for: '[data-testid="sidebar-tools-panel"]'
- click: '[data-testid="sidebar-tool-code-workspace"]'
- wait_for: '[data-testid="code-workspace-tab"]'
- click: '[data-testid="code-workspace-tree-add-folder"]'
- wait_for: '[data-testid="text-input-dialog"]'
- click: '[data-testid="text-input-dialog-confirm"]'
- wait_for: '[data-testid="code-workspace-tree-file"]'
- dblclick: '[data-testid="code-workspace-tree-file"]'
- wait_for: '[data-testid="code-workspace-editor-pane"]'
- eval_readonly:
    expression: document.body.innerText
    contains: No LSP
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Control+b
- press: F12
- assert_text:
    selector: '[data-testid="code-workspace-editor-tab-strip"]'
    contains: README.txt
    timeout_sec: 10
- screenshot: tc-ide-c6-07-java-definition-unavailable-browser.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Definition navigation fails closed without a browser language server：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
    - 14
    - 15
    - 16
    checkpoints:
    - step: 2
      expectation: '{"wait_for": "[data-testid=\"welcome-panel\"]"}'
    - step: 4
      expectation: '{"wait_for": "[data-testid=\"sidebar-tools-panel\"]"}'
    - step: 6
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tab\"]"}'
    - step: 8
      expectation: '{"wait_for": "[data-testid=\"text-input-dialog\"]"}'
    - step: 10
      expectation: '{"wait_for": "[data-testid=\"code-workspace-tree-file\"]"}'
    - step: 12
      expectation: '{"wait_for": "[data-testid=\"code-workspace-editor-pane\"]"}'
    - step: 13
      expectation: '{"eval_readonly": {"expression": "document.body.innerText", "contains": "No LSP"}}'
    - step: 17
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor-tab-strip\"]", "contains":
        "README.txt", "timeout_sec": 10}}'
    results:
    - 17
  visual:
  - check: 检查截图中关键控件、状态反馈、文本和布局无截断或遮挡；截图需要人工评审。
    method: manual
    reason: 像素与原生窗口边界不能由 DOM 断言代替。
  native:
  - check: 仅在用例声明的执行模式中采集证据；browser 证据不替代 native，Linux 结果不外推到 Windows/macOS。
    method: external
    reason: 明确记录执行边界和未验证平台。

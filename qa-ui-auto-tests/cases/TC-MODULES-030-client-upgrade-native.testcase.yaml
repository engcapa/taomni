id: TC-MODULES-030
title: Native RDP sessions and certificate pins recommend one RDP module without losing pending items
description: Seeds synthetic SSH/RDP/VNC sessions and one RDP certificate pin. Real Settings/IPC must list rdp-client and
  vnc-client exactly once while preserving three independent pending journal items, original session/options and pin bytes,
  and retained chat files through repeat and normal restart. This does not export data or activate modules.
covers:
- F-Modules-1
tags:
- p1
- modules
- upgrade
- lifecycle
modes:
- native
fixtures:
- reset_db
- module_upgrade
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 2
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: rdp-client
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: vnc-client
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: preflight
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- assert_attribute:
    selector: '[data-testid="module-upgrade-status"]'
    name: data-state
    equals: candidates
- assert_text:
    selector: '[data-testid="module-upgrade-pending"]'
    contains: verified
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: rdp-client
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: vnc-client
- module_upgrade_probe:
    phase: pending
- native_restart_app:
    expect_exit_confirmation:
      title: Exit
      message: There is 1 open tab. Exit Taomni and close it?
      confirm_label: Exit
- wait_for: '[data-testid="status-bar"]'
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="settings-panel"]'
- fill:
    selector: '[data-testid="settings-search-input"]'
    value: module store
- wait_for: '[data-testid="module-upgrade-status"][data-state="candidates"]'
- assert_count:
    selector: '[data-testid="module-upgrade-candidates"] li'
    equal: 2
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(1)'
    equals: rdp-client
- assert_text_equals:
    selector: '[data-testid="module-upgrade-candidates"] li:nth-child(2)'
    equals: vnc-client
- assert_visible: '[data-testid="module-upgrade-retained"]'
- assert_text:
    selector: '[data-testid="module-upgrade-retained"]'
    contains: '2'
- assert_count:
    selector: '[data-testid="module-upgrade-error"]'
    equal: 0
- module_upgrade_probe:
    phase: repeat
- click: '[data-testid="module-upgrade-migrate"]'
- wait_for: '[data-testid="module-upgrade-pending"]'
- wait_for: '[data-testid="module-upgrade-migrate"]:not([disabled])'
- module_upgrade_probe:
    phase: repeat
- assert_no_runtime_errors: null
- screenshot: client-upgrade-native.png

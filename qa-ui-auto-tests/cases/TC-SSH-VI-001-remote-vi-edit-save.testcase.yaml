id: TC-SSH-VI-001
title: Remote SSH terminal vi comprehensive operations (navigation, yank/paste, edit, :q!, :wq)
description: 'Native verification across Windows, Linux, and macOS that connects to a remote SSH server,

  exercises vi/vim text insertion, cursor navigation (j/k), line yank and paste (yy/p),

  word replacement/editing (cw), discarding changes with :q!, and saving changes with :wq,

  verifying both discarded and persisted disk states.

  '
covers:
- F3.1
- F2.2
- F6.4
- F1.8
tags:
- native
- ssh
- terminal
- vi
- vim
- p0
modes:
- native
native_platforms:
- Linux
- macOS
- Windows
fixtures:
- reset_db
- ssh_required
timeout_sec: 90
steps:
- open: ${cfg.app.base_url}
- seed_storage:
    key: taomni.quickConnectVisible
    value: 'true'
- reload_window: null
- wait_for: '[data-testid="qc-input"]'
- fill:
    selector: '[data-testid="qc-input"]'
    value: ssh://${cfg.ssh.user}@${cfg.ssh.host}:${cfg.ssh.port}
- click: '[data-testid="qc-submit"]'
- wait_for: '[data-testid="auth-prompt"]'
- fill:
    selector: '[data-testid="auth-password"]'
    value: ${env.QA_SSH_PASSWORD}
- click: '[data-testid="auth-submit"]'
- wait_for: '[data-testid="terminal-pane"]'
- wait: 3
- click: '[data-testid="terminal-pane"]'
- type: rm -f /tmp/taomni_vi_test.txt
- press: Enter
- wait: 1
- type: echo 'Alpha Line Original' > /tmp/taomni_vi_test.txt
- press: Enter
- wait: 1
- type: echo 'Beta Line Original' >> /tmp/taomni_vi_test.txt
- press: Enter
- wait: 1
- type: vi /tmp/taomni_vi_test.txt
- press: Enter
- wait: 2
- type: i
- wait: 0.5
- type: DISCARD_THIS_UNSAVED_TEXT
- wait: 0.5
- press: Escape
- wait: 0.5
- type: :q!
- press: Enter
- wait: 2
- type: cat /tmp/taomni_vi_test.txt
- press: Enter
- wait: 1
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: Alpha Line Original
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: Beta Line Original
- type: grep -c DISCARD_THIS /tmp/taomni_vi_test.txt || echo 0
- press: Enter
- wait: 1
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: '0'
- type: vi /tmp/taomni_vi_test.txt
- press: Enter
- wait: 2
- type: j
- wait: 0.5
- type: k
- wait: 0.5
- type: j
- wait: 0.5
- type: yy
- wait: 0.5
- type: p
- wait: 0.5
- type: '0'
- wait: 0.5
- type: cw
- wait: 0.5
- type: Replaced
- wait: 0.5
- press: Escape
- wait: 0.5
- type: o
- wait: 0.5
- type: Gamma Line Appended
- wait: 0.5
- press: Escape
- wait: 0.5
- type: :wq
- press: Enter
- wait: 2
- type: cat /tmp/taomni_vi_test.txt
- press: Enter
- wait: 1
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: Alpha Line Original
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: Beta Line Original
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: Replaced Line Original
- assert_text:
    selector: '[data-testid="terminal-pane"]'
    contains: Gamma Line Appended
- type: rm -f /tmp/taomni_vi_test.txt
- press: Enter
- wait: 0.5
- screenshot: ssh-vi-comprehensive.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Remote SSH terminal vi comprehensive operations (navigation, yank/paste, edit, :q!, :wq)：按步骤执行后，所有声明的可观察结果均满足。
    actions:
    - 1
    - 2
    - 3
    - 5
    - 6
    - 8
    - 9
    - 12
    - 13
    - 14
    - 16
    - 17
    - 19
    - 20
    - 22
    - 23
    - 25
    - 27
    - 29
    - 31
    - 32
    - 34
    - 35
    - 39
    - 40

id: TC-MOBILE-013
title: Authenticated cookie gateway preserves embedded phone UI and opens a real native PTY
covers: [F-MOBILE-1, F1.6, F2.1]
tags: [mobile, authentication, native-boundary, p0, crash-regression]
modes: [native]
fixtures: [reset_db, mobile_service]
timeout_sec: 240
description: >-
  All three OSes: an isolated QA desktop starts the actual mobile listener through
  Settings. An external Chromium phone loads the listener's embedded production
  bundle through a loopback authenticated gateway, without an assets override or
  browser stub. It verifies malformed-response and expired-login recovery, cookie
  isolation, independent Bearer checks and a real WebSocket-to-PTY host marker.
  Desktop assertions require one actual terminal tab/pane and a surviving pane
  after service shutdown. Physical mobile hardware and phone OS input are outside
  this regression.
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-mobile-cookie-master
- click: '[data-testid="ribbon-settings"]'
- fill: {selector: '[data-testid="settings-search-input"]', value: mobile}
- wait_for: '[data-testid="mobile-settings"]'
- assert_text: {selector: '[data-testid="mobile-settings-status"]', contains: Disabled}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="terminal"]', equal: 0}
- fill: {selector: '[data-testid="mobile-settings-port"]', value: '0'}
- click: '[data-testid="mobile-settings-toggle"]'
- assert_text: {selector: '[data-testid="mobile-settings-status"]', contains: Running}
- click: '[data-testid="mobile-settings-open-sessions"]'
- assert_count: {selector: '[data-testid="mobile-settings-open-sessions"]:checked', equal: 1}
- click: '[data-testid="mobile-settings-pair"]'
- wait_for: '[data-testid="mobile-settings-code"]'
- mobile_service_probe: cookie-gateway
- assert_file_contains: {path: '${fixture.mobile_cookie_receipt}', contains: '"passed": true'}
- assert_file_contains: {path: '${fixture.mobile_cookie_receipt}', contains: '"real_pty": true'}
- assert_file_contains: {path: '${fixture.mobile_cookie_marker}', contains: QA_COOKIE_GATEWAY_PTY}
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="terminal"]', equal: 1}
- click: '[data-testid="tab-item"][data-tab-type="terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_no_runtime_errors: null
- click: '[data-testid="ribbon-settings"]'
- wait_for: '[data-testid="mobile-settings"]'
- click: '[data-testid="mobile-settings-toggle"]'
- assert_text: {selector: '[data-testid="mobile-settings-status"]', contains: Disabled}
- click: '[data-testid="tab-item"][data-tab-type="terminal"]'
- wait_for: '[data-testid="terminal-pane"]'
- assert_count: {selector: '[data-testid="tab-item"][data-tab-type="terminal"]', equal: 1}
- assert_no_runtime_errors: null
- screenshot: mobile-cookie-gateway-surviving-native-terminal.png
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: >-
      The actual Settings-started native listener serves its embedded phone bundle
      through the authenticated gateway. Pairing, REST and event WebSockets use
      same-origin cookies without replacing Bearer authorization or leaking either
      credential to cross-origin pairing. Malformed responses and expired login
      remain actionable without undefined navigation or blank session content.
    actions: [1, 2, 3, 4, 8, 9, 11, 13, 15]
    checkpoints:
    - {step: 6, expectation: Fresh native profile starts with the listener disabled.}
    - {step: 10, expectation: Settings starts the actual native listener on a disposable port.}
    - {step: 12, expectation: The real Settings open-sessions capability is enabled.}
    - {step: 15, expectation: 'Public phone oracle passes cookie/Bearer isolation, malformed HTML/JSON and expired-login recovery against embedded native assets without phone page errors.'}
    - {step: 16, expectation: Sanitized gateway receipt passed all assertions.}
    results: [6, 10, 12, 15, 16]
  - id: R2
    requirement: >-
      An authenticated phone opens exactly one actual desktop terminal and sends
      input through the gateway WebSocket to a real platform PTY. Independent exact
      marker bytes prove execution, and the native terminal pane remains usable
      after shutting down the mobile service without runtime errors.
    actions: [11, 15, 20, 23, 25, 27]
    checkpoints:
    - {step: 7, expectation: No terminal exists before the phone open request.}
    - {step: 15, expectation: 'The phone takes control, executes a real PTY command and checks exact independent host marker bytes before releasing control.'}
    - {step: 17, expectation: The receipt explicitly identifies real PTY evidence.}
    - {step: 18, expectation: The independent host marker is present with the expected nonce.}
    - {step: 19, expectation: Exactly one actual native terminal tab was created.}
    - {step: 21, expectation: The actual desktop terminal pane is visible after selecting its tab.}
    - {step: 22, expectation: No runtime errors occurred during gateway and PTY use.}
    - {step: 26, expectation: Settings reports the mobile service disabled after shutdown.}
    - {step: 28, expectation: The desktop terminal pane remains visible after service shutdown.}
    - {step: 29, expectation: The original terminal tab survives without duplication.}
    - {step: 30, expectation: No runtime errors occurred through shutdown and pane restoration.}
    results: [7, 15, 17, 18, 19, 21, 22, 26, 28, 29, 30]
  visual:
  - check: Phone and native terminal screenshots are diagnostic.
    method: not-applicable
    reason: Visible phone content, real desktop pane/tab state and independent marker bytes own acceptance.
  native:
  - check: Embedded phone assets, actual listener/Settings IPC, new desktop tab, real PTY and shutdown lifecycle.
    method: automated
    reason: 'TC-MOBILE-013 uses the matching isolated QA binary without assets override; external phone UI and independent host marker verify effects unavailable to browser stubs.'

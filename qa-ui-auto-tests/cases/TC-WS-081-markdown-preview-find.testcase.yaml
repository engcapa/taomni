id: TC-WS-081
title: Markdown preview finds rendered text and retains source and split focus
modes:
- browser
- native
description: Ctrl+F searches the rendered Markdown without switching modes; closing and reopening restores focus. Native checks the packaged WebView shortcut
  path, including a Split preview focused before the asynchronous source editor finishes mounting.
covers:
- F25.1
fixtures:
- reset_db
- workspace_explorer
tags:
- regression
- workspace-redesign
- markdown
timeout_sec: 180
steps:
- open: ${cfg.app.base_url}
- vault_first_run: qa-markdown-find
- click: '[data-testid="nav-mode-workspaces"]'
- click: '[data-testid="workspace-open-session-plus"]'
- click: '[data-testid="workspace-plus-add-folder"]'
- fill:
    selector: '[data-testid="workspace-fs-modal-input"]'
    value: ${fixture.platform_workspace_root}
- click: '[data-testid="workspace-fs-modal-confirm"]'
- dblclick: '[data-testid="code-workspace-tree-file"][data-path="README.md"]'
- wait_for: '[data-testid="code-workspace-editor"] .cm-content'
- click: button[title="Preview"]
- click: '[data-testid="code-workspace-markdown-preview"]'
- press: Mod+f
- wait_for: '[aria-label="Find in preview"]'
- fill:
    selector: '[aria-label="Find in preview"]'
    value: SEEDED
- assert_count:
    selector: '[data-testid="markdown-search-match"]'
    equal: 1
- assert_text_equals:
    selector: '[data-testid="markdown-search-count"]'
    equals: 1/1
- click: '[aria-label="Next match"]'
- click: '[aria-label="Previous match"]'
- screenshot: markdown-preview-found.png
- fill:
    selector: '[aria-label="Find in preview"]'
    value: no-such-preview-text
- assert_text_equals:
    selector: '[data-testid="markdown-search-count"]'
    equals: 0/0
- press: Escape
- assert_count:
    selector: '[data-testid="markdown-preview-search"]'
    equal: 0
- eval_readonly:
    expression: document.activeElement.dataset.testid === "code-workspace-markdown-preview"
    expect_truthy: true
- press: Mod+f
- wait_for: '[aria-label="Find in preview"]'
- press: Escape
- press: Mod+f
- wait_for: '[aria-label="Find in preview"]'
- click: '[aria-label="Close preview search"]'
- click: button[title="Edit"]
- assert_text:
    selector: '[data-testid="code-workspace-editor"] .cm-content'
    contains: '# platform workspace root'
- click: button[title="Split"]
- click: '[data-testid="code-workspace-markdown-preview"]'
- press: Mod+f
- wait_for: '[aria-label="Find in preview"]'
- fill:
    selector: '[aria-label="Find in preview"]'
    value: SEEDED
- assert_count:
    selector: '[data-testid="markdown-search-match"]'
    equal: 1
- screenshot: markdown-split-preview-found.png
- press: Escape
- click: '[data-testid="code-workspace-editor"] .cm-content'
- press: Mod+f
- wait_for: '[data-testid="code-workspace-editor-search"] input[placeholder="Find"]'
- assert_count:
    selector: '[data-testid="markdown-preview-search"]'
    equal: 0
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: R1
    requirement: Ctrl+F searches the rendered Markdown without switching modes; closing and reopening restores focus. Native checks the packaged WebView
      shortcut path.
    actions:
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 10
    - 11
    - 12
    - 14
    - 17
    - 18
    - 20
    - 22
    - 25
    - 27
    - 28
    - 30
    - 31
    - 33
    - 34
    - 35
    - 37
    - 40
    - 41
    - 42
    results:
    - 15
    - 16
    - 21
    - 23
    - 24
    - 32
    - 38
    - 44
    - 45
    checkpoints:
    - step: 15
      expectation: '{"assert_count": {"selector": "[data-testid=\"markdown-search-match\"]", "equal": 1}}'
    - step: 16
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"markdown-search-count\"]", "equals": "1/1"}}'
    - step: 21
      expectation: '{"assert_text_equals": {"selector": "[data-testid=\"markdown-search-count\"]", "equals": "0/0"}}'
    - step: 23
      expectation: '{"assert_count": {"selector": "[data-testid=\"markdown-preview-search\"]", "equal": 0}}'
    - step: 24
      expectation: '{"eval_readonly": {"expression": "document.activeElement.dataset.testid === \"code-workspace-markdown-preview\"", "expect_truthy": true}}'
    - step: 32
      expectation: '{"assert_text": {"selector": "[data-testid=\"code-workspace-editor\"] .cm-content", "contains": "# platform workspace root"}}'
    - step: 38
      expectation: '{"assert_count": {"selector": "[data-testid=\"markdown-search-match\"]", "equal": 1}}'
    - step: 44
      expectation: '{"assert_count": {"selector": "[data-testid=\"markdown-preview-search\"]", "equal": 0}}'
    - step: 45
      expectation: '{"assert_no_runtime_errors": null}'
  visual:
  - check: Review markdown-preview-found.png and markdown-split-preview-found.png for actual highlighted text and unobstructed controls.
    method: manual
    reason: Screenshot review supplements exact functional assertions.
  native:
  - check: Search real filesystem metadata and route the shortcut in the packaged WebView.
    method: automated
    reason: Native mode runs identical UI actions against isolated disposable disk fixtures.

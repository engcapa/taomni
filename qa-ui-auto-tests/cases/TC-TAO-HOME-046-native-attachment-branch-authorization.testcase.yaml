  native:
  - check: Actual OS document selection, native branch IPC and real provider wire bytes
    method: automated
    reason: Independent loopback service answers only when actual document bytes reach it; all mutations use public UI controls.
  visual:
  - check: Restored source transcript and attachment reply
    method: manual
    reason: Retained screenshot supports transcript review; native provider wire bytes and exact message counts establish behavior.

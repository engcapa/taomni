id: TC-RDPJ-02-joint-clipboard-no-echo
title: Taomni RDP client and server on one computer share the clipboard without an echo loop
description: 'V-19 (docs-feature/rdp-server-parity-design.md §4.2, AC-19, DEC-15). One

  QA build starts the RDP server and connects its own RDP client to it over

  127.0.0.1, so both ends share the same OS clipboard: every server

  announcement makes the client write the text back, which the server sees

  as a new host change. DEC-15 says the server recognises content it already

  holds (or wrote) and announces it only once.


  The host clipboard is cleared before the client connects. Once connected,

  the host copies a Unicode text with the platform''s own tools. The text must

  stay on the clipboard, the clipboard must then stay unchanged for six

  seconds (Windows sequence number, macOS change count, X11 XFixes owner

  changes), and the server log, read back from the Local servers window

  after the session ends, must show the text announced to the client at

  least once and at most twice. On Windows platform_choice picks Taomni over

  the runner''s system Remote Desktop.

  '

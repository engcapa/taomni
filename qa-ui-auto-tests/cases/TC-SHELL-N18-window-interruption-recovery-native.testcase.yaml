  visual:
  - check: Inspect the retained screenshot for readable controls, job state and clipping.
    method: manual
    reason: A screenshot needs a visual verdict in addition to functional assertions.
  native:
  - check: Real Tauri child destruction, parent draft recovery, native window counts and same-profile
      process restart
    method: automated
    reason: Uses real isolated QA IPC and windows; no browser service stubs.
  - check: Abrupt termination of the whole QA process and OS IME/always-on-top
    method: manual
    reason: Separate V-N18/N07/N10 boundary; this fault destroys only a child window.

id: TC-UIC-036-screenshot-keyboard-controls
title: Capture options and screenshot edit controls return focus in their owning windows
covers: [F27.1]
modes: [browser, native]
native_platforms: [Linux, Windows, macOS]
fixtures: [reset_db]
tags: [ui-contract, screenshot, keyboard]
ui_standard: [UI-MNU-02, UI-DLG-03, UI-DLG-04, UI-DLG-07, UI-FND-03a, UI-FND-13, UI-FND-14]
steps:
- open: ${cfg.app.base_url}
- press: {selector: '[data-testid="system-screenshot-delay-toggle"]', key: Enter}
- assert_focus_on: '[data-testid="system-screenshot-delay-menu"]'
- press: End
- press: Enter
- wait_for: '[data-testid="screenshot-favorites"]:modal'
- assert_focus_on: '[data-testid="screenshot-favorites-close"]'
- press: Escape
- assert_not_visible: '[data-testid="screenshot-favorites"]'
- assert_focus_on: '[data-testid="system-screenshot-delay-toggle"]'
- click: '[data-testid="ribbon-settings"]'
- click: '[data-testid="settings-group-toggle-general"]'
- press: {selector: '#ui-font-size-slider', key: End}
- click: '[data-testid="app-theme-select"]'
- click: '[data-testid="app-theme-dark"]'
- click: '[data-testid="system-screenshot"]'
- switch_window: {selector: '[data-testid="screenshot-fullscreen"]', timeout_sec: 45}
- assert_solid_text_contrast: {selector: '[data-testid="screenshot-fullscreen"]', minimum: 4.5}
- click: '[data-testid="screenshot-fullscreen"]'
- wait_for: '[data-testid="screenshot-selection"]'
- press: {selector: '[data-testid="screenshot-edit"]', key: Enter}
- wait_for: '[data-testid="screenshot-edit-panel"]:modal'
- assert_focus_on: '[data-testid="screenshot-edit-width"]'
- press: {selector: '[data-testid="screenshot-edit-close"]', key: Tab}
- assert_focus_on: '[data-testid="screenshot-edit-rotate"]'
- press: Escape
- assert_not_visible: '[data-testid="screenshot-edit-panel"]'
- assert_focus_on: '[data-testid="screenshot-edit"]'
- assert_visible: '[data-testid="screenshot-selection"]'
- assert_visible: 'html[data-app-theme="dark"] [data-testid="screenshot-selection"]'
- press: {selector: '[data-testid="screenshot-edit"]', key: Enter}
- assert_computed_style: {selector: '[data-testid="screenshot-edit-panel"]', property: font-size, equals: 18px}
- press: Escape
- assert_no_runtime_errors: null
verification:
  review: reviewed
  requirements:
  - id: keyboard-capture-options
    ui_standard: [UI-MNU-02, UI-DLG-03, UI-DLG-04, UI-DLG-07]
    requirement: The capture menu owns arrow navigation to Favorites, Escape closes the resulting modal, and the capture options control regains focus.
    actions: [2, 4, 5, 8]
    checkpoints:
    - {step: 3, expectation: Navigation starts in Capture options.}
    - {step: 6, expectation: Favorites opens in the modal top layer.}
    - {step: 7, expectation: Keyboard activation opens Favorites in the top layer at Close.}
    - {step: 9, expectation: Escape dismisses Favorites.}
    - {step: 10, expectation: Capture options regains focus.}
    results: [3, 6, 7, 9, 10]
  - id: screenshot-selection-and-edit
    ui_standard: [UI-DLG-03, UI-DLG-04, UI-DLG-07, UI-FND-03a, UI-FND-13, UI-FND-14]
    requirement: The capture window uses Dark and the 18px interface size from Settings. Full-screen capture has a readable action, the edit dialog traps Tab, and Escape returns to the same selection and toolbar control.
    actions: [11, 13, 15, 16, 19, 21, 24, 26, 31]
    checkpoints:
    - {step: 18, expectation: Rendered action text meets the 4.5 to 1 contrast threshold.}
    - {step: 22, expectation: Edit image belongs to the capture WebView's modal top layer.}
    - {step: 23, expectation: Edit image opens with focus on width.}
    - {step: 25, expectation: Tab wraps from the footer to the first edit action.}
    - {step: 27, expectation: Escape dismisses only the edit dialog.}
    - {step: 28, expectation: Edit action regains keyboard focus.}
    - {step: 29, expectation: The screenshot selection is still visible.}
    - {step: 30, expectation: The overlay renders with the selected Dark theme.}
    - {step: 32, expectation: The edit dialog uses the 18px interface size.}
    - {step: 34, expectation: Both surfaces remain free of runtime errors.}
    results: [18, 22, 23, 25, 27, 28, 29, 30, 32, 34]
  visual:
  - {check: Full-screen action contrast, method: automated, reason: Measures rendered text and its button background.}
  native:
  - {check: Actual overlay ownership, method: automated, reason: Opens and selects a separate capture WebView before exercising the edit controls.}

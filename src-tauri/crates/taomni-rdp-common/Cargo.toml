[package]
name = "taomni-rdp-common"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Shared RDP clipboard protocols, codecs and file transfer safety helpers"
license = "MIT"

[features]
default = []
bitmap = ["dep:ironrdp-pdu"]

[dependencies]
taomni-file-uri = { path = "../taomni-file-uri" }
ironrdp-pdu = { version = "0.9.0", features = ["std", "qoi", "qoiz"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "taomni-host-gates"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.10"
libc = "0.2"
taomni-plugin-api = { path = "../taomni-plugin-api" }
taomni-plugin-services = { path = "../taomni-plugin-services" }
taomni-plugin-sdk = { path = "../taomni-plugin-sdk" }
taomni-profile-locks = { path = "../taomni-profile-locks" }
sha2 = "0.10"

[dev-dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
hex = "0.4"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
taomni-plugin-mfa = { path = "../../plugins/mfa" }
taomni-mfa-api = { path = "../taomni-mfa-api" }
taomni-mfa-engine = { path = "../taomni-mfa-engine" }
taomni-rdp-client-api = { path = "../taomni-rdp-client-api" }
taomni-server-process = { path = "../taomni-server-process" }
taomni-sqlite-snapshot = { path = "../taomni-sqlite-snapshot" }
zeroize = "1"
taomni-plugin-stream = { path = "../taomni-plugin-stream" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

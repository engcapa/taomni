[package]
name = "taomni-host-gates"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
libc = "0.2"
taomni-plugin-api = { path = "../taomni-plugin-api" }
taomni-plugin-services = { path = "../taomni-plugin-services" }
taomni-plugin-sdk = { path = "../taomni-plugin-sdk" }
taomni-profile-locks = { path = "../taomni-profile-locks" }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

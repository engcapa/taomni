[package]
name = "taomni-mail-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Mail message parsing and data contracts independent of desktop runtime"

[dependencies]
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
hex = "0.4"
imap = { version = "2.4.1", features = ["tls"], default-features = false }
imap-proto = "=0.10.2"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "native-tls", "pool", "smtp-transport"] }
mail-parser = { version = "0.11.4", features = ["full_encoding"] }
md-5 = "0.11"
native-tls = "0.2"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
taomni-sqlite-snapshot = { path = "../taomni-sqlite-snapshot" }
tempfile = "3"
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "taomni-mail-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Mail message parsing and data contracts independent of desktop runtime"

[dependencies]
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
hex = "0.4"
imap = { version = "2.4.1", default-features = false }
lettre = { version = "0.11.22", default-features = false, features = ["builder"] }
mail-parser = { version = "0.11.4", features = ["full_encoding"] }
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

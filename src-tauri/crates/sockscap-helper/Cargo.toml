[package]
name = "sockscap-helper"
version = "0.3.0"
description = "Elevated Windows WinDivert capture helper for Taomni SocksCap"
authors = ["engcapa"]
license = "MIT"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "sockscap-helper"
path = "src/main.rs"
bench = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
  "handleapi",
  "libloaderapi",
  "minwindef",
  "processthreadsapi",
  "synchapi",
  "tlhelp32",
  "winbase",
  "winnt",
] }

[package]
name = "taomni-file-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Bounded local filename search using desktop system indexes"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
dirs = "6"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

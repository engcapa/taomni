[package]
name = "taomni-file-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Bounded local filename search using desktop system indexes"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
dirs = "6"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Storage_Search", "Win32_Storage_FileSystem"] }
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

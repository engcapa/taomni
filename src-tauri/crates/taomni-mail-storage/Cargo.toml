[package]
name = "taomni-mail-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Mail profile migrations, storage, and local message codecs shared by the core and signed host"

[features]
default = []
mime-parse = ["dep:mail-parser"]
mime-compose = ["dep:lettre"]

[dependencies]
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
hex = "0.4"
lettre = { version = "0.11.22", default-features = false, features = ["builder"], optional = true }
mail-parser = { version = "0.11.4", features = ["full_encoding"], optional = true }
native-tls = "0.2"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
taomni-mail-api = { path = "../taomni-mail-api" }
taomni-sqlite-snapshot = { path = "../taomni-sqlite-snapshot" }
tempfile = "3"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "taomni-rdp-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[[bin]]
name = "rdp-probe"
path = "src/main.rs"
bench = false

[features]
default = ["rdp-server-audio"]
rdp-server-audio = ["dep:cpal"]

[dependencies]
cpal = { version = "0.17", optional = true }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
ironrdp = { version = "0.17.0", features = ["core", "connector", "session", "graphics", "input", "cliprdr", "rdpdr", "rdpsnd", "svc", "dvc", "displaycontrol", "qoi", "qoiz"] }
ironrdp-bulk = "=0.1.1"
ironrdp-tokio = { version = "0.10.0", features = ["reqwest-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-cert = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pipewire = { version = "0.9", features = ["v0_3_49"] }

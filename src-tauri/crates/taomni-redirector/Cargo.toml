[package]
name = "taomni-redirector"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
bytes = "1"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
hex = "0.4"
libc = "0.2"
sha2 = "0.11"
tokio = { version = "1", features = ["net"] }

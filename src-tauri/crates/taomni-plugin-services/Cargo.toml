[package]
name = "taomni-plugin-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Core-owned plugin service policy and operation admission"
license = "MIT"

[dependencies]
taomni-plugin-api = { path = "../taomni-plugin-api" }
taomni-plugin-stream = { path = "../taomni-plugin-stream" }
taomni-profile-locks = { path = "../taomni-profile-locks" }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }

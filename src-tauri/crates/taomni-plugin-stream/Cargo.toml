[package]
name = "taomni-plugin-stream"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Bounded one-use loopback binary transport for official plugin hosts"

[dependencies]
taomni-plugin-api = { path = "../taomni-plugin-api" }
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
sha2 = "0.10"
rand = "0.9"
ring = "0.17"
subtle = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "io-util", "sync"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media"] }

[[bin]]
name = "plugin-stream-gate-receiver"
path = "tests/support/receiver.rs"
test = false
bench = false

[package]
name = "taomni-rdp-client-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Connection request types for the Taomni RDP client host"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taomni-plugin-stream = { path = "../taomni-plugin-stream" }
tokio = { version = "1", features = ["io-util", "net"] }
tracing = "0.1"
zeroize = { version = "1", features = ["serde"] }

[package]
name = "taomni-local-voice-api"
version = "0.1.0"
description = "Private Local Voice host protocol"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taomni-plugin-stream = { path = "../taomni-plugin-stream" }
tokio = { version = "1", features = ["io-util"] }

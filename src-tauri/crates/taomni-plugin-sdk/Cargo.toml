[package]
name = "taomni-plugin-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
taomni-plugin-api = { path = "../taomni-plugin-api" }
taomni-plugin-stream = { path = "../taomni-plugin-stream" }
tokio = { version = "1", features = ["rt", "time", "net"] }
taomni-profile-locks = { path = "../taomni-profile-locks" }
taomni-sqlite-snapshot = { path = "../taomni-sqlite-snapshot" }
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks"] }
sha2 = "0.10"
rand = "0.9"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
zeroize = "1"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "taomni-plugin-rdp-server"
version = "0.1.1"
description = "Official RDP Server host"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = "1"
serde_json = "1"
taomni-capture = { path = "../../crates/taomni-capture" }
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
taomni-rdp-server-engine = { path = "../../crates/taomni-rdp-server-engine", features = ["rdp-server-audio"] }
taomni-server-process = { path = "../../crates/taomni-server-process" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

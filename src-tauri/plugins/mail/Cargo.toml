[package]
name = "taomni-plugin-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Official Mail host"

[dependencies]
taomni-mail-engine = { path = "../../crates/taomni-mail-engine" }
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

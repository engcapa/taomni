[package]
name = "taomni-plugin-mail"
version = "0.1.33"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Official Mail host"

[dependencies]
taomni-mail-api = { path = "../../crates/taomni-mail-api" }
taomni-mail-engine = { path = "../../crates/taomni-mail-engine", features = ["routed-smtp"] }
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
taomni-plugin-stream = { path = "../../crates/taomni-plugin-stream" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
taomni-sqlite-snapshot = { path = "../../crates/taomni-sqlite-snapshot" }

[package]
name = "taomni-plugin-rdp-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Official Taomni RDP client host"

[dependencies]
serde = "1"
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
taomni-rdp-client-api = { path = "../../crates/taomni-rdp-client-api" }
taomni-rdp-client-engine = { path = "../../crates/taomni-rdp-client-engine" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

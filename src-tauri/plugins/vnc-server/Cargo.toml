[package]
name = "taomni-plugin-vnc-server"
version = "0.1.0"
description = "Supervised system VNC server for Taomni"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
serde = "1"
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
taomni-server-process = { path = "../../crates/taomni-server-process" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
which = "8"

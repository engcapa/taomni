[package]
name = "taomni-sockscap-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[target.'cfg(windows)'.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
winapi = { version = "0.3", features = [
    "handleapi", "libloaderapi", "minwindef", "processthreadsapi", "synchapi", "tlhelp32", "winbase", "winnt",
] }

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1"
bytes = "1"
libc = "0.2"
taomni-redirector = { path = "../../../crates/taomni-redirector" }
prost = "0.14"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }

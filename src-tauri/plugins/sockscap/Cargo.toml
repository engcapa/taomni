[package]
name = "taomni-plugin-sockscap"
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Official SocksCap host"

[dependencies]
taomni-module-settings = { path = "../../crates/taomni-module-settings" }
taomni-plugin-stream = { path = "../../crates/taomni-plugin-stream" }
tokio = { version = "1", features = ["rt", "time", "net"] }
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
taomni-sockscap-api = { path = "../../crates/taomni-sockscap-api" }

[dev-dependencies]
tempfile = "3"

[package]
name = "taomni-sockscap-xray"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
taomni-sockscap-api = { path = "../../../crates/taomni-sockscap-api" }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1"

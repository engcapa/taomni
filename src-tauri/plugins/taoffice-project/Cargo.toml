[package]
name = "taomni-plugin-taoffice-project"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
mpxj-rs = "=0.1.1"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
uuid = { version = "1", features = ["serde"] }

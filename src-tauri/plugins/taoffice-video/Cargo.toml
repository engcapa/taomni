[package]
name = "taomni-plugin-taoffice-video"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[dependencies]
base64 = "0.22"
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
uuid = { version = "1", features = ["serde"] }

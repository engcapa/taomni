[package]
name = "taomni-plugin-taoffice-excel"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[dependencies]
base64 = "0.22"
calamine = { version = "=0.38.0", features = ["dates"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
uuid = { version = "1", features = ["serde"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }

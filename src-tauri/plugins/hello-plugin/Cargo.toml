[package]
name = "taomni-hello-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "Cross-platform hello plugin fixture for Taomni host gates"

[lib]
name = "taomni_hello_plugin"
path = "src/lib.rs"

[[bin]]
name = "taomni-hello-plugin"
path = "src/main.rs"

[dependencies]
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks"] }

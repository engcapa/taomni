[package]
name = "taomni-plugin-screenshot"
version = "0.1.1"
description = "Official screenshot OCR and recording host"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false }
serde = "1"
serde_json = "1"
taomni-plugin-api = { path = "../../crates/taomni-plugin-api" }
taomni-plugin-sdk = { path = "../../crates/taomni-plugin-sdk" }
taomni-screenshot-api = { path = "../../crates/taomni-screenshot-api" }
taomni-screenshot-ocr = { path = "../../crates/taomni-screenshot-ocr" }
taomni-screenshot-recording = { path = "../../crates/taomni-screenshot-recording" }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }

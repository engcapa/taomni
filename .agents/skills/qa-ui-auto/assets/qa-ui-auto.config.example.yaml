# qa-ui-auto configuration
# Copy this file to `qa-ui-auto-tests/qa-ui-auto.config.yaml` and fill in.
# Secrets MUST come from environment variables: ${env.VAR_NAME}.
# Both ${cfg.x.y} and the legacy ${cfg:x.y} forms are accepted by the runner.

app:
  base_url: http://localhost:5000   # Vite dev server in browser mode
  mode: browser                     # daily renderer checks; select native for real OS/IPC boundaries
  # Build first: python .agents/skills/qa-ui-auto/scripts/native_build.py
  # native_binary: ./src-tauri/target/qa-ui-auto/debug/taomni.exe  # Windows; omit .exe on Linux

worker:
  parallel: 2                       # max browser worker processes (browser mode only)

webdriver:
  host: 127.0.0.1
  port: 4444
  native_port: 4445                # both ports must be free; external drivers are not reused
  tauri_driver: tauri-driver        # cargo install tauri-driver --locked
  # native_driver: C:/path/to/msedgedriver.exe  # optional; otherwise PATH
  startup_timeout: 20

ssh:
  host: 127.0.0.1
  port: 2222
  user: testuser
  password: ${env.QA_SSH_PASSWORD}
  # private_key_path: ~/.ssh/id_ed25519
  # private_key_passphrase: ${env.QA_SSH_KEY_PASSPHRASE}

sftp:
  host: 127.0.0.1
  port: 2222
  user: testuser
  password: ${env.QA_SSH_PASSWORD}
  remote_test_dir: /config/qa-ui-auto

database:
  host: 127.0.0.1
  port: 3306
  user: test
  password: ${env.TAOMNI_TEST_MYSQL_PASSWORD}
  database: test

mysql:
  host: 127.0.0.1
  port: 3306
  user: test
  password: ${env.TAOMNI_TEST_MYSQL_PASSWORD}
  database: test

# Note: the qa-ui-auto runner does not start any docker fixtures. If the
# host above is unreachable, the TCP probe fails and SSH/SFTP cases skip.
# Fix the network rather than letting the runner fall back.

report:
  dir: qa-ui-auto-report
  keep_runs: 5

# Optional local Docker services. These are started once by qa-ui-auto before
# browser workers/native cases and removed after the run. Credentials must come
# from environment variables; no service is started when its flag is false.
fixtures:
  start_local_sshd: false
  sshd_image: linuxserver/openssh-server:latest
  sshd_port: 2222
  sshd_user: testuser
  sshd_password: ${env.QA_SSH_PASSWORD}
  start_local_mysql: false
  mysql_image: mysql:8.4
  mysql_port: 3306
  mysql_user: test
  mysql_password: ${env.TAOMNI_TEST_MYSQL_PASSWORD}
  mysql_root_password: ${env.TAOMNI_TEST_MYSQL_ROOT_PASSWORD}
  mysql_database: test
  startup_timeout_sec: 120
